<meta charset="utf-8">
<title>Robo Jump!</title>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #05060f; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  canvas {
    width: min(100vw, calc(100vh * 960 / 520));
    height: auto; display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, SPRING = 19, MAXFALL = 15;

// Map key:  # metal ground   = tech blocks   o coin   E alien   ^ zappy spikes
//           B jump pad   C beacon checkpoint   P start
// A boss arena with the rocket is added to the end of every level.
const LEVELS = [
  {
    name: 'Moon Base', sky: ['#0b1026', '#2b3a7a'], grass: '#7df9ff',
    dirt: '#8e9bb5', hill: '#2a3360', hill2: '#3a4680', planet: '#ff8a65',
    boss: { type: 'blob', name: 'King Gloop', hp: 3 },
    map: [
      "",
      "",
      "",
      "",
      "                                      o o o",
      "                                     =======",
      "                     o o o",
      "             o o    =======",
      "            =====                 =====          =====",
      "",
      "   P     o o o      E             o o o     E          o o   C      o o o       ",
      "###########################   ############################   #########################",
      "###########################   ############################   #########################",
    ]
  },
  {
    name: 'Crystal Planet', sky: ['#1a0b2e', '#4a1f6b'], grass: '#ff7bf2',
    dirt: '#6a4f8a', hill: '#2e1a4a', hill2: '#43266a', planet: '#64ffda',
    boss: { type: 'crab', name: 'Captain Pinch', hp: 4 },
    map: [
      "",
      "",
      "",
      "                    o o o                              o o o",
      "                   =======                            =======",
      "",
      "",
      "            o o o                         o o o",
      "           =======                       =======",
      "",
      "   P       o o     B          E    ^^^     B        E    ^^   C     o o o    o o  ^^   E    ",
      "################################################################################################",
      "################################################################################################",
    ]
  },
  {
    name: 'Star Station', sky: ['#02040f', '#123a5a'], grass: '#7dff9a',
    dirt: '#5a7a90', hill: '#16304a', hill2: '#1f4566', planet: '#ffd54f',
    boss: { type: 'ufo', name: 'Mega Saucer', hp: 4 },
    map: [
      "",
      "",
      "",
      "                                              o o o",
      "                                             =======          o o o",
      "                       o o o                               =======",
      "                      =======        E",
      "            o o o                 =======",
      "           =======                                                          o o o",
      "",
      "   P              E                       o o o    E         C                o o o      ",
      "##########   ##########  ######   ##########  ######   ###########  #########  ############",
      "##########   ##########  ######   ##########  ######   ###########  #########  ############",
    ]
  }
];

// ---------- Sound ----------
let actx = null;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  jump:   () => note(400, 0, 0.15, 'sine', 0.15, 900),
  hover:  () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  stomp:  () => note(400, 0, 0.15, 'triangle', 0.2, 100),
  spring: () => note(200, 0, 0.3, 'sine', 0.2, 900),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  check:  () => { note(660, 0, 0.1); note(880, 0.1, 0.2); },
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  land:   () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  win:    () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
};

// ---------- Music ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const CHORDS = [[69, 72, 76], [65, 69, 72], [60, 64, 67], [67, 71, 74]];
const ARP = CHORDS.flatMap(([a, b, c]) => [a, b, c, a + 12, c, b, a, b]);
const MELODY = [
  81,0,0,0, 79,0,76,0, 77,0,0,0, 76,0,72,0, 76,0,0,0, 74,0,72,0, 74,0,0,0, 0,0,0,0,
  81,0,0,0, 84,0,83,0, 81,0,0,0, 77,0,76,0, 79,0,0,0, 76,0,72,0, 71,0,0,0, 0,0,0,0,
];
const BASS = CHORDS.flatMap(([r]) => [r - 24, 0, 0, 0, r - 24, 0, r - 12, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const fight = bossState === 'fight';
  const stepDur = 60 / (fight ? 165 : 130) / 2, shift = fight ? -3 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length], a = ARP[step % ARP.length];
    note(midi(a + shift), t, stepDur * 0.8, 'triangle', 0.035);
    if (m) note(midi(m + shift), t, stepDur * 3, 'sine', 0.07);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.09);
    nextNoteTime += stepDur; step++;
  }
}

// ---------- Input ----------
const keys = { left: false, right: false, jump: false };
let jumpPressed = false;
addEventListener('keydown', e => {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = true;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = true;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true;
    e.preventDefault();
  }
  if (k === 'Enter') jumpPressed = true;
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if ((k === 'r' || k === 'R') && state === 'play') loadLevel(levelIndex);
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
});

// ---------- World ----------
let state = 'title', levelIndex = 0, totalCoins = 0, levelCoins = 0;
let map, rows, cols, coins, enemies, springs, spikes, flag, checkpoint, player, respawn;
let camX = 0, particles = [], timer = 0, frame = 0, helpTimer = 0;
const ARENA = 24;
let arenaStart = 0, bossState = 'none', boss = null, shots = [], bossBanner = 0, bannerText = '', shake = 0;

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W';
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  return isSolidCh(map[ty][tx]);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = y; r < rows; r++) if (isSolidCh(map[r][x])) return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}

function loadLevel(i) {
  const L = LEVELS[i];
  rows = L.map.length;
  cols = Math.max(...L.map.map(r => r.length)) + 2;
  map = L.map.map(r => r.padEnd(cols, ' ').split(''));
  // Boss arena: flat floor at the end of the level, rocket lands there after the boss is beaten
  const groundEnd = map[rows - 2].lastIndexOf('#') + 1;
  arenaStart = cols;
  cols += ARENA;
  map = map.map(r => r.concat(Array(ARENA).fill(' ')));
  for (let x = groundEnd; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; bossBanner = 0; shake = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = [];
  let start = { x: 3, y: 10 }, c = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E') enemies.push({ x: x * T + 6, y: y * T + 12, w: 28, h: 28, vx: -1.2, vy: 0, dead: 0 });
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') c = { x, y };
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 5, y: g * T - 20, w: 30, h: 20, squish: 0 }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 6, y: pg * T - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, hover: 70, hovering: false };
  respawn = { x: player.x, y: player.y };
  flag = { x: (cols - 4) * T + T / 2, y: (rows - 2) * T, drop: 600 };
  checkpoint = null;
  if (c) { const g = groundRow(c.x, c.y); checkpoint = { x: c.x * T + T / 2, y: g * T, reached: false }; }
  levelCoins = 0;
  camX = 0;
  state = 'play';
  helpTimer = levelIndex === 0 ? 400 : 0;
}

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

function startBoss() {
  const B = LEVELS[levelIndex].boss;
  bossState = 'fight'; shots = []; helpTimer = 0;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // laser wall closes behind you
  respawn = { x: (arenaStart + 2) * T, y: (rows - 2) * T - player.h };
  const [w, h] = { blob: [90, 80], crab: [110, 64], ufo: [130, 56] }[B.type];
  boss = { type: B.type, name: B.name, hp: B.hp, maxHp: B.hp, w, h, x: (arenaStart + 17) * T,
           y: B.type === 'ufo' ? -80 : -120, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, pause: 0,
           mode: 'up', modeT: 0, dying: 0 };
  sfx.boss();
}

function bossShoot(b, n) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.35;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9 });
  }
}

function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (bossState === 'defeated' && flag.drop > 0) {
    flag.drop = Math.max(0, flag.drop - 8);
    if (flag.drop === 0) { sfx.land(); shake = 10; burst(flag.x, flag.y, ['#cfd8dc', '#fff'], 20, 4); }
  }
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#7df9ff'], 50, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 150; bannerText = 'You beat ' + b.name + '!';
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = b.maxHp - b.hp;   // bosses get faster as they get hurt
  const left = (arenaStart + 1) * T, right = cols * T;
  if (b.type === 'ufo') {
    b.modeT++;
    const lowY = (rows - 2) * T - b.h - 50;
    if (b.mode === 'fly') {
      b.x += b.dir * (2.5 + angry * 0.5);
      if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
      b.y = 100 + Math.sin(b.t * 0.05) * 15;
      if (b.t % Math.max(40, 70 - angry * 10) === 0) shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true });
      if (b.modeT > 280) { b.mode = 'down'; b.modeT = 0; }
    } else if (b.mode === 'down') {
      b.y += 3;
      if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; }
    } else if (b.mode === 'low') {
      b.x += Math.sign(p.x - b.x - b.w / 2 + p.w / 2) * 0.8;
      b.y = lowY + Math.sin(b.t * 0.1) * 4;
      if (b.modeT > 160) { b.mode = 'up'; b.modeT = 0; }
    } else {
      b.y -= 3;
      if (b.y <= 100) { b.mode = 'fly'; b.modeT = 0; }
    }
  } else {
    const speed = (b.type === 'blob' ? 1.6 : 2.2) + angry * 0.4;
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    if (b.pause > 0) {
      b.pause--; b.vx = 0;
      if (b.pause === 20) { bossShoot(b, 3); sfx.hover(); }
    } else b.vx = b.dir * speed;
    if (moveX(b)) b.dir = -b.dir;
    moveY(b);
    if (b.type === 'blob' && b.onGround && b.t % 110 === 0) { b.vy = -11; }
    if (b.type === 'blob' && b.onGround && b.vy === 0 && b.landed === false) { shake = 6; sfx.land(); }
    b.landed = b.onGround;
    if (b.type === 'crab' && b.t % Math.max(90, 140 - angry * 15) === 0) b.pause = 40;
  }
  // Bop the boss on the head!
  if (overlap(p, b) && b.hurt === 0 && state === 'play') {
    if (p.vy > 0 && p.y + p.h - p.vy <= b.y + 20) {
      b.hp--; b.hurt = 70; p.vy = -12; p.jumping = false; shake = 12;
      sfx.bossHit();
      burst(p.x + p.w / 2, b.y, ['#ffea00', '#fff', '#7df9ff'], 16, 5);
      if (b.type === 'ufo') { b.mode = 'up'; b.modeT = 0; }
      if (b.hp <= 0) { b.dying = 1; shots = []; sfx.bossDie(); }
    } else hurt();
  }
}

function updateShots() {
  const p = player;
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (s.bomb) s.vy = Math.min(s.vy + 0.25, 10);
    if (tileSolid(Math.floor(s.x / T), Math.floor((s.y + s.r) / T)) || s.y > H + 40) {
      s.gone = true; burst(s.x, s.y, ['#ff9100', '#ffea00'], 8, 3);
    }
    const dx = s.x - (p.x + p.w / 2), dy = s.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < (s.r + 13) ** 2 && state === 'play' && p.inv === 0) { s.gone = true; hurt(); }
  }
  shots = shots.filter(s => !s.gone);
}

function hurt() {
  if (player.inv > 0 || state !== 'play') return;
  state = 'dying'; timer = 0;
  sfx.ouch();
  burst(player.x + 14, player.y + 18, ['#ffffff', '#7df9ff', '#2979ff'], 20, 5);
}

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + 14, p.y + p.h, ['#7df9ff', '#fff'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold jump while falling to hover with jet boots!
  p.hovering = !p.onGround && keys.jump && p.vy > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = Math.min(p.vy, 0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: p.y + p.h + 4, vx: (Math.random() - .5),
                                    vy: 2 + Math.random() * 2, life: 14, color: frame % 4 ? '#7df9ff' : '#ffffff', size: 4 });
    if (frame % 4 === 0) sfx.hover();
  }

  const wasInAir = !p.onGround;
  moveX(p); moveY(p);
  if (p.onGround && wasInAir) p.squash = 1.3;
  if (p.onGround) p.hover = 70;
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;

  // Coins
  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 28 * 28) {
      c.got = true; levelCoins++; totalCoins++;
      sfx.coin();
      burst(c.x, c.y, ['#ffd740', '#fff59d'], 8, 3);
    }
  }

  // Springs
  for (const s of springs) {
    if (s.squish > 0) s.squish--;
    if (p.vy > 0 && overlap(p, s) && p.y + p.h - p.vy <= s.y + 10) {
      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10;
      sfx.spring();
    }
  }

  // Spikes
  for (const s of spikes) if (overlap(p, { x: s.x + 6, y: s.y + 22, w: 28, h: 18 })) hurt();

  // Monsters
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    const old = e.vx;
    if (moveX(e)) e.vx = -old;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > rows * T + 200) e.gone = true;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 12) {
        e.dead = 1; p.vy = -10; p.jumping = false;
        sfx.stomp();
        burst(e.x + 14, e.y + 20, ['#76ff03', '#ccff90', '#fff'], 12, 3);
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.gone && e.dead < 30);

  // Checkpoint
  if (checkpoint && !checkpoint.reached && overlap(p, { x: checkpoint.x - 10, y: checkpoint.y - 80, w: 24, h: 80 })) {
    checkpoint.reached = true;
    respawn = { x: checkpoint.x - 14, y: checkpoint.y - p.h };
    sfx.check();
    burst(checkpoint.x, checkpoint.y - 70, ['#ffd740', '#fff'], 14, 3);
  }

  // Finish flag
  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();

  if (bossState === 'defeated' && flag.drop === 0 && overlap(p, { x: flag.x - 28, y: flag.y - 130, w: 56, h: 130 })) {
    state = 'levelDone'; timer = 0;
    sfx.win(); confetti();
  }

  if (p.y > rows * T + 60) hurt();
  if (helpTimer > 0) helpTimer--;
}

function update() {
  frame++;
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);

  if (state === 'title' || state === 'win') {
    if (jumpPressed) {
      jumpPressed = false;
      if (state === 'win') totalCoins = 0;
      levelIndex = 0; loadLevel(0);
    }
    if (state === 'win' && frame % 90 === 0) confetti();
    return;
  }
  if (state === 'dying') {
    timer++;
    if (timer > 50) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90 });
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer > 60 && jumpPressed || timer > 240) {
      levelIndex++;
      if (levelIndex >= LEVELS.length) { state = 'win'; confetti(); }
      else loadLevel(levelIndex);
    }
    jumpPressed = false;
  } else if (state === 'play') updatePlay();

  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}

function drawBackground(L) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // twinkly stars
  for (let i = 0; i < 90; i++) {
    const sx = ((i * 137.5 - camX * (0.03 + (i % 3) * 0.03)) % W + W) % W;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(frame * 0.04 + i * 1.7)})`;
    const sz = i % 7 === 0 ? 3 : 2;
    ctx.fillRect(sx, (i * 71) % 400, sz, sz);
  }

  // shooting star
  const ss = frame % 420;
  if (ss < 40) {
    const sx = 900 - ss * 18, sy = 40 + ss * 5;
    const tail = ctx.createLinearGradient(sx, sy, sx + 90, sy - 25);
    tail.addColorStop(0, '#fff'); tail.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = tail; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 90, sy - 25); ctx.stroke();
  }

  // big ringed planet
  const px = 780 - camX * 0.04, py = 120;
  ctx.fillStyle = L.planet;
  ctx.beginPath(); ctx.arc(px, py, 55, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(px + 15, py + 10, 50, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(px, py, 95, 20, -0.3, 0, 7); ctx.stroke();
  // little moon
  ctx.fillStyle = '#cfd8dc';
  ctx.beginPath(); ctx.arc(220 - camX * 0.07, 80, 18, 0, 7); ctx.fill();
  ctx.fillStyle = '#b0bec5';
  ctx.beginPath(); ctx.arc(214 - camX * 0.07, 76, 5, 0, 7); ctx.arc(226 - camX * 0.07, 88, 4, 0, 7); ctx.fill();

  // alien mountains
  for (const [color, speed, height, size] of [[L.hill, 0.3, 340, 90], [L.hill2, 0.5, 400, 60]]) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) {
      const wx = x + camX * speed, t = (wx / size) % 2;
      ctx.lineTo(x, height - (t < 1 ? t : 2 - t) * 70 - Math.sin(wx / 37) * 10);
    }
    ctx.lineTo(W, H); ctx.fill();
  }
}

function drawTiles(L) {
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(cols - 1, Math.ceil((camX + W) / T));
  for (let y = 0; y < rows; y++) for (let x = c0; x <= c1; x++) {
    const ch = map[y][x], px = x * T, py = y * T;
    if (ch === 'W') {                                  // laser wall
      ctx.fillStyle = `rgba(255,23,68,${0.4 + 0.3 * Math.sin(frame * 0.3 + y)})`;
      ctx.fillRect(px + 12, py, 16, T);
      ctx.fillStyle = '#ffcdd2'; ctx.fillRect(px + 18, py, 4, T);
    } else if (ch === '#') {
      ctx.fillStyle = L.dirt; ctx.fillRect(px, py, T + 1, T + 1);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(px, py, 2, T); ctx.fillRect(px, py + T - 2, T, 2);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(px + 6, py + 8, 3, 3); ctx.fillRect(px + 31, py + 8, 3, 3);
      ctx.fillRect(px + 6, py + 30, 3, 3); ctx.fillRect(px + 31, py + 30, 3, 3);
      if (y === 0 || map[y - 1][x] !== '#') {
        ctx.fillStyle = '#2a2f45'; ctx.fillRect(px, py, T + 1, 8);
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frame * 0.05 + x * 0.5);
        ctx.fillStyle = L.grass; ctx.fillRect(px, py + 2, T + 1, 4);
        ctx.globalAlpha = 1;
      }
    } else if (ch === '=') {
      roundRect(px + 1, py + 1, T - 2, T - 2, 6, '#1e2a4a');
      ctx.strokeStyle = L.grass; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(px + 2, py + 2, T - 4, T - 4, 6); ctx.stroke();
      ctx.fillStyle = (frame / 20 + x) % 4 < 2 ? L.grass : '#ffffff';
      ctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, 5, 0, 7); ctx.fill();
    }
  }
}

function drawCoin(x, y, t) {
  const w = Math.abs(Math.cos(t)) * 12 + 2;
  ctx.fillStyle = 'rgba(255,215,64,.25)';
  ctx.beginPath(); ctx.arc(x, y, 20, 0, 7); ctx.fill();
  ctx.fillStyle = '#ffb300';
  ctx.beginPath(); ctx.ellipse(x, y, w, 14, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff3b0';
  ctx.beginPath(); ctx.ellipse(x, y, w * 0.6, 9, 0, 0, 7); ctx.fill();
}

function drawEnemy(e) {
  const squash = e.dead ? 0.3 : 1 + Math.sin(frame * 0.2 + e.x) * 0.06;
  const h = e.h * squash, y = e.y + e.h - h;
  roundRect(e.x, y, e.w, h, [14, 14, 6, 6], '#64dd17');
  if (e.dead) return;
  const d = e.vx > 0 ? 3 : -3;
  ctx.strokeStyle = '#33691e'; ctx.lineWidth = 2;     // wiggly antenna
  const ax = e.x + 14 + Math.sin(frame * 0.15 + e.x) * 4;
  ctx.beginPath(); ctx.moveTo(e.x + 14, y + 2); ctx.lineTo(ax, y - 10); ctx.stroke();
  ctx.fillStyle = '#ff4081';
  ctx.beginPath(); ctx.arc(ax, y - 11, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';                              // one big eye
  ctx.beginPath(); ctx.arc(e.x + 14 + d, y + 12, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(e.x + 15 + d * 1.3, y + 13, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#33691e';                           // feet
  const step = Math.sin(frame * 0.3) * 3;
  ctx.fillRect(e.x + 3 + step, e.y + e.h - 4, 8, 4);
  ctx.fillRect(e.x + 17 - step, e.y + e.h - 4, 8, 4);
}

function drawPlayer(p) {
  if (state === 'dying' || state === 'levelDone') return;
  if (p.inv > 0 && Math.floor(frame / 4) % 2) return;
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = '#7df9ff';
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = '#3d5afe';                           // legs
  ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, '#f5f7ff');   // body
  ctx.fillStyle = '#2979ff';                           // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, '#2979ff'); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, '#2979ff');
  roundRect(x - 2, y, w + 4, h * 0.55, 12, '#ffffff');  // big round head
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : 5;
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
}

function drawRocket(f) {
  if (bossState !== 'defeated') return;                 // rocket only comes after the boss is beaten
  const lift = state === 'levelDone' ? timer * timer * 0.04 : 0;
  const x = f.x, y = f.y - lift - f.drop;
  if (lift > 0 || f.drop > 0 || frame % 6 < 3) {        // engine flame
    const fl = lift > 0 || f.drop > 0 ? 30 + Math.random() * 20 : 6;
    ctx.fillStyle = '#ffab40';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 6); ctx.lineTo(x, y + fl); ctx.lineTo(x + 12, y - 6); ctx.fill();
  }
  ctx.fillStyle = '#ff5252';                           // fins
  ctx.beginPath(); ctx.moveTo(x - 18, y - 40); ctx.lineTo(x - 32, y); ctx.lineTo(x - 18, y - 8); ctx.fill();
  ctx.beginPath(); ctx.moveTo(x + 18, y - 40); ctx.lineTo(x + 32, y); ctx.lineTo(x + 18, y - 8); ctx.fill();
  roundRect(x - 20, y - 100, 40, 94, 18, '#eceff1');   // body
  ctx.fillStyle = '#ff5252';                           // nose cone
  ctx.beginPath(); ctx.moveTo(x - 19, y - 88); ctx.quadraticCurveTo(x, y - 140, x + 19, y - 88); ctx.fill();
  ctx.fillStyle = '#546e7a';
  ctx.beginPath(); ctx.arc(x, y - 62, 12, 0, 7); ctx.fill();
  ctx.fillStyle = '#40c4ff';                           // window
  ctx.beginPath(); ctx.arc(x, y - 62, 8, 0, 7); ctx.fill();
  if (state === 'levelDone') {                         // our robot inside the window
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y - 62, 7, 0, 7); ctx.fill();
    ctx.fillStyle = '#111827'; ctx.beginPath(); ctx.arc(x, y - 62, 5, 0, 7); ctx.fill();
  }
}

function drawBeacon(c) {
  ctx.fillStyle = '#78909c'; ctx.fillRect(c.x - 3, c.y - 70, 6, 70);
  ctx.fillRect(c.x - 12, c.y - 6, 24, 6);
  if (c.reached) {
    ctx.fillStyle = `rgba(105,240,174,${0.25 + 0.15 * Math.sin(frame * 0.15)})`;
    ctx.beginPath(); ctx.arc(c.x, c.y - 76, 22, 0, 7); ctx.fill();
  }
  ctx.fillStyle = c.reached ? '#69f0ae' : '#607d8b';
  ctx.beginPath(); ctx.arc(c.x, c.y - 76, 10, 0, 7); ctx.fill();
}

function drawSpring(s) {
  const sq = s.squish > 0 ? 6 : 0;
  roundRect(s.x - 2, s.y + 8, s.w + 4, s.h - 8, 4, '#37474f');
  ctx.fillStyle = s.squish > 0 ? '#ffffff' : '#7df9ff';
  ctx.fillRect(s.x, s.y + 4 + sq, s.w, 5);
  ctx.strokeStyle = `rgba(125,249,255,${0.5 + 0.5 * Math.sin(frame * 0.2)})`; ctx.lineWidth = 3;
  for (let i = 0; i < 2; i++) {                        // up arrows
    const ay = s.y - 8 - i * 10 - (frame % 30) / 3;
    ctx.beginPath(); ctx.moveTo(s.x + 7, ay + 6); ctx.lineTo(s.x + 15, ay); ctx.lineTo(s.x + 23, ay + 6); ctx.stroke();
  }
}

function drawSpikes(s) {
  ctx.fillStyle = frame % 20 < 10 ? '#ff1744' : '#ff8a80'; ctx.strokeStyle = '#7f0000'; ctx.lineWidth = 2;
  for (let i = 0; i < 3; i++) {
    ctx.beginPath();
    ctx.moveTo(s.x + 2 + i * 12, s.y + T);
    ctx.lineTo(s.x + 8 + i * 12, s.y + 18);
    ctx.lineTo(s.x + 14 + i * 12, s.y + T);
    ctx.closePath(); ctx.fill(); ctx.stroke();
  }
}

function drawBoss(b) {
  if (b.hurt > 0 && Math.floor(frame / 4) % 2) return;
  ctx.save();
  if (b.dying) ctx.translate((Math.random() - .5) * 8, (Math.random() - .5) * 8);
  const look = Math.sign(player.x - b.x - b.w / 2) * 4;
  const cx = b.x + b.w / 2;
  if (b.type === 'blob') {
    const wob = Math.sin(frame * 0.15) * 4;
    roundRect(b.x - wob / 2, b.y + wob, b.w + wob, b.h - wob, [45, 45, 14, 14], '#7c4dff');
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.beginPath(); ctx.ellipse(b.x + 25, b.y + 22 + wob, 12, 7, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#ffd740';                         // crown
    ctx.beginPath(); ctx.moveTo(cx - 25, b.y + 6 + wob);
    for (let i = 0; i <= 4; i++) ctx.lineTo(cx - 25 + i * 12.5, b.y + wob - (i % 2 ? 4 : 22));
    ctx.lineTo(cx + 25, b.y + 6 + wob); ctx.fill();
    for (const ex of [cx - 18, cx + 18]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, b.y + 32 + wob, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + look, b.y + 34 + wob, 5, 0, 7); ctx.fill();
    }
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx - 30, b.y + 16 + wob); ctx.lineTo(cx - 8, b.y + 24 + wob);
    ctx.moveTo(cx + 30, b.y + 16 + wob); ctx.lineTo(cx + 8, b.y + 24 + wob); ctx.stroke();
    ctx.fillStyle = '#311b92';
    ctx.beginPath(); ctx.ellipse(cx, b.y + 58 + wob, 18, 8, 0, 0, 7); ctx.fill();
  } else if (b.type === 'crab') {
    ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 5;    // legs
    for (let i = 0; i < 3; i++) for (const s of [-1, 1]) {
      const k = Math.sin(frame * 0.3 + i) * 5;
      ctx.beginPath(); ctx.moveTo(cx + s * 25, b.y + 40); ctx.lineTo(cx + s * (40 + i * 10), b.y + 48 + k); ctx.lineTo(cx + s * (45 + i * 10), b.y + b.h); ctx.stroke();
    }
    const snap = b.pause > 0 ? Math.sin(frame * 0.8) * 0.4 : Math.sin(frame * 0.1) * 0.2;
    for (const s of [-1, 1]) {                         // claws
      ctx.fillStyle = '#ff5252';
      ctx.beginPath(); ctx.arc(cx + s * 58, b.y + 8, 16, 0, 7); ctx.fill();
      ctx.fillStyle = '#1a0b2e';
      ctx.beginPath(); ctx.moveTo(cx + s * 58, b.y + 8); ctx.arc(cx + s * 58, b.y + 8, 17, -Math.PI / 2 - 0.3 - snap, -Math.PI / 2 + 0.3 + snap); ctx.fill();
    }
    ctx.fillStyle = '#ff1744';
    ctx.beginPath(); ctx.ellipse(cx, b.y + 36, b.w / 2 - 12, 24, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = '#b71c1c'; ctx.lineWidth = 4;    // eye stalks
    ctx.beginPath(); ctx.moveTo(cx - 12, b.y + 20); ctx.lineTo(cx - 14, b.y + 2); ctx.moveTo(cx + 12, b.y + 20); ctx.lineTo(cx + 14, b.y + 2); ctx.stroke();
    for (const ex of [cx - 14, cx + 14]) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, b.y, 8, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + look / 2, b.y + 1, 4, 0, 7); ctx.fill();
    }
    ctx.fillStyle = '#ffd740';                         // captain hat
    ctx.fillRect(cx - 16, b.y - 22, 32, 8);
  } else {
    if (b.mode === 'low') {                            // tractor beam glow
      ctx.fillStyle = 'rgba(125,249,255,.15)';
      ctx.beginPath(); ctx.moveTo(cx - 30, b.y + b.h); ctx.lineTo(cx - 60, b.y + b.h + 60); ctx.lineTo(cx + 60, b.y + b.h + 60); ctx.lineTo(cx + 30, b.y + b.h); ctx.fill();
    }
    ctx.fillStyle = 'rgba(125,249,255,.5)';            // glass dome
    ctx.beginPath(); ctx.arc(cx, b.y + 24, 30, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#76ff03';                         // alien pilot
    ctx.beginPath(); ctx.arc(cx, b.y + 18, 13, 0, 7); ctx.fill();
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(cx - 5 + look / 2, b.y + 16, 3, 5, 0, 0, 7); ctx.ellipse(cx + 5 + look / 2, b.y + 16, 3, 5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#90a4ae';                         // saucer
    ctx.beginPath(); ctx.ellipse(cx, b.y + 34, b.w / 2, 18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#546e7a';
    ctx.beginPath(); ctx.ellipse(cx, b.y + 40, b.w / 2 - 10, 9, 0, 0, Math.PI); ctx.fill();
    for (let i = 0; i < 6; i++) {
      ctx.fillStyle = (Math.floor(frame / 8) + i) % 3 === 0 ? '#ffea00' : '#ff4081';
      ctx.beginPath(); ctx.arc(b.x + 15 + i * 20, b.y + 34, 4, 0, 7); ctx.fill();
    }
  }
  ctx.restore();
}

function drawShots() {
  for (const s of shots) {
    ctx.fillStyle = s.bomb ? '#263238' : 'rgba(255,64,129,.4)';
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r + (s.bomb ? 0 : 4), 0, 7); ctx.fill();
    ctx.fillStyle = s.bomb ? (frame % 10 < 5 ? '#ff1744' : '#ffea00') : '#ff80ab';
    ctx.beginPath(); ctx.arc(s.x, s.y - (s.bomb ? s.r : 0), s.bomb ? 4 : s.r - 2, 0, 7); ctx.fill();
  }
}

function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}

function drawParticles() {
  for (const pt of particles) {
    ctx.globalAlpha = Math.min(1, pt.life / 20);
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function draw() {
  const L = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
  if (state === 'title') {
    drawBackground(LEVELS[0]);
    const bob = Math.sin(frame * 0.06) * 10;
    text('ROBO JUMP!', W / 2, 190 + bob, 90, '#7df9ff');
    text('Collect coins ⭐ Bop the aliens ⭐ Fly home in the rocket!', W / 2, 270, 26);
    if (Math.floor(frame / 30) % 2) text('Press SPACE to play!', W / 2, 360, 40, '#69f0ae');
    text('← → move    SPACE jump    Hold SPACE to hover    M music', W / 2, 450, 24);
    return;
  }
  if (state === 'win') {
    drawBackground(LEVELS[2]);
    ctx.save(); ctx.translate(-camX, 0); drawParticles(); ctx.restore();
    const bob = Math.sin(frame * 0.08) * 10;
    text('YOU WIN!! 🎉', W / 2, 200 + bob, 90, '#ffd740');
    text(`You got ${totalCoins} coins!`, W / 2, 290, 40);
    if (Math.floor(frame / 30) % 2) text('Press SPACE to play again!', W / 2, 400, 34, '#69f0ae');
    return;
  }

  drawBackground(L);
  ctx.save();
  ctx.translate(-Math.round(camX) + (shake ? (Math.random() - .5) * shake : 0), shake ? (Math.random() - .5) * shake : 0);
  drawTiles(L);
  for (const s of spikes) drawSpikes(s);
  for (const s of springs) drawSpring(s);
  if (checkpoint) drawBeacon(checkpoint);
  drawRocket(flag);
  if (boss) drawBoss(boss);
  drawShots();
  for (const c of coins) if (!c.got) drawCoin(c.x, c.y + Math.sin(frame * 0.05 + c.x) * 3, frame * 0.08 + c.x);
  for (const e of enemies) drawEnemy(e);
  drawPlayer(player);
  drawParticles();
  ctx.restore();

  // HUD
  if (boss) {
    text(boss.name, W / 2, 74, 22, '#ff8a80');
    roundRect(W / 2 - 150, 84, 300, 16, 8, 'rgba(0,0,0,.5)');
    if (boss.hp > 0) roundRect(W / 2 - 148, 86, 296 * boss.hp / boss.maxHp, 12, 6, '#ff1744');
  }
  if (bossBanner > 0 && state !== 'levelDone') text(bannerText, W / 2, 200, 56, bossState === 'fight' ? '#ff5252' : '#ffd740');
  if (bossBanner > 0 && bossState === 'fight') text('Jump on its head!', W / 2, 250, 28);
  text(`Level ${levelIndex + 1}: ${L.name}`, 20, 42, 28, '#fff', 'left');
  drawCoin(W - 140, 32, frame * 0.08);
  text(`x ${totalCoins}`, W - 118, 42, 30, '#ffd740', 'left');
  text(musicOn ? '♪ M' : '♪ off', W - 20, H - 16, 18, '#fff', 'right');
  if (helpTimer > 0) text('Hold SPACE in the air to hover with your jet boots!', W / 2, 100, 24);
  if (state === 'levelDone') {
    text('BLAST OFF! 🚀', W / 2, 220, 80, '#7df9ff');
    text(`You found ${levelCoins} coins in this level!`, W / 2, 290, 30);
    if (timer > 60) text('Press SPACE for the next level', W / 2, 350, 28, '#69f0ae');
  }
}

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
