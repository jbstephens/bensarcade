<script>
// 🎬 REPLAY STUDIO: each run is saved as the keys held on every frame (from the level start), so the Game Factory book
// can play it back exactly. Gameplay Math.random uses a seeded dice during recording/replay so it happens the same way.
// Saved in localStorage.gfReplays = { [file]: [ {id, date, level, lv, frames, data, taps, sync, won, fav, seed, ctx, st, post} ] } (newest first).
// ?replay=N plays back run N with no keys, no saving and no trophies (&speed=0.33|1|2). The game sets RS.hooks.
const RS = (() => {
  const FILE = 'platformer.html', MAXF = 60 * 60 * 5, MINF = 180;
  const q = new URLSearchParams(location.search), rn = q.get('replay');
  const R = { FILE, on: false, inUpd: false, starting: false, skip: false, speed: 1, rec: null, play: null, f: 0, desync: -1, done: false, hooks: null };
  const LS = window.localStorage, realRand = Math.random;
  let seed = 1;
  const rng = () => { seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  Math.random = () => R.on && (R.inUpd || R.starting) ? rng() : realRand();
  const frameSeed = f => { seed = ((R.rec || R.play).seed * 7919 + f * 104729) | 0; };
  R.all = () => { try { const o = JSON.parse(LS.getItem('gfReplays') || '{}'); return o && typeof o === 'object' ? o : {}; } catch (_) { return {}; } };
  const rle = a => { const o = []; for (let i = 0; i < a.length;) { let j = i; while (j < a.length && a[j] === a[i]) j++; o.push(a[i].toString(36) + (j - i > 1 ? '*' + (j - i).toString(36) : '')); i = j; } return o.join(','); };
  const unrle = s => { const a = []; if (s) for (const p of s.split(',')) { const [m, n] = p.split('*'); for (let k = n ? parseInt(n, 36) : 1; k > 0; k--) a.push(parseInt(m, 36)); } return a; };
  R.pack = objs => { let m = 0, b = 1; for (const o of objs) for (const k in o) { if (o[k]) m |= b; b *= 2; } return m; };
  R.unpack = (objs, m) => { let b = 1; for (const o of objs) for (const k in o) { o[k] = !!(Math.floor(m / b) % 2); b *= 2; } };
  R.snap = keys => { const o = {}; for (const k of keys) { try { const v = LS.getItem(k); if (v == null || v.length < 6000) o[k] = v; } catch (_) {} } return o; };
  function store() {                                   // save the run being recorded (never touches the game's own save)
    const r = R.rec; if (!r || r.masks.length < MINF) return;
    try {
      const o = R.all(), L = (o[FILE] || []).filter(x => x && x.id !== r.id);
      L.unshift({ id: r.id, date: r.id, level: r.level, lv: r.lv, frames: r.masks.length, data: rle(r.masks), taps: r.taps, sync: r.sync.join(';'),
                  won: r.won, seed: r.seed, ctx: r.ctx, st: r.st, post: r.post, skip: r.skip });
      let n = 0; o[FILE] = L.filter(x => x.fav || ++n <= 3);
      let s = JSON.stringify(o);
      while (s.length > 150000) {                      // too big: drop the oldest run that isn't a ⭐ favorite
        let old = null;
        for (const k in o) (o[k] || []).forEach(x => { if (!x.fav && x.id !== r.id && (!old || x.id < old.x.id)) old = { k, x }; });
        if (!old) break;
        o[old.k] = o[old.k].filter(x => x !== old.x); s = JSON.stringify(o);
      }
      LS.setItem('gfReplays', s);
    } catch (_) {}
  }
  R.finish = () => { if (R.rec) { R.rec.taps = R.rec.taps.filter(t => t[0] < R.rec.masks.length); store(); R.rec = null; } R.on = false; };
  R.begin = (lv, skip) => {                            // the game calls this at the very top of its level start
    const H = R.hooks; if (!H) return;
    if (R.play) { if (!R.on) { R.on = true; R.starting = true; seed = R.play.seed; } else R.end(); return; }
    if (R.rec) { if (R.inUpd) R.rec.masks.pop(); R.finish(); }
    if (R.inUpd) R.skip = true;                        // the rest of this frame belongs to the old run
    R.rec = { id: Date.now(), lv, skip: !!skip, level: '', seed: (realRand() * 1e9) | 0, ctx: H.ctx(), st: H.st(), post: null, masks: [], taps: [], sync: [], won: false, wonAt: 0 };
    R.f = 0; R.on = true; R.starting = true; seed = R.rec.seed;
  };
  R.tick = () => {                                     // before each update(): false = don't update (replay is over)
    const H = R.hooks, P = R.play;
    if (R.done) return false;
    if (P) {
      if (!R.on) return false;
      if (R.f >= P.masks.length) { R.end(); return false; }
      if (R.f === 0 && P.post) H.setPost(P.post);
      R.starting = false; frameSeed(R.f); H.setIn(P.masks[R.f]);
      if (H.setTap) { const t = P.taps && P.taps.find(t => t[0] === R.f); H.setTap(t ? { x: t[1], y: t[2] } : null); }
      R.inUpd = true; return true;
    }
    if (R.rec) {
      const r = R.rec;
      if (R.f === 0) { r.post = H.post(); r.level = H.label(); }
      R.starting = false; frameSeed(R.f); r.masks.push(H.getIn());
      const t = H.getTap && H.getTap(); if (t) r.taps.push([R.f, Math.round(t.x), Math.round(t.y)]);
    }
    R.inUpd = true; return true;
  };
  R.after = () => {                                    // after each update()
    const H = R.hooks; R.inUpd = false;
    if (R.skip) { R.skip = false; return; }
    if (R.play) {
      if (!R.on || R.done) return;
      if (R.f % 30 === 0 && R.desync < 0 && R.play.syncA[R.f / 30] !== undefined && R.play.syncA[R.f / 30] !== H.pos()) R.desync = R.f;
      R.f++; return;
    }
    const r = R.rec; if (!r) return;
    if (R.f % 30 === 0) r.sync.push(H.pos());
    R.f++;
    if (!H.alive()) { r.masks.pop(); R.finish(); return; }
    if (H.won() && !r.won) { r.won = true; r.wonAt = R.f; }
    if ((r.won && R.f - r.wonAt > 150) || R.f >= MAXF) { R.finish(); return; }
    if (R.f % 600 === 0) store();                      // keep it safe even if the game window is closed
  };
  const bye = () => { if (R.rec) store(); };
  addEventListener('pagehide', bye); document.addEventListener('visibilitychange', () => { if (document.hidden) bye(); });
  // ---------- playing a replay ----------
  function ui(html, end) {
    let d = document.getElementById('rsUI');
    if (!d) { d = document.createElement('div'); d.id = 'rsUI'; document.body.appendChild(d); }
    d.innerHTML = '<style>#tp{display:none!important}</style><div style="position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9999;background:#d50000;color:#fff;font:bold 17px Arial,sans-serif;padding:5px 14px;border-radius:14px;box-shadow:0 2px 8px #0008;pointer-events:none">🎬 REPLAY' +
      (R.speed < 1 ? ' 🐢' : R.speed > 1 ? ' ⏩' : '') + '</div>' + (html ? '<div style="position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)"><div style="background:#fff8e1;border:6px solid #b71c1c;border-radius:24px;padding:22px 34px;text-align:center;font:bold 30px Arial,sans-serif;color:#4e342e">' + html +
      (end ? '<br><button id="rsAgain" style="margin-top:14px;font:bold 26px Arial,sans-serif;padding:10px 24px;border-radius:16px;border:0;background:#ffca28;cursor:pointer">🔁 Watch again</button>' : '') + '</div></div>' : '');
    const b = document.getElementById('rsAgain'); if (b) b.onclick = () => location.reload();
  }
  R.end = () => { if (R.done) return; R.done = true; ui('🎬 The End!' + (R.play.won ? '<br>⭐ Level cleared! ⭐' : ''), true); };
  if (rn != null) {
    const P = (R.all()[FILE] || [])[+rn];
    const sp = +q.get('speed'); R.speed = sp >= 0.1 && sp <= 4 ? sp : 1;
    if (P) { R.play = P; P.masks = unrle(P.data); P.syncA = (P.sync || '').split(';'); }
    const mem = Object.assign({}, P && P.st);          // the saves from when it was recorded; nothing gets saved for real
    const SP = Storage.prototype, g = SP.getItem, s = SP.setItem, rm = SP.removeItem;
    SP.getItem = function (k) { return this === LS && k in mem ? mem[k] : g.call(this, k); };
    SP.setItem = function (k, v) { if (this === LS) mem[k] = String(v); else s.call(this, k, v); };
    SP.removeItem = function (k) { if (this === LS) mem[k] = null; else rm.call(this, k); };
    for (const t of ['keydown', 'keyup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'contextmenu'])
      addEventListener(t, e => { if (!(e.target && e.target.closest && e.target.closest('#rsUI'))) { e.stopImmediatePropagation(); if (t === 'keydown' || t === 'pointerdown') try { R.hooks && R.hooks.wake(); } catch (_) {} } }, true);
  }
  R.boot = () => {                                     // the game calls this at the end of its script
    if (rn == null) return;
    const H = R.hooks, P = R.play;
    ui(P ? '' : '📼 This replay is gone!<br><span style="font-size:20px">Play again to make a new one.</span>', false);
    if (!P) { R.done = true; return; }
    try { H.wake(); } catch (_) {}
    H.setCtx(P.ctx); H.start(P.lv, P.skip);
  };
  return R;
})();

// 🎶 Every world has its OWN song, plus a boss song and an even BIGGER final-boss song.
// A song: bpm (mbpm = the slower 🌙 lullaby speed), bar = steps per chord (8 = march, 6 = waltz), ch = chords,
// mel = melody (MIDI notes, 0 = rest), arp = chord-tone pattern (0 root, 1 third, 2 fifth, 3-5 an octave up, 6 two up, -1 rest),
// bass (1 low root, 2 root, 3 low fifth), kick/tick = soft drum taps (never noise), pad = soft held chord,

// ---------- Input ----------

// ---------- World ----------
let state = 'title', levelIndex = 0, totalCoins = 0, levelCoins = 0;
let map, rows, cols, coins, enemies, springs, spikes, flag, checkpoint, player, respawn;
let camX = 0, particles = [], timer = 0, frame = 0, helpTimer = 0;
const ARENA = 24;
let pops = [], movers = [], lvT = 0;   // 🫧 bounce bubbles + 🌈 sliding platforms (the new places)
let arenaStart = 0, bossState = 'none', boss = null, shots = [], bossBanner = 0, bannerText = '', shake = 0;

const isSolidCh = ch => ch === '#' || ch === '=' || ch === 'W' || ch === '>' || ch === '<';   // > < = moving belts
function tileSolid(tx, ty) {
  if (tx < 0 || tx >= cols) return true;
  if (ty < 0 || ty >= rows) return false;
  return isSolidCh(map[ty][tx]);
}
// Finds the ground under a spot. If there is none, builds some so things never float over a hole.
function groundRow(x, y) {
  for (let r = y; r < rows; r++) if (isSolidCh(map[r][x])) return r;
  map[rows - 2][x] = map[rows - 1][x] = '#';
  return rows - 2;
}

function loadLevel(i) {
  RS.begin(i);                                         // 🎬 a new run starts recording here
  const L = LEVELS[i];
  rows = L.map.length;
  cols = Math.max(...L.map.map(r => r.length)) + 2;
  map = L.map.map(r => r.padEnd(cols, ' ').split(''));
  // Boss arena: flat floor at the end of the level, rocket lands there after the boss is beaten
  const groundEnd = map[rows - 2].lastIndexOf('#') + 1;
  arenaStart = cols;
  cols += ARENA;
  map = map.map(r => r.concat(Array(ARENA).fill(' ')));
  for (let x = groundEnd; x < cols; x++) map[rows - 2][x] = map[rows - 1][x] = '#';
  bossState = 'none'; boss = null; shots = []; bossBanner = 0; shake = 0;
  coins = []; enemies = []; springs = []; spikes = []; particles = []; portal = null; gKey = null; pops = []; movers = []; lvT = 0;
  let start = { x: 3, y: 10 }, c = null;
  for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
    const ch = map[y][x];
    if (ch === 'o') coins.push({ x: x * T + T / 2, y: y * T + T / 2, got: false });
    else if (ch === 'E') enemies.push({ x: x * T + 6, y: y * T + 12, w: 28, h: 28, vx: -1.2, vy: 0, dead: 0 });
    else if (ch === 'B') springs.push({ x, y });
    else if (ch === '^') spikes.push({ x, y });
    else if (ch === 'P') start = { x, y };
    else if (ch === 'C') c = { x, y };
    else if (ch === 'K') { if (!hasKey()) gKey = { x: x * T + T / 2, y: y * T + T / 2 }; }
    else if (ch === '*') pops.push({ x: x * T + T / 2, y: y * T + T / 2, gone: 0, sq: 0 });
    else if (ch === '~') { const m = movers.find(m => m.ty === y && m.tx + m.n === x); if (m) m.n++; else movers.push({ ty: y, tx: x, n: 1 }); }
    else if (ch === 'S') portal = { x: x * T - 10, y: y * T - 20, w: 60, h: 70 };
    if (!isSolidCh(ch)) map[y][x] = ' ';
  }
  movers = movers.map((m, k) => ({ x0: m.tx * T, x: m.tx * T, y: m.ty * T, w: m.n * T, h: 16, dx: 0, ph: k * 2.1 }));
  springs = springs.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T + 5, y: g * T - 20, w: 30, h: 20, squish: 0 }; });
  spikes = spikes.map(s => { const g = groundRow(s.x, s.y); return { x: s.x * T, y: (g - 1) * T }; });
  const pg = groundRow(start.x, start.y);
  player = { x: start.x * T + 6, y: pg * T - 36, w: 28, h: 36, vx: 0, vy: 0, onGround: false,
             face: 1, coyote: 0, buffer: 0, jumping: false, inv: 0, squash: 1, hover: 70, hovering: false };
  respawn = { x: player.x, y: player.y };
  flag = { x: (cols - 4) * T + T / 2, y: (rows - 2) * T, drop: 600 };
  checkpoint = null;
  if (c) { const g = groundRow(c.x, c.y); checkpoint = { x: c.x * T + T / 2, y: g * T, reached: false }; }
  levelCoins = 0;
  camX = 0;
  state = 'play';
  helpTimer = levelIndex === 0 || L.tip ? 400 : 0;
}

// ---------- Physics ----------
function overlapsSolid(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T);
  const y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (tileSolid(tx, ty)) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w;
  else e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0;
  return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 40 + Math.random() * 20,
                     color: colors[i % colors.length], size: 3 + Math.random() * 4 });
  }
}
function confetti() {
  const cols = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'];
  for (let i = 0; i < 80; i++)
    particles.push({ x: camX + Math.random() * W, y: -10 - Math.random() * 200, vx: (Math.random() - .5) * 2,
                     vy: Math.random() * 2, life: 200, color: cols[i % 5], size: 5 + Math.random() * 4, confetti: true });
}

function startBoss() {
  const B = LEVELS[levelIndex].boss;
  bossState = 'fight'; shots = []; helpTimer = 0;
  bossBanner = 150; bannerText = 'BOSS: ' + B.name + '!';
  for (let y = 0; y < rows - 2; y++) map[y][arenaStart] = 'W';   // laser wall closes behind you
  respawn = { x: (arenaStart + 2) * T, y: (rows - 2) * T - player.h };
  const [w, h] = { blob: [90, 80], crab: [110, 64], ufo: [130, 56], carousel: [104, 76] }[B.type];
  boss = { type: B.type, name: B.name, hp: B.hp, maxHp: B.hp, look: B.look || '', w, h, x: (arenaStart + 17) * T,
           y: B.type === 'ufo' ? -80 : -120, vx: 0, vy: 0, dir: -1, hurt: 0, t: 0, pause: 0,
           mode: 'up', modeT: 0, dying: 0 };
  sfx.boss();
}

function bossShoot(b, n) {
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
  const a = Math.atan2(player.y + player.h / 2 - cy, player.x + player.w / 2 - cx);
  for (let i = 0; i < n; i++) {
    const ang = a + (i - (n - 1) / 2) * 0.35;
    shots.push({ x: cx, y: cy, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9 });
  }
}

function updateBoss() {
  const p = player, b = boss;
  if (bossBanner > 0) bossBanner--;
  if (bossState === 'defeated' && flag.drop > 0) {
    flag.drop = Math.max(0, flag.drop - 8);
    if (flag.drop === 0) { sfx.land(); shake = 10; burst(flag.x, flag.y, ['#cfd8dc', '#fff'], 20, 4); }
  }
  if (!b) return;
  b.t++;
  if (b.hurt > 0) b.hurt--;
  if (b.dying) {
    b.dying++;
    if (b.dying % 5 === 0) burst(b.x + Math.random() * b.w, b.y + Math.random() * b.h, ['#ffea00', '#ff9100', '#fff'], 10, 5);
    if (b.dying > 80) {
      burst(b.x + b.w / 2, b.y + b.h / 2, ['#ffea00', '#ff9100', '#fff', '#7df9ff'], 50, 8);
      boss = null; bossState = 'defeated'; shake = 20;
      bossBanner = 150; bannerText = 'You beat ' + b.name + '!'; bossSticker(b.name);
      for (let y = 0; y < rows; y++) if (map[y][arenaStart] === 'W') map[y][arenaStart] = ' ';
      confetti();
    }
    return;
  }
  const angry = Math.min(3, b.maxHp - b.hp);   // bosses get faster as they get hurt (but not too fast)
  const left = (arenaStart + 1) * T, right = cols * T;
  if (b.type === 'ufo') {
    b.modeT++;
    const lowY = (rows - 2) * T - b.h - 50;
    if (b.mode === 'fly') {
      b.x += b.dir * (2.5 + angry * 0.5);
      if (b.x < left + 20 || b.x + b.w > right - 20) b.dir = -b.dir;
      b.y = 100 + Math.sin(b.t * 0.05) * 15;
      if (b.t % Math.max(40, 70 - angry * 10) === 0) shots.push({ x: b.x + b.w / 2, y: b.y + b.h, vx: 0, vy: 1, r: 10, bomb: true });
      if (b.modeT > 280) { b.mode = 'down'; b.modeT = 0; }
    } else if (b.mode === 'down') {
      b.y += 3;
      if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.modeT = 0; }
    } else if (b.mode === 'low') {
      b.x += Math.sign(p.x - b.x - b.w / 2 + p.w / 2) * 0.8;
      b.y = lowY + Math.sin(b.t * 0.1) * 4;
      if (b.modeT > 160) { b.mode = 'up'; b.modeT = 0; }
    } else {
      b.y -= 3;
      if (b.y <= 100) { b.mode = 'fly'; b.modeT = 0; }
    }
  } else if (b.type === 'carousel') updateCarousel(b, angry);
  else {
    const speed = (b.type === 'blob' ? 1.6 : 2.2) + angry * 0.4;
    b.vy = Math.min(b.vy + GRAV, MAXFALL);
    if (b.pause > 0) {
      b.pause--; b.vx = 0;
      if (b.pause === 20) { bossShoot(b, 3); sfx.hover(); }
    } else b.vx = b.dir * speed;
    if (moveX(b)) b.dir = -b.dir;
    moveY(b);
    if (b.type === 'blob' && b.onGround && b.t % 110 === 0) { b.vy = -11; }
    if (b.type === 'blob' && b.onGround && b.vy === 0 && b.landed === false) { shake = 6; sfx.land(); }
    b.landed = b.onGround;
    if (b.type === 'crab' && b.t % Math.max(90, 140 - angry * 15) === 0) b.pause = 40;
  }
  // Bop the boss on the head!
  if (overlap(p, b) && b.hurt === 0 && state === 'play') {
    if (p.vy > 0 && p.y + p.h - p.vy <= b.y + 20) {
      b.hp--; b.hurt = 70; p.vy = -12; p.jumping = false; shake = 12;
      sfx.bossHit();
      burst(p.x + p.w / 2, b.y, ['#ffea00', '#fff', '#7df9ff'], 16, 5);
      if (b.type === 'ufo') { b.mode = 'up'; b.modeT = 0; }
      if (b.type === 'carousel' && b.mode === 'dash') { b.mode = 'dizzy'; b.modeT = 0; }
      if (b.hp <= 0) { b.dying = 1; shots = []; sfx.bossDie(); }
    } else hurt();
  }
}

// 🎠 Captain Carousel (Comet Carnival boss). Every attack has a tell first:
//   roll → WIND-UP (stops, wiggles, spins fast, flashes red, big ❗ for 1 second) → DASH across → bonks the wall → DIZZY ★ (bop time!)
//   roll → JUGGLE (shows the balls over its head for 2/3 of a second) → tosses 2 (later 3) bouncy balls → roll
function updateCarousel(b, angry) {
  const p = player, cx = b.x + b.w / 2;
  b.vy = Math.min(b.vy + GRAV, MAXFALL); b.modeT++;
  if (b.mode === 'up') { b.mode = 'roll'; b.modeT = 0; b.next = 'wind'; }
  if (b.mode === 'roll') {
    b.vx = b.dir * (1.4 + angry * 0.3);
    if (b.modeT > 110 && b.onGround) { b.mode = b.next; b.next = b.next === 'wind' ? 'juggle' : 'wind'; b.modeT = 0; }
  } else if (b.mode === 'wind') {
    b.vx = 0; b.dir = Math.sign(p.x + p.w / 2 - cx) || -1;
    if (b.modeT % 15 === 1) note(300 + b.modeT * 6, 0, 0.12, 'triangle', 0.08);
    if (b.modeT > 60) { b.mode = 'dash'; b.modeT = 0; }
  } else if (b.mode === 'dash') {
    b.vx = b.dir * (5.5 + angry * 0.5);
    if (b.modeT > 240) { b.mode = 'dizzy'; b.modeT = 0; }
  } else if (b.mode === 'dizzy') {
    b.vx = 0; if (b.modeT > 100) { b.mode = 'roll'; b.modeT = 0; }
  } else if (b.mode === 'juggle') {
    b.vx = 0;
    if (b.modeT === 40) {
      const d = Math.sign(p.x + p.w / 2 - cx) || -1, n = angry >= 2 ? 3 : 2;
      for (let i = 0; i < n; i++) shots.push({ x: cx, y: b.y - 10, vx: d * (1.5 + i * 1.3), vy: -7, r: 10, bomb: true, ball: i });
      sfx.hover();
    }
    if (b.modeT > 70) { b.mode = 'roll'; b.modeT = 0; }
  }
  if (moveX(b)) {
    if (b.mode === 'dash') { b.mode = 'dizzy'; b.modeT = 0; shake = 10; sfx.land(); }
    b.dir = -b.dir;
  }
  moveY(b);
}

function updateShots() {
  const p = player;
  for (const s of shots) {
    s.x += s.vx; s.y += s.vy;
    if (s.bomb) s.vy = Math.min(s.vy + 0.25, 10);
    if (tileSolid(Math.floor(s.x / T), Math.floor((s.y + s.r) / T)) || s.y > H + 40) {
      s.gone = true; burst(s.x, s.y, ['#ff9100', '#ffea00'], 8, 3);
    }
    const dx = s.x - (p.x + p.w / 2), dy = s.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < (s.r + 13) ** 2 && state === 'play' && p.inv === 0) { s.gone = true; hurt(); }
  }
  shots = shots.filter(s => !s.gone);
}

function hurt() {
  if (player.inv > 0 || state !== 'play') return;
  state = 'dying'; timer = 0;
  sfx.ouch();
  burst(player.x + 14, player.y + 18, ['#ffffff', '#7df9ff', '#2979ff'], 20, 5);
}

function updatePlay() {
  const p = player;
  const target = (keys.right - keys.left) * SPEED;
  p.vx += (target - p.vx) * (p.onGround ? 0.3 : 0.15);
  if (keys.right) p.face = 1; else if (keys.left) p.face = -1;

  if (jumpPressed) p.buffer = 8; else p.buffer--;
  jumpPressed = false;
  if (p.onGround) p.coyote = 6; else p.coyote--;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.buffer = 0; p.coyote = 0; p.jumping = true; p.squash = 0.7;
    sfx.jump();
    burst(p.x + 14, p.y + p.h, ['#7df9ff', '#fff'], 6, 2);
  }
  if (p.jumping && !keys.jump && p.vy < -5) p.vy = -5;
  if (p.vy >= 0) p.jumping = false;
  const LV = LEVELS[levelIndex];
  p.vy = Math.min(p.vy + GRAV, MAXFALL);

  // Hold jump while falling to hover with jet boots!
  p.hovering = !p.onGround && keys.jump && p.vy > 0 && p.hover > 0;
  if (p.hovering) {
    p.vy = Math.min(p.vy, 0.6); p.hover--;
    if (frame % 2) particles.push({ x: p.x + 6 + Math.random() * 16, y: p.y + p.h + 4, vx: (Math.random() - .5),
                                    vy: 2 + Math.random() * 2, life: 14, color: frame % 4 ? '#7df9ff' : '#ffffff', size: 4 });
    if (frame % 4 === 0) sfx.hover();
  }

  // 🌈 sliding platforms move first and carry Robo along
  lvT++;
  for (const m of movers) { const nx = m.x0 + 80 * Math.sin(lvT * Math.PI * 2 / 220 + m.ph); m.dx = nx - m.x; m.x = nx; }
  if (p.onMover) { p.x += p.onMover.dx; if (overlapsSolid(p)) p.x -= p.onMover.dx; }
  const wasInAir = !p.onGround, oldBottom = p.y + p.h;
  moveX(p); moveY(p);
  p.onMover = null;
  for (const m of movers)                              // land on top of a sliding platform (you can jump up through it)
    if (p.vy >= 0 && p.x + p.w > m.x + 2 && p.x < m.x + m.w - 2 && oldBottom <= m.y + 1 && p.y + p.h >= m.y) {
      p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.onMover = m;
    }
  if (p.onGround && !p.onMover) {                      // ➡️ moving belts push you along
    const ch = (map[Math.floor((p.y + p.h + 1) / T)] || [])[Math.floor((p.x + p.w / 2) / T)];
    if (ch === '>' || ch === '<') { const d = ch === '>' ? 1.8 : -1.8; p.x += d; if (overlapsSolid(p)) p.x -= d; }
  }
  if (p.onGround && wasInAir) p.squash = 1.3;
  if (p.onGround) p.hover = look === 'boo' ? 220 : 70;   // Boo floats three times longer!
  p.squash += (1 - p.squash) * 0.2;
  if (p.inv > 0) p.inv--;

  // Coins
  for (const c of coins) {
    if (c.got) continue;
    const dx = c.x - (p.x + p.w / 2), dy = c.y - (p.y + p.h / 2);
    if (dx * dx + dy * dy < 28 * 28) {
      c.got = true; levelCoins++; totalCoins++; bankCoin();
      sfx.coin();
      burst(c.x, c.y, ['#ffd740', '#fff59d'], 8, 3);
    }
  }

  // 🔑 The hidden golden key
  if (gKey && overlap(p, { x: gKey.x - 20, y: gKey.y - 20, w: 40, h: 40 })) {
    burst(gKey.x, gKey.y, ['#ffd740', '#fff59d', '#fff'], 24, 4);
    gKey = null; keyCount = foundKey(); keyBanner = 150;
    [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.1, 0.25, 'square', 0.1)); note(2093, 0.42, 0.4, 'sine', 0.12);
  }

  // Springs
  for (const s of springs) {
    if (s.squish > 0) s.squish--;
    if (p.vy > 0 && overlap(p, s) && p.y + p.h - p.vy <= s.y + 10) {
      p.y = s.y - p.h; p.vy = -SPRING; p.jumping = false; s.squish = 10;
      sfx.spring();
    }
  }

  // 🫧 Bounce bubbles / balloons: land on top to boing up high (bubbles + balloons pop, then grow back)
  for (const b of pops) {
    if (b.sq > 0) b.sq--;
    if (b.gone > 0) { b.gone--; continue; }
    if (p.vy > 0 && overlap(p, { x: b.x - 20, y: b.y - 22, w: 40, h: 34 }) && p.y + p.h - p.vy <= b.y - 4) {
      p.y = b.y - 22 - p.h; p.vy = -15; p.jumping = false; b.sq = 14;
      b.gone = 150;
      sfx.pop();
      burst(b.x, b.y, LV.pop === 'balloon' ? ['#ff5252', '#ffd740', '#fff'] : ['#e0f7fa', '#ffffff', '#ea80fc'], 10, 3);
    }
  }

  // Spikes
  for (const s of spikes) if (overlap(p, { x: s.x + 6, y: s.y + 22, w: 28, h: 18 })) hurt();

  // Monsters
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.vy = Math.min(e.vy + GRAV, MAXFALL);
    const old = e.vx;
    if (moveX(e)) e.vx = -old;
    moveY(e);
    if (e.onGround) {
      const fx = e.vx > 0 ? e.x + e.w + 2 : e.x - 2;
      if (!tileSolid(Math.floor(fx / T), Math.floor((e.y + e.h + 2) / T))) e.vx = -e.vx;
    }
    if (e.y > rows * T + 200) e.gone = true;
    if (overlap(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 12) {
        e.dead = 1; p.vy = -10; p.jumping = false;
        sfx.stomp();
        burst(e.x + 14, e.y + 20, ['#76ff03', '#ccff90', '#fff'], 12, 3);
      } else hurt();
    }
  }
  enemies = enemies.filter(e => !e.gone && e.dead < 30);

  // Checkpoint
  if (checkpoint && !checkpoint.reached && overlap(p, { x: checkpoint.x - 10, y: checkpoint.y - 80, w: 24, h: 80 })) {
    checkpoint.reached = true;
    respawn = { x: checkpoint.x - 14, y: checkpoint.y - p.h };
    sfx.check();
    burst(checkpoint.x, checkpoint.y - 70, ['#ffd740', '#fff'], 14, 3);
  }

  // Finish flag
  if (bossState === 'none' && p.x > (arenaStart + 4) * T) startBoss();
  updateBoss();
  updateShots();

  if (bossState === 'defeated' && flag.drop === 0 && overlap(p, { x: flag.x - 28, y: flag.y - 130, w: 56, h: 130 })) {
    state = 'levelDone'; timer = 0;
    sfx.win(); confetti();
  }

  if (p.y > rows * T + 60) hurt();
  if (helpTimer > 0) helpTimer--;
}

function update() {
  frame++;
  if (stickerNew > 0) stickerNew--;
  if (keyBanner > 0) keyBanner--;
  if (goldNope > 0) goldNope--;
  if (askNewT > 0) askNewT--;
  for (const pt of particles) {
    pt.x += pt.vx; pt.y += pt.vy;
    pt.vy += pt.confetti ? 0.05 : 0.2;
    pt.life--;
  }
  particles = particles.filter(pt => pt.life > 0);

  if (state === 'title' || state === 'win') {
    if (jumpPressed) {
      jumpPressed = false;
      if (state === 'win' && winKind === 'main') startNew();                       // 🚀 on to the new places!
      else if (state === 'win') { totalCoins = 0; state = 'title'; winKind = 'main'; }
      else { levelIndex = 0; loadLevel(0); }
    }
    if (state === 'win' && frame % 90 === 0) confetti();
    return;
  }
  if (state === 'dying') {
    timer++;
    if (timer > 50) {
      Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90, onMover: null });
      shots = [];
      state = 'play';
    }
  } else if (state === 'levelDone') {
    timer++;
    if (timer > 60 && jumpPressed || timer > 240) {
      if (levelIndex >= NEW_START) {                   // 🚀 the new places, one after another
        if (levelIndex + 1 < LEVELS.length) { levelIndex++; loadLevel(levelIndex); }
        else { state = 'win'; winKind = 'new'; confetti(); trophy('rj1Places'); }
      } else {
        levelIndex = levelIndex === MAIN_LEVELS ? secretBack + 1 : levelIndex + 1;
        if (levelIndex >= MAIN_LEVELS) { state = 'win'; winKind = 'main'; confetti(); trophy('roboWin'); newOpenC = true; codeSeen('gloop'); }
        else loadLevel(levelIndex);
      }
    }
    jumpPressed = false;
  } else if (state === 'play') {
    updatePlay();
    if (portal && state === 'play' && overlap(player, portal)) {   // found the secret!
      secretBack = levelIndex; trophy('roboSecret'); sfx.coin(); setTimeout(sfx.coin, 150); setTimeout(sfx.coin, 300);
      levelIndex = MAIN_LEVELS; loadLevel(MAIN_LEVELS); bossBanner = 180; bannerText = '🤫 SECRET LEVEL!'; confetti();
    }
  }

  const target = player.x + player.w / 2 - W / 2;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (Math.max(minX, Math.min(cols * T - W, target)) - camX) * 0.12;
  if (shake > 0) shake--;
}

// ---------- Drawing ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}

function drawBackground(L) {
  if (MID) return midBackground(L);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, L.sky[0]); g.addColorStop(1, L.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // twinkly stars
  for (let i = 0; i < 90; i++) {
    const sx = ((i * 137.5 - camX * (0.03 + (i % 3) * 0.03)) % W + W) % W;
    ctx.fillStyle = `rgba(255,255,255,${0.35 + 0.35 * Math.sin(frame * 0.04 + i * 1.7)})`;
    const sz = i % 7 === 0 ? 3 : 2;
    ctx.fillRect(sx, (i * 71) % 400, sz, sz);
  }

  // shooting star
  const ss = frame % 420;
  if (ss < 40) {
    const sx = 900 - ss * 18, sy = 40 + ss * 5;
    const tail = ctx.createLinearGradient(sx, sy, sx + 90, sy - 25);
    tail.addColorStop(0, '#fff'); tail.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.strokeStyle = tail; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + 90, sy - 25); ctx.stroke();
  }

  // big ringed planet
  const px = 780 - camX * 0.04, py = 120;
  ctx.fillStyle = L.planet;
  ctx.beginPath(); ctx.arc(px, py, 55, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(0,0,0,.18)';
  ctx.beginPath(); ctx.arc(px + 15, py + 10, 50, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.ellipse(px, py, 95, 20, -0.3, 0, 7); ctx.stroke();
  // little moon
  ctx.fillStyle = '#cfd8dc';
  ctx.beginPath(); ctx.arc(220 - camX * 0.07, 80, 18, 0, 7); ctx.fill();
  ctx.fillStyle = '#b0bec5';
  ctx.beginPath(); ctx.arc(214 - camX * 0.07, 76, 5, 0, 7); ctx.arc(226 - camX * 0.07, 88, 4, 0, 7); ctx.fill();

  if (L.deco) drawDeco(L);
  // alien mountains
  for (const [color, speed, height, size] of [[L.hill, 0.3, 340, 90], [L.hill2, 0.5, 400, 60]]) {
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) {
      const wx = x + camX * speed, t = (wx / size) % 2;
      ctx.lineTo(x, height - (t < 1 ? t : 2 - t) * 70 - Math.sin(wx / 37) * 10);
    }
    ctx.lineTo(W, H); ctx.fill();
  }
}

// 🖼️ far-away scenery for the new places (only pictures, no Math.random)
function drawDeco(L) {
  const dim = MID ? 0.45 : 0.8, sx = k => ((k - camX * 0.12) % 1400 + 1400) % 1400 - 200;
  ctx.save(); ctx.globalAlpha = dim;
  if (L.deco === 'bubbles') {                          // 🫧 big bubbles drifting up
    for (let i = 0; i < 9; i++) {
      const bx = sx(i * 160 + 40), by = 330 - ((frame * (0.3 + (i % 3) * 0.15) + i * 70) % 380), r = 10 + (i * 7) % 22;
      ctx.strokeStyle = `hsl(${(i * 40 + frame) % 360},80%,80%)`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.arc(bx - r * 0.4, by - r * 0.4, r * 0.2, 0, 7); ctx.fill();
    }
  } else if (L.deco === 'junk') {                      // 🔧 old rockets + a giant gear in the junk piles
    for (let i = 0; i < 4; i++) {
      const rx = sx(i * 350 + 100), ry = 250 + (i % 2) * 30, tilt = (i % 2 ? 0.5 : -0.4);
      ctx.save(); ctx.translate(rx, ry); ctx.rotate(tilt);
      ctx.fillStyle = '#8d6e63'; ctx.beginPath(); ctx.roundRect(-14, -50, 28, 90, 12); ctx.fill();
      ctx.fillStyle = '#ff7043'; ctx.beginPath(); ctx.moveTo(-14, -40); ctx.lineTo(0, -70); ctx.lineTo(14, -40); ctx.fill();
      ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.arc(0, -20, 7, 0, 7); ctx.fill(); ctx.restore();
    }
    const gx = sx(620), gy = 230; ctx.save(); ctx.translate(gx, gy); ctx.rotate(frame * 0.005); ctx.fillStyle = '#6d5a48';
    for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-9, -62, 18, 20); }
    ctx.beginPath(); ctx.arc(0, 0, 46, 0, 7); ctx.fill(); ctx.fillStyle = L.sky[1]; ctx.beginPath(); ctx.arc(0, 0, 16, 0, 7); ctx.fill(); ctx.restore();
  } else if (L.deco === 'carnival') {                  // 🎡 a spinning space wheel + a striped tent + light strings
    const wx = sx(300), wy = 200;
    ctx.strokeStyle = '#ffe082'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(wx, wy, 95, 0, 7); ctx.stroke();
    ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(wx - 50, wy + 170); ctx.lineTo(wx, wy); ctx.lineTo(wx + 50, wy + 170); ctx.stroke();
    for (let k = 0; k < 8; k++) {
      const a = frame * 0.006 + k * Math.PI / 4, px = wx + Math.cos(a) * 95, py = wy + Math.sin(a) * 95;
      ctx.beginPath(); ctx.moveTo(wx, wy); ctx.lineTo(px, py); ctx.stroke();
      ctx.fillStyle = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff'][k % 4]; ctx.beginPath(); ctx.roundRect(px - 10, py, 20, 16, 5); ctx.fill();
    }
    const tx = sx(900), ty = 210;
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#ff5252' : '#fff8e1'; ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(tx - 90 + k * 30, ty + 120); ctx.lineTo(tx - 60 + k * 30, ty + 120); ctx.fill(); }
    ctx.fillStyle = '#69f0ae'; ctx.beginPath(); ctx.moveTo(tx, ty - 26); ctx.lineTo(tx + 20, ty - 18); ctx.lineTo(tx, ty - 10); ctx.fill(); ctx.fillRect(tx - 1, ty - 26, 2, 26);
    for (let i = 0; i < 24; i++) { ctx.fillStyle = (i + Math.floor(frame / 15)) % 3 ? '#ffea00' : '#ff80ab'; ctx.beginPath(); ctx.arc(i * 42 - (camX * 0.2) % 42, 40 + Math.sin(i * 0.9) * 8, 3.5, 0, 7); ctx.fill(); }
  }
  ctx.restore();
}

function drawTiles(L) {
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(cols - 1, Math.ceil((camX + W) / T));
  for (let y = 0; y < rows; y++) for (let x = c0; x <= c1; x++) {
    const ch = map[y][x], px = x * T, py = y * T;
    if (ch === 'W') {                                  // laser wall
      ctx.fillStyle = `rgba(255,23,68,${0.4 + 0.3 * Math.sin(frame * 0.3 + y)})`;
      ctx.fillRect(px + 12, py, 16, T);
      ctx.fillStyle = '#ffcdd2'; ctx.fillRect(px + 18, py, 4, T);
    } else if (ch === '#') {
      ctx.fillStyle = L.dirt; ctx.fillRect(px, py, T + 1, T + 1);
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.fillRect(px, py, 2, T); ctx.fillRect(px, py + T - 2, T, 2);
      ctx.fillStyle = 'rgba(255,255,255,.35)';
      ctx.fillRect(px + 6, py + 8, 3, 3); ctx.fillRect(px + 31, py + 8, 3, 3);
      ctx.fillRect(px + 6, py + 30, 3, 3); ctx.fillRect(px + 31, py + 30, 3, 3);
      if (y === 0 || !'#<>'.includes(map[y - 1][x])) {
        ctx.fillStyle = '#2a2f45'; ctx.fillRect(px, py, T + 1, 8);
        ctx.globalAlpha = 0.6 + 0.4 * Math.sin(frame * 0.05 + x * 0.5);
        ctx.fillStyle = L.grass; ctx.fillRect(px, py + 2, T + 1, 4);
        ctx.globalAlpha = 1;
      }
    } else if (ch === '>' || ch === '<') {               // ➡️ moving belt: rollers + arrows sliding the way it pushes
      const d = ch === '>' ? 1 : -1;
      ctx.fillStyle = L.dirt; ctx.fillRect(px, py, T + 1, T + 1);
      roundRect(px, py, T + 1, 14, 6, '#37474f');
      ctx.fillStyle = '#90a4ae';
      for (let k = 0; k < 3; k++) { ctx.beginPath(); ctx.arc(px + 7 + k * 13, py + 7, 4, 0, 7); ctx.fill(); }
      ctx.strokeStyle = L.grass; ctx.lineWidth = 3;
      const ax = px + ((frame * 1.8 * d) % 20 + 20) % 20;
      for (const o of [0, 20]) { const xx = ax + o; if (xx > px + 36) continue; ctx.beginPath(); ctx.moveTo(xx - d * 4, py + 18); ctx.lineTo(xx + d * 3, py + 24); ctx.lineTo(xx - d * 4, py + 30); ctx.stroke(); }
    } else if (ch === '=') {
      roundRect(px + 1, py + 1, T - 2, T - 2, 6, '#1e2a4a');
      ctx.strokeStyle = L.grass; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.roundRect(px + 2, py + 2, T - 4, T - 4, 6); ctx.stroke();
      ctx.fillStyle = (frame / 20 + x) % 4 < 2 ? L.grass : '#ffffff';
      ctx.beginPath(); ctx.arc(px + T / 2, py + T / 2, 5, 0, 7); ctx.fill();
    }
  }
}

function drawMover(m, L) {                             // 🌈 a sliding platform with little rocket puffs under it
  roundRect(m.x, m.y, m.w, m.h, 8, '#ff7043');
  for (let k = 0; k < m.w / T; k++) roundRect(m.x + k * T + 4, m.y + 3, T - 8, 5, 3, k % 2 ? '#fff59d' : L.grass);
  ctx.fillStyle = `rgba(125,249,255,${0.5 + 0.3 * Math.sin(frame * 0.4)})`;
  for (const fx of [m.x + 14, m.x + m.w - 14]) { ctx.beginPath(); ctx.moveTo(fx - 6, m.y + m.h); ctx.lineTo(fx, m.y + m.h + 10 + (frame % 6)); ctx.lineTo(fx + 6, m.y + m.h); ctx.fill(); }
}
function drawPop(b, kind) {                            // 🫧 bubble (Bubble Moon) or 🎈 balloon (Comet Carnival)
  if (b.gone > 0) {                                    // growing back
    if (b.gone > 40) return;
    ctx.globalAlpha = 0.35; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y, 18 * (1 - b.gone / 40), 0, 7); ctx.stroke(); ctx.globalAlpha = 1; return;
  }
  const y = b.y + Math.sin(frame * 0.05 + b.x) * 3, sq = b.sq > 0 ? Math.sin(b.sq) * 4 : 0;
  if (kind === 'balloon') {
    const col = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff'][Math.floor(b.x / T) % 4];
    ctx.strokeStyle = '#eee'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(b.x, y + 20); ctx.quadraticCurveTo(b.x + 6, y + 30, b.x, y + 40); ctx.stroke();
    ctx.fillStyle = MID ? midMix(col, '#3949ab', 0.35) : col; ctx.beginPath(); ctx.ellipse(b.x, y, 17 + sq, 20 - sq, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(b.x - 4, y + 22); ctx.lineTo(b.x + 4, y + 22); ctx.lineTo(b.x, y + 17); ctx.fill();
  } else {
    ctx.fillStyle = MID ? 'rgba(179,229,252,.25)' : 'rgba(128,222,234,.3)'; ctx.beginPath(); ctx.ellipse(b.x, y, 19 + sq, 19 - sq, 0, 0, 7); ctx.fill();
    ctx.strokeStyle = `hsl(${(frame * 2 + b.x) % 360},90%,80%)`; ctx.lineWidth = 2.5; ctx.stroke();
  }
  ctx.fillStyle = 'rgba(255,255,255,.75)'; ctx.beginPath(); ctx.ellipse(b.x - 7, y - 8, 5, 3, -0.6, 0, 7); ctx.fill();
}
function drawCoin(x, y, t) {
  const w = Math.abs(Math.cos(t)) * 12 + 2;

  ctx.fillStyle = '#fff3b0';

}

function drawEnemy(e) {
  const squash = e.dead ? 0.3 : 1 + Math.sin(frame * 0.2 + e.x) * 0.06;
  const h = e.h * squash, y = e.y + e.h - h;
  roundRect(e.x, y, e.w, h, [14, 14, 6, 6], '#64dd17');

  ctx.fillStyle = '#ff4081';
  ctx.beginPath(); ctx.arc(ax, y - 11, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#fff';                              // one big eye
  ctx.beginPath(); ctx.arc(e.x + 14 + d, y + 12, 8, 0, 7); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(e.x + 15 + d * 1.3, y + 13, 4, 0, 7); ctx.fill();
  ctx.fillStyle = '#33691e';                           // feet
  const step = Math.sin(frame * 0.3) * 3;
  ctx.fillRect(e.x + 3 + step, e.y + e.h - 4, 8, 4);
  ctx.fillRect(e.x + 17 - step, e.y + e.h - 4, 8, 4);
}

function drawPlayer(p) {
  if (MID) midIdleCalc(p);
  if (state === 'dying' || state === 'levelDone') return;
  if (p.inv > 0 && Math.floor(frame / 4) % 2) return;
  drawLook(p, look);
  if (MID && midIdle > 180) midZ(p.x + p.w + 2, p.y - 6, 15, 0);   // 🌙 Zzz...
}

function drawLook(p, id, gold = isGold()) {
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  goldDraw = gold;
  if (id === 'monster') {                              // 🧪 My Monster from the Mad Science Lab
    const cfg = myMonster || { body: 0, color: '#66bb6a', eyes: 2, horns: 0, mouth: 0, wings: false };
    const hat = monsterHat && lookOpen(LOOKS.find(l => l.id === monsterHat)) ? monsterHat : '';
    if (p.hovering && !cfg.wings) {                    // no wings? jet boots then!
      const f = 8 + Math.random() * 8;
      ctx.fillStyle = gc('#7df9ff', '#ffe57f');
      for (const fx of [x + 7, x + w - 7]) { ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill(); }
    }
    const top = drawMonsterLook(cfg, x, y, w, h, p.face || 1, frame, {
      gold, hat: !!hat, fly: !!p.hovering || (p.onGround === false && Math.abs(p.vy || 0) > 0.5),
      idle: p.onGround !== false && Math.abs(p.vx || 0) < 0.5, walk: p.onGround !== false && Math.abs(p.vx || 0) >= 0.5 });
    if (hat) drawHat(hat, x + w / 2, top + 1, w + 4, p.face || 1);
    else if (MID) midCap(x + w / 2, top + 2, w * 0.8, p.face || 1, gc('#3949ab', '#ffa000'), { vy: p.vy });
    if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
    goldDraw = false; return;
  }
  if (id === 'pinch') { drawPinch(p, x, y, w, h); if (MID) midCap(x + w / 2, y, w * 0.78, p.face || 1, gc('#3949ab', '#ffa000'), { vy: p.vy }); if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return; }
  if (id === 'boo') {                                  // 👻 Boo the Ghost: see-through, wavy tail, floats extra long
    const t = frame * 0.15, f = p.face || 1;
    ctx.save(); ctx.globalAlpha = 0.85;
    ctx.fillStyle = gold ? '#ffd740' : '#f5f9ff'; ctx.beginPath();
    ctx.moveTo(x, y + h); ctx.lineTo(x, y + 14); ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h);
    for (let k = 0; k < 4; k++) ctx.lineTo(x + w - (k + 0.5) * w / 4, y + h - 6 + Math.sin(t + k) * 3), ctx.lineTo(x + w - (k + 1) * w / 4, y + h);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.ellipse(x + w / 2 - 6 + f * 2, y + 14, 3, 4.5, 0, 0, 7); ctx.ellipse(x + w / 2 + 6 + f * 2, y + 14, 3, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + f * 2, y + 24, 4, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
    if (monsterHat) drawHat(monsterHat, x + w / 2, y + 1, w + 4, f);
    else if (MID) midCap(x + w / 2, y + 3, w * 0.8, f, gold ? '#ffa000' : '#7986cb', { vy: p.vy });
    if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return;
  }
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.fillStyle = MID ? gc('#42a5f5', '#ffb300') : gc('#3d5afe', '#ff8f00');   // legs (🌙 PJ pants)
  ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
  if (MID) midPJ(x, y, w, h);                          // 🌙 striped pajamas
  ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
  roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
  if (gold) {                                          // ✨ shiny streak + a white highlight
    ctx.save(); ctx.beginPath(); ctx.roundRect(x - 2, y, w + 4, h * 0.55, 12); ctx.roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6); ctx.clip();
    goldShine(x - 2, y, w + 4, h * 0.9); ctx.restore();
    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 3, 3, 1.6, -0.5, 0, 7); ctx.fill();
  }
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : MID && midIdle > 90 ? 1.8 : 5;   // 🌙 sleepy eyes when he stands still
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
  if (id !== 'normal') drawHat(id, x + w / 2, y + 1, w + 4, p.face);
  else if (MID) midCap(x + w / 2, y + 2, (w + 4) * 0.82, p.face || 1, gc('#3949ab', '#ffa000'), { vy: p.vy });   // 🌙 nightcap
  if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
  goldDraw = false;
}

// Hats: cx = middle of the head, top = top of the head, hw = head width, face = 1 right / -1 left
function drawHat(id, cx, top, hw, face) {
  ctx.save();
  ctx.lineJoin = 'round'; ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.5;
  const shape = (fill, f) => { ctx.fillStyle = fill; ctx.beginPath(); f(); ctx.fill(); ctx.stroke(); };
  if (id === 'tophat') {
    shape('#212121', () => ctx.ellipse(cx, top, hw * 0.62, 4, 0, 0, 7));          // brim
    shape('#212121', () => ctx.rect(cx - hw * 0.36, top - 22, hw * 0.72, 22));     // tall part
    ctx.fillStyle = '#e53935'; ctx.fillRect(cx - hw * 0.36, top - 8, hw * 0.72, 5);  // red band
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(cx - hw * 0.28, top - 20, 3, 10);
  } else if (id === 'cap') {
    shape('#e53935', () => ctx.ellipse(cx + face * hw * 0.45, top + 1, hw * 0.4, 3.5, 0, 0, 7));  // bill sticks out the way you face
    shape('#ff1744', () => ctx.arc(cx, top + 2, hw * 0.48, Math.PI, 0));                         // dome
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, top + 2 - hw * 0.48, 2.5, 0, 7); ctx.fill();  // button
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(cx - face * 3, top - 5, 3, 0, 7); ctx.fill();   // star badge
  } else if (id === 'cowboy') {
    shape('#8d5524', () => {                                                       // curvy brim
      ctx.moveTo(cx - hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx - hw * 0.6, top + 4, cx, top + 3);
      ctx.quadraticCurveTo(cx + hw * 0.6, top + 4, cx + hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx + hw * 0.6, top - 1, cx, top - 1);
      ctx.quadraticCurveTo(cx - hw * 0.6, top - 1, cx - hw * 0.8, top - 6);
    });
    shape('#a0682f', () => {                                                       // crown with a dent
      ctx.moveTo(cx - hw * 0.34, top);
      ctx.lineTo(cx - hw * 0.3, top - 15);
      ctx.quadraticCurveTo(cx, top - 10, cx + hw * 0.3, top - 15);
      ctx.lineTo(cx + hw * 0.34, top);
      ctx.closePath();
    });
    ctx.fillStyle = '#4e342e'; ctx.fillRect(cx - hw * 0.33, top - 5, hw * 0.66, 3);   // band
  } else if (id === 'crown') {
    shape('#ffd740', () => {
      ctx.moveTo(cx - hw * 0.42, top + 1);
      ctx.lineTo(cx - hw * 0.46, top - 14);
      ctx.lineTo(cx - hw * 0.22, top - 6);
      ctx.lineTo(cx, top - 18);
      ctx.lineTo(cx + hw * 0.22, top - 6);
      ctx.lineTo(cx + hw * 0.46, top - 14);
      ctx.lineTo(cx + hw * 0.42, top + 1);
      ctx.closePath();
    });
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(cx, top - 3, 2.6, 0, 7); ctx.fill();   // jewels
    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(cx - hw * 0.25, top - 2, 2, 0, 7); ctx.arc(cx + hw * 0.25, top - 2, 2, 0, 7); ctx.fill();
  }
  ctx.restore();
}

// 🧪 My Monster: draws a monster from the Mad Science Lab recipe in the box (x, y, w, h).
// cfg = { body 0 blob / 1 square / 2 tall bean / 3 spiky ball, color '#hex', eyes 1-3, horns 0 none / 1 horns / 2 antennae / 3 crown, mouth 0 smile / 1 fangs / 2 big open, wings }
// face = 1 right / -1 left, t = a frame counter. opt = { gold, fly (flap fast), idle (bounce), walk (step), hat (skip the crown) }
// Returns the y of the top of its head (so a hat can sit there).
function drawMonsterLook(cfg, x, y, w, h, face, t, opt = {}) {
  const shade = (hex, k) => {                          // darker (k < 1) or lighter (k > 1) version of a #hex color
    let c = String(hex).replace('#', ''); if (c.length === 3) c = c.replace(/./g, ch => ch + ch);
    const n = parseInt(c, 16); if (!Number.isFinite(n)) return hex;
    const f = v => Math.max(0, Math.min(255, Math.round(k < 1 ? v * k : v + (255 - v) * (k - 1))));
    return `rgb(${f(n >> 16 & 255)},${f(n >> 8 & 255)},${f(n & 255)})`;
  };
  const col = opt.gold ? '#ffc107' : (cfg.color || '#66bb6a'), dark = opt.gold ? '#ff8f00' : shade(col, 0.62);
  const bounce = opt.idle ? Math.sin(t * 0.12) * 1.3 : 0;
  const yb = -4, yt = -h + 3 + bounce;                 // local coords: (0, 0) = feet in the middle
  let top = yt;
  ctx.save();
  ctx.translate(x + w / 2, y + h); ctx.scale(face < 0 ? -1 : 1, 1);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  // little stubby feet
  const step = opt.walk ? Math.sin(t * 0.4) * 2 : 0;
  ctx.fillStyle = dark;
  ctx.beginPath(); ctx.ellipse(-w * 0.24, -2.5 - Math.max(0, step), 5, 3, 0, 0, 7); ctx.ellipse(w * 0.24, -2.5 - Math.max(0, -step), 5, 3, 0, 0, 7); ctx.fill();
  // bat wings (behind the body)
  if (cfg.wings) {
    const a = opt.fly ? Math.sin(t * 0.6) * 0.6 : Math.sin(t * 0.08) * 0.15;
    for (const sd of [-1, 1]) {
      ctx.save(); ctx.translate(sd * w * 0.36, yt + (yb - yt) * 0.38); ctx.rotate(sd * (a - 0.15)); ctx.scale(sd, 1);
      ctx.fillStyle = dark; ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(12, -9); ctx.lineTo(17, -2);
      ctx.quadraticCurveTo(13, -1, 12, 4); ctx.quadraticCurveTo(9, 1, 6, 6); ctx.quadraticCurveTo(4, 2, 0, 6); ctx.closePath(); ctx.fill();
      ctx.strokeStyle = shade(dark, 0.7); ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, 1); ctx.lineTo(12, -8); ctx.stroke();
      ctx.restore();
    }
  }
  // the body
  ctx.beginPath();
  if (cfg.body === 1) {                                // square
    ctx.roundRect(-w / 2, yt, w, yb - yt, 5);
  } else if (cfg.body === 2) {                         // tall bean
    top = yt - 2; ctx.ellipse(0, (top + yb) / 2, w * 0.4, (yb - top) / 2, 0, 0, 7);
  } else if (cfg.body === 3) {                         // spiky ball
    const R = Math.max(6, Math.min(w * 0.42, (yb - yt) / 2 - 2)), cy = yb - R;
    ctx.fillStyle = dark;
    for (let i = 0; i < 10; i++) {
      const a = i * Math.PI / 5 + 0.3, a1 = a - 0.25, a2 = a + 0.25;
      ctx.moveTo(Math.cos(a1) * R * 0.9, cy + Math.sin(a1) * R * 0.9); ctx.lineTo(Math.cos(a) * (R + 5), cy + Math.sin(a) * (R + 5)); ctx.lineTo(Math.cos(a2) * R * 0.9, cy + Math.sin(a2) * R * 0.9);
    }
    ctx.fill(); ctx.beginPath();
    ctx.arc(0, cy, R, 0, 7); top = cy - R;
  } else {                                             // blob: round top + a wiggly bottom
    const r = Math.min(w / 2, (yb - yt) * 0.6), wig = Math.sin(t * 0.15) * 1;
    ctx.moveTo(-w / 2, yb); ctx.lineTo(-w / 2, yt + r);
    ctx.ellipse(0, yt + r, w / 2, r, 0, Math.PI, 0);
    ctx.lineTo(w / 2, yb);
    ctx.quadraticCurveTo(w * 0.33, yb + 3 + wig, w / 6, yb); ctx.quadraticCurveTo(0, yb + 3 - wig, -w / 6, yb); ctx.quadraticCurveTo(-w * 0.33, yb + 3 + wig, -w / 2, yb);
    ctx.closePath();
  }
  ctx.fillStyle = col; ctx.fill();
  ctx.strokeStyle = dark; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.35)';             // shiny spot
  ctx.beginPath(); ctx.ellipse(-w * 0.2, top + (yb - top) * 0.22, 3.5, 2, -0.5, 0, 7); ctx.fill();
  if (opt.gold) {                                      // a sliding gold glint
    const g = (t % 120) / 120; ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.beginPath(); ctx.ellipse(-w / 2 + g * w, top + (yb - top) * 0.5, 2, (yb - top) * 0.3, 0.4, 0, 7); ctx.fill();
  }
  // horns / antennae / crown
  if (cfg.horns === 1) {
    ctx.fillStyle = '#fff8e1'; ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 1;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * w * 0.12, top + 3); ctx.quadraticCurveTo(sd * w * 0.3, top - 3, sd * w * 0.4, top - 10); ctx.quadraticCurveTo(sd * w * 0.34, top + 1, sd * w * 0.3, top + 5); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
  } else if (cfg.horns === 2) {
    ctx.strokeStyle = dark; ctx.lineWidth = 2;
    const wob = Math.sin(t * 0.1) * 1.5;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * 4, top + 2); ctx.quadraticCurveTo(sd * 5, top - 6, sd * 9 + wob, top - 11); ctx.stroke();
      ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(sd * 9 + wob, top - 11, 3, 0, 7); ctx.fill();
    }
  } else if (cfg.horns === 3 && !opt.hat) {
    ctx.fillStyle = '#ffd740'; ctx.strokeStyle = '#b8860b'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-8, top + 2); ctx.lineTo(-9, top - 8); ctx.lineTo(-4, top - 3); ctx.lineTo(0, top - 11); ctx.lineTo(4, top - 3); ctx.lineTo(9, top - 8); ctx.lineTo(8, top + 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(0, top - 2, 1.8, 0, 7); ctx.fill();
  }
  // eyes (looking the way it walks)
  const bodyH = yb - top, ey = top + bodyH * 0.34, fx = 2;
  const blink = t % 200 < 6;
  const eyes = cfg.eyes === 1 ? [[fx, ey, 6]] : cfg.eyes === 3 ? [[fx - 7, ey + 1, 3.6], [fx, ey - 2, 3.6], [fx + 7, ey + 1, 3.6]] : [[fx - 5.5, ey, 4.3], [fx + 5.5, ey, 4.3]];
  for (const [ex, eyy, r] of eyes) {
    if (blink) { ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ex - r, eyy); ctx.lineTo(ex + r, eyy); ctx.stroke(); continue; }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, eyy, r, 0, 7); ctx.fill();
    ctx.strokeStyle = dark; ctx.lineWidth = 1; ctx.stroke();
    ctx.fillStyle = '#1b1b2f'; ctx.beginPath(); ctx.arc(ex + r * 0.35, eyy + 0.5, r * 0.5, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex + r * 0.15, eyy - r * 0.2, r * 0.18, 0, 7); ctx.fill();
  }
  // mouth
  const my = top + bodyH * 0.68;
  if (cfg.mouth === 2) {                               // big open mouth
    ctx.fillStyle = '#3b0a0a'; ctx.beginPath(); ctx.ellipse(fx, my, 6, 4.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#ff6f91'; ctx.beginPath(); ctx.ellipse(fx, my + 2.5, 3.5, 1.8, 0, 0, 7); ctx.fill();
  } else {
    ctx.strokeStyle = '#3b0a0a'; ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.arc(fx, my - 3, 5, 0.25, Math.PI - 0.25); ctx.stroke();
    if (cfg.mouth === 1) {                             // two little fangs
      ctx.fillStyle = '#fff';
      for (const sd of [-1, 1]) { ctx.beginPath(); ctx.moveTo(fx + sd * 3.6 - 1.5, my - 0.6); ctx.lineTo(fx + sd * 3.6 + 1.5, my - 0.9); ctx.lineTo(fx + sd * 3.2, my + 3); ctx.closePath(); ctx.fill(); }
    }
  }
  ctx.fillStyle = 'rgba(255,128,171,.5)';              // rosy cheeks
  ctx.beginPath(); ctx.arc(fx - 9, my - 2, 2, 0, 7); ctx.arc(fx + 9, my - 2, 2, 0, 7); ctx.fill();
  ctx.restore();
  return y + h + top;
}

// Captain Pinch: a small friendly crab, same size box as Robo
function drawPinch(p, x, y, w, h) {
  const cx = x + w / 2, f = p.face || 1;
  if (p.hovering) {                                    // still has jet boots!
    const fl = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + fl); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }
  }
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5; ctx.lineCap = 'round';   // little legs
  const k = Math.abs(p.vx || 0) > 0.5 ? Math.sin(frame * 0.4) * 2 : 0;
  for (const s of [-1, 1]) for (let i = 0; i < 2; i++) {
    ctx.beginPath(); ctx.moveTo(cx + s * (5 + i * 4), y + h * 0.78);
    ctx.lineTo(cx + s * (11 + i * 4), y + h - 1 + (i ? k : -k)); ctx.stroke();
  }
  const wave = Math.sin(frame * 0.12) * 0.25;
  for (const s of [-1, 1]) {                           // claws up high
    ctx.strokeStyle = gc('#d32f2f', '#ff8f00'); ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(cx + s * w * 0.32, y + h * 0.6); ctx.lineTo(cx + s * w * 0.5, y + h * 0.38); ctx.stroke();
    ctx.fillStyle = gc('#ff5252', '#ffd740');
    ctx.beginPath(); ctx.arc(cx + s * w * 0.52, y + h * 0.3, 6, 0, 7); ctx.fill();
    ctx.fillStyle = '#1a0b2e';                         // claw pinch gap
    ctx.beginPath(); ctx.moveTo(cx + s * w * 0.52, y + h * 0.3);
    ctx.arc(cx + s * w * 0.52, y + h * 0.3, 6.5, -Math.PI / 2 - 0.35 - wave, -Math.PI / 2 + 0.35 + wave); ctx.fill();
  }
  ctx.fillStyle = gc('#ff1744', '#ffb300');           // round shell body
  ctx.beginPath(); ctx.ellipse(cx, y + h * 0.66, w * 0.46, h * 0.24, 0, 0, 7); ctx.fill();
  if (goldDraw) { ctx.save(); ctx.clip(); goldShine(cx - w * 0.46, y + h * 0.42, w * 0.92, h * 0.48); ctx.restore(); }
  ctx.fillStyle = 'rgba(255,255,255,.3)';
  ctx.beginPath(); ctx.ellipse(cx - f * 5, y + h * 0.58, 5, 3, -0.4, 0, 7); ctx.fill();
  ctx.fillStyle = '#ff8a80';                           // rosy cheeks
  ctx.beginPath(); ctx.arc(cx - 8, y + h * 0.7, 2.5, 0, 7); ctx.arc(cx + 8, y + h * 0.7, 2.5, 0, 7); ctx.fill();
  ctx.strokeStyle = '#4a0000'; ctx.lineWidth = 1.8;    // smile
  ctx.beginPath(); ctx.arc(cx + f * 1, y + h * 0.68, 4, 0.2, Math.PI - 0.2); ctx.stroke();
  ctx.strokeStyle = gc('#b71c1c', '#ff8f00'); ctx.lineWidth = 2.5;    // eye stalks
  ctx.beginPath(); ctx.moveTo(cx - 5, y + h * 0.5); ctx.lineTo(cx - 6, y + h * 0.3);
  ctx.moveTo(cx + 5, y + h * 0.5); ctx.lineTo(cx + 6, y + h * 0.3); ctx.stroke();
  const blink = frame % 180 < 6 ? 1 : 4;
  for (const ex of [cx - 6, cx + 6]) {
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, y + h * 0.3, 4.5, blink + 0.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + f * 1.5, y + h * 0.31, Math.min(2.2, blink / 2 + 0.3), 0, 7); ctx.fill();
  }
  ctx.fillStyle = '#ffd740';                           // tiny captain hat, just like the big boss
  ctx.strokeStyle = '#1b1b2f'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.rect(cx - 7, y - 4, 14, 6); ctx.fill(); ctx.stroke();
  ctx.fillRect(cx - 9 + f * 2, y + 1, 18, 2.5);
  ctx.fillStyle = '#1565c0'; ctx.fillRect(cx - 7, y - 1, 14, 2);
  ctx.lineCap = 'butt';
}

function drawRocket(f) {
  if (bossState !== 'defeated') return;                 // rocket only comes after the boss is beaten
  const lift = state === 'levelDone' ? timer * timer * 0.04 : 0;
  const x = f.x, y = f.y - lift - f.drop;
  if (lift > 0 || f.drop > 0 || frame % 6 < 3) {        // engine flame
    const fl = lift > 0 || f.drop > 0 ? 30 + Math.random() * 20 : 6;
    ctx.fillStyle = '#ffab40';
    ctx.beginPath(); ctx.moveTo(x - 12, y - 6); ctx.lineTo(x, y + fl); ctx.lineTo(x + 12, y - 6); ctx.fill();
  }
  ctx.fillStyle = '#ff5252';                           // fins

// 🎠 Captain Carousel: a merry-go-round robot with a striped tent hat. Its tells: wiggles + flashes red + ❗ before a dash,

  ctx.restore();

function draw() {
  const L = LEVELS[Math.min(levelIndex, LEVELS.length - 1)];
  if (state === 'title') {
    drawBackground(LEVELS[0]);
    const bob = Math.sin(frame * 0.06) * 10;
    text('ROBO JUMP!', W / 2, 190 + bob, 90, '#7df9ff');
    if (MID) midTitle(bob);                            // 🌙 Midnight Edition + badge
    text('Collect coins ⭐ Bop the aliens ⭐ Fly home in the rocket!', W / 2, 270, 26);
    if (Math.floor(frame / 30) % 2) text('Press SPACE to play!', W / 2, 360, 40, '#69f0ae');
    text('← → move    SPACE jump    Hold SPACE to hover    M music', W / 2, 450, 24);
    text('🤫 Psst... there is a SECRET hiding somewhere up high!', W / 2, 495, 18, '#ffd740');
    drawLookPicker();
    if (newOpen()) {                                   // 🚀 the 3 new places (after beating Mothership Max)
      const b = NEWW_BTN; roundRect(b.x, b.y, b.w, b.h, 16, frame % 60 < 30 ? '#7c4dff' : '#651fff');
      text('🚀 NEW PLACES! (P)', b.x + b.w / 2, b.y + 31, 22, '#fff59d');
    }
    drawNewBtn();
    return;
  }
  if (state === 'win') {
    const nw = winKind === 'new';
    drawBackground(LEVELS[nw ? LEVELS.length - 1 : MAIN_LEVELS - 1]);
    ctx.save(); ctx.translate(-camX, 0); drawParticles(); ctx.restore();
    const bob = Math.sin(frame * 0.08) * 10;
    text(nw ? 'NEW PLACES DONE!! 🎪' : 'YOU WIN!! 🎉', W / 2, (nw ? 190 : 170) + bob, nw ? 68 : 90, '#ffd740');
    text(`You got ${totalCoins} coins!`, W / 2, nw ? 260 : 240, 36);
    if (nw) {
      text('You beat Captain Carousel! 🎠', W / 2, 310, 30, '#7df9ff');
      if (Math.floor(frame / 30) % 2) text('Press SPACE to go back to the start', W / 2, 372, 30, '#69f0ae');
    } else {
      text('🚀 3 NEW PLACES are open! 🫧 🔧 🎪', W / 2, 292, 30, '#7df9ff');
      if (Math.floor(frame / 30) % 2) text('Press SPACE to fly there!', W / 2, 350, 32, '#69f0ae');
      const b = L1_BTN; roundRect(b.x, b.y, b.w, b.h, 14, 'rgba(10,12,40,.7)');
      text('🔁 Play Level 1 again (L)', b.x + b.w / 2, b.y + 27, 18, '#fff');
      drawSecretCode('🌙 ⭐ 🔺 🟣');
    }
    if (MID) midWin();                                 // 🌙 Robo tucked into bed
    return;
  }

  drawBackground(L);
  ctx.save();
  ctx.translate(-Math.round(camX) + (shake ? (Math.random() - .5) * shake : 0), shake ? (Math.random() - .5) * shake : 0);
  drawTiles(MID ? midLevel(L) : L);
  for (const s of spikes) drawSpikes(s);
  for (const s of springs) drawSpring(s);
  for (const m of movers) drawMover(m, MID ? midLevel(L) : L);
  for (const b of pops) drawPop(b, L.pop);
  if (checkpoint) drawBeacon(checkpoint);
  if (portal) {
    const px = portal.x + portal.w / 2, py = portal.y + portal.h / 2;
    for (let k = 4; k >= 1; k--) { ctx.beginPath(); ctx.ellipse(px, py, 8 + k * 6 + Math.sin(frame * 0.1 + k) * 2, 12 + k * 7, 0, 0, Math.PI * 2); ctx.fillStyle = ['#fff', '#e040fb', '#7c4dff', '#40c4ff'][k - 1] + '99'; ctx.fill(); }
    for (let k = 0; k < 5; k++) { const a = frame * 0.05 + k * 1.26; ctx.fillStyle = '#ffd740'; ctx.fillRect(px + Math.cos(a) * 30 - 2, py + Math.sin(a) * 38 - 2, 4, 4); }
  }
  drawRocket(flag);

  if (gKey) drawGoldKey(gKey);
  for (const c of coins) if (!c.got) drawCoin(c.x, c.y + Math.sin(frame * 0.05 + c.x) * 3, frame * 0.08 + c.x);
  for (const e of enemies) drawEnemy(e);
  drawPlayer(player);
  drawParticles();
  if (MID) midBossBye();                               // 🌙 "time for bed!" + the Midnight trophy
  ctx.restore();
  if (MID) midFireflies();

  // HUD
  if (boss) {
    text(boss.name, W / 2, 74, 22, '#ff8a80');
    roundRect(W / 2 - 150, 84, 300, 16, 8, 'rgba(0,0,0,.5)');
    if (boss.hp > 0) roundRect(W / 2 - 148, 86, 296 * boss.hp / boss.maxHp, 12, 6, '#ff1744');

  drawCoin(W - 140, 32, frame * 0.08);
  text(`x ${totalCoins}`, W - 118, 42, 30, '#ffd740', 'left');
  text(musicOn ? '♪ M' : '♪ off', W - 20, H - 16, 18, '#fff', 'right');
  if (keyBanner > 0) { const kw = keyCount >= 5 ? 340 : 250; roundRect(W / 2 - kw, 300, kw * 2, 54, 16, 'rgba(60,40,0,.75)'); text(keyCount >= 5 ? '🔑 ALL 5 KEYS! Open the Secret Door in the book! ✨' : `🔑 SECRET KEY! You found ${keyCount} of 5!`, W / 2, 338, keyCount >= 5 ? 22 : 30, '#ffd740'); }
  if (stickerNew > 0) { roundRect(W / 2 - 170, 140, 340, 48, 16, 'rgba(80,0,90,.75)'); text('⭐ NEW STICKER! ⭐', W / 2, 175, 30, '#ffea00'); }
  if (helpTimer > 0) text(L.tip || 'Hold SPACE in the air to hover with your jet boots!', W / 2, 100, 24);
  if (state === 'levelDone') {

    text(`You found ${levelCoins} coins in this level!`, W / 2, 290, 30);
    if (timer > 60) text('Press SPACE for the next level', W / 2, 350, 28, '#69f0ae');
  }
}

// 🎬 Replay Studio hooks (see the RS script at the top)
RS.hooks = {
  ctx: () => ({ frame, levelIndex, totalCoins, secretBack, look, monsterHat, goldOn, keyCount }),
  setCtx: c => { frame = c.frame; levelIndex = c.levelIndex; totalCoins = c.totalCoins; secretBack = c.secretBack; look = c.look; monsterHat = c.monsterHat; goldOn = c.goldOn; keyCount = c.keyCount; },
  st: () => RS.snap(['gfBundles', 'gfGold', 'gfKeys', 'gfLooks', 'gfGhost', 'gfMonster']),
  start: lv => loadLevel(lv),
  post: () => ({ frame, camX, bossBanner, bannerText, helpTimer, levelIndex }),
  setPost: p => { frame = p.frame; camX = p.camX; bossBanner = p.bossBanner; bannerText = p.bannerText; helpTimer = p.helpTimer; levelIndex = p.levelIndex; },
  getIn: () => (keys.left ? 1 : 0) | (keys.right ? 2 : 0) | (keys.jump ? 4 : 0) | (jumpPressed ? 8 : 0),
  setIn: m => { keys.left = !!(m & 1); keys.right = !!(m & 2); keys.jump = !!(m & 4); jumpPressed = !!(m & 8); },
  pos: () => player ? Math.round(player.x) + ',' + Math.round(player.y) : '',
  alive: () => state === 'play' || state === 'dying' || state === 'levelDone',
  won: () => state === 'levelDone' || state === 'win',
  label: () => (LEVELS[levelIndex] && (LEVELS[levelIndex].fresh ? '🆕 ' : '') + LEVELS[levelIndex].name) || 'Level ' + (levelIndex + 1),
  wake: () => { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } else if (actx.resume) actx.resume(); },
};
RS.boot();

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last) * RS.speed; last = now;
  while (acc >= 1000 / 60) { if (RS.tick()) { try { update(); } finally { RS.after(); } } acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
