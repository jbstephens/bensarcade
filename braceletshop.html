  const p = PR(k), box = $('revIn'); box.innerHTML = ''; box.appendChild(el('div', 'h2', '⭐ Reviews: ' + p.name));
  p.revs.forEach(r => box.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`)));
  const c = el('button', 'bigbtn', '👍 OK!'); c.style.marginTop = '10px'; c.style.width = '100%'; c.onclick = closeReviews; box.appendChild(c);
  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what my friends say!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const Lst = el('div', 'list'); m.appendChild(Lst); Lst.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) { Lst.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; Lst.appendChild(b); return; }
  for (const k of S.cart) {
    const line = el('div', 'line'); line.appendChild(thumb(k));
    line.appendChild(el('div', 'nm', PR(k).name + '<small>' + PR(k).size + (k === DEAL ? '  •  🔥 half price!' : '') + '</small>'));
    line.appendChild(el('div', 'pr', SHOP.coin + ' ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); Lst.appendChild(line);
  }
  const t = el('div', 'total'), g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? '' + SHOP.yay + '! Gift wrap! Who is it for?' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g);
  if (S.gift) for (const nm of GIFT_NAMES) { const b = el('button', 'gift' + (S.giftTo === nm ? ' on' : ''), nm); b.style.padding = '8px 10px'; b.onclick = () => { S.giftTo = nm; save(); sfx.click(); say('A gift for ' + nm + '! So kind, Ben!'); render(); }; t.appendChild(b); }
  t.appendChild(el('span', '', 'TOTAL: ' + SHOP.coin + ' ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go); Lst.appendChild(t);
}
function checkout() {
  if (!S.cart.length) return; const tot = cartTotal();
  if (tot > S.coins) { sfx.soft(); say('' + SHOP.yay + '! Not enough ' + SHOP.money.toLowerCase() + '! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.coins -= tot; for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, to: S.giftTo, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop(); startShip(count);
}
function moreCoins() {
  S.coins += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['' + SHOP.yay + '! Here are 500 more ' + SHOP.money.toLowerCase() + '!', 'Ka-ching! 500 more! Pretend money is the best!', '' + SHOP.yay + '! More ' + SHOP.money.toLowerCase() + ' for Ben!']));
}
// 🚚 delivery: Robo 2.0 hops over with a box, then ORDER CONFIRMED
let shipOn = false, shipDone = false, shipTimer = 0;
function startShip(count) {
  shipOn = true; shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.zap();
  $('shipArt').innerHTML = uiSVG('0 0 960 540', () => {
    let s = SHOP.shipBg();
    s += '<g class="walkR"><g class="hopG">' + who(SHOP.keeper, 150, 344, 2) + G(150, 232, 1, R(-60, -80, 120, 80, 6, vshade('#d7a86e'), OL, 3) + R(-10, -80, 20, 80, 0, '#00e676', OL, 1.4) + T(0, -30, String(count), 30, '#fff', 'middle', ' stroke="' + OL + '" stroke-width="1.5"')) + '</g></g>';
    s += '<g id="okStamp" style="display:none"><g class="confirm">' + R(230, 120, 500, 150, 30, '#00c853', OL, 5) + T(480, 185, 'ORDER', 52, '#fff') + T(480, 245, 'CONFIRMED!', 52, '#fff') + '</g></g>';
    return s;
  });
  say(SHOP.shipLine);
  clearTimeout(shipTimer);
  shipTimer = setTimeout(() => { const ok = document.getElementById('okStamp'); if (ok) ok.style.display = ''; shipDone = true; $('shipGo').style.display = ''; sfx.cash(); say('ORDER CONFIRMED! ' + SHOP.yay + '! Go to MY ORDERS and print the ones you want.'); }, 3400);
}
function closeShip() { if (!shipOn) return; shipOn = false; clearTimeout(shipTimer); $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const Lst = el('div', 'list'); m.appendChild(Lst); Lst.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) { Lst.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; Lst.appendChild(b); return; }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); Lst.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    const p = PR(o.k); if (!p) continue; const np = p.pages().length + (o.gift ? 1 : 0);
    const line = el('div', 'line'); line.appendChild(thumb(o.k));
    line.appendChild(el('div', 'nm', p.name + `<small>Order #${o.n}${o.gift ? '  •  🎁 for ' + o.to : ''}  •  ${np} page${np > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); Lst.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT. COLOR or BLACK + WHITE.
let printList = [];
function printPagesFor(list, line) {
  const out = [];
  for (const o of list) { const p = PR(o.k); if (!p) continue; CUR = { name: o.gift ? o.to : 'Ben', n: o.n }; if (o.gift) out.push(sheet(() => giftPage(o.to), line)); p.pages().forEach(f => out.push(sheet(f, line))); }
  return out;
}
function fillPrint() {
  if (!printBox) return; printBox.querySelectorAll('.pbPage').forEach(e => e.remove());
  const pages = printPagesFor(printList, printMode === 'line');
  for (const svg of pages) { const d = el('div', 'pbPage'); d.innerHTML = svg; printBox.appendChild(d); }
  printBox.querySelector('.pbPrint').textContent = pages.length > 1 ? `🖨️ PRINT (${pages.length} pages)` : '🖨️ PRINT';
  printBox.querySelectorAll('.pbMode').forEach(b => b.classList.toggle('on', b.dataset.m === printMode));
}
function openPrint(list) {
  closePrint(true); printList = list.filter(o => PR(o.k)); if (!printList.length) return;
  const name = printList.length === 1 ? PR(printList[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', '🖨️ PRINT');
  const mc = el('button', 'pbMode', '🎨 COLOR'), mb = el('button', 'pbMode', '⚫ BLACK + WHITE'); mc.dataset.m = 'color'; mb.dataset.m = 'line';
  mc.onclick = () => { printMode = 'color'; sfx.click(); fillPrint(); }; mb.onclick = () => { printMode = 'line'; sfx.click(); fillPrint(); say('Black and white! Now you can color it in yourself.'); };
  back.onclick = () => closePrint();
  pr.onclick = () => {
    sfx.click();
    for (const o of printList) { const p = PR(o.k); (p.mega ? PRODUCTS.filter(q => !q.mega).map(q => q.k) : [o.k]).forEach(k => { if (!S.printedKeys.includes(k)) S.printedKeys.push(k); }); }
    save(); if (S.printedKeys.length >= 3) trophy(SHOP.trophy);
    say('' + SHOP.yay + '! Printing! Ask a grown-up to help with the printer. Pick ACTUAL SIZE, 100 percent!');
    setTimeout(() => { try { window.print(); } catch (_) {} }, 80);
  };
  bar.append(back, mc, mb, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  📏 Print at 100% (Actual size)  •  ' + SHOP.tip));
  document.body.appendChild(printBox); fillPrint();
  sfx.click(); say(printList.length === 1 ? 'Here it is! Tap PRINT if you want it on paper.' : 'Here are all your orders! Tap PRINT when you are ready.');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipOn && shipDone) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((k === 'p' || k === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (k === 'Enter') { if (shipOn && shipDone) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (printBox || shipOn) return;
  else if (k === '1') { sfx.click(); show('shop'); } else if (k === '2') { sfx.click(); show('cart'); } else if (k === '3') { sfx.click(); show('orders'); }
});
document.title = SHOP.title; $('who').textContent = CAST[SHOP.keeper][0]; if (SHOP.css) { const st = document.createElement('style'); st.textContent = SHOP.css; document.head.appendChild(st); } $('url').innerHTML = '🔒 <b>' + SHOP.url + '</b>' + SHOP.urlSide; $('logoBig').innerHTML = SHOP.logo; $('slogan').textContent = SHOP.slogan;
$('moneyLbl').textContent = 'MY ' + SHOP.money; $('moreBucks').textContent = SHOP.coin + ' Get more';
document.documentElement.setAttribute('style', SHOP.theme);
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! ' + SHOP.yay + '!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreCoins; $('shipGo').onclick = closeShip;
$('helper').onclick = () => { sfx.click(); say(pick(SHOP.jokes)); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); CAT = 'all'; show('shop');
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price! ' + SHOP.yay + '!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
window.addEventListener('afterprint', () => { if (printBox) fillPrint(); });
drawHelper(); render();
$('bubble').textContent = S.orders.length ? SHOP.back : SHOP.hi;
</script>
</body>
