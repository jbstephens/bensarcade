<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>💌 A Letter From Ben</title>
<script>window.GF_NOSWAP = true;   // this page is about the real Ben, so it never swaps in another player's name</script>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 15%, #ffffff55 0 6px, transparent 7px) 0 0 / 70px 70px,
      radial-gradient(circle at 70% 60%, #ffffff44 0 4px, transparent 5px) 0 0 / 52px 52px,
      linear-gradient(160deg, #ff8fc8, #ffb36b 45%, #8fd3ff);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  /* ---------- lobby ---------- */
  #lobby { flex-direction: column; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 1; padding-bottom: 30px; }
  #lHead { text-align: center; padding: 10px 10px 0; position: relative; }
  #lHead h1 { margin: 0; font-size: clamp(30px, 6vw, 62px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff3d6e, 8px 8px 0 #5c6bc0; letter-spacing: 2px; }
  #lHead p { margin: 6px 0 4px; font-size: clamp(16px, 2.3vw, 23px); font-weight: bold; }
  .idea { background: #fff59d; border: 3px solid #333; border-radius: 12px; padding: 0 8px; white-space: nowrap; display: inline-block; }
  #heroes { display: block; margin: 0 auto; width: min(560px, 92vw); height: auto; }
  #rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; padding: 8px 18px; }
  .room { border: 5px solid #333; border-radius: 24px; padding: 12px 12px 10px; cursor: pointer; color: #fff; position: relative;
    box-shadow: 0 7px 0 #333; transition: transform .1s; min-height: 150px; display: flex; flex-direction: column; gap: 4px; }
  .room:active { transform: translateY(5px); box-shadow: 0 2px 0 #333; }
  .room.sel { outline: 6px solid #fff; outline-offset: 2px; transform: rotate(-1deg) scale(1.03); }
  .room .ic { font-size: 50px; line-height: 1; }
  .room b { font-size: 24px; -webkit-text-stroke: 1px #333; text-shadow: 2px 2px 0 #333; }
  .room i { font-style: normal; font-size: 16px; font-weight: bold; background: rgba(255,255,255,.88); color: #333;
    border-radius: 12px; padding: 3px 8px; }
  .room .seen { position: absolute; left: 76px; top: 14px; font-size: 28px; }
  .room .cnt { position: absolute; right: 10px; top: 10px; font-size: 14px; background: #333; color: #fff; border-radius: 10px; padding: 1px 8px; }
  /* ---------- room ---------- */
  #room { flex-direction: row; gap: 10px; padding: 10px; z-index: 1; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #c2185b; }
  #soon { position: absolute; inset: 0; background: #fffdf3; border: 5px dashed #333; border-radius: 24px; display: flex;
    flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px; gap: 10px; }
  #soonPic { width: 70%; max-width: 420px; }
  #soon svg { position: static; width: 100%; height: auto; border: none; box-shadow: none; background: none; }
  #soon h2 { margin: 0; font-size: clamp(22px, 3.4vw, 38px); }
  #soon p { margin: 0; font-size: clamp(16px, 2.2vw, 24px); font-weight: bold; color: #555; }
  #side { width: min(42vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #rTitle { font-size: 26px; font-weight: bold; text-align: center; color: #fff; -webkit-text-stroke: 1px #333; text-shadow: 2px 2px 0 #333;
    border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #rHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pager { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; align-items: center; }
  #pNum { font-size: 20px; font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 8px 12px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn:disabled { opacity: .45; }
  .hide { display: none !important; }
  .b-nav { background: #fff; font-size: 26px; }
  .b-back { background: #9be3ff; }
  .b-print { background: #8ef08e; font-size: 22px; }
  .b-all { background: #c3a6ff; }
  .b-music { background: #ffe0f0; font-size: 16px; min-height: 44px; }
  #lHead .b-music { position: absolute; right: 10px; top: 8px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (max-width: 760px) { #lHead .b-music { position: static; margin-bottom: 4px; } }
  @media (orientation: portrait) {
    #room { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 42vh; }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px; } #rHelp { font-size: 15px; } }
  /* ---------- PRINT: only the page (or every page of a room) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#room):not(#printAll) { display: none !important; }
    body.pAll #room { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #room { display: block !important; position: static; padding: 0; }
    #side, #toast, #soon { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>

</div>

  [69, 1], [72, 1], [76, 1], [74, 1], [72, 1], [69, 1], [67, 2], [65, 1], [67, 1], [69, 1], [71, 1], [72, 3], [0, 1]];
