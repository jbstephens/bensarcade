<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎬 Sammy: Mission Moon: Trailer</title>
<script src="touchpad.js?v=11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Arial Rounded MT Bold", "Chalkboard SE", "Comic Sans MS", system-ui, sans-serif; color: #fff; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #gl, #cv { position: absolute; display: block; touch-action: none; }
  #gl { background: #000; }
  .btn { font: inherit; font-weight: 900; border: 4px solid #1b1b2f; border-radius: 999px; cursor: pointer; color: #1b1b2f;
    background: linear-gradient(#fff59d, #ffca28); box-shadow: 0 6px 0 #1b1b2f; padding: 10px 22px; font-size: 24px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #1b1b2f; }
  /* ▶ start screen */
  #start { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    background: radial-gradient(circle at 50% 40%, rgba(40,30,110,.45), rgba(0,0,10,.9)); z-index: 5; padding: 16px; }
  #start h1 { margin: 0; font-size: clamp(30px, 7vw, 72px); line-height: 1.05; color: #fff59d; text-shadow: 0 5px 0 #4a148c, 0 0 26px rgba(255,235,59,.55); }
  #start h1 small { display: block; font-size: .42em; color: #b3e5fc; text-shadow: 0 3px 0 #1a237e; margin-top: 8px; }
  #start p { margin: 0; font-size: clamp(16px, 2.6vw, 24px); color: #e8eaf6; }
  #playBig { font-size: clamp(30px, 6vw, 56px); padding: 16px 48px; background: linear-gradient(#fff59d, #ffb300); }
  #playBig[disabled] { opacity: .6; }
  /* ⏸ control bar */
  #bar { position: fixed; left: 50%; bottom: 12px; transform: translateX(-50%); display: none; gap: 10px; align-items: center; z-index: 4;
    background: rgba(15,10,40,.72); border: 3px solid rgba(179,229,252,.6); border-radius: 999px; padding: 8px 14px; transition: opacity .5s; }
  #bar.show { display: flex; }
  #bar.dim { opacity: .25; }
  #bar .btn { font-size: 26px; padding: 6px 14px; min-width: 64px; }
  #vol { width: clamp(90px, 18vw, 180px); height: 34px; accent-color: #ffd54f; }
  #bar label { font-size: 26px; display: flex; align-items: center; gap: 6px; }
  #pauseNote { position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: clamp(40px, 9vw, 96px); font-weight: 900; display: none; z-index: 3;
    color: #fff; text-shadow: 0 5px 0 #1b1b2f, 0 0 30px rgba(0,0,0,.8); pointer-events: none; text-align: center; }
  #pauseNote small { display: block; font-size: .3em; }
  /* 🎬 end screen */
  #end { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 6; padding: 16px;
    background: rgba(10,5,35,.8); text-align: center; overflow-y: auto; }
  #end.show { display: flex; }
  #end h2 { margin: 0; font-size: clamp(26px, 5vw, 48px); color: #fff59d; text-shadow: 0 4px 0 #4a148c; }
  #ideaBox { background: #fffde7; color: #3e2723; border: 5px solid #1b1b2f; border-radius: 26px; padding: 14px 18px; width: min(640px, 100%); box-shadow: 0 8px 0 #1b1b2f; }
  #ideaBox h3 { margin: 0 0 8px; font-size: clamp(20px, 3.4vw, 30px); }
  #ideaRow { display: flex; gap: 8px; }
  #idea { flex: 1; min-width: 0; font: inherit; font-size: 22px; padding: 10px 14px; border: 4px solid #1b1b2f; border-radius: 16px; }
  #ideaSave { font-size: 22px; background: linear-gradient(#b3e5fc, #40c4ff); }
  #ideaList { list-style: none; margin: 10px 0 0; padding: 0; max-height: 26vh; overflow-y: auto; text-align: left; font-size: 20px; }
  #ideaList li { background: #fff; border: 3px solid #b39ddb; border-radius: 14px; padding: 6px 10px; margin: 6px 0; }
  #ideaMsg { min-height: 26px; font-size: 20px; color: #4527a0; margin-top: 6px; }
</style>
</head>
<body>
<div id="stage"><canvas id="gl"></canvas><canvas id="cv" width="1280" height="720"></canvas></div>
<div id="start">
  <h1>🎬 SAMMY: MISSION MOON 🌙<small>✨ The Official Trailer ✨</small></h1>
  <p>🚀 Turn your sound on (not too loud!) and get ready...</p>
  <button class="btn" id="playBig" disabled>⏳ Loading...</button>
</div>
<div id="pauseNote">⏸ PAUSED<small>Tap to keep watching!</small></div>
<div id="bar">
  <button class="btn" id="bPlay" aria-label="Pause">⏸</button>
  <button class="btn" id="bReplay" aria-label="Replay">🔁</button>
  <button class="btn" id="bSkip" aria-label="Skip scene">⏭</button>
  <label>🔊 <input type="range" id="vol" min="0" max="100" value="55" aria-label="Volume"></label>
</div>
<div id="end">
  <h2>🌙 Thanks for watching! 🐱🚀</h2>
  <button class="btn" id="bAgain" style="font-size:30px">🔁 Watch again</button>
  <div id="ideaBox">
    <h3>💡 What should be in the game?</h3>
    <div id="ideaRow"><input id="idea" type="text" maxlength="160" placeholder="Type your idea here!" autocomplete="off"><button class="btn" id="ideaSave">💾 Save</button></div>
    <div id="ideaMsg"></div>
    <ul id="ideaList"></ul>
  </div>
</div>
<script>
'use strict';
// =====================================================================
// 🎬 SAMMY: MISSION MOON: the trailer (the game comes later!)
// Sammy (a brown tabby with black stripes and YELLOW eyes) has to save Jimmy, Rocky and Mimo from the Moon.
// Real 3D scenes (three.js r128) + a 2D canvas on top for the words. The music engine is copied from
// forgottenworldtrailer.html (the Robo Jump album engine); the song "Moon Paws March" is new.
// =====================================================================
function trophy(id) { if (window.JUKEBOX) return; try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const $ = id => document.getElementById(id);
// =====================================================================
// 🎵 THE MUSIC ENGINE (copied from forgottenworldtrailer.html, unchanged)
// =====================================================================
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = false, trailerVol = 0.55;                // the 🔊 slider: 0..1 of the album's loudest setting
const musicVol = () => 0.75 * trailerVol;              // 0.75 = the album's 🔊 (so this is never louder than the album)
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicVol(); musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell' || kind === 'marimba' || kind === 'keys') {   // hit-and-ring voices (steel drum, bell, marimba, electric piano)
    const mar = kind === 'marimba', keys = kind === 'keys';
    g = envGain(t, 0.004, vol * (mar ? 1.3 : 1), mar ? 0.06 : keys ? 0.55 : 0.25, Math.min(dur, mar ? 0.25 : keys ? 1.4 : 0.6), mar ? 0.18 : 0.25, out);
    const parts = { steel: [[1, 1], [2, 0.35], [3.01, 0.12]], marimba: [[1, 1], [3.93, 0.22], [9.4, 0.04]], keys: [[1, 1], [2, 0.22], [3.01, 0.06], [0.5, 0.15]] }[kind]
      || [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else if (kind === 'choir') {                       // 🎤 a choir singing "aah" (the pad's formant trick, as a melody voice)
    g = envGain(t, 0.06, vol * 1.6, 0.85, dur, 0.18, out);
    const src = actx.createGain(); src.gain.value = 0.5;
    const o1 = osc('sawtooth', f, t, end, -8), o2 = osc('sawtooth', f, t, end, 8), o3 = osc('sawtooth', f, t, end, 0);
    o1.connect(src); o2.connect(src); o3.connect(src);
    for (const [ff, q, v] of [[730, 5, 1], [1090, 6, 0.6], [2440, 7, 0.3]]) {
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
      const bg = actx.createGain(); bg.gain.value = v * 2; src.connect(bp); bp.connect(bg); bg.connect(g);
    }
    const lfo = osc('sine', 5, t, end), lg = actx.createGain(); lg.gain.value = f * 0.007; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency); lg.connect(o3.frequency);
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out, att) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, att || (kind === 'choir' ? 0.35 : 0.22), vol, 0.85, dur, 0.5, out);   // att: a long attack = a pad that SWELLS
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'marimba') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.2; osc('sine', f * 3.93, t, end).connect(g2); g2.connect(g); }
  else if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  } else if (kind === 'g') {                           // 👾 glitch blip: a tiny jumpy square-wave chirp
    const f0 = 700 + (Math.floor(t * 1000) % 7) * 260, o = osc('square', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.setValueAtTime(f0 * 1.5, t + 0.02); o.frequency.setValueAtTime(f0 * 0.75, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.setValueAtTime(vol, t + 0.045); g.gain.linearRampToValueAtTime(0, t + 0.055);
    o.connect(g); g.connect(out);
  }
}
// ⏰ NEW drums for Robo Jump 7: w = clock TICK, q = clock TOCK (wood blocks), j = finger cymbals (Pyramid Moon)
function drumX0(kind, t, vol, out) {
  if (kind === 'w' || kind === 'q') {
    const f0 = kind === 'w' ? 2100 : 1250, o = osc('triangle', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.001); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g); g.connect(out);
    noiseHit(t, 'bandpass', f0 * 1.5, 6, vol * 0.4, 0.02, out);
  } else if (kind === 'j') {
    for (const [f, v] of [[2637, 1], [3951, 0.5], [5274, 0.25]]) {
      const o = osc('sine', f, t, t + 0.5), g = actx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g); g.connect(out);
    }
  } else drumHit(kind, t, vol, out);
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar, "4/5" = two per bar): degree number, M = make it major, m = minor, b = flat root (bVII), 7 = add the 7th.
// 🔒 NEW drums for Robo Jump 8: n = CHAIN RATTLE (clanky metal links), y = KEY JINGLE (a ring of little keys)
function drumX(kind, t, vol, out) {
  if (kind === 'n') {                                  // ⛓️ a quick shake of metal links: 4 tiny clinks + a low clank
    for (let i = 0; i < 4; i++) noiseHit(t + i * 0.018, 'bandpass', 3200 + ((i * 977) % 1700), 9, vol * (1 - i * 0.18), 0.035, out);
    const o = osc('square', 410, t, t + 0.08), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.25, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g); g.connect(out);
  } else if (kind === 'y') {                           // 🔑 jingle jingle: little bell pings that land a hair apart
    for (let i = 0; i < 5; i++) {
      const f = [4186, 5274, 4699, 5920, 4435][i], tt = t + i * 0.012, o = osc('sine', f, tt, tt + 0.25), g = actx.createGain();
      g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(vol * (1 - i * 0.12), tt + 0.002); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.22);
      o.connect(g); g.connect(out);
    }

// 🏁 the big finish: everyone together on the Moon, the 3D title, COMING SOMEDAY
const LINE = [['rocky', -3.2], ['jimmy', -1.6], ['sammy', 0], ['mimo', 1.6]];

// =====================================================================
// 🎞️ THE TIMELINE: every scene starts on a bar line of the song

const SCENES = [[0, sIntro], [2, sBackyard], [10, sWindow], [12, sTitle], [16, sLaunch], [20, sJump], [23, sCraters], [25, sBuggy], [27, sCheese], [30, sEarth],
  [32, sRescue], [36, sPowers], [44, sBoss], [48, sMontage], [54, sFinale]].map(([b, f], i, a) => ({ start: b * BAR, end: (a[i + 1] ? a[i + 1][0] : 60) * BAR, f, name: f.name }));
const TOTAL = 60 * BAR + 1.6;                            // the last chord rings a moment, then the end screen
SCENES[SCENES.length - 1].end = TOTAL;
function sceneAt(T) { for (let i = SCENES.length - 1; i >= 0; i--) if (T >= SCENES[i].start) return i; return 0; }
function drawFrame(T) {
  const i = sceneAt(T), S = SCENES[i], t = T - S.start, d = S.end - S.start;

  X.fillStyle = 'rgba(0,0,0,.9)'; X.fillRect(0, 0, W, 26); X.fillRect(0, H - 26, W, 26);     // movie bars

// =====================================================================
// ▶️ THE PLAYER (from forgottenworldtrailer.html): the music's clock drives the pictures, so they stay in time with the song
// =====================================================================
let state = 'start', T = 0, anchor = 0, clkSrc = '', watched = 0, lastNow = 0, SECTIONS = [];
const SONG = compileSong('moon', SONG_DEFS.moon); SONGS.moon = SONG; song = 'moon';
SONG.bars.forEach((b, i) => { if (b.i === 0) SECTIONS.push({ part: b.f, bar: i, time: +(i * SONG.spb * stepDur(SONG)).toFixed(3) }); });
console.log('🎵 Moon Paws March sections:', SECTIONS.map(s => s.part + '@bar' + s.bar + '=' + s.time + 's').join('  '), ' total ' + SONG.secsLong.toFixed(2) + 's');
function wakeAudio() {

    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
  } catch (_) {}
}
function setVolume() {
  if (!actx || !musicBus) return;
  const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicVol(), t + 0.15);
}
function stopNotes() {                                   // fade the booked notes away (no pops)
  if (songOut && actx) { const g = songOut, t = actx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.25);

}
const audioOn = () => !!(actx && actx.state === 'running');
const clock = () => audioOn() ? actx.currentTime : performance.now() / 1000;
function startAt(t0) {                                   // play from t0 seconds

}

// ---------- the buttons ----------
let barTimer = 0;

// ---------- 💡 the idea box (saved for the real game later) ----------
