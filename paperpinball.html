<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎱 Paper Pinball</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #d9ecff 0 36px, #c4e0ff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff3d6e; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-score { background: #ffd54f; font-size: 22px; } .b-spin { background: #ffd54f; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🎱 the table designer ---------- */
  #home { flex-direction: row; gap: 10px; padding: 10px; }
  #homeLeft { width: 40%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #tablePrev { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #ff3d6e;
    display: flex; align-items: center; justify-content: center; overflow: hidden; padding: 6px; }
  #tablePrev svg { width: 100%; height: 100%; display: block; }
  #homeName { font-size: clamp(17px, 2.2vw, 25px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #homeRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #f0f7ff; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 100%; height: 96px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .opt.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slot { background: #f0f7ff; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  #homeHelp { font-size: 15px; text-align: center; color: #555; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff3d6e; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff3d6e; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- ⭐ scoreboard ---------- */
  #score { flex-direction: column; gap: 8px; padding: 8px; background: radial-gradient(circle at 50% 0%, #3b1a7a, #120a2e 75%); color: #fff; }
  #sbTop { display: flex; align-items: center; gap: 8px; }
  #sbTop .btn { min-height: 50px; font-size: 18px; }
  #sbTitle { flex: 1; min-width: 0; text-align: center; font-size: clamp(18px, 2.6vw, 30px); font-weight: bold; color: #ffe066;
    text-shadow: 0 0 10px #ff3d6e, 3px 3px 0 #000; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #sbMain { flex: 1; min-height: 0; display: flex; gap: 8px; }
  #sbLeft { width: 31%; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #dmd { background: #1a0d00; border: 5px solid #555; border-radius: 14px; padding: 6px 8px; text-align: center; color: #ffb300;
    font-size: clamp(16px, 2.2vw, 26px); font-weight: bold; text-shadow: 0 0 8px #ff8f00; min-height: 64px; display: flex; align-items: center; justify-content: center;
    font-family: "Courier New", monospace; letter-spacing: 1px; }
  #dmd.flash { animation: dflash .25s steps(2) 6; }
  @keyframes dflash { 50% { color: #fff; text-shadow: 0 0 14px #fff; } }
  #balls, #mults { display: flex; justify-content: center; gap: 6px; align-items: center; font-size: 18px; font-weight: bold; }
  .ballDot { width: 30px; height: 30px; border-radius: 50%; border: 3px solid #fff; background: #555; }
  .ballDot.on { background: radial-gradient(circle at 35% 30%, #fff, #c0c8d8 50%, #7a8499); }
  .ballDot.now { background: radial-gradient(circle at 35% 30%, #fff59d, #ffd600 50%, #ff8f00); box-shadow: 0 0 12px #ffd600; }
  .mult { padding: 4px 9px; border-radius: 12px; border: 3px solid #777; background: #2a2340; color: #776d99; font-size: 20px; }
  .mult.on { background: #ff3d6e; color: #fff; border-color: #fff; box-shadow: 0 0 14px #ff3d6e; }
  #plist { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .pcard { background: #2a2350; border: 4px solid #6d5fa8; border-radius: 14px; padding: 4px 10px; display: flex; justify-content: space-between; align-items: center; font-size: clamp(16px, 2vw, 22px); font-weight: bold; }
  .pcard.now { background: #ffe066; color: #222; border-color: #ff3d6e; box-shadow: 0 0 14px #ffe066; }
  .pcard small { font-size: 14px; opacity: .8; }
  #pads { flex: 1; min-width: 0; display: grid; grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(3, 1fr); gap: 8px; }
  .pad { font: inherit; font-weight: bold; border: 5px solid #fff; border-radius: 20px; cursor: pointer; color: #fff; padding: 4px;
    font-size: clamp(15px, 2vw, 22px); line-height: 1.1; box-shadow: 0 6px 0 rgba(0,0,0,.5); text-shadow: 2px 2px 0 rgba(0,0,0,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 0; }
  .pad:active, .pad.hit { transform: translateY(4px) scale(.97); box-shadow: 0 2px 0 rgba(0,0,0,.5); filter: brightness(1.35); }
  .pad .ic { font-size: clamp(24px, 3.6vw, 44px); }
  .pad.lit { box-shadow: 0 0 18px #fff, 0 6px 0 rgba(0,0,0,.5); border-color: #ffe066; }
  .pad.kbd { outline: 5px dashed #ffe066; outline-offset: 2px; }
  .p-bump { background: radial-gradient(circle, #ff6fa8, #c2185b); } .p-targ { background: linear-gradient(#42a5f5, #1565c0); }
  .p-z100 { background: linear-gradient(#66bb6a, #2e7d32); } .p-z500 { background: linear-gradient(#ffa726, #e65100); } .p-z1000 { background: linear-gradient(#ab47bc, #6a1b9a); }
  .p-flip { background: linear-gradient(#26c6da, #00838f); } .p-drain { background: linear-gradient(#ef5350, #8e0000); }
  .p-oops { background: linear-gradient(#90a4ae, #455a64); }
  #sbPanel { position: absolute; inset: 70px 8px 8px; background: rgba(18,10,46,.96); border: 5px solid #ffe066; border-radius: 22px; display: none;
    flex-direction: column; gap: 8px; padding: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; z-index: 5; }
  #sbPanel.on { display: flex; }
  #sbPanel h2 { margin: 0; text-align: center; color: #ffe066; font-size: clamp(20px, 3vw, 32px); }
  #sbPanel p { margin: 0; text-align: center; font-size: 18px; }
  .names { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .names .btn { font-size: 17px; padding: 4px; }
  .panelRow { display: grid; grid-template-columns: 1.2fr 1fr; gap: 10px; flex: 1; min-height: 0; }
  .hs { background: #2a2350; border: 4px solid #6d5fa8; border-radius: 14px; padding: 6px 10px; font-size: 17px; overflow-y: auto; }
  .hs table { width: 100%; border-collapse: collapse; } .hs td { padding: 2px 4px; } .hs td:last-child { text-align: right; color: #ffe066; }
  .hs tr.new td { color: #69f0ae; }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 40; display: flex; align-items: center; justify-content: center; }
  #fx b { font-size: clamp(40px, 9vw, 120px); color: #ffe066; -webkit-text-stroke: 4px #c2185b; text-shadow: 0 0 30px #ff3d6e; animation: zoom 1.2s ease-out forwards; }
  @keyframes zoom { from { transform: scale(.2) rotate(-12deg); opacity: 1; } 60% { transform: scale(1.15) rotate(3deg); opacity: 1; } to { transform: scale(1) ; opacity: 0; } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; color: #333; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 24px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #home, #view { flex-direction: column; }
    #homeLeft { width: 100%; height: 44vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #sbMain { flex-direction: column; } #sbLeft { width: 100%; max-height: 34vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 44px; font-size: 16px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { height: 70px; }
    #dmd { min-height: 46px; } .ballDot { width: 22px; height: 22px; } .mult { font-size: 16px; padding: 2px 6px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #fx { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="homeLeft">
    <h1 class="big">🎱 PAPER PINBALL</h1>
    <div id="tablePrev"></div>
    <div id="homeName"></div>
    <div class="two">
      <button class="btn b-score" id="bScore">⭐ Scoreboard</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
  </div>
  <div id="homeRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="homeHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · S = scoreboard · Enter = printables · P = print</div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ My Table</button>
    <h1 class="big">🖨️ PRINT &amp; BUILD</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. Start with the How to Build page! A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my theme)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="score" class="screen">
  <div id="sbTop">
    <button class="btn b-back" id="sbBack">⬅️ Back</button>
    <div id="sbTitle"></div>
    <button class="btn" id="sbMusic">🎵 Music</button>
    <button class="btn" id="sbNew">🔄 New game</button>
  </div>
  <div id="sbMain">
    <div id="sbLeft">
      <div id="dmd"></div>
      <div id="balls"></div>
      <div id="mults"></div>
      <div id="plist"></div>
    </div>
    <div id="pads"></div>
  </div>
  <div id="sbPanel"></div>
</div>
<div id="fx"></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎱 PAPER PINBALL: theme a REAL paper pinball table, print it, build it (paper + tape only),
// then play it on the tabletop while the ⭐ Scoreboard keeps score with real pinball sounds.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from the Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);

  $('bScore').addEventListener('click', openScore);
  $('bPrints').addEventListener('click', openGallery);
  $('bGBack').addEventListener('click', backHome);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  $('sbBack').addEventListener('click', leaveScore);
  $('sbMusic').addEventListener('click', toggleMusic);
  $('sbNew').addEventListener('click', () => { game = null; showSetup(); renderScore(); });
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
