<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }

  #url b { color: #e0592a; }
  /* store header: pencil yellow to crayon pink */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #4fc3f7, #81d4fa 42%, #ffe066); color: #2b2d42; flex: none; min-height: 100px; border-bottom: 5px dashed #fff; }

  #helper { width: 110px; height: 104px; flex: none; }
  #speech { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #who { font-size: 15px; font-weight: 900; color: #2b2d42; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #eef3fb; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #2b2d42; box-shadow: 0 4px 0 #b8c7e6; }
  #nav button.on { background: #3d7be0; color: #fff; box-shadow: 0 4px 0 #1e4fa3; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff5d8f; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c2410c; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #ffb347; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  /* notebook paper: blue lines + a red margin line */
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 14px 30px 14px; background-color: #fffdf4;
    background-image: linear-gradient(180deg, #dff3ff 0, #fffdf4 420px); background-attachment: local; }
  .idea { display: inline-block; font-size: 17px; font-weight: 900; color: #2b2d42; background: #fff3b0; border: 3px dashed #ffb347; border-radius: 14px; padding: 6px 12px; margin: 0 0 8px; }
  /* departments: one row that scrolls sideways */
  .cats { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; }
  .catb { flex: none; font-size: 17px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 12px; background: #fff; color: #2b2d42; box-shadow: 0 4px 0 #b8c7e6; white-space: nowrap; }
  .catb span { display: inline-block; min-width: 22px; border-radius: 12px; background: #eef3fb; color: #2b2d42; font-size: 13px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #ff8c42; color: #fff; box-shadow: 0 4px 0 #c2410c; } .catb.on span { background: #fff; }
  .dept { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #fff3b0, #ffe0ec); border-radius: 16px; padding: 8px 14px; margin-bottom: 12px; color: #2b2d42; border: 3px solid #2b2d42; }
  .dept canvas { width: 70px; height: 66px; flex: none; }
  .dept b { font-size: 22px; display: block; } .dept small { font-size: 16px; color: #4a4e69; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(43,45,66,.15); display: flex; flex-direction: column; position: relative; border: 3px solid #2b2d42; }
  .card.must { border-color: #ff8c42; background: #fffaf0; }
  .card.sel { outline: 5px solid #3d7be0; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #eef3fb; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #2b2d42; line-height: 1.1; }
  .card .from { font-size: 13px; font-weight: bold; color: #e0592a; }
  .card .blurb { font-size: 15px; color: #4a4e69; }
  .card .price { font-size: 21px; font-weight: 900; color: #1e7f4f; margin: 4px 0; }

  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff5d8f; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-5deg); }

  .rev .who { font-weight: bold; color: #e0592a; }
  .stars { color: #f2b544; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #2ec27e; color: #fff; box-shadow: 0 4px 0 #1e7f4f; }
  .add.in { background: #d5f5e3; color: #1e7f4f; box-shadow: 0 4px 0 #9fdcbc; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #fff3b0; box-shadow: 0 4px 0 #f2c94c; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(43,45,66,.13); border: 2px solid #2b2d42; flex-wrap: wrap; }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #2b2d42; min-width: 160px; }

  .line .pr { font-size: 21px; font-weight: 900; color: #1e7f4f; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #ff8c42; box-shadow: 0 5px 0 #c2410c; }
  .bigbtn.green { background: #2ec27e; box-shadow: 0 5px 0 #1e7f4f; }
  .bigbtn.blue { background: #3d7be0; box-shadow: 0 5px 0 #1e4fa3; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .namebtn { font-size: 19px; font-weight: 900; border: 3px dashed #ff8c42; border-radius: 14px; padding: 10px 14px; background: #fff3b0; color: #2b2d42; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #fdecef; color: #b0526b; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #2b2d42; border: 2px solid #2b2d42; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #ff5d8f; border-radius: 14px; padding: 9px 14px; background: #fff; color: #c2185b; }
  .gift.on { background: #ff5d8f; color: #fff; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; background: #ffe0ec; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 19px; font-weight: bold; color: #c2185b; }
  .names button { font-size: 18px; font-weight: bold; border: 0; border-radius: 12px; padding: 8px 12px; background: #fff; color: #2b2d42; box-shadow: 0 3px 0 #f3b6cf; }
  .names button.on { background: #ff5d8f; color: #fff; box-shadow: 0 3px 0 #c2185b; }
  .empty { text-align: center; font-size: 26px; color: #2b2d42; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #2b2d42; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(29,53,87,.94); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(29,53,87,.7); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; border: 4px solid #2b2d42; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #eef3fb; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #eef3fb; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #printBox .pbPrint { background: #2ec27e; } #printBox .pbBack { background: #3d7be0; }
  #printBox .pbTip { font-size: 20px; color: #2b2d42; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<div id="site">

  </div>
  <div id="head">

<script>
// ✈️ PAPER PLANE PORT: Claude's idea for Ben (next to Door Hanger Dam and Bookmark Beehive). A sunny little airport store:
// Captain Robo flies, Dusty runs the control tower, Robo 2.0 and Pink Robo are the crew. Buy printable PAPER AIRPLANES with REAL
// fold lines (blue dashed = valley, red dash-dot = mountain, numbered in order) + step-by-step pages, using pretend Sky Miles.
// Save: localStorage.paperPlanePort = { coins, cart:[keys], gift, giftTo, orders:[{k, gift, to, n, name}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'paperPlanePort';
let S = { coins: 1000, cart: [], gift: false, giftTo: 'Mom', orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.coins >= 0)) S.coins = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🤖 THE CHARACTERS: copied exactly from Robo's Surprise Party (robobirthday.html), which copies Robo + Dusty from robomovie.html and the crew from robojump13.html ----------
let ctx = null, frame = 40, beatClock = 0; const beatLen = () => 25; const FLAGS = {};
// ---------- Drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
function pawPrint(x, y, r, col) {                     // a little paw print
  ellipse(x, y + r * 0.25, r * 0.55, r * 0.45, col);
  for (let i = 0; i < 4; i++) { const a = -2.4 + i * 0.53; ellipse(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.75, r * 0.22, r * 0.27, col); }
}
function starPaw(x, y, r, t, a = 1) {                 // Tiger's twinkly star paw print: golden glow + paw
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  glow(x, y, r * 3, 'rgba(255,214,90,.75)', 0.7 + Math.sin(t * 0.08 + x) * 0.2);
  pawPrint(x, y, r, '#ffe27a');
  twinkle(x + r * 0.9, y - r * 0.9, r * 0.5 * (0.7 + 0.3 * Math.sin(t * 0.15 + y)), 1);
  ctx.restore();
}
// =====================================================================
// 🤖 THE CHARACTERS (x, y = between the feet)
// Robo: same look as the Robo Jump games: white round robot, dark visor, blue eyes, blue ear pods, blue legs,
// plus his little antenna. Dusty: Robo's first friend, a tiny cleaning bot. King Gloop: PURPLE goo, gold crown.
// =====================================================================
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)

// The wing tops are drawn "put together" (both wings meeting in the middle, like the finished plane), then each wing is

  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('paperPlanePort'); say('Printing! Ask a grown-up to help with the printer.', KEEPER); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  Tip: turn on color printing!'));
  document.body.appendChild(printBox);
  for (const f of fns) { const img = new Image(); img.className = 'pbPage'; img.alt = name; img.src = makePage(f, sc).toDataURL('image/png'); printBox.appendChild(img); }
  sfx.click(); say(list.length === 1 ? 'Here it is! Tap PRINT if you want it on paper.' : 'Here are all your plane pages! Tap PRINT when you are ready.', list.length === 1 ? DEPT(P(list[0].k).d).who : 'robo');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 160) closeShip(); else if (view !== 'shop') show('shop'); else if (CAT !== 'all') goDept('all'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 160) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty. Let\'s find something fun!', 'robo'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!', 'robo'); };
$('moreBucks').onclick = moreCoins;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).d !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price!', DEPT(P(DEAL).d).who);
};
$('deal').textContent = '🛫 Deal: ' + P(DEAL).name;
setKeeper('robo');
render();
requestAnimationFrame(drawHelper);
if (talkT === 0) $('bubble').textContent = S.orders.length ? 'Welcome back, Ben! Your orders are in MY ORDERS, ready to print.' : 'Welcome to Paper Plane Port, Ben! I am Captain Robo. Dusty is up in the control tower.';
</script>
</body>
