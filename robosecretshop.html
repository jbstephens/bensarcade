<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Jump Secret Print Shop</title>
<script src="touchpad.js?v=9"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #2b1b3d; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fff3e0; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fff3e0; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #6d4c41; }
  #printBox .pbTip { font-size: 20px; color: #5d4037; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<canvas id="game" width="960" height="540"></canvas>
<script>
// 🖨️ ROBO JUMP SECRET PRINT SHOP — Ben's idea!
// 40 SECRET ROBOS hide in the print shop + the SECRET BACK ROOM (Eraser Robo was Ben's idea; Ben asked for 20 more Robo Jump-style ones). Tap things to find them,
// then print a poster of the Secret Robos you found, Secret Robo trading cards, and an Invent-A-Robo page.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { found: {} };
try { const s = JSON.parse(localStorage.getItem('roboPrintShop') || 'null'); if (s && s.found) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('roboPrintShop', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;

// ---------- Robo's body (the same shape as in the Robo Jump games), any colors, any size ----------
function drawBody(cx, by, s, pal) {
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = by - h;
  ctx.fillStyle = pal.legs; ctx.fillRect(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s); ctx.fillRect(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s);
  rr(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal.body);
  circle(x + w / 2, y + h * 0.7, 3 * s, pal.pod);
  rr(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod); rr(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod);
  rr(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal.head);
  rr(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal.visor);
  const ex = x + w / 2 + 3 * s, ey = y + h * 0.27;
  ctx.fillStyle = pal.eye; ctx.beginPath(); ctx.ellipse(ex - 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.ellipse(ex + 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.fill();
  return { x, y, w, h, ex, ey };
}
const P = (head, body, visor, eye, legs, pod) => ({ head, body, visor, eye, legs, pod });
</script>
<script>
// ---------- THE 20 SECRET ROBOS (none of them are in any game... until now!) ----------
// [id, name, fun fact, palette, extras(b, s) drawn on top]
const ROBOS = [
  ['eraser', 'Eraser Robo', 'Ben\'s idea! He erases mistakes with his big pink hands and leaves little eraser crumbs everywhere.', P('#f48fb1', '#f8bbd0', '#3e2723', '#fff', '#1e88e5', '#1e88e5'),
    (b, s) => { ctx.fillStyle = '#1e88e5'; ctx.fillRect(b.x + 2 * s, b.y + b.h * 0.55, b.w - 4 * s, 5 * s); for (let i = 0; i < 5; i++) circle(b.x - 6 * s + i * 9 * s, b.y + b.h + 3 * s, 1.6 * s, '#f48fb1'); }],
  ['pencil', 'Pencil Robo', 'His head is a sharp pencil point. He draws his own doors, then walks right through them!', P('#ffd54f', '#ffe082', '#3e2723', '#fff', '#f48fb1', '#ff8f00'),
    (b, s) => { tri(b.x + 2 * s, b.y + 2 * s, b.x + b.w - 2 * s, b.y + 2 * s, b.x + b.w / 2, b.y - 16 * s, '#ffcc80'); tri(b.x + b.w / 2 - 4 * s, b.y - 10 * s, b.x + b.w / 2 + 4 * s, b.y - 10 * s, b.x + b.w / 2, b.y - 16 * s, '#424242'); }],
  ['crayon', 'Crayon Robo', 'Every time he gets happy he changes color. Today he is red!', P('#e53935', '#ef5350', '#1a0000', '#ffeb3b', '#b71c1c', '#ffeb3b'),
    (b, s) => { ctx.fillStyle = '#212121'; for (const k of [0.58, 0.82]) ctx.fillRect(b.x + 2 * s, b.y + b.h * k, b.w - 4 * s, 2 * s); tri(b.x + 4 * s, b.y + 2 * s, b.x + b.w - 4 * s, b.y + 2 * s, b.x + b.w / 2, b.y - 12 * s, '#e53935'); }],
  ['tape', 'Tape Robo', 'He wears a roll of tape like a hat and can fix ANY rip in a paper poster.', P('#eceff1', '#cfd8dc', '#263238', '#80deea', '#78909c', '#90a4ae'),
    (b, s) => { ctx.strokeStyle = 'rgba(178,235,242,.9)'; ctx.lineWidth = 5 * s; ctx.beginPath(); ctx.ellipse(b.x + b.w / 2, b.y - 3 * s, 11 * s, 6 * s, 0, 0, 7); ctx.stroke(); }],
  ['plane', 'Paper Airplane Robo', 'He folds his paper wings out and glides all the way across the shop.', P('#ffffff', '#f5f5f5', '#0d47a1', '#82b1ff', '#90caf9', '#64b5f6'),
    (b, s) => { tri(b.x, b.y + b.h * 0.55, b.x - 22 * s, b.y + b.h * 0.75, b.x + 4 * s, b.y + b.h * 0.8, '#e3f2fd'); tri(b.x + b.w, b.y + b.h * 0.55, b.x + b.w + 22 * s, b.y + b.h * 0.75, b.x + b.w - 4 * s, b.y + b.h * 0.8, '#e3f2fd'); }],
  ['stamp', 'Stamp Robo', 'He stamps a big "OK!" on every page, even pages that are upside down.', P('#8d6e63', '#a1887f', '#1b0f0b', '#ffab91', '#5d4037', '#e53935'),
    (b, s) => { rr(b.x + b.w + 2 * s, b.y + b.h * 0.55, 14 * s, 10 * s, 2 * s, '#e53935'); rr(b.x + b.w + 6 * s, b.y + b.h * 0.4, 6 * s, 8 * s, 2 * s, '#5d4037'); }],
  ['glue', 'Glue Robo', 'Everything he touches gets a little bit sticky. High fives take a LONG time.', P('#ce93d8', '#e1bee7', '#311b92', '#fff', '#7e57c2', '#ab47bc'),
    (b, s) => { rr(b.x + b.w / 2 - 6 * s, b.y - 14 * s, 12 * s, 16 * s, 3 * s, '#7e57c2'); rr(b.x + b.w / 2 - 6 * s, b.y - 18 * s, 12 * s, 5 * s, 2 * s, '#fff'); for (const k of [0.25, 0.7]) circle(b.x + b.w * k, b.y + b.h * 0.92, 2.5 * s, '#fff'); }],
  ['ink', 'Ink Robo', 'He fills up every printer. Watch out, he sneezes ink splats!', P('#283593', '#3949ab', '#000', '#18ffff', '#1a237e', '#00e5ff'),
    (b, s) => { for (const [dx, dy, r] of [[-8, 0.6, 3], [36, 0.4, 4], [30, 0.95, 2.5]]) circle(b.x + dx * s, b.y + b.h * dy, r * s, '#1a237e'); }],
  ['sticky', 'Sticky Note Robo', 'He is covered in sticky notes so he never forgets anything... except where he put them.', P('#fff176', '#fff59d', '#33691e', '#fff', '#fbc02d', '#f9a825'),
    (b, s) => { for (const [dx, dy, a, c] of [[0.2, 0.62, -0.2, '#ff80ab'], [0.65, 0.7, 0.25, '#80d8ff'], [0.75, 0.05, 0.3, '#ccff90']]) { ctx.save(); ctx.translate(b.x + b.w * dx, b.y + b.h * dy); ctx.rotate(a); ctx.fillStyle = c; ctx.fillRect(-4 * s, -4 * s, 8 * s, 8 * s); ctx.restore(); } }],
  ['copy', 'Copy Machine Robo', 'He presses his own button and makes little copies of himself. Beep! Beep! Beep!', P('#b0bec5', '#cfd8dc', '#004d40', '#69f0ae', '#546e7a', '#00e676'),
    (b, s) => { const sv = ctx.globalAlpha; ctx.globalAlpha = 0.85; drawBody(b.x - 10 * s, b.y + b.h, s * 0.4, P('#b0bec5', '#cfd8dc', '#004d40', '#69f0ae', '#546e7a', '#00e676')); drawBody(b.x + b.w + 10 * s, b.y + b.h, s * 0.4, P('#b0bec5', '#cfd8dc', '#004d40', '#69f0ae', '#546e7a', '#00e676')); ctx.globalAlpha = sv; }],
  ['pizza', 'Pizza Robo', 'He smells like pepperoni and shares a slice with every Robo he meets.', P('#ffcc80', '#ffe0b2', '#bf360c', '#ffeb3b', '#e65100', '#d84315'),
    (b, s) => { tri(b.x + 2 * s, b.y + 2 * s, b.x + b.w - 2 * s, b.y + 2 * s, b.x + b.w / 2, b.y - 15 * s, '#ffca28'); circle(b.x + b.w / 2, b.y - 5 * s, 2.5 * s, '#d32f2f'); circle(b.x + b.w / 2 - 6 * s, b.y - 0 * s, 2 * s, '#d32f2f'); }],
  ['pirate', 'Pirate Robo', 'Arrr! He has a treasure map of the whole print shop and an eye patch over one eye.', P('#6d4c41', '#8d6e63', '#111', '#ffd740', '#3e2723', '#c62828'),
    (b, s) => { tri(b.x - 6 * s, b.y + 2 * s, b.x + b.w + 6 * s, b.y + 2 * s, b.x + b.w / 2, b.y - 12 * s, '#212121'); circle(b.x + b.w / 2, b.y - 3 * s, 2.5 * s, '#fff'); circle(b.ex - 6 * s, b.ey, 5 * s, '#000'); ctx.fillStyle = '#000'; ctx.fillRect(b.x, b.ey - 7 * s, b.w, 1.5 * s); }],
  ['ninja', 'Ninja Robo', 'You can only find him if you look REALLY carefully. Shhh!', P('#263238', '#37474f', '#000', '#ff5252', '#212121', '#d32f2f'),
    (b, s) => { ctx.fillStyle = '#d32f2f'; ctx.fillRect(b.x - 2 * s, b.y + 2 * s, b.w + 4 * s, 4 * s); tri(b.x - 2 * s, b.y + 3 * s, b.x - 12 * s, b.y + 9 * s, b.x - 10 * s, b.y + 1 * s, '#d32f2f'); }],
  ['dino', 'Dino Robo', 'ROAR! (That means "nice to meet you" in Dino Robo language.)', P('#66bb6a', '#81c784', '#1b5e20', '#ffeb3b', '#2e7d32', '#ffa000'),
    (b, s) => { for (let i = 0; i < 4; i++) tri(b.x + (4 + i * 7) * s, b.y + 1 * s, b.x + (10 + i * 7) * s, b.y + 1 * s, b.x + (7 + i * 7) * s, b.y - 8 * s, '#ffa000'); }],
  ['snow', 'Snow Robo', 'He lives in the cold air vent and makes tiny snowflakes when he sneezes.', P('#ffffff', '#e3f2fd', '#0d47a1', '#82b1ff', '#90caf9', '#e53935'),
    (b, s) => { ctx.fillStyle = '#e53935'; ctx.fillRect(b.x - 2 * s, b.y + b.h * 0.5, b.w + 4 * s, 5 * s); ctx.fillRect(b.x + b.w - 6 * s, b.y + b.h * 0.5, 5 * s, 14 * s); tri(b.x + b.w / 2, b.ey + 4 * s, b.x + b.w / 2, b.ey + 9 * s, b.x + b.w / 2 + 9 * s, b.ey + 6 * s, '#ff9800'); }],
  ['disco', 'Disco Robo', 'He hangs from the ceiling light and turns the print shop into a dance party!', P('#e0e0e0', '#b388ff', '#1a0033', '#fff', '#7c4dff', '#ff4081'),
    (b, s) => { for (let i = 0; i < 5; i++) { const a = frame * 0.05 + i * 1.26; star(b.x + b.w / 2 + Math.cos(a) * 26 * s, b.y + b.h * 0.4 + Math.sin(a) * 22 * s, 3 * s, ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb'][i]); } }],
  ['bubble', 'Bubble Robo', 'He hides in the water cooler and blows bubbles shaped like stars.', P('#b3e5fc', '#e1f5fe', '#01579b', '#fff', '#29b6f6', '#4fc3f7'),
    (b, s) => { ctx.strokeStyle = 'rgba(41,182,246,.8)'; ctx.lineWidth = 1.5 * s; for (const [dx, dy, r] of [[-10, 0.1, 5], [38, -0.1, 4], [44, 0.3, 3]]) { ctx.beginPath(); ctx.arc(b.x + dx * s, b.y + b.h * dy, r * s, 0, 7); ctx.stroke(); } }],
  ['cookie', 'Cookie Robo', 'He has chocolate chips all over and keeps the cookie jar full for everybody.', P('#bc8a5f', '#d4a373', '#3e2723', '#fff', '#6d4c41', '#4e342e'),
    (b, s) => { for (const [dx, dy] of [[0.25, 0.6], [0.6, 0.65], [0.4, 0.8], [0.75, 0.82], [0.1, 0.1], [0.9, 0.15]]) circle(b.x + b.w * dx, b.y + b.h * dy, 1.8 * s, '#3e2723'); }],
  ['space', 'Space Robo', 'He waves at you from outside the window. He flew here all the way from the moon!', P('#fafafa', '#eeeeee', '#1a237e', '#ffd740', '#ff6d00', '#ff6d00'),
    (b, s) => { ctx.strokeStyle = 'rgba(128,216,255,.9)'; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h * 0.27, 21 * s, 0, 7); ctx.stroke(); ctx.fillStyle = 'rgba(128,216,255,.18)'; ctx.fill(); }],
  ['cat', 'Cat Robo', 'He naps under the rug and purrs like a printer. Meow-beep!', P('#a1887f', '#bcaaa4', '#2d1b12', '#76ff03', '#6d4c41', '#ff8a80'),
    (b, s) => { tri(b.x - 1 * s, b.y + 4 * s, b.x + 8 * s, b.y + 1 * s, b.x + 1 * s, b.y - 9 * s, '#a1887f'); tri(b.x + b.w + 1 * s, b.y + 4 * s, b.x + b.w - 8 * s, b.y + 1 * s, b.x + b.w - 1 * s, b.y - 9 * s, '#a1887f');
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1 * s; ctx.beginPath(); for (const d of [-1, 1]) for (const k of [-2, 2]) { ctx.moveTo(b.x + b.w / 2 + d * 8 * s, b.ey + 7 * s); ctx.lineTo(b.x + b.w / 2 + d * 18 * s, b.ey + 7 * s + k * s); } ctx.stroke(); }],
];
const RI = {}; ROBOS.forEach((r, i) => RI[r[0]] = i);
function drawSecret(i, cx, by, size) {                     // size = about how tall
  const r = ROBOS[i], s = size / 52; ctx.save();
  try { if (r[0] === 'spring') by -= 12 * s; const b = drawBody(cx, by, s, r[3]); r[4](b, s); } finally { ctx.restore(); }
}
function drawMystery(cx, by, size) {                       // a robo you haven't found yet: a dark shape with a "?"
  const s = size / 52; ctx.save(); drawBody(cx, by, s, P('#555', '#555', '#333', '#333', '#444', '#444')); ctx.restore();
  text('?', cx, by - 18 * s, 22 * s, '#ffd740');
}

<script>
// ---------- 20 MORE SECRET ROBOS in the 🚪 SECRET BACK ROOM (Ben asked for Robos that look like they're from a Robo Jump game) ----------
const BOLT = (cx, cy, s, c) => { ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(cx + 2 * s, cy - 9 * s); ctx.lineTo(cx - 4 * s, cy + 1 * s); ctx.lineTo(cx, cy + 1 * s); ctx.lineTo(cx - 2 * s, cy + 9 * s); ctx.lineTo(cx + 4 * s, cy - 1 * s); ctx.lineTo(cx, cy - 1 * s); ctx.closePath(); ctx.fill(); };
const FLAME = (cx, by, s, c1, c2) => { const f = Math.sin(frame * 0.3) * 2 * s; tri(cx - 10 * s, by, cx + 10 * s, by, cx + f, by - 18 * s, c1); tri(cx - 5 * s, by, cx + 5 * s, by, cx + f, by - 10 * s, c2); };
function GEAR(cx, cy, r, c) { ctx.fillStyle = c; for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4 + frame * 0.02; ctx.save(); ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.rotate(a); ctx.fillRect(-r * 0.22, -r * 0.22, r * 0.44, r * 0.44); ctx.restore(); } circle(cx, cy, r, c); circle(cx, cy, r * 0.4, '#37474f'); }
ROBOS.push(
  ['fire', 'Fire Robo', 'His head is on fire (but it doesn\'t hurt, it just keeps him toasty). He hides next to the fire extinguisher. Hmm!', P('#ff7043', '#ffab91', '#3e0000', '#ffeb3b', '#d84315', '#ffca28'),
    (b, s) => FLAME(b.x + b.w / 2, b.y + 3 * s, s, '#ff5722', '#ffeb3b')],
  ['water', 'Water Robo', 'He can turn into a puddle and slide under doors. Splish splash!', P('#4fc3f7', '#b3e5fc', '#01579b', '#fff', '#0288d1', '#29b6f6'),
    (b, s) => { ctx.fillStyle = '#29b6f6'; ctx.beginPath(); ctx.moveTo(b.x + b.w / 2, b.y - 14 * s); ctx.quadraticCurveTo(b.x + b.w / 2 + 9 * s, b.y - 2 * s, b.x + b.w / 2, b.y + 2 * s); ctx.quadraticCurveTo(b.x + b.w / 2 - 9 * s, b.y - 2 * s, b.x + b.w / 2, b.y - 14 * s); ctx.fill(); }],
  ['thunder', 'Thunder Robo', 'His antenna is a lightning bolt. When he double jumps, it goes ZAP!', P('#ffee58', '#fff59d', '#212121', '#40c4ff', '#424242', '#ffd600'),
    (b, s) => { ctx.fillStyle = '#616161'; ctx.fillRect(b.x + b.w / 2 - 1 * s, b.y - 6 * s, 2 * s, 7 * s); BOLT(b.x + b.w / 2, b.y - 12 * s, s, '#ffd600'); }],
  ['ice', 'Ice Robo', 'He makes slippery ice floors and wears a crown of icicles.', P('#e1f5fe', '#b3e5fc', '#0d47a1', '#80d8ff', '#81d4fa', '#4fc3f7'),
