<script>
'use strict';
// ---------- little helpers: random numbers and smooth noise for hills and skin ----------
let seed = 7;
const rnd = () => { seed = (seed * 16807) % 2147483647; return (seed - 1) / 2147483646; };
const rr = (a, b) => a + (b - a) * rnd();
const lin = h => new THREE.Color(h).convertSRGBToLinear();
function hash2(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >>> 13)) * 1274126177; return ((h ^ (h >>> 16)) >>> 0) / 4294967295; }
function noise2(x, y) {
  const ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  const ux = fx * fx * (3 - 2 * fx), uy = fy * fy * (3 - 2 * fy);
  const a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
}
const fbm2 = (x, y) => noise2(x, y) * .5 + noise2(x * 2.03 + 5, y * 2.03) * .25 + noise2(x * 4.1 + 9, y * 4.1) * .125 + noise2(x * 8.3, y * 8.3 + 3) * .0625;
const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
const lerp = (a, b, t) => a + (b - a) * t;
// ---------- the land: a gentle valley with a lake, hills all around and two far-away volcanoes ----------
const LAKE = { x: 30, z: -40, rx: 40, rz: 26 }, WATER = -0.35;
function lakeD(x, z) { return Math.hypot((x - LAKE.x) / LAKE.rx, (z - LAKE.z) / LAKE.rz) + (noise2(x * .05, z * .05) - .5) * .25; }
function H(x, z) {
  const r = Math.hypot(x, z);
  let h = 2.2 * fbm2(x * .012, z * .012) + .35 * noise2(x * .08, z * .08) - .2;
  h += Math.pow(Math.max(0, r - 150), 1.2) * .035 * (.4 + .9 * fbm2(x * .006 + 7, z * .006));    // rolling hills around the valley
  h += Math.pow(Math.max(0, r - 420), 1.15) * .1 * fbm2(x * .004 + 3, z * .004 + 1);              // tall misty hills far away
  h -= 3.4 * smooth(1.25, .35, lakeD(x, z));                                                       // the lake
  return h;
}
const VOLCANOES = [{ x: -300, z: -640, s: .62 }, { x: 380, z: -700, s: .45 }];

// ---------- renderer, camera, sky ----------
const cv = document.getElementById('gl');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: true, powerPreference: 'high-performance' }); } catch (_) { renderer = null; }
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
let pixScale = Math.min(window.devicePixelRatio || 1, isTouch ? 1.25 : 1.5);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(48, innerWidth / innerHeight, 0.3, 4000);
if (renderer) {
  renderer.setPixelRatio(pixScale); renderer.setSize(innerWidth, innerHeight, false);
  renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
}
const SKY = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false, fog: false,
  uniforms: { top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3(0, 1, 0) }, sunCol: { value: new THREE.Color() }, glow: { value: 1 }, t: { value: 0 } },
  vertexShader: 'varying vec3 vD; void main(){ vD=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); gl_Position.z=gl_Position.w*.99999; }',
  fragmentShader: `uniform vec3 top, hor, sunDir, sunCol; uniform float glow, t; varying vec3 vD;
    float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
    float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x), mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x), f.y); }
    void main(){ vec3 d=normalize(vD); float y=max(d.y,0.);
      vec3 c=mix(hor, top, pow(y, .55));
      float s=max(dot(d,sunDir),0.);
      c+=sunCol*(pow(s,6.)*.35*glow+pow(s,64.)*.6+smoothstep(.9994,.9998,s)*6.);
      c=mix(c, hor*.9, smoothstep(.0,-.15,d.y));
      // soft clouds drifting slowly
      vec2 q=d.xz/(d.y+.15)*1.6+vec2(t*.004,0.);
      float cl=smoothstep(.55,.85,n(q)*.6+n(q*2.3)*.3+n(q*5.1)*.1)*smoothstep(.02,.25,d.y);
      vec3 cc=mix(vec3(1.), sunCol*1.2, .35*glow)*(.75+.35*s);
      c=mix(c, cc, cl*.55);
      gl_FragColor=vec4(c,1.); }`,
});
const skyMesh = new THREE.Mesh(new THREE.SphereGeometry(3000, 32, 16), SKY); skyMesh.renderOrder = -1; scene.add(skyMesh);
scene.fog = new THREE.FogExp2(0xa9c3d0, 0.0019);
const hemi = new THREE.HemisphereLight(0xbfd8ff, 0x4a5a2a, 0.65); scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048); sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.04;
Object.assign(sun.shadow.camera, { left: -70, right: 70, top: 70, bottom: -70, near: 10, far: 600 });
scene.add(sun); scene.add(sun.target);

<script>
'use strict';
// ---------- textures painted on hidden canvases ----------
function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; t.encoding = THREE.sRGBEncoding;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; }
  return t;
}
// ground detail: speckles of soil, pebbles and tiny leaves (greyish so the land colours show through)
const groundTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#8a8a8a'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 2600; i++) { const v = 90 + Math.random() * 120 | 0; g.fillStyle = `rgba(${v},${v},${v * .9 | 0},.35)`;
    const x = Math.random() * w, y = Math.random() * h, s = 1 + Math.random() * 3; g.fillRect(x, y, s, s * (.5 + Math.random())); }
  for (let i = 0; i < 260; i++) { g.strokeStyle = `rgba(${60 + Math.random() * 40 | 0},${90 + Math.random() * 60 | 0},40,.45)`; g.lineWidth = 1.2;
    const x = Math.random() * w, y = Math.random() * h, a = Math.random() * 6.28; g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * 7, y + Math.sin(a) * 7); g.stroke(); }
}, true);
groundTex.repeat.set(220, 220);
// a fern frond: a stem with rows of little leaflets (alpha cut-out)
const frondTex = canvasTex(128, 512, (g, w, h) => {
  g.clearRect(0, 0, w, h); g.strokeStyle = '#4c6b22'; g.lineWidth = 4; g.beginPath(); g.moveTo(w / 2, h); g.lineTo(w / 2, 4); g.stroke();
  for (let y = h - 20; y > 10; y -= 11) { const k = y / h, L = (w / 2 - 6) * Math.sin(Math.PI * Math.min(1, (1 - k) * 1.05 + .05)) * (.4 + .6 * k);
    for (const s of [-1, 1]) { g.fillStyle = `hsl(${88 + Math.random() * 18},${48 + Math.random() * 15}%,${24 + Math.random() * 12}%)`;
      g.beginPath(); g.moveTo(w / 2, y); g.quadraticCurveTo(w / 2 + s * L * .6, y - 10, w / 2 + s * L, y - 6); g.quadraticCurveTo(w / 2 + s * L * .5, y + 2, w / 2, y + 4); g.fill(); } }
});
// conifer needles: dark green tufts (alpha cut-out)
const needleTex = canvasTex(256, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { const x = Math.random() * w, y = Math.random() * h * .95, a = Math.PI / 2 + (Math.random() - .5) * 1.6, L = 10 + Math.random() * 18;
    const d = Math.hypot(x - w / 2, (y - h * .1) * .6); if (d > w * .48) continue;
    g.strokeStyle = `hsl(${100 + Math.random() * 30},${35 + Math.random() * 20}%,${14 + Math.random() * 14}%)`; g.lineWidth = 2;
    g.beginPath(); g.moveTo(x, y); g.lineTo(x + Math.cos(a) * L * .3, y + Math.sin(a) * L); g.stroke(); }
});
const barkTex = canvasTex(64, 256, (g, w, h) => {
  g.fillStyle = '#5a4632'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 400; i++) { g.fillStyle = `rgba(${30 + Math.random() * 60 | 0},${25 + Math.random() * 40 | 0},${15 + Math.random() * 25 | 0},.5)`; g.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 6 + Math.random() * 20); }
  for (let y = 0; y < h; y += 10 + Math.random() * 8) { g.fillStyle = 'rgba(30,20,10,.35)'; g.fillRect(0, y, w, 2); }
}, true);
const puffTex = canvasTex(128, 128, (g, w, h) => {
  const gr = g.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w / 2); gr.addColorStop(0, 'rgba(255,255,255,.9)'); gr.addColorStop(.5, 'rgba(255,255,255,.4)'); gr.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 40; i++) { const x = w / 2 + (Math.random() - .5) * w * .5, y = h / 2 + (Math.random() - .5) * h * .5, r = 8 + Math.random() * 20;
    const g2 = g.createRadialGradient(x, y, 0, x, y, r); g2.addColorStop(0, 'rgba(255,255,255,.25)'); g2.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = g2; g.fillRect(0, 0, w, h); }
});

// ---------- terrain: one big mesh, small squares near the middle and big ones far away ----------
const TER = (() => {
  const N = 240, geo = new THREE.PlaneGeometry(2, 2, N, N); geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position, col = new Float32Array(pos.count * 3);
  const f = u => Math.sign(u) * (260 * Math.abs(u) + 1340 * Math.pow(Math.abs(u), 3.2));
  const c = new THREE.Color(), grass1 = new THREE.Color(0x3d5a1c), grass2 = new THREE.Color(0x5e6e2a), mud = new THREE.Color(0x4a3a26), rock = new THREE.Color(0x6a6458), far = new THREE.Color(0x46603a);
  for (let i = 0; i < pos.count; i++) {
    const x = f(pos.getX(i)), z = f(pos.getZ(i)), y = H(x, z); pos.setXYZ(i, x, y, z);
    const slope = Math.abs(H(x + 1.5, z) - y) + Math.abs(H(x, z + 1.5) - y);
    c.copy(grass1).lerp(grass2, fbm2(x * .03, z * .03));
    c.lerp(mud, smooth(.7, .1, y - WATER) * .9);
    c.lerp(rock, smooth(.9, 2.5, slope) * .8);
    c.lerp(far, smooth(300, 900, Math.hypot(x, z)) * .6);
    c.multiplyScalar(.85 + .3 * noise2(x * .2, z * .2));
    c.convertSRGBToLinear(); col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3)); geo.computeVertexNormals();
  const m = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({ vertexColors: true, map: groundTex, roughness: .95, metalness: 0 }));
  m.receiveShadow = true; scene.add(m); return m;
})();

// ---------- the lake: still water reflecting the sky, with slow little ripples ----------
const waterNorm = canvasTex(256, 256, (g, w, h) => {
  const img = g.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const a = Math.sin(x / w * 6.283 * 3 + Math.sin(y / h * 6.283 * 2) * 1.5), b = Math.sin(y / h * 6.283 * 4 + Math.sin(x / w * 6.283 * 3));
    const nx = a * .25 + (noise2(x * .1, y * .1) - .5) * .3, ny = b * .25 + (noise2(x * .1 + 9, y * .1) - .5) * .3, i = (y * w + x) * 4;
    img.data[i] = 128 + nx * 127; img.data[i + 1] = 128 + ny * 127; img.data[i + 2] = 255; img.data[i + 3] = 255;
  }
  g.putImageData(img, 0, 0);
}, true);
waterNorm.encoding = THREE.LinearEncoding;
waterNorm.repeat.set(30, 20);
const waterMat = new THREE.ShaderMaterial({ fog: true,
  uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { t: { value: 0 }, top: { value: new THREE.Color() }, hor: { value: new THREE.Color() }, sunDir: { value: new THREE.Vector3() }, sunCol: { value: new THREE.Color() } }]),
  vertexShader: `#include <fog_pars_vertex>
varying vec3 vW;
void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; vec4 mvPosition=viewMatrix*w; gl_Position=projectionMatrix*mvPosition;
#include <fog_vertex>
}`,
  fragmentShader: `uniform float t; uniform vec3 top, hor, sunDir, sunCol; varying vec3 vW;
#include <fog_pars_fragment>
float hh(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5); }
float nn(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(hh(i),hh(i+vec2(1,0)),f.x), mix(hh(i+vec2(0,1)),hh(i+vec2(1,1)),f.x), f.y); }
float wv(vec2 p){ return nn(p*.35+vec2(t*.15,t*.1))*.6+nn(p*.9-vec2(t*.2,-t*.12))*.3+nn(p*2.3+t*.3)*.1; }
void main(){
  vec2 p=vW.xz; float e=.15; float h0=wv(p);
  vec3 n=normalize(vec3((h0-wv(p+vec2(e,0.)))*.9, 1., (h0-wv(p+vec2(0.,e)))*.9));
  vec3 V=normalize(cameraPosition-vW); float fr=.03+.97*pow(1.-max(dot(n,V),0.),5.);
  vec3 R=reflect(-V,n); vec3 sky=mix(hor, top, pow(max(R.y,0.),.55));
  sky+=sunCol*(pow(max(dot(R,sunDir),0.),300.)*4.+pow(max(dot(R,sunDir),0.),20.)*.25);
  vec3 deep=vec3(.05,.13,.12)*(.5+.6*max(sunDir.y,0.))+sunCol*.03;
  vec3 col=mix(deep, sky, clamp(fr*1.1,0.,1.));
  gl_FragColor=vec4(col,1.);
