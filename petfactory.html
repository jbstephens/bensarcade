  $('bubG').innerHTML = bubbles.map((b, i) => { b.y -= 30 * dt; return '<circle data-b="' + i + '" cx="' + n(b.x + Math.sin(b.age * 3 + i) * 8) + '" cy="' + n(b.y) + '" r="' + b.r + '" fill="#e1f5fe" fill-opacity=".7" stroke="#4fc3f7" stroke-width="3"/>'; }).join('');

}
// ---------- care actions ----------
function busy() { if (act === 'sleep') { wake(); return true; } return !!act; }

}
function finishPlay(msg) {

function fetchBall() {

function laser() {

function tapFloor(e) {

function svgPt(e) { const sv = $('room'), p = sv.createSVGPoint(); p.x = e.clientX; p.y = e.clientY; return p.matrixTransform(sv.getScreenCTM().inverse()); }
function cuddle() {

function bath() {

function popBubble(e) { const i = e.target.dataset && e.target.dataset.b; if (i === undefined) return; e.stopPropagation(); const b = bubbles[+i]; if (!b) return; b.life = 0; blip(1200 + Math.random() * 300, 0, .06, 'sine', .3); fxText(b.x, b.y, '💦', 22, -20); }
let zzz = 0;
function bedtime() {

// ---------- tricks (learned by playing) ----------
const TRICKS = [['sit', '🐾', 'Sit', 3], ['spin', '🌀', 'Spin', 6], ['five', '✋', 'High Five', 10]];
function renderTricks() {
  $('trickBar').innerHTML = TRICKS.map(([k, e, t, need]) => pet.tricks.indexOf(k) >= 0 ? '<button class="btn b3" data-trick="' + k + '">' + e + ' ' + t + '</button>'

function subBar(id) {

// 🖨️ PRINTABLES: Pet Adoption Certificate (one per pet) + a sheet of pet ID tags

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function niceDate(s) { const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || today()); return m ? MONTHS[+m[2] - 1] + ' ' + (+m[3]) + ', ' + m[1] : s; }
// the pet fitted into a box (pets fill about 280 x 285 around 0,-12)
function petIn(p, x, y, w, h, mood) { const s = Math.min(w / 280, h / 285); return G(x + w / 2, y + h / 2 + 12.5 * s, s, drawPet(p, mood)); }
function certPage(p) {

}
function tag(p, x, y) {

function tagsPage(list) {
