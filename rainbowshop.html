<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #1a0033; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fff7fd; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #site.chaos { animation: chaosHue .9s linear infinite; }
  @keyframes chaosHue { from { filter: hue-rotate(0deg) saturate(1.6); } to { filter: hue-rotate(360deg) saturate(1.6); } }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #e6dcef; border-bottom: 2px solid #cbbfd8; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { background: linear-gradient(90deg, #ff1744, #ff9100, #c6a700, #00c853, #2979ff, #aa00ff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #12001f, #4a0072 45%, #12001f); color: #fff; flex: none; min-height: 96px; position: relative; }
  #head:after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, #ff1744, #ff9100, #ffea00, #00e676, #2979ff, #651fff, #d500f9); }
  #logo { line-height: 1; }
  #logo .big { font-size: 28px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #000; }
  #logo .big i { text-shadow: none; font-style: normal; background: linear-gradient(90deg, #ff5252, #ffd740, #69f0ae, #40c4ff, #e040fb); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #logo .small { font-size: 15px; color: #ea80fc; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #2b0f45; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #e040fb; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #e040fb; border-left: 0; }
  #wallet { flex: none; text-align: center; background: linear-gradient(135deg, #ffd740, #ff80ab); color: #4a0072; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #ad1457; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fff; color: #6a1b9a; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #f6e6fb; flex: none; flex-wrap: nowrap; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 16px; background: #fff; color: #4a0072; box-shadow: 0 4px 0 #ce93d8; white-space: nowrap; }
  #nav button.on { background: #aa00ff; color: #fff; box-shadow: 0 4px 0 #4a0072; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff1744; color: #fff; font-size: 18px; }
  #nav #chaosBtn { background: linear-gradient(90deg, #ff1744, #ff9100, #ffd600, #00e676, #2979ff, #aa00ff); color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.45); box-shadow: 0 4px 0 #4a0072; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c51162; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f48fb1; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(74,0,114,.18); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }
  .card.must { border-color: #e040fb; background: #fff8fe; }
  .card.sel { outline: 4px solid #00e676; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #f6ecfb; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #4a0072; line-height: 1.1; }
  .card .blurb { font-size: 15px; color: #555; }
  .card .price { font-size: 22px; font-weight: 900; color: #c51162; margin: 4px 0; }
  .card .price s { color: #999; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: linear-gradient(90deg, #ff1744, #ff9100, #00c853, #2979ff, #aa00ff); color: #fff; }
  .tag.new { background: #00c853; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #4a0072; box-shadow: 0 4px 0 #ce93d8; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #f3e5f5; color: #6a1b9a; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #aa00ff; color: #fff; box-shadow: 0 4px 0 #4a0072; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #f8ecfc; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #6a1b9a; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #f3e5f5; box-shadow: 0 4px 0 #ce93d8; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(74,0,114,.15); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #4a0072; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #c51162; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #aa00ff; box-shadow: 0 5px 0 #4a0072; }
  .bigbtn.green { background: #00c853; box-shadow: 0 5px 0 #00873e; }
  .bigbtn.blue { background: #2979ff; box-shadow: 0 5px 0 #1a4fb5; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #4a0072; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #6a1b9a; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #4a0072; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(18,0,31,.94); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(18,0,31,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #f8e8fc; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #f8e8fc; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #6a1b9a; }
  #printBox .pbTip { font-size: 20px; color: #4a0072; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media (max-width: 900px) { #logo .big { font-size: 22px; } #nav button { font-size: 18px; padding: 8px 10px; } #bubble { font-size: 16px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #site, #printBox, #printBox * { filter: none !important; animation: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<body>
<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
    <div id="url">🔒 <b>www.chaosrobo.rainbow</b></div>
  </div>
  <div id="head">
    <canvas id="helper" width="208" height="208"></canvas>
    <div id="logo"><div class="big">CHAOS ROBO'S<br><i>RAINBOW SHOP</i></div><div class="small">Really fun paper stuff to PRINT!</div></div>
    <div id="bubble">CHAOS! Welcome to my Rainbow Shop!</div>
    <div id="wallet"><div class="lbl">🌈 RAINBOW SPARKS</div><div class="amt" id="amt">1000</div><button id="moreBucks">✨ Get more</button></div>
  </div>
  <div id="nav">
    <button id="tShop" class="on">🏬 SHOP</button>

</div>
<div id="ship"><canvas id="shipCv" width="960" height="540"></canvas><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button></div>

<script>
// 🌈 CHAOS ROBO'S RAINBOW SHOP: Chaos Robo is Ben's own invention (Secret Robo #41 from the Robo Jump Secret Print Shop).
// Buy rainbow paper stuff with pretend Rainbow Sparks, then pick which orders to PRINT. Nothing prints by itself.
// Save: localStorage.rainbowShop = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'rainbowShop';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false, frame = 0, PRINTING = false;   // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
const RB = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#2979ff', '#651fff', '#d500f9'];   // red orange yellow green blue indigo violet
const RBN = ['red', 'orange', 'yellow', 'green', 'blue', 'indigo', 'violet'];
const RBL = ['#ffcdd2', '#ffe0b2', '#fff9c4', '#c8e6c9', '#bbdefb', '#d1c4e9', '#f3c5fb'];   // light rainbow
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
const circle = (x, y, r, fill) => circ(x, y, r, fill);
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function starPts(x, y, R, r, n = 5, rot = 0) { const p = []; for (let i = 0; i < n * 2; i++) { const a = rot - Math.PI / 2 + i * Math.PI / n, q = i % 2 ? r : R; p.push([x + Math.cos(a) * q, y + Math.sin(a) * q]); } return p; }
function star(x, y, r, fill, stroke) { poly(starPts(x, y, r, r * 0.45), fill, stroke, 2); }
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
function cloud(x, y, s, fill = '#fff', stroke) { for (const [dx, dy, r] of [[-40, 6, 26], [-14, -10, 34], [20, -4, 30], [44, 8, 22], [0, 14, 26]]) circ(x + dx * s, y + dy * s, r * s, fill); if (stroke) { ctx.save(); ctx.strokeStyle = stroke; ctx.lineWidth = 3; for (const [dx, dy, r] of [[-40, 6, 26], [-14, -10, 34], [20, -4, 30], [44, 8, 22]]) { ctx.beginPath(); ctx.arc(x + dx * s, y + dy * s, r * s, Math.PI, Math.PI * 2); ctx.stroke(); } ctx.restore(); } }
function rainbowArc(cx, cy, R, band, colors = RB) {   // a real rainbow: red on the OUTSIDE, violet on the inside
  colors.forEach((c, i) => { ctx.beginPath(); ctx.arc(cx, cy, R - i * band, Math.PI, 0); ctx.arc(cx, cy, R - (i + 1) * band, 0, Math.PI, true); ctx.closePath(); ctx.fillStyle = fillOf(c); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); } });
}
// ---------- 🌀 CHAOS ROBO (Ben's idea!) copied from drawChaosRobo in robosecretshop.html (Secret Robo #41) ----------
// Robo's body shape from the Robo Jump games; a spinning rainbow star on his head, rainbow wings, ONE big eye,
// glitchy magenta + cyan copies of himself (just like Chaos Nova).
const rbw = k => `hsl(${(k * 47 + frame * 4) % 360},95%,62%)`;
const PAL6 = (head, body, visor, eye, legs, pod) => ({ head, body, visor, eye, legs, pod });
function drawBody(cx, by, s, pal) {
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = by - h;
  rr(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s, 0, pal.legs); rr(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s, 0, pal.legs);
  rr(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal.body);
  circle(x + w / 2, y + h * 0.7, 3 * s, pal.pod);
  rr(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod); rr(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod);
  rr(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal.head);
  rr(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal.visor);
  const ex = x + w / 2 + 3 * s, ey = y + h * 0.27;
  if (!OUT) { ctx.fillStyle = pal.eye; ctx.beginPath(); ctx.ellipse(ex - 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.ellipse(ex + 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.fill(); }
  return { x, y, w, h, ex, ey };
}
function drawChaosRobo(cx, by, s) {
  if (OUT) return chaosOutline(cx, by, s);
  ctx.save();
  const midY = by - 20 * s;
  for (let i = 3; i >= 1; i--) { ctx.globalAlpha = 0.14; circle(cx, midY, (24 + i * 9) * s + Math.sin(frame * 0.08 + i) * 3 * s, rbw(i)); }   // glowing aura rings
  ctx.globalAlpha = 1;
  const flap = Math.sin(frame * 0.12) * 0.25;                       // rainbow star wings
  for (const d of [-1, 1]) for (let k = 1; k >= 0; k--) {
    ctx.save(); ctx.translate(cx + d * 14 * s, midY - 2 * s); ctx.rotate(d * (0.5 + k * 0.45 + flap));
    ctx.fillStyle = rbw(k + (d > 0 ? 3 : 0)); ctx.beginPath(); ctx.ellipse(d * 13 * s, 0, 14 * s, 5 * s, 0, 0, 7); ctx.fill(); ctx.restore();
  }
  const pal = PAL6(rbw(0), rbw(1), '#12001f', '#fff', rbw(4), rbw(2));
  for (const [dx, col] of [[-3, 'rgba(255,0,255,.5)'], [3, 'rgba(0,229,255,.5)']]) {   // glitchy magenta + cyan copies (like Chaos Nova)
    ctx.save(); ctx.globalAlpha = 0.5; drawBody(cx + dx * s + (!PRINTING && frame % 24 < 3 ? dx * s : 0), by, s, PAL6(col, col, col, col, col, col)); ctx.restore();
  }
  const b = drawBody(cx, by, s, pal);
  rr(b.x + 2 * s, b.y + 4 * s, b.w - 4 * s, b.h * 0.55 - 9 * s, 9 * s, '#12001f');   // ONE big eye

function mazeGrid(cols, rows, seed) {

  return cell;
}

// 🖼️ page thumbnails (the real printed page, small)
const THUMB = {};
function thumbPage(k) { if (!THUMB[k]) THUMB[k] = makePage(P(k).pages[0], 0.3); return THUMB[k]; }
function thumbCanvas(k, w = 300, h = 200) {

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

function avg(p) { return (p.revs.reduce((a, r) => a + r[1], 0) / p.revs.length).toFixed(1); }
function updateTop() {
  $('amt').textContent = S.bucks; $('cCount').textContent = S.cart.length;

function show(v) { view = v; render(); $('main').scrollTop = 0; }
function render() {

function renderShop(m) {

function toggleCart(k) {

  else { S.cart.push(k); sfx.add(); say(k === 'mega' ? 'The GIANT Rainbow Spinner Tower! CHAOS! Best choice ever!' : k === 'pinwheel' ? 'A REAL pinwheel! Blow on it and it spins!' : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {

}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) {
    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));

    line.appendChild(el('div', 'pr', '🌈 ' + priceOf(k)));

  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'Gift wrap! I will add rainbow wrapping paper to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 🌈 ' + cartTotal()));

  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (tot > S.bucks) { sfx.glitch(); say('Uh oh! Not enough Rainbow Sparks! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.bucks -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();

}
function moreBucks() {
  S.bucks += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['Here are 500 more Rainbow Sparks!', 'Ka-ching! 500 Rainbow Sparks! Pretend money is the best!', 'CHAOS! More Rainbow Sparks for Ben!']));
}
// 🚚 delivery animation
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.vroom(); say('Placing your order... Rainbow speed!'); requestAnimationFrame(shipLoop); }
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  try {
    frame = shipT;
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#12001f'); g.addColorStop(1, '#4a0072'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 30; i++) circ((i * 173 + shipT * (i % 3 + 1) * 0.5) % 960, (i * 97) % 300, 2 + i % 3, 'rgba(255,255,255,.6)');
    const done = shipT > 150, fx = done ? 480 : -120 + Math.min(1, shipT / 140) * 600, fy = 340 + (done ? Math.sin(shipT * 0.08) * 8 : Math.sin(shipT * 0.15) * 40);
    // the rainbow trail behind Chaos Robo

    // the order boxes he carries

    drawChaosRobo(fx, fy + 30, 3.4);
    if (!done) { txt('Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 110, 54, '#fff'); rr(280, 160, 400, 26, 13, 'rgba(255,255,255,.3)'); rr(280, 160, Math.max(26, 400 * Math.min(1, shipT / 150)), 26, 13, rbw(2)); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); rr(480 + Math.cos(a) * d, 140 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.5, 12, 8, 2, ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff'][i % 4]); }

function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {

  L.appendChild(el('div', 'h2', '📦 My Orders'));

    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }

// 🖨️ print preview: nothing prints until Ben taps PRINT

function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {

  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();

$('tShop').onclick = () => { sfx.click(); show('shop'); };
