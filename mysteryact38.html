// everybody gets a fun award; the Expedition Leader goes last with the big gold one
function champTitles(players) {
  const pool = [];
  LANDS.filter(h => state.done[h.id]).forEach(h => pool.push(h.title)); EXTRA_TITLES.forEach(t => pool.push(t));
  for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); const t = pool[i]; pool[i] = pool[j]; pool[j] = t; }
  const leader = players.find(nm => roleOf(nm)[1] === 'Expedition Leader') || players[0];
  const out = []; let k = 0;
  players.forEach(nm => { if (nm !== leader) out.push([nm, pool[k++ % pool.length]]); });

}
