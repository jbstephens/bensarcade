<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Trebuchet MS", "Avenir Next", Arial, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  #bulb { position: absolute; left: 50%; bottom: -22px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #ff8a80, #e53935 60%, #b71c1c); box-shadow: 0 0 0 3px rgba(255,255,255,.88); }

  @media (max-width: 700px) { .wb { min-width: 54px; min-height: 54px; padding: 6px 8px; justify-content: center; } .wb .t { display: none; } #thermo { width: 58px; } #tnum { font-size: 18px; } }

<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="top">
    <div id="title">🌦️ Weather Machine <span id="idea">💡 Ben's idea!</span></div>
    <div id="rightBtns">
      <button class="pill" id="soundBtn">🔈 Sound off</button>

    </div>

    <div id="tnum">70°</div>

<script>
'use strict';
// ---------- shared shader bits (from Realism): hashing, noise, fbm, stars, filmic finish ----------
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
// star colour from a 0..1 "temperature" (red dwarf -> sun -> blue giant)
vec3 starCol(float k){ return k<.5 ? mix(vec3(1.,.62,.38), vec3(1.,.95,.88), k*2.) : mix(vec3(1.,.95,.88), vec3(.62,.75,1.), (k-.5)*2.); }
// one layer of stars: point-spread "blobs" a pixel or two wide, twinkling
vec3 starLayer(vec2 p, float cell, float dens, float px, float seed, float tw){
  vec2 q=p/cell; vec2 id=floor(q); vec2 f=fract(q)-.5;
  float r=h21(id+seed); if(r>dens) return vec3(0);
  vec2 o=(h22(id+seed*1.3)-.5)*.6; float d=length(f-o)*cell/px;
  float m=pow(h21(id*1.71+seed), 6.);
  float twk=1.-tw+tw*(.55+.45*sin(uT*(1.5+4.*h21(id+9.1))+r*60.));
  float core=exp(-d*d*(1.6-m*.9)); float halo=exp(-d*.55)*m*.25;
  return starCol(h21(id*3.7+seed))*(core*(.25+2.8*m)+halo)*twk;
}
vec3 starfield(vec2 p, float px, float amt){
  vec3 c=starLayer(p, 26.*px, .55, px, 1., .5)*.55+starLayer(p+.13, 11.*px, .45, px, 31., .4)*.22;
  c+=starLayer(p+.37, 43.*px, .5, px, 7., .6);
  c+=starLayer(p+.71, 97.*px, .55, px, 13., .7)*1.5;
  return c*amt;
}
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;
// ---------- the countryside scene: one shader, every weather is a 0..1 "amount" that fades smoothly ----------
const SCENE = `
uniform float uSun,uRain,uSnow,uFog,uWind,uCloud,uNight,uStorm,uBow,uAcc,uWet,uFlash,uWT,uSmoke;
uniform vec2 uFP;
const float YH=.03;
vec2 SP; vec3 SUNC, AMB, DIR; float day, cover, sunVis, lum, PX;
float hFar(float x){ return .04+.075*fbm4(vec2(x*1.3+3.,.5)); }
float hMid(float x){ return -.005+.05*fbm4(vec2(x*2.1+11.,2.))+.012*sin(x*2.3+1.); }
float hNear(float x){ return -.06+.016*sin(x*3.1+.5)+.007*sin(x*7.+2.); }
vec3 lit(vec3 alb, float sh){ return alb*(AMB+DIR*sh); }
vec3 skyCol(vec2 p){
  float y=clamp(p.y-YH,0.,.6);
  float low=1.-smoothstep(.08,.3,SP.y-YH);
  vec3 c=mix(vec3(.66,.80,.95),vec3(.13,.34,.74),pow(y/.5,.65));
  c=mix(c,vec3(1.,.72,.5),low*.35*exp(-y*6.)*uSun);
  vec3 gray=mix(vec3(.66,.69,.72),vec3(.47,.51,.56),y*2.);
  c=mix(c,gray,smoothstep(.2,1.,cover)*.9);
  c=mix(c,mix(vec3(.32,.35,.39),vec3(.17,.19,.23),y*2.),uStorm);
  float d=length(p-SP);
  c+=SUNC*(.1*exp(-d*3.)+.4*exp(-d*14.))*sunVis;
  vec3 nc=mix(vec3(.05,.08,.15),vec3(.008,.014,.04),pow(y/.5,.6));
  nc=mix(nc,vec3(.045,.05,.06),smoothstep(.2,1.,cover)*.85);
  return mix(c,nc,uNight);
}
// puffy cumulus clouds: each cloud is a soft "height map" made of round puffs blended together,
// lit from the sun's side so it looks like a real 3-D cloud with bumpy cauliflower edges
float smax(float a, float b, float k){ float h=max(k-abs(a-b),0.)/k; return max(a,b)+h*h*k*.25; }
float cloudH(vec2 lp, float fi){
  float H=-9.;
  for(int k=0;k<6;k++){
    float fk=float(k), c=1.-abs(fk-2.5)/2.5;
    vec2 o=vec2((fk-2.5)*.5+(h11(fi*11.+fk)-.5)*.35, .05+c*.75*(.55+h11(fi*13.+fk)*.6));
    float r=.5+.55*c*(.6+.6*h11(fi*17.+fk));
    vec2 d=(lp-o)/r;
    float dd=dot(d,d);
    H=smax(H,(dd<1.?sqrt(1.-dd):1.-sqrt(dd))*r,.35);
  }
  return H-(1.-smoothstep(-.95,-.55,lp.y));
}
vec3 clouds(vec2 p, vec3 col){
  vec3 L=normalize(vec3((SP-vec2(0.,.22))*vec2(1.6,1.),.5));
  L=normalize(mix(L,vec3(-.3,.6,.5),uNight));
  float gloom=1.-.4*smoothstep(.6,.95,cover);
  vec3 lightC=mix(mix(vec3(1.,.97,.92),SUNC,.35)*(.42+AMB.g*.55+DIR.g*.8)*gloom,vec3(.12,.13,.17)*(1.-.5*smoothstep(.6,1.,cover)),uNight);
  vec3 shadC=mix(mix(vec3(.40,.46,.57),vec3(.2,.22,.26),uStorm)*(.32+AMB.g*.8)*gloom,vec3(.025,.03,.045),uNight);
  float bump=-1.;
  for(int i=0;i<7;i++){
    float fi=float(i), hr=h11(fi*7.13+.5);
    if(hr>cover*1.1+.22) continue;
    float sz=(.06+.045*h11(fi*3.7))*(.8+.6*cover);
    float span=2.6;
    float cx=mod(h11(fi*1.91)*span+uWT*(.006+.004*h11(fi*5.)),span)-span*.5;
    float cy=YH+.09+.13*h11(fi*9.31)+sz*.2;
    vec2 lp=(p-vec2(cx,cy))/sz;
    if(abs(lp.x)>3.||lp.y<-1.1||lp.y>2.3) continue;
    if(bump<0.) bump=fbm4(p*vec2(24.,28.)+vec2(uWT*.02,0.));
    vec2 wp=lp+(vec2(bump,fbm3(p*40.+5.))-.5)*.35;                 // bumpy edges
    float H=cloudH(wp,fi);
    if(H<=0.) continue;
    float e=.08;
    float hx=cloudH(wp+vec2(e,0.),fi), hy=cloudH(wp+vec2(0.,e),fi);
    vec3 N=normalize(vec3(-(hx-H)/e,-(hy-H)/e,1.2));
    float dif=clamp(.45+.55*dot(N,L),0.,1.);
    float a=smoothstep(0.,.18,H-.04);
    float hgt=smoothstep(-.9,1.6,lp.y);
    float sh=dif*(.55+.45*hgt)*(.75+.5*bump)*(1.-.25*smoothstep(.9,.0,H));
    vec3 cc=mix(shadC,lightC,clamp(sh,0.,1.15));
    cc+=SUNC*exp(-length(p-SP)*6.)*sunVis*(1.-a*.6)*1.2;            // silver lining near the sun
    cc+=vec3(.7,.75,.95)*uFlash*exp(-length(p-uFP)*7.)*.5*dif;      // a soft, far-away glow of lightning
    col=mix(col,cc,a*(1.-.25*smoothstep(.2,.0,p.y-YH-.08)));
  }
  // a rolling grey blanket of cloud when it is very cloudy, rainy or stormy
  float deck=smoothstep(.72,1.,cover);
  if(deck>0.){
    vec2 q=vec2(p.x*1.4+uWT*.03,p.y*3.2);
    float n=fbm(q), n2=fbm4(q*2.1+n+uWT*.02);
    float sh=clamp(.25+(n2-.35)*1.6+(p.y-YH)*.8,0.,1.);
    vec3 dc=mix(mix(vec3(.38,.41,.46),vec3(.09,.10,.13),uStorm),mix(vec3(.82,.84,.87),vec3(.30,.32,.37),uStorm),sh)*(.55+AMB.g*.8);
    dc=mix(dc,vec3(.04,.045,.06)*(.7+.6*sh),uNight);
    dc+=vec3(.7,.75,.95)*uFlash*exp(-length(p-uFP)*3.)*.9*(.4+sh);
    float a=deck*smoothstep(YH-.01,YH+.12,p.y)*clamp(.75+(n-.45)*1.5,0.,1.);
    col=mix(col,dc,a);
  }
  return col;
}
vec3 skyAll(vec2 p, bool withSunMoon){
  vec3 col=skyCol(p);
  float clr=1.-smoothstep(.2,.9,cover);
  col+=starfield(p+vec2(uT*.002,0.),PX,1.)*uNight*clr*smoothstep(YH,.15,p.y);
  if(withSunMoon){
    float d=length(p-SP);
    col+=SUNC*3.*smoothstep(.034+PX,.034-PX,d)*uSun*day*(1.-.85*smoothstep(.3,.95,cover));
    vec2 MP=vec2(-.2+.02*sin(uT*.01),.31); float md=length(p-MP);
    float mdisk=smoothstep(.03+PX,.03-PX,md);
    float maria=fbm4((p-MP)*60.+3.);
    vec3 moon=vec3(.95,.95,.88)*(1.-.35*smoothstep(.45,.7,maria));
    float mvis=uNight*(1.-.8*smoothstep(.4,1.,cover));
    col=mix(col,moon*1.3,mdisk*mvis);
    col+=vec3(.5,.6,.8)*(.1*exp(-md*9.)+.12*exp(-md*30.))*mvis;
  }
  return clouds(p,col);
}
vec3 bowCol(float x){ float h=(1.-x)*.78; return clamp(abs(fract(h+vec3(0.,2./3.,1./3.))*6.-3.)-1.,0.,1.); }
vec3 rainbow(vec2 p, vec3 col){
  if(uBow<.01) return col;
  vec2 RC=vec2(-SP.x*.3,-.32); float d=length(p-RC);
  float R=.56, W=.05;
  float x=(d-(R-W))/W;
  float env=smoothstep(0.,.25,x)*smoothstep(1.,.75,x);
  float x2=1.-(d-(R*1.3-W*1.4))/(W*1.4);
  float env2=smoothstep(0.,.3,x2)*smoothstep(1.,.7,x2)*.16;
  float fade=smoothstep(YH-.03,YH+.12,p.y)*(.75+.25*fbm4(p*3.+2.));
  vec3 b=bowCol(clamp(x,0.,1.))*env+bowCol(clamp(x2,0.,1.))*env2;
  float inside=smoothstep(R-W,R-W*2.5,d)*.06;                   // the sky is a little brighter inside a rainbow
  return col+(b*.6+inside)*uBow*fade;
}
// ---------- the land ----------
vec3 snowCol(){ return lit(vec3(1.1,1.12,1.17),1.); }
float snowMask(vec2 q, float bias){ return smoothstep(.0,.12,uAcc*1.25-.15+bias-(fbm4(q)-.5)*.6)*smoothstep(.0,.08,uAcc); }
vec3 hills(vec2 p, float which){
  // which: 0 far, 1 mid
  float tex=fbm4(p*vec2(22.,40.)+which*9.), clump=fbm4(p*vec2(9.,16.)+3.+which);
  vec3 alb=which<.5 ? mix(vec3(.12,.22,.10),vec3(.25,.33,.14),clump) : mix(vec3(.13,.26,.08),vec3(.30,.40,.13),clump);
  float trees=smoothstep(.55,.7,fbm4(p*vec2(30.,30.)+which*4.));            // little clumps of far trees
  alb=mix(alb,vec3(.06,.12,.05),trees*.7);
  float sh=.55+.45*clamp(.5+(tex-.5)*1.5+(clump-.5),0.,1.);
  alb*=1.-.25*uWet;
  vec3 c=lit(alb,sh);
  c=mix(c,snowCol()*(.85+.15*sh),snowMask(p*vec2(12.,20.),.15)*(1.-trees*.4));
  float haze=which<.5 ? .38 : .14;
  return mix(c,skyCol(vec2(p.x,YH+.05)),haze*(1.-uNight*.5));
}
float sweep(vec2 q, float x0, float x1, float yb, vec2 S){
  float t=(yb-q.y)/max(-S.y,.001); if(t<0.||t>1.) return 0.;
  float x=q.x-S.x*t;
  return smoothstep(x0-.006,x0+.006,x)*smoothstep(x1+.006,x1-.006,x)*smoothstep(1.,.75,t);
}
vec3 ground(vec2 p){
  float z=.06/max(YH-p.y,.004); vec2 gp=vec2(p.x*z,z);
  float near=smoothstep(-.06,-.45,p.y);
  float big=fbm4(gp*vec2(4.,8.)), sway=uWind*.004*sin(uT*3.+p.x*30.);
  float px2=p.x+sway*(1.+near*3.);
  float blade=mix(noise(vec2(px2*420.,p.y*70.)),.6*noise(vec2(px2*150.,p.y*24.))+.4*noise(vec2(px2*300.,p.y*50.)),near);
  vec3 alb=mix(vec3(.09,.22,.035),vec3(.27,.42,.07),big);
  alb*=.7+.55*blade;
  alb=mix(alb,vec3(.42,.42,.16),smoothstep(.62,.8,fbm4(gp*vec2(9.,14.)+5.))*.5);  // dry patches
  // little flowers
  vec2 fc=vec2(p.x,p.y*1.5)*95.; vec2 fid=floor(fc); vec2 ff=fract(fc)-.5;
  float fr=h21(fid);
  if(fr<.09*smoothstep(.05,.4,near)){ float d=length((ff-(h22(fid)-.5)*.6)*vec2(1.,1.4)); float k=h21(fid+4.);
    vec3 fl=k<.4?vec3(.95,.95,.9):k<.75?vec3(1.,.85,.2):vec3(.75,.45,.9);
    alb=mix(alb,fl,smoothstep(.13,.07,d)*(1.-uAcc)*(1.-.5*uNight)); }
  alb*=1.-.32*uWet;
  // shadows of the house and tree (they move with the sun)
  float el=max(SP.y-YH,.06);
  vec2 S=vec2(-(SP.x+.1)*.55,-.045)*(.15/el);
  float shd=sweep(p,-.565,-.25,-.13,S*.9);
  shd=max(shd,sweep(p,.392,.41,-.152,S*1.05));
  vec2 ce=vec2(.40,-.152)+S*1.75; vec2 dd=(p-ce)/vec2(.14+abs(S.x)*.4,.035+abs(S.y)*.5);
  shd=max(shd,smoothstep(1.05,.85,length(dd)+.25*(fbm4(p*30.)-.5))*smoothstep(-.15,-.16,p.y));
  float sunlit=1.-shd*.8;
  // a bit of soft darkness at the bottom of the house and tree
  float ao=1.-.45*exp(-pow(abs(p.y+.13)*50.,2.))*smoothstep(-.58,-.55,p.x)*smoothstep(-.24,-.27,p.x);
  ao*=1.-.4*exp(-length((p-vec2(.40,-.152))*vec2(12.,60.)));
  vec3 c=lit(alb,sunlit*(.75+.25*blade))*ao;
  // snow builds up: first in little patches, then a thick white blanket
  float sm=snowMask(gp*vec2(3.,6.),0.)*(1.-.25*smoothstep(.7,.95,blade)*(1.-uAcc));
  vec3 sn=lit(vec3(1.1,1.12,1.17)*(.92+.08*noise(gp*80.)),sunlit)*ao;
  sn+=vec3(.8,.9,1.)*pow(h21(floor(p*vec2(500.,400.))),40.)*sunVis*2.;   // sparkles
  c=mix(c,sn,sm);
  // puddles appear when it rains, and dry up afterwards
  float pm=smoothstep(.0,.04,fbm4(gp*vec2(1.6,4.)+7.)-(1.08-.45*uWet))*smoothstep(-.1,-.16,p.y)*(1.-uAcc);
  if(pm>0.){
    vec2 rp=vec2(p.x,2.*YH-p.y*.6);
    vec3 refl=skyCol(rp)*.8;
    c=mix(c,refl,pm*.85);
  }
  return c;
}
// ---------- the pond ----------
const vec2 PC=vec2(.02,-.245);
float pondE(vec2 p){ vec2 d=(p-PC)/vec2(.27,.052); return length(d)+.05*(noise(p*25.)-.5); }
vec2 ripples(vec2 p, float amt){
  vec2 n=vec2(0.);
  if(amt<.01) return n;
  vec2 q=(p-PC)*vec2(1.,4.5)*28.;
  for(int k=0;k<2;k++){
    vec2 id=floor(q+float(k)*.5), f=fract(q+float(k)*.5)-.5;
    float ph=fract(uT*.9+h21(id+float(k)*7.));
    vec2 o=(h22(id)-.5)*.5; float r=length(f-o);
    float w=sin((r-ph*.5)*40.)*smoothstep(.12,0.,abs(r-ph*.5))*(1.-ph)*step(h21(id*1.7),amt);
    n+=normalize(f-o+.0001)*w;
  }
  return n*.012;
}
vec3 pond(vec2 p, float e){
  float wind=uWind*.004*sin(p.x*60.+uT*4.)+.0012*sin(p.x*90.-uT*2.)+.0008*sin(p.y*400.+uT*3.);
  vec2 rp=vec2(p.x+.003*sin(p.y*500.+uT*2.)+.002*sin(p.y*230.-uT*1.3),2.*YH-p.y+wind*3.)+ripples(p,uRain);
  rp.y=max(rp.y,YH+.005);
  rp.y=YH+.005+(rp.y-YH)*.9;
  vec3 refl=skyAll(rp,true);
  float edge=smoothstep(.4,1.,e);
  float bank=smoothstep(.35,.95,(p.y-PC.y)/.052)*.8;                     // dark reflection of the far grassy bank
  refl=mix(refl,lit(vec3(.06,.1,.04),.5),bank);
  vec3 deep=lit(vec3(.03,.07,.07),.6);
  vec3 c=mix(deep,refl*.85,.45+.35*edge);
  c=mix(c,lit(vec3(.72,.8,.86),.9),uAcc*.55*(.8+.2*noise(p*vec2(30.,120.))));    // a thin skin of ice when it is snowy
  float rim=smoothstep(.86,1.,e);
  return mix(c,lit(vec3(.22,.2,.12),.7),rim*.7);
}
// ---------- the little house ----------
float box(vec2 p, vec2 a, vec2 b){ vec2 e=vec2(PX*.8); return smoothstep(a.x-e.x,a.x+e.x,p.x)*smoothstep(b.x+e.x,b.x-e.x,p.x)*smoothstep(a.y-e.y,a.y+e.y,p.y)*smoothstep(b.y+e.y,b.y-e.y,p.y); }
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
vec3 windowCol(vec2 p, vec2 a, vec2 b){
  vec2 c=(p-a)/(b-a);
  vec3 day=mix(vec3(.12,.17,.22),skyCol(vec2(p.x*.5,.25+c.y*.2)),.35)*(.7+.3*c.y);
  vec3 glow=vec3(1.,.66,.32)*(1.25+.15*sin(uT*1.3))*(.8+.2*c.y);
  vec3 g=mix(lit(day,1.)*1.3,glow,uNight*.95+(1.-uNight)*.15*smoothstep(.4,1.,cover));
  float frame=max(step(abs(c.x-.5),.06),step(abs(c.y-.5),.06));
  frame=max(frame,1.-box(c,vec2(.07),vec2(.93)));
  return mix(g,lit(vec3(.92,.9,.86),.8),frame);
}
vec4 house(vec2 p){
  if(p.x<-.6||p.x>-.22||p.y<-.14||p.y>.08) return vec4(0.);
  float fL=clamp(.6-SP.x*.9,.15,1.), sL=clamp(.45+SP.x*.9,.15,1.);
  float siding=.9+.1*smoothstep(.35,.0,fract(p.y*150.));
  vec3 wall=vec3(.86,.80,.68)*siding*(.95+.05*noise(p*300.));
  vec4 o=vec4(0.);
  // side wall (in shade under the roof) with two windows
  float sw=box(p,vec2(-.42,-.13),vec2(-.25,-.046));
  if(sw>0.){
    vec3 c=lit(wall*.92,sL)*(1.-.35*smoothstep(-.058,-.046,p.y));
    float w1=box(p,vec2(-.39,-.105),vec2(-.355,-.068)), w2=box(p,vec2(-.315,-.105),vec2(-.28,-.068));
    c=mix(c,windowCol(p,vec2(-.39,-.105),vec2(-.355,-.068)),w1);
    c=mix(c,windowCol(p,vec2(-.315,-.105),vec2(-.28,-.068)),w2);
    o=vec4(c,sw);
  }
  // front wall + the triangle (gable) on top
  vec2 A=vec2(-.4925,.02);
  float tri=smoothstep(PX,-PX,p.y-(A.y-abs(p.x-A.x)*.91))*step(-.046,p.y);
  float fw=max(box(p,vec2(-.565,-.13),vec2(-.42,-.046)),tri*step(-.565,p.x)*step(p.x,-.42));
  if(fw>0.){
    vec3 c=lit(wall,fL);
    c=mix(c,lit(vec3(.45,.12,.09),fL)*(.85+.15*smoothstep(.4,.6,fract(p.x*400.))),box(p,vec2(-.505,-.13),vec2(-.48,-.078)));
    c=mix(c,lit(vec3(.9,.75,.3),1.)*1.3,smoothstep(.0028,.0015,length(p-vec2(-.485,-.105))));
    c=mix(c,windowCol(p,vec2(-.55,-.105),vec2(-.525,-.072)),box(p,vec2(-.55,-.105),vec2(-.525,-.072)));
    c=mix(c,windowCol(p,vec2(-.46,-.105),vec2(-.435,-.072)),box(p,vec2(-.46,-.105),vec2(-.435,-.072)));
    float rw=length(p-vec2(-.4925,-.014));
    c=mix(c,windowCol(p,vec2(-.502,-.024),vec2(-.483,-.004)),smoothstep(.0095,.0085,rw));
    c=mix(c,lit(vec3(.92,.9,.86),fL),smoothstep(.0012,.0,abs(rw-.0095)));
    c*=1.-.25*smoothstep(-.12,-.13,p.y);
    o=mix(o,vec4(c,1.),fw);
  }
  // the roof (seen on the right) with shingles, and its edge on the front
  vec2 E=vec2(-.406,-.055), e1=E-A, v=vec2(.17,0.);
  float s=(p.y-A.y)/e1.y, u=(p.x-A.x-s*e1.x)/v.x;
  float roof=smoothstep(-.004,.004,s)*smoothstep(1.004,.996,s)*smoothstep(-.002,.002,u)*smoothstep(1.002,.998,u);
  if(roof>0.){
    float row=floor(s*16.); float sh=smoothstep(.0,.25,fract(s*16.))*(.8+.2*step(.08,fract(u*34.+row*.5)));
    vec3 c=lit(vec3(.42,.16,.11)*(.75+.35*h21(vec2(row,floor(u*34.+row*.5))))*sh,clamp(.55+SP.x*.6,.25,1.));
    c=mix(c,lit(vec3(1.12,1.14,1.18),.95)*(.88+.12*s),snowMask(vec2(u*9.,s*3.),.3));
    o=mix(o,vec4(c,1.),roof);
  }
  float edge=min(seg(p,A,E),seg(p,A,vec2(-.579,-.055)));
  float trim=smoothstep(.0045,.003,edge);
  vec3 tc=lit(vec3(.32,.12,.08),fL*.8);
  tc=mix(tc,lit(vec3(.93,.95,.98),1.),smoothstep(.3,.6,uAcc)*step(A.y-abs(p.x-A.x)*.867,p.y));
  o=mix(o,vec4(tc,1.),trim);
  // snow piles up along the top of the roof
  float cap=box(p,vec2(A.x,A.y-.001),vec2(A.x+v.x,A.y+.007*uAcc))*step(.05,uAcc);
  o=mix(o,vec4(lit(vec3(.93,.95,.98),1.),1.),cap);
  // chimney
  float ch=box(p,vec2(-.37,-.005),vec2(-.345,.05));
  if(ch>0.){
    vec2 bq=p*vec2(160.,320.); bq.x+=.5*mod(floor(bq.y),2.);
    float br=step(.12,fract(bq.x))*step(.15,fract(bq.y));
    vec3 c=lit(mix(vec3(.55,.55,.53),vec3(.5,.2,.14),br)*(.85+.3*h21(floor(bq))),clamp(.5+SP.x,.3,1.));
    c=mix(c,lit(vec3(.93,.95,.98),1.),box(p,vec2(-.372,.05),vec2(-.343,.05+.006*uAcc))*step(.05,uAcc));
    o=mix(o,vec4(c,1.),ch);
  }
  o=mix(o,vec4(lit(vec3(.93,.95,.98),1.),1.),box(p,vec2(-.372,.05),vec2(-.343,.05+.006*uAcc))*step(.05,uAcc));
  return o;
}
// ---------- the tree (it sways in the wind) ----------
vec4 tree(vec2 p){
  if(p.x<.22||p.x>.6||p.y<-.16||p.y>.27) return vec4(0.);
  float bend=smoothstep(-.15,.22,p.y);
  float sway=(uWind*(.012+.007*sin(uT*1.9)+.004*sin(uT*4.3))+.0015*sin(uT*.7))*bend*bend;
  vec2 q=p-vec2(sway,0.);
  vec4 o=vec4(0.);
  // trunk and a few branches
  float w=.011-(q.y+.152)*.025;
  float tr=smoothstep(PX,-PX,abs(q.x-.40-(q.y+.15)*.02)-w)*step(-.153,q.y)*step(q.y,.06);
  tr=max(tr,smoothstep(.004,.002,seg(q,vec2(.40,-.04),vec2(.35,.03))));
  tr=max(tr,smoothstep(.0035,.0018,seg(q,vec2(.405,-.02),vec2(.46,.04))));
  if(tr>0.){
    float bark=noise(vec2(q.x*500.,q.y*50.));
    float side=clamp(.5+(q.x-.40)/max(w,.002)*.5*sign(SP.x-.40),0.,1.);
    o=vec4(lit(vec3(.25,.17,.11)*(.7+.5*bark),.3+.7*side),tr);
  }
  // the leafy crown: a few bumpy blobs
  float d=min(min(length((q-vec2(.40,.085))/vec2(.125,.105)),length((q-vec2(.325,.035))/vec2(.085,.07))),
              min(length((q-vec2(.478,.04))/vec2(.085,.072)),length((q-vec2(.405,.16))/vec2(.085,.07))));
  float flut=uT*uWind*.9;
  float cl=fbm4(q*22.+vec2(flut,0.));
  float lv=.6*fbm3(q*60.+vec2(flut*3.,0.))+.4*noise(q*140.+vec2(flut*4.,0.));
  float e=d+.30*(cl-.5)+.14*(lv-.5);
  float a=smoothstep(1.,.96,e);
  if(a>0.){
    vec2 nrm=(q-vec2(.40,.07))/.15;
    vec2 ld=normalize(SP-vec2(.40,.07));
    float face=clamp(.5+.5*dot(nrm,ld)*1.3,0.,1.);
    float sh=face*(.45+.8*cl)*(.7+.3*smoothstep(-.6,.6,nrm.y));
    vec3 alb=mix(vec3(.08,.18,.04),vec3(.30,.44,.10),smoothstep(.35,.75,cl*.6+lv*.4));
    alb*=1.-.55*smoothstep(.45,.25,cl);                 // dark gaps between leaf clumps
    alb*=1.-.2*uWet;
    vec3 c=lit(alb,sh)*(.75+.25*smoothstep(-.8,.4,nrm.y));
    float sm=snowMask(q*28.,-.15)*smoothstep(-.1,.5,nrm.y)*smoothstep(.45,.6,cl);
    c=mix(c,lit(vec3(.9,.92,.96),.9),sm);
    o=mix(o,vec4(c,1.),a);
  }
  return o;
}
// ---------- falling and blowing things ----------
float rainL(vec2 p, float sc, float spd, float seed, float dens){
  vec2 q=p; q.x+=q.y*(.1+uWind*.5);
  q*=vec2(sc,sc*.12); q.y+=uT*spd;
  vec2 id=floor(q), f=fract(q);
  if(h21(id+seed)>dens) return 0.;
  float x=.2+.6*h21(id*1.37+seed), w=PX*sc*1.2;
  float y0=h21(id*2.1+seed)*.45;
  return smoothstep(w,0.,abs(f.x-x))*smoothstep(y0,y0+.2,f.y)*smoothstep(y0+.55,y0+.35,f.y);
}
float snowL(vec2 p, float sc, float spd, float seed){
  vec2 q=p*sc; q.y+=uT*spd; q.x+=uT*spd*uWind*1.8;
  vec2 id=floor(q), f=fract(q)-.5;
  if(h21(id+seed)>.5) return 0.;
  vec2 o=(h22(id+seed)-.5)*.55+vec2(.14*sin(uT*1.1+h21(id)*6.3),0.);
  float rad=PX*sc*(1.3+1.6*h21(id*3.1+seed));
  return smoothstep(rad,rad*.25,length(f-o));
}
vec4 leafL(vec2 p, float sc, float seed){
  vec2 q=p*sc; q.x-=uT*sc*.5; q.y+=uT*sc*.04;
  vec2 id=floor(q), f=fract(q)-.5;
  if(h21(id+seed)>.07) return vec4(0.);
  float ph=h21(id*5.+seed)*6.3;
  vec2 o=vec2(.2*sin(uT*1.7+ph),.25*sin(uT*2.3+ph));
  vec2 l=rot(uT*(2.+2.*h21(id))+ph)*(f-o);
  float d=length(l*vec2(1.,2.2));
  float a=smoothstep(.12,.09,d);
  float k=h21(id*9.+seed);
  vec3 c=k<.35?vec3(.75,.35,.08):k<.65?vec3(.85,.65,.12):vec3(.3,.45,.1);
  return vec4(lit(c,.8),a);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y;
  float zoom=max(1.,1.3/(uRes.x/uRes.y));
  vec2 p=uv*zoom-vec2(.035,0.); PX=zoom/uRes.y;
  float sa=1.05*sin(uT*.05+.4); SP=vec2(.55*sin(sa),YH+.06+.25*cos(sa));
  day=1.-uNight; cover=uCloud;
  sunVis=uSun*day*(1.-.85*smoothstep(.3,1.,cover));
  SUNC=mix(vec3(1.,.6,.32),vec3(1.,.94,.84),smoothstep(.06,.25,SP.y-YH));
  vec3 dayAmb=mix(vec3(.30,.35,.45),vec3(.62,.64,.68),smoothstep(.2,1.,cover))*(1.-.5*uStorm);
  AMB=mix(dayAmb,vec3(.03,.045,.08),uNight);
  DIR=SUNC*.85*sunVis+vec3(.07,.09,.14)*uNight*(1.-.7*smoothstep(.3,1.,cover));
  vec3 col; float fogD;
  float hn=hNear(p.x), hm=hMid(p.x), hf=hFar(p.x);
  bool gnd=false;
  if(p.y>hf){ col=rainbow(p,skyAll(p,true)); fogD=1.; }
  else if(p.y>hm){ col=hills(p,0.); fogD=.95; }
  else if(p.y>hn){ col=hills(p,1.); fogD=.85; }
  else {
    gnd=true;
    float e=pondE(p);
    col=e<1. ? pond(p,e) : ground(p);
    fogD=mix(.75,.3,smoothstep(-.06,-.45,p.y));
  }
  // reeds and cattails at the ends of the pond
  if(abs(p.y-PC.y-.03)<.05){
    for(int k=0;k<2;k++){
      float side=k==0?-1.:1.;
      float bx=PC.x+side*.235, rx=(p.x-bx)/.06;
      if(abs(rx)<1.){
        float cell=floor(p.x*170.), fx=fract(p.x*170.)-.5, hr=h11(cell+side*31.);
        float xr=(cell+.5)/170.; float ex=(xr-PC.x)/.27;
        float by=PC.y+.052*sqrt(max(1.-ex*ex,0.))*(side>0.?.2:.3)-.004;
        float ht=(.02+.035*hr)*(1.-abs(rx)*.7);
        float yy=(p.y-by)/ht; float lean=(uWind*.35+.05*sin(uT*1.3+hr*6.))*yy*yy;
        float m=step(hr,.9)*step(0.,yy)*step(yy,1.)*smoothstep(.22,.1,abs(fx-lean*8.+(hr-.5)*.4)*(1.+yy));
        vec3 rc=lit(mix(vec3(.12,.2,.05),vec3(.38,.42,.15),yy*hr),.8);
        float cat=step(.55,hr)*smoothstep(.13,.05,abs(fx-lean*8.+(hr-.5)*.4))*step(.7,yy)*step(yy,.92);
        rc=mix(rc,lit(vec3(.25,.13,.06),.7),cat);
        rc=mix(rc,lit(vec3(.9,.92,.96),1.),uAcc*step(.85,yy)*.8);
        col=mix(col,rc,max(m,cat));
      }
    }
  }
  vec4 h=house(p); col=mix(col,h.rgb,h.a); fogD=mix(fogD,.62,h.a);
  vec4 t=tree(p); col=mix(col,t.rgb,t.a); fogD=mix(fogD,.6,t.a);
  // warm light from the windows spills out at night
  col+=vec3(1.,.6,.28)*uNight*.06*exp(-length((p-vec2(-.42,-.12))*vec2(5.,9.)));
  // chimney smoke drifts away in the wind
  vec2 sq=p-vec2(-.3575,.05);
  if(sq.y>0.&&uSmoke>.01){
    float path=sq.y*sq.y*2.5*(.3+uWind*2.)+.012*sin(sq.y*25.-uT*1.2)*(1.-uWind*.5);
    float wdt=.004+sq.y*.18;
    float den=fbm4(vec2((sq.x-path)/wdt*.6,sq.y*14.-uT*.9))*smoothstep(wdt,0.,abs(sq.x-path))*exp(-sq.y*7.)*smoothstep(0.,.01,sq.y);
    col=mix(col,lit(vec3(.8,.8,.82),.8),clamp(den*1.6,0.,1.)*uSmoke*.65);
  }
  // rain splashes on the grass
  if(gnd&&uRain>.01&&pondE(p)>1.){
    vec2 sq2=p*vec2(55.,110.); vec2 id=floor(sq2), f=fract(sq2)-.5;
    float ph=fract(uT*2.2+h21(id*3.3));
    float sp=step(h21(id+1.7),.3*uRain)*smoothstep(.12,.0,abs(length(f*vec2(1.,1.6))-ph*.45))*(1.-ph);
    col+=vec3(.6,.65,.7)*sp*(.25+.75*AMB.g+DIR.g)*.45*(1.-uAcc);
  }
  // falling rain
  if(uRain>.01){
    float dn=.25+.55*uRain;
    float r=rainL(p,150.,18.,1.,dn)*.35+rainL(p,90.,11.,7.,dn)*.6+rainL(p,50.,6.5,13.,dn*.8);
    vec3 rc=vec3(.75,.8,.86)*(.25+.9*AMB.g+.5*DIR.g);
    col=mix(col,rc,clamp(r,0.,1.)*.32*uRain);
    col=mix(col,rc*.85,uRain*.12*fogD*(1.-.6*uStorm));
  }
  // falling snow
  if(uSnow>.01){
    float s=snowL(p,55.,8.,3.)*.6+snowL(p,32.,5.5,9.)*.8+snowL(p,17.,3.6,21.);
    col=mix(col,lit(vec3(.97,.98,1.),.9)*1.1,clamp(s,0.,1.)*uSnow);
  }
  // leaves blowing in the wind
  if(uWind>.01){
    vec4 lf=leafL(p,18.,5.); vec4 lf2=leafL(p+.3,11.,11.);
    col=mix(col,lf.rgb,lf.a*uWind*(1.-uAcc*.7)); col=mix(col,lf2.rgb,lf2.a*uWind*(1.-uAcc*.7));
  }
  // fog: the farther away, the more it hides; plus slow drifting wisps
  float wisp=(fbm4(vec2(p.x*2.5+uT*.03,p.y*7.))-.45)*.7*smoothstep(.35,-.1,p.y);
  vec3 fc=mix(vec3(.75,.78,.8)*(.45+.6*AMB.g+.25*DIR.g),vec3(.07,.08,.1),uNight);
  col=mix(col,fc,uFog*clamp(fogD*.9+wisp,0.,1.));
  col+=SUNC*exp(-length(p-SP)*5.)*sunVis*uFog*.35;
  col+=vec3(.55,.6,.75)*uFlash*.035;
  gl_FragColor=vec4(finish(col*.92,uv),1.);
}`;
</script>
<script>
'use strict';
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// the weather buttons and a TRUE fun fact for each one
const WX = [
  { k: 'sun', e: '☀️', t: 'Sunshine', fact: 'The Sun is a star! Its light takes about 8 minutes to reach us. Shadows are longest in the morning and evening, when the Sun is low.' },
  { k: 'rain', e: '🌧️', t: 'Rain', fact: 'Raindrops are not shaped like tears! Small raindrops are round, and big ones get squished flat on the bottom, like a hamburger bun.' },
  { k: 'snow', e: '❄️', t: 'Snow', fact: 'No two snowflakes are exactly alike, but almost all of them have six sides or six arms!' },
  { k: 'fog', e: '🌫️', t: 'Fog', fact: 'Fog is a cloud that touches the ground! It is made of billions of tiny water drops floating in the air.' },
  { k: 'wind', e: '🍃', t: 'Wind', fact: 'Wind is moving air. The Sun warms some places more than others, warm air rises, and cooler air rushes in to take its place.' },
  { k: 'cloud', e: '☁️', t: 'Clouds', fact: 'A big puffy cloud is made of tiny water drops, and all that water can weigh as much as 100 elephants!' },
  { k: 'bow', e: '🌈', t: 'Rainbow', fact: 'Rainbows happen when sunlight shines through raindrops. To see one, the Sun has to be behind you, and red is always on the outside!' },
  { k: 'night', e: '🌙', t: 'Night', fact: 'The Moon does not make its own light. It shines because sunlight bounces off it!' },
  { k: 'storm', e: '⛈️', t: 'Storm', fact: 'A lightning bolt is hotter than the surface of the Sun! But it only lasts a tiny part of a second.' },
];
const THERMO_FACT = 'Water freezes into ice at 32 degrees Fahrenheit. That is why it has to be cold for snow!';
const on = { sun: true };
const tried = new Set(); let won = false;
// what each weather amount should become (the shader fades to it smoothly)
const cur = { sun: 1, rain: 0, snow: 0, fog: 0, wind: 0, cloud: .12, bow: 0, night: 0, storm: 0 };
let acc = 0, wet = 0, flash = 0, wt = 0, temp = 76, smoke = 0, fp = [0, .3];
function targets() {
  const rain = Math.max(on.rain ? .6 : 0, on.storm ? 1 : 0);
  const cloud = Math.max(.12, on.cloud ? .7 : 0, on.rain ? (on.sun ? .5 : .86) : 0, on.storm ? 1 : 0, on.snow ? .7 : 0, (!on.sun && !on.night) ? .6 : 0);
  return { sun: on.sun ? 1 : 0, rain, snow: on.snow ? 1 : 0, fog: on.fog ? 1 : 0, wind: Math.max(on.wind ? 1 : 0, on.storm ? .75 : 0),
    cloud, bow: (on.sun && rain > 0 && !on.night && !on.storm) ? 1 : 0, night: on.night ? 1 : 0, storm: on.storm ? 1 : 0 };
}
function targetTemp() {
  let T = 72;

factEl.textContent = '🤓 Tap the weather buttons! You can mix them, like sun + rain, or snow + wind.';
document.getElementById('thermo').addEventListener('click', () => { factEl.textContent = '🌡️ ' + THERMO_FACT; });

document.getElementById('clearBtn').addEventListener('click', e => { e.stopPropagation(); Object.keys(on).forEach(k => on[k] = false); on.sun = true; factEl.textContent = '☀️ A nice clear day!'; refresh(); });

// thermometer
const tnum = document.getElementById('tnum'), tword = document.getElementById('tword'), merc = document.getElementById('merc');
function drawThermo() {

// ---------- the drawing engine (from Realism): one full-screen shader, auto-resolution for iPad speed ----------

function update(dt) {

// hide / show buttons, keyboard (1-9 = weather buttons)
const ui = document.getElementById('ui');
document.getElementById('hideBtn').addEventListener('click', e => { e.stopPropagation(); ui.classList.add('hidden'); });

const soundBtn = document.getElementById('soundBtn');

// ---------- gentle, optional sound (OFF by default, very quiet, always fades; NO thunder) ----------
