<script>
// 🎬 REPLAY STUDIO: each run is saved as the keys held on every frame (from the level start), so the Game Factory book
// can play it back exactly. Gameplay Math.random uses a seeded dice during recording/replay so it happens the same way.
// Saved in localStorage.gfReplays = { [file]: [ {id, date, level, lv, frames, data, taps, sync, won, fav, seed, ctx, st, post} ] } (newest first).
// ?replay=N plays back run N with no keys, no saving and no trophies (&speed=0.33|1|2). The game sets RS.hooks.
const RS = (() => {
  const FILE = 'robojump4x.html', MAXF = 60 * 60 * 5, MINF = 180;
  const q = new URLSearchParams(location.search), rn = q.get('replay');
  const R = { FILE, on: false, inUpd: false, starting: false, skip: false, speed: 1, rec: null, play: null, f: 0, desync: -1, done: false, hooks: null };
  const LS = window.localStorage, realRand = Math.random;
  let seed = 1;
  const rng = () => { seed = (seed + 0x6D2B79F5) | 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  Math.random = () => R.on && (R.inUpd || R.starting) ? rng() : realRand();
  const frameSeed = f => { seed = ((R.rec || R.play).seed * 7919 + f * 104729) | 0; };
  R.all = () => { try { const o = JSON.parse(LS.getItem('gfReplays') || '{}'); return o && typeof o === 'object' ? o : {}; } catch (_) { return {}; } };
  const rle = a => { const o = []; for (let i = 0; i < a.length;) { let j = i; while (j < a.length && a[j] === a[i]) j++; o.push(a[i].toString(36) + (j - i > 1 ? '*' + (j - i).toString(36) : '')); i = j; } return o.join(','); };
  const unrle = s => { const a = []; if (s) for (const p of s.split(',')) { const [m, n] = p.split('*'); for (let k = n ? parseInt(n, 36) : 1; k > 0; k--) a.push(parseInt(m, 36)); } return a; };
  R.pack = objs => { let m = 0, b = 1; for (const o of objs) for (const k in o) { if (o[k]) m |= b; b *= 2; } return m; };
  R.unpack = (objs, m) => { let b = 1; for (const o of objs) for (const k in o) { o[k] = !!(Math.floor(m / b) % 2); b *= 2; } };
  R.snap = keys => { const o = {}; for (const k of keys) { try { const v = LS.getItem(k); if (v == null || v.length < 6000) o[k] = v; } catch (_) {} } return o; };
  function store() {                                   // save the run being recorded (never touches the game's own save)
    const r = R.rec; if (!r || r.masks.length < MINF) return;
    try {
      const o = R.all(), L = (o[FILE] || []).filter(x => x && x.id !== r.id);
      L.unshift({ id: r.id, date: r.id, level: r.level, lv: r.lv, frames: r.masks.length, data: rle(r.masks), taps: r.taps, sync: r.sync.join(';'),
                  won: r.won, seed: r.seed, ctx: r.ctx, st: r.st, post: r.post, skip: r.skip });
      let n = 0; o[FILE] = L.filter(x => x.fav || ++n <= 3);
      let s = JSON.stringify(o);
      while (s.length > 150000) {                      // too big: drop the oldest run that isn't a ⭐ favorite
        let old = null;
        for (const k in o) (o[k] || []).forEach(x => { if (!x.fav && x.id !== r.id && (!old || x.id < old.x.id)) old = { k, x }; });
        if (!old) break;
        o[old.k] = o[old.k].filter(x => x !== old.x); s = JSON.stringify(o);
      }
      LS.setItem('gfReplays', s);
    } catch (_) {}
  }
  R.finish = () => { if (R.rec) { R.rec.taps = R.rec.taps.filter(t => t[0] < R.rec.masks.length); store(); R.rec = null; } R.on = false; };
  R.begin = (lv, skip) => {                            // the game calls this at the very top of its level start
    const H = R.hooks; if (!H) return;
    if (R.play) { if (!R.on) { R.on = true; R.starting = true; seed = R.play.seed; } else R.end(); return; }
    if (R.rec) { if (R.inUpd) R.rec.masks.pop(); R.finish(); }
    if (R.inUpd) R.skip = true;                        // the rest of this frame belongs to the old run
    R.rec = { id: Date.now(), lv, skip: !!skip, level: '', seed: (realRand() * 1e9) | 0, ctx: H.ctx(), st: H.st(), post: null, masks: [], taps: [], sync: [], won: false, wonAt: 0 };
    R.f = 0; R.on = true; R.starting = true; seed = R.rec.seed;
  };
  R.tick = () => {                                     // before each update(): false = don't update (replay is over)
    const H = R.hooks, P = R.play;
    if (R.done) return false;
    if (P) {
      if (!R.on) return false;
      if (R.f >= P.masks.length) { R.end(); return false; }
      if (R.f === 0 && P.post) H.setPost(P.post);
      R.starting = false; frameSeed(R.f); H.setIn(P.masks[R.f]);
      if (H.setTap) { const t = P.taps && P.taps.find(t => t[0] === R.f); H.setTap(t ? { x: t[1], y: t[2] } : null); }
      R.inUpd = true; return true;
    }
    if (R.rec) {
      const r = R.rec;
      if (R.f === 0) { r.post = H.post(); r.level = H.label(); }
      R.starting = false; frameSeed(R.f); r.masks.push(H.getIn());
      const t = H.getTap && H.getTap(); if (t) r.taps.push([R.f, Math.round(t.x), Math.round(t.y)]);
    }
    R.inUpd = true; return true;
  };
  R.after = () => {                                    // after each update()
    const H = R.hooks; R.inUpd = false;
    if (R.skip) { R.skip = false; return; }
    if (R.play) {
      if (!R.on || R.done) return;
      if (R.f % 30 === 0 && R.desync < 0 && R.play.syncA[R.f / 30] !== undefined && R.play.syncA[R.f / 30] !== H.pos()) R.desync = R.f;
      R.f++; return;
    }
    const r = R.rec; if (!r) return;
    if (R.f % 30 === 0) r.sync.push(H.pos());
    R.f++;
    if (!H.alive()) { r.masks.pop(); R.finish(); return; }
    if (H.won() && !r.won) { r.won = true; r.wonAt = R.f; }
    if ((r.won && R.f - r.wonAt > 150) || R.f >= MAXF) { R.finish(); return; }
    if (R.f % 600 === 0) store();                      // keep it safe even if the game window is closed
  };
  const bye = () => { if (R.rec) store(); };
  addEventListener('pagehide', bye); document.addEventListener('visibilitychange', () => { if (document.hidden) bye(); });
  // ---------- playing a replay ----------
  function ui(html, end) {
    let d = document.getElementById('rsUI');
    if (!d) { d = document.createElement('div'); d.id = 'rsUI'; document.body.appendChild(d); }
    d.innerHTML = '<style>#tp{display:none!important}</style><div style="position:fixed;top:6px;left:50%;transform:translateX(-50%);z-index:9999;background:#d50000;color:#fff;font:bold 17px Arial,sans-serif;padding:5px 14px;border-radius:14px;box-shadow:0 2px 8px #0008;pointer-events:none">🎬 REPLAY' +
      (R.speed < 1 ? ' 🐢' : R.speed > 1 ? ' ⏩' : '') + '</div>' + (html ? '<div style="position:fixed;inset:0;z-index:9998;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45)"><div style="background:#fff8e1;border:6px solid #b71c1c;border-radius:24px;padding:22px 34px;text-align:center;font:bold 30px Arial,sans-serif;color:#4e342e">' + html +
      (end ? '<br><button id="rsAgain" style="margin-top:14px;font:bold 26px Arial,sans-serif;padding:10px 24px;border-radius:16px;border:0;background:#ffca28;cursor:pointer">🔁 Watch again</button>' : '') + '</div></div>' : '');
    const b = document.getElementById('rsAgain'); if (b) b.onclick = () => location.reload();
  }
  R.end = () => { if (R.done) return; R.done = true; ui('🎬 The End!' + (R.play.won ? '<br>⭐ Level cleared! ⭐' : ''), true); };
  if (rn != null) {
    const P = (R.all()[FILE] || [])[+rn];
    const sp = +q.get('speed'); R.speed = sp >= 0.1 && sp <= 4 ? sp : 1;
    if (P) { R.play = P; P.masks = unrle(P.data); P.syncA = (P.sync || '').split(';'); }
    const mem = Object.assign({}, P && P.st);          // the saves from when it was recorded; nothing gets saved for real
    const SP = Storage.prototype, g = SP.getItem, s = SP.setItem, rm = SP.removeItem;
    SP.getItem = function (k) { return this === LS && k in mem ? mem[k] : g.call(this, k); };
    SP.setItem = function (k, v) { if (this === LS) mem[k] = String(v); else s.call(this, k, v); };
    SP.removeItem = function (k) { if (this === LS) mem[k] = null; else rm.call(this, k); };
    for (const t of ['keydown', 'keyup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'pointerdown', 'pointerup', 'click', 'contextmenu'])
      addEventListener(t, e => { if (!(e.target && e.target.closest && e.target.closest('#rsUI'))) { e.stopImmediatePropagation(); if (t === 'keydown' || t === 'pointerdown') try { R.hooks && R.hooks.wake(); } catch (_) {} } }, true);
  }
  R.boot = () => {                                     // the game calls this at the end of its script
    if (rn == null) return;
    const H = R.hooks, P = R.play;
    ui(P ? '' : '📼 This replay is gone!<br><span style="font-size:20px">Play again to make a new one.</span>', false);
    if (!P) { R.done = true; return; }
    try { H.wake(); } catch (_) {}
    H.setCtx(P.ctx); H.start(P.lv, P.skip);
  };
  return R;
})();
</script>

<script>
// ROBO JUMP 4 EXPANDED (DLC for Robo Jump 4: Mega Morph)
// New morph crystals fall from the CLOCKWORK SKY FACTORY. Robo (with best friend Nega-Robo, King Gloop and Duke Googool)
// gets 4 NEW morphs: TORNADO, PRISM, VINE and CLOCK Robo (all 5 RJ4 morphs still work).
// 4 new worlds x (3-4 levels + 1 boss) = 17 stages. 1 hidden Morph Star per level. Find all 13 + beat the Clockwork King
// and the secret MORPH KNIGHT appears (he morphs into a DRAGON!). Saves in localStorage.robojump4x (never touches RJ4's save).
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, ROWS = 13;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, DJUMP = 11, SPRING = 17, MAXFALL = 14;
const FUEL = 150, AIR = 420;

// ---------- Saves, coins, trophies, stickers, bundles ----------
const QS = new URLSearchParams(location.search), JBX = !!window.JUKEBOX;
function trophy(id) { if (JBX) return; try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.robojump4 = (c.robojump4 || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('robojump4-' + j); } catch (_) { return false; } }   // unlocked in the Bundle Room

let save = { done: {}, stars: {}, look: 'normal', seen: {}, music: true, used: {}, secret: 0 };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('robojump4x') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.done = save.done || {}; save.stars = save.stars || {}; save.seen = save.seen || {}; save.used = save.used || {};
}
function writeSave() { try { localStorage.setItem('robojump4x', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- Looks (hats + Mini Nega from the Bundle Room) ----------
const LOOKS = [
  { id: 'normal', name: 'Robo', bundle: -1 },
  { id: 'propeller', name: 'Propeller Cap', bundle: 0 },
  { id: 'cowboy', name: 'Explorer Hat', bundle: 0 },
  { id: 'wizard', name: 'Morph Wizard Hat', bundle: 1 },
  { id: 'crown', name: 'Crystal Crown', bundle: 1 },
  { id: 'mininega', name: 'Mini Nega', bundle: 2 },
];
const lookOpen = l => l.bundle < 0 || bundleHas(l.bundle);
let lookIdx = Math.max(0, LOOKS.findIndex(l => l.id === save.look));
if (!lookOpen(LOOKS[lookIdx])) lookIdx = 0;
function cycleLook(d) {
  lookIdx = (lookIdx + d + LOOKS.length) % LOOKS.length;
  if (lookOpen(LOOKS[lookIdx])) { save.look = LOOKS[lookIdx].id; writeSave(); }
  sfx.click();
}
const curLook = () => lookOpen(LOOKS[lookIdx]) ? LOOKS[lookIdx].id : 'normal';

// ---------- The 5 morphs ----------
const MORPHS = [
  { id: 'normal', name: 'ROBO', icon: '🤖', w: 30, h: 40, tip: 'Double jump, wall jump, dash and hover!' },
  { id: 'rocket', name: 'ROCKET ROBO', icon: '🚀', w: 30, h: 40, tip: 'Hold JUMP to fly!' },
  { id: 'drill', name: 'DRILL ROBO', icon: '⛏️', w: 32, h: 40, tip: 'Dig through dirt! X = drill dash' },
  { id: 'bubble', name: 'BUBBLE ROBO', icon: '🫧', w: 34, h: 36, tip: 'Float, bounce and swim forever!' },
  { id: 'magnet', name: 'MAGNET ROBO', icon: '🧲', w: 30, h: 40, tip: 'Stick to metal walls and ceilings!' },
  { id: 'mega', name: 'MEGA ROBO', icon: '🦾', w: 60, h: 78, tip: 'SMASH big blocks! DOWN in the air = pound' },
  // ✨ NEW in EXPANDED
  { id: 'tornado', name: 'TORNADO ROBO', icon: '🌪️', w: 34, h: 40, nu: 1, tip: 'Ride the wind! Hold JUMP to glide. X = SPIN!', power: 'Walks right through storm winds, rides UPDRAFTS up high, glides, and SPINS (X) through bad guys.' },
  { id: 'prism', name: 'PRISM ROBO', icon: '💎', w: 30, h: 40, nu: 1, tip: 'Walk through crystal glass! X = light beam!', power: 'Turns into light: walks THROUGH rainbow crystal glass, and X shoots a beam of light.' },
  { id: 'vine', name: 'VINE ROBO', icon: '🌿', w: 30, h: 40, nu: 1, tip: 'X = swing to a flower hook! Climb green stems!', power: 'X shoots a vine to the nearest flower hook and swings! Walks up giant green stems.' },
  { id: 'clock', name: 'CLOCK ROBO', icon: '⏰', w: 32, h: 40, nu: 1, tip: 'X = SLOW TIME! Everything goes slooow!', power: 'X slows down TIME: crushers, platforms, bad guys and bosses all go slooow.' },
];
const NEW_MORPHS = [6, 7, 8, 9];
const MI = {}; MORPHS.forEach((m, i) => MI[m.id] = i);

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump:   () => note(400, 0, 0.15, 'sine', 0.15, 900),
  djump:  () => { note(600, 0, 0.12, 'sine', 0.14, 1300); note(900, 0.05, 0.1, 'triangle', 0.06); },
  hover:  () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  rocket: () => note(90 + Math.random() * 50, 0, 0.07, 'sawtooth', 0.04, 60),
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  star:   () => [880, 1109, 1319, 1760, 2217].forEach((f, i) => note(f, i * 0.07, 0.25, 'sine', 0.12)),
  stomp:  () => note(400, 0, 0.15, 'triangle', 0.2, 100),
  spring: () => note(200, 0, 0.3, 'sine', 0.2, 900),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  check:  () => { note(660, 0, 0.1); note(880, 0.1, 0.2); },
  dash:   () => note(300, 0, 0.2, 'sawtooth', 0.08, 1200),
  drill:  () => { note(160 + Math.random() * 40, 0, 0.08, 'square', 0.05, 120); },
  dig:    () => { note(120, 0, 0.18, 'sawtooth', 0.12, 50); note(400, 0, 0.06, 'square', 0.05, 200); },
  smash:  () => { note(110, 0, 0.4, 'sawtooth', 0.18, 35); note(70, 0.05, 0.4, 'square', 0.1, 30); },
  clank:  () => { note(1200, 0, 0.06, 'square', 0.06, 900); note(600, 0.02, 0.1, 'triangle', 0.08); },
  wall:   () => note(700, 0, 0.1, 'triangle', 0.12, 400),
  morph:  () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.045, 0.16, 'square', 0.06)); note(200, 0, 0.35, 'sine', 0.12, 1600); },
  nomorph: () => { note(300, 0, 0.12, 'square', 0.07); note(220, 0.1, 0.18, 'square', 0.07); },
  splash: () => note(300, 0, 0.25, 'sine', 0.1, 80),
  bubble: () => note(600 + Math.random() * 300, 0, 0.08, 'sine', 0.06, 1200),
  boing:  () => note(260, 0, 0.22, 'sine', 0.14, 620),
  warn:   () => { note(880, 0, 0.08, 'square', 0.08); note(880, 0.12, 0.08, 'square', 0.08); },
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  land:   () => note(80, 0, 0.5, 'triangle', 0.25, 40),
  click:  () => note(700, 0, 0.06, 'square', 0.06),
  win:    () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  // ✨ EXPANDED sounds (soft: sine/triangle, quiet)
  spin:   () => { note(300, 0, 0.25, 'triangle', 0.08, 900); note(600, 0.05, 0.2, 'sine', 0.05, 1500); },
  gust:   () => note(200 + Math.random() * 80, 0, 0.12, 'sine', 0.025, 140),
  beam:   () => { note(1400, 0, 0.12, 'sine', 0.07, 2200); note(2100, 0.03, 0.1, 'sine', 0.035); },
  vine:   () => note(500, 0, 0.18, 'triangle', 0.08, 1100),
  swing:  () => note(350, 0, 0.25, 'sine', 0.08, 700),
  tick:   () => note(1800, 0, 0.03, 'triangle', 0.035),
  tock:   () => note(1100, 0, 0.04, 'triangle', 0.035),
  slow:   () => { [1047, 880, 698, 523].forEach((f, i) => note(f, i * 0.09, 0.3, 'sine', 0.07)); note(400, 0, 0.6, 'sine', 0.05, 150); },
  fast:   () => [523, 698, 880, 1047].forEach((f, i) => note(f, i * 0.06, 0.18, 'sine', 0.06)),
  crush:  () => note(140, 0, 0.18, 'triangle', 0.12, 70),
  glass:  () => { note(2600, 0, 0.2, 'sine', 0.035); note(3300, 0.02, 0.18, 'sine', 0.025); },
};
// every NEW morph has its own transformation tune
const MORPH_TUNES = { tornado: [[392, 0], [494, 0.05], [587, 0.1], [784, 0.15], [988, 0.2], [1175, 0.27]], prism: [[1047, 0], [1319, 0.06], [1568, 0.12], [2093, 0.18], [1568, 0.26], [2093, 0.32]],
  vine: [[262, 0], [330, 0.07], [392, 0.14], [523, 0.21], [659, 0.28], [784, 0.35]], clock: [[1568, 0], [1175, 0.1], [1568, 0.2], [1175, 0.3], [784, 0.4], [1047, 0.5]] };
function morphSound(id) {
  const tune = MORPH_TUNES[id];
  if (!tune) { sfx.morph(); return; }
  tune.forEach(([f, t]) => note(f, t, 0.22, id === 'clock' ? 'triangle' : 'sine', 0.075));
  note(id === 'vine' ? 150 : 220, 0, 0.5, 'sine', 0.08, id === 'clock' ? 330 : 1400);
}

// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);

function buildLevel(st) {

  const set = (c, r, ch) => { if (r >= 0 && r < ROWS && c >= 0 && c < WMAX) map[r][c] = ch; };
  const ground = (n, coinsToo) => {
    for (let i = 0; i < n; i++, x++) {
      for (let r = gy; r < ROWS; r++) set(x, r, '#');
      if (coinsToo) coins.push(Object.assign(center(x, gy - 2), { got: false }));
    }
  };
  const star = (c, r) => { const k = si++; if (k < 1) stars.push(Object.assign(center(c, r), { k, got: false, old: !!done[k] })); };
  const wall = (n, ch) => { for (let i = 0; i < n; i++) { ground(1); for (let r = 0; r < gy; r++) set(x - 1, r, ch); } };
  const cliff = (n, ch) => { gy -= n; ground(1); for (let r = gy; r < ROWS; r++) set(x - 1, r, ch); };
  const hill = (n, ch, hasStar) => {
    const x0 = x; ground(n);
    for (let c = x0; c < x0 + n; c++) for (let r = gy - 3; r < gy; r++) set(c, r, ch);
    if (hasStar) { const c = x0 + Math.floor(n / 2); set(c, gy - 1, ' '); star(c, gy - 1); }   // a secret star sealed inside
  };
  for (const tok of lv.map.trim().split(/\s+/)) {
    const ch = tok[0], hidden = tok.endsWith('*'), n = parseInt(tok.slice(1)) || 0;
    if (ch === 'F') ground(n || 1);
    else if (ch === 'C') ground(n || 1, true);
    else if (ch === 'G') x += n || 2;
    else if (ch === 'U') gy -= n || 1;
    else if (ch === 'D') gy += n || 1;
    else if (ch === 'B') {
      const x0 = x; x += n;
      for (let i = 0; i < n; i++) if (i % 3 !== 2) { set(x0 + i, gy - 1, '='); coins.push(Object.assign(center(x0 + i, gy - 2), { got: false })); }
    }
    else if (ch === 'E') { enemies.push({ x: x * T + 6, y: (gy - 1) * T + 12, w: 28, h: 28, vx: -1, kind: 'blob', dead: 0 }); ground(1); }
    else if (ch === 'Y') { const p = center(x, gy - 3); enemies.push({ x: p.x - 16, y: p.y - 14, w: 32, h: 28, y0: p.y - 14, vx: 0, kind: 'fly', dead: 0, ph: x }); ground(1); }
    else if (ch === 'M') { springs.push({ x: x * T + 2, y: gy * T - 22, w: T - 4, h: 22, t: 0 }); ground(1); }

    if (tap) for (let i = 0; i <= SECRET_ID; i++) { const n = mapNode(i); if (stageOpen(i) && Math.hypot(tap.x - n.x, tap.y - n.y) < 30) { mapSel = i; startStage(i); break; } }
    if (state === 'map' && (press.space || press.enter || press.x)) startStage(mapSel);
    if (state === 'map' && (press.esc || inBox(tap, BACK_BTN))) state = 'title';
  } else if (state === 'talk') {
    talk.t++;
    if ((press.jump || press.enter || press.x || tap) && talk.t > 12) {
      talk.i++; talk.t = 0; sfx.click();
      if (talk.i >= talk.lines.length) { const a = talk.after; talk = null; a(); }
    }
  } else if (state === 'play') {
    timer++;
    const list = openMorphs();
    if (tap && list.length > 1) list.forEach((m, k) => { if (inBox(tap, morphBtn(k, list.length))) { setMorph(m); tap = null; } });
    updatePlayer();
    if (state === 'play') updateWorld();
    if (boss && state === 'play') { bossAcc += slowK(); while (bossAcc >= 1 && state === 'play') { bossAcc--; updateBoss(); } if (state === 'play') bossTouch(); }
    if (state === 'play') updateShots();
    const target = Math.max(0, Math.min(cols * T - W, player.x - W * (lvlDir > 0 ? 0.4 : 0.6)));
    camX += (target - camX) * 0.15;
    if (press.esc || inBox(tap, BACK_BTN)) { state = 'map'; setSong('title'); }
  } else if (state === 'oops') {
    timer++;
    if (timer > 80) { player.hp = 0; doRespawn(); state = 'play'; }
  } else if (state === 'clear') {
    timer++;
    if (timer % 20 === 0) burst(camX + 200 + Math.random() * 560, 150 + Math.random() * 150, ['#ffd740', '#ea80fc', '#80d8ff', '#69f0ae'], 16, 5);
    if (timer > 60 && (press.jump || press.enter || press.x || tap)) afterClear();
  } else if (state === 'credits') {
    timer++;
    if (timer % 25 === 0) burst(Math.random() * W, 100 + Math.random() * 300, ['#ffd740', '#ea80fc', '#80d8ff', '#69f0ae'], 16, 5);
    if (timer > 240 && (press.jump || press.enter || press.x || tap)) { if (creditsSecret && !creditsBonus && 520 - timer * 0.9 + CREDITS_SECRET.length * 40 >= 60) creditsBonus = true; else { creditsBonus = false; afterCredits(); } }
  }
  for (const k in press) press[k] = false;
  tap = null;
}

// ---------- Drawing helpers (same as Robo Jump 3) ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function bang(x, y, s = 1) {                            // the big "!" warning bubble
  const k = s * (1 + Math.sin(frame * 0.4) * 0.12);
  circle(x, y, 20 * k, frame % 16 < 8 ? '#ff1744' : '#ffea00');
  text('!', x, y + 11 * k, 30 * k, '#fff');
}
function drawGear(x, y, r, a, fill) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(a); ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const ang = i / 16 * Math.PI * 2, rr = i % 2 ? r : r * 1.22; ctx.lineTo(Math.cos(ang) * rr, Math.sin(ang) * rr); }

}
function drawCoin(x, y) {
  const w = Math.abs(Math.cos(frame * 0.08 + x * 0.01)) * 12 + 2;
  circle(x, y, 18, 'rgba(255,215,64,.25)');
  ellipse(x, y, w, 14, '#ffb300'); ellipse(x, y, w * 0.6, 9, '#fff3b0');
}
function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }

// 👑 King Gloop (friendly now: big smile, no angry eyebrows). (x, y) = top-left, s = size scale
function drawGloop(x, y, s = 1, golden = false) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);

// 🎩 Duke Googool: tall green-and-black goo duke, monocle, spiky top hat. (x, y) = top-left of a ~70x150 box
function drawDuke(x, y, s = 1, sad = false) {

  // spiky top hat

  ctx.beginPath(); ctx.moveTo(56, 66 + wob); ctx.quadraticCurveTo(62, 85, 54, 100); ctx.stroke();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 3; ctx.beginPath();
  if (sad) ctx.arc(35, 86 + wob, 7, Math.PI + 0.3, -0.3); else { ctx.moveTo(24, 80 + wob); ctx.quadraticCurveTo(35, 88 + wob, 48, 78 + wob); }

// ---------- Backgrounds for every world ----------
const wrap = (v, m) => ((v % m) + m) % m;
function drawSky(th, cam) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, th.sky[0]); g.addColorStop(1, th.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const wi = WORLDS.indexOf(th), t = frame;
  if (th.dark || wi < 0) { ctx.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 40; i++) { const sx = wrap(i * 137 - cam * 0.05, W), sy = (i * 71) % 220; ctx.fillRect(sx, sy, 2, 2); } }
  if (wi === 0) {                                        // ⛈️ storm clouds, soft rain, a far-away fortress, gentle lightning glow
    if (t % 300 < 10) { ctx.fillStyle = `rgba(255,255,255,${0.12 * (1 - (t % 300) / 10)})`; ctx.fillRect(0, 0, W, H); }
    for (let i = 0; i < 6; i++) { const fx = wrap(i * 260 - cam * 0.12, W + 260) - 130; roundRect(fx, 170 - (i % 3) * 30, 60, 220, 4, 'rgba(38,50,56,.55)'); for (let k = 0; k < 4; k++) roundRect(fx - 6 + k * 18, 160 - (i % 3) * 30, 12, 16, 2, 'rgba(38,50,56,.55)'); circle(fx + 30, 210 - (i % 3) * 30, 6, 'rgba(255,241,118,.5)'); }
    for (let i = 0; i < 8; i++) { const cx = wrap(i * 170 - cam * (0.15 + (i % 3) * 0.06) + t * 0.3, W + 240) - 120, cy = 40 + (i * 47) % 140; ellipse(cx, cy, 80, 26, 'rgba(55,71,79,.9)'); ellipse(cx - 40, cy + 8, 46, 20, 'rgba(69,90,100,.95)'); ellipse(cx + 44, cy + 6, 50, 22, 'rgba(84,110,122,.95)'); }
    ctx.strokeStyle = 'rgba(207,216,220,.35)'; ctx.lineWidth = 1.5; ctx.beginPath();
    for (let i = 0; i < 50; i++) { const rx = wrap(i * 53 + t * 2 - cam * 0.3, W), ry = wrap(i * 97 + t * 9, H); ctx.moveTo(rx, ry); ctx.lineTo(rx - 4, ry + 14); }
    ctx.stroke();
    if (t % 300 < 14) { ctx.strokeStyle = 'rgba(255,241,118,.7)'; ctx.lineWidth = 3; ctx.beginPath(); const lx = 150 + (Math.floor(t / 300) * 331) % 660; ctx.moveTo(lx, 40); ctx.lineTo(lx - 25, 110); ctx.lineTo(lx + 8, 118); ctx.lineTo(lx - 18, 200); ctx.stroke(); }
  } else if (wi === 1) {                                 // 💎 floating mirror shards + rainbow light beams
    for (let i = 0; i < 5; i++) { ctx.fillStyle = `hsla(${(i * 70 + t) % 360},90%,70%,.10)`; const bx = wrap(i * 230 - cam * 0.2, W + 300) - 150; ctx.beginPath(); ctx.moveTo(bx, 0); ctx.lineTo(bx + 50, 0); ctx.lineTo(bx + 200, H); ctx.lineTo(bx + 120, H); ctx.fill(); }
    for (let i = 0; i < 12; i++) {
      const cx = wrap(i * 120 - cam * 0.25, W + 120) - 60, cy = 80 + (i * 61) % 240 + Math.sin(t * 0.02 + i) * 8, r = 18 + (i % 4) * 8;
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(Math.sin(t * 0.01 + i) * 0.4);
      ctx.fillStyle = 'rgba(179,229,252,.25)'; ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0, -r); ctx.lineTo(r * 0.6, 0); ctx.lineTo(0, r); ctx.lineTo(-r * 0.6, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(-2, -r * 0.6, 3, r * 0.5); ctx.restore();
    }
  } else if (wi === 2) {                                 // 🌺 giant flowers, big leaves, sunbeams
    circle(820, 80, 50, 'rgba(255,241,118,.45)'); circle(820, 80, 34, '#fff59d');
    for (let i = 0; i < 7; i++) {
      const fx = wrap(i * 190 - cam * 0.25, W + 200) - 100, top = 120 + (i * 53) % 110, col = ['#ff80ab', '#ffd740', '#ea80fc', '#ff8a65', '#80d8ff'][i % 5];
      ctx.strokeStyle = 'rgba(46,125,50,.7)'; ctx.lineWidth = 12; ctx.beginPath(); ctx.moveTo(fx, H); ctx.quadraticCurveTo(fx + 30, (H + top) / 2, fx, top); ctx.stroke();
      ellipse(fx + 24, (H + top) / 2, 26, 10, 'rgba(67,160,71,.7)', -0.5);
      for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2 + t * 0.004 * (i % 2 ? 1 : -1); ellipse(fx + Math.cos(a) * 28, top + Math.sin(a) * 28, 22, 12, col, a); }
      circle(fx, top, 16, '#fff176'); circle(fx - 5, top - 3, 2.5, '#5d4037'); circle(fx + 5, top - 3, 2.5, '#5d4037');

    for (let i = 0; i < 5; i++) drawGear(wrap(i * 240 - cam * 0.3, W + 280) - 140, 110 + (i % 2) * 120, 46 + (i % 3) * 16, t * 0.012 * (i % 2 ? 1 : -1), 'rgba(121,85,72,.28)');
    ctx.fillStyle = 'rgba(121,85,72,.3)'; for (let i = 0; i < 4; i++) { const px = wrap(i * 300 - cam * 0.2, W + 300) - 150; ctx.fillRect(px, 0, 18, 260); ctx.fillRect(px, 240, 120, 18); }
    const cx = wrap(600 - cam * 0.05, W + 200) - 100; circle(cx, 120, 50, 'rgba(255,248,225,.6)'); ctx.strokeStyle = 'rgba(93,64,55,.7)'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(cx, 120); ctx.lineTo(cx + Math.cos(t * 0.02) * 36, 120 + Math.sin(t * 0.02) * 36); ctx.moveTo(cx, 120); ctx.lineTo(cx + Math.cos(t * 0.002) * 24, 120 + Math.sin(t * 0.002) * 24); ctx.stroke();
  } else if (th.secret) {                                // 🛡️ the Morph Crystal Throne: giant crystal pillars + a glowing 4 crest

    for (let i = 0; i < 6; i++) { ctx.strokeStyle = `rgba(179,136,255,${0.1 + i * 0.03})`; ctx.lineWidth = 5; ctx.beginPath(); ctx.ellipse(W / 2, 170, 60 + i * 45 + Math.sin(t * 0.03 + i) * 8, 24 + i * 15, t * 0.002 * (i % 2 ? 1 : -1), 0, 7); ctx.stroke(); }
    text('4', W / 2, 196, 70, `rgba(100,255,218,${0.25 + Math.sin(t * 0.05) * 0.1})`);

    for (let x = 0; x <= W; x += 20) {
      const wx = x + cam * sp;
      let y = base - Math.abs(Math.sin(wx * 0.006 + layer)) * 80;
      if (wi === 1) y = base - Math.abs((wrap(wx * 0.006 + layer, 2)) - 1) * 120;           // pointy crystal hills
      if (wi === 3) y = base - (Math.floor(wx / 90 + layer) % 3) * 40;                    // blocky
      if (wi === 0) y = base - Math.abs(Math.sin(wx * 0.012 + layer)) * 50 - (Math.floor(wx / 140) % 2) * 30;   // castle-ish
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H); ctx.fill(); ctx.globalAlpha = 1;
  }
}

// ---------- Level drawing ----------
function drawTiles() {
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(cols - 1, Math.ceil((camX + W) / T));
  const near = (x, y) => player && Math.abs(x + 20 - (player.x + player.w / 2)) < 200 && Math.abs(y - player.y) < 120 && frame % 60 < 40;
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = map[r][c], x = c * T, y = r * T;
    if (ch === '~') { ctx.fillStyle = 'rgba(41,182,246,.35)'; ctx.fillRect(x, y, T, T); if (tileAt(c, r - 1) !== '~' && !isSolid(tileAt(c, r - 1))) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x, y + Math.sin(frame * 0.08 + c) * 2, T, 3); } continue; }
    if (ch === 'w') {                                  // 🌪️ storm wind: swirly grey-white streaks
      ctx.fillStyle = 'rgba(207,216,220,.22)'; ctx.fillRect(x, y, T, T);
      ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2; ctx.beginPath();
      const o = wrap(-frame * 6 * lvlDir + c * 13 + r * 29, T);
      ctx.moveTo(x + o, y + 10); ctx.lineTo(x + o - 16, y + 10); ctx.moveTo(x + wrap(o + 20, T), y + 28); ctx.lineTo(x + wrap(o + 20, T) - 12, y + 28); ctx.stroke();
      if (r === 0 && c % 3 === 0) text('🌪️', x + 20, 30, 16);
      continue;
    }
    if (ch === 'g') {                                  // 💎 rainbow crystal glass (PRISM ROBO walks through it)
      const pr = isM('prism');
      ctx.fillStyle = `hsla(${(c * 25 + r * 15 + frame) % 360},80%,75%,${pr ? 0.25 : 0.55})`; ctx.fillRect(x, y, T, T);
      ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, T - 2, T - 2);
      ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.beginPath(); ctx.moveTo(x + 6, y + 30); ctx.lineTo(x + 20, y + 6); ctx.lineTo(x + 25, y + 6); ctx.lineTo(x + 11, y + 30); ctx.fill();
      if (!pr && r === Math.floor((player.y + player.h - 1) / T) && near(x, y) && tileAt(c - 1, r) !== 'g') text('💎', x - 14, y + 26, 22);
      continue;
    }
    if (ch === 'l') {                                  // 🌿 giant green stem (VINE ROBO climbs)
      ctx.fillStyle = '#2e7d32'; ctx.fillRect(x, y, T, T); ctx.fillStyle = '#43a047'; ctx.fillRect(x + 6, y, 10, T); ctx.fillStyle = '#1b5e20'; ctx.fillRect(x + 28, y, 4, T);
      if ((r + c) % 3 === 0) ellipse(x + (c % 2 ? T : 0), y + 20, 16, 7, '#66bb6a', c % 2 ? -0.5 : 0.5);
      if (!isSolid(tileAt(c, r - 1))) { for (let k = 0; k < 5; k++) ellipse(x + 20 + Math.cos(k * 1.26) * 16, y - 4 + Math.sin(k * 1.26) * 8, 12, 7, '#ff80ab', k * 1.26); circle(x + 20, y - 4, 7, '#fff176'); }
      if (tileAt(c - 1, r) === ' ' && r === Math.floor((player.y + player.h - 1) / T) && near(x, y)) text('🌿', x - 14, y + 26, 22);
      continue;
    }
    if (ch === '#') {
      const top = !isSolid(tileAt(c, r - 1));
      ctx.fillStyle = theme.ground; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(x + ((c * 7) % 20) + 6, y + ((r * 11) % 20) + 8, 6, 6);
      if (top) { ctx.fillStyle = theme.top; ctx.fillRect(x, y, T, 10); ctx.beginPath(); for (let k = 0; k < 4; k++) ctx.arc(x + 5 + k * 10, y + 10, 5, 0, Math.PI); ctx.fill(); }
    } else if (ch === '=') {
      roundRect(x + 1, y + 2, T - 2, T - 4, 8, theme.block);
      ctx.fillStyle = 'rgba(255,255,255,.3)'; ctx.fillRect(x + 6, y + 6, T - 12, 5);
    } else if (ch === 's') {                            // ☁️ smooth cloud cliff (too slippery to wall jump)
      ctx.fillStyle = '#e3f2fd'; ctx.fillRect(x, y, T, T);
      circle(x + 10, y + 12, 10, '#fff'); circle(x + 28, y + 26, 12, '#fff'); circle(x + 8, y + 34, 7, '#bbdefb');
      if (!isSolid(tileAt(c, r - 1))) { ctx.fillStyle = '#fff'; ctx.beginPath(); for (let k = 0; k < 4; k++) ctx.arc(x + 5 + k * 10, y + 4, 8, Math.PI, 0); ctx.fill(); }
      if (tileAt(c - 1, r) === ' ' && r === Math.floor((player.y + player.h - 1) / T) && near(x, y)) text('🚀', x - 14, y + 26, 22);
    } else if (ch === 'd') {                            // ⛏️ soft dirt
      ctx.fillStyle = '#8d6e63'; ctx.fillRect(x, y, T, T);
      ctx.fillStyle = '#a1887f'; ctx.fillRect(x + 4, y + 6, 8, 6); ctx.fillRect(x + 22, y + 20, 10, 6); ctx.fillRect(x + 8, y + 28, 6, 5);
      ctx.fillStyle = '#6d4c41'; ctx.fillRect(x + 26, y + 6, 5, 5); ctx.fillRect(x + 14, y + 16, 4, 4);
      ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1; ctx.strokeRect(x + 0.5, y + 0.5, T - 1, T - 1);
      if (r === Math.floor((player.y + player.h - 1) / T) && near(x, y) && !isSolid(tileAt(c - lvlDir, r))) text('⛏️', x + 20, y + 28, 22);
    } else if (ch === 'b') {                            // 🦾 big block
      roundRect(x + 1, y + 1, T - 2, T - 2, 4, theme.block);
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x + 4, y + 4, T - 8, 5);
