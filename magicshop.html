<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }

  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #1a2540, #5e35b1 55%, #ff8a65); color: #fff; flex: none; min-height: 96px; }

  .catb.on { background: #5e35b1; color: #fff; box-shadow: 0 4px 0 #1a2540; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #eef1fb; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #4527a0; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }

  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(26,37,64,.15); }

  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #4527a0; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #1a2540; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(13,19,48,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(13,19,48,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8eaf6; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8eaf6; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #4527a0; }
  #printBox .pbTip { font-size: 20px; color: #1a2540; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 🪞✨ GLINT'S MAGIC MIRROR SHOP: Glint (who used to be Mirror Robo in Robo Jump 9) sells REAL paper magic tricks.
// Buy with pretend Sparkle Coins, then pick which orders to PRINT. Nothing prints by itself.
// Every trick comes with a "How the trick works (shh, secret!)" page.
// Save: localStorage.magicShop = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'magicShop';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function coin(x, y, r) { circ(x, y, r, '#ffd740', '#c79100', Math.max(2, r * 0.12)); star(x, y, r * 0.6, OUT ? '#fff' : '#fff8e1', OUT ? '#222' : '#c79100'); }
// ✨ GLINT: copied from drawRoboBase in Robo Jump 9 (Robo's shape) with PAL_GLINT = his OWN sunrise-pink + aqua colors
// (picked when he stopped being Mirror Robo). PAL_MIRROR = his old polished-chrome look (used for his reflection).
const PAL_GLINT = { head: '#ffe3ef', body: '#fff0e0', visor: '#1a2540', eye: '#64ffda', legs: '#ff9e80', pod: '#64ffda' };
const PAL_MIRROR = { head: '#dfe7ee', body: '#c9d4dc', visor: '#1c2a3a', eye: '#b3ecff', legs: '#8fa3b0', pod: '#eef3f7' };
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
// x, y = top-left of his 30x40 box. o: pal, face (1 right / -1 left), blink, line (outline color), shine, sparkles
function drawGlint(x, y, w, h, o = {}) {
  const pal = o.pal || PAL_GLINT, es = w / 30, face = o.face || 1, L = o.line || null, lw = 1.4 * es;
  ctx.save(); ctx.lineJoin = 'round';
  ctx.fillStyle = fillOf(pal.legs);
  for (const lx of [x + 4 * es, x + w - 12 * es]) { ctx.fillRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); if (L || OUT) { ctx.strokeStyle = OUT ? '#222' : L; ctx.lineWidth = OUT ? 5 : lw; ctx.strokeRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); } }
  rr(x + 2 * es, y + h * 0.5, w - 4 * es, h * 0.4, 6 * es, pal.body, L, lw);
  circ(x + w / 2, y + h * 0.7, 3 * es, pal.pod, L, lw);
  rr(x - 5 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x + w - 1 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x - 2 * es, y, w + 4 * es, h * 0.55, 12 * es, pal.head, L, lw);
  rr(x + 2 * es, y + 4 * es, w - 4 * es, h * 0.55 - 9 * es, 9 * es, OUT ? '#fff' : pal.visor, L, lw);
  const ex = x + w / 2 + face * 3 * es, ey = y + h * 0.27, bl = o.blink ? 0.6 * es : 5 * (h / 40);
  ctx.fillStyle = OUT ? '#fff' : pal.eye;
  for (const d of [-6, 6]) { ctx.beginPath(); ctx.ellipse(ex + d * es, ey, 3.5 * es, bl, 0, 0, Math.PI * 2); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.stroke(); } }
  if (!OUT && o.shine !== false) {                     // the shiny sheen on his head (he used to be a mirror!)
    ctx.save(); ctx.beginPath(); ctx.rect(x - 2 * es, y, w + 4 * es, h * 0.55); ctx.clip();
    const sh = o.sheen === undefined ? 0.3 : o.sheen, sx = x - 10 * es + sh * (w + 20 * es);
    ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(sx, y); ctx.lineTo(sx + 6 * es, y); ctx.lineTo(sx - 4 * es, y + h * 0.55); ctx.lineTo(sx - 10 * es, y + h * 0.55); ctx.fill(); ctx.restore();
  }
  if (o.sparkles) for (let k = 0; k < 5; k++) { const a = (o.spin || 0) + k * 1.26; star(x + w / 2 + Math.cos(a) * w * 1.1, y + h * 0.45 + Math.sin(a) * h * 0.7, 3.2 * es, k % 2 ? '#ff9e80' : '#64ffda', OUT ? '#222' : null); }
  ctx.restore();
}
function GLat(cx, feetY, hgt, o) { const w = hgt * 0.75; drawGlint(cx - w / 2, feetY - hgt, w, hgt, o); }
// 🪄 a magic wand (black with white tips) from (x1,y1) to (x2,y2)
function wandPic(x1, y1, x2, y2, t, sparkly) {
  ctx.save(); ctx.lineCap = 'round';
  const dx = x2 - x1, dy = y2 - y1;
  ctx.strokeStyle = OUT ? '#222' : '#111'; ctx.lineWidth = t + (OUT ? 2 : 0); ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = '#fff'; ctx.lineWidth = t - 2; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 + dx * 0.16, y1 + dy * 0.16); ctx.moveTo(x2 - dx * 0.16, y2 - dy * 0.16); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.restore();
  if (sparkly) { sparkle(x2 + dx * 0.12, y2 + dy * 0.12, t * 1.6, OUT ? '#fff' : '#ffd740'); sparkle(x2 + dx * 0.05 + t * 2, y2 - t * 1.5, t * 0.8, OUT ? '#fff' : '#64ffda'); }
}
// 🎩 a top hat picture: cx = middle, by = brim y, w = brim width
function hatPic(cx, by, w, col = '#212121', band = '#ff4081') {
  rr(cx - w * 0.32, by - w * 0.62, w * 0.64, w * 0.64, 4, col, OUT ? '#222' : '#000', 2);
  ctx.fillStyle = fillOf(band); ctx.fillRect(cx - w * 0.32, by - w * 0.2, w * 0.64, w * 0.12);
  ctx.fillStyle = fillOf(col); ctx.beginPath(); ctx.ellipse(cx, by, w / 2, w * 0.09, 0, 0, 7); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.stroke(); }
}
function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }

// 🔮 MIND-READING NUMBER CARDS: the 5 classic binary cards (card k holds every number 1-31 that has bit k)
const MIND_COL = ['#e53935', '#fb8c00', '#43a047', '#1e88e5', '#8e24aa'];
function mindCard(x, y, k, w = 370, h = 250) {
  const nums = []; for (let n = 1; n <= 31; n++) if (n & (1 << k)) nums.push(n);
  rr(x, y, w, h, 18, '#fff', MIND_COL[k], 5);
  rr(x, y, w, 44, 18, MIND_COL[k]); ctx.fillStyle = MIND_COL[k]; ctx.fillRect(x, y + 24, w, 20);
  txt('MAGIC CARD ' + (k + 1), x + w / 2, y + 24, 22, '#fff'); star(x + 26, y + 23, 13, '#ffd740'); star(x + w - 26, y + 23, 13, '#ffd740');
  const cw = (w - 30) / 4, ch = (h - 64) / 4;
  nums.forEach((n, i) => { const cx = x + 15 + (i % 4) * cw + cw / 2, cy = y + 56 + Math.floor(i / 4) * ch + ch / 2; rr(cx - cw / 2 + 4, cy - ch / 2 + 3, cw - 8, ch - 6, 8, i % 2 ? '#fafafa' : '#f3f3f3'); txt(String(n), cx, cy + 1, 26, '#222'); });
  cutBox(x - 6, y - 6, w + 12, h + 12, 22);
}

// 🌀 GLINT'S MIRROR MAZE (the same maze every time: a seeded maze maker)
function makeMaze(cols, rows, seed) {
  let sd = seed; const rnd = () => { sd = (sd * 16807) % 2147483647; return sd / 2147483647; };
  const wall = []; for (let i = 0; i < cols * rows; i++) wall.push([1, 1, 1, 1]);   // top, right, bottom, left
  const seen = new Array(cols * rows).fill(false), stack = [0]; seen[0] = true;
  while (stack.length) {
    const c = stack[stack.length - 1], x = c % cols, y = Math.floor(c / cols), nb = [];
    if (y > 0 && !seen[c - cols]) nb.push([c - cols, 0, 2]); if (x < cols - 1 && !seen[c + 1]) nb.push([c + 1, 1, 3]);
    if (y < rows - 1 && !seen[c + cols]) nb.push([c + cols, 2, 0]); if (x > 0 && !seen[c - 1]) nb.push([c - 1, 3, 1]);
    if (!nb.length) { stack.pop(); continue; }
    const [n, a, b] = nb[Math.floor(rnd() * nb.length)]; wall[c][a] = 0; wall[n][b] = 0; seen[n] = true; stack.push(n);
  }
  return wall;
}

  if (tot > S.bucks) { sfx.glitch(); say('Oops! Not enough Sparkle Coins! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.bucks -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreBucks() {
  S.bucks += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['Abracadabra! 500 more Sparkle Coins!', 'Poof! 500 Sparkle Coins out of my hat!', 'Ta-da! More Sparkle Coins for Ben!']));
}
// 🚚 delivery animation
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.vroom(); say('Abracadabra... placing your order!'); requestAnimationFrame(shipLoop); }
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#0d1330'); g.addColorStop(1, '#4527a0'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 30; i++) sparkle((i * 173) % 960, (i * 97) % 300, 3 + (i % 3) * 2 + Math.sin(shipT * 0.2 + i) * 1.5, i % 2 ? '#fff59d' : '#64ffda');
    ctx.fillStyle = '#6d4c41'; ctx.fillRect(0, 450, 960, 90); ctx.fillStyle = '#8d6e63'; for (let x = 0; x < 960; x += 80) ctx.fillRect(x, 450, 76, 10);
    for (const side of [-1, 1]) for (let k = 0; k < 4; k++) { ctx.fillStyle = k % 2 ? '#c62828' : '#e53935'; ctx.fillRect(side < 0 ? k * 30 : 960 - (k + 1) * 30, 0, 31, 450); }
    const done = shipT > 150;
    // the big top hat: parcels pop out of it!
    hatPic(480, 440, 220);
    for (let i = 0; i < Math.min(shipCount, 8); i++) {
      const t0 = 20 + i * Math.min(16, 110 / Math.max(1, shipCount)), t = shipT - t0; if (t < 0) continue;
      const a = -Math.PI / 2 + (i - (Math.min(shipCount, 8) - 1) / 2) * 0.32, d = Math.min(1, t / 30), px = 480 + Math.cos(a) * 250 * d, py = 380 + Math.sin(a) * 150 * d + (done ? 0 : Math.sin(t * 0.15) * 4);
      rr(px - 22, py - 22, 44, 44, 4, ['#ff9e80', '#64ffda', '#ffd740', '#b39ddb'][i % 4], '#1a2540', 3); ctx.fillStyle = '#1a2540'; ctx.fillRect(px - 3, py - 22, 6, 44); ctx.fillRect(px - 22, py - 3, 44, 6);
    }
    const tap = Math.sin(shipT * 0.3) * 0.5;
    GLat(230, 450, 170, { line: '#0d1330', sparkles: true, spin: shipT * 0.08, sheen: (shipT % 80) / 80 });
    ctx.save(); ctx.translate(300, 370); ctx.rotate(-0.3 + tap); wandPic(0, 0, 0, -110, 12, true); ctx.restore();
    if (!done) { txt('Abracadabra' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 70, 52, '#fff'); rr(280, 110, 400, 24, 12, 'rgba(255,255,255,.3)'); rr(280, 110, Math.max(24, 400 * Math.min(1, shipT / 150)), 24, 12, '#64ffda'); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); rr(480 + Math.cos(a) * d, 140 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.5, 12, 8, 2, ['#ff4081', '#ffd740', '#64ffda', '#40c4ff'][i % 4]); }
      txt('ORDER CONFIRMED! ✨', 480, 75, 64, '#0d1330'); txt('ORDER CONFIRMED! ✨', 480, 70, 64, '#ffd740');
      txt(shipCount + (shipCount === 1 ? ' thing is' : ' things are') + ' in MY ORDERS, ready to print!', 480, 135, 30, '#fff');
    }
  } finally { ctx = old; }
  if (shipT > 150 && !shipDone) { shipDone = true; sfx.cash(); say('Ta-da! ORDER CONFIRMED! Tap PRINT on the things you want!'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    if (!P(o.k)) continue;
    const line = el('div', 'line'); line.appendChild(thumbCanvas(o.k, 150, 110));
    line.appendChild(el('div', 'nm', P(o.k).name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${P(o.k).pages.length + (o.gift ? 1 : 0)} page${P(o.k).pages.length + (o.gift ? 1 : 0) > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function openPrint(list) {
  closePrint(true);
  const fns = [];
  for (const o of list) { const p = P(o.k); if (!p) continue; if (o.gift) fns.push(() => pageGift(p.name)); p.pages.forEach(f => fns.push(f)); }
  if (!fns.length) return;
  const sc = fns.length > 24 ? 1 : fns.length > 8 ? 1.15 : 1.5, name = list.length === 1 ? P(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('magicShop'); say('Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  Tip: turn on color printing!'));
  document.body.appendChild(printBox);
  for (const f of fns) { const img = new Image(); img.className = 'pbPage'; img.alt = name; img.src = makePage(f, sc).toDataURL('image/png'); printBox.appendChild(img); }
  sfx.click(); say(list.length === 1 && P(list[0].k).pages.length > 1 && P(list[0].k).pages.some(f => /Secret/.test(f.name)) ? 'The last page is the SECRET! Shh! Tap PRINT if you want it on paper.' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT >= 0 && shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! Let us find some magic!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).cat !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price! Ta-da!');
};
$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'Welcome back, Ben! Your orders are in MY ORDERS.' : 'Hi Ben! I am GLINT! Welcome to my Magic Mirror Shop! Real tricks you can print!'; }, 50);
</script>
