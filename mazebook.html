<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🌀 Giant Maze Book</title>
<script>TOUCHPAD = { dpad: true };</script>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #d9f3ff 0 36px, #c9ecff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px; background: #fff;
    padding: 6px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 52px; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-go { background: #8ef08e; font-size: 22px; } .b-print { background: #ffb347; }
  .b-new { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-prize { background: #ffe066; } .b-add { background: #c3a6ff; } .b-clear { background: #ffc2d6; } .b-hint { background: #fff59d; }
  /* ---------- home ---------- */
  #home { flex-direction: column; padding: 6px 12px 8px; gap: 5px; }
  #hHead { display: flex; align-items: center; gap: 10px; }
  #hHead h1 { flex: 1; margin: 0; text-align: center; font-size: clamp(24px, 4.2vw, 46px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #7c4dff; letter-spacing: 2px; white-space: nowrap; }
  .row { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.75); border: 4px solid #333; border-radius: 16px; padding: 4px 8px; }
  .row.focus { border-color: #ff3d6e; box-shadow: 0 0 0 3px #ffd0dc; }
  .lab { width: 74px; font-size: 19px; font-weight: bold; flex: none; }
  .opts { flex: 1; display: flex; gap: 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 6px; }
  .opt { flex: 1 0 auto; font-size: 17px; min-height: 46px; padding: 4px 8px; box-shadow: 0 4px 0 #333; white-space: nowrap; }
  .opt.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  #hMain { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #pvBox { flex: 1.5; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #pv { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #pv svg { height: 100%; max-width: 100%; background: #fff; border: 4px solid #333; border-radius: 10px; box-shadow: 0 6px 0 #7c4dff; }
  .btnRow { display: flex; gap: 8px; } .btnRow .btn { flex: 1; }
  #bookBox { flex: 1; min-width: 230px; max-width: 420px; display: flex; flex-direction: column; gap: 6px; background: #fff8e1;
    border: 4px solid #333; border-radius: 18px; padding: 6px 8px; }
  #bookBox h2 { margin: 0; text-align: center; font-size: 22px; }
  #bookList { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 5px; }
  .bItem { display: flex; align-items: center; gap: 6px; background: #fff; border: 3px solid #333; border-radius: 12px; padding: 3px 6px; font-size: 15px; font-weight: bold; }
  .bItem span { flex: 1; }
  .bItem button { font: inherit; font-size: 18px; border: 3px solid #333; border-radius: 10px; background: #ffc2d6; min-width: 44px; min-height: 40px; cursor: pointer; }
  .bEmptyNote { text-align: center; font-size: 16px; color: #666; padding: 10px 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .two .btn { font-size: 16px; min-height: 46px; }
  /* ---------- play ---------- */
  #play { flex-direction: row; gap: 10px; padding: 10px; }
  #pSide { width: min(30vw, 300px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; flex: none; }
  body.touchy #pSide { padding-bottom: 190px; }
  .card { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 5px 8px; text-align: center; font-weight: bold; }
  #pTitle { font-size: 20px; } #pGoal { font-size: 15px; background: #fffbe0; font-weight: normal; }
  #pClock { font-size: 30px; background: #e8f5e9; } #pBest { font-size: 16px; } #pCoins { font-size: 19px; background: #fff3c4; }
  #pMaze { flex: 1; min-width: 0; position: relative; }
  #cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: pointer;
    background: #fff; border: 5px solid #333; border-radius: 14px; box-shadow: 0 7px 0 #7c4dff; }
  #win { position: fixed; inset: 0; background: rgba(30, 20, 70, .55); display: none; z-index: 40; align-items: center; justify-content: center; padding: 14px; }
  #win.on { display: flex; }
  #winCard { background: #fff; border: 6px solid #333; border-radius: 26px; padding: 14px 20px; max-width: 560px; width: 100%; text-align: center;
    display: flex; flex-direction: column; gap: 8px; animation: pop .4s; max-height: 100%; overflow-y: auto; }
  @keyframes pop { from { transform: scale(.3) rotate(-8deg); } to { transform: scale(1); } }
  #winBig { font-size: 64px; line-height: 1; } #winTitle { font-size: 34px; font-weight: bold; color: #7c4dff; } #winText { font-size: 21px; }
  /* ---------- prizes ---------- */
  #prizes { flex-direction: row; gap: 10px; padding: 10px; }
  #zSide { width: min(40vw, 420px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #zPaper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #zPaper svg { max-height: 100%; max-width: 100%; height: 100%; background: #fff; border: 4px solid #333; border-radius: 10px; box-shadow: 0 6px 0 #ffb300; }
  #names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #names .btn { font-size: 16px; min-height: 46px; padding: 4px; }
  #names .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #medals { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .medal { text-align: center; font-size: 12px; font-weight: bold; }
  .medal svg { width: 100%; height: auto; display: block; }
  .medal.off { opacity: .35; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (max-height: 640px) {
    .btn { min-height: 44px; font-size: 16px; } .opt { min-height: 40px; font-size: 15px; } .lab { font-size: 16px; width: 60px; }
    #hHead h1 { font-size: 28px; } #pClock { font-size: 24px; } .two .btn { min-height: 40px; font-size: 14px; }
  }
  @media (max-width: 760px) { #bookBox { min-width: 190px; } .lab { width: 54px; font-size: 15px; } }
  /* ---------- PRINT: only the pages in #printAll ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="hHead">
    <button class="btn b-back" id="bExit">⬅️ Back</button>
    <h1>🌀 GIANT MAZE BOOK</h1>
    <button class="btn b-prize" id="bPrizes">🏅 Prizes</button>
    <button class="btn b-new" id="bNew">🎲 New mazes!</button>
  </div>
  <div class="row" id="rowLevel"><span class="lab">Level</span><div class="opts" id="optLevel"></div></div>
  <div class="row" id="rowShape"><span class="lab">Shape</span><div class="opts" id="optShape"></div></div>
  <div class="row" id="rowTheme"><span class="lab">Who?</span><div class="opts" id="optTheme"></div></div>
  <div id="hMain">
    <div id="pvBox">
      <div id="pv"></div>
      <div class="btnRow">
        <button class="btn b-go" id="bPlay">▶️ Play it!</button>
        <button class="btn b-print" id="bPrintOne">🖨️ Print it</button>
        <button class="btn b-add" id="bAdd">➕ Put in my book</button>
      </div>
    </div>
    <div id="bookBox">
      <h2 id="bookTitle">📖 My Book</h2>
      <div id="bookList"></div>
      <div class="two">
        <button class="btn b-new" id="bSurprise">🎁 Fill it for me</button>
        <button class="btn b-clear" id="bEmpty">🧽 Empty it</button>
        <button class="btn" id="bAns">✅ Answers at the back</button>
        <button class="btn b-print" id="bPrintBook">🖨️ Print my book!</button>
      </div>
    </div>
  </div>
</div>
<div id="play" class="screen">
  <div id="pSide">
    <div class="card" id="pTitle"></div>
    <div class="card" id="pGoal"></div>
    <div class="card" id="pClock">⏱️ 0:00</div>
    <div class="card" id="pBest"></div>
    <div class="card" id="pCoins"></div>
    <button class="btn b-hint" id="bHint">💡 Hint</button>
    <button class="btn b-clear" id="bRestart">🔄 Start over</button>
    <button class="btn b-print" id="bPrintPlay">🖨️ Print this maze</button>
    <button class="btn b-back" id="bPlayBack">⬅️ Back to the book</button>
  </div>
  <div id="pMaze"><canvas id="cv"></canvas></div>
</div>
<div id="prizes" class="screen">
  <div id="zSide">
    <div class="card" style="font-size:22px">🏅 Maze Master prizes</div>
    <div class="card" style="font-size:16px;font-weight:normal">Who is the Maze Master? Tap a name!</div>
    <div id="names"></div>
    <div class="card" style="font-size:16px">Medals: win a maze on screen at each level!</div>
    <div id="medals"></div>
    <button class="btn b-print" id="bPrintCert">🖨️ Print the certificate</button>
    <button class="btn b-prize" id="bPrintMedal">🖨️ Print a medal to wear</button>
    <button class="btn b-back" id="bPrizeBack">⬅️ Back to the book</button>
  </div>
  <div id="zPaper"></div>
</div>
<div id="win"><div id="winCard">
  <div id="winBig">🏆</div><div id="winTitle">You did it!</div><div id="winText"></div>
  <div class="btnRow"><button class="btn b-go" id="bNext">➡️ Next maze</button><button class="btn b-clear" id="bAgain">🔄 Again</button></div>
  <button class="btn b-back" id="bWinBack">📖 Back to the book</button>
</div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🌀 GIANT MAZE BOOK: real perfect mazes (one path only), printable as a book and playable on screen.
// Every maze is a graph of cells. Each cell has a center and "sides" (a wall piece + the neighbor behind it).
// Square, Robo, Gloop and Star are grids (the last three are masked); Circle is rings; Hexagon is hex cells.
// Printed pages are portrait letter, viewBox 0 0 800 1000 (about 101 units per inch).
// =====================================================================
// ---------- art helpers + characters (copied from the Craft Room / Art Gallery) ----------
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
const FOLD = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-dasharray="10 7" stroke-linecap="round"/>';
const HOLE = (x, y, rx, ry) => '<ellipse data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(rx) + '" ry="' + n(ry) + '" fill="#fff" stroke="' + INK + '" stroke-width="3.5" stroke-dasharray="11 7"/>';
const PUNCH = (x, y, r) => '<circle data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r || 11) + '" fill="#fff" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 5"/>' +
  '<path d="M' + n(x - 5) + ' ' + n(y) + ' L' + n(x + 5) + ' ' + n(y) + ' M' + n(x) + ' ' + n(y - 5) + ' L' + n(x) + ' ' + n(y + 5) + '" stroke="' + INK + '" stroke-width="2"/>';
// a scissors mark on a cut line
