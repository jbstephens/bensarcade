<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>✏️ How to Draw Game Factory Characters</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3f2ff 0 36px, #d4eaff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; position: relative; }
  #gHead h1 { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #1e6bff; letter-spacing: 1px; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; }
  #gBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 2px 10px 4px; }
  #gBtns .btn { min-height: 50px; font-size: 18px; padding: 6px 14px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fffdf5; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #3d7be0; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 17px; text-align: center; padding: 2px 2px 2px; }
  .thumb .st { position: absolute; top: 4px; right: 8px; font-size: 30px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb:active { transform: scale(.96); }
  /* ---------- lesson + pad screens ---------- */
  #lesson, #pad { flex-direction: row; gap: 10px; padding: 10px; }
  .stageBox { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .stage { position: relative; height: calc(100vh - 20px); aspect-ratio: 1 / 1; max-width: 100%; max-height: 100%;
    background: #fffdf5; border: 5px solid #333; border-radius: 18px; box-shadow: 0 8px 0 #3d7be0; overflow: hidden; }
  .stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #padCv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .side { width: min(40vw, 390px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .title { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #sNum { font-size: 18px; text-align: center; font-weight: bold; color: #1e6bff; }
  #sText { font-size: 22px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px 10px; min-height: 74px;
    display: flex; align-items: center; justify-content: center; }
  #dots { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
  #dots i { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #333; background: #fff; }
  #dots i.on { background: #ffd60a; } #dots i.cur { background: #ff3d6e; transform: scale(1.2); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn:disabled { opacity: .4; }
  .hide { display: none !important; }
  .b-next { background: #8ef08e; font-size: 24px; } .b-prev { background: #ffd180; }
  .b-replay { background: #9bf6ff; } .b-read { background: #ffc6ff; }
  .b-try { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); font-size: 22px; }
  .b-print { background: #c3a6ff; font-size: 16px; line-height: 1.1; } .b-back { background: #9be3ff; }
  .b-done { background: #ffe066; font-size: 24px; } .b-clear { background: #ffc2d6; }
  .three .btn { font-size: 15px; padding: 4px; }
  #crayons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #names { position: fixed; inset: 0; background: rgba(20, 30, 70, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 14px; }
  #names.on { display: flex; }
  #namesCard { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 14px 18px; max-width: 640px; width: 100%; max-height: 100%; overflow-y: auto; text-align: center; }
  #namesCard h2 { margin: 0 0 10px; font-size: 28px; }
  #nameBtns { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; margin-bottom: 10px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #lesson, #pad { flex-direction: column; }
    .stageBox { flex: 1; min-height: 0; }
    .stage { height: auto; width: 100%; }
    .side { width: 100%; max-height: 46vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #sText { font-size: 18px; min-height: 56px; } .title { font-size: 20px; } }
  /* ---------- PRINT: only the printable pages ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; margin: 0 auto;
      -webkit-print-color-adjust: exact; print-color-adjust: exact; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>

<script>
'use strict';
// =====================================================================
// ✏️ HOW TO DRAW: step-by-step drawing lessons for Game Factory characters.
// Every drawing lives in a 200 x 200 box. A lesson is a list of steps; each step adds a few easy shapes.
// A shape = { d: path to draw, f: fill color (for the color-in step), fd: fill path if different,
//             z: layer for coloring (bigger = on top), sc: outline color when colored, w: line thickness, tube: thick color line }.
// The LAST step of every lesson is "Color it in!" which shows the finished, colored character.
// =====================================================================
const OL = '#1b1b2f';
const n = v => (Math.round(v * 10) / 10);
let ZN = 0;          // keeps the order of shapes with the same layer
// ---------- shape helpers (every shape becomes a path, so it can "draw itself") ----------
function S(d, f, z, ex) { return Object.assign({ d, f: f || null, z: z == null ? 5 : z, o: ZN++ }, ex || {}); }
function C(x, y, r, f, z, ex) { return S('M' + n(x - r) + ' ' + n(y) + ' A' + r + ' ' + r + ' 0 1 1 ' + n(x + r) + ' ' + n(y) + ' A' + r + ' ' + r + ' 0 1 1 ' + n(x - r) + ' ' + n(y) + ' Z', f, z, ex); }
function E(x, y, rx, ry, f, z, rot, ex) {
  const a = (rot || 0) * Math.PI / 180, cx = Math.cos(a) * rx, cy = Math.sin(a) * rx, r = rot || 0;
  return S('M' + n(x - cx) + ' ' + n(y - cy) + ' A' + rx + ' ' + ry + ' ' + r + ' 1 1 ' + n(x + cx) + ' ' + n(y + cy) + ' A' + rx + ' ' + ry + ' ' + r + ' 1 1 ' + n(x - cx) + ' ' + n(y - cy) + ' Z', f, z, ex);
}
function Rr(x, y, w, h, r, f, z, ex) {
  r = Math.min(r, w / 2, h / 2);
  return S('M' + n(x + r) + ' ' + n(y) + ' L' + n(x + w - r) + ' ' + n(y) + ' Q' + n(x + w) + ' ' + n(y) + ' ' + n(x + w) + ' ' + n(y + r) +
    ' L' + n(x + w) + ' ' + n(y + h - r) + ' Q' + n(x + w) + ' ' + n(y + h) + ' ' + n(x + w - r) + ' ' + n(y + h) +
    ' L' + n(x + r) + ' ' + n(y + h) + ' Q' + n(x) + ' ' + n(y + h) + ' ' + n(x) + ' ' + n(y + h - r) +
    ' L' + n(x) + ' ' + n(y + r) + ' Q' + n(x) + ' ' + n(y) + ' ' + n(x + r) + ' ' + n(y) + ' Z', f, z, ex);
}
const Ln = (d, z, ex) => S(d, null, z == null ? 8 : z, ex);                       // just a line, no color inside
function starD(cx, cy, r, ri, pts) {
  pts = pts || 5; let d = '';
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? ri : r; d += (i ? ' L' : 'M') + n(cx + Math.cos(a) * rr) + ' ' + n(cy + Math.sin(a) * rr); }
  return d + ' Z';
}
const Star = (cx, cy, r, ri, f, z, ex) => S(starD(cx, cy, r, ri), f, z, ex);
const sparkD = (x, y, r) => 'M' + x + ' ' + (y - r) + ' Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y + r) + ' Q' + x + ' ' + y + ' ' + (x - r) + ' ' + y + ' Q' + x + ' ' + y + ' ' + x + ' ' + (y - r) + ' Z';
const Spark = (x, y, r, f, z) => S(sparkD(x, y, r), f || '#fff59d', z == null ? 9 : z);
const Shine = (x, y, r) => C(x, y, r, '#ffffff', 10, { ns: 1 });                   // tiny white shine (color step only)
const mirror = d => d.replace(/(-?\d*\.?\d+) (-?\d*\.?\d+)/g, (m, x, y) => n(200 - x) + ' ' + y);   // flip a path left <-> right (points only)
const ST = (t, sh) => ({ t, sh: sh || [] });
const COLOR = (t, sh) => ({ t, sh: sh || [], color: true });
const W = '#f4f7fb';
// blob helpers (gloops): a dome on top + a wavy drippy bottom
function dome(d, drips, f, z) {
  const back = drips.replace(/^M\S+ \S+ /, '');
  // the drips path is reversed for the fill outline
  const pts = []; drips.replace(/Q(\S+) (\S+) (\S+) (\S+)/g, (m, a, b, c, e) => { pts.push([a, b, c, e]); });
  const start = drips.match(/^M(\S+) (\S+)/);
  let rev = '', ends = [[start[1], start[2]]].concat(pts.map(p => [p[2], p[3]]));
  for (let i = pts.length - 1; i >= 0; i--) rev += ' Q' + pts[i][0] + ' ' + pts[i][1] + ' ' + ends[i][0] + ' ' + ends[i][1];
  return { body: S(d, f, z, { fd: d + rev + ' Z' }), drips: Ln(drips, z + .1), back };
}
// =====================================================================
// 📚 THE LESSONS
// =====================================================================
function makeLessons() {
  ZN = 0; const L = [];
  // ---------- 🤖 ROBO ----------
  L.push({ id: 'robo', name: 'Robo', icon: '🤖', steps: [
    ST("Draw a big circle for Robo's head.", [C(100, 74, 40, W, 5)]),
    ST('Draw a wide box with round corners for his dark visor.', [Rr(70, 54, 60, 34, 14, '#1d2836', 6)]),
    ST('Draw two ovals in the visor for his blue eyes.', [E(87, 71, 7, 9, '#40c4ff', 7), E(113, 71, 7, 9, '#40c4ff', 7)]),
    ST('Draw an oval on each side for his ear pods.', [E(57, 76, 8, 14, '#2979ff', 3), E(143, 76, 8, 14, '#2979ff', 3)]),
    ST('Draw a line with a little ball on top for his antenna.', [Ln('M100 34 L100 18', 4), C(100, 13, 6, '#ff5252', 4)]),
    ST('Draw a smile, then a round box body with a light in the middle.', [Ln('M90 98 Q100 106 110 98', 8), Rr(72, 112, 56, 44, 14, W, 2), C(100, 134, 7, '#2979ff', 3)]),
    ST('Add two arms and two legs.', [Rr(57, 118, 12, 30, 6, W, 1), Rr(131, 118, 12, 30, 6, W, 1), Rr(80, 152, 14, 20, 5, W, 1), Rr(106, 152, 14, 20, 5, W, 1)]),
    COLOR('Color him in! White body, dark visor, blue eyes and blue ear pods.', [Shine(84, 67, 2.4), Shine(110, 67, 2.4), Shine(97, 131, 2)]),
  ] });
  // ---------- 👑 KING GLOOP ----------
  { const P = '#9c3fc0', b = dome('M46 152 Q40 104 62 80 Q100 48 138 80 Q160 104 154 152', 'M46 152 Q56 164 66 152 Q78 166 90 153 Q100 167 112 153 Q124 166 134 152 Q144 164 154 152', P, 3);
  L.push({ id: 'kinggloop', name: 'King Gloop', icon: '👑', steps: [
    ST('Draw a big round hill shape for King Gloop\'s gooey body.', [b.body]),
    ST('Draw a wavy, drippy line along the bottom.', [b.drips]),
    ST('Draw two big oval eyes with dots inside.', [E(84, 104, 9, 11, '#fff', 6), E(116, 104, 9, 11, '#fff', 6), C(86, 106, 5, '#3b1f4f', 7), C(118, 106, 5, '#3b1f4f', 7)]),
    ST('Draw a big happy smile and two little goo drops.', [Ln('M84 124 Q100 138 116 124'), E(70, 174, 4.5, 6, P, 3), E(130, 176, 3.5, 5, P, 3)]),
    ST('Draw a zig-zag crown on his head.', [S('M78 72 L78 44 L89 58 L100 38 L111 58 L122 44 L122 72 Z', '#ffd740', 7)]),
    ST('Add round jewels on the crown.', [C(100, 63, 4.5, '#ff4081', 8), C(78, 44, 3, '#fff59d', 8), C(100, 38, 3, '#fff59d', 8), C(122, 44, 3, '#fff59d', 8)]),
    COLOR('Color King Gloop purple and his crown gold!', [E(64, 100, 5, 11, '#ffffff', 10, 20, { ns: 1, op: .5 }), Shine(83, 102, 2), Shine(115, 102, 2)]),
  ] }); }
  // ---------- 💜 BABY GLOOP ----------
  { const P = '#c98ae0', b = dome('M56 152 Q50 96 100 86 Q150 96 144 152', 'M56 152 Q66 162 78 152 Q89 162 100 152 Q111 162 122 152 Q134 162 144 152', P, 3);
  L.push({ id: 'babygloop', name: 'Baby Gloop', icon: '💜', steps: [
    ST('Draw a small round bump for Baby Gloop.', [b.body]),
    ST('Draw a little wavy line along the bottom.', [b.drips]),
    ST('Draw two BIG eyes with big dots. Babies have big eyes!', [E(82, 118, 12, 14, '#fff', 6), E(118, 118, 12, 14, '#fff', 6), C(84, 121, 7, '#3b1f4f', 7), C(120, 121, 7, '#3b1f4f', 7)]),
    ST('Draw a tiny smile and two round cheeks.', [Ln('M93 138 Q100 144 107 138'), E(66, 136, 6, 4, '#ff9ec0', 6), E(134, 136, 6, 4, '#ff9ec0', 6)]),
    ST('Draw a teeny tiny crown on top.', [S('M88 90 L88 72 L94 80 L100 66 L106 80 L112 72 L112 90 Z', '#ffe57f', 7)]),
    COLOR('Color Baby Gloop light purple!', [Shine(81, 117, 2.6), Shine(117, 117, 2.6), E(70, 106, 4, 8, '#ffffff', 10, 25, { ns: 1, op: .5 })]),
  ] }); }
  // ---------- 🎩 DUKE GOOGOOL ----------
  { const G = '#1fb85a', b = dome('M68 178 Q60 124 68 74 Q72 54 100 54 Q128 54 132 74 Q140 124 132 178', 'M68 178 Q79 188 90 178 Q100 189 110 178 Q121 188 132 178', G, 3);
  L.push({ id: 'googool', name: 'Duke Googool', icon: '🎩', steps: [
    ST('Draw a tall, tall goo shape for Duke Googool.', [b.body]),
    ST('Draw a wavy line along the bottom.', [b.drips]),
    ST('Draw a top hat: a tall box with a flat line on the bottom.', [Rr(76, 8, 48, 40, 4, '#22222a', 7), Rr(76, 36, 48, 8, 1, '#c62828', 7.2), Rr(62, 45, 76, 9, 4, '#26262e', 7.4)]),
    ST('Draw two eyes. Put a big circle around one eye. That is his monocle!', [C(113, 84, 12, '#d6f0ff', 7.6, { sc: '#e0a800', w: 1.3 }), E(88, 84, 6, 7, '#fff', 8), E(113, 84, 7, 8, '#fff', 8), C(89, 85, 3, OL, 9), C(114, 85, 3.5, OL, 9), Ln('M125 87 Q134 110 124 128', 7.7, { sc: '#e0a800' })]),
    ST('Draw a curly mustache and a little smile.', [S('M84 104 Q92 96 100 103 Q108 96 116 104 Q108 108 100 106 Q92 108 84 104 Z', '#1b5e20', 9), Ln('M92 115 Q100 119 108 113')]),
    ST('Draw a bow tie: two triangles and a circle.', [S('M100 138 L84 129 L84 147 Z', '#e53935', 8), S('M100 138 L116 129 L116 147 Z', '#e53935', 8), C(100, 138, 3.5, '#b71c1c', 9)]),
    COLOR('Color the Duke green, with a black top hat!', [Shine(86, 82, 1.6), Shine(111, 82, 1.8), E(80, 70, 4, 10, '#ffffff', 10, 10, { ns: 1, op: .45 })]),
  ] }); }
  // ---------- 😈 NEGA-ROBO ----------
  { const B = '#2c3038', B2 = '#1f232b', PU = '#7b1fa2';
  L.push({ id: 'negarobo', name: 'Nega-Robo', icon: '😈', steps: [
    ST("Draw a big circle for Nega-Robo's head.", [C(100, 74, 40, B, 5)]),
    ST('Draw a wide box with round corners for his RED visor.', [Rr(70, 54, 60, 34, 14, '#c62828', 6)]),
    ST('Draw two slanty eyes. They look grumpy!', [S('M78 64 L96 71 L95 81 L79 79 Z', '#ffe14d', 7), S('M122 64 L104 71 L105 81 L121 79 Z', '#ffe14d', 7)]),
    ST('Draw an oval on each side for his ear pods.', [E(57, 76, 8, 14, PU, 3), E(143, 76, 8, 14, PU, 3)]),
    ST('Draw a line with a little ball on top for his antenna.', [Ln('M100 34 L100 18', 4), C(100, 13, 6, '#e040fb', 4)]),
    ST('Draw a frown, then a round box body with a light.', [Ln('M90 105 Q100 97 110 105', 8, { sc: '#ff80ab' }), Rr(72, 112, 56, 44, 14, B2, 2), C(100, 134, 7, '#e040fb', 3)]),
    ST('Add two arms and two legs.', [Rr(57, 118, 12, 30, 6, B2, 1), Rr(131, 118, 12, 30, 6, B2, 1), Rr(80, 152, 14, 20, 5, '#3a1450', 1), Rr(106, 152, 14, 20, 5, '#3a1450', 1)]),
    COLOR('Color Nega-Robo black, with a red visor!', [Shine(84, 70, 2), Shine(116, 70, 2), Ln('M120 44 A36 36 0 0 1 134 70', 10, { sc: '#ff80ab', w: .8 })]),
  ] }); }
  // ---------- 🐱 SAMMY (brown tabby, brown eyes) ----------
  { const F = '#8d6e63', SC = '#4e342e', sx = { sc: SC, w: 1.3 };

// 🖥️ SCREENS
// =====================================================================
const $ = id => document.getElementById(id);

}

function markSel() {

}
function openLesson(k) {

}
const les = () => LESSONS[cur];
const isLast = () => step === les().steps.length - 1;
function showStep(read) {

const spoken = () => 'Step ' + (step + 1) + '. ' + les().steps[step].t;
function drawStage() {

  box.innerHTML = svg200('<rect x="0" y="0" width="200" height="200" fill="#fffdf5"/>' + picture(L, step, 'step') + '<g id="pencil" opacity="0">' + pencilArt() + '</g>');

function pencilArt() {     // a little pencil whose tip is at 0,0

    '<rect x="-3.5" y="-40" width="7" height="6" fill="#ff8fab" stroke="#333" stroke-width="1.2"/><path d="M-3.5 -10 L3.5 -10 L0 0 Z" fill="#f2c79a" stroke="#333" stroke-width="1.2"/><path d="M-1.2 -3.4 L1.2 -3.4 L0 0 Z" fill="#333"/></g>';

// each new line draws itself like a pen moving (stroke-dashoffset), one after another
function animate(box) {

function next() {

}
function prev() { if (step > 0) { step--; showStep(true); blip(500, 0, .08); } }
function replay() { showStep(false); }
function backToGallery() { animTok++; hush(); setView('gallery'); markSel(); }
function leave() {

// =====================================================================
// 🖍️ TRY IT ON SCREEN: a drawing pad with a faint guide, crayons and an eraser
// =====================================================================
const CRAYONS = ['#222222', '#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#9e9e9e', '#ffffff', 'erase'];
let crayon = '#222222', thick = false, guideOn = true, padStrokes = {}, stroke = null;
const padList = () => (padStrokes[les().id] = padStrokes[les().id] || []);
function openPad() {
  animTok++; hush();
  $('pTitle').textContent = '🖍️ Draw ' + les().name + '!';
  setView('pad'); renderGuide(); sizePad(); blip(660);
}
function renderGuide() {
  $('padGuide').innerHTML = guideOn ? svg200(picture(les(), null, 'faint')) : '';
  $('bGuide').textContent = guideOn ? '👻 Hide guide' : '👻 Show guide';
}
function renderCrayons() {
  const box = $('crayons'); box.innerHTML = '';
  CRAYONS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (c === crayon ? ' sel' : '');
    if (c === 'erase') { s.style.background = '#ffc2d6'; s.textContent = '🧽'; } else s.style.background = c;
    s.addEventListener('click', () => { crayon = c; blip(c === 'erase' ? 400 : 600, 0, .06); renderCrayons(); });

}
function padBox() { const cv = $('padCv'), r = cv.getBoundingClientRect(), s = Math.min(r.width, r.height) / 200 || 1; return { r, s, ox: (r.width - 200 * s) / 2, oy: (r.height - 200 * s) / 2 }; }

function drawPad() {

function toPad(e) { const b = padBox(); return [n((e.clientX - b.r.left - b.ox) / b.s), n((e.clientY - b.r.top - b.oy) / b.s)]; }
function penDown(e) {
  if (view !== 'pad') return;
  e.preventDefault();
  const [x, y] = toPad(e);
  stroke = { c: crayon, w: thick ? 7 : 3, p: [x, y] }; padList().push(stroke); drawPad();
}
function penMove(e) {

  if (Math.hypot(x - p[k - 2], y - p[k - 1]) < 1.2) return;

function padUndo() { padList().pop(); drawPad(); blip(450, 0, .06); }
function padClear() { padStrokes[les().id] = []; drawPad(); blip(300, 0, .12); }
function padDone() {

}
// =====================================================================
// 🖨️ PRINTING (Chrome + iPad Safari): put the pages in #printAll, then print
// =====================================================================
function doPrint(pages, msg) {

  pa.innerHTML = pages.join('');

}
const printStrip = () => doPrint([stripPage(les())], '🖨️ Printing the steps!');
const printPractice = () => doPrint(practicePages(les()), '🖨️ Printing practice pages!');

function openNames() {
  const b = $('nameBtns'); b.innerHTML = '';
  NAMES.forEach(nm => {
    const k = document.createElement('button'); k.className = 'btn b-done'; k.textContent = nm;
    k.addEventListener('click', () => { state.name = nm; saveState(); closeNames(); doPrint([certPage(nm)], '🏅 Printing ' + nm + "'s certificate!"); });
    b.appendChild(k);
  });

}
function closeNames() { $('names').classList.remove('on'); }
const namesOpen = () => $('names').classList.contains('on');
// =====================================================================
// ⌨️ KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {

function init() {
