<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎂 Cake Bakery</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #ffe3f1 0 36px, #fff8e1 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(20px, 2.9vw, 42px); white-space: nowrap; color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff4fa3; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-tv { background: #ff8a80; font-size: 22px; } .b-spin { background: #ffd54f; font-size: 21px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-mega { background: linear-gradient(90deg, #ffd740, #ff80ab, #b388ff); font-size: 22px; }
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #prev { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #ff4fa3;
    display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
  #prev svg { width: 100%; height: 100%; display: block; }
  #prevFlip { position: absolute; right: 8px; bottom: 8px; font-size: 15px; background: #fff6d6; border: 3px solid #333; border-radius: 12px; padding: 2px 8px; pointer-events: none; }
  #invName { font-size: clamp(17px, 2.2vw, 25px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invLeft .two .btn { min-height: 50px; font-size: 19px; }
  #invLeft .two .b-mega { grid-column: span 2; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #cats .btn { font-size: 16px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  #opts h4 { margin: 4px 0 0; font-size: 19px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 70px; height: 70px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .optRow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { font: inherit; font-size: 18px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px 12px; cursor: pointer; color: #222; box-shadow: 0 4px 0 #333; min-height: 52px; }
  .chip.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  #invHelp { font-size: 15px; text-align: center; color: #555; }
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff4fa3; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb.mega { background: #fff3c4; }
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff4fa3; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  #tv { position: fixed; inset: 0; z-index: 50; background: #222; display: none; align-items: center; justify-content: center; padding: 12px; }
  #tv.on { display: flex; }
  #tvSet { position: relative; width: min(96vw, 150vh); aspect-ratio: 16 / 10; max-height: 96vh; background: #6d4c41; border: 8px solid #111; border-radius: 34px; padding: 3%; box-shadow: 0 10px 0 #111; }
  #tvScreen { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; border: 6px solid #111; background: #4fc3f7; }
  #tvScreen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tvSay { position: absolute; left: 4%; right: 4%; bottom: 4%; background: rgba(255,255,255,.93); border: 4px solid #333; border-radius: 18px;
    font-size: clamp(18px, 3vw, 34px); font-weight: bold; text-align: center; padding: 6px 10px; }
  #tvSay.fine { font-size: clamp(12px, 1.7vw, 19px); font-style: italic; background: rgba(255,255,255,.85); }
  #tvStop { position: absolute; top: 2%; right: 2%; z-index: 2; }
  #tvArt svg g.bnc { animation: bnc .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #tvArt svg g.wig { animation: wig .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #tvArt svg g.flt { animation: flt 2.4s linear infinite; }
  #tvArt svg g.spn { animation: spn 9s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg g.pop { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes bnc { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-26px) scale(1.03, .97); } }
  @keyframes wig { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes flt { from { transform: translateY(-80px); } to { transform: translateY(620px); } }
  @keyframes spn { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view { flex-direction: column; }
    #invLeft { width: 100%; height: 50vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 52px; height: 52px; } #invHelp { display: none; } }
  @media print {
    @page { size: letter portrait; margin: 0.25in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #tv { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 8in; height: 10in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🎂 CAKE BAKERY</h1>
    <div id="prev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-tv" id="bTV">📺 Commercial!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
      <button class="btn b-mega" id="bMega">🎁 MEGA SET!</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · Space = spin a name · C = commercial · Enter = printables · M = mega set</div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Bakery</button>
    <h1 class="big">🖨️ PRINT &amp; MAKE</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="tv"><div id="tvSet"><div id="tvScreen"><div id="tvArt"></div><div id="tvSay"></div></div>
  <button class="btn b-back" id="tvStop">⏹️ Stop</button></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎂 CAKE BAKERY: design a cake (shape, 1 to 3 layers, flavors, frosting, toppers, writing on top), name it with the
// slot machine, watch its TV commercial, then print a fold-up paper ring cake, a cake box, a bakery menu, a party
// invitation and a Master Baker certificate. 🎁 MEGA SET = a GIANT 5-layer party cake + extras.
// It is a PRETEND paper cake: a grown-up does any real cutting or baking.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000. LINE = true is black lines to color in.
// =====================================================================
const APP_KEY = 'cakeBakery', APP_TROPHY = 'cakeBakery', APP_TROPHY_MSG = '🏆 CAKE BAKERY trophy!', APP_EMO = '🎂', APP_THING = 'cake';
const NAME_Q = '🔤 Name your cake!', MEGA_Q = '🎁 MEGA SET: a GIANT 5-layer party cake with extras!', WHO_Q = '👩‍🍳 Who is the baker?';
const WHO_SAY = w => w + ' is the Master Baker!';
const APP_JINGLE = [[659, .2], [784, .2], [880, .2], [784, .2], [659, .4], [523, .2], [587, .2], [659, .4], [0, .2], [784, .15], [880, .15], [988, .15], [1047, .3], [1319, .6]];
const NAME_A = ['Super', 'Mega', 'Choco', 'Sprinkle', 'Royal', 'Rainbow', 'Fluffy', 'Robo', 'Gloopy', 'Birthday', 'Yummy', 'Party', 'Twinkle', "Ben's", 'Giggle', 'Cosmic'];
const NAME_B = ['Cake', 'Tower', 'Delight', 'Dream', 'Surprise', 'Swirl', 'Wonder', 'Blast', 'Crumble', 'Castle', 'Fluff', 'Puff', 'Whirl', 'Treat', 'Torte', 'Mountain'];
const NAME_C = ['', 'Deluxe', 'Supreme', '3000', 'Jr.', 'Party Size', 'Extra Yummy', 'Royale', 'Max', 'Special', 'XL', 'Galaxy Edition'];
const SHAPES = [['round', '⚪ Round', 'round'], ['square', '⬜ Square', 'square'], ['heart', '❤️ Heart', 'heart'], ['star', '⭐ Star', 'star'], ['castle', '🏰 Castle', 'castle'], ['robo', '🤖 Robo', 'Robo']];
const FLAVORS = [['choc', '🍫 Chocolate', '#8a5534'], ['van', '🍦 Vanilla', '#fff0c4'], ['straw', '🍓 Strawberry', '#ff9ec4'], ['lemon', '🍋 Lemon', '#ffe66d'],
  ['blue', '🫐 Blueberry', '#9fb2ff'], ['mint', '🌿 Mint', '#9be7c4'], ['red', '❤️ Red velvet', '#d9534f'], ['orange', '🍊 Orange', '#ffb066']];
const FROST = [['swirls', '🍦 Swirls'], ['drips', '💧 Drips'], ['sprinkles', '🎉 Sprinkles']];
const FROST_COLS = ['#ffffff', '#ff80ab', '#ffe082', '#b39ddb', '#80deea', '#a5d6a7', '#6d4c41', '#ffab91', '#ff5252', '#90caf9'];
const TOPPERS = [['robo', '🤖 Robo'], ['king', '💜 King Gloop'], ['crown', '👑 Crown'], ['candles', '🕯️ Candles'], ['star', '⭐ Star'], ['fruit', '🍓 Fruit']];
const MAX_TOP = 3;
const WRITING = ['Happy Birthday!', 'Yay Ben!', 'Best Day Ever', 'Robo Rules', 'I Love You', 'Hooray!', 'You Did It!', 'Party Time!', 'Yum Yum!', 'Go Team!'];
const BOX_COLS = ['#ff5252', '#ff9800', '#ffd600', '#43a047', '#29b6f6', '#1e6bff', '#9c27b0', '#ff4fa3', '#795548', '#263238'];
const PLACES = ['at my house', 'at the park', 'in the backyard', "at Grandma's", 'at the Game Factory', 'on the moon (pretend!)'];
const PRICES = ['3 hugs', '2 high-fives', '1 giggle', '5 smiles', '1 dance', 'FREE!', '2 jokes', '4 tickles', '1 silly face', '10 pretend coins'];
const CATS = [['name', '🔤 Name'], ['shape', '🎂 Shape'], ['flavor', '🍰 Flavors'], ['frost', '🧁 Frosting'], ['top', '🍓 Toppers'],
  ['write', '✍️ Writing'], ['party', '🎉 Party'], ['who', '👩‍🍳 Baker'], ['mega', '🎁 Mega Set']];
const APP_DEFAULT = { shape: 'round', layers: 2, flav: [0, 2, 1], frost: ['drips', 'sprinkles'], fcol: 1, tops: ['candles'], write: 0, box: 7, party: 'Ben', place: 0 };
function appClean(r) {
  state.shape = okId(r.shape, SHAPES, 'round'); state.layers = [1, 2, 3].indexOf(r.layers) >= 0 ? r.layers : 2;
  state.flav = Array.isArray(r.flav) && r.flav.length === 3 ? r.flav.map((v, i) => okIdx(v, FLAVORS, [0, 2, 1][i])) : [0, 2, 1];
  state.frost = okIds(r.frost, FROST, 3) || ['drips']; state.fcol = okIdx(r.fcol, FROST_COLS, 1);
  state.tops = okIds(r.tops, TOPPERS, MAX_TOP) || ['candles']; state.write = okIdx(r.write, WRITING, 0); state.box = okIdx(r.box, BOX_COLS, 7);
  state.party = WHO.indexOf(r.party) >= 0 ? r.party : 'Ben'; state.place = okIdx(r.place, PLACES, 0);
}
const lab = (list, id) => (list.find(m => m[0] === id) || list[0]);
const TV_COL = s => BOX_COLS[s.box];
const flavName = i => strip(FLAVORS[i][1]).toLowerCase();
const layerFlavs = s => s.flav.slice(0, s.layers).map(flavName).filter((f, i, a) => a.indexOf(f) === i);
const bakery = s => s.who + "'s Bakery";
// =====================================================================
// 🎂 THE CAKE (drawn around 0,0: about 250 wide, the plate at y = 96, toppers up to about y = -150)
// =====================================================================
function cpD(d) { const id = GP + 'cp' + (++clipN); DEFS.push('<clipPath id="' + id + '"><path d="' + d + '"/></clipPath>'); return ' clip-path="url(#' + id + ')"'; }
const rrD = (x, y, w, h, r) => `M${n(x + r)} ${n(y)} L${n(x + w - r)} ${n(y)} Q${n(x + w)} ${n(y)} ${n(x + w)} ${n(y + r)} L${n(x + w)} ${n(y + h - r)} Q${n(x + w)} ${n(y + h)} ${n(x + w - r)} ${n(y + h)} L${n(x + r)} ${n(y + h)} Q${n(x)} ${n(y + h)} ${n(x)} ${n(y + h - r)} L${n(x)} ${n(y + r)} Q${n(x)} ${n(y)} ${n(x + r)} ${n(y)} Z`;
const SPRINK = ['#ff5252', '#ffd600', '#40c4ff', '#69f0ae', '#ff4fa3', '#b388ff'];
function sprinkles(x, y, w, h, seed) {
  const rnd = rng(seed), k = Math.round(w * h / 260); let o = '';
  for (let i = 0; i < k; i++) o += R(x + rnd() * (w - 8), y + rnd() * (h - 4), 9, 3.6, 1.8, SPRINK[i % SPRINK.length], 0, 0, rnd() * 180);
  return o;
}
// a frosting dollop (soft-serve swirl)
const dollop = (x, y, r, col) => E(x, y, r, r * .62, vshade(col), OL, 1.6) + E(x, y - r * .5, r * .7, r * .48, vshade(col), OL, 1.5) + P(`M${n(x - r * .35)} ${n(y - r * .8)} Q${n(x)} ${n(y - r * 1.5)} ${n(x + r * .1)} ${n(y - r * 1.3)} Q${n(x + r * .3)} ${n(y - r)} ${n(x + r * .35)} ${n(y - r * .8)} Z`, vshade(col), OL, 1.4);
// frosting drips hanging from a top edge (ey > 0 follows the front of a round tier)
function drips(cx, y, w, col, ey, seed) {
  const rnd = rng(seed), f = xx => ey ? ey * Math.sqrt(Math.max(0, 1 - (xx / w) * (xx / w))) : 0, N = Math.max(4, Math.round(w / 11));
  let d = `M${n(cx - w)} ${n(y - 3)}`;
  for (let i = 1; i <= N; i++) { const xx = -w + 2 * w * i / N; d += ` L${n(cx + xx)} ${n(y + f(xx) - 3)}`; }
  for (let i = N; i > 0; i--) { const x1 = -w + 2 * w * i / N, x0 = -w + 2 * w * (i - 1) / N, xm = (x0 + x1) / 2, deep = i % 2 ? 12 + rnd() * 18 : 6;
    d += ` Q${n(cx + x1)} ${n(y + f(xm) + deep)} ${n(cx + xm)} ${n(y + f(xm) + deep)} Q${n(cx + x0)} ${n(y + f(xm) + deep)} ${n(cx + x0)} ${n(y + f(x0) + 5)}`; }
  return P(d + ' Z', col, OL, 1.8);
}
const flavCol = (s, i) => FLAVORS[s.flav[i % 3]][2];

  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }
  notePrinted(); doPrint(() => renderSheet());
}
function printAll() {
  const pages = SHEETS.map((p, i) => p.mega && !megaOn() ? '' : buildSheet(i, !!p.blank || state.mode === 'line')).filter(Boolean);
  $('printAll').innerHTML = pages.join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + pages.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, C = commercial, M = mega)
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (tvOn()) { if (k === 'Escape' || k === 'Enter' || k === ' ' || k === 'Backspace') { stopTV(); e.preventDefault(); } return; }
  if (view === 'inv') {
    if (k === 'ArrowUp' || k === 'ArrowDown') { catI = (catI + (k === 'ArrowDown' ? 1 : CATS.length - 1)) % CATS.length; renderCats(); renderOpts(); blip(520, 0, .06); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') nudge(k === 'ArrowRight' ? 1 : -1);
    else if (k === ' ') spinName();
    else if (k === 'Enter') openGallery();
    else if (k === 'c' || k === 'C') startTV();
    else if (k === 'm' || k === 'M') openMega();
    else if (k === 'p' || k === 'P') { sel = 0; openSheet(0); printSheet(); }
    else return;
    e.preventDefault();
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToInventor(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {
  loadState();
  renderCats(); renderOpts(); renderPreview(); renderPens();
  const cv = $('trace');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bTV').addEventListener('click', startTV);
  $('prev').addEventListener('click', flipPreview);
  $('tvStop').addEventListener('click', () => stopTV());
  $('bPrints').addEventListener('click', openGallery);
  $('bMega').addEventListener('click', openMega);
  $('bGBack').addEventListener('click', backToInventor);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
