    else if (t.id === 'bSave') { const nm = inventionName(); st.saved = st.saved.filter(q => q.name !== nm); st.saved.push({ name: nm, parts: JSON.parse(JSON.stringify(ed.parts)) }); if (st.saved.length > 12) st.saved.shift(); save(); tada(); toast('💾 Saved ' + nm + '!'); ctl(); }
    else if (t.dataset.load !== undefined) { if (running) return; stopRun(); const q = st.saved[+t.dataset.load]; ed.parts = JSON.parse(JSON.stringify(q.parts)); st.name = q.name; blip(800, 0, .1); afterEdit(); talk('Here is ' + q.name + '!', '⚙️'); }
  });
  window.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && !document.querySelector('.panel.on') && document.activeElement.tagName !== 'INPUT') { e.preventDefault(); running ? reset() : (sim && sim.shown ? (stopRun(), go()) : go()); } });
  loadLevel(st.level);
  const hi = 'Welcome to the Invention Factory, Inventor Ben! Build a chain reaction machine, then press GO!';
  setTimeout(() => speak(hi), 700);
  ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { if (!spoke) speak(hi); }, { once: true, capture: true }));
}
if (typeof window !== 'undefined' && !window.__TEST__) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initInvention); else initInvention(); }
