<!DOCTYPE html>

<canvas id="game" width="960" height="520"></canvas>
<script>
// 🏴‍☠️ FOG ISLAND
// A top-down spooky-fun adventure on a foggy island at dusk. Relight the lighthouse (its beam sweeps the fog away),
// find 4 map pieces (lighthouse top, hidden cove, creaky docks, frog jungle), dodge the wobbly GHOST PIRATES
// (hide in barrels or shine your lantern so they float away), bring the lost parrot Pickles back to Captain Boo-Beard,
// sing a sea shanty with your new ghost crew, then dig up the treasure at the X!
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, TS = 32, MW = 64, MH = 40;

// ---------- Saves, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book

const FRESH = () => ({ pieces: {}, lit: false, parrot: 0, shovel: false, done: false, cp: 0, frogs: false, talked: {}, look: 'robo', easy: false, music: true, wins: 0 });
let save = FRESH();
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('fogIsland') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.pieces = save.pieces || {}; save.talked = save.talked || {};
}
function writeSave() { try { localStorage.setItem('fogIsland', JSON.stringify(save)); } catch (_) {} }
loadSave();
const pieceCount = () => [1, 2, 3, 4].filter(k => save.pieces[k]).length;
const started = () => pieceCount() > 0 || save.lit || save.parrot > 0 || save.cp > 0;

// ---------- Characters (Game Factory looks) ----------
const LOOKS = [
  { id: 'robo', name: 'Robo' },
  { id: 'phantom', name: 'Phantom Robo' },
  { id: 'gloop', name: 'King Gloop' },
  { id: 'sammy', name: 'Sammy' },
];
let lookIdx = Math.max(0, LOOKS.findIndex(l => l.id === save.look));
function cycleLook(d) { lookIdx = (lookIdx + d + LOOKS.length) % LOOKS.length; save.look = LOOKS[lookIdx].id; writeSave(); sfx.click(); }

// ---------- Drawing helpers ----------
let frame = 0;
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function glow(x, y, r, col, a) {                       // soft warm light (radial gradient, no ctx.filter)
  if (r <= 1) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},${a})`); g.addColorStop(1, `rgba(${col},0)`);
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
}
function wrapText(str, x, y, maxW, size, color, lh) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  const words = str.split(' '); let line = '', yy = y;
  for (const w of words) {
    const test = line ? line + ' ' + w : w;
    if (ctx.measureText(test).width > maxW && line) { text(line, x, yy, size, color, 'left'); line = w; yy += lh; } else line = test;
  }
  if (line) text(line, x, yy, size, color, 'left');
}
const dist = (ax, ay, bx, by) => Math.hypot(ax - bx, ay - by);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseNote(start, dur, vol, freq) {             // a soft whoosh / crunch made from noise
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime + start, s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.frequency.setValueAtTime(freq, t); f.Q.value = 1.2;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.3); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxBus || actx.destination); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  click:   () => note(700, 0, 0.06, 'square', 0.06),
  step:    () => noiseNote(0, 0.06, 0.03, 900),
  creak:   () => { note(140 + Math.random() * 40, 0, 0.35, 'sawtooth', 0.035, 95); note(210, 0.05, 0.25, 'square', 0.015, 170); },
  lantern: () => { note(300, 0, 0.35, 'sine', 0.14, 1200); note(900, 0.05, 0.3, 'triangle', 0.06, 1800); noiseNote(0, 0.35, 0.05, 2500); },
  nolight: () => note(220, 0, 0.12, 'triangle', 0.06),
  oooh:    () => { note(523, 0, 0.7, 'sine', 0.05, 392); note(530, 0.02, 0.7, 'sine', 0.03, 400); },     // the soft ghost "ooOOoo" warning
  giggle:  () => [880, 1047, 880, 1175].forEach((f, i) => note(f, i * 0.07, 0.09, 'sine', 0.05)),
  caught:  () => { note(392, 0, 0.5, 'sine', 0.08, 196); note(330, 0.2, 0.5, 'triangle', 0.05, 165); },
  pinch:   () => { note(1400, 0, 0.04, 'square', 0.05); note(1200, 0.06, 0.04, 'square', 0.05); note(250, 0.02, 0.18, 'sine', 0.1, 140); },
  hoot:    () => { note(392, 0, 0.25, 'sine', 0.05, 370); note(370, 0.35, 0.4, 'sine', 0.05, 349); },
  ribbit:  () => { note(180, 0, 0.08, 'square', 0.05, 260); note(200, 0.1, 0.1, 'square', 0.05, 300); },
  piece:   () => [659, 784, 988, 1319].forEach((f, i) => note(f, i * 0.08, 0.3, 'sine', 0.12)),
  squawk:  () => { note(1200, 0, 0.12, 'sawtooth', 0.05, 1800); note(1500, 0.12, 0.15, 'sawtooth', 0.05, 900); },
  barrel:  () => { note(150, 0, 0.2, 'triangle', 0.18, 80); noiseNote(0, 0.12, 0.06, 500); },
  dig:     () => { noiseNote(0, 0.2, 0.1, 700); note(110, 0, 0.15, 'triangle', 0.1, 70); },
  crank:   () => { note(900, 0, 0.04, 'square', 0.05); note(700, 0.07, 0.04, 'square', 0.05); note(1100, 0.14, 0.05, 'square', 0.05); },
  lamp:    () => { [440, 554, 659, 880, 1109, 1319].forEach((f, i) => note(f, i * 0.09, 0.8, 'sine', 0.09)); noiseNote(0, 1, 0.05, 3000); },
  stairs:  () => [523, 587, 659].forEach((f, i) => note(f, i * 0.07, 0.08, 'triangle', 0.07)),
  door:    () => { note(120, 0, 0.6, 'sawtooth', 0.04, 220); note(90, 0.3, 0.3, 'triangle', 0.08, 60); },
  splash:  () => noiseNote(0, 0.35, 0.08, 800),
  talk:    () => note(500 + Math.random() * 200, 0, 0.05, 'triangle', 0.05),
  chest:   () => { note(200, 0, 0.5, 'sawtooth', 0.05, 400); [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => note(f, 0.4 + i * 0.08, 0.5, 'sine', 0.1)); },
  pop:     () => { noiseNote(0, 0.4, 0.08, 1500 + Math.random() * 1000); note(1800 + Math.random() * 800, 0, 0.3, 'sine', 0.04, 600); },
  launch:  () => note(300, 0, 0.6, 'sine', 0.04, 1400),
};
let ambT = 400;
function ambience() {                                   // 🦉 owl hoots, far-off waves and creaks (soft, never loud)
  if (--ambT > 0) return;
  ambT = 500 + Math.floor(Math.random() * 500);
  const r = Math.random();
  if (r < 0.4) sfx.hoot(); else if (r < 0.7) noiseNote(0, 1.6, 0.03, 400); else sfx.creak();
}

// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  }
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar, "4/5" = two per bar): degree number, M = make it major, m = minor, b = flat root (bVII), 7 = add the 7th.
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10] };
const degS = (sc, k) => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
function parseMel(str, sc) {
  return str.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean).map(tk => {

function updateGhosts() {

    } else if (g.st === 'chase') {

    } else if (g.st === 'lost') {
      g.x += Math.cos(g.t * 0.05) * 0.4;
      if (g.t > 90) { g.st = 'home'; g.t = 0; }
      else if (see && d < R * 0.7) { g.st = 'chase'; g.t = 0; }
    } else if (g.st === 'home') {

}

// ---------- The main update ----------
function anyGo() { return press.enter || press.use || press.lantern || !!tap; }
function update() {

  if (state === 'title') updateTitle();

    if (press.esc || (tap && inBox(tap, BACK_BTN))) { tap = null; writeSave(); state = 'title'; setSong('title'); }
    else if (tap && inBox(tap, MAP_BTN) && scene === 'island') { state = 'map'; mapReturn = 'play'; sfx.click(); }
    else {
      let mx = (keys.right ? 1 : 0) - (keys.left ? 1 : 0), my = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
      if (mx && my) { mx *= 0.7071; my *= 0.7071; }
      if (mx) P.face = mx > 0 ? 1 : -1;
      if (mx || my) P.walk++;
      if (P.lanternCD > 0) P.lanternCD--;
      if (P.flash > 0) { P.flash += 1; if (P.flash > 26) P.flash = 0; }
      if (scene === 'tower') { updateTower(mx, my); if (press.lantern) lantern(); }
      else updateIsland(mx, my);
    }
    ambience();
  } else if (state === 'talk') {
    talkT++;
    if (talkT > 12 && anyGo()) {
      talkI++; talkT = 0; sfx.talk();
      if (talkI >= talkQ.length) { state = 'play'; const f = talkAfter; talkAfter = null; talkQ = null; if (f) f(); }
    }
  } else if (state === 'caught') {
    caughtT++;
    if (caughtT > 110 || (caughtT > 40 && anyGo())) { spawnAt(save.cp || 0); resetGhosts(); state = 'play'; }
  } else if (state === 'shanty') {
    shantyT++;
    if (shantyT > 60 * 26 || (shantyT > 240 && (press.enter || !!tap))) {
      save.shovel = true; writeSave(); setSong('island');
      say([['🏴‍☠️', 'Captain Boo-Beard', 'Har har! Now ye be one of us! Here, take me GOLDEN SHOVEL. 🪏'],
           ['🏴‍☠️', 'Captain Boo-Beard', pieceCount() === 4 ? 'Ye have all 4 map pieces! Go dig at the X in the clearing!' : 'Find all 4 map pieces, then dig at the X. Me crew will follow ye and keep ye company!']]);
    }
  } else if (state === 'map') {
    if (anyGo() || press.esc) { state = mapReturn; sfx.click(); }
  } else if (state === 'ending') updateEnding();
  else if (state === 'win') {
    endT++; updateFireworks();
    if (endT > 90 && (press.enter || !!tap)) { state = 'title'; setSong('title'); }
  }
  if (scene === 'island' && save.lit) beamA += 0.012;
  fogLevel += (targetFog() * (EASY() ? 0.7 : 1) - fogLevel) * 0.01;
  for (const k in press) press[k] = false;
  tap = null;
}
function updateEnding() {
  endT++;
  const X = px(XSPOT[0]), Y = px(XSPOT[1]);
  if (endT < 70 && endT % 14 === 0) { sfx.dig(); for (let i = 0; i < 8; i++) sparks.push({ x: X, y: Y, vx: (Math.random() - 0.5) * 4, vy: -Math.random() * 4, life: 40, c: '#8d6e63' }); }
  if (endT === 150) {
    sfx.chest(); save.done = true; save.wins = (save.wins || 0) + 1; writeSave(); trophy('fogIsland');
    for (let i = 0; i < 40; i++) sparks.push({ x: X, y: Y - 20, vx: (Math.random() - 0.5) * 6, vy: -Math.random() * 7, life: 70, c: i % 2 ? '#ffd740' : '#fff59d' });
  }
  if (endT > 170 && endT % 20 === 0) launchFirework(X + (Math.random() - 0.5) * 600, Y + 60);
  updateFireworks();

function launchFirework(x, y) { fireworks.push({ x, y, vy: -7 - Math.random() * 2.5, t: 0, boom: false, hue: Math.floor(Math.random() * 360) }); sfx.launch(); }
function updateFireworks() {

  }
  fireworks = fireworks.filter(f => !f.boom);
  for (const s of sparks) { s.x += s.vx; s.y += s.vy; s.vy += 0.06; s.vx *= 0.98; s.life--; }
  sparks = sparks.filter(s => s.life > 0);
  if (state === 'win' && endT % 40 === 0) launchFirework(200 + Math.random() * 560 + cam.x, cam.y + 420);
}
function updateTitle() {
  if (newConfirm > 0) newConfirm--;
  if (press.l || (tap && inBox(tap, LOOK_L))) cycleLook(-1);
  if (press.r || (tap && inBox(tap, LOOK_R))) cycleLook(1);
  if (press.use || press.d || press.u || (tap && inBox(tap, EASY_BTN))) { save.easy = !save.easy; writeSave(); sfx.click(); }
  if (tap && inBox(tap, MUSIC_BTN)) toggleMusic();

    else { newConfirm = 180; sfx.click(); }

  }
  if (press.enter || press.lantern || (tap && inBox(tap, PLAY_BTN))) { sfx.click(); startGame(); }
}

const TILE_COL = { '~': '#24557a', '.': '#c2a878', ',': '#4f7a4a', T: '#2a4d30', j: '#6e6446', c: '#7e7a5a', p: '#9a7b55', R: '#4f7a4a', r: '#c2a878', '=': '#24557a', L: '#6a6f78', D: '#9a7b55', S: '#24557a', s: '#5b5578', w: '#1f5a55' };

    const dx = frame * (0.22 + L * 0.18) + L * 150, dy = Math.sin(frame * 0.003 + L) * 30;
    const gx0 = Math.floor((ox - dx - 260) / sp), gx1 = Math.ceil((ox - dx + W + 260) / sp);
    const gy0 = Math.floor((oy - dy - 260) / sp), gy1 = Math.ceil((oy - dy + H + 260) / sp);
    for (let gy = gy0; gy <= gy1; gy++) for (let gx = gx0; gx <= gx1; gx++) {
      const h = hash(gx + L * 31, gy), h2 = hash(gy * 3, gx + L);

}

  const g = fx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(0,0,0,${s})`); g.addColorStop(0.55, `rgba(0,0,0,${s * 0.7})`); g.addColorStop(1, 'rgba(0,0,0,0)');

}

  for (const l of lights) if (l.c) glow(l.x, l.y, l.r * 0.8, l.c, l.a || 0.18);

    ctx.save(); ctx.beginPath(); ctx.moveTo(beam.x, beam.y); ctx.arc(beam.x, beam.y, 1300, beamA - 0.17, beamA + 0.17); ctx.closePath();
    const g = ctx.createRadialGradient(beam.x, beam.y, 0, beam.x, beam.y, 1300);
    g.addColorStop(0, 'rgba(255,240,170,.5)'); g.addColorStop(0.5, 'rgba(255,236,160,.16)'); g.addColorStop(1, 'rgba(255,236,160,0)'); ctx.fillStyle = g; ctx.fill(); ctx.restore();

  if (f.pillar) { circle(TC.x, TC.y, f.pillar, '#8a8f99'); circle(TC.x - 8, TC.y - 8, f.pillar * 0.6, '#9ea4ae'); }
  drawStairs(f.up, true); drawStairs(f.down, false);
  if (f.door) { roundRect(f.door.x - 30, f.door.y - 6, 60, 26, [16, 16, 0, 0], '#5a3d26'); text('🚪 OUT', f.door.x, f.door.y - 12, 16, '#ffe082'); }
  if (floor === 1) {                                   // 🦇 the sleepy bat
    const bx = bat.woke ? 640 + Math.cos(bat.t * 0.05) * 60 : 640, by = bat.woke ? 170 + Math.sin(bat.t * 0.1) * 20 : 170, fl = bat.woke ? Math.sin(frame * 0.6) * 10 : 2;
    ctx.fillStyle = '#4a3b6b'; ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx - 22, by - 6 - fl); ctx.lineTo(bx - 12, by + 4); ctx.lineTo(bx, by + 2); ctx.lineTo(bx + 12, by + 4); ctx.lineTo(bx + 22, by - 6 - fl); ctx.fill();
    circle(bx, by, 9, '#5e4b8b'); circle(bx - 3, by - 2, 2.4, '#fff'); circle(bx + 3, by - 2, 2.4, '#fff');

  }
  if (f.lamp) {                                        // 💡 the great lamp + its crank
    if (lit) glow(TC.x, TC.y, 200, '255,240,150', 0.5);
    circle(TC.x, TC.y, f.lamp, '#37474f');
    circle(TC.x, TC.y, f.lamp - 10, lit ? '#fff59d' : '#90a4ae');
    if (lit) { ctx.save(); ctx.translate(TC.x, TC.y); ctx.rotate(frame * 0.03); ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(-4, -38, 8, 76); ctx.restore(); }
    ctx.save(); ctx.translate(TC.x + 62, TC.y + 30); ctx.rotate(crank * 1.2 + (lit ? frame * 0.05 : 0));
    ctx.fillStyle = '#b0bec5'; for (let k = 0; k < 8; k++) { ctx.rotate(Math.PI / 4); ctx.fillRect(-3, -18, 6, 8); }
    circle(0, 0, 13, '#b0bec5'); circle(0, 0, 4, '#546e7a'); ctx.restore();
    if (!lit) text(`⚙️ Press USE by the lamp to turn the crank! ${crank}/5`, TC.x, TC.y + 160, 18, '#ffe082');
  }
  if (P.hidden < 0) { drawHero(LOOKS[lookIdx].id, P.x, P.y, 1, P.walk, P.face); drawLanternHeld(P.x, P.y, P.face); if (save.parrot === 1) drawParrot(P.x - P.face * 14, P.y - 46, 0.7); }
  // darkness with light holes (no fog indoors)
  fx.globalCompositeOperation = 'source-over'; fx.clearRect(0, 0, W, H);
  fx.fillStyle = `rgba(8,10,30,${lit ? 0.2 : (EASY() ? 0.35 : 0.55)})`; fx.fillRect(0, 0, W, H);
  fx.globalCompositeOperation = 'destination-out';
  cutLight(P.x, P.y - 20, 170 + (P.flash ? Math.sin(P.flash / 26 * Math.PI) * 120 : 0));
  cutLight(f.up ? f.up.x : 0, f.up ? f.up.y : 0, 90, 0.6);
  if (f.lamp) cutLight(TC.x, TC.y, lit ? 400 : 120, 0.8);
  fx.globalCompositeOperation = 'source-over';
  ctx.drawImage(fogC, 0, 0);
  text(['🗼 Ground Floor', '🗼 Middle Floor', '🗼 The Lamp Room'][floor], W / 2, 88, 20, '#cfd8dc');
  if (state === 'play') drawArrow();
}

// ---------- HUD, talking, menus ----------
function btn(b, label, size = 20, col = 'rgba(20,30,60,.75)') {

}

}
function drawTalk() {
  const line = talkQ[talkI]; if (!line) return;

}
function drawCaught() {

function drawShanty() {
  ctx.fillStyle = 'rgba(10,15,45,.78)'; ctx.fillRect(0, 0, W, H);

  const n = Math.min(3, Math.floor(shantyT / (60 * 5.5)));
  for (let i = 0; i <= n; i++) text(SHANTY_WORDS[i], 480, 380 + i * 30, i === n ? 21 : 17, i === n ? '#fff59d' : '#b0bec5');

}

// ---------- The treasure map (built once from the island) ----------
const mapC = document.createElement('canvas'); mapC.width = MW * 8; mapC.height = MH * 8;
function buildMapPic() {
  const m = mapC.getContext('2d');
  const col = { '~': '#cdb88c', T: '#8fa36c', R: '#a2967c', r: '#a2967c', L: '#c0504d', D: '#c0504d', S: '#6d5a7a', s: '#8d7a9a', '=': '#8d6e4a', w: '#7fa0a0' };
  for (let y = 0; y < MH; y++) for (let x = 0; x < MW; x++) { m.fillStyle = col[map[y][x]] || '#ead8ab'; m.fillRect(x * 8, y * 8, 8, 8); }
}
buildMapPic();
function drawMapView() {
  ctx.fillStyle = 'rgba(5,8,25,.7)'; ctx.fillRect(0, 0, W, H);

  const X0 = 224, Y0 = 70, MWp = 512, MHp = 320;

    const qx = (k - 1) % 2, qy = Math.floor((k - 1) / 2), sx = qx * 256, sy = qy * 160;

    else { roundRect(X0 + sx + 4, Y0 + sy + 4, 248, 152, 8, 'rgba(255,255,255,.08)'); text('?', X0 + sx + 128, Y0 + sy + 96, 48, 'rgba(255,255,255,.4)');
           text(['', 'lighthouse top', 'hidden cove', 'creaky docks', 'frog pond'][k], X0 + sx + 128, Y0 + sy + 130, 16, 'rgba(255,255,255,.5)'); }
  }
  ctx.strokeStyle = 'rgba(93,64,55,.8)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(X0 + 256, Y0); ctx.lineTo(X0 + 256, Y0 + MHp); ctx.moveTo(X0, Y0 + 160); ctx.lineTo(X0 + MWp, Y0 + 160); ctx.stroke();

  } else text(`${pieceCount()} of 4 pieces found`, 480, Y0 + MHp + 50, 22, '#fff');
  if (scene === 'island') { const x = X0 + P.x / TS * 8, y = Y0 + P.y / TS * 8; circle(x, y, 6, '#2979ff'); circle(x, y, 3, '#fff'); }
  text('tap or press any button to close', 480, H - 14, 15, '#cfd8dc');
}
// ---------- Title + win screens ----------
function drawTitle() {
  const sky = ctx.createLinearGradient(0, 0, 0, H); sky.addColorStop(0, '#2a1b4a'); sky.addColorStop(0.5, '#4a3a6a'); sky.addColorStop(0.75, '#c9706a'); sky.addColorStop(1, '#24557a');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  circle(800, 110, 46, '#fff8e1'); circle(818, 98, 40, '#4a3a6a');                 // a crescent moon
  for (let i = 0; i < 30; i++) circle(hash(i, 1) * W, hash(i, 2) * 220, hash(i, 3) < 0.3 ? 1.6 : 1, 'rgba(255,255,255,.7)');
  ctx.fillStyle = '#1f2f3a'; ctx.beginPath(); ctx.moveTo(0, 420); ctx.quadraticCurveTo(200, 330, 420, 400); ctx.quadraticCurveTo(640, 360, 960, 410); ctx.lineTo(960, H); ctx.lineTo(0, H); ctx.fill();
  ctx.fillStyle = '#e8e6e0'; ctx.beginPath(); ctx.moveTo(840, 400); ctx.lineTo(852, 300); ctx.lineTo(888, 300); ctx.lineTo(900, 400); ctx.fill();
  ctx.fillStyle = '#d84a3f'; ctx.fillRect(846, 330, 50, 14); ctx.fillRect(842, 366, 56, 14);
  roundRect(850, 280, 40, 22, 4, '#fff59d');

  ctx.fillStyle = '#3e2c20'; ctx.save(); ctx.translate(120, 440); ctx.rotate(-0.25); ctx.fillRect(-3, -90, 6, 90); ctx.fillStyle = 'rgba(190,230,255,.5)'; ctx.fillRect(4, -84, 40, 40); ctx.restore();
  beamA = frame * 0.012;
  drawFog([{ x: 870, y: 290, r: 160, c: '255,240,160', a: 0.3 }, { x: 480, y: 270, r: 190 }], { x: 870, y: 290 }, frame * 0.5, 0);
  for (let i = 0; i < 2; i++) drawGhost({ st: 'idle', ph: i * 2, face: i ? -1 : 1, t: 0 }, 140 + i * 680 + Math.sin(frame * 0.01 + i) * 30, 210 + i * 30, 1.1);
  text('🏴‍☠️ Fog Island', 480, 92, 64, '#e1f5fe');
  text('a spooky-fun pirate adventure', 480, 130, 20, '#ffe0b2');
  btn(LOOK_L, '◀', 32); btn(LOOK_R, '▶', 32);
  drawHero(LOOKS[lookIdx].id, 480, 280, 1.8, frame * 0.5, 1);
  text(LOOKS[lookIdx].name, 480, 312, 22, '#fff');
  btn(EASY_BTN, save.easy ? '🌙 Not so spooky: ON' : '🌙 Not so spooky: OFF', 20, save.easy ? 'rgba(46,125,50,.85)' : 'rgba(20,30,60,.75)');
  btn(PLAY_BTN, started() ? '▶ CONTINUE' : '▶ PLAY', 30, 'rgba(230,120,30,.9)');
  btn(MUSIC_BTN, musicOn ? '🎵' : '🔇', 20);
  if (started()) btn(NEW_BTN, newConfirm > 0 ? 'Tap again!' : '🔄 New voyage', 17, newConfirm > 0 ? 'rgba(198,40,40,.9)' : 'rgba(20,30,60,.75)');
  if (save.done) text('🏆 Treasure found!', 480, 172, 20, '#ffd740');
  text('◀ ▶ pick a hero • ▲ ▼ or X: not so spooky • ENTER or SPACE: play', 480, 482, 15, '#fff');
  text('In the game: arrows walk • SPACE shines your lantern • X uses things', 480, 506, 15, '#cfd8dc');
  if (!actx && frame % 60 < 40) text('🔊 tap or press a key for sound', 480, 160 + (save.done ? 34 : 0), 15, '#ddd');
}
function drawWin() {
  ctx.fillStyle = 'rgba(10,15,45,.45)'; ctx.fillRect(0, 0, W, H);
  roundRect(170, 70, 620, 260, 22, 'rgba(10,15,40,.85)');
  text('🏆 YOU FOUND THE TREASURE! 🏆', 480, 124, 36, '#ffd740');
  text('Gold coins, sparkly gems, a golden compass...', 480, 170, 21, '#fff8e1');
  text('...and the friendliest ghost crew on the seven seas!', 480, 202, 21, '#b3e5fc');
  for (let i = 0; i < 4; i++) drawGhost({ st: 'friend', ph: i, face: i % 2 ? -1 : 1, t: 0 }, [270, 370, 590, 690][i], 300 - Math.abs(Math.sin(endT * 0.1 + i)) * 18, 0.75);
  drawHero(LOOKS[lookIdx].id, 480, 312 - Math.abs(Math.sin(endT * 0.12)) * 10, 1.2, 0, 1); drawParrot(512, 250 + Math.sin(endT * 0.1) * 4, 0.9);
  if (endT > 90 && frame % 60 < 40) text('tap or ENTER to sail back to the title', 480, 370, 18, '#fff');
}
function draw() {
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (state === 'title') { drawTitle(); return; }
  if (scene === 'tower' && state !== 'ending' && state !== 'win') drawTower(); else drawIsland();
  if (state === 'play' || state === 'talk') drawHUD();
  if (state === 'talk') drawTalk();
  else if (state === 'caught') drawCaught();
  else if (state === 'shanty') drawShanty();
  else if (state === 'map') drawMapView();
  else if (state === 'win') drawWin();
  else if (state === 'ending' && endT > 160) text('🎆 THE TREASURE OF FOG ISLAND! 🎆', 480, 80, 34, '#ffd740');
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
