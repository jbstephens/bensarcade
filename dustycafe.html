<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🧁 Dusty's Snack Café</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #fce4ec 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; }
  .b-all { background: #c3a6ff; }
  .b-made { background: #ffe066; font-size: 21px; }
  .b-made.on { background: #8ef08e; }
  .b-shop { background: #ffb347; } .b-shop.on { background: #8ef08e; }
  .b-pick { background: #fff; font-size: 15px; min-height: 48px; padding: 4px; line-height: 1.1; }
  .b-pick.on { background: #8ef08e; }
  .b-real { background: linear-gradient(#fff59d, #ffb300); font-size: 23px; }
  .b-go { background: linear-gradient(#b9f6ca, #43d17a); font-size: 26px; }
  .b-pink { background: linear-gradient(#ffd6ea, #ff8cc6); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- title ---------- */
  #title { flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 12px; overflow-y: auto; }
  #title h1 { margin: 0; font-size: clamp(34px, 6vw, 70px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 5px 5px 0 #ff6fb5; letter-spacing: 2px; text-align: center; line-height: 1.05; }
  #title .sub { font-size: clamp(17px, 2.4vw, 24px); font-weight: bold; text-align: center; margin: 0; }
  #tRow { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
  #tDusty { width: clamp(150px, 22vw, 240px); }
  #tDusty svg { width: 100%; height: auto; display: block; }
  #tBtns { display: flex; flex-direction: column; gap: 12px; width: min(420px, 90vw); }
  #tBtns .btn { font-size: clamp(22px, 2.8vw, 30px); min-height: 72px; }
  #chefBox { background: #fff; border: 4px solid #333; border-radius: 18px; padding: 8px 12px; text-align: center; }
  #chefBox b { font-size: 20px; }
  #chefBtns { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 6px; }
  #chefBtns .btn { font-size: 17px; min-height: 46px; padding: 4px 10px; }
  #chefBtns .btn.on { background: #ffd60a; }
  #tProg { font-size: 19px; font-weight: bold; background: #fffbe0; border: 3px solid #333; border-radius: 14px; padding: 4px 14px; }
  .credit { font-size: 16px; font-weight: bold; color: #6a1b9a; }
  /* ---------- café ---------- */
  #cafe { flex-direction: row; gap: 10px; padding: 10px; }
  #sceneBox { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: 100%; max-height: 100%; aspect-ratio: 4 / 3; max-width: calc((100vh - 20px) * 4 / 3);
    border: 5px solid #333; border-radius: 18px; overflow: hidden; background: #fff; box-shadow: 0 8px 0 #ff6fb5; }
  #stage > div { position: absolute; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #bgL { inset: 0; }
  #dustyL { left: 3%; bottom: 33%; width: 27%; height: 36%; }
  #custL { left: 62%; bottom: 2%; width: 34%; height: 48%; transition: left 1.1s ease-out; }
  #custL.away { left: 112%; }
  #custL.hop { animation: hop .5s ease 2; }
  @keyframes hop { 50% { transform: translateY(-12%); } }
  #dishL { left: 27%; bottom: 31%; width: 30%; height: 30%; display: flex; align-items: flex-end; justify-content: center; }
  #dishL .plate { position: absolute; left: 5%; right: 5%; bottom: 0; height: 22%; background: radial-gradient(#fff 55%, #dfe6ee 56%);
    border: 4px solid #333; border-radius: 50%; }
  #dishL .bit { position: absolute; font-size: clamp(22px, 4.2vw, 46px); animation: pop .35s ease; line-height: 1; }
  #dishL .pic { position: absolute; inset: 0; animation: pop .5s ease; }
  @keyframes pop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
  #bubL { right: 3%; top: 4%; width: 46%; background: #fff; border: 4px solid #333; border-radius: 22px; padding: 8px 12px;
    font-size: clamp(15px, 2vw, 22px); font-weight: bold; text-align: center; transition: transform .25s; transform-origin: 70% 100%; }
  #bubL.hide { display: block !important; transform: scale(0); }
  #bubL:after { content: ''; position: absolute; left: 62%; bottom: -18px; border: 10px solid transparent; border-top: 14px solid #333; }
  #panel { width: min(35vw, 400px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTop { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: center; }
  #pTop .btn { min-height: 50px; font-size: 18px; }
  #pScore { font-size: 19px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .card { background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px 10px; font-size: 19px; text-align: center; }
  .card h2 { margin: 2px 0 4px; font-size: 23px; }
  .gjob { display: inline-block; font-size: 15px; font-weight: bold; border: 2px solid; border-radius: 12px; padding: 1px 8px; margin: 2px; }
  .gjob.k { background: #c8f7c5; border-color: #2e7d32; color: #1b5e20; } .gjob.g { background: #ffd6a8; border-color: #e65100; color: #bf360c; }
  #actBtn { font-size: clamp(26px, 3.4vw, 36px); min-height: 110px; background: linear-gradient(#fff59d, #ffca28); }
  #actBtn .em { font-size: 1.5em; display: block; line-height: 1.1; }
  .dots { display: flex; gap: 6px; justify-content: center; margin: 4px 0; }
  .dots i { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #333; background: #fff; }
  .dots i.on { background: #43d17a; }
  .rstars { font-size: 34px; letter-spacing: 2px; }
  .realbox { background: #fffde7; border: 3px dashed #ffb300; border-radius: 14px; padding: 6px 8px; font-size: 16px; text-align: left; margin-top: 6px; }
  .realbox b { color: #bf360c; }
  /* ---------- printables book ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; position: relative; }
  #gHead h1 { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff; -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff6fb5; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; }
  #gHome { position: absolute; left: 12px; top: 8px; min-height: 50px; font-size: 18px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .thumb { position: relative; background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff6fb5; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 10px; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; line-height: 1.15; }
  .thumb .made { position: absolute; top: -10px; right: -10px; background: #8ef08e; border: 4px solid #333; border-radius: 14px; font-size: 16px; font-weight: bold; padding: 2px 7px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff6fb5; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #vTitle { font-size: 23px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #vHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #shopPick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view, #cafe { flex-direction: column; }

    #wrap { height: 100%; }

    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="title" class="screen on">
  <h1>🧁 DUSTY'S SNACK CAFÉ</h1>
  <p class="sub">Robo friends come in hungry. Make their snack, serve it, then make it for REAL at home!</p>

  <div id="chefBox"><b>👩‍🍳 Who is the chef today?</b><div id="chefBtns"></div></div>
  <div class="credit">💡 Ben's rule: every recipe is REAL!</div>
</div>
<div id="cafe" class="screen">
  <div id="sceneBox"><div id="stage">

    <div id="dustyL"></div>
    <div id="dishL"></div>

  </div></div>
  <div id="panel">
    <div id="pTop"><button class="btn b-back" id="bHome">🏠</button><div id="pScore"></div></div>
    <div id="pBody"></div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="gHome">🏠 Café</button>
    <h1>📖 DUSTY'S CAFÉ RECIPES</h1>
    <p>Every snack is a REAL recipe! Tap a page to see it and print it.</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="vTitle"></div>
    <div id="vHelp"></div>
    <div id="recipeBtns">
      <button class="btn b-made" id="bMade" style="width:100%">🍳 We made it for REAL!</button>
      <button class="btn b-shop" id="bShopAdd" style="width:100%;margin-top:8px">🛒 Add to shopping list</button>
    </div>
    <div id="shopBtns">
      <div id="shopPick"></div>
      <div class="two" style="margin-top:8px">
        <button class="btn b-all" id="bShopAll">✅ Pick all</button>
        <button class="btn b-clear" id="bShopClear">🧽 Clear</button>
      </div>
    </div>
    <button class="btn b-print" id="bPrint">🖨️ Print this page</button>
    <button class="btn b-all" id="bPrintAll">📚 Print the café kit (all pages)</button>
    <div class="two">
      <button class="btn b-back" id="bPrev">⬅️ Last page</button>
      <button class="btn b-back" id="bNext">Next page ➡️</button>
    </div>
    <button class="btn b-back" id="bBack">📖 All pages</button>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🧁 DUSTY'S SNACK CAFÉ: Robo friends order snacks, Ben makes + serves them, then makes them for REAL.

// Printables (portrait letter pages, viewBox 0 0 800 1000): 12 recipe cards, café menu, order pad, café sign, shopping list.

// RULE: any knife / stove / oven / blender / hot / melt / bake / cook / toaster step is a 🧑 Grown-up job.
// =====================================================================

const n = v => (Math.round(v * 10) / 10);

// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,

const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };

const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);

// =====================================================================
let sel = 0, cur = 0, fromCafe = false;
function renderSheet() { if ($('svgBox')) $('svgBox').innerHTML = buildSheet(cur); }
function updateSide() {
  const p = SHEETS[cur], isR = p.kind === 'recipe';
  $('vTitle').textContent = p.name;
  $('vHelp').textContent = HELP[isR ? 'recipe' : p.id];
  $('recipeBtns').classList.toggle('hide', !isR); $('shopBtns').classList.toggle('hide', p.id !== 'shop');
  $('bBack').textContent = fromCafe ? '☕ Back to the café' : '📖 All pages';
  if (isR) {
    const made = !!S.made[p.id];
    $('bMade').classList.toggle('on', made); $('bMade').textContent = made ? '✅ We made it for REAL! (tap to undo)' : '🍳 We made it for REAL!';
    $('bShopAdd').classList.toggle('on', !!S.shop[p.id]); $('bShopAdd').textContent = S.shop[p.id] ? '🛒 On the shopping list ✓' : '🛒 Add to shopping list';
  }
  if (p.id === 'shop') {
    const box = $('shopPick'); box.innerHTML = '';
    RECIPES.forEach(r => { const b = document.createElement('button'); b.className = 'btn b-pick' + (S.shop[r.id] ? ' on' : '');
      b.textContent = (S.shop[r.id] ? '✅ ' : '') + r.emoji + ' ' + r.short;
      b.addEventListener('click', () => { toggleShop(r.id); blip(600); renderSheet(); updateSide(); }); box.appendChild(b); });
  }
}
function toggleShop(id) { if (S.shop[id]) delete S.shop[id]; else S.shop[id] = 1; saveState(); }
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    if (k === 0 || p.kind !== SHEETS[k - 1].kind) {
      const h = document.createElement('div'); h.className = 'sec';
      h.innerHTML = '<span>' + (p.kind === 'recipe' ? '🍳 Real Recipes' : '🧁 Play Café at Home') + '</span>';
      if (k === 0) { const b = document.createElement('button'); b.className = 'btn b-all'; b.textContent = '📚 Print the café kit';
        b.addEventListener('click', printKit); h.appendChild(b); }
      g.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    const made = p.kind === 'recipe' && S.made[p.id];
    d.innerHTML = thumbSVG(k) + '<b>' + esc(p.kind === 'recipe' ? RECIPES[p.ri].emoji + ' ' + p.thumb : p.thumb) + '</b>' + (made ? '<div class="made">✅ REAL!</div>' : '');
    d.addEventListener('click', () => { sel = k; fromCafe = false; openSheet(k); });
    g.appendChild(d);
  });
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openBook() { fromCafe = false; endPrintAll(); renderGallery(); show('gallery'); markSel(); }
function openSheet(k) { if (screen === 'cafe') fromCafe = true; cur = k; sel = k; endPrintAll(); renderSheet(); updateSide(); show('view'); blip(660); }
function backFromSheet() { endPrintAll(); if (fromCafe) { fromCafe = false; show('cafe'); return; } renderGallery(); show('gallery'); markSel(); }
function step(d) { cur = (cur + d + SHEETS.length) % SHEETS.length; sel = cur; renderSheet(); updateSide(); blip(660); }
// =====================================================================
// PRINTING: only the page prints (see @media print). The café kit = sign + menu + order pad + all 12 recipe cards.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();
  }, 60);
}
function printPage() {
  if (screen !== 'view') openSheet(sel);
  endPrintAll(); renderSheet();
  if (SHEETS[cur].kind === 'recipe') realTrophy();
  doPrint();
}
const KIT = () => ['sign', 'menu', 'order'].concat(RECIPES.map(r => r.id)).map(id => SHEETS.findIndex(p => p.id === id));
function printKit() {
  $('printAll').innerHTML = KIT().map(i => buildSheet(i)).join('');
  document.body.classList.add('pAll');
  toast('🖨️ Printing the café kit: ' + KIT().length + ' pages!');
  realTrophy();
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS (tap-only game, but keyboards + controllers work too): Enter = the big button, Escape = back, arrows flip pages
// =====================================================================
function onKey(e) {
  const k = e.key;
  if (screen === 'cafe') {
    if (k === 'Enter' || k === ' ') { const b = document.querySelector('#pBody [data-main]'); if (b) { b.click(); e.preventDefault(); } }
    else if (k === 'Escape') goTitle();
  } else if (screen === 'title') {
    if (k === 'Enter' || k === ' ') { openCafe(); e.preventDefault(); }
  } else if (screen === 'gallery') {
    const N = SHEETS.length;
    if (k === 'ArrowRight' || k === 'ArrowDown') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft' || k === 'ArrowUp') sel = Math.max(0, sel - 1);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape') { goTitle(); return; }
    else return;
    e.preventDefault(); markSel();
  } else {
    if (k === 'Escape' || k === 'Backspace') { backFromSheet(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printPage();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { step(1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { step(-1); e.preventDefault(); }
  }
}
function goTitle() { endPrintAll(); renderTitle(); show('title'); try { window.speechSynthesis && speechSynthesis.cancel(); } catch (_) {} }
function init() {
  loadState(); renderTitle();
  $('bOpen').addEventListener('click', openCafe);
  $('bBook').addEventListener('click', openBook);
  $('bHome').addEventListener('click', goTitle);
  $('gHome').addEventListener('click', goTitle);
  $('bMade').addEventListener('click', () => { const id = SHEETS[cur].id;
    if (S.made[id]) delete S.made[id]; else { S.made[id] = 1; if (!realTrophy()) { tune([523, 784, 1047]); toast('✅ Yum! You made it for REAL!'); } }
    saveState(); updateSide(); });
  $('bShopAdd').addEventListener('click', () => { const id = SHEETS[cur].id; toggleShop(id); blip(600); toast(S.shop[id] ? '🛒 Added! Open the Shopping List page.' : '🛒 Taken off the list'); updateSide(); });
  $('bShopAll').addEventListener('click', () => { RECIPES.forEach(r => { S.shop[r.id] = 1; }); saveState(); renderSheet(); updateSide(); });
  $('bShopClear').addEventListener('click', () => { S.shop = {}; saveState(); renderSheet(); updateSide(); });
  $('bPrint').addEventListener('click', printPage);
  $('bPrintAll').addEventListener('click', printKit);
  $('bPrev').addEventListener('click', () => step(-1));
  $('bNext').addEventListener('click', () => step(1));
  $('bBack').addEventListener('click', backFromSheet);
  $('svgBox').addEventListener('click', e => {
    const g = e.target && e.target.closest && e.target.closest('[data-ing]'); if (!g || SHEETS[cur].kind !== 'recipe') return;
    const id = SHEETS[cur].id, c = S.checks[id] = S.checks[id] || {}, k = g.getAttribute('data-ing');
    if (c[k]) delete c[k]; else c[k] = 1; saveState(); blip(880, 0, .08); renderSheet();
  });
  window.addEventListener('afterprint', endPrintAll);
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
</body>
</html>
