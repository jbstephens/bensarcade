// ---------- Saving ----------
function blankRows() {   // a little starter ground + Robo, ready to build on
  const m = [];
  for (let y = 0; y < ROWS; y++) m.push((y >= FLOOR ? '#'.repeat(30) : '').padEnd(COLS, ' '));
  const r = m[FLOOR - 1].split(''); r[3] = 'P'; m[FLOOR - 1] = r.join('');
  return m;
}
function cleanLevel(l) {
  if (!l || !Array.isArray(l.map)) return null;
  const map = [];
  for (let y = 0; y < ROWS; y++) {
    const r = String(l.map[y] || '').padEnd(COLS, ' ').slice(0, COLS);
    map.push(r.split('').map(ch => ALLOWED.includes(ch) ? ch : ' ').join(''));
  }
  const signs = {};
  if (l.signs && typeof l.signs === 'object') for (const k of Object.keys(l.signs)) {
    const [x, y] = k.split(',').map(Number);
    if (Number.isInteger(x) && Number.isInteger(y) && map[y] && map[y][x] === 'S') signs[x + ',' + y] = String(l.signs[k]).slice(0, 60);
  }
  const boss = Number.isInteger(l.boss) && l.boss >= 0 && l.boss < BOSSES.length ? l.boss : NO_BOSS;
  const theme = Number.isInteger(l.theme) && l.theme >= 0 && l.theme < THEMES.length ? l.theme : 0;
  return { name: typeof l.name === 'string' && l.name ? l.name.slice(0, 24) : NAMES[0], theme, boss, map, signs };
}
function cleanWorld(w) {
  if (!w || !Array.isArray(w.levels)) return null;
  return { name: typeof w.name === 'string' && w.name ? w.name.slice(0, 24) : WNAMES[0],
           levels: w.levels.filter(i => Number.isInteger(i) && i >= 0 && i < SLOTS).slice(0, WMAX) };
}
let save = { levels: Array(SLOTS).fill(null), worlds: Array(NWORLDS).fill(null), beaten: {}, hero: 0, wprog: {} };
function writeSave() { try { localStorage.setItem('roboBuilder2', JSON.stringify(save)); } catch (_) {} }
function loadSave() {
  let s = null;
  try { s = JSON.parse(localStorage.getItem('roboBuilder2') || 'null'); } catch (_) {}
  if (s && Array.isArray(s.levels)) {
    save.levels = Array.from({ length: SLOTS }, (_, i) => cleanLevel(s.levels[i]));
    save.worlds = Array.from({ length: NWORLDS }, (_, i) => cleanWorld(s.worlds && s.worlds[i]));
    save.beaten = s.beaten && typeof s.beaten === 'object' ? s.beaten : {};
    save.wprog = s.wprog && typeof s.wprog === 'object' ? s.wprog : {};
    save.hero = Number.isInteger(s.hero) && s.hero >= 0 && s.hero < HEROES.length ? s.hero : 0;
  } else {
    save.levels[0] = makeLevel(12345, "Robo's Example", 0, 0);   // first time: a ready-made level to play

}

// ---------- Sound (everything is gentle: one quiet master volume, soft waves, no noise) ----------
let actx = null, master = null;
function wakeAudio() {
  if (actx) { try { if (actx.state === 'suspended') actx.resume(); } catch (_) {} return; }
  try {
    const J = window.JUKEBOX;
    actx = (J && J.makeCtx && J.makeCtx()) || new (window.AudioContext || window.webkitAudioContext)();
    master = actx.createGain(); master.gain.value = 0.1; master.connect(actx.destination);
  } catch (_) { actx = null; master = null; }
}
function note(freq, start, dur, wave = 'triangle', vol = 0.4, slideTo = null) {
  if (!actx || !master) return;
  try {
    const t = actx.currentTime + Math.max(0, start);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = wave; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(Math.min(vol, 0.6), t + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
  } catch (_) {}
}

          81,0,79,0, 76,0,72,0,  77,0,81,0, 84,0,81,0,  77,0,74,0, 81,0,77,0,  76,0,80,0, 83,0,0,0] },
};
const JB_SONG = (/[?&]song=(edit|play|boss)/.exec(location.search) || [])[1] || null;
let musicOn = true, nextNoteTime = 0, step = 0, songNow = null;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function songWant() {
  if (JB_SONG && state === 'title') return JB_SONG;
  if (state === 'play' || state === 'dying' || state === 'won') return bossState === 'fight' ? 'boss' : 'play';
  return 'edit';
}
function playMusic() {
  if (!actx || !musicOn) return;
  const id = songWant(), S2 = SONGS[id];
  if (id !== songNow) { songNow = id; step = 0; nextNoteTime = 0; }
  const sd = 60 / S2.bpm / 2;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.06;

// ---------- 🎲 Surprise level maker (every piece of level it adds can be beaten) ----------
function rng(seed) { let s = (seed >>> 0) || 1; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }
function makeLevel(seed, name, theme, boss) {
  const R = rng(seed), ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const m = Array.from({ length: ROWS }, () => Array(COLS).fill(' ')), signs = {};
  const put = (x, y, ch) => { if (x >= 0 && x < COLS && y >= 0 && y < ROWS) m[y][x] = ch; };
  const ground = (x0, x1) => { for (let x = x0; x <= x1; x++) for (let y = FLOOR; y < ROWS; y++) put(x, y, '#'); };
  const coins = (x0, x1, y) => { for (let x = x0; x <= x1; x++) put(x, y, 'o'); };
  ground(0, 9); put(3, FLOOR - 1, 'P'); put(6, FLOOR - 1, 'S'); signs['6,' + (FLOOR - 1)] = 'Have fun! Bonk the baddies!';
  let x = 10, sinceCp = 0, usedKey = false, usedWarp = false, last = '';
  const end = 120 + ri(0, 34);
  const KINDS = ['gap', 'stairs', 'ledges', 'walker', 'mover', 'spring', 'ice', 'belt', 'fall', 'key', 'coins', 'gloop', 'flyer',
                 'spikes', 'warp', 'power', 'hopper', 'lift'];
  while (x < end) {
    let k = KINDS[ri(0, KINDS.length - 1)];
    if (k === last || (k === 'key' && usedKey) || (k === 'warp' && usedWarp)) k = 'coins';
    last = k;
    if (sinceCp > 34) { put(x - 1, FLOOR - 1, 'C'); sinceCp = 0; }
    const x0 = x;
    if (k === 'gap') { const g = ri(2, 3); coins(x, x + g - 1, FLOOR - 4); ground(x + g, x + g + 3); x += g + 4; }
    else if (k === 'stairs') {
      ground(x, x + 7);
      [1, 2, 3, 2, 1].forEach((h, i) => { for (let j = 1; j <= h; j++) put(x + 1 + i, FLOOR - j, '='); put(x + 1 + i, FLOOR - h - 1, 'o'); });
      x += 8;
    } else if (k === 'ledges') {
      ground(x, x + 9); for (let i = 2; i <= 4; i++) put(x + i, FLOOR - 3, '-');
      for (let i = 5; i <= 7; i++) { put(x + i, FLOOR - 6, '-'); put(x + i, FLOOR - 7, 'o'); }
      put(x + 6, FLOOR - 8, '*'); x += 10;
    } else if (k === 'walker' || k === 'gloop' || k === 'hopper') {
      ground(x, x + 9); put(x + 6, FLOOR - 1, { walker: 'E', gloop: 'G', hopper: 'h' }[k]); coins(x + 2, x + 4, FLOOR - 3); x += 10;
    } else if (k === 'flyer') { ground(x, x + 9); put(x + 5, FLOOR - 4, 'y'); coins(x + 1, x + 8, FLOOR - 1); x += 10; }
    else if (k === 'mover') {   // a wide hole with a moving platform to ride
      put(x + 1, FLOOR - 2, 'm'); put(x + 2, FLOOR - 2, 'm'); coins(x + 3, x + 5, FLOOR - 4);
      x += 7; ground(x, x + 3); x += 4;
    } else if (k === 'lift') {  // an up-down platform to a high ledge with a gem
      ground(x, x + 9); put(x + 2, FLOOR - 1, 'V'); put(x + 3, FLOOR - 1, 'V');
      for (let i = 5; i <= 8; i++) put(x + i, FLOOR - 7, '-'); put(x + 7, FLOOR - 8, '*'); x += 10;
    } else if (k === 'spring') {

}

// ---------- Main update ----------
function update() {
  frame++;
  if (pressT > 0) pressT--;
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.confetti ? 0.05 : 0.2; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  syncPad();
  if (state === 'edit') { updateEdit(); return; }
  if (state === 'title' || state === 'levels' || state === 'worlds' || state === 'wmap') { jumpPressed = false; return; }
  if (pop) { jumpPressed = false; return; }
  if (state === 'dying') {
    timer++;
    if (timer > 50) { Object.assign(player, { x: respawn.x, y: respawn.y, vx: 0, vy: 0, inv: 90, plat: null, hover: 70 }); shots = []; state = 'play'; }
  } else if (state === 'won') {
    timer++;
    if (timer % 90 === 0) confetti();
    if (timer > 60 && jumpPressed) { jumpPressed = false; wonNext(); return; }
    jumpPressed = false;
  } else if (state === 'play') updatePlay();
  if (!player) return;
  const minX = bossState === 'fight' ? arenaStart * T : 0;
  camX += (clamp(player.x + player.w / 2 - W / 2, minX, Math.max(minX, cols * T - W)) - camX) * 0.12;
  if (shake > 0) shake--;
}

function drawHero(p, idx) {

function drawPlay() {

function drawParticles() {

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  drawScene();
  requestAnimationFrame(loop);
}
