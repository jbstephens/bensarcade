// 🎬 MUSIC VIDEOS: a music video for the songs of Ben's games. Ben asked for "Hyper Factory, Robo Jump, and a lot more music videos"!
// Pick a video, and the characters dance to the song from their game. Every video is drawn with shapes (no pictures).
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 540;
let frame = 0;

// ---------- Little drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const frac = x => x - Math.floor(x);
const hash = (a, b = 0) => { const s = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return s - Math.floor(s); };
const RB = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#00b0ff', '#d500f9'];
const rb = i => RB[((Math.floor(i) % 6) + 6) % 6];
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2)));
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function dot(x, y, r, c) { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); ctx.fill(); }
function ell(x, y, rx, ry, c, rot = 0) { ctx.fillStyle = c; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); ctx.fill(); }
function line(x1, y1, x2, y2, c, w) { ctx.strokeStyle = c; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function poly(pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < pts.length; i += 2) ctx[i ? 'lineTo' : 'moveTo'](pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }
function text(s, x, y, size, color = '#fff', align = 'center', outline = '#2a0845') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Arial Rounded MT Bold", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function emoji(s, x, y, size) {
  ctx.font = `${Math.max(1, size)}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(s, x, y);
}
function starPath(x, y, r1, r2, n = 5, rot = -Math.PI / 2) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) { const r = i % 2 ? r2 : r1, a = rot + i * Math.PI / n; ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * r, y + Math.sin(a) * r); }
  ctx.closePath();
}
function star(x, y, r, c, rot) { starPath(x, y, r, r * 0.45, 5, rot); ctx.fillStyle = c; ctx.fill(); }
function sky(c1, c2, h = H) { const g = ctx.createLinearGradient(0, 0, 0, h); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(0, 0, W, h); }
function heart(x, y, s, c) {
  ctx.fillStyle = c; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.4, y - s * 0.1, x - s * 0.6, y - s * 1.1, x, y - s * 0.35);
  ctx.bezierCurveTo(x + s * 0.6, y - s * 1.1, x + s * 1.4, y - s * 0.1, x, y + s * 0.9); ctx.fill();
}
function stars(I, n, seed = 1, maxY = 380) {   // twinkly stars that flash on the beat
  for (let i = 0; i < n; i++) {
    const x = hash(i, seed) * W, y = hash(i, seed + 7) * maxY, r = 0.8 + hash(i, seed + 3) * 1.8;
    ctx.globalAlpha = clamp(0.35 + 0.4 * Math.abs(Math.sin(I.t * 2 + i)) + 0.4 * I.pulse * (i % 3 === 0), 0, 1);
    dot(x, y, r * (1 + 0.5 * I.pulse * (i % 3 === 0)), '#fff');
  }
  ctx.globalAlpha = 1;
}

// ---------- Sound (WebAudio, only starts after a tap) ----------
let actx = null, master = null;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { actx = null; } }
  if (actx && actx.state === 'suspended') { try { actx.resume(); } catch (_) {} }
  return actx;
}
function out() {   // everything plays through one volume knob, so stopping a video goes quiet right away
  const a = audio(); if (!a) return null;
  if (!master) { master = a.createGain(); master.gain.value = 1; master.connect(a.destination); }
  return master;
}
function hush() { voiceStop(); if (master) { try { master.disconnect(); } catch (_) {} master = null; } }
// one note, exactly like the book's Jukebox plays it (jbNote in arcade.html)
function jbNote(m, at, dur, wave, vol) {
  const a = audio(), o2 = out(); if (!a || !o2 || !m) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = wave; o.frequency.value = 440 * Math.pow(2, (m - 69) / 12);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(o2); o.start(at); o.stop(at + dur + 0.05);
}
let noiseBuf = null;
function noise(at, dur, vol, hi) {   // a "tss" for hi-hats and a "pshh" for claps
  const a = audio(), o2 = out(); if (!a || !o2) return;
  if (!noiseBuf) { noiseBuf = a.createBuffer(1, Math.floor(a.sampleRate * 0.3), a.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
  s.buffer = noiseBuf; f.type = hi ? 'highpass' : 'bandpass'; f.frequency.value = hi ? 7000 : 1800;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  s.connect(f); f.connect(g); g.connect(o2); s.start(at); s.stop(at + dur + 0.02);
}
function kick(at, vol = 0.32) {
  const a = audio(), o2 = out(); if (!a || !o2) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(150, at); o.frequency.exponentialRampToValueAtTime(42, at + 0.14);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + 0.2);
  o.connect(g); g.connect(o2); o.start(at); o.stop(at + 0.25);
}

// 🎉 Beat Party: the band plays "Robo Groove" (written the same way as in beatparty.html: "C5:0.5 E5 ..." = note:beats)
const noteNum = n => { const m = /^([A-G])(\d)$/.exec(n); return 12 * (+m[2] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]]; };
const parseMel = str => str.trim().split(/\s+/).map(t => { const [n, l] = t.split(':'); return [n === '-' ? 0 : noteNum(n), l ? +l : 1]; });
function halfStepMel(str) {   // turn [note, beats] into one slot per half-beat (0 = keep holding / rest), like the Jukebox does
  const out = []; for (const [m, len] of parseMel(str)) { out.push(m); for (let i = 1; i < Math.round(len * 2); i++) out.push(0); } return out;
}

// ---------- 🎤 SONGS WITH WORDS (the 7 new videos) ----------
// A song is a list of parts (intro, verse, chorus...). Each part has chords (one per bar, "a/b" = two in one bar),
// a melody written in 8th notes (8 per bar) and the words. Notes are scale steps like Robo Jump 9 writes them
// ("5'" = step 5 one octave up, "#7" = raised 7, "." = rest, "-" = keep holding), or real notes ("C5", "F#4").
// Words: one syllable per melody note ("Ro-bo" = two notes), "~" = a note with no word, "/" = start a new karaoke line.
const SCALES2 = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], mixo: [0, 2, 4, 5, 7, 9, 10] };
const PC2 = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
function tok2midi(tk, base, sc) {
  let m = /^([A-G])([#b]?)(\d)$/.exec(tk);
  if (m) return 12 * (+m[3] + 1) + PC2[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0);
  m = /^([b#]?)([1-7])([',]*)$/.exec(tk); if (!m) throw new Error('bad note ' + tk);
  const oct = (m[3].match(/'/g) || []).length - (m[3].match(/,/g) || []).length;
  return base + sc[+m[2] - 1] + (m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0) + 12 * oct;
}
function chord2(tk, base, sc) {   // "Am", "F#", "G7", "Bbmaj7", "Dsus4"  or scale steps like Robo Jump 9: "6", "5M", "b7", "47"
  let root, ivs;
  const m = /^([A-G])([#b]?)(.*)$/.exec(tk);
  if (m) {
    root = PC2[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); const q = m[3];
    ivs = q.startsWith('dim') ? [0, 3, 6] : q.startsWith('sus4') ? [0, 5, 7] : q.startsWith('sus2') ? [0, 2, 7] : q.startsWith('aug') ? [0, 4, 8] : q.startsWith('m') && !q.startsWith('maj') ? [0, 3, 7] : [0, 4, 7];
    if (q.includes('maj7')) ivs.push(11); else if (q.includes('7')) ivs.push(10); else if (q.includes('6')) ivs.push(9);
  } else {
    const d = /^(b?)([1-7])(.*)$/.exec(tk); if (!d) throw new Error('bad chord ' + tk);
    const r = +d[2], q = d[3], st = k => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
    root = (base + sc[r - 1] - (d[1] ? 1 : 0)) % 12;
    let third = d[1] ? 4 : st(r + 2) - st(r); if (q.includes('M')) third = 4; if (q.includes('m')) third = 3;
    ivs = [0, third, 7]; if (q.includes('7')) ivs.push(d[1] ? 10 : st(r + 6) - st(r));
  }
  const r0 = 48 + ((root % 12) + 12) % 12;   // root between C3 and B3
  return { name: tk, root: r0, pcs: ivs.map(i => (r0 + i) % 12), tones: ivs.map(i => r0 + i) };
}
function song2(def) {
  const sc = SCALES2[def.scale || 'major'], mel = [], dur = [], chAt = [], secAt = [], sylAt = [], lines = [], parts = [];
  let line = null;
  def.parts.forEach((P, pi) => {
    const tr = P.tr || 0, base = (P.base || def.base) + tr, start = mel.length;
    const bars = P.ch.trim().split(/\s+/);
    const toks = P.m ? P.m.replace(/\|/g, ' ').trim().split(/\s+/) : new Array(bars.length * 8).fill('.');
    if (toks.length !== bars.length * 8) throw new Error(def.name + ' / ' + P.n + ': ' + toks.length + ' notes for ' + bars.length + ' bars');
    bars.forEach((b, bi) => { const cs = b.split('/'); for (let j = 0; j < 8; j++) chAt.push(chord2(cs[Math.floor(j * cs.length / 8)], base, sc)); });
    let last = -1;
    toks.forEach(tk => {
      if (tk === '-') { mel.push(0); if (last >= 0) dur[last]++; dur.push(0); }
      else if (tk === '.') { mel.push(0); dur.push(0); last = -1; }
      else { last = mel.length; mel.push(tok2midi(tk, base, sc) + (P.oct || 0) * 12); dur.push(1); }
      secAt.push(Object.assign({ i: pi, from: start }, P)); sylAt.push(null);
    });
    parts.push({ n: P.n, from: start, to: mel.length });
    if (P.w != null) {   // match each syllable to the next note
      const ons = []; for (let k = start; k < mel.length; k++) if (mel[k]) ons.push(k);
      const words = P.w.replace(/\//g, ' / ').trim().split(/\s+/);
      let oi = 0, newLine = true;
      for (const wd of words) {
        if (wd === '/') { newLine = true; continue; }
        for (const s0 of wd.split('-').map((q, i, a) => i < a.length - 1 ? q + '-' : q).filter(Boolean)) {
          if (oi >= ons.length) throw new Error(def.name + ' / ' + P.n + ': too many words at "' + wd + '"');
          const k = ons[oi++]; if (s0 === '~') continue;
          if (newLine || !line) { line = { syls: [], part: pi }; lines.push(line); newLine = false; }
          const s = { k, s: s0.replace(/-$/, ''), join: s0.endsWith('-'), m: mel[k] };
          line.syls.push(s); sylAt[k] = s;
        }
      }
      if (oi !== ons.length) throw new Error(def.name + ' / ' + P.n + ': ' + (ons.length - oi) + ' notes have no words (use ~)');
      line = null;
    }
  });
  for (let i = 0; i + 1 < lines.length; i++) {   // short lines (one bar) get joined up in pairs, so each karaoke line is about 2 bars
    const a = lines[i], b = lines[i + 1];
    if (a.part === b.part && b.syls[b.syls.length - 1].k - a.syls[0].k < 16 && !a.joined) { a.syls = a.syls.concat(b.syls); a.joined = 1; lines.splice(i + 1, 1); }
  }
  const st = 60 / def.bpm / 2;

    { mel, dur, chAt, secAt, sylAt, lines, lineAt, lineStart, parts, burpAt, burps, avgNote });
}

  const n = VIDEOS.filter(v => watched[v.id]).length;
  text('🍿 ' + n + '/' + VIDEOS.length, 862, 497, 26, n === VIDEOS.length ? '#ffd740' : '#fff');
  text('Tap a video to play it!', 480, 454, 15, '#e1bee7', 'center', null);
}
function drawPlayer() {
  const v = VIDEOS[P.vi];
  const t = P.done ? INTRO + v.musicDur + 1 + (clockNow() - P.doneAt) % 3 : vidT();
  drawVideo(v, t);
  ctx.globalAlpha = 0.55; rr(6, 468, 948, 68, 18, '#0a0014'); ctx.globalAlpha = 1;
  const p = clamp(vidT() / v.total, 0, 1);   // how far along the video is
  rr(292, 494, 300, 16, 8, 'rgba(255,255,255,.25)'); rr(292, 494, Math.max(16, 300 * p), 16, 8, rb(t * 2));
  text(v.icon + ' ' + v.name, 442, 482, 14, '#fff', 'center', null);
  playerButtons().forEach(b => drawButton(b, false));
  if (!P.playing && !P.done) { ctx.globalAlpha = 0.5; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, 466); ctx.globalAlpha = 1; text('⏸ PAUSED — tap ▶ to keep watching', 480, 250, 36, '#fff'); }
}
function drawToast() {
  if (!toast || clockNow() > toast.until) return;
  rr(180, 200, 600, 80, 24, '#ffd740', '#1b1b2f', 4); text(toast.msg, 480, 242, 26, '#1b1b2f', 'center', null);
}
function render() {
  if (mode === 'picker') drawPicker(clockNow()); else drawPlayer();
  drawToast();
}
function loop() { try { render(); } catch (e) { console.error(e); } requestAnimationFrame(loop); }

// ---------- Tapping + keys ----------
const inBox = (b, x, y) => x >= b.x - 6 && x <= b.x + b.w + 6 && y >= b.y - 6 && y <= b.y + b.h + 6;
function tapAt(x, y) {
  audio();
  if (mode === 'picker') {
    for (let i = 0; i < VIDEOS.length; i++) if (inBox(CARD(i), x, y)) { sel = i; startVideo(i); return; }
    PICK_TOGGLES().forEach((b, i) => { if (inBox(b, x, y)) { sel = VIDEOS.length + i; b.act(); } });
    return;
  }
  const b = playerButtons().reverse().find(q => inBox(q, x, y));
  if (b) b.act(); else if (y < 466 && !P.done) togglePlay();   // tap the video to pause / play
}
C.addEventListener('mousedown', e => {
  const r = C.getBoundingClientRect();
  tapAt((e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height);
});
function keyPress(k) {
  audio();
  if (mode === 'picker') {
    const nT = PICK_TOGGLES().length, nV = VIDEOS.length;
    if (k === 'ArrowRight') sel = sel < nV ? (sel % COLS === COLS - 1 || sel === nV - 1 ? sel : sel + 1) : Math.min(nV + nT - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = sel < nV ? (sel % COLS === 0 ? sel : sel - 1) : Math.max(nV, sel - 1);
    else if (k === 'ArrowDown') sel = sel < nV ? (sel + COLS < nV ? sel + COLS : nV + Math.min(nT - 1, Math.floor((sel % COLS) * nT / COLS))) : sel;
    else if (k === 'ArrowUp') sel = sel < nV ? (sel - COLS >= 0 ? sel - COLS : sel) : Math.min(nV - 1, Math.floor((nV - 1) / COLS) * COLS + Math.round((sel - nV) * (COLS - 1) / Math.max(1, nT - 1)));
    else if (k === ' ' || k === 'Enter') { if (sel < nV) startVideo(sel); else PICK_TOGGLES()[sel - nV].act(); }
    else if (k === 'k' || k === 'K') opts.karaoke = !opts.karaoke;
    else if (k === 'd' || k === 'D') opts.dance = !opts.dance;
    else if (k === 'l' || k === 'L') opts.loop = !opts.loop;
    else return false;
    return true;
  }
  if (k === 'Escape' || k === 'Backspace') backToPicker();
  else if (k === ' ' || k === 'Enter') togglePlay();
  else if (k === 'ArrowRight') startVideo(P.vi + 1);
  else if (k === 'ArrowLeft') startVideo(P.vi - 1);
  else if (k === 'k' || k === 'K' || k === 'ArrowUp') opts.karaoke = !opts.karaoke;
  else if (k === 'd' || k === 'D' || k === 'ArrowDown') opts.dance = !opts.dance;
  else if (k === 'l' || k === 'L') opts.loop = !opts.loop;
  else return false;
  return true;
}
addEventListener('keydown', e => { if (e.repeat) return; if (keyPress(e.key)) e.preventDefault(); });
requestAnimationFrame(loop);
</script>
