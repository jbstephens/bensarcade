    let dx = (right() ? 1 : 0) - (left() ? 1 : 0), dy = (down() ? 1 : 0) - (up() ? 1 : 0);
    if (mouse.down) { const mx = mouse.x - PR.hx, my = mouse.y - PR.hy; if (Math.hypot(mx, my) > 20) { dx = mx; dy = my; } }
    if (dx || dy) { const d = Math.hypot(dx, dy); if (dx) PR.face = Math.sign(dx); const o = { x: PR.hx, y: PR.hy }; prMove(o, dx / d * 220 * dt, dy / d * 220 * dt, 16); PR.hx = o.x; PR.hy = o.y;
      const last = PR.trail[0]; if (!last || dist(last.x, last.y, PR.hx, PR.hy) > 4) { PR.trail.unshift({ x: PR.hx, y: PR.hy }); PR.trail.length = Math.min(PR.trail.length, 400); } }
    let k = 0;
    for (const p of PR.pets) {
      if (p.st === 'lost') {
        p.wt -= dt; if (p.wt <= 0) { p.wt = 1 + Math.random() * 2; const a = Math.random() * 6.28, run = p.run > 0; p.vx = Math.cos(a) * (run ? 0 : 30); p.vy = Math.sin(a) * (run ? 0 : 30); if (dist(p.x, p.y, p.hx, p.hy) > 70) { const b = Math.atan2(p.hy - p.y, p.hx - p.x); p.vx = Math.cos(b) * 30; p.vy = Math.sin(b) * 30; } }
        if (p.run > 0) { p.run -= dt; prMove(p, p.rx * dt, p.ry * dt, 12); } else prMove(p, p.vx * dt, p.vy * dt, 12);
        if (p.run <= 0 && dist(p.x, p.y, PR.hx, PR.hy) < 36) { p.st = 'follow'; sfx('collect'); pop(p.x, p.y - 30, 'Follow me! 💕', '#fff'); }
      } else if (p.st === 'follow') {
        k++; const tp = PR.trail[Math.min(PR.trail.length - 1, k * 9)] || { x: PR.hx, y: PR.hy };
        p.x += (tp.x - p.x) * Math.min(1, dt * 8); p.y += (tp.y - p.y) * Math.min(1, dt * 8);
      } else { p.x += (p.px - p.x) * Math.min(1, dt * 4); p.y += (p.py - p.y) * Math.min(1, dt * 4); }
    }
    if (dist(PR.hx, PR.hy, PR.home.x, PR.home.y) < PR.home.r + 10) for (const p of PR.pets) if (p.st === 'follow') {
      p.st = 'home'; PR.saved = (PR.saved || 0) + 1; const i = PR.pets.filter(q => q.st === 'home').length - 1;
      p.px = PR.home.x - 30 + (i % 3) * 30; p.py = PR.home.y - 26 + Math.floor(i / 3) * 26 + 10; addScore(50, PR.home.x, PR.home.y - 60); burst(PR.home.x, PR.home.y, '#ff80ab', 14); sfx('level');
    }
    if (PR.pets.every(p => p.st === 'home')) {
      if (G.level >= LEVELS(1)) { winGame(); return; }
      PR.freeze = 2.2; say('All the pets are safe! 🎉', 2.2); return;
    }
    for (const f of PR.foes) {
      const d = dist(f.x, f.y, PR.hx, PR.hy), r = f.big ? 30 : 18;
      if (d < (f.big ? 320 : 190)) f.a = Math.atan2(PR.hy - f.y, PR.hx - f.x); else if (Math.random() < dt) f.a += (Math.random() - 0.5) * 2;
      const o = { x: f.x, y: f.y }; prMove(o, Math.cos(f.a) * f.sp * dt, Math.sin(f.a) * f.sp * dt, r); if (o.x === f.x && o.y === f.y) f.a += 1.5; f.x = o.x; f.y = o.y;
      if (dist(f.x, f.y, PR.home.x, PR.home.y) < PR.home.r + r) f.a += Math.PI;
      if (G.inv <= 0 && d < r + 16) {
        if (hurt(PR.hx, PR.hy)) return;
        let scared = 0; for (const p of PR.pets) if (p.st === 'follow') { p.st = 'lost'; scared++; const a = Math.random() * 6.28; p.run = 1; p.rx = Math.cos(a) * 160; p.ry = Math.sin(a) * 160; }
        say(scared ? 'Eek! The pets ran off! Go find them!' : 'Ouch!', 1.6);
      }
    }
    for (const it of PR.items) if (!it.got && dist(it.x, it.y, PR.hx, PR.hy) < 30) { it.got = true; G.items++; addScore(10, it.x, it.y); burst(it.x, it.y, '#ffeb3b', 8); sfx('collect'); }
  },
  draw(t) {
    drawField(t); const h = PR.home;
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, 7); ctx.fill(); ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 5; ctx.setLineDash([8, 6]); ctx.stroke(); ctx.setLineDash([]);
    drawEmoji('🏠', h.x, h.y - 30, 52);
    for (const tr of PR.trees) drawEmoji(RC_PROPS[C.bg], tr.x, tr.y - 8, 54);
    for (const it of PR.items) if (!it.got) drawEmoji(C.item, it.x, it.y, 28, { bob: Math.sin(t * 4 + it.x) * 3 });
    for (const p of PR.pets) { drawEmoji(p.e, p.x, p.y, 32, { bob: -Math.abs(Math.sin(t * 8 + p.hx)) * (p.st === 'lost' ? 2 : 4) }); if (p.st === 'lost' && p.run <= 0 && Math.sin(t * 3 + p.hx) > 0.6) drawEmoji('❓', p.x + 14, p.y - 26, 18); }
    for (const f of PR.foes) drawEmoji(C.enemy, f.x, f.y, f.big ? 70 : 40, { flip: Math.cos(f.a) > 0, bob: Math.sin(t * 6 + f.x) * 3 });
    if (!blinkOff(G.inv)) drawEmoji(C.hero, PR.hx, PR.hy, 44, { flip: PR.face < 0, bob: -Math.abs(Math.sin(t * 10)) * 3 });
    drawParts();
  },
  hud() { return '🐾 ' + PR.pets.filter(p => p.st === 'home').length + '/' + PR.pets.length; },
};
const PS3 = 1 / 40;
MODES.pet.r3 = {
  w: (x, y) => [(x - W / 2) * PS3, 1, (y - H / 2) * PS3],
  build() {
    r3Ground(200, 200, GROUND3[C.bg], 0, 0, -0.02); const r = makeRng(SEED ^ 5);
    for (const tr of PR.trees) { const w = this.w(tr.x, tr.y); r3Prop(w[0], w[2], r).scale.setScalar(0.55); }
    const hw = this.w(PR.home.x, PR.home.y);
    R3.root.add(r3Box(1.4, 1.1, 1.2, '#ffcc80', hw[0], 0.55, hw[2] - 0.7)); const roof = r3Mesh(R3.cone, '#e53935', 2.1, 0.9, 2.1, hw[0], 1.55, hw[2] - 0.7); roof.rotation.y = Math.PI / 4; R3.root.add(roof);
    for (let i = 0; i < 18; i++) { const a = i / 18 * 6.283; if (Math.cos(a) > 0.85) continue; R3.root.add(r3Box(0.15, 0.6, 0.15, '#8d6e63', hw[0] + Math.cos(a) * PR.home.r * PS3, 0.3, hw[2] + Math.sin(a) * PR.home.r * PS3)); }
    r3PropsAround(-W / 2 * PS3, W / 2 * PS3, -H / 2 * PS3, H / 2 * PS3, 30, 3);
  },
  sync(t) {
    for (const it of PR.items) if (!it.got) SPR(it, C.item, 0.8).position.set(...this.w(it.x, it.y));
    for (const p of PR.pets) { const m = SPR(p, p.e, 0.95), w = this.w(p.x, p.y); m.position.set(w[0], 0.5 + Math.abs(Math.sin(t * 8 + p.hx)) * 0.08, w[2]); }
    for (const f of PR.foes) { const s = f.big ? 2 : 1.1, m = SPR(f, C.enemy, s), w = this.w(f.x, f.y); m.position.set(w[0], s / 2, w[2]); m.scale.x = (Math.cos(f.a) > 0 ? -1 : 1) * s; }
    const m = blink3(SPR(PR, C.hero, 1.25), G.inv), w = this.w(PR.hx, PR.hy); m.position.set(w[0], 0.62 + Math.abs(Math.sin(t * 10)) * 0.06, w[2]); m.scale.x = (PR.face < 0 ? -1 : 1) * 1.25;
  },
  cam() { const w = this.w(PR.hx, PR.hy); r3CamTo(w[0] * 0.7, 9, w[2] + 8, w[0] * 0.8, 0, w[2] - 1.5, 0.1); },
};

// ================= screens, HUD and the main loop =================
function drawHud() {
  const M = MODES[C.type];
  if (M.hudLeft) M.hudLeft();
  else if (G.hearts > 6) { panel(10, 8, 150, 48, 14); drawEmoji('❤️', 38, 32, 30); txt('x ' + G.hearts, 96, 33, 28, '#fff'); }
  else {
    panel(10, 8, 40 * Math.max(3, G.hearts) + 16, 48, 14);
    for (let i = 0; i < Math.max(3, G.hearts); i++) drawEmoji(i < G.hearts ? '❤️' : '🤍', 34 + i * 40, 32, 30);
  }
  const itemsTxt = G.items + (G.goal ? ' / ' + G.goal : '');
  panel(W / 2 - 110, 8, 220, 48, 14);
  drawEmoji(C.item, W / 2 - 70, 32, 30); txt(itemsTxt, W / 2 + 14, 33, 28, '#fff');
  panel(W - 230, 8, 220, 48, 14); txt('⭐ ' + G.score, W - 120, 33, 28, '#ffeb3b');
  const extra = MODES[C.type].hud();
  if (extra) txt(extra, W / 2 + 210, 33, 22, C.color, 'left');
  if (G.msgT > 0) { ctx.globalAlpha = clamp(G.msgT * 2, 0, 1); txt(G.msg, W / 2, 150, 46, '#fff', 'center', 900); ctx.globalAlpha = 1; }
}
function drawTitle(t) {
  drawBg(t * 30, t);
  panel(60, 30, W - 120, H - 60, 30);
  drawEmoji(C.icon, 120, 90, 50, { rot: Math.sin(t * 2) * 0.2 });
  drawEmoji(C.icon, W - 120, 90, 50, { rot: -Math.sin(t * 2) * 0.2 });
  txt(C.title, W / 2, 95, 72, C.color, 'center', 660);
  txt('A game made by ' + C.by, W / 2, 158, 28, '#fff', 'center', 800);
  const b = Math.abs(Math.sin(t * 3)) * 30;
  drawEmoji(C.item, W / 2 - 190, 262 + Math.sin(t * 4) * 8, 54);
  drawEmoji(C.hero, W / 2, 270 - b, 110, { sy: b < 4 ? 0.88 : 1 });
  drawEmoji(C.enemy, W / 2 + 190, 262 + Math.cos(t * 4) * 8, 60, { flip: Math.sin(t) > 0 });
  txt(TYPE_NAMES[C.type] + (C.dim === '3d' ? '  •  3D 🧊' : ''), W / 2, 352, 24, '#ffeb3b');
  const help = (R3.on && MODES[C.type].help3) || MODES[C.type].help;
  txt(help[0], W / 2, 388, 24, '#fff', 'center', 820);
  txt(help[1], W / 2, 422, 24, '#fff', 'center', 820);
  ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5);
  txt(R3.on && !R3.ready ? 'Getting the 3D world ready...' : 'Press SPACE or tap to play!', W / 2, 466, 34, C.color, 'center', 800);
  if (R3.failed && C.dim === '3d') txt('(3D needs the internet, so this time it\'s 2D!)', W / 2, 500, 16, '#fff');
  ctx.globalAlpha = 1;
  txt('M = music on/off', W - 90, H - 16, 14, 'rgba(255,255,255,.7)');
}
function drawEnd(t, won) {
  if (R3.on && R3.ready) r3Frame(G.time); else MODES[C.type].draw(G.time);
  ctx.fillStyle = won ? 'rgba(0,0,0,.35)' : 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
  if (won) for (const c of G.confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.r); ctx.fillStyle = c.c; ctx.fillRect(-6, -3, 12, 6); ctx.restore(); }
  panel(W / 2 - 400, 60, 800, 400, 30);
  if (won) {
    txt(C.title + ' — YOU WIN! 🏆', W / 2, 120, 54, C.color, 'center', 760);
    const b = Math.abs(Math.sin(t * 5)) * 30;
    drawEmoji(C.hero, W / 2, 250 - b, 120, { rot: Math.sin(t * 5) * 0.15 });
    drawEmoji('🏆', W / 2 - 200, 250, 80); drawEmoji('🎉', W / 2 + 200, 250, 80);
  } else {
    txt(C.type === 'laser' ? 'The other team won! Try again!' : 'Oh no!  Try again!', W / 2, 120, 60, '#ff8a80', 'center', 760);
    drawEmoji(C.hero, W / 2 - 80, 255, 100, { rot: -0.3 });
    drawEmoji(C.enemy, W / 2 + 90, 245 + Math.sin(t * 6) * 6, 80);
  }
  txt(C.type === 'laser' ? 'Your team ' + LT.score[0] + '  -  ' + LT.score[1] + '     ⭐ ' + G.score : C.type === 'race' && won ? 'You came ' + ORD(G.place || 1) + '!   Score: ' + G.score : 'Score: ' + G.score + '     ' + C.item + ' ' + G.items, W / 2, 350, 34, '#ffeb3b', 'center', 760);
  if (G.t > 0.8) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5); txt(won ? 'Press SPACE or tap to play again!' : 'Press SPACE or tap to try again!', W / 2, 420, 34, '#fff', 'center', 760); ctx.globalAlpha = 1; }
}
function drawMissing(t) {
  drawBg(t * 20, t);
  panel(W / 2 - 380, 90, 760, 340, 30);
  drawEmoji('🤔', W / 2, 190 + Math.sin(t * 3) * 8, 110);
  txt('Oops! This game is missing.', W / 2, 300, 48, '#fff', 'center', 700);
  txt('Go back to the Game Maker!', W / 2, 370, 40, '#ffeb3b', 'center', 700);
}
function update(dt) {
  G.time += dt; G.t += dt;
  if (G.state === 'title') { if (anyGo() && !(R3.on && !R3.ready)) newGame(); }
  else if (G.state === 'play') {
    if (hit.Escape) setState('title');
    else { MODES[C.type].update(dt); G.inv -= dt; G.msgT -= dt; updParts(dt); }
  } else if (G.state === 'win' || G.state === 'lose') {
    updParts(dt);
    for (const c of G.confetti) { c.y += c.vy * dt; c.x += c.vx * dt + Math.sin(G.time * 3 + c.r) * 0.5; c.r += c.vr * dt; if (c.y > H + 10) { c.y = -10; c.x = rand(0, W); } }
    if (G.t > 0.8 && anyGo()) newGame();
    else if (hit.Escape) setState('title');
  }
  for (const k in hit) hit[k] = false;
}
function draw() {
  const t = G.time;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (G.state === 'missing') drawMissing(t);
  else if (G.state === 'title') drawTitle(t);
  else if (G.state === 'play') { if (R3.on && R3.ready) r3Frame(t); else MODES[C.type].draw(t); drawHud(); }
  else drawEnd(t, G.state === 'win');
}
let lastT = null, acc = 0;
function frame(ts) {
  if (lastT === null) lastT = ts;
  acc += Math.min(0.25, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  if (G.state !== 'missing') musicTick();
  draw(); G.frames++;
  requestAnimationFrame(frame);
}
function boot() {
  document.title = MISSING ? 'Game missing' : C.title;
  fit();
  r3Load();
  requestAnimationFrame(frame);
}
boot();
</script>
