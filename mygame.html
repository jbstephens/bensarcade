// ================= 4. MAZE CHASE =================
const MZ = { cols: 23, rows: 11, cell: 40, ox: 20, oy: 74, grid: null, items: [], foes: [], hero: null, exit: null, start: null, open: false };
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
function mzWall(c, r) { return c < 0 || r < 0 || c >= MZ.cols || r >= MZ.rows || MZ.grid[r][c] === 1; }
function mzBuild() {
  const r = makeRng(SEED + (G.level - 1) * 7777), { cols, rows } = MZ;
  const g = []; for (let y = 0; y < rows; y++) { g.push([]); for (let x = 0; x < cols; x++) g[y].push(1); }
  const stack = [[1, 1]]; g[1][1] = 0;
  while (stack.length) {   // carve a maze (every spot can be reached)
    const [cx, cy] = stack[stack.length - 1];
    const opts = DIRS.filter(([dx, dy]) => { const nx = cx + dx * 2, ny = cy + dy * 2; return nx > 0 && ny > 0 && nx < cols - 1 && ny < rows - 1 && g[ny][nx] === 1; });
    if (!opts.length) { stack.pop(); continue; }
    const [dx, dy] = opts[Math.floor(r() * opts.length)];
    g[cy + dy][cx + dx] = 0; g[cy + dy * 2][cx + dx * 2] = 0; stack.push([cx + dx * 2, cy + dy * 2]);
  }
  for (let y = 1; y < rows - 1; y++) for (let x = 1; x < cols - 1; x++) {   // knock out extra walls so there are loops to escape through
    if (g[y][x] !== 1) continue;
    const h = g[y][x - 1] === 0 && g[y][x + 1] === 0 && g[y - 1][x] === 1 && g[y + 1][x] === 1;
    const v = g[y - 1][x] === 0 && g[y + 1][x] === 0 && g[y][x - 1] === 1 && g[y][x + 1] === 1;
    if ((h || v) && r() < 0.22) g[y][x] = 0;
  }
  for (let y = 1; y < rows - 1; y += 2) for (let x = 1; x < cols - 1; x += 2) {   // open up most dead ends so you can't get trapped

    drawEmoji(C.enemy, W / 2 + 90, 245 + Math.sin(t * 6) * 6, 80);
  }
  txt(C.type === 'laser' ? 'Your team ' + LT.score[0] + '  -  ' + LT.score[1] + '     ⭐ ' + G.score : C.type === 'race' && won ? 'You came ' + ORD(G.place || 1) + '!   Score: ' + G.score : 'Score: ' + G.score + '     ' + C.item + ' ' + G.items, W / 2, 350, 34, '#ffeb3b', 'center', 760);
  if (HSC.pending) { hsDraw(t); return; }
  if (HSC.saved) txt('🕹️ Your score is on the Arcade Cabinet!', W / 2, 386, 22, '#b9f6ca', 'center', 760);
  if (G.t > 0.8) { ctx.globalAlpha = 0.6 + 0.4 * Math.sin(t * 5); txt(won ? 'Press SPACE or tap to play again!' : 'Press SPACE or tap to try again!', W / 2, 420, 34, '#fff', 'center', 760); ctx.globalAlpha = 1; }
}
function drawMissing(t) {
  drawBg(t * 20, t);
  panel(W / 2 - 380, 90, 760, 340, 30);
  drawEmoji('🤔', W / 2, 190 + Math.sin(t * 3) * 8, 110);
  txt('Oops! This game is missing.', W / 2, 300, 48, '#fff', 'center', 700);
  txt('Go back to the Game Maker!', W / 2, 370, 40, '#ffeb3b', 'center', 700);
}
function update(dt) {
  G.time += dt; G.t += dt;
  if (voicePend && G.time >= voicePend.at) { heroSays(voicePend.k); voicePend = null; }
  if (G.state === 'title') { if (anyGo() && !(R3.on && !R3.ready)) { if (C.story.a.length && !STY.seenA) { STY.seenA = true; storyStart('a', newGame); } else newGame(); } }
  else if (G.state === 'story') storyUpdate();
  else if (G.state === 'play') {
    if (hit.Escape) setState('title');
    else { const slowAll = puOn('slow') && !SLOW_OK.includes(modeKey()); G.playT += dt;
      MODE().update(slowAll ? dt * 0.6 : dt); if (G.state === 'play') { mxUpdate(dt); puUpdate(dt); } G.inv -= dt; G.msgT -= dt; updParts(dt); }
  } else if ((G.state === 'win' || G.state === 'lose') && hsUpdate()) { updParts(dt); }
  else if (G.state === 'win' || G.state === 'lose') {
    updParts(dt);
    for (const c of G.confetti) { c.y += c.vy * dt; c.x += c.vx * dt + Math.sin(G.time * 3 + c.r) * 0.5; c.r += c.vr * dt; if (c.y > H + 10) { c.y = -10; c.x = rand(0, W); } }
    if (G.t > 0.8 && anyGo()) newGame();
    else if (hit.Escape) setState('title');
  }
  for (const k in hit) hit[k] = false;
}
function draw() {
  const t = G.time;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  xtraBuild();
  if (G.state === 'missing') drawMissing(t);
  else if (G.state === 'story') drawStory(t);
  else if (G.state === 'title') drawTitle(t);
  else if (G.state === 'play') { if (R3.on && R3.ready) r3Frame(t); else MODE().draw(t); drawHud(); }
  else drawEnd(t, G.state === 'win');
  drawBubble();
}
let lastT = null, acc = 0;
function frame(ts) {
  if (lastT === null) lastT = ts;
  acc += Math.min(0.25, Math.max(0, (ts - lastT) / 1000)); lastT = ts;
  while (acc >= STEP) { update(STEP); acc -= STEP; }
  if (G.state !== 'missing') musicTick();
  draw(); G.frames++;
  requestAnimationFrame(frame);
}
function boot() {
  document.title = MISSING ? 'Game missing' : C.title;
  fit();
  r3Load();
  requestAnimationFrame(frame);
}
boot();
</script>
