<style>

  .pill.glow { background: linear-gradient(135deg,#00bfa5,#7c4dff); animation: glow 1.6s ease-in-out infinite; }

  #rightBtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; max-width: 60vw; }
  #bottom { position: absolute; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 0 12px; }
  #shelf { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; max-width: 1100px; }

  #fact { max-width: min(92vw, 760px); text-align: center; font-size: clamp(14px, 1.8vw, 18px); background: rgba(0,0,0,.5); padding: 8px 16px; border-radius: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #inBeaker { position: absolute; top: 22%; right: 3vw; width: min(26vw, 230px); background: rgba(0,0,0,.45); border-radius: 18px; padding: 10px 12px; font-size: clamp(14px, 1.7vw, 17px); font-weight: 700; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }

  @keyframes tilt { 0% { transform: translateX(-130%) rotate(0deg); } 25% { transform: translateX(-120%) rotate(-100deg); } 80% { transform: translateX(-120%) rotate(-112deg); } 100% { transform: translateX(-130%) rotate(-10deg); } }
  #result { position: fixed; top: 19%; left: 4vw; width: min(36vw, 340px); background: rgba(10,25,35,.78); border-radius: 22px; padding: 14px 16px; box-shadow: 0 0 0 2px rgba(120,255,220,.6) inset, 0 10px 40px rgba(0,0,0,.5); opacity: 0; transform: translateY(10px); transition: all .5s; pointer-events: none; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }

  #toast { position: fixed; top: 46%; left: 50%; transform: translate(-50%,-50%); font-size: clamp(20px, 3vw, 30px); font-weight: 900; background: rgba(0,0,0,.6); padding: 12px 22px; border-radius: 20px; opacity: 0; transition: opacity .4s; pointer-events: none; text-align: center; }

  @media print {
    @page { margin: 14mm; }
    html, body { background: #fff !important; color: #000; overflow: visible; height: auto; }

<script>
'use strict';
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- ingredients (pretend lab: nothing here is real chemicals) ----------
const ING = [
  { id: 'soda', e: '🥄', n: 'Baking soda', col: [.97, .97, .97], powder: 1 },
  { id: 'vinegar', e: '🍶', n: 'Vinegar', col: [.97, .95, .88] },
  { id: 'cabbage', e: '🥬', n: 'Red cabbage juice', col: [.42, .08, .6] },
  { id: 'lemon', e: '🍋', n: 'Lemon juice', col: [1, .95, .55] },
  { id: 'soap', e: '🧼', n: 'Soap', col: [.75, .92, 1] },
  { id: 'water', e: '💧', n: 'Water', col: [.9, .96, 1] },
  { id: 'oil', e: '🫒', n: 'Cooking oil', col: [1, .78, .22] },
  { id: 'color', e: '🎨', n: 'Food coloring', col: [1, .1, .35] },
  { id: 'honey', e: '🍯', n: 'Honey', col: [1, .55, .06] },
  { id: 'salt', e: '🧂', n: 'Salt', col: [1, 1, 1], powder: 1 },
  { id: 'glow', e: '✨', n: 'Glow powder', col: [.55, 1, .45], powder: 1 },
  { id: 'peroxide', e: '🧴', n: 'Peroxide (grown-ups)', col: [.95, .97, 1] },
  { id: 'yeast', e: '🍞', n: 'Yeast', col: [.85, .7, .45], powder: 1 },
  { id: 'dryice', e: '🧊', n: 'Dry ice (pretend)', col: [.95, .98, 1], powder: 1 }
];
const ingById = id => ING.find(i => i.id === id);
// ---------- reactions: every explanation is TRUE science ----------
const RX = [
  { id: 'fizz', need: ['soda', 'vinegar'], e: '🌋', n: 'Fizzy Foam Volcano',
    why: 'Baking soda and vinegar make carbon dioxide gas bubbles. So many bubbles pop up that the foam spills over the top!',
    hint: 'Try a powder from the kitchen with something sour.' },
  { id: 'pink', need: ['cabbage', 'lemon'], e: '🩷', n: 'Pink Color Switch',
    why: 'Red cabbage juice is a color-changing "indicator". Acids, like lemon juice, turn it pink!',
    hint: 'Purple veggie juice plus something sour...' },
  { id: 'green', need: ['cabbage', 'soap'], also: [['cabbage', 'soda']], e: '💚', n: 'Green Color Switch',
    why: 'Soap and baking soda are "bases", the opposite of acids. Bases turn red cabbage juice blue or green!',
    hint: 'Purple veggie juice plus something for washing...' },
  { id: 'glow', need: ['glow', 'water'], e: '🌟', n: 'Glowing Potion',
    why: 'Glow-in-the-dark stuff soaks up light energy, then slowly lets it back out as a soft glow. Turn on Dark mode to see it!',
    hint: 'Something sparkly in water. Then turn the lights off!' },
  { id: 'paste', need: ['peroxide', 'yeast', 'soap'], e: '🐘', n: 'Elephant Toothpaste',
    why: 'Yeast makes hydrogen peroxide split super fast into water and oxygen gas. Soap traps the oxygen in millions of bubbles, so a foam tower shoots up!',
    warn: '⚠️ Grown-ups only in real life! Strong peroxide can hurt skin and eyes.',
    hint: 'Three things: the grown-up bottle, something from bread, and something bubbly.' },
  { id: 'lava', need: ['oil', 'water', 'color'], e: '🫧', n: 'Lava Lamp Blobs',
    why: 'Oil and water do not mix! Oil is lighter, so it floats on top, and the colored water drops sink through it in blobs.',
    hint: 'Oil, water and a splash of color.' },
  { id: 'rainbow', need: ['honey', 'water', 'oil'], e: '🌈', n: 'Rainbow Layers',
    why: 'Heavy liquids sink and light ones float. Honey is heavy, water is in the middle and oil is light, so they stack up in layers!',
    hint: 'Something sticky and sweet, water, and oil.' },
  { id: 'crystal', need: ['salt', 'water'], e: '💎', n: 'Growing Crystals',
    why: 'When salty water slowly dries up, the salt comes back together as crystals with flat sides and sharp edges. Real salt crystals are little cubes!',
    hint: 'Something salty in water... then wait!' },
  { id: 'fog', need: ['dryice', 'water'], e: '🌫️', n: 'Dry Ice Fog',
    why: 'Dry ice is frozen carbon dioxide. In water it turns straight into gas, and the cold gas makes a cloud of tiny water drops: fog!',
    warn: '⚠️ Never touch dry ice! It is about 109 degrees below zero and can hurt your skin.',
    hint: 'Something super-cold and pretend, in water.' }
];
const SILLY = ['Giggle Goo', 'Wobbly Rainbow Juice', 'Mystery Sparkle Soup', 'Banana Moon Slime', 'Robo\'s Bubble Tea', 'Upside-Down Pudding', 'Tickle Tonic', 'Snorkel Syrup'];
// ---------- safe real experiments (with a grown-up) ----------
const REAL = [
  { e: '🥬', n: 'Color-Changing Cabbage Juice', need: ['Red cabbage', 'Hot water (grown-up)', 'Clear cups', 'Lemon juice', 'Baking soda', 'Spoons'],
    steps: ['A grown-up chops some red cabbage and soaks it in hot water for about 10 minutes.', 'Let it cool. A grown-up pours the purple juice into a few clear cups.', 'Add lemon juice to one cup. It turns pink!', 'Stir a spoon of baking soda into another cup. It turns blue or green!', 'Try other kitchen things. Is it an acid (pink) or a base (green)?'],
    safe: 'A grown-up handles the hot water. Do not drink your experiments.' },
  { e: '🌋', n: 'Baking Soda Volcano', need: ['A cup or small bottle', 'A tray or baking pan', 'Baking soda', 'Vinegar', 'Dish soap', 'Food coloring (if you like)'],
    steps: ['Put the cup on the tray to catch the mess.', 'Add 2 big spoons of baking soda.', 'Add a squirt of dish soap and a drop of food coloring.', 'Pour in about half a cup of vinegar.', 'Watch it foam up and over! The bubbles are carbon dioxide gas.'],
    safe: 'Keep vinegar away from your eyes. Do it on a tray and wipe up together.' },
  { e: '🫧', n: 'Oil and Water Lava Lamp', need: ['A clear bottle or tall glass', 'Water', 'Vegetable oil', 'Food coloring', 'A fizzy tablet (grown-up)'],
    steps: ['Fill the bottle about one quarter full with water.', 'Add a few drops of food coloring.', 'Slowly fill it almost to the top with oil. Wait for the oil to float on top.', 'A grown-up breaks a fizzy tablet into small pieces and drops one in.', 'Watch the colored blobs rise and fall! Add another piece for more.'],
    safe: 'A grown-up handles the fizzy tablet. Do not drink it, and do not put the lid on while it fizzes.' }
];
// ---------- the lab, drawn by one fragment shader (glass, liquid, foam, light) ----------
const FS = `
precision highp float;
uniform vec2 uRes; uniform float uT;
uniform float uLevel, uFizz, uFoam, uGlow, uDark, uLava, uLayers, uCrystal, uFog, uTower, uSpark, uPour, uPowder, uSwirl;
uniform vec3 uCol, uFoamCol, uLavaCol, uPourCol;
#define BW .15
#define BY0 -.16
#define BY1 .25
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*noise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,1.7); a*=.5; } return s; }
float sat(float x){ return clamp(x,0.,1.); }
// the room behind the bench: dim lab wall, glowing shelves of blurry bottles, a window
vec3 room(vec2 p){
  vec3 c=mix(vec3(.035,.045,.06), vec3(.13,.15,.18), sat(p.y*1.1+.5));
  c+=vec3(.55,.6,.68)*exp(-length((p-vec2(-.95,.5))*vec2(.7,1.1))*2.2)*.55;
  for(int k=0;k<2;k++){ float sy=k==0 ? .36 : .02;
    c=mix(c, vec3(.16,.11,.07), smoothstep(.012,.004,abs(p.y-sy+.004))*.9);
    c+=vec3(1.,.8,.55)*exp(-abs(p.y-sy+.016)*90.)*.25*step(p.y,sy);
    for(int i=0;i<16;i++){ float fi=float(i)+float(k)*16.; vec2 r=h22(vec2(fi,3.7));
      float x=-1.25+float(i)*.165+r.x*.06, w=.022+r.y*.025, hgt=.07+h21(vec2(fi,9.))*.1;
      vec2 q=p-vec2(x, sy+hgt*.5); float d=length(max(abs(q)-vec2(w,hgt*.5),0.))-.012;
      float hue=h21(vec2(fi,1.3)); vec3 bc=hue<.33 ? vec3(.9,.45,.12) : hue<.66 ? vec3(.15,.75,.7) : vec3(.85,.3,.6);
      float m=smoothstep(.03,-.015,d); c=mix(c, bc*.32+c*.4, m*.85);
      c+=bc*.5*exp(-length(q-vec2(-w*.4,hgt*.15))*40.)*m; } }
  return c;
}
// the beaker's liquid colour at a point (rainbow layers, lava blobs, swirl of the new colour)
vec3 liquidCol(vec2 p, float yL, float x){
  vec3 c=uCol;
  float sw=fbm(vec2(x*2.,p.y*8.)+vec2(0.,uT*.6)); c=mix(c, c*vec3(1.15,.9,1.1), uSwirl*sw);
  if(uLayers>0.){ float f=sat((p.y-BY0)/max(yL-BY0,.01)+.015*sin(x*7.+uT));
    vec3 L= f<.18 ? vec3(1.,.5,.05) : f<.34 ? vec3(.55,.1,.75) : f<.5 ? vec3(.1,.45,1.) : f<.66 ? vec3(.2,.85,.4) : f<.83 ? vec3(1.,.85,.15) : vec3(1.,.15,.2);
    c=mix(c, L, uLayers); }
  return c;
}
// foam: lots of little soap bubbles with dark rims and shiny tops
vec3 foam(vec2 p){
  vec3 c=uFoamCol*.78; float sh=0.;
  for(int k=0;k<2;k++){ float sc=k==0 ? 42. : 80.; vec2 g=p*sc+float(k)*7.3; vec2 id=floor(g), f=fract(g)-.5;
    vec2 o=(h22(id)-.5)*.5; float r=.32+.14*h21(id+2.); float d=length(f-o);
    float rim=smoothstep(r,r-.06,d)-smoothstep(r-.06,r-.16,d); float hl=smoothstep(.12,0.,length(f-o-vec2(-.12,.12)*r*2.));
    c-=uFoamCol*rim*.22*(k==0 ? 1. : .6); sh+=hl*(k==0 ? .5 : .3); }
  return (c+vec3(sh)*.8+uFoamCol*.12*fbm(p*20.))*(1.05-.3*smoothstep(.6,1.1,abs(p.x/BW)));
}
float lavaField(vec2 p){ float s=0.; for(int i=0;i<6;i++){ float fi=float(i);
    vec2 b=vec2(sin(uT*.23+fi*2.1)*.55*BW, BY0+.05+(.5+.5*sin(uT*(.11+fi*.03)+fi*1.7))*(uLevel*.36));
    float r=(.022+.012*h21(vec2(fi,4.)))*uLava; vec2 d=(p-b)*vec2(1.,.75); s+=r*r/max(dot(d,d),1e-5); } return s; }
float crystals(vec2 p, out float facet){
  float m=0.; facet=0.;
  for(int i=0;i<11;i++){ float fi=float(i); vec2 r=h22(vec2(fi,7.7));
    vec2 o=vec2((r.x-.5)*1.6*BW, BY0+.012); float ang=(r.y-.5)*1.6;
    if(i>7){ o=vec2((fi<9.5? -1.:1.)*BW*.93, BY0+.05+r.y*.12); ang=(fi<9.5? -1.2:1.2); }
    float L=(.025+.045*h21(vec2(fi,2.)))*uCrystal; ang*=.5;
    vec2 q=p-o; q=mat2(cos(ang),-sin(ang),sin(ang),cos(ang))*q; q.y-=L*.45;
    float d=max(abs(q.x),abs(q.y))-L*.5;
    if(d<0.){ m=1.; facet=q.y>L*.2-abs(q.x)*.3 ? .7 : (q.x>0. ? .15 : .4); facet+=.25*step(-L*.06,d); } }
  return m;
}
`;
const FS_MAIN = `
void main(){
  vec2 p=(gl_FragCoord.xy-.5*uRes)/uRes.y-vec2(0.,.035); float t=uT; float lit=1.-uDark*.9;
  float x=p.x/BW; float ax=abs(x); float nz=sqrt(max(0.,1.-x*x));
  float yL=BY0+.012+uLevel*(BY1-BY0-.05); float e=.016;
  float wob=sin(x*9.+t*3.)*.0015*(uFizz+uPour)+sin(x*5.-t*2.)*.0008;
  float yS=yL+wob+.007*pow(ax,8.);            // liquid surface with a meniscus curving up at the glass
  vec3 col;
  // ---- bench (glossy black lab top) or room ----
  if(p.y<BY0){
    vec2 m=vec2(p.x, 2.*BY0-p.y); float k=exp(-(BY0-p.y)*9.);
    col=vec3(.018,.02,.024)+room(m+vec2(0.,(BY0-p.y)*.15))*.22*k;
