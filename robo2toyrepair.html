<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo 2.0's Toy Repair Shop</title>
<script src="touchpad.js?v=10"></script>
<style>

    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 7.9in; height: 10.38in; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; overflow: hidden; }

    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

  drawBar(); drawWork(); drawCust();
  for (let i = 0; i < 6; i++) setTimeout(() => popFx([120 + Math.random() * 360, 120 + Math.random() * 200], pick(['🎉', '⭐', '💖', '✨', '🎊'])), i * 180);
  say(t.thanks, t.pitch, t.cust);
  const box = $('doneBox'); box.style.display = 'flex'; box.innerHTML = '';
  const pr = el('button', 'bigbtn green', '🖨️ Print a paper ' + t.name); pr.onclick = () => openPrint([t.k]);
  const nx = TOYS.find(x => !S.fixed[x.k]);
  const nb = el('button', 'bigbtn orange', nx ? '➡️ Next toy' : '🏠 All toys'); nb.onclick = () => { if (nx) startJob(nx.k); else { sfx.click(); J = null; show('board'); } };
  box.append(pr, nb);
  setTimeout(() => { if (J && J.fixed && J.k === t.k) say(fixedCount() >= TOYS.length && first ? 'You fixed ALL 8 toys! You are a master toy fixer, Ben! B33P!' : 'Fixed! Want to print a paper ' + t.name.toLowerCase() + '? Tap PRINT.'); }, 4200);
}
// 🖨️ print preview: nothing prints until Ben taps PRINT. Color or black-and-white.
let printList = [];
const printPagesFor = (list, line) => list.flatMap(k => TOY_PAGES[k] ? TOY_PAGES[k].map(f => sheet(f, line)) : []);
function fillPrint() {
  if (!printBox) return;
  printBox.querySelectorAll('.pbPage').forEach(e => e.remove());
  const pages = printPagesFor(printList, printMode === 'line');
  for (const svg of pages) { const d = el('div', 'pbPage'); d.innerHTML = svg; printBox.appendChild(d); }
  const pr = printBox.querySelector('.pbPrint'); pr.textContent = pages.length > 1 ? `🖨️ PRINT (${pages.length} pages)` : '🖨️ PRINT';
  printBox.querySelectorAll('.pbMode').forEach(b => b.classList.toggle('on', b.dataset.m === printMode));
}
function openPrint(list) {
  closePrint(true); printList = list.filter(k => TOY(k)); if (!printList.length) return;
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', '🖨️ PRINT');
  const mc = el('button', 'pbMode', '🎨 COLOR'), mb = el('button', 'pbMode', '⚫ BLACK + WHITE'); mc.dataset.m = 'color'; mb.dataset.m = 'line';
  mc.onclick = () => { printMode = 'color'; sfx.click(); fillPrint(); }; mb.onclick = () => { printMode = 'line'; sfx.click(); fillPrint(); say('Black and white! Now you can color it in yourself.'); };
  back.onclick = () => closePrint();
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); say('Printing! Ask a grown-up to help with the printer and the scissors.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, mc, mb, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '🧸 ' + (printList.length === 1 ? 'Paper ' + TOY(printList[0]).name : 'All my fixed toys') + '  •  📏 Print at 100% / "Actual size"'));
  document.body.appendChild(printBox); fillPrint();
  sfx.click(); say('Here it is! Tap PRINT if you want it on paper.');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, Enter = next toy, 1-6 = tools
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { if (printBox) closePrint(); else if (view === 'job') { sfx.click(); J = null; show('board'); } }
  else if ((k === 'p' || k === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (printBox) return;
  else if (k === 'Enter') { if (view === 'board') { const nx = TOYS.find(x => !S.fixed[x.k]) || TOYS[0]; startJob(nx.k); } else if (J && J.fixed) { const b = $('doneBox').querySelectorAll('button')[1]; if (b) b.click(); } }
  else if (view === 'job' && /^[1-6]$/.test(k)) pickTool(TOOLS[+k - 1].k);
});
$('helper').onclick = () => { sfx.click(); say(pick(['B33P! I mean... BEEP! I can fix anything!', 'Why did the toy car go to the repair shop? It was WHEEL-y tired!', 'My favorite tool? All of them! Beep!', 'Every fixed toy can be printed as a paper toy!'])); };
window.addEventListener('afterprint', () => { if (printBox) fillPrint(); });
drawHelper(); render();
$('bubble').textContent = fixedCount() ? 'Welcome back, Ben! More toys need fixing!' : 'B33P! I mean... BEEP! Welcome to my Toy Repair Shop! Tap a broken toy to fix it.';
</script>
