  .rpet .nmTag { position: absolute; bottom: -4px; left: 50%; transform: translateX(-50%); background: #fff; border: 2px solid #4a148c; border-radius: 10px; padding: 0 8px; font-weight: 900; color: #4a148c; font-size: 15px; white-space: nowrap; }
  .fx { position: absolute; pointer-events: none; font-size: 34px; animation: rise 1.2s ease-out forwards; }
  @keyframes rise { from { transform: translateY(0) scale(.6); opacity: 1; } to { transform: translateY(-120px) scale(1.3); opacity: 0; } }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

  .t-spin { animation: tspin 1.1s ease-in-out; } @keyframes tspin { 50% { transform: translateY(-40px) rotate(180deg); } 100% { transform: rotate(360deg); } }
  .t-flip { animation: tflip 1.1s ease-in-out; } @keyframes tflip { 40% { transform: translateY(-90px) rotate(-200deg); } 100% { transform: translateY(0) rotate(-360deg); } }
  .t-hop { animation: thop 1.2s ease-in-out; } @keyframes thop { 25%, 75% { transform: translateY(0) scaleY(.8); } 50% { transform: translateY(-140px) scaleY(1.1); } }
  .t-splash { animation: tsplash 1.3s ease-in-out; } @keyframes tsplash { 50% { transform: translate(40px, -120px) rotate(30deg); } }
  .t-shell { animation: tshell 1.4s ease-in-out; } @keyframes tshell { 20% { transform: scaleY(.6); } 50% { transform: scaleY(.6) rotate(360deg); } 80% { transform: scaleY(.6) rotate(720deg); } }
  .t-roar { animation: troar 1.2s ease-in-out; } @keyframes troar { 20%, 60% { transform: scale(1.18) rotate(-6deg); } 40%, 80% { transform: scale(1.18) rotate(6deg); } }
  .t-roll { animation: troll 1.4s ease-in-out; } @keyframes troll { 50% { transform: translateX(80px) rotate(360deg); } 100% { transform: translateX(0) rotate(720deg); } }
  .t-fly { animation: tfly 1.6s ease-in-out; } @keyframes tfly { 25% { transform: translate(-60px, -120px); } 50% { transform: translate(0, -180px) rotate(20deg); } 75% { transform: translate(60px, -120px); } }
  #petBar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 10px; background: #f3e5f5; }
  #petBar .who { font-size: 22px; font-weight: 900; color: #4a148c; margin-right: 6px; }
  .meter { font-size: 22px; letter-spacing: 1px; }

  #printBox .pbTip { font-size: 19px; color: #2b2d42; margin: 6px 0 4px; font-weight: bold; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 6px; overflow: hidden; }
  #printBox .pbPage svg { display: block; width: 100%; height: auto; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 7.9in; height: 10.38in; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; overflow: hidden; }
    #printBox .pbPage svg { width: 7.9in; height: 10.38in; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
'use strict';
// =====================================================================
// 🐾 ROBO 2.0's ROBOT PET SHOP (💡 Ben's idea!): adopt robot pets with pretend Bolt Bucks.
// Every adoption comes with printables: a fold-up paper pet (cube body + head, tail, legs), a collar + tag,
// a food bowl and a PET PASSPORT. Adopted pets live in MY PETS: tap to feed, pet and see a trick.
// Paper only: printer paper, scissors (a grown-up cuts), tape or a glue stick, crayons.
// Every sheet is 790 x 1038 units (100 units = 1 inch). LINE = true is the black-and-white version. No emoji on printed pages.
// Save: localStorage 'robo2PetShop' = { bucks, cart, gift, giftTo, orders:[{k, gift, to, n}], pets:{k:{name, food, love, tricks}}, n }
// Trophy 'robotPetShop': adopt 3 pets. Never touches the Game Factory's real coins.
// =====================================================================
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'robo2PetShop';
let S = { bucks: 1000, cart: [], gift: false, giftTo: 'Ben', orders: [], pets: {}, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000; if (!S.pets || typeof S.pets !== 'object') S.pets = {};
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
// =====================================================================
// SVG ART ENGINE (copied from megaminishop.html / secretsurprise.html): LINE = false is color, LINE = true is black and white
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;

  m.appendChild(el('div', 'idea', "💡 Ben's idea! Your robot pets live here. Tap a pet, then FEED it, PET it or see its TRICK!"));
  if (!ks.length) {
    m.appendChild(el('div', 'empty', 'No pets yet! Adopt a robot pet and it will live here.'));
    const b = el('button', 'bigbtn green', '🐾 SEE THE PETS'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; m.appendChild(b); return;
  }
  if (!SEL || !adopted(SEL)) SEL = ks[0];
  const room = el('div'); room.id = 'room'; const art = el('div'); art.id = 'roomArt'; art.innerHTML = ROOM_BG(); room.appendChild(art);
  const slot = 94 / ks.length, w = Math.min(17, slot);
  ks.forEach((k, i) => {
    const d = el('div', 'rpet' + (k === SEL ? ' on' : '')); d.id = 'rp_' + k; d.style.left = (3 + i * slot + (slot - w) / 2) + '%'; d.style.width = w + '%';
    const inner = el('div', 'idle', petSVG(k, { happy: (S.pets[k].love || 0) >= 3 })); inner.style.animationDelay = (i * .23) + 's'; inner.style.height = '100%'; d.appendChild(inner);
    d.appendChild(el('div', 'nmTag', S.pets[k].name));
    d.onclick = () => { SEL = k; sfx.pet(k); say(S.pets[k].name + ' says: ' + PET(k).hi, 1.7, 1.1); renderPets2(); };
    art.appendChild(d);
  });
  const bar = el('div'); bar.id = 'petBar'; room.appendChild(bar); m.appendChild(room); fillPetBar();
}
function renderPets2() { const st = $('main').scrollTop; render(); $('main').scrollTop = st; }
function fillPetBar() {
  const bar = $('petBar'); if (!bar) return; bar.innerHTML = ''; const f = petNow(SEL), p = PET(SEL);
  bar.appendChild(el('span', 'who', p.name + ' "' + f.name + '"'));
  bar.appendChild(el('span', 'meter', '🔋'.repeat(f.food) + '<span style="opacity:.25">' + '🔋'.repeat(5 - f.food) + '</span>'));
  bar.appendChild(el('span', 'meter', '💖'.repeat(f.love || 0) + '<span style="opacity:.25">' + '💖'.repeat(5 - (f.love || 0)) + '</span>'));
  const b = (txt, cls, fn) => { const x = el('button', 'bigbtn small ' + cls, txt); x.onclick = fn; bar.appendChild(x); };
  b('🔋 FEED', 'green', feedPet); b('✋ PET', 'pink', petPet); b('🎪 TRICK', 'blue', trickPet);
  b('✏️ Name', '', () => { f.name = PET_NAMES[(PET_NAMES.indexOf(f.name) + 1) % PET_NAMES.length]; save(); sfx.click(); say('Now your ' + p.name + ' is called ' + f.name + '!'); renderPets2(); });
  b('🖨️ Print', '', () => { const o = S.orders.filter(o => o.k === SEL).pop(); if (o) openPrint([o]); });
}
function fx(k, emo, count) {
  const d = $('rp_' + k), art = $('roomArt'); if (!d || !art) return;
  for (let i = 0; i < (count || 3); i++) { const e = el('div', 'fx', emo); e.style.left = (d.offsetLeft + d.offsetWidth * (.2 + Math.random() * .6) - 17) + 'px'; e.style.top = (d.offsetTop + d.offsetHeight * .2) + 'px';
    e.style.animationDelay = (i * .18) + 's'; art.appendChild(e); setTimeout(() => e.remove(), 1700); }
}
function face(k, o, ms) { const d = $('rp_' + k); if (!d) return; const inner = d.querySelector('.idle'); inner.innerHTML = petSVG(k, o); clearTimeout(d._t); d._t = setTimeout(() => { inner.innerHTML = petSVG(k, { happy: (S.pets[k].love || 0) >= 3 }); }, ms || 1400); }
function feedPet() {
  const f = petNow(SEL), p = PET(SEL);
  if (f.food >= 5) { sfx.soft(); say(f.name + ' is full! Beep... burp! Try PET or TRICK.'); face(SEL, { happy: true }, 1200); return; }
  f.food++; f.t = Date.now(); save(); sfx.munch(); fx(SEL, '🔋', 2); face(SEL, { open: true }, 900);
  say(pick(['Crunch crunch! ' + f.name + ' loves batteries!', 'Yum! A fresh battery for ' + f.name + '!', p.hi + ' That means THANK YOU!'])); fillPetBar();
}
function petPet() {
  const f = petNow(SEL); f.love = Math.min(5, (f.love || 0) + 1); save(); sfx.purr(); fx(SEL, '💖', 3); face(SEL, { happy: true, heart: true }, 1600);
  say(pick([f.name + ' loves you, Ben!', 'Aww! ' + f.name + ' is so happy!', 'Pet pet pet! Happy beeps!'])); fillPetBar();
}
function trickPet() {
  const f = petNow(SEL), p = PET(SEL), d = $('rp_' + SEL); if (!d) return;
  if (f.food <= 0) { sfx.soft(); say(f.name + ' is too hungry for tricks. Feed it a battery first!'); face(SEL, { blink: true }, 1000); return; }
  f.tricks = (f.tricks || 0) + 1; save(); sfx.trick(); fx(SEL, p.fx, 4); face(SEL, { happy: true, open: true }, 1600);
  d.classList.remove('t-' + p.trick); void d.offsetWidth; d.classList.add('t-' + p.trick); setTimeout(() => d.classList.remove('t-' + p.trick), 1700);
  say(f.name + ' does the ' + p.trickName + '! Ta-da!');
}
// ⌨️ keys: Escape = back, P = print, 1-4 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipOn && shipDone) closeShip(); else if (view !== 'shop') show('shop'); else if (CAT !== 'all') goCat('all'); }
  else if ((k === 'p' || k === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (k === 'Enter') { if (shipOn && shipDone) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (printBox || shipOn) return;
  else if (k === '1') { sfx.click(); show('shop'); } else if (k === '2') { sfx.click(); show('cart'); } else if (k === '3') { sfx.click(); show('pets'); } else if (k === '4') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap ADOPT when you are ready.' : 'Your cart is empty. Let\'s find a pet!'); };
$('tPets').onclick = () => { sfx.click(); show('pets'); const n = Object.keys(S.pets).length; say(n ? 'Your robot pets are so happy to see you!' : 'No pets yet. Adopt one in the shop!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s adopt a pet!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('helper').onclick = () => { sfx.click(); say(pick(JOKES)); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); CAT = 'all'; show('shop');
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: the ' + PET(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + PET(DEAL).name;
window.addEventListener('afterprint', () => { if (printBox) fillPrint(); });
drawHelper(); render();
$('bubble').textContent = Object.keys(S.pets).length ? 'Welcome back, Ben! Your robot pets missed you!' : 'B33P! I mean... BEEP! Welcome to my Robot Pet Shop!';
</script>
</body>
