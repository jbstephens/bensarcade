<script>
'use strict';
// ---------- shared shader bits (from Realism): hashing, noise, fbm, stars, and a filmic camera finish ----------
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
// star colour from a 0..1 "temperature" (red dwarf -> sun -> blue giant)
vec3 starCol(float k){ return k<.5 ? mix(vec3(1.,.62,.38), vec3(1.,.95,.88), k*2.) : mix(vec3(1.,.95,.88), vec3(.62,.75,1.), (k-.5)*2.); }
// one layer of stars: point-spread "blobs" a pixel or two wide, twinkling
vec3 starLayer(vec2 p, float cell, float dens, float px, float seed, float tw){
  vec2 q=p/cell; vec2 id=floor(q); vec2 f=fract(q)-.5;
  float r=h21(id+seed); if(r>dens) return vec3(0);
  vec2 o=(h22(id+seed*1.3)-.5)*.6; float d=length(f-o)*cell/px;
  float m=pow(h21(id*1.71+seed), 6.);
  float twk=1.-tw+tw*(.55+.45*sin(uT*(1.5+4.*h21(id+9.1))+r*60.));
  float core=exp(-d*d*(1.6-m*.9)); float halo=exp(-d*.55)*m*.25;
  return starCol(h21(id*3.7+seed))*(core*(.25+2.8*m)+halo)*twk;
}
vec3 starfield(vec2 p, float px, float amt){
  vec3 c=starLayer(p, 26.*px, .55, px, 1., .5)*.55+starLayer(p+.13, 11.*px, .45, px, 31., .4)*.22;
  c+=starLayer(p+.37, 43.*px, .5, px, 7., .6);
  c+=starLayer(p+.71, 97.*px, .55, px, 13., .7)*1.5;
  return c*amt;
}
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;
// ---------- the volcano scene: sky, sea, island, lava, smoke ----------
const VOLC_A = `
uniform float uHeat, uBub, uSteam, uErA, uEr, uFlow, uOld, uHot, uType, uNight, uCut;
float W, H, CR, DEP, TY, LAKE;
vec3 SUN; vec3 SUNC; vec3 AMB;
float shieldP(float s){ return clamp(1.-pow(s,1.6),0.,1.); }
float coneP(float s){ float k=2.7; return clamp((exp(-k*s)-exp(-k))/(1.-exp(-k)),0.,1.); }
float baseH(float r){
  float s=r/W, sc=max(s, CR/W);
  float h=H*mix(shieldP(sc), coneP(sc), TY);
  h-=DEP*smoothstep(CR*1.02, CR*.45, r);                     // the crater bowl
  float rq=(r-CR)/.09; h+=.03*H*exp(-rq*rq);                          // its rim
  h-=.6*smoothstep(.82,1.5,s);                                // the slope under the sea
  return h;
}
float ang(vec2 xz){ return atan(xz.x, -xz.y); }                // 0 = the side facing us (seam is at the back)
float terrain(vec2 xz, bool fine){
  float r=length(xz); float h=baseH(r); float s=r/W;
  float th=ang(xz);
  float land=smoothstep(CR*.9, CR*1.6, r);
  float g=noise(vec2(th*(5.+9.*TY), r*1.1+th*.3));               // gullies running down the slopes
  g=1.-abs(2.*g-1.);
  h+=(g-.6)*.07*land*(.75+.25*TY)*smoothstep(1.1,.3,s);
  h+=(fbm3(xz*1.3+7.)-.5)*.2*land*smoothstep(1.3,.6,s);
  if(fine) h+=(fbm4(xz*7.)-.5)*.025*land;
  if(r<CR*.85) h=max(h, LAKE);                                  // the lava lake fills the crater floor
  return h;
}
vec3 sky(vec3 rd, float px){
  float y=max(rd.y,0.);
  vec3 day=mix(vec3(.52,.67,.86), vec3(.10,.27,.58), pow(y,.4));
  day+=vec3(1.,.85,.6)*pow(max(dot(rd,SUN),0.),8.)*.35+vec3(1.,.95,.85)*pow(max(dot(rd,SUN),0.),900.)*30.;
  vec3 nite=mix(vec3(.02,.03,.055), vec3(.002,.004,.012), pow(y,.4));
  vec3 c=mix(day, nite, uNight);
  if(rd.y>0.){
    vec2 cp=rd.xz/(rd.y+.06)*1.2;
    float cl=fbm(cp*.6+vec2(uT*.006,0.)); float cov=smoothstep(.5,.78,cl)*smoothstep(0.,.12,rd.y);
    float sh=fbm4(cp*.6+vec2(uT*.006,0.)+SUN.xz*.08);
    vec3 cc=mix(vec3(1.,.98,.95), vec3(.55,.6,.7), smoothstep(.45,.75,sh))*mix(1., .05, uNight);
    c=mix(c, cc, cov*.85);
    vec2 sp=rd.xy/(rd.z+1.)*1.6;
    c+=starfield(sp, px*.8, 1.)*uNight*(1.-cov)*smoothstep(0.,.1,rd.y);
    vec3 md=normalize(vec3(.55,.42,1.)); float mdd=dot(rd,md);         // a little moon at night
    c+=vec3(.9,.92,1.)*smoothstep(.99985,.9999,mdd)*uNight*1.4+vec3(.3,.35,.45)*pow(max(mdd,0.),300.)*uNight*.3;
  }
  return c;
}
// hot lava colour: dull red -> orange -> yellow-white
vec3 lavaCol(float T){
  vec3 c=mix(vec3(.35,.02,0.), vec3(1.,.22,.02), smoothstep(0.,.4,T));
  c=mix(c, vec3(1.4,.65,.12), smoothstep(.35,.75,T));
  return mix(c, vec3(2.2,1.6,.7), smoothstep(.75,1.,T))*(.5+2.5*T);
}
// lava rivers flowing down from the crater: returns mask; core = how close to the middle; fresh = 1 for hot new lava
float rivers(vec2 xz, out float core, out float fresh, out float along){
  float r=length(xz), th=ang(xz), m=0.; core=0.; fresh=0.; along=0.;
  float rEnd=W*1.0, nR=TY<.5?4.:2.;
  for(int k=0;k<4;k++){
    float fk=float(k); if(fk>=nR) break;
    float base=TY<.5 ? -1.05+.66*fk : -.32+.72*fk;
    float tk=base+.16*sin(r*1.7+fk*2.)+.07*sin(r*4.3+fk);
    float d=abs(mod(th-tk+PI, 2.*PI)-PI)*r;
    float s=r/W;
    float w=(mix(.075,.05,TY)+.07*s)*(.75+.5*noise(vec2(r*2.5,fk*7.)));
    float a=(r-CR*.9)/(rEnd-CR*.9);
    float pNew=clamp(uFlow*1.3-fk*.1,0.,1.), pOld=clamp(uOld*1.3-fk*.1,0.,1.);
    float wob=.04*noise(vec2(d*20.,fk));
    float mNew=smoothstep(w,w*.55,d)*smoothstep(pNew+.01,pNew-.03,a+wob)*step(0.,a);
    float mOld=smoothstep(w*1.05,w*.6,d)*smoothstep(pOld+.01,pOld-.03,a+wob)*step(0.,a);
    float mk=max(mNew,mOld);
    if(mk>m){ m=mk; core=1.-d/w; fresh=mNew; along=a; }
  }
  return m;
}
`;
const VOLC_B = `
vec3 RO, FW, RT, UP; const float FOC=1.8;
vec2 proj(vec3 p, out float sc){ vec3 d=p-RO; float z=max(dot(d,FW),.01); sc=FOC/z; return vec2(dot(d,RT), dot(d,UP))*sc; }
// a puffy column of smoke or steam in screen space. returns (density, light)
vec2 plume(vec2 uv, vec2 base, float sc, float hgt, float wid, float spd, float seed){
  vec2 q=(uv-base)/sc;
  if(q.y<-.1 || q.y>hgt*1.35 || abs(q.x)>wid*3.+hgt) return vec2(0);
  float yy=max(q.y,0.)/hgt;
  q.x-=.12*hgt*yy*yy;                                                // the wind bends it
  vec2 nq=q*2.1/max(wid,.15)*.35-vec2(0.,uT*spd)+seed;
  float n=fbm4(nq);
  float rad=wid*(.45+1.2*yy+.7*smoothstep(.5,1.,yy));
  float field=1.-abs(q.x)/rad+(n-.5)*1.3;
  float sh=smoothstep(.0,.3,field)*smoothstep(-.1,.1,q.y)*smoothstep(1.35,.8,yy+.25*(n-.5));
  float n2=fbm4(nq+vec2(-.07,.07));
  return vec2(clamp(sh*(.6+.6*n),0.,1.), clamp(.55+(n-n2)*7.+.25*yy-.25*abs(q.x)/rad,0.,1.2));
}
// the cutaway: a slice through the volcano, showing the magma chamber and the pipe
vec3 section(vec3 P, float hs, float px){
  float d=hs-P.y; float t=uT;
  vec3 c;
  if(P.y>-.62+.06*noise(vec2(P.x*2.,3.))){
    float u=d+.06*noise(vec2(P.x*3.,P.y*2.));
    float band=noise(vec2(P.x*.8, u*16.));
    c=mix(vec3(.11,.095,.085), vec3(.36,.24,.16), smoothstep(.35,.75,band));
    c*=.75+.4*noise(P.xy*40.);
  } else {
    c=mix(vec3(.08,.08,.09), vec3(.22,.20,.19), fbm4(P.xy*vec2(2.5,6.)))*(.75+.4*noise(P.xy*30.))*(1.+.25*(P.y+1.));
    c*=1.-.18*smoothstep(.015,.0,abs(noise(P.xy*4.)-.5));                                    // faint cracks
  }
  float hot=.35+.65*uHeat+.6*uErA;
  // magma chamber
  vec2 cc=vec2(0.,-1.12); vec2 rr=vec2(mix(1.05,.8,TY),.3);
  float e=length((P.xy-cc)/rr);
  float flow=fbm4(vec2(P.x*2.2+t*.15, P.y*5.-t*.1)+fbm3(P.xy*3.+t*.2));
  // the pipe up to the crater
  float px0=.05*sin(P.y*3.+1.)*(1.-TY*.5);
  float pw=mix(.075,.055,TY)*(1.+.15*sin(P.y*9.));
  float top=baseH(0.)-DEP*.3;
  float pipe=smoothstep(pw,pw*.7,abs(P.x-px0))*step(cc.y,P.y)*step(P.y,top);
  // a side branch (a "dike") on the shield
  float dk=abs(P.y-(-.35+.32*(P.x-.1)))-.025; float dike=smoothstep(.005,-.005,dk)*step(.08,P.x)*step(P.x,.85)*(1.-TY);
  float glow=exp(-max(e-1.,0.)*3.5)*.5+exp(-abs(P.x-px0)/pw*.7)*.25*step(cc.y,P.y)*step(P.y,top);
  c=mix(c, c*vec3(1.4,.8,.6)+vec3(.25,.05,0.)*hot, clamp(glow,0.,1.)*.6);
  vec3 mag=lavaCol(clamp(.12+.32*flow+.06*hot,0.,.55));
  float rise=fract(P.y*3.-t*(.3+.9*uErA+.4*uHeat));
  vec3 pmag=lavaCol(clamp(.2+.1*hot+.15*smoothstep(.1,.0,abs(rise-.5)-.35),0.,.5));
  float inC=smoothstep(1.,.97,e);
  c=mix(c, mag*(.55+.45*smoothstep(1.,.5,e)), inC);
  c=mix(c, pmag, max(pipe, dike));
  // the outline of the ground along the cut
  c=mix(c, vec3(.05,.04,.03), smoothstep(px*2.5,0.,abs(d))*.8);
  return c;
}
void main(){
  float ZM=max(1.,1.3*uRes.y/uRes.x);                                // tall screens: step back so the volcano fits

    const chain = (type, f, g0) => { const n = noise(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); fl.type = type; fl.frequency.value = f; g.gain.value = g0; n.connect(fl); fl.connect(g); g.connect(master); return { g, fl }; };
    sea = chain('lowpass', 550, .3);                                  // waves washing on the beach
    const o = ctx.createOscillator(), og = ctx.createGain(); o.frequency.value = .1; og.gain.value = .18; o.connect(og); og.connect(sea.g.gain); o.start();
    rum = chain('lowpass', 75, 0);                                    // the eruption's soft, low rumble
    hiss = chain('bandpass', 2200, 0); hiss.fl.Q.value = .6;          // a quiet steam hiss
  }
  function toggle() {
    init(); on = !on; ctx.resume && ctx.resume();
    const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t);
    master.gain.linearRampToValueAtTime(on ? MAX : 0, t + 2);
    return on;
  }
  function rumble(a) { if (!ctx) return; const t = ctx.currentTime; rum.g.gain.cancelScheduledValues(t); rum.g.gain.setTargetAtTime(a * .9, t, a ? 2.5 : 3); }
  function steam(a) { if (!ctx) return; const t = ctx.currentTime; hiss.g.gain.cancelScheduledValues(t); hiss.g.gain.setTargetAtTime(a * .05, t, a ? .8 : 1.5); }
  function blub() {
    if (!ctx || !on) return;
    for (let k = 0; k < 5; k++) {
      const t = ctx.currentTime + k * (.25 + Math.random() * .3), o = ctx.createOscillator(), e = ctx.createGain(), f0 = 90 + Math.random() * 80;
      o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.9, t + .16);
      e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(.12, t + .03); e.gain.exponentialRampToValueAtTime(.0005, t + .22);
      o.connect(e); e.connect(master); o.start(t); o.stop(t + .25);
    }
  }
  function pause(p) { if (!ctx) return; if (p) ctx.suspend && ctx.suspend(); else if (on) ctx.resume && ctx.resume(); }
  return { toggle, rumble, steam, blub, pause };
})();
// ---------- buttons ----------
const ui = document.getElementById('ui'), factEl = document.getElementById('fact'), nameEl = document.getElementById('name');
let factI = 0, nameTimer = 0;
function fact(i) { factI = (i === undefined ? factI + 1 : i) % FACTS.length; factEl.textContent = '🤓 ' + FACTS[factI]; }
function say(txt) { nameEl.textContent = txt; nameEl.classList.add('show'); clearTimeout(nameTimer); nameTimer = setTimeout(() => nameEl.classList.remove('show'), 1800); }
function showPrize(msg) { const p = document.getElementById('prize'); p.innerHTML = msg; p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 4500); }
const on = (id, f) => document.getElementById(id).addEventListener('click', e => { e.stopPropagation(); f(); });
let erupted = new Set();
function setType(ty) {
  if (S.type === ty) return;
  S.type = ty; S.flow = 0; S.old = 0; S.hot = 0;
  document.getElementById('tShield').classList.toggle('on', ty === 0); document.getElementById('tCone').classList.toggle('on', ty === 1);
  say(ty ? '🗻 Cone volcano' : '🏝️ Shield volcano'); fact(ty ? 4 : 3);
}
on('tShield', () => setType(0)); on('tCone', () => setType(1));
const heatEl = document.getElementById('heat');
heatEl.addEventListener('input', () => { S.heat = heatEl.value / 100; });
on('bBubble', () => { S.bubT = 5; Sound.blub(); fact(7); });
on('bSteam', () => { S.steamT = 6; Sound.steam(1); setTimeout(() => Sound.steam(0), 5500); fact(14); });
on('erupt', () => {
  if (S.erupting && S.erT > 0) return;
  if (!S.erupting) { S.old = Math.max(S.old, S.flow); S.flow = 0; S.er = 0; }
  S.erupting = true; S.erT = 18; S.hot = Math.max(S.hot, .01);
  document.getElementById('erupt').classList.add('busy');
  say('🌋 Eruption!'); Sound.rumble(1); setTimeout(() => { if (S.erT < 4) Sound.rumble(0); }, 15000);
  fact(S.type ? 9 : 6);
  erupted.add(S.type);
  if (erupted.size === 2 && !erupted.won) { erupted.won = true; setTimeout(() => { trophy('volcanoLab'); showPrize('🏆 You erupted BOTH kinds of volcano!<br>Volcano Lab trophy!'); }, 3000); }
});
on('bNight', () => { S.night = S.night ? 0 : 1; document.getElementById('bNight').classList.toggle('on', !!S.night); say(S.night ? '🌙 Night' : '☀️ Day'); if (S.night) fact(7); });
on('bCut', () => { S.cut = S.cut ? 0 : 1; document.getElementById('bCut').classList.toggle('on', !!S.cut); say(S.cut ? '🔍 Inside the volcano' : '🌋 Outside'); if (S.cut) fact(11); });
on('bFact', () => fact());
factEl.addEventListener('click', e => { e.stopPropagation(); fact(); });
document.getElementById('hideBtn').addEventListener('click', e => { e.stopPropagation(); ui.classList.add('hidden'); });
document.addEventListener('pointerdown', e => { if (ui.classList.contains('hidden')) { e.preventDefault(); ui.classList.remove('hidden'); } });
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', e => { e.stopPropagation(); const s = Sound.toggle(); soundBtn.textContent = s ? '🔊 Sound on' : '🔈 Sound off'; });
addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'Enter') document.getElementById('erupt').click();
  else if (e.key === 'Escape') ui.classList.toggle('hidden');
});
addEventListener('load', () => { startEngine(); fact(0); });
</script>
