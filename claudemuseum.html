<script>
// 🏛️ THE CLAUDE MUSEUM — Ben's idea! A museum of Claude characters (Claude Gloop, Claude Dino, Baby Claude...).
// Tap an exhibit to check it out (and make it do its thing), collect a stamp for every exhibit in your Museum Passport,
// then visit the 🎁 Gift Shop to print souvenirs: posters, postcards, stickers and your passport.
// The GRAND HALL shows CLAUDE NOVA: Chaos Nova mashed with Claude (Ben's own idea!).
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { seen: {} };
try { const s = JSON.parse(localStorage.getItem('claudeMuseum') || 'null'); if (s && s.seen) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('claudeMuseum', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;

<script>
// ---------- THE CLAUDE CHARACTERS (all with the orange Claude sparkle) ----------
const OR = '#d97757', OR2 = '#e8956f', OR3 = '#b85c3c', CREAM = '#fbe3d3', DARK = '#3d2b23', GOLD = '#ffc94d';
function sparkle(cx, cy, r, col, rot = 0, lw) {               // the Claude sparkle: 8 rounded rays
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw || Math.max(1.5, r * 0.28); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, q = i % 2 ? 0.7 : 1; ctx.moveTo(cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.25); ctx.lineTo(cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q); }
  ctx.stroke(); ctx.restore();
}
function eyes(cx, cy, s, gap = 12, size = 6, col = DARK) {
  const bl = !PRINTING && frame % 220 < 6 ? 0.15 : 1;
  for (const d of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx + d * gap * s, cy, size * s * 0.8, size * s * bl, 0, 0, 7); ctx.fill(); if (bl > 0.5) circle(cx + d * gap * s + 1.5 * s, cy - 2 * s, size * 0.35 * s, '#fff'); }
}

  ctx.strokeStyle = col; ctx.lineWidth = 2.2 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, w * s, 0.2, Math.PI - 0.2); ctx.stroke(); ctx.lineCap = 'butt';
  if (open > 0) { ctx.fillStyle = '#7b2d1e'; ctx.beginPath(); ctx.ellipse(cx, cy + w * 0.6 * s, w * 0.8 * s, w * 0.7 * open * s, 0, 0, 7); ctx.fill(); }
}
function blush(cx, cy, s, gap = 18) { circle(cx - gap * s, cy, 4 * s, 'rgba(255,128,128,.45)'); circle(cx + gap * s, cy, 4 * s, 'rgba(255,128,128,.45)'); }

  ctx.fillStyle = pal[4]; ctx.fillRect(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s); ctx.fillRect(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s);
  rr(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal[1]);
  rr(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal[5]); rr(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal[5]);
  rr(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal[0]); rr(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal[2]);
  return { x, y, w, h, ey: y + h * 0.27 };
}

const CHARS = [
  ['robo', 'Claude Robo', '🤖', 'BEEP BOOP!', 'The Inventor Room of the Secret Print Shop', ['He was the very FIRST Claude character!', 'Ben invented him in the Secret Print Shop.', 'His chest sparkle glows when he has a good idea.'],
    (cx, cy, s, a) => { const S = s * 2.2, by = cy + 44 * s - Math.abs(Math.sin(a * 12)) * 20 * s * (a > 0 ? 1 : 0); const b = robot(cx, by, S, [OR2, CREAM, DARK, '#fff', OR, OR]);
      eyes(cx, b.ey, S * 0.5, 12, 8, '#fff'); sparkle(cx, b.y + b.h * 0.7, 6 * S, OR, frame * 0.02); if (a > 0) text('BEEP BOOP!', cx, cy - 70 * s, 22 * s, '#fff'); }],
  ['baby', 'Baby Claude', '👶', 'GIGGLE!', 'Floating in a sunbeam', ['The teeniest Claude character of all!', 'She is smaller than a cookie!', 'Her sparkle rays wiggle when she is happy.'],
    (cx, cy, s, a) => { const y = cy + Math.sin(frame * 0.06) * 6 * s - (a > 0 ? Math.abs(Math.sin(a * 14)) * 14 * s : 0); sparkle(cx, y, 46 * s, OR, frame * 0.01 + (a > 0 ? a * 6 : 0), 10 * s);
      circle(cx, y, 24 * s, CREAM); eyes(cx, y - 2 * s, s, 9, 7); blush(cx, y + 8 * s, s, 14); smile(cx, y + 6 * s, s, 5, DARK, a > 0 ? 1 : 0);
      if (a > 0) for (let i = 0; i < 3; i++) text('♥', cx + (i - 1) * 30 * s, y - 50 * s - a * 30 * s, 18 * s, '#ff80ab', 'center', false); }],
  ['gloop', 'Claude Gloop', '🟠', 'JIGGLE!', 'A big orange puddle on Moon Base', ['He is King Gloop\'s orange cousin!', 'He wears a sparkle instead of a crown.', 'When he jiggles, he sounds like a bowl of jelly.'],
    (cx, cy, s, a) => { const j = a > 0 ? Math.sin(a * 30) * 0.15 : Math.sin(frame * 0.05) * 0.03; ctx.save(); ctx.translate(cx, cy + 40 * s); ctx.scale(1 + j, 1 - j);
      const g = ctx.createLinearGradient(0, -80 * s, 0, 0); g.addColorStop(0, OR2); g.addColorStop(1, OR3); ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-50 * s, 0); ctx.bezierCurveTo(-56 * s, -70 * s, 56 * s, -70 * s, 50 * s, 0); ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.ellipse(-22 * s, -44 * s, 8 * s, 12 * s, -0.4, 0, 7); ctx.fill();
      eyes(0, -32 * s, s, 14, 7); smile(0, -22 * s, s, 9, DARK, a > 0 ? 0.8 : 0); ctx.restore();

    (cx, cy, s, a) => { const S = s * 2.2, by = cy + 44 * s, b = robot(cx, by, S, [OR2, CREAM, DARK, '#fff', OR, OR]);
      tri(b.x - 1 * S, b.y + 4 * S, b.x + 8 * S, b.y + 1 * S, b.x + 1 * S, b.y - 9 * S, OR2); tri(b.x + b.w + 1 * S, b.y + 4 * S, b.x + b.w - 8 * S, b.y + 1 * S, b.x + b.w - 1 * S, b.y - 9 * S, OR2);
      eyes(cx, b.ey, S * 0.5, 12, 8, '#a5d6a7'); ctx.strokeStyle = '#fff'; ctx.lineWidth = 0.8 * S; ctx.beginPath(); for (const d of [-1, 1]) for (const k of [-2, 2]) { ctx.moveTo(cx + d * 8 * S, b.ey + 7 * S); ctx.lineTo(cx + d * 17 * S, b.ey + 7 * S + k * S); } ctx.stroke();

    (cx, cy, s, a) => { const k = 1 + (a > 0 ? Math.sin(a * Math.PI) * 0.25 : 0), y = cy + Math.sin(frame * 0.05) * 8 * s; ctx.save(); ctx.translate(cx, y); ctx.scale(k, k);
      ctx.fillStyle = 'rgba(217,119,87,.25)'; ctx.beginPath(); ctx.ellipse(0, 0, 62 * s, 70 * s, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(232,149,111,.92)'; ctx.beginPath(); ctx.moveTo(-40 * s, 50 * s); ctx.lineTo(-40 * s, -10 * s); ctx.arc(0, -10 * s, 40 * s, Math.PI, 0); ctx.lineTo(40 * s, 50 * s);
      for (let i = 0; i < 4; i++) { const x0 = 40 * s - i * 20 * s; ctx.quadraticCurveTo(x0 - 5 * s, (i % 2 ? 60 : 40) * s + Math.sin(frame * 0.1 + i) * 3 * s, x0 - 20 * s, 50 * s); } ctx.closePath(); ctx.fill();

      if (a > 0) text('BOO! (that means HI!)', cx, cy - 80 * s, 20 * s, '#fff'); }],
  ['dino', 'Claude Dino', '🦖', 'ROAR "HELLO!"', 'Dino Moon, a long long time ago', ['His roar sounds exactly like "HELLO!"', 'The spikes on his back are little sparkles.', 'He only eats orange things: carrots, oranges and orange crayons (just kidding about the crayons).'],

      for (let i = 0; i < 4; i++) sparkle(cx - 38 * s + i * 16 * s, y - 52 * s - Math.sin(i) * 4 * s, 7 * s, GOLD, i);
      if (a > 0) text('HELLO!!', cx + 70 * s, y - 100 * s, 26 * s + a * 6 * s, '#fff'); }],
