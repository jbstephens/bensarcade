<canvas id="c" width="960" height="540"></canvas>
<script>
// 🏠 THE COZY ROOMS HOUSE (💡 Ben's idea: rooms that make you feel better!)
// A warm hallway with 7 doors: Rainbow Room, Sammy Room, Bubble Bath, Star Ceiling, Happy Drawing, Thank-You Mailbox, Pillow Fort.
// Soothing only: no timers, no losing. All sounds VERY soft (master 0.18). Trophy 'cozyRooms' after visiting all 7 rooms.
// Save: localStorage.cozyRooms. Robo, Dusty and Sammy drawings copied exactly from Robo: The Beginning / Cozy Cats Corner.
const C = document.getElementById('c'), ctx = C.getContext('2d'), W = 960, H = 540;
let frame = 0;
const PRINTING = false;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (copied from Dusty's Cozy Corner) ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }

  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);

function rrect(x, y, w, h, r) {

  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(110,60,50,.75)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);

// ---------- 🤖 Robo + 🧹 Dusty (copied exactly from Robo: The Beginning) ----------
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');

  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)

    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();

    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');

    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);
      const ey = -29.5;
      if (o.dizzy) {                                   // 💫 swirly dizzy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.1;
        for (const ex of [-3, 9]) { ctx.beginPath(); for (let a = 0; a < 12; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.3, ey + Math.sin(a + t * 0.2) * a * 0.3); ctx.stroke(); }
      } else if (pose === 'happy' || o.happy) {        // ^ ^ happy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5, talk = o.mouth ? 0.85 + 0.15 * Math.sin(t * 0.6) : 1;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      if (o.mouth) { ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, -25); ctx.lineTo(1 + 2 + Math.abs(Math.sin(t * 0.5)) * 3, -25); ctx.stroke(); }
      ctx.restore();

  if (o.wave) {                                        // 👋 a little waving hand
    const a = Math.sin(t * 0.3) * 0.5;
    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();
  }
  ctx.restore();
  if (o.dizzy) for (let i = 0; i < 3; i++) { const a = t * 0.08 + i * 2.1; star(x + Math.cos(a) * 22 * s / 2.6, y - 118 * s / 2.6 + Math.sin(a) * 6, 7, '#ffd54f', a); }
}
// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,
// a fluffy pink duster on a springy stick, a twirly brush skirt and two little wheels.
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');                  // the twirly brush skirt
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else if (o.sleep) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(1.5, -18.5, 2.6, 0.3, Math.PI - 0.3); ctx.stroke(); }   // sleepy eye (from Dusty's Cozy Corner)
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;   // the springy duster
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// ---------- 🐱 Sammy (copied from Cozy Cats Corner: brown tabby, brown eyes), curled up in a cozy donut ----------
const CATS = {
  sammy: { fur: '#8d6e63', dark: '#4e342e', belly: '#e2c8a4', ear: '#ffb3c6', eye: '#a8641f', line: '#3e2a22', stripes: true, eyeRim: '#fff4dc' },
};
function catLine(c) { ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function drawSleepCat(c, t) {                          // curled up in a cozy donut, tail wrapped around
  const br = Math.sin(t * 0.05) * 1.2;
  ctx.fillStyle = c.fur; catLine(c); ctx.beginPath(); ctx.ellipse(0, -14, 26 + br, 15 + br * 0.6, 0, 0, 7); ctx.fill(); ctx.stroke();
  if (c.cap) { ctx.save(); ctx.beginPath(); ctx.ellipse(0, -14, 26 + br, 15 + br * 0.6, 0, 0, 7); ctx.clip(); ellipse(-4, -29, 24, 8, c.cap); ctx.restore(); catLine(c); ctx.beginPath(); ctx.ellipse(0, -14, 26 + br, 15 + br * 0.6, 0, 0, 7); ctx.stroke(); }

  if (c.spots) { for (const [sx, sy, r] of [[-14, -20, 2.6], [-4, -24, 2.4], [-10, -10, 2.2], [4, -17, 2]]) circle(sx, sy, r, c.dark); }
  if (c.shine) ellipse(-6, -24, 12, 3.5, 'rgba(255,255,255,.2)');
  ctx.strokeStyle = c.line; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-24, -10); ctx.quadraticCurveTo(-10, 2, 18, -2); ctx.stroke();
  ctx.strokeStyle = c.cap || c.fur; ctx.lineWidth = 7; ctx.stroke();
  if (c.stripes || c.spots) { ctx.strokeStyle = c.dark; ctx.setLineDash([4, 6]); ctx.stroke(); ctx.setLineDash([]); }
  for (const ex of [8, 20]) { ctx.fillStyle = c.cap || c.fur; catLine(c); ctx.beginPath(); ctx.moveTo(ex - 5, -22); ctx.lineTo(ex, -34); ctx.lineTo(ex + 6, -22); ctx.closePath(); ctx.fill(); ctx.stroke(); }
  ctx.fillStyle = c.fur; catLine(c); ctx.beginPath(); ctx.ellipse(15, -16, 13, 10, 0, 0, 7); ctx.fill(); ctx.stroke();
  if (c.cap) { ctx.save(); ctx.beginPath(); ctx.ellipse(15, -16, 13, 10, 0, 0, 7); ctx.clip(); ctx.fillStyle = c.cap; ctx.fillRect(0, -30, 30, 12); ctx.restore(); catLine(c); ctx.beginPath(); ctx.ellipse(15, -16, 13, 10, 0, 0, 7); ctx.stroke(); }

function drawSammy(x, y, s = 2, t = frame) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ellipse(0, 0, 28, 5, 'rgba(0,0,0,.15)'); drawSleepCat(CATS.sammy, t); ctx.restore(); }
// ---------- VERY soft sounds (one quiet volume knob, 0.18) ----------
let actx = null, master = null, soundOn = true, musicOn = true;
function audio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.18; master.connect(actx.destination); }
    if (actx.state !== 'running') actx.resume();
  } catch (_) {}
  return actx;
}
function softNote(f, d = 0.6, v = 0.05, when = 0) {      // a gentle, round "bell" note
  if (!soundOn) return; const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);

const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.6, 0.04); }
function chime() { softNote(784, 1.4, 0.035); softNote(1175, 1.6, 0.018, 0.05); }
function voice(line, rate = 0.8) {
  try { if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line); u.rate = rate; u.pitch = 1.05; u.volume = 0.75; speechSynthesis.speak(u); } catch (_) {}
}
// 🎶 soft music-box lullaby (tiny sine notes, a little echo note under each one)
const LULLABY = [659, 784, 880, 784, 659, 587, 523, 0, 587, 659, 784, 659, 587, 523, 440, 0, 523, 659, 784, 1047, 880, 784, 659, 0, 587, 659, 587, 523, 494, 523, 0, 0];
let mt = 0;
function music() {
  if (!musicOn || frame % 42 !== 0) return;
  const n = LULLABY[mt++ % LULLABY.length]; if (!n) return;
  const quiet = (window.speechSynthesis && speechSynthesis.speaking) ? 0.5 : 1;
  softNote(n, 1.8, 0.022 * quiet); if (mt % 4 === 1) softNote(n / 2, 2.4, 0.012 * quiet);

// 🐱 a soft, low, rumbly purr: low filtered noise that gently pulses ~24 times a second
let purrN = null;
function purr(on) {

      src.buffer = buf; src.loop = true; f.type = 'lowpass'; f.frequency.value = 180; f.Q.value = 0.8;
      am.gain.value = 0.5; lfo.frequency.value = 24; depth.gain.value = 0.5; lfo.connect(depth); depth.connect(am.gain);
      env.gain.value = 0; src.connect(f); f.connect(am); am.connect(env); env.connect(master); src.start(); lfo.start();

function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle (from Tiger's Starlight Adventure)

}
// ---------- 🐱 awake Sammy (copied exactly from Cozy Cats Corner) ----------
function drawTail(c, t, up, pose) {
  const sw = Math.sin(t * 0.08) * (pose === 'happy' ? 16 : 9);
  ctx.strokeStyle = c.line; ctx.lineCap = 'round'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(-18, -22);
  if (up) ctx.bezierCurveTo(-34, -30, -34 + sw * 0.4, -52, -26 + sw, -62);
  else ctx.bezierCurveTo(-36, -22, -40, -34 + sw * 0.5, -44 + sw * 0.3, -46 + sw * 0.6);
  ctx.stroke();
  ctx.strokeStyle = c.cap || c.fur; ctx.lineWidth = 8; ctx.stroke();
  if (c.stripes || c.spots) { ctx.strokeStyle = c.dark; ctx.lineWidth = 8; ctx.setLineDash(c.spots ? [3, 9] : [4, 6]); ctx.stroke(); ctx.setLineDash([]); }
}
function drawLeg(c, x1, y1, x2, y2) {
  ctx.strokeStyle = c.line; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = c.fur; ctx.lineWidth = 5.5; ctx.stroke();
  circle(x2, y2, 3.8, c.paws || c.fur);
}
function drawLegs(c, pose, t) {
  let a = 0, b = 0;
  if (pose === 'walk') { a = Math.sin(t * 0.32) * 7; b = -a; }
  if (pose === 'run') { a = Math.sin(t * 0.5) * 11; b = -a; }
  const legs = pose === 'jump' || pose === 'karate' ? [[-12, -4, 6], [12, 4, 6], [-6, -6, 8], [16, 6, 8]]
             : pose === 'pounce' ? [[-14, -8, 4], [-8, -10, 4], [16, 12, 0], [22, 14, 0]]

  for (const [lx, dx, lift] of legs) drawLeg(c, lx, -16, lx + dx * 0.6, -3 - lift);
}
function drawHead(c, hx, hy, t, eyesShut, mouthOpen, grumpy) {
  for (const ex of [-8, 6]) {                          // ears

    for (let i = 0; i < 10; i++) { const x = 340 + i * 31, y = 338 + Math.sin(i * 0.9) * 6, tw = 0.6 + 0.4 * Math.sin(frame * 0.05 + i * 1.7);   // ✨ fairy lights inside
      glow(x, y, 22, BULBS[i % 5], tw * e); circle(x, y, 5, BULBS[i % 5]); }
    const rx = 400 + (1 - e) * 560;
    if (e > 0.8) { ctx.save(); ctx.globalAlpha = 0.35 * (e - 0.8) * 5; const bg = ctx.createRadialGradient(rx + 30, 400, 10, rx + 140, 340, 160); bg.addColorStop(0, 'rgba(255,250,200,1)'); bg.addColorStop(1, 'rgba(255,250,200,0)');
      ctx.fillStyle = bg; ctx.beginPath(); ctx.moveTo(rx + 28, 396); ctx.lineTo(rx + 220, 320); ctx.lineTo(rx + 220, 430); ctx.closePath(); ctx.fill(); ctx.restore(); }   // 🔦 flashlight beam
    drawRobo(rx, 438, { s: 1.8, pose: walking ? 'walk' : 'sit', happy: !walking });
    roundRect(rx + 18, 392, 16, 9, 3, '#ffd54f');                                               // the flashlight
    drawDusty(rx + 80 + (1 - e) * 60, 438, { s: 1.6, pose: walking ? 'walk' : 'idle', happy: !walking });
    if (walking) drawCat('sammy', rx + 150 + (1 - e) * 120, 438, { s: 1.1, pose: 'walk', face: -1 }); else drawSammy(rx + 160, 436, 1.3);
    if (!walking && frame % 50 === 0) floatHeart(380 + Math.random() * 200, 330);
  }
  for (const i of order.slice(2)) { const p = pf.pieces.find(q => q.slot === i); if (p) drawPiece(p, FORT_SLOTS[i].x, FORT_SLOTS[i].y, FORT_SLOTS[i].w, FORT_SLOTS[i].h); }
  for (const p of pf.pieces) if (p.slot < 0) { const s = pieceSize(p); if (pf.grab === p) glow(p.x, p.y, 110, 'rgba(255,255,220,1)', 0.5); drawPiece(p, p.x - s.w / 2, p.y - s.h / 2, s.w, s.h); }
  title('🧸 Pillow Fort Room');
  text(pf.done ? '🏰 Fort finished!' : `🧸 ${placed} / 6`, 480, 90, 24, '#fffbe6');
  if (talkT < 360) bubble(300, 120, 380, talk, 'left');
  if (pf.done > 220) button(760, 470, 180, 58, '🧸 Build again', '#9fd49a', startFort, 21);
  backBtn();
}
function fortDown(x, y) {
  for (let i = pf.pieces.length - 1; i >= 0; i--) { const p = pf.pieces[i], s = pieceSize(p);
    if (p.slot < 0 && Math.abs(x - p.x) < s.w / 2 + 10 && Math.abs(y - p.y) < s.h / 2 + 10) { pf.grab = p; pf.gx = x - p.x; pf.gy = y - p.y; pf.pieces.push(pf.pieces.splice(i, 1)[0]); softNote(523, 0.3, 0.025); return; } }
}
function fortMove(x, y) { if (pf.grab) { pf.grab.x = clamp(x - pf.gx, 40, W - 40); pf.grab.y = clamp(y - pf.gy, 60, H - 30); } }
function fortUp() {
  const p = pf && pf.grab; if (!p) return; pf.grab = null;
  let best = -1, bd = 1e9;
  FORT_SLOTS.forEach((s, i) => { if (s.k !== p.k || pf.pieces.some(q => q.slot === i)) return; const d = Math.hypot(p.x - (s.x + s.w / 2), p.y - (s.y + s.h / 2)); if (d < bd) { bd = d; best = i; } });
  if (best >= 0 && bd < 130) { p.slot = best; softNote(PENT[pf.pieces.filter(q => q.slot >= 0).length % 6], 0.8, 0.04); floatHeart(p.x, p.y - 30); }
}
// ---------- moving between rooms ----------
const STARTS = { rainbow: startRainbow, sammy: startSammy, bubble: startBubble, stars: startStars, draw: startDraw, thanks: startThanks, fort: startFort };
const SCREENS = { rainbow: rainbowScreen, sammy: sammyScreen, bubble: bubbleScreen, stars: starsScreen, draw: drawScreen, thanks: thanksScreen, fort: fortScreen };
function openRoom(id) { purr(false); fx = []; screen = id; STARTS[id](); visit(id); softNote(523, 0.6, 0.03); softNote(784, 0.8, 0.025, 0.12); }
function goHome() { purr(false); try { speechSynthesis.cancel(); } catch (_) {} screen = 'home'; fx = []; talk = ''; }
function loop() {
  frame++; talkT++; btns = []; music();
  if (screen === 'home') home(); else SCREENS[screen]();
  drawFx();
  button(W - 214, 14, 96, 50, musicOn ? '🎵 On' : '🎵 Off', musicOn ? '#9ccfa6' : '#c0a8a0', () => { musicOn = !musicOn; }, 19);
  button(W - 110, 14, 96, 50, soundOn ? '🔉 On' : '🔇 Off', soundOn ? '#9cb8d8' : '#c0a8a0', () => { soundOn = !soundOn; if (!soundOn) { purr(false); try { speechSynthesis.cancel(); } catch (_) {} } else if (screen === 'sammy' && sm.mode === 'lap') purr(true); }, 19);
  if (toastT > 0) { toastT--; ctx.save(); ctx.globalAlpha = clamp(toastT / 40, 0, 1); roundRect(260, 70, 440, 52, 24, '#fff3c4'); ctx.font = 'bold 22px "Trebuchet MS", Arial'; ctx.fillStyle = '#8a5a2b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toast, 480, 97); ctx.restore(); }
  requestAnimationFrame(loop);
}
function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function tap(e) {
  const [x, y] = pos(e);
  audio();
  if (!saidHello && screen === 'home') { saidHello = true; voice("Welcome to the Cozy Rooms House, Ben! Pick any door you like."); }
  // the sound / music buttons and Back always win; inside a room, drawing and dragging come before room buttons
  for (const b of btns) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); return; }
  if (screen === 'bubble') bubbleTap(x, y);
  else if (screen === 'stars') starsTap(x, y);
  else if (screen === 'draw') drawDown(x, y);
  else if (screen === 'fort') fortDown(x, y);
  else if (screen === 'sammy') { sm.drag = true; sammyDrag(x, y); }

}
let fingerDown = false;
C.addEventListener('pointerdown', e => { fingerDown = true; try { C.setPointerCapture(e.pointerId); } catch (_) {} tap(e); });
C.addEventListener('pointermove', e => {
  if (!fingerDown) return; const [x, y] = pos(e);
  if (screen === 'draw') drawMove(x, y);
  else if (screen === 'fort') fortMove(x, y);
  else if (screen === 'sammy' && sm.drag) sammyDrag(x, y);
  else if (screen === 'bubble') bubbleTap(x, y);
});
function release() { fingerDown = false; if (dr) dr.cur = null; if (sm) sm.drag = false; if (screen === 'fort') fortUp(); }
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });
loop();
</script>
