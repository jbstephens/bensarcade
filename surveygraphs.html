<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📊 Family Survey &amp; Graphs</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #dff4ff 0 36px, #cdeeff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(26px, 4.6vw, 50px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #2b7bd9; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.sel { outline: 5px solid #1e6bff; outline-offset: 2px; }
  .hide { display: none !important; }
  .b-go { background: #8ef08e; } .b-back { background: #9be3ff; } .b-print { background: #8ef08e; }
  .b-print2 { background: #ffb347; } .b-pink { background: #ffc2d6; } .b-purple { background: #d7c2ff; }
  .b-yellow { background: #ffe066; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- home ---------- */
  #home { flex-direction: column; overflow: hidden; }
  #hHead { padding: 8px 10px 2px; position: relative; }
  #hHead h1 { padding: 0 150px; }
  #hHead p { margin: 2px 0 4px; font-size: clamp(15px, 2.1vw, 21px); font-weight: bold; text-align: center; }
  #hBack { position: absolute; left: 10px; top: 8px; min-height: 46px; font-size: 17px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 14px; align-content: start; }
  .sec { grid-column: 1 / -1; margin: 6px 4px -4px; font-size: 26px; font-weight: bold; color: #fff;
    -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .card { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 8px 6px; cursor: pointer;
    box-shadow: 0 6px 0 #2b7bd9; display: flex; flex-direction: column; align-items: center; gap: 4px; text-align: center; }
  .card .pics { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 64px; align-items: center; }
  .card b { font-size: 17px; line-height: 1.15; }
  .card small { font-size: 14px; color: #555; }
  .card.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .card:active { transform: scale(.96); }
  .card.make { background: #fff6c2; } .card.saved { background: #e8ffe8; } .card.prt { background: #ffe9f3; }
  .pic { display: inline-flex; align-items: center; justify-content: center; line-height: 1; }
  .pic svg { width: 100%; height: 100%; display: block; }
  /* ---------- sheet preview ---------- */
  #sheet { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 30px); max-height: 100%; aspect-ratio: 850 / 1100; max-width: 100%; }
  #wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #2b7bd9; }
  .side { width: min(42vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #tabs .btn { font-size: 16px; line-height: 1.15; }
  #tabs .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #certNames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #certNames .btn { font-size: 15px; min-height: 46px; padding: 4px; }
  #certNames .btn.on { background: #ffe066; border-color: #ff3d6e; }
  /* ---------- station (voting) ---------- */
  #station { flex-direction: column; padding: 8px 10px; gap: 6px; }
  .topbar { display: flex; gap: 8px; align-items: center; }
  .topbar .btn { min-height: 48px; font-size: 17px; flex: none; }
  .qbox { flex: 1; min-width: 0; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 4px 10px;
    font-size: clamp(20px, 3.4vw, 36px); font-weight: bold; text-align: center; line-height: 1.1; }
  #names { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
  #names .lbl { font-size: 18px; font-weight: bold; }
  .nm { font-size: 17px; min-height: 48px; padding: 4px 10px; background: #fff; }
  .nm.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; transform: scale(1.08); }
  .nm.done { background: #c8f7c5; }
  #answers { flex: 1; min-height: 0; display: grid; gap: 8px; grid-template-columns: repeat(3, 1fr); grid-auto-rows: 1fr; }
  .ans { background: #fff; border: 5px solid #333; border-radius: 18px; cursor: pointer; display: grid;
    grid-template-columns: auto 1fr; grid-template-rows: auto 1fr; gap: 0 8px; padding: 6px 8px; min-height: 0; overflow: hidden;
    box-shadow: 0 6px 0 var(--c, #333); align-items: center; }
  .ans:active { transform: translateY(3px); }
  .ans.sel { outline: 5px solid #1e6bff; outline-offset: 2px; }
  .ans .pic { grid-row: 1 / 3; width: min(15vh, 110px) !important; height: min(15vh, 110px) !important; font-size: min(12vh, 88px) !important; }
  .ans .lab { font-size: clamp(16px, 2.4vh, 24px); font-weight: bold; display: flex; justify-content: space-between; gap: 6px; }
  .ans .lab i { font-style: normal; background: var(--c); color: #fff; -webkit-text-stroke: 1px #333; border: 3px solid #333;
    border-radius: 12px; padding: 0 8px; min-width: 40px; text-align: center; }
  .ans .tal { height: 100%; min-height: 30px; }
  .ans .tal svg { width: 100%; height: 100%; display: block; }
  .ans .who { font-size: 13px; color: #555; grid-column: 2; }
  #stBottom { display: flex; gap: 8px; justify-content: center; }
  #stBottom .btn { min-height: 52px; }
  #stMsg { flex: 1; font-size: 18px; font-weight: bold; background: #fffbe0; border: 4px solid #333; border-radius: 14px;
    padding: 4px 10px; display: flex; align-items: center; justify-content: center; text-align: center; }
  /* tally pencil strokes */
  .tm { stroke: #555; stroke-width: 5; stroke-linecap: round; fill: none; }
  .tm.new { stroke-dasharray: 80; stroke-dashoffset: 80; animation: draw .35s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* ---------- results ---------- */
  #results { flex-direction: row; padding: 10px; gap: 10px; }
  #gBox { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #views { display: flex; gap: 8px; }
  #views .btn { flex: 1; font-size: 18px; min-height: 50px; }
  #views .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #graph { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 16px; box-shadow: 0 8px 0 #2b7bd9; overflow: hidden; }
  #graph svg { width: 100%; height: 100%; display: block; }
  #winner { font-size: clamp(20px, 3vw, 30px); font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 6px; min-height: 54px; display: flex; align-items: center; justify-content: center; }
  #winner.boom { animation: boom .6s; background: #fff59d; }
  @keyframes boom { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
  /* ---------- maker ---------- */
  #maker { flex-direction: column; padding: 8px 12px; gap: 6px; overflow: hidden; }
  #mkQ { font-size: clamp(22px, 3.4vw, 36px); }
  .mkRow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .mkRow > b { font-size: 18px; width: 100%; }
  .mkRow .btn { font-size: 16px; min-height: 44px; padding: 3px 10px; }
  .mkRow .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #mkPics { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(86px, 1fr)); gap: 6px; align-content: start; padding: 4px; }
  .pk { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 2px; cursor: pointer; text-align: center; font-size: 13px; font-weight: bold; }
  .pk .pic { width: 52px; height: 52px; font-size: 42px; }
  .pk.on { background: #ffe066; border-color: #ff3d6e; transform: scale(1.06); }
  /* ---------- pop-up (math talk etc.) ---------- */
  #pop { position: fixed; inset: 0; background: rgba(20, 40, 80, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 14px; }
  #pop.on { display: flex; }
  #popCard { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 14px 18px; width: 100%; max-width: 900px;
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; }
  #popCard h2 { margin: 0; font-size: clamp(22px, 3.4vw, 36px); line-height: 1.15; }
  #popAns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #popAns .btn { min-width: 110px; min-height: 80px; font-size: 34px; }
  #popAns .btn .pic { width: 60px; height: 60px; font-size: 50px; }
  #popAns .btn.right { background: #8ef08e; } #popAns .btn.wrong { background: #ffc2d6; opacity: .6; }
  #popMsg { font-size: 22px; font-weight: bold; min-height: 30px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #hMute { position: absolute; right: 10px; top: 8px; min-height: 46px; font-size: 20px; }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #sheet, #results { flex-direction: column; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    .side { width: 100%; max-height: 44vh; }
    #answers { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-height: 560px) { .btn { min-height: 44px; font-size: 16px; padding: 4px 6px; } .pHelp { font-size: 14px; } .nm { min-height: 40px; } }
  /* ---------- PRINT: only the printed sheets ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact;
      break-after: page; page-break-after: always; }
    #printArea svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="hHead">
    <button class="btn b-back" id="hBack">⬅️ Back</button>
    <button class="btn" id="hMute">🔊 Sound on</button>
    <h1 class="big">📊 FAMILY SURVEY &amp; GRAPHS</h1>
    <p>Ask your family a fun question, count the votes, and draw a real graph! Tap a survey.</p>
  </div>
  <div id="grid"></div>
</div>

<div id="sheet" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div class="side">
    <div class="pTitle" id="shTitle"></div>
    <button class="btn b-go" id="shStart">🗳️ Do the survey on screen!</button>
    <div id="tabs"></div>
    <div class="pHelp" id="shHelp"></div>
    <div id="certNames" class="hide"></div>
    <button class="btn b-print" id="shPrint">🖨️ Print it!</button>
    <button class="btn b-print2" id="shPrintAll">🖨️ Print the whole set</button>
    <button class="btn b-back" id="shBack">⬅️ Back to surveys</button>
  </div>
</div>

<div id="station" class="screen">
  <div class="topbar">
    <button class="btn b-back" id="stBack">⬅️ Back</button>
    <div class="qbox" id="stQ"></div>
    <button class="btn b-yellow" id="stSay">🔊 Read it</button>
  </div>
  <div id="names"></div>
  <div id="answers"></div>
  <div id="stBottom">
    <button class="btn b-pink" id="stUndo">↩️ Undo</button>
    <div id="stMsg"></div>
    <button class="btn b-go" id="stGraph">📊 Make the graph!</button>
  </div>
</div>

<div id="results" class="screen">
  <div id="gBox">
    <div id="views">
      <button class="btn" data-v="bar">📊 Bar graph</button>
      <button class="btn" data-v="pic">😀 Pictograph</button>
      <button class="btn" data-v="pie">🥧 Pie chart</button>
    </div>
    <div id="graph"></div>
  </div>
  <div class="side">
    <div class="pTitle" id="rsTitle"></div>
    <div id="winner">🥁 Tap the drum!</div>
    <button class="btn b-yellow" id="rsDrum">🥁 Who won?</button>
    <button class="btn b-purple" id="rsMath">🧠 Math talk!</button>
    <div class="two">
      <button class="btn b-go" id="rsSave">💾 Save it</button>
      <button class="btn b-print" id="rsPrint">🖨️ Print my graph</button>
    </div>
    <button class="btn b-print2" id="rsReport">🖨️ My Results Report</button>
    <button class="btn b-magic" id="rsCert">🏅 Graph Genius prize!</button>
    <div class="two">
      <button class="btn b-pink" id="rsMore">🗳️ More votes</button>
      <button class="btn b-back" id="rsHome">🏠 All surveys</button>
    </div>
  </div>
</div>

<div id="maker" class="screen">
  <div class="topbar">
    <button class="btn b-back" id="mkBack">⬅️ Back</button>
    <div class="qbox" id="mkQ"></div>
    <button class="btn b-yellow" id="mkSay">🔊</button>
    <button class="btn b-magic" id="mkSilly">🎲 Silly!</button>
  </div>
  <div class="mkRow" id="mkA"></div>
  <div class="mkRow" id="mkB"></div>
  <div class="mkRow" id="mkC"></div>
  <div class="mkRow"><b id="mkCount"></b></div>
  <div id="mkPics"></div>
  <div class="topbar">
    <div class="pHelp" style="flex:1" id="mkHelp">Pick 2 to 6 answer pictures.</div>
    <button class="btn b-go" id="mkDone">✅ Make my survey!</button>
  </div>
</div>

<div id="pop"><div id="popCard">
  <h2 id="popQ"></h2>
  <div id="popAns"></div>
  <div id="popMsg"></div>
  <div class="two">
    <button class="btn b-yellow" id="popSay">🔊 Say it again</button>
    <button class="btn b-purple" id="popNext">➡️ Next question</button>
  </div>
  <button class="btn b-back" id="popClose">👍 Done</button>
</div></div>
<div id="toast"></div>
<div id="printArea"></div>
<script>
// ===================== 📊 Family Survey & Graphs =====================
// Ben asks his family fun questions, makes tally marks, and draws real graphs.
// Save: localStorage 'surveyGraphs' = { results: [...], custom: [...], finished, printed, mathRight, cert }.
// Trophy 'surveyGraphs' for the first finished survey or the first print. ?test=1 never writes to localStorage.
const TEST = /[?&]test=1\b/.test(location.search || '');
const $ = id => document.getElementById(id);
const NAMES = ['Ben', 'Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
const COLORS = ['#ff5252', '#2979ff', '#00c853', '#ffab00', '#aa00ff', '#ff6d00'];
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// ----- character art, copied from tradingcards.html (charArt) -----
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="1"' : '') + '>' + txt + '</text>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
function ngonD(x, y, r, n, rot) { const pts = []; for (let k = 0; k < n; k++) { const a = (rot || 0) + k * Math.PI * 2 / n; pts.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } return polyD(pts); }
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');

// ----- faces -----
// kinds: cute, dot, angry, happy, sleepy, glow, pixel, dizzy, mad (glow + brows)
function eyes(x, y, gap, r, kind, col) {
  col = col || '#1b1b2f'; let s = '';
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    if (kind === 'happy') s += aL('M' + _n(ex - r) + ' ' + _n(y + r * .3) + ' Q' + _n(ex) + ' ' + _n(y - r * 1.1) + ' ' + _n(ex + r) + ' ' + _n(y + r * .3), OL, Math.max(2, r * .45));
    else if (kind === 'dot') s += aC(ex, y, r * .6, col, 0) + aC(ex - r * .2, y - r * .2, r * .2, '#fff', 0);
    else if (kind === 'pixel') s += aR(ex - r * .8, y - r * .8, r * 1.6, r * 1.6, 0, '#fff', OL, 1.5) + aR(ex - r * .4, y - r * .3, r * .8, r * .8, 0, col, 0);
    else if (kind === 'glow' || kind === 'mad') s += aE(ex, y, r * .75, r, col, OL, 1.5) + aC(ex - r * .2, y - r * .35, r * .25, '#fff', 0);
    else if (kind === 'dizzy') s += aL('M' + _n(ex - r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex + r * .7) + ' ' + _n(y + r * .7) + ' M' + _n(ex + r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex - r * .7) + ' ' + _n(y + r * .7), OL, Math.max(2, r * .4));
    else {
      s += aE(ex, y, r * .85, r, '#fff', OL, 1.8) + aC(ex + sx * r * .1, y + r * .15, r * .55, col, 0) + aC(ex + sx * r * .1 - r * .2, y - r * .1, r * .2, '#fff', 0);

    s += picSVG(a, 14 + ps / 2, cy, ps) + tx(24 + ps, cy + 8, a.n, fitSize(a.n, labW - ps - 24, 22), { a: 'start' });
    s += line(labW, y + 10, labW, y + rowH - 10, '#9ab', 2);
    const m = o.blank ? 10 : cnt[i];
    for (let j = 0; j < m; j++) {
      const sx = labW + 14 + r + j * (r * 2 + 4);
      if (o.blank) s += smiley(sx, cy, r, null, true);
      else { k++; if (k <= shown + .001) s += smiley(sx, cy, r, COLORS[i % 6]); }
    }
  });
  s += smiley(W / 2 - 92, H - keyH / 2, 16, '#ffd740') + tx(W / 2 - 66, H - keyH / 2 + 8, '= 1 person', 24, { a: 'start' });

}
// ----- 🥧 pie chart -----
function pieChart(ans, cnt, W, H, prog) {
  const tot = total(cnt), R = Math.min(H * .44, W * .27), cx = R + 24, cy = H / 2;
  let s = '';
  if (!tot) return aC(cx, cy, R, '#eee', OL, 3) + tx(cx, cy + 8, 'No votes yet!', 28);
  const p = ease(prog === undefined ? 1 : prog); let ang = -Math.PI / 2;
  cnt.forEach((c, i) => {
    if (!c) return;
    const sweep = c / tot * Math.PI * 2 * p, a2 = ang + sweep;
    if (c === tot) s += aC(cx, cy, R, COLORS[i % 6], OL, 3);
    else if (sweep > .001) {
      const x1 = cx + Math.cos(ang) * R, y1 = cy + Math.sin(ang) * R, x2 = cx + Math.cos(a2) * R, y2 = cy + Math.sin(a2) * R;
      s += '<path d="M' + _n(cx) + ' ' + _n(cy) + ' L' + _n(x1) + ' ' + _n(y1) + ' A' + _n(R) + ' ' + _n(R) + ' 0 ' + (sweep > Math.PI ? 1 : 0) + ' 1 ' + _n(x2) + ' ' + _n(y2) + ' Z" fill="' + COLORS[i % 6] + '" stroke="' + OL + '" stroke-width="3" stroke-linejoin="round"/>';
    }
    if (p > .98) { const mid = ang + sweep / 2, lx = cx + Math.cos(mid) * R * .62, ly = cy + Math.sin(mid) * R * .62; s += tx(lx, ly + 12, String(c), 34, { f: '#fff', s: OL, sw: 3 }); }
    ang = a2;
  });
  const lx = cx + R + 40, rowH = Math.min(80, (H - 20) / ans.length);
  ans.forEach((a, i) => {
    const y = (H - rowH * ans.length) / 2 + rowH * i + rowH / 2, ps = Math.min(rowH * .8, 56);
    s += box(lx, y - 21, 42, 42, 10, COLORS[i % 6], OL, 3) + tx(lx + 21, y + 10, String(cnt[i]), 28, { f: '#fff', s: OL, sw: 2 }) + picSVG(a, lx + 58 + ps / 2, y, ps) +
      tx(lx + 68 + ps, y + 8, a.n, fitSize(a.n, W - lx - 74 - ps, 26), { a: 'start' });
  });
  return s;
}

function renderAnswers(fresh) {
  const c = counts({ a: cur.a, votes });
  $('answers').innerHTML = cur.a.map((a, i) => '<div class="ans' + (i === ansSel ? ' sel' : '') + '" data-i="' + i + '" style="--c:' + COLORS[i % 6] + '">' + picHTML(a, 80) +
    '<div class="lab"><span>' + esc(a.n) + '</span><i>' + c[i] + '</i></div><div class="tal">' + tallySVG(c[i], i === fresh) + '</div>' +
    '</div>').join('');
  $('answers').querySelectorAll('.ans').forEach(e => e.addEventListener('click', () => vote(+e.dataset.i)));
}
function vote(i) {
  audio();
  if (!cur || !cur.a[i]) return;
  if (!voter) { SFX.oops(); stMsg('👆 First tap your NAME up top!'); say('First tap your name!'); return; }
  let who = voter;
  if (who === 'Friend') who = 'Friend' + (friendCount() ? ' ' + (friendCount() + 1) : '');
  else votes = votes.filter(v => v.who !== who);
  votes.push({ who, a: i });
  ansSel = i; voter = null;
  const n = counts({ a: cur.a, votes })[i];
  SFX.pencil(n % 5 === 0);
  renderNames(); renderAnswers(i);
  stMsg('✏️ ' + who + ' picked ' + cur.a[i].n + '! Who is next?');
  say(who + ' picked ' + cur.a[i].n + '!');
}
function undo() {
  audio(); if (!votes.length) { SFX.oops(); stMsg('No votes to undo yet!'); return; }
  const v = votes.pop(); SFX.click(); renderNames(); renderAnswers(-1); stMsg('↩️ Took back ' + v.who + "'s vote.");
}

// ----- 📊 results: growing graph, drumroll, math talk -----
let anim = 0, drumT = 0, resultCounted = {};
function showResults(noDrum) {
  if (!votes.length) { SFX.oops(); stMsg('Ask somebody first! Tap a name.'); say('Ask somebody first!'); return; }
  hush(); show('results');
  $('rsTitle').textContent = cur.q + ' (' + votes.length + (votes.length === 1 ? ' vote)' : ' votes)');
  autoSave();
  const key = String(resId);
  if (!resultCounted[key]) { resultCounted[key] = 1; S.finished++; save(); winTrophy('first survey'); }
  setView(gView, true);
  clearTimeout(drumT);
  if (!noDrum) { $('winner').textContent = '📊 Look at it grow...'; drumT = setTimeout(drum, 1700); }
  else $('winner').textContent = winnerText();
}
const curCounts = () => counts({ a: cur.a, votes });
function setView(v, grow) {
  gView = GRAPHS[v] ? v : 'bar';
  $('views').querySelectorAll('.btn').forEach(b => b.classList.toggle('on', b.dataset.v === gView));
  cancelAnimationFrame(anim);
  const c = curCounts(), t0 = performance.now(), draw = p => { $('graph').innerHTML = '<svg viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet">' +
    '<g transform="translate(10 10)">' + GRAPHS[gView](cur.a, c, 980, 600, p) + '</g></svg>'; };
  if (!grow) return draw(1);
  SFX.grow();
  const step = now => { const p = Math.min(1, (now - t0) / 1400); draw(p); if (p < 1) anim = requestAnimationFrame(step); };
  draw(0); anim = requestAnimationFrame(step);
}
function winners() { const c = curCounts(), m = Math.max(...c); return cur.a.filter((a, i) => c[i] === m && m > 0); }
function winnerText() { const w = winners(); return w.length === 1 ? '🎉 ' + w[0].n.toUpperCase() + '! 🎉' : '🤝 A TIE: ' + w.map(a => a.n).join(' & ') + '!'; }
function drum() {
  clearTimeout(drumT); audio(); SFX.drumroll(); hush();
  const el = $('winner'); el.classList.remove('boom'); el.textContent = '🥁 The winner is...';
  say('The winner is...');
  drumT = setTimeout(() => {
    const w = winners();
    el.textContent = winnerText(); void el.offsetWidth; el.classList.add('boom'); SFX.tada();
    say(w.length === 1 ? w[0].n + '!' : "It's a tie! " + w.map(a => a.n).join(' and ') + '!');
  }, 2000);
}
function autoSave() {
  const rec = { id: resId || Date.now(), sid: cur.id, q: cur.q, a: cur.a.map(a => Object.assign({}, a)), votes: votes.map(v => ({ who: v.who, a: v.a })), date: new Date().toISOString().slice(0, 10) };
  resId = rec.id;
  const k = S.results.findIndex(r => r.id === rec.id);
  if (k >= 0) S.results[k] = rec; else S.results.push(rec);
  while (S.results.length > 30) S.results.shift();
  return save();
}

// ----- 🧠 math talk: questions about the graph, read out loud, tap the answer -----
const rnd = n => Math.floor(Math.random() * n);
const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--) { const j = rnd(i + 1); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
function numOpts(right) {
  const set = [right]; let tries = 0;
  while (set.length < 4 && tries++ < 50) { const v = right + (rnd(7) - 3); if (v >= 0 && set.indexOf(v) < 0) set.push(v); }
  return shuffle(set).map(v => ({ label: String(v), ok: v === right }));
}
function makeMath(ans, cnt) {
  const qs = [], n = ans.length, tot = total(cnt), up = i => ans[i].n.toUpperCase();
  const max = Math.max(...cnt), min = Math.min(...cnt);
  for (let i = 0; i < n; i++) qs.push({ q: 'How many people chose ' + up(i) + '?', why: cnt[i] + ' people chose ' + ans[i].n + '.', opts: numOpts(cnt[i]) });
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) if (cnt[i] > cnt[j]) {
    const d = cnt[i] - cnt[j];
    qs.push({ q: 'How many MORE people chose ' + up(i) + ' than ' + up(j) + '?', why: cnt[i] + ' take away ' + cnt[j] + ' is ' + d + '!', opts: numOpts(d) });
  }
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (cnt[i] && cnt[j]) {
    qs.push({ q: 'How many people chose ' + up(i) + ' or ' + up(j) + ' all together?', why: cnt[i] + ' plus ' + cnt[j] + ' is ' + (cnt[i] + cnt[j]) + '!', opts: numOpts(cnt[i] + cnt[j]) });
  }
  qs.push({ q: 'How many people did we ask in all?', why: 'We asked ' + tot + ' people!', opts: numOpts(tot) });
  const picOpts = (good) => shuffle(ans.map((a, i) => ({ pic: a, ok: good(i) })).filter((o, k, all) => o.ok || all.filter(x => !x.ok).indexOf(o) < 3));
  if (cnt.filter(c => c === max).length === 1) qs.push({ q: 'Which answer got the MOST votes?', why: 'The tallest bar wins!', opts: picOpts(i => cnt[i] === max) });
  if (cnt.filter(c => c === min).length === 1) qs.push({ q: 'Which answer got the FEWEST votes?', why: 'The shortest bar has the fewest!', opts: picOpts(i => cnt[i] === min) });
  for (let i = 0; i < n; i++) for (let j = i + 1; j < n; j++) if (cnt[i] !== cnt[j]) {
    qs.push({ q: 'Did more people choose ' + up(i) + ' or ' + up(j) + '?', why: 'Compare the two bars!', opts: [{ pic: ans[i], ok: cnt[i] > cnt[j] }, { pic: ans[j], ok: cnt[j] > cnt[i] }] });
  }
  return qs;
}
let mathQ = null, mathLast = '', mathDone = false;
function nextMath() {
  const qs = makeMath(cur.a, curCounts());
  let q = qs[rnd(qs.length)];
  for (let t = 0; t < 8 && qs.length > 1 && q.q === mathLast; t++) q = qs[rnd(qs.length)];
  mathQ = q; mathLast = q.q; mathDone = false;
  $('popQ').textContent = '🧠 ' + q.q;
  $('popMsg').textContent = '';
  $('popAns').innerHTML = q.opts.map((o, k) => '<button class="btn" data-k="' + k + '">' + (o.pic ? picHTML(o.pic, 60) + '<br><span style="font-size:16px">' + esc(o.pic.n) + '</span>' : o.label) + '</button>').join('');
  $('popAns').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => answerMath(+b.dataset.k, b)));
  say(q.q);
}
function answerMath(k, btn) {
  if (!mathQ || mathDone) return;
  audio();
  if (mathQ.opts[k].ok) {
    mathDone = true; btn.classList.add('right'); SFX.ding();
    S.mathRight++; save();
    $('popMsg').textContent = '✅ YES! ' + mathQ.why + ' (Math stars: ' + S.mathRight + ' ⭐)';
    say('Yes! ' + mathQ.why);
  } else {
    btn.classList.add('wrong'); SFX.oops();
    $('popMsg').textContent = '🤔 Not quite. Look at the graph and try again!';
    say('Not quite. Try again!');
  }
}
function openMath() { audio(); SFX.click(); $('pop').classList.add('on'); nextMath(); }
function closePop() { $('pop').classList.remove('on'); hush(); }

// ----- ✏️ make your own survey (no typing: silly sentence parts + pictures) -----
const mk = { a: 0, b: 0, c: 0, picks: [] };
const mkQuestion = () => MK_A[mk.a] + ' ' + MK_B[mk.b] + ' ' + MK_C[mk.c] + '?';
function openMaker() { renderMaker(); show('maker'); say("Let's make a survey! Pick the words, then pick the answer pictures."); }
function partRow(id, list, key, label) {
  $(id).innerHTML = '<b>' + label + '</b>' + list.map((w, i) => '<button class="btn' + (mk[key] === i ? ' on' : '') + '" data-i="' + i + '">' + esc(w) + '</button>').join('');
  $(id).querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => { SFX.click(); mk[key] = +b.dataset.i; renderMaker(); }));
}
function renderMaker() {
  $('mkQ').textContent = mkQuestion();
  partRow('mkA', MK_A, 'a', '1️⃣ Start:'); partRow('mkB', MK_B, 'b', '2️⃣ Silly word:'); partRow('mkC', MK_C, 'c', '3️⃣ Thing:');
  $('mkCount').textContent = '4️⃣ Answer pictures: ' + mk.picks.length + ' of 6 picked';
  $('mkPics').innerHTML = PICKS.map((a, i) => '<div class="pk' + (mk.picks.indexOf(i) >= 0 ? ' on' : '') + '" data-i="' + i + '">' + picHTML(a, 52) + '<br>' + esc(a.n) + '</div>').join('');
  $('mkPics').querySelectorAll('.pk').forEach(e => e.addEventListener('click', () => togglePick(+e.dataset.i)));
  $('mkHelp').textContent = mk.picks.length < 2 ? 'Pick 2 to 6 answer pictures.' : 'Looking great! Tap ✅ when you are ready.';
}
function togglePick(i) {
  const k = mk.picks.indexOf(i);
  if (k >= 0) mk.picks.splice(k, 1);
  else if (mk.picks.length >= 6) { SFX.oops(); toast('6 answers is the most!'); return; }
  else mk.picks.push(i);
  SFX.pop(); const top = $('mkPics').scrollTop; renderMaker(); $('mkPics').scrollTop = top;
}
function sillyMaker() {
  mk.a = rnd(MK_A.length); mk.b = rnd(MK_B.length); mk.c = rnd(MK_C.length);
  mk.picks = shuffle(PICKS.map((_, i) => i)).slice(0, 4);
  SFX.sparkle(); renderMaker(); say(mkQuestion());
}
function finishMaker() {
  if (mk.picks.length < 2) { SFX.oops(); toast('Pick at least 2 answer pictures!'); say('Pick at least 2 answer pictures!'); return null; }
  const sv = { id: 'c' + Date.now(), q: mkQuestion(), a: mk.picks.map(i => Object.assign({}, PICKS[i])), custom: true };
  S.custom.unshift(sv); while (S.custom.length > 20) S.custom.pop(); save();
  mk.picks = []; SFX.tada(); openSurvey(sv);
  return sv;
}

// ===================== buttons + keys =====================
function leave() {
  hush(); cancelAnimationFrame(anim); clearTimeout(drumT);
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
const tap = (id, fn) => $(id).addEventListener('click', e => { audio(); fn(e); try { e.currentTarget.blur(); } catch (_) {} });
$('grid').addEventListener('click', e => { const c = e.target.closest && e.target.closest('.card'); if (!c) return; audio(); homeSel = [...$('grid').querySelectorAll('.card')].indexOf(c); markHome(); homeAct(c.dataset.act); });
tap('hBack', leave);
tap('shStart', () => { SFX.click(); startStation(); });
tap('shPrint', printCurrent);
tap('shPrintAll', printAllTabs);
tap('shBack', sheetBack);
tap('stBack', () => { SFX.click(); hush(); openSheet({ sv: cur, tabs: BLANK_TABS, kind: 'survey', start: true, back: 'home' }); });
tap('stSay', () => say(cur.q));
tap('stUndo', undo);
tap('stGraph', () => showResults());
$('views').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => { audio(); SFX.click(); setView(b.dataset.v, true); }));
tap('rsDrum', drum);
tap('rsMath', openMath);
tap('rsSave', () => { SFX.sparkle(); toast(autoSave() ? '💾 Saved! Find it on the first page.' : (TEST ? '🧪 Test mode: not saved.' : '💾 Saved for now!')); });
tap('rsPrint', () => { SFX.click(); openSheet({ sv: cur, cnt: curCounts(), tabs: RESULT_TABS, kind: gView, back: 'results' }); });
tap('rsReport', () => { SFX.click(); openSheet({ sv: cur, cnt: curCounts(), tabs: RESULT_TABS, kind: 'report', back: 'results' }); });
tap('rsCert', () => { SFX.tada(); openSheet({ tabs: [['cert', '🏅 Certificate']], kind: 'cert', back: 'results' }); say('You are a Graph Genius!'); });
tap('rsMore', () => { SFX.click(); clearTimeout(drumT); startStation(); });
tap('rsHome', () => { SFX.click(); clearTimeout(drumT); cancelAnimationFrame(anim); goHome(); });
tap('mkBack', goHome);
tap('mkSay', () => say(mkQuestion()));
tap('mkSilly', sillyMaker);
tap('mkDone', finishMaker);
tap('popSay', () => mathQ && say(mathQ.q));
tap('popNext', () => { SFX.click(); nextMath(); });
tap('popClose', closePop);
tap('hMute', () => { muted = !muted; $('hMute').textContent = muted ? '🔇 Sound off' : '🔊 Sound on'; if (muted) hush(); else SFX.click(); });

function gridCols(sel) { const els = $(sel).children; if (!els.length) return 1; const y = els[0].offsetTop; let n = 0; for (const e of els) { if (e.offsetTop !== y) break; n++; } return Math.max(1, n); }
window.addEventListener('keydown', e => {
  const k = e.key;
  if ($('pop').classList.contains('on')) {
    if (k === 'Escape') closePop();
    else if (/^[1-4]$/.test(k)) { const b = $('popAns').querySelectorAll('.btn')[+k - 1]; if (b) answerMath(+k - 1, b); }
    else if (k === 'Enter' || k === ' ') nextMath();
    e.preventDefault(); return;
  }
  if (view === 'home') {
    const cards = $('grid').querySelectorAll('.card'), cols = 4;
    if (k === 'ArrowRight') homeSel = Math.min(cards.length - 1, homeSel + 1);
    else if (k === 'ArrowLeft') homeSel = Math.max(0, homeSel - 1);
    else if (k === 'ArrowDown') homeSel = Math.min(cards.length - 1, homeSel + cols);
    else if (k === 'ArrowUp') homeSel = Math.max(0, homeSel - cols);
    else if (k === 'Enter' || k === ' ') { audio(); if (cards[homeSel]) homeAct(cards[homeSel].dataset.act); e.preventDefault(); return; }
    else if (k === 'Escape') { leave(); return; }
    else return;
    markHome(); if (cards[homeSel] && cards[homeSel].scrollIntoView) cards[homeSel].scrollIntoView({ block: 'nearest' }); e.preventDefault();
  } else if (view === 'sheet') {
    if (k === 'Escape') sheetBack();
    else if (k === 'p' || k === 'P') printCurrent();
    else if ((k === 'Enter' || k === ' ') && sheetCtx.start) startStation();
    else if (k === 'ArrowRight' || k === 'ArrowLeft') {
      const t = sheetCtx.tabs, i = t.findIndex(x => x[0] === sheetCtx.kind);
      sheetCtx.kind = t[(i + (k === 'ArrowRight' ? 1 : t.length - 1)) % t.length][0]; SFX.click(); renderSheet();
    } else return;
    e.preventDefault();
  } else if (view === 'station') {
    const n = cur.a.length, cols = n <= 4 ? 2 : 3;
    if (/^[1-7]$/.test(k)) pickVoter(NAMES[+k - 1]);
    else if (k === 'ArrowRight') ansSel = (ansSel + 1) % n;
    else if (k === 'ArrowLeft') ansSel = (ansSel + n - 1) % n;
    else if (k === 'ArrowDown') ansSel = Math.min(n - 1, ansSel + cols);
    else if (k === 'ArrowUp') ansSel = Math.max(0, ansSel - cols);
    else if (k === 'Enter' || k === ' ') { vote(ansSel); e.preventDefault(); return; }
    else if (k === 'Backspace') undo();
    else if (k === 'g' || k === 'G') showResults();
    else if (k === 'Escape') $('stBack').click();
    else return;
    $('answers').querySelectorAll('.ans').forEach((a, i) => a.classList.toggle('sel', i === ansSel)); e.preventDefault();
  } else if (view === 'results') {
    if (k === 'Escape') goHome();
    else if (k === 'p' || k === 'P') printSheets([buildSheet(gView, cur, curCounts())]);
    else if (k === 'ArrowRight' || k === 'ArrowLeft') { const v = ['bar', 'pic', 'pie'], i = v.indexOf(gView); setView(v[(i + (k === 'ArrowRight' ? 1 : 2)) % 3], true); }
    else if (k === 'm' || k === 'M') openMath();
    else if (k === 'Enter' || k === ' ') drum();
    else return;
    e.preventDefault();
  } else if (view === 'maker') {
    if (k === 'Escape') goHome(); else if (k === 'Enter') finishMaker(); else return;
    e.preventDefault();
  }
});
renderHome();
</script>
