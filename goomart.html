<!DOCTYPE html>
<html lang="en">
<head>

<title>King Gloop's Royal Goo Mart</title>

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #1f0a3a; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #f7f0ff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #e3dcea; border-bottom: 2px solid #c9bfd6; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #7c4dff; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #311b92, #7c4dff 55%, #ffb300); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #1a0033; }
  #logo .big i { color: #ffd740; font-style: normal; }
  #logo .small { font-size: 15px; color: #e1bee7; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }

  #wallet .lbl { font-size: 13px; }

  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }

  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: #ffc400; color: #4e2600; }
  .tag.new { background: #00c853; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }

  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #ede7f6; color: #6a1b9a; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #7b1fa2; color: #fff; box-shadow: 0 4px 0 #4a148c; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #f3ecfa; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #6a1b9a; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }

  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #ede7f6; box-shadow: 0 4px 0 #b39ddb; }

  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(74,20,140,.15); }

  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #311b92; }

  .bigbtn.gray { background: #9e9e9e; box-shadow: 0 5px 0 #616161; }

  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #311b92; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #6a1b9a; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #4a148c; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(43,15,69,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(43,15,69,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #f3e5f5; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #f3e5f5; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #6a1b9a; }
  #printBox .pbTip { font-size: 20px; color: #4a148c; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 👑 KING GLOOP'S ROYAL GOO MART: buy royal paper stuff with pretend Royal Goo Drops,
// then pick which orders to PRINT on your printer. Nothing prints by itself.
// Save: localStorage.gooMart = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'gooMart';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function goodrop(x, y, r, fill = '#7c4dff', stroke) {    // a goo drop (round bottom, pointy top)
  ctx.beginPath(); ctx.moveTo(x, y - r * 1.6); ctx.bezierCurveTo(x + r * 0.5, y - r * 0.9, x + r, y - r * 0.5, x + r, y);
  ctx.arc(x, y, r, 0, Math.PI); ctx.bezierCurveTo(x - r, y - r * 0.5, x - r * 0.5, y - r * 0.9, x, y - r * 1.6); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : 2; ctx.stroke(); }
  if (!OUT) { ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.ellipse(x - r * 0.4, y - r * 0.3, r * 0.22, r * 0.34, -0.4, 0, 7); ctx.fill(); }
}
function gem(x, y, r, fill) { poly([[x, y - r], [x + r * 0.8, y], [x, y + r], [x - r * 0.8, y]], fill, OUT ? null : 'rgba(0,0,0,.35)', 1.5); if (!OUT) poly([[x, y - r], [x + r * 0.3, y - r * 0.2], [x, y], [x - r * 0.3, y - r * 0.2]], 'rgba(255,255,255,.5)'); }
function blobPath(x, y, w, h, rt, rb) {             // the Gloop shape: big round top corners, small bottom corners
  rt = Math.min(rt, w / 2, h / 2); rb = Math.min(rb, w / 2, h / 2);
  ctx.beginPath(); ctx.moveTo(x + rt, y); ctx.lineTo(x + w - rt, y); ctx.arcTo(x + w, y, x + w, y + rt, rt); ctx.lineTo(x + w, y + h - rb); ctx.arcTo(x + w, y + h, x + w - rb, y + h, rb);
  ctx.lineTo(x + rb, y + h); ctx.arcTo(x, y + h, x, y + h - rb, rb); ctx.lineTo(x, y + rt); ctx.arcTo(x, y, x + rt, y, rt); ctx.closePath();
}
function blob(x, y, w, h, rt, rb, fill, stroke, lw) { blobPath(x, y, w, h, rt, rb); ctx.fillStyle = fillOf(fill); ctx.fill(); if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); } }
function shine(x, y, rx, ry, rot) { if (OUT) return; ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, rot || 0, 0, 7); ctx.fill(); }
// 👑 KING GLOOP: copied from drawGloop() in Robo Jump 3 (his FRIENDLY look: happy eyes, smile, pink cheeks, gold crown).
// x, y = top-left of his 100 x 90 body (the crown sticks up 22 more). o: s (scale), wob, line (outline), blink
function drawKing(x, y, s = 1, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  const wob = o.wob || 0, L = o.line, body = o.gold ? '#ffd740' : '#7c4dff';
  blob(-wob / 2, wob, 100 + wob, 90 - wob, 45, 14, body, L, 3);
  shine(25, 22 + wob, 12, 7, -0.5);
  poly([[25, 6 + wob], [25, wob - 22], [37.5, wob - 4], [50, wob - 22], [62.5, wob - 4], [75, wob - 22], [75, 6 + wob]], '#ffd740', L ? '#c79100' : null, 2.5);
  if (!OUT) { circ(37.5, wob - 1, 2.6, '#e53935'); circ(50, wob + 1, 3, '#2979ff'); circ(62.5, wob - 1, 2.6, '#00c853'); }
  for (const ex of [32, 68]) {
    if (o.blink) { ctx.strokeStyle = '#000'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(ex, 32 + wob, 8, 0.2, Math.PI - 0.2); ctx.stroke(); continue; }
    circ(ex, 34 + wob, 11, '#fff', OUT ? '#222' : null); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + 2, 35 + wob, 5, 0, 7); ctx.fill(); if (!OUT) circ(ex + 4, 33 + wob, 2, '#fff');
  }
  ctx.fillStyle = OUT ? '#fff' : '#311b92'; ctx.beginPath(); ctx.arc(50, 54 + wob, 16, 0.1, Math.PI - 0.1); ctx.closePath(); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.stroke(); }
  if (!OUT) { circ(22, 54 + wob, 6, 'rgba(255,128,171,.6)'); circ(78, 54 + wob, 6, 'rgba(255,128,171,.6)'); }
  ctx.restore();
}
const KINGat = (cx, by, hgt, o) => { const s = hgt / 112; drawKing(cx - 50 * s, by - 90 * s, s, o); };   // by CENTER-x and BOTTOM-y, height incl. crown
// 🎩 DUKE GOOGOOL: copied from drawDuke() in Robo Jump 3. (x, y) = top-left of a ~70 x 150 box (hat spikes go to -8)
function drawDuke(x, y, s = 1, o = {}) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); const wob = o.wob || 0;
  poly([[4, 150], [14, 70], [56, 70], [66, 150]], '#212121');
  blob(10, 40 + wob, 50, 110 - wob, 25, 10, '#00c853', OUT ? '#222' : null);
  for (let k = 0; k < 3; k++) circ(35, 92 + k * 16, 4, '#212121');
  shine(22, 56 + wob, 6, 9, -0.3);
  rr(14, 138, 12, 12, 4, '#00a152'); rr(44, 138, 12, 12, 4, '#00a152');
  ctx.fillStyle = OUT ? '#222' : '#212121'; ctx.fillRect(2, 36 + wob, 66, 7);
  const hat = [[14, 38 + wob], [16, 4 + wob]]; for (let k = 0; k < 5; k++) hat.push([19 + k * 8, -8 + wob], [23 + k * 8, 4 + wob]); hat.push([56, 38 + wob]);

function mazeGrid(cols, rows, seed) {
  let r = seed; const rnd = () => (r = (r * 16807) % 2147483647) / 2147483647;
  const walls = []; for (let i = 0; i < cols * rows; i++) walls.push([1, 1, 1, 1]);           // top, right, bottom, left
  const seen = new Array(cols * rows).fill(false), stack = [0]; seen[0] = true;
  while (stack.length) {
    const c = stack[stack.length - 1], x = c % cols, y = Math.floor(c / cols), nb = [];
    if (y > 0 && !seen[c - cols]) nb.push([c - cols, 0, 2]); if (x < cols - 1 && !seen[c + 1]) nb.push([c + 1, 1, 3]);
    if (y < rows - 1 && !seen[c + cols]) nb.push([c + cols, 2, 0]); if (x > 0 && !seen[c - 1]) nb.push([c - 1, 3, 1]);
    if (!nb.length) { stack.pop(); continue; }
    const [n, a, b] = nb[Math.floor(rnd() * nb.length)]; walls[c][a] = 0; walls[n][b] = 0; seen[n] = true; stack.push(n);
