<!DOCTYPE html>
<html lang="en">

<style>
  * { box-sizing: border-box; }

  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }

<script>
// 💜 BABY GLOOP'S TOY STORE: buy paper toys that really MOVE with pretend Gloop Bubbles,
// then pick which orders to PRINT on your printer. Nothing prints by itself.
// Save: localStorage.babyGloopStore = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'babyGloopStore';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {

  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }

}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();

}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {

  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }

}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;

  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();

}

function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
// 💜 Gloop Bubble (the pretend money): a shiny purple bubble, no emoji
function bubbleCoin(x, y, r) { circ(x, y, r, '#ce93d8', '#7b1fa2', Math.max(2, r * 0.12)); circ(x, y, r * 0.62, '#e1bee7'); ctx.save(); ctx.translate(x - r * 0.35, y - r * 0.38); ctx.rotate(-0.6); ctx.beginPath(); ctx.ellipse(0, 0, r * 0.28, r * 0.14, 0, 0, 7); ctx.fillStyle = '#fff'; ctx.fill(); ctx.restore(); txt('G', x + r * 0.05, y + r * 0.08, r * 0.9, OUT ? '#222' : '#6a1b9a'); }

// 💜 BABY GLOOP: copied from gloop() / babyGloop() in the Art Gallery (light purple goo + tiny gold crown).
// Drawn in the gallery's own units (body about 100 wide), centered at 0,0. o: col, crown, open, happy, eyeX, noCrown, line
const OL = '#1b1b2f';
const GLOOP_BODY = 'M-44 30 Q-50 -6 -31 -25 Q0 -50 31 -25 Q50 -6 44 30 Q34 38 25 30 Q16 41 6 31 Q-6 42 -15 31 Q-28 41 -44 30 Z';

function ballFill(c, cx, cy, r) {

  if (fill) { ctx.fillStyle = typeof fill === 'string' ? fillOf(fill) : fill; ctx.fill(); }

  ctx.fillStyle = OUT ? '#fff' : g; ctx.fill(); ctx.strokeStyle = OL; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();

  ell(x, b - h * .3, w * .09, w * .11, ballFill('#ff4081', x, b - h * .3, w * .1), OL, 1.2);
  ell(l + w * .2, b - h * .28, w * .06, w * .06, '#40c4ff', OL, 1); ell(l + w * .8, b - h * .28, w * .06, w * .06, '#69f0ae', OL, 1);
  if (!OUT) sparkle(l + w * .9, t + h * .1, w * .12, '#fff');
}
function gloopDraw(o = {}) {
  const P0 = o.king ? KING : BABY, c = o.col || P0.col;

  if (_bodyPath) { ctx.fillStyle = ballFill(c, 0, -6, 46); ctx.fill(_bodyPath); ctx.strokeStyle = OL; ctx.lineWidth = 2.8; ctx.stroke(_bodyPath); }

  if (!OUT) {

    ell(-22, -18, 9, 5, '#fff', 0, 0, -25 * Math.PI / 180, 0.75); ell(-32, -2, 3, 3, '#fff', 0, 0, 0, 0.6); ell(-14, -32, 2, 2, '#fff', 0, 0, 0, 0.7);

  // eyes (cuteEyes from the gallery)
  const ex0 = o.eyeX || 0;
  for (const sx of [-1, 1]) { const ex = ex0 + sx * 13, y = -6, r = 8.5;
    if (o.happy) { ctx.strokeStyle = OL; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(ex - r, y + r * .3); ctx.quadraticCurveTo(ex, y - r * 1.1, ex + r, y + r * .3); ctx.stroke(); continue; }

// ---------- 🔮 FORTUNE TELLER (cootie catcher). Folding is worked out in code, so each fortune hides under its number ----------
const FT = { cx: 425, cy: 545, h: 370 };
const ftP = (u, v) => [FT.cx + u * FT.h, FT.cy + v * FT.h];
const FT_COLORS = [['PURPLE', '#ab47bc'], ['GOLD', '#ffc400'], ['PINK', '#f06292'], ['BLUE', '#42a5f5']];
const FT_FORTUNES = ['You will jump like a frog today!', 'Your paper plane will fly SO far!', 'You will find something purple!', 'Give someone a high five!', 'You will laugh 10 times today!', 'Baby Gloop says: you are awesome!', 'Do a silly dance right now!', 'A big hug is coming your way!'];
function ftFold(pts) {                                // step 1: corners to center (printed side down); step 2: flip, corners to center again
  const cen = a => [a.reduce((s, p) => s + p[0], 0) / a.length, a.reduce((s, p) => s + p[1], 0) / a.length];
  let c = cen(pts); const sx = Math.sign(c[0]), sy = Math.sign(c[1]);
  pts = pts.map(([x, y]) => { const d = (sx * x + sy * y - 1); return [x - d * sx, y - d * sy]; });
  c = cen(pts);

// ---------- 🪜 MAGIC FLIP LADDER (Jacob's-ladder style: 5 double-thick tiles + 12 paper strips) ----------
// Tile face 150 long x 200 wide. Each joint J (between tile J and J+1): PINK middle strip = glued on TOP of tile J (left end),
// runs over it, down through the gap, under tile J+1, glued UNDER tile J+1 (right end). 2 BLUE side strips do the opposite.
const JL = { L: 150, W: 200, RIB: 310, SIDE: [[10, 40], [160, 190]], MID: [80, 120] };
function ladderTile(k, x, y) {
  const cols = ['#ce93d8', '#ffe082', '#80deea', '#f48fb1', '#a5d6a7'];
  rr(x, y, JL.L, JL.W, 0, cols[k]); rr(x, y + JL.W, JL.L, JL.W, 0, mixC(cols[k], '#ffffff', 0.4));
  txt('TOP', x + JL.L / 2, y + 60, 15, '#4a148c'); txt(String(k + 1), x + JL.L / 2, y + 140, 30, '#4a148c'); BGat(x + JL.L / 2, y + 113, 46);
  txt('BOTTOM', x + JL.L / 2, y + JL.W + 60, 13, '#4a148c'); txt(String(k + 1), x + JL.L / 2, y + JL.W + 140, 30, '#4a148c');
  const spot = (sx, sy, sh, col, lab) => { rr(sx, sy, 22, sh, 3, col, '#4a148c', 1.5); txt(lab, sx + 11, sy + sh / 2, 11, '#fff'); };
  const J = 'ABCD';
  if (k < 4) spot(x + 2, y + JL.MID[0], JL.MID[1] - JL.MID[0], '#e91e63', J[k]);                       // top, left end: pink middle of joint k
  if (k > 0) for (const s of JL.SIDE) spot(x + JL.L - 24, y + s[0], s[1] - s[0], '#1e88e5', J[k - 1]);   // top, right end: blue sides of joint k-1
  if (k < 4) for (const s of JL.SIDE) spot(x + 2, y + JL.W + s[0], s[1] - s[0], '#1e88e5', J[k]);         // bottom, left end: blue sides of joint k
  if (k > 0) spot(x + JL.L - 24, y + JL.W + JL.MID[0], JL.MID[1] - JL.MID[0], '#e91e63', J[k - 1]);    // bottom, right end: pink middle of joint k-1
  cutBox(x, y, JL.L, JL.W * 2); foldL(x, y + JL.W, x + JL.L, y + JL.W);
}

// ---------- 🎁 MEGA SET: GIANT TOY BOX (box + lid + 2-cubby toy shelf) + 6 toys ----------
const TB = { W: 340, H: 200, x0: 255, y0: 380 };      // open box: 340 x 340 base, 200 tall walls (cross-shaped net)
const TL = { W: 346, H: 60 };                         // lid: 6 bigger so it slips over the box
function wallDeco(cx, cy, rot, w, h, i) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(rot);
  if (i % 2 === 0) { BGat(-w * 0.22, h * 0.42, h * 0.75, { open: true }); txt('TOYS!', w * 0.2, -h * 0.05, Math.min(44, h * 0.3), '#6a1b9a'); }
  else { for (let k = 0; k < 3; k++) star(-w * 0.3 + k * w * 0.3, 0, h * 0.18, ['#ffd740', '#f06292', '#4fc3f7'][k], '#6a1b9a'); }
  ctx.restore();
}
function boxNet(x0, y0, W, H, base, wall, deco) {     // base at x0,y0 (W x W); walls H tall; tabs on the left and right walls
  rr(x0, y0, W, W, 0, base);
  const walls = [[x0, y0 - H, W, H, 0], [x0, y0 + W, W, H, Math.PI], [x0 - H, y0, H, W, -Math.PI / 2], [x0 + W, y0, H, W, Math.PI / 2]];
  walls.forEach(([x, y, w, h, r], i) => { rr(x, y, w, h, 0, wall); if (deco) wallDeco(x + w / 2, y + h / 2, r, i < 2 ? w : h, i < 2 ? h : w, i); });
  const T = 28;
  for (const [x, y, d] of [[x0 - H, y0, -1], [x0 + W, y0, -1], [x0 - H, y0 + W, 1], [x0 + W, y0 + W, 1]]) tapeTab(d < 0 ? [[x + 6, y - T], [x + H - 6, y - T], [x + H, y], [x, y]] : [[x, y], [x + H, y], [x + H - 6, y + T], [x + 6, y + T]], 'GLUE');
  ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath();
  const pts = [[x0, y0 - H], [x0 + W, y0 - H], [x0 + W, y0], [x0 + W + 6, y0 - T], [x0 + W + H - 6, y0 - T], [x0 + W + H, y0], [x0 + W + H, y0 + W], [x0 + W + H - 6, y0 + W + T], [x0 + W + 6, y0 + W + T], [x0 + W, y0 + W], [x0 + W, y0 + W + H],
    [x0, y0 + W + H], [x0, y0 + W], [x0 - 6, y0 + W + T], [x0 - H + 6, y0 + W + T], [x0 - H, y0 + W], [x0 - H, y0], [x0 - H + 6, y0 - T], [x0 - 6, y0 - T], [x0, y0]];
  pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); ctx.restore();
  foldL(x0, y0, x0 + W, y0); foldL(x0, y0 + W, x0 + W, y0 + W); foldL(x0, y0, x0, y0 + W); foldL(x0 + W, y0, x0 + W, y0 + W);
  for (const [x, y] of [[x0 - H, y0], [x0 + W, y0]]) foldL(x, y, x + H, y);
  for (const [x, y] of [[x0 - H, y0 + W], [x0 + W, y0 + W]]) foldL(x, y, x + H, y);
}

function balancePath(cx) {                           // symmetric outline: nose point at the bottom middle, arms swoop down to 2 coin ends
  const half = [[0, 560], [-30, 525], [-95, 480], [-175, 478], [-240, 520], [-275, 600], [-262, 700]], rad = d => d * Math.PI / 180;
  for (let d = -60; d <= 230; d += 10) half.push([-285 + 50 * Math.cos(rad(d)), 790 + 50 * Math.sin(rad(d))]);
  half.push([-345, 650], [-330, 540], [-260, 445], [-170, 400]);
  for (let d = 150; d <= 270; d += 6) half.push([145 * Math.cos(rad(d)), 320 + 145 * Math.sin(rad(d))]);
  const all = half.concat(half.slice(1, -1).reverse().map(([x, y]) => [-x, y]));
  ctx.beginPath(); all.forEach(([x, y], i) => i ? ctx.lineTo(cx + x, y) : ctx.moveTo(cx + x, y)); ctx.closePath();
}

});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! Gloop!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).cat !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price! Gloop gloop!');
};
$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'Gloop gloop! Welcome back, Ben! Your toys are in MY ORDERS.' : 'Gloop gloop! Welcome to my toy store, Ben! Every toy prints on paper and really MOVES!'; }, 50);
</script>
</body>
</html>
