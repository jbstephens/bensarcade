<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>😀 Emoji Maker</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 20%, #fff6b8 0 8%, transparent 9%), radial-gradient(circle at 80% 70%, #ffd1f0 0 7%, transparent 8%),
      repeating-linear-gradient(45deg, #fff3c4 0 40px, #ffe9a8 40px 80px);
    color: #2b2135; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; padding: 8px 10px 10px; gap: 8px; }
  /* ---------- top bar ---------- */
  #top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #top h1 { margin: 0 2px; font-size: clamp(20px, 2.2vw, 30px); color: #ffd93b; -webkit-text-stroke: 2px #2b2135; text-shadow: 3px 3px 0 #ff4fa3; letter-spacing: 1px; white-space: nowrap; }
  #nameBox { display: flex; align-items: center; background: #fff; border: 4px solid #2b2135; border-radius: 16px; padding: 0 8px; font-size: 24px; font-weight: bold; color: #9b59ff; }
  #nameIn { font: inherit; font-size: 21px; border: 0; outline: 0; width: 140px; color: #2b2135; padding: 8px 2px; background: transparent; user-select: text; -webkit-user-select: text; }
  .btn { font: inherit; font-size: 18px; font-weight: bold; border: 4px solid #2b2135; border-radius: 16px; padding: 5px 10px; cursor: pointer;
    box-shadow: 0 5px 0 #2b2135; color: #2b2135; min-height: 52px; background: #fff; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2b2135; }
  .b1 { background: #8ef08e; } .b2 { background: #9be3ff; } .b3 { background: #ffd180; } .b4 { background: #ffc2d6; } .b5 { background: #d1b3ff; }
  #top .btn { padding: 4px 7px; font-size: 16px; }
  .b-rand { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .hide { display: none !important; }
  /* ---------- main area ---------- */
  #main { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #left { flex: 1.05; min-width: 0; display: flex; flex-direction: column; gap: 8px; align-items: center; }
  #stageWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #stage { height: 100%; max-width: 100%; aspect-ratio: 1; background: radial-gradient(circle, #ffffff 0 55%, #e9f6ff); border: 5px solid #2b2135; border-radius: 28px;
    box-shadow: 0 7px 0 #ff4fa3; touch-action: none; display: block; }
  #anims { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  #anims .btn { font-size: 16px; min-height: 46px; padding: 3px 9px; border-radius: 14px; box-shadow: 0 4px 0 #2b2135; background: #e8eefc; }
  #anims .btn.on, .tab.on, .chip.on { background: #ffd93b; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  #right { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #partBar { background: #fff; border: 4px solid #2b2135; border-radius: 18px; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
  #pbTop { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #pbName { font-size: 19px; font-weight: bold; min-width: 90px; text-align: center; }
  #pbTop .btn { min-height: 46px; font-size: 20px; padding: 2px 10px; border-radius: 14px; box-shadow: 0 4px 0 #2b2135; }
  #pbHint { font-size: 18px; font-weight: bold; text-align: center; padding: 6px; }
  #pbCols { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .sw { width: 36px; height: 36px; border-radius: 50%; border: 3px solid #2b2135; cursor: pointer; flex: none; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #2b2135; }
  #tabs { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .tab { font-size: 18px; min-height: 50px; background: #e8eefc; padding: 3px 10px; }
  #shelf { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 4px solid #2b2135; border-radius: 18px; padding: 8px; }
  .shLbl { font-size: 18px; font-weight: bold; margin: 4px 2px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
  .chip { font: inherit; background: #f4f9ff; border: 3px solid #2b2135; border-radius: 16px; padding: 3px; cursor: pointer; display: flex; flex-direction: column; align-items: center; box-shadow: 0 3px 0 #2b2135; color: #2b2135; }
  .chip:active { transform: translateY(3px); box-shadow: none; }
  .chip svg { width: 100%; max-width: 76px; aspect-ratio: 1; display: block; pointer-events: none; }
  .chip span { font-size: 13px; font-weight: bold; text-align: center; line-height: 1.05; }
  .grid.chars { grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); }
  .grid.chars .chip svg { max-width: 100px; } .grid.chars .chip span { font-size: 16px; }
  .fsw { aspect-ratio: 1; width: 100%; max-width: 54px; border-radius: 50%; border: 3px solid #2b2135; cursor: pointer; justify-self: center; }
  .fsw.sel { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #ff3d6e; }
  .grid.cols { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }
  /* ---------- the stage pieces ---------- */
  #stage .pt { cursor: grab; }
  #stage [data-h] { cursor: pointer; }
  .selRing { fill: none; stroke: #ff3d6e; stroke-width: 3; stroke-dasharray: 9 7; pointer-events: none; animation: march 1s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -32; } }
  /* ---------- animations (stickers) ---------- */
  .an { transform-box: fill-box; transform-origin: 50% 50%; }
  .a-bounce { animation: bounce .9s ease-in-out infinite; }
  .a-wiggle { animation: wiggle .7s ease-in-out infinite; }
  .a-spin { animation: spin 2.4s linear infinite; }
  .a-pulse { animation: pulse 1s ease-in-out infinite; }
  .a-blink .blinky { transform-box: fill-box; transform-origin: 50% 50%; animation: blink 2.6s infinite; }
  @keyframes bounce { 0%, 100% { transform: translateY(0) scale(1.04, .96); } 50% { transform: translateY(-14%) scale(.97, 1.03); } }
  @keyframes wiggle { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 0%, 100% { transform: scale(.92); } 50% { transform: scale(1.08); } }
  @keyframes blink { 0%, 88%, 100% { transform: scaleY(1); } 93% { transform: scaleY(.08); } }
  /* ---------- pop-up boxes ---------- */
  .ov { position: fixed; inset: 0; background: rgba(43, 33, 53, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 10px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #2b2135; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1180px; max-height: 100%;
    display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3vw, 34px); }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px; }

  #msg svg { width: 74px; height: 74px; }
  #msg .gap { width: 30px; }
  #msg .ph { font-size: 22px; color: #8a8496; font-weight: bold; }
  #msg .cursor { width: 4px; height: 60px; background: #ff3d6e; animation: cur 1s steps(2) infinite; }
  @keyframes cur { 50% { opacity: 0; } }
  .keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 10px; }
  .key { font: inherit; background: linear-gradient(#ffffff, #e7ecf7); border: 4px solid #2b2135; border-radius: 18px; box-shadow: 0 6px 0 #2b2135; padding: 4px; cursor: pointer; display: flex; flex-direction: column; align-items: center; color: #2b2135; }
  .key:active { transform: translateY(5px); box-shadow: 0 1px 0 #2b2135; }
  .key svg { width: 84px; height: 84px; pointer-events: none; }
  .key span { font-size: 13px; font-weight: bold; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gal { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .gcard { background: #f4f9ff; border: 4px solid #2b2135; border-radius: 18px; padding: 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .gcard svg { width: 120px; height: 120px; }
  .gcard b { font-size: 16px; text-align: center; word-break: break-all; }
  .gcard .row { gap: 5px; } .gcard .btn { font-size: 15px; min-height: 42px; padding: 2px 6px; border-radius: 12px; box-shadow: 0 3px 0 #2b2135; }
  .empty { text-align: center; font-size: 22px; padding: 30px; font-weight: bold; }
  #askCard { max-width: 620px; text-align: center; }
  #askText { font-size: 26px; font-weight: bold; }
  .mode { background: #eceff1; } .mode.sel { background: #ffd93b; outline: 5px solid #ff3d6e; outline-offset: 2px; }
  #prGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .thumb { background: #fff; border: 5px solid #2b2135; border-radius: 16px; padding: 6px; cursor: pointer; box-shadow: 0 5px 0 #ffb74d; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding-top: 4px; }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(52vh, 600px); width: auto; max-width: 100%; border: 4px solid #2b2135; border-radius: 8px; background: #fff; }
  .hint { margin: 0; text-align: center; font-size: 19px; font-weight: bold; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fffbe8; border: 5px solid #2b2135;
    border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 90; transition: transform .25s; text-align: center; max-width: 92vw; pointer-events: none; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    body { overflow-y: auto; } #app { position: static; min-height: 100%; }
    #main { flex-direction: column; } #stageWrap { flex: none; height: 52vh; } #shelf { flex: none; height: 46vh; }
  }
  @media (max-width: 1150px) {
    #top h1 { font-size: 17px; letter-spacing: 0; -webkit-text-stroke: 1.5px #2b2135; text-shadow: 2px 2px 0 #ff4fa3; } #top .btn { font-size: 14px; padding: 3px 5px; min-height: 46px; }
    #nameIn { width: 110px; font-size: 18px; } #nameBox { font-size: 20px; padding: 0 5px; }
    .tab { font-size: 15px; padding: 3px 6px; min-height: 44px; } #anims .btn { font-size: 14px; padding: 3px 6px; }
    #pbTop .btn { padding: 2px 7px; font-size: 18px; } #pbName { min-width: 0; font-size: 16px; } .sw { width: 30px; height: 30px; }
  }
  @media (max-height: 640px) { .btn { min-height: 44px; font-size: 16px; } #top h1 { font-size: 22px; } #nameIn { font-size: 18px; width: 170px; } .tab { min-height: 42px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>

<body>
<div id="app">
  <div id="top">
    <h1>😀 EMOJI MAKER</h1>
    <label id="nameBox">:<input id="nameIn" type="text" maxlength="22" placeholder="name-it" autocomplete="off" autocapitalize="off" spellcheck="false">:</label>
    <button class="btn b-rand" id="bRandom">🎲 Random</button>
    <button class="btn b2" id="bUndo">↩️ Undo</button>
    <button class="btn b4" id="bNew">🆕 New</button>
    <button class="btn b1" id="bSave">💾 Save</button>
    <button class="btn b5" id="bKeys">⌨️ Keyboard</button>
    <button class="btn b3" id="bGal">🖼️ My Emojis</button>
    <button class="btn b2" id="bPrint">🖨️ Print</button>
  </div>
  <div id="main">
    <div id="left">
      <div id="stageWrap"><svg id="stage" viewBox="-170 -170 340 340" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="anims"></div>
    </div>
    <div id="right">
      <div id="partBar">
        <div id="pbHint">👆 Tap a part on your emoji to move it, spin it or make it bigger!</div>
        <div id="pbTop" class="hide">
          <span id="pbName"></span>
          <button class="btn" id="pSmall" title="smaller">➖</button><button class="btn" id="pBig" title="bigger">➕</button>
          <button class="btn" id="pRotL" title="turn">↺</button><button class="btn" id="pRotR" title="turn">↻</button>
          <button class="btn" id="pFlip" title="flip">🔁</button><button class="btn b4" id="pDel" title="take off">🗑️</button>
          <button class="btn b2" id="pDone">✅</button>
        </div>
        <div id="pbCols" class="hide"></div>
      </div>
      <div id="tabs">
        <button class="btn tab" data-t="face">😀 Face</button><button class="btn tab" data-t="eyes">👀 Eyes</button>
        <button class="btn tab" data-t="mouth">👄 Mouth</button><button class="btn tab" data-t="extra">🎩 Extras</button>
        <button class="btn tab" data-t="chars">🤖 Friends</button>
      </div>
      <div id="shelf"></div>
    </div>
  </div>
</div>
<div class="ov" id="keyBox"><div class="card">
  <h2>⌨️ My Emoji Keyboard</h2>
  <div id="msg"></div>
  <div class="row">
    <button class="btn b1" id="kRead">🔊 Read it!</button><button class="btn b2" id="kSpace">␣ Space</button>
    <button class="btn b3" id="kBack">⌫ Oops</button><button class="btn b4" id="kClear">🧹 Clear</button>
    <button class="btn b5" data-close="1">⬅️ Back to making</button>
  </div>
  <div class="scroll"><div class="keys" id="keys"></div></div>
</div></div>
<div class="ov" id="galBox"><div class="card">
  <h2 id="galTitle">🖼️ My Emojis</h2>
  <div class="scroll"><div class="gal" id="galList"></div></div>
  <div class="row"><button class="btn b5" data-close="1">⬅️ Back to making</button></div>
</div></div>
<div class="ov" id="prBox"><div class="card">
  <h2>🖨️ Print my emojis</h2>
  <div class="row"><button class="btn mode" id="prBW">⚫ Black &amp; White</button><button class="btn mode" id="prCol">🌈 Color</button></div>
  <p class="hint" id="prHint">Tap a page to see it big! Black &amp; White ones are for coloring in.</p>
  <div class="scroll"><div id="prGrid"></div>
  <div id="prView" class="hide"><div id="prBig"></div><p class="hint" id="prHow"></p></div></div>
  <div class="row"><button class="btn b1 hide" id="prPrint">🖨️ Print it!</button><button class="btn b3 hide" id="prBack">⬅️ All pages</button>
  <button class="btn b5" data-close="1">❌ Close</button></div>
</div></div>
<div class="ov" id="askBox"><div class="card" id="askCard"><div id="askText"></div><div class="row" id="askBtns"></div></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 😀 EMOJI MAKER: build your own emojis from SVG parts (face shape + color, eyes, mouth, extras),
// drag / resize / spin parts, animate them like stickers, name them, save up to 40,
// type silly sentences on My Emoji Keyboard, and print sticker sheets + posters (⚫ B&W / 🌈 Color).
// Save: localStorage 'emojiMaker' { list: [emoji...], cur: emoji, msg: [ids] } + 'emojiMakerColor'.
// An emoji = { id, n: name, f: face shape, c: face color, a: animation, p: [[partId, x, y, size, turn, color, flip], ...] }
// Trophies: trophy('emojiMaker') on the first saved emoji, trophy('emojiMaster') at 10 saved.
// =====================================================================
const $ = id => document.getElementById(id);
const SAVEKEY = 'emojiMaker', MAXE = 40;
// ---------- soft sounds (master volume 0.1) ----------
let actx = null, master = null;
function AC() {
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.1; master.connect(actx.destination); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function blip(f, when, len, type, vol) {
  try {
    const a = AC(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0), l = len || 0.2;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + l);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + l + 0.03);
  } catch (_) {}
}
function slide(f1, f2, when, len, type) {
  try {
    const a = AC(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0);
    o.type = type || 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.35, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.03);
  } catch (_) {}
}
const tune = (notes, gap) => notes.forEach((f, i) => blip(f, i * (gap || 0.13), 0.35));
const tada = () => tune([523, 659, 784, 1047, 1319], .12);
const pop = () => { const f = 520 + Math.random() * 300; blip(f, 0, .12); blip(f * 1.5, .05, .12); };
const boing = () => { slide(260, 780, 0, .25, 'triangle'); slide(780, 520, .22, .2); };
// ---------- voice ----------
function speak(line, rate, pitch) {
  try {
    if (!window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(String(line).replace(/[^\w\s!?.,']/g, ' ').replace(/\s+/g, ' ').trim());
    u.rate = rate || 0.95; u.pitch = pitch === undefined ? 1.15 : pitch; u.volume = 0.8;
    speechSynthesis.speak(u);
  } catch (_) {}
}
function toast(msg, ms) {
  const t = $('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), ms || 2600);
}
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function hasTrophy(id) { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}')[id]; } catch (_) { return false; } }
// =====================================================================
// 🎨 ART ENGINE (from Spy HQ): every shape goes through paint(), so the SAME drawing becomes a clean
// black-outline coloring page when LINE is on (⚫ B&W print). See-through bits (shines, blush) vanish in B&W.
// =====================================================================
const OL = '#2b2135', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '">' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';

  let s = BT(400, 70, 'My Emoji Stickers', 52, '#ff4fa3');
  const pastel = ['#fff4c2', '#e1f5ff', '#ffe1f0', '#e7ffd9', '#efe3ff', '#ffe9d6'];
  for (let j = 0; j < 12; j++) {
    const em = list[(k * 12 + j) % list.length], cx = 140 + (j % 3) * 260, cy = 200 + Math.floor(j / 3) * 214, t = ':' + nice(em) + ':';
    s += CUTC(cx, cy, 104) + (LINE ? '' : C(cx, cy, 97, pastel[j % pastel.length], 0)) + G(cx, cy - 16, .45, emojiInner(em)) + T(cx, cy + 72, t, fitSize(t, 18, 150), '#2b2135');
  }
  s += T(400, 975, 'Cut on the dashed circles, then tape or glue your stickers anywhere!', 20, '#555');
  return svgWrap(s);
}
function blankPage() {
  let s = BT(400, 70, 'Design Your Own Emojis!', 50, '#40c4ff');
  for (let j = 0; j < 6; j++) { const cx = 220 + (j % 2) * 360, cy = 250 + Math.floor(j / 2) * 270;
    s += C(cx, cy, 105, LINE ? '#fff' : '#fff4c2', OL, 5) + T(cx, cy + 140, ':________________:', 24, '#888'); }
  s += T(400, 975, 'Draw eyes, a mouth and silly extras. Then name them!', 22, '#555');
  return svgWrap(s);
}
function buildPages(posterEm) {
  const list = S.list.length ? S.list : [cur], nSheets = Math.ceil(list.length / 12);
  PAGES = [{ name: 'Big poster :' + nice(posterEm) + ':', build: () => posterPage(posterEm), how: 'One giant emoji! Hang it on your door.' }];
  for (let k = 0; k < nSheets; k++) PAGES.push({ name: 'Sticker sheet' + (nSheets > 1 ? ' ' + (k + 1) : ''), build: () => stickerPage(list, k), how: S.list.length ? '12 round stickers of your saved emojis. Cut on the dashed circles!' : '12 stickers of this emoji. Save more emojis to mix them up!' });
  PAGES.push({ name: 'Make your own', build: blankPage, how: 'Six empty faces to draw your own emojis with a pencil.' });
}
const pageSVG = p => { beginArt(!COLOR); return p.build(); };
function colorBtns() { $('prBW').classList.toggle('sel', !COLOR); $('prCol').classList.toggle('sel', COLOR); }
function renderPrints() { $('prGrid').innerHTML = PAGES.map((p, i) => '<div class="thumb" data-i="' + i + '">' + pageSVG(p) + '<b>' + esc(p.name) + '</b></div>').join(''); }
function showGrid() { prCur = -1; ['prView', 'prPrint', 'prBack'].forEach(id => $(id).classList.add('hide')); $('prGrid').classList.remove('hide'); $('prHint').classList.remove('hide'); renderPrints(); }
function previewPage(i) {
  prCur = i; $('prBig').innerHTML = pageSVG(PAGES[i]); $('prHow').textContent = PAGES[i].how || '';
  $('prGrid').classList.add('hide'); $('prHint').classList.add('hide'); ['prView', 'prPrint', 'prBack'].forEach(id => $(id).classList.remove('hide'));
}
function openPrints(posterEm) { buildPages(posterEm || copy(cur)); colorBtns(); showGrid(); openBox('prBox'); blip(660, 0, .1); }
function setColor(c) { COLOR = c; try { localStorage.setItem(SAVEKEY + 'Color', c ? '1' : '0'); } catch (_) {} colorBtns(); if (prCur >= 0) previewPage(prCur); else renderPrints(); blip(c ? 880 : 520, 0, .12); }
function initPrints() {
  $('bPrint').onclick = () => openPrints();
  $('prBW').onclick = () => setColor(false); $('prCol').onclick = () => setColor(true);
  $('prGrid').onclick = e => { const t = e.target.closest('.thumb'); if (t) { previewPage(+t.dataset.i); blip(700, 0, .1); } };
  $('prBack').onclick = showGrid;
  $('prPrint').onclick = () => {
    if (prCur < 0) return; $('printAll').innerHTML = pageSVG(PAGES[prCur]); toast('🖨️ Printing!');
    setTimeout(() => { try { window.print(); } catch (_) {} }, 80);
  };
  window.addEventListener('afterprint', () => { $('printAll').innerHTML = ''; });
}
// =====================================================================
// 🚀 START
// =====================================================================
// quick taps on the iPad: touchpad.js blocks a 2nd tap within 350 ms (to stop double-tap zoom), which would eat fast
// emoji-keyboard typing. So a finger tap on a button clicks it right away, and the late real click is ignored.
function initFastTaps() {
  let down = null, tapEl = null, tapT = 0;
  document.addEventListener('pointerdown', e => { down = e.pointerType === 'touch' ? { x: e.clientX, y: e.clientY } : null; }, true);
  document.addEventListener('pointerup', e => {
    if (e.pointerType !== 'touch' || !down || Math.hypot(e.clientX - down.x, e.clientY - down.y) > 12) return;
    const el = e.target.closest && e.target.closest('button, .fsw, .sw, .thumb'); if (!el) return;
    tapEl = el; tapT = Date.now(); el.click();
  }, true);
  document.addEventListener('click', e => { if (e.isTrusted && tapEl && Date.now() - tapT < 700 && tapEl.contains(e.target)) { e.stopPropagation(); e.preventDefault(); tapEl = null; } }, true);
}
function init() {
  loadSave(); initFastTaps(); initStage(); initUI(); initGallery(); initKeyboard(); initPrints();
  document.addEventListener('click', e => { if (e.target.closest('[data-close]') || e.target.classList.contains('ov')) { if (e.target.closest('#askBox')) return; openBox(null); blip(440, 0, .1); } });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (document.querySelector('.ov.on')) openBox(null); else if (sel >= 0) { sel = -1; refresh(); } }
    if ((e.key === 'Delete' || e.key === 'Backspace') && sel >= 0 && document.activeElement !== $('nameIn')) { e.preventDefault(); removeSel(); }
  });
  refresh();
}
init();
