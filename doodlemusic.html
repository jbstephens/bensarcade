<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎵 Doodle to the Music</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 10%, #ffe9fb 0, transparent 40%), radial-gradient(circle at 85% 90%, #d9f4ff 0, transparent 45%),
      repeating-linear-gradient(0deg, #f3e8ff 0 38px, #ead9ff 38px 40px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- home ---------- */
  #home { flex-direction: column; overflow: hidden; }
  #hHead { text-align: center; padding: 8px 10px 2px; }
  #hHead h1 { margin: 0; font-size: clamp(28px, 5vw, 54px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #b06bff; letter-spacing: 2px; }
  #hHead p { margin: 2px 0 4px; font-size: clamp(15px, 2.1vw, 21px); font-weight: bold; }
  #heard { display: inline-block; background: #fff; border: 3px solid #333; border-radius: 12px; padding: 2px 10px; font-size: 17px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333;
    text-shadow: 3px 3px 0 #333; margin: 6px 4px -4px; }
  .card { border: 5px solid #333; border-radius: 18px; padding: 8px 6px; cursor: pointer; text-align: center;
    box-shadow: 0 6px 0 #333; transition: transform .1s; display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 120px; position: relative; color: #fff; }
  .card .em { font-size: 46px; line-height: 1.1; }
  .card b { font-size: 19px; -webkit-text-stroke: 1px #333; text-shadow: 2px 2px 0 #333; }
  .card .ok { position: absolute; top: 4px; right: 6px; font-size: 20px; }
  .card.sheetc { background: #fff; color: #333; padding: 6px; }
  .card.sheetc svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .card.sheetc b { -webkit-text-stroke: 0; text-shadow: none; font-size: 16px; }
  .card.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .card:active { transform: scale(.96); }
  /* ---------- player ---------- */
  #play { flex-direction: row; gap: 10px; padding: 10px; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; position: relative; }
  #viz { width: 100%; height: 32%; min-height: 90px; border: 5px solid #333; border-radius: 16px; background: #222; display: block; }
  #padWrap { flex: 1; min-height: 0; position: relative; border: 5px solid #333; border-radius: 16px; background: #fff;
    box-shadow: 0 6px 0 #b06bff; overflow: hidden; }
  #pad { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
  #padHint { position: absolute; left: 0; right: 0; top: 40%; text-align: center; font-size: 24px; color: #bbb; pointer-events: none; }
  #freeze { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column;
    background: rgba(160, 225, 255, .9); border: 6px solid #333; border-radius: 18px; z-index: 5; text-align: center; padding: 10px; }
  #freeze.on { display: flex; }
  #freeze h2 { margin: 0; font-size: clamp(50px, 10vw, 110px); color: #fff; -webkit-text-stroke: 4px #1e6bff; text-shadow: 5px 5px 0 #1e6bff; }
  #freeze p { margin: 6px; font-size: clamp(20px, 3vw, 32px); font-weight: bold; }
  #side { width: min(38vw, 360px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  #mTitle { font-size: 26px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #mHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #bar { height: 16px; border: 3px solid #333; border-radius: 9px; background: #fff; overflow: hidden; }
  #barIn { height: 100%; width: 0; background: linear-gradient(90deg, #ff6ec7, #ffd60a, #2ecc40, #1e6bff); }
  .row { display: flex; gap: 8px; }
  .row > .btn { flex: 1; }
  .btn { font: inherit; font-size: 21px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-play { background: #8ef08e; font-size: 26px; } .b-next { background: #9be3ff; } .b-back { background: #9be3ff; }
  .b-mys { background: #e2c6ff; } .b-mys.on { background: #b06bff; color: #fff; }
  .b-guess { background: #ffe066; } .b-clear { background: #ffc2d6; } .b-print { background: #ffb347; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-dance { background: #ff9de0; }
  #pens { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: #b06bff; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #sizes { display: flex; gap: 8px; }
  .sz { flex: 1; height: 50px; border: 4px solid #333; border-radius: 14px; background: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .sz i { display: block; background: #333; border-radius: 50%; }
  .sz.sel { background: #ffe066; }
  #guess { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #guess .btn { font-size: 17px; min-height: 52px; background: #fff3a0; }
  #who { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  #who .btn { font-size: 17px; min-height: 48px; padding: 4px; }
  #who .btn.on { background: #8ef08e; }
  /* ---------- sheet ---------- */
  #sheet { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 30px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff; border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #b06bff; }
  #sSide { width: min(40vw, 380px); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #sTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #sHelp { font-size: 19px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px; }
  #names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #names .btn { font-size: 16px; min-height: 46px; padding: 2px; }
  #names .btn.on { background: #ffe066; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 25px; font-weight: bold;
    z-index: 50; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #tapGo { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.35); }
  #tapGo.on { display: flex; }
  #tapGo div { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 20px 30px; font-size: 34px; font-weight: bold; box-shadow: 0 8px 0 #b06bff; }
  #printBox { display: none; }
  @media (orientation: portrait) {
    #play, #sheet { flex-direction: column; }
    #side, #sSide { width: 100%; max-height: 42vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
  }
  @media (max-height: 560px) and (orientation: landscape) {
    .btn { min-height: 46px; font-size: 18px; padding: 4px 6px; } .b-play { font-size: 22px; }
    #mTitle { font-size: 21px; } #mHelp { font-size: 15px; } .sz { height: 40px; }
  }
  /* ---------- PRINT: only what's in #printBox ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { display: block !important; }
    #printBox svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printBox svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>

<body>
<div id="home" class="screen on">
  <div id="hHead">
    <h1>🎵 DOODLE TO THE MUSIC 🖍️</h1>
    <p>Pick a song! Listen, and draw what the music FEELS like. <span id="heard">🎧 0 / 12 songs heard</span></p>
  </div>
  <div id="grid"></div>
</div>
<div id="play" class="screen">
  <div id="stage">
    <canvas id="viz"></canvas>
    <div id="padWrap"><canvas id="pad"></canvas><div id="padHint">🖍️ Draw what you hear!</div></div>
    <div id="freeze"><h2>❄️ FREEZE!</h2><p id="fzPose"></p><p id="fzJudge"></p><p id="fzCount"></p></div>
  </div>
  <div id="side">
    <div id="mTitle"></div>
    <div id="mHelp"></div>
    <div id="bar"><div id="barIn"></div></div>
    <div class="row"><button class="btn b-play" id="bPlay">▶️ Play</button><button class="btn b-next" id="bNext">⏭️ Next</button></div>
    <div id="who" class="hide"></div>
    <button class="btn b-dance hide" id="bDanceGo">💃 Start Doodle Dance!</button>
    <button class="btn b-mys" id="bMys">❓ Mystery mode: OFF</button>
    <button class="btn b-guess hide" id="bGuess">🤔 Guess the mood!</button>
    <div id="guess" class="hide"></div>
    <div id="pens"></div>
    <div id="sizes"></div>
    <div class="row"><button class="btn b-clear" id="bClear">🧽 Clear</button><button class="btn b-print" id="bPrintPad">🖨️ Print my drawing</button></div>
    <button class="btn b-back" id="bBack">⬅️ Back</button>
  </div>
</div>
<div id="sheet" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="sSide">
    <div id="sTitle"></div>
    <div id="sHelp"></div>
    <div id="names" class="hide"></div>
    <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <button class="btn b-back" id="bSBack">⬅️ Back</button>
  </div>
</div>
<div id="tapGo"><div>👆 Tap to start the music!</div></div>
<div id="printBox"></div>
<div id="toast"></div>
<script>
'use strict';
// 🎵 DOODLE TO THE MUSIC: original WebAudio songs (12 moods) to draw along to, a music visualizer, a drawing pad,
// the Doodle Dance freeze game, and printables (journal, draw-the-song page, mystery mood sheet, Music Artist badge).
// Music engine copied from Robo Jump 4 (lead with vibrato + echo, harmony, pads, bass, arpeggio, drums).
const SAVE_KEY = 'doodleMusic';
let state = { heard: {}, prints: 0 };
function loadState() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}'); if (s && typeof s === 'object') state = Object.assign({ heard: {}, prints: 0 }, s); } catch (_) {}
  if (!state.heard || typeof state.heard !== 'object') state.heard = {};
}
function saveState() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); } catch (_) {} }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const heardCount = () => Object.keys(state.heard).length;
function checkTrophy() {
  if (heardCount() >= 3 || state.prints > 0) {
    let had = false; try { had = !!JSON.parse(localStorage.getItem('gfTrophies') || '{}').doodleMusic; } catch (_) {}
    trophy('doodleMusic');
    if (!had) { toast('🏆 TROPHY! You are a Music Artist!'); return true; }
  }
  return false;
}
// ================== MUSIC ENGINE ==================
let actx = null, master = null, musicBus = null, delayIn = null, delayNode = null, noiseBuf = null, analyser = null;
let MUSIC_LOG = null, VIZQ = [], curT = 0;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
    if (actx.createAnalyser) { analyser = actx.createAnalyser(); analyser.fftSize = 512; comp.connect(analyser); }
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = 0.62; musicBus.connect(master);
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function ensureAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  if (actx && actx.state === 'suspended' && actx.resume) { try { actx.resume(); } catch (_) {} }
  return !!actx;
}
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'theremin') {                           // 👻 spooky "woo-ooo": sine that slides in, with a wide wobble
    g = envGain(t, 0.09, vol, 0.9, dur, 0.25, out);
    const lp = lowpass(2200, 1, t); lp.connect(g);
    const o1 = osc('sine', f * 0.94, t, end), o2 = osc('triangle', f * 0.94, t, end, 4);
    o1.frequency.exponentialRampToValueAtTime(f, t + 0.12); o2.frequency.exponentialRampToValueAtTime(f, t + 0.12);
    const mix = actx.createGain(); mix.gain.value = 0.7; o1.connect(mix); o2.connect(mix); mix.connect(lp);
    const lfo = osc('sine', 6.2, t, end), lg = actx.createGain(); lg.gain.value = f * 0.022; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
  } else if (kind === 'steel' || kind === 'bell' || kind === 'piano') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, kind === 'piano' ? 0.4 : 0.25, kind === 'piano' ? Math.min(dur, 1.2) : Math.min(dur, 0.6), kind === 'piano' ? 0.5 : 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : kind === 'piano' ? [[1, 1], [2, 0.42], [3, 0.16], [4.01, 0.08], [1.003, 0.5]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;

  if (c.kind === 'mood') { const m = MOODS[c.i]; return `${state.heard[m.id] ? '<span class="ok">✅</span>' : ''}<div class="em">${m.em}</div><b>${m.name}</b>`; }
  if (c.kind === 'mys') return '<div class="em">❓</div><b>Mystery Mood</b>';
  if (c.kind === 'dance') return '<div class="em">💃</div><b>Doodle Dance</b>';
  return buildSheet(SHEETS[c.i].id, false, { name: state.badgeName }) + `<b>${SHEETS[c.i].name}</b>`;
}
function renderHome() {
  const g = $('grid'); if (!g) return; g.innerHTML = '';
  updateHeard();
  CARDS.forEach((c, k) => {
    if (k === 0 || c.kind === 'mys' || (c.kind === 'sheet' && c.i === 0)) {
      const h = document.createElement('div'); h.className = 'sec';
      h.textContent = k === 0 ? '🎵 PICK A MUSIC MOOD' : c.kind === 'mys' ? '🎮 GAMES' : '🖨️ PRINT & DRAW ON PAPER'; g.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'card' + (c.kind === 'sheet' ? ' sheetc' : '') + (k === sel ? ' sel' : '');
    if (c.kind === 'mood') d.style.background = `linear-gradient(160deg, ${MOODS[c.i].bg[1]}, ${MOODS[c.i].col})`;
    if (c.kind === 'mys') d.style.background = 'linear-gradient(160deg, #6a3de8, #b06bff)';
    if (c.kind === 'dance') d.style.background = 'linear-gradient(160deg, #ff6ec7, #ffb347)';
    d.innerHTML = cardHTML(c);
    d.addEventListener('click', () => { sel = k; openCard(k); });
    g.appendChild(d);
  });
}
function openCard(k) {
  const c = CARDS[k]; if (!c) return;
  ensureAudio();
  if (c.kind === 'mood') { mystery = false; dance = null; openPlayer(c.i); }
  else if (c.kind === 'mys') { mystery = true; dance = null; openPlayer(rnd(MOODS.length)); toast('❓ Mystery mode! Draw first, then guess the mood!'); }
  else if (c.kind === 'dance') openDance();
  else openSheet(c.i);
}
function markSel() {
  const cs = document.querySelectorAll('.card');
  cs.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (cs[sel] && cs[sel].scrollIntoView) cs[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
// ================== PRINTABLE SHEET SCREEN ==================
let sheetI = 0, sheetColor = false;
function renderSheet() { const b = $('svgBox'); if (b) b.innerHTML = buildSheet(SHEETS[sheetI].id, !sheetColor, { name: state.badgeName }); }
function openSheet(i) {
  stopMusic(); endDance();
  sheetI = i; sheetColor = false;
  const p = SHEETS[i];
  $('sTitle').textContent = p.name; $('sHelp').textContent = p.help;
  $('bMagic').textContent = '✨ Magic color!';
  const nb = $('names'); nb.classList.toggle('hide', !p.names);
  if (p.names) renderNames();
  renderSheet(); setView('sheet');
}
function renderNames() {
  const nb = $('names'); nb.innerHTML = '';
  NAMES.forEach(nm => {
    const b = document.createElement('button'); b.className = 'btn' + ((state.badgeName || 'Ben') === nm ? ' on' : ''); b.textContent = nm;
    b.addEventListener('click', () => { state.badgeName = nm; saveState(); renderNames(); renderSheet(); });
    nb.appendChild(b);
  });
}
function magicColor() {
  sheetColor = !sheetColor; renderSheet();
  $('bMagic').textContent = sheetColor ? '🖍️ Coloring-page lines' : '✨ Magic color!';
  if (sheetColor) toast('✨ Ta-da! Press 🖨️ to print it in color!');
}
// ================== PRINTING ==================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(svgs) {
  const box = $('printBox'); if (!box) return;
  box.innerHTML = svgs.join('');
  state.prints = (state.prints || 0) + 1; saveState(); checkTrophy();
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (!isTouchy()) endPrint();             // Chrome waits in print(); iPad uses 'afterprint' instead
  }, 60);
}
function endPrint() { const b = $('printBox'); if (b) b.innerHTML = ''; }
function printSheet() { doPrint([buildSheet(SHEETS[sheetI].id, !sheetColor, { name: state.badgeName })]); }
function printDrawing() {
  if (playing) stopMusic();
  if (!strokes.length) toast('🖨️ Printing a blank page. Draw on it with real crayons!');
  doPrint([buildSheet('mydrawing', false, { img: padImage() })]);
}
// ================== KEYS ==================
function gridCols() {
  const cs = document.querySelectorAll('.card'); if (!cs.length) return 1;
  let n = 0; const top = cs[0].offsetTop; cs.forEach(t => { if (t.offsetTop === top) n++; });
  return Math.max(1, n);
}
function onKey(e) {
  const k = e.key;
  if (view === 'home') {
    const cols = gridCols(), N = CARDS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openCard(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { const c = CARDS[sel]; sheetI = c.kind === 'sheet' ? c.i : 0; sheetColor = false; printSheet(); return; }
    else return;
    e.preventDefault(); markSel();
  } else if (view === 'play') {
    if (k === 'Escape' || k === 'Backspace') { backHome(); e.preventDefault(); }
    else if (k === ' ' || k === 'Enter') { if (dance && !dance.on) danceGo(); else togglePlay(); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'n' || k === 'N') { if (!(dance && !dance.on)) nextSong(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printDrawing();
    else if (k === 'c' || k === 'C') clearPad();
    else if (k === 'ArrowUp' || k === 'ArrowDown') { const i = PENS.indexOf(pen); pen = PENS[(i + (k === 'ArrowUp' ? -1 : 1) + PENS.length) % PENS.length]; renderPens(); e.preventDefault(); }
  } else if (view === 'sheet') {
    if (k === 'Escape' || k === 'Backspace') { setView('home'); renderHome(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sheetI + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sheetI + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
// ================== START ==================
function stopAll() { stopMusic(); if (dance) { clearDanceTimers(); dance.on = false; const f = $('freeze'); if (f) f.classList.remove('on'); updateUI(); } }
function init() {
  loadState(); renderHome(); renderPens();
  const cv = $('pad');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bPlay').addEventListener('click', () => { if ($('freeze').classList.contains('on')) return; togglePlay(); });
  $('bNext').addEventListener('click', () => { if ($('freeze').classList.contains('on')) return; nextSong(); });
  $('bMys').addEventListener('click', toggleMystery);
  $('bGuess').addEventListener('click', showGuess);
  $('bDanceGo').addEventListener('click', danceGo);
  $('bClear').addEventListener('click', clearPad);
  $('bPrintPad').addEventListener('click', printDrawing);
  $('bBack').addEventListener('click', backHome);
  $('bMagic').addEventListener('click', magicColor);
  $('bPrint').addEventListener('click', printSheet);
  $('bSBack').addEventListener('click', () => { setView('home'); renderHome(); });
  $('tapGo').addEventListener('click', () => { ensureAudio(); $('tapGo').classList.remove('on'); });
  // iPad: sound can only wake up after a tap
  ['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, () => { if (actx && actx.state === 'suspended') try { actx.resume(); } catch (_) {} }, { passive: true }));
  window.addEventListener('afterprint', endPrint);
  window.addEventListener('resize', () => { if (view === 'play') sizePad(); });
  window.addEventListener('keydown', onKey);
  // leaving the page or hiding it stops the music (no stuck notes)
  document.addEventListener('visibilitychange', () => { if (document.hidden) stopAll(); });
  window.addEventListener('pagehide', stopAll);
  vizLoop();
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
