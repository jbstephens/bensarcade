<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🏰 Paper Castle Builder</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; color: #2a1d4a;
    background: linear-gradient(#8fd3ff, #c9f0ff 60%, #b6e3a0); overflow: hidden; user-select: none; -webkit-user-select: none; transition: background .8s; }
  body.night { background: linear-gradient(#0c1033, #22205a 60%, #1d3b2a); }
  #room { position: absolute; inset: 0; display: flex; gap: 10px; padding: 10px; }
  #left { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); color: #fff3c4; -webkit-text-stroke: 2px #2a1d4a; text-shadow: 3px 3px 0 #7e57c2; flex: 1; }
  #stageBox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #stage { width: 100%; height: 100%; max-height: 100%; border: 5px solid #2a1d4a; border-radius: 22px; background: linear-gradient(#64b5f6 50%, #7cb342 50%); box-shadow: 0 8px 0 #2a1d4a; }
  body.night #stage { background: linear-gradient(#0b0f33 50%, #1f4d2e 50%); }
  #bubble { background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 18px; padding: 6px 12px; font-size: clamp(16px, 1.9vw, 21px); font-weight: bold; cursor: pointer; text-align: center; }
  #panel { width: min(40vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: #fff8e1; border: 5px solid #2a1d4a; border-radius: 22px; padding: 10px; }
  body.night #panel { background: #e8e0ff; }
  .sec { background: #fff; border: 3px solid #2a1d4a; border-radius: 16px; padding: 8px; }
  .sec h3 { margin: 0 0 6px; font-size: 20px; text-align: center; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #2a1d4a; border-radius: 16px; padding: 6px 10px; cursor: pointer;
    box-shadow: 0 4px 0 #2a1d4a; color: #222; min-height: 54px; background: #ffe082; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #2a1d4a; }
  .btn.on { background: #a5f2a5; outline: 4px solid #43a047; }
  .chip { min-width: 54px; font-size: 24px; }
  .tw { display: grid; grid-template-columns: 34px 1fr 1fr 1fr; gap: 5px; align-items: center; margin: 4px 0; }
  .tw b { font-size: 22px; text-align: center; }
  .tw .btn { font-size: 16px; min-height: 48px; padding: 4px; }
  #name { width: 100%; font: inherit; font-size: 22px; font-weight: bold; padding: 8px 10px; border: 4px solid #2a1d4a; border-radius: 14px; text-align: center; }
  .b-print { background: #a5f2a5; font-size: 22px; }
  .b-ghost { background: #e1d4ff; }
  #lights { font-size: 22px; background: #2a2766; color: #fff3c4; }
  body.night #lights { background: #ffe082; color: #222; }
  .hide { display: none !important; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fffbe8; border: 5px solid #2a1d4a; border-radius: 20px;
    padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* paper preview */
  #pv { position: fixed; inset: 0; background: rgba(20,16,50,.8); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  #pv.on { display: flex; }
  #pvCard { background: #fffbe8; border: 6px solid #2a1d4a; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1200px; max-height: 100%; display: flex; flex-direction: column; gap: 8px; }

  #pvPages { display: flex; gap: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px; flex: 1; min-height: 0; }
  #pvPages svg { height: min(58vh, 520px); width: auto; flex: none; border: 3px solid #2a1d4a; border-radius: 8px; background: #fff; }
  #printAll { display: none; }
  /* screen magic: stars, flicker, ghost float */
  .twk { animation: tw 2.4s ease-in-out infinite; } @keyframes tw { 50% { opacity: .2; } }
  .flame { transform-box: fill-box; transform-origin: 50% 100%; animation: fl .35s ease-in-out infinite alternate; }
  @keyframes fl { 0% { transform: scale(1, 1) skewX(0); } 50% { transform: scale(.9, 1.12) skewX(4deg); } 100% { transform: scale(1.06, .92) skewX(-4deg); } }
  .tglow { animation: tg .5s ease-in-out infinite alternate; } @keyframes tg { to { opacity: .55; } }
  #ghost { cursor: pointer; animation: gf 2.6s ease-in-out infinite; } @keyframes gf { 50% { transform: translateY(-10px); } }
  .wave { transform-box: fill-box; transform-origin: 20% 90%; animation: wv .6s ease-in-out infinite alternate; } @keyframes wv { to { transform: rotate(-28deg); } }
  .pop { animation: pp .4s; } @keyframes pp { 50% { transform: scale(1.15); } }
  @media (orientation: portrait) { #room { flex-direction: column; } #panel { width: 100%; max-height: 46vh; } }
  @media (max-height: 560px) { .btn { min-height: 44px; font-size: 16px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="room">
  <div id="left">
    <div id="top"><h1>🏰 Paper Castle Builder</h1><button class="btn" id="lights">🌙 Lights off</button></div>
    <div id="bubble">🤖 Build a castle, then print it and make it out of REAL paper!</div>
    <div id="stageBox"><svg id="stage" viewBox="0 0 800 560" xmlns="http://www.w3.org/2000/svg"></svg></div>
  </div>
  <div id="panel">
    <div class="sec"><h3>🏰 How many towers?</h3><div class="row" id="nTow"></div><div id="towers"></div></div>
    <div class="sec"><h3>🪟 Windows</h3><div class="row" id="wins"></div></div>
    <div class="sec"><h3>🚩 Flag picture</h3><div class="row" id="flags"></div></div>
    <div class="sec"><h3>✏️ Castle name</h3><input id="name" maxlength="18" placeholder="Castle Ben" autocomplete="off"></div>
    <button class="btn b-print" id="bSee">📄 See my paper castle</button>
    <button class="btn b-ghost hide" id="bGhost">👻 Ghost Friend puppet</button>
  </div>
</div>
<div id="pv"><div id="pvCard"><h2 id="pvTitle">📄 Your paper castle pieces</h2><div id="pvPages"></div>
  <div class="row"><button class="btn" id="bBW">⚫ Black &amp; White</button><button class="btn" id="bCol">🌈 Color</button></div>
  <div class="row"><button class="btn b-print" id="bPrint">🖨️ Print it!</button><button class="btn" id="bClose">👍 Back</button></div>
  <div style="text-align:center;font-weight:bold" id="pvNote">🖍️ Black and white, ready to color! A grown-up helps cut.</div></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

    '<path d="M-4 -3 L13 -9.6 M-4 3 L13 9.6" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" fill="none"/>' +

  $('bGhost').addEventListener('click', () => openPV('ghost'));
  $('bBW').addEventListener('click', () => setPM('bw'));
  $('bCol').addEventListener('click', () => setPM('color'));
  $('bPrint').addEventListener('click', doPrint);
  $('bClose').addEventListener('click', closePV);
  $('pv').addEventListener('click', e => { if (e.target === $('pv')) closePV(); });
  window.addEventListener('afterprint', () => { $('printAll').innerHTML = ''; });
  window.addEventListener('keydown', e => { if (e.target === $('name')) return; if (e.key === 'Escape') closePV(); });
  setTimeout(() => say('Build a castle, then print it and make it out of REAL paper!'), 600);
  document.addEventListener('visibilitychange', () => { if (document.hidden) try { speechSynthesis.cancel(); } catch (_) {} });
}
if (typeof window !== 'undefined' && !window.__TEST__) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init(); }
</script>
