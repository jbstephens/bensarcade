<script>
// JIMMY'S BIG ESCAPE
// Jimmy is an ORANGE TABBY with darker orange stripes, four WHITE PAWS (like socks) and GREEN eyes.
// He is very lovable... unless he's in a bad mood! One day his favorite fluffy cushion (his sunny napping spot)
// gets taken to the LOST & FOUND at the Game Factory, so he sneaks all the way there to get it back.
// The big new thing: JIMMY'S MOOD METER (from 😻 happy to 😾 grumpy).
//   Mood goes DOWN: getting wet (sprinklers, bath tubs, puddles), the vacuum, being woken up from a nap, getting caught.
//   Mood goes UP: fish treats, pets from a friendly person, napping in a sunbeam, playing with a toy.
//   HAPPY Jimmy: CUTE head-bump (guards melt: "Awww, Jimmy!"), PURR, CLIMB, full speed.
//   GRUMPY Jimmy: a big HISS that scares guards + robots back for a few seconds, but he's slower and won't climb or purr.
// Same cat moves as Sammy's Big Escape 2: climb, leap, hide, knock things off shelves, purr, disguise box.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, COLS = 24, ROWS = 13;
const SNEAK = 2.0, RUN = 3.8, BOXSPEED = 1.5, GRUMPY_AT = 35;
let frame = 0;

// ---------- Game Factory book helpers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0, stickerName = '';
function sticker(id, name) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; stickerName = name || ''; } } catch (_) {} }   // for the Sticker Book in the Game Factory book

let firstOpen = true;
try { firstOpen = localStorage.getItem('jimmyEscapeOpened') !== 'true'; localStorage.setItem('jimmyEscapeOpened', 'true'); } catch (_) {}
const NLEV = 9;
let save = { stars: {}, fish: {}, mice: {}, unlocked: 1, music: true, won: false, costume: 'none' };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('jimmyEscape') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.stars = save.stars || {}; save.fish = save.fish || {}; save.mice = save.mice || {};
  save.unlocked = Math.max(1, Math.min(NLEV, save.unlocked | 0 || 1));
  if (typeof save.costume !== 'string') save.costume = 'none';
}
function writeSave() { try { localStorage.setItem('jimmyEscape', JSON.stringify(save)); } catch (_) {} }
loadSave();
// 🐭 costumes: find the hidden toy mouse in each level to unlock them
const COSTUMES = [
  { id: 'none', name: 'Just Jimmy', icon: '🐱', need: 0 },
  { id: 'bandana', name: 'Cowboy Bandana', icon: '🤠', need: 2 },
  { id: 'shades', name: 'Cool Sunglasses', icon: '😎', need: 5 },
  { id: 'crown', name: 'King Jimmy Crown', icon: '👑', need: 8 },
];
const miceCount = () => Object.keys(save.mice).filter(k => save.mice[k]).length;
const costumeOpen = c => miceCount() >= c.need;
function wearing() { const c = COSTUMES.find(c => c.id === save.costume); return c && costumeOpen(c) ? c.id : 'none'; }

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, noiseBuf = null;
let musicOn = save.music !== false;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  delayIn = actx.createGain(); delayIn.gain.value = 0.26;               // echo for the lead
  const dn = actx.createDelay(2); dn.delayTime.value = 0.4;
  const fb = actx.createGain(); fb.gain.value = 0.3;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(dn); dn.connect(dlp); dlp.connect(fb); fb.connect(dn); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  if (actx && actx.state === 'suspended' && actx.resume) actx.resume();
}
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function noiseBurst(start, dur, freq, vol, type = 'bandpass') {
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime + start, s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = 1;
  const g = actx.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
}
// a real-sounding little "meow": a buzzy voice through a mouth filter that opens and closes
function meowSound(pitch = 1, start = 0) {
  if (!actx) return;
  const t = actx.currentTime + start, d = 0.55;
  const o = actx.createOscillator(); o.type = 'sawtooth';
  o.frequency.setValueAtTime(520 * pitch, t); o.frequency.linearRampToValueAtTime(820 * pitch, t + 0.16);
  o.frequency.linearRampToValueAtTime(700 * pitch, t + 0.32); o.frequency.exponentialRampToValueAtTime(430 * pitch, t + d);
  const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 3;
  bp.frequency.setValueAtTime(700, t); bp.frequency.linearRampToValueAtTime(1800, t + 0.18); bp.frequency.linearRampToValueAtTime(900, t + d);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.5, t + 0.05);
  g.gain.setValueAtTime(0.45, t + d - 0.15); g.gain.linearRampToValueAtTime(0, t + d);
  o.connect(bp); bp.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + d + 0.05);
}
const sfx = {
  click:  () => note(700, 0, 0.06, 'square', 0.06),
  step:   () => note(90 + Math.random() * 30, 0, 0.05, 'triangle', 0.05),
  pounce: () => { note(300, 0, 0.18, 'sine', 0.14, 900); noiseBurst(0, 0.1, 3000, 0.08); },
  bat:    () => { note(900, 0, 0.08, 'square', 0.07, 400); note(1300, 0.04, 0.08, 'sine', 0.08); },
  toyLand: () => { note(1400, 0, 0.12, 'sine', 0.12, 1900); note(1600, 0.12, 0.12, 'sine', 0.1, 2100); },   // squeak squeak!
  fish:   () => { note(988, 0, 0.08, 'triangle', 0.12); note(1319, 0.07, 0.1, 'triangle', 0.12); note(1760, 0.14, 0.22, 'sine', 0.12); },
  snack:  () => [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.07, 0.25, 'triangle', 0.12)),
  hide:   () => { noiseBurst(0, 0.15, 900, 0.12); note(300, 0, 0.12, 'sine', 0.08, 180); },
  huh:    () => { note(500, 0, 0.12, 'square', 0.06, 700); note(700, 0.13, 0.12, 'square', 0.06, 1000); },
  alert:  () => { note(880, 0, 0.1, 'square', 0.08); note(1175, 0.1, 0.18, 'square', 0.08); },
  caught: () => { note(600, 0, 0.18, 'square', 0.1, 300); note(400, 0.18, 0.18, 'square', 0.1, 200); note(260, 0.36, 0.4, 'triangle', 0.12, 130); },
  woof:   () => { for (const s of [0, 0.25]) { note(220, s, 0.16, 'sawtooth', 0.14, 120); noiseBurst(s, 0.12, 600, 0.12); } },
  vroom:  () => { note(110, 0, 0.6, 'sawtooth', 0.1, 220); noiseBurst(0, 0.6, 1200, 0.08); },
  check:  () => { note(660, 0, 0.1, 'triangle', 0.12); note(880, 0.1, 0.2, 'triangle', 0.12); },
  door:   () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.08, 0.3, 'triangle', 0.11)),
  star:   () => [880, 1109, 1319, 1760].forEach((f, i) => note(f, i * 0.09, 0.3, 'sine', 0.12)),
  boing:  () => note(260, 0, 0.22, 'sine', 0.14, 620),
  pop:    () => { noiseBurst(0, 0.25, 1500, 0.35, 'highpass'); note(150, 0, 0.3, 'sine', 0.3, 60); },
  firework: () => { noiseBurst(0, 0.7, 800, 0.25, 'lowpass'); note(900 + Math.random() * 600, 0, 0.5, 'sine', 0.05, 300); },
  whoosh: () => noiseBurst(0, 0.5, 1200, 0.15),
  purr:   () => { for (let i = 0; i < 8; i++) note(48 + (i % 2) * 6, i * 0.11, 0.12, 'sawtooth', 0.07); },
  shake:  i => note(300 + i * 25, 0, 0.06, 'square', 0.05),
};

// ---------- MUSIC ENGINE ----------
// 5 tracks: LEAD (pizzicato strings or a breathy flute, with vibrato on long notes and an echo),
// a COUNTER voice (clarinet) on the second time round, soft string PADS, a plucky upright BASS and light DRUMS
// (kick, rim click, shaker). Songs are written one 8th note per step: a MIDI note, 0 = rest, -1 = keep holding.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);
  g.connect(out); return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
function vibrato(t, end, f, o1, o2) {
  const lfo = osc('sine', 5.4, t, end), lg = actx.createGain();
  lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.01, t + 0.45);
  lfo.connect(lg); lg.connect(o1.frequency); if (o2) lg.connect(o2.frequency);
}
// 🎻 pizzicato: a plucked string that rings out quickly
function pizzVoice(m, t, dur, vol, out) {
  const f = midi(m), end = t + 0.5;
  const g = envGain(t, 0.003, vol, 0.15, 0.09, 0.35, out);
  const lp = lowpass(3200, 2, t); lp.frequency.setTargetAtTime(700, t + 0.01, 0.06); lp.connect(g);
  osc('triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 6).connect(lp);
  const g2 = actx.createGain(); g2.gain.value = 0.25; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
  if (delayIn) g.connect(delayIn);
}
// 🪈 flute / clarinet: breathy sustained voices with vibrato
function windVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.3;
  const g = envGain(t, kind === 'flute' ? 0.04 : 0.02, vol, 0.85, dur, 0.15, out);
  const lp = lowpass(kind === 'flute' ? 3800 : 1300, 1, t); lp.connect(g);
  const o1 = osc(kind === 'flute' ? 'sine' : 'square', f, t, end, -4), o2 = osc(kind === 'flute' ? 'triangle' : 'square', f, t, end, 4);
  const mix = actx.createGain(); mix.gain.value = 0.5; o1.connect(mix); o2.connect(mix); mix.connect(lp);
  if (kind === 'flute') { const n = actx.createBufferSource(); n.buffer = noiseBuf; const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = f * 2; bp.Q.value = 2;
    const ng = actx.createGain(); ng.gain.value = 0.05; n.connect(bp); bp.connect(ng); ng.connect(g); n.start(t); n.stop(end); }   // breath
  if (dur > 0.3) vibrato(t, end, f, o1, o2);
  if (delayIn && kind === 'flute') g.connect(delayIn);
}
function padVoice(notes, t, dur, vol, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, 0.3, vol, 0.85, dur, 0.5, out);
    const lp = lowpass(1000, 0.7, t); lp.connect(g);
    osc('sawtooth', f, t, end, -10).connect(lp); osc('sawtooth', f, t, end, 10).connect(lp);
  }
}
function bassVoice(m, t, vol, out) {                   // 🎸 upright bass pluck
  const f = midi(m), end = t + 0.5;
  const g = envGain(t, 0.004, vol, 0.3, 0.12, 0.25, out);
  const lp = lowpass(900, 3, t); lp.frequency.setTargetAtTime(250, t + 0.01, 0.07); lp.connect(g);
  osc('triangle', f, t, end).connect(lp); const sg = actx.createGain(); sg.gain.value = 0.7; osc('sine', f, t, end).connect(sg); sg.connect(g);
}
function guitarStrum(notes, t, vol, out) {             // 🎸 campfire guitar: notes rolled one after another
  notes.forEach((m, i) => {
    const f = midi(m), s = t + i * 0.018, end = s + 0.9;
    const g = envGain(s, 0.003, vol, 0.3, 0.2, 0.6, out);
    const lp = lowpass(2600, 1, s); lp.frequency.setTargetAtTime(800, s, 0.12); lp.connect(g);
    osc('triangle', f, s, end).connect(lp); osc('sawtooth', f, s, end, 3).connect(lp);
  });
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {
    const o = osc('sine', 130, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(45, t + 0.1);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.26);
    o.connect(g); g.connect(out);
  } else if (kind === 'r') {                            // rim click (tiptoe!)
    const o = osc('square', 1700, t, t + 0.04), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.001); g.gain.exponentialRampToValueAtTime(0.001, t + 0.03);
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1700; o.connect(bp); bp.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 6500, 1, vol, 0.05, out);           // shaker
  else if (kind === 's') noiseHit(t, 'bandpass', 2200, 0.8, vol, 0.14, out);           // brush snare
}
// chords (MIDI triads, low)
// new sounds for the new cat moves
Object.assign(sfx, {
  crash:  () => { noiseBurst(0, 0.35, 2500, 0.3, 'highpass'); [1300, 900, 1500, 700].forEach((f, i) => note(f, 0.04 + i * 0.07, 0.12, 'triangle', 0.1)); },   // CLATTER!
  wobble: () => { note(500, 0, 0.1, 'sine', 0.08, 650); note(450, 0.1, 0.1, 'sine', 0.08, 600); },
  splash: () => { noiseBurst(0, 0.6, 1800, 0.25); noiseBurst(0.05, 0.4, 4000, 0.12, 'highpass'); },
  drip:   () => note(1500 + Math.random() * 400, 0, 0.07, 'sine', 0.05, 900),
  climb:  () => [0, 0.08, 0.16].forEach((s, i) => { note(260 + i * 90, s, 0.07, 'triangle', 0.08); noiseBurst(s, 0.04, 2200, 0.05); }),
  leap:   () => { note(260, 0, 0.3, 'sine', 0.13, 1000); noiseBurst(0, 0.25, 1800, 0.06); },
  land:   () => { note(150, 0, 0.1, 'sine', 0.15, 80); noiseBurst(0, 0.06, 900, 0.08); },
  box:    () => { noiseBurst(0, 0.12, 600, 0.2, 'lowpass'); note(200, 0, 0.12, 'square', 0.05, 140); },
  chitter: () => { for (let i = 0; i < 7; i++) note(1800 + (i % 2) * 500, i * 0.05, 0.04, 'square', 0.05); },
  tweet:  () => { note(2200, 0, 0.08, 'sine', 0.08, 3000); note(2600, 0.1, 0.08, 'sine', 0.08, 3400); note(2400, 0.22, 0.1, 'sine', 0.07, 3100); },
  squeak: () => { note(1500, 0, 0.1, 'sine', 0.1, 2100); note(1700, 0.12, 0.12, 'sine', 0.09, 2300); },
  hoot:   () => { note(400, 0, 0.25, 'sine', 0.12, 370); note(380, 0.35, 0.35, 'sine', 0.12, 350); },
  ding:   i => { note(midi(72 + [0, 4, 7, 12][i % 4]), 0, 0.35, 'triangle', 0.12); note(midi(84 + [0, 4, 7, 12][i % 4]), 0, 0.3, 'sine', 0.06); },
  buzz:   () => { note(140, 0, 0.35, 'sawtooth', 0.08); note(147, 0, 0.35, 'square', 0.05); },
  vault:  () => { note(80, 0, 1.2, 'sawtooth', 0.1, 50); noiseBurst(0, 1.0, 400, 0.15, 'lowpass'); [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => note(f, 0.6 + i * 0.1, 0.4, 'triangle', 0.1)); },
  meet:   () => [659, 784, 988, 1319].forEach((f, i) => note(f, i * 0.09, 0.25, 'sine', 0.11)),
  zzz:    () => { note(300, 0, 0.5, 'sine', 0.06, 200); },
  beep:   () => { note(1200, 0, 0.06, 'square', 0.05); note(900, 0.08, 0.08, 'square', 0.05); },
  sparkle: () => [1568, 1976, 2349, 2637, 3136].forEach((f, i) => note(f, i * 0.06, 0.3, 'sine', 0.06)),
});
// 🔔 a music box bell (for Sammy's dream)  +  👾 a bright chip lead (for the Game Factory)
function bellVoice(m, t, dur, vol, out) {
  const f = midi(m), end = t + 1.6;
  const g = envGain(t, 0.002, vol, 0.2, 0.2, 1.2, out);
  osc('sine', f, t, end).connect(g);
  const g2 = actx.createGain(); g2.gain.setValueAtTime(0.35, t); g2.gain.exponentialRampToValueAtTime(0.001, t + 0.6); osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g);
  if (delayIn) g.connect(delayIn);
}
function chipVoice(m, t, dur, vol, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.005, vol, 0.7, dur * 0.9, 0.08, out);
  const lp = lowpass(2600, 3, t); lp.frequency.setTargetAtTime(1200, t, 0.1); lp.connect(g);
  const o1 = osc('square', f, t, end, -5), o2 = osc('square', f, t, end, 5); o1.connect(lp); o2.connect(lp);
  if (dur > 0.3) vibrato(t, end, f, o1, o2);
  if (delayIn) g.connect(delayIn);
}
// 😻😾 new sounds for Jimmy's moods
Object.assign(sfx, {
  hiss:   () => { noiseBurst(0, 0.55, 5200, 0.32, 'highpass'); noiseBurst(0.02, 0.45, 2600, 0.14); note(180, 0, 0.25, 'sawtooth', 0.05, 120); },   // HSSSSS!
  cute:   () => { meowSound(1.35); [1319, 1568, 2093].forEach((f, i) => note(f, 0.3 + i * 0.08, 0.25, 'sine', 0.07)); },               // mew! + sparkles
  melt:   () => [784, 740, 698, 659].forEach((f, i) => note(f, i * 0.12, 0.25, 'sine', 0.09, f * 0.97)),                                 // awwww...
  scared: () => { note(900, 0, 0.12, 'square', 0.06, 1500); note(1300, 0.1, 0.14, 'square', 0.05, 2000); },

    text('🏆 TROPHY!', W / 2 + 140, 190, 34, '#e65100', 'center', '#fff', 6);
    text('Cushion Champion', W / 2 + 140, 232, 28, '#6a1b9a', 'center', null);
    text('Jimmy got his cushion back!', W / 2 + 140, 266, 18, '#5d4037', 'center', null);
    text(`⭐ ${totalStars()} / 27 stars   🐭 ${miceCount()} / 9`, W / 2 + 140, 336, 24, '#fff', 'center', '#1a1033', 6);
    if (t > FIN_PARTS[4] + 40) text('Tap to go back to the start', W / 2 + 140, 386, 22, '#fff59d', 'center', '#1a1033', 5);
    drawParts();
  }
}

// ---------- Main loop ----------
function update() {
  frame++; stateT++;
  grumpyMusic = (state === 'play' || state === 'paused' || state === 'caught') && grumpy();   // 😾 grumpy Jimmy = grumpy music
  if (shake > 0) shake--; if (flash > 0) flash = Math.max(0, flash - 0.04);
  if (state === 'story') updateStory();
  else if (state === 'play') { updateJimmy(); if (state === 'play') { updateFriend(); updateWorld(); } if (state === 'play') updateGuards(); }
  else if (state === 'finale') updateFinale();
  updateParts();
  musicTick();
}
function draw() {
  buttons = [];
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (state === 'story') drawStory();
  else if (state === 'title') { drawTitle(); drawParts(); }
  else if (state === 'levels') drawLevels();
  else if (state === 'costumes') drawCostumes();
  else if (state === 'intro') drawIntro();
  else if (state === 'play') { drawPlayScene(); drawHUD(); }
  else if (state === 'caught') drawCaught();
  else if (state === 'clear') drawClear();
  else if (state === 'paused') drawPaused();
  else if (state === 'finale') drawFinale();
  ctx.restore();
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash})`; ctx.fillRect(0, 0, W, H); }
  if (stickerNew > 0) { stickerNew--; roundRect(W - 280, H - 60, 266, 46, 14, 'rgba(255,255,255,.92)'); text('🌟 New sticker: ' + stickerName + '!', W - 147, H - 37, 16, '#6a1b9a', 'center', null); }
}
function loop() { update(); draw(); requestAnimationFrame(loop); }
if (firstOpen) startStory(); else { state = 'title'; playSong('jimmy'); }
requestAnimationFrame(loop);
</script>
