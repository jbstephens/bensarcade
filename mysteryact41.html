<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🐋 Operation Ocean Rescue!</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: linear-gradient(#7c4dff, #40c4ff); color: #222; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; z-index: 2; }
  .screen.on { display: flex; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: none; pointer-events: none; }
  #fx.on { display: block; }
  #fx.top { z-index: 60; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #222; border-radius: 16px;
    padding: 8px 12px; cursor: pointer; box-shadow: 0 5px 0 #222; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #222; }
  .btn.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn:disabled { opacity: .4; }
  .hide { display: none !important; }
  .b-go { background: #69f0ae; } .b-gold { background: linear-gradient(#fff59d, #ffc400); }
  .b-blue { background: #9be3ff; } .b-pink { background: #ffc2d6; } .b-purple { background: #d1b3ff; }
  .b-orange { background: #ffcc80; } .b-red { background: #ff8a80; } .b-yel { background: #ffe066; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .glowy { animation: glowy 1s ease-in-out infinite alternate; }
  @keyframes glowy { from { box-shadow: 0 5px 0 #222, 0 0 0 0 #fff59d; } to { box-shadow: 0 5px 0 #222, 0 0 0 10px rgba(255,245,157,.7); } }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 54px); color: #fff59d; -webkit-text-stroke: 2.5px #222;
    text-shadow: 4px 4px 0 #e91e63; letter-spacing: 1px; text-align: center; line-height: 1.05; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; justify-content: center; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .safe { background: #fffbe0; border: 4px solid #222; border-radius: 16px; padding: 6px 10px; font-size: clamp(14px, 1.6vw, 17px); font-weight: bold; text-align: center; }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #222; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 80; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  @keyframes pop { 0% { transform: scale(.2) rotate(-10deg); } 70% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1); } }
  /* ---------- 🎁 gift ---------- */
  #gift { flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle at 50% 45%, #69f0ae, #2979ff 60%, #1a1446); }
  #giftBox { width: min(48vh, 70vw); cursor: pointer; animation: wobble 1.4s ease-in-out infinite; }
  #giftBox svg { width: 100%; height: auto; display: block; }
  #giftBox.open { animation: none; }
  #giftBox .lid { transition: transform .9s cubic-bezier(.3,1.6,.5,1); }
  #giftBox.open .lid { transform: translate(0, -90px) rotate(-24deg); }
  #giftBox .rib { transition: opacity .3s; } #giftBox.open .rib { opacity: 0; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-5deg) scale(1.03); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } }
  #giftMsg { color: #fff; font-size: clamp(20px, 3vw, 30px); font-weight: bold; text-align: center; text-shadow: 2px 2px 0 #000; padding: 0 12px; }
  /* ---------- 🃏 event card overlay ---------- */
  .ov { position: fixed; inset: 0; background: rgba(20, 0, 40, .8); display: none; z-index: 55; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #222; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 980px; max-height: 100%;
    overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
  #evtCard { flex-direction: row; align-items: stretch; animation: cardIn .6s cubic-bezier(.3,1.5,.5,1); }
  @keyframes cardIn { 0% { transform: rotateY(90deg) scale(.4); } 100% { transform: rotateY(0) scale(1); } }
  #evtArt { width: min(32vw, 300px); flex-shrink: 0; border: 5px solid #222; border-radius: 20px; position: relative; min-height: 180px; }
  #evtArt svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #evtArt.dance svg { animation: boogie .35s ease-in-out infinite alternate; }
  @keyframes boogie { from { transform: rotate(-8deg) translateY(0); } to { transform: rotate(8deg) translateY(-10px); } }
  #evtR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  #evtTitle { margin: 0; text-align: center; font-size: clamp(26px, 4vw, 48px); color: #fff59d; -webkit-text-stroke: 2px #222; text-shadow: 3px 3px 0 #e91e63; line-height: 1.05; }
  #evtText { font-size: clamp(22px, 3.2vw, 38px); font-weight: bold; text-align: center; line-height: 1.15; }
  #evtSub { font-size: clamp(16px, 2vw, 22px); text-align: center; color: #444; font-weight: bold; }
  #evtBig { font-size: clamp(60px, 14vh, 130px); text-align: center; line-height: 1; font-weight: bold; color: #fff; -webkit-text-stroke: 3px #222; text-shadow: 5px 5px 0 #222; }
  #evtBig:empty { display: none; }
  #evtBtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
  #evtBtns .btn { font-size: clamp(17px, 2.2vw, 24px); min-height: 64px; }
  /* ---------- 📜 rules + 🗺️ layouts ---------- */
  #rules { flex-direction: column; gap: 8px; padding: 10px; background: linear-gradient(#26c6da, #00838f); }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
  .box { background: #fff; border: 4px solid #222; border-radius: 16px; padding: 8px 14px; font-size: clamp(16px, 2vw, 21px); }
  .box h3 { margin: 0 0 4px; font-size: clamp(20px, 2.6vw, 28px); }
  .box ol, .box ul { margin: 2px 0; padding-left: 26px; } .box li { margin: 3px 0; }
  .legend { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 6px; }
  .legend div { border: 3px solid #222; border-radius: 12px; padding: 4px 8px; font-weight: bold; }
  .lay { display: flex; gap: 12px; align-items: stretch; }
  .lay svg { width: min(40vw, 420px); flex-shrink: 0; height: auto; border: 4px solid #222; border-radius: 14px; background: #fff; }
  .lay > div { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  /* ---------- 🖨️ printables (same setup as the Craft Room) ---------- */
  #gallery { flex-direction: column; overflow: hidden; background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #b2ebf2 36px 72px); }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #222; text-shadow: 3px 3px 0 #222; }
  .sec .btn { font-size: 17px; min-height: 46px; padding: 4px 12px; }
  .thumb { background: #fff; border: 5px solid #222; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #e91e63; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  #view { flex-direction: row; gap: 10px; padding: 10px; background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #b2ebf2 36px 72px); }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #222; border-radius: 10px; box-shadow: 0 8px 0 #e91e63; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #222; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #222; border-radius: 14px; padding: 6px 8px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #222; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #222; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #222; }
  #printAll { display: none; }
  /* ---------- big overlay ---------- */
  #big { position: fixed; inset: 0; z-index: 58; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; }
  #big.on { display: flex; }
  #big.count { background: rgba(26, 20, 70, .95); }
  #big.calm { background: rgba(0, 120, 90, .95); }
  #bigEmo { font-size: clamp(60px, 14vh, 140px); line-height: 1; animation: bob .4s infinite alternate; }
  #bigTxt { font-size: clamp(34px, 6.4vw, 84px); color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #000; font-weight: bold; line-height: 1.05; max-width: 1200px; }
  #bigTxt.num { font-size: clamp(120px, 34vh, 300px); animation: pop .5s ease-out; }
  #bigSub { font-size: clamp(20px, 3vw, 34px); color: #fff; font-weight: bold; -webkit-text-stroke: 1.2px #000; }
  /* ================= 🐋 OCEAN RESCUE styles ================= */
  body { background: linear-gradient(#4fc3f7, #01579b); }
  #gift { background: radial-gradient(circle at 50% 45%, #84ffff, #0288d1 45%, #01183a); }
  .vBg { background: radial-gradient(circle at 70% 10%, #e1f5fe, #29b6f6 40%, #01579b); }
  .jBg { background-color: #0277bd; background-image: radial-gradient(circle at 20% 30%, rgba(255,255,255,.16) 0 10px, transparent 11px), radial-gradient(circle at 70% 70%, rgba(255,255,255,.12) 0 18px, transparent 19px); background-size: 110px 140px, 170px 190px; animation: bubbleUp 12s linear infinite; }
  @keyframes bubbleUp { from { background-position: 0 0, 0 0; } to { background-position: 0 -1400px, 0 -950px; } }
  h1.glowT { margin: 0; font-size: clamp(24px, 4.2vw, 52px); color: #fff59d; -webkit-text-stroke: 2.5px #0d1b3e; text-shadow: 4px 4px 0 #ff5722; text-align: center; line-height: 1.05; }
  #big.glow { background: radial-gradient(circle, rgba(132,255,255,.96), rgba(1,87,155,.96)); }
  #big.glow #bigTxt { font-size: clamp(46px, 9vw, 130px); animation: bigShake .3s infinite alternate; }
  #big.zap { background: repeating-conic-gradient(from 0deg, rgba(0,229,255,.95) 0 15deg, rgba(41,121,255,.95) 15deg 30deg); }
  #big.zap #bigTxt { font-size: clamp(56px, 11vw, 160px); animation: bigShake .15s infinite alternate; }
  #big.stomp { background: rgba(13, 27, 62, .96); animation: quake .12s infinite alternate; }
  #big.stomp #bigTxt { font-size: clamp(44px, 8vw, 120px); }
  #big.hush { background: rgba(5, 15, 40, .97); }
  #big.hush #bigTxt { font-size: clamp(40px, 7vw, 100px); }
  #big.leaf { background: rgba(0, 105, 120, .95); }
  #big.leaf #bigTxt { font-size: clamp(36px, 7vw, 100px); }
  #big.gunk { background: radial-gradient(circle, rgba(118,255,3,.95), rgba(74,20,140,.97)); animation: quake .1s infinite alternate; }
  #big.gunk #bigTxt { font-size: clamp(46px, 9vw, 130px); }
  @keyframes bigShake { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.08); } }
  @keyframes quake { from { transform: translate(-6px, 3px); } to { transform: translate(6px, -3px); } }
  /* ---------- 🎬 the opening ---------- */
  #intro { overflow: hidden; background: #4fc3f7; }
  #stage { position: absolute; inset: 0; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .storm { opacity: 0; transition: opacity 1.2s; } #intro.s2 .storm { opacity: 1; }
  .rockBoat { animation: rockBoat 2.4s ease-in-out infinite alternate; } #intro.s2 .rockBoat { animation-duration: .5s; }
  @keyframes rockBoat { from { transform: rotate(-3deg) translateY(0); } to { transform: rotate(3deg) translateY(-8px); } }
  .gunkIn { opacity: 0; transform: translateY(120px); transition: opacity 1s, transform 1.6s cubic-bezier(.3,1.4,.5,1); } #intro.s3 .gunkIn { opacity: 1; transform: translateY(0); }
  .critters { transition: opacity .8s; } #intro.s3 .critters { opacity: .15; }
  .surface { transition: transform 2.6s cubic-bezier(.6,0,.4,1); } #intro.s4 .surface { transform: translateY(-900px); }
  .deep { transform: translateY(900px); transition: transform 2.6s cubic-bezier(.6,0,.4,1); } #intro.s4 .deep { transform: translateY(0); }
  .subIn { transform: translateX(-1400px); transition: transform 2.2s cubic-bezier(.3,1.2,.5,1); } #intro.s5 .subIn { transform: translateX(0); }
  .sosIn { opacity: 0; transition: opacity .6s; } #intro.s6 .sosIn { opacity: 1; }
  .floaty { animation: bob2 1.6s ease-in-out infinite alternate; } @keyframes bob2 { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .sway { animation: sway 3s ease-in-out infinite alternate; } @keyframes sway { from { transform: rotate(-2deg); } to { transform: rotate(2deg); } }
  .rise { animation: rise 4s linear infinite; } @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-300px); opacity: 0; } }
  #iTitle { position: absolute; left: 0; right: 0; top: 3%; text-align: center; z-index: 7; opacity: 0; transform: scale(.2);
    transition: transform .8s cubic-bezier(.3,1.6,.5,1), opacity .4s; pointer-events: none; }
  #iTitle.on { opacity: 1; transform: scale(1); }
  #iTitle h1 { font-size: clamp(32px, 6vw, 88px); }
  #iTitle div { font-size: clamp(18px, 3vw, 36px); color: #fff; -webkit-text-stroke: 1.5px #0d1b3e; font-weight: bold; text-shadow: 3px 3px 0 #0d1b3e; }
  #iBtns { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; z-index: 8; }
  #iCap { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(92vw, 900px); text-align: center; z-index: 8;
    background: rgba(225,245,254,.96); border: 5px solid #0d1b3e; border-radius: 20px; padding: 6px 12px; font-size: clamp(18px, 2.6vw, 30px); font-weight: bold; }
  /* ---------- 🤿 the rescue team ---------- */
  #crew { flex-direction: row; gap: 10px; padding: 10px; }
  #crewL { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #crewList { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; align-content: start; }
  .crewCard { background: #e1f5fe; border: 4px solid #0d1b3e; border-radius: 16px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; box-shadow: 0 5px 0 #ff5722; font: inherit; text-align: left; color: #222; }
  .crewCard .cc-emo { font-size: clamp(30px, 5vh, 44px); }
  .crewCard b { display: block; font-size: clamp(16px, 2vw, 21px); } .crewCard i { font-size: clamp(14px, 1.6vw, 17px); font-style: normal; color: #01579b; font-weight: bold; }
  #crewR { width: min(34vw, 380px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; justify-content: center; }
  #crewPick { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; background: rgba(255,255,255,.94); border: 4px solid #222; border-radius: 16px; padding: 6px; }
  #crewPick b { width: 100%; text-align: center; font-size: 17px; }
  #crewPick .btn { min-height: 46px; font-size: 17px; padding: 2px 10px; }
  /* ---------- 🗺️ home: the ocean map + 8 rescue zones ---------- */
  #hub { flex-direction: row; gap: 10px; padding: 10px; }
  #hubL { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #hubGrid { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; align-content: start; padding: 10px 4px 6px; }
  .actCard { font: inherit; position: relative; border: 5px solid #0d1b3e; border-radius: 20px; box-shadow: 0 6px 0 #0d1b3e; cursor: pointer; padding: 4px 6px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; min-height: clamp(70px, 25vh, 200px); color: #222; font-weight: bold; }
  .actCard:active { transform: translateY(5px); box-shadow: 0 1px 0 #0d1b3e; }
  .actCard .ac-emo { font-size: clamp(26px, 6vh, 56px); line-height: 1.05; }
  .actCard .ac-nm { font-size: clamp(14px, 1.7vw, 20px); text-align: center; line-height: 1.1; }
  .actCard .ac-lock { font-size: clamp(12px, 1.3vw, 15px); color: #01579b; text-align: center; }
  .actCard .ac-star { position: absolute; top: -14px; right: -8px; font-size: 22px; line-height: 1; display: none; animation: pop .5s ease-out;
    background: #fff; border: 4px solid #0d1b3e; border-radius: 12px; padding: 2px 8px; font-weight: bold; color: #0d1b3e; }
  .actCard.done .ac-star { display: block; }
  .actCard.sel { outline: 6px solid #fff59d; outline-offset: 2px; }
  #hubR { width: min(31vw, 340px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #hubR .btn { font-size: clamp(16px, 1.9vw, 21px); }
  #hubMap { flex: 0 0 auto; aspect-ratio: 1 / .72; position: relative; border: 4px solid #0d1b3e; border-radius: 16px; overflow: hidden; }
  #hubMap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hubStats { background: rgba(225,245,254,.96); border: 4px solid #0d1b3e; border-radius: 16px; padding: 4px 10px; font-weight: bold; text-align: center; font-size: clamp(15px, 1.8vw, 20px); }
  #hubTitle { display: flex; align-items: center; justify-content: center; gap: 10px; }
  #hubTitle svg { height: clamp(50px, 11vh, 96px); width: auto; }
  .starRow { display: flex; gap: 3px; justify-content: center; flex-wrap: wrap; font-size: clamp(18px, 2.4vw, 28px); }
  .starRow span.off { opacity: .25; }
  /* ---------- 🌊 one rescue zone ---------- */
  #act { flex-direction: row; gap: 10px; padding: 10px; }
  #actL { width: min(42vw, 470px); display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #actArt { flex: 0 0 auto; aspect-ratio: 4 / 3; max-height: 52%; min-height: 0; position: relative; border: 5px solid #0d1b3e; border-radius: 20px; background: #4fc3f7; overflow: hidden; }
  #actArt svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #actSteps { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #actR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #actTitle { font-size: clamp(22px, 3.2vw, 40px); }
  #helper { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: rgba(240,250,255,.97); border: 5px solid #0d1b3e; border-radius: 20px; padding: 8px 10px;
    display: flex; flex-direction: column; gap: 8px; }
  #helper .btn { font-size: clamp(16px, 2vw, 22px); }
  #helper h3 { margin: 0; text-align: center; font-size: clamp(18px, 2.4vw, 26px); }
  .hRow { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .hRow .btn { min-height: 50px; font-size: clamp(15px, 1.8vw, 20px) !important; padding: 4px 10px; }
  .bigBtn { min-height: 74px !important; font-size: clamp(21px, 2.8vw, 30px) !important; }
  .clockBig { font-family: "Courier New", monospace; font-weight: bold; text-align: center; font-size: clamp(48px, 9vh, 90px); line-height: 1; color: #01579b; }
  .clockBig.low { color: #d50000; }
  .stepNow { background: #b2ebf2; border: 4px solid #222; border-radius: 16px; padding: 8px; text-align: center; font-weight: bold; font-size: clamp(19px, 2.5vw, 28px); }
