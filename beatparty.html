<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;

// ---------- The songs ----------
// mel: notes like "C4" or "E5:0.5" (the number is how many beats; 1 beat if left out). "-" is a rest.
// chords: one per bar (4 beats), for the bass.
// new words for Hyper Factory, written just for this game. One line every 2 bars (8 beats).
const HYPER_WORDS = [
  'Welcome to the Factory, games are made right here!',
  'Robo jumps and Sparks runs, everybody cheer!',
  'Zombies in the maze and monsters in the grass,',

  'Tap the notes and feel the beat, never giving up!',
  'Hyper, hyper, Factory, lights are flashing bright,',
  "Ben's Game Factory party goes on all night!",
];
const SONGS = [
  { id: 'twinkle', name: 'Twinkle Star', icon: '⭐', level: 1, bpm: 96, speed: 210, wave: 'triangle',
    chords: 'C F F G C G C G C F F G C',
    mel: 'C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2 G4 G4 F4 F4 E4 E4 D4:2 G4 G4 F4 F4 E4 E4 D4:2 C4 C4 G4 G4 A4 A4 G4:2 F4 F4 E4 E4 D4 D4 C4:2' },
  { id: 'joy', name: 'Ode to Joy', icon: '🎉', level: 2, bpm: 108, speed: 230, wave: 'square',
    chords: 'C G C G C G C C G C G G C G C C C',
    mel: 'E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 E4:1.5 D4:0.5 D4:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:0.5 C4:2 ' +
         'D4 D4 E4 C4 D4 E4:0.5 F4:0.5 E4 C4 D4 E4:0.5 F4:0.5 E4 D4 C4 D4 G3:2 E4 E4 F4 G4 G4 F4 E4 D4 C4 C4 D4 E4 D4:1.5 C4:0.5 C4:2' },
  { id: 'robo', name: 'Robo Groove', icon: '🤖', level: 3, bpm: 116, speed: 260, wave: 'square',
    chords: 'C C F C A F C G C C F C A F C G C',
    mel: (r => r + ' ' + r)('C5:0.5 E5:0.5 G5 E5:0.5 G5:0.5 A5 G5:0.5 E5:0.5 C5:0.5 D5:0.5 E5:2 F5:0.5 A5:0.5 C6 A5:0.5 F5:0.5 G5 E5:0.5 D5:0.5 C5:0.5 D5:0.5 C5:2 ' +
         'A4:0.5 C5:0.5 E5 C5:0.5 E5:0.5 G5 F5:0.5 E5:0.5 D5:0.5 E5:0.5 F5:2 G5:0.5 G5:0.5 A5 G5:0.5 E5:0.5 C5 D5:0.5 E5:0.5 D5:0.5 B4:0.5 C5:2') },
  { id: 'rocket', name: 'Factory Rocket', icon: '🚀', level: 4, bpm: 132, speed: 310, wave: 'sawtooth',
    chords: 'C A F G C G C C C A F G C G C C C',
    mel: (r => r + ' ' + r)('C5:0.5 G4:0.5 C5:0.5 E5:0.5 G5:0.5 E5:0.5 C5:0.5 G4:0.5 A4:0.5 E5:0.5 A5:0.5 E5:0.5 C5 B4 F4:0.5 C5:0.5 F5:0.5 A5:0.5 G5:0.5 F5:0.5 E5:0.5 D5:0.5 G4:0.5 B4:0.5 D5:0.5 G5:0.5 F5 D5 ' +
         'E5:0.5 E5:0.5 G5:0.5 E5:0.5 A5:0.5 G5:0.5 E5:0.5 C5:0.5 D5:0.5 D5:0.5 F5:0.5 D5:0.5 G5:0.5 F5:0.5 D5:0.5 B4:0.5 C5:0.5 E5:0.5 G5:0.5 C6:0.5 B5:0.5 G5:0.5 E5:0.5 D5:0.5 C5 G5 C6:2') },
  // ⚡ Ben asked for a song like deadmau5's music. This one is brand new (not a copy!), in that electronic style.
  { id: 'hyper', name: 'Hyper Factory', icon: '⚡', level: 3, bpm: 128, speed: 255, wave: 'sawtooth', edm: true, lyrics: HYPER_WORDS,
    chords: 'A F C G A F C G A F C G A F C G A',
    mel: (r => r + ' ' + r)('A4:0.5 C5:0.5 E5:0.5 A5:0.5 G5:0.5 E5:0.5 C5 F4:0.5 A4:0.5 C5:0.5 F5:0.5 E5:0.5 C5:0.5 A4 C5:0.5 E5:0.5 G5:0.5 C6:0.5 B5:0.5 G5:0.5 E5 D5:0.5 G5:0.5 B5:0.5 D6:0.5 C6 B5 A5 - E5:0.5 A5:0.5 C6 A5 - F5:0.5 A5:0.5 C6 G5:0.5 E5:0.5 G5:0.5 C6:0.5 E6 D6 B5:0.5 G5:0.5 D5:0.5 B4:0.5 G4:2') },
  { id: 'hyperglitch', name: 'Hyper GL1TCH', icon: '👾', level: 4, bpm: 136, speed: 285, wave: 'square', edm: true, glitch: true, lyrics: HYPER_WORDS,
    chords: 'A F C G A F C G A F C G A F C G A',
    mel: (r => r + ' ' + r)('A4:0.5 C5:0.5 E5:0.5 A5:0.5 G5:0.5 E5:0.5 C5 F4:0.5 A4:0.5 C5:0.5 F5:0.5 E5:0.5 C5:0.5 A4 C5:0.5 E5:0.5 G5:0.5 C6:0.5 B5:0.5 G5:0.5 E5 D5:0.5 G5:0.5 B5:0.5 D6:0.5 C6 B5 A5 - E5:0.5 A5:0.5 C6 A5 - F5:0.5 A5:0.5 C6 G5:0.5 E5:0.5 G5:0.5 C6:0.5 E6 D6 B5:0.5 G5:0.5 D5:0.5 B4:0.5 G4:2') },
];
const CHORD_ROOT = { C: 36, D: 38, E: 40, F: 41, G: 43, A: 45, B: 47 };
function midi(n) { const m = /^([A-G])(#|b)?(\d)$/.exec(n); return 12 * (+m[3] + 1) + { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 }[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0); }
const hz = m => 440 * Math.pow(2, (m - 69) / 12);
const LEAD_IN = 4;   // beats of drums before the first note
// turn a song into notes: { t: seconds, lane, m: midi note }
function chart(song) {
  const beat = 60 / song.bpm, notes = [];
  let b = LEAD_IN;
  for (const tok of song.mel.trim().split(/\s+/)) {
    const [n, len] = tok.split(':'); const beats = len ? +len : 1;
    if (n !== '-') {
      if (song.glitch && beats >= 1 && notes.length % 3 === 1) { notes.push({ t: b * beat, m: midi(n), len: beat / 2 }, { t: (b + 0.5) * beat, m: midi(n) + 12, len: beat / 2 }); }   // GL1TCH stutter!
      else notes.push({ t: b * beat, m: midi(n), len: beats * beat });
    }
    b += beats;
  }
  // lower notes on the left, higher notes on the right, and about the same number of notes in each lane
  const pitches = [...new Set(notes.map(n => n.m))].sort((a, b) => a - b), laneOf = {};
  let before = 0;
  for (const m of pitches) { const cnt = notes.filter(n => n.m === m).length; laneOf[m] = Math.min(3, Math.floor((before + cnt / 2) / notes.length * 4)); before += cnt; }
  for (const n of notes) n.lane = laneOf[n.m];
  return { notes, endT: b * beat + 2.5, beat };
}

// ---------- Sound ----------
let actx = null;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } if (actx && actx.state !== 'running') actx.resume(); }
function tone(f, at, dur, type = 'square', vol = 0.1, slideTo) {
  if (!actx) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, at); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, at + dur);
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  o.connect(g); g.connect(actx.destination); o.start(at); o.stop(at + dur + 0.02);
}
function noise(at, dur, vol, hp) {
  if (!actx) return;
  const buf = actx.createBuffer(1, Math.floor(actx.sampleRate * dur), actx.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = buf; f.type = 'highpass'; f.frequency.value = hp; g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(0.001, at + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination); s.start(at);
}
const kick = at => tone(150, at, 0.18, 'sine', 0.5, 40);
const snare = at => { noise(at, 0.14, 0.25, 1500); tone(220, at, 0.08, 'triangle', 0.12); };
const hat = at => noise(at, 0.04, 0.08, 7000);
const sfx = {
  click: () => { if (actx) tone(700, actx.currentTime, 0.06, 'square', 0.08); },
  miss: () => { if (actx) tone(110, actx.currentTime, 0.12, 'sawtooth', 0.05, 80); },
  cheer: () => { if (actx) { noise(actx.currentTime, 1.2, 0.12, 900); [523, 659, 784, 1047].forEach((f, i) => tone(f, actx.currentTime + i * 0.1, 0.3, 'square', 0.07)); } },
};

// ---------- Save ----------
let SAVE = { best: {}, mine: [] };   // best: { songId: { stars, score } }, mine: your own songs from the Song Maker
try { const s = JSON.parse(localStorage.getItem('beatParty') || 'null'); if (s) SAVE = Object.assign(SAVE, s); } catch (_) {}
function save() { try { localStorage.setItem('beatParty', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Game state ----------
const LANES = 4, LANE_W = 104, LX = W / 2 - LANES * LANE_W / 2, HIT_Y = 430;
const LANE_COL = ['#ff4f6d', '#3fa9ff', '#ffd23f', '#4cd97b'];
const KEYS = [['d', 'arrowleft', '1'], ['f', 'arrowdown', '2'], ['j', 'arrowup', '3'], ['k', 'arrowright', '4']];
const JUDGE = [[0.07, 'PERFECT!', 100, '#ffe066'], [0.12, 'GREAT!', 70, '#7cf3ff'], [0.18, 'OK', 40, '#c6b3ff']];
let scene = 'title', frame = 0, song = null, notes = [], endT = 0, beatLen = 0.5, t0 = 0, clock = null;
let score = 0, combo = 0, bestCombo = 0, hype = 0.5, counts = { PERFECT: 0, GREAT: 0, OK: 0, MISS: 0 }, pops = [], laneFlash = [0, 0, 0, 0];
let saidLine = -1, glitchT = 0, nextEvent = 0, events = [], particles = [], result = null, sel = 0, mouse = { x: 0, y: 0 }, lastTouch = 0;
// song time in seconds: the audio clock when there is sound (so notes match the music exactly), else a normal clock
function now() { return clock !== null ? clock : actx ? actx.currentTime - t0 : performance.now() / 1000 - t0; }

function startSong(i) { sel = i; playSong(SONGS[i]); }
function playSong(theSong) {
  audio();
  song = theSong; saidLine = -1;
  if (song.lyrics) voiceWake();
  const c = chart(song); notes = c.notes.map(n => ({ ...n, hit: false, missed: false })); endT = c.endT; beatLen = c.beat;
  // the backing band: drums + bass, planned ahead and played on the audio clock
  events = [];
  const bars = Math.ceil(endT / (beatLen * 4)), roots = song.chords.split(' ');
  for (let bar = 0; bar < bars; bar++) for (let k = 0; k < 8; k++) {
    const t = (bar * 4 + k / 2) * beatLen; if (t > endT - 2) break;
    const onBeat = k % 2 === 0, beatN = k / 2;
    if (onBeat && (beatN === 0 || beatN === 2 || song.level >= 3)) events.push({ t, f: kick });
    if (onBeat && (beatN === 1 || beatN === 3) && bar >= 1) events.push({ t, f: snare });
    events.push({ t, f: hat });
    const root = CHORD_ROOT[roots[Math.max(0, bar - 1) % roots.length]] || 36;   // bar 0 is the drum count-in
    if (song.edm) { if (bar >= 1 && !onBeat) events.push({ t, f: at => tone(hz(root), at, beatLen * 0.4, 'sawtooth', 0.09) }); }
    else if (bar >= 1 && onBeat) { const m = root + (beatN === 2 ? 7 : 0); events.push({ t, f: at => tone(hz(m), at, beatLen * 0.9, 'triangle', 0.18) }); }
  }
  events.sort((a, b) => a.t - b.t); nextEvent = 0;
  score = 0; combo = 0; bestCombo = 0; hype = 0.5; counts = { PERFECT: 0, GREAT: 0, OK: 0, MISS: 0 }; pops = []; particles = [];
  t0 = actx ? actx.currentTime + 0.3 : performance.now() / 1000 + 0.3;
  scene = 'play'; sfx.click();
}
function hitLane(l) {
  if (scene !== 'play') return;
  laneFlash[l] = 10;
  const t = now();
  let best = null;
  for (const n of notes) if (!n.hit && !n.missed && n.lane === l && Math.abs(n.t - t) < JUDGE[2][0] && (!best || Math.abs(n.t - t) < Math.abs(best.t - t))) best = n;
  if (!best) return;   // tapping with no note is fine: no penalty
  const dt = Math.abs(best.t - t), j = JUDGE.find(j => dt < j[0]);
  best.hit = true; combo++; bestCombo = Math.max(bestCombo, combo);
  const mult = Math.min(3, 1 + Math.floor(combo / 10) * 0.5);
  score += Math.round(j[2] * mult); counts[j[1].replace('!', '')]++;
  hype = Math.min(1, hype + 0.03);
  // YOU play the melody note!
  if (actx) {
    const g = song.glitch && Math.random() < 0.3 ? 12 : 0;
    tone(hz(best.m + g), actx.currentTime, Math.min(0.6, best.len * 0.9), song.wave, song.edm ? 0.07 : 0.09);
    if (song.glitch && Math.random() < 0.25) tone(hz(best.m + 7), actx.currentTime + 0.06, 0.06, 'square', 0.05);   // little glitch blip
  }
  if (song.glitch && Math.random() < 0.3) glitchT = 8;
  pops.push({ text: j[1], col: j[3], x: LX + l * LANE_W + LANE_W / 2, y: HIT_Y - 50, life: 40 });
  for (let i = 0; i < 10; i++) { const a = Math.random() * 6.28, s = 2 + Math.random() * 4; particles.push({ x: LX + l * LANE_W + LANE_W / 2, y: HIT_Y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, life: 30, c: LANE_COL[l] }); }
}
function finishSong() {
  const total = notes.length * 100, got = counts.PERFECT * 100 + counts.GREAT * 70 + counts.OK * 40, acc = got / total;
  const stars = acc >= 0.85 ? 3 : acc >= 0.6 ? 2 : 1;   // you always get at least 1 star for finishing!
  const old = SAVE.best[song.id] || { stars: 0, score: 0 };
  const newBest = score > old.score;
  SAVE.best[song.id] = { stars: Math.max(old.stars, stars), score: Math.max(old.score, score) }; save();
  result = { stars, acc, newBest, t: 0 };
  scene = 'results'; sfx.cheer();
}

// ---------- Song Maker: tap boxes to make your own song! ----------
const MK_NOTES = ['C4', 'D4', 'E4', 'F4', 'G4', 'A4', 'B4', 'C5'];        // bottom row to top row
const MK_COL = ['#ff4f6d', '#ff8c42', '#ffd23f', '#4cd97b', '#3fd0c9', '#3fa9ff', '#7c4dff', '#ff6ec7'];
const MK_STEPS = 32, MK_X = 90, MK_Y = 112, MK_CW = 25, MK_RH = 30;     // 32 beats, 8 notes high
const MK_SPEEDS = [['🐢 Slow', 90], ['🚶 Medium', 110], ['🐇 Fast', 130]];
const MK_SOUNDS = [['🔔 Beep', 'square'], ['🎺 Buzz', 'sawtooth'], ['🎵 Soft', 'triangle']];
const MK_ICONS = ['🎸', '🦖', '🚀', '🌈', '🐱', '🤖', '⭐', '🍕', '🐶', '👾', '🦄', '🔥'];
const MK_A = ['Super', 'Funky', 'Sparkly', 'Crazy', 'Happy', 'Spooky', 'Turbo', 'Jumpy', 'Cosmic', 'Silly'];
const MK_B = ['Dino', 'Robot', 'Zombie', 'Kitty', 'Puppy', 'Pizza', 'Rocket', 'Monster', 'Ninja', 'Alien'];
const MK_C = ['Jam', 'Dance', 'Beat', 'Boogie', 'Groove', 'Party', 'Song', 'Rock', 'Tune', 'Blast'];
const rnd = a => a[Math.floor(Math.random() * a.length)];
let mk = null, mkSlot = 0, mkPaint = null, mkListen = null;
function newMine() { return { name: `${rnd(MK_A)} ${rnd(MK_B)} ${rnd(MK_C)}`, icon: rnd(MK_ICONS), speed: 1, sound: 0, steps: Array(MK_STEPS).fill(-1) }; }
function openMaker(slot) { mkSlot = slot; mk = JSON.parse(JSON.stringify(SAVE.mine[slot] || newMine())); mkListen = null; scene = 'maker'; sfx.click(); }
function saveMine() { SAVE.mine[mkSlot] = JSON.parse(JSON.stringify(mk)); save(); }
// turn one of your songs into a song the game can play
function mineToSong(m, slot) {
  const mel = m.steps.map(i => i < 0 ? '-' : MK_NOTES[i]).join(' ');
  // pick a bass note for each bar from the notes in it
  const chords = [];
  for (let bar = 0; bar < MK_STEPS / 4; bar++) {
    const ns = m.steps.slice(bar * 4, bar * 4 + 4).filter(i => i >= 0).map(i => MK_NOTES[i][0]);
    const fit = ch => ns.filter(n => ({ C: 'CEG', F: 'FAC', G: 'GBD', A: 'ACE' })[ch].includes(n)).length;
    chords.push(['C', 'F', 'G', 'A'].reduce((best, ch) => fit(ch) > fit(best) ? ch : best, 'C'));
  }
  const bpm = MK_SPEEDS[m.speed][1];
  return { id: 'mine' + slot, mine: slot, name: m.name, icon: m.icon, level: 2, bpm, speed: 210 + (bpm - 90) * 1.5, wave: MK_SOUNDS[m.sound][1], chords: chords.join(' '), mel };
}
const mkHasNotes = m => m && m.steps.some(i => i >= 0);
function mkCellAt(x, y) {
  const c = Math.floor((x - MK_X) / MK_CW), r = 7 - Math.floor((y - MK_Y) / MK_RH);
  return c >= 0 && c < MK_STEPS && r >= 0 && r < 8 ? [c, r] : null;
}
function mkTouch(cell, start) {
  if (!cell) return;
  const [c, r] = cell;
  if (start) mkPaint = mk.steps[c] === r ? 'erase' : 'draw';
  if (mkPaint === 'erase') { if (mk.steps[c] === r) mk.steps[c] = -1; }
  else if (mk.steps[c] !== r) { mk.steps[c] = r; if (actx) tone(hz(midi(MK_NOTES[r])), actx.currentTime, 0.25, MK_SOUNDS[mk.sound][1], 0.08); }
}
function mkToggleListen() {
  audio();
  if (mkListen) { mkListen = null; return; }
  mkListen = { start: (actx ? actx.currentTime : performance.now() / 1000) + 0.1, step: -1 };
}
function mkUpdate() {
  if (!mkListen) return;
  const beat = 60 / MK_SPEEDS[mk.speed][1], t = (actx ? actx.currentTime : performance.now() / 1000) - mkListen.start, step = Math.floor(t / beat);
  if (step >= MK_STEPS) { mkListen = null; return; }
  if (step > mkListen.step && step >= 0) {
    mkListen.step = step;
    const r = mk.steps[step];
    if (actx) { if (r >= 0) tone(hz(midi(MK_NOTES[r])), actx.currentTime, beat * 0.9, MK_SOUNDS[mk.sound][1], 0.09); if (step % 2 === 0) kick(actx.currentTime); else hat(actx.currentTime); }
  }
}
function makerButtons() {
  if (scene === 'mysongs') {
    for (let i = 0; i < 4; i++) {
      const m = SAVE.mine[i], x = 60 + i * 215;
      if (m) {
        buttons.push({ x, y: 240, w: 195, h: 150, fn: () => { if (mkHasNotes(m)) playSong(mineToSong(m, i)); }, mineCard: i });
        buttons.push({ x, y: 400, w: 195, h: 44, fn: () => openMaker(i), label: '✏️ Change it', col: '#3fa9ff', small: true });
      } else buttons.push({ x, y: 240, w: 195, h: 150, fn: () => openMaker(i), emptyCard: true });
    }
    buttons.push({ x: 18, y: 18, w: 100, h: 40, fn: () => { scene = 'title'; }, label: '◀ Back', col: '#455a64', small: true });
  } else {
    const B = (x, w, label, fn, col) => buttons.push({ x, y: 382, w, h: 46, fn, label, col, small: true });
    B(90, 130, mkListen ? '⏹ Stop' : '▶ Listen', mkToggleListen, '#4cd97b');
    B(230, 140, MK_SPEEDS[mk.speed][0], () => { mk.speed = (mk.speed + 1) % 3; sfx.click(); }, '#3fa9ff');
    B(380, 140, MK_SOUNDS[mk.sound][0], () => { mk.sound = (mk.sound + 1) % 3; sfx.click(); }, '#7c4dff');
    B(530, 140, '🎲 New name', () => { const n = newMine(); mk.name = n.name; mk.icon = n.icon; sfx.click(); }, '#ff8c42');
    B(680, 110, '🗑 Clear', () => { mk.steps.fill(-1); mkListen = null; sfx.click(); }, '#78909c');
    buttons.push({ x: W / 2 - 290, y: 446, w: 280, h: 58, fn: () => { saveMine(); mkListen = null; scene = 'mysongs'; sfx.click(); }, label: '💾 Save', col: '#43a047' });
    buttons.push({ x: W / 2 + 10, y: 446, w: 280, h: 58, fn: () => { if (!mkHasNotes(mk)) return; saveMine(); mkListen = null; playSong(mineToSong(mk, mkSlot)); }, label: '🎮 Save & Play it!', col: mkHasNotes(mk) ? '#ff4f6d' : '#555' });
    buttons.push({ x: 18, y: 18, w: 100, h: 40, fn: () => { mkListen = null; scene = 'mysongs'; }, label: '◀ Back', col: '#455a64', small: true });
  }
}
function drawMaker() {
  text(`${mk.icon} ${mk.name}`, W / 2, 50, 30, '#ffd740');
  text('Tap the boxes to make your song! Tap a note again to take it away.', W / 2, 88, 17, '#fff', 'center', null);
  rr(MK_X - 8, MK_Y - 8, MK_STEPS * MK_CW + 16, 8 * MK_RH + 16, 14, 'rgba(10,4,25,.8)');
  for (let r = 0; r < 8; r++) {

      if (result.stars < 3) text(result.stars === 2 ? 'Get 85% right for 3 stars!' : 'Get 60% right for 2 stars!', W / 2, 395, 18, '#ff9de2', 'center', null);
    }
    for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life / 30); circle(p.x, p.y, 4, p.c); } ctx.globalAlpha = 1;
  }
  drawButtons();
}

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(ts) {
  acc += Math.min(100, ts - last); last = ts;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
buildButtons();
requestAnimationFrame(loop);
</script>
</body>
</html>
