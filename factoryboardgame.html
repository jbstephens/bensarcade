<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎲 The Game Factory Board Game</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; color: #3d2b23;
    overflow: hidden; user-select: none; -webkit-user-select: none; background: linear-gradient(#8fd3ff, #c8f7c5 60%, #6dbb5a); }
  input, textarea { font: inherit; user-select: text; -webkit-user-select: text; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #bar { display: flex; gap: 8px; padding: 6px 10px 12px; justify-content: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #3d2b23; border-radius: 16px; background: #ffe082;
    padding: 8px 14px; cursor: pointer; box-shadow: 0 5px 0 #3d2b23; color: #222; min-height: 56px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #3d2b23; }
  .b1 { background: #a5f2a5; } .b2 { background: #b3e5fc; } .b3 { background: #d1b8ff; } .b4 { background: #ffccbc; } .b5 { background: #fff0c8; } .b6 { background: #ffb74d; } .b7 { background: #ff9ecb; }
  .hide { display: none !important; }
  .panel { position: fixed; inset: 0; background: rgba(40, 24, 10, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .panel.on { display: flex; }
  .card { background: #fffbe8; border: 6px solid #3d2b23; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1100px;
    max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.2vw, 36px); }
  .hint { margin: 0; text-align: center; font-size: 19px; font-weight: bold; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .big { font-size: 26px; padding: 10px 14px; border: 4px solid #3d2b23; border-radius: 14px; width: 100%; max-width: 560px; background: #fff; text-align: center; }
  #prGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .thumb { background: #fff; border: 5px solid #3d2b23; border-radius: 16px; padding: 6px; cursor: pointer; box-shadow: 0 5px 0 #ffb74d;
    display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding-top: 4px; }
  .thumb:active { transform: scale(.96); }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(50vh, 600px); width: auto; max-width: 100%; border: 4px solid #3d2b23; border-radius: 8px; background: #fff; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fffbe8; border: 5px solid #3d2b23;
    border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 90; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px 10px; } #top h1 { font-size: 22px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  .chip { font-size: 18px; min-height: 50px; padding: 4px 10px; background: #fff; }
  .chip.sel { background: #ffd740; outline: 4px solid #ff4081; outline-offset: 1px; }
  body { overflow: auto; height: auto; min-height: 100%; background: linear-gradient(#ffe0f0, #fff3c4 50%, #c8f7c5); }
  #app { display: flex; flex-direction: column; min-height: 100vh; }
  #top { display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; flex-wrap: wrap; justify-content: center; }

  #main { display: flex; gap: 10px; padding: 4px 10px; flex: 1; align-items: flex-start; flex-wrap: wrap; justify-content: center; }
  #boardBox { flex: 1 1 620px; min-width: 300px; max-width: 1300px; }
  #board { width: 100%; height: auto; display: block; background: #fff; border: 5px solid #3d2b23; border-radius: 18px; }
  .tok { transition: transform .22s ease-out; }
  .tok.me { animation: bob .7s ease-in-out infinite alternate; }
  @keyframes bob { to { filter: drop-shadow(0 0 6px #ffd740); } }
  #side { flex: 0 1 260px; min-width: 230px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
  #info { background: #fffbe8; border: 4px solid #3d2b23; border-radius: 18px; padding: 8px 12px; font-size: 21px; font-weight: bold; text-align: center; min-height: 90px; width: 100%; }
  #die, #bossDie { width: 120px; height: 120px; }
  #die svg, #bossDie svg { width: 100%; height: 100%; display: block; }
  .rolling { animation: roll .25s linear infinite; }
  @keyframes roll { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(.85); } 100% { transform: rotate(360deg) scale(1); } }
  #rollBtn { font-size: 32px; min-height: 80px; width: 100%; background: #ff8a65; }
  #rollBtn:disabled { opacity: .5; }
  #bar { display: flex; gap: 8px; padding: 6px 10px 14px; justify-content: center; flex-wrap: wrap; }
  .pick { display: flex; flex-direction: column; align-items: center; width: 150px; background: #fff; font-size: 17px; }
  .pick svg { width: 110px; height: 110px; } .pick i { font-size: 13px; font-style: normal; color: #666; }
  .bigPic svg { width: 170px; height: 170px; display: block; margin: 0 auto; }
  .say { font-size: clamp(22px, 3vw, 30px); font-weight: bold; text-align: center; margin: 0; }
</style>
</head>
<body>
<div id="app">
  <div id="top"><h1>🎲 THE GAME FACTORY BOARD GAME</h1></div>
  <div id="bar">
    <button class="btn b1" id="bPlay">▶️ Play on screen</button>
    <button class="btn b6" id="bPrint">🖨️ Print the game</button>
    <button class="btn b2" id="bRules">📜 Rules</button>
  </div>
  <div id="main">
    <div id="boardBox"><svg id="board" viewBox="0 0 1560 1000" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="side">
      <div id="info"></div>
      <div id="die"></div>
      <button class="btn" id="rollBtn" disabled>🎲 ROLL!</button>
    </div>
  </div>
</div>
<div id="setPanel" class="panel lock"><div class="card">
  <h2>▶️ Who is playing?</h2>
  <div class="row" id="nRow"></div>
  <p class="hint">Tap a player to pick a different character!</p>
  <div class="row" id="pickRow"></div>
  <div class="row"><button class="btn b1" id="goBtn">🏁 START!</button><button class="btn b4" data-close="1">❌ Close</button></div>
</div></div>
<div id="funPanel" class="panel lock"><div class="card">
  <h2 id="funWho"></h2>
  <div class="bigPic" id="funPic"></div>
  <p class="say" id="funTxt"></p>
  <div class="row"><button class="btn b1" id="funOk">✅ I did it!</button></div>
</div></div>
<div id="bossPanel" class="panel lock"><div class="card">
  <h2>👑 BOSS SPACE!</h2>
  <div class="row"><div class="bigPic" id="bossPic"></div><div id="bossDie"></div></div>
  <p class="say" id="bossTxt"></p>
  <div class="row"><button class="btn b6" id="bossRoll">🎲 Roll!</button><button class="btn b1 hide" id="bossOk">➡️ OK</button></div>
</div></div>
<div id="winPanel" class="panel"><div class="card">
  <h2>🏆 WINNER! 🏆</h2>
  <div class="bigPic" id="winPic"></div>
  <p class="say" id="winTxt"></p>
  <div class="row"><button class="btn b1" id="againBtn">🔁 Play again</button><button class="btn b6" data-close="1">🎉 Yay!</button></div>
</div></div>
<script>
'use strict';

//  ▶️ Play on screen: 2-4 players pass the device around, same rules. ?fast=1 = quick animations (for tests).

  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';

const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);

// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.

const SKIP = null;

  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');

  if (clear) return SKIP;

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';

    '<path d="M-4 -3 L13 -9.6 M-4 3 L13 9.6" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" fill="none"/>' +

    '<circle cx="-10" cy="-6" r="2.2" fill="#fff"/><circle cx="-10" cy="6" r="2.2" fill="#fff"/><circle cx="-2" cy="0" r="1.6" fill="' + INK + '"/></g>'; };

    '<rect x="0" y="0" width="800" height="1000" fill="#fff"/>' + body + '</svg>';

// =====================================================================
// CHARACTERS (copied from the Art Gallery; each drawn around 0,0, about 120 tall)
// =====================================================================
function robo(o) {

  o = o || {}; const R0 = 58, rot = (o.rot || 0) + (o.wave ? -0.12 : 0), cy = -4;
  const LEN = [1, .74, .93, .7, 1, .78, .9, .72, .98, .69, .95, .8];
  let d = ''; LEN.forEach((q, i) => { const a = rot + i * Math.PI * 2 / LEN.length - Math.PI / 2;
    d += 'M' + n(Math.cos(a) * 6) + ' ' + n(cy + Math.sin(a) * 6) + ' L' + n(Math.cos(a) * R0 * q) + ' ' + n(cy + Math.sin(a) * R0 * q) + ' '; });
  let s = tube(d, COR, 17) + C(0, cy, 21, COR, 0);
  const EYE = CDARK;
  if (o.happy) s += L('M-13 ' + (cy - 3) + ' Q-8 ' + (cy - 10) + ' -3 ' + (cy - 3) + ' M3 ' + (cy - 3) + ' Q8 ' + (cy - 10) + ' 13 ' + (cy - 3), EYE, 3.2);
  else s += E(-8, cy - 4, 3.6, 5, EYE, 0) + E(8, cy - 4, 3.6, 5, EYE, 0) + (LINE ? '' : C(-7, cy - 6, 1.3, '#fff', 0) + C(9, cy - 6, 1.3, '#fff', 0));
  s += L('M-7 ' + (cy + 7) + ' Q0 ' + (cy + 13) + ' 7 ' + (cy + 7), EYE, 2.6);

  return s;
}

function brk(x, y, w, h, col, studs) {
  let s = R(x, y, w, h, 3, vshade(col), OL, 2.2);
  const k = studs || Math.max(1, Math.round(w / 14)); for (let i = 0; i < k; i++) s += R(x + (i + .5) * w / k - 4, y - 4, 8, 5, 2, lite(col, .2), OL, 1.4);
  return s;
}

// a wiggly tentacle (Kraken King's look from the Boss Studio), x0,y0 -> x1,y1
function tent(x0, y0, x1, y1, wig, w, ph, col, dots) {
  let d = 'M' + n(x0) + ' ' + n(y0); const N = 10, dx = x1 - x0, dy = y1 - y0, Ln = Math.hypot(dx, dy) || 1, pts = [];
  for (let k = 1; k <= N; k++) { const f = k / N, s = Math.sin(ph + f * 5) * wig * f, x = x0 + dx * f - dy / Ln * s, y = y0 + dy * f + dx / Ln * s; d += ' L' + n(x) + ' ' + n(y); pts.push([x, y]); }
  let o = tube(d, col, w);
  if (dots) for (let k = 1; k < N - 1; k += 2) o += C(pts[k][0], pts[k][1], w * .22, dots, 0);
  return o;
}

  for (const e of [-1, 1]) s += C(e * 36 * S, -28 * S, 21 * S, '#fff', OL, 2) + C(e * 36 * S + 3, -24 * S, 10 * S, '#311b92', 0) + C(e * 36 * S, -27 * S, 3, '#fff', 0);

// ---------- Fun Cards (10 per page) ----------
function funPage(part) {

// ---------- the rules (big simple words) ----------

const PAGES = [
  { id: 'rules', name: '📜 How to Play', build: rulesPage, how: 'The rules in big simple words. Print this one first!' },
  { id: 'b1', name: '🗺️ Board: Page 1', build: () => boardPage(0), how: 'The left half of the board. Cut on the right line.' },
  { id: 'b2', name: '🗺️ Board: Page 2', build: () => boardPage(1), how: 'The right half. Cut on the left line, match the half circles, tape on the back.' },
  { id: 'die', name: '🎲 Paper Die', build: dicePage, how: 'Cut, fold the dashed lines, glue the tabs inside. Opposite sides add up to 7, like a real die!' },
  { id: 'pieces', name: '🧍 Player Pieces', build: piecesPage, how: 'Cut, fold in the middle, glue the backs together, fold the feet out.' },
  { id: 'fun1', name: '🎁 Fun Cards 1', build: () => funPage(0), how: '10 silly Fun Cards.' },
  { id: 'fun2', name: '🎁 Fun Cards 2', build: () => funPage(1), how: '10 more silly Fun Cards.' }];
// =====================================================================
// 📺 PLAY ON SCREEN: 2-4 players pass the device around (same rules as the paper game)
// =====================================================================
const FAST = /[?&]fast=1/.test(location.search), WAIT = ms => FAST ? ms / 12 : ms;

let G0 = null, setupN = 2, setupK = ['robo', 'sammy', 'sparks', 'pink'];
const tokOff = [[-20, -18], [20, -18], [-20, 20], [20, 20]];
function drawScreenBoard() {
  beginArt(false);
  const body = fullBoard() + '<g id="toks"></g>';
  $('board').innerHTML = sceneOut(body);
}
function drawTokens() {
  beginArt(false);
  const g = G0 ? G0.pl.map((p, i) => { const [x, y] = SP[p.pos], [ox, oy] = tokOff[i];
    return '<g class="tok' + (i === G0.cur && !G0.over ? ' me' : '') + '" id="tok' + i + '" style="transform:translate(' + n(x + ox) + 'px,' + n(y + oy) + 'px)">' +
      C(0, 0, 30, RAINBOW[[0, 4, 3, 6][i]], OL, 3) + C(0, 0, 25, '#fff', 0) + person(p.k, 0, 2, 44) + '</g>'; }).join('') : '';
  const t = $('toks'); if (t) { const old = t.parentNode.querySelector('#tokDefs'); if (old) old.remove(); t.insertAdjacentHTML('beforebegin', '<defs id="tokDefs">' + DEFS.join('') + '</defs>'); t.innerHTML = g; }
}
function moveTok(i) { const p = G0.pl[i], [x, y] = SP[p.pos], [ox, oy] = tokOff[i], el = $('tok' + i); if (el) el.style.transform = 'translate(' + n(x + ox) + 'px,' + n(y + oy) + 'px)'; }
function dieHTML(v) { beginArt(false); return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">' + sceneOut(R(3, 3, 94, 94, 14, '#fff', OL, 4) + dieFace(8, 8, 84, v, '#fff')) + '</svg>'; }
function info(t) { $('info').textContent = t; }
function pname(i) { return PEOPLE[G0.pl[i].k][0] + (G0.pl.length > 1 ? ' (Player ' + (i + 1) + ')' : ''); }
// ---------- setup ----------
function openSetup() { openPanel('setPanel'); renderSetup(); }
function renderSetup() {
  $('nRow').innerHTML = [2, 3, 4].map(k => '<button class="btn chip' + (k === setupN ? ' sel' : '') + '" data-n="' + k + '">' + k + ' players</button>').join('');
  $('pickRow').innerHTML = setupK.slice(0, setupN).map((k, i) => '<button class="btn pick" data-p="' + i + '"><b>Player ' + (i + 1) + '</b>' + thumb(k) + '<span>' + PEOPLE[k][0] + '</span><i>tap to change</i></button>').join('');
}
function thumb(k) { beginArt(false); return '<svg viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg">' + sceneOut(R(2, 2, 136, 136, 18, lin([[0, '#fff8e1'], [1, '#ffe0b2']]), 0) + person(k, 70, 74, 112)) + '</svg>'; }
function setupClick(e) {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.n) { setupN = +b.dataset.n; blip(600, 0, .1); renderSetup(); }
  if (b.dataset.p !== undefined) { const i = +b.dataset.p; let j = PIECES.indexOf(setupK[i]);
    do { j = (j + 1) % PIECES.length; } while (setupK.slice(0, setupN).some((k, q) => q !== i && k === PIECES[j]));
    setupK[i] = PIECES[j]; blip(700 + i * 60, 0, .1); renderSetup(); }
}
function startGame() {
  G0 = { pl: setupK.slice(0, setupN).map(k => ({ k, pos: 0, skip: 0 })), cur: 0, busy: false, over: false, deck: shuffle(FUN.map((f, i) => i)), turns: 0 };
  closePanels(); drawTokens(); $('die').innerHTML = dieHTML(1); $('rollBtn').disabled = false;
  info('🎲 ' + pname(0) + ', it is your turn! Tap ROLL.'); tune([523, 659, 784], .1);
}
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
// ---------- rolling + moving ----------
function rollDie(done) {
  const d = $('die'); d.classList.add('rolling'); let k = 0; const v = 1 + Math.floor(Math.random() * 6);
  const tm = setInterval(() => { d.innerHTML = dieHTML(1 + Math.floor(Math.random() * 6)); blip(300 + Math.random() * 300, 0, .05, 'triangle', .2); if (++k >= 10) { clearInterval(tm); d.classList.remove('rolling'); d.innerHTML = dieHTML(v); blip(880, 0, .15); setTimeout(() => done(v), WAIT(300)); } }, WAIT(80));
}
function steps(i, nSteps, done) {
  const p = G0.pl[i], dir = nSteps < 0 ? -1 : 1; let left = Math.abs(nSteps);
  const hop = () => { if (!left || (dir > 0 && p.pos >= NSP - 1) || (dir < 0 && p.pos <= 0)) return done();
    p.pos += dir; left--; moveTok(i); blip(dir > 0 ? 520 + p.pos * 8 : 400 - p.pos * 4, 0, .08); setTimeout(hop, WAIT(260)); };
  hop();
}
function rollClick() {
  if (!G0 || G0.busy || G0.over) return; G0.busy = true; $('rollBtn').disabled = true; const i = G0.cur;
  rollDie(v => { info('🎲 ' + pname(i) + ' rolled a ' + v + '!'); steps(i, v, () => land(i, true)); });
}
function land(i, special) {
  const p = G0.pl[i];
  if (p.pos >= NSP - 1) return win(i);
  const t = special && SPECIAL[p.pos];
  if (t === 'bonus') { info('⭐ STAR! ' + pname(i) + ' zooms ahead 2!'); tune([660, 880], .08); return setTimeout(() => steps(i, 2, () => land(i, false)), WAIT(600)); }
  if (t === 'magnet') { info('🧲 Magnetron pulls ' + pname(i) + ' back 2!'); slide(500, 250, 0, .4); return setTimeout(() => steps(i, -2, () => land(i, false)), WAIT(600)); }
  if (t === 'warp') { info('🌀 WARP ' + WARPL[p.pos] + '! Zoom to the other warp!'); slide(300, 1200, 0, .5); return setTimeout(() => { p.pos = WARP[p.pos]; moveTok(i); setTimeout(() => land(i, false), WAIT(500)); }, WAIT(500)); }

  if (t === 'boss') return bossFight(i);

}
function funCard(i) {

  const c = FUN[G0.deck.pop()]; G0.card = c;
  $('funPic').innerHTML = thumb(c[0]); $('funTxt').textContent = c[1]; $('funWho').textContent = '🎁 Fun Card for ' + pname(i) + '!';
  openPanel('funPanel'); speak(c[1]); tune([784, 988, 1175], .09);
}
function funOk() {
  closePanels(); const i = G0.cur, e = G0.card[2];
  if (e === 'again') { info('🔁 ' + pname(i) + ' rolls again!'); return next(true); }
  if (!e) return next(false);

}
function bossFight(i) {
  const k = BOSS[G0.pl[i].pos]; G0.boss = k;
  $('bossPic').innerHTML = thumb(k); $('bossTxt').textContent = '👑 ' + BOSSNAME[k] + ' blocks the way! Roll a 4, 5 or 6 to beat the boss!';
  $('bossDie').innerHTML = dieHTML(1); $('bossRoll').disabled = false; $('bossRoll').classList.remove('hide'); $('bossOk').classList.add('hide'); openPanel('bossPanel');
}
function bossRoll() {
  $('bossRoll').disabled = true; const i = G0.cur, d = $('bossDie'); let k = 0; const v = 1 + Math.floor(Math.random() * 6);
  const tm = setInterval(() => { d.innerHTML = dieHTML(1 + Math.floor(Math.random() * 6)); if (++k >= 8) { clearInterval(tm); d.innerHTML = dieHTML(v);
    if (v >= 4) { $('bossTxt').textContent = '🎉 You rolled ' + v + '! You beat ' + BOSSNAME[G0.boss] + '! BONK!'; tada(); }
    else { $('bossTxt').textContent = '😮 You rolled ' + v + '. ' + BOSSNAME[G0.boss] + ' wins this time. Skip your next turn!'; G0.pl[i].skip = 1; oops(); }
    $('bossOk').classList.remove('hide'); $('bossRoll').classList.add('hide'); } }, WAIT(80));
}
function next(again) {
  G0.turns++;
  if (!again) { G0.cur = (G0.cur + 1) % G0.pl.length; let guard = 0;
    while (G0.pl[G0.cur].skip && guard++ < 4) { G0.pl[G0.cur].skip = 0; info('😴 ' + pname(G0.cur) + ' skips this turn.'); G0.cur = (G0.cur + 1) % G0.pl.length; } }
  setTimeout(() => { G0.busy = false; $('rollBtn').disabled = false; drawTokens();
    info((again ? '🔁 Roll again, ' : '🎲 ') + pname(G0.cur) + (again ? '!' : ', it is your turn! Tap ROLL.')); }, WAIT(again ? 400 : 900));
}
function win(i) {
  G0.over = true; G0.winner = i; drawTokens(); tada(); speak(PEOPLE[G0.pl[i].k][0] + ' wins the Golden Trophy!');
  $('winPic').innerHTML = thumb(G0.pl[i].k); $('winTxt').textContent = '🏆 ' + pname(i) + ' reached the GOLDEN TROPHY!'; openPanel('winPanel'); info('🏆 ' + pname(i) + ' wins!');
}
// ---------- start up ----------
window.onPrinted = () => trophy('boardGame');
function init() {
  initPrints(); drawScreenBoard();
  document.querySelectorAll('.panel.lock').forEach(p => p.addEventListener('click', e => { if (e.target === p) e.stopPropagation(); }));
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('#funPanel.on, #bossPanel.on')) e.stopImmediatePropagation(); }, true); $('die').innerHTML = dieHTML(6);
  $('bPlay').onclick = openSetup; $('bPrint').onclick = () => openPrints(); $('bRules').onclick = () => openPrints(0);

  $('funOk').onclick = funOk; $('bossRoll').onclick = bossRoll; $('bossOk').onclick = () => { closePanels(); next(false); };
