    text(words.slice(0, half).join(' '), c.x + c.w / 2, c.y + 170, 16, '#1a1033'); text(words.slice(half).join(' '), c.x + c.w / 2, c.y + 194, 16, '#1a1033');
    text(`PRIZE ${k + 1}`, c.x + c.w / 2, c.y - 10, 18, '#fff');
    ctx.restore();
  }
  for (let k = cerI + 1; k < PRIZES.length; k++) { const c = prizeCard(k); roundRect(c.x, c.y, c.w, c.h, 18, 'rgba(0,0,0,.45)'); text('?', c.x + c.w / 2, c.y + 135, 70, '#fff59d'); }
  const msgs = ['Play as BABY GLOOP! Press C (SWAP) in any level!', 'GOLDEN Robo and GOLDEN Dusty! Turn them on in the Prize Room!', 'BOSS RUSH! Meet every boss in a row!', 'The RECORD JUKEBOX! Every song in the game!', 'A CHAMPION CERTIFICATE and a Record Keepers poster to print!'];
  text(msgs[cerI], W / 2, 430, 22, '#fff');
  if (timer > 50) text(cerI < PRIZES.length - 1 ? '▶ JUMP / tap: next prize!' : '▶ JUMP / tap: the end!', W / 2, 480, 20, '#69f0ae');
}
// ---------- 🖨️ the printable CHAMPION CERTIFICATE + CAMP POSTER (letter size, real pictures, no emoji) ----------
function paintTo(w, h, fn) {                             // draw with the game's own drawing code onto a picture
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const keep = ctx, kf = frame; ctx = cv.getContext('2d'); frame = 30;
  try { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); fn(); } catch (_) {}
  ctx = keep; frame = kf;
  try { return cv.toDataURL('image/png'); } catch (_) { return ''; }
}
function printCertificate(name) {
  const safe = String(name).replace(/[<>&"]/g, '');
  const row = paintTo(1400, 260, () => {
    drawRoboBase({ x: 60, y: 120, w: 80, h: 116, face: 1, squash: 1 }, save.golden ? PAL_GOLD : PAL_ROBO, null);
    drawDusty(230, 238, { s: 3, face: 1, pose: 'happy', gold: !!save.golden });
    drawBaby(350, 238, { s: 1.6, giggle: true });
    drawRecordRobo(470, 20, 150, 220, -1, { nice: true });
    drawStopwatch(700, 100, 130, 140, -1, { nice: true }); drawScoreboard(860, 110, 150, 130, -1, { nice: true }); drawTrophyTron(1050, 90, 130, 150, -1, { nice: true }); drawRecordBook(1220, 110, 140, 130, -1, { nice: true });
  });
  const cells = BOSS_KINDS.concat(['mecha']);
  const poster = paintTo(1200, 1140, () => {
    cells.forEach((k, i) => {
      const col = i % 3, r = Math.floor(i / 3), cx = col * 400 + 200, top = r * 560 + 20, G = GLOOPS[k];
      ctx.globalAlpha = 0.18; roundRect(cx - 185, top, 370, 520, 30, G.col); ctx.globalAlpha = 1;
      const [bw, bh] = k === 'record' ? [190, 280] : [280, 280];
      drawVillain(k, cx - bw / 2, top + 120, bw, bh, -1, { nice: true });
      text(G.name, cx, top + 460, k === 'mecha' ? 26 : 30, k === 'trophy' || k === 'record' || k === 'mecha' ? '#ff8f00' : G.col);
    });
  });
  document.getElementById('print').innerHTML =
    `<div class="pg cert"><h1>LUCKY RECORD CHAMPION</h1><h2>Robo Jump 18: The Bad Luck and the Good</h2><p>This certificate is proudly given to</p>` +
    `<div class="who">${safe}</div><p>for finding the record chips, flipping the lucky coin,</p><p>saving Dusty, saving Robo,</p>` +
    `<p>and showing ${FNAME} that friends are better than records!</p><img class="row" src="${row}" alt="">` +
    `<p>Just keep having fun. Do good.</p><div class="sign"><div>${FNAME}</div><div>Robo and Dusty</div></div></div>` +
    `<div class="pg poster"><h1>THE RECORD KEEPERS</h1><img src="${poster}" alt=""></div>`;
  try { window.print(); } catch (_) {}
}
function draw() {
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'talk') drawTalk();
  else if (state === 'play') drawPlay();
  else if (state === 'oops') drawOops();
  else if (state === 'clear') drawClear();
  else if (state === 'credits') drawCredits();
  else if (state === 'prizes') drawPrizes();
  else if (state === 'jukebox') drawJukebox();
  else if (state === 'cert') drawCertMenu();
  else if (state === 'ceremony') drawCeremony();
  else if (state === 'movies') drawMovies();
  if (movie && (state === 'ceremony' || state === 'credits')) drawMovieTop(true);
  if (!actx && state === 'title' && frame % 60 < 40) text('🔊 tap or press a key for sound', W / 2, 230, 16, '#fff59d');
  if (codeFX > 0) drawCodeFX();
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
