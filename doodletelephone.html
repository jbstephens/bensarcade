<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📞 Doodle Telephone</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(90deg, #ffe3f1 0 40px, #ffd7ec 40px 80px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(30px, 5vw, 56px); color: #fff; text-align: center;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff4fa3; letter-spacing: 2px; }
  /* ---------- home ---------- */
  #home { flex-direction: column; overflow: hidden; }
  #hHead { text-align: center; padding: 10px 10px 4px; }
  #hHead p { margin: 4px 0 6px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; }
  .crayons { display: flex; justify-content: center; gap: 6px; margin: 6px 0; }
  .crayons i { width: 16px; height: 40px; border-radius: 8px 8px 3px 3px; border: 2px solid #333; display: block; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333;
    text-shadow: 3px 3px 0 #333; margin: 6px 4px -6px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #c2408a; transition: transform .1s; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.host { background: linear-gradient(160deg, #fff59d, #ffb3d9); }
  .thumb.host .hi { font-size: 70px; line-height: 1.1; }
  .thumb.host b { font-size: 22px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  #stats { font-size: 16px; font-weight: bold; margin-top: 2px; }
  /* ---------- buttons ---------- */
  .btn { font: inherit; font-size: 22px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 10px 14px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide { display: none; }
  .btn[disabled] { opacity: .45; }
  .b-back { background: #9be3ff; } .b-print { background: #8ef08e; font-size: 24px; }
  .b-go { background: #8ef08e; font-size: clamp(24px, 3.4vw, 34px); padding: 12px 26px; }
  .b-yel { background: #ffe066; } .b-pink { background: #ffb3d9; } .b-purp { background: #c3a6ff; }
  .b-orange { background: #ffb347; }
  .b-reveal { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); font-size: clamp(26px, 4vw, 40px); padding: 14px 30px; }
  /* ---------- setup ---------- */
  #setup, #play { flex-direction: column; align-items: center; padding: 10px 14px; gap: 8px; }
  .card { background: #fff; border: 5px solid #333; border-radius: 22px; box-shadow: 0 7px 0 #c2408a; padding: 10px 14px; width: min(980px, 100%); }
  #setup .card { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; margin: 4px 0 10px; }
  .lab { font-size: 22px; font-weight: bold; text-align: center; margin: 4px 0 2px; }
  .chip { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 30px; padding: 6px 14px;
    background: #f2f2f2; cursor: pointer; min-height: 52px; box-shadow: 0 4px 0 #333; }
  .chip.on { background: #ffe066; transform: scale(1.06); }
  .chip .num { display: inline-block; background: #333; color: #fff; border-radius: 50%; width: 26px; height: 26px; line-height: 26px; font-size: 16px; margin-left: 4px; }
  #order { font-size: 19px; text-align: center; min-height: 28px; }
  .botRow { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  /* ---------- play ---------- */
  #trail { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .tr { font-size: 16px; font-weight: bold; padding: 4px 10px; border: 3px solid #333; border-radius: 20px; background: #fff; opacity: .55; }
  .tr.now { opacity: 1; background: #ffe066; transform: scale(1.12); }
  .tr.done { opacity: .9; background: #b9f6ca; }
  #stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: #fff; border: 5px solid #333; border-radius: 26px; box-shadow: 0 7px 0 #c2408a; width: min(1000px, 100%); padding: 12px; overflow-y: auto; text-align: center; }
  .say { font-size: clamp(26px, 4.6vw, 52px); font-weight: bold; line-height: 1.15; }
  .say2 { font-size: clamp(18px, 2.6vw, 28px); font-weight: bold; line-height: 1.25; max-width: 900px; }
  .who { color: #e8317f; }
  .emo { font-size: clamp(60px, 14vh, 140px); line-height: 1; }
  .word { font-size: clamp(36px, 7vw, 80px); font-weight: bold; color: #1e6bff; -webkit-text-stroke: 2px #333; }
  .secretBox { cursor: pointer; background: #333; color: #fff; border-radius: 26px; padding: 18px 26px; border: 5px solid #ffe066; }
  .steps { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .stp { background: #fffbe0; border: 4px solid #333; border-radius: 16px; padding: 8px 12px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; max-width: 300px; }
  .stp i { font-style: normal; font-size: 34px; display: block; }
  #timerWrap { position: relative; width: min(30vh, 260px); height: min(30vh, 260px); }
  #timerWrap svg { width: 100%; height: 100%; }
  #timerNum { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: min(11vh, 90px); font-weight: bold; }
  #timerWrap.hurry #timerNum { color: #ff2d55; animation: pulse .5s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.12); } }
  .chain { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .cl { border: 4px solid #333; border-radius: 16px; padding: 6px 10px; background: #f2f2f2; font-size: clamp(15px, 2vw, 20px); font-weight: bold; }
  .cl.now { background: #ffe066; transform: scale(1.1); }
  .cl.seen { background: #b9f6ca; }
  #confetti { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; display: none; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 50; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- sheet view ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #c2408a; }
  #side { width: min(42vw, 400px); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 19px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 40vh; }
  }
  .tt { font-family: "Arial Rounded MT Bold", "Comic Sans MS", "Chalkboard SE", sans-serif; font-weight: 900; }
  .bub { font-family: "Arial Rounded MT Bold", "Arial Black", "Comic Sans MS", sans-serif; font-weight: 900;
    fill: #fff; stroke: #222; stroke-width: 9; stroke-linejoin: round; paint-order: stroke fill; }
  /* ---------- PRINT: only the sheet (or all sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="hHead">
    <div class="crayons" id="crayonRow"></div>
    <h1 class="big">📞 DOODLE TELEPHONE</h1>
    <p>Draw it! Whisper it! Draw what you heard! Then the BIG REVEAL! 🤭</p>
    <div id="stats"></div>
  </div>
  <div id="grid"></div>
</div>
<div id="setup" class="screen">
  <h1 class="big" style="font-size:clamp(26px,4vw,44px)">👥 Who is playing?</h1>
  <div class="card">
    <div class="lab">Tap names in the order you sit around the table (3 to 7 players)</div>
    <div class="row" id="nameRow"></div>
    <div id="order"></div>
    <div class="lab">🎯 Secret words</div>
    <div class="row" id="levelRow"></div>
    <div class="lab">⏱️ Drawing timer</div>
    <div class="row" id="timeRow"></div>
  </div>
  <div class="botRow">
    <button class="btn b-back" id="bSetBack">⬅️ Back</button>
    <button class="btn b-go" id="bStart" disabled>▶️ Let's play!</button>
  </div>
</div>
<div id="play" class="screen">
  <div id="trail"></div>
  <div id="stage"></div>
  <div class="botRow" id="playBtns"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <div id="sideBtns" style="display:flex;flex-direction:column;gap:10px"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <button class="btn b-back" id="bBack">⬅️ Back</button>
  </div>
</div>
<div id="printAll"></div>
<canvas id="confetti"></canvas>
<div id="toast"></div>
<script>
'use strict';
// =================== 📞 DOODLE TELEPHONE ===================
// The screen is the host. Real drawing happens with pencils on paper.
// Pattern around the table: DRAW → look & WHISPER → DRAW what you heard → look & WHISPER → … → 🎉 BIG REVEAL.
const $ = id => document.getElementById(id);
const SAVE_KEY = 'doodleTelephone';
const NAMES = [
  { n: 'Ben', e: '🤖', c: '#5ac8fa' }, { n: 'Mom', e: '🌸', c: '#ff8ac4' }, { n: 'Dad', e: '🧢', c: '#7ed957' },
  { n: 'Brother', e: '⚽', c: '#ffb347' }, { n: 'Grandma', e: '🧶', c: '#c3a6ff' }, { n: 'Grandpa', e: '🎣', c: '#ffe066' },
  { n: 'Friend', e: '😎', c: '#9be3ff' }];
const nameInfo = n => NAMES.find(x => x.n === n) || { n: n, e: '🙂', c: '#eee' };
const LEVELS = [
  { id: 'easy', name: '🐱 Easy things' },
  { id: 'gf', name: '🤖 Game Factory' },
  { id: 'silly', name: '🤪 Super silly' },
  { id: 'mix', name: '🎲 Mix it up!' }];
const TIMES = [30, 60, 90, 0];
const timeName = t => t ? t + ' seconds' : '♾️ No timer';
// ---- 150+ secret words: [picture hint, word] ----
const WORDS = {
  easy: [
    ['🐱', 'cat'], ['🐶', 'dog'], ['🍕', 'pizza'], ['🌈', 'rainbow'], ['🏠', 'house'], ['🌳', 'tree'], ['☀️', 'sun'],
    ['🌙', 'moon'], ['⭐', 'star'], ['🐟', 'fish'], ['🐍', 'snake'], ['🦒', 'giraffe'], ['🐘', 'elephant'], ['🦁', 'lion'],
    ['🐢', 'turtle'], ['🦋', 'butterfly'], ['🐝', 'bee'], ['🕷️', 'spider'], ['🐌', 'snail'], ['🦆', 'duck'], ['🐸', 'frog'],
    ['🐰', 'bunny'], ['🐷', 'pig'], ['🐮', 'cow'], ['🦀', 'crab'], ['🐙', 'octopus'], ['🦈', 'shark'], ['🐳', 'whale'],
    ['🦖', 'dinosaur'], ['🍎', 'apple'], ['🍌', 'banana'], ['🍦', 'ice cream'], ['🎂', 'birthday cake'], ['🍩', 'donut'],
    ['🌭', 'hot dog'], ['🍔', 'hamburger'], ['🥕', 'carrot'], ['🚗', 'car'], ['🚀', 'rocket'], ['✈️', 'airplane'],
    ['🚂', 'train'], ['🚲', 'bike'], ['⛵', 'sailboat'], ['🚁', 'helicopter'], ['🎈', 'balloon'], ['⚽', 'soccer ball'],
    ['🎁', 'present'], ['👑', 'crown'], ['☂️', 'umbrella'], ['⛄', 'snowman'], ['🏰', 'castle'], ['🌋', 'volcano'],
    ['👻', 'ghost'], ['🎃', 'pumpkin'], ['🌻', 'flower'], ['🍄', 'mushroom'], ['🦄', 'unicorn'], ['🐉', 'dragon'],
    ['🧜', 'mermaid'], ['🤖', 'robot'], ['👽', 'alien'], ['🏴‍☠️', 'pirate'], ['🦉', 'owl'], ['🐧', 'penguin'],
    ['🕶️', 'sunglasses'], ['🎸', 'guitar'], ['🥁', 'drum'], ['⏰', 'alarm clock'], ['🛏️', 'bed'], ['🦷', 'tooth']],
  gf: [
    ['🛹', 'Robo on a skateboard'], ['🍝', 'King Gloop eating spaghetti'], ['🤖', 'Robo with jet boots'],
    ['👑', 'King Gloop on his throne'], ['🍼', 'Baby Gloop in a bathtub'], ['🎩', 'Duke Googool tipping his top hat'],
    ['🧐', 'Duke Googool with a monocle'], ['😈', 'Nega-Robo sneaking'], ['🐱', 'Sammy the cat napping'],
    ['🧶', 'Sammy chasing yarn'], ['🐶', 'Sparks the puppy fetching a stick'], ['🦸', 'Captain Woof flying'],
    ['🌟', 'Chaos Nova in space'], ['🚀', 'Robo in a rocket'], ['👾', 'Robo fighting aliens'], ['🏎️', 'a turbo race car'],
    ['🧟', 'a zombie in a maze'], ['🏰', 'a castle with cannons'], ['🍬', 'a candy factory'], ['🪐', 'a planet with rings'],
    ['🛸', 'a flying saucer'], ['🥊', 'Brawl Buddies boxing'], ['🐉', 'a dragon guarding bones'], ['🦅', 'Feathers the bird'],
    ['🧁', 'Robo baking cupcakes'], ['🎸', 'King Gloop playing guitar'], ['⚽', 'Robo kicking a soccer ball'],
    ['🍔', 'a burger in space'], ['🧮', 'a math rocket'], ['🐾', 'a pet park'], ['🎨', 'Robo painting a picture'],
    ['🤖', 'two Robos high-fiving'], ['👑', 'King Gloop losing his crown'], ['🫧', 'Baby Gloop blowing bubbles'],
    ['🐱', 'Sammy wearing a crown'], ['🦴', 'Sparks with a giant bone'], ['🦸', 'Captain Woof saving a kitten'],
    ['🌈', 'Chaos Nova making a rainbow'], ['🏁', 'a kart race finish line'], ['🔧', 'Robo fixing a robot'],
    ['📚', 'a cat reading a book'], ['🏗️', 'a giant building machine'], ['🧪', 'a glitchy factory machine'],
    ['🎤', 'Robo singing on a stage'], ['🍕', 'King Gloop eating pizza'], ['🏆', 'Ben holding a trophy']],
  silly: [
    ['🧦', 'a sock with a face'], ['🦈', 'a shark in a tutu'], ['🍌', 'a banana driving a car'], ['🐸', 'a frog wearing a crown'],
    ['🐄', 'a cow on the moon'], ['🦖', 'a dinosaur brushing its teeth'], ['🐷', 'a pig in a bubble bath'],
    ['👻', 'a ghost eating ice cream'], ['🐌', 'a snail in a race car'], ['🐙', 'an octopus juggling'],
    ['🦒', 'a giraffe with a scarf'], ['🐘', 'an elephant on a skateboard'], ['🐔', 'a chicken with sunglasses'],
    ['🌮', 'a taco going to school'], ['🎂', 'a cake with legs'], ['🐱', 'a cat flying a kite'], ['🐻', 'a bear in pajamas'],
    ['🐟', 'a fish riding a bike'], ['🥦', 'broccoli with a mustache'], ['🦆', 'a duck in a top hat'],
    ['🐝', 'a bee playing the drums'], ['🍩', 'a donut with wings'], ['🐵', 'a monkey in a spaceship'],
    ['🧀', 'a mouse on a giant cheese'], ['🦕', 'a dinosaur at a birthday party'], ['🐧', 'a penguin at the beach'],
    ['🚽', 'a toilet that can fly'], ['👽', 'an alien walking a dog'], ['🦄', 'a unicorn eating spaghetti'],
    ['🐢', 'a turtle with a jetpack'], ['🍕', 'a pizza wearing shoes'], ['🐶', 'a dog driving a bus'],
    ['🦁', 'a lion getting a haircut'], ['🐰', 'a bunny lifting weights'], ['☃️', 'a snowman on a hot day'],
    ['🦀', 'a crab playing piano'], ['🐳', 'a whale in a bathtub'], ['🐍', 'a snake wearing a bow tie'],
    ['🌽', 'corn on a trampoline'], ['🦉', 'an owl reading a newspaper'], ['🎃', 'a pumpkin on a pogo stick'],
    ['🐞', 'a ladybug on a surfboard'], ['🥚', 'an egg doing karate'], ['🐦', 'a bird with a big hat'],
    ['🦊', 'a fox in rain boots'], ['🍦', 'ice cream melting on a robot'], ['🐊', 'an alligator at the dentist'],
    ['🦷', 'a tooth with a cape'], ['🛁', 'a hippo in a tiny bath'], ['🎈', 'a balloon lifting a house']]
};
const ALL_WORDS = () => WORDS.easy.concat(WORDS.gf, WORDS.silly);
const levelList = id => id === 'mix' ? ALL_WORDS() : (WORDS[id] || WORDS.easy);
// ---- save ----
let S = blankSave();
function blankSave() { return { played: 0, used: [], prints: 0, reveals: 0 }; }
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(blankSave(), s); } catch (_) {}
  if (!Array.isArray(S.used)) S.used = [];
}
function saveIt() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const RECENT = 60;            // words used lately don't come back until 60 others have been used
function pickWord(levelId, rnd) {
  rnd = rnd || Math.random;
  const list = levelList(levelId);
  let fresh = list.filter(w => S.used.indexOf(w[1]) < 0);
  if (!fresh.length) {        // used them all: forget the oldest half of this level's words
    const mine = S.used.filter(u => list.some(w => w[1] === u));
    const drop = mine.slice(0, Math.ceil(mine.length / 2));
    S.used = S.used.filter(u => drop.indexOf(u) < 0);
    fresh = list.filter(w => S.used.indexOf(w[1]) < 0);
  }
  const w = fresh[Math.floor(rnd() * fresh.length)] || list[0];
  S.used.push(w[1]); if (S.used.length > RECENT) S.used = S.used.slice(-RECENT);
  saveIt();
  return w;
}
// ---- character art (copied from tradingcards.html charArt) ----
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="1"' : '') + '>' + txt + '</text>'; }

      h += '<span class="cl ' + (i === g.shown ? 'now' : i < g.shown ? 'seen' : '') + '">' + (i + 1) + '. ' + (c.role === 'draw' ? '✏️ ' + esc(c.who) + ' drew' : '🗣️ ' + esc(c.who) + ' guessed') + '</span>';
    });
    h += '</div>';
    const b = done ? [['🤪 Vote: Silliest Change!', 'b-purp', () => go('vote')], ['🔄 Play again', 'b-go', playAgain]]
      : [[g.shown < 0 ? '▶️ Show them in order!' : '▶️ Next!', 'b-go', showNext]];
    return [h, b];
  }
  if (g.phase === 'vote') {
    let h = '<div class="emo">🏅</div><div class="say">Who made the SILLIEST change?</div><div class="say2">Everyone points… 1, 2, 3! Then tap the winner.</div><div class="row">';
    g.players.forEach((p, i) => { h += '<button class="chip' + (g.award === p ? ' on' : '') + '" data-vote="' + i + '">' + nameInfo(p).e + ' ' + esc(p) + '</button>'; });
    h += '</div>';
    const b = g.award ? [['🖨️ Print ' + esc(g.award) + '\'s award', 'b-orange', () => openSheet(2, { award: g.award })], ['🔄 Play again', 'b-go', playAgain]]
      : [['🔄 Play again', 'b-go', playAgain]];
    return [h, b];
  }
  return ['', []];
}
function go(phase, step) {
  if (!G) return;
  blip(phase === 'peek' ? 880 : 660);
  if (phase === 'step') {
    G.step = step; const c = G.chain[step];
    G.phase = c.role;
    G.timer = c.role === 'draw' ? { total: G.time, left: G.time, running: false, id: 0 } : null;
    if (c.role === 'draw') speak(c.who + ', draw it!');
    else speak(c.who + ', look at the drawing!');
  } else G.phase = phase;
  if (phase === 'vote') speak('Who made the silliest change?');
  renderPlay();
}
// ---- the drawing timer ----
function timerHTML(t) {
  const C = 2 * Math.PI * 88, frac = t.total ? t.left / t.total : 1;
  return '<div id="timerWrap" class="' + (t.left <= 10 && t.running ? 'hurry' : '') + '"><svg viewBox="0 0 200 200">' +
    '<circle cx="100" cy="100" r="88" fill="#fffbe0" stroke="#333" stroke-width="6"/>' +
    '<circle id="timerRing" cx="100" cy="100" r="88" fill="none" stroke="' + (t.left <= 10 ? '#ff2d55' : '#2ecc40') + '" stroke-width="16" stroke-linecap="round"' +
    ' stroke-dasharray="' + _n(C * frac) + ' 999" transform="rotate(-90 100 100)"/></svg><div id="timerNum">' + (t.left > 0 ? t.left : '⏰') + '</div></div>';
}
function startTimer() {
  const t = G && G.timer; if (!t || t.running || t.left <= 0) return;
  t.running = true; clearInterval(t.id); t.id = setInterval(timerTick, 1000);
  tune([660, 880]); renderPlay();
}
function pauseTimer() {
  const t = G && G.timer; if (!t) return;
  if (t.running) { t.running = false; clearInterval(t.id); } else startTimer();
  renderPlay();
}
function stopTimer() { const t = G && G.timer; if (t) { t.running = false; clearInterval(t.id); } }
function timerTick() {
  const t = G && G.timer; if (!t || !t.running) return;
  t.left = Math.max(0, t.left - 1);
  if (t.left === 0) { stopTimer(); tada(); speak('Time\'s up! Pencils down!'); renderPlay(); return; }
  tick(t.left <= 10);
  if (t.left === 10) speak('Ten seconds!');
  const w = $('timerWrap');
  if (w && $('timerNum')) { w.outerHTML = timerHTML(t); } else renderPlay();
}
// ---- the Big Reveal ----
function bigReveal() {
  if (!G || G.phase !== 'ready') return;
  G.phase = 'drum'; renderPlay();
  drumroll(2.2); speak('It started as…');
  setTimeout(revealWord, 2300);
}
function revealWord() {
  if (!G || G.phase !== 'drum') return;
  G.phase = 'reveal'; G.shown = -1;
  S.played = (S.played || 0) + 1; S.reveals = (S.reveals || 0) + 1; saveIt();
  trophy('doodleTelephone');
  renderPlay(); confetti(); tada();
  speak('It started as… ' + G.word + '!');
}
function showNext() {
  if (!G || G.phase !== 'reveal' || G.shown >= G.chain.length - 1) return;
  G.shown++; const c = G.chain[G.shown];
  blip(700 + G.shown * 60);
  speak(c.role === 'draw' ? c.who + ', show your drawing!' : c.who + ', what did you guess?');
  if (G.shown === G.chain.length - 1) setTimeout(() => { if (G && G.phase === 'reveal') { confetti(); tune([523, 659, 784, 1047]); } }, 900);
  renderPlay();
}
function vote(i) {
  if (!G) return;
  G.award = G.players[i]; sheetOpt.award = G.award;
  tune([523, 659, 784, 1047]); confetti();
  speak('The Silliest Change award goes to ' + G.award + '!');
  renderPlay();
}
function renderPlay() {
  if (!G || typeof document === 'undefined' || !$('stage')) return;
  const r = stageFor(G);
  $('trail').innerHTML = trailHTML();
  $('stage').innerHTML = r[0];
  btns = r[1].concat([['🏠 Quit', 'b-back', quitGame]]);
  $('playBtns').innerHTML = btns.map((b, i) => '<button class="btn ' + b[1] + '" data-b="' + i + '">' + b[0] + '</button>').join('');
}
function quitGame() { stopTimer(); G = null; backHome(); }
// =================== SETUP SCREEN ===================
function renderSetup() {
  if (typeof document === 'undefined' || !$('nameRow')) return;
  $('nameRow').innerHTML = NAMES.map((x, i) => {
    const k = setup.players.indexOf(x.n);
    return '<button class="chip' + (k >= 0 ? ' on' : '') + '" data-name="' + i + '" style="' + (k >= 0 ? 'background:' + x.c : '') + '">' + x.e + ' ' + x.n +
      (k >= 0 ? '<span class="num">' + (k + 1) + '</span>' : '') + '</button>';
  }).join('');
  const n = setup.players.length;
  $('order').innerHTML = n ? '🪑 ' + setup.players.map((p, i) => (i + 1) + '. ' + esc(p)).join(' ➜ ') + (n < 3 ? ' <b>(pick ' + (3 - n) + ' more!)</b>' : '')
    : 'The first name you tap gets the secret word!';
  $('levelRow').innerHTML = LEVELS.map(l => '<button class="chip' + (setup.level === l.id ? ' on' : '') + '" data-level="' + l.id + '">' + l.name + '</button>').join('');
  $('timeRow').innerHTML = TIMES.map(t => '<button class="chip' + (setup.time === t ? ' on' : '') + '" data-time="' + t + '">' + (t ? '⏱️ ' : '') + timeName(t) + '</button>').join('');
  $('bStart').disabled = n < 3;
}
function toggleName(i) {
  const nm = NAMES[i].n, k = setup.players.indexOf(nm);
  if (k >= 0) setup.players.splice(k, 1);
  else if (setup.players.length >= 7) { toast('7 players is the most!'); return; }
  else setup.players.push(nm);
  blip(k >= 0 ? 440 : 700); renderSetup();
}
// =================== HOME (gallery) + SHEET VIEW ===================
let view = 'home', sel = 0, cur = 0;
const TILES = SHEETS.length + 1;          // tile 0 = host a game, then the printables
function renderHome() {
  if (typeof document === 'undefined' || !$('grid')) return;
  let h = '<div class="thumb host' + (sel === 0 ? ' sel' : '') + '" data-tile="0"><div class="hi">📞</div><b>▶️ Host a game!</b><b style="font-size:15px">The screen helps you play</b></div>';
  h += '<div class="sec">🖨️ Print these first</div>';
  SHEETS.forEach((sh, i) => { h += '<div class="thumb' + (sel === i + 1 ? ' sel' : '') + '" data-tile="' + (i + 1) + '">' + buildSheet(i, {}, setup.players) + '<b>' + sh.name + '</b></div>'; });
  h += '<div class="sec" style="font-size:20px">🧡 Safety: a grown-up does the cutting!</div>';
  $('grid').innerHTML = h + '<button class="btn b-orange" id="bPrintAll" style="grid-column:1/-1;justify-self:center">🖨️ Print all 4 sheets</button>';
  $('stats').textContent = S.played ? '🎉 Games played: ' + S.played : '';
}
function markSel() { document.querySelectorAll('.thumb').forEach(t => t.classList.toggle('sel', +t.getAttribute('data-tile') === sel)); }
function show(id) {
  ['home', 'setup', 'play', 'view'].forEach(s => { const el = $(s); if (el) el.classList.toggle('on', s === id); });
  view = id;
}
function openTile(t) { if (t === 0) openSetup(); else openSheet(t - 1); }
function openSetup() { show('setup'); renderSetup(); blip(); }
function backHome() { endPrintAll(); stopTimer(); show('home'); renderHome(); }
function openSheet(i, o) {
  cur = i; sel = i + 1;
  if (o) Object.assign(sheetOpt, o);
  show('view'); renderSheet(); blip();
}
function renderSheet() {
  if (typeof document === 'undefined' || !$('svgBox')) return;
  const sh = SHEETS[cur];
  $('svgBox').innerHTML = buildSheet(cur, {}, setup.players);
  $('pTitle').textContent = sh.name; $('pHelp').textContent = sh.help;
  let b = '';
  if (sh.id === 'cards') {
    const lv = LEVELS.find(l => l.id === sheetOpt.cardLevel) || LEVELS[0];
    b += '<button class="btn b-yel" data-side="level">🎚️ Words: ' + lv.name + '</button><button class="btn b-pink" data-side="shuffle">🔀 New cards</button>';
  }
  if (sh.id === 'award') b += '<button class="btn b-purp" data-side="name">👤 Name: ' + (sheetOpt.award ? nameInfo(sheetOpt.award).e + ' ' + esc(sheetOpt.award) : '(write it in)') + '</button>';
  if (sh.id === 'score' && setup.players.length) b += '<button class="btn b-yel" data-side="names">' + (sheetOpt.scoreNames ? '✅ Players\' names on it' : '⬜ Blank names') + '</button>';
  $('sideBtns').innerHTML = b;
}
function sideAct(a) {
  if (a === 'level') { const k = LEVELS.findIndex(l => l.id === sheetOpt.cardLevel); sheetOpt.cardLevel = LEVELS[(k + 1) % LEVELS.length].id; sheetOpt.cardSeed++; }
  else if (a === 'shuffle') sheetOpt.cardSeed++;
  else if (a === 'name') { const k = sheetOpt.award ? NAMES.findIndex(x => x.n === sheetOpt.award) : -1; sheetOpt.award = k + 1 < NAMES.length ? NAMES[k + 1].n : ''; }
  else if (a === 'names') sheetOpt.scoreNames = !sheetOpt.scoreNames;
  blip(780); renderSheet();
}
// =================== PRINTING (Chrome + iPad Safari) ===================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  S.prints = (S.prints || 0) + 1; saveIt(); trophy('doodleTelephone');
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits in print(); iPad uses 'afterprint' instead
  }, 60);
}
function printSheet() {
  if (view === 'home' && sel > 0) openSheet(sel - 1);
  if (view !== 'view') return;
  endPrintAll(); renderSheet(); doPrint();
}
function printAll() {
  $('printAll').innerHTML = SHEETS.map((s, i) => buildSheet(i, {}, setup.players)).join('');
  document.body.classList.add('pAll');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =================== KEYS + TAPS ===================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let n = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) n++; });
  return Math.max(1, n);
}
let fi = -1;                       // keyboard focus on the setup screen
function setupItems() { return Array.prototype.slice.call(document.querySelectorAll('#setup .chip, #bStart')); }
function markFocus() { setupItems().forEach((el, i) => { el.style.outline = i === fi ? '5px solid #1e6bff' : ''; el.style.outlineOffset = i === fi ? '3px' : ''; }); }
function onKey(e) {
  const k = e.key;
  if (view === 'home') {
    const cols = gridCols();
    if (k === 'ArrowRight') sel = Math.min(TILES - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(TILES - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openTile(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { if (sel > 0) printSheet(); return; }
    else return;
    e.preventDefault(); markSel();
  } else if (view === 'setup') {
    const items = setupItems();
    if (k === 'Escape' || k === 'Backspace') { backHome(); e.preventDefault(); return; }
    if (k === 'ArrowRight' || k === 'ArrowDown') fi = Math.min(items.length - 1, fi + 1);
    else if (k === 'ArrowLeft' || k === 'ArrowUp') fi = Math.max(0, fi - 1);
    else if (k === 'Enter' || k === ' ') {
      e.preventDefault();
      if (fi >= 0 && items[fi]) items[fi].click(); else startGame();
      markFocus(); return;
    } else return;
    e.preventDefault(); markFocus();
  } else if (view === 'play') {
    if (k === 'Escape') { quitGame(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); if (btns[0] && btns.length > 1) btns[0][2](); }
  } else if (view === 'view') {
    if (k === 'Escape' || k === 'Backspace') { backHome(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((cur + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((cur + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function onTap(e) {
  ac();
  const el = e.target && e.target.closest ? e.target.closest('[data-tile],[data-name],[data-level],[data-time],[data-b],[data-vote],[data-side],[data-act],#bPrintAll') : null;
  if (!el) return;
  const g = n => el.getAttribute(n);
  if (el.id === 'bPrintAll') printAll();
  else if (g('data-tile') !== null) { sel = +g('data-tile'); markSel(); openTile(sel); }
  else if (g('data-name') !== null) toggleName(+g('data-name'));
  else if (g('data-level') !== null) { setup.level = g('data-level'); blip(780); renderSetup(); }
  else if (g('data-time') !== null) { setup.time = +g('data-time'); blip(780); renderSetup(); }
  else if (g('data-b') !== null) { const b = btns[+g('data-b')]; if (b) b[2](); }
  else if (g('data-vote') !== null) vote(+g('data-vote'));
  else if (g('data-side') !== null) sideAct(g('data-side'));
  else if (g('data-act') !== null) go('peek');
}
function init() {
  loadSave();
  $('crayonRow').innerHTML = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222']
    .map(c => `<i style="background:${c}"></i>`).join('');
  renderHome();
  document.addEventListener('click', onTap);
  $('bStart').addEventListener('click', startGame);
  $('bSetBack').addEventListener('click', backHome);
  $('bPrint').addEventListener('click', printSheet);
  $('bBack').addEventListener('click', backHome);
  window.addEventListener('afterprint', endPrintAll);
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
