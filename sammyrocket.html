// ---------- 🎮 GAME STATE ----------

// 🌿 THE BIG RED BUTTON
function catnip(id) {
  if (state !== 'fly' || paused) return;
  if (nip && !id) { sfx.boop(); return; }   // one surprise at a time
  if (!id) { const pool = NIP_IDS.filter(n => n !== lastNip); id = pool[Math.floor(Math.random() * pool.length)]; }
  lastNip = id; nipCount++;

}

function spawn() {
  const P = PLANETS[leg], id = P.id, near = dist > P.len - 900;
  if (near) return;
  const r = Math.random(), y = rnd(70, H - 60);
  if (r < 0.42) objs.push({ kind: 'fish', x: W + 40, y, r: 20, wob: Math.random() * 6 });
  else if (r < 0.62) objs.push({ kind: 'star', x: W + 40, y, r: 18, wob: Math.random() * 6 });
  else objs.push({ kind: 'rock', x: W + 50, y, r: rnd(24, 40), rot: 0, spin: rnd(-0.02, 0.02), vx: rnd(-0.6, 0.2), vy: rnd(-0.3, 0.3), seed: Math.random() * 9,
    ice: id === 'saturn' || id === 'uranus', dust: id === 'mars' });
}
function hitRocket(o, pad = 0) { const dx = o.x - rk.x, dy = o.y - rk.y; return Math.abs(dx) < 70 + o.r + pad && Math.abs(dy) < 30 + o.r + pad && Math.hypot(dx / 2.2, dy) < 26 + o.r * 0.85 + pad; }

function updateFly() {
  if (paused) return;
  const P = PLANETS[leg], n = nip ? nip.id : '';
  // steering (arrows / D-pad, or drag a finger on the screen)
  let want = (keys.down ? 1 : 0) - (keys.up ? 1 : 0);
  if (dragY != null && Math.abs(dragY - rk.y) > 12) want = Math.sign(dragY - rk.y) * Math.min(1, Math.abs(dragY - rk.y) / 60);
  rk.vy += (want * 6.5 - rk.vy) * 0.16;
  if (n === 'wobbly') rk.vy += Math.sin(frame * 0.12) * 0.55;           // gentle giggly wobble
  if (P.id === 'neptune') rk.vy += Math.sin(dist * 0.004) * 0.18;       // windy!
  rk.y = Math.max(55, Math.min(H - 50, rk.y + rk.vy));
  rk.x += ((n === 'zoomies' ? 300 : 210) - rk.x) * 0.05;
  const zig = n === 'zoomies' ? Math.sin(nip.t * 0.35) * 38 : 0;
  const tilt = rk.vy * 0.03 + (n === 'wobbly' ? Math.sin(frame * 0.25) * 0.18 : 0);
  rk.rot = n === 'tail' ? (1 - nip.t / nip.max) * Math.PI * 4 : tilt;
  rk.zig = zig;
  const speed = n === 'zoomies' ? 11 : 5;
  dist += speed;
  if (dist >= spawnAt) { spawn(); spawnAt = dist + rnd(70, 130); }
  if (P.id === 'saturn' && dist >= ringAt && dist < P.len - 1000) { objs.push({ kind: 'ring', x: W + 80, y: rnd(150, H - 150), r: 70 }); ringAt = dist + 1000; }
  // things in space
  const ry = rk.y + zig;
  for (const o of objs) {
    o.x -= speed + (o.vx || 0); if (o.vy) o.y += o.vy;
    if (o.rot !== undefined) o.rot += o.spin;
    if (o.kind === 'fish' || o.kind === 'star') {
      o.y += Math.sin(frame * 0.05 + o.wob) * 0.4;
      if (n === 'rainbow') { const dx = rk.x - o.x, dy = ry - o.y, d = Math.hypot(dx, dy); if (d < 300) { o.x += dx / d * 7; o.y += dy / d * 7; } }
      if (Math.hypot((o.x - rk.x) / 1.6, o.y - ry) < 48 + o.r) {
        o.dead = true;
        if (o.kind === 'fish') { fishCount++; legFish++; save.fish = (save.fish || 0) + 1; bankCoin(1); sfx.fish(); addPart({ kind: 'text', txt: '+1 🐟', x: o.x, y: o.y, vy: -1.2, t: 50 }); }
        else { starCount++; sfx.star(); for (let i = 0; i < 6; i++) addPart({ kind: 'spark', x: o.x, y: o.y, vx: rnd(-3, 3), vy: rnd(-3, 3), t: 30, r: 6 }); }
      }
    } else if (o.kind === 'rock') {
      const save_y = rk.y; rk.y = ry; const hit = !o.bonked && hitRocket(o); rk.y = save_y;
      if (hit) {
        o.bonked = true; o.vx = -6; o.vy = (o.y < ry ? -3 : 3); o.spin = 0.15;
        if (n === 'zoomies') { sfx.star(); starCount++; addPart({ kind: 'text', txt: 'BOINK! ⭐', x: o.x, y: o.y - 30, vy: -1, t: 50 }); }
        else if (inv <= 0) {
          hearts--; inv = 120; sfx.bump(); addPart({ kind: 'text', txt: 'Boing! 💗', x: rk.x, y: ry - 60, vy: -1, t: 60 });
          if (hearts <= 0) { setState('nap'); hush(); say("It's OK, Sammy! Let's try that part again.", 'happy', 240); }
        }
      }
    } else if (o.kind === 'ring' && !o.done && o.x < rk.x && o.x > rk.x - 40) {
      o.done = true;
      if (Math.abs(ry - o.y) < 55) { starCount += 3; sfx.star(); caption('WHEEE! Through the ring! ⭐⭐⭐', '', 90); for (let i = 0; i < 12; i++) addPart({ kind: 'spark', x: o.x, y: o.y, vx: rnd(-4, 4), vy: rnd(-4, 4), t: 40, r: 7 }); }
    }
  }
  objs = objs.filter(o => !o.dead && o.x > -150 && o.y > -150 && o.y < H + 150);
  // silly catnip effects
  if (nip) {
    if (n === 'rainbow' && frame % 2 === 0) addPart({ kind: 'rainbow', x: rk.x - 90, y: ry + rnd(-10, 10), vx: -3, t: 50, r: 9, hue: (frame * 8) % 360 });
    if (n === 'hearts' && frame % 10 === 0) addPart({ kind: 'heart', x: rk.x + rnd(-30, 30), y: ry - 30, vy: -1.5, vx: rnd(-0.8, 0.8), t: 60, r: 9 });
    if (n === 'upside' && frame % 30 === 0) addPart({ kind: 'text', txt: pick(['purrr', 'prrrr~', 'mrrrp']), x: rk.x + 30, y: ry - 50, vy: -0.8, t: 60 });
    if (n === 'wobbly' && frame % 40 === 0) addPart({ kind: 'text', txt: pick(['hee hee!', 'teehee!', 'wheee!']), x: rk.x + 40, y: ry - 50, vy: -0.8, t: 60 });
    if (n === 'zoomies' && frame % 3 === 0) addPart({ kind: 'puff', x: rk.x - 110, y: ry + rnd(-8, 8), vx: -5, t: 25, r: 10 });

    for (let i = 0; i < 40; i++) { const x = ((i * 97 - dist * 1.6 - frame * 2) % W + W) % W, y = (i * 53 + Math.sin(frame * 0.03 + i) * 30) % H; ellipse(x, y, 14, 3, 'rgba(255,160,100,.35)'); } }

    else if (o.kind === 'rock') drawRock(o);
  }
  const blink = inv > 0 && Math.floor(inv / 6) % 2 === 0;
  if (!blink || state !== 'fly') drawRocket(rk.x, rk.y + (rk.zig || 0), 0.8, rk.rot, moodNow());
  for (const o of objs) if (o.kind === 'ring') drawRing(o, true);
  drawParts();
  drawHud(P);
}
function drawHud(P) {
  for (let i = 0; i < 5; i++) heartShape(28 + i * 34, 30, 13, i < hearts ? '#ff4f8b' : 'rgba(255,255,255,.25)');
  text('🐟 ' + fishCount + '   ⭐ ' + starCount, 200, 40, 24, '#fff', 'left');
  // trip progress bar to the next planet
  const bx = 380, bw = 330, k = Math.min(1, dist / P.len);
  roundRect(bx, 20, bw, 22, 11, 'rgba(255,255,255,.2)'); roundRect(bx, 20, Math.max(22, bw * k), 22, 11, P.col);
  emoji('🚀', bx + Math.max(11, bw * k), 31, 22); text('To ' + P.name + ' ' + P.icon, bx + bw / 2, 66, 20, '#fff');
  // the big red button (tap it too!)
  const bb = { x: W - 92, y: H - 92, w: 80, h: 80 };
  if (!TOUCHY) {   // on a touchscreen the touch pad has its own BIG RED BUTTON
  circle(bb.x + 40, bb.y + 46, 36, '#7f0000'); circle(bb.x + 40, bb.y + 40 + (nip ? 4 : 0), 34, nip ? '#e53935' : '#ff1744');
  ellipse(bb.x + 30, bb.y + 28 + (nip ? 4 : 0), 12, 7, 'rgba(255,255,255,.5)');
  text('SPACE', bb.x + 40, bb.y + 48, 15, '#fff');
  btns.push(Object.assign(bb, { fn: () => catnip() }));
  }
  btns.push({ x: W - 150, y: 6, w: 50, h: 44, fn: () => { paused = !paused; } }); text(paused ? '▶' : '⏸', W - 125, 38, 26, '#fff');
  drawRadio();
  if (cap) {
    const a = cap.t / cap.max, pop = Math.min(1, (cap.max - cap.t) / 10), sc = 0.6 + 0.4 * pop + Math.sin(frame * 0.3) * 0.03;
    ctx.save(); ctx.translate(W / 2, 222); ctx.scale(sc, sc); ctx.globalAlpha = Math.min(1, a * 4);
    text(cap.txt, 0, 0, 42, '#b2ff59'); if (cap.sub) text(cap.sub, 0, 40, 26, '#fff');
    ctx.restore(); ctx.globalAlpha = 1; if (--cap.t <= 0) cap = null;
  }
  if (paused) {
    ctx.fillStyle = 'rgba(0,0,30,.6)'; ctx.fillRect(0, 0, W, H); text('⏸ Paused', W / 2, 200, 56, '#fff');
    bigButton('▶ Keep flying', W / 2 - 220, 260, 200, 70, '#43a047', () => { paused = false; });
    bigButton('🏠 Title', W / 2 + 20, 260, 200, 70, '#5c6bc0', () => { paused = false; hush(); setState('title'); });
  }
}
function drawRadio() {   // 📻 Robo on his little radio screen
  if (!radio) return;
  const x = W - 400, y = 82, w = 390, h = 92, a = Math.min(1, radio.t / 20);
  ctx.globalAlpha = a;
  roundRect(x, y, w, h, 16, '#263238'); roundRect(x + 6, y + 6, 84, 80, 12, '#0d47a1');
  const im = ROBO_PICS[radio.pic] || ROBO_PICS.talk;
  if (im.complete && im.naturalWidth) ctx.drawImage(im, x + 8, y + 8 + Math.sin(frame * 0.2) * 2, 80, 80);
  text('📻 ROBO', x + 100, y + 24, 15, '#80d8ff', 'left');
  const lines = wrapText(radio.msg, w - 112, 19);
  lines.slice(0, 3).forEach((l, i) => text(l, x + 100, y + 46 + i * 21, 19, '#fff', 'left'));
  ctx.globalAlpha = 1; if (--radio.t <= 0) radio = null;
}
function bigButton(label, x, y, w, h, col, fn, size = 28) {
  const hover = false; roundRect(x, y + 5, w, h, 18, 'rgba(0,0,0,.35)'); roundRect(x, y, w, h, 18, col);
  roundRect(x + 6, y + 5, w - 12, h * 0.35, 12, 'rgba(255,255,255,.18)'); text(label, x + w / 2, y + h / 2 + size * 0.36, size, '#fff');
  btns.push({ x, y, w, h, fn });
}

// ---------- 🪪 PLANET CARD ----------
function drawCard() {
  const P = PLANETS[leg];
  drawSpace(P, 0.3);
  roundRect(40, 40, W - 80, H - 80, 30, 'rgba(10,16,60,.92)'); roundRect(52, 52, W - 104, H - 104, 24, 'rgba(255,255,255,.06)');
  const pr = P.id === 'saturn' ? 85 : 125;
  drawPlanet(P.id, 230, 260, pr * Math.min(1, 0.4 + st / 30));
  text('You made it to', 640, 110, 26, '#b3e5fc'); text(P.name + '! ' + P.icon, 640, 165, 54, P.col);
  const lines = wrapText(P.fact, 440, 28);
  lines.forEach((l, i) => text(l, 640, 225 + i * 38, 28, '#fff'));
  // the passport stamp thumps on
  const sa = Math.min(1, st / 25);
  ctx.save(); ctx.translate(760, 105 + 230 + lines.length * 8); ctx.rotate(-0.2); ctx.scale(2 - sa, 2 - sa); ctx.globalAlpha = sa;
  ctx.strokeStyle = '#ff5252'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, 0, 44, 0, 7); ctx.stroke();
  text('STAMPED!', 0, 6, 16, '#ff8a80'); ctx.restore(); ctx.globalAlpha = 1;
  bigButton('🔊 Hear it again', 380, 410, 250, 70, '#7e57c2', () => speak(P.name + '! ' + P.fact), 26);
  bigButton(leg >= 8 ? '🏠 Land! ▶' : '🚀 Keep flying ▶', 650, 410, 250, 70, '#43a047', () => { if (st > 40) nextFromCard(); }, 26);
  drawRocket(120, 470, 0.45, -0.1, { look: 1 });
}
// ---------- 🏠 TITLE ----------
function drawTitle() {
  drawSpace(PLANETS[0], 1.2);
  drawPlanet('saturn', 820, 120, 50); drawPlanet('mars', 120, 110, 36); drawPlanet('earth', 860, 470, 70);
  drawRocket(330, 300 + Math.sin(frame * 0.04) * 16, 1.25, Math.sin(frame * 0.03) * 0.06, { look: 0.6 });
  if (frame % 50 === 0) addPart({ kind: 'leaf', x: 330, y: 260, vx: rnd(-1, 1), vy: -1, t: 70 });
  drawParts();
  ctx.save(); ctx.translate(W / 2, 92); ctx.rotate(Math.sin(frame * 0.03) * 0.02);

  text('⬆️⬇️ fly   🐟 grab fish   🪨 dodge rocks', W / 2, 470, 22, '#e1f5fe');
  text('🔴 SPACE = the BIG RED BUTTON (catnip surprise! 🌿)', W / 2, 505, 22, '#b2ff59');
}
// ---------- 💤 OOPS INTRO ----------
function drawIntro() {
  if (st < 200) {   // inside the rocket: Sammy naps... and rolls onto the button
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#37474f'); g.addColorStop(1, '#1c262b'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    roundRect(80, 60, 800, 150, 30, '#455a64'); circle(W / 2, 135, 60, '#0d1440');
    for (let i = 0; i < 30; i++) circle(W / 2 - 50 + (i * 37) % 100, 95 + (i * 23) % 80, 1.5, '#fff');
    for (let i = 0; i < 6; i++) circle(170 + i * 40, 160, 9, ['#ffd54f', '#69f0ae', '#40c4ff'][i % 3]);
    roundRect(150, 330, 660, 150, 30, '#8d6e63');   // the comfy seat
    roundRect(640, 300, 140, 50, 12, '#263238'); text('DO NOT PRESS', 710, 375, 18, '#ffeb3b');
    const pressed = st > 125;
    ellipse(710, 300 + (pressed ? 8 : 0), 50, 24, '#ff1744'); ellipse(695, 292 + (pressed ? 8 : 0), 16, 7, 'rgba(255,255,255,.45)');
    const roll = Math.max(0, Math.min(1, (st - 70) / 55)), sx = 360 + roll * 330, sy = 400 - Math.sin(roll * Math.PI) * 80 - roll * 70;
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(Math.sin(roll * Math.PI) * 0.5); ctx.translate(-sx, -sy);
    drawSammy(sx, sy + 40, 0.9, { pose: 'sleep' }); ctx.restore();
    if (st < 70 && st % 25 === 0) addPart({ kind: 'z', x: 400, y: 330, vx: 0.6, vy: -1, t: 60 });
    if (st === 126) { sfx.boop(); sfx.catnip(); for (let i = 0; i < 30; i++) addPart({ kind: i % 3 ? 'puff' : 'leaf', x: 710, y: 280, vx: rnd(-4, 4), vy: rnd(-5, 0), t: 70, r: rnd(8, 16) }); }
    drawParts();
    if (st < 70) text('Sammy is napping in Robo\'s rocket... 💤', W / 2, 270, 30, '#fff');
    else if (st < 126) text('...roll... roll... 😴', W / 2, 270, 30, '#fff');
    else { text('CLICK! 🔴', W / 2, 260, 50, '#ff5252'); text('PSSSHT! CATNIP! 🌿', W / 2, 300, 30, '#b2ff59'); }
  } else {           // outside: BLAST OFF!
    const t = st - 200;
    const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, t > 90 ? '#0d1440' : '#64b5f6'); g.addColorStop(1, '#bbdefb'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const lift = Math.max(0, t - 40), ry = 400 - lift * lift * 0.05;
    roundRect(0, 450, W, 90, 0, '#66bb6a'); roundRect(90, 330, 170, 120, 6, '#ffcc80'); tri(70, 330, 175, 260, 280, 330, '#e57373');
    roundRect(150, 380, 50, 70, 4, '#8d6e63');
    drawRocket(560 + Math.sin(frame * 0.9) * (t < 40 ? 2 : 0), ry, 0.9, -Math.PI / 2, { wobble: true, fast: true, upright: true });
    if (t === 1) { sfx.rumble(3); say("SAMMY! That's MY rocket!", 'mad', 330); }
    if (t > 40) for (let i = 0; i < 2; i++) addPart({ kind: 'puff', x: 560 + rnd(-30, 30), y: Math.min(450, ry + 110), vx: rnd(-2, 2), vy: rnd(0, 1), t: 40, r: 16 });
    drawParts();
    text('🔴 BLAST OFF! 🚀', W / 2, 120, 64, '#ffeb3b');
    drawRadio();
    if (t > 150) startLeg(0);
  }
  text('tap or press ENTER to skip', W / 2, H - 14, 16, 'rgba(255,255,255,.7)');
}
// ---------- 😴 out of hearts: a catnap, then try that part again ----------
function drawNap() {
  drawFly();
  ctx.fillStyle = 'rgba(0,0,30,.55)'; ctx.fillRect(0, 0, W, H);
  text('Sammy needs a little catnap! 😴', W / 2, 220, 40, '#fff'); text('Let\'s try that part again!', W / 2, 270, 28, '#b3e5fc');
  if (st % 30 === 0) addPart({ kind: 'z', x: rk.x + 30, y: rk.y - 40, vx: 0.6, vy: -1, t: 60 });
  bigButton('🚀 Try again!', W / 2 - 130, 320, 260, 76, '#43a047', () => startLeg(leg), 30);
}

// ---------- 🏠 THE ENDING: home, dinner, nap... on the button. Again. ----------
function drawHome(night) {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, night ? '#1a237e' : '#ff8a65'); g.addColorStop(1, night ? '#5c6bc0' : '#ffe0b2');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  if (night) for (let i = 0; i < 40; i++) circle((i * 137) % W, (i * 59) % 260, 1.6, '#fff');
  roundRect(0, 440, W, 100, 0, '#66bb6a');
  roundRect(40, 250, 230, 190, 8, '#ffcc80'); tri(20, 250, 155, 160, 290, 250, '#e57373');
  roundRect(70, 290, 60, 50, 4, night ? '#fff59d' : '#bbdefb'); roundRect(180, 340, 55, 100, 4, '#8d6e63');
}
function drawEnding() {
  const t = st;
  if (t < 230) {   // land + Robo: "Finally!"
    drawHome(false);
    const ly = Math.min(330, -120 + t * 4);
    drawRocket(680, ly, 0.9, -Math.PI / 2, { look: 0, upright: true });
    if (t > 112 && t < 140) addPart({ kind: 'puff', x: 680 + rnd(-60, 60), y: 440, vx: rnd(-3, 3), vy: rnd(-1, 0), t: 40, r: 18 });
    const im = ROBO_PICS[t > 120 ? 'happy' : 'talk']; if (im.complete && im.naturalWidth) ctx.drawImage(im, 360, 300, 150, 150);
    drawParts();
    if (t > 120) bubble(435, 300, 'FINALLY! Welcome home, Sammy! 🤖', 24);
  } else if (t < 470) {   // a BIG fish dinner
    drawHome(false);
    const im = ROBO_PICS.happy; if (im.complete && im.naturalWidth) ctx.drawImage(im, 120, 330, 110, 110);
    drawSammy(430, 450, 0.95, { pose: 'sit', expr: t % 40 < 20 ? 'happy' : 'normal', mouth: t % 20 < 10 ? 'open' : 'smile', look: 0.6 });
    const left = Math.max(0, 1 - (t - 260) / 180);
    ellipse(640, 440, 120, 22, '#eceff1'); ellipse(640, 436, 100, 16, '#fff');
    ctx.save(); ctx.translate(640, 400); ctx.scale(-1, 1); if (left > 0) emoji('🐟', 0, 0, 40 + left * 80); else emoji('🦴', 0, 20, 50); ctx.restore();
    if (t % 30 === 0) addPart({ kind: 'text', txt: pick(['nom nom!', 'NOM!', 'yum! 🐟', 'mmmm!']), x: 520, y: 260, vy: -1, t: 50 });
    if (t % 45 === 0) sfx.fish();
    drawParts();
    text('A BIG fish dinner! 🐟🍽️', W / 2, 80, 44, '#fff');
  } else {   // sleepy Sammy... on the big red button
    drawHome(true);
    roundRect(500, 380, 220, 70, 14, '#263238'); text('DO NOT PRESS', 610, 470, 18, '#ffeb3b');
    const press = t > 560 ? 6 : 0;
    ellipse(610, 380 + press, 90, 34, '#ff1744');
    drawSammy(610, 380 + press, 0.75, { pose: 'sleep' });
    if (t % 40 === 0) addPart({ kind: 'z', x: 660, y: 280, vx: 0.6, vy: -1, t: 60 });
    drawParts();
    if (t < 560) text('Sammy is SO full and SO sleepy... 💤', W / 2, 90, 36, '#fff');
    else {
      if (t === 560) { sfx.boop(); sfx.catnip(); }
      text('...click. 🔴', 830, 330, 34, '#ff8a80');
      if (t > 600) { ctx.save(); ctx.translate(W / 2, 110); const s = Math.min(1, (t - 600) / 20); ctx.scale(s, s); text('THE END... or is it? 😂', 0, 0, 52, '#ffeb3b'); ctx.restore(); }
      if (t > 640) {
        const im = ROBO_PICS.mad; if (im.complete && im.naturalWidth) ctx.drawImage(im, 140, 330, 110, 110);
        bubble(195, 330, 'SAMMY! NOT AGAIN!', 20);
        text('🏆 You got the Oops Rocket trophy!', W / 2, 170, 24, '#fff');
        bigButton('🚀 Fly again!', W / 2 - 250, 200, 230, 70, '#ff1744', () => newGame(), 28);
        bigButton('🛂 Passport', W / 2 + 20, 200, 230, 70, '#5c6bc0', () => setState('passport'), 28);
      }
    }
  }
  if (t < 640) text('tap or press ENTER to skip', W / 2, H - 14, 16, 'rgba(255,255,255,.75)');
}
// ---------- 🛂 PLANET PASSPORT ----------
function drawPassport() {
  ctx.fillStyle = '#1a237e'; ctx.fillRect(0, 0, W, H);
  roundRect(30, 20, W - 60, H - 40, 26, '#283593'); roundRect(46, 36, W - 92, H - 72, 20, '#fff8e1');
  text("🛂 Sammy's Planet Passport", W / 2, 86, 38, '#ffca28');
  const got = PLANETS.filter(p => save.stamps[p.id]).length;
  PLANETS.forEach((p, i) => {
    const col = i % 5, row = Math.floor(i / 5), x = 150 + col * 165 + (row ? 82 : 0), y = 170 + row * 150, on = !!save.stamps[p.id];
    ctx.save(); ctx.translate(x, y); ctx.rotate(((i * 37) % 9 - 4) * 0.03);
    ctx.strokeStyle = on ? p.ink : '#bdbdbd'; ctx.lineWidth = 4; ctx.setLineDash(on ? [] : [8, 6]); ctx.beginPath(); ctx.arc(0, 0, 56, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    if (on) drawPlanet(p.id, 0, -8, p.id === 'saturn' ? 22 : 34); else text('?', 0, 6, 44, '#bdbdbd');
    ctx.restore();
    ctx.font = 'bold 20px "Trebuchet MS", Arial'; ctx.textAlign = 'center'; ctx.fillStyle = on ? '#4e342e' : '#9e9e9e'; ctx.fillText(on ? p.name : '???', x, y + 48);
  });
  ctx.font = 'bold 22px "Trebuchet MS", Arial'; ctx.fillStyle = '#5d4037'; ctx.textAlign = 'center';
  ctx.fillText(got + ' of 9 stamps  •  🏠 trips home: ' + (save.trips || 0) + '  •  🐟 fish snacks: ' + (save.fish || 0), W / 2, 420);
  bigButton('⬅ Back', W / 2 - 110, 436, 220, 58, '#43a047', () => setState('title'), 26);
}

// ---------- ⌨️ INPUT (keys, the touch pad's fake keys, taps and drags) ----------
function confirmKey() {
  if (state === 'title') newGame();
  else if (state === 'intro') { if (st > 20) { hush(); startLeg(0); } }
  else if (state === 'card') { if (st > 40) nextFromCard(); }
  else if (state === 'nap') { if (st > 30) startLeg(leg); }
  else if (state === 'ending') { if (st < 640) st = 640; else newGame(); }
  else if (state === 'passport') setState('title');
  else if (state === 'fly' && paused) paused = false;
}
addEventListener('keydown', e => {
  initAudio();
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; e.preventDefault(); }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; e.preventDefault(); }
  if (e.repeat) return;
  if (k === ' ') { e.preventDefault(); if (state === 'fly' && !paused) catnip(); else confirmKey(); }
  if (k === 'Enter') { e.preventDefault(); confirmKey(); }
  if (k === 'Escape') {
    if (state === 'fly') paused = !paused;
    else if (state !== 'title') { hush(); setState('title'); }
  }
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
});
function canvasXY(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
let mouseDown = false;
cv.addEventListener('mousedown', e => {
  initAudio();
  const p = canvasXY(e);
  for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) { b.fn(); return; } }
  if (state === 'intro' || state === 'ending') { confirmKey(); return; }
  if (state === 'fly' && !paused) { mouseDown = true; dragY = p.y; }
});
addEventListener('mousemove', e => { if (mouseDown && state === 'fly') dragY = canvasXY(e).y; });
addEventListener('mouseup', () => { mouseDown = false; dragY = null; });

// ---------- 🔁 THE LOOP (60 steps a second on every screen) ----------
function update() {
  frame++; st++;
  if (state === 'fly') updateFly();
}
function draw() {
  btns = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.textBaseline = 'alphabetic';
  if (state === 'title') drawTitle();
  else if (state === 'intro') drawIntro();
  else if (state === 'fly') drawFly();
  else if (state === 'nap') drawNap();
  else if (state === 'card') drawCard();
  else if (state === 'ending') drawEnding();
  else if (state === 'passport') drawPassport();
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0;
  while (acc >= 1000 / 60 && n < 4) { acc -= 1000 / 60; n++; update(); draw(); }   // draw every step (scenes time things by frame)
  if (n >= 4) acc = 0;
  playMusic();
  requestAnimationFrame(loop);
}
// test hook: ?planet=N jumps straight to the trip to planet N (0 = the Moon ... 8 = home to Earth)
{ const m = /[?&]planet=(\d+)/.exec(location.search); if (m && !JB) startLeg(Math.max(0, Math.min(8, +m[1]))); }
if (JB) { musicOn = true; }
draw();
requestAnimationFrame(loop);
</script>
