<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>👟 Sneaker Designer</title>
<script src="touchpad.js?v=6"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #d6f4ff 0 36px, #c4ecff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 48px); color: #fff; text-align: center;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff6d00; letter-spacing: 2px; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 6px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn.dim { opacity: .35; }
  .hide { display: none !important; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-run { background: #8ef08e; } .b-name { background: #ffd180; } .b-save { background: #9be3ff; }
  .b-print { background: #c3a6ff; } .b-clear { background: #ffc2d6; } .b-back { background: #9be3ff; }
  /* ---------- designer ---------- */
  #designer { flex-direction: row; gap: 10px; padding: 8px 10px; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #lineName { text-align: center; font-size: clamp(18px, 2.4vw, 26px); font-weight: bold; background: #fff;
    border: 4px solid #333; border-radius: 14px; padding: 2px 8px; align-self: center; }
  #shoeBox { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 7px 0 #1e88e5;
    display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #ffffff 0 45%, #eaf6ff 100%); }
  #shoeBox svg { width: 100%; height: 100%; display: block; }
  #shoeBox [data-part] { cursor: pointer; }
  #hint { position: absolute; left: 0; right: 0; bottom: 6px; text-align: center; font-size: 17px; font-weight: bold; color: #555; pointer-events: none; }
  #saves { display: flex; gap: 8px; align-items: stretch; height: clamp(70px, 14vh, 104px); }
  #saves .lbl { display: flex; align-items: center; font-size: 17px; font-weight: bold; text-align: center; width: 76px; line-height: 1.1; }
  .slot { flex: 1; min-width: 0; background: #fff; border: 4px solid #333; border-radius: 14px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; font-size: 26px; color: #bbb; box-shadow: 0 4px 0 #333; }
  .slot svg { width: 100%; height: 100%; pointer-events: none; }
  .slot.empty { border-style: dashed; box-shadow: none; }
  .slot:active { transform: translateY(3px); }
  #panel { width: min(42vw, 430px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  .box { background: #fff; border: 4px solid #333; border-radius: 16px; padding: 6px 8px 8px; }
  .box h3 { margin: 0 0 5px; font-size: 18px; text-align: center; }
  .g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }
  .g4 .btn { font-size: 15px; min-height: 50px; padding: 3px 2px; box-shadow: 0 4px 0 #333; border-width: 3px; }
  .g4 .btn.on { box-shadow: 0 4px 0 #ff3d6e; }
  #colors { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .full { grid-column: 1 / -1; }
  /* light-up soles + boosters wiggle on screen (a printed page just shows them still) */
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  @keyframes flick { 0%, 100% { transform: scaleX(1); } 50% { transform: scaleX(.75); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .anim .lt { animation: blink .8s infinite; }
  .anim .lt:nth-child(3n+1) { animation-delay: .27s; } .anim .lt:nth-child(3n+2) { animation-delay: .53s; }
  .anim .glo { animation: pulse 1.1s infinite; }
  .anim .flm { animation: flick .18s infinite; transform-box: fill-box; transform-origin: right center; }
  .spinning .whl { animation: spin .35s linear infinite; transform-box: fill-box; transform-origin: center; }
  .selOut { animation: pulse .9s infinite; pointer-events: none; }
  /* ---------- overlays ---------- */
  .over { position: fixed; inset: 0; background: rgba(20, 30, 60, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .over.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 900px;
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3vw, 32px); }
  #lineBtns, #whoBtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  #whoBtns { grid-template-columns: repeat(7, 1fr); }
  #lineBtns .btn, #whoBtns .btn { font-size: 16px; min-height: 50px; }
  /* ---------- test run ---------- */
  #run { position: fixed; inset: 0; z-index: 45; display: none; flex-direction: column; background: #8fd3ff; }
  #run.on { display: flex; }
  #runScene { flex: 1; min-height: 0; }
  #runScene svg { width: 100%; height: 100%; display: block; }
  #runBar { display: flex; gap: 10px; align-items: center; justify-content: center; padding: 8px; background: #fff; border-top: 5px solid #333; min-height: 76px; }
  #runMsg { font-size: clamp(18px, 2.6vw, 28px); font-weight: bold; text-align: center; }
  /* ---------- printables gallery ---------- */
  #prints { flex-direction: column; }
  #pHead { text-align: center; padding: 8px 10px 2px; }
  #pHead p { margin: 2px 0 4px; font-size: clamp(16px, 2.2vw, 21px); font-weight: bold; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 2px 4px -4px; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #1e88e5; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #ff6d00; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff6d00; }
  .thumb:active { transform: scale(.96); }
  /* ---------- one sheet ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #1e88e5; }
  #side { width: min(40vw, 400px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #sTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #sHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #designer, #view { flex-direction: column; }
    #panel, #side { width: 100%; max-height: 46vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #lineBtns { grid-template-columns: repeat(3, 1fr); } #whoBtns { grid-template-columns: repeat(4, 1fr); }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 16px; } .g4 .btn { min-height: 42px; font-size: 13px; } .box h3 { font-size: 15px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="designer" class="screen on">
  <div id="stage">
    <h1 class="big">👟 SNEAKER DESIGNER</h1>
    <div id="lineName"></div>
    <div id="shoeBox"><div id="shoeSvg" style="width:100%;height:100%"></div><div id="hint"></div></div>
    <div id="saves"></div>
  </div>
  <div id="panel">
    <div class="box"><h3>👆 1. Tap a part of the shoe</h3><div class="g4" id="partBtns"></div></div>
    <div class="box"><h3 id="colTitle">🎨 2. Pick a color</h3><div id="colors"></div></div>
    <div class="box"><h3>🌈 3. Add a pattern</h3><div class="g4" id="pats"></div></div>
    <div class="box"><h3>🚀 Super add-ons (tap to add!)</h3><div class="g4" id="adds"></div></div>
    <div class="g2">
      <button class="btn b-magic" id="bMagic">✨ Magic design!</button>
      <button class="btn b-run" id="bRun">🏁 Test run!</button>
      <button class="btn b-name" id="bName">🏷️ Name it!</button>
      <button class="btn b-save" id="bSave">💾 Save it!</button>
      <button class="btn b-print full" id="bPrints">🖨️ Printables</button>
      <button class="btn b-clear full" id="bClear">🧽 Start a new shoe</button>
    </div>
  </div>
</div>
<div id="prints" class="screen">
  <div id="pHead"><h1 class="big">🖨️ SNEAKER PRINTABLES</h1><p>Tap a page to see it. Then print it and grab a pencil!</p></div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="sTitle"></div>
    <div class="g2">
      <button class="btn" id="bColor">🎨 Full color</button>
      <button class="btn" id="bLine">🖍️ Color it yourself</button>
    </div>
    <div id="sHelp"></div>
    <button class="btn b-run" id="bPrint" style="font-size:22px">🖨️ Print it!</button>
    <button class="btn b-print" id="bPrintAll">🖨️ Print ALL the pages</button>
    <button class="btn b-back" id="bSheetBack">⬅️ Back to printables</button>
  </div>
</div>
<div id="nameBox" class="over"><div class="card">
  <h2>🏷️ Name your shoe line!</h2><div id="lineBtns"></div>
  <h2>✏️ Who designed it?</h2><div id="whoBtns"></div>
  <button class="btn b-run" id="bNameDone">👍 Done!</button>
</div></div>
<div id="run">
  <div id="runScene"></div>
  <div id="runBar"><div id="runMsg"></div>
    <button class="btn b-run hide" id="bAgain">🔁 Again!</button>
    <button class="btn b-back hide" id="bRunBack">👟 Back to designing</button></div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 👟 SNEAKER DESIGNER: design super shoes on screen, then print templates, a shoe store, a badge and challenge cards
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// Every sheet draws in two ways: LINE = false is full color, LINE = true is black lines to color in.
// Character art style is copied from the Art Gallery (gradients + highlights, no SVG filters).
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)

    if (t < plan.D + .1) { if (t > .6 && plan.yell.length) $('runMsg').textContent = plan.yell[Math.floor(t / .8) % plan.yell.length]; requestAnimationFrame(step); }
    else finishRun(plan);
  };
  requestAnimationFrame(step);
}
function finishRun(plan) {
  $('runMsg').textContent = '🏁 FINISH in ' + plan.D.toFixed(1) + ' seconds!  Speed: ' + '⭐'.repeat(plan.speed);
  $('bAgain').classList.remove('hide'); $('bRunBack').classList.remove('hide');
  noteDid('run');
}
const runOpen = () => hasDoc() && $('run').classList.contains('on');
function closeRun() { run = null; if (hasDoc()) { $('run').classList.remove('on'); $('runScene').innerHTML = ''; } }
// ---------- 🖨️ printables ----------
const isLine = () => state.mode === 'line';
function openPrints() { SHEET_DESIGN = fixDesign(state.cur); renderGallery(); setView('prints'); }
function renderGallery() {
  if (!hasDoc()) return; const g = $('grid'); g.innerHTML = '';
  const h = document.createElement('div'); h.className = 'sec';
  const b1 = document.createElement('button'); b1.className = 'btn b-back'; b1.textContent = '⬅️ Back to designing'; b1.addEventListener('click', backToDesigner);
  const b2 = document.createElement('button'); b2.className = 'btn b-print'; b2.textContent = '🖨️ Print ALL the pages'; b2.addEventListener('click', printAll);
  h.appendChild(b1); h.appendChild(b2); g.appendChild(h);
  SHEETS.forEach((p, i) => {
    const d = document.createElement('div'); d.className = 'thumb' + (i === sel ? ' sel' : '');
    d.innerHTML = buildSheet(i, false) + '<b>' + esc(p.name) + '</b>';
    d.addEventListener('click', () => { sel = i; openSheet(i); });
    g.appendChild(d);
  });
}
function markSel() { if (!hasDoc()) return; document.querySelectorAll('.thumb').forEach((t, i) => t.classList.toggle('sel', i === sel)); const t = document.querySelectorAll('.thumb')[sel]; if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest' }); }
function renderSheet() {
  if (!hasDoc()) return;
  $('svgBox').innerHTML = buildSheet(cur, isLine());
  $('sTitle').textContent = SHEETS[cur].name; $('sHelp').textContent = SHEETS[cur].help;
  $('bColor').classList.toggle('on', !isLine()); $('bLine').classList.toggle('on', isLine());
}
function openSheet(i) { cur = sel = i; endPrintAll(); setView('sheet'); renderSheet(); blip(700, 0, .08); }
function setMode(m) { state.mode = m; saveState(); renderSheet(); }
function backToPrints() { endPrintAll(); setView('prints'); markSel(); }
function backToDesigner() { endPrintAll(); setView('designer'); renderShoe(); renderPanel(); }
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function printSheet() { if (view !== 'sheet') openSheet(sel); endPrintAll(); noteDid('print'); doPrint(); }
function printMine() { SHEET_DESIGN = fixDesign(state.cur); renderGallery(); openSheet(SHEETS.findIndex(s => s.id === 'mine')); printSheet(); }
function printAll() {
  if (!hasDoc()) return;
  $('printAll').innerHTML = SHEETS.map((p, i) => buildSheet(i, isLine())).join('');
  document.body.classList.add('pAll'); noteDid('print'); toast('🖨️ Printing ' + SHEETS.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() { if (!hasDoc()) return; document.body.classList.remove('pAll'); const pa = $('printAll'); if (pa) pa.innerHTML = ''; }
// =====================================================================
// KEYS: arrows pick, Enter opens / test-runs, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop; th.forEach(t => { if (t.offsetTop === top) k++; }); return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (runOpen()) { if (k === 'Escape' || k === 'Backspace') closeRun(); else if ((k === 'Enter' || k === ' ') && !run) startRun(); else if (k === 'Enter' || k === ' ') { closeRun(); startRun(); } e.preventDefault(); return; }
  if (nameOpen()) {
    if (k === 'ArrowRight') setLine((state.cur.line + 1) % LINES.length);
    else if (k === 'ArrowLeft') setLine((state.cur.line + LINES.length - 1) % LINES.length);
    else if (k === 'ArrowDown') setWho((state.cur.who + 1) % WHO.length);
    else if (k === 'ArrowUp') setWho((state.cur.who + WHO.length - 1) % WHO.length);
    else if (k === 'Escape' || k === 'Enter' || k === ' ') closeName();
    else return;
    e.preventDefault(); return;
  }
  if (view === 'designer') {
    if (k === 'ArrowRight') pickPart(selPart + 1);
    else if (k === 'ArrowLeft') pickPart(selPart - 1);
    else if (k === 'ArrowUp' || k === 'ArrowDown') { const i = COLORS.indexOf(state.cur.parts[P_ID()].c); pickColor(COLORS[(i + (k === 'ArrowUp' ? -1 : 1) + COLORS.length) % COLORS.length]); }
    else if (k === 'Enter' || k === ' ') startRun();
    else if (k === 'p' || k === 'P') printMine();
    else return;
    e.preventDefault();
  } else if (view === 'prints') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToDesigner(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToPrints(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((cur + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((cur + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function mkBtn(parent, html, cls, fn) { const b = document.createElement('button'); b.className = 'btn' + (cls ? ' ' + cls : ''); b.innerHTML = html; b.addEventListener('click', fn); $(parent).appendChild(b); return b; }
function init() {
  loadState();
  PARTS.forEach((p, i) => mkBtn('partBtns', p.e + '<br>' + p.name, '', () => pickPart(i)));
  COLORS.forEach(c => { const s = document.createElement('div'); s.className = 'sw'; s.style.background = c; s.addEventListener('click', () => pickColor(c)); $('colors').appendChild(s); });
  PATS.forEach(p => mkBtn('pats', p.e + '<br>' + p.name, '', () => pickPattern(p.id)));
  ADDS.forEach(a => mkBtn('adds', a.e + '<br>' + a.name, '', () => toggleAdd(a.id)));
  LINES.forEach((l, i) => mkBtn('lineBtns', esc(l), '', () => setLine(i)));
  WHO.forEach((w, i) => mkBtn('whoBtns', esc(w), '', () => setWho(i)));
  $('shoeSvg').addEventListener('click', e => { const t = e.target.closest && e.target.closest('[data-part]'); if (t) pickPart(PARTS.findIndex(p => p.id === t.getAttribute('data-part'))); });
  $('bMagic').addEventListener('click', magic);
  $('bRun').addEventListener('click', startRun);
  $('bName').addEventListener('click', openName);
  $('bNameDone').addEventListener('click', closeName);
  $('nameBox').addEventListener('click', e => { if (e.target === $('nameBox')) closeName(); });
  $('bSave').addEventListener('click', doSave);
  $('bPrints').addEventListener('click', openPrints);
  $('bClear').addEventListener('click', startOver);
  $('bAgain').addEventListener('click', () => { closeRun(); startRun(); });
  $('bRunBack').addEventListener('click', closeRun);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintAll').addEventListener('click', printAll);
  $('bSheetBack').addEventListener('click', backToPrints);
  window.addEventListener('afterprint', endPrintAll);
  window.addEventListener('keydown', onKey);
  renderShoe(); renderPanel(); renderSaves();
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
