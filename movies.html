<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎬 Game Factory Movies</title>
<script src="touchpad.js?v=3"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; background: #2a0a1e; color: #333;
    overflow: hidden; user-select: none; -webkit-user-select: none; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: clamp(16px, 2vw, 21px); font-weight: bold; border: 4px solid #222; border-radius: 16px; padding: 6px 12px;
    cursor: pointer; box-shadow: 0 5px 0 #222; color: #222; min-height: 52px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #222; }
  .btn.sel, .poster.sel, .thumb.sel, .snack.sel, #booth.sel { outline: 5px solid #40c4ff; outline-offset: 3px; }
  .b-back { background: #9be3ff; } .b-print { background: #8ef08e; } .b-gold { background: #ffd740; } .b-pink { background: #ff9ec7; }
  .hide { display: none !important; }
  /* ---------- 🏛️ LOBBY ---------- */
  #lobby { flex-direction: column; background: repeating-linear-gradient(90deg, #7a1430 0 40px, #6a0f28 40px 80px); }
  #marquee { margin: 8px auto 4px; padding: 6px 30px; background: #1a0b2e; border: 6px solid #ffd740; border-radius: 22px; position: relative; text-align: center; max-width: 96vw; }
  #marquee h1 { margin: 0; font-size: clamp(26px, 4.6vw, 54px); color: #fff36b; letter-spacing: 2px; text-shadow: 0 0 10px #ff9100, 3px 3px 0 #e91e63; white-space: nowrap; }
  #marquee p { margin: 0; color: #fff; font-size: clamp(14px, 1.8vw, 20px); font-weight: bold; }
  .bulbs { position: absolute; left: 6px; right: 6px; height: 12px; display: flex; justify-content: space-between; }
  .bulbs.t { top: -9px; } .bulbs.b { bottom: -9px; }
  .bulbs i { width: 12px; height: 12px; border-radius: 50%; background: #fff59d; box-shadow: 0 0 8px #ffeb3b; animation: blink 1s infinite; }
  .bulbs i:nth-child(2n) { animation-delay: .5s; }
  @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: .25; } }
  #lobbyMid { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 8px 10px 4px; }
  .stand { width: clamp(150px, 19vw, 240px); display: flex; flex-direction: column; gap: 8px; background: #fff7e0; border: 5px solid #222;
    border-radius: 20px; padding: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .stand h2 { margin: 0; text-align: center; font-size: clamp(18px, 2.2vw, 24px); }
  #booth { cursor: pointer; text-align: center; border-radius: 16px; background: #ffcdd2; border: 4px solid #222; padding: 4px; }
  #booth svg { width: 100%; height: auto; display: block; pointer-events: none; }
  #booth b { font-size: clamp(15px, 1.8vw, 19px); }
  #myTicket { text-align: center; font-weight: bold; font-size: 16px; min-height: 24px; }
  #tixOut { display: inline-block; background: #ffe082; border: 3px dashed #c62828; border-radius: 8px; padding: 4px 10px; font-size: 16px; animation: tix .5s ease-out; }
  @keyframes tix { from { transform: translateY(-30px) scale(.4); opacity: 0; } to { transform: none; opacity: 1; } }
  .snack { cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: clamp(16px, 1.9vw, 20px); font-weight: bold; border: 4px solid #222;
    border-radius: 16px; padding: 4px 8px; background: #fff; box-shadow: 0 4px 0 #222; min-height: 54px; }
  .snack span { font-size: clamp(28px, 3.4vw, 40px); }
  .snack.got { background: #b9f6ca; }
  .snack:active { transform: translateY(3px); box-shadow: 0 1px 0 #222; }
  #showing { flex: 1; min-width: 0; display: flex; flex-direction: column; background: #1a0b2e; border: 5px solid #ffd740; border-radius: 20px; padding: 6px; }
  #showing h2 { margin: 0 0 4px; text-align: center; color: #ffd740; font-size: clamp(20px, 2.6vw, 30px); letter-spacing: 3px; }
  #posters { flex: 1; min-height: 0; display: flex; gap: 12px; overflow-x: auto; overflow-y: hidden; -webkit-overflow-scrolling: touch; padding: 6px 6px 10px; align-items: stretch; }
  .poster { flex: 0 0 auto; height: 100%; aspect-ratio: 2 / 3.35; cursor: pointer; display: flex; flex-direction: column; background: #fff; border: 4px solid #ffd740;
    border-radius: 14px; overflow: hidden; transition: transform .12s; }
  .poster svg { flex: 1; min-height: 0; width: 100%; display: block; pointer-events: none; }
  .poster .st { text-align: center; font-size: clamp(14px, 1.8vw, 19px); background: #fff3c4; padding: 2px; white-space: nowrap; }
  .poster:active { transform: scale(.96); }
  #lobbyBar { display: flex; gap: 10px; padding: 4px 10px 10px; align-items: center; }
  #lobbyBar .note { flex: 1; text-align: center; color: #fff; font-weight: bold; font-size: clamp(15px, 1.9vw, 21px); }
  /* ---------- 🎞️ THEATER ---------- */
  #theater { flex-direction: column; align-items: center; background: radial-gradient(ellipse at 50% 0%, #8e1b3c, #3b0716 70%); transition: background 1.5s; }
  #theater.dim { background: radial-gradient(ellipse at 50% 0%, #2a0a18, #0b0206 70%); }
  #screenBox { position: relative; margin-top: 8px; width: min(96vw, calc((100vh - 150px) * 16 / 9)); aspect-ratio: 16 / 9; background: #000;
    border: 6px solid #3e2723; border-radius: 6px; overflow: hidden; box-shadow: 0 0 40px rgba(255, 255, 255, .25); }
  #theater.dim #screenBox { box-shadow: 0 0 70px rgba(180, 220, 255, .35); }
  #stage { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .curt { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 5; transition: transform 2.2s ease-in-out;
    background: repeating-linear-gradient(90deg, #b71c1c 0 18px, #8e0000 18px 30px, #c62828 30px 44px); box-shadow: inset 0 -20px 30px rgba(0,0,0,.4); }
  #curtL { left: 0; border-right: 4px solid #ffd740; } #curtR { right: 0; border-left: 4px solid #ffd740; }
  #screenBox.open #curtL { transform: translateX(-100%); } #screenBox.open #curtR { transform: translateX(100%); }
  #valance { position: absolute; left: 0; right: 0; top: 0; height: 7%; z-index: 6; background: repeating-linear-gradient(90deg, #ffd740 0 6px, #b71c1c 6px 40px); border-bottom: 4px solid #ffd740; }
  #subs { position: absolute; left: 4%; right: 4%; bottom: 3%; z-index: 4; text-align: center; pointer-events: none; }
  #subs span { display: inline-block; background: rgba(0, 0, 0, .78); color: #fff; font-weight: bold; font-size: clamp(16px, 2.6vw, 30px); line-height: 1.25;
    padding: 4px 14px; border-radius: 12px; font-family: Arial Rounded MT Bold, Arial, sans-serif; }
  #subs b { margin-right: 6px; }
  #skipIntro { position: absolute; right: 2%; top: 9%; z-index: 7; font-size: 16px; min-height: 42px; }
  #seats { width: 100%; flex: 1; min-height: 60px; position: relative; display: flex; justify-content: center; align-items: flex-end; overflow: hidden; }
  .row { position: absolute; left: 0; right: 0; height: 60%; bottom: 0; background: repeating-linear-gradient(90deg, transparent 0 4px, #5d0b1f 4px 64px, transparent 64px 70px);
    border-radius: 30px 30px 0 0; }
  .row.back { bottom: 18%; opacity: .7; background-position: 34px 0; }
  #mySeat { position: relative; z-index: 2; width: 120px; height: 82%; background: #b0123f; border: 4px solid #ffd740; border-bottom: none; border-radius: 26px 26px 0 0;
    display: flex; align-items: center; justify-content: center; gap: 2px; font-size: clamp(22px, 3vh, 34px); color: #fff; font-weight: bold; }
  #mySeat small { font-size: 13px; position: absolute; top: 4px; left: 0; right: 0; text-align: center; color: #ffd740; }
  #ctrl { position: absolute; left: 8px; right: 8px; bottom: 8px; display: flex; gap: 8px; z-index: 3; justify-content: space-between; align-items: flex-end; pointer-events: none; }
  #ctrl > div { display: flex; gap: 8px; pointer-events: auto; }
  #ctrl .btn { min-height: 50px; font-size: clamp(15px, 1.8vw, 19px); padding: 4px 10px; }
  #soundNote { color: #fff; font-weight: bold; font-size: clamp(13px, 1.6vw, 17px); align-self: center; text-align: center; }
  /* ⭐ rating card */
  #rate { position: fixed; inset: 0; z-index: 20; background: rgba(20, 0, 20, .72); display: none; align-items: center; justify-content: center; padding: 12px; }
  #rate.on { display: flex; }
  #rateCard { background: #fff8e1; border: 6px solid #222; border-radius: 24px; padding: 12px 20px; text-align: center; max-width: 640px; width: 100%; max-height: 100%; overflow-y: auto; }
  #rateCard h2 { margin: 0; font-size: clamp(22px, 3.6vw, 36px); }
  #stars { display: flex; justify-content: center; gap: 6px; margin: 8px 0; }
  #stars button { font-size: clamp(38px, 7vw, 64px); background: none; border: none; cursor: pointer; padding: 0 2px; line-height: 1; color: #bbb; }
  #stars button.on { color: #ffc400; text-shadow: 0 0 8px #ffab00; }
  #rateMsg { min-height: 28px; font-size: 20px; font-weight: bold; }
  .two { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #222; border-radius: 20px;
    padding: 10px 22px; font-size: clamp(18px, 2.6vw, 26px); font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- 🖨️ PRINT SHOP (gallery → sheet, like the Craft Room) ---------- */
  #shop { flex-direction: column; background: repeating-linear-gradient(45deg, #ffe3f1 0 36px, #ffd6ea 36px 72px); }
  #shopHead { display: flex; align-items: center; gap: 10px; padding: 8px 12px 2px; }
  #shopHead h1 { flex: 1; margin: 0; text-align: center; font-size: clamp(26px, 4.4vw, 46px); color: #fff; -webkit-text-stroke: 2.5px #333; text-shadow: 4px 4px 0 #e91e63; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px; display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; box-shadow: 0 6px 0 #d94f8c; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  #sheetView { flex-direction: row; gap: 10px; padding: 10px; background: repeating-linear-gradient(45deg, #ffe3f1 0 36px, #ffd6ea 36px 72px); }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #paper svg { height: calc(100vh - 30px); max-width: 100%; aspect-ratio: 4 / 5; background: #fff; border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #d94f8c; }
  #side { width: min(40vw, 400px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #names .btn { font-size: 15px; min-height: 44px; padding: 2px; }
  #names .btn.on { background: #ffe066; border-color: #ff3d6e; }
  #printArea { display: none; }
  @media (orientation: portrait) { #lobbyMid { flex-wrap: wrap; } .stand { width: calc(50% - 5px); max-height: 30vh; } #showing { flex-basis: 100%; order: -1; }
    #sheetView { flex-direction: column; } #paper svg { height: auto; width: 100%; } #side { width: 100%; max-height: 40vh; } }
  @media (max-height: 520px) { .btn { min-height: 44px; } #marquee h1 { font-size: 26px; } #marquee p { display: none; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="lobby" class="screen on">
  <div id="marquee"><div class="bulbs t"></div><div class="bulbs b"></div>
    <h1>🎬 GAME FACTORY MOVIES</h1><p>Cartoons starring YOUR Game Factory friends!</p></div>
  <div id="lobbyMid">
    <div class="stand" id="boothStand">
      <h2>🎟️ Tickets</h2>
      <div id="booth" tabindex="0"></div>
      <div id="myTicket"></div>
    </div>
    <div id="showing"><h2>⭐ NOW SHOWING ⭐</h2><div id="posters"></div></div>
    <div class="stand" id="snackStand">
      <h2>🍿 Snacks</h2>
      <div class="snack" data-s="popcorn"><span>🍿</span>Popcorn</div>
      <div class="snack" data-s="drink"><span>🥤</span>Drink</div>
      <div class="snack" data-s="candy"><span>🍬</span>Candy</div>
      <div style="text-align:center;font-size:15px;font-weight:bold">Tap to get snacks for your seat!</div>
    </div>
  </div>
  <div id="lobbyBar">
    <button class="btn b-back" id="bLeave">⬅ Back</button>
    <div class="note">🔊 Turn up your sound! The characters TALK!</div>
    <button class="btn b-print" id="bShop">🖨️ Print Shop</button>
  </div>
</div>

<div id="theater" class="screen">
  <div id="screenBox">
    <svg id="stage" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="subs"></div>
    <div id="valance"></div><div class="curt" id="curtL"></div><div class="curt" id="curtR"></div>
    <button class="btn b-gold hide" id="skipIntro">⏭ Skip intro</button>
  </div>
  <div id="seats"><div class="row back"></div><div class="row"></div><div id="mySeat"><small>YOUR SEAT</small></div></div>
  <div id="ctrl">
    <div><button class="btn b-back" id="bExit">🚪 Lobby</button></div>
    <div id="soundNote">🔊 Turn up your sound!</div>
    <div><button class="btn b-gold" id="bPause">⏸ Pause</button><button class="btn b-pink" id="bReplay">🔁 Replay scene</button><button class="btn" id="bSubs">💬 Subtitles: ON</button></div>
  </div>
</div>

<div id="rate"><div id="rateCard">
  <h2 id="rateTitle">How many stars?</h2>
  <div id="stars"></div>
  <div id="rateMsg"></div>
  <div class="two"><button class="btn b-gold" id="bAgain">🔁 Watch again</button><button class="btn b-print" id="bAnother">🍿 Pick another movie</button></div>
</div></div>

<div id="shop" class="screen">
  <div id="shopHead"><button class="btn b-back" id="bShopBack">⬅ Lobby</button><h1>🖨️ MOVIE PRINT SHOP</h1></div>
  <div id="grid"></div>
</div>
<div id="sheetView" class="screen">
  <div id="paper"></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <div id="names"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <button class="btn b-back" id="bSheetBack">⬅ Back to Print Shop</button>
  </div>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎬 GAME FACTORY MOVIES: a movie theater where Ben WATCHES cartoons starring his Game Factory friends.
// The characters TALK with the browser voice (speechSynthesis), with subtitles. Movies are made of scenes,
// and every scene is a list of steps: [who, 'line'], ['go', who, x, secs], ['jump', who], ['sfx', name] ...
// Saves in localStorage.gfMovies. Trophy 'gfMovies' for watching a whole movie.
// =====================================================================
const $ = id => document.getElementById(id);
const SAVE_KEY = 'gfMovies';
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function blankSave() { return { ratings: {}, watched: {}, snacks: {}, subs: true, name: 'Ben', tickets: 0 }; }
let S = blankSave();
function load() { try { const v = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (v && typeof v === 'object') S = Object.assign(blankSave(), v); } catch (_) {} }
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }

// ===== SVG ART HELPERS (copied from the Trading Cards art kit: bold outlines, no filters) =====
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s, sw) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="' + (sw || 1) + '" paint-order="stroke"' : '') + '>' + txt + '</text>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');
const tube = (d, col, w) => aL(d, OL, w + 3) + aL(d, col, w);
const sparkle = (x, y, r, col) => aP(starD(x, y, r, 4, .3), col || '#fff', 0);
const cheeks = (x, y, gap, r) => aO('.55', aE(x - gap, y, r, r * .65, '#ff7aa2', 0) + aE(x + gap, y, r, r * .65, '#ff7aa2', 0));
const heartShape = (x, y, s, col) => aG(x, y, s || 1, aP('M0 8 C-14 -2 -8 -14 0 -6 C8 -14 14 -2 0 8 Z', col || '#ff4081', OL, 1.5));
const note = (x, y, s, col) => aG(x, y, s || 1, aE(0, 6, 4, 3, col || '#fff', OL, 1.2, -20) + aL('M3.5 5 L3.5 -9 L9 -6', col || '#fff', 2));
function crown(x, y, w, h, col) {
  col = col || '#ffd740'; const l = x - w / 2, b = y + h / 2, t = y - h / 2;
  return aP(polyD([l, b, l, t, l + w * .25, y, x, t - h * .2, l + w * .75, y, l + w, t, l + w, b]), col, OL, 2) +
    aC(x, b - h * .28, Math.max(1.8, w * .08), '#ff4081', OL, 1) + aC(l + w * .2, b - h * .25, Math.max(1.4, w * .06), '#40c4ff', OL, 1) + aC(l + w * .8, b - h * .25, Math.max(1.4, w * .06), '#69f0ae', OL, 1);
}

// ⌨️ KEYS (arrows pick, Enter opens, Escape goes back, P prints) + taps

function focusables() {
  if ($('rate').classList.contains('on')) return Array.from(document.querySelectorAll('#stars button, #rate .btn'));
  if (VIEW === 'lobby') return [$('booth')].concat(Array.from(document.querySelectorAll('.poster, .snack')), [$('bLeave'), $('bShop')]);

  if (VIEW === 'sheetView') return Array.from(document.querySelectorAll('#names .btn')).concat([$('bPrint'), $('bSheetBack')]);

function markSel() {
  if (typeof document === 'undefined') return;

function onKey(e) {

    if (k === 's' || k === 'S') toggleSubs();

  }

function bind() {
