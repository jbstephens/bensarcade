// ===== RULES START (the puzzle rules; the level checker uses this exact code too) =====
const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
const ARROWS = { '^': 'up', 'v': 'down', '<': 'left', '>': 'right' };
const EMIT = { ']': [1, 0], '[': [-1, 0], 'M': [0, 1], 'W': [0, -1] };
const PAD_PAIR = { '1': '2', '2': '1', '3': '4', '4': '3' };

function nb(lv, c, dx, dy) {
  const x = c % lv.w + dx, y = Math.floor(c / lv.w) + dy;
  return x < 0 || y < 0 || x >= lv.w || y >= lv.h ? -1 : y * lv.w + x;
}
function parseLevel(L) {
  const h = L.map.length, w = Math.max(...L.map.map(r => r.length));
  const lv = { w, h, name: L.name, hint: L.hint || '', tiles: [], crates: [], coins: [], keys: [], locks: [], switches: [],
               emitters: [], pads: {}, coinAt: {}, keyAt: {}, lockAt: {}, start: 0, inside: [] };
  const padPos = {};
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = y * w + x;
    let ch = L.map[y][x] || '#';
    if (ch === 'P') { lv.start = c; ch = ' '; }
    else if (ch === 'b') { lv.crates.push(c); ch = ' '; }
    else if (ch === 'B') { lv.crates.push(c); ch = '_'; }
    else if (ch === 'c') { lv.coinAt[c] = lv.coins.length; lv.coins.push(c); ch = ' '; }
    else if (ch === 'k') { lv.keyAt[c] = lv.keys.length; lv.keys.push(c); ch = ' '; }
    if (ch === 'L') { lv.lockAt[c] = lv.locks.length; lv.locks.push(c); }
    if (ch === '_') lv.switches.push(c);
    if (EMIT[ch]) lv.emitters.push({ c, d: EMIT[ch] });
    if (PAD_PAIR[ch]) padPos[ch] = c;
    lv.tiles.push(ch);
  }
  for (const p in padPos) if (padPos[PAD_PAIR[p]] !== undefined) lv.pads[padPos[p]] = padPos[PAD_PAIR[p]];
  // which squares are inside the maze (so we don't draw floor outside the walls)
  const seen = new Array(w * h).fill(false), q = [lv.start];
  seen[lv.start] = true;
  while (q.length) {
    const c = q.pop(), next = Object.values(DIRS).map(([dx, dy]) => nb(lv, c, dx, dy));
    if (lv.pads[c] !== undefined) next.push(lv.pads[c]);
    for (const n of next) if (n >= 0 && !seen[n] && lv.tiles[n] !== '#' && !EMIT[lv.tiles[n]]) { seen[n] = true; q.push(n); }
  }
  lv.inside = seen;
  return lv;
}
function newState(lv) { return { r: lv.start, crates: lv.crates.slice(), keys: 0, keyMask: 0, lockMask: 0, blue: 0, coinMask: 0, won: false }; }
function copyState(s) { return Object.assign({}, s, { crates: s.crates.slice() }); }
function switchesOn(lv, s) { return lv.switches.length > 0 && lv.switches.every(c => c === s.r || s.crates.includes(c)); }
function isOpen(lv, s, c) {   // doors: is this one open right now? (everything else counts as open)
  const t = lv.tiles[c];
  if (t === 'G') return switchesOn(lv, s) || c === s.r || s.crates.includes(c);
  if (t === 'X') return !!s.blue;
  if (t === 'L') return !!(s.lockMask >> lv.lockAt[c] & 1);
  return true;
}
function blocked(lv, s, c) {
  if (c < 0) return true;
  const t = lv.tiles[c];
  return t === '#' || !!EMIT[t] || !isOpen(lv, s, c);
}
function laserPaths(lv, s) {
  return lv.emitters.map(e => {
    const cells = [];
    let c = e.c;
    for (;;) {
      c = nb(lv, c, e.d[0], e.d[1]);
      if (c < 0 || blocked(lv, s, c) || s.crates.includes(c)) break;
      cells.push(c);
    }
    return { e, cells };
  });
}
function inLaser(lv, s, c) { return laserPaths(lv, s).some(p => p.cells.includes(c)); }
function crateCanGo(lv, s, c, dir) {
  if (blocked(lv, s, c) || s.crates.includes(c)) return false;
  const t = lv.tiles[c];
  if (ARROWS[t] && ARROWS[t] !== dir) return false;
  if (t === 'E' || PAD_PAIR[t]) return false;
  if (lv.coinAt[c] !== undefined && !(s.coinMask >> lv.coinAt[c] & 1)) return false;
  if (lv.keyAt[c] !== undefined && !(s.keyMask >> lv.keyAt[c] & 1)) return false;
  return true;
}
function visit(lv, s, c, ev) {   // Robo steps onto a square: pick things up
  const ci = lv.coinAt[c];
  if (ci !== undefined && !(s.coinMask >> ci & 1)) { s.coinMask |= 1 << ci; ev.push('coin'); }
  const ki = lv.keyAt[c];
  if (ki !== undefined && !(s.keyMask >> ki & 1)) { s.keyMask |= 1 << ki; s.keys++; ev.push('key'); }
  if (lv.tiles[c] === 'x' && !s.blue) { s.blue = 1; ev.push('blue'); }
}
// Try to move Robo one way. Returns { ok:false, why } or { ok:true, s (new state), path, tele, crate, ev }
function tryMove(lv, s0, dir) {
  const [dx, dy] = DIRS[dir], s = copyState(s0), ev = [];
  const fail = why => ({ ok: false, why });
  const n = nb(lv, s.r, dx, dy);
  if (n < 0) return fail('wall');
  const t = lv.tiles[n];
  if (ARROWS[t] && ARROWS[t] !== dir) return fail('arrow');
  if (t === 'L' && !isOpen(lv, s, n)) {
    if (!s.keys) return fail('lock');
    s.keys--; s.lockMask |= 1 << lv.lockAt[n]; ev.push('unlock');
  } else if (blocked(lv, s, n)) return fail(t === 'G' || t === 'X' ? 'door' : 'wall');
  let crate = null;
  const ci = s.crates.indexOf(n);
  if (ci >= 0) {
    const n2 = nb(lv, n, dx, dy);
    if (n2 < 0 || !crateCanGo(lv, s, n2, dir)) return fail('crate');
    crate = { i: ci, path: [n, n2] };
    s.crates[ci] = n2; ev.push('push');
    while (lv.tiles[s.crates[ci]] === 'i') {   // crates slide on ice too
      const n3 = nb(lv, s.crates[ci], dx, dy);
      if (n3 < 0 || n3 === n || !crateCanGo(lv, s, n3, dir)) break;
      s.crates[ci] = n3; crate.path.push(n3);
    }
    if (lv.tiles[s.crates[ci]] === 'x' && !s.blue) { s.blue = 1; ev.push('blue'); }
  }
  s.r = n;
  if (inLaser(lv, s, n)) return fail('laser');
  const path = [s0.r, n];
  let tele = -1;
  visit(lv, s, n, ev);
  for (;;) {
    const here = s.r, p = lv.pads[here];
    if (p !== undefined) {   // warp pad: pop out of the twin pad (if it's free)
      const tmp = copyState(s); tmp.r = p;
      if (!s.crates.includes(p) && !inLaser(lv, tmp, p)) { s.r = p; tele = path.length; path.push(p); ev.push('warp'); visit(lv, s, p, ev); }
      break;
    }
    if (lv.tiles[here] !== 'i') break;
    const m = nb(lv, here, dx, dy);   // on ice: keep sliding!
    if (m < 0 || blocked(lv, s, m) || s.crates.includes(m)) break;
    const tm = lv.tiles[m];
    if (ARROWS[tm] && ARROWS[tm] !== dir) break;
    const tmp = copyState(s); tmp.r = m;
    if (inLaser(lv, tmp, m)) break;
    s.r = m; path.push(m); visit(lv, s, m, ev);
    if (!ev.includes('slide')) ev.push('slide');
  }
  s.won = lv.tiles[s.r] === 'E';
  if (s.won) ev.push('win');
  const was = switchesOn(lv, s0), now = switchesOn(lv, s);
  if (was !== now) ev.push(now ? 'open' : 'close');
  return { ok: true, s, path, tele, crate, ev };
}
function stateKey(s) {
  return s.r + ':' + s.crates.slice().sort((a, b) => a - b).join(',') + ':' + s.keys + ':' + s.keyMask + ':' + s.lockMask + ':' + s.blue + ':' + s.coinMask;
}
// ===== RULES END =====

// ---------- Save ----------
function loadSave() {
  try {
    const s = JSON.parse(localStorage.getItem('roboEscape') || '{}') || {};
    return { done: Math.max(0, Math.min(LEVELS.length, s.done | 0)), stars: s.stars && typeof s.stars === 'object' ? s.stars : {} };
  } catch (_) { return { done: 0, stars: {} }; }
}
function writeSave() { try { localStorage.setItem('roboEscape', JSON.stringify(save)); } catch (_) {} }
let save = loadSave();

// ---------- Sound ----------
let actx = null;
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} }
  if (actx && actx.state === 'suspended') actx.resume();
}
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
const sfx = {
  step:   () => note(200 + Math.random() * 40, 0, 0.05, 'triangle', 0.07),
  push:   () => note(120, 0, 0.14, 'square', 0.07, 70),
  bump:   () => { note(320, 0, 0.12, 'sine', 0.16, 110); note(220, 0.1, 0.18, 'sine', 0.12, 520); },   // BOING!
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  key:    () => [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.06, 0.15, 'triangle', 0.12)),
  unlock: () => { note(500, 0, 0.08, 'square', 0.08); note(750, 0.08, 0.2, 'square', 0.08); },
  open:   () => note(300, 0, 0.35, 'sine', 0.14, 900),
  close:  () => note(600, 0, 0.25, 'sine', 0.1, 200),
  blue:   () => { note(440, 0, 0.1, 'square', 0.08); note(880, 0.1, 0.3, 'sine', 0.14); },
  warp:   () => { for (let i = 0; i < 6; i++) note(300 + i * 150, i * 0.04, 0.1, 'square', 0.05); },
  zap:    () => note(1800, 0, 0.14, 'square', 0.04, 200),
  slide:  () => note(1400, 0, 0.3, 'sine', 0.05, 500),
  undo:   () => note(520, 0, 0.1, 'sine', 0.09, 300),
  click:  () => note(660, 0, 0.06, 'triangle', 0.12),
  win:    () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  bigWin: () => [523, 659, 784, 1047, 1319, 1047, 1319, 1568].forEach((f, i) => note(f, i * 0.13, 0.25, 'square', 0.1)),
};

// ---------- Music: a calm, mysterious maze tune ----------
const MUSIC_BPM = 92;
const MELODY = [
  69,0,72,0, 76,0,74,72, 71,0,0,0, 67,0,0,0,
  69,0,72,0, 76,0,79,77, 76,0,0,0, 0,0,0,0,
  65,0,69,0, 72,0,71,69, 67,0,64,0, 67,0,0,0,
  69,0,71,72, 74,0,72,71, 69,0,0,0, 0,0,0,0,
];
const ROOTS = [45, 48, 41, 40];
const BASS = ROOTS.flatMap(r => [r, 0, 0, 0, r + 7, 0, 0, 0, r + 12, 0, 0, 0, r + 7, 0, 0, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let musicOn = true, nextNoteTime = 0, step = 0;
function playMusic() {
  if (!actx || !musicOn) return;
  const stepDur = 60 / MUSIC_BPM / 2;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) { note(midi(m), t, stepDur * 3, 'sine', 0.07); note(midi(m + 12), t + stepDur * 1.5, stepDur, 'sine', 0.012); }   // soft echo
    if (b) note(midi(b), t, stepDur * 1.6, 'triangle', 0.07);
    nextNoteTime += stepDur; step++;
  }
}
function toggleMusic() { musicOn = !musicOn; }

// ---------- Game state ----------
let screen = 'title', levelIndex = 0, lv = null, S = null, undoStack = [];
let anim = null, bump = null, queued = null, heldDir = null, holdT = 0, face = 1;
let frame = 0, particles = [], words = [], glitchFX = 0, wonT = 0, wonStars = 0, mapSel = Math.min(save.done, LEVELS.length - 1);
let TS = 48, OX = 0, OY = 0, buttons = [], doorFlash = 0;

function startLevel(i) {
  levelIndex = i; lv = parseLevel(LEVELS[i]); S = newState(lv);
  undoStack = []; anim = null; bump = null; queued = null; face = 1; particles = []; words = [];
  TS = Math.min(56, Math.floor(920 / lv.w), Math.floor(404 / lv.h));
  OX = Math.floor((W - lv.w * TS) / 2); OY = Math.floor(104 + (404 - lv.h * TS) / 2);
  screen = 'play'; glitchFX = 8; sfx.warp();
}
const cx = c => OX + (c % lv.w + 0.5) * TS, cy = c => OY + (Math.floor(c / lv.w) + 0.5) * TS;
function pathPos(path, t, seg, tele) {   // where is something partway along its path? (pixels)
  const k = Math.min(path.length - 1, t / seg), i = Math.floor(k), f = k - i;
  if (i >= path.length - 1) return { x: cx(path[path.length - 1]), y: cy(path[path.length - 1]), s: 1 };
  const a = path[i], b = path[i + 1];
  if (i + 1 === tele) { const c = f < 0.5 ? a : b; return { x: cx(c), y: cy(c), s: Math.abs(f - 0.5) * 2 }; }   // shrink, pop, grow
  return { x: cx(a) + (cx(b) - cx(a)) * f, y: cy(a) + (cy(b) - cy(a)) * f, s: 1 };
}

const BONK = ['BONK!', 'BOINK!', 'OOF!', 'BOOP!'];
function doMove(dir) {
  if (screen !== 'play' || S.won) return;
  if (anim) { queued = dir; return; }
  if (dir === 'left') face = -1;
  if (dir === 'right') face = 1;
  const res = tryMove(lv, S, dir);
  if (!res.ok) {
    if (!bump || bump.t > 10) {
      bump = { dir, t: 0 };
      const msg = { lock: 'Need a key! 🔑', door: 'Door is shut!', laser: 'ZAP! Block it with a crate!', crate: 'Stuck!', arrow: 'Wrong way!' }[res.why]
                  || BONK[Math.floor(Math.random() * BONK.length)];
      words.push({ x: cx(S.r), y: cy(S.r) - TS * 0.6, text: msg, life: 70, color: res.why === 'laser' ? '#ff5252' : '#ffd740' });
      res.why === 'laser' ? (sfx.zap(), glitchFX = 4) : sfx.bump();
    }
    holdT = -20;
    return;
  }
  undoStack.push(S); S = res.s;
  const sliding = res.ev.includes('slide');
  anim = { path: res.path, tele: res.tele, crate: res.crate, t: 0, seg: sliding ? 4 : 6 };
  anim.dur = Math.max(res.path.length - 1, res.crate ? res.crate.path.length - 1 : 0) * anim.seg;
  const end = res.path[res.path.length - 1];
  sfx.step();
  for (const e of res.ev) {
    if (e === 'push') sfx.push();
    if (e === 'coin') { sfx.coin(); burst(cx(end), cy(end), ['#ffd740', '#fff59d'], 12, 3); }
    if (e === 'key') { sfx.key(); burst(cx(end), cy(end), ['#ffd740', '#ffffff'], 14, 3); }
    if (e === 'unlock') { sfx.unlock(); burst(cx(res.path[1]), cy(res.path[1]), ['#ffb300', '#fff'], 16, 4); }
    if (e === 'open') { sfx.open(); doorFlash = 30; }
    if (e === 'close') sfx.close();
    if (e === 'blue') { sfx.blue(); doorFlash = 30; }
    if (e === 'warp') { sfx.warp(); glitchFX = 5; }
    if (e === 'slide') sfx.slide();
  }
}
function undo() {
  if (screen !== 'play' || !undoStack.length) return;
  S = undoStack.pop(); anim = null; queued = null; bump = null; sfx.undo();
}
function restart() {
  if (screen !== 'play') return;
  const fresh = newState(lv);
  if (stateKey(fresh) !== stateKey(S)) undoStack.push(S);
  S = fresh; anim = null; queued = null; bump = null; glitchFX = 6; sfx.warp();
}

// ---------- Update ----------
function update() {
  frame++;

  if (doorFlash > 0) doorFlash--;
  for (const pt of particles) { pt.x += pt.vx; pt.y += pt.vy; pt.vy += pt.confetti ? 0.05 : 0.2; pt.life--; }
  particles = particles.filter(pt => pt.life > 0);
  for (const w of words) { w.y -= 0.7; w.life--; }
  words = words.filter(w => w.life > 0);
  if (screen === 'play') {
    if (bump && ++bump.t > 22) bump = null;
    if (anim && ++anim.t >= anim.dur) {
      anim = null;
      if (S.won) { doWin(); return; }
    }
    if (!anim) {
      if (queued) { const d = queued; queued = null; doMove(d); }
      else if (heldDir) { if (++holdT >= 14) { holdT = 6; doMove(heldDir); } }
    }

    ctx.strokeStyle = `rgba(255,23,68,${0.35 + 0.2 * Math.sin(frame * 0.4)})`; ctx.lineWidth = TS * 0.32;
    ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#ff8a80'; ctx.lineWidth = TS * 0.12; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(ex, ey); ctx.stroke();
    if (frame % 4 < 2) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, ey, TS * 0.1, 0, 7); ctx.fill(); }   // sparks where it stops
  }
}
function drawCrate(x, y, onSwitch) {
  const s = TS * 0.84;
  if (onSwitch) { ctx.fillStyle = `rgba(105,240,174,${0.4 + 0.2 * Math.sin(frame * 0.2)})`; ctx.beginPath(); ctx.arc(x, y, TS * 0.56, 0, 7); ctx.fill(); }
  roundRect(x - s / 2, y - s / 2 + 3, s, s, 7, 'rgba(0,0,0,.35)');
  roundRect(x - s / 2, y - s / 2, s, s, 7, onSwitch ? '#00c853' : '#ff9100');
  roundRect(x - s / 2 + 4, y - s / 2 + 4, s - 8, s - 8, 5, onSwitch ? '#69f0ae' : '#ffb74d');
  ctx.strokeStyle = onSwitch ? '#1b5e20' : '#e65100'; ctx.lineWidth = Math.max(3, TS * 0.08);
  ctx.beginPath(); ctx.moveTo(x - s / 2 + 7, y - s / 2 + 7); ctx.lineTo(x + s / 2 - 7, y + s / 2 - 7);
  ctx.moveTo(x + s / 2 - 7, y - s / 2 + 7); ctx.lineTo(x - s / 2 + 7, y + s / 2 - 7); ctx.stroke();
  ctx.strokeStyle = onSwitch ? '#1b5e20' : '#e65100'; ctx.lineWidth = 2; ctx.strokeRect(x - s / 2 + 4, y - s / 2 + 4, s - 8, s - 8);
}
function drawPlay() {
  drawBackground();
  // board frame
  roundRect(OX - 8, OY - 8, lv.w * TS + 16, lv.h * TS + 16, 14, 'rgba(0,229,255,.18)');
  for (let c = 0; c < lv.w * lv.h; c++) drawTile(c);
  drawLasers();
  // coins + keys
  for (let i = 0; i < lv.coins.length; i++) if (!(S.coinMask >> i & 1)) {
    const c = lv.coins[i]; drawCoin(cx(c), cy(c) + Math.sin(frame * 0.05 + c) * 3, frame * 0.08 + c, TS / 48);
  }
  for (let i = 0; i < lv.keys.length; i++) if (!(S.keyMask >> i & 1)) {
    const c = lv.keys[i]; drawKey(cx(c), cy(c) + Math.sin(frame * 0.06 + c) * 3, TS / 44);
  }
  // crates
  for (let i = 0; i < S.crates.length; i++) {
    let x = cx(S.crates[i]), y = cy(S.crates[i]), moving = false;
    if (anim && anim.crate && anim.crate.i === i) { const p = pathPos(anim.crate.path, anim.t, anim.seg, -1); x = p.x; y = p.y; moving = anim.t < anim.dur; }
    drawCrate(x, y, !moving && lv.tiles[S.crates[i]] === '_');
  }
  // Robo
  let rx = cx(S.r), ry = cy(S.r), rs = 1, squash = 1, dizzy = false;
  if (anim) {
    const p = pathPos(anim.path, anim.t, anim.seg, anim.tele); rx = p.x; ry = p.y; rs = Math.max(0.05, p.s);
    if (p.s === 1) ry -= Math.abs(Math.sin(anim.t / anim.seg * Math.PI)) * TS * 0.08;   // little hop with each step
  }
  if (bump) {   // walked into something: bonk!
    const [dx, dy] = DIRS[bump.dir], k = Math.sin(Math.min(1, bump.t / 6) * Math.PI) * TS * 0.18;
    rx += dx * k; ry += dy * k;
    squash = 1 - 0.18 * Math.sin(bump.t / 22 * Math.PI) * (dy ? -1 : 1);
    dizzy = true;
    for (let i = 0; i < 3; i++) {
      const a = frame * 0.2 + i * 2.1;
      star(rx + Math.cos(a) * TS * 0.35, ry - TS * 0.45 + Math.sin(a) * TS * 0.1, TS * 0.08, '#ffd740');
    }
  }
  ctx.fillStyle = 'rgba(0,0,0,.3)'; ctx.beginPath(); ctx.ellipse(rx, cy(S.r) + TS * 0.38, TS * 0.28 * rs, TS * 0.08 * rs, 0, 0, 7); ctx.fill();
  const won = S.won && !anim;
  if (won) dancingRobo(rx, ry, TS / 44);
  else roboAt(rx, ry, TS / 44 * rs, { face, squash, dizzy });
  if (anim && anim.tele >= 0 && Math.abs(anim.t / anim.seg - anim.tele + 0.5) < 0.5)
    for (let k = 0; k < 3; k++) { ctx.fillStyle = ['#ff80ff', '#00e5ff', '#fff'][k]; ctx.fillRect(rx + (Math.random() - .5) * TS, ry + (Math.random() - .5) * TS, 5, 5); }
  drawParticles();
  for (const w of words) { ctx.globalAlpha = Math.min(1, w.life / 20); text(w.text, Math.min(W - 160, Math.max(160, w.x)), w.y, 26, w.color); ctx.globalAlpha = 1; }

  // top bar
  roundRect(0, 0, W, 58, 0, 'rgba(10,0,30,.55)');
  text(`Level ${levelIndex + 1}: ${lv.name}`, 18, 40, 28, '#7df9ff', 'left');
  button(560, 7, 92, 44, '↶ UNDO', '#7c4dff', undo, 20);
  button(658, 7, 110, 44, '⟳ RESTART', '#ff4081', restart, 20);
  button(774, 7, 92, 44, '🗺️ MAP', '#00b8d4', goMap, 20);
  button(872, 7, 70, 44, musicOn ? '🔊' : '🔇', '#455a64', toggleMusic, 24);
  // coins / keys
  if (lv.coins.length) { drawCoin(34, 82, frame * 0.08, 0.8); text(`${popcount(S.coinMask)}/${lv.coins.length}`, 56, 91, 24, '#ffd740', 'left'); }
  if (lv.keys.length) { drawKey(130, 82, 0.8); text(`x ${S.keys}`, 150, 91, 24, '#ffd740', 'left'); }
  if (lv.hint) text(lv.hint, 560, 91, 21, '#ffe57f');
  if (doorFlash > 0 && doorFlash % 10 < 6) text('A door opened!', W / 2, OY + lv.h * TS + 2, 22, '#69f0ae');
}

function drawTitle() {
  drawBackground();
  const bob = Math.sin(frame * 0.06) * 10;
  for (let i = 0; i < 8; i++) {   // floating glitch blocks
    const gx = (i * 131 + frame * (0.3 + i % 3 * 0.2)) % (W + 80) - 40, gy = 60 + (i * 97) % 380;
    ctx.fillStyle = '#1a0033'; ctx.fillRect(gx, gy, 40, 40); glitchSquares(gx, gy, 40, i);
    ctx.strokeStyle = '#ff80ff'; ctx.lineWidth = 2; ctx.strokeRect(gx + 1, gy + 1, 38, 38);
  }
  const jitter = frame % 90 < 6 ? (Math.random() - .5) * 20 : 0;
  text('ROBO ESCAPE', W / 2 + jitter, 120 + bob, 92, '#7df9ff');
  text('Robo is trapped in a giant GLITCH MAZE!', W / 2, 180, 30, '#ff80ff');
  roboAt(W / 2, 270 + Math.sin(frame * 0.08) * 6, 2.2, { face: Math.sin(frame * 0.02) > 0 ? 1 : -1 });
  text('Push crates • Flip switches • Find the way out!', W / 2, 360, 26);
  button(W / 2 - 120, 385, 240, 74, '▶ PLAY', '#00c853', goMap, 40);
  text('Arrows move   Z undo   R restart   M music', W / 2, 500, 20, '#ffe57f');
}

const BUBBLES = Array.from({ length: 15 }, (_, i) => {
  const row = Math.floor(i / 5), col = row % 2 ? 4 - i % 5 : i % 5;
  return { x: 160 + col * 160, y: 165 + row * 125 };
});
function drawMap() {
  drawBackground();
  text('THE GLITCH MAZE', W / 2, 62, 50, '#7df9ff');
  text('Tap a level to play!', W / 2, 100, 22, '#ffe57f');
  button(16, 14, 116, 50, '⬅ BACK', '#7c4dff', () => { screen = 'title'; }, 22);
  ctx.strokeStyle = 'rgba(125,249,255,.35)'; ctx.lineWidth = 10; ctx.setLineDash([14, 12]);
  ctx.beginPath(); BUBBLES.forEach(b => ctx.lineTo(b.x, b.y)); ctx.stroke(); ctx.setLineDash([]);
  const COLS = ['#00e5ff', '#ff9100', '#ff9100', '#ffc400', '#2979ff', '#ff80ff', '#ff80ff', '#ff1744', '#ff1744', '#80d8ff', '#80d8ff', '#ffd740', '#ffd740', '#b388ff', '#76ff03'];
  BUBBLES.forEach((b, i) => {
    const open = i <= save.done, sel = i === mapSel, r = sel ? 44 + Math.sin(frame * 0.12) * 3 : 40;
    if (sel) { ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.beginPath(); ctx.arc(b.x, b.y, r + 10, 0, 7); ctx.fill(); }
    ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(b.x, b.y + 5, r, 0, 7); ctx.fill();
    ctx.fillStyle = open ? COLS[i] : '#3a3355'; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.fill();
    ctx.strokeStyle = open ? '#fff' : '#6d6487'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(b.x, b.y, r, 0, 7); ctx.stroke();
    if (open) text(String(i + 1), b.x, b.y + 14, 40);
    else text('🔒', b.x, b.y + 12, 32);
    const st = save.stars[i] || 0;
    if (i < save.done) for (let k = 0; k < 3; k++) star(b.x - 26 + k * 26, b.y + r + 12, 11, k < st ? '#ffd740' : '#4a4466');
    if (open) buttons.push({ x: b.x - 48, y: b.y - 48, w: 96, h: 96, act: () => { mapSel = i; startLevel(i); } });
  });
  const b = BUBBLES[mapSel];
  roboAt(b.x + 52, b.y - 30 + Math.sin(frame * 0.1) * 4, 1.1, { face: -1 });
  if (save.done >= LEVELS.length) text('🏆 You escaped the whole maze!', W / 2, 505, 22, '#ffd740');
}

function drawWon() {
  drawPlay();
  buttons = [];
  ctx.fillStyle = 'rgba(10,0,30,.6)'; ctx.fillRect(0, 0, W, H);
  roundRect(W / 2 - 280, 70, 560, 400, 26, '#2a0f4a');
  ctx.strokeStyle = '#7df9ff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.roundRect(W / 2 - 280, 70, 560, 400, 26); ctx.stroke();
  const pop = Math.min(1, wonT / 15);
  text('ESCAPED!', W / 2, 140, 64 * (0.6 + 0.4 * pop), '#69f0ae');
  for (let k = 0; k < 3; k++) {
    const show = wonT > 15 + k * 12, sz = show ? 30 + Math.max(0, 8 - (wonT - 15 - k * 12)) : 30;
    star(W / 2 - 80 + k * 80, 195, sz, show && k < wonStars ? '#ffd740' : '#4a4466');
  }
  dancingRobo(W / 2, 290, 2);
  const MSG = ['Great job!', 'You did it!', 'Super smart!', 'Wow, what a brain!', 'Robo says THANK YOU!'];
  const got = popcount(S.coinMask), all = lv.coins.length;
  text(all && got < all ? `${MSG[levelIndex % MSG.length]} Find all ${all} coins for 3 stars!` : MSG[levelIndex % MSG.length], W / 2, 365, 24, '#ffe57f');
  button(W / 2 - 250, 390, 150, 60, '🗺️ MAP', '#00b8d4', goMap, 26);
  button(W / 2 - 80, 390, 140, 60, '⟳ AGAIN', '#ff4081', () => startLevel(levelIndex), 24);
  button(W / 2 + 80, 390, 170, 60, 'NEXT ▶', '#00c853', nextLevel, 30);
  drawParticles();
}

function drawFinal() {
  drawBackground();
  const bob = Math.sin(frame * 0.08) * 8;
  text('YOU ESCAPED THE', W / 2, 90 + bob, 52, '#ffd740');
  text('GLITCH MAZE!! 🎉', W / 2, 150 + bob, 60, '#7df9ff');
  dancingRobo(W / 2 - 150, 280, 2.6);
  dancingRobo(W / 2 + 150, 280, 2.6);
  const total = Object.values(save.stars).reduce((a, b) => a + (b | 0), 0);
  star(W / 2, 255, 34, '#ffd740');
  text(`${total} / ${LEVELS.length * 3}`, W / 2, 320, 30, '#ffd740');
  text('Robo is FREE! You are a super puzzle solver! 🏆', W / 2, 395, 28);
  button(W / 2 - 100, 420, 200, 64, '🗺️ MAP', '#00c853', goMap, 30);
  drawParticles();
}

function draw() {
  buttons = [];
  if (screen === 'title') drawTitle();
  else if (screen === 'map') drawMap();
  else if (screen === 'play') drawPlay();
  else if (screen === 'won') drawWon();
  else if (screen === 'final') drawFinal();
  if (glitchFX > 0) {   // the screen glitches: slices slide sideways + a color flash
    for (let i = 0; i < 5; i++) { const y = Math.random() * H, h = 8 + Math.random() * 30, dx = (Math.random() - .5) * 40; ctx.drawImage(C, 0, y, W, h, dx, y, W, h); }
    ctx.fillStyle = Math.random() < 0.5 ? 'rgba(255,0,255,.1)' : 'rgba(0,229,255,.1)'; ctx.fillRect(0, 0, W, H);
  }
}

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
