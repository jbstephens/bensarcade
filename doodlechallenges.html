<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🌀 Doodle Challenges</title>
<script src="touchpad.js?v=4"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(-45deg, #e3f4ff 0 36px, #d4ecff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead h1 { margin: 0; font-size: clamp(28px, 5vw, 54px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #9b59ff; letter-spacing: 2px; }
  #gHead p { margin: 2px 0 6px; font-size: clamp(15px, 2.1vw, 21px); font-weight: bold; }
  #topBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 0 10px 6px; }
  #topBtns .btn { font-size: clamp(17px, 2.1vw, 22px); min-height: 56px; padding: 6px 16px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec .btn { font-size: 17px; min-height: 46px; padding: 5px 14px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #7c4dff; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb:active { transform: scale(.96); }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #7c4dff; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #modes, .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #pens { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; background: #2b7bd9;
    border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 7px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-mode { background: #fff; font-size: 16px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-new { background: #b9f6ca; } .b-who { background: #fff59d; }
  .b-dice { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-race { background: #ffd180; } .b-pad { background: #ffc6ff; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- overlays: 🎲 dice + ⏱️ race ---------- */
  .over { position: fixed; inset: 0; background: rgba(30, 20, 70, .78); display: none; z-index: 40;
    align-items: center; justify-content: center; padding: 12px; }
  .over.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 26px; padding: 12px 16px; width: 100%; max-width: 1100px;
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(26px, 4vw, 44px); color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #9b59ff; }
  #reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .reel { border: 5px solid #333; border-radius: 22px; background: #fffbe0; text-align: center; padding: 6px; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: min(34vh, 250px); position: relative; }
  .reel small { font-size: 16px; font-weight: bold; color: #7c4dff; }
  .reel .pic { height: min(18vh, 140px); display: flex; align-items: center; justify-content: center; font-size: min(14vh, 100px); line-height: 1; }
  .reel .pic svg { height: 100%; width: auto; }
  .reel .word { font-size: clamp(18px, 2.6vw, 30px); font-weight: bold; min-height: 1.3em; }
  .reel.spin .pic, .reel.spin .word { animation: blur .12s linear infinite; }
  .reel.stop { animation: pop .35s ease-out; background: #e7ffe0; }
  @keyframes blur { 0% { transform: translateY(-14px); opacity: .5; } 100% { transform: translateY(14px); opacity: .5; } }
  @keyframes pop { 0% { transform: scale(1.12); } 100% { transform: scale(1); } }
  #diceSay { text-align: center; font-size: clamp(22px, 3.4vw, 38px); font-weight: bold; min-height: 1.4em; color: #d81b60; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .row .btn { flex: 1 1 160px; }
  #bRoll { font-size: clamp(24px, 3.4vw, 36px); min-height: 74px; }
  #bRoll.going { animation: wob .3s ease-in-out infinite alternate; }
  @keyframes wob { from { transform: rotate(-4deg) scale(1.03); } to { transform: rotate(4deg) scale(1.03); } }
  #raceBox { display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #ring { width: min(42vh, 300px); height: min(42vh, 300px); }
  #racePrompt { text-align: center; font-size: clamp(20px, 3vw, 32px); font-weight: bold; background: #fffbe0; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #raceMsg { text-align: center; font-size: clamp(20px, 2.8vw, 30px); font-weight: bold; color: #7c4dff; min-height: 1.3em; }
  .tb.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 16px; padding: 4px; } #pHelp { font-size: 14px; } #topBtns .btn { min-height: 46px; } }
  /* ---------- PRINT: only the sheet (or a whole set of sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, .over { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <h1>🌀 DOODLE CHALLENGES</h1>
    <p>Grab a pencil or markers! Tap a challenge to open it and print it.</p>
  </div>
  <div id="topBtns">
    <button class="btn b-dice" id="bDice">🎲 Doodle Dice</button>
    <button class="btn b-race" id="bRace">⏱️ Doodle Race</button>
    <button class="btn b-pad" id="bPad">🖍️ Doodle Pad</button>
    <button class="btn b-all" id="bBook">🖨️ Print every challenge</button>
    <button class="btn b-back" id="bLeave">⬅️ Back</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <div class="two">
      <button class="btn b-clear" id="bUndo">↩️ Undo</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
    </div>
    <button class="btn b-new hide" id="bExtra"></button>
    <button class="btn b-who" id="bWho"></button>
    <div id="modes">
      <button class="btn b-mode" id="bLine">✏️ Black lines<br>(saves ink)</button>
      <button class="btn b-mode" id="bColor">🎨 Color<br>pictures</button>
    </div>
    <div class="two">
      <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
      <button class="btn b-print2" id="bPrintMine">🖨️ Print with my doodle</button>
    </div>
    <button class="btn b-all" id="bPrintAll">🖨️ Print the set</button>
    <button class="btn b-back" id="bBack">⬅️ Back to challenges</button>
  </div>
</div>
<div id="dice" class="over"><div class="card">
  <h2>🎲 DOODLE DICE</h2>
  <div id="reels">
    <div class="reel" id="reel0"><small>WHO?</small><div class="pic"></div><div class="word"></div></div>
    <div class="reel" id="reel1"><small>DOING WHAT?</small><div class="pic"></div><div class="word"></div></div>
    <div class="reel" id="reel2"><small>WHERE?</small><div class="pic"></div><div class="word"></div></div>
  </div>
  <div id="diceSay">Tap ROLL to get a doodle challenge!</div>
  <button class="btn b-dice" id="bRoll">🎲 ROLL!</button>
  <div class="row">
    <button class="btn b-pad" id="bDicePad">🖍️ Draw it here</button>
    <button class="btn b-race" id="bDiceRace">⏱️ Race it!</button>
    <button class="btn b-print" id="bDicePrint">🖨️ Print it</button>
    <button class="btn b-back" id="bDiceClose">👍 Done</button>
  </div>
</div></div>
<div id="race" class="over"><div class="card">
  <h2>⏱️ DOODLE RACE</h2>
  <div id="racePrompt"></div>
  <div id="raceBox">
    <svg id="ring" viewBox="0 0 200 200"></svg>
    <div style="display:flex;flex-direction:column;gap:8px;min-width:240px">
      <div class="row" id="times"></div>
      <button class="btn b-dice" id="bRaceRoll">🎲 New challenge</button>
      <button class="btn b-print" id="bRaceGo">🏁 GO!</button>
      <button class="btn b-clear hide" id="bRaceStop">⏹️ Stop</button>
    </div>
  </div>
  <div id="raceMsg"></div>
  <div class="row hide" id="champs"></div>
  <button class="btn b-back" id="bRaceClose">👍 Done</button>
</div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🌀 DOODLE CHALLENGES: printable pencil/marker doodle pages + Doodle Dice + Doodle Race + Doodle Pad
// Every sheet is a portrait letter page, viewBox 0 0 800 1000. LINE = true is black lines (saves ink),
// LINE = false shows the characters in color. The art helpers + characters are copied from the Craft Room.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)

function squiggleD(seed) {
  const r = rnd(seed), k = 6 + Math.floor(r() * 3), pts = [];
  const cl = (v, a, b) => Math.max(a, Math.min(b, v));
  let x = 260 + r() * 280, y = 330 + r() * 300, h = r() * Math.PI * 2; pts.push([x, y]);

    h += (r() < .5 ? -1 : 1) * (.7 + r() * 1.1);
    const len = 100 + r() * 70; let nx = x + Math.cos(h) * len, ny = y + Math.sin(h) * len;
    if (nx < 180 || nx > 620) { h = Math.PI - h; nx = x + Math.cos(h) * len; }
    if (ny < 250 || ny > 720) { h = -h; ny = y + Math.sin(h) * len; }
    x = cl(nx, 180, 620); y = cl(ny, 250, 720); pts.push([x, y]);
  }
  let d = 'M' + n(pts[0][0]) + ' ' + n(pts[0][1]);
  for (let i = 0; i < pts.length - 1; i++) {
    const p0 = pts[Math.max(i - 1, 0)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(i + 2, pts.length - 1)];
    d += ' C' + n(p1[0] + (p2[0] - p0[0]) / 6) + ' ' + n(p1[1] + (p2[1] - p0[1]) / 6) + ' ' + n(p2[0] - (p3[0] - p1[0]) / 6) + ' ' + n(p2[1] - (p3[1] - p1[1]) / 6) + ' ' + n(p2[0]) + ' ' + n(p2[1]);
  }
  if (r() < .8) { const rr = 24 + r() * 26; d += ' a' + n(rr) + ' ' + n(rr) + ' 0 1 1 ' + n(rr * .6) + ' ' + n(rr * 1.4); }
  return d;
}

    b.addEventListener('click', () => { state.champ = nm; saveState(); refreshThumb(sheetIndex('print-cert')); tune([659, 880, 1175]); say(nm + ' is the Doodle Champion!'); $('raceMsg').textContent = '🏆 ' + nm + ' is the Doodle Champion!'; showCertBtn(); });
    box.appendChild(b);

}
function showCertBtn() {

  b.addEventListener('click', () => { closeRace(); openSheet(sheetIndex('print-cert')); printSheet(false); });
  box.appendChild(b);
}
function closeRace() { stopRace(true); hush(); $('race').classList.remove('on'); $('bRaceGo').textContent = '🏁 GO!'; }
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {

  if (overOn('dice')) {
    if (k === 'Enter' || k === ' ') { rollDice(); e.preventDefault(); } else if (k === 'Escape' || k === 'Backspace') { closeDice(); e.preventDefault(); }
    return;
  }
  if (overOn('race')) {
    if (k === 'Enter' || k === ' ') { startRace(); e.preventDefault(); } else if (k === 'Escape' || k === 'Backspace') { closeRace(); e.preventDefault(); }
    return;
  }
  if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(false); return; }
    else if (k === 'Escape') { leave(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet(false);
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {

  renderGallery(); renderPens();
  const cv = $('trace');

  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);

  tap('bLine', () => setMode('line')); tap('bColor', () => setMode('color'));
  tap('bPrint', () => printSheet(false)); tap('bPrintMine', () => printSheet(true));
  tap('bUndo', undo); tap('bClear', clearDoodle); tap('bExtra', doExtra); tap('bWho', cycleArtist);
  tap('bPrintAll', () => printSet(kindSheets(SHEETS[cur].kind))); tap('bBack', backToGallery);
  tap('bDice', openDice); tap('bRace', openRace); tap('bPad', () => openSheet(sheetIndex('pad-pad'))); tap('bBook', printBook); tap('bLeave', leave);
  tap('bRoll', rollDice); tap('bDicePad', diceToPad); tap('bDicePrint', diceToPrint); tap('bDiceClose', closeDice);
  tap('bDiceRace', () => { closeDice(); openRace(); });
  tap('bRaceGo', startRace); tap('bRaceStop', () => stopRace(false)); tap('bRaceRoll', raceRoll); tap('bRaceClose', closeRace);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);

if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
