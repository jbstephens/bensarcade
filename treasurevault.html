<!DOCTYPE html>

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fdf6e3; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }

  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }

  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #0b1a3a, #16386e 55%, #8a6200); color: #fff; flex: none; min-height: 96px; }

  .rev { font-size: 14px; background: #fbf3dd; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #7a5200; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }

  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(13,42,92,.15); }

  .gift.on { background: #f48fb1; color: #fff; }

  .h2 { font-size: 28px; font-weight: 900; color: #0d2a5c; margin: 4px 0 12px; text-align: center; }

  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(7,18,38,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(7,18,38,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fbf3dd; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fbf3dd; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #7a5200; }
  #printBox .pbTip { font-size: 20px; color: #0d2a5c; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 🔒 LOCK ROBO'S TREASURE VAULT: a pretend online store. Buy paper treasure-hunt stuff with pretend Gold Coins,
// then pick which orders to PRINT. Nothing prints by itself. Lock Robo (Robo Jump 8) is a hero now and runs the shop!
// Save: localStorage.treasureVault = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'treasureVault';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
// ⛓️🔑 copied from Robo Jump 8 (drawChain, drawKey)
function drawChain(x1, y1, x2, y2, col = '#b0bec5', size = 1) {   // a chain of links from one point to another
  const len = Math.hypot(x2 - x1, y2 - y1), n = Math.max(1, Math.floor(len / (11 * size))), ang = Math.atan2(y2 - y1, x2 - x1);
  ctx.save(); ctx.lineWidth = 3 * size;
  for (let i = 0; i < n; i++) {
    const u = (i + 0.5) / n, cx = x1 + (x2 - x1) * u, cy = y1 + (y2 - y1) * u;
    if (OUT) { for (const [c, lw] of [['#222', 3 * size + 5], ['#fff', Math.max(1, 3 * size - 3)]]) { ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.ellipse(cx, cy, 7 * size, i % 2 ? 4 * size : 1.8 * size, ang, 0, 7); ctx.stroke(); } continue; }
    ctx.strokeStyle = i % 2 ? col : 'rgba(0,0,0,.35)';
    ctx.beginPath(); ctx.ellipse(cx, cy, 7 * size, i % 2 ? 4 * size : 1.8 * size, ang, 0, 7); ctx.stroke();
    if (i % 2 === 0) { ctx.strokeStyle = col; ctx.beginPath(); ctx.ellipse(cx, cy, 7 * size, 1.8 * size, ang, 0, 7); ctx.stroke(); }
  }
  ctx.restore();
}
function drawKey(x, y, s = 1, col = '#ffd740', rot = 0) {         // a little key (x, y = middle)
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  if (OUT) { ctx.lineWidth = Math.max(0.3, 2.5 / s); ctx.strokeStyle = '#222'; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(-8, 0, 8, 0, 7); ctx.fill(); ctx.stroke(); ctx.beginPath(); ctx.arc(-8, 0, 4, 0, 7); ctx.stroke();
    for (const r of [[-1, -2, 15, 4], [9, 2, 3, 5], [4, 2, 3, 4]]) { ctx.fillRect(...r); ctx.strokeRect(...r); } ctx.restore(); return; }
  ctx.strokeStyle = col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(-8, 0, 6, 0, 7); ctx.stroke();
  ctx.fillStyle = col; ctx.fillRect(-2, -2, 16, 4); ctx.fillRect(9, 2, 3, 5); ctx.fillRect(4, 2, 3, 4);
  ctx.restore();
}
// 🔒 LOCK ROBO: copied from lockRoboShape in Robo Jump 8 (the NICE version: he is a hero now!).
// Robo's own body in shiny silver, a gold padlock SHACKLE on his head, a gold PADLOCK chest plate, a glowing KEYHOLE
// in his visor, happy ^ ^ eyes, gold chains on his shoulders and a RING OF KEYS on his belt.
// x, y = top-left of his 30x40 Robo box (all sizes scaled, like the store's other robots). o: face, line, jig, noChains
const PAL_LOCK_NICE = { head: '#cfd8dc', body: '#eceff1', visor: '#1a237e', eye: '#ffd740', legs: '#90a4ae', pod: '#ffd740' };
function drawLR(x, y, w, h, o = {}) {
  const pal = PAL_LOCK_NICE, k = w / 30, face = o.face || 1, L = o.line || null, lw = 1.4 * k, cx = x + w / 2, jig = o.jig || 0;
  ctx.save(); ctx.lineJoin = 'round';
  if (!o.noChains) for (const d of [-1, 1]) drawChain(cx + d * 15 * k, y + h * 0.52, cx + d * 19 * k, y + h * 0.95, '#ffd740', 0.55 * k);
  for (const [c, lw] of OUT ? [['#222', 3.2 * k + 5], ['#fff', 3.2 * k - 4]] : [['#ffd740', Math.max(1.5, 3.2 * k)]]) {   // the padlock shackle on his head
    ctx.strokeStyle = c; ctx.lineWidth = lw; ctx.beginPath(); ctx.arc(cx, y + 2 * k, 8 * k, Math.PI, 0); ctx.stroke(); }
  ctx.fillStyle = fillOf(pal.legs);
  for (const lx of [x + 4 * k, x + w - 12 * k]) { ctx.fillRect(lx, y + h - 7 * (h / 40), 8 * k, 7 * (h / 40)); if (L || OUT) { ctx.strokeStyle = OUT ? '#222' : L; ctx.lineWidth = OUT ? 5 : lw; ctx.strokeRect(lx, y + h - 7 * (h / 40), 8 * k, 7 * (h / 40)); } }
  rr(x + 2 * k, y + h * 0.5, w - 4 * k, h * 0.4, 6 * k, pal.body, L, lw);
  rr(x - 5 * k, y + h * 0.3 - 3 * k, 6 * k, 9 * (h / 40), 3 * k, pal.pod, L, lw);
  rr(x + w - 1 * k, y + h * 0.3 - 3 * k, 6 * k, 9 * (h / 40), 3 * k, pal.pod, L, lw);
  rr(x - 2 * k, y, w + 4 * k, h * 0.55, 12 * k, pal.head, L, lw);
  rr(x + 2 * k, y + 4 * k, w - 4 * k, h * 0.55 - 9 * k, 9 * k, OUT ? '#fff' : pal.visor, L, lw);
  // 🔒 gold PADLOCK chest plate with a keyhole
  rr(cx - 11 * k, y + h * 0.56, 22 * k, h * 0.3, 4 * k, '#ffd740', OUT ? '#222' : '#fff8e1', Math.max(1, 1.3 * k));
  circ(cx, y + h * 0.66, 2.6 * k, OUT ? '#222' : '#1a1a1a'); ctx.fillStyle = OUT ? '#222' : '#1a1a1a'; ctx.beginPath(); ctx.moveTo(cx - 1.5 * k, y + h * 0.67); ctx.lineTo(cx + 1.5 * k, y + h * 0.67); ctx.lineTo(cx + 1 * k, y + h * 0.79); ctx.lineTo(cx - 1 * k, y + h * 0.79); ctx.fill();
  // 🔑 a RING OF KEYS on his belt

function thumbPage(k) { if (!THUMB[k]) THUMB[k] = makePage(P(k).pages[0], 0.3); return THUMB[k]; }
function thumbCanvas(k, w = 300, h = 200) {

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function stars(n) { return '★★★★★'.slice(0, n) + '<span style="color:#ddd">' + '★★★★★'.slice(n) + '</span>'; }
function avg(p) { return (p.revs.reduce((a, r) => a + r[1], 0) / p.revs.length).toFixed(1); }
function updateTop() {

  for (const [id, v] of [['tShop', 'shop'], ['tCart', 'cart'], ['tOrders', 'orders']]) $(id).classList.toggle('on', view === v);

function show(v) { view = v; render(); $('main').scrollTop = 0; }
function render() {

function renderShop(m) {

function toggleCart(k) {

  else { S.cart.push(k); sfx.add(); say(k === 'chest' ? '*jingle jingle* The Treasure Chest! My very best treasure!' : k === 'huntkit' ? 'The Treasure Hunt Kit! Now YOU get to hide the treasure, Ben!' : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {
  const p = P(k), box = $('revIn'); box.innerHTML = '';

}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));

    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));

    line.appendChild(el('div', 'nm', P(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '')));
    line.appendChild(el('div', 'pr', '🪙 ' + priceOf(k)));

  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? '*jingle* Gift wrap! I will add golden wrapping paper to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 🪙 ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (tot > S.bucks) { sfx.glitch(); say('Not enough Gold Coins! Tap Get more! *jingle*'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.bucks -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreBucks() {
  S.bucks += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['*jingle* Here are 500 more Gold Coins from my vault!', 'Ka-ching! 500 Gold Coins! Pretend gold is the best!', 'I opened the vault! 500 Gold Coins for Ben!']));
}
// 🚚 delivery animation
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.vroom(); say('Placing your order... *jingle jingle*'); requestAnimationFrame(shipLoop); }
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#071226'); g.addColorStop(1, '#16386e'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 30; i++) circ((i * 173 + shipT * (i % 3 + 1) * 0.5) % 960, (i * 97) % 300, 2 + i % 3, 'rgba(255,255,255,.6)');
    ctx.fillStyle = '#37474f'; ctx.fillRect(0, 420, 960, 120); for (let i = 0; i < 12; i++) { ctx.fillStyle = '#ffd740'; ctx.fillRect(((i * 120 - shipT * 14) % 1440 + 1440) % 1440 - 120, 474, 70, 10); }
    const done = shipT > 150, tx = done ? 330 : -380 + Math.min(1, shipT / 140) * 710 + (shipT < 140 ? Math.sin(shipT * 0.5) * 3 : 0), ty = 330;
    if (!done) for (let i = 0; i < 5; i++) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(tx - 60 - i * 40, ty + 20 + i * 12, 40, 5); }
    // the truck
    rr(tx, ty, 220, 110, 14, '#546e7a', '#050b1a', 4); rr(tx + 220, ty + 30, 90, 80, 16, '#1a4f9c', '#050b1a', 4); vaultDoorArt(tx + 175, ty + 58, 34);
    rr(tx + 240, ty + 42, 52, 38, 8, '#b2ebf2'); LRat(tx + 266, ty + 84, 44, { line: '#050b1a', noChains: true });
    txt('VAULT', tx + 70, ty + 40, 30, GOLD); txt('EXPRESS', tx + 70, ty + 76, 22, '#fff');
    for (const wx of [tx + 55, tx + 250]) { circ(wx, ty + 112, 26, '#212121'); circ(wx, ty + 112, 11, '#bdbdbd'); }
    for (let i = 0; i < Math.min(shipCount, 6); i++) { const bx = tx + 20 + i * 32, by = ty - 32; rr(bx, by, 30, 30, 3, '#d7a86e', '#6d4c41', 2); ctx.fillStyle = '#6d4c41'; ctx.fillRect(bx + 12, by, 6, 30); }
    if (!done) { txt('Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 110, 54, '#fff'); rr(280, 160, 400, 26, 13, 'rgba(255,255,255,.3)'); rr(280, 160, Math.max(26, 400 * Math.min(1, shipT / 150)), 26, 13, GOLD); }
    else {

      txt('ORDER CONFIRMED! 📦', 480, 105, 66, '#050b1a'); txt('ORDER CONFIRMED! 📦', 480, 100, 66, GOLD);

    }

  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;

// 🖨️ print preview: nothing prints until Ben taps PRINT
function openPrint(list) {
  closePrint(true);

  for (const o of list) { const p = P(o.k); if (!p) continue; if (o.gift) fns.push(() => pageGift(p.name)); p.pages.forEach(f => fns.push(f)); }

function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {

$('tShop').onclick = () => { sfx.click(); show('shop'); };

$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();

setTimeout(() => { $('bubble').textContent = S.orders.length ? '*jingle* Welcome back, Ben! Your orders are in MY ORDERS.' : '*jingle jingle* Welcome to my Treasure Vault, Ben! The vault is OPEN for you!'; }, 50);
