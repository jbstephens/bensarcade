<!DOCTYPE html>
<html lang="en">
<head>

<title>The Robo Store: Home of the Robo Playsets</title>
<script src="touchpad.js?v=10"></script>
<style>

  @keyframes swapIn { 0% { transform: translateY(70px) scale(.6); } 70% { transform: translateY(-8px) scale(1.05); } 100% { transform: none; } }

  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #1a237e; } #printBox .pbInk { background: #263238; font-size: 20px; } #printBox .pbInk.off { background: #c2185b; }

  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  #printBox .pbPage svg { display: block; width: 100%; height: auto; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; break-inside: avoid; }
    #printBox .pbPage svg { width: 100%; height: 9.9in; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

<script>

function paradeLoop() {

  parT = Math.max(parT + (window.__shipStep || 0), Math.floor((performance.now() - parStart) / 16.7));
  const W = window.innerWidth, kids = $('paradeRow').children;
  for (let i = 0; i < kids.length; i++) {
    const x = W + 20 - parT * PAR_SPEED + i * PAR_GAP, hop = Math.abs(Math.sin((parT + i * 9) * .16)) * 18;
    kids[i].style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(-hop) + 'px)';
    if (x < W / 2 - 75 && i > parSaid) { parSaid = i; const r = ROBOS[i]; $('psay').textContent = r.name + ': "' + MASCOTS[r.id][3] + '"'; sfx.march(i); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.name + '!'); u.pitch = Math.min(2, MASCOTS[r.id][0]); u.rate = MASCOTS[r.id][1]; speechSynthesis.speak(u); } } catch (_) {} }
  }
  const last = W + 20 - parT * PAR_SPEED + (kids.length - 1) * PAR_GAP;
  if (last < -200) { $('psay').textContent = 'That is EVERY Robo! Tap OK to go shopping.'; parT = -1; return; }
  requestAnimationFrame(paradeLoop);
}
function closeParade() { parT = -1; $('paradeBox').style.display = 'none'; sfx.click(); showMascot(MI); }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  const parade = $('paradeBox').style.display === 'flex';
  if (e.key === 'Escape') { if (printBox) closePrint(); else if (parade) closeParade(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (parade) closeParade(); else if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && !parade && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreCoins').onclick = moreCoins;
$('parade').onclick = openParade;
$('paradeOk').onclick = closeParade;
$('ink').onclick = toggleInk;
$('mascot').onclick = () => { sfx.click(); say(pick(MASCOTS[curM().id].slice(2))); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || !inCat(PR(DEAL), CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
showMascot(Math.floor(Math.random() * ROBOS.length), true);
render(); rotate();
setTimeout(() => { $('bubble').textContent = S.orders.length ? MASCOTS[curM().id][2] + ' Your orders are in MY ORDERS.' : MASCOTS[curM().id][2]; }, 50);
</script>
