const ctx = C.getContext('2d');

const LAMP_MAX = 100, LAMP_REFILL = 1.4, FLASH_R = 300;

// ---------- Saves, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book

function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('creepyCave') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  if (!Array.isArray(save.gems)) save.gems = [0, 0, 0, 0, 0, 0];
}

loadSave();
const easy = () => !!save.easy;                         // 😊 "Not so spooky" mode

// ---------- Sound effects (soft and spooky-fun) ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function whoosh(start, dur, f0, f1, vol) {             // filtered noise swoosh (bats, falling things)
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime + start, s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = 'bandpass'; fl.Q.value = 2; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.4); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  jump:   () => note(400, 0, 0.15, 'sine', 0.15, 900),
  djump:  () => { note(600, 0, 0.12, 'sine', 0.14, 1300); note(900, 0.05, 0.1, 'triangle', 0.06); },
  hover:  () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  gem:    () => { note(1319, 0, 0.08, 'sine', 0.12); note(1760, 0.06, 0.18, 'sine', 0.1); note(2637, 0.1, 0.2, 'triangle', 0.04); },
  boing:  () => { note(220, 0, 0.3, 'sine', 0.16, 700); note(440, 0.02, 0.2, 'triangle', 0.05, 1000); },
  stomp:  () => { note(500, 0, 0.12, 'triangle', 0.16, 160); note(900, 0.05, 0.1, 'sine', 0.06, 1400); },
  ouch:   () => { note(520, 0, 0.25, 'triangle', 0.12, 260); note(390, 0.12, 0.25, 'triangle', 0.08, 200); },
  check:  () => [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.07, 0.3, 'sine', 0.09)),
  flash:  () => { note(400, 0, 0.35, 'sine', 0.12, 2400); note(2400, 0.08, 0.35, 'triangle', 0.05, 1200); whoosh(0, 0.35, 800, 5000, 0.08); },
  noflash: () => note(300, 0, 0.08, 'square', 0.04),
  ready:  () => { note(1319, 0, 0.06, 'sine', 0.05); note(1760, 0.06, 0.1, 'sine', 0.05); },
  reveal: () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.05, 0.25, 'triangle', 0.07)),
  dizzy:  () => [1200, 1000, 1200, 1000].forEach((f, i) => note(f, i * 0.06, 0.08, 'sine', 0.05)),
  squeak: () => { note(1800, 0, 0.07, 'sine', 0.05, 2400); note(2000, 0.09, 0.07, 'sine', 0.04, 2600); },   // a bat waking up
  swoop:  () => whoosh(0, 0.5, 400, 1800, 0.12),
  creak:  () => { note(110, 0, 0.5, 'sawtooth', 0.035, 85); note(160, 0.15, 0.4, 'sawtooth', 0.025, 120); },  // a stalactite wiggles
  crash:  () => { [2637, 3136, 2349, 3520].forEach((f, i) => note(f, i * 0.03, 0.2, 'triangle', 0.05)); whoosh(0, 0.25, 3000, 800, 0.1); },
  spider: () => { note(700, 0, 0.18, 'sine', 0.07, 300); },
  zipup:  () => note(300, 0, 0.3, 'sine', 0.07, 1200),
  splash: () => { whoosh(0, 0.4, 1500, 400, 0.15); note(300, 0, 0.25, 'sine', 0.1, 80); },
  bubble: () => note(500 + Math.random() * 400, 0, 0.08, 'sine', 0.05, 1200),
  fish:   () => { whoosh(0, 0.3, 600, 2400, 0.08); note(800, 0, 0.12, 'sine', 0.05, 1600); },
  boo:    () => { note(330, 0, 0.5, 'sine', 0.06, 247); note(440, 0, 0.5, 'triangle', 0.025, 330); },          // a SOFT little "boooo"
  shimmer: () => [2093, 2637, 3136].forEach((f, i) => note(f, i * 0.08, 0.3, 'sine', 0.025)),
  giggle: () => [988, 1175, 988, 1319].forEach((f, i) => note(f, i * 0.08, 0.08, 'sine', 0.06)),
  splat:  () => { note(250, 0, 0.2, 'sine', 0.12, 120); whoosh(0, 0.2, 1200, 300, 0.08); },
  bell:   () => { note(392, 0, 1.2, 'sine', 0.08); note(784, 0, 0.8, 'sine', 0.03); note(1175, 0, 0.5, 'sine', 0.015); },
  caught: () => [523, 440, 349, 262].forEach((f, i) => note(f, i * 0.12, 0.2, 'triangle', 0.1)),
  clear:  () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.1, 0.22, 'square', 0.07)),
  click:  () => note(700, 0, 0.06, 'square', 0.05),
  tell:   () => { note(880, 0, 0.08, 'triangle', 0.07); note(880, 0.12, 0.08, 'triangle', 0.07); },
  web:    () => { note(900, 0, 0.15, 'sine', 0.06, 300); whoosh(0, 0.2, 2000, 600, 0.05); },
  bossHit: () => { note(300, 0, 0.3, 'square', 0.1, 70); note(900, 0, 0.1, 'sine', 0.1); note(1200, 0.12, 0.3, 'sine', 0.06, 500); },
  tiara:  () => [784, 988, 1175, 1568, 1976, 2349, 3136].forEach((f, i) => note(f, i * 0.07, 0.35, 'sine', 0.09)),
  drip:   () => note(1200 + Math.random() * 600, 0, 0.12, 'sine', 0.03, 2400),
  hoot:   () => { note(392, 0, 0.3, 'sine', 0.025, 370); note(330, 0.4, 0.5, 'sine', 0.025, 311); },
};

// ---------- MUSIC ENGINE ----------
// 5 tracks: LEAD (music box / spooky theremin / synth, with vibrato + echo), HARMONY, CHORD PADS (choir, strings, organ),
// BASS and DRUMS (+ a cave DRIP "plip" drum). Songs are written in scale degrees (minor keys!), so the harmony follows the tune
// and the last chorus KEY CHANGES up. Form: intro, verse, chorus, verse, chorus, bridge, chorus, key change chorus, tag.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  delayIn = actx.createGain(); delayIn.gain.value = 0.3;                         // a big cave ECHO on the lead
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.36;
  const fb = actx.createGain(); fb.gain.value = 0.38;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) nextT = 0;
}
function envGain(t, a, peak, sus, dur, rel, out) {    // 0 -> peak -> sustain -> 0, no clicks
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
let lastTheremin = 0;
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.3;
  let g;
  if (kind === 'box' || kind === 'bell') {             // 🎶 MUSIC BOX: a plinky metal comb that rings and fades
    g = envGain(t, 0.003, vol * 1.1, 0.2, Math.min(dur, 0.5), 0.35, out);
    const parts = kind === 'box' ? [[1, 1], [3, 0.16], [5.03, 0.07], [8.1, 0.03]] : [[1, 1], [2.01, 0.25], [4.02, 0.12]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else if (kind === 'theremin') {                     // 👻 THEREMIN: a wobbly "oooo-eeee" that slides between notes
    g = envGain(t, 0.06, vol * 1.15, 0.9, dur, 0.18, out);
    const from = lastTheremin && Math.abs(lastTheremin - f) < f ? lastTheremin : f;
    const o1 = osc('sine', from, t, end), o2 = osc('triangle', from, t, end, 4);
    for (const o of [o1, o2]) o.frequency.exponentialRampToValueAtTime(f, t + 0.07);
    const mix = actx.createGain(); mix.gain.value = 0.55; o1.connect(mix); o2.connect(mix); mix.connect(g);
    const lfo = osc('sine', 6.2, t, end), lg = actx.createGain();
    lg.gain.setValueAtTime(f * 0.004, t); lg.gain.linearRampToValueAtTime(f * 0.016, t + Math.max(0.1, dur));
    lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    lastTheremin = f;
  } else {
    g = envGain(t, kind === 'glass' ? 0.03 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const lp = lowpass({ saw: 2800, square: 2400, glass: 3500, reed: 1900 }[kind] || 2600, 1.5, t); lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = 0.5; o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
      const g3 = actx.createGain(); g3.gain.value = 0.15; osc('sine', f * 3, t, end).connect(g3); g3.connect(g);
    } else if (kind === 'choir') {                     // spooky "oooh" choir
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[400, 6, 1], [800, 7, 0.5], [2600, 8, 0.15]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.4; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.6, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(1200, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, kind === 'pizz' ? 0.2 : 0.7, dur, 0.06, out);
  const lp = lowpass(1500, 5, t); lp.frequency.setTargetAtTime(kind === 'pizz' ? 200 : 260, t + 0.01, kind === 'pizz' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2400, 1, t); lp.frequency.setTargetAtTime(800, t, 0.08); lp.connect(g); osc('triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
function tone(type, f0, f1, t, vol, decay, out) {
  const o = osc(type, f0, t, t + decay + 0.05); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + decay * 0.6);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  o.connect(g); g.connect(out);
}
function drumHit(kind, t, vol, out) {
  if (kind === 'k') tone('sine', 150, 42, t, vol, 0.32, out);
  else if (kind === 's') { noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out); tone('triangle', 190, 0, t, vol * 0.5, 0.09, out); }
  else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);
  else if (kind === 'r') tone('sine', 2400, 0, t, vol, 0.04, out);                   // rim click
  else if (kind === 't') tone('sine', 140, 75, t, vol, 0.28, out);                   // tom
  else if (kind === 'd') tone('sine', 700, 1600, t, vol, 0.09, out);                 // 💧 cave DRIP: "plip!"
  else if (kind === 'b') { tone('triangle', 1250, 1000, t, vol, 0.05, out); noiseHit(t, 'bandpass', 1800, 6, vol * 0.4, 0.02, out); }   // 🦴 wood block "tok"
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar): degree number, M = make it major (the spooky "E major" in A minor!), m = minor, 7 = add the 7th.
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10] };
const degS = (sc, k) => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
function parseMel(str, sc) {
  return str.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean).map(tk => {
    if (tk === '.') return null;
    if (tk === '-') return 'h';
    const m = tk.match(/^([b#]?)([1-7])([',]*)$/);
    if (!m) return null;
    const acc = m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0, d = +m[2];
    const oct = (m[3].match(/'/g) || []).length - (m[3].match(/,/g) || []).length;
    let hd = d - 2, ho = oct; if (hd < 1) { hd += 7; ho--; }            // harmony: a third below, inside the scale
    return { s: sc[d - 1] + acc + 12 * oct, hs: sc[hd - 1] + 12 * ho };
  });
}
function melEvents(arr) {
  const ev = new Array(arr.length).fill(null);
  for (let i = 0; i < arr.length; i++) if (arr[i] && arr[i] !== 'h') { let n = 1; while (arr[i + n] === 'h') n++; ev[i] = Object.assign({ len: n }, arr[i]); }
  return ev;
}
function parseChord(tk, sc) {
  const r = +tk[0], q = tk.slice(1), root = sc[r - 1];
  let third = root + ((degS(sc, r + 2) - sc[r - 1]) % 12 + 12) % 12;
  if (q.includes('M')) third = root + 4;
  if (q.includes('m')) third = root + 3;
  const ch = [root, third, root + 7];
  if (q.includes('7')) ch.push(root + ((degS(sc, r + 6) - sc[r - 1]) % 12 + 12) % 12);
  return ch;
}
// ---- beat styles. 16 steps per bar (12 for a waltz). Bass: R root, O octave, 5 fifth, - hold. Arp: chord tone 0-3.
const STYLES = {
  spookwaltz: {                                        // 🎠 the title: a creepy-cute music-box waltz with drips and wood blocks
    I: { k: 'x...........', d: '......x.....', bass: 'R-----------', arp: '0...1...2...' },
    V: { k: 'x...........', b: '....x...x...', d: '..........x.', bass: 'R-..5-..5-..', arp: '0.1.2.3.2.1.' },
    C: { k: 'x.....x.....', s: '....x...x...', h: 'x.x.x.x.x.x.', b: '..x.......x.', bass: 'R-..O-..5-..', arp: '012321012321' },

      const nx = c.x + c.dir * 0.45, ac = Math.floor((nx + c.dir * 14) / T), r = Math.floor((c.y - 5) / T);
      if (solidAt(ac, r) || !(solidAt(ac, r + 1) || '=WMH'.includes(tileAt(ac, r + 1)) && tileAt(ac, r + 1) !== '.')) c.dir *= -1; else c.x = nx;
      if (c.hi > 0) c.hi--;
      if (hit(pbox(), { x: c.x - 16, y: c.y - 14, w: 32, h: 14 }) && !c.said) { c.said = 1; popText(c.x, c.y - 30, 'hi Robo! ✨', '#b9f6ca'); sfx.giggle(); }
    } else if (c.kind === 'fish') {

      else if (c.st === 'bubbles') {
        if (c.t % 8 === 0) { parts.push({ x: c.x0 + (Math.random() - 0.5) * 20, y: surf + 4, vx: 0, vy: -1.2, life: 26, c: '#b3e5fc', s: 4, ring: 1 }); if (c.t % 16 === 0) sfx.bubble(); }
        if (c.t > (easy() ? 85 : 58)) { c.st = 'leap'; c.x = c.x0; c.y = surf; c.vx = (px > c.x0 ? 1 : -1) * 1.4; c.vy = -11.5; sfx.fish(); }
      } else if (c.st === 'leap') {
        c.vy += 0.35 * slow; c.x += c.vx * slow; c.y += c.vy * slow;
        if (c.y > surf && c.vy > 0) { c.st = 'wait'; c.y = surf + 8; c.x = c.x0; c.wait = 110 + ((c.t * 13) % 120); burst(c.x, surf, ['#7df9ff', '#fff'], 8, 3); sfx.bubble(); }
        else stompOrHurt(c, { x: c.x - 15, y: c.y - 12, w: 30, h: 24 }, () => { c.stun = 200; c.vy = Math.max(c.vy, 2); });
      }
    } else if (c.kind === 'boo') {                      // 👻 a soft little "boo!" (with a shimmer first)
      const d = Math.hypot(c.x - px, c.y - py);
      if (c.st === 'hide') { if (d < 170) { c.st = 'shimmer'; c.t = 0; sfx.shimmer(); } }
      else if (c.st === 'shimmer') { if (c.t > (easy() ? 55 : 40)) { c.st = 'boo'; c.t = 0; sfx.boo(); popText(c.x, c.y - 40, easy() ? 'hi hi!' : 'boo!', '#e1bee7'); } }
      else if (c.st === 'boo') { if (hit(pbox(), { x: c.x - 20, y: c.y - 20, w: 40, h: 40 })) booGiggle(c); }
      else if (c.st === 'giggle') { c.y -= 0.8; if (c.t > 70) c.st = 'gone'; }
    }
  }
}

// ---------- Gems, checkpoints, tips, the exit ----------
function updateWorld() {
  const pb = pbox(), px = player.x + 15, py = player.y + 20;
  for (const m of rafts) { m.ddx = m.dx; m.x += m.dx; if (m.x > m.xmax || m.x < m.xmin) { m.dx = -m.dx; m.x = Math.max(m.xmin, Math.min(m.xmax, m.x)); } }
  for (const gm of gemList) if (!gm.got && Math.abs(gm.x - px) < 26 && Math.abs(gm.y - py) < 30) {
    gm.got = true; gemCount++; sfx.gem(); burst(gm.x, gm.y, ['#7df9ff', '#ea80fc', '#fff'], 10, 3);
  }
  for (const cp of cps) if (!cp.on && Math.abs(cp.x - px) < 30 && Math.abs(cp.y - 20 - py) < 50) {
    for (const o of cps) o.on = false;
    cp.on = true; checkpoint = cp; sfx.check(); popText(cp.x, cp.y - 80, 'Checkpoint! ✨', '#ffe082'); burst(cp.x, cp.y - 40, ['#ffe082', '#fff'], 14, 4);
    if (hp < maxHp()) hp++;
  }
  tipShow = null;
  for (const tp of tips) if (Math.abs(tp.x - px) < 160) tipShow = LEVELS[lvl].tips[tp.i];
  for (const d of decos) if (d.kind === 'u') {           // 🔔 bump an old bell: DONNNG
    if (d.ring > 0) d.ring--;
    if (!d.ring && Math.abs(d.x - px) < 26 && py < d.y + 90 && py > d.y + 10) { d.ring = 90; sfx.bell(); popText(d.x, d.y + 100, 'DONNNG!', '#ffe082'); }
  }
  if (tiaraItem && !tiaraItem.got && Math.abs(tiaraItem.x - px) < 34 && Math.abs(tiaraItem.y - py) < 44) {
    tiaraItem.got = true; save.tiara = 1; writeSave(); sfx.tiara(); burst(tiaraItem.x, tiaraItem.y, ['#ffd740', '#ff80ff', '#7df9ff', '#fff'], 24, 5);
    say('tiara');
  }
  if (exitDoor && hit(pb, exitDoor)) levelClear();
  for (const p of parts) { p.x += p.vx; p.y += p.vy; if (!p.ring) p.vy += 0.15; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const p of pops) { p.t--; p.y -= 0.6; }
  pops = pops.filter(p => p.t > 0);
  if (--ambT <= 0) {                                      // 🦉 little cave sounds now and then (drips, creaks, a far-off owl)
    ambT = 260 + Math.floor(Math.random() * 300);
    const r = Math.random(); if (r < 0.45) sfx.drip(); else if (r < 0.7) sfx.hoot(); else if (r < 0.85) whoosh(0, 0.8, 300, 900, 0.03); else note(95, 0, 0.6, 'sawtooth', 0.02, 80);
  }
  if (frame % 9 === 0) {                                  // drips falling from the ceiling
    const c = Math.floor((camX + Math.random() * W) / T);
    let r = 0; while (r < ROWS - 1 && solidAt(c, r)) r++;
    if (r > 0 && r < 8) parts.push({ x: c * T + 20, y: r * T, vx: 0, vy: 2, life: 60, c: LEVELS[lvl].moss, s: 3, drip: 1 });
  }
}
function levelClear() {
  if (state !== 'play') return;
  state = 'clear'; stateT = 0; sfx.clear();
  save.gems[lvl] = Math.max(save.gems[lvl] || 0, gemCount);
  save.unlocked = Math.max(save.unlocked, Math.min(5, lvl + 1));
  if (lvl === 4) save.tiara = 1;                        // (Robo always brings the tiara along)

}

// ---------- 👑 THE SPIDER QUEEN ----------
const FLOOR_Y = 11 * T, Q_R = 48;
function makeBoss() { boss = { x: 480, y: -90, hp: 3, phase: 1, st: 'enter', t: 0, n: 0, tx: 480, leg: 0, said: 0, ang: 0 }; }
function qSay(s) { popText(boss.x, boss.y - 90, s, '#f8bbd0'); }
function qGo(st) { boss.st = st; boss.t = 0; }
function updateBoss() {
  const b = boss, px = player.x + 15, py = player.y + 20, slow = easy() ? 0.75 : 1;
  b.t++; b.leg += 0.15;
  const dangerous = ['move', 'tell', 'shoot', 'drop', 'swing', 'swingprep'].includes(b.st);
  if (b.st === 'enter') { b.y += (150 - b.y) * 0.04; if (b.t === 30) qSay('WHO is in my lair?!'); if (b.t > 100) qGo('move'); }
  else if (b.st === 'move') {
    if (b.t === 1) b.tx = Math.max(170, Math.min(790, px + (Math.random() - 0.5) * 260));
    b.x += (b.tx - b.x) * 0.035; b.y += (150 + Math.sin(b.t * 0.05) * 14 - b.y) * 0.1;
    if (b.t > 75) { qGo(b.phase === 3 ? 'swingprep' : 'tell'); sfx.tell(); }
  } else if (b.st === 'tell') {
    if (b.t > (easy() ? 85 : 55)) { qGo(b.phase === 1 ? 'shoot' : 'drop'); }
  } else if (b.st === 'shoot') {                           // 🕸️ phase 1: web balls
    if (b.t === 1 || b.t === 16 || b.t === 31) {
      const a = Math.atan2(py - b.y, px - b.x) + (b.t === 16 ? 0 : b.t === 1 ? -0.22 : 0.22), sp = easy() ? 3.4 : 4.4;
      shots.push({ x: b.x, y: b.y + 30, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 300 }); sfx.web();
      if (b.t === 1 && b.n === 0) qSay('Web-tastic!');
    }
    if (b.t > 70) { b.n++; qGo(b.n >= 3 ? 'oops' : 'move'); }
  } else if (b.st === 'drop') {                            // 🕷️ phase 2: baby spiders!
    if (b.t === 1) {
      if (b.n === 0) qSay('Go, my little sweeties!');
      const room = 4 - babies.filter(k => k.st !== 'home').length;
      for (let i = 0; i < Math.min(2, room); i++) babies.push({ x: b.x + (i ? 30 : -30), y: b.y + 30, vy: 0, dir: i ? 1 : -1, st: 'fall', stun: 0, t: 0, hop: 0, hue: (b.n * 2 + i) % 4 });
      sfx.spider();
    }
    if (b.t > 80) { b.n++; qGo(b.n >= 3 ? 'oops' : 'move'); }
  } else if (b.st === 'swingprep') {                       // 🎢 phase 3: she climbs to the corner... then WHEEE!
    const L = 360, A = 1.05, side = b.n % 2 ? 1 : -1, sx = 480 + Math.sin(A * side) * L, sy = 30 + Math.cos(A * side) * L;
    b.x += (sx - b.x) * 0.06; b.y += (sy - b.y) * 0.06;
    if (b.t > (easy() ? 110 : 80)) { qGo('swing'); b.side = side; qSay('Wheeeee!'); sfx.swoop(); }
  } else if (b.st === 'swing') {
    const L = 360, A = 1.05, dur = easy() ? 130 : 95, k = Math.min(1, b.t / dur);
    b.ang = -b.side * A * Math.cos(Math.PI * k);
    b.x = 480 + Math.sin(b.ang) * L; b.y = 30 + Math.cos(b.ang) * L;
    if (k >= 1) { b.n++; if (b.n >= 3) qGo('oops'); else { qGo('swingprep'); b.t = (easy() ? 110 : 80) - 30; } }
  } else if (b.st === 'oops') {                            // 😵 tangled up in her OWN web... and down she goes!
    if (b.t === 1) { qSay('Oopsie! I\'m all tangled!'); sfx.web(); babies.forEach(k => { if (k.st !== 'home') { k.st = 'home'; } }); shots = []; }
    b.x = Math.max(140, Math.min(820, b.x)); b.y = Math.min(FLOOR_Y - Q_R + 6, b.y + 6);
    if (b.t > 40) qGo('stuck');
  } else if (b.st === 'stuck') {
    if (b.t % 120 === 60) popText(b.x, b.y - 80, 'Bounce on my head? NO!', '#f8bbd0');
    const p = player;
    if (p.vy > 0 && Math.abs(px - b.x) < 52 && p.y + p.h >= b.y - Q_R - 18 && p.y + p.h - p.vy <= b.y - Q_R + 14) {
      p.vy = -12; p.jumps = 1; p.fuel = 90; b.hp--; sfx.bossHit(); shake = 14;
      burst(b.x, b.y - Q_R, ['#fff', '#ffd740', '#ea80fc'], 20, 5);
      qSay(['Okay, okay! I give up!', 'Hey! These shoes are NEW!', 'Ow! My sparkly shoes!'][b.hp] || 'Ow!');
      popText(b.x, b.y - 120, 'BONK!', '#ffd740');
      qGo('hurt');
    } else if (b.t > (easy() ? 560 : 400)) { qSay('Hmph! I wiggled free!'); qGo('climb'); b.n = 0; }
  } else if (b.st === 'hurt') {
    if (b.t > 80) {
      if (b.hp <= 0) { qGo('happy'); trophy('creepyCave'); sticker('spider-queen'); save.beat = 1; writeSave(); say('ending', () => { state = 'win'; stateT = 0; setSong('win'); }); }
      else { b.phase++; b.n = 0; qGo('climb'); }
    }
  } else if (b.st === 'climb') { b.y += (150 - b.y) * 0.05; b.x += (480 - b.x) * 0.03; if (b.t > 80) qGo('move'); }
  if (dangerous && Math.hypot(px - b.x, py - b.y) < Q_R + 14) hurt(b.x);
  // web balls
  for (const s of shots) {
    s.x += s.vx * slow; s.y += s.vy * slow; s.life--;
    if (hit(pbox(), { x: s.x - 10, y: s.y - 10, w: 20, h: 20 })) { s.life = 0; hurt(s.x); sfx.splat(); }
    if (s.y > FLOOR_Y - 8 || s.x < 40 || s.x > W - 40) { s.life = 0; sfx.splat(); burst(s.x, s.y, ['#fff', '#e1bee7'], 6, 2); }
  }
  shots = shots.filter(s => s.life > 0);
  // baby spiders: tiny, cute, and a little bit naughty
  for (const k of babies) {
    k.t++; if (k.stun > 0) k.stun--;
    if (k.st === 'fall') { k.vy = Math.min(8, k.vy + 0.4); k.y += k.vy; if (k.y >= FLOOR_Y - 12) { k.y = FLOOR_Y - 12; k.st = 'walk'; } }
    else if (k.st === 'walk') {
      if (!k.stun) {
        k.dir = px > k.x ? 1 : -1; k.x += k.dir * (easy() ? 0.7 : 1.05);
        if (k.hop > 0) { k.hop += 0.12; if (k.hop > Math.PI) k.hop = 0; } else if (k.t % 90 === 45) k.hop = 0.01;
      }
      const bx = { x: k.x - 12, y: k.y - 12 - Math.sin(k.hop) * 20, w: 24, h: 22 };
      stompOrHurt(k, bx, () => { k.st = 'home'; k.dir = k.x < 480 ? -1 : 1; popText(k.x, k.y - 30, 'eep! 💜', '#e1bee7'); });
    } else if (k.st === 'home') { k.x += k.dir * 4; if (k.st === 'home' && k.y < FLOOR_Y - 12) k.y += 4; }
  }
  babies = babies.filter(k => k.x > -40 && k.x < W + 40);
}

let talkSeen = {};

// ---------- Starting levels ----------
function startLevel(i) {

}
function afterIntro() {

// ---------- The big update ----------
const TITLE_PLAY = { x: 360, y: 300, w: 240, h: 64 };
const TITLE_L = { x: 250, y: 384, w: 60, h: 50 }, TITLE_R = { x: 650, y: 384, w: 60, h: 50 };
const TITLE_EASY = { x: 300, y: 448, w: 360, h: 46 };
function anyGo() { return press.jump || press.enter || press.x || tap; }
function update() {
  frame++; stateT++;
  if (stickerNew > 0) stickerNew--;
  if (shake > 0) shake--;
  if (flashT > 0) flashT--;
  if (inBox(tap, MUSIC_BTN)) { toggleMusic(); tap = null; }
  if (state === 'title') {
    setSong('title');
    if (press.esc || inBox(tap, BACK_BTN)) { goBack(); tap = null; }
    if (press.l || inBox(tap, TITLE_L)) { pick = (pick + save.unlocked) % (save.unlocked + 1); sfx.click(); }
    if (press.r || inBox(tap, TITLE_R)) { pick = (pick + 1) % (save.unlocked + 1); sfx.click(); }
    if (press.u || press.d || inBox(tap, TITLE_EASY)) { save.easy = !save.easy; writeSave(); sfx.click(); }
    if (press.jump || press.enter || press.x || inBox(tap, TITLE_PLAY)) { sfx.check(); startLevel(pick); }
  } else if (state === 'intro') {
    if (stateT > 130 || (stateT > 20 && anyGo())) afterIntro();
  } else if (state === 'talk') {
    talk.t++;
    if (talk.t > 12 && anyGo()) {
      talk.i++; talk.t = 0; sfx.click();
      if (talk.i >= talk.lines.length) { const a = talk.after; talk = null; a(); }
    }
  } else if (state === 'play') {
    if (press.esc || inBox(tap, BACK_BTN)) { tap = null; state = 'title'; pick = Math.min(save.unlocked, lvl); clearPress(); return; }
    if (lamp < LAMP_MAX) { lamp = Math.min(LAMP_MAX, lamp + LAMP_REFILL * (easy() ? 1.5 : 1)); if (lamp >= LAMP_MAX) sfx.ready(); }
    updateWorld();
    if (state === 'play') updatePlayer();
    if (state === 'play') updateCrits();
    if (boss && state === 'play') updateBoss();
    updateCamera(false);
  } else if (state === 'caught') {
    for (const p of pops) p.t--;
    if (stateT > 110 || (stateT > 40 && anyGo())) {
      hp = maxHp(); respawn(); player.inv = 90; state = 'play';
      if (boss) { shots = []; babies = []; if (boss.st !== 'happy' && boss.st !== 'hurt') { qGo('climb'); boss.n = 0; } }
    }
  } else if (state === 'clear') {
    if (stateT > 170 || (stateT > 50 && anyGo())) startLevel(lvl + 1);
  } else if (state === 'win') {
    if (frame % 20 === 0) burst(80 + Math.random() * 800, 60 + Math.random() * 200, ['#ff80ab', '#7df9ff', '#ffd740', '#b9f6ca', '#ea80fc'], 10, 4);
    for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.life--; }
    parts = parts.filter(p => p.life > 0);
    if (stateT > 90 && anyGo()) { state = 'title'; pick = 5; parts = []; }
  }

}
function clearPress() { for (const k in press) press[k] = false; tap = null; }

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.65)'; ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function line(x1, y1, x2, y2, col, w = 2) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function bang(x, y) {                                   // the "!" warning bubble
  const s = 1 + Math.sin(frame * 0.4) * 0.12;
  circle(x, y, 15 * s, '#ffeb3b'); text('!', x, y + 9, 24, '#d50000');
}
function sparkle(x, y, r, col) {
  ctx.fillStyle = col; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.25, y - r * 0.25); ctx.lineTo(x + r, y); ctx.lineTo(x + r * 0.25, y + r * 0.25);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.25, y + r * 0.25); ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.25, y - r * 0.25); ctx.fill();
}
function gemShape(x, y, s, col) {
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x, y - 12 * s); ctx.lineTo(x + 10 * s, y - 3 * s); ctx.lineTo(x, y + 12 * s); ctx.lineTo(x - 10 * s, y - 3 * s); ctx.closePath(); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.65)'; ctx.beginPath(); ctx.moveTo(x, y - 12 * s); ctx.lineTo(x + 4 * s, y - 3 * s); ctx.lineTo(x, y + 2 * s); ctx.lineTo(x - 4 * s, y - 3 * s); ctx.fill();
}
const GLOW = ['#ff80ab', '#7cffcb', '#b388ff'];

// ---------- Background + rock ----------
function drawBackground(L) {
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, L.bg[0]); gr.addColorStop(1, L.bg[1]);
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (let layer = 0; layer < 2; layer++) {             // far-away rock pillars + twinkly crystals (parallax)
    const sp = layer ? 0.5 : 0.25, step = layer ? 170 : 230, off = camX * sp;
    ctx.fillStyle = layer ? 'rgba(0,0,0,.22)' : 'rgba(0,0,0,.14)';
    for (let i = Math.floor(off / step) - 1; i < Math.floor(off / step) + W / step + 2; i++) {
      const x = i * step - off, h1 = 120 + ((i * 97 + layer * 31) % 140), h2 = 70 + ((i * 53) % 110);
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + step * 0.5, h2); ctx.lineTo(x + step, 0); ctx.fill();
      ctx.beginPath(); ctx.moveTo(x - 20, H); ctx.lineTo(x + step * 0.45, H - h1); ctx.lineTo(x + step + 20, H); ctx.fill();
      const tw = 0.5 + 0.5 * Math.sin(frame * 0.05 + i * 1.7);
      ctx.globalAlpha = 0.25 + tw * 0.4; sparkle(x + step * 0.3, 60 + ((i * 71) % 300), 3 + layer * 2, GLOW[(i + layer) % 3]); ctx.globalAlpha = 1;
    }
  }
}

  ctx.fillStyle = '#f48fb1'; ctx.beginPath(); ctx.arc(x - 6, y - 46, 6, Math.PI, 0); ctx.arc(x + 6, y - 46, 6, Math.PI, 0); ctx.lineTo(x, y - 30); ctx.closePath(); ctx.fill();

    for (let i = 0; i < 5; i++) line(x - 50 + i * 25, y - 40, x - 40 + i * 20, y + 40, 'rgba(255,255,255,.6)', 1.5);

function drawBossStuff() {

    ctx.fillStyle = '#ff4081'; ctx.beginPath(); ctx.moveTo(k.x, y - 10); ctx.lineTo(k.x - 7, y - 15); ctx.lineTo(k.x - 7, y - 5); ctx.fill(); ctx.beginPath(); ctx.moveTo(k.x, y - 10); ctx.lineTo(k.x + 7, y - 15); ctx.lineTo(k.x + 7, y - 5); ctx.fill();   // a little bow

  // her hearts (3 bonks to go)
  roundRect(W / 2 - 150, 60, 300, 34, 12, 'rgba(0,0,0,.45)');
  text('👑 SPIDER QUEEN', W / 2 - 50, 84, 18, '#f8bbd0');

// ---------- Light and darkness ----------
let lights = [];
function addLight(x, y, r, c) { x -= camX; if (x > -r && x < W + r) lights.push({ x, y, r, c }); }
function gatherLights() {
  lights = [];
  const p = player, px = p.x + 15, py = p.y + 14;

  if (flashT > 0) addLight(px, py, 120 + (26 - flashT) * 14, '255,255,255');
  for (const d of decos) if (d.kind !== 'u') addLight(d.x, d.y - 14, d.kind === 'm' ? 80 : 90, d.kind === 'm' ? ['255,128,171', '124,255,203', '179,136,255'][d.hue] : ['125,249,255', '234,128,252', '179,136,255'][d.hue]);
  for (const gm of gemList) if (!gm.got) addLight(gm.x, gm.y, 36, '125,249,255');
  for (const cp of cps) addLight(cp.x, cp.y - 60, cp.on ? 150 : 90, '255,224,130');
  if (exitDoor) addLight(exitDoor.x + 20, exitDoor.y + 40, 170, '255,213,79');

  if (tiaraItem && !tiaraItem.got) addLight(tiaraItem.x, tiaraItem.y, 90, '255,215,64');
  for (const c of crits) {
    if (c.kind === 'worm') addLight(c.x, c.y - 8, 130 + (c.hi > 0 ? 60 : 0), '178,255,89');
    else if (c.kind === 'fish' && c.st === 'leap') addLight(c.x, c.y, 80, '125,249,255');
    else if (c.kind === 'fish' && c.st === 'bubbles') addLight(c.x0, 11 * T + 12, 50, '125,249,255');
    else if (c.kind === 'boo' && (c.st === 'boo' || c.st === 'giggle')) addLight(c.x, c.y, 70, '225,190,231');
    else if (c.kind === 'spider') addLight(c.x, c.y, 34, '206,147,216');
    else if (c.kind === 'bat' && c.st !== 'sleep') addLight(c.x, c.y, 50, '255,245,157');
    else if (c.kind === 'stal' && c.st !== 'gone') addLight(c.x, c.y + 38, 30, '128,222,234');
  }
  const c0 = Math.max(0, Math.floor(camX / T)), c1 = Math.min(mapW - 1, Math.floor((camX + W) / T) + 1);
  for (let r = 0; r < ROWS; r++) for (let c = c0; c <= c1; c++) {
    const ch = g[r][c];
    if (ch === 'H') addLight(c * T + 20, r * T + 20, 50, '179,136,255');
    else if (ch === 'M') addLight(c * T + 20, r * T + 14, 70, '255,128,171');
    else if (ch === '~' && c % 3 === 0) addLight(c * T + 20, r * T + 20, 70, '64,196,255');
    else if (ch === '=' && lvl === 4) addLight(c * T + 20, r * T + 6, 40, '185,246,202');
  }
  if (boss) {
    addLight(boss.x + camX, boss.y, 170, '234,128,252');
    for (const s of shots) addLight(s.x + camX, s.y, 40, '255,255,255');
    for (const k of babies) addLight(k.x + camX, k.y, 40, '206,147,216');
  }
}
function drawDarkness() {
  const dark = (easy() ? 0.55 : 0.86) * (flashT > 0 ? 1 - flashT / 40 : 1);
  lctx.globalCompositeOperation = 'source-over'; lctx.clearRect(0, 0, W, H);
  lctx.fillStyle = `rgba(6,3,22,${dark.toFixed(3)})`; lctx.fillRect(0, 0, W, H);
  lctx.globalCompositeOperation = 'destination-out';
  for (const L of lights) {
    const gr = lctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r);
    gr.addColorStop(0, 'rgba(0,0,0,1)'); gr.addColorStop(0.45, 'rgba(0,0,0,.75)'); gr.addColorStop(1, 'rgba(0,0,0,0)');
    lctx.fillStyle = gr; lctx.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
  }
  lctx.globalCompositeOperation = 'source-over';
  ctx.drawImage(LC, 0, 0);
  ctx.globalCompositeOperation = 'lighter';               // warm colored glow on top
  for (const L of lights) {
    const gr = ctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.r * 0.8);
    gr.addColorStop(0, `rgba(${L.c},.22)`); gr.addColorStop(1, `rgba(${L.c},0)`);
    ctx.fillStyle = gr; ctx.fillRect(L.x - L.r, L.y - L.r, L.r * 2, L.r * 2);
  }
  ctx.globalCompositeOperation = 'source-over';
  if (flashT > 18) { ctx.fillStyle = `rgba(255,255,240,${((flashT - 18) / 8 * 0.5).toFixed(3)})`; ctx.fillRect(0, 0, W, H); }
}

// ---------- HUD + screens ----------
function drawButtons(backLabel) {
  roundRect(BACK_BTN.x, BACK_BTN.y, BACK_BTN.w, BACK_BTN.h, 12, 'rgba(0,0,0,.5)'); text(backLabel, BACK_BTN.x + BACK_BTN.w / 2, BACK_BTN.y + 29, 18, '#fff');
  roundRect(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.w, MUSIC_BTN.h, 12, 'rgba(0,0,0,.5)'); text(musicOn ? '🎵' : '🔇', MUSIC_BTN.x + 27, MUSIC_BTN.y + 30, 20);
}
function drawHUD() {

  roundRect(LAMP_BTN.x, LAMP_BTN.y, LAMP_BTN.w, LAMP_BTN.h, 12, 'rgba(0,0,0,.5)');
  roundRect(LAMP_BTN.x + 64, LAMP_BTN.y + 12, 98, 16, 8, '#3e2723');
  roundRect(LAMP_BTN.x + 64, LAMP_BTN.y + 12, 98 * lamp / LAMP_MAX, 16, 8, lamp >= LAMP_MAX ? (frame % 30 < 15 ? '#fff59d' : '#ffd740') : '#ff9800');
  text('🔦 X', LAMP_BTN.x + 32, LAMP_BTN.y + 28, 17, '#ffe082');

  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.t / 20); text(p.s, p.x - camX, p.y, 20, p.c); ctx.globalAlpha = 1; }
  if (stickerNew > 0) { roundRect(W / 2 - 170, 110, 340, 44, 14, 'rgba(0,0,0,.6)'); text('🌟 New sticker: Spider Queen! 👑🕷️', W / 2, 140, 20, '#fff59d'); }
}
function drawScene() {
  const L = LEVELS[lvl];
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  drawBackground(L);
  drawTiles(L);
  drawItems();
  for (const m of rafts) {                               // glowing lily-pad rafts
    const x = m.x - camX; ellipse(x + 60, m.y + 8, 64, 12, '#2e7d32'); ellipse(x + 60, m.y + 5, 56, 8, '#66bb6a');
    circle(x + 30, m.y + 4, 4, '#ff80ab'); circle(x + 90, m.y + 6, 3, '#b9f6ca');
  }
  for (const c of crits) {
    if (Math.abs(c.x - camX - W / 2) > W / 2 + 100) continue;
    if (c.kind === 'bat') drawBat(c); else if (c.kind === 'spider') drawSpider(c); else if (c.kind === 'stal') drawStal(c);
    else if (c.kind === 'worm') drawWorm(c); else if (c.kind === 'fish') drawFish(c); else if (c.kind === 'boo') drawBoo(c);
  }
  if (boss) drawBossStuff();
  drawRobo(player, camX);
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20) * (p.hint ? 0.7 : 1); if (p.ring) { ctx.strokeStyle = p.c; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(p.x - camX, p.y, p.s, 0, 7); ctx.stroke(); } else circle(p.x - camX, p.y, p.s * Math.min(1, p.life / 20), p.c); }

}
function drawTitle() {
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#120a26'); gr.addColorStop(1, '#2d1650'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#21123b';                                // cave mouth + stalactites
  for (let i = 0; i < 16; i++) { const x = i * 64; ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 32, 40 + ((i * 37) % 60)); ctx.lineTo(x + 64, 0); ctx.fill(); }
  roundRect(0, 470, W, 60, 0, '#2a1a45');
  for (let i = 0; i < 12; i++) { const x = 40 + i * 80, col = GLOW[i % 3]; roundRect(x - 3, 455, 6, 16, 2, '#fff8e1'); ellipse(x, 455, 12 + (i % 2) * 4, 8, col); }
  for (let i = 0; i < 20; i++) { ctx.globalAlpha = 0.3 + 0.3 * Math.sin(frame * 0.05 + i); sparkle((i * 151) % W, 60 + (i * 89) % 220, 3, GLOW[i % 3]); } ctx.globalAlpha = 1;
  const sy = 120 + Math.sin(frame * 0.03) * 30;            // a little spider dangling hello
  line(820, 0, 820, sy - 10, 'rgba(255,255,255,.7)', 1.5); drawSpiderBody(820, sy, 1.6, '#4a148c', frame * 0.1, { light: '#ab47bc' });
  line(140, 0, 140, 70, 'rgba(255,255,255,.4)', 1); drawBat({ x: 140 + camX, y: 84, st: 'sleep', stun: 0 });
  text('🕷️ Creepy Crawly Cave', W / 2, 120, 56, '#e1bee7');
  text('A spooky-fun headlamp adventure!', W / 2, 168, 22, '#b3e5fc');
  drawRobo({ x: 150, y: 430, w: 30, h: 40, face: 1, squash: 1, inv: 0 }, 0);
  roundRect(TITLE_PLAY.x, TITLE_PLAY.y, TITLE_PLAY.w, TITLE_PLAY.h, 20, frame % 40 < 20 ? '#ab47bc' : '#9c27b0');
  text('▶ PLAY', W / 2, TITLE_PLAY.y + 44, 34, '#fff');
  const L = LEVELS[pick];
  roundRect(TITLE_L.x, TITLE_L.y, TITLE_L.w, TITLE_L.h, 14, 'rgba(255,255,255,.15)'); text('◀', TITLE_L.x + 30, TITLE_L.y + 35, 26);
  roundRect(TITLE_R.x, TITLE_R.y, TITLE_R.w, TITLE_R.h, 14, 'rgba(255,255,255,.15)'); text('▶', TITLE_R.x + 30, TITLE_R.y + 35, 26);
  text(`${L.icon} ${pick + 1}. ${L.name}`, W / 2, TITLE_L.y + 34, 24, '#fff59d');
  roundRect(TITLE_EASY.x, TITLE_EASY.y, TITLE_EASY.w, TITLE_EASY.h, 14, save.easy ? '#43a047' : 'rgba(255,255,255,.15)');

  let tot = 0; for (const n of save.gems) tot += n || 0;

}
function wrapText(str, x, y, maxW, size, color) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  const words = str.split(' '); let lineS = '', yy = y;
  for (const w of words) {
    const test = lineS ? lineS + ' ' + w : w;
    if ((ctx.measureText(test).width || test.length * size * 0.5) > maxW && lineS) { ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(lineS, x, yy); lineS = w; yy += size + 6; }
    else lineS = test;
  }
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.fillText(lineS, x, yy);
}
function drawTalk() {
  const [who, msg] = talk.lines[talk.i];
  roundRect(60, 330, 840, 150, 20, 'rgba(20,10,40,.92)');
  ctx.strokeStyle = who === 'queen' ? '#ea80fc' : who === 'robo' ? '#40c4ff' : '#ffe082'; ctx.lineWidth = 3;
  ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(60, 330, 840, 150, 20); else ctx.rect(60, 330, 840, 150); ctx.stroke();
  circle(130, 405, 52, 'rgba(255,255,255,.08)');
  if (who === 'robo') drawRobo({ x: 112, y: 382, w: 30, h: 40, face: 1, squash: 1, inv: 0 }, 0);
  else if (who === 'queen') { ctx.save(); ctx.translate(130, 418); ctx.scale(0.55, 0.55); drawQueen(0, 0, { noThread: true, web: !(boss && boss.st === 'happy' && talk.i >= 3) }); ctx.restore(); }
  else text('🔦', 130, 422, 46);
  text(who === 'queen' ? 'Spider Queen' : who === 'robo' ? 'Robo' : '', 200, 365, 20, who === 'queen' ? '#ea80fc' : '#40c4ff', 'left');
  wrapText(msg, 200, who === 'nar' ? 380 : 400, 670, 24, '#fff');
  if (talk.t > 12 && frame % 40 < 28) text('JUMP / tap ▶', 880, 468, 15, '#ffe082', 'right');
}
function drawWin() {
  const gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#4a148c'); gr.addColorStop(1, '#ad1457'); ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 14; i++) { const x = 30 + i * 70; ctx.fillStyle = GLOW[i % 3]; ctx.beginPath(); ctx.moveTo(x - 10, 0); ctx.lineTo(x, 40 + (i % 3) * 14); ctx.lineTo(x + 10, 0); ctx.fill(); }   // crystals all lit up
  roundRect(0, 440, W, 80, 0, '#4a2a6e');
  for (let i = 0; i < 6; i++) { line(i * 190 + 30, 0, i * 190 + 80, 90, 'rgba(255,255,255,.5)', 2); line(i * 190 + 130, 0, i * 190 + 80, 90, 'rgba(255,255,255,.5)', 2); }   // party streamers of web
  const bob = Math.abs(Math.sin(frame * 0.08)) * 16;
  boss = boss || { st: 'happy', t: 0, leg: 0, hp: 0 }; boss.st = 'happy'; boss.leg = frame * 0.3;
  drawQueen(480, 360 - bob, { noThread: true });
  for (let i = 0; i < 5; i++) { const x = [200, 330, 640, 770, 880][i], hop = Math.abs(Math.sin(frame * 0.12 + i)) * 24; if (Math.abs(x - 480) > 90) drawSpiderBody(x, 425 - hop, 0.75, ['#8e24aa', '#5e35b1', '#d81b60', '#3949ab', '#8e24aa'][i], frame * 0.4, { light: '#ce93d8' }); }
  const p = { x: 230, y: 400 - Math.abs(Math.sin(frame * 0.1)) * 30, w: 30, h: 40, face: 1, squash: 1, inv: 0 }; drawRobo(p, 0);
  for (let i = 0; i < 3; i++) drawBat({ x: 150 + i * 330 + Math.sin(frame * 0.04 + i) * 40 + camX, y: 120 + Math.sin(frame * 0.07 + i * 2) * 20, st: 'fly', stun: 0 });
  drawWorm({ x: 760 + Math.sin(frame * 0.02) * 30 + camX, y: 440, dir: 1 }); drawWorm({ x: 110 + camX, y: 440, dir: 1 });
  for (const q of parts) circle(q.x, q.y, q.s, q.c);
  text('🎉 The Glow Party! 🎉', W / 2, 70, 46, '#fff59d');
  text('The Spider Queen got her tiara back. Now everyone is friends!', W / 2, 112, 22, '#fff');
  let tot = 0; for (const n of save.gems) tot += n || 0;
  text(`🏆 Trophy: Cave Queen's Hero!    💎 ${tot} glow-gems`, W / 2, 150, 20, '#7df9ff');
  if (stateT > 90 && frame % 40 < 28) text('Press JUMP or tap to go to the title', W / 2, 500, 18, '#fff');
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'title') { drawTitle(); return; }
  if (state === 'win') { drawWin(); return; }
  drawScene();
  if (state === 'play' || state === 'caught') drawHUD();
  if (state === 'intro') {
    const L = LEVELS[lvl];
    ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H);
    text(`Level ${lvl + 1} of 6`, W / 2, 190, 26, '#b3e5fc');
    text(`${L.icon} ${L.name}`, W / 2, 260, 52, '#fff59d');
    text(L.boss ? 'Watch out for the SPIDER QUEEN!' : 'Find the glow-gems and the EXIT!', W / 2, 320, 22, '#fff');
  } else if (state === 'talk') drawTalk();
  else if (state === 'caught') {
    ctx.fillStyle = 'rgba(20,0,40,.6)'; ctx.fillRect(0, 0, W, H);
    text('Oops! Robo got caught! 🕸️', W / 2, 230, 44, '#e1bee7');
    text('No worries... let\'s try again from the lantern!', W / 2, 290, 24, '#fff');
  } else if (state === 'clear') {
    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, W, H);
    text('Level complete! ✨', W / 2, 220, 52, '#fff59d');
    text(`💎 ${gemCount} / ${gemTotal} glow-gems`, W / 2, 285, 30, '#7df9ff');
    if (gemCount >= gemTotal) text('You found them ALL! 🌟', W / 2, 330, 24, '#ffe082');
  }
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
