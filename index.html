<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: #14102a; }   /* no white strip peeking out on the iPad */
  body { min-height: 100dvh; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    background: radial-gradient(circle at 50% 0%, #4a3480, #14102a 70%);
    color: #2d2340; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gear { position: fixed; font-size: 140px; opacity: .1; animation: spin 14s linear infinite; pointer-events: none; }
  .g1 { top: -40px; left: -40px; } .g2 { bottom: 30px; right: -40px; font-size: 180px; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- the book ---- */
  .stage { display: flex; align-items: center; gap: 18px; padding: 0 16px; }
  .book {
    position: relative; width: min(78vw, 640px); aspect-ratio: 4 / 3.2; perspective: 2200px;
  }
  .book::after {                               /* the spine / page edges */
    content: ""; position: absolute; top: 6px; bottom: -10px; right: -12px; left: 12px; z-index: -1;
    border-radius: 6px 22px 22px 6px; background: repeating-linear-gradient(0deg, #f3e9d2 0 3px, #d9ccae 3px 4px);
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .page {
    position: absolute; inset: 0; border-radius: 6px 22px 22px 6px; overflow: hidden;
    background: #fffaf0; box-shadow: inset 18px 0 24px -14px rgba(0,0,0,.35);
    transform-origin: left center; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 4% 7%;
  }
  .page.turning { transition: transform .7s ease-in-out; z-index: 3; }
  .page.flipped { transform: rotateY(-180deg); }
  .page.under { z-index: 1; }
  .page.top { z-index: 2; }

  .pageNum { position: absolute; bottom: 12px; right: 22px; font-size: 16px; color: #9a8a70; }
  .corner { position: absolute; bottom: 0; right: 0; width: 46px; height: 46px; background: linear-gradient(135deg, transparent 50%, #e8dcc0 50%); border-radius: 0 0 22px 0; }

  /* cover */
  .cover { background: linear-gradient(160deg, #66bb6a, #1b5e20); color: #fff; box-shadow: inset 22px 0 30px -16px rgba(0,0,0,.5); }
  .cover h1 { font-size: clamp(34px, 7vw, 64px); margin: 0; color: #ffe34d; text-shadow: 4px 4px 0 #0b3d14, 0 0 20px rgba(255,227,77,.6); line-height: 1.05; }
  .cover .icons { font-size: clamp(28px, 5vw, 44px); margin: 18px 0; letter-spacing: 6px; }
  .cover p { font-size: 22px; margin: 4px 0; }
  .cover .open { margin-top: 18px; font-size: 20px; background: rgba(0,0,0,.25); padding: 8px 22px; border-radius: 999px; animation: pulse 1.2s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }

  /* contents */
  .contents h2 { margin: 0 0 10px; font-size: 34px; color: #ff5aa5; }
  .toc { list-style: none; padding: 0; margin: 0; width: 100%; max-width: 420px; text-align: left; }
  .toc li { display: flex; align-items: baseline; gap: 10px; font-size: clamp(16px, 2.6vw, 21px); padding: 3px 8px; border-radius: 10px; cursor: pointer; }
  .toc li:hover { background: #fff0c4; }
  .toc .dots { flex: 1; border-bottom: 3px dotted #c9b89a; transform: translateY(-5px); }

  /* game pages */
  .pic { width: 100%; height: 42%; border-radius: 18px; background: var(--c); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -8px 0 rgba(0,0,0,.15); }
  .pic .icon { font-size: clamp(60px, 11vw, 100px); animation: float 2s ease-in-out infinite alternate; }
  .pic .mini { position: absolute; font-size: clamp(22px, 4vw, 34px); opacity: .9; }
  @keyframes float { to { transform: translateY(-10px) rotate(-5deg); } }
  .game h2 { margin: 12px 0 4px; font-size: clamp(28px, 5vw, 42px); color: var(--t); text-shadow: 2px 2px 0 rgba(0,0,0,.12); }
  .game .desc { font-size: clamp(15px, 2.4vw, 19px); margin: 0 0 6px; }
  .game .ctrl { font-size: clamp(13px, 2vw, 15px); color: #7a6a58; margin: 0 0 10px; }
  .playBtn {
    font: inherit; font-size: 24px; color: #fff; cursor: pointer; border: none;
    padding: 8px 40px; border-radius: 999px; background: var(--t);
    box-shadow: 0 6px 0 rgba(0,0,0,.3); transition: transform .1s;
  }
  .playBtn:hover { transform: scale(1.07); }
  .playBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

  /* back cover */
  .end { background: linear-gradient(160deg, #26c6da, #3949ab); color: #fff; }
  .end h2 { font-size: 44px; margin: 0; color: #ffe34d; text-shadow: 3px 3px 0 rgba(0,0,0,.3); }
  .end p { font-size: 21px; }

  /* flip arrows */
  .arrow {
    font: inherit; font-size: 34px; width: 64px; height: 64px; border-radius: 50%; cursor: pointer;
    border: 4px solid #fff; color: #fff; background: #4fc3f7; box-shadow: 0 5px 0 rgba(0,0,0,.35);
    flex: none;
  }
  .arrow:disabled { opacity: .25; cursor: default; }
  .arrow:not(:disabled):hover { transform: scale(1.1); }
  .help { color: #c9b8ff; font-size: 16px; margin-top: 18px; text-align: center; padding: 0 16px; }

  /* game player */
  #player { position: fixed; inset: 0; background: #10172a; display: none; z-index: 10; }
  #player.open { display: block; }
  #player iframe { width: 100%; height: 100%; border: 0; display: block; }
  #back {
    position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); z-index: 11; display: none;
    font: inherit; font-size: 16px; color: #fff; cursor: pointer;
    background: #ff5aa5; border: 3px solid #fff; border-radius: 999px; padding: 6px 16px;
    box-shadow: 0 4px 0 rgba(0,0,0,.35); opacity: .85;
  }
  #back:hover { opacity: 1; }
  #player.open ~ #back { display: block; }
</style>

<div class="gear g1">⚙️</div><div class="gear g2">⚙️</div>

<script>
const GAMES = [
  { file: 'platformer.html', name: 'Robo Jump', icon: '🤖', minis: ['🚀', '🪐', '⭐', '🛸'], c: 'linear-gradient(160deg,#3949ab,#0d1b4d)', t: '#3949ab',
    desc: 'Hover through space with jet boots and beat a boss at the end of every level!', ctrl: '← → move • SPACE jump (hold to hover) • M music' },
  { file: 'sparks.html', name: 'Sparks!', icon: '🐶', minis: ['🐱', '🐱', '🚁', '🐟'], c: 'linear-gradient(160deg,#ffb300,#e65100)', t: '#e65100',
    desc: 'Two cats drive a robot dog! Rescue kittens in 9 levels from all 3 books.', ctrl: '← → move • SPACE jump • 1–9 pick a level' },
  { file: 'sports.html', name: 'Sports Party', icon: '🏟️', minis: ['⚾', '🏀', '⚽', '🏈'], c: 'linear-gradient(160deg,#43a047,#1b5e20)', t: '#2e7d32',
    desc: 'Five games in one: baseball, basketball, soccer, mini golf and football!', ctrl: 'Click a sport • SPACE to swing, shoot and kick • ESC menu' },
  { file: 'adventure.html', name: "Ben's Quest", icon: '⚔️', minis: ['🐉', '🗝️', '💎', '🏰'], c: 'linear-gradient(160deg,#2e7d32,#004d40)', t: '#00695c',
    desc: 'Get a sword, find the temple key, and defeat the Dragon King!', ctrl: 'Arrow keys walk • SPACE sword / talk / open' },
  { file: 'racing.html', name: 'Turbo Racers', icon: '🏎️', minis: ['🏁', '⚡', '🌵', '🏔️'], c: 'linear-gradient(160deg,#e53935,#8e0000)', t: '#c62828',
    desc: 'Race Zoomy, Speedy and Rocket on 3 tracks. Grab the boost arrows!', ctrl: '← → steer • ↓ brake (the car drives itself!)' },
  { file: 'building.html', name: 'Build It!', icon: '🏠', minis: ['🏰', '🌳', '🐕', '🌙'], c: 'linear-gradient(160deg,#29b6f6,#01579b)', t: '#0277bd',
    desc: 'Build houses, mansions and skyscrapers. Add people, dogs and a pool!', ctrl: 'Click to build • right-click erase • 🔍 zoom' },
  { file: 'fighting.html', name: 'Brawl Buddies', icon: '🥊', minis: ['🤖', '🐱', '🦖', '🧙'], c: 'linear-gradient(160deg,#ff7043,#6a1b9a)', t: '#8e24aa',
    desc: 'Robo Max, Ninja Kit, Dino Rex and Wizard Zap battle it out! 1 or 2 players.', ctrl: '1P: arrows + Z X C • 2P: WASD + F G H vs arrows + , . /' },
  { file: 'zombie.html', name: 'Zombie Maze', icon: '🧟', minis: ['💰', '💧', '🧪', '🚪'], c: 'linear-gradient(160deg,#7cb342,#263238)', t: '#558b2f',
    desc: 'Find 4 treasure chests and escape! Splash zombies with water balloons.', ctrl: 'Arrow keys move • SPACE water balloon' },
  { file: 'monsters.html', name: 'Monster Pals', icon: '🐾', minis: ['🦊', '💧', '🐰', '🦄'], c: 'linear-gradient(160deg,#f06292,#7b1fa2)', t: '#ad1457',
    desc: 'Catch all 16 monsters, beat Champion Juniper and become a Monster Master!', ctrl: 'Arrows walk • SPACE talk • B book • Esc menu' },
  { file: 'petpark.html', name: 'Pet Park', icon: '🐰', minis: ['🐶', '🐱', '🎾', '👑'], c: 'linear-gradient(160deg,#ff9ec7,#ffcf6b)', t: '#e05a9a',
    desc: 'Adopt pets, feed them, play fetch, give bubble baths and teach tricks!', ctrl: 'Use the mouse! • click a pet to pick it • rub it to pet it' },
  { file: 'paint.html', name: 'Paint Studio', icon: '🎨', minis: ['🖌️', '🌈', '✨', '🦄'], c: 'linear-gradient(160deg,#ff8a65,#7c4dff)', t: '#7c4dff',
    desc: 'Paint with rainbow and sparkle brushes, stamps, and coloring pages!', ctrl: 'Use the mouse! • pick a tool on the left • 💾 save to your gallery' },
  { file: 'math.html', name: 'Math Rocket', icon: '🧮', minis: ['🚀', '🪐', '🎈', '⭐'], c: 'linear-gradient(160deg,#5c6bc0,#1a1046)', t: '#5c6bc0',
    desc: 'Answer math questions to fly to 6 planets, then pop balloons with the right answers!', ctrl: 'Click the answer (or press 1 2 3 4)' },
  { file: 'pizza.html', name: 'Order Up! In Space', icon: '🍕', minis: ['👽', '🚀', '🪐', '⭐'], c: 'linear-gradient(160deg,#ff7043,#4527a0)', t: '#e64a19',
    desc: 'Run a pizza shop on a space station! Make pizzas for hungry aliens!', ctrl: 'Use the mouse! • dough → sauce → cheese → toppings → oven → serve' },
  { file: 'castle.html', name: 'Castle Defense', icon: '🏰', minis: ['🏹', '💣', '❄️', '⚡'], c: 'linear-gradient(160deg,#7cc35a,#3e2723)', t: '#5d4037',
    desc: 'Build archer, cannon, ice and lightning towers to stop the silly monsters!', ctrl: 'Use the mouse! • pick a tower, click the grass • SPACE starts a wave' },
  { file: 'bookcat.html', name: 'Book Cat', icon: '🐱', minis: ['📖', '🐟', '🧟', '🍕'], c: 'linear-gradient(160deg,#ff9800,#7b2ff7)', t: '#ef6c00',
    desc: 'Pages the cat snuck into this book! Run through a page of EVERY game!', ctrl: '← → run • SPACE jump (twice for a double jump!)' },
  { file: 'glitch.html', name: 'Glitch Factory', icon: '👾', minis: ['🤖', '🐶', '⚔️', '🦖'], c: 'linear-gradient(160deg,#ff00ff,#00bcd4)', t: '#c2185b',
    desc: 'Every game got MIXED UP! Pick a hero from any game and fix the glitch!', ctrl: '← → move • SPACE jump • X attack (Hero & Emberpup)' },
  { file: 'quiz.html', name: 'Game Factory Quiz', icon: '❓', minis: ['🎤', '🤖', '🏆', '⭐'], c: 'linear-gradient(160deg,#7c4dff,#c2185b)', t: '#7c4dff',
    desc: 'A game show all about YOUR games! How many questions can you get right?', ctrl: 'Click an answer (or press 1 2 3 4) • ✂️ 50/50 once per quiz' },
  { file: 'guessit.html', name: 'Guess It!', icon: '🔊', minis: ['😀', '🌈', '🐝', '⛈️'], c: 'linear-gradient(160deg,#ff9800,#00b8d4)', t: '#ef6c00',
    desc: '8 quizzes about YOUR games: emojis, sounds, quotes, true or false, scramble, math and odd one out!', ctrl: 'Click an answer • 🔊 Play again • turn your sound up!' },
];

// ---- build the pages: cover, contents, one page per game, back cover ----
function coverHTML() {
  return `<div class="page cover"><h1>THE GAME<br>FACTORY</h1>
    <div class="icons">${GAMES.map(g => g.icon).join(' ')}</div>
    <p>A book of games made by</p><p><b>Ben &amp; his brother</b></p>
    <div class="open">Press ▶ to open the book!</div></div>`;
}
function contentsHTML() {
  return `<div class="page contents"><h2>📖 Contents</h2><ul class="toc">
    ${GAMES.map((g, i) => `<li data-go="${i + 2}">${g.icon} ${g.name}<span class="dots"></span>${i + 3}</li>`).join('')}
    </ul><div class="pageNum">2</div><div class="corner"></div></div>`;
}
function gameHTML(i) {
  const g = GAMES[i], spots = [[8, 12], [82, 14], [10, 70], [84, 68]];
  return `<div class="page game" style="--c:${g.c};--t:${g.t}">
    <div class="pic">${g.minis.map((m, k) => `<span class="mini" style="left:${spots[k][0]}%;top:${spots[k][1]}%">${m}</span>`).join('')}<span class="icon">${g.icon}</span></div>
    <h2>${g.name}</h2><p class="desc">${g.desc}</p><p class="ctrl">🎮 ${g.ctrl}</p>
    <button class="playBtn" data-play="${i}">▶ PLAY</button>
    <div class="pageNum">${i + 3}</div><div class="corner"></div></div>`;
}
function endHTML() {
  return `<div class="page end"><h2>The End!</h2><p>…or is it? 🤔</p>
    <p>Every game in this book was dreamed up by Ben &amp; his brother.</p>
    <p>What game will you make next? 🚀</p><div class="pageNum">${GAMES.length + 3}</div></div>`;
}
const PAGES = [coverHTML(), contentsHTML(), ...GAMES.map((_, i) => gameHTML(i)), endHTML()];

// ---- sounds ----
let actx = null;
function audio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} return actx; }
function beep(f, d = 0.08, type = 'square', v = 0.06) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
function swish(forward = true) {                      // a classic video-game "blip"
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [[forward ? 660 : 990, 0], [forward ? 990 : 660, 0.06]].forEach(([f, d]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.07, t + d); g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.08);
    o.connect(g); g.connect(a.destination); o.start(t + d); o.stop(t + d + 0.09);
  });
}

// ---- flipping ----
const book = document.getElementById('book'), prevB = document.getElementById('prev'), nextB = document.getElementById('next');
let cur = 0, busy = false;
try { cur = Math.max(0, Math.min(PAGES.length - 1, +(localStorage.getItem('factoryPage') || 0))); } catch (_) {}

function makePage(i, cls) {
  const wrap = document.createElement('div');
  wrap.innerHTML = PAGES[i];
  const el = wrap.firstElementChild;
  el.classList.add(cls);
  return el;
}
function show(i) {
  book.innerHTML = '';
  book.appendChild(makePage(i, 'top'));
  cur = i; updateButtons();
  try { localStorage.setItem('factoryPage', i); } catch (_) {}
}
function updateButtons() { prevB.disabled = cur === 0; nextB.disabled = cur === PAGES.length - 1; }

function flipTo(i) {
  if (busy || i === cur || i < 0 || i >= PAGES.length) return;
  busy = true;
  const forward = i > cur;
  swish(forward);
  book.innerHTML = '';
  if (forward) {
    const under = makePage(i, 'under'), top = makePage(cur, 'top');
    book.append(under, top);
    requestAnimationFrame(() => requestAnimationFrame(() => { top.classList.add('turning', 'flipped'); }));
    setTimeout(() => { show(i); busy = false; }, 720);
  } else {
    const under = makePage(cur, 'under'), top = makePage(i, 'top');
    top.classList.add('flipped'); book.append(under, top);
    requestAnimationFrame(() => requestAnimationFrame(() => { top.classList.add('turning'); top.classList.remove('flipped'); }));
    setTimeout(() => { show(i); busy = false; }, 720);
  }
}
prevB.addEventListener('click', () => flipTo(cur - 1));
nextB.addEventListener('click', () => flipTo(cur + 1));
book.addEventListener('click', e => {
  const play = e.target.closest('[data-play]'), go = e.target.closest('[data-go]');
  if (play) openGame(+play.dataset.play);
  else if (go) flipTo(+go.dataset.go);
  else if (e.target.closest('.corner') || e.target.closest('.cover')) flipTo(cur + 1);
});

// ---- playing a game ----
const player = document.getElementById('player');
let frame = null;
function openGame(i) {
  [660, 880, 1320].forEach((f, k) => setTimeout(() => beep(f, 0.1), k * 70));
  frame = document.createElement('iframe');      // a fresh game window each time
  frame.title = GAMES[i].name; frame.src = GAMES[i].file + '?v=' + Date.now();   // always the newest version
  player.appendChild(frame);
  player.classList.add('open');
  document.title = GAMES[i].name + ' – The Game Factory';
  frame.onload = () => frame.focus();
}
function closeGame() {
  if (frame) { frame.remove(); frame = null; }       // stops the game and its music
  player.classList.remove('open');
  document.title = 'The Game Factory';
  window.focus();                                    // so the arrow keys flip pages again
  beep(440, 0.12);
}
document.getElementById('back').addEventListener('click', closeGame);

addEventListener('keydown', e => {
  if (player.classList.contains('open')) return;
  if (e.key === 'ArrowRight') { e.preventDefault(); flipTo(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); flipTo(cur - 1); }
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (cur >= 2 && cur < 2 + GAMES.length) openGame(cur - 2); else flipTo(cur + 1);
  }
  else if (e.key >= '1' && e.key <= '9') flipTo(+e.key + 1);
  else if (e.key === '0') flipTo(11);
});

show(cur);
</script>
