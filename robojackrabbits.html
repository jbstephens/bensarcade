<script>
// 🐰 ROBO JACKRABBITS: TRACK & FIELD. 💡 Ben's idea! Earn 4 patches (Kindness, Etiquette, Confidence, Gratitude),
// one daily event each: Day 1 Batons (relay), Day 2 Long Jump, Day 3 Hurdles, Day 4 Javelin (soft foam!), Day 5 = the MEET:
// all 4 events + a ribbon ceremony on the podium (blue / red / white + participation ribbons for everyone) + the team jacket.
// Every day: a warm-up mini (stretch or jog), the event, and a team cheer. Coach = Dusty. Mascot = Jax, a robot jackrabbit.
// Controls: GO (Space / Enter / tap) = run taps + say yes; HOP! (X) = pass / jump / throw.
// Save: localStorage.roboJackrabbits. Trophies: jackrabbitsPatches, jackrabbitsBlue, jackrabbitsMeet.
// Music for the book's Jukebox: robojackrabbits.html?song=warmup | event | ceremony  (or window.JUKEBOX.song)
const C = document.getElementById('c'), ctx = C.getContext('2d'), W = 960, H = 540;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  if (outline) { ctx.lineJoin = 'round'; ctx.strokeStyle = outline; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(s, x, y); }
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {

  if (cur) out.push(cur); return out;
}
function panel(x, y, w, h, fill = 'rgba(255,253,240,.96)', edge = '#ff7043') { roundRect(x + 4, y + 6, w, h, 24, 'rgba(0,0,0,.18)'); roundRect(x, y, w, h, 24, fill); ctx.strokeStyle = edge; ctx.lineWidth = 5; rrect(x, y, w, h, 24); ctx.stroke(); }
// big tappable buttons drawn on the canvas (rebuilt every frame)
let BTN = [];
function button(x, y, w, h, label, col, fn, size = 24, txt = '#3e2723') {
  const hot = BTN.length === 0 && false;
  roundRect(x + 3, y + 5, w, h, h / 2, 'rgba(0,0,0,.2)'); roundRect(x, y, w, h, h / 2, col);
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; rrect(x + 2, y + 2, w - 4, h - 4, h / 2 - 2); ctx.stroke();
  text(label, x + w / 2, y + h / 2 + 1, size, txt); BTN.push({ x, y, w, h, fn, hot });
}
// floating words + sparkles
let FX = [], POPS = [];
function pop(s, x, y, col = '#fff', size = 30) { POPS.push({ s, x, y, col, size, life: 70 }); }
function burst(x, y, n = 14, cols = ['#ffd54f', '#ff8a80', '#80d8ff', '#b9f6ca', '#ea80fc'], kind = 'star') {
  for (let i = 0; i < n; i++) { const a = Math.random() * 7, sp = rnd(2, 6); FX.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 2, c: cols[i % cols.length], life: rnd(40, 70), kind, r: rnd(4, 8) }); }
}
function updFX() {
  for (const f of FX) { f.x += f.vx; f.y += f.vy; f.vy += 0.15; f.life--; } FX = FX.filter(f => f.life > 0);
  for (const p of POPS) { p.y -= 0.8; p.life--; } POPS = POPS.filter(p => p.life > 0);
}
function drawFX() {
  for (const f of FX) { ctx.save(); ctx.globalAlpha = clamp(f.life / 30, 0, 1); if (f.kind === 'heart') heart(f.x, f.y, f.r, f.c); else if (f.kind === 'confetti') { ctx.fillStyle = f.c; ctx.fillRect(f.x, f.y, f.r, f.r * 0.6); } else star(f.x, f.y, f.r, f.c, f.life * 0.1); ctx.restore(); }
  for (const p of POPS) { ctx.save(); ctx.globalAlpha = clamp(p.life / 25, 0, 1); text(p.s, p.x, p.y, p.size, p.col, 'center', true, 'rgba(0,0,0,.55)'); ctx.restore(); }
}
// ---------- 🔈 SOFT sounds: one master knob (0.12), slow fades, nothing loud ----------
const MASTER = 0.12;
let actx = null, master = null, musBus = null, sfx = null, soundOn = true, musicOn = true;
function audio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
      musBus = actx.createGain(); musBus.gain.value = 0; musBus.connect(master);
      sfx = actx.createGain(); sfx.gain.value = 0.9; sfx.connect(master);

function running() { return actx && actx.state === 'running'; }

    master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(soundOn ? MASTER : 0, t, 0.5);
    const speaking = window.speechSynthesis && speechSynthesis.speaking;
    musBus.gain.cancelScheduledValues(t); musBus.gain.setTargetAtTime(musicOn ? (speaking ? 0.3 : 0.55) : 0, t, 0.8);
  } catch (_) {}
}
function tone(f, d = 0.3, v = 0.1, when = 0, type = 'sine', bus = sfx) {
  if (!running()) return;
  try {
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + 0.05);
  } catch (_) {}
}
const SFX = {
  step: () => tone(rnd(300, 340), 0.07, 0.05, 0, 'triangle'),
  good: () => tone(880, 0.12, 0.06, 0, 'triangle'),
  boing: () => { if (!running()) return; try { const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain(); o.type = 'sine'; o.frequency.setValueAtTime(330, t); o.frequency.exponentialRampToValueAtTime(700, t + 0.18);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.09, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.3); o.connect(g); g.connect(sfx); o.start(t); o.stop(t + 0.35); } catch (_) {} },
  bump: () => tone(160, 0.18, 0.08, 0, 'triangle'),
  yay: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.35, 0.06, i * 0.08, 'triangle')),
  kind: () => [659, 784, 988].forEach((f, i) => tone(f, 0.6, 0.06, i * 0.1)),
  pick: () => tone(660, 0.1, 0.05, 0, 'triangle'),
  whoosh: () => { [400, 500, 600].forEach((f, i) => tone(f, 0.15, 0.04, i * 0.04, 'sine')); },
  patch: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, 0.8, 0.05, i * 0.12)),
  whistle: () => { tone(1568, 0.25, 0.025, 0, 'sine'); tone(1568, 0.25, 0.025, 0.3, 'sine'); },
};
// 🗣️ Coach Dusty's voice (soft and slow-ish). The music dips while she talks.
function speak(line, pitch = 1.3) {
  try {
    if (!soundOn || !window.speechSynthesis || JB_WANT) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’:-]/g, '').replace(/\s+/g, ' ').trim());
    u.rate = 0.95; u.pitch = pitch; u.volume = 0.7; u.onend = fadeAll; speechSynthesis.speak(u); setTimeout(fadeAll, 150);
  } catch (_) {}
}
// ---------- 🎶 the music: 3 original, gentle, upbeat songs (melody on chord tones on the strong beats) ----------
// each song: beat length, melody [midi, beats], 8 chords (one per 4-beat bar, root first), drum pattern on/off
const SONGS = {
  warmup: { name: 'Hop Hop Warm-Up', beat: 0.42, lead: 'triangle', chords: [[48, 52, 55], [41, 45, 48], [43, 47, 50], [48, 52, 55], [45, 48, 52], [41, 45, 48], [43, 47, 50], [48, 52, 55]],
    mel: [[72, 1], [76, .5], [74, .5], [76, 1], [79, 1], [77, 1], [76, .5], [74, .5], [72, 1], [69, 1], [74, 1], [71, .5], [72, .5], [74, 1], [79, 1], [76, 2], [72, 2],
      [76, 1], [72, .5], [74, .5], [76, 1], [81, 1], [81, 1], [79, .5], [77, .5], [77, 1], [72, 1], [79, 1], [77, .5], [76, .5], [74, 1], [71, 1], [72, 3], [0, 1]] },
  event: { name: 'Jackrabbit Dash', beat: 0.34, lead: 'square', chords: [[43, 47, 50], [48, 52, 55], [50, 54, 57], [43, 47, 50], [40, 43, 47], [48, 52, 55], [50, 54, 57], [43, 47, 50]],
    mel: [[67, .5], [71, .5], [74, 1], [71, .5], [74, .5], [79, 1], [76, 1], [72, .5], [76, .5], [79, 1], [76, 1], [74, .5], [78, .5], [81, 1], [78, 1], [74, 1], [79, 2], [71, 1], [74, 1],
      [76, .5], [79, .5], [83, 1], [79, 1], [76, 1], [72, 1], [76, .5], [79, .5], [84, 1], [79, 1], [81, 1], [78, .5], [76, .5], [74, 1], [78, 1], [79, 3], [0, 1]] },
  ceremony: { name: 'Ribbon Parade', beat: 0.6, lead: 'sine', soft: true, chords: [[41, 45, 48], [46, 50, 53], [48, 52, 55], [41, 45, 48], [38, 41, 45], [46, 50, 53], [48, 52, 55], [41, 45, 48]],
    mel: [[65, 1], [69, 1], [72, 2], [70, 1], [74, 1], [77, 2], [76, 1], [72, 1], [67, 1], [72, 1], [77, 4],
      [74, 1], [77, 1], [81, 2], [82, 1], [77, 1], [74, 2], [79, 1], [76, .5], [74, .5], [72, 2], [77, 3], [0, 1]] },
};
const midiF = m => 440 * Math.pow(2, (m - 69) / 12);
for (const k in SONGS) {   // pre-build each song's note list (melody + bass on beats 1 & 3 + soft chord pad + tiny hi-hat)
  const S = SONGS[k], ev = []; let b = 0;
  for (const [m, d] of S.mel) { if (m) ev.push({ b, m, d: Math.min(d, 1.5) * S.beat * 0.95, v: 0.11, w: S.lead === 'square' ? 'triangle' : S.lead, lead: 1 }); b += d; }
  S.chords.forEach((ch, bar) => {
    ev.push({ b: bar * 4, m: ch[0] - 12, d: S.beat * 1.6, v: 0.14, w: 'triangle' }); ev.push({ b: bar * 4 + 2, m: ch[0] - 12 + (S.soft ? 0 : 7), d: S.beat * 1.6, v: 0.12, w: 'triangle' });
    for (const n of ch) ev.push({ b: bar * 4, m: n + 12, d: S.beat * 3.6, v: 0.025, w: 'sine', pad: 1 });
    if (!S.soft) for (let i = 0; i < 8; i++) ev.push({ b: bar * 4 + i * 0.5, hat: 1, v: i % 2 ? 0.012 : 0.02 });

let noiseBuf = null;
function songNote(e, t) {
  try {
    if (e.hat) {
      if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.1, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
      const s = actx.createBufferSource(), hp = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = noiseBuf; hp.type = 'highpass'; hp.frequency.value = 7000;
      g.gain.setValueAtTime(e.v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.05); s.connect(hp); hp.connect(g); g.connect(musBus); s.start(t); s.stop(t + 0.08); return;

}
const mus = { timer: null, song: 'warmup', t0: null, k: 0, loop: 0, last: 0 };
function musicTick() {
  if (!running() || !musBus) { mus.t0 = null; return; }

  if (mus.t0 === null || now - mus.last > 1) { mus.t0 = now + 0.15; mus.k = 0; mus.loop = 0; }   // (re)start cleanly: never a pile-up

function playSong(name) {

const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || (/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '';

let save = { done: [false, false, false, false, false], patches: {}, ribbons: { blue: 0, red: 0, white: 0, part: 0 }, best: {}, meets: 0, virtue: { kind: 0, etiq: 0, conf: 0, grat: 0 } };
try { const s = JSON.parse(localStorage.getItem('roboJackrabbits') || '{}'); for (const k in s) save[k] = (typeof save[k] === 'object' && !Array.isArray(save[k]) && s[k]) ? Object.assign(save[k], s[k]) : s[k]; } catch (_) {}

// ---------- 🤖 the team (Robo, Robo 2.0, Pink Robo from Robo Jump 18; Bolt, Fizz, Sprocket from Sus Factory) ----------
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true };       // 💚 ROBO 2.0 (no antenna!)
const PAL_PINK = { head: '#f8bbd0', body: '#fce4ec', visor: '#4a148c', eye: '#ff80ab', legs: '#ec407a', pod: '#f06292', pink: true };    // 🎀 PINK ROBO (big bow + a heart)
const BOTS = {
  robo:     { name: 'Robo', pal: PAL_ROBO, col: '#40c4ff' },
  robo2:    { name: 'Robo 2.0', pal: PAL_R2, col: '#00e676' },
  pink:     { name: 'Pink Robo', pal: PAL_PINK, col: '#ff4081' },
  bolt:     { name: 'Bolt', col: '#ff7043', dark: '#bf360c', shape: 'square' },
  sprocket: { name: 'Sprocket', col: '#66bb6a', dark: '#1b5e20', shape: 'gear' },
  fizz:     { name: 'Fizz', col: '#f06292', dark: '#880e4f', shape: 'jar' },
  // friendly robots visiting from other teams (also from Sus Factory)
  widget:   { name: 'Widget', col: '#ffd740', dark: '#e65100', shape: 'triangle' },
  dottie:   { name: 'Dottie', col: '#b388ff', dark: '#4527a0', shape: 'dots' },
  clank:    { name: 'Clank', col: '#4dd0e1', dark: '#006064', shape: 'hex' },
  zippy:    { name: 'Zippy', col: '#e53935', dark: '#7f0000', shape: 'star' },

// draw any bot standing at (x = middle, y = feet). o = { s, run (step phase), air, happy, face, pose: 'reach' | 'toes' | 'wide', vest, baton, jav, wave }
function drawBot(id, x, y, o = {}) {
  const b = BOTS[id]; if (!b) return;

function drawArms(col, edge, stride, o, cx = 0, cy = -24) {   // little stick arms: swing when running, up for 'reach', out for 'wide', hug/wave

function drawRoboBody(pal, stride, t, o) {   // Robo's body (Robo Jump 18), 30 x 40, feet at y = 0

// ---------- HUD, on-screen buttons, event results ----------

// ---------- 🎀 RIBBON CEREMONY on the podium: 1st = BLUE, 2nd = RED, 3rd = WHITE, + participation ribbons for EVERYONE ----------
const RIB = { 1: ['#1e88e5', '#0d47a1', '1st'], 2: ['#e53935', '#b71c1c', '2nd'], 3: ['#fafafa', '#9e9e9e', '3rd'] };

function drawRibbon(x, y, kind, s = 1) {   // a rosette ribbon with two tails

// ---------- 🔁 the main loop + controls ----------
function update() {
  frame++; modeT++; updFX();

  if (M) { updMoment(G || Hp); return; }
  if (mode === 'title') { if (G || Hp) { audio(); fadeAll(); goMap(); } }

  else if (mode === 'warm') updWarm(G);
  else if (mode === 'cheer') updCheer(G);
  else if (mode === 'event') ({ batons: updBatons, longjump: updLongjump, hurdles: updHurdles, javelin: updJavelin })[E.id](G, Hp);

}
function draw() {
  BTN = [];
  if (mode === 'title') drawTitle();
  else if (mode === 'map') drawMap();
  else if (mode === 'intro') drawIntro();
  else if (mode === 'warm') drawWarm();
  else if (mode === 'cheer') drawCheer();

  else if (mode === 'dayEnd') drawDayEnd();

let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now; acc += Math.min(100, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n < 4) { update(); acc -= 1000 / 60; n++; }
  draw(); requestAnimationFrame(loop);
}
function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
C.addEventListener('pointerdown', e => {
  audio(); fadeAll(); const [x, y] = pos(e);

addEventListener('keydown', e => {

// 🎶 Jukebox mode: play one song and nothing else
if (JB_WANT && SONGS[JB_WANT]) { audio(); musicOn = true; soundOn = true; playSong(JB_WANT); setTimeout(() => { audio(); fadeAll(); }, 50); }
else { mus.song = 'warmup'; mus.timer = setInterval(musicTick, 100); }
requestAnimationFrame(loop);
