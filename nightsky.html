    o.connect(e); e.connect(master); o.start(t); o.stop(t + len + .05);
  }
  function tada() { [0, 2, 4, 5].forEach((n, k) => setTimeout(() => note(n + 2, 1.8, .08), k * 160)); }
  function whoosh() {
    if (!on) return; const t = ctx.currentTime, o = ctx.createOscillator(), e = ctx.createGain();
    o.type = 'sine'; o.frequency.setValueAtTime(1800, t); o.frequency.exponentialRampToValueAtTime(700, t + .9);
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(.03, t + .15); e.gain.linearRampToValueAtTime(0, t + .9);
    o.connect(e); e.connect(master); o.start(t); o.stop(t + 1);
  }
  function toggle() {
    init(); on = !on; ctx.resume && ctx.resume();
    const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(on ? MAX : 0, t + 2);
    clearTimeout(cr); if (on) cr = setTimeout(crickets, 800);
    return on;
  }
  function pause(p) { if (!ctx) return; if (p) ctx.suspend && ctx.suspend(); else if (on) ctx.resume && ctx.resume(); }
  return { toggle, note, tada, whoosh, pause };
})();
// ---------- buttons and taps ----------
const ui = document.getElementById('ui'), factEl = document.getElementById('fact'), nameEl = document.getElementById('name'), hintEl = document.getElementById('hint');
let factI = -1, nameTimer = 0;
function fact(txt) { if (txt === undefined) { factI = (factI + 1) % FACTS.length; txt = FACTS[factI]; } factEl.textContent = '🤓 ' + txt; }
function say(txt) { nameEl.textContent = txt; nameEl.classList.add('show'); clearTimeout(nameTimer); nameTimer = setTimeout(() => nameEl.classList.remove('show'), 1900); }
function showPrize(msg) { const p = document.getElementById('prize'); p.innerHTML = msg; p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 4500); }
let saved = {}; try { saved = JSON.parse(localStorage.getItem('gfNightSky') || '{}'); } catch (_) {}
(saved.done || []).forEach(id => { const c = CONS.find(c => c.id === id); if (c) { c.done = true; c.figP = 1; } });
function save() { try { localStorage.setItem('gfNightSky', JSON.stringify({ done: CONS.filter(c => c.done).map(c => c.id) })); } catch (_) {} }
const chipBox = document.getElementById('chips');
CONS.forEach((c, i) => { const b = document.createElement('button'); b.className = 'chip'; b.textContent = c.e + ' ' + c.t; b.addEventListener('click', e => { e.stopPropagation(); pick(i); }); chipBox.appendChild(b); });
function refreshChips() {
  [...chipBox.children].forEach((b, i) => { b.classList.toggle('on', i === st.act); b.classList.toggle('done', !!CONS[i].done); });
  const n = CONS.filter(c => c.done).length;
  document.getElementById('count').textContent = n >= 6 ? `⭐ ${n} of 10 constellations joined! 🏆` : `⭐ ${n} of 10 joined. Join 6 for a trophy!`;
}
function setHint() {
  const c = CONS[st.act];
  hintEl.textContent = c.done ? `✅ ${c.t}! Pick another one, or try the buttons.` : st.prog === 0 ? `👆 Tap the twinkling star to start ${c.t}!` : '👆 Now tap the next twinkling star!';
}
function pick(i) {
  if (spinning) toggleSpin(false);
  st.act = i; st.prog = CONS[i].done ? CONS[i].order.length : 0; st.scope = -1;
  Object.assign(goal, aimAt(CONS[i].mid, 31));
  refreshChips(); setHint(); say(CONS[i].e + ' ' + CONS[i].t); fact(CONS[i].fact);
}
function tapAt(x, y) {
  // planets first
  if (st.planetsOn) for (let i = 0; i < PLANETS.length; i++) { const p = PLANETS[i].sp; if (p && Math.hypot(p[0] - x, p[1] - y) < 40) { st.scope = i; st.scopeT = 0; fact(FACTS[PLANETS[i].fact]); Sound.note(4); return; } }
  const c = CONS[st.act]; if (c.done || spinning) return;
  if (c.order[st.prog] === -1) st.prog++;
  const want = c.order[st.prog], p = proj(c.v[want]);
  let best = -1, bd = 1e9; c.v.forEach((v, i) => { const q = proj(v); if (!q) return; const d = Math.hypot(q[0] - x, q[1] - y); if (d < bd) { bd = d; best = i; } });
  if (p && (Math.hypot(p[0] - x, p[1] - y) < 46 || (best === want && bd < 70))) {
    st.prog++; st.lineT = T; Sound.note(st.prog);
    if (c.order[st.prog] === -1) st.prog++;
    if (st.prog >= c.order.length) finish(c);
    setHint();
  } else if (bd < 60) { st.wrongT = T + .4; hintEl.textContent = '🙂 Almost! Look for the twinkling ring.'; }
}
function finish(c) {
  c.done = true; c.figP = 0.001; save(); refreshChips(); Sound.tada();
  say('🎉 ' + c.t + '!'); fact(c.fact);
  const n = CONS.filter(k => k.done).length;
  if (n >= 6 && !saved.won) { saved.won = true; setTimeout(() => { trophy('nightSky'); showPrize('🏆 You joined 6 constellations!<br>Night Sky trophy!'); }, 1500); }
}
sk.addEventListener('mousedown', e => { if (ui.classList.contains('hidden')) return; tapAt(e.clientX, e.clientY); });
const btn = (id, f) => document.getElementById(id).addEventListener('click', e => { e.stopPropagation(); f(); });
btn('tPlanets', () => {
  st.planetsOn = !st.planetsOn; document.getElementById('tPlanets').classList.toggle('on', st.planetsOn);
  if (st.planetsOn) { if (spinning) toggleSpin(false); Object.assign(goal, aimAt(ecl(105), 24)); st.scope = 0; st.scopeT = 0; say('🔭 Planets!'); fact(FACTS[3]); hintEl.textContent = '👆 Tap a planet to look at it in the telescope!'; }
  else { st.scope = -1; setHint(); }
});
btn('tShoot', () => {
  const n = 1 + (Math.random() < .4 ? 1 : 0);
  for (let k = 0; k < n; k++) { const x = VW * (.2 + Math.random() * .6), y = VH * (.12 + Math.random() * .25), dir = Math.random() < .5 ? -1 : 1;
    st.shoot.push({ x, y, dx: dir * VW * (.25 + Math.random() * .15), dy: VH * (.12 + Math.random() * .1), t0: T + k * .7, dur: .9 + Math.random() * .4 }); }
  Sound.whoosh(); fact(FACTS[4]);
});
btn('tMoon', () => {
  if (!st.moon) { st.moon = 1; st.phase = 4 / 8; st.phaseS = st.phase; }
  else st.phase += 1 / 8;
  // put the Moon in the sky where we can see it (up and to the right of the middle)
  const p = st.moonV && proj(st.moonV);
  if (!p || p[0] < 60 || p[0] > VW - 200 || p[1] < 80 || p[1] > VH * .62) st.moonV = unproj(VW * .64, VH * .24);
  const k = Math.round(((st.phase % 1) + 1) % 1 * 8) % 8;
  document.getElementById('tMoon').classList.add('on');
  say(PHASES[k]); fact(k === 0 ? 'At New Moon, the side of the Moon facing us gets no sunlight, so we can hardly see it. Tap again to watch it grow!' : FACTS[k % 2 ? 9 : 8]);
});
function toggleSpin(v) {
  spinning = v === undefined ? !spinning : v;
  document.getElementById('tSpin').classList.toggle('on', spinning);
  if (spinning) { Object.assign(goal, { az: 0, alt: 24 * D2R, f: .6 }); st.scope = -1; say('⏩ Spin the night'); fact(FACTS[0] + ' ' + FACTS[2]); hintEl.textContent = '⭐ Watch the stars wheel around Polaris, the North Star!'; }
  else { goal.f = .85; setHint(); }
}
btn('tSpin', () => toggleSpin());
btn('tFact', () => fact());
factEl.addEventListener('click', e => { e.stopPropagation(); fact(); });
document.getElementById('hideBtn').addEventListener('click', e => { e.stopPropagation(); ui.classList.add('hidden'); });
document.addEventListener('pointerdown', e => { if (ui.classList.contains('hidden')) { e.preventDefault(); ui.classList.remove('hidden'); } });
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', e => { e.stopPropagation(); const s = Sound.toggle(); soundBtn.textContent = s ? '🔊 Sound on' : '🔈 Sound off'; });
addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowRight') pick((st.act + 1) % CONS.length);
  else if (e.key === 'ArrowUp' || e.key === 'ArrowLeft') pick((st.act + CONS.length - 1) % CONS.length);
  else if (e.key === 'Escape') ui.classList.toggle('hidden');
});
addEventListener('load', () => { startEngine(); pick(0); Object.assign(cam, goal); B = camBasis(cam); });
</script>
