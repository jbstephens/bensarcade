<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🐱 The Cats' Cozy Corner</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #1d2140; display: flex; align-items: center; justify-content: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 16px; touch-action: none; }
  #catPrint { display: none; }
  @media print {
    @page { size: letter; margin: 0.5in; }
    html, body { height: auto; background: #fff !important; display: block; overflow: visible; }
    body > *:not(#catPrint) { display: none !important; }
    body > #catPrint { display: block !important; }
  }
  /* the coloring page itself (also used by the on-screen print preview test) */
  #catPrint .cpPage { font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; color: #000; background: #fff; text-align: center; }
  #catPrint h1 { font-size: 30pt; margin: 0 0 4pt; }
  #catPrint .sub { font-size: 15pt; margin: 0 0 10pt; }
  #catPrint img { display: block; width: 100%; height: auto; max-height: 8in; object-fit: contain; border: 3px solid #000; border-radius: 14px; box-sizing: border-box; }
  #catPrint .names { font-size: 15pt; margin-top: 10pt; line-height: 1.5; }
  #catPrint .foot { font-size: 11pt; margin-top: 8pt; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="catPrint"></div>
<script>
// 🐱 THE CATS' COZY CORNER (💡 Ben's idea: a cozy corner with all the cats! Charlie and August designs by Ben!)
// Pages, Sammy, Rocky, Jimmy, Mimo, Tiger, Charlie and August. Tuck them in, breathe with them, play gently,
// watch the weather, hear Pages's bedtime stories and kind words, and print a coloring page.
// No timers, no losing, nothing scary. All sounds are VERY soft (one quiet volume knob, sine notes + a soft purr).
// Trophy 'catCozy' after 3 different cozy activities. Save: localStorage 'catCozyCorner'.
const C = document.getElementById('c'), W = 960, H = 540;
let ctx = C.getContext('2d');           // (let, so the coloring page can draw the same cats on paper)
let frame = 0, PRINTING = false;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (copied from Dusty's Cozy Corner) ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(20,30,60,.8)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function glow(x, y, r, col, a = 1) {                  // soft round light
  if (PRINTING) return; r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle (from Tiger's Starlight Adventure)
  if (PRINTING) return; ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
function limb(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function zzz(x, y, t) { for (let i = 0; i < 3; i++) { const u = ((t * 0.012 + i / 3) % 1); ctx.save(); ctx.globalAlpha = Math.sin(u * Math.PI); text('Z', x + u * 40 + Math.sin(u * 6) * 8, y - u * 90, 18 + i * 7, '#e1d9ff'); ctx.restore(); } }
// ---------- VERY soft sounds (copied from Dusty's Cozy Corner: everything goes through one quiet volume knob) ----------
let actx = null, master = null, soundOn = true;
function audio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.25; master.connect(actx.destination); }
    if (actx.state !== 'running') actx.resume();
  } catch (_) {}
  return actx;
}
function softNote(f, d = 0.6, v = 0.05, when = 0) {      // a gentle, round "bell" note
  if (!soundOn) return; const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.5, 0.05); }
function boop() { softNote(392 + Math.random() * 120, 0.35, 0.045); softNote(784, 0.25, 0.015, 0.05); }   // a soft little paw boop
function chord(base = 523) { softNote(base, 1, 0.045); softNote(base * 1.26, 1, 0.04, 0.25); softNote(base * 1.5, 1.4, 0.04, 0.5); }
function voice(line, rate = 0.85) {
  try { if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’-]/g, '')); u.rate = rate; u.pitch = 1.1; u.volume = 0.8; speechSynthesis.speak(u); } catch (_) {}
}
// a soft looping noise (rain). Only ever made AFTER a tap. Its volume follows the 🔇 Quiet button.
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function softNoise(filterHz, q = 0.7) {
  if (!actx || actx.state !== 'running') return null;
  try {
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = getNoise(); src.loop = true; f.type = 'lowpass'; f.frequency.value = filterHz; f.Q.value = q; g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    return { src, f, g };
  } catch (_) { return null; }
}
// 😺 a gentle PURR: very low-filtered noise that pulses ~24 times a second (a soft rumble, never loud)
function purrStart() {
  if (!actx || actx.state !== 'running') return null;
  try {
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), amp = actx.createGain(), lfo = actx.createOscillator(), depth = actx.createGain(), g = actx.createGain();
    src.buffer = getNoise(); src.loop = true; f.type = 'lowpass'; f.frequency.value = 150; f.Q.value = 0.9;
    amp.gain.value = 0.55; lfo.frequency.value = 23; depth.gain.value = 0.45; lfo.connect(depth); depth.connect(amp.gain);
    g.gain.value = 0; src.connect(f); f.connect(amp); amp.connect(g); g.connect(master); src.start(); lfo.start();
    return { src, f, g, lfo, extra: [lfo] };
  } catch (_) { return null; }
}
function noiseTo(n, v, secs = 0.6) { if (n && actx) try { n.g.gain.setTargetAtTime(soundOn ? v : 0, actx.currentTime, secs / 3); } catch (_) {} }
function noiseStop(n) {
  if (n && actx) try { n.g.gain.setTargetAtTime(0, actx.currentTime, 0.2); n.src.stop(actx.currentTime + 1.2); for (const e of n.extra || []) e.stop(actx.currentTime + 1.2); } catch (_) {}
}

<script>
// ========== 🐱 THE CATS (drawCat copied from Tiger's Starlight Adventure; x, y = between the feet) ==========
// Sammy: brown tabby, brown eyes. Jimmy: orange tabby, white paws, green eyes. Rocky: gray tabby, golden eyes.
// Mimo: shiny black cat, bright green eyes, pink collar + gold bell. Tiger: like Sammy, but GREEN eyes, mostly
// polka-dot spots and just a few stripes, with a soft golden star glow.
// =====================================================================
const CATS = {
  sammy: { fur: '#8d6e63', dark: '#4e342e', belly: '#e2c8a4', ear: '#ffb3c6', eye: '#a8641f', line: '#3e2a22', stripes: true, eyeRim: '#fff4dc' },
  jimmy: { fur: '#f59a3c', dark: '#c25e12', belly: '#fff3e0', ear: '#ffb3c6', eye: '#3fbf48', line: '#8a4a12', stripes: true, paws: '#ffffff', eyeRim: '#fffbe8' },
  rocky: { fur: '#a3a9b2', dark: '#646b75', belly: '#eceff3', ear: '#ffb3c6', eye: '#ffc93c', line: '#4a5059', stripes: true, paws: '#eceff3' },
  mimo:  { fur: '#1f1f28', dark: '#121218', belly: '#2c2c38', ear: '#ff9fbf', eye: '#8dff4a', line: '#5a5a70', shine: true, muzzle: '#34343f', blink: '#c9ffb0', whisk: 'rgba(255,255,255,.75)', collar: true },
  // 🤍💙 CHARLIE (Ben's design): a soft, normal WHITE cat, BLUE on the top of the head (from the middle of the eyes up),
  // both ears, the top of the back (where you pet) and the tail. Same color pattern as Sparks, on a real furry cat.
  charlie: { fur: '#fbfbfd', dark: '#dfe3ea', belly: '#ffffff', ear: '#ffb3c6', eye: '#5cbf4a', line: '#8790a3', cap: '#3f7fe0', eyeRim: '#ffffff' },
  tiger: { fur: '#a07856', dark: '#4a3020', belly: '#ecd3ad', ear: '#ffb3c6', eye: '#5ad15a', line: '#3e2a22', spots: true, fewStripes: true, glow: true, eyeRim: '#fff6d8' },
};
function catLine(c) { ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }
function drawTail(c, t, up, pose) {
  const sw = Math.sin(t * 0.08) * (pose === 'happy' ? 16 : 9);
  ctx.strokeStyle = c.line; ctx.lineCap = 'round'; ctx.lineWidth = 11;
  ctx.beginPath(); ctx.moveTo(-18, -22);
  if (up) ctx.bezierCurveTo(-34, -30, -34 + sw * 0.4, -52, -26 + sw, -62);
  else ctx.bezierCurveTo(-36, -22, -40, -34 + sw * 0.5, -44 + sw * 0.3, -46 + sw * 0.6);
  ctx.stroke();
  ctx.strokeStyle = c.cap || c.fur; ctx.lineWidth = 8; ctx.stroke();
  if (c.stripes || c.spots) { ctx.strokeStyle = c.dark; ctx.lineWidth = 8; ctx.setLineDash(c.spots ? [3, 9] : [4, 6]); ctx.stroke(); ctx.setLineDash([]); }
}
function drawLeg(c, x1, y1, x2, y2) {
  ctx.strokeStyle = c.line; ctx.lineWidth = 8; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
  ctx.strokeStyle = c.fur; ctx.lineWidth = 5.5; ctx.stroke();
  circle(x2, y2, 3.8, c.paws || c.fur);
}
function drawLegs(c, pose, t) {
  let a = 0, b = 0;
  if (pose === 'walk') { a = Math.sin(t * 0.32) * 7; b = -a; }
  if (pose === 'run') { a = Math.sin(t * 0.5) * 11; b = -a; }
  const legs = pose === 'jump' || pose === 'karate' ? [[-12, -4, 6], [12, 4, 6], [-6, -6, 8], [16, 6, 8]]
             : pose === 'pounce' ? [[-14, -8, 4], [-8, -10, 4], [16, 12, 0], [22, 14, 0]]
             : [[-13, a, 0], [-7, b, 0], [11, b, 0], [17, a, 0]];
  for (const [lx, dx, lift] of legs) drawLeg(c, lx, -16, lx + dx * 0.6, -3 - lift);
}
function drawHead(c, hx, hy, t, eyesShut, mouthOpen, grumpy) {
  for (const ex of [-8, 6]) {                          // ears
    ctx.fillStyle = c.cap || c.fur; catLine(c);
    ctx.beginPath(); ctx.moveTo(hx + ex - 5, hy - 7); ctx.lineTo(hx + ex + 1, hy - 21); ctx.lineTo(hx + ex + 8, hy - 7); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = c.ear; ctx.beginPath(); ctx.moveTo(hx + ex - 2, hy - 8); ctx.lineTo(hx + ex + 1, hy - 16); ctx.lineTo(hx + ex + 5, hy - 8); ctx.closePath(); ctx.fill();
  }
  ctx.fillStyle = c.fur; catLine(c); ctx.beginPath(); ctx.ellipse(hx, hy, 14, 12.5, 0, 0, 7); ctx.fill(); ctx.stroke();
  if (c.cap) { ctx.save(); ctx.beginPath(); ctx.ellipse(hx, hy, 14, 12.5, 0, 0, 7); ctx.clip(); ctx.fillStyle = c.cap; ctx.beginPath();   // Charlie's blue cap
    ctx.moveTo(hx - 16, hy - 1); ctx.quadraticCurveTo(hx + 3, hy - 4, hx + 16, hy - 1); ctx.lineTo(hx + 16, hy - 16); ctx.lineTo(hx - 16, hy - 16); ctx.fill(); ctx.restore();
    catLine(c); ctx.beginPath(); ctx.ellipse(hx, hy, 14, 12.5, 0, 0, 7); ctx.stroke(); }
  if (c.stripes || c.fewStripes) {                     // tabby "M" on the forehead
    ctx.strokeStyle = c.dark; ctx.lineWidth = 2.2;
    ctx.beginPath(); ctx.moveTo(hx - 6, hy - 5); ctx.lineTo(hx - 3, hy - 10); ctx.lineTo(hx, hy - 6); ctx.lineTo(hx + 3, hy - 10); ctx.lineTo(hx + 6, hy - 5); ctx.stroke();
  }
  if (c.stripes) { ctx.beginPath(); ctx.moveTo(hx - 14, hy + 1); ctx.lineTo(hx - 9, hy + 1); ctx.moveTo(hx - 13, hy + 5); ctx.lineTo(hx - 9, hy + 4); ctx.stroke(); }
  if (c.spots) { for (const [sx, sy, r] of [[-10, 2, 1.8], [-7, 6, 1.5], [-11, -4, 1.4], [-4, -10, 1.3]]) circle(hx + sx, hy + sy, r, c.dark); }
  if (c.shine) ellipse(hx - 4, hy - 7, 6, 2.6, 'rgba(255,255,255,.22)', -0.3);
  ellipse(hx + 7, hy + 5, 7.5, 5.5, c.muzzle || c.belly);              // muzzle
  const blink = eyesShut || (Math.floor(t + hx * 7) % 190) < 6;
  for (const ex of [hx - 1, hx + 8]) {
    if (blink) { ctx.strokeStyle = c.blink || '#333'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, hy - 1, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else {
      if (c.eyeRim) ellipse(ex, hy - 1, 4.4, 5.2, c.eyeRim);
      ellipse(ex, hy - 1, 3.6, 4.4, c.eye); ellipse(ex + 0.8, hy - 0.5, 1.6, 3.2, '#111'); circle(ex - 0.6, hy - 2.6, 1.4, '#fff');
      if (grumpy) {                                    // droopy grumpy eyelids + cross eyebrows
        ctx.fillStyle = c.fur; ctx.beginPath(); ctx.ellipse(ex, hy - 1, 5, 5.4, 0, Math.PI, 2 * Math.PI); ctx.fill();
        ctx.strokeStyle = c.dark; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(ex - 4, hy - 7 + (ex > hx + 3 ? 2 : -1)); ctx.lineTo(ex + 4, hy - 7 + (ex > hx + 3 ? -1 : 2)); ctx.stroke();
      }
    }
  }
  ctx.fillStyle = '#ff8fab'; ctx.beginPath(); ctx.moveTo(hx + 10, hy + 2); ctx.lineTo(hx + 15, hy + 2); ctx.lineTo(hx + 12.5, hy + 5); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = c.whisk ? '#aaa' : '#555'; ctx.lineWidth = 1.4; ctx.beginPath();
  if (grumpy && !mouthOpen) { ctx.moveTo(hx + 8.5, hy + 9); ctx.quadraticCurveTo(hx + 12.5, hy + 5.5, hx + 16, hy + 9); }
  else { ctx.moveTo(hx + 12.5, hy + 5); ctx.quadraticCurveTo(hx + 11, hy + 8.5, hx + 8.5, hy + 7); ctx.moveTo(hx + 12.5, hy + 5); ctx.quadraticCurveTo(hx + 14, hy + 8.5, hx + 16, hy + 7); }
  ctx.stroke();
  if (mouthOpen) ellipse(hx + 12.5, hy + 8.5, 2.6, 2.2, '#d94f70');
  ctx.strokeStyle = c.whisk || 'rgba(60,60,60,.7)'; ctx.lineWidth = 1; ctx.beginPath();
  for (const d of [-2, 1, 4]) { ctx.moveTo(hx + 15, hy + 4); ctx.lineTo(hx + 27, hy + 2 + d * 1.3); ctx.moveTo(hx + 3, hy + 4); ctx.lineTo(hx - 8, hy + 2 + d * 1.3); }
  ctx.stroke();
  if (c.bow) { ctx.fillStyle = '#7ec8ff'; ctx.beginPath(); ctx.moveTo(hx - 6, hy - 12); ctx.lineTo(hx - 13, hy - 17); ctx.lineTo(hx - 12, hy - 8); ctx.closePath(); ctx.moveTo(hx - 6, hy - 12); ctx.lineTo(hx + 1, hy - 17); ctx.lineTo(hx, hy - 8); ctx.closePath(); ctx.fill(); circle(hx - 6, hy - 12, 2.2, '#4aa3ff'); }
}
function bodyMarks(c, sp) {                            // stripes, or Tiger's polka dots (+ just a few stripes)
  if (c.stripes) { ctx.strokeStyle = c.dark; ctx.lineWidth = 3.2; ctx.lineCap = 'round'; ctx.beginPath(); for (const [sx, sy] of sp.stripes) { ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 3, sy + 7, sx + 1, sy + 12); } ctx.stroke(); }
  if (c.spots) {
    for (const [sx, sy, r] of sp.spots) circle(sx, sy, r, c.dark);
    ctx.strokeStyle = c.dark; ctx.lineWidth = 3; ctx.lineCap = 'round'; ctx.beginPath();
    for (const [sx, sy] of sp.few) { ctx.moveTo(sx, sy); ctx.quadraticCurveTo(sx + 3, sy + 6, sx + 1, sy + 10); } ctx.stroke();
  }
}
const MARKS_STAND = { stripes: [[-12, -34], [-4, -34], [4, -34], [12, -34]], spots: [[-10, -27, 2.8], [-1, -30, 2.6], [8, -26, 2.8], [-15, -19, 2.2], [14, -32, 2], [3, -21, 2.2], [-6, -20, 1.8]], few: [[-15, -34], [16, -33]] };
const MARKS_SIT = { stripes: [[-15, -32], [-15, -24], [-14, -16]], spots: [[-10, -30, 2.5], [-7, -20, 2.3], [-12, -10, 2.1], [-2, -34, 1.8]], few: [[-14, -36]] };
function drawBody(c, pose) {
  const rx = pose === 'pounce' ? 25 : 21, ry = pose === 'pounce' ? 11 : 13;
  ctx.fillStyle = c.fur; catLine(c); ctx.beginPath(); ctx.ellipse(2, -22, rx, ry, 0, 0, 7); ctx.fill(); ctx.stroke();
  ellipse(4, -15, rx * 0.65, ry * 0.4, c.belly);
  if (c.cap) { ctx.save(); ctx.beginPath(); ctx.ellipse(2, -22, rx, ry, 0, 0, 7); ctx.clip(); ellipse(0, -34, rx * 0.95, 7.5, c.cap); ctx.restore(); catLine(c); ctx.beginPath(); ctx.ellipse(2, -22, rx, ry, 0, 0, 7); ctx.stroke(); }
  bodyMarks(c, MARKS_STAND);
  if (c.shine) ellipse(-2, -30, 12, 3.2, 'rgba(255,255,255,.2)', -0.08);
}
// x, y = between the cat's feet. o = { face, pose, t, s, mouth, shut, grumpy, rot }
function drawCat(who, x, y, o = {}) {
  const c = CATS[who] || CATS.sammy, face = o.face || 1, s = o.s || 1, t = o.t === undefined ? frame : o.t, pose = o.pose || 'idle';
  if (c.glow) {                                        // ⭐ Tiger's soft golden star glow
    const p = 0.75 + Math.sin(t * 0.05) * 0.15;
    glow(x, y - 32 * s, 95 * s, 'rgba(255,214,110,.55)', p);
  }
  ctx.save(); ctx.translate(x, y); ctx.scale(face * s, s);
  if (pose !== 'flip' && pose !== 'spin') ellipse(0, 0, 24, 4.5, 'rgba(0,0,0,.18)');
  if (pose === 'sleep') { drawSleepCat(c, t, who); ctx.restore(); twinkles(c, x, y, s, t); return; }
  if (pose === 'sit') { drawSitCat(c, t, o, who); ctx.restore(); twinkles(c, x, y, s, t); return; }
  let bob = 0, tilt = o.rot || 0;
  if (pose === 'happy') bob = -Math.abs(Math.sin(t * 0.18)) * 9;
  if (pose === 'walk') bob = -Math.abs(Math.sin(t * 0.32)) * 2;
  if (pose === 'run') bob = -Math.abs(Math.sin(t * 0.5)) * 4;
  if (pose === 'jump') tilt += -0.12;
  if (pose === 'pounce') tilt += 0.12;
  ctx.translate(0, bob);
  if (pose === 'roll' || pose === 'spin' || pose === 'flip') { ctx.translate(0, -22); ctx.rotate(pose === 'roll' ? Math.sin(t * 0.15) * 2.6 : t * (pose === 'spin' ? 0.45 : -0.3)); ctx.translate(0, 22); }

  quilt(0, -148, 480, 150, ['#f8bbd0', '#ffe082', '#b3e5fc', '#c5e1a5', '#d1c4e9'], 10);

    backBtn();

  open(i) { st.s = i; st.p = 0; softNote(659, 0.6, 0.035); voice(STORIES[i].title + '. ' + STORIES[i].pages[0][1]); },

<script>
// 💌 KIND WORDS FROM THE CATS
const KIND = {
  pages:   ["It's okay to feel frustrated. You're doing great, Ben!", "Every good story has a hard part in the middle. Then it gets better!"],
  sammy:   ["Everyone needs a cozy break sometimes. Purr, purr.", "I'm so proud of you for trying, Ben."],

  jimmy:   ["Sometimes I feel grumpy too. Then I take a nap and feel better. You will too!", "A hard boss is just practice. You get a little stronger every time you try!"],
  mimo:    ["You're a great friend, Ben. Here's a soft head bonk!", "Trying hard things is brave. And you are SO brave!"],
  tiger:   ["You are loved, Ben, as big as the whole starry sky.", "Every time you try again, a star twinkles just for you."],
  charlie: ["Feeling frustrated means you really care. That's okay!", "Slow and steady! Tricky things get easier each time you try."],
  august:  ["Big fluffy hug! Feelings are like clouds. They float away.", "Ben, you invented me! I love my big fluffy tail. You're a great inventor!"],

  start() { kw = { i: -1, k: {}, fx: [] }; markDone('kind'); this.next(); },

    const n = kw.k[w] = ((kw.k[w] === undefined ? -1 : kw.k[w]) + 1) % KIND[w].length;

  draw() {

    kitty(w, 200, 400, { s: 3, shut: talkT < 60, swish: w === 'august' }); nameTag(w, 200, 425, 22);
    hearts(kw.fx);

// 🖨️ PRINT A COZY PAGE: all 8 cats in a blanket pile, black outlines on white (made from the real drawing), letter size, no emoji
let printImg = null, printURL = '';
function makeColoringPage() {
  const PW = 1200, PH = 1020, cv = document.createElement('canvas'); cv.width = PW; cv.height = PH;
  const keep = ctx; ctx = cv.getContext('2d'); PRINTING = true;
  try {
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH);
    ctx.fillStyle = '#e0e0e0'; ctx.fillRect(0, PH - 70, PW, 70);                         // the floor
    circle(1060, 110, 60, '#fff3b0'); circle(1090, 92, 54, '#fff');                      // a sleepy moon
    for (const [x, y, r] of [[120, 100, 34], [330, 170, 26], [560, 80, 30], [790, 170, 24], [960, 260, 22], [110, 300, 24]]) star(x, y, r, '#ffe9a0');
    for (const [x, y, r] of [[440, 240, 26], [860, 70, 22], [1120, 400, 24]]) heart(x, y, r, '#ffc0d0');

  const src = cv.getContext('2d').getImageData(0, 0, PW, PH), d = src.data, edge = new Uint8Array(PW * PH);
  const diff = (a, b) => Math.abs(d[a] - d[b]) + Math.abs(d[a + 1] - d[b + 1]) + Math.abs(d[a + 2] - d[b + 2]);
  for (let y = 0; y < PH - 1; y++) for (let x = 0; x < PW - 1; x++) { const i = (y * PW + x) * 4; if (Math.max(diff(i, i + 4), diff(i, i + PW * 4)) > 50) edge[y * PW + x] = 1; }
  const out = cv.getContext('2d').createImageData(PW, PH), o = out.data;
  for (let y = 1; y < PH - 1; y++) for (let x = 1; x < PW - 1; x++) {                    // thicken the lines a little, so crayons stay inside

}
