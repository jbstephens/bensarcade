<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🦸 Make Yourself a Game Hero</title>
<script src="touchpad.js?v=6"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(-45deg, #d6ecff 0 36px, #c5e2ff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1 { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff3d6e; letter-spacing: 1px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; } .b-print2 { background: #ffb347; } .b-all { background: #c3a6ff; }
  .b-power { background: #ffe066; } .b-save { background: #8ef08e; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🦸 hero builder ---------- */
  #home { flex-direction: column; padding: 6px 10px 10px; gap: 6px; }
  #hTop { display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap; }
  #names { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
  .nm { font: inherit; font-weight: bold; font-size: 17px; border: 3px solid #333; border-radius: 30px; padding: 5px 12px;
    background: #fff; cursor: pointer; box-shadow: 0 3px 0 #333; min-height: 42px; }
  .nm.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 3px 0 #ff3d6e; }
  .nm i { font-style: normal; font-size: 13px; }
  #hMain { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #prevBox { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 18px; overflow: hidden;
    box-shadow: 0 6px 0 #2b7bd9; position: relative; }
  #prevBox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; overflow: visible; }
  #heroName { text-align: center; font-size: clamp(16px, 1.9vw, 26px); font-weight: bold; background: #fffbe0;
    border: 4px solid #333; border-radius: 14px; padding: 2px 8px; }
  #acts { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #acts .btn { font-size: 18px; line-height: 1.1; }
  #build { width: min(48vw, 540px); display: flex; flex-direction: column; gap: 6px; min-height: 0; }
  #tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .tab { font: inherit; font-weight: bold; font-size: 15px; border: 3px solid #333; border-radius: 12px; background: #fff;
    padding: 4px 2px; cursor: pointer; min-height: 46px; line-height: 1.05; }
  .tab.on { background: #ff3d6e; color: #fff; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 4px solid #333;
    border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .grp { font-size: 18px; font-weight: bold; margin: 2px 2px -2px; }
  .row { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
  .row.cols { grid-template-columns: repeat(auto-fill, minmax(46px, 1fr)); }
  .row.five { grid-template-columns: repeat(5, 1fr); } .row.five .opt b { font-size: 13px; letter-spacing: -1px; }
  .opt { font: inherit; font-weight: bold; font-size: 15px; border: 3px solid #333; border-radius: 12px; background: #f4f8ff;
    cursor: pointer; padding: 4px 3px; min-height: 52px; line-height: 1.1; }
  .opt b { display: block; font-size: 24px; }
  .opt.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 0 0 3px #ff3d6e; }
  .opt.sw { min-height: 46px; border-radius: 50%; aspect-ratio: 1; padding: 0; }
  .opt.sw.on { box-shadow: 0 0 0 3px #fff, 0 0 0 6px #ff3d6e; }
  /* power test animations (hero lives in a <g class="ha">) */
  .ha { transform-box: fill-box; transform-origin: 50% 100%; }
  .fx-jump .ha { animation: hJump 1.1s ease-in-out; }
  .fx-cat .ha { animation: hDash 1.1s ease-in-out; }
  .fx-grow .ha { animation: hGrow 1.4s ease-in-out; }
  .fx-freeze .ha, .fx-freeze .sk { animation: hShiver 1.4s linear; }
  @keyframes hJump { 0%,100% { transform: translateY(0); } 15% { transform: translateY(8px) scaleY(.9); } 50% { transform: translateY(-110px); } 85% { transform: translateY(6px) scaleY(.92); } }
  @keyframes hDash { 0%,100% { transform: translateX(0); } 30% { transform: translateX(-90px) skewX(14deg); } 65% { transform: translateX(90px) skewX(-14deg); } }
  @keyframes hGrow { 0%,100% { transform: scale(1); } 40%,70% { transform: scale(1.35); } }
  @keyframes hShiver { 0%,100% { transform: translateX(0); } 20%,60% { transform: translateX(-2px); } 40%,80% { transform: translateX(2px); } }
  .fxl { opacity: 0; }
  .fx-on .fxl { animation: fxIn 1.5s ease-in-out; }
  @keyframes fxIn { 0%,100% { opacity: 0; } 15%,80% { opacity: 1; } }
  .fly { transform-box: fill-box; transform-origin: center; opacity: 0; }
  .fx-on .fly { animation: fly 1.2s ease-out; }
  @keyframes fly { 0% { opacity: 1; transform: translate(0, 0) scale(.3); } 90% { opacity: 1; } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1.2); } }
  .pop { transform-box: view-box; transform: scale(0); }
  .fx-on .pop { animation: pop 1.5s ease-in-out; }
  @keyframes pop { 0%,100% { transform: scale(0); } 25%,80% { transform: scale(1); } }
  /* ---------- 🖨️ printables gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead p { margin: 2px 0 6px; font-size: clamp(16px, 2.1vw, 21px); font-weight: bold; }
  #gBtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  #gBtns .btn { font-size: 18px; min-height: 48px; padding: 4px 14px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #2b7bd9; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  /* ---------- one sheet ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #2b7bd9; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #modes, .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #pens { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .pen { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; }
  .pen.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #hMain, #view { flex-direction: column; }
    #build { width: 100%; height: 46%; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) {
    .btn { min-height: 44px; font-size: 16px; padding: 4px; } #acts .btn { font-size: 15px; }
    #pHelp { font-size: 14px; } .nm { min-height: 36px; font-size: 15px; padding: 3px 9px; }
    .tab { min-height: 40px; font-size: 13px; } h1 { font-size: 26px; }
  }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="hTop"><h1>🦸 Make Yourself a Game Hero</h1><div id="names"></div></div>
  <div id="hMain">
    <div id="stage">
      <div id="prevBox"></div>
      <div id="heroName"></div>
      <div id="acts">
        <button class="btn b-power" id="bPower">⚡ Power<br>test!</button>
        <button class="btn b-magic" id="bRandom">✨ Magic<br>hero!</button>
        <button class="btn b-save" id="bSave">💾 Save<br>my hero</button>
        <button class="btn b-print2" id="bSheets">🖨️ Pages<br>to print</button>
      </div>
    </div>
    <div id="build"><div id="tabs"></div><div id="opts"></div></div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <h1>🖨️ HERO PAGES TO PRINT</h1>
    <p>Grab a pencil! Tap a page to open it. Every page comes blank OR with your hero.</p>
    <div id="gBtns">
      <button class="btn b-back" id="bHome">⬅️ Back to my hero</button>
      <button class="btn b-all" id="bAllBlank">🖨️ Print all (blank)</button>
      <button class="btn b-all" id="bAllHero">🖨️ Print all (my hero)</button>
    </div>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="modes">
      <button class="btn b-mode" id="bBlank">📄 Blank<br>(anyone!)</button>
      <button class="btn b-mode" id="bMine">🦸 My hero<br>(filled in)</button>
    </div>
    <div id="pHelp"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div id="pens"></div>
    <div class="two">
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear crayon</button>
    </div>
    <button class="btn b-all" id="bPrintAll">🖨️ Print all 7 pages</button>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🦸 MAKE YOURSELF A GAME HERO: build a hero on screen, then print pencil pages (blank or "my hero")
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// Every sheet draws in two ways: LINE = false is full color, LINE = true is black lines to color in.
// Character art style is copied from the Art Gallery (gradients + highlights, no SVG filters).
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
