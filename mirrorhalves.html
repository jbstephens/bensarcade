<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🪞 Mirror Half Drawings</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3ecff 0 36px, #d4e2ff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead h1 { margin: 0; font-size: clamp(28px, 5vw, 54px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #7c5cff; letter-spacing: 2px; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; }
  #topBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 4px 10px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #6a4fe0; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb:active { transform: scale(.96); }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #6a4fe0; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #modes, .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .pens { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9;
    border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #names .btn { font-size: 16px; min-height: 44px; padding: 4px; background: #fff; }
  #names .btn.on { background: #ffe066; border-color: #ff3d6e; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-mode { background: #fff; font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; }
  .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; }
  .b-peek { background: #9bf6ff; } .b-peek.on { background: #ffe066; border-color: #ff3d6e; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- 🪄 Mirror Magic ---------- */
  #magic { flex-direction: row; gap: 10px; padding: 10px; }
  #mBoard { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #mWrap { position: relative; aspect-ratio: 10 / 7; width: 100%; max-height: 100%; background: #fff;
    border: 5px solid #333; border-radius: 14px; box-shadow: 0 8px 0 #6a4fe0; overflow: hidden; }
  #mCanvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
  #mSide { width: min(36vw, 360px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #mSide h2 { margin: 0; font-size: 26px; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view, #magic { flex-direction: column; }
    #paper, #mBoard { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side, #mSide { width: 100%; max-height: 42vh; }
  }
  @media (max-height: 560px) { .btn { min-height: 48px; font-size: 17px; padding: 5px; } #pHelp { font-size: 15px; } }
  /* ---------- PRINT: only the sheet (or a set of sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <h1>🪞 MIRROR HALF DRAWINGS</h1>
    <p>Half a picture is missing! Draw the other half so it matches like a mirror.</p>
  </div>
  <div id="topBtns">
    <button class="btn b-magic" id="bMagicOpen">🪄 Mirror Magic (draw on screen!)</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="modes">
      <button class="btn b-mode" id="bColor">🎨 Color<br>picture</button>
      <button class="btn b-mode" id="bLine">🖍️ Blank<br>(color it in!)</button>
    </div>
    <div id="pHelp"></div>
    <div id="names" class="hide"></div>
    <div class="pens" id="pens"></div>
    <div class="two">
      <button class="btn b-peek" id="bPeek">👀 Peek at answer</button>
      <button class="btn b-clear" id="bClear">🧽 Clear my lines</button>
    </div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two">
      <button class="btn b-print2" id="bPrintAns">🖨️ Answer page</button>
      <button class="btn b-all" id="bPrintAll">🖨️ Print this level</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pictures</button>
  </div>
</div>
<div id="magic" class="screen">
  <div id="mBoard"><div id="mWrap"><canvas id="mCanvas"></canvas></div></div>
  <div id="mSide">
    <h2>🪄 Mirror Magic</h2>
    <div id="pHelp2" style="font-size:18px;text-align:center;background:#fffbe0;border:4px solid #333;border-radius:14px;padding:6px 8px;">Draw on one side. The mirror draws the other side for you!</div>
    <div class="pens" id="mPens"></div>
    <div class="two">
      <button class="btn b-mode on" id="bTwo">↔️ 2 sides</button>
      <button class="btn b-mode" id="bFour">✳️ 4 sides</button>
      <button class="btn b-mode on" id="bThin">✏️ Thin</button>
      <button class="btn b-mode" id="bFat">🖍️ Fat</button>
    </div>
    <div class="two">
      <button class="btn b-clear" id="bUndo">↩️ Undo</button>
      <button class="btn b-clear" id="bMClear">🧽 Clear</button>
    </div>
    <button class="btn b-print" id="bMPrint">🖨️ Print my drawing</button>
    <button class="btn b-back" id="bMBack">⬅️ Back to pictures</button>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🪞 MIRROR HALF DRAWINGS: printable symmetry sheets + 🪄 Mirror Magic drawing
// Every sheet is a portrait letter page, viewBox 0 0 800 1000. The mirror line is x = 400.
// Every picture is built ONCE, clipped to its left half, and the right half is that same
// left half flipped (translate(800) scale(-1 1)), so the answer is EXACTLY the mirror.
// Art helpers + characters are copied from the Craft Room / Art Gallery.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
const FOLD = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-dasharray="10 7" stroke-linecap="round"/>';
const HOLE = (x, y, rx, ry) => '<ellipse data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(rx) + '" ry="' + n(ry) + '" fill="#fff" stroke="' + INK + '" stroke-width="3.5" stroke-dasharray="11 7"/>';
const PUNCH = (x, y, r) => '<circle data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r || 11) + '" fill="#fff" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 5"/>' +
  '<path d="M' + n(x - 5) + ' ' + n(y) + ' L' + n(x + 5) + ' ' + n(y) + ' M' + n(x) + ' ' + n(y - 5) + ' L' + n(x) + ' ' + n(y + 5) + '" stroke="' + INK + '" stroke-width="2"/>';
// a scissors mark on a cut line
const SCIS = (x, y, rot, s) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + (s || 26) + '" text-anchor="middle" dominant-baseline="central"' + (rot ? ' transform="rotate(' + rot + ' ' + n(x) + ' ' + n(y) + ')"' : '') + '>✂️</text>';
function svgWrap(body, ex) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs>' +
    '<rect x="0" y="0" width="800" height="1000" fill="#fff"/>' + body + '</svg>';
}
// =====================================================================
// CHARACTERS (copied from the Art Gallery; each drawn around 0,0, about 120 tall)
// =====================================================================
function robo(o) {
  o = o || {}; const H = o.head || '#f4f7fb', B = o.body || H, V = o.visor || '#1d2836', EY = o.eye || '#40c4ff',
    PD = o.pod || '#2979ff', RIM = o.rim || '#bff3ff', LG = o.legs || B; let s = '';
  if (o.morph === 'rocket') s += R(-30, 2, 22, 40, 9, vshade('#ff3d00'), OL, 2.5) + R(-28, 16, 18, 6, 2, '#ffd740', 0) + P('M-30 40 L-36 52 L-8 52 L-14 40 Z', '#bf360c', OL, 2) + jetFlame(-22, 52, 1.1, '#ffab40');
  if (o.boots) s += jetFlame(-9, 54, .9, o.flame) + jetFlame(9, 54, .9, o.flame);
  if (!o.noBody) {

function blip(f, when, len) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (when || 0);
    o.frequency.setValueAtTime(f, t); o.type = 'triangle';
    g.gain.setValueAtTime(0.15, t); g.gain.exponentialRampToValueAtTime(0.001, t + (len || 0.15));
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + (len || 0.15) + 0.01);
  } catch (_) {}
}

function setMode(m) {
  state.mode = m; saveState();
  if (view === 'sheet') { renderSheet(); updateSide(); }
}
function togglePeek() {

  peek = !peek; if (peek) { state.peeked[SHEETS[cur].id] = 1; saveState(); blip(880); }
  renderSheet(); updateSide();
}
function updateSide() {
  const p = SHEETS[cur], line = isLine(), pic = isPic();
  $('bColor').classList.toggle('on', !line); $('bLine').classList.toggle('on', line);
  $('pHelp').textContent = pic ? KINDS[p.kind].help + ' Try it right here with a crayon, or print it!' :
    p.id === 'ownhalf' ? 'Draw half a picture on the left side. Then a friend draws the mirror half!' :
    p.id === 'answers' ? 'All the finished pictures. Check if yours match!' : 'Tap a name for the badge. Print it, color it, cut it out!';
  $('bPeek').classList.toggle('on', peek); $('bPeek').textContent = peek ? '🙈 Hide answer' : '👀 Peek at answer';
  $('bPeek').classList.toggle('hide', !pic);
  $('names').classList.toggle('hide', p.id !== 'badge');
  $('names').querySelectorAll('.btn').forEach(b => b.classList.toggle('on', b.textContent === state.name));
  $('bPrintAll').textContent = KINDS[p.kind].all;
}
function setView(v) {
  view = v;
  $('gallery').classList.toggle('on', v === 'gallery');
  $('view').classList.toggle('on', v === 'sheet');
  $('magic').classList.toggle('on', v === 'magic');
}
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    if (k === 0 || p.kind !== SHEETS[k - 1].kind) {
      const h = document.createElement('div'); h.className = 'sec';
      h.innerHTML = '<span>' + KINDS[p.kind].title + '</span>';
      const b = document.createElement('button'); b.className = 'btn b-all'; b.textContent = KINDS[p.kind].all;
      b.addEventListener('click', () => printSet(p.kind)); h.appendChild(b); g.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    d.innerHTML = buildSheet(k, false) + '<b>' + esc(p.name) + (state.printed[p.id] ? ' ✅' : '') + '</b>';
    d.addEventListener('click', () => { sel = k; openSheet(k); });
    g.appendChild(d);
  });
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openSheet(k) {
  cur = k; sel = k; peek = false;
  $('pTitle').textContent = SHEETS[k].name;
  renderSheet(); updateSide(); setView('sheet'); sizeCanvas(); blip(660);
}
function backToGallery() { endPrintAll(); setView('gallery'); renderGallery(); markSel(); }
function clearSheet() { state.traces[SHEETS[cur].id] = []; saveState(); drawTraces(); blip(330); }
// ---------- crayons on the sheet: try drawing the other half on screen ----------
const PENS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222'];
const BORDER = 5;
function sheetBox() {
  const r = $('wrap').getBoundingClientRect(), w = r.width - BORDER * 2, h = r.height - BORDER * 2;
  const s = Math.min(w / 800, h / 1000) || 1;
  return { r, s, ox: BORDER + (w - 800 * s) / 2, oy: BORDER + (h - 1000 * s) / 2 };
}
const f1 = v => Math.round(v * 10) / 10;
function toSheet(e) { const b = sheetBox(); return [f1((e.clientX - b.r.left - b.ox) / b.s), f1((e.clientY - b.r.top - b.oy) / b.s)]; }
function sizeCanvas() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  cv.classList.add('on');
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(b.r.width * dpr)); cv.height = Math.max(1, Math.round(b.r.height * dpr));
  drawTraces();
}
function strokeAll(ctx, list, w) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  list.forEach(t => { ctx.lineWidth = t.w || w || 7; ctx.strokeStyle = t.c; ctx.beginPath(); for (let i = 0; i < t.p.length; i += 2) (i ? ctx.lineTo : ctx.moveTo).call(ctx, t.p[i], t.p[i + 1]); if (t.p.length === 2) ctx.lineTo(t.p[0] + 0.1, t.p[1]); ctx.stroke(); });
}
function drawTraces() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.setTransform(dpr * b.s, 0, 0, dpr * b.s, dpr * b.ox, dpr * b.oy);
  strokeAll(ctx, state.traces[SHEETS[cur].id] || [], 7);
}
function penDown(e) {
  if (view !== 'sheet') return;
  if (document.body.classList.contains('pAll')) endPrintAll();
  e.preventDefault();
  const [x, y] = toSheet(e), id = SHEETS[cur].id;
  stroke = { c: pen, p: [x, y] };
  (state.traces[id] = state.traces[id] || []).push(stroke);
  if (state.traces[id].length > 300) state.traces[id].shift();
  drawTraces();
}
function penMove(e) {
  if (!stroke) return;
  const [x, y] = toSheet(e), p = stroke.p, k = p.length;
  if (Math.hypot(x - p[k - 2], y - p[k - 1]) < 3) return;
  p.push(x, y); drawTraces();
}
function penUp() { if (!stroke) return; stroke = null; saveState(); }
function renderPens(boxId, get, set) {
  const box = $(boxId); box.innerHTML = '';
  PENS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (c === get() ? ' sel' : ''); s.style.background = c;
    s.addEventListener('click', () => { set(c); box.querySelectorAll('.sw').forEach((el, i) => el.classList.toggle('sel', PENS[i] === c)); blip(700, 0, .06); });
    box.appendChild(s);
  });
}
function renderNames() {
  const box = $('names'); box.innerHTML = '';
  NAMES.forEach(nm => {
    const b = document.createElement('button'); b.className = 'btn' + (nm === state.name ? ' on' : ''); b.textContent = nm;
    b.addEventListener('click', () => { state.name = nm; saveState(); renderSheet(); updateSide(); blip(780); });
    box.appendChild(b);
  });
}
// =====================================================================
// 🪄 MIRROR MAGIC: draw on one side, the mirror draws the other side live
// strokes are saved in board units (1000 x 700); each stroke remembers its mirror mode (2 or 4 sides)
// =====================================================================
const MW = 1000, MH = 700;
let mPen = '#9b59ff', mWide = 8, mMode = 2, mStroke = null;
function mBox() { const r = $('mCanvas').getBoundingClientRect(); return { r, s: (r.width / MW) || 1 }; }
function toBoard(e) { const b = mBox(); return [f1(Math.max(0, Math.min(MW, (e.clientX - b.r.left) / b.s))), f1(Math.max(0, Math.min(MH, (e.clientY - b.r.top) / b.s)))]; }
// every stroke drawn 2 times (left + right mirror) or 4 times (left/right + up/down)
function paintMagic(ctx, s, guides) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, MW * s, MH * s);
  if (guides) {
    ctx.setTransform(s, 0, 0, s, 0, 0); ctx.strokeStyle = '#b8a6ff'; ctx.lineWidth = 4;
    if (ctx.setLineDash) ctx.setLineDash([16, 12]);
    ctx.beginPath(); ctx.moveTo(MW / 2, 0); ctx.lineTo(MW / 2, MH);
    if (mMode === 4) { ctx.moveTo(0, MH / 2); ctx.lineTo(MW, MH / 2); }
    ctx.stroke(); if (ctx.setLineDash) ctx.setLineDash([]);
  }
  const flips = [[1, 1], [-1, 1], [1, -1], [-1, -1]];
  state.magicArt.forEach(t => {
    flips.slice(0, t.m === 4 ? 4 : 2).forEach(([fx, fy]) => {
      ctx.setTransform(s * fx, 0, 0, s * fy, fx < 0 ? MW * s : 0, fy < 0 ? MH * s : 0);
      strokeAll(ctx, [t]);
    });
  });
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
function sizeMagic() {
  const cv = $('mCanvas'); if (!cv || !cv.getContext) return;
  const b = mBox(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(b.r.width * dpr)); cv.height = Math.max(1, Math.round(b.r.height * dpr));
  drawMagic();
}
function drawMagic() {
  const cv = $('mCanvas'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  paintMagic(ctx, (mBox().s || 1) * (window.devicePixelRatio || 1), true);
}
function magicDown(e) {
  if (view !== 'magic') return;
  e.preventDefault();
  const [x, y] = toBoard(e);
  mStroke = { c: mPen, w: mWide, m: mMode, p: [x, y] };
  state.magicArt.push(mStroke);
  if (state.magicArt.length > 400) state.magicArt.shift();
  drawMagic();
}
function magicMove(e) {
  if (!mStroke) return;
  const [x, y] = toBoard(e), p = mStroke.p, k = p.length;
  if (Math.hypot(x - p[k - 2], y - p[k - 1]) < 3) return;
  p.push(x, y); drawMagic();
}
function magicUp() {
  if (!mStroke) return;
  mStroke = null; saveState();
  winTrophy('You made Mirror Magic!');
}
function openMagic() { endPrintAll(); setView('magic'); sizeMagic(); updateMagicSide(); blip(880); }
function updateMagicSide() {
  $('bTwo').classList.toggle('on', mMode === 2); $('bFour').classList.toggle('on', mMode === 4);
  $('bThin').classList.toggle('on', mWide === 8); $('bFat').classList.toggle('on', mWide !== 8);
}
function setMagic(k, v) { if (k === 'mode') mMode = v; else mWide = v; updateMagicSide(); drawMagic(); blip(700, 0, .06); }
function undoMagic() { state.magicArt.pop(); saveState(); drawMagic(); blip(440); }
function clearMagic() { state.magicArt = []; saveState(); drawMagic(); blip(330); }
function magicImage() {
  if (typeof document === 'undefined') return '';
  const cv = document.createElement('canvas'); cv.width = MW * 2; cv.height = MH * 2;
  const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return '';
  paintMagic(ctx, 2, false);
  return cv.toDataURL('image/png');
}
function magicPage() {
  beginArt(false);
  const img = magicImage();
  let s = BT(MX, 80, 'My Mirror Magic Drawing', 46, '#ffe066') + T(MX, 128, 'by ' + (state.name || 'Ben'), 28, '#444');
  s += '<rect x="36" y="196" width="728" height="512" rx="16" fill="#fff" stroke="' + INK + '" stroke-width="5"/>';
  if (img) s += '<image href="' + img + '" x="40" y="200" width="720" height="504"/>';
  s += T(MX, 790, 'Made with 🪄 Mirror Magic in the Game Factory 🪞', 24, '#7c5cff');
  return svgWrap(s);
}
function printMagic() {
  if (!state.magicArt.length) { toast('✏️ Draw something first!'); return; }
  $('printAll').innerHTML = magicPage();
  document.body.classList.add('pAll');
  winTrophy('You printed Mirror Magic!');
  doPrint(endPrintAll);
}
// =====================================================================
// PRINTING: only the sheet prints (see @media print). A "set" prints one sheet per page.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function printSheet() {                     // the sheet in its color / blank version (never with the peek)
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); peek = false; renderSheet(); updateSide();
  notePrinted([SHEETS[cur].id]); doPrint(() => renderSheet());
}
const ANS = SHEETS.findIndex(p => p.id === 'answers');
function printAnswers() {
  $('printAll').innerHTML = buildSheet(ANS, isLine());
  document.body.classList.add('pAll');
  notePrinted(['answers']); toast('🖨️ Printing the answer page!');
  doPrint(endPrintAll);
}
const kindSheets = kind => SHEETS.map((p, i) => i).filter(i => String(SHEETS[i].kind) === String(kind));
function printSet(kind) {
  const list = kindSheets(kind);
  $('printAll').innerHTML = list.map(i => buildSheet(i, isLine())).join('');
  document.body.classList.add('pAll');
  notePrinted(list.map(i => SHEETS[i].id)); toast('🖨️ Printing ' + list.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (view === 'magic') {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printMagic();
    return;
  }
  if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else if (k === 'm' || k === 'M') { openMagic(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'a' || k === 'A') togglePeek();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {
  loadState();
  renderGallery(); renderNames();
  renderPens('pens', () => pen, c => { pen = c; });
  renderPens('mPens', () => mPen, c => { mPen = c; });
  $('trace').addEventListener('mousedown', penDown);
  $('mCanvas').addEventListener('mousedown', magicDown);
  window.addEventListener('mousemove', e => { if (stroke) penMove(e); if (mStroke) magicMove(e); });
  window.addEventListener('mouseup', () => { penUp(); magicUp(); });
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPeek').addEventListener('click', togglePeek);
  $('bClear').addEventListener('click', clearSheet);
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintAns').addEventListener('click', printAnswers);
  $('bPrintAll').addEventListener('click', () => printSet(SHEETS[cur].kind));
  $('bBack').addEventListener('click', backToGallery);
  $('bMagicOpen').addEventListener('click', openMagic);
  $('bTwo').addEventListener('click', () => setMagic('mode', 2));
  $('bFour').addEventListener('click', () => setMagic('mode', 4));
  $('bThin').addEventListener('click', () => setMagic('wide', 8));
  $('bFat').addEventListener('click', () => setMagic('wide', 22));
  $('bUndo').addEventListener('click', undoMagic);
  $('bMClear').addEventListener('click', clearMagic);
  $('bMPrint').addEventListener('click', printMagic);
  $('bMBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); if (view === 'magic') sizeMagic(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
