<style>
  html, body { height: 100%; }
  body { margin: 0; background: #1d2440; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8f0ff; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8f0ff; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #5c6bc0; }
  #printBox .pbTip { font-size: 20px; color: #283593; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

<canvas id="game" width="960" height="540"></canvas>
<script>
// 🖨️ ROBO JUMP SECRET PRINT SHOP 2 — 💡 Ben's idea! ("There's been lots more Robos, so make MORE Robo posters!")
// The Robo Jump PRINT FACTORY: conveyor belts, a GIANT printer and a poster gallery wall. ROBOS ONLY (Ben's rule!):
// the Robo family, the Robo Jump bosses, Record Robo + his robot bosses, Robo Prime and the Sus Factory robots.
// Tap things to find them, then print a POSTER for every Robo, group posters, a giant 4-page poster, cards, a checklist and Invent-A-Robo 2.
// Every Robo is drawn with the REAL drawing code copied out of its own game (see the "copied from" notes below).
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { found: {}, done: {}, music: 0, bw: 0, inv: null };
try { const s = JSON.parse(localStorage.getItem('roboPrintShop2') || 'null'); if (s && s.found) save = Object.assign(save, s); } catch (_) {}
function writeSave() { try { localStorage.setItem('roboPrintShop2', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0, PRINTING = false;

// ---------- drawing helpers (from Secret Print Shop 1) ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;
const P = (head, body, visor, eye, legs, pod) => ({ head, body, visor, eye, legs, pod });
function drawBody(cx, by, s, pal) {                      // Robo's body (for mystery shapes + Invent-A-Robo)
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = by - h;
  ctx.fillStyle = pal.legs; ctx.fillRect(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s); ctx.fillRect(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s);
  rr(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal.body);
  circle(x + w / 2, y + h * 0.7, 3 * s, pal.pod);
  rr(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod); rr(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod);
  rr(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal.head);
  rr(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal.visor);
  const ex = x + w / 2, ey = y + h * 0.27;
  ctx.fillStyle = pal.eye; ctx.beginPath(); ctx.ellipse(ex - 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.ellipse(ex + 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.fill();
  return { x, y, w, h, ex, ey };
}
// 🎨 a tinted copy of a drawing (Glitch Robo's RGB edges + Retro Camo): drawn on a 2nd canvas, then laid on top, like the games do
let tintCv = null;
function TINT(col, dx, dy, a, fn) {
  const real = ctx, cv = real.canvas;
  if (!tintCv || tintCv.width !== cv.width || tintCv.height !== cv.height) { tintCv = document.createElement('canvas'); tintCv.width = cv.width; tintCv.height = cv.height; }
  const t = tintCv.getContext('2d'); t.setTransform(1, 0, 0, 1, 0, 0); t.clearRect(0, 0, cv.width, cv.height);
  t.setTransform(real.getTransform()); t.translate(dx, dy);
  ctx = t; try { fn(); } finally { ctx = real; }
  t.setTransform(1, 0, 0, 1, 0, 0); t.globalCompositeOperation = 'source-in'; t.fillStyle = col; t.fillRect(0, 0, cv.width, cv.height); t.globalCompositeOperation = 'source-over';
  real.save(); real.setTransform(1, 0, 0, 1, 0, 0); real.globalAlpha *= a; real.drawImage(tintCv, 0, 0); real.restore();
}
</script>
<script>
// ===== copied from robojumpcrafts.html (which copied each Robo out of his own game): G1 Robo, G6 Rocket/Mega/Nega/Glitch/Robo 2.0/Retro Camo,
//       G5 Phantom, G16 Pink Robo, G10 Glint, GCL Claude Robo, GX Chaos Robo, GB Time/Lock/Mirror/King Element/Musical/Golden/Rainbow =====
const EPS = 1e-6;                                        // face = EPS: looking straight at you (eyes in the middle, for masks)
// ===== copied from platformer.html (Robo Jump): drawLook (Robo's own look), roundRect =====
const G1 = (function () {
  let frame = 100, goldDraw = false; const gc = (c, g) => goldDraw ? g : c;
  function roundRect(x, y, w, h, r, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h);
    ctx.fill();
  }
  function drawLook(p) {
    const sx = 1 / p.squash, sy = p.squash;
    const w = p.w * sx, h = p.h * sy;
    const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
    ctx.fillStyle = gc('#3d5afe', '#ff8f00');            // legs
    ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);
    roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
    ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
    ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
    roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
    roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
    roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
    roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
    const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
    const blink = frame % 180 < 6 ? 1 : 5;
    ctx.fillStyle = '#40c4ff';
    ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
  }
  return { robo: () => drawLook({ x: -15, y: -40, w: 30, h: 40, face: EPS, squash: 1 }) };
})();
// ===== copied from robojump6.html: drawRoboBase (Robo Jump 4's drawRobo: Robo + his morphs + Nega-Robo, plus Glitch Robo + Robo 2.0),
//       drawGlitchRobo, PAL_*, MORPHS, roundRect, circle, drawStar. And robojump7.html: camoOverlay (Retro Camo) =====
const G6 = (function () {
  let frame = 100;
  const MORPHS = [{ id: 'normal' }, { id: 'rocket' }, { id: 'drill' }, { id: 'bubble' }, { id: 'magnet' }, { id: 'mega' }];
  const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
  const PAL_NEGA = { head: '#37474f', body: '#263238', visor: '#b71c1c', eye: '#e040fb', legs: '#4a148c', pod: '#7b1fa2' };
  const PAL_GLITCH = { head: '#3a3a4f', body: '#26263a', visor: '#07070f', eye: '#ff00e5', legs: '#5e0b6e', pod: '#00e676', glitch: true };   // 👾 GLITCH ROBO
  const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true };          // 💚 ROBO 2.0
  function roundRect(x, y, w, h, r, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
    ctx.fill();
  }
  function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
  function drawStar(x, y, r, fill, rot = 0) {
    ctx.fillStyle = fill; ctx.beginPath();
    for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.fill();
  }
  const tintCopy = (fn, col, dx, dy, a) => TINT(col, dx, dy, a, fn);   // (the games paint a tinted copy on a 2nd canvas)
  function drawRoboBase(p, id, pal) {
    const nega = id === 'mininega' || pal === PAL_NEGA;
    pal = pal || (id === 'mininega' ? PAL_NEGA : PAL_ROBO);
    const sx = 1 / (p.squash || 1), sy = p.squash || 1, morph = MORPHS[p.morph || 0].id;
    const w = p.w * sx, h = p.h * sy, face = p.face || 1;
    let x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
    ctx.save();
    if (morph === 'rocket') {                            // 🚀 rocket pack on his back
      const bx = face > 0 ? x - 10 : x + w - 4;
      roundRect(bx, y + h * 0.35, 14, h * 0.55, 6, '#ff3d00'); ctx.fillStyle = '#ffd740'; ctx.fillRect(bx + 2, y + h * 0.5, 10, 4);
      ctx.fillStyle = '#bf360c'; ctx.beginPath(); ctx.moveTo(bx, y + h * 0.9); ctx.lineTo(bx - 6 * face, y + h + 4); ctx.lineTo(bx + 7, y + h * 0.9); ctx.fill();
      if (p.flying) { const f = 14 + Math.random() * 12; ctx.fillStyle = '#ffab40'; ctx.beginPath(); ctx.moveTo(bx + 2, y + h * 0.9); ctx.lineTo(bx + 7, y + h * 0.9 + f); ctx.lineTo(bx + 12, y + h * 0.9); ctx.fill(); circle(bx + 7, y + h * 0.95, 4, '#fff59d'); }
    }
    // legs, body, ear pods, head, visor, eyes (same Robo as always)
    ctx.fillStyle = pal.legs;
    const lw = morph === 'mega' ? 16 : 8;
    ctx.fillRect(x + 4, y + h - 7 * (h / 40), lw, 7 * (h / 40)); ctx.fillRect(x + w - 4 - lw, y + h - 7 * (h / 40), lw, 7 * (h / 40));
    roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6 * (w / 30), pal.body);
    if (!pal.r2) circle(x + w / 2, y + h * 0.7, 3 * (w / 30), nega ? '#e040fb' : pal.pod);
    roundRect(x - 5, y + h * 0.3 - 3, 6, 9 * (h / 40), 3, pal.pod);
    roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9 * (h / 40), 3, pal.pod);
    roundRect(x - 2, y, w + 4, h * 0.55, 12 * (w / 30), pal.head);
    roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9 * (w / 30), pal.visor);
    const ex = x + w / 2 + face * 3 * (w / 30), ey = y + h * 0.27, blink = frame % 180 < 6 ? 1 : 5 * (h / 40), es = w / 30;
    if (nega) { circle(ex - 6 * es, ey, 6 * es, 'rgba(224,64,251,.35)'); circle(ex + 6 * es, ey, 6 * es, 'rgba(224,64,251,.35)'); }
    ctx.fillStyle = pal.eye;
    ctx.beginPath(); ctx.ellipse(ex - 6 * es, ey, 3.5 * es, Math.max(0.5, blink), 0, 0, 7); ctx.ellipse(ex + 6 * es, ey, 3.5 * es, Math.max(0.5, blink), 0, 0, 7); ctx.fill();
    if (pal.glitch) {                                    // 👾 jagged magenta/green visor, angry pixel eyes, broken pixels + static
      ctx.strokeStyle = frame % 10 < 5 ? '#ff00e5' : '#00e676'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + 2, y + 6);
      for (let k = 1; k <= 6; k++) ctx.lineTo(x + 2 + k * (w - 4) / 6, y + 6 + (k % 2 ? 6 : 0) * (h / 40));
      ctx.lineTo(x + w - 2, y + h * 0.55 - 6); ctx.lineTo(x + 2, y + h * 0.55 - 6); ctx.closePath(); ctx.stroke();
      ctx.fillStyle = '#ff00e5';
      for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(ex + d * 2 * es, ey - 3 * es); ctx.lineTo(ex + d * 10 * es, ey - 5 * es); ctx.lineTo(ex + d * 7 * es, ey + 3 * es); ctx.fill(); }
      for (let k = 0; k < 7; k++) {                     // broken pixels: dark holes + bright static bits
        const px = x + ((k * 37 + Math.floor(frame / 9) * 11) % Math.max(1, Math.floor(w))), py = y + ((k * 23 + Math.floor(frame / 7) * 5) % Math.max(1, Math.floor(h * 0.9)));
        ctx.fillStyle = k % 3 === 0 ? '#000' : k % 3 === 1 ? '#00e676' : '#ff00e5'; ctx.fillRect(px, py, 4 * es, 4 * es);
      }
    }
    if (pal.r2) {                                        // 💚 Robo 2.0: a happy smile, cute pixel freckles and a "2.0"
      ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey + 6 * es, 3.5 * es, 0.2, Math.PI - 0.2); ctx.stroke();
      ctx.fillStyle = '#ff00e5'; ctx.fillRect(x + 3, y + 3, 4 * es, 4 * es); ctx.fillStyle = '#00e676'; ctx.fillRect(x + w - 7 * es, y + 5, 4 * es, 4 * es);
      ctx.fillStyle = '#7b1fa2'; ctx.font = `bold ${Math.round(9 * es)}px Arial`; ctx.textAlign = 'center'; ctx.fillText('2.0', x + w / 2, y + h * 0.84);
    }
    if (morph === 'mega') {                              // 🦾 gold armor
      roundRect(x - 8, y + h * 0.48, 16, 14, 6, '#ffc400'); roundRect(x + w - 8, y + h * 0.48, 16, 14, 6, '#ffc400');
      drawStar(x + w / 2, y + h * 0.7, 9, '#ffc400', 0); ctx.fillStyle = '#ffc400'; ctx.fillRect(x + 2, y + h * 0.86, w - 4, 5);
    }
    ctx.restore();                                       // (the drill, magnet + bubble morphs and the hats are left out)
  }
  function drawGlitchRobo(x, y, w, h, face, opts = {}) {
    const t = frame, jx = t % 53 < 3 ? (t % 2 ? 6 : -6) : 0;              // a little glitch-jump now and then
    const body = () => drawRoboBase({ x: x + jx, y, w, h, face, squash: opts.squash || 1, morph: 0, dashT: opts.dashT || 0, ceil: opts.ceil }, 'glitchrobo', PAL_GLITCH);
    tintCopy(body, '#ff00e5', -4, 0, 0.6); tintCopy(body, '#00e676', 4, 1, 0.55);   // RGB-split edges
    body();
  }
  // 📜 RETRO CAMO (robojump7.html camoOverlay): a sepia tint + chunky "old pixels" + film flicker
  function camoOverlay(p, one) {
    tintCopy(one, '#a1887f', 0, 0, 0.72);
    ctx.save(); ctx.beginPath(); ctx.roundRect(p.x - 2, p.y, p.w + 4, p.h * 0.55, 12); ctx.roundRect(p.x + 2, p.y + p.h * 0.5, p.w - 4, p.h * 0.4, 6); ctx.clip();   // (printing: only ON Robo)
    ctx.fillStyle = 'rgba(62,39,35,.28)';
    for (let gx = 0; gx < p.w + 8; gx += 6) for (let gy = 0; gy < p.h; gy += 6) if (((gx + gy) / 6) % 2 === 0) ctx.fillRect(p.x - 4 + gx, p.y + gy, 3, 3);
    if (frame % 11 < 4) { ctx.fillStyle = 'rgba(255,248,225,.4)'; ctx.fillRect(p.x - 4 + ((frame * 5) % 38), p.y - 2, 2, p.h + 4); }
    ctx.restore();
  }
  const box = (w, h, o) => Object.assign({ x: -w / 2, y: -h, w, h, face: EPS, squash: 1, morph: 0 }, o || {});
  return {
    rocket: () => drawRoboBase(box(30, 40, { morph: 1, flying: true }), 'normal'),
    mega: () => drawRoboBase(box(60, 78, { morph: 5 }), 'normal'),        // MEGA ROBO is 60 x 78 in Robo Jump 4
    nega: () => drawRoboBase(box(54, 72), 'nega', PAL_NEGA),              // the Nega-Robo boss is 54 x 72 in Robo Jump 4
    glitch: () => drawGlitchRobo(-24, -64, 48, 64, EPS),                  // the Glitch Robo boss is 48 x 64 in Robo Jump 6
    robo2: () => drawRoboBase(box(30, 40), 'normal', PAL_R2),
    pack: () => {                                      // 🚀 just the rocket pack (the same lines as drawRoboBase above), for the Paper Doll
      const p = box(30, 40, { flying: true }), x = p.x, y = p.y, w = p.w, h = p.h, face = EPS, bx = face > 0 ? x - 10 : x + w - 4;
      roundRect(bx, y + h * 0.35, 14, h * 0.55, 6, '#ff3d00'); ctx.fillStyle = '#ffd740'; ctx.fillRect(bx + 2, y + h * 0.5, 10, 4);
      ctx.fillStyle = '#bf360c'; ctx.beginPath(); ctx.moveTo(bx, y + h * 0.9); ctx.lineTo(bx - 6 * face, y + h + 4); ctx.lineTo(bx + 7, y + h * 0.9); ctx.fill();
      const f = 14 + Math.random() * 12; ctx.fillStyle = '#ffab40'; ctx.beginPath(); ctx.moveTo(bx + 2, y + h * 0.9); ctx.lineTo(bx + 7, y + h * 0.9 + f); ctx.lineTo(bx + 12, y + h * 0.9); ctx.fill(); circle(bx + 7, y + h * 0.95, 4, '#fff59d');
    },
    armor: () => {                                     // 🦾 just MEGA ROBO's wide feet + gold armor (the same lines as above), for the Paper Doll
      const p = box(60, 78), x = p.x, y = p.y, w = p.w, h = p.h, lw = 16;
      ctx.fillStyle = '#3d5afe'; ctx.fillRect(x + 4, y + h - 7 * (h / 40), lw, 7 * (h / 40)); ctx.fillRect(x + w - 4 - lw, y + h - 7 * (h / 40), lw, 7 * (h / 40));
      roundRect(x - 8, y + h * 0.48, 16, 14, 6, '#ffc400'); roundRect(x + w - 8, y + h * 0.48, 16, 14, 6, '#ffc400');
      drawStar(x + w / 2, y + h * 0.7, 9, '#ffc400', 0); ctx.fillStyle = '#ffc400'; ctx.fillRect(x + 2, y + h * 0.86, w - 4, 5);
    },
    retro: () => { frame = 99; const p = box(30, 40), one = () => drawRoboBase(p, 'normal'); one(); camoOverlay(p, one); frame = 100; },
  };
})();
// ===== copied from robojump5.html: drawPhantom (the Phantom Robo boss is 48 x 64), roundRect, circle, ellipse =====
