<!DOCTYPE html>

  body {

    align-items: center; justify-content: center; overflow: hidden;
  }

    width: min(100vw, calc(100vh * 960 / 520));

    box-shadow: 0 10px 40px rgba(0,0,0,.5);

</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// 👻 GHOST TRAIN RIDE
// A spooky-fun ride through the haunted side of the Game Factory in a creaky little cart.
// Robo rides in front, you are the camera. At each of the 5 forks pick the LEFT or RIGHT tunnel.
// Things pop out (a shimmer warns you first): shine your LANTERN (Space / tap) to spook them back!
// Lean LEFT / RIGHT to grab glowing ghost tokens. At the end, flash Phantom Robo 3 times and he becomes your friend.
// 4 different endings + a Map of every ride you've taken.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, CX = 480, HZ = 215;

// ---------- Saves, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book

let save = { rides: 0, best: 0, tokens: 0, endings: {}, rooms: {}, paths: {}, easy: false, music: true };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('ghostTrain') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.endings = save.endings || {}; save.rooms = save.rooms || {}; save.paths = save.paths || {};
}
function writeSave() { try { localStorage.setItem('ghostTrain', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- The ride map ----------
// 8 rooms (2 per fork for forks 1-4), then fork 5 picks where the big finale happens.
const ROOMS = {
  portrait: { name: 'Portrait Hall', icon: '🖼️', wall: '#3b2350', floor: '#2a1630', trim: '#d4a14a', glow: '#ffcc80' },
  library:  { name: 'Flickering Library', icon: '📚', wall: '#3a2a1c', floor: '#24170f', trim: '#a1683a', glow: '#ffd54f' },
  kitchen:  { name: 'Cobweb Kitchen', icon: '🍲', wall: '#22333a', floor: '#3b3b46', trim: '#90a4ae', glow: '#b2ff59' },
  mirror:   { name: 'Mirror Room', icon: '🪞', wall: '#1d2b4f', floor: '#141c36', trim: '#b3e5fc', glow: '#80d8ff' },
  ballroom: { name: 'Ghost Ballroom', icon: '💃', wall: '#3e1f47', floor: '#2b2140', trim: '#f8bbd0', glow: '#ea80fc' },
  garden:   { name: 'Moonlit Stone Garden', icon: '🌙', wall: '#0e2240', floor: '#15301f', trim: '#7e8fa6', glow: '#fff59d' },
  organ:    { name: 'The Organ Loft', icon: '🎹', wall: '#2c1d3d', floor: '#1e1426', trim: '#e0b84f', glow: '#ffab40' },
  workshop: { name: "Phantom Robo's Workshop", icon: '⚙️', wall: '#1f2a33', floor: '#1a1f24', trim: '#4dd0e1', glow: '#84ffff' },
  entrance: { name: 'The Creaky Entrance', icon: '🚂', wall: '#2a1d3a', floor: '#1b1424', trim: '#8d6e63', glow: '#ffcc80' },
  roof:     { name: 'The Moon Roof', icon: '🌕', wall: '#0b1d3f', floor: '#3a2f4a', trim: '#b39ddb', glow: '#fff9c4' },
  cellar:   { name: 'The Secret Cellar Station', icon: '🕯️', wall: '#33201a', floor: '#22150f', trim: '#ff8a65', glow: '#ffab91' },
};
const FORKS = [
  ['portrait', 'library'],
  ['kitchen', 'mirror'],
  ['ballroom', 'garden'],
  ['organ', 'workshop'],
  ['roof', 'cellar'],
];
const FORK_LABEL = [null, null, null, null, ['Up the Big Hill', 'Down the Twisty Slide']];
// Endings come from fork 4 (organ / workshop) + fork 5 (roof / cellar)
const ENDINGS = {
  'organ-roof':     { name: 'Moonlight Concert', icon: '🎆', text: ['Phantom Robo plays the giant organ on the roof', 'while the friendly ghosts make fireworks!'] },
  'organ-cellar':   { name: 'Spooky Sing-Along', icon: '🎤', text: ['Everybody sings "Boo-Boo-Bee-Doo"', 'around the candles in the secret cellar!'] },
  'workshop-roof':  { name: 'Ghost Rocket', icon: '🚀', text: ['Phantom Robo turns the cart into a glowing rocket', 'and you zoom right past the moon!'] },
  'workshop-cellar':{ name: 'Glow Cookie Party', icon: '🍪', text: ['Phantom Robo bakes glow-in-the-dark cookies', 'and Sammy the cat comes for a snack!'] },
};
const ENDING_IDS = Object.keys(ENDINGS);

// ---------- Drawing helpers ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function sparkle(x, y, r, color) {
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(x, y - r); ctx.lineTo(x + r * 0.25, y - r * 0.25); ctx.lineTo(x + r, y); ctx.lineTo(x + r * 0.25, y + r * 0.25);
  ctx.lineTo(x, y + r); ctx.lineTo(x - r * 0.25, y + r * 0.25); ctx.lineTo(x - r, y); ctx.lineTo(x - r * 0.25, y - r * 0.25); ctx.fill();
}
function button(b, label, color, size = 26) {
  const hover = 0;
  roundRect(b.x, b.y + 5, b.w, b.h, 16, 'rgba(0,0,0,.4)');
  roundRect(b.x, b.y, b.w, b.h, 16, color);
  roundRect(b.x + 6, b.y + 5, b.w - 12, b.h * 0.35, 12, 'rgba(255,255,255,.18)');
  text(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36 + hover, size);
}
// 3D-ish projection: world x (-1 left wall .. 1 right wall), y (-1 ceiling .. 0.8 floor), d = distance ahead
let camX = 0, bob = 0;
const sOf = d => 1 / (1 + Math.max(-0.6, d));
const px = (x, d) => CX + (x - camX * 0.35) * 520 * sOf(d);
const py = (y, d) => HZ + y * 300 * sOf(d) + bob;

// ---------- Sound ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, noiseBuf = null;
let musicOn = save.music !== false;
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.55 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
  // a spooky echo for the theremin lead
  delayIn = actx.createGain(); delayIn.gain.value = 0.3;
  const dl = actx.createDelay(2); dl.delayTime.value = 0.375;
  const fb = actx.createGain(); fb.gain.value = 0.38;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2200;
  delayIn.connect(dl); dl.connect(dlp); dlp.connect(fb); fb.connect(dl); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  else if (actx.state === 'suspended' && actx.resume) actx.resume();
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.55 : 0, t + 0.25); }
  nextT = 0;
}
function envGain(t, a, peak, sus, dur, rel, out) {    // smooth envelope, no clicks
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 👻 THEREMIN LEAD: sine + soft triangle, slides into each note, wobbly vibrato, echo
function thereminVoice(m, prev, t, dur, vol, out) {
  const f = midi(m), end = t + dur + 0.3;
  const g = envGain(t, 0.04, vol, 0.85, dur, 0.18, out);
  const o1 = osc('sine', prev ? midi(prev) : f, t, end), o2 = osc('triangle', prev ? midi(prev) : f, t, end, 4);
  if (prev) { o1.frequency.exponentialRampToValueAtTime(f, t + 0.06); o2.frequency.exponentialRampToValueAtTime(f, t + 0.06); }
  const mix = actx.createGain(); mix.gain.value = 0.55; o1.connect(g); o2.connect(mix); mix.connect(g);
  const lfo = osc('sine', 6.2, t, end), lg = actx.createGain();
  lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * (dur > 0.3 ? 0.018 : 0.006), t + 0.3);
  lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
  if (delayIn) g.connect(delayIn);
}
// 🎹 PIPE ORGAN pad: sine stack (8', 4', 2 2/3')
function organVoice(notes, t, dur, vol, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.4;
    const g = envGain(t, 0.05, vol, 0.9, dur, 0.25, out);
    osc('sine', f, t, end).connect(g);
    for (const [k, v] of [[2, 0.45], [3, 0.2], [4, 0.12]]) { const h = actx.createGain(); h.gain.value = v; osc('sine', f * k, t, end).connect(h); h.connect(g); }
  }
}
// 🎵 MUSIC BOX twinkle
function boxVoice(m, t, vol, out) {
  const f = midi(m), g = envGain(t, 0.003, vol, 0.2, 0.25, 0.4, out);
  osc('sine', f, t, t + 0.9).connect(g);
  const h = actx.createGain(); h.gain.value = 0.25; osc('sine', f * 4.01, t, t + 0.5).connect(h); h.connect(g);
}
// 🎸 PIZZICATO BASS
function bassVoice(m, t, dur, vol, out) {
  const f = midi(m), g = envGain(t, 0.005, vol, 0.5, dur, 0.08, out);
  const lp = lowpass(1400, 4, t); lp.frequency.setTargetAtTime(240, t + 0.01, 0.07); lp.connect(g);
  osc('sawtooth', f, t, t + dur + 0.1).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.7; osc('triangle', f, t, t + dur + 0.1).connect(sg); sg.connect(g);
}
// 🥁 DRUMS: soft kick, brushy snare, tick-tock hats, wood block
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {
    const o = osc('sine', 130, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    o.connect(g); g.connect(out);
  } else if (kind === 's') noiseHit(t, 'bandpass', 2600, 0.8, vol * 0.7, 0.18, out);
  else if (kind === 'h') noiseHit(t, 'highpass', 8000, 1, vol * 0.6, 0.035, out);
  else if (kind === 'w') {                             // wood block "tock"
    const o = osc('sine', 880, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.08); o.connect(g); g.connect(out);
  }
}

// ---------- SONGS (MIDI numbers, one per 8th note, 0 = rest) ----------
// 🎶 "Ghost Train Galop" in D minor: a creepy-cute theremin tune over a pipe organ, pizzicato bass and a tick-tock beat
const GALOP = [
  62, 0, 65, 69, 74, 0, 73, 74,   70, 0, 69, 67, 69, 0, 0, 0,
  67, 0, 70, 74, 77, 0, 76, 74,   73, 0, 74, 76, 69, 0, 0, 0,
  62, 0, 65, 69, 74, 0, 73, 74,   77, 0, 76, 74, 72, 0, 70, 69,
  67, 70, 69, 67, 65, 64, 62, 64, 62, 0, 69, 0, 62, 0, 0, 0,
  72, 0, 72, 74, 72, 0, 69, 0,    70, 0, 70, 72, 70, 0, 67, 0,
  69, 0, 69, 70, 69, 0, 65, 0,    64, 65, 67, 69, 70, 72, 73, 0,
  74, 0, 0, 73, 74, 0, 77, 0,     76, 0, 74, 73, 74, 0, 70, 0,
  69, 0, 67, 65, 64, 0, 61, 64,   62, 0, 0, 0, 0, 0, 0, 0,
];
// chords: one or two per bar ([root pitch class, 'm' minor / 'M' major / '7' dominant 7th])
const GALOP_CH = [
  [[2, 'm']], [[10, 'M'], [9, 'M']], [[7, 'm']], [[9, '7']], [[2, 'm']], [[5, 'M'], [0, 'M']], [[7, 'm'], [9, '7']], [[2, 'm']],
  [[5, 'M']], [[0, 'M'], [7, 'm']], [[2, 'm']], [[9, '7']], [[2, 'm']], [[7, 'm']], [[9, '7']], [[2, 'm']],
];
// 🤖👻 "Phantom Robo's Boogie": faster and bouncier for the big finale
const PHANTOM = [
  74, 0, 74, 0, 73, 0, 74, 0,   77, 0, 74, 0, 70, 0, 0, 0,
  72, 0, 72, 0, 71, 0, 72, 0,   76, 0, 72, 0, 69, 0, 0, 0,
  74, 0, 77, 0, 81, 0, 80, 81,  82, 0, 81, 79, 77, 0, 76, 0,
  74, 76, 77, 79, 81, 0, 73, 0, 74, 0, 69, 0, 62, 0, 0, 0,
];
const PHANTOM_CH = [[[2, 'm']], [[10, 'M']], [[0, 'M']], [[9, 'M']], [[2, 'm']], [[7, 'm']], [[9, '7']], [[2, 'm']]];
// 🌟 the happy ending: the Galop turns MAJOR because everyone is friends now
const HAPPY = GALOP.slice(0, 64).map(n => ({ 65: 66, 77: 78, 70: 71, 72: 73 })[n] || n);
const HAPPY_CH = [[[2, 'M']], [[7, 'M'], [9, 'M']], [[7, 'M']], [[9, '7']], [[2, 'M']], [[11, 'm'], [9, 'M']], [[7, 'M'], [9, '7']], [[2, 'M']]];
const SONGS = {
  title:   { mel: GALOP, ch: GALOP_CH, bpm: 112, drums: 0, box: true },
  ride:    { mel: GALOP, ch: GALOP_CH, bpm: 126, drums: 1, box: false },
  phantom: { mel: PHANTOM, ch: PHANTOM_CH, bpm: 144, drums: 2, box: false },
  happy:   { mel: HAPPY, ch: HAPPY_CH, bpm: 120, drums: 1, box: true },
};
let song = 'title', songPos = 0, nextT = 0;
function playSong(name) { if (song !== name) { song = name; songPos = 0; nextT = 0; } }
function chordNotes(c, base) {
  const r = base + ((c[0] - base) % 12 + 12) % 12;
  return c[1] === 'm' ? [r, r + 3, r + 7] : c[1] === '7' ? [r, r + 4, r + 7, r + 10] : [r, r + 4, r + 7];
}
function scheduleStep(S, pos, t) {
  const n = S.mel.length, i = pos % n, bar = Math.floor(i / 8), k = i % 8, e = 60 / S.bpm / 2;
  const chs = S.ch[bar % S.ch.length], c = chs.length > 1 && k >= 4 ? chs[1] : chs[0];
  const out = musicBus, log = MUSIC_LOG;
  const m = S.mel[i];
  if (m) {
    let len = 1; while (len < 3 && !S.mel[(i + len) % n]) len++;
    let prev = 0; for (let j = 1; j < 3; j++) { const p = S.mel[(i - j + n) % n]; if (p) { prev = p; break; } }
    thereminVoice(m, Math.abs(prev - m) <= 7 ? prev : 0, t, len * e * 0.9, 0.13, out);
    if (log) log.push({ t, m, track: 'lead' });
  }
  if (k === 0 || (k === 4 && chs.length > 1)) {
    organVoice(chordNotes(c, 55), t, (chs.length > 1 ? 4 : 8) * e * 0.95, 0.035, out);
    if (log) log.push({ t, m: c[0], track: 'organ' });
  }
  const root = chordNotes(c, 38)[0];
  if (k === 0 || k === 4) bassVoice(k === 0 ? root : root + 7, t, e * 1.6, 0.16, out);
  if (S.drums === 2 && (k === 2 || k === 6)) bassVoice(root + 12, t, e * 0.8, 0.1, out);
  if (S.drums) {
    if (k === 0 || k === 4) drumHit('k', t, 0.32, out);
    if (k === 2 || k === 6) drumHit('s', t, 0.18, out);
    if (k % 2 === 1) drumHit('h', t, 0.12, out);
    if (k === 7 && bar % 2 === 1) drumHit('w', t, 0.12, out);
  } else if (k === 0 || k === 4) drumHit('w', t, 0.08, out);   // tick... tock...
  if ((S.box || bar >= 8) && k % 2 === 1) {
    const cn = chordNotes(c, 74); boxVoice(cn[(k >> 1) % cn.length], t, 0.035, out);
  }
}
function playMusic() {
  if (!actx || !musicBus || !musicOn) return;
  const S = SONGS[song];
  if (nextT < actx.currentTime) nextT = actx.currentTime + 0.05;
  while (nextT < actx.currentTime + 0.18) { scheduleStep(S, songPos, nextT); nextT += 60 / S.bpm / 2; songPos++; }
}

// ---------- Sound effects (spooky-fun, never too loud) ----------
function tone(f, at, dur, type, vol, slideTo) {
  if (!actx) return;
  const t = actx.currentTime + at, g = envGain(t, 0.01, vol, 0.7, dur, 0.08, sfxBus);
  const o = osc(type, f, t, t + dur + 0.1); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  o.connect(g);
}
function noiseSfx(at, type, f, q, vol, dec) { if (actx && noiseBuf) noiseHit(actx.currentTime + at, type, f, q, vol, dec, sfxBus); }
const sfx = {
  clack:   () => { noiseSfx(0, 'bandpass', 900, 3, 0.16, 0.05); noiseSfx(0.11, 'bandpass', 700, 3, 0.13, 0.05); },
  creak:   () => { if (!actx) return; const t = actx.currentTime, g = envGain(t, 0.15, 0.05, 0.9, 0.9, 0.3, sfxBus), lp = lowpass(700, 9, t);
                   lp.connect(g); const o = osc('sawtooth', 90, t, t + 1.2); o.frequency.linearRampToValueAtTime(140, t + 0.5); o.frequency.linearRampToValueAtTime(75, t + 1); o.connect(lp); },
  hoot:    () => { tone(520, 0, 0.25, 'sine', 0.08, 470); tone(520, 0.35, 0.45, 'sine', 0.08, 430); },
  whoosh:  () => { if (!actx || !noiseBuf) return; const t = actx.currentTime, s = actx.createBufferSource(); s.buffer = noiseBuf;
                   const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 2; bp.frequency.setValueAtTime(300, t); bp.frequency.exponentialRampToValueAtTime(2500, t + 0.5);
                   const g = envGain(t, 0.2, 0.2, 0.8, 0.5, 0.3, sfxBus); s.connect(bp); bp.connect(g); s.start(t); s.stop(t + 1); },
  shimmer: () => [1568, 1976, 2349, 1976].forEach((f, i) => tone(f, i * 0.07, 0.15, 'sine', 0.035)),
  boo:     () => { tone(330, 0, 0.5, 'sine', 0.1, 200); tone(495, 0, 0.5, 'triangle', 0.04, 300); },
  giggle:  () => [880, 1046, 880, 1175, 1318].forEach((f, i) => tone(f, i * 0.06, 0.06, 'triangle', 0.07)),

// menu buttons
const TITLE_BTNS = [

function update() {
  frame++;

  if (lanternT > 0) lanternT--;
  if (lanternCool > 0) lanternCool--;
  if (roboTurn > 0) roboTurn--;
  if (msg && --msg.t <= 0) msg = null;
  if (stickerNew > 0) stickerNew--;
  if (fade > 0 && !(state === 'fork' && fork && fork.choice >= 0)) fade = Math.max(0, fade - 0.04);
  for (const f of floaters) { f.t--; f.y -= 0.7; }
  floaters = floaters.filter(f => f.t > 0);

  parts = parts.filter(p => p.life > 0);

    if (press.d) { sel = (sel + 1) % 3; sfx.click(); }
    if (press.space || press.enter) menuPick(TITLE_BTNS[sel].id);

// ---------- Drawing: the haunted rooms ----------
const FAR = 8;
function poly(pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.closePath(); ctx.fill(); }

function drawSky(seed) {

  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  circle(760, 80, 58, 'rgba(255,249,196,.18)'); circle(760, 80, 44, '#fff9c4');
  circle(744, 70, 8, 'rgba(200,190,140,.5)'); circle(775, 95, 6, 'rgba(200,190,140,.5)');
}
function drawRoom(key) {

  if (out) drawSky(key === 'roof' ? 31 : 7);

  const N = -0.5;
  // back of the tunnel (far away = dark)
  if (!out) poly([[px(-1, FAR), py(-1, FAR)], [px(1, FAR), py(-1, FAR)], [px(1, FAR), py(0.8, FAR)], [px(-1, FAR), py(0.8, FAR)]], '#07040d');
  else poly([[0, py(0.8, FAR) - 30], [W, py(0.8, FAR) - 30], [W, py(0.8, FAR)], [0, py(0.8, FAR)]], key === 'roof' ? '#1b1236' : '#0f2a1a');
  // floor
  poly([[px(-2.5, N), py(0.8, N)], [px(2.5, N), py(0.8, N)], [px(2.5, FAR), py(0.8, FAR)], [px(-2.5, FAR), py(0.8, FAR)]], R.floor);
  if (!out) {
    poly([[px(-1, N), py(-1, N)], [px(1, N), py(-1, N)], [px(1, FAR), py(-1, FAR)], [px(-1, FAR), py(-1, FAR)]], 'rgba(0,0,0,.35)');   // ceiling
    for (const s of [-1, 1]) {
      poly([[px(s, N), py(-1, N)], [px(s, FAR), py(-1, FAR)], [px(s, FAR), py(0.8, FAR)], [px(s, N), py(0.8, N)]], R.wall);
      poly([[px(s, N), py(0.45, N)], [px(s, FAR), py(0.45, FAR)], [px(s, FAR), py(0.8, FAR)], [px(s, N), py(0.8, N)]], 'rgba(0,0,0,.25)');   // wainscot
    }
  } else {
    for (const s of [-1, 1]) poly([[px(s * 1.1, N), py(0.2, N)], [px(s * 1.1, FAR), py(0.5, FAR)], [px(s * 1.1, FAR), py(0.8, FAR)], [px(s * 1.1, N), py(0.8, N)]], key === 'roof' ? '#4a3a63' : '#1e4d2b');

    ctx.globalAlpha = 1;

    const s = sOf(d); ctx.fillStyle = '#4e342e';

  for (let i = decor.length - 1; i >= 0; i--) drawDecor(key, decor[i]);
  if (key === 'ballroom') drawDancers();
  if (key === 'garden' || key === 'roof') for (let i = 0; i < 14; i++) {   // fireflies
    const x = (Math.sin(frame * 0.01 + i * 2.1) * 0.5 + 0.5) * W, y = 160 + Math.sin(frame * 0.02 + i) * 90 + i * 8;
    circle(x, y, 2.5 + Math.sin(frame * 0.1 + i), 'rgba(255,245,157,.85)');
  }
}
function drawDancers() {                                // friendly ghosts waltzing in the middle of the ballroom

    for (let i = 0; i < 3; i++) drawGhost(560 + i * 110, 300 + Math.sin(frame * 0.1 + i) * 8, 0.45, '#fce4ec', i % 2 ? 'boo' : 'happy', ['bow', 'flower', ''][i]);
  } else if (key === 'workshop-roof') {               // 🚀 the ghost rocket zooms past the moon
    const t = (frame % 240) / 240, rx = -100 + t * 1160, ry = 220 - Math.sin(t * Math.PI) * 140;
    for (let i = 1; i < 12; i++) circle(rx - i * 16, ry + i * 3, 12 - i, `rgba(132,255,255,${0.6 - i * 0.05})`);
    roundRect(rx - 40, ry - 14, 80, 28, 12, '#7b1f2b'); poly([[rx + 40, ry - 14], [rx + 70, ry], [rx + 40, ry + 14]], '#ffd54f');
    drawRoboFront(rx - 12, ry - 22, 1, true); drawPhantomRobo(rx + 22, ry - 34, 0.18, 'happy', true);
  } else if (key === 'workshop-cellar') {             // 🍪 glow cookies + Sammy the cat
    roundRect(560, 330, 200, 16, 8, '#eceff1');
    for (let i = 0; i < 5; i++) { circle(590 + i * 35, 322, 16, '#c6ff00'); circle(586 + i * 35, 318, 3, '#5d4037'); circle(596 + i * 35, 326, 3, '#5d4037'); }
    // Sammy: a brown tabby with brown eyes
    const sx = 820, sy = 330;
    ellipse(sx, sy, 46, 36, '#a1887f'); circle(sx, sy - 48, 32, '#a1887f');
    poly([[sx - 28, sy - 62], [sx - 22, sy - 96], [sx - 6, sy - 74]], '#a1887f'); poly([[sx + 28, sy - 62], [sx + 22, sy - 96], [sx + 6, sy - 74]], '#a1887f');
    ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 4; for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(sx + k * 10, sy - 80); ctx.lineTo(sx + k * 10, sy - 66); ctx.stroke(); }
    circle(sx - 11, sy - 50, 6, '#6d4c41'); circle(sx + 11, sy - 50, 6, '#6d4c41'); circle(sx - 12, sy - 52, 2, '#fff'); circle(sx + 10, sy - 52, 2, '#fff');
    poly([[sx - 4, sy - 40], [sx + 4, sy - 40], [sx, sy - 35]], '#f48fb1');
    text('Mmm, crunchy glow cookies!', 700, 410, 18, '#c6ff00');
  }
}
function drawEnding() {
  const E = ENDINGS[ending.key], fin = ride.room;
  drawRoom(fin);
  ctx.fillStyle = 'rgba(10,2,24,.25)'; ctx.fillRect(0, 0, W, H);
  drawEndingArt(ending.key);
  drawPhantomRobo(170, 300 + Math.sin(frame * 0.05) * 10, 0.75, 'happy', true);
  drawRoboFront(320, 360, 2.4, true);
  roundRect(CX - 300, 16, 600, 196, 24, 'rgba(30,10,50,.82)');
  text('🎉 THE END: ' + E.icon + ' ' + E.name, CX, 60, 34, '#fff59d');
  text(E.text[0], CX, 96, 21, '#f3e5f5'); text(E.text[1], CX, 122, 21, '#f3e5f5');
  text('⭐ ' + ride.score + '    👻 ' + ride.tokens + ' tokens    🏮 spooked back ' + ride.spooked + ' / ' + ride.popsSeen, CX, 160, 20, '#b9f6ca');
  const n = ENDING_IDS.filter(k => save.endings[k]).length;
  text('Endings found: ' + n + ' / 4' + (n === 4 ? '  🌟 ALL OF THEM!' : '  (try other tunnels!)'), CX, 192, 19, '#80d8ff');
  if (ending.fresh && frame % 40 < 30) { ctx.save(); ctx.translate(820, 250); ctx.rotate(0.15); roundRect(-90, -26, 180, 52, 16, '#e91e63'); text('NEW ENDING!', 0, 9, 24, '#fff'); ctx.restore(); }
  END_BTNS.forEach((b, i) => {
    if (sel === i) roundRect(b.x - 6, b.y - 6, b.w + 12, b.h + 12, 20, '#fff59d');
    button(b, i ? '🗺️ Map' : '🚂 Ride Again', i ? '#1565c0' : '#7b1f2b', 24);
  });
  drawTopButtons();
  if (stickerNew > 0) text('🌟 New sticker for your Sticker Book!', CX, 425, 22, '#fff59d');
}
const SHORT = { portrait: 'Portraits', library: 'Library', kitchen: 'Kitchen', mirror: 'Mirrors', ballroom: 'Ballroom', garden: 'Stone Garden', organ: 'Organ Loft', workshop: 'Workshop', roof: 'Moon Roof', cellar: 'Cellar' };
const mapNode = (i, c) => ({ x: 200 + i * 160, y: c ? 300 : 175 });
function drawMap() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a1036'); g.addColorStop(1, '#2d1b4e');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  text('🗺️ Map of Rides Taken', CX, 56, 38, '#fff59d');
  const paths = Object.keys(save.paths);
  const took = (i, a, b) => paths.some(p => i < 0 ? p[0] === String(b) : p[i] === String(a) && p[i + 1] === String(b));
  // tracks between the forks (bright = you rode it)
  const start = { x: 70, y: 238 };
  for (let i = -1; i < 4; i++) for (let a = 0; a < 2; a++) for (let b = 0; b < 2; b++) {
    if (i < 0 && a) continue;
    const p1 = i < 0 ? start : mapNode(i, a), p2 = mapNode(i + 1, b), on = took(i, a, b);
    ctx.strokeStyle = on ? '#fff59d' : 'rgba(255,255,255,.15)'; ctx.lineWidth = on ? 6 : 3;
    ctx.setLineDash(on ? [] : [8, 8]); ctx.beginPath(); ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.stroke();
  }
  ctx.setLineDash([]);
  roundRect(start.x - 45, start.y - 34, 90, 68, 16, '#7b1f2b'); emoji('🚂', start.x, start.y + 4, 30); text('Start', start.x, start.y + 28, 16);
  for (let i = 0; i < 5; i++) for (let c = 0; c < 2; c++) {
    const key = FORKS[i][c], n = mapNode(i, c), seen = save.rooms[key];
    roundRect(n.x - 66, n.y - 40, 132, 80, 16, seen ? '#4a2a6e' : 'rgba(255,255,255,.08)');
    if (seen) { emoji(ROOMS[key].icon, n.x, n.y + 2, 30); text(SHORT[key], n.x, n.y + 30, 17, ROOMS[key].glow); }
    else text('?', n.x, n.y + 14, 40, 'rgba(255,255,255,.4)');
  }
  for (let i = 0; i < 5; i++) text('Fork ' + (i + 1), 200 + i * 160, 118, 16, '#b39ddb');
  const rooms = Object.keys(ROOMS).filter(k => save.rooms[k] && k !== 'entrance').length;
  text('Different rides: ' + paths.length + ' / 32     Places seen: ' + rooms + ' / 10', CX, 378, 20, '#b9f6ca');
  ENDING_IDS.forEach((k, i) => {
    const E = ENDINGS[k], x = 130 + i * 233, got = save.endings[k];
    roundRect(x - 105, 396, 210, 52, 14, got ? '#6a1b9a' : 'rgba(255,255,255,.08)');
    text(got ? E.icon + ' ' + E.name : '❓ ???', x, 430, got ? 18 : 22, got ? '#fff59d' : 'rgba(255,255,255,.4)');
  });
  button({ x: 380, y: 460, w: 200, h: 50 }, '◀ Back', '#455a64', 22);
}

// ---------- Main draw ----------
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'ending') drawEnding();
  else {
    drawRoom(ride.room);
    drawTokens();
    drawDark();
    if (state === 'fork') drawFork();
    drawPops();
    if (state === 'phantom') drawPhantomScene();
    drawCart();
    drawParts();
    drawHUD();
    if (fade > 0) { ctx.fillStyle = `rgba(5,2,12,${Math.min(1, fade)})`; ctx.fillRect(0, 0, W, H); }
  }
}

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
