// 🎨 Robo Jump Remix Tower: little hero + boss drawings, copied (simplified) from each Robo Jump game's own drawing code.
// Each fn: (ctx, x, yb, s, f) -> centred on x, bottom at yb, about 80*s px tall, f = frame counter (60/s).
// Helpers are all prefixed ta_. Every drawing does save()/restore().

function ta_rr(ctx, x, y, w, h, r, fill) {
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
}
function ta_circle(ctx, x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function ta_ell(ctx, x, y, rx, ry, fill, rot) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, 7); ctx.fillStyle = fill; ctx.fill(); }
function ta_poly(ctx, pts, fill, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 1; ctx.stroke(); }
}
function ta_line(ctx, pts, col, lw) {
  ctx.strokeStyle = col; ctx.lineWidth = lw || 1; ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.stroke();
}
function ta_starPath(ctx, x, y, R, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = (rot || 0) + i * Math.PI / n - Math.PI / 2, d = i % 2 ? r : R;
    if (i) ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d); else ctx.moveTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
  ctx.closePath();
}
function ta_star(ctx, x, y, R, col, rot) { ta_starPath(ctx, x, y, R, R * 0.45, 5, rot); ctx.fillStyle = col; ctx.fill(); }
function ta_gear(ctx, x, y, r, rot, col) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = col; ctx.beginPath();
  for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, d = (i >> 1) % 2 ? r * 0.75 : r; ctx.lineTo(Math.cos(a) * d, Math.sin(a) * d); }
  ctx.closePath(); ctx.fill(); ta_circle(ctx, 0, 0, r * 0.35, 'rgba(0,0,0,.35)'); ctx.restore();
}
// start a drawing: origin = middle of the feet, then scale
function ta_begin(ctx, x, yb, sc) { ctx.save(); ctx.translate(x, yb); ctx.scale(sc, sc); ctx.lineJoin = 'round'; }

const TA_PAL_TIME = { head: '#d9a441', body: '#e8bf6a', visor: '#140a26', eye: '#d580ff', legs: '#8d5a2b', pod: '#ffb300' };
const TA_PAL_LOCK = { head: '#78909c', body: '#607d8b', visor: '#0d1117', eye: '#ffca28', legs: '#37474f', pod: '#455a64' };
const TA_PAL_MIRROR = { head: '#dfe7ee', body: '#c9d4dc', visor: '#1c2a3a', eye: '#b3ecff', legs: '#8fa3b0', pod: '#eef3f7' };
const TA_PAL_GLINT = { head: '#ffe3ef', body: '#fff0e0', visor: '#1a2540', eye: '#64ffda', legs: '#ff9e80', pod: '#64ffda' };

// Robo's exact shape (drawRoboBase in every game): a 30x40 box, local x -15..15, y -40..0
function ta_roboBody(ctx, f, pal, face, o) {
  o = o || {};
  const x = -15, y = -40, w = 30, h = 40;
  ctx.fillStyle = pal.legs; ctx.fillRect(x + 4, y + h - 7, 8, 7); ctx.fillRect(x + w - 12, y + h - 7, 8, 7);   // legs
  ta_rr(ctx, x + 2, y + h * 0.5, w - 4, h * 0.4, 6, pal.body);                                              // body
  if (!o.noChest) ta_circle(ctx, x + w / 2, y + h * 0.7, 3, pal.chest || pal.pod);                          // chest light
  ta_rr(ctx, x - 5, y + h * 0.3 - 3, 6, 9, 3, pal.pod); ta_rr(ctx, x + w - 1, y + h * 0.3 - 3, 6, 9, 3, pal.pod);   // ear pods
  ta_rr(ctx, x - 2, y, w + 4, h * 0.55, 12, pal.head);                                                      // big round head
  ta_rr(ctx, x + 2, y + 4, w - 4, h * 0.55 - 9, 9, pal.visor);                                              // dark visor
  if (o.noEyes) return;
  const ex = face * 3, ey = y + h * 0.27, blink = f % 180 < 6 ? 1 : 5;
  if (o.eyeGlow) { ta_circle(ctx, ex - 6, ey, 6, o.eyeGlow); ta_circle(ctx, ex + 6, ey, 6, o.eyeGlow); }
  ctx.fillStyle = pal.eye; ctx.beginPath();
  ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();
}
// plain Robo, 80*s tall (30x40 box scaled x2), with a tiny happy bounce
function ta_robo(pal, extra) {
  return function (ctx, x, yb, s, f) {
    const sq = 1 + Math.sin(f * 0.08) * 0.025;
    ta_begin(ctx, x, yb, 2 * s); ctx.scale(1 / sq, sq);
    ta_roboBody(ctx, f, pal, 1);
    if (extra) extra(ctx, f);
    ctx.restore();
  };
}

// 👑 KING GLOOP (platformer.html drawBoss, type 'blob', 90x80, default purple look)
function ta_kingGloop(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 0.78 * s);
  const bx = -45, by = -80, wob = Math.sin(f * 0.15) * 4, look = Math.sin(f * 0.02) * 3;
  ta_rr(ctx, bx - wob / 2, by + wob, 90 + wob, 80 - wob, [45, 45, 14, 14], '#7c4dff');
  ta_ell(ctx, bx + 25, by + 22 + wob, 12, 7, 'rgba(255,255,255,.35)', -0.5);
  ctx.fillStyle = '#ffd740'; ctx.beginPath(); ctx.moveTo(-25, by + 6 + wob);       // crown
  for (let i = 0; i <= 4; i++) ctx.lineTo(-25 + i * 12.5, by + wob - (i % 2 ? 4 : 22));
  ctx.lineTo(25, by + 6 + wob); ctx.fill();
  for (const ex of [-18, 18]) { ta_circle(ctx, ex, by + 32 + wob, 11, '#fff'); ta_circle(ctx, ex + look, by + 34 + wob, 5, '#000'); }
  ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.beginPath();
  ctx.moveTo(-30, by + 16 + wob); ctx.lineTo(-8, by + 24 + wob); ctx.moveTo(30, by + 16 + wob); ctx.lineTo(8, by + 24 + wob); ctx.stroke();
  ta_ell(ctx, 0, by + 58 + wob, 18, 8, '#311b92');
  ctx.restore();
}

// 👾 THE BIG GLITCH (robojump2.html drawBoss, type 'cube', 92x88)
function ta_bigGlitch(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 0.88 * s);
  const bx = -46, by = -88, w = 92, h = 88, pulse = Math.sin(f * 0.2) * 3, look = Math.sin(f * 0.03) * 3;
  for (const [dx, col] of [[-4, 'rgba(255,0,255,.6)'], [4, 'rgba(0,229,255,.6)']]) { ctx.fillStyle = col; ctx.fillRect(bx + dx, by, w, h); }
  ctx.fillStyle = '#1a0026'; ctx.fillRect(bx, by, w, h);
  const cs = ['#ff00ff', '#00e5ff', '#76ff03', '#ff1744', '#ffea00'];
  for (let i = 0; i < 8; i++) for (let j = 0; j < 8; j++)
    if ((i * 5 + j * 3 + Math.floor(f / 6)) % 7 === 0) { ctx.fillStyle = cs[(i + j) % 5]; ctx.fillRect(bx + i * w / 8, by + j * h / 8, w / 8, h / 8); }
  for (const ex of [-22, 22]) {                                   // big pixel eyes
    ctx.fillStyle = '#fff'; ctx.fillRect(ex - 13, by + 22, 26, 26);
    ctx.fillStyle = '#ff1744'; ctx.fillRect(ex - 6 + look, by + 30, 12, 12);
  }
  ctx.fillStyle = '#000'; ctx.fillRect(-38, by + 14 + pulse, 30, 6); ctx.fillRect(8, by + 14 + pulse, 30, 6);
  ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath();   // zig-zag mouth
  for (let i = 0; i <= 6; i++) ctx.lineTo(-30 + i * 10, by + 70 + (i % 2 ? -7 : 7));
  ctx.stroke();
  ctx.restore();
}

// 🎩 Duke Googool (robojump3.html drawDuke): drawn at local (x, y), scale sc, inside the Goo Mech's dome
function ta_duke(ctx, f, x, y, sc) {
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
  const wob = Math.sin(f * 0.12) * 3;
  ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.moveTo(4, 150); ctx.lineTo(14, 70); ctx.lineTo(56, 70); ctx.lineTo(66, 150); ctx.fill();   // cape
  ta_rr(ctx, 10, 40 + wob, 50, 110 - wob, [25, 25, 10, 10], '#00c853');                                                            // goo body
  ta_ell(ctx, 22, 56 + wob, 6, 9, 'rgba(255,255,255,.35)', -0.3);
  ctx.fillStyle = '#212121'; ctx.fillRect(2, 36 + wob, 66, 7);                                                                    // spiky top hat
  ctx.beginPath(); ctx.moveTo(14, 38 + wob); ctx.lineTo(16, 4 + wob);
  for (let k = 0; k < 5; k++) { ctx.lineTo(19 + k * 8, -8 + wob); ctx.lineTo(23 + k * 8, 4 + wob); }
  ctx.lineTo(56, 38 + wob); ctx.fill();
  ctx.fillStyle = '#76ff03'; ctx.fillRect(16, 28 + wob, 40, 5);
  ta_circle(ctx, 25, 62 + wob, 7, '#fff'); ta_circle(ctx, 46, 62 + wob, 8, '#fff');                                              // eyes + monocle
  ta_circle(ctx, 26, 63 + wob, 3.5, '#000'); ta_circle(ctx, 47, 63 + wob, 4, '#000');
  ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(46, 62 + wob, 11, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#1b5e20'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(24, 80 + wob); ctx.quadraticCurveTo(35, 88 + wob, 48, 78 + wob); ctx.stroke();
  ctx.restore();
}
// 🤖 DUKE GOOGOOL'S GOO MECH (robojump3.html drawBoss, kind 'mech', 170x200)
function ta_gooMech(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 0.4 * s);
  const w = 170, h = 200, bx = -85, by = -200;
  ta_rr(ctx, bx + 20, by + h - 60, 40, 60, 10, '#263238'); ta_rr(ctx, bx + w - 60, by + h - 60, 40, 60, 10, '#263238');   // legs
  ta_rr(ctx, bx + 10, by + 70, w - 20, 90, 20, '#37474f');                                                               // body
  for (let k = 0; k < 3; k++) ta_rr(ctx, bx + 30 + k * 40, by + 100, 26, 26, 8, (f >> 4) % 3 === k ? '#ccff90' : '#76ff03');
  for (const d of [-1, 1]) { ta_rr(ctx, d * (w / 2 + 6) - 20, by + 80, 40, 24, 10, '#263238'); ta_circle(ctx, d * (w / 2 + 26), by + 92, 12, '#76ff03'); }   // goo cannons
  ctx.fillStyle = 'rgba(178,255,89,.35)'; ctx.beginPath(); ctx.arc(0, by + 74, 56, Math.PI, 0); ctx.fill();               // glass dome
  ta_duke(ctx, f, -26 + 9, by + 4, 0.48);
  ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(0, by + 74, 56, Math.PI, 0); ctx.stroke();
  for (let k = 0; k < 5; k++) ta_rr(ctx, bx + 14 + k * 32, by + 156, 10, 8 + ((f + k * 9) % 30) / 3, 5, '#64dd17');      // goo drips
  ctx.restore();
}

// 🌍 Robo Jump 3D (robojump3d.html makeRobo: spheres, 1 unit ≈ 60px): a rounder, shinier Robo
function ta_robo3d(ctx, x, yb, s, f) {
  const sq = 1 + Math.sin(f * 0.08) * 0.025;
  ta_begin(ctx, x, yb, 60 * s); ctx.scale(1 / sq, sq); ctx.translate(0, -0.08);
  const shade = (cx, cy, rx, ry, col, dark) => {
    const g = ctx.createRadialGradient(cx - rx * 0.35, cy - ry * 0.4, rx * 0.1, cx, cy, rx * 1.1);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, col); g.addColorStop(1, dark); ta_ell(ctx, cx, cy, rx, ry, g);
  };
  ta_rr(ctx, -0.27, -0.24, 0.2, 0.24, 0.05, '#3d5afe'); ta_rr(ctx, 0.07, -0.24, 0.2, 0.24, 0.05, '#3d5afe');   // boots
  shade(0, -0.47, 0.36, 0.3, '#f5f7ff', '#b8c0e0');                                                           // body
  ta_ell(ctx, 0, -0.45, 0.07, 0.07, '#2979ff');                                                               // glowing chest
  ta_rr(ctx, -0.5, -1.02, 0.14, 0.2, 0.05, '#2979ff'); ta_rr(ctx, 0.36, -1.02, 0.14, 0.2, 0.05, '#2979ff');   // ear cylinders
  shade(0, -0.92, 0.4, 0.36, '#ffffff', '#c5cbe0');                                                           // head
  ta_ell(ctx, 0, -0.9, 0.31, 0.24, '#111827');                                                                // visor
  ta_ell(ctx, -0.1, -1.0, 0.08, 0.04, 'rgba(255,255,255,.25)', -0.4);
  const bl = f % 180 < 6 ? 0.015 : 0.09;
  ta_ell(ctx, -0.12, -0.9, 0.06, bl, '#40c4ff'); ta_ell(ctx, 0.12, -0.9, 0.06, bl, '#40c4ff');               // eyes
  ctx.restore();
}
// 👑 GIANT KING GLOOP (robojump3d.html makeBlob(0x7c4dff, crown, brows))
function ta_giantGloop3d(ctx, x, yb, s, f) {
  const hop = Math.abs(Math.sin(f * 0.05)), sq = 1 + (hop < 0.2 ? (0.2 - hop) * 0.4 : 0);
  ta_begin(ctx, x, yb, 34 * s); ctx.scale(sq, 1 / sq);
  const g = ctx.createRadialGradient(-0.35, -1.35, 0.1, 0, -0.95, 1.1);
  g.addColorStop(0, '#d1c4ff'); g.addColorStop(0.45, '#7c4dff'); g.addColorStop(1, '#4527a0');
  ta_ell(ctx, 0, -0.96, 1.0, 0.96, g);                                                          // round purple body
  ta_ell(ctx, -0.4, -1.44, 0.2, 0.12, 'rgba(255,255,255,.35)', -0.4);
  for (const d of [-1, 1]) {
    ta_ell(ctx, d * 0.34, -1.1, 0.26, 0.3, '#fff'); ta_ell(ctx, d * 0.3, -1.04, 0.13, 0.16, '#000');
    ctx.save(); ctx.translate(d * 0.36, -1.48); ctx.rotate(d * 0.45); ctx.fillStyle = '#000'; ctx.fillRect(-0.24, -0.05, 0.48, 0.1); ctx.restore();   // brows
  }
  ta_ell(ctx, 0, -0.66, 0.28, 0.12, '#311b92');                                                 // mouth
  ctx.fillStyle = '#ffd740'; ctx.beginPath(); ctx.moveTo(-0.5, -1.78);                           // crown
  for (let i = 0; i <= 4; i++) ctx.lineTo(-0.5 + i * 0.25, -1.92 - (i % 2 ? 0.1 : 0.42));
  ctx.lineTo(0.5, -1.78); ctx.closePath(); ctx.fill();
  ctx.restore();
}

// 🌑 NEGA-ROBO (robojump4.html drawRobo with PAL_NEGA + the boss's purple glow, drawBoss kind 'nega')
function ta_negaRobo(ctx, x, yb, s, f) {
  const sq = 1 + Math.sin(f * 0.08) * 0.025;
  ta_begin(ctx, x, yb, 2 * s);
  ta_circle(ctx, 0, -20, 26 + Math.sin(f * 0.1) * 1.5, 'rgba(213,0,249,.14)');
  ctx.scale(1 / sq, sq);
  ta_roboBody(ctx, f, TA_PAL_NEGA, -1, { eyeGlow: 'rgba(224,64,251,.35)' });
  ctx.restore();
}

// 👻 PHANTOM ROBO (robojump5.html drawPhantom): see-through, ghost tail, dashed glowing outline, hollow eyes
function ta_phantomRobo(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 1.9 * s);
  ctx.translate(0, -2 - Math.sin(f * 0.07) * 2);                 // he floats
  const t = f, x0 = -15, y = -40, w = 30, h = 40, face = -1;
  const flick = 0.75 + Math.sin(t * 0.3) * 0.1 + (t % 47 < 3 ? -0.3 : 0);
  for (let k = 2; k >= 1; k--) ta_ell(ctx, 0, y + h * 0.5, w * 0.5 + k * 5, h * 0.55 + k * 5, k % 2 ? 'rgba(29,233,182,.09)' : 'rgba(224,64,251,.09)');
  ctx.globalAlpha = 0.55 * flick + 0.2;
  ctx.fillStyle = 'rgba(124,77,255,.55)'; ctx.beginPath(); ctx.moveTo(x0 + 2, y + h * 0.55);   // wavy ghost tail
  for (let i = 0; i <= 6; i++) ctx.lineTo(x0 + 2 + i * (w - 4) / 6, y + h + Math.sin(t * 0.2 + i * 1.3) * 4 + (i % 2 ? -5 : 0));
  ctx.lineTo(x0 + w - 2, y + h * 0.55); ctx.fill();
  ta_rr(ctx, x0 + 2, y + h * 0.48, w - 4, h * 0.38, 6, 'rgba(29,233,182,.55)');
  ta_rr(ctx, x0 - 5, y + h * 0.3 - 3, 6, 9, 3, 'rgba(224,64,251,.6)'); ta_rr(ctx, x0 + w - 1, y + h * 0.3 - 3, 6, 9, 3, 'rgba(224,64,251,.6)');
  ta_rr(ctx, x0 - 2, y, w + 4, h * 0.55, 12, 'rgba(100,255,218,.55)');
  ta_rr(ctx, x0 + 2, y + 4, w - 4, h * 0.55 - 9, 9, 'rgba(20,0,40,.7)');
  ctx.globalAlpha = 1;
  ctx.strokeStyle = t % 8 < 4 ? 'rgba(29,233,182,.9)' : 'rgba(234,128,252,.9)'; ctx.lineWidth = 2;   // flickering outline
  ctx.setLineDash([6, 4]); ctx.lineDashOffset = -t * 0.6;
  ta_rr(ctx, x0 - 2, y, w + 4, h * 0.55, 12); ctx.stroke(); ctx.setLineDash([]);
  const ex = face * 3, ey = y + h * 0.27;                                                          // hollow glowing eyes
  for (const d of [-6, 6]) {
    ta_circle(ctx, ex + d, ey, 6, 'rgba(29,233,182,.35)');
    ctx.strokeStyle = '#e040fb'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex + d, ey, 3.4, 0, 7); ctx.stroke();
  }
  ctx.strokeStyle = '#e040fb'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.moveTo(ex - 5, ey + 8);    // wiggly mouth
  for (let i = 1; i <= 4; i++) ctx.lineTo(ex - 5 + i * 2.5, ey + 8 + (i % 2 ? -2 : 0));
  ctx.stroke();
  ctx.restore();
}

// 👾 GLITCH ROBO (robojump6.html drawGlitchRobo + drawRoboBase pal.glitch): RGB-split edges, jagged visor, static pixels
function ta_glitchRobo(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 2 * s);
  const jx = f % 53 < 3 ? (f % 2 ? 3 : -3) : 0, face = -1;
  ctx.translate(jx, 0);
  const flat = c => ({ head: c, body: c, visor: c, eye: c, legs: c, pod: c });
  ctx.globalAlpha = 0.6; ctx.save(); ctx.translate(-2, 0); ta_roboBody(ctx, f, flat('#ff00e5'), face, { noEyes: true }); ctx.restore();
  ctx.globalAlpha = 0.55; ctx.save(); ctx.translate(2, 0.5); ta_roboBody(ctx, f, flat('#00e676'), face, { noEyes: true }); ctx.restore();
  ctx.globalAlpha = 1;
  ta_roboBody(ctx, f, TA_PAL_GLITCH, face);
  const x0 = -15, y = -40, w = 30, h = 40, ex = face * 3, ey = y + h * 0.27;
  ctx.strokeStyle = f % 10 < 5 ? '#ff00e5' : '#00e676'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x0 + 2, y + 6);   // jagged visor
  for (let k = 1; k <= 6; k++) ctx.lineTo(x0 + 2 + k * (w - 4) / 6, y + 6 + (k % 2 ? 6 : 0));
  ctx.lineTo(x0 + w - 2, y + h * 0.55 - 6); ctx.lineTo(x0 + 2, y + h * 0.55 - 6); ctx.closePath(); ctx.stroke();
  ctx.fillStyle = '#ff00e5';
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(ex + d * 2, ey - 3); ctx.lineTo(ex + d * 10, ey - 5); ctx.lineTo(ex + d * 7, ey - 1); ctx.fill(); }
  for (let k = 0; k < 7; k++) {                                   // broken pixels + bright static bits
    const px = x0 + ((k * 37 + Math.floor(f / 9) * 11) % w), py = y + ((k * 23 + Math.floor(f / 7) * 5) % Math.floor(h * 0.9));
    ctx.fillStyle = k % 3 === 0 ? '#000' : k % 3 === 1 ? '#00e676' : '#ff00e5'; ctx.fillRect(px, py, 2.5, 2.5);
  }
  if (f % 41 < 4) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(x0 - 4, y + ((f * 13) % h), w + 8, 1.5); }   // static line
  ctx.restore();
}

// ⏳ TIME ROBO (robojump7.html timeRoboShape): bronze Robo, hourglass cape, clock antenna, gear ears, clock in his visor
function ta_timeRobo(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 1.55 * s);
  const ry = -40, rh = 40, k = 1, cx = 0, face = -1, pal = TA_PAL_TIME;
  ctx.fillStyle = '#4a148c'; ctx.beginPath();                                                     // hourglass cape
  ctx.moveTo(cx - 17, ry + rh * 0.48); ctx.lineTo(cx + 17, ry + rh * 0.48); ctx.lineTo(cx + 4, ry + rh * 0.68);
  ctx.lineTo(cx + 16, ry + rh * 0.96); ctx.lineTo(cx - 16, ry + rh * 0.96); ctx.lineTo(cx - 4, ry + rh * 0.68); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 1.2; ctx.stroke();
  ctx.strokeStyle = pal.legs; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(cx, ry + 1); ctx.lineTo(cx, ry - 6); ctx.stroke();   // antenna
  const ta = f * 0.12;
  ta_circle(ctx, cx, ry - 9, 3.6, '#ffb300'); ta_circle(ctx, cx, ry - 9, 2.6, '#fff8e1');
  ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(cx, ry - 9); ctx.lineTo(cx + Math.cos(ta) * 2.2, ry - 9 + Math.sin(ta) * 2.2); ctx.stroke();
  ta_roboBody(ctx, f, pal, face, { noEyes: true });
  for (const ex of [-17, 17]) ta_gear(ctx, ex, ry + rh * 0.3 + 1.5, 3.5, f * 0.05 * (ex < 0 ? 1 : -1), '#ffb300');   // gear ear pods
  const vx = cx + face * 3, vy = ry + rh * 0.27, vr = 3.8;                                        // clock face in the visor
  ta_circle(ctx, vx, vy, vr, 'rgba(255,179,0,.18)');
  ctx.strokeStyle = 'rgba(255,179,0,.55)'; ctx.lineWidth = 0.9; ctx.beginPath(); ctx.arc(vx, vy, vr, 0, 7); ctx.stroke();
  const tick = Math.floor(f / 30), ma = tick * Math.PI / 6 - Math.PI / 2;
  ctx.lineCap = 'round'; ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 1.1;
  ctx.beginPath(); ctx.moveTo(vx, vy); ctx.lineTo(vx + Math.cos(ma) * vr * 0.85, vy + Math.sin(ma) * vr * 0.85); ctx.stroke(); ctx.lineCap = 'butt';
  const ex = cx + face * 3, ey = ry + rh * 0.27;
  for (const d of [-1, 1]) { ta_circle(ctx, ex + d * 8, ey, 4, 'rgba(213,128,255,.3)'); ta_ell(ctx, ex + d * 8, ey, 2.6, f % 180 < 6 ? 0.6 : 3.6, pal.eye); }
  ctx.strokeStyle = '#ffb300'; ctx.lineWidth = 1.2;                                               // slanty brows
  for (const d of [-1, 1]) { ctx.beginPath(); ctx.moveTo(ex + d * 11, ey - 6.5); ctx.lineTo(ex + d * 5, ey - 4.5); ctx.stroke(); }
  ctx.restore();
}

function ta_chain(ctx, x1, y1, x2, y2, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 1;
  for (let i = 0; i < 5; i++) {
    const t = (i + 0.5) / 5, a = Math.atan2(y2 - y1, x2 - x1);
    ctx.beginPath(); ctx.ellipse(x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, 2.2, i % 2 ? 0.8 : 1.4, a, 0, 7); ctx.stroke();
  }
}
function ta_key(ctx, x, y, col, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.arc(-2.5, 0, 1.4, 0, 7); ctx.stroke(); ctx.fillRect(-1.1, -0.4, 4.2, 0.8); ctx.fillRect(2.2, 0, 0.8, 1.4);
  ctx.restore();
}
// 🔒 LOCK ROBO (robojump8.html lockRoboShape): steel Robo, padlock shackle on his head, padlock chest, chains, key ring, keyhole visor
function ta_lockRobo(ctx, x, yb, s, f) {
  ta_begin(ctx, x, yb, 1.65 * s);
  const ry = -40, rh = 40, cx = 0, face = -1, pal = TA_PAL_LOCK, sway = Math.sin(f * 0.12) * 3;
  for (const d of [-1, 1]) ta_chain(ctx, cx + d * 15, ry + rh * 0.52, cx + d * 19 + sway * d, ry + rh * 0.95, '#90a4ae');

// ⭐ the Nova family share Chaos Nova's shape: a big star body, jagged crystal wings and ONE big eye
const TA_OUT = '#1b1b2f';

function ta_novaEye(ctx, R, f, lw, pupil) {              // the ONE big eye (it blinks); pupil(ctx, tx, ty) draws the middle

// 💎 JEWELMENTAL NOVA (robojumpstars.html drawNova, phase 1)

  }
  for (let i = 0; i < 6; i++) {                          // the six jewels

function styleBpm(st, song, range) {                  // fast boss songs make the remix a bit faster too
  const r = range || BPM_RANGE[st.id] || [70, 190];

  if (styleId === 'spooky' && song.scale === 'dorian') d.scale = 'dorian';   // dorian tunes are already a bit spooky: keep their notes

}

  BTNS.forEach((b, i) => { if (sel === 8 + i) roundRect(b.x - 5, b.y - 5, b.w + 10, b.h + 10, 20, '#fff176'); });
  roundRect(PLAY_BTN.x, PLAY_BTN.y, PLAY_BTN.w, PLAY_BTN.h, 16, P ? '#e53935' : '#43a047');
  text(P ? '⏹ STOP' : '▶ PLAY', PLAY_BTN.x + PLAY_BTN.w / 2, PLAY_BTN.y + 38, 27);
  roundRect(LOOP_BTN.x, LOOP_BTN.y, LOOP_BTN.w, LOOP_BTN.h, 16, save.loop ? '#00acc1' : '#546e7a');
  text('🔁 LOOP ' + (save.loop ? 'ON' : 'OFF'), LOOP_BTN.x + LOOP_BTN.w / 2, LOOP_BTN.y + 37, 21);
  roundRect(MIX_BTN.x, MIX_BTN.y, MIX_BTN.w, MIX_BTN.h, 16, '#8e24aa');
  text('🎛️ Mix it!', MIX_BTN.x + MIX_BTN.w / 2, MIX_BTN.y + 38, 26);
  const hc = heardCount();
  text(save.trophy ? '🏆 Remix Tower!' : '🏆 ' + Math.min(hc, 5) + ' / 5 remixes', 800, 470, 19, save.trophy ? '#ffd740' : '#fff');
  if (!f.roof) text(floorHeard(f) + ' / ' + FLOOR_TILES[f.id].length + ' heard on this floor', 800, 494, 14, '#cfd8dc');
}

function drawMake() {                                  // 🛠️ MAKE YOUR OWN MIRROR REMIX: big buttons, no typing
  roundRect(40, 106, W - 80, 172, 18, 'rgba(255,255,255,.12)');

  roundRect(MK.sty.x, MK.sty.y, MK.sty.w, MK.sty.h, 14, s === 'mirror' ? '#4fc3f7' : STYLE[s].col); text(nm, MK.sty.x + MK.sty.w / 2, MK.sty.y + 41, nm.length > 14 ? 20 : 24);

  roundRect(MK.play.x, MK.play.y, MK.play.w, MK.play.h, 14, on ? '#e53935' : '#43a047'); text(on ? '🔁 PLAY AGAIN' : '▶ PLAY MY REMIX', MK.play.x + MK.play.w / 2, MK.play.y + 40, 22);
}
function draw() {
  if (scr === 'lobby') drawLobby();
  else if (scr === 'ride') drawRide();
  else {
    drawFloor();
    const op = ride && ride.open ? (performance.now() - ride.open) / 450 : 9;   // 🛗 the doors slide open onto the new floor
    if (op < 1) drawDoors(0, 0, W, H, op * op);
  }
  if (scr === 'lobby' && ride && ride.open) { const op = (performance.now() - ride.open) / 450; if (op < 1) drawDoors(0, 0, W, H, op * op); }
  if (trophyFlash > 0) {
    ctx.globalAlpha = Math.min(1, trophyFlash / 40);
    roundRect(W / 2 - 290, 180, 580, 130, 24, '#ffb300');
    text(trophyMsg[0], W / 2, 236, 34);
    text(trophyMsg[1], W / 2, 280, 20);
    ctx.globalAlpha = 1;
  }
}
function loop() {
  try { update(); playMusic(); draw(); } catch (err) { if (window.__TEST__) throw err; }
  requestAnimationFrame(loop);
}
// ?floor=rj7 (or mirror / roof) jumps straight to a floor, &tab=1 picks a page (handy for the book and for testing)
try {
  const q = new URLSearchParams(location.search), fl = q.get('floor');
  if (fl) { const i = fl === 'roof' ? 16 : FLOORS.findIndex(f => f.id === fl); if (i >= 0) { goFloor(i, true); tabI = Math.min(+q.get('tab') || 0, Math.max(0, curTabs().length - 1)); } }
  if (q.get('ride')) { const i = +q.get('ride'); ride = { from: -1, to: i, t0: performance.now() - (+q.get('t') || 0) * 1000, dinged: false, freeze: +q.get('t') || 0 }; scr = 'ride'; }
} catch (_) {}
if (!JB) { checkTrophies(true); for (const f of FLOORS) save.stars[f.id] = floorStars(f); }
loop();
</script>
