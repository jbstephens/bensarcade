<!DOCTYPE html>
<html lang="en">

<script src="touchpad.js?v=11"></script>
<style>

</style>

<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="top">
    <div id="title">🌱 Grow a Garden <span id="idea">💡 Ben's idea!</span></div>
    <div id="rightBtns">
      <button class="pill" id="ffBtn">⏩ Fast-forward</button>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';
// ---------- shared bits: trophies, prize pop-up, gentle sound ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function showPrize(msg, ms) { const p = document.getElementById('prize'); p.innerHTML = msg; p.classList.add('show'); clearTimeout(showPrize.t); showPrize.t = setTimeout(() => p.classList.remove('show'), ms || 4500); }
function load(key, def) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v && typeof v === 'object' ? v : def; } catch (_) { return def; } }

const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
const rnd = (a, b) => a + Math.random() * (b - a), clamp = (x, a, b) => Math.max(a, Math.min(b, x)), lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// ---------- gentle, optional sound (OFF by default, very quiet, always fades in and out) ----------
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null, on = false, amb = null, ambKind = '', birdT = 0, rainG = null, loopG = {};
  const MAX = 0.12;
  function init() {
    if (ctx) return;

    master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -30; comp.ratio.value = 8;
    master.connect(comp); comp.connect(ctx.destination);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 3, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); let b = 0;
    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b = (b + 0.02 * w) / 1.02; d[i] = w * 0.5 + b * 3; }
  }
  function noise() { const s = ctx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; s.start(); return s; }
  function filt(type, f, q) { const n = ctx.createBiquadFilter(); n.type = type; n.frequency.value = f; n.Q.value = q || 0.7; return n; }

    n.connect(f); f.connect(g); g.connect(out); const l1 = lfo(0.07, 0.05, g.gain), l2 = lfo(0.05, 150, f.frequency);

      if (!on || !amb) return;
      const night = ambKind === 'night', t = ctx.currentTime, e = ctx.createGain(); e.connect(amb.out);
      const notes = night ? 3 : 2 + Math.floor(Math.random() * 3), base = night ? 4200 : 2200 + Math.random() * 1400;
      for (let k = 0; k < notes; k++) {
        const o = ctx.createOscillator(), gg = ctx.createGain(), s0 = t + k * (night ? 0.05 : 0.11);
        o.type = 'sine'; o.frequency.setValueAtTime(base, s0); o.frequency.linearRampToValueAtTime(base * (night ? 1 : 1.25), s0 + 0.07);
        gg.gain.setValueAtTime(0, s0); gg.gain.linearRampToValueAtTime(night ? 0.010 : 0.018, s0 + 0.02); gg.gain.linearRampToValueAtTime(0, s0 + (night ? 0.04 : 0.08));

  function stopAmb() {
    clearTimeout(birdT); if (!amb) return; const a = amb; amb = null;
    a.out.gain.setTargetAtTime(0, ctx.currentTime, 0.4);
    setTimeout(() => { a.nodes.forEach(n => { try { n.stop(); } catch (_) {} }); a.out.disconnect(); }, 2500);
  }
  // a looping soft hush (rain, pouring water, wind) that fades in and out by name
  function loop(name, want, type, freq, vol) {
    if (!ctx || !on) want = false;
    let L = loopG[name];
    if (want && !L) {
      const n = noise(), f = filt(type || 'lowpass', freq || 800, .7), g = ctx.createGain(); g.gain.value = 0;
      n.connect(f); f.connect(g); g.connect(master); L = loopG[name] = { n, g, vol: vol || 0.2 };
    }
    if (!L) return;
    L.g.gain.setTargetAtTime(want ? L.vol : 0, ctx.currentTime, want ? 0.3 : 0.25);
    if (!want) { clearTimeout(L.kill); L.kill = setTimeout(() => { if (loopG[name] === L && L.g.gain.value < 0.01) { try { L.n.stop(); } catch (_) {} L.g.disconnect(); delete loopG[name]; } }, 2000); }
    else clearTimeout(L.kill);
  }
  // soft little notes: k = 0..n pitch steps; kinds: chime (sparkly), pop (wooden), buzz (tiny soft hum)
  function note(kind, k) {
    if (!ctx || !on) return;
    const t = ctx.currentTime, e = ctx.createGain(); e.connect(master);
    const scale = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5];
    const f0 = kind === 'pop' ? 300 + (k || 0) * 40 : kind === 'buzz' ? 220 : scale[(k || 0) % scale.length];
    const o = ctx.createOscillator(); o.type = kind === 'buzz' ? 'triangle' : 'sine'; o.frequency.setValueAtTime(f0, t);
    if (kind === 'pop') o.frequency.exponentialRampToValueAtTime(f0 * 0.6, t + 0.12);
    const v = kind === 'chime' ? 0.10 : kind === 'pop' ? 0.12 : 0.03, len = kind === 'chime' ? 0.9 : kind === 'pop' ? 0.16 : 0.5;
    e.gain.setValueAtTime(0, t); e.gain.linearRampToValueAtTime(v, t + 0.015); e.gain.exponentialRampToValueAtTime(0.0005, t + len);
    o.connect(e); o.start(t); o.stop(t + len + 0.05);
    if (kind === 'chime') { const o2 = ctx.createOscillator(), e2 = ctx.createGain(); o2.frequency.value = f0 * 2.01; e2.gain.setValueAtTime(0, t); e2.gain.linearRampToValueAtTime(v * 0.3, t + 0.01); e2.gain.exponentialRampToValueAtTime(0.0005, t + len * 0.6); o2.connect(e2); e2.connect(master); o2.start(t); o2.stop(t + len); }
  }
  function tune(ks) { ks.forEach((k, i) => setTimeout(() => note('chime', k), i * 140)); }
  function toggle() {
    init(); on = !on;
    if (on) { ctx.resume && ctx.resume(); master.gain.cancelScheduledValues(ctx.currentTime); master.gain.setTargetAtTime(MAX, ctx.currentTime, 0.8); startAmb(); }
    else { master.gain.setTargetAtTime(0, ctx.currentTime, 0.3); stopAmb(); Object.keys(loopG).forEach(k => loop(k, false)); }

  }

  function pause(p) { if (!ctx) return; if (p) ctx.suspend && ctx.suspend(); else if (on) ctx.resume && ctx.resume(); }
  return { toggle, pause, note, tune, loop, setAmb, get on() { return on; } };
})();
// ---------- the 3D engine: three.js scene -> HDR picture -> "camera lens" finish (depth of field, glow, film curve, vignette, grain) ----------
const ENG = (() => {
  const E = {};
  const cv = document.getElementById('gl');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' }); } catch (_) { renderer = null; }
  if (!renderer || !window.THREE) { document.getElementById('oops').style.display = 'flex'; E.ok = false; return E; }

  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.toneMapping = THREE.NoToneMapping; renderer.outputEncoding = THREE.LinearEncoding;
  const scene = E.scene = new THREE.Scene();
  const camera = E.camera = new THREE.PerspectiveCamera(45, 1, 0.05, 400);

  const ext = renderer.extensions;
  const hdr = (renderer.capabilities.isWebGL2 && ext.get('EXT_color_buffer_float')) || (!renderer.capabilities.isWebGL2 && ext.get('EXT_color_buffer_half_float') && ext.get('OES_texture_half_float'));
  const rt = new THREE.WebGLRenderTarget(4, 4, { type: hdr ? THREE.HalfFloatType : THREE.UnsignedByteType, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter });
  const mips = renderer.capabilities.isWebGL2; if (mips) { rt.texture.generateMipmaps = true; rt.texture.minFilter = THREE.LinearMipmapLinearFilter; }
  rt.depthTexture = new THREE.DepthTexture(4, 4); rt.depthTexture.type = THREE.UnsignedIntType;
  const U = E.post = {
    tCol: { value: rt.texture }, tDep: { value: rt.depthTexture }, uRes: { value: new THREE.Vector2(4, 4) }, uT: { value: 0 },
    cNear: { value: camera.near }, cFar: { value: camera.far }, uFocus: { value: 10 }, uAp: { value: 0 }, uMaxR: { value: 14 },
    uTilt: { value: 0 }, uTiltY: { value: 0.45 }, uExp: { value: 0.8 }, uGlow: { value: mips ? 0.6 : 0 }, uPre: { value: hdr ? 1 : 2 },
    uSat: { value: 1.05 }, uVig: { value: 0.32 }, uTint: { value: new THREE.Vector3(1, 1, 1) },
  };
  E.hdr = !!hdr;
  const postMat = new THREE.ShaderMaterial({ uniforms: U, depthTest: false, depthWrite: false,
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
    fragmentShader: `
precision highp float;
varying vec2 vUv; uniform sampler2D tCol, tDep; uniform vec2 uRes; uniform float uT, cNear, cFar, uFocus, uAp, uMaxR, uTilt, uTiltY, uExp, uGlow, uPre, uSat, uVig; uniform vec3 uTint;
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }

float coc(vec2 uv){

  return min(c*uRes.y/600., uMaxR);
}
#if __VERSION__ >= 300
#define TL(t,u) textureLod(t,u,0.)
#else
#define TL(t,u) texture2D(t,u)
#endif
vec3 col(vec2 uv){ return TL(tCol,uv).rgb*uPre; }   // always the sharp level (sampling inside a branch must not guess a blurry one)
void main(){
  vec2 px=1./uRes; float c0=coc(vUv);
  vec3 acc=col(vUv); float wsum=1.;

    const float GA=2.39996;
    for(int i=1;i<28;i++){
      float fi=float(i), r=sqrt(fi/27.)*c0; vec2 o=vec2(cos(fi*GA),sin(fi*GA))*r*px;

      float w=smoothstep(r-1.5,r,cs+.5);                          // a sharp thing in front must not smear over its neighbours
      acc+=col(su)*w; wsum+=w;
    }
  }

  vec3 g=max(texture2D(tCol,vUv,3.).rgb*uPre-vec3(1.6),0.)*.5+max(texture2D(tCol,vUv,5.).rgb*uPre-vec3(1.3),0.)*.7+max(texture2D(tCol,vUv,6.5).rgb*uPre-vec3(1.1),0.)*.5;
  c+=g*uGlow;
  c*=uExp*uTint;
  float l=dot(c,vec3(.2126,.7152,.0722)); c=max(mix(vec3(l),c,uSat),0.);
  c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);                      // ACES film curve
  c=pow(clamp(c,0.,1.),vec3(1./2.2));
  vec2 q=vUv-.5; c*=1.-uVig*pow(length(q*vec2(1.1,1.4)),2.2);    // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/80.;            // film grain
  gl_FragColor=vec4(c,1.);
}` });
  const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat); quad.frustumCulled = false; postScene.add(quad);

  // ---------- auto resolution: start sharp, draw fewer pixels if frames get slow (iPad speed) ----------
  let pr = Math.min(window.devicePixelRatio || 1, 2) * (isTouch ? 0.75 : 1);
  const minPr = 0.5; E.ft = [];

    const w = innerWidth, h = innerHeight;
    renderer.setPixelRatio(pr); renderer.setSize(w, h, false);
    const W = Math.round(w * pr), H = Math.round(h * pr);
    rt.setSize(W, H); U.uRes.value.set(W, H);

const ffBtn = document.getElementById('ffBtn'), dayBtn = document.getElementById('dayBtn'), rainBtn = document.getElementById('rainBtn');
ffBtn.addEventListener('click', e => { e.stopPropagation(); DAY.ff = !DAY.ff; DAY.target = null; ffBtn.classList.toggle('on', DAY.ff); ffBtn.textContent = DAY.ff ? '⏸️ Normal speed' : '⏩ Fast-forward';
  if (DAY.ff) say('⏩ Time-lapse! Days zoom by, and you can see your plants grow. Real plants take weeks!'); Sound.note('chime', DAY.ff ? 4 : 2); });
dayBtn.addEventListener('click', e => { e.stopPropagation(); DAY.ff = false; ffBtn.classList.remove('on'); ffBtn.textContent = '⏩ Fast-forward';
  DAY.target = DAY.amt > 0.5 ? 21.5 : 9.5; Sound.note('chime', DAY.amt > 0.5 ? 0 : 4);
  if (DAY.target > 12) say('🌙 Good night, garden! Tulips and daisies close their flowers at night and open again in the morning.'); });
rainBtn.addEventListener('click', e => { e.stopPropagation(); DAY.rainWant = DAY.rainWant ? 0 : 1; rainBtn.classList.toggle('on', !!DAY.rainWant); Sound.loop('rain', !!DAY.rainWant, 'lowpass', 1400, 0.22);
  if (DAY.rainWant) say('🌧️ A gentle rain! Rain soaks into the soil, and the roots drink it up. It waters every plant at once!'); });
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', e => { e.stopPropagation(); const on = Sound.toggle(); soundBtn.textContent = on ? '🔊 Sound on' : '🔈 Sound off'; if (on && DAY.rainWant) Sound.loop('rain', true, 'lowpass', 1400, 0.22); });
document.getElementById('hideBtn').addEventListener('click', e => { e.stopPropagation(); ui.classList.add('hidden'); });
document.addEventListener('pointerdown', e => { if (ui.classList.contains('hidden')) { e.preventDefault(); setTimeout(() => ui.classList.remove('hidden'), 50); } });
addEventListener('keydown', e => { if (e.key === 'Escape') ui.classList.toggle('hidden'); });
// ---------- start ----------
ENG.onFrame((dt, T) => { windU.value = T; sky(dt); rainStep(dt); fliesStep(T); growStep(dt, T); canStep(dt); visitStep(dt, T); bubbleStep(); });
if (Q.get('rain')) { DAY.rainWant = DAY.rain = 1; rainBtn.classList.add('on'); }
if (Q.get('ff')) { DAY.ff = true; ffBtn.classList.add('on'); }
if (Q.get('water')) { CAN.target.set(1.5, SOIL_Y, 0.4); CAN.on = true; CAN.tilt = 1; }
if (Q.get('bees')) for (let i = 0; i < 3; i++) { addVisitor(i ? 'fly' : 'bee'); visitors[i].o.position.set(rnd(-2, 2), 1.2, rnd(-0.5, 0.5)); }
updateBasket(); pickTool(tool); factEl.textContent = '';
say('🌱 Pick a seed packet, tap the soil to plant, then water it with 🚿!');
sky(0); ENG.updateEnv(); ENG.start();
setTimeout(() => document.getElementById('loading').classList.add('gone'), 300);
if (Q.get('nowet')) SPOTS.forEach(s => s.wet.visible = false);
if (Q.get('shot')) document.getElementById('loading').style.display = 'none';
if (Q.get('cam')) { const c = Q.get('cam').split(',').map(Number); ENG.onResize = () => { camera.position.set(c[0], c[1], c[2]); camera.lookAt(c[3], c[4], c[5]); ENG.post.uFocus.value = camera.position.distanceTo(new THREE.Vector3(c[3], c[4], c[5])); }; ENG.resize(); }
</script>
</body>
</html>
