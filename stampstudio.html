<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🖐️ Stamp Studio</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; color: #333; overflow: hidden;
    user-select: none; -webkit-user-select: none; background: var(--bg); }
  #studio { position: absolute; inset: 0; display: flex; gap: 10px; padding: 10px; }
  /* ---------- tools (left) ---------- */
  #tools { width: 96px; flex: none; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .tool { font: inherit; font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 16px; box-shadow: 0 4px 0 #333;
    cursor: pointer; padding: 3px 2px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #222; flex: none; }
  .tool i { font-style: normal; font-size: 30px; line-height: 1.05; }
  .tool span { font-size: 13px; }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #333; }
  .tool.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .tool.dim { opacity: .4; }
  .tool.t-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- the board (middle) ---------- */
  #board { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #cvWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { background: #fff; border: 5px solid #333; border-radius: 12px; box-shadow: 0 7px 0 var(--accent); touch-action: none; cursor: crosshair; display: block; }
  /* ---------- side panel (right) ---------- */
  #side { width: min(36vw, 390px); flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 4px 10px 0; }
  #side h1 { margin: 0; text-align: center; font-size: clamp(22px, 2.8vw, 34px); color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 var(--accent); letter-spacing: 1px; }
  #help { font-size: 16px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 5px 8px; font-weight: bold; }
  .fact { font-size: 15px; text-align: center; background: #fff3e0; border: 4px dashed #8d6e63; border-radius: 14px; padding: 5px 8px; font-weight: bold; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .row3 .btn, .row4 .btn { font-size: 15px; padding: 5px 3px; }
  #pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; min-height: 34px; }
  .sw.sq { border-radius: 8px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .lbl { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: -4px; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px; padding: 6px 8px; cursor: pointer;
    box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-tpl { background: #c3a6ff; } .b-sur { background: #9bf6ff; } .b-save { background: #8ef08e; } .b-gal { background: #ffd180; }
  .b-print { background: #8ef08e; } .b-p2 { background: #ffb347; } .b-no { background: #ffc2d6; } .b-back { background: #9be3ff; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .hide { display: none !important; }
  input[type=range] { width: 100%; height: 40px; accent-color: var(--accent); touch-action: none; }
  /* ---------- pop-up boxes ---------- */
  .ov { position: fixed; inset: 0; background: rgba(20, 30, 70, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1180px; max-height: 100%;
    display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3.2vw, 34px); }
  .cards { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 4px 4px 10px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tabs .btn { font-size: 18px; min-height: 50px; padding: 4px 14px; background: #e8eefc; }
  .tabs .btn.on { background: #ffd60a; box-shadow: 0 0 0 4px #1e6bff; }
  .pick { background: #f4f9ff; border: 4px solid #333; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .pick svg { width: 100%; max-width: 140px; height: auto; display: block; border: 2px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  .pick b { font-size: 17px; text-align: center; }
  .pick .row2 { width: 100%; gap: 5px; }
  .pick .btn { font-size: 15px; min-height: 44px; padding: 3px; border-radius: 12px; box-shadow: 0 3px 0 #333; }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 22px; padding: 30px; }
  #askCard { max-width: 640px; text-align: center; }
  #askText { font-size: 26px; font-weight: bold; }
  #askBtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  #askBtns .btn { font-size: 22px; min-height: 64px; }
  #prCard { max-width: 900px; max-height: 100%; overflow-y: auto; }
  #prBig { display: flex; justify-content: center; gap: 12px; min-height: 0; flex: 1; flex-wrap: wrap; }
  .prPg { display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; border-radius: 12px; padding: 4px; }
  .prPg.sel { background: #ffe066; outline: 5px solid #ff4081; }
  .prPg b { font-size: 16px; }
  .prPg svg { height: min(52vh, 600px); width: auto; max-width: 100%; border: 4px solid #333; border-radius: 8px; background: #fff; display: block; }
  #prBig.many .prPg svg { height: min(40vh, 460px); }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; pointer-events: none; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #studio { flex-wrap: wrap; align-content: flex-start; overflow-y: auto; }
    #tools { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .tool { min-width: 76px; }
    #board { width: 100%; flex: none; height: 62vh; }
    #side { width: 100%; overflow: visible; }
  }
  @media (max-height: 600px) { .tool { min-height: 54px; } .tool i { font-size: 24px; } .btn { min-height: 46px; font-size: 16px; } #help { font-size: 14px; } .sw { min-height: 26px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; break-after: page; page-break-after: always; }
    #printArea svg:last-child { break-after: auto; page-break-after: auto; }
  }
  :root { --accent: #7e57c2; --bg: repeating-linear-gradient(45deg, #ede7f6 0 36px, #e1d7f3 36px 72px); }
  #cv { background: #fffdf8; cursor: pointer; }
  #padRow { display: flex; gap: 10px; align-items: center; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 6px 8px; }
  #bigPad { width: 92px; height: 92px; flex: none; border-radius: 16px; border: 4px solid #333; display: flex; align-items: center; justify-content: center; cursor: pointer; background: #555; }
  #bigPad canvas { width: 76px; height: 76px; display: block; }
  #inkInfo { flex: 1; display: flex; flex-direction: column; gap: 4px; font-size: 17px; }
  #inkTip { font-size: 14px; font-weight: bold; color: #7e57c2; }
  #meter { height: 20px; border: 3px solid #333; border-radius: 10px; overflow: hidden; background: #eee; }
  #meter i { display: block; height: 100%; background: linear-gradient(90deg, #ff5252, #ffd740, #69f0ae); transition: width .25s; }
  #pads { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 7px; }
  .pad { aspect-ratio: 1.3; border-radius: 8px; border: 3px solid #333; cursor: pointer; box-shadow: inset 0 -6px 0 rgba(0,0,0,.25); min-height: 30px; }
  .pad.sel { transform: scale(1.14); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .pad.rb { background: linear-gradient(90deg, #e53935, #fb8c00, #fdd835, #43a047, #1e88e5, #8e24aa); }
  .stamps { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 7px; min-height: 30px; }
  .stamps canvas { width: 100%; aspect-ratio: 1; border: 3px solid #333; border-radius: 10px; cursor: pointer; display: block; background: #fbe9e7; }
  .stamps canvas.sel { transform: scale(1.1); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #ff3d6e; }
  .stamps .none { grid-column: 1 / -1; font-size: 14px; text-align: center; font-weight: bold; color: #777; }
  .lbl small { font-size: 13px; color: #666; }
  #rotShow { margin: 0; align-self: center; }
  #desCard { max-width: 980px; overflow-y: auto; }
  #desWrap { display: flex; gap: 14px; align-items: flex-start; justify-content: center; flex-wrap: wrap; }
  #des { width: min(384px, 46vh); height: min(384px, 46vh); border: 5px solid #333; border-radius: 14px; touch-action: none; background: #fff; flex: none; }
  #desSide { flex: 1; min-width: 280px; display: flex; flex-direction: column; gap: 8px; }
  #desSide .btn { font-size: 16px; min-height: 46px; }
  #desSide .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #letters { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  #letters .btn { font-size: 18px; min-height: 38px; padding: 0; border-width: 3px; box-shadow: 0 3px 0 #333; border-radius: 10px; }
  #desCard .row4 .btn { font-size: 16px; }
  #side > * { flex-shrink: 0; }
</style>
</head>
<body>
<div id="studio">
  <div id="tools">
    <button class="tool" id="tStamp"><i>🖐️</i><span>Stamp</span></button>
    <button class="tool" id="tMake"><i>✏️</i><span>Make a stamp</span></button>
    <button class="tool" id="tWiggle"><i>🎲</i><span>Wiggle</span></button>
    <button class="tool" id="tUndo"><i>↩️</i><span>Undo</span></button>
    <button class="tool" id="tClear"><i>🗑️</i><span>Clear</span></button>
  </div>
  <div id="board"><div id="cvWrap"><canvas id="cv" width="800" height="1000"></canvas></div></div>
  <div id="side">
    <h1>🖐️ STAMP STUDIO</h1>
    <div id="help">Tap the paper to stamp!</div>
    <div class="row3">
      <button class="btn b-save" id="bSave">💾 Save</button>
      <button class="btn b-gal" id="bGal">🖼️ Gallery</button>
      <button class="btn b-p2" id="bPrint">🖨️ Print</button>
    </div>
    <div id="padRow"><div id="bigPad"><canvas id="cur" width="120" height="120"></canvas></div>
      <div id="inkInfo"><b id="inkName">Blue ink</b><div id="meter"><i id="meterFill"></i></div><span id="inkTip">Tap an ink pad to re-ink!</span></div></div>
    <div class="lbl">🎨 Ink pads</div>
    <div id="pads"></div>
    <div class="lbl">⭐ Ready stamps</div>
    <div id="ready" class="stamps"></div>
    <div class="lbl">🖐️ My stamps <small id="myCount"></small></div>
    <div id="mine" class="stamps"></div>
    <div class="lbl">📏 Stamp size</div>
    <input type="range" id="size" min="40" max="260" value="130">
    <div class="row3"><button class="btn" id="rotL">⬅️ Tilt</button><div id="rotShow" class="lbl">0°</div><button class="btn" id="rotR">Tilt ➡️</button></div>
  </div>
</div>
<div class="ov" id="desBox"><div class="card" id="desCard"><h2>✏️ Make your own stamp</h2>
  <div id="desWrap">
    <canvas id="des" width="384" height="384"></canvas>
    <div id="desSide">
      <div class="row2"><button class="btn" id="dDraw">✏️ Draw</button><button class="btn" id="dRub">🧽 Rub out</button></div>
      <div class="row3" id="brushes"><button class="btn" data-b="3">• Thin</button><button class="btn" data-b="6">● Medium</button><button class="btn" data-b="10">⬤ Fat</button></div>
      <div class="row2"><button class="btn" id="dSq">⬛ Square</button><button class="btn" id="dCi">⚪ Circle</button></div>
      <div class="lbl">⭐ Start from a shape</div>
      <div id="dShapes" class="stamps"></div>
      <div class="lbl">🔤 Letters</div>
      <div id="letters"></div>
    </div>
  </div>
  <div class="row4"><button class="btn b-no" id="dClear">🧽 Clear</button><button class="btn b-no" id="dToss">🗑️ Throw away</button><button class="btn b-tpl" id="dKeep">💾 Keep it</button><button class="btn b-save" id="dUse">✅ Stamp with it!</button></div>
</div></div>
<div class="ov" id="galBox"><div class="card"><h2 id="galTitle">🖼️ My Gallery</h2>
  <div class="cards" id="galList"></div>
  <button class="btn b-back" data-close="1">⬅️ Back</button></div></div>
<div class="ov" id="prBox"><div class="card" id="prCard"><h2>🖨️ Print it out</h2>
  <div class="row2"><button class="btn mode" id="prBW">⚫ Black &amp; White</button><button class="btn mode" id="prCol">🌈 Color</button></div>
  <div id="prBig"></div>
  <div id="prHow" class="lbl" style="margin:0"></div>
  <div class="row2"><button class="btn b-print" id="prGo">🖨️ Print it!</button><button class="btn b-back" data-close="1">⬅️ Back</button></div></div></div>
<div class="ov" id="askBox"><div class="card" id="askCard"><div id="askText"></div><div id="askBtns"></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// SHARED ART-TOOL HELPERS (the same in Clay Pottery Wheel, Quilt Maker and Stamp Studio)
// Each tool sets: SAVEKEY (localStorage key), TROPHY (trophy id), ART_NAME ("Beads" -> "Ben's Beads #3"),
// and the functions getArt() (the picture to save, or null if blank), loadArt(a), thumbSVG(a), printPages(color) -> [{ name, svg }], printHow(color); GAL_NAME, TROPHY_NAME.
// =====================================================================
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const n1 = v => Math.round(v * 10) / 10;
const FONT = 'font-family="Comic Sans MS, Chalkboard SE, Marker Felt, sans-serif" font-weight="bold"';
const MAX_ART = 12;
// ---------- 🔊 gentle sounds (everything goes through one quiet master volume) ----------
let actx = null, master = null;
function blip(f, when, len, type, vol) {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.07; master.connect(actx.destination); }
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (when || 0), L = len || 0.15;
    o.type = type || 'triangle'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.7, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + L);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + L + 0.02);
  } catch (_) {}
}
function tune(notes, gap) { notes.forEach((f, i) => blip(f, i * (gap || 0.11), 0.22)); }
// ---------- 💬 toast + yes/no questions ----------
let toastT = 0;
function toast(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2200); }
function ask(text, btns) {
  $('askText').textContent = text;
  $('askBtns').innerHTML = btns.map(([label, cls], i) => `<button class="btn ${cls}" data-i="${i}">${label}</button>`).join('');
  $('askBtns').querySelectorAll('button').forEach(b => b.onclick = () => { closeBox(); const f = btns[+b.dataset.i][2]; if (f) f(); });
  openBox('askBox');
}
function openBox(id) { document.querySelectorAll('.ov.on').forEach(o => o.classList.remove('on')); $(id).classList.add('on'); }
function closeBox() { document.querySelectorAll('.ov.on').forEach(o => o.classList.remove('on')); }
function boxOpen() { return !!document.querySelector('.ov.on'); }
function confirmClear(fn) { ask('🗑️ Clear the whole picture?', [['✅ Yes, clear it', 'b-no', () => { fn(); blip(330, 0, .2); }], ['❌ No, keep it', 'b-back', null]]); }
// ---------- 🏆 trophy (the Game Factory book's Trophy Room reads gfTrophies) ----------
function hasTrophy(id) { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}')[id]; } catch (_) { return false; } }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); if (!t[id]) { t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } } catch (_) {} }
// ---------- 💾 gallery: localStorage[SAVEKEY] = { art: [up to 12], saved: how many saves ever, work: the picture in progress } ----------
let store = { art: [], saved: 0, work: null };
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(SAVEKEY) || 'null'); if (s && Array.isArray(s.art)) store = Object.assign({ saved: s.art.length, work: null }, s); } catch (_) {}
}
function saveStore() { try { localStorage.setItem(SAVEKEY, JSON.stringify(store)); } catch (_) {} }
let workT = 0;
function saveWorkSoon() { clearTimeout(workT); workT = setTimeout(() => { store.work = getArt(); saveStore(); }, 400); }
const artTitle = a => "Ben's " + ART_NAME + ' #' + a.num;
function saveToGallery() {
  const a = getArt(); if (!a) { toast('🎨 Make something first!'); return; }
  if (store.art.length >= MAX_ART) { toast('🖼️ Your gallery is full! Delete one first.'); openGallery(); return; }
  store.saved++; a.num = store.saved; a.at = Date.now(); store.art.unshift(a); saveStore(); const first = !hasTrophy(TROPHY); trophy(TROPHY);
  tune([523, 659, 784, 1047]); toast(first ? '🏆 New trophy! ' + TROPHY_NAME + '!' : '💾 Saved as "' + artTitle(a) + '"!');
}
function openGallery() { renderGallery(); openBox('galBox'); blip(660, 0, .12); }
function renderGallery() {
  $('galTitle').textContent = GAL_NAME + ' (' + store.art.length + ' / ' + MAX_ART + ')';
  if (!store.art.length) { $('galList').innerHTML = '<div class="empty">No pictures yet! Make something and press 💾 Save.</div>'; return; }
  $('galList').innerHTML = store.art.map((a, i) => `<div class="pick" data-i="${i}">${thumbSVG(a)}<b>${esc(artTitle(a))}</b>
    <div class="row2"><button class="btn b-save" data-a="open">📂 Open</button><button class="btn b-no" data-a="del">🗑️</button></div></div>`).join('');
  $('galList').querySelectorAll('.pick').forEach(el => {
    const i = +el.dataset.i;
    el.querySelector('svg').onclick = () => galOpen(i);
    el.querySelector('[data-a=open]').onclick = () => galOpen(i);
    const del = el.querySelector('[data-a=del]');
    del.onclick = () => {   // tap 🗑️ twice to delete (so one oops-tap never loses a picture)
      if (del.dataset.armed) { store.art.splice(i, 1); saveStore(); blip(300, 0, .2); renderGallery(); return; }
      del.dataset.armed = '1'; del.textContent = '🗑️ Again?'; blip(440, 0, .1);
      setTimeout(() => { if (del.isConnected) { delete del.dataset.armed; del.textContent = '🗑️'; } }, 3000);
    };
  });
}
function galOpen(i) { const a = store.art[i]; if (!a) return; loadArt(a, true); closeBox(); tune([660, 880]); toast('📂 ' + artTitle(a)); }
// ---------- 🖨️ printing: ⚫ Black & White (default, Grandma's printer) or 🌈 Color, remembered per tool ----------
// Each tool's printPages(color) returns [{ name, svg }]: one or more Letter pages. Tap a page to pick it, or print them all.
let COLOR = false, prSel = -1, prList = [];
function loadColor() { try { COLOR = localStorage.getItem(SAVEKEY + 'Color') === '1'; } catch (_) {} }
function setColor(c) { COLOR = c; try { localStorage.setItem(SAVEKEY + 'Color', c ? '1' : '0'); } catch (_) {} prSel = -1; showPrint(); blip(c ? 880 : 520, 0, .12); }
function showPrint() {

// ---------- 💾 gallery hooks ----------

function pagePNG(a, S, black, plain) { const c = document.createElement('canvas'); c.width = PW * S; c.height = PH * S; drawPaper(c.getContext('2d'), S, black, plain, a.marks, a.masks); return c.toDataURL('image/png'); }

// ---------- 🖨️ print: the stamped page (🌈 or ⚫ black ink) + a sheet of my stamp designs as stickers / to color ----------
function outlinePNG(m, px, color, col) {
  const c = document.createElement('canvas'); c.width = c.height = px; const x = c.getContext('2d');
  const t = document.createElement('canvas'); t.width = t.height = SM; const tx = t.getContext('2d'), id = tx.createImageData(SM, SM);
