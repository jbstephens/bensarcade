<!DOCTYPE html>
<html lang="en">
<head>

<title>Robo 2.0's Online Store</title>

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #2b0f45; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #f7f0ff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #e3dcea; border-bottom: 2px solid #c9bfd6; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #00a152; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #4a148c, #7b1fa2 55%, #00a152); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #1a0033; }
  #logo .big i { color: #69f0ae; font-style: normal; }
  #logo .small { font-size: 15px; color: #e1bee7; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #2b0f45; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #00e676; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #00e676; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #ffd740; color: #4e2600; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #c79100; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fff8e1; color: #6d4c00; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #ede2f7; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #4a148c; box-shadow: 0 4px 0 #b39ddb; }

  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c51162; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f48fb1; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(74,20,140,.18); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }

  .card.sel { outline: 4px solid #00e676; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #f3ecfa; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #311b92; line-height: 1.1; }
  .card .blurb { font-size: 15px; color: #555; }
  .card .price { font-size: 22px; font-weight: 900; color: #00873e; margin: 4px 0; }
  .card .price s { color: #999; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: #ffc400; color: #4e2600; }
  .tag.new { background: #00c853; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #4a148c; box-shadow: 0 4px 0 #b39ddb; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #ede7f6; color: #6a1b9a; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #7b1fa2; color: #fff; box-shadow: 0 4px 0 #4a148c; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #f3ecfa; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #6a1b9a; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #ede7f6; box-shadow: 0 4px 0 #b39ddb; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(74,20,140,.15); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #311b92; }

  .line .pr { font-size: 21px; font-weight: 900; color: #00873e; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #7b1fa2; box-shadow: 0 5px 0 #4a148c; }
  .bigbtn.green { background: #00c853; box-shadow: 0 5px 0 #00873e; }
  .bigbtn.blue { background: #2979ff; box-shadow: 0 5px 0 #1a4fb5; }
  .bigbtn.gray { background: #9e9e9e; box-shadow: 0 5px 0 #616161; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #311b92; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #6a1b9a; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #4a148c; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(43,15,69,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(43,15,69,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #f3e5f5; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #f3e5f5; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #6a1b9a; }
  #printBox .pbTip { font-size: 20px; color: #4a148c; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 💚 ROBO 2.0's ONLINE STORE: Ben's idea! Buy paper Robo 2.0 stuff with pretend Robo Bucks,
// then pick which orders to PRINT on your printer. Nothing prints by itself.
// Save: localStorage.robo2Store = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'robo2Store';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
const PAL_NEGA = { head: '#37474f', body: '#263238', visor: '#b71c1c', eye: '#e040fb', legs: '#4a148c', pod: '#7b1fa2' };
const PAL_GLITCH = { head: '#3a3a4f', body: '#26263a', visor: '#07070f', eye: '#ff00e5', legs: '#5e0b6e', pod: '#00e676', glitch: true };
const PAL_GOLD = { head: '#ffd740', body: '#ffe57f', visor: '#3e2723', eye: '#fff59d', legs: '#ff8f00', pod: '#ffab00' };
const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true };
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function coin(x, y, r) { circ(x, y, r, '#ffd740', '#c79100', Math.max(2, r * 0.12)); txt('R', x, y + r * 0.05, r * 1.1, OUT ? '#222' : '#a66f00'); }

// 💚 ROBO 2.0: copied from drawRoboBase in Robo Jump 6 (PAL_R2: smile, pixel freckles, "2.0"), all sizes scaled.
// x, y = top-left of his 30x40 box. o: pal, face, blink, line (outline color), party, wrench (no antenna, no arms: just like Robo Jump 6)
function drawR2(x, y, w, h, o = {}) {
  const pal = o.pal || PAL_R2, es = w / 30, face = o.face || 1, L = o.line || null, lw = 1.4 * es;
  ctx.save(); ctx.lineJoin = 'round';
  ctx.fillStyle = fillOf(pal.legs);
  for (const lx of [x + 4 * es, x + w - 12 * es]) { ctx.fillRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); if (L || OUT) { ctx.strokeStyle = OUT ? '#222' : L; ctx.lineWidth = OUT ? 5 : lw; ctx.strokeRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); } }
  rr(x + 2 * es, y + h * 0.5, w - 4 * es, h * 0.4, 6 * es, pal.body, L, lw);
  if (!pal.r2) circ(x + w / 2, y + h * 0.7, 3 * es, pal.pod, L, lw);
  rr(x - 5 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x + w - 1 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x - 2 * es, y, w + 4 * es, h * 0.55, 12 * es, pal.head, L, lw);
  rr(x + 2 * es, y + 4 * es, w - 4 * es, h * 0.55 - 9 * es, 9 * es, OUT ? '#fff' : pal.visor, L, lw);
  const ex = x + w / 2 + face * 3 * es, ey = y + h * 0.27, bl = o.blink ? 0.6 * es : 5 * (h / 40);
  ctx.fillStyle = OUT ? '#fff' : pal.eye;
  for (const d of [-6, 6]) { ctx.beginPath(); ctx.ellipse(ex + d * es, ey, 3.5 * es, bl, 0, 0, Math.PI * 2); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.stroke(); } }
  if (pal.glitch) {
    ctx.strokeStyle = '#ff00e5'; ctx.lineWidth = 1.6 * es; ctx.beginPath(); ctx.moveTo(x + 2 * es, y + 6 * es);
    for (let k = 1; k <= 6; k++) ctx.lineTo(x + 2 * es + k * (w - 4 * es) / 6, y + 6 * es + (k % 2 ? 6 : 0) * (h / 40));
    ctx.stroke();
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#00e676' : '#ff00e5'; ctx.fillRect(x + ((k * 37) % 26) * es, y + ((k * 23) % 34) * es, 3 * es, 3 * es); }
  }
  if (pal.r2) {
    ctx.strokeStyle = OUT ? '#222' : '#00e676'; ctx.lineWidth = OUT ? 6 : 2 * es * 0.75; ctx.beginPath(); ctx.arc(ex, ey + 6 * es, 3.5 * es, 0.2, Math.PI - 0.2); ctx.stroke();
    if (!OUT) { ctx.fillStyle = '#ff00e5'; ctx.fillRect(x + 1 * es, y + 3 * es, 4 * es, 4 * es); ctx.fillStyle = '#00e676'; ctx.fillRect(x + w - 5 * es, y + 2 * es, 4 * es, 4 * es); }
    txt('2.0', x + w / 2, y + h * 0.72, Math.round(9 * es), OUT ? '#222' : '#7b1fa2');
  }
  if (o.party) { poly([[x + w / 2 - 7 * es, y + 1], [x + w / 2 + 1 * es, y - 15 * es], [x + w / 2 + 7 * es, y + 1]], '#ff4081', L, lw); circ(x + w / 2 + 1 * es, y - 15 * es, 2.6 * es, '#ffeb3b', L, lw); }
  if (o.wrench) wrench(x - 7 * es, y + h * 0.62, 16 * es, 0.5);
  ctx.restore();
}
// handy: draw Robo 2.0 by his CENTER-x and FEET-y with a height
function R2at(cx, feetY, hgt, o) { const w = hgt * 0.75; drawR2(cx - w / 2, feetY - hgt, w, hgt, o); }
</script>
<script>
// ---------- 🖨️ printable pages: drawn on 850 x 1100 (8.5 x 11 inch) canvases ----------
const PW = 850, PH = 1100;
function makePage(fn, sc = 1.5) {
  const cv = document.createElement('canvas'); cv.width = Math.round(PW * sc); cv.height = Math.round(PH * sc);
  const old = ctx, oldOut = OUT; ctx = cv.getContext('2d'); OUT = false;
  try { ctx.scale(sc, sc); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH); fn(); } finally { ctx = old; OUT = oldOut; }
  return cv;
}
function pageHead(title, sub) {
  rr(30, 24, 790, 84, 22, '#4a148c');
  ctx.fillStyle = '#00e676'; ctx.fillRect(50, 98, 750, 5);
  R2at(88, 104, 74, { line: '#1a0033' });
  txt('ROBO 2.0 INDUSTRIES', 140, 48, 17, '#b9f6ca', 'left');
  txt(title, 140, 78, 34, '#fff', 'left', true, 640);

function pageMaze() {
  pageHead('Glitch-Fix Maze', 'Help Robo 2.0 bring his wrench to the broken machine!');
  const C = 12, R = 12, cs = 56, ox = 425 - C * cs / 2, oy = 250;
  let seed = 2020; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const wall = []; for (let i = 0; i < R * C; i++) wall.push([1, 1, 1, 1]);   // top right bottom left
  const seen = new Array(R * C).fill(false), stack = [0]; seen[0] = true;
  while (stack.length) {
    const c = stack[stack.length - 1], cx = c % C, cy = Math.floor(c / C), nb = [];
    if (cy > 0 && !seen[c - C]) nb.push([c - C, 0, 2]); if (cx < C - 1 && !seen[c + 1]) nb.push([c + 1, 1, 3]);
    if (cy < R - 1 && !seen[c + C]) nb.push([c + C, 2, 0]); if (cx > 0 && !seen[c - 1]) nb.push([c - 1, 3, 1]);
    if (!nb.length) { stack.pop(); continue; }
    const [n, a, b] = nb[Math.floor(rnd() * nb.length)]; wall[c][a] = 0; wall[n][b] = 0; seen[n] = true; stack.push(n);
  }
  rr(ox - 10, oy - 10, C * cs + 20, R * cs + 20, 16, '#f3e5f5');
  ctx.strokeStyle = '#4a148c'; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < R * C; i++) { const x = ox + (i % C) * cs, y = oy + Math.floor(i / C) * cs, wl = wall[i];
    if (wl[0] && i >= C) { ctx.moveTo(x, y); ctx.lineTo(x + cs, y); } if (wl[1]) { ctx.moveTo(x + cs, y); ctx.lineTo(x + cs, y + cs); }
    if (wl[2] && i !== R * C - 1) { ctx.moveTo(x, y + cs); ctx.lineTo(x + cs, y + cs); } if (wl[3] && i % C) { ctx.moveTo(x, y); ctx.lineTo(x, y + cs); } }
  ctx.moveTo(ox + cs, oy); ctx.lineTo(ox + C * cs, oy); ctx.moveTo(ox, oy); ctx.lineTo(ox, oy + R * cs); ctx.stroke(); ctx.lineCap = 'butt';
  R2at(ox + cs / 2, oy - 4, 80, { line: '#1a0033', wrench: true }); txt('START', ox + cs / 2 + 70, oy - 40, 20, '#00873e');
  ctx.save(); ctx.translate(ox + C * cs - 80, oy + R * cs + 8); ctx.scale(0.55, 0.55); machine(0, 0, true); ctx.restore();
  txt('FINISH', ox + C * cs - 130, oy + R * cs + 45, 20, '#c62828', 'right');
}

  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('robo2Store'); say('B33P! Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  Tip: turn on color printing!'));
  document.body.appendChild(printBox);
  for (const f of fns) { const img = new Image(); img.className = 'pbPage'; img.alt = name; img.src = makePage(f, sc).toDataURL('image/png'); printBox.appendChild(img); }
  sfx.click(); say(list.length === 1 && list[0].k === 'foldup' ? 'That is the Fold-Up me! Tap PRINT to print all 3 pages!' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT >= 0 && shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! B33P!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).cat !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price! B33P!');
};
$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'B33P! Welcome back, Ben! Your orders are in MY ORDERS.' : 'B33P! I mean... BEEP! Welcome to my store, Ben! Everything prints on paper!'; }, 50);
</script>
