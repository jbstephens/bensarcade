<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎮 Video Game Case Maker</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #dcebff 0 36px, #cadfff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #7c4dff; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-tv { background: #ff8a80; font-size: 22px; } .b-spin { background: #ffd54f; font-size: 22px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🎮 the Game Designer ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #boxPrev { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #7c4dff;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #boxPrev svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(18px, 2.3vw, 26px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 70px; height: 70px; display: block; pointer-events: none; }
  .opt svg.wide { width: 112px; height: 77px; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .opt.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  #invHelp { font-size: 16px; text-align: center; color: #555; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #7c4dff; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #7c4dff; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 📺 TV commercial ---------- */
  #tv { position: fixed; inset: 0; z-index: 50; background: #222; display: none; align-items: center; justify-content: center; padding: 12px; }
  #tv.on { display: flex; }
  #tvSet { position: relative; width: min(96vw, 150vh); aspect-ratio: 16 / 10; max-height: 96vh; background: #37474f; border: 8px solid #111; border-radius: 34px; padding: 3%; box-shadow: 0 10px 0 #111; }
  #tvScreen { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; border: 6px solid #111; background: #111; }
  #tvScreen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tvSay { position: absolute; left: 4%; right: 4%; bottom: 4%; background: rgba(255,255,255,.93); border: 4px solid #333; border-radius: 18px;
    font-size: clamp(18px, 3vw, 34px); font-weight: bold; text-align: center; padding: 6px 10px; }
  #tvStop { position: absolute; top: 2%; right: 2%; z-index: 2; }
  #tvArt svg g.bnc { animation: bnc .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #tvArt svg g.wig { animation: wig .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #tvArt svg g.flt { animation: flt 2.4s linear infinite; }
  #tvArt svg g.spn { animation: spn 9s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg g.zm { animation: zm 4.2s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg g.run { animation: run 1.6s linear infinite; }
  @keyframes zm { from { transform: scale(1.25); } to { transform: scale(1); } }
  @keyframes run { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
  #tvArt svg g.pop { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes bnc { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-26px) scale(1.03, .97); } }
  @keyframes wig { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes flt { from { transform: translateY(-80px); } to { transform: translateY(620px); } }
  @keyframes spn { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  /* ---------- 📚 the game shelf ---------- */
  #shelf { flex-direction: column; overflow: hidden; }
  #sHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #sHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #shelfBox { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
  .shelfRow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 0 14px; align-items: end;
    border-bottom: 22px solid #8d5a2b; box-shadow: 0 6px 0 #5d3a1a; border-radius: 4px; background: linear-gradient(#f3e2c7, #e8d0a9); }
  .sbox { cursor: pointer; border: none; background: none; padding: 6px 2px 0; display: flex; flex-direction: column; align-items: center; font: inherit; color: #222; }
  .sbox svg { width: 100%; max-height: 24vh; display: block; pointer-events: none; }
  .sbox b { font-size: clamp(12px, 1.4vw, 16px); text-align: center; min-height: 2.4em; }
  .sbox.sel svg { outline: 5px dashed #1e6bff; outline-offset: 2px; border-radius: 8px; }
  .sbox.empty svg { opacity: .5; }
  #shelfMenu { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; background: #fff; border: 5px solid #333; border-radius: 18px; padding: 8px; }
  #shelfMenu b { font-size: 20px; width: 100%; text-align: center; }
  /* ---------- 🕹️ PLAY YOUR GAME ---------- */
  #play { position: fixed; inset: 0; z-index: 55; background: #111; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 8px; gap: 8px; }
  #play.on { display: flex; }
  #playScr { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #playCv { display: block; max-width: 100%; max-height: 100%; aspect-ratio: 16 / 9; border: 6px solid #333; border-radius: 18px; background: #000; touch-action: none; }
  #playGo { position: absolute; left: 50%; bottom: 9%; transform: translateX(-50%); font-size: clamp(22px, 3.4vw, 40px); background: #8ef08e; padding: 8px 30px; }
  #playStop { position: absolute; top: 4px; right: 4px; }
  #pad { display: flex; width: 100%; max-width: 1100px; justify-content: space-between; align-items: center; gap: 10px; }
  #pad .grp { display: flex; gap: 8px; }
  #pad button { font: inherit; font-size: 30px; font-weight: bold; width: 74px; height: 64px; border: 4px solid #333; border-radius: 16px; background: #fff; box-shadow: 0 5px 0 #000;
    touch-action: none; user-select: none; -webkit-user-select: none; color: #222; }
  #pad button.down { transform: translateY(4px); box-shadow: 0 1px 0 #000; background: #ffe066; }
  #pad button[data-k="A"] { width: 110px; background: #ff8a80; border-radius: 40px; }
  #playHelp { color: #fff; font-size: clamp(14px, 1.8vw, 20px); font-weight: bold; text-align: center; flex: 1; }
  @media (max-height: 600px) { #pad button { height: 50px; width: 60px; font-size: 24px; } #pad button[data-k="A"] { width: 90px; } }
  @media (orientation: portrait) {
    #inv, #view { flex-direction: column; }
    #invLeft { width: 100%; height: 42vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 52px; height: 52px; } .opt svg.wide { width: 84px; height: 58px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #tv, #play, #shelf { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🎮 GAME CASE MAKER</h1>
    <div id="boxPrev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-tv" id="bTV">📺 Game Trailer!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
      <button class="btn b-spin" id="bPlay">🕹️ PLAY IT!</button>
      <button class="btn b-all" id="bShelf">📚 Game Shelf</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · Space = spin · C = trailer · G = play it · S = shelf · Enter = printables</div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Designer</button>
    <h1 class="big">🖨️ PRINT &amp; MAKE</h1>
    <button class="btn b-all" id="bAll">🖨️ Print my set</button>
    <p>Tap a page to open it. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="tv"><div id="tvSet"><div id="tvScreen"><div id="tvArt"></div><div id="tvSay"></div></div>
  <button class="btn b-back" id="tvStop">⏹️ Stop</button></div></div>
<div id="shelf" class="screen">
  <div id="sHead">
    <button class="btn b-back" id="bSBack">⬅️ Designer</button>
    <h1 class="big">📚 MY GAME SHELF</h1>
    <button class="btn b-print" id="bSave">💾 Put my game on the shelf</button>
    <p id="sInfo"></p>
  </div>
  <div id="shelfBox"><div id="shelfRows"></div><div id="shelfMenu"></div></div>
</div>
<div id="play">
  <div id="playScr"><canvas id="playCv" width="960" height="540"></canvas>
    <button class="btn b-print" id="playGo">▶️ PLAY!</button>
    <button class="btn b-back" id="playStop">⏹️ Stop</button></div>
  <div id="pad">
    <div class="grp"><button data-k="L">◀</button><button data-k="U">▲</button><button data-k="D">▼</button><button data-k="R">▶</button></div>
    <div id="playHelp"></div>
    <div class="grp"><button data-k="A">A</button></div>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎮 VIDEO GAME CASE MAKER: design the box for your OWN video game (name, hero, villain, world, game type,
// players, case color, GF badge, features), watch its game trailer, then print a fold-up game case,
// a paper cartridge, an 8-page mini instruction booklet (one-cut zine), the fold steps and a certificate.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is full color, LINE = true is black lines to color in. Art + flow copied from the Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;

      } else { v.x += Math.sign(tx - v.x) * Math.min(vs, Math.abs(tx - v.x)); v.y += Math.sign(ty - v.y) * Math.min(vs, Math.abs(ty - v.y)); }
      if (Math.hypot(v.x - p.x, v.y - p.y) < 28 && m.stun <= 0) {
        if (m.power) { m.vhp--; m.score += 200; sfx.bonk(); if (m.vhp) { flash(m, 'Gotcha! ' + m.vhp + ' more!'); this.teleport(m); } else { m.vdead = .01; flash(m, 'You caught ' + villainName(m.s) + '!'); } }
        else { m.stun = .6; sfx.ouch(); flash(m, 'Find all the stars first!'); this.teleport(m); }
      }
    }
    if (m.vdead) { m.vdead += dt; if (m.vdead > 1.3) endDemo(true); }
  },
  draw(m, ctx) {
    const s = m.s, wc = WCOL[s.world];
    bgDraw(ctx, m.art, s); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(TOX, TOY, TC * TS, TR * TS);
    for (let r = 0; r < TR; r++) for (let c = 0; c < TC; c++) if (m.grid[r][c]) {
      const x = TOX + c * TS, y = TOY + r * TS;
      if (m.maze || r === 0 || c === 0 || r === TR - 1 || c === TC - 1) { ctx.fillStyle = wc[0]; ctx.fillRect(x, y, TS, TS); ctx.fillStyle = wc[1]; ctx.fillRect(x, y, TS, 6); }
      else { ctx.fillStyle = dark(wc[1], .15); ctx.strokeStyle = OL; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x + TS / 2, y + TS / 2, TS * .48, 0, 7); ctx.fill(); ctx.stroke(); ctx.fillStyle = lite(wc[1], .5); ctx.beginPath(); ctx.arc(x + TS * .4, y + TS * .38, TS * .16, 0, 7); ctx.fill(); }
    }
    m.stars.forEach(st => { if (st.got) return; const [x, y] = tileXY(st.c, st.r), z = 13 + Math.sin(m.t * 6 + st.c) * 2; ctx.fillStyle = '#ffd600'; ctx.strokeStyle = OL; ctx.lineWidth = 2.5; starPath(ctx, x, y, z); ctx.fill(); ctx.stroke(); });
    const v = m.v;
    if (!m.vdead || m.vdead < 1) { if (m.power && Math.floor(m.t * 8) % 2) { ctx.fillStyle = 'rgba(64,196,255,.5)'; ctx.beginPath(); ctx.arc(v.x, v.y, 26, 0, 7); ctx.fill(); } sprite(ctx, m.art.villain, v.x, v.y + 20, m.vdead ? 52 * (1 - m.vdead * .7) : 52, v.x < m.p.x); }
    if (m.power) { ctx.fillStyle = 'rgba(255,234,0,.45)'; ctx.beginPath(); ctx.arc(m.p.x, m.p.y, 28, 0, 7); ctx.fill(); }
    if (!(m.stun > 0 && Math.floor(m.t * 14) % 2)) sprite(ctx, m.art.hero, m.p.x, m.p.y + 18, 46, m.p.face < 0);
    rrect(ctx, 12, 10, 200, 40, 14, 'rgba(0,0,0,.55)', 0); ctx.fillStyle = '#ffd600'; ctx.strokeStyle = OL; ctx.lineWidth = 2; starPath(ctx, 36, 30, 13); ctx.fill(); ctx.stroke();
    ctext(ctx, m.coinsGot + ' / ' + m.stars.length + '   ' + m.score, 56, 31, 22, '#fff', 'left');
    if (m.power) bossHearts(ctx, m.vhp, 3);
  },
};
// =====================================================================
// 📚 THE GAME SHELF: up to 8 of Ben's games (just the choices), shown as game boxes on a wooden shelf
// =====================================================================
let shelfSel = 0;
function openShelf() { stopTV(); endPrintAll(); shelfSel = Math.max(0, Math.min(shelfSel, state.shelf.length - 1)); renderShelf(); setView('shelf'); blip(660); }
function saveToShelf() {
  const g = gameOf(state), i = state.shelf.findIndex(x => gameName(x) === gameName(g));
  if (i >= 0) { state.shelf[i] = g; shelfSel = i; toast('📚 Updated ' + gameName(g) + '!'); }
  else if (state.shelf.length >= SHELF_MAX) { toast('📚 The shelf is full! Take a game off first.'); blip(200, 0, .2); return false; }
  else { state.shelf.push(g); shelfSel = state.shelf.length - 1; toast('📚 ' + gameName(g) + ' is on the shelf!'); tune([523, 659, 784]); }
  saveState(); renderShelf(); say(gameName(g) + ' is on the shelf!');
  return true;
}
function loadFromShelf(i) {
  const g = state.shelf[i]; if (!g) return;
  Object.assign(state, cleanGame(g)); saveState(); backToInventor();
  toast('✏️ ' + gameName(state) + ' is back in the maker!'); say(gameName(state) + '!');
}
function removeFromShelf(i) {
  if (!state.shelf[i]) return;
  state.shelf.splice(i, 1); shelfSel = Math.max(0, Math.min(shelfSel, state.shelf.length - 1)); saveState(); renderShelf(); blip(300, 0, .15, 'triangle', .1, null, 150);
}
function renderShelf() {
  if (typeof document === 'undefined' || !$('shelfRows')) return;
  const rows = $('shelfRows'); rows.innerHTML = '';
  for (let r = 0; r < SHELF_MAX / 4; r++) {
    const row = mkDiv('shelfRow');
    for (let k = 0; k < 4; k++) {
      const i = r * 4 + k, g = state.shelf[i];
      const art = g ? mini(() => casePreview(g, 50, 40, 1), '0 0 340 480') + '<b>' + esc(gameName(g)) + '</b>'
        : mini(() => R(60, 50, 260, 400, 20, '#fff', OL, 3, 0, ' stroke-dasharray="14 10"') + T(190, 240, 'empty', 44, '#999') + T(190, 300, 'spot', 44, '#999'), '0 0 340 480') + '<b>&nbsp;</b>';
      row.appendChild(mkBtn('sbox' + (g ? '' : ' empty') + (g && i === shelfSel ? ' sel' : ''), art, () => { if (g) { shelfSel = i; renderShelf(); blip(660, 0, .08); say(gameName(g)); } else saveToShelf(); }));
    }
    rows.appendChild(row);
  }
  const menu = $('shelfMenu'), g = state.shelf[shelfSel]; menu.innerHTML = '';
  if (g) {
    menu.appendChild(mkDiv('', '<b>' + esc('🎮 ' + gameName(g)) + '</b>'));
    menu.appendChild(mkBtn('btn b-spin', '🕹️ Play it!', () => startPlay(g)));
    menu.appendChild(mkBtn('btn b-print', '✏️ Load into the maker', () => loadFromShelf(shelfSel)));
    menu.appendChild(mkBtn('btn b-clear', '🗑️ Take it off', () => removeFromShelf(shelfSel)));
  } else menu.appendChild(mkDiv('', '<b>Tap 💾 to put your game on the shelf!</b>'));
  $('sInfo').textContent = state.shelf.length + ' of ' + SHELF_MAX + ' spots used. Tap a game box! (Arrows pick, Enter plays, L loads)';
}
function shelfKey(e) {
  const k = e.key, N = state.shelf.length;
  if (k === 'Escape' || k === 'Backspace') backToInventor();
  else if (k === 'ArrowRight' || k === 'ArrowDown') { if (N) { shelfSel = (shelfSel + (k === 'ArrowDown' ? 4 : 1)) % N; renderShelf(); blip(520, 0, .06); } }
  else if (k === 'ArrowLeft' || k === 'ArrowUp') { if (N) { shelfSel = (shelfSel + N * 4 - (k === 'ArrowUp' ? 4 : 1)) % N; renderShelf(); blip(520, 0, .06); } }
  else if (k === 'Enter' || k === ' ') { if (state.shelf[shelfSel]) startPlay(state.shelf[shelfSel]); else saveToShelf(); }
  else if (k === 'l' || k === 'L') loadFromShelf(shelfSel);
  else if (k === 's' || k === 'S') saveToShelf();
  else return;
  if (e.preventDefault) e.preventDefault();
}
function initExtras() {
  $('bPlay').addEventListener('click', () => startPlay());
  $('bShelf').addEventListener('click', openShelf);
  $('bSBack').addEventListener('click', backToInventor);
  $('bSave').addEventListener('click', saveToShelf);
  $('playGo').addEventListener('click', goPlay);
  $('playStop').addEventListener('click', () => stopPlay());
  $('playCv').addEventListener('mousedown', demoTap);
  document.querySelectorAll('[data-k]').forEach(b => {
    const k = b.dataset.k, up = e => { if (e && e.preventDefault) e.preventDefault(); b.classList.remove('down'); press(k, false); };
    b.addEventListener('pointerdown', e => { if (e && e.preventDefault) e.preventDefault(); b.classList.add('down'); press(k, true); });
    ['pointerup', 'pointerleave', 'pointercancel'].forEach(t => b.addEventListener(t, up));
  });
  window.addEventListener('keyup', e => { if (playOn()) demoKey(e, false); });
}
function init() {
  loadState();
  renderCats(); renderOpts(); renderPreview(); renderPens();
  const cv = $('trace');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bTV').addEventListener('click', startTV);
  $('tvStop').addEventListener('click', () => stopTV());
  $('bPrints').addEventListener('click', openGallery);
  $('bGBack').addEventListener('click', backToInventor);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
  initExtras();
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
