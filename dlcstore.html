    card.appendChild(el('div', 'price', (p.k === DEAL ? '<s>' + p.price + '</s>' : '') + '💎 ' + priceOf(p.k) + ' Star Crystals'));
    const r = p.revs[0]; card.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`));
    const row = el('div', 'row'), inCart = S.cart.includes(p.k);
    const add = el('button', 'add' + (inCart ? ' in' : ''), inCart ? '✅ IN CART' : '🛒 ADD TO CART');
    add.onclick = () => toggleCart(p.k);
    const rb = el('button', 'revbtn', '⭐ ' + avg(p)); rb.onclick = () => openReviews(p.k);
    row.append(add, rb); card.appendChild(row); grid.appendChild(card);
  }
}
function toggleCart(k) {
  const i = S.cart.indexOf(k);
  if (i >= 0) { S.cart.splice(i, 1); sfx.click(); say('Okay! I took it out of your cart.'); }
  else { S.cart.push(k); sfx.add(); say(k === 'moonbase' ? 'The Meteor-Hit Moon Base! Let\'s rescue the mini stars!' : k === 'ffarena' ? 'FUSED or FORGED? You pick! Spin the bosses!' : k === 'mega' ? 'The MEGA SET! All three Novas, GIANT! Awesome!' : PR(k).must ? 'That is Ben\'s own idea! ' + pick(ADD_LINES) : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {
  const p = PR(k), box = $('revIn'); box.innerHTML = '';
  box.appendChild(el('div', 'h2', '⭐ Reviews: ' + p.name));
  p.revs.forEach(r => box.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`)));
  const c = el('button', 'bigbtn', '👍 OK!'); c.style.marginTop = '10px'; c.style.width = '100%'; c.onclick = closeReviews; box.appendChild(c);
  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what everybody says!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) {
    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  for (const k of S.cart) {
    const line = el('div', 'line'); line.appendChild(thumbEl(k));
    line.appendChild(el('div', 'nm', PR(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '<small>' + PR(k).pages.length + ' page' + (PR(k).pages.length > 1 ? 's' : '') + '</small>')));
    line.appendChild(el('div', 'pr', '💎 ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); L.appendChild(line);
  }
  const t = el('div', 'total');
  const g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'Gift wrap! I will add a wrapping paper page to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 💎 ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (!S.cart.length) return;
  if (tot > S.coins) { sfx.nope(); say('Not enough Star Crystals! Tap Get more!'); const b = $('moreCoins'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.coins -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreCoins() {
  S.coins += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['Here are 500 more Star Crystals!', 'Ka-ching! 500 Star Crystals! Pretend money is the best!', 'More Star Crystals for Ben!']));
}
// 🚀 delivery: a Robo rocket truck zooms across the moon
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function shipScene() {
  beginArt(false);
  let s = '<rect width="960" height="540" fill="#0b1640"/>' + starsIn(0, 0, 960, 380, 40) + C(880, 330, 40, '#2979ff', OL, 3) + '<rect y="420" width="960" height="120" fill="#90a4ae"/>';
  for (let i = 0; i < 8; i++) s += crater(60 + i * 125, 470 + (i % 2) * 30, 30);
  let truck = R(0, 0, 230, 110, 16, '#2962ff', OL, 4) + R(230, 30, 90, 80, 16, '#00b8d4', OL, 4) + R(250, 42, 52, 38, 8, '#b3e5fc', OL, 2) + fitRobo(robo('robo'), 276, 84, 40, 44);
  truck += T(115, 44, 'DLC STORE', 28, '#ffd740') + T(115, 80, 'EXPRESS', 24, '#fff');
  for (const wx of [55, 260]) truck += C(wx, 112, 26, '#212121', 0) + C(wx, 112, 11, '#bdbdbd', 0);
  truck += '<g id="boxes"></g>';
  s += '<g id="truck">' + truck + '</g>' + '<g id="conf"></g>';
  s += '<text id="shipTxt" x="480" y="110" font-size="54" fill="#fff" text-anchor="middle"' + FONT + '>Placing order...</text><text id="shipSub" x="480" y="170" font-size="28" fill="#b3e5fc" text-anchor="middle"' + FONT + '></text>';
  s += '<rect x="280" y="190" width="400" height="24" rx="12" fill="#ffffff" opacity=".3"/><rect id="shipBar" x="280" y="190" width="24" height="24" rx="12" fill="#ffd740"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><defs>' + DEFS.join('') + '</defs>' + s + '</svg><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button>';
}
function startShip(n) {
  shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false;
  $('ship').innerHTML = shipScene(); $('ship').style.display = 'flex'; $('shipGo').onclick = closeShip;
  let b = ''; for (let i = 0; i < Math.min(n, 6); i++) b += R(20 + i * 33, -32, 30, 30, 3, '#d7a86e', '#6d4c41', 2) + R(32 + i * 33, -32, 6, 30, 0, '#6d4c41', 0);
  $('boxes').innerHTML = b; sfx.vroom(); say('Placing your order... Here we go!'); requestAnimationFrame(shipLoop);
}
function shipLoop() {
  if (shipT < 0) return;
  shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  const done = shipT > 150, tx = done ? 320 : -380 + Math.min(1, shipT / 140) * 700, bob = done ? 0 : Math.sin(shipT * .5) * 3;
  $('truck').setAttribute('transform', 'translate(' + n(tx) + ' ' + n(300 + bob) + ')');
  $('shipBar').setAttribute('width', n(Math.max(24, 400 * Math.min(1, shipT / 150))));
  if (!done) $('shipTxt').textContent = 'Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3);
  else {
    let c = ''; for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); c += '<rect x="' + n(480 + Math.cos(a) * d) + '" y="' + n(140 + Math.sin(a) * d * .7 + (shipT - 150) * 1.5) + '" width="12" height="8" fill="' + ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff'][i % 4] + '"/>'; }
    $('conf').innerHTML = c; $('shipTxt').textContent = 'ORDER CONFIRMED!'; $('shipTxt').setAttribute('fill', '#ffd740');
    $('shipSub').textContent = shipCount + (shipCount === 1 ? ' thing is' : ' things are') + ' in MY ORDERS, ready to print!';
  }
  if (done && !shipDone) { shipDone = true; sfx.cash(); say('ORDER CONFIRMED! Tap PRINT on the things you want!'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    const p = PR(o.k); if (!p) continue;
    const np = p.pages.length + (o.gift ? 1 : 0), line = el('div', 'line'); line.appendChild(thumbEl(o.k));
    line.appendChild(el('div', 'nm', p.name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${np} page${np > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function printFns(list) {
  const fns = [];
  for (const o of list) { const p = PR(o.k); if (!p) continue; if (o.gift) fns.push(() => giftWrap(p.name)); p.pages.forEach(f => fns.push(f)); }
  return fns;
}
function openPrint(list) {
  closePrint(true);
  const fns = printFns(list); if (!fns.length) return;
  printList = list;
  const name = list.length === 1 ? PR(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), ink = el('button', 'pbInk' + (S.ink ? '' : ' off'), S.ink ? '🖤 Ink Saver: ON' : '🎨 Full color');
  const pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  ink.onclick = () => { toggleInk(); openPrint(printList); };
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('dlcStore'); say('Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, ink, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  ' + (S.ink ? '🖤 Ink Saver is ON: black lines to color in!' : '🎨 Full color: turn on color printing!')));
  document.body.appendChild(printBox);
  for (const f of fns) printBox.appendChild(el('div', 'pbPage', buildPage(f, S.ink)));
  sfx.click(); say(list.length === 1 && list[0].k === 'moonbase' ? 'The Moon Base playset! Tap PRINT for all the pages!' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
function toggleInk() { S.ink = !S.ink; save(); sfx.click(); updateTop(); say(S.ink ? 'Ink Saver ON! Black lines, so you can color them in.' : 'Full color! That uses lots of ink.'); }
// 🤖 MASCOT PARADE: every Robo marches across and says hi
let parT = -1, parStart = 0, parSaid = -1;
const PAR_GAP = 190, PAR_SPEED = 2.2;
function openParade() {
  const row = $('paradeRow'); row.innerHTML = '';
  ROBOS.forEach(r => { const d = el('div', 'pr', mascotSvg(r) + '<b>' + r.name + '</b>'); row.appendChild(d); });
  $('paradeBox').style.display = 'flex'; parT = 0; parStart = performance.now(); parSaid = -1; $('psay').textContent = 'Here they come!';
  sfx.click(); say('MASCOT PARADE! Everybody, march!', 'robo'); requestAnimationFrame(paradeLoop);
}
function paradeLoop() {
  if (parT < 0) return;
  parT = Math.max(parT + (window.__shipStep || 0), Math.floor((performance.now() - parStart) / 16.7));
  const W = window.innerWidth, kids = $('paradeRow').children;
  for (let i = 0; i < kids.length; i++) {
    const x = W + 20 - parT * PAR_SPEED + i * PAR_GAP, hop = Math.abs(Math.sin((parT + i * 9) * .16)) * 18;
    kids[i].style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(-hop) + 'px)';
    if (x < W / 2 - 75 && i > parSaid) { parSaid = i; const r = ROBOS[i]; $('psay').textContent = r.name + ': "' + MASCOTS[r.id][3] + '"'; sfx.march(i); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.name + '!'); u.pitch = Math.min(2, MASCOTS[r.id][0]); u.rate = MASCOTS[r.id][1]; speechSynthesis.speak(u); } } catch (_) {} }
  }
  const last = W + 20 - parT * PAR_SPEED + (kids.length - 1) * PAR_GAP;
  if (last < -200) { $('psay').textContent = 'That is everybody! Tap OK to go shopping.'; parT = -1; return; }
  requestAnimationFrame(paradeLoop);
}
function closeParade() { parT = -1; $('paradeBox').style.display = 'none'; sfx.click(); showMascot(MI); }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  const parade = $('paradeBox').style.display === 'flex';
  if (e.key === 'Escape') { if (printBox) closePrint(); else if (parade) closeParade(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (parade) closeParade(); else if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && !parade && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreCoins').onclick = moreCoins;
$('parade').onclick = openParade;
$('paradeOk').onclick = closeParade;
$('ink').onclick = toggleInk;
$('mascot').onclick = () => { sfx.click(); say(pick(MASCOTS[curM().id].slice(2))); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || !inCat(PR(DEAL), CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
showMascot(Math.floor(Math.random() * ROBOS.length), true);
render(); rotate();
setTimeout(() => { $('bubble').textContent = S.orders.length ? MASCOTS[curM().id][2] + ' Your orders are in MY ORDERS.' : MASCOTS[curM().id][2]; }, 50);
</script>
