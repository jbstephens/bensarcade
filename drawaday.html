<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📅 Draw-a-Day Calendar</title>
<script src="touchpad.js?v=6"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3f4ff 0 36px, #d3ecff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4.6vw, 50px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff9f1c; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px; padding: 6px 10px;
    cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.sel, .thumb.sel, .dthumb.sel { outline: 5px solid #1e6bff; outline-offset: 3px; }
  .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-go { background: #8ef08e; } .b-yel { background: #ffe066; }
  .b-pink { background: #ffc2d6; } .b-purp { background: #d1b3ff; } .b-org { background: #ffb347; }
  .b-print { background: #8ef08e; font-size: 22px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- home ---------- */
  #home { flex-direction: column; padding: 8px 12px 10px; gap: 6px; }
  #homeTop { display: flex; align-items: center; justify-content: center; position: relative; min-height: 56px; }
  #leave { position: absolute; left: 0; top: 0; font-size: 18px; }
  #homeMain { flex: 1; min-height: 0; display: flex; gap: 12px; }
  #todayCard { flex: 1.35; min-width: 0; background: #fff; border: 5px solid #333; border-radius: 24px; box-shadow: 0 7px 0 #ff9f1c;
    display: flex; flex-direction: column; align-items: center; padding: 8px 12px; gap: 6px; overflow: hidden; }
  #tTag { background: #ff9f1c; color: #fff; -webkit-text-stroke: 1px #333; font-size: clamp(18px, 2.6vw, 28px); font-weight: bold;
    border: 4px solid #333; border-radius: 30px; padding: 2px 18px; }
  #tArt { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #tArt svg { height: 100%; max-height: 100%; width: auto; max-width: 100%; }
  #tPrompt { font-size: clamp(22px, 3.6vw, 42px); font-weight: bold; text-align: center; line-height: 1.1; }
  .row3 { display: grid; grid-template-columns: 1fr 1.2fr 1.2fr; gap: 8px; width: 100%; }
  #sideCol { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 2px 4px 8px; }
  #streakBox { background: #fff8e1; border: 5px solid #333; border-radius: 22px; padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; }
  #streakTop { display: flex; align-items: center; gap: 8px; }
  #flame { width: 64px; height: 72px; flex: none; }
  #flame.on { animation: flick .6s infinite alternate; }
  @keyframes flick { from { transform: scale(1) rotate(-3deg); } to { transform: scale(1.08) rotate(3deg); } }
  #streakTxt { font-size: clamp(18px, 2.4vw, 26px); font-weight: bold; line-height: 1.15; }
  #streakTxt small { display: block; font-size: .7em; color: #666; }
  #starRow { display: grid; grid-template-columns: repeat(10, 1fr); gap: 2px; }
  #starRow i { font-style: normal; text-align: center; font-size: clamp(14px, 1.8vw, 22px); line-height: 1.2; opacity: .25; }
  #starRow i.got { opacity: 1; } #starRow i.today { outline: 2px dashed #ff9f1c; border-radius: 6px; }
  #nextGoal { font-size: 16px; text-align: center; font-weight: bold; color: #7b4b00; }
  .side2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- spinner ---------- */
  .ov { position: fixed; inset: 0; background: rgba(20, 30, 60, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 26px; padding: 12px 16px; width: min(96vw, 820px); max-height: 100%;
    overflow-y: auto; display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #wheelBox { position: relative; width: min(34vh, 260px); height: min(34vh, 260px); flex: none; }
  #wheel { width: 100%; height: 100%; transition: transform 2.2s cubic-bezier(.15, .8, .25, 1); }
  #pointer { position: absolute; left: 50%; top: -14px; transform: translateX(-50%); font-size: 34px; }
  #spinTxt { font-size: clamp(22px, 3.6vw, 36px); font-weight: bold; text-align: center; min-height: 2.4em; display: flex; align-items: center; }
  .btnRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  /* ---------- drawing pad ---------- */
  #pad { flex-direction: row; gap: 10px; padding: 10px; }
  #padL { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; }
  #padPrompt { font-size: clamp(18px, 2.6vw, 28px); font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 4px 14px; text-align: center; }
  #canWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #can { background: #fff; border: 5px solid #333; border-radius: 12px; box-shadow: 0 7px 0 #ff9f1c; touch-action: none; cursor: crosshair; aspect-ratio: 4 / 3; max-width: 100%; max-height: 100%; }
  #padR { width: min(32vw, 300px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #crayons { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; font-size: 20px; display: flex; align-items: center; justify-content: center; }
  .sw.on { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #sizes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  #sizes .btn.on { background: #ffe066; border-color: #ff3d6e; }
  /* ---------- my drawings ---------- */
  #gal, #prn { flex-direction: column; padding: 8px 12px; gap: 6px; }
  .topBar { display: flex; align-items: center; gap: 10px; }
  .topBar h1 { flex: 1; }
  #dGrid, #pGrid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 6px 24px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; align-content: start; }
  .dthumb, .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; box-shadow: 0 6px 0 #ff9f1c;
    display: flex; flex-direction: column; align-items: center; }
  .dthumb img { width: 100%; height: auto; display: block; border-radius: 8px; border: 2px solid #ddd; }
  .dthumb b, .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  #empty { grid-column: 1 / -1; font-size: 26px; text-align: center; background: #fff; border: 4px dashed #333; border-radius: 20px; padding: 30px; }
  #bigImg { max-width: 100%; max-height: 62vh; border: 4px solid #333; border-radius: 12px; }
  #bigTxt { font-size: 24px; font-weight: bold; text-align: center; }
  /* ---------- printable sheet view ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 30px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff; border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff9f1c; }
  #vSide { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  #vTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .opt { background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; display: flex; flex-direction: column; gap: 6px; }
  .opt > b { font-size: 18px; text-align: center; }
  .pick { display: flex; align-items: center; gap: 6px; }
  .pick .btn { flex: none; width: 60px; font-size: 24px; padding: 2px; }
  .pick span { flex: 1; text-align: center; font-size: 22px; font-weight: bold; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; }
  .chips .btn { min-height: 46px; font-size: 17px; padding: 4px 9px; box-shadow: 0 3px 0 #333; }
  .chips .btn.on { background: #ffe066; border-color: #ff3d6e; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- party + toast ---------- */
  #party .card { background: #fffbe0; }
  #partyBig { font-size: clamp(30px, 6vw, 60px); font-weight: bold; text-align: center; color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 4px 4px 0 #ff4081; }
  #partyTxt { font-size: 24px; text-align: center; font-weight: bold; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 45; width: 100%; height: 100%; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #homeMain, #pad, #view { flex-direction: column; }
    #sideCol, #padR, #vSide { width: 100%; max-height: 42vh; }
    #wrap { height: 100%; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px 6px; } #tPrompt { font-size: 24px; } #flame { width: 48px; height: 54px; } }
  /* ---------- PRINT: only the sheet (or a whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #vSide, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<!-- ======== HOME ======== -->
<div id="home" class="screen on">
  <div id="homeTop"><button class="btn b-back" id="leave">⬅️ Back</button><h1 class="big">📅 DRAW-A-DAY CALENDAR</h1></div>
  <div id="homeMain">
    <div id="todayCard">
      <div id="tTag">⭐ TODAY'S CHALLENGE</div>
      <div id="tArt"></div>
      <div id="tPrompt"></div>
      <div class="row3">
        <button class="btn b-yel hb" id="bRead">🔊 Read it</button>
        <button class="btn b-purp hb" id="bDraw">✏️ Draw it here</button>
        <button class="btn b-go hb" id="bDrew">✅ I drew it!</button>
      </div>
    </div>
    <div id="sideCol">
      <div id="streakBox">
        <div id="streakTop"><svg id="flame" viewBox="-30 -36 60 70"></svg><div id="streakTxt"></div></div>
        <div id="starRow"></div>
        <div id="nextGoal"></div>
      </div>
      <button class="btn b-magic hb" id="bSpin" style="font-size:24px">🎲 Surprise me!</button>
      <div class="side2">
        <button class="btn b-pink hb" id="bGal">🖼️ My Drawings</button>
        <button class="btn b-org hb" id="bPrn">🖨️ Printables</button>
      </div>
    </div>
  </div>
</div>
<!-- ======== DRAWING PAD ======== -->
<div id="pad" class="screen">
  <div id="padL"><div id="padPrompt"></div><div id="canWrap"><canvas id="can" width="800" height="600"></canvas></div></div>
  <div id="padR">
    <div id="crayons"></div>
    <div id="sizes"><button class="btn" data-s="6">• Thin</button><button class="btn on" data-s="14">● Mid</button><button class="btn" data-s="30">⬤ Fat</button></div>
    <div class="two"><button class="btn b-yel" id="bUndo">↩️ Undo</button><button class="btn b-pink" id="bClear">🧽 Clear</button></div>
    <button class="btn b-go" id="bSave" style="font-size:22px">💾 Save to My Drawings</button>
    <button class="btn b-back" id="bPadBack">⬅️ Back</button>
  </div>
</div>
<!-- ======== MY DRAWINGS ======== -->
<div id="gal" class="screen">
  <div class="topBar"><button class="btn b-back" id="bGalBack">⬅️ Back</button><h1 class="big">🖼️ MY DRAWINGS</h1></div>
  <div id="dGrid"></div>
</div>
<!-- ======== PRINTABLES ======== -->
<div id="prn" class="screen">
  <div class="topBar"><button class="btn b-back" id="bPrnBack">⬅️ Back</button><h1 class="big">🖨️ PRINTABLES</h1></div>
  <div id="pGrid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="vSide">
    <div id="vTitle"></div>
    <div id="vOpts"></div>
    <div class="two"><button class="btn" id="bColor">🎨 Full color</button><button class="btn" id="bLine">🖍️ Color it yourself</button></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <button class="btn b-purp" id="bPrintAll">🖨️ Print the whole book (cover + 30 pages)</button>
    <button class="btn b-back" id="bViewBack">⬅️ Back to printables</button>
  </div>
</div>
<!-- ======== OVERLAYS ======== -->
<div id="spin" class="ov"><div class="card">
  <h1 class="big" style="font-size:clamp(24px,4vw,40px)">🎲 SURPRISE ME!</h1>
  <div id="wheelBox"><div id="pointer">🔻</div><svg id="wheel" viewBox="-100 -100 200 200"></svg></div>
  <div id="spinTxt"></div>
  <div class="btnRow">
    <button class="btn b-yel sb" id="bSpinRead">🔊 Read it</button>
    <button class="btn b-magic sb" id="bSpinAgain">🎲 Spin again</button>
    <button class="btn b-purp sb" id="bSpinDraw">✏️ Draw it!</button>
    <button class="btn b-back sb" id="bSpinClose">⬅️ Close</button>
  </div>
</div></div>
<div id="big" class="ov"><div class="card">
  <div id="bigTxt"></div><img id="bigImg" alt="">
  <div class="btnRow"><button class="btn b-pink" id="bDel">🗑️ Delete</button><button class="btn b-back" id="bBigClose">⬅️ Close</button></div>
</div></div>
<div id="party" class="ov"><div class="card">
  <div id="partyBig"></div><div id="partyArt" style="height:min(30vh,220px)"></div><div id="partyTxt"></div>
  <div class="btnRow"><button class="btn b-org hide" id="bPartyCert">🖨️ Print my certificate</button><button class="btn b-go" id="bPartyOk">🎉 Yay!</button></div>
</div></div>
<canvas id="confetti"></canvas>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 📅 DRAW-A-DAY CALENDAR: a daily drawing challenge (Today's Challenge, Surprise me, drawing pad,
// My Drawings, streak + stars, printable calendar / daily page / certificate / journal cover).
// Save: localStorage 'drawADay'. Trophy: 'drawADay' (first "I drew it!" or first print).
// Printed sheets are portrait letter pages, viewBox 0 0 800 1000. No year is ever shown.
// =====================================================================
const $ = id => document.getElementById(id);
// ----- character art (copied from the Trading Cards: plain shapes with bold outlines) -----
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="1"' : '') + '>' + txt + '</text>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
function ngonD(x, y, r, n, rot) { const pts = []; for (let k = 0; k < n; k++) { const a = (rot || 0) + k * Math.PI * 2 / n; pts.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } return polyD(pts); }
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');

// ----- faces -----
// kinds: cute, dot, angry, happy, sleepy, glow, pixel, dizzy, mad (glow + brows)
function eyes(x, y, gap, r, kind, col) {
  col = col || '#1b1b2f'; let s = '';
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    if (kind === 'happy') s += aL('M' + _n(ex - r) + ' ' + _n(y + r * .3) + ' Q' + _n(ex) + ' ' + _n(y - r * 1.1) + ' ' + _n(ex + r) + ' ' + _n(y + r * .3), OL, Math.max(2, r * .45));
    else if (kind === 'dot') s += aC(ex, y, r * .6, col, 0) + aC(ex - r * .2, y - r * .2, r * .2, '#fff', 0);
    else if (kind === 'pixel') s += aR(ex - r * .8, y - r * .8, r * 1.6, r * 1.6, 0, '#fff', OL, 1.5) + aR(ex - r * .4, y - r * .3, r * .8, r * .8, 0, col, 0);
    else if (kind === 'glow' || kind === 'mad') s += aE(ex, y, r * .75, r, col, OL, 1.5) + aC(ex - r * .2, y - r * .35, r * .25, '#fff', 0);
    else if (kind === 'dizzy') s += aL('M' + _n(ex - r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex + r * .7) + ' ' + _n(y + r * .7) + ' M' + _n(ex + r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex - r * .7) + ' ' + _n(y + r * .7), OL, Math.max(2, r * .4));
    else {
      s += aE(ex, y, r * .85, r, '#fff', OL, 1.8) + aC(ex + sx * r * .1, y + r * .15, r * .55, col, 0) + aC(ex + sx * r * .1 - r * .2, y - r * .1, r * .2, '#fff', 0);
      if (kind === 'sleepy') s += aP('M' + _n(ex - r * .9) + ' ' + _n(y) + ' A' + _n(r * .9) + ' ' + _n(r) + ' 0 0 1 ' + _n(ex + r * .9) + ' ' + _n(y) + ' Z', '#0000001a', OL, 1.5);
    }
    if (kind === 'angry' || kind === 'mad') s += aL('M' + _n(ex - sx * r * 1.1) + ' ' + _n(y - r * 1.5) + ' L' + _n(ex + sx * r * .7) + ' ' + _n(y - r * .9), OL, Math.max(2, r * .4));
  }
  return s;
}
// kinds: smile, grin, fang, o, grr, flat, frown, teeth

  const bits = []; for (let k = 0; k < 120; k++) bits.push({ x: Math.random() * W, y: -Math.random() * H, v: 2 + Math.random() * 4, s: 6 + Math.random() * 8, c: WHEEL_COLS[k % 8], r: Math.random() * 6 });
  let frames = 0; clearInterval(confT);
  confT = setInterval(() => {
    x.clearRect(0, 0, W, H);
    bits.forEach(b => { b.y += b.v; b.r += .1; x.fillStyle = b.c; x.fillRect(b.x + Math.sin(b.r) * 8, b.y, b.s, b.s * .6); });
    if (++frames > 220) { clearInterval(confT); x.clearRect(0, 0, W, H); }
  }, 30);
}

// 🖨️ PRINTABLE SHEETS (portrait letter, viewBox 0 0 800 1000)

const FONT = 'Arial Rounded MT Bold, Arial Black, Arial, sans-serif';
function wrap(txt, max) {

}
function T(x, y, txt, size, fill, o) {

}
function TL(x, y, lines, size, fill, lh, o) { return lines.map((l, i) => T(x, y + i * (lh || size * 1.15), l, size, fill, o)).join(''); }
const starOutline = (x, y, r, fill) => aP(starD(x, y, r), fill || '#fff', '#222', 2.5);

const SVG0 = '<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">';

// 📅 monthly calendar poster

// 🖍️ "Color it yourself": every colored shape becomes white with a black outline
function lum(c) { if (!/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(c)) return 1; c = c.slice(1); if (c.length === 3) c = c.split('').map(x => x + x).join('');
  const v = [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); return (.299 * v[0] + .587 * v[1] + .114 * v[2]) / 255; }
function lineify(svg) {
  return svg.replace(/<(path|circle|ellipse|rect)\b([^>]*?) fill="([^"]+)"/g, (m, tag, pre, f) => '<' + tag + pre + ' fill="' + (/^#/.test(f) && f.length <= 7 && lum(f) > .2 ? '#ffffff' : f) + '"')
    .replace(/(<text\b[^>]*?) fill="([^"]+)"([^>]*)>/g, (m, pre, f, post) => pre + ' fill="' + (/stroke=/.test(post) ? '#ffffff' : '#222') + '"' + post + '>')
    .replace(/stroke="(#[0-9a-fA-F]{3,6})"/g, (m, c) => lum(c) > .2 && lum(c) < .97 ? 'stroke="#555"' : m);
}
const SHEETS = [
  { id: 'cal', name: '📅 Calendar poster', help: 'A whole month of drawing ideas! Pick the month and the day it starts on.' },
  { id: 'daily', name: '✏️ Daily drawing page', help: 'One big frame for one drawing. Print all 30 to make a book!' },
  { id: 'cert', name: '🏆 30 drawings certificate', help: 'For when you finish 30 drawings! Tap a name.' },
  { id: 'cover', name: "📔 Drawing book cover", help: 'Put it on top of your daily pages, then a grown-up can staple them!' }
];
const CERT_NAMES = ['Ben', 'Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
let OPT = null;
function defaultOpt() {
  const d = now(), m = d.getMonth(), mi = monthInfo(m);
  return { month: m, start: mi.start, days: mi.days, pack: m % 3, day: Math.min(30, d.getDate()), name: S.certName || 'Ben' };
}
function buildSheet(id, line, o) {
  o = o || OPT;
  const svg = id === 'cal' ? sheetCal(o) : id === 'daily' ? sheetDaily(o) : id === 'cert' ? sheetCert(o) : sheetCover(o);
  return line ? lineify(svg) : svg;
}

// =====================================================================
// SCREENS + PRINTABLES VIEW
// =====================================================================
let screen = 'home', prnSel = 0, cur = 0;
function show(id) {
  ['home', 'pad', 'gal', 'prn', 'view'].forEach(s => $(s).classList.toggle('on', s === id));
  screen = id;
  if (id === 'home') renderHome();
  if (id === 'gal') renderGal();
  if (id === 'prn') renderPrn();
}
function renderPrn() {
  if (!OPT) OPT = defaultOpt();
  $('pGrid').innerHTML = SHEETS.map((sh, i) => '<div class="thumb' + (kbd && i === prnSel ? ' sel' : '') + '" data-i="' + i + '">' + buildSheet(sh.id, !S.color) + '<b>' + sh.name + '</b></div>').join('');
}
function openSheet(i) { cur = prnSel = i; if (!OPT) OPT = defaultOpt(); show('view'); renderSheet(); }
const chip = (on, act, val, label) => '<button class="btn' + (on ? ' on' : '') + '" data-act="' + act + '" data-v="' + val + '">' + label + '</button>';
function renderSheet() {
  const sh = SHEETS[cur], o = OPT;
  $('vTitle').textContent = sh.name;
  $('svgBox').innerHTML = buildSheet(sh.id, !S.color);
  $('bColor').classList.toggle('b-yel', !!S.color); $('bLine').classList.toggle('b-yel', !S.color);
  let h = '<div class="opt"><span style="font-size:17px;text-align:center">' + sh.help + '</span></div>';
  const packs = '<div class="opt"><b>Drawing ideas</b><div class="chips">' + PACK_NAMES.map((n, k) => chip(o.pack === k, 'pack', k, n)).join('') + '</div></div>';
  if (sh.id === 'cal') {
    h += '<div class="opt"><b>Month</b><div class="pick"><button class="btn b-back" data-act="mon" data-v="-1">◀</button><span>' + MONTHS[o.month] + '</span><button class="btn b-back" data-act="mon" data-v="1">▶</button></div></div>';
    h += '<div class="opt"><b>Day 1 is on a…</b><div class="chips">' + WDAYS.map((w, k) => chip(o.start === k, 'start', k, w.slice(0, 3))).join('') + '</div></div>';
    h += '<div class="opt"><b>Days in the month</b><div class="chips">' + [28, 29, 30, 31].map(n => chip(o.days === n, 'days', n, n)).join('') + '</div></div>' + packs;
  } else if (sh.id === 'daily') {
    h += '<div class="opt"><b>Which day?</b><div class="pick"><button class="btn b-back" data-act="day" data-v="-1">◀</button><span>Day ' + o.day + '</span><button class="btn b-back" data-act="day" data-v="1">▶</button></div></div>' + packs;
  } else if (sh.id === 'cert') {
    h += '<div class="opt"><b>Who finished 30 drawings?</b><div class="chips">' + CERT_NAMES.map(n => chip(o.name === n, 'name', n, n)).join('') + '</div></div>';
  }
  $('vOpts').innerHTML = h;
  $('bPrintAll').classList.toggle('hide', sh.id !== 'daily');
}
function optTap(act, v) {
  const o = OPT;
  if (act === 'mon') { o.month = (o.month + Number(v) + 12) % 12; const mi = monthInfo(o.month); o.start = mi.start; o.days = mi.days; o.pack = o.month % 3; }
  else if (act === 'start') o.start = Number(v);
  else if (act === 'days') o.days = Number(v);
  else if (act === 'pack') o.pack = Number(v);
  else if (act === 'day') o.day = ((o.day - 1 + Number(v) + 31) % 31) + 1;
  else if (act === 'name') { o.name = v; S.certName = v; save(); }
  blip(600, 0, .06); renderSheet();
}
function setColor(on) { S.color = !!on; save(); renderSheet(); blip(500, 0, .06); }

// ----- printing (Chrome waits inside print(); iPad uses 'afterprint') -----
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();
  }, 60);
}
function notePrinted() { S.printed = (S.printed || 0) + 1; trophy('drawADay'); save(); }
function printSheet() {
  if (screen !== 'view') return;
  endPrintAll(); renderSheet(); notePrinted(); toast('🖨️ Printing!'); doPrint();
}
function printAll30() {
  const o = Object.assign({}, OPT); let h = buildSheet('cover', !S.color, o);
  for (let d = 1; d <= 30; d++) { o.day = d; h += buildSheet('daily', !S.color, o); }
  $('printAll').innerHTML = h; document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing the cover + 30 pages!'); doPrint(endPrintAll);
}
function endPrintAll() { document.body.classList.remove('pAll'); const pa = $('printAll'); if (pa) pa.innerHTML = ''; }
function printToday() { OPT = defaultOpt(); const d = now(); OPT.day = d.getDate(); openSheet(1); }

// ----- leaving: back to the Game Factory book -----
function leave() {
  try { speechSynthesis.cancel(); } catch (_) {}
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
function goBack() {
  if ($('party').classList.contains('on')) return closeParty();
  if ($('big').classList.contains('on')) return closeBig();
  if ($('spin').classList.contains('on')) return closeSpin();
  if (screen === 'view') return show('prn');
  if (screen !== 'home') return show('home');
  leave();
}

// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function gridCols(sel) {
  const th = document.querySelectorAll(sel); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop; th.forEach(t => { if (t.offsetTop === top) k++; }); return Math.max(1, k);
}
function arrowStep(k, i, N, cols) {
  if (k === 'ArrowRight') return Math.min(N - 1, i + 1);
  if (k === 'ArrowLeft') return Math.max(0, i - 1);
  if (k === 'ArrowDown') return Math.min(N - 1, i + cols);
  if (k === 'ArrowUp') return Math.max(0, i - cols);
  return i;
}
const isArrow = k => /^Arrow/.test(k);
function onKey(e) {
  const k = e.key, esc = k === 'Escape' || k === 'Backspace', enter = k === 'Enter' || k === ' ';
  if (isArrow(k)) kbd = true;
  if ($('party').classList.contains('on')) { if (esc || enter) { closeParty(); e.preventDefault(); } return; }
  if ($('big').classList.contains('on')) { if (esc || enter) { closeBig(); e.preventDefault(); } return; }
  if ($('spin').classList.contains('on')) {
    if (esc) closeSpin(); else if (k === 'Enter') spinDraw(); else if (k === ' ') doSpin(); else return;
    e.preventDefault(); return;
  }
  if (esc) { goBack(); e.preventDefault(); return; }
  if (screen === 'home') {
    if (isArrow(k)) { homeSel = (homeSel + (k === 'ArrowRight' || k === 'ArrowDown' ? 1 : HOME_BTNS.length - 1)) % HOME_BTNS.length; markHome(); blip(520, 0, .05); e.preventDefault(); }
    else if (enter) { $(HOME_BTNS[homeSel]).click(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printToday();
  } else if (screen === 'pad') {
    if (k === 'ArrowRight' || k === 'ArrowLeft') { const i = CRAYONS.indexOf(pen.col); pen.col = CRAYONS[(i + (k === 'ArrowRight' ? 1 : CRAYONS.length - 1)) % CRAYONS.length]; renderCrayons(); e.preventDefault(); }
  } else if (screen === 'gal') {
    if (!S.drawings.length) return;
    const order = S.drawings.map((d, i) => i).reverse(), pos = Math.max(0, order.indexOf(galSel));
    if (isArrow(k)) { galSel = order[arrowStep(k, pos, order.length, gridCols('.dthumb'))]; renderGal(); e.preventDefault(); }
    else if (enter) { openBig(galSel); e.preventDefault(); }
  } else if (screen === 'prn') {
    if (isArrow(k)) { prnSel = arrowStep(k, prnSel, SHEETS.length, gridCols('.thumb')); renderPrn(); e.preventDefault(); }
    else if (enter) { openSheet(prnSel); e.preventDefault(); }
    else if (k === 'p' || k === 'P') { openSheet(prnSel); printSheet(); }
  } else if (screen === 'view') {
    if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((cur + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((cur + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function spinDraw() { const p = spinP || todayPrompt(); closeSpin(); openPad(p, false); }

// =====================================================================
// START
// =====================================================================
function init() {

  tap('bSpinDraw', spinDraw);
  tap('bSpinClose', closeSpin);
  tap('bUndo', undoPad); tap('bClear', clearPad); tap('bSave', savePad);
  tap('bPadBack', () => show('home'));
  tap('bGalBack', () => show('home')); tap('bPrnBack', () => show('home')); tap('bViewBack', () => show('prn'));
  tap('bDel', delBig); tap('bBigClose', closeBig);
  tap('bPartyOk', closeParty);
  tap('bPartyCert', () => { closeParty(); OPT = defaultOpt(); openSheet(2); });
  tap('bColor', () => setColor(true)); tap('bLine', () => setColor(false));
  tap('bPrint', printSheet); tap('bPrintAll', printAll30);
  $('crayons').addEventListener('click', e => { const d = e.target.closest('.sw'); if (!d) return; pen.col = CRAYONS[+d.dataset.i]; renderCrayons(); blip(660, 0, .05); });
  $('sizes').addEventListener('click', e => { const b = e.target.closest('.btn'); if (!b) return; pen.size = +b.dataset.s;
    document.querySelectorAll('#sizes .btn').forEach(x => x.classList.toggle('on', x === b)); blip(500, 0, .05); });
  $('dGrid').addEventListener('click', e => { const d = e.target.closest('.dthumb'); if (d) { galSel = +d.dataset.i; openBig(galSel); } });
  $('pGrid').addEventListener('click', e => { const d = e.target.closest('.thumb'); if (d) openSheet(+d.dataset.i); });
  $('vOpts').addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b) optTap(b.dataset.act, b.dataset.v); });
  ['spin', 'big', 'party'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) goBack(); }));
  const cv = $('can');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', e => { if (drawing) penMove(e); });
  window.addEventListener('mouseup', penUp);
  window.addEventListener('mousedown', () => { if (kbd) { kbd = false; if (screen === 'home') markHome(); } });
  window.addEventListener('afterprint', () => { endPrintAll(); if (screen === 'view') renderSheet(); });
  window.addEventListener('resize', () => { if (screen === 'pad') fitCanvas(); });

  renderHome();
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
