function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);

function speak(line) {                                   // the browser's voice reads it out loud
  try {
    if (window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined') {
      const u = new SpeechSynthesisUtterance(line); u.rate = 0.95; u.pitch = 0.6; u.volume = 1;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }
  } catch (_) {}
}
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);

function buildLevel(w, lv) {
  const WMAX = 400, L = w.levels[lv];
  map = []; for (let r = 0; r < ROWS; r++) map.push(new Array(WMAX).fill(' '));
  clearObjects();
  let x = 0, gy = 11, ii = 0, ki = 0;
  const set = (c, r, ch) => { if (r >= 0 && r < ROWS && c >= 0 && c < WMAX) map[r][c] = ch; };
  const ground = (n, coinsToo, top = '#') => {
    for (let i = 0; i < n; i++, x++) {
      for (let r = gy; r < ROWS; r++) set(x, r, r === gy ? top : '#');
      if (coinsToo) coins.push(Object.assign(center(x, gy - 2), { got: false }));
    }
  };
  const addBolt = (c, r) => bolts.push(Object.assign(center(c, r), { k: bolts.length, got: false }));
  for (const tok of L.map.trim().split(/\s+/)) {
    const ch = tok[0], n = parseInt(tok.slice(1)) || 0;
    if (ch === 'F') ground(n || 1);
    else if (ch === 'C') ground(n || 1, true);
    else if (ch === 'G') x += n || 2;
    else if (ch === 'U') gy -= n || 1;
    else if (ch === 'D') gy += n || 1;
    else if (ch === 'A') { gy -= n || 3; ground(1); }      // a tall cliff (double jump or wall jump!)
    else if (ch === 'B') {
      const x0 = x; ground(n);
      for (let i = 1; i < n - 1; i++) { set(x0 + i, gy - 3, '='); coins.push(Object.assign(center(x0 + i, gy - 4), { got: false })); }
    }
    else if (ch === 'E') { enemies.push({ x: x * T + 6, y: (gy - 1) * T + 10, w: 30, h: 30, vx: -1, dead: 0, x0: (x - 2) * T, x1: (x + 3) * T, kind: w.ek }); ground(1); }
    else if (ch === 'M') { springs.push({ x: x * T + 2, y: gy * T - 22, w: T - 4, h: 22, t: 0 }); ground(1); }
    else if (ch === 'K') { flags.push({ x: x * T + 14, y: gy * T, on: false, pal: CHEER[(ki++ + w.id.length) % CHEER.length] }); ground(1); }
    else if (ch === 'O') { addBolt(x, gy - 1 - (n || 1)); ground(1); }                   // 🔩 a BOT BOLT, n tiles up
    else if (ch === 'H') { hearts.push(Object.assign(center(x, gy - 2), { got: false })); ground(1); }
    else if (ch === 'I') { signs.push({ x: x * T + 4, y: gy * T, text: L.signs[ii++] || '' }); ground(1); }
    else if (ch === '^') { for (let i = 0; i < (n || 1); i++) { set(x, gy - 1, '^'); ground(1); } }
    else if (ch === 'u') { for (let r = 0; r < gy; r++) set(x, r, 'u'); ground(1); }   // 🌫️ a DUST CLOUD wall (all the way up: only Dusty can clear it!)
    else if (ch === 'c') {                               // 💡 circuit stairs (only solid when Plug Bot LIGHTS THEM UP) + a bolt on top
      const x0 = x; ground((n || 3) + 3);
      for (let i = 0; i < (n || 3); i++) set(x0 + 1 + i, gy - 2 - i, 'o');
      addBolt(x0 + (n || 3), gy - 3 - (n || 3));
    }
    else if (ch === 'J') ground(n || 3, false, 'j');     // ⚡ charge pads
    else if (ch === 'R') ground(n || 4, false, 'r');     // 🏭 conveyor belt
    else if (ch === 'Q' || ch === 'W') {                 // 🧲 a magnet column (pulls Robo UP)

function drawCodeFX() {

  ctx.globalAlpha = Math.min(1, k * 1.5) * 0.85;
  for (let i = 0; i < 24; i++) drawBolt((i * 97 + frame * 3) % W, (i * 53 + frame * (2 + i % 3)) % H, 0.8);
  ctx.globalAlpha = 1;
  text('🤫 SECRET CODE! THE PROTOTYPE VAULT IS OPEN!', W / 2, H / 2, 30, '#ffd740');
}
function draw() {
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'talk') drawTalk();
  else if (state === 'play') drawPlay();
  else if (state === 'oops') drawOops();
  else if (state === 'clear') drawClear();
  else if (state === 'credits') drawCredits();
  if (!actx && state === 'title' && frame % 60 < 40) text('🔊 tap or press a key for sound', W / 2, 230, 16, '#ddd');
  if (codeFX > 0) drawCodeFX();
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
