<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Claude's Idea Shop</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #3d2b23; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fff7f0; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #eadfd6; border-bottom: 2px solid #d6c4b6; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #b85c3c; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #8a3f22, #d97757 55%, #f0a04b); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #3d2b23; }
  #logo .big i { color: #ffc94d; font-style: normal; }
  #logo .small { font-size: 15px; color: #fbe3d3; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #3d2b23; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #ffc94d; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #ffc94d; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #ffd740; color: #4e2600; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #c79100; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fff8e1; color: #6d4c00; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #f8e6d8; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #8a3f22; box-shadow: 0 4px 0 #e8b49a; }
  #nav button.on { background: #d97757; color: #fff; box-shadow: 0 4px 0 #8a3f22; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff1744; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c51162; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f48fb1; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(140,63,34,.18); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }
  .card.must { border-color: #ffc400; background: #fffdf0; }
  .card.sel { outline: 4px solid #ffc94d; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #fdf0e6; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #6b2f1a; line-height: 1.1; }
  .card .blurb { font-size: 15px; color: #555; }
  .card .price { font-size: 22px; font-weight: 900; color: #00873e; margin: 4px 0; }
  .card .price s { color: #999; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: #ffc400; color: #4e2600; }
  .tag.new { background: #00c853; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #8a3f22; box-shadow: 0 4px 0 #e8b49a; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #fbe3d3; color: #b85c3c; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #d97757; color: #fff; box-shadow: 0 4px 0 #8a3f22; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #fdf0e6; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #b85c3c; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #fbe3d3; box-shadow: 0 4px 0 #e8b49a; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(140,63,34,.15); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #6b2f1a; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #00873e; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #d97757; box-shadow: 0 5px 0 #8a3f22; }
  .bigbtn.green { background: #00c853; box-shadow: 0 5px 0 #00873e; }
  .bigbtn.blue { background: #2979ff; box-shadow: 0 5px 0 #1a4fb5; }
  .bigbtn.gray { background: #9e9e9e; box-shadow: 0 5px 0 #616161; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #6b2f1a; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #b85c3c; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #8a3f22; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(61,43,35,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(61,43,35,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fdf0e6; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fdf0e6; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #b85c3c; }
  #printBox .pbTip { font-size: 20px; color: #8a3f22; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>

  <div id="head">

    <div id="bubble">BEEP BOOP! Welcome to the Idea Shop!</div>

<script>
// 💡 CLAUDE'S IDEA SHOP: buy paper INVENTOR KITS from Claude Robo with pretend Idea Sparks,
// then pick which orders to PRINT on your printer. Nothing prints by itself.
// Save: localStorage.ideaShop = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'ideaShop';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (copied from Robo 2.0's store; ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
// ---------- 🧡 THE CLAUDE CHARACTERS: copied from The Claude Museum (claudemuseum.html) ----------
let frame = 0; const PRINTING = true;             // pictures here are always still (no blinking)
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
const OR = '#d97757', OR2 = '#e8956f', OR3 = '#b85c3c', CREAM = '#fbe3d3', DARK = '#3d2b23', GOLD = '#ffc94d';
function sparkle(cx, cy, r, col, rot = 0, lw) {               // the Claude sparkle: 8 rounded rays
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw || Math.max(1.5, r * 0.28); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, q = i % 2 ? 0.7 : 1; ctx.moveTo(cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.25); ctx.lineTo(cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q); }
  ctx.stroke(); ctx.restore();
}
function eyes(cx, cy, s, gap = 12, size = 6, col = DARK) {
  const bl = !PRINTING && frame % 220 < 6 ? 0.15 : 1;
  for (const d of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx + d * gap * s, cy, size * s * 0.8, size * s * bl, 0, 0, 7); ctx.fill(); if (bl > 0.5) circle(cx + d * gap * s + 1.5 * s, cy - 2 * s, size * 0.35 * s, '#fff'); }
}
function smile(cx, cy, s, w = 7, col = DARK, open = 0) {
  ctx.strokeStyle = col; ctx.lineWidth = 2.2 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, w * s, 0.2, Math.PI - 0.2); ctx.stroke(); ctx.lineCap = 'butt';
  if (open > 0) { ctx.fillStyle = '#7b2d1e'; ctx.beginPath(); ctx.ellipse(cx, cy + w * 0.6 * s, w * 0.8 * s, w * 0.7 * open * s, 0, 0, 7); ctx.fill(); }
}
function blush(cx, cy, s, gap = 18) { circle(cx - gap * s, cy, 4 * s, 'rgba(255,128,128,.45)'); circle(cx + gap * s, cy, 4 * s, 'rgba(255,128,128,.45)'); }
function robot(cx, by, s, pal) {                               // a Robo Jump-style body
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = by - h;
  ctx.fillStyle = pal[4]; ctx.fillRect(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s); ctx.fillRect(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s);
  rr(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal[1]);
  rr(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal[5]); rr(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal[5]);
  rr(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal[0]); rr(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal[2]);
  return { x, y, w, h, ey: y + h * 0.27 };
}
// each: [id, name, emoji, action button, where it was "discovered", fun facts, draw(cx, cy, s, a)]  (a = 0..1 while it does its thing)
const MCH = {
  robo: (cx, cy, s, a) => { const S = s * 2.2, by = cy + 44 * s - Math.abs(Math.sin(a * 12)) * 20 * s * (a > 0 ? 1 : 0); const b = robot(cx, by, S, [OR2, CREAM, DARK, '#fff', OR, OR]);
      eyes(cx, b.ey, S * 0.5, 12, 8, '#fff'); sparkle(cx, b.y + b.h * 0.7, 6 * S, OR, frame * 0.02); if (a > 0) text('BEEP BOOP!', cx, cy - 70 * s, 22 * s, '#fff'); },
  baby: (cx, cy, s, a) => { const y = cy + Math.sin(frame * 0.06) * 6 * s - (a > 0 ? Math.abs(Math.sin(a * 14)) * 14 * s : 0); sparkle(cx, y, 46 * s, OR, frame * 0.01 + (a > 0 ? a * 6 : 0), 10 * s);
      circle(cx, y, 24 * s, CREAM); eyes(cx, y - 2 * s, s, 9, 7); blush(cx, y + 8 * s, s, 14); smile(cx, y + 6 * s, s, 5, DARK, a > 0 ? 1 : 0);
      if (a > 0) for (let i = 0; i < 3; i++) text('♥', cx + (i - 1) * 30 * s, y - 50 * s - a * 30 * s, 18 * s, '#ff80ab', 'center', false); },

    const line = el('div', 'line'); line.appendChild(thumbCanvas(k, 150, 110));
    line.appendChild(el('div', 'nm', P(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '')));
    line.appendChild(el('div', 'pr', '💡 ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); L.appendChild(line);
  }
  const t = el('div', 'total');
  const g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'Gift wrap! I will add inventor wrapping paper to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 💡 ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (tot > S.bucks) { sfx.glitch(); say('Uh oh! Not enough Idea Sparks! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.bucks -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreBucks() {
  S.bucks += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['BEEP BOOP! Here are 500 more Idea Sparks!', 'Ding ding! 500 Idea Sparks! My brain is buzzing!', 'Zap! 500 more Idea Sparks for Ben!']));
}
// 🚚 delivery animation
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.vroom(); say('Placing your order... BEEP BOOP!'); requestAnimationFrame(shipLoop); }
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#8a3f22'); g.addColorStop(1, '#00897b'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 30; i++) circ((i * 173 + shipT * (i % 3 + 1) * 0.5) % 960, (i * 97) % 300, 2 + i % 3, 'rgba(255,255,255,.6)');
    ctx.fillStyle = '#37474f'; ctx.fillRect(0, 420, 960, 120); for (let i = 0; i < 12; i++) { ctx.fillStyle = '#ffd740'; ctx.fillRect(((i * 120 - shipT * 14) % 1440 + 1440) % 1440 - 120, 474, 70, 10); }
    const done = shipT > 150, tx = done ? 330 : -380 + Math.min(1, shipT / 140) * 710 + (shipT < 140 ? Math.sin(shipT * 0.5) * 3 : 0), ty = 330;
    if (!done) for (let i = 0; i < 5; i++) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(tx - 60 - i * 40, ty + 20 + i * 12, 40, 5); }
    // the truck
    rr(tx, ty, 220, 110, 14, '#d97757', '#3d2b23', 4); rr(tx + 220, ty + 30, 90, 80, 16, '#f0a04b', '#3d2b23', 4);
    rr(tx + 240, ty + 42, 52, 38, 8, '#b2ebf2'); RoboAt(tx + 266, ty + 84, 44, { line: '#3d2b23' });
    txt('IDEA SHOP', tx + 110, ty + 40, 30, '#ffc94d'); txt('EXPRESS', tx + 110, ty + 76, 24, '#fff'); bulb(tx + 196, ty - 52, 16, true);
    for (const wx of [tx + 55, tx + 250]) { circ(wx, ty + 112, 26, '#212121'); circ(wx, ty + 112, 11, '#bdbdbd'); }
    for (let i = 0; i < Math.min(shipCount, 6); i++) { const bx = tx + 20 + i * 32, by = ty - 32; rr(bx, by, 30, 30, 3, '#d7a86e', '#6d4c41', 2); ctx.fillStyle = '#6d4c41'; ctx.fillRect(bx + 12, by, 6, 30); }
    if (!done) { txt('Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 110, 54, '#fff'); rr(280, 160, 400, 26, 13, 'rgba(255,255,255,.3)'); rr(280, 160, Math.max(26, 400 * Math.min(1, shipT / 150)), 26, 13, '#ffc94d'); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); rr(480 + Math.cos(a) * d, 140 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.5, 12, 8, 2, ['#ff4081', '#ffd740', '#ffc94d', '#40c4ff'][i % 4]); }
      txt('ORDER CONFIRMED! 📦', 480, 105, 66, '#3d2b23'); txt('ORDER CONFIRMED! 📦', 480, 100, 66, '#ffc94d');
      txt(shipCount + (shipCount === 1 ? ' thing is' : ' things are') + ' in MY ORDERS, ready to print!', 480, 175, 30, '#fff');
    }
  } finally { ctx = old; }
  if (shipT > 150 && !shipDone) { shipDone = true; sfx.cash(); say('ORDER CONFIRMED! BEEP BOOP! Tap PRINT on the things you want!'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    if (!P(o.k)) continue;
    const line = el('div', 'line'); line.appendChild(thumbCanvas(o.k, 150, 110));
    line.appendChild(el('div', 'nm', P(o.k).name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${P(o.k).pages.length + (o.gift ? 1 : 0)} page${P(o.k).pages.length + (o.gift ? 1 : 0) > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function openPrint(list) {
  closePrint(true);
  const fns = [];
  for (const o of list) { const p = P(o.k); if (!p) continue; if (o.gift) fns.push(() => pageGift(p.name)); p.pages.forEach(f => fns.push(f)); }
  if (!fns.length) return;
  const sc = fns.length > 24 ? 1 : fns.length > 8 ? 1.15 : 1.5, name = list.length === 1 ? P(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('ideaShop'); say('Printing! Ask a grown-up to help with the printer. Then let\'s build!'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  Tip: turn on color printing!'));
  document.body.appendChild(printBox);
  for (const f of fns) { const img = new Image(); img.className = 'pbPage'; img.alt = name; img.src = makePage(f, sc).toDataURL('image/png'); printBox.appendChild(img); }
  sfx.click(); say(list.length === 1 && list[0].k === 'claudefold' ? 'That is the Fold-Up me! Tap PRINT to print all 3 pages!' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT >= 0 && shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! BEEP BOOP!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).cat !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price! BEEP BOOP!');
};
$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'BEEP BOOP! Welcome back, Inventor Ben! Your orders are in MY ORDERS.' : 'BEEP BOOP! Welcome to the Idea Shop, Ben! Inventor kits you can print!'; }, 50);
</script>
