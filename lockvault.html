<script>
// 🔐 LOCK ROBO'S PUZZLE VAULT
// After Robo Jump 8, LOCK ROBO is NICE now! He was lonely, so he built a cozy PUZZLE VAULT to share.
// 48 little vault puzzles of 6 kinds (Slide the Key, Gear Turner, Pipe Lock, Code Dial, Light Switch, Key Match),
// 5 vaults (Silver, Gold, Glitch, Time, MASTER). Every vault you open = a GOLDEN KEY + a treasure.
// Tap / drag, or arrows + SPACE.  Z = undo, X = hint, R = reset, ESC = back to the map.
const C = document.getElementById('game');
const ctx = C.getContext('2d');
const W = 960, H = 520;

// ---------- Saves, coins, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.lockvault = (c.lockvault || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book

let save = { done: {}, items: [], seen: {}, music: true, coins: 0 };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('lockVault') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.done = save.done || {}; save.items = Array.isArray(save.items) ? save.items : []; save.seen = save.seen || {};
}
function writeSave() { try { localStorage.setItem('lockVault', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  click:  () => note(900, 0, 0.05, 'square', 0.05),
  move:   () => { note(520, 0, 0.07, 'triangle', 0.09, 700); },
  slide:  () => { note(240, 0, 0.12, 'triangle', 0.1, 330); note(1200, 0.02, 0.04, 'square', 0.02); },
  turn:   () => { note(1400, 0, 0.03, 'square', 0.04); note(700, 0.03, 0.06, 'triangle', 0.07); },   // tick-tick
  gear:   () => { for (let i = 0; i < 3; i++) note(1500 - i * 200, i * 0.03, 0.03, 'square', 0.04); note(300, 0, 0.1, 'triangle', 0.08); },
  ungear: () => { note(500, 0, 0.08, 'triangle', 0.08, 250); },
  jam:    () => { note(120, 0, 0.3, 'sawtooth', 0.1, 70); note(160, 0.12, 0.25, 'square', 0.06, 90); },
  toggle: () => { note(660, 0, 0.06, 'sine', 0.1); note(990, 0.05, 0.08, 'sine', 0.07); },
  untoggle: () => note(440, 0, 0.08, 'sine', 0.08, 300),
  dial:   () => { note(2000, 0, 0.02, 'square', 0.04); note(1000, 0.01, 0.04, 'triangle', 0.05); },
  nope:   () => { note(220, 0, 0.12, 'square', 0.08); note(185, 0.13, 0.2, 'square', 0.08); },
  yes:    () => { [784, 988, 1175].forEach((f, i) => note(f, i * 0.05, 0.12, 'sine', 0.09)); },
  flip:   () => { note(500, 0, 0.08, 'triangle', 0.08, 900); },
  hint:   () => { [1319, 1568, 2093].forEach((f, i) => note(f, i * 0.06, 0.15, 'sine', 0.06)); },
  undo:   () => { note(800, 0, 0.1, 'triangle', 0.07, 400); },
  key:    () => { [1568, 2093, 2637].forEach((f, i) => note(f, i * 0.05, 0.12, 'sine', 0.08)); note(3136, 0.12, 0.2, 'triangle', 0.04); },   // jingle!
  locked: () => { note(160, 0, 0.12, 'square', 0.09); note(140, 0.13, 0.18, 'square', 0.09); },
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  // 🔓 CLICK ... CLACK ... CLUNK!
  unlock: () => {
    note(2400, 0, 0.03, 'square', 0.07); note(1200, 0.01, 0.05, 'triangle', 0.08);                    // click
    note(1800, 0.3, 0.04, 'square', 0.08); note(700, 0.31, 0.08, 'triangle', 0.1);                     // clack
    note(110, 0.62, 0.45, 'sawtooth', 0.16, 45); note(70, 0.64, 0.5, 'square', 0.1, 35); note(300, 0.62, 0.1, 'square', 0.08, 120);   // CLUNK!
  },
  creak:  () => { note(180, 0, 0.6, 'sawtooth', 0.04, 260); note(240, 0.2, 0.5, 'triangle', 0.04, 160); },
};
function fanfare(d = 0) {                              // 🎺 the solve fanfare
  [[72, 0], [76, 0.12], [79, 0.24], [84, 0.36], [79, 0.6], [84, 0.72], [88, 0.84]].forEach(([m, t], i) => {
    note(midi(m), d + t, i === 6 ? 0.7 : 0.16, 'square', 0.07); note(midi(m - 12), d + t, i === 6 ? 0.7 : 0.16, 'triangle', 0.08);
  });
  note(midi(48), d, 1.6, 'sawtooth', 0.04);
  [2093, 2637, 3136].forEach((f, i) => note(f, d + 0.84 + i * 0.05, 0.3, 'sine', 0.04));   // key sparkle on top
}
function bigFanfare() {                                // 🏆 the MASTER VAULT fanfare
  fanfare(0);
  [[67, 1.4], [72, 1.55], [76, 1.7], [79, 1.85], [84, 2.0], [88, 2.3], [91, 2.6]].forEach(([m, t], i) => { note(midi(m), t, i === 6 ? 1.2 : 0.2, 'square', 0.07); note(midi(m - 12), t, i === 6 ? 1.2 : 0.2, 'sawtooth', 0.04); });
}



// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  } else if (kind === 'g') {                           // 👾 glitch blip: a tiny jumpy square-wave chirp
    const f0 = 700 + (Math.floor(t * 1000) % 7) * 260, o = osc('square', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.setValueAtTime(f0 * 1.5, t + 0.02); o.frequency.setValueAtTime(f0 * 0.75, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.setValueAtTime(vol, t + 0.045); g.gain.linearRampToValueAtTime(0, t + 0.055);
    o.connect(g); g.connect(out);
  }
}
// ⏰ NEW drums for Robo Jump 7: w = clock TICK, q = clock TOCK (wood blocks), j = finger cymbals (Pyramid Moon)
function drumX0(kind, t, vol, out) {
  if (kind === 'w' || kind === 'q') {
    const f0 = kind === 'w' ? 2100 : 1250, o = osc('triangle', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.001); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g); g.connect(out);
    noiseHit(t, 'bandpass', f0 * 1.5, 6, vol * 0.4, 0.02, out);
  } else if (kind === 'j') {
    for (const [f, v] of [[2637, 1], [3951, 0.5], [5274, 0.25]]) {
      const o = osc('sine', f, t, t + 0.5), g = actx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g); g.connect(out);
    }
  } else drumHit(kind, t, vol, out);
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar, "4/5" = two per bar): degree number, M = make it major, m = minor, b = flat root (bVII), 7 = add the 7th.
// 🔒 NEW drums for Robo Jump 8: n = CHAIN RATTLE (clanky metal links), y = KEY JINGLE (a ring of little keys)
function drumX(kind, t, vol, out) {
  if (kind === 'n') {                                  // ⛓️ a quick shake of metal links: 4 tiny clinks + a low clank
    for (let i = 0; i < 4; i++) noiseHit(t + i * 0.018, 'bandpass', 3200 + ((i * 977) % 1700), 9, vol * (1 - i * 0.18), 0.035, out);
    const o = osc('square', 410, t, t + 0.08), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.25, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
    o.connect(g); g.connect(out);
  } else if (kind === 'y') {                           // 🔑 jingle jingle: little bell pings that land a hair apart
    for (let i = 0; i < 5; i++) {
      const f = [4186, 5274, 4699, 5920, 4435][i], tt = t + i * 0.012, o = osc('sine', f, tt, tt + 0.25), g = actx.createGain();
      g.gain.setValueAtTime(0, tt); g.gain.linearRampToValueAtTime(vol * (1 - i * 0.12), tt + 0.002); g.gain.exponentialRampToValueAtTime(0.001, tt + 0.22);
      o.connect(g); g.connect(out);
    }
  } else drumX0(kind, t, vol, out);
}
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10], hijaz: [0, 1, 4, 5, 7, 8, 10] };   // hijaz = the Egyptian-sounding scale
const degS = (sc, k) => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
function parseMel(str, sc) {
  return str.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean).map(tk => {
    if (tk === '.') return null;
    if (tk === '-') return 'h';
    const m = tk.match(/^([b#]?)([1-7])([',]*)$/);
    if (!m) return null;

  ctx.globalAlpha = 1;
}
function drawMusicBtn() { roundRect(BTN.music[0], BTN.music[1], BTN.music[2], BTN.music[3], 12, 'rgba(0,0,0,.35)'); text(musicOn ? '🎵' : '🔇', BTN.music[0] + 30, BTN.music[1] + 31, 22); }
function drawBubble(x, y, w, str, size = 19) {         // Lock Robo's speech bubble (tail points down to him)
  const lines = wrap(str, w - 28, size), h = lines.length * (size + 5) + 22;
  roundRect(x, y, w, h, 16, '#fffde7'); strokeRR(x, y, w, h, 16, '#ffb300', 3);
  ctx.fillStyle = '#fffde7'; ctx.beginPath(); ctx.moveTo(x + w / 2 - 14, y + h - 2); ctx.lineTo(x + w / 2, y + h + 18); ctx.lineTo(x + w / 2 + 14, y + h - 2); ctx.fill();
  lines.forEach((l, k) => plain(l, x + w / 2, y + 16 + size + k * (size + 5) - 4, size, '#3e2723'));
  return h;
}
function drawTitle() {
  drawBg(4);
  const t = frame;
  for (let k = 0; k < 8; k++) drawKey(80 + k * 115, 70 + Math.sin(t * 0.03 + k) * 12, 1.6, k % 2 ? '#ffd740' : '#fff59d', Math.sin(t * 0.02 + k) * 0.5);
  text('🔐 LOCK ROBO\'S', 480, 140, 44, '#ffd740');
  text('PUZZLE VAULT', 480, 205, 64, '#fff');
  drawLockRobo(150, 210, 190, 260, 1, { wave: true, talk: robo.t < 120 });
  drawRobo(760, 330, 90, 120, -1);
  text('Robo came to play too!', 805, 480, 18, '#e3f2fd');
  // a big round vault door in the middle
  circle(480, 310, 70, '#8d6e63'); circle(480, 310, 62, '#ffd740'); drawGear(480, 310, 40, t * 0.01, '#ffb300', 12); circle(480, 310, 14, '#8d6e00');
  button(BTN.play, '▶ PLAY', '#00c853', 34);
  text(`🔑 ${keysHave()} of ${PUZZLES.length} golden keys   🎁 ${save.items.length} treasures`, 480, 505, 20, '#fff8e1');
  button(BTN.back, '⬅ BOOK', '#546e7a', 20); drawMusicBtn();
}
function doorXY(w, j) { return [186 + j * 64, 66 + w * 84]; }
function drawMap() {
  drawBg(mapSel.w);
  text('🔐 THE VAULT MAP', 480, 42, 30, '#ffd740');
  text(`🔑 ${keysHave()}/${PUZZLES.length}`, 820, 42, 24, '#fff59d');
  button(BTN.back, '⬅ BACK', '#546e7a', 20); drawMusicBtn();
  WORLDS.forEach((wd, w) => {
    const open = worldOpen(w), [, y] = doorXY(w, 0);
    roundRect(10, y - 4, 940, 74, 14, open ? 'rgba(0,0,0,.25)' : 'rgba(0,0,0,.5)');
    text(wd.emoji + ' ' + wd.name, 96, y + 30, 17, open ? '#fff' : '#90a4ae');
    text(open ? (worldDone(w) ? '⭐ all open!' : `${wd.doors.filter(i => save.done[PUZZLES[i].id]).length}/${wd.doors.length} open`) : `🔒 need ${wd.need} 🔑`, 96, y + 56, 15, open ? '#fff59d' : '#ffab91');
    wd.doors.forEach((pi, j) => {
      const [x] = doorXY(w, j), pz = PUZZLES[pi], done = save.done[pz.id], sel = mapSel.w === w && mapSel.j === j;
      if (sel) roundRect(x - 5, y - 2, 64, 70, 12, frame % 30 < 15 ? '#ffea00' : '#fff');
      roundRect(x, y + 2, 54, 62, 10, open ? (done ? '#263238' : wd.door) : '#546e7a');
      if (done) {                                        // an OPEN door: swung open, treasure shining inside
        circle(x + 27, y + 34, 16, 'rgba(255,215,64,.35)'); text(treasureFor(pi).emoji, x + 27, y + 42, 22);
        ctx.fillStyle = wd.trim; ctx.fillRect(x, y + 2, 8, 62); text('✓', x + 46, y + 20, 16, '#69f0ae');
      } else {
        circle(x + 27, y + 36, 15, open ? wd.trim : '#455a64'); drawGear(x + 27, y + 36, 11, 0, open ? '#fff8e1' : '#78909c', 8);
        text(KINDS[pz.kind].emoji, x + 13, y + 20, 13);
      }
    });
    if (!open) { drawChain(176, y + 34, 950, y + 34, '#b0bec5', 1.1); drawPadlock(560, y + 34, 1.3, '#ffb300'); }
  });
  text('Tap a door to open its puzzle!   (arrows + SPACE work too)', 480, 510, 17, '#fff');
  if (bannerT > 0) { roundRect(180, 200, 600, 80, 20, 'rgba(0,0,0,.75)'); text(banner, 480, 252, 32, '#ffd740'); }
}
function drawTalk(lines, i) {
  drawBg(state === 'ending' ? 4 : 0);
  if (state === 'ending') { circle(700, 260, 150, '#8d6e63'); circle(700, 260, 140, '#3e2723'); circle(700, 260, 100, 'rgba(255,215,64,.4)'); drawKey(700, 260, 5, '#ffd740', -0.4 + Math.sin(frame * 0.05) * 0.1); text('🏆 Trophy: Vault Cracker!', 700, 470, 28, '#ffd740'); drawRobo(560, 360, 60, 80, 1); }
  drawLockRobo(60, 230, 220, 270, 1, { talk: true, wave: state === 'ending' });
  drawBubble(state === 'ending' ? 40 : 300, 40, state === 'ending' ? 480 : 600, lines[i], 26);
  text('TAP or SPACE ▶', state === 'ending' ? 280 : 600, 505, 20, '#fff');
}
function drawArrow(x0, y0, x1, y1, col) {
  const a = Math.atan2(y1 - y0, x1 - x0), L = Math.hypot(x1 - x0, y1 - y0); if (L < 4) return;
  ctx.strokeStyle = col; ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x0, y0); ctx.lineTo(x1 - Math.cos(a) * 14, y1 - Math.sin(a) * 14); ctx.stroke();
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x1 - Math.cos(a - 0.5) * 30, y1 - Math.sin(a - 0.5) * 30); ctx.lineTo(x1 - Math.cos(a + 0.5) * 30, y1 - Math.sin(a + 0.5) * 30); ctx.fill();
}
function drawPuzzle() {
  const wd = WORLDS[P.def.w], K = P.K;
  drawBg(P.def.w);
  roundRect(AREA.x - 4, AREA.y - 4, AREA.w + 8, AREA.h + 8, 18, 'rgba(0,0,0,.28)');
  const num = wd.doors.indexOf(P.i) + 1;
  text(`${wd.emoji} ${wd.name} • Door ${num}: ${K.emoji} ${K.name}`, 510, 42, 24, '#fff');
  button(BTN.back, '⬅ MAP', '#546e7a', 20); drawMusicBtn();
  K.draw(P);
  if (P.hint && !P.won) {                              // 💡 Lock Robo shows the next move
    const pulse = 0.5 + Math.sin(P.hint.t * 0.2) * 0.5;
    for (const r of P.hint.rects) { strokeRR(r[0] - 6, r[1] - 6, r[2] + 12, r[3] + 12, 14, `rgba(255,234,0,${0.5 + pulse * 0.5})`, 6); }
    if (P.hint.arrow) { const [x0, y0, x1, y1] = P.hint.arrow; drawArrow(x0, y0, x1, y1, `rgba(255,23,68,${0.6 + pulse * 0.4})`); }
  }
  // 🔒 Lock Robo, our host, on the left
  drawLockRobo(46, 300, 150, 196, 1, { talk: robo.t < 90, wave: P.won });
  drawBubble(10, 66, 222, robo.text || K.help, 17);
  // buttons + controls on the right
  button(BTN.hint, '💡 HINT', '#ffab00', 26);
  button(BTN.undo, '↩ UNDO', K.noUndo && K.noUndo(P) ? '#78909c' : '#29b6f6', 26);
  button(BTN.reset, '🔄 RESET', '#ab47bc', 26);
  const tips = { slide: ['Drag a block', 'or: arrows move,', 'SPACE grabs'], gear: ['Tap a peg', 'to add a gear,', 'tap again = off'], pipe: ['Tap a pipe', 'to turn it'], dial: ['Tap ▲ ▼', 'then TRY IT!', 'or: arrows + SPACE'],
    light: ['Tap a lock', 'to flip it'], match: P.data.mode === 'memory' ? ['Tap 2 cards', 'to flip them'] : ['Drag a key', 'to its lock', 'or tap key, tap lock'] }[P.def.kind];
  tips.concat(['', 'X = hint  Z = undo', 'R = reset']).forEach((l, k) => text(l, 848, 312 + k * 24, 17, '#e3f2fd'));
  text(`Moves: ${P.moves}`, 848, 312 + 7 * 24, 17, '#fff59d');
}
function drawOpen() {                                  // 🔓 CLICK, CLACK, CLUNK! The vault door swings open!
  drawBg(P.def.w);
  const cx = 500, cy = 250, R = 150, spin = Math.min(openT, 37) / 37 * Math.PI * 1.5, sw = Math.max(0, Math.min(1, (openT - 50) / 30)), ang = sw * 1.35;
  circle(cx, cy, R + 16, '#37474f'); circle(cx, cy, R + 6, '#263238');
  circle(cx, cy, R - 4, '#1a1a1a');                    // inside the vault
  if (sw > 0) {
    circle(cx, cy, R * 0.8, `rgba(255,215,64,${0.25 * sw})`);
    for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4 + frame * 0.01; ctx.strokeStyle = `rgba(255,236,130,${0.35 * sw})`; ctx.lineWidth = 10; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(a) * R * 0.9, cy + Math.sin(a) * R * 0.9); ctx.stroke(); }
    const rise = Math.min(1, Math.max(0, (openT - 62) / 30));
    ctx.save(); ctx.globalAlpha = Math.max(0.2, rise); text(P.treasure.emoji, cx, cy + 30 - rise * 20, 64 + rise * 30); ctx.restore();
  }
  const hx = cx - R, dw = R * Math.cos(ang), dcx = hx + dw;   // the door: hinged on the left, it swings toward us
  if (dw > 2) {
    ctx.save(); ctx.translate(dcx, cy); ctx.scale(Math.max(0.02, Math.cos(ang)), 1);
    circle(0, 0, R, '#90a4ae'); circle(0, 0, R - 12, '#b0bec5');
    for (let k = 0; k < 12; k++) { const a = k * Math.PI / 6, out = openT < 37 ? 1 : Math.max(0.82, 1 - (openT - 37) * 0.01); circle(Math.cos(a) * (R - 22) * out, Math.sin(a) * (R - 22) * out, 7, '#607d8b'); }   // the bolts slide in
    ctx.rotate(spin); ctx.strokeStyle = '#ffd740'; ctx.lineWidth = 12; ctx.lineCap = 'round';
    for (let k = 0; k < 3; k++) { ctx.rotate(Math.PI / 3); ctx.beginPath(); ctx.moveTo(-70, 0); ctx.lineTo(70, 0); ctx.stroke(); }
    circle(0, 0, 26, '#ffb300'); drawKey(0, 0, 1.4, '#fff8e1');
    ctx.restore();
  }
  if (openT > 4) text('CLICK!', 300, 120, 30, '#fff59d');
  if (openT > 18) text('CLACK!', 700, 120, 30, '#fff59d');
  if (openT > 37) text('CLUNK!', 500, 70, 48 + Math.max(0, 50 - openT), '#ffd740');
  drawLockRobo(10, 300, 150, 196, 1, { talk: openT > 60 && robo.t < 90, wave: true });
  if (openT > 70) {
    roundRect(250, 420, 520, 92, 18, 'rgba(0,0,0,.6)');
    text(P.first ? '+1 🔑 GOLDEN KEY!' : 'You cracked it again!', 510, 456, 28, '#ffd740');
    text('Inside: ' + P.treasure.name, 510, 494, 20, '#fff');
  }
  if (openT > 90) text('TAP or SPACE ▶', 870, 505, 20, frame % 40 < 28 ? '#fff' : '#ffd740');
}
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (state === 'title') drawTitle();
  else if (state === 'talk' || state === 'ending') drawTalk(talk ? talk.lines : ENDING, talk ? talk.i : ENDING.length - 1);
  else if (state === 'map') drawMap();
  else if (state === 'puzzle') drawPuzzle();
  else if (state === 'open') drawOpen();
  for (const q of parts) { ctx.globalAlpha = Math.min(1, q.life / 30); ctx.fillStyle = q.c; ctx.fillRect(q.x, q.y, q.s, q.s); }
  ctx.globalAlpha = 1;
  if (stickerNew > 0) { stickerNew--; roundRect(300, 470, 360, 44, 14, 'rgba(0,0,0,.7)'); text('⭐ NEW STICKER: Vault Cracker!', 480, 500, 20, '#ffd740'); }
  ctx.restore();
}

// ---------- Input: keyboard (and the iPad buttons, which send the same keys) ----------
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  else if (actx.state === 'suspended' && actx.resume) actx.resume();
}
function play() { sfx.click(); if (!save.seen.intro) { save.seen.intro = 1; writeSave(); startTalk(INTRO, toMap); } else toMap(); }
function openDoor(w, j) {
  mapSel = { w, j };
  if (!worldOpen(w)) { sfx.locked(); banner = `🔒 Needs ${WORLDS[w].need} golden keys (you have ${keysHave()})`; bannerT = 150; roboSay(`That vault needs ${WORLDS[w].need} golden keys. Open more doors first!`); return; }
  openPuzzle(WORLDS[w].doors[j]);
}
function mapMove(k) {
  const m = mapSel;
  if (k === 'L') m.j--; if (k === 'R') m.j++; if (k === 'U') m.w--; if (k === 'D') m.w++;
  m.w = Math.max(0, Math.min(WORLDS.length - 1, m.w)); m.j = Math.max(0, Math.min(WORLDS[m.w].doors.length - 1, m.j)); sfx.click();
}
addEventListener('keydown', e => {
  wakeAudio();
  const raw = e.key, k = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D', ' ': 'A', Enter: 'A' }[raw];
  if (raw === ' ' || raw.startsWith('Arrow')) { if (e.preventDefault) e.preventDefault(); }
  if (e.repeat && k === 'A') return;
  if ((raw === 'm' || raw === 'M') && !e.repeat) { toggleMusic(); return; }
  if (state === 'title') { if (k === 'A') play(); else if (raw === 'Escape') goBack(); }
  else if (state === 'talk' || state === 'ending') { if (k === 'A' && talk) nextTalk(); }
  else if (state === 'map') { if (k === 'A') openDoor(mapSel.w, mapSel.j); else if (k) mapMove(k); else if (raw === 'Escape') { state = 'title'; sfx.click(); } }
  else if (state === 'puzzle' && P) {
    if (raw === 'Escape') { toMap(); return; }
    if (P.won) return;
    if (raw === 'z' || raw === 'Z') doUndo();
    else if (raw === 'x' || raw === 'X') doHint();
    else if (raw === 'r' || raw === 'R') doReset();
    else if (k) { P.kb = true; P.K.key(P, k); }
  } else if (state === 'open') { if (k === 'A' && openT > 90) finishOpen(); }
});
// ---------- Input: taps, clicks and drags (touchpad.js turns finger touches into mouse events) ----------
function canvasXY(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
let mouseDown = false;
C.addEventListener('mousedown', e => {
  wakeAudio(); mouseDown = true;
  const [x, y] = canvasXY(e);
  if (inR(x, y, BTN.music)) { toggleMusic(); return; }
  if (state === 'title') { if (inR(x, y, BTN.back)) goBack(); else play(); }
  else if (state === 'talk' || state === 'ending') { if (talk) nextTalk(); }
  else if (state === 'map') {
    if (inR(x, y, BTN.back)) { state = 'title'; sfx.click(); return; }
    WORLDS.forEach((wd, w) => wd.doors.forEach((_, j) => { const [dx, dy] = doorXY(w, j); if (inR(x, y, [dx - 4, dy, 62, 68])) openDoor(w, j); }));
  } else if (state === 'puzzle' && P) {
    if (inR(x, y, BTN.back)) { toMap(); return; }
    if (P.won) return;
    if (inR(x, y, BTN.hint)) doHint();
    else if (inR(x, y, BTN.undo)) doUndo();
    else if (inR(x, y, BTN.reset)) doReset();
    else { P.kb = false; P.K.down(P, x, y); }
  } else if (state === 'open') { if (openT > 90) finishOpen(); }
});
addEventListener('mousemove', e => { if (!mouseDown || state !== 'puzzle' || !P || !P.K.move) return; const [x, y] = canvasXY(e); P.K.move(P, x, y); });
addEventListener('mouseup', e => { if (!mouseDown) return; mouseDown = false; if (state !== 'puzzle' || !P || !P.K.up) return; const [x, y] = canvasXY(e); P.K.up(P, x, y); });

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
