    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }

<script>
// 📱 THE TABLET MUSEUM — Ben's idea! The history of tablets: clay tablets, school slates, pen computers,
// the iPads, Android tablets and Surface. In THE GRAND HALL: Ben's own iPad in its black case, where the Game Factory lives!
// Tap an exhibit to see it up close (and make it do its thing), collect a 📘 passport stamp for each one,
// then visit the 🎁 Gift Shop to print souvenirs. Robo is the museum guide.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { seen: {} };
try { const s = JSON.parse(localStorage.getItem('tabletMuseum') || 'null'); if (s && s.seen) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('tabletMuseum', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;

// ---------- 🤖 ROBO, the museum guide (copied from robomovie.html so he looks EXACTLY like himself) ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();

const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)
    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    const lit = pose === 'off' ? 0.25 : 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0);
    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);
      const ey = -29.5;
      if (o.dizzy) {                                   // 💫 swirly dizzy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.1;
        for (const ex of [-3, 9]) { ctx.beginPath(); for (let a = 0; a < 12; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.3, ey + Math.sin(a + t * 0.2) * a * 0.3); ctx.stroke(); }
      } else if (pose === 'happy' || o.happy) {        // ^ ^ happy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5, talk = o.mouth ? 0.85 + 0.15 * Math.sin(t * 0.6) : 1;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      if (o.mouth) { ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, -25); ctx.lineTo(1 + 2 + Math.abs(Math.sin(t * 0.5)) * 3, -25); ctx.stroke(); }
      ctx.restore();
    }
  }
  if (o.wave) {                                        // 👋 a little waving hand
    const a = Math.sin(t * 0.3) * 0.5;
    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();
  }
  ctx.restore();
  if (o.dizzy) for (let i = 0; i < 3; i++) { const a = t * 0.08 + i * 2.1; star(x + Math.cos(a) * 22 * s / 2.6, y - 118 * s / 2.6 + Math.sin(a) * 6, 7, '#ffd54f', a); }
}
// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,

<script>
// ---------- THE TABLETS (cartoon drawings) ----------
const OR = '#7e57c2', OR2 = '#b39ddb', OR3 = '#4527a0', CREAM = '#f3eefc', DARK = '#263238', GOLD = '#ffc94d', SIL = '#c9d1d9', SIL2 = '#eef2f6';
let PRINTING = false;
function sparkle(cx, cy, r, col, rot = 0, lw) {               // a twinkle: 8 rounded rays
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw || Math.max(1.5, r * 0.28); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, q = i % 2 ? 0.7 : 1; ctx.moveTo(cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.25); ctx.lineTo(cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q); }
  ctx.stroke(); ctx.restore();
}
function eyes(cx, cy, s, gap = 12, size = 6, col = DARK) {
  const bl = !PRINTING && frame % 220 < 6 ? 0.15 : 1;
  for (const d of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx + d * gap * s, cy, size * s * 0.8, size * s * bl, 0, 0, 7); ctx.fill(); }
}
function smile(cx, cy, s, w = 7, col = DARK, open = 0) {
  ctx.strokeStyle = col; ctx.lineWidth = 2.4 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, w * s, 0.2, Math.PI - 0.2); ctx.stroke(); ctx.lineCap = 'butt';
  if (open > 0) { ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.ellipse(cx, cy + w * 0.6 * s, w * 0.8 * s, w * 0.7 * open * s, 0, 0, 7); ctx.fill(); }
}
function screenFace(x, y, w, h, s, col = '#fff', open = 0) { eyes(x + w / 2, y + h * 0.42, s, 12, 5, col); smile(x + w / 2, y + h * 0.55, s, 8, col, open); }
function grad(y0, y1, c0, c1) { const g = ctx.createLinearGradient(0, y0, 0, y1); g.addColorStop(0, c0); g.addColorStop(1, c1); return g; }
function line(pts, col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.stroke(); }
// a tablet standing up, centered on (cx, cy). o: { w, h, body, edge, bezel (px), R, scr: [top, bottom], btn (home button), cam, draw(x, y, w, h), stand }
function tab(cx, cy, s, o) {
  const w = (o.w || 100) * s, h = (o.h || 136) * s, x = cx - w / 2, y = cy - h / 2, R = (o.R || 10) * s, bz = (o.bezel || 10) * s;
  if (o.stand !== false) { tri(cx - w * 0.28, y + h + 14 * s, cx + w * 0.28, y + h + 14 * s, cx, y + h - 30 * s, '#9e9e9e'); rr(cx - w * 0.36, y + h + 10 * s, w * 0.72, 8 * s, 4 * s, '#757575'); }
  rr(x - 2 * s, y - 2 * s, w + 4 * s, h + 4 * s, R + 2 * s, o.edge || '#9aa3ad');
  rr(x, y, w, h, R, o.body || '#1b1b1b');
  const sx = x + bz * (o.side || 1), sy = y + bz, sw = w - bz * 2 * (o.side || 1), sh = h - bz * 2;
  rr(sx, sy, sw, sh, (o.sR || 2) * s, Array.isArray(o.scr) ? grad(sy, sy + sh, o.scr[0], o.scr[1]) : (o.scr || '#4fc3f7'));
  if (o.btn) { const bx = o.w > o.h ? x + w - bz / 2 : cx, by = o.w > o.h ? cy : y + h - bz / 2; circle(bx, by, Math.min(bz * 0.34, 6 * s), o.btnCol || '#333'); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(bx, by, Math.min(bz * 0.34, 6 * s), 0, 7); ctx.stroke(); }
  if (o.cam) { const kx = o.w > o.h ? x + bz / 2 : cx, ky = o.w > o.h ? cy : y + bz / 2; circle(kx, ky, 1.8 * s, '#444'); }
  ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
  if (o.draw) o.draw(sx, sy, sw, sh); else screenFace(sx, sy, sw, sh, s);
  if (!o.noShine) { ctx.fillStyle = 'rgba(255,255,255,.13)'; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sw * 0.5, sy); ctx.lineTo(sx + sw * 0.15, sy + sh); ctx.lineTo(sx, sy + sh); ctx.fill(); }
  ctx.restore();
  return { x: sx, y: sy, w: sw, h: sh };
}
// app icons on a home screen
const APP_COLS = ['#ef5350', '#ffa726', '#ffee58', '#66bb6a', '#29b6f6', '#5c6bc0', '#ab47bc', '#ec407a', '#26a69a', '#8d6e63', '#78909c', '#d4e157'];
function homeScreen(x, y, w, h, s, n = 16, cols = 4, upTo = 1) {
  const g = w / cols, ic = g * 0.62;
  for (let i = 0; i < n * upTo; i++) { const c = i % cols, r = Math.floor(i / cols), ix = x + c * g + (g - ic) / 2, iy = y + 8 * s + r * (ic + 7 * s); if (iy + ic > y + h - 4 * s) break; rr(ix, iy, ic, ic, ic * 0.24, APP_COLS[i % APP_COLS.length]); circle(ix + ic / 2, iy + ic / 2, ic * 0.2, 'rgba(255,255,255,.7)'); }
}
// 🎮 BEN'S GAME FACTORY on a screen: the book's purple night look, the open book, and game icons
const SLIDES = [['🤖', 'Robo Jump', '#3949ab', '#0d1b4d'], ['👾', 'Robo Jump 2', '#d500f9', '#12002a'], ['🌌', 'Robo Jump 3', '#2e7d32', '#1a237e'], ['🔮', 'Robo Jump 4', '#4a148c', '#000000'],
  ['🐶', 'Sparks!', '#ffb300', '#e65100'], ['🏎️', 'Turbo Racers', '#e53935', '#8e0000'], ['🥊', 'Brawl Buddies', '#ff7043', '#6a1b9a'], ['🧟', 'Zombie Maze', '#7cb342', '#263238'],
  ['🎵', 'Beat Party', '#7c4dff', '#ff4f6d'], ['💻', 'The MacBook Museum', '#eceff1', '#5c6bc0']];
function gfScreen(x, y, w, h, show = -1, bright = 1) {
  const u = w / 300;                                           // 1 unit = the screen is 300 wide
  const g = ctx.createRadialGradient(x + w / 2, y, 10 * u, x + w / 2, y + h * 0.3, w * 0.75); g.addColorStop(0, '#4a3480'); g.addColorStop(1, '#14102a'); ctx.fillStyle = g; ctx.fillRect(x, y, w, h);
  for (let i = 0; i < 14; i++) circle(x + ((i * 83) % 300) * u, y + ((i * 47) % 60 + 6) * u, (i % 3 ? 0.9 : 1.5) * u, 'rgba(255,255,255,.6)');
  fit("⭐ BEN'S GAME FACTORY ⭐", x + w / 2, y + 22 * u, 17 * u, 280 * u, GOLD);
  // the open book
  const bx = x + 40 * u, by = y + 34 * u, bw = 220 * u, bh = 112 * u;
  rr(bx - 5 * u, by - 4 * u, bw + 10 * u, bh + 8 * u, 7 * u, '#2e7d32');
  rr(bx, by, bw / 2, bh, 4 * u, '#fffaf0'); rr(bx + bw / 2, by, bw / 2, bh, 4 * u, '#fffaf0');
  ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(bx + bw / 2 - 1.5 * u, by, 3 * u, bh);
  const k = show >= 0 ? show % SLIDES.length : 0, sl = SLIDES[k];
  ctx.save(); ctx.beginPath(); ctx.rect(bx + 6 * u, by + 6 * u, bw / 2 - 12 * u, bh * 0.62); ctx.clip();
  rr(bx + 6 * u, by + 6 * u, bw / 2 - 12 * u, bh * 0.62, 8 * u, grad(by, by + bh * 0.62, sl[2], sl[3])); ctx.restore();
  emoji(sl[0], bx + bw / 4, by + bh * 0.47, 34 * u);
  fit(sl[1], bx + bw / 4, by + bh * 0.84, 13 * u, bw / 2 - 14 * u, '#4527a0', 'center', false);
  rr(bx + bw / 2 + 20 * u, by + 14 * u, bw / 2 - 40 * u, 20 * u, 10 * u, sl[2]); text('▶ PLAY', bx + bw * 0.75, by + 28 * u, 11 * u, '#fff', 'center', false);
  for (let j = 0; j < 4; j++) rr(bx + bw / 2 + 14 * u, by + 46 * u + j * 13 * u, (bw / 2 - 28 * u) * (j === 3 ? 0.6 : 1), 5 * u, 2.5 * u, '#d7ccc8');
  // a row of game icons under the book
  const row = SLIDES.slice(0, 7); row.forEach((r, i) => { const ix = x + 26 * u + i * 36 * u, iy = y + 156 * u, on = show >= 0 && i === k % 7;
    rr(ix, iy, 30 * u, 30 * u, 8 * u, grad(iy, iy + 30 * u, r[2], r[3])); if (on) { ctx.strokeStyle = GOLD; ctx.lineWidth = 2.5 * u; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(ix, iy, 30 * u, 30 * u, 8 * u) : ctx.rect(ix, iy, 30 * u, 30 * u); ctx.stroke(); } emoji(r[0], ix + 15 * u, iy + 22 * u, 18 * u); });
  if (bright < 1) { ctx.fillStyle = `rgba(0,0,0,${1 - bright})`; ctx.fillRect(x, y, w, h); }
}

<script>
