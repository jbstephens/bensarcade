<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🤖 Wear-It Robo Gear</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: radial-gradient(circle at 20px 20px, #bfe6ff 3px, transparent 4px) 0 0 / 40px 40px, linear-gradient(160deg, #dff3ff, #e8e2ff);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #fff; -webkit-text-stroke: 3px #1b1b2f;
    text-shadow: 4px 4px 0 #2979ff; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #1b1b2f; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #1b1b2f; color: #222; min-height: 58px; background: #fff; }
  .btn:active, .btn.hit { transform: translateY(4px); box-shadow: 0 1px 0 #1b1b2f; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-spin { background: #ffd54f; font-size: 22px; }
  .b-voice { background: #80d8ff; font-size: 22px; } .b-dance { background: #ff8adf; font-size: 22px; } .b-mis { background: #ffd180; font-size: 22px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🤖 the Robot Builder ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #roboPrev { flex: 1; min-height: 0; background: linear-gradient(#ffffff, #e3f2fd); border: 5px solid #1b1b2f; border-radius: 20px; box-shadow: 0 6px 0 #2979ff;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #roboPrev svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(18px, 2.3vw, 26px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #1b1b2f; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  .panel { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #1b1b2f;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .panel h3 { margin: 0; font-size: 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #eef7ff; border: 4px solid #1b1b2f; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #1b1b2f; }
  .opt svg { width: 84px; height: 84px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #1b1b2f; cursor: pointer; padding: 0; font-size: 20px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #1b1b2f; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #eef7ff; border: 4px solid #1b1b2f; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  #invHelp { font-size: 15px; text-align: center; color: #555; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #1b1b2f; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #2979ff; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #1b1b2f; border-radius: 10px; box-shadow: 0 8px 0 #2979ff; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #1b1b2f; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #1b1b2f; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #1b1b2f; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 🔊 voice box / 🕺 dance / 🎯 missions ---------- */
  #voice, #mission { flex-direction: row; gap: 10px; padding: 10px; background: linear-gradient(160deg, #1d2836, #263a5a); }
  #vLeft, #mLeft { width: 34%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  .stage { flex: 1; min-height: 0; background: radial-gradient(circle at 50% 40%, #3b5b8c, #142033); border: 5px solid #000; border-radius: 20px; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  .stage svg { width: 100%; height: 100%; display: block; }
  .say { font-size: clamp(16px, 2.1vw, 24px); font-weight: bold; text-align: center; background: #000; color: #69f0ae; border: 4px solid #40c4ff; border-radius: 14px; padding: 6px; min-height: 52px;
    font-family: "Courier New", monospace; letter-spacing: 1px; }
  #vRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #vRight .panel { background: #eaf6ff; }
  .snd { font-size: 19px; min-height: 64px; line-height: 1.1; }
  .sGrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .nGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .nGrid .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  .c1 { background: #80d8ff; } .c2 { background: #b388ff; } .c3 { background: #ffe57f; } .c4 { background: #b9f6ca; } .c5 { background: #ff8a80; } .c6 { background: #ffcc80; } .c7 { background: #f8bbd0; }
  .talk g.eyes { animation: blinky .18s steps(2) infinite; }
  @keyframes blinky { 50% { opacity: .35; } }
  #dance { flex-direction: column; align-items: center; justify-content: center; gap: 8px; padding: 10px; background: #12002b; overflow: hidden; }
  #dance .lights { position: absolute; inset: 0; background: conic-gradient(from 0deg, #ff1744, #ffea00, #00e676, #2979ff, #d500f9, #ff1744); opacity: .28; animation: spin 6s linear infinite; }
  #dance.freeze .lights { animation-play-state: paused; opacity: .1; }
  @keyframes spin { to { transform: rotate(360deg) scale(1.6); } }
  #dStage { position: relative; flex: 1; min-height: 0; width: min(92vw, 120vh); display: flex; align-items: center; justify-content: center; }
  #dStage svg { height: 100%; width: auto; max-width: 100%; }
  #dCall { position: relative; font-size: clamp(30px, 6vw, 72px); font-weight: bold; color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #ff3d6e; text-align: center; min-height: 1.2em; }
  #dCall.pop { animation: pop .45s ease-out; }
  #dBar { position: relative; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #dCount { color: #fff; font-size: 22px; font-weight: bold; }
  @keyframes pop { from { transform: scale(.3); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  .bob { animation: bob .5s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .wig { animation: wig .25s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .spn { animation: spn 1.6s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  .hop { animation: hop .4s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  .stiff { animation: none; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-16px) scale(1.03, .97); } }
  @keyframes wig { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes spn { to { transform: rotate(360deg); } }
  @keyframes hop { from { transform: translateY(0); } to { transform: translateY(-40px); } }
  #mRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  #mCard { flex: 1; min-height: 0; background: #fffbe0; border: 6px solid #1b1b2f; border-radius: 24px; box-shadow: 0 8px 0 #ffb300; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; text-align: center; }
  #mIcon { font-size: clamp(50px, 10vh, 100px); line-height: 1; }
  #mText { font-size: clamp(24px, 4vw, 48px); font-weight: bold; }
  #mTimer { width: clamp(90px, 22vh, 190px); height: clamp(90px, 22vh, 190px); }
  #mStats { color: #fff; font-size: 20px; font-weight: bold; text-align: center; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #1b1b2f; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view, #voice, #mission { flex-direction: column; }
    #invLeft, #vLeft, #mLeft { width: 100%; height: 40vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 44px; font-size: 16px; padding: 4px; } .snd { min-height: 48px; font-size: 16px; } #pHelp { font-size: 15px; } .opt svg { width: 56px; height: 56px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🤖 WEAR-IT ROBO GEAR</h1>
    <div id="roboPrev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-voice" id="bVoice">🔊 Voice Box</button>
      <button class="btn b-dance" id="bDance">🕺 Dance Party</button>
      <button class="btn b-mis" id="bMission">🎯 Missions</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts" class="panel"></div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · Space = spin a name · V = voice box · D = dance · Enter = printables</div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Robot Builder</button>
    <h1 class="big">🖨️ PRINT &amp; WEAR</h1>
    <button class="btn b-all" id="bAll">🖨️ Print the whole suit</button>
    <p>Tap a page to open it. Paper + tape only. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my robot)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="voice" class="screen">
  <div id="vLeft">
    <div class="stage" id="vStage"></div>
    <div class="say" id="vSay">VOICE BOX READY</div>
    <button class="btn c3" id="bVoiceKind"></button>
    <button class="btn b-back" id="bVBack">⬅️ Robot Builder</button>
  </div>
  <div id="vRight">
    <div class="panel" id="vPanel"></div>
  </div>
</div>
<div id="dance" class="screen">
  <div class="lights"></div>
  <div id="dCall">🕺 ROBOT DANCE PARTY!</div>
  <div id="dStage"></div>
  <div id="dBar">
    <span id="dCount"></span>
    <button class="btn c4" id="bDFast">⏩ Faster!</button>
    <button class="btn b-back" id="bDStop">⏹️ Stop the party</button>
  </div>
</div>
<div id="mission" class="screen">
  <div id="mLeft">
    <div class="stage" id="mStage"></div>
    <div id="mStats"></div>
    <button class="btn b-back" id="bMBack">⬅️ Robot Builder</button>
  </div>
  <div id="mRight">
    <div id="mCard">
      <div id="mIcon">🎯</div>
      <div id="mText"></div>
      <svg id="mTimer" viewBox="0 0 100 100"></svg>
    </div>
    <div class="three">
      <button class="btn c4" id="bMDone" style="font-size:24px">✅ I DID IT!</button>
      <button class="btn c3" id="bMNew">🎲 New mission</button>
      <button class="btn c1" id="bMTime">⏱️ 60 sec</button>
    </div>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🤖 WEAR-IT ROBO GEAR: pick a robot style, colors and a slot-machine name, then print paper robot gear you can WEAR
// (visor headband + ear pods + antenna, chest control panel on a neck loop, arm bands, power belt, Official Robot ID).
// On screen: a Robot Voice Box soundboard, a Robot Dance Party and household Robot Missions.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch, so 760 units = 7.5 in).
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from the Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];

  $('bMBack').addEventListener('click', backToInventor);
  $('bMDone').addEventListener('click', missionDone);
  $('bMNew').addEventListener('click', newMission);
  $('bMTime').addEventListener('click', cycleMisTime);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
