<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Boss Master Studio</title>
<script>TOUCHPAD = { dpad: true, south: [' ', 'JUMP'] };</script>
<script src="touchpad.js?v=9"></script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #05060f; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  canvas {
    width: min(100vw, calc(100vh * 960 / 520));
    height: auto; display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// ===== boss module group_a.js (inlined) =====
var BOSSES = window.BOSSES || (window.BOSSES = {}); var BOSS_TEST_IDS = window.BOSS_TEST_IDS || (window.BOSS_TEST_IDS = []);
// ===== Group A: King Gloop + Mega Saucer (Robo Jump 1), Warp Saucer + Circuit Saucer (Robo Jump 2),
// GOO-RILLA (Robo Jump 3), NEGA-ROBO MEGA MORPH (Robo Jump 4). Drawing code is copied from each game.
(function () {
  var curT = 0, curA = null;                         // the arena clock (for blinking lights) + arena
  var PX = function (A) { return A.player.x + A.player.w / 2; };
  var PY = function (A) { return A.player.y + A.player.h / 2; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var num = function (v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; };
  // little drawing helpers (same as the games')
  function roundRect(ctx, x, y, w, h, r, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
    ctx.fill();
  }
  function circle(ctx, x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
  function ellipse(ctx, x, y, rx, ry, fill, rot) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, 7); ctx.fill(); }
  function drawStar(ctx, x, y, r, fill, rot) {
    rot = rot || 0; ctx.fillStyle = fill; ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.fill();
  }
  function text(ctx, str, x, y, size, color) {
    ctx.font = 'bold ' + size + 'px "Trebuchet MS", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
    ctx.strokeText(str, x, y); ctx.fillStyle = color || '#fff'; ctx.fillText(str, x, y);
  }
  function bang(ctx, x, y, s) {                       // the big "!" warning bubble (Robo Jump 3/4)
    s = s || 1; var k = s * (1 + Math.sin(curT * 0.4) * 0.12);
    circle(ctx, x, y, 20 * k, curT % 16 < 8 ? '#ff1744' : '#ffea00');
    text(ctx, '!', x, y + 11 * k, 30 * k, '#fff');
  }
  function dizzy(ctx, cx, top) {                      // dizzy stars = "bonk me now!" (Robo Jump 3 tired stars)
    for (var k = 0; k < 3; k++) { var a = curT * 0.08 + k * 2.1; drawStar(ctx, cx + Math.cos(a) * 34, top - 14 + Math.sin(a) * 8, 8, '#ffea00', curT * 0.1); }
  }
  // speed-scaled shot: same path, just faster with super speed
  function shot(A, o) {
    var s = A.speed || 1;
    o.vx = num(o.vx, 0) * s; o.vy = num(o.vy, 0) * s;
    if (o.gravity) o.gravity *= s * s;
    o.life = Math.max(10, Math.round((o.life || 200) / s));
    A.shot(o);
  }
  function fallLife(y, vy, g, floorY) {               // frames until something thrown from y reaches the floor
    var dy = floorY - y;
    if (!g) return vy > 0 ? Math.ceil(dy / vy) : 240;
    return Math.ceil((-vy + Math.sqrt(Math.max(0, vy * vy + 2 * g * dy))) / g);
  }
  // shared tired/attack rhythm: attack for a while, then get TIRED (vuln) for 2+ seconds
  var TIRED = 130, ACTIVE = 290;
  function cooldown(A, base) { return base * Math.max(1, A.count || 1); }
  function hurtFlash(b) { return b.hurt > 0 && Math.floor(curT / 4) % 2; }
  function tick(b, dt) { if (b.hurt > 0) b.hurt = Math.max(0, b.hurt - dt); b.t = (b.t || 0) + dt; }

  // ================= 👑 KING GLOOP (Robo Jump 1: platformer.html drawBoss type 'blob') =================
  function drawGloopBody(ctx, x, y, w, h, look, squash) {   // ported from platformer.html drawBoss(), blob, default look
    var body = '#7c4dff', crownC = '#ffd740', mouthC = '#311b92';
    var cx = x + w / 2, wob = Math.sin(curT * 0.15) * 4 + (squash || 0);
    roundRect(ctx, x - wob / 2, y + wob, w + wob, h - wob, [45, 45, 14, 14], body);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(x + 25, y + 22 + wob, 12, 7, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = crownC;                            // crown
    ctx.beginPath(); ctx.moveTo(cx - 25, y + 6 + wob);
    for (var i = 0; i <= 4; i++) ctx.lineTo(cx - 25 + i * 12.5, y + wob - (i % 2 ? 4 : 22));
    ctx.lineTo(cx + 25, y + 6 + wob); ctx.fill();
    [cx - 18, cx + 18].forEach(function (ex) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, y + 32 + wob, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + look, y + 34 + wob, 5, 0, 7); ctx.fill();
    });
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;       // angry eyebrows
    ctx.beginPath(); ctx.moveTo(cx - 30, y + 16 + wob); ctx.lineTo(cx - 8, y + 24 + wob);
    ctx.moveTo(cx + 30, y + 16 + wob); ctx.lineTo(cx + 8, y + 24 + wob); ctx.stroke();
    ctx.fillStyle = mouthC;
    ctx.beginPath(); ctx.ellipse(cx, y + 58 + wob, 18, 8, 0, 0, 7); ctx.fill();
  }
  function drawRJ1Shot(ctx, o) {                       // platformer.html drawShots() (pink energy ball)
    ctx.fillStyle = 'rgba(255,64,129,.4)'; ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(0, o.r + 4), 0, 7); ctx.fill();
    ctx.fillStyle = '#ff80ab'; ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(0, o.r - 2), 0, 7); ctx.fill();
  }
  function drawRJ1Bomb(ctx, o) {                       // platformer.html drawShots() (saucer bomb with blinking fuse)
    ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(0, o.r), 0, 7); ctx.fill();
    ctx.fillStyle = curT % 10 < 5 ? '#ff1744' : '#ffea00'; ctx.beginPath(); ctx.arc(o.x, o.y - o.r, 4, 0, 7); ctx.fill();
  }
  function gloopGoo(ctx, o) {                          // a purple goo ball King Gloop spits
    circle(ctx, o.x, o.y, o.r, '#7c4dff'); circle(ctx, o.x - o.r * 0.35, o.y - o.r * 0.35, o.r * 0.3, 'rgba(255,255,255,.5)');
  }

  BOSSES.kinggloop = {
    name: 'King Gloop', game: 'Robo Jump', icon: '👑',
    w: 90, h: 80, hp: 3, flying: false,
    init: function (b, A) {
      b.x = num(b.x, A.W - 160); b.y = A.GROUND - this.h / 2; b.vx = 0; b.vy = 0; b.face = -1; b.dir = -1;
      b.mode = 'walk'; b.mt = 0; b.act = 0; b.cd = 70; b.combo = 0; b.ai = 0; b.vuln = false; b.hurt = b.hurt || 0; b.hop = 0;
    },
    update: function (b, A, dt) {
      curA = A; curT = A.t; tick(b, dt);
      var s = A.speed || 1, k = dt * s, w = this.w, h = this.h, gy = A.GROUND - h / 2, px = PX(A);
      b.face = px < b.x ? -1 : 1;
      var onGround = b.y >= gy - 0.5;
      if (b.mode === 'tired') {                        // 😵 dizzy: bonk him!
        b.vx = 0; b.mt -= dt; b.vuln = true;
        if (b.mt <= 0) { b.vuln = false; b.mode = 'walk'; b.act = 0; b.combo = 0; b.cd = cooldown(A, 50); }
      } else {
        b.act += dt;
        if (b.mode === 'walk') {
          b.vx = b.dir * 1.6;
          b.hop += k;
          if (onGround && b.hop > 110) { b.hop = 0; b.vy = -11; }          // his little bounce, like in Robo Jump
          b.cd -= k;
          if (onGround && (b.combo >= 3 || b.act >= ACTIVE)) { b.mode = 'tired'; b.mt = TIRED * (A.easy ? 1.3 : 1); b.vx = 0; A.say && A.say('King Gloop is dizzy! Bonk him!', 'King Gloop'); }
          else if (onGround && b.cd <= 0) {
            b.atk = b.ai % 2 ? 'spit' : 'stomp'; b.ai++; b.mode = 'wind'; b.mt = 45; b.vx = 0;
            A.sfx('goo');
            if (b.atk === 'stomp') {                   // mark where he will SPLAT (warning shows first)
              b.tx = clamp(px, w / 2 + 10, A.W - w / 2 - 10);
              var air = 2 * 13 / 0.6;
              A.hazard({ x: b.tx - 60, y: A.GROUND - 34, w: 120, h: 34, warn: Math.max(45, Math.round((45 + air) / s)), life: 16, color: '#7c4dff', kind: 'gloopSplat',
                draw: function (ctx, o, warning) {
                  if (warning) { ctx.fillStyle = curT % 16 < 8 ? 'rgba(124,77,255,.35)' : 'rgba(255,215,64,.35)'; ctx.beginPath(); ctx.ellipse(o.x + o.w / 2, o.y + o.h, o.w / 2, 10, 0, 0, 7); ctx.fill(); }
                  else { for (var i = 0; i < 5; i++) circle(ctx, o.x + 12 + i * 24, o.y + o.h - 10 - (i % 2) * 12, 12, i % 2 ? '#651fff' : '#7c4dff'); }
                } });
            }
          }
        } else if (b.mode === 'wind') {                // squish down before the attack
          b.vx = 0; b.mt -= k;
          if (b.mt <= 0) {
            if (b.atk === 'stomp') { var airT = 2 * 13 / 0.6; b.vy = -13; b.vx = (b.tx - b.x) / airT; b.mode = 'air'; A.sfx('whoosh'); }
            else {                                     // bossShoot(b, 3) from platformer.html
              var n = (A.count || 1) > 1 ? 2 : 3, cy = b.y, a = Math.atan2(PY(A) - cy, px - b.x);
              for (var i = 0; i < n; i++) { var ang = a + (i - (n - 1) / 2) * 0.35;
                shot(A, { x: b.x, y: cy, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9, color: '#ff80ab', life: 260, kind: 'gloopShot', draw: drawRJ1Shot }); }
              A.sfx('goo'); b.mode = 'walk'; b.combo++; b.cd = cooldown(A, 80);
            }
          }
        }
      }
      // gravity + walls (Robo Jump physics)
      b.vy = Math.min(b.vy + 0.6 * k, 15); b.y += b.vy * k; b.x += b.vx * k;
      if (b.y >= gy) {
        if (b.vy > 3) { A.shake(b.mode === 'air' ? 10 : 4); if (b.mode === 'air') { A.sfx('boom'); A.particles(b.x, A.GROUND, '#7c4dff', 14); b.mode = 'walk'; b.combo++; b.cd = cooldown(A, 80); b.vx = 0; } }
        b.y = gy; b.vy = 0;
        if (b.mode === 'air') { b.mode = 'walk'; b.combo++; b.cd = cooldown(A, 80); }
      }
      if (b.y < h / 2) { b.y = h / 2; b.vy = Math.max(0, b.vy); }
      if (b.x < w / 2 + 10) { b.x = w / 2 + 10; b.dir = 1; }
      if (b.x > A.W - w / 2 - 10) { b.x = A.W - w / 2 - 10; b.dir = -1; }
    },
    draw: function (ctx, b, A) {
      curT = A.t; if (hurtFlash(b)) return;
      var w = this.w, h = this.h, x = b.x - w / 2, y = b.y - h / 2, look = Math.sign(A.player.x - b.x) * 4;
      ctx.save();
      var sq = 0;
      if (b.mode === 'wind') { ctx.translate((curT % 4 < 2 ? -2 : 2), 0); sq = 8; }
      drawGloopBody(ctx, x, y, w, h, look, sq);
      if (b.mode === 'wind') bang(ctx, b.x, y - 40);
      if (b.vuln) dizzy(ctx, b.x, y - 6);
      ctx.restore();
    },
    onBonk: function (b, A) { A.say && A.say('Ow! My crown!', 'King Gloop'); A.sfx('goo'); },
  };

  // ================= 🛸 SAUCERS (Robo Jump 1 Mega Saucer, Robo Jump 2 Warp + Circuit Saucer) =================
  // drawing ported from platformer.html / robojump2.html drawBoss() type 'ufo'; moves = updateBoss() ufo modes
  var UFO_PAL = { warp: ['#7c4dff', '#4527a0', 'rgba(234,128,252,.5)', '#ff80ab'], circuit: ['#ff9100', '#e65100', 'rgba(255,255,141,.5)', '#eceff1'],
                  plain: ['#90a4ae', '#546e7a', 'rgba(125,249,255,.5)', '#76ff03'] };
  function drawSaucer(ctx, b, x, y, w, h, lk, look) {
    var P = UFO_PAL[lk] || UFO_PAL.plain, hull = P[0], belly = P[1], dome = P[2], pilot = P[3], cx = x + w / 2, frame = curT, i, k;
    if (b.mode === 'low') {                            // tractor beam glow
      ctx.fillStyle = lk === 'warp' ? 'rgba(234,128,252,.18)' : 'rgba(125,249,255,.15)';
      ctx.beginPath(); ctx.moveTo(cx - 30, y + h); ctx.lineTo(cx - 60, y + h + 60); ctx.lineTo(cx + 60, y + h + 60); ctx.lineTo(cx + 30, y + h); ctx.fill();
    }
    if (lk === 'warp') {                               // swirly warp rings spin around it
      ctx.strokeStyle = '#ea80fc'; ctx.lineWidth = 3;
      for (k = 0; k < 2; k++) { ctx.beginPath(); ctx.ellipse(cx, y + 34, w / 2 + 14 + k * 10, 10 + k * 4, Math.sin(frame * 0.05 + k) * 0.3, 0, 7); ctx.stroke(); }
    }
    ctx.fillStyle = dome;                              // glass dome
    ctx.beginPath(); ctx.arc(cx, y + 24, 30, Math.PI, 0); ctx.fill();
    if (lk === 'circuit') {                            // a little robot pilot
      ctx.fillStyle = pilot; ctx.fillRect(cx - 12, y + 6, 24, 22);
      ctx.fillStyle = '#263238'; ctx.fillRect(cx - 9, y + 11, 18, 9);
      ctx.fillStyle = '#ff1744'; ctx.fillRect(cx - 6 + look / 2, y + 13, 4, 4); ctx.fillRect(cx + 2 + look / 2, y + 13, 4, 4);
      ctx.fillStyle = '#ffea00'; ctx.fillRect(cx - 1, y - 2, 2, 8);
    } else {
      ctx.fillStyle = pilot;                           // alien pilot
      ctx.beginPath(); ctx.arc(cx, y + 18, 13, 0, 7); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(cx - 5 + look / 2, y + 16, 3, 5, 0, 0, 7); ctx.ellipse(cx + 5 + look / 2, y + 16, 3, 5, 0, 0, 7); ctx.fill();
      if (lk === 'warp') { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx + 9, y + 6, 4, 0, 7); ctx.fill(); }   // antenna ball
    }
    ctx.fillStyle = hull;                              // saucer
    ctx.beginPath(); ctx.ellipse(cx, y + 34, w / 2, 18, 0, 0, 7); ctx.fill();
    ctx.fillStyle = belly;
    ctx.beginPath(); ctx.ellipse(cx, y + 40, w / 2 - 10, 9, 0, 0, Math.PI); ctx.fill();
    if (lk === 'warp') {                               // a spinning portal swirl underneath
      ctx.strokeStyle = '#ea80fc'; ctx.lineWidth = 3; ctx.beginPath();
      for (var a = 0; a < 12; a += 0.3) ctx.lineTo(cx + Math.cos(a + frame * 0.15) * a * 1.6, y + 44 + Math.sin(a + frame * 0.15) * a * 0.5);
      ctx.stroke();
    }
    if (lk === 'circuit') {                            // circuit-board lines on the hull
      ctx.strokeStyle = '#ffe0b2'; ctx.lineWidth = 2; ctx.beginPath();
      [-1, 1].forEach(function (s) { ctx.moveTo(cx + s * 12, y + 30); ctx.lineTo(cx + s * 30, y + 30); ctx.lineTo(cx + s * 38, y + 38); ctx.lineTo(cx + s * 52, y + 38); });
      ctx.stroke();
    }
    for (i = 0; i < 6; i++) {
      var on = (Math.floor(frame / 8) + i) % 3 === 0;
      ctx.fillStyle = lk === 'circuit' ? (on ? '#76ff03' : '#1b5e20') : lk === 'warp' ? (on ? '#fff' : '#ea80fc') : (on ? '#ffea00' : '#ff4081');
      ctx.beginPath(); ctx.arc(x + 15 + i * 20, y + 34, 4, 0, 7); ctx.fill();
    }
  }

  function makeSaucer(id, name, game, lk, hp, glitch) {
    BOSSES[id] = {
      name: name, game: game, icon: '🛸', w: 130, h: 56, hp: hp, flying: true,
      init: function (b, A) {
        b.x = num(b.x, A.W - 200); b.y = 100 + this.h / 2; b.vx = 0; b.vy = 0; b.face = -1; b.dir = -1;
        b.mode = 'fly'; b.mt = 0; b.cd = 60; b.ai = 0; b.dropT = 0; b.tp = 0; b.blink = 0; b.vuln = false; b.hurt = b.hurt || 0;
      },
      update: function (b, A, dt) {
        curA = A; curT = A.t; tick(b, dt);
        var s = A.speed || 1, k = dt * s, w = this.w, h = this.h, px = PX(A), lowY = A.GROUND - 50 - h / 2, topY = 100 + h / 2;
        b.face = px < b.x ? -1 : 1;
        b.vuln = b.mode === 'low';
        if (glitch && (b.mode === 'fly' || b.mode === 'up')) {     // 👾 glitchy: blink, then TELEPORT (robojump2.html)
          if (b.blink > 0) {
            b.blink -= k;
            if (b.blink <= 0) {
              b.blink = 0; A.particles(b.x, b.y, '#ff00ff', 18);
              var nx = b.x, tries = 0;
              do { nx = 40 + w / 2 + A.rand() * (A.W - 80 - w); } while (Math.abs(nx - px) < 220 && ++tries < 20);
              b.x = nx; A.sfx('glitch'); A.particles(b.x, b.y, '#00e5ff', 18);
            }
          } else if ((b.tp += k) > 300) { b.tp = 0; b.blink = 45; A.sfx('zap'); }
        }
        if (b.mode === 'fly') {
          b.mt += dt;
          b.x += b.dir * 2.5 * k;
          if (b.x - w / 2 < 20 || b.x + w / 2 > A.W - 20) { b.dir = -b.dir; b.x = clamp(b.x, 20 + w / 2, A.W - 20 - w / 2); }
          b.y = topY + Math.sin(b.t * 0.05) * 15;
          if (b.dropT > 0) {                           // hatch is blinking: here it comes!
            b.dropT -= k;
            if (b.dropT <= 0) {
              b.dropT = 0;
              if (b.atk === 'zap') {                   // bossShoot(b, 3): three pink zaps at Robo
                var n = (A.count || 1) > 1 ? 2 : 3, a = Math.atan2(PY(A) - b.y, px - b.x);
                for (var i = 0; i < n; i++) { var ang = a + (i - (n - 1) / 2) * 0.35;
                  shot(A, { x: b.x, y: b.y + 10, vx: Math.cos(ang) * 4, vy: Math.sin(ang) * 4, r: 9, color: '#ff80ab', life: 260, kind: 'saucerZap', draw: drawRJ1Shot }); }
                A.sfx('laser');
              } else {                                 // a bomb with a blinking fuse
                var by = b.y + h / 2;
                shot(A, { x: b.x, y: by, vx: 0, vy: 1, r: 10, gravity: 0.25, color: '#263238', life: fallLife(by, 1, 0.25, A.GROUND - 10), kind: 'saucerBomb', draw: drawRJ1Bomb });
                A.sfx('whoosh');
              }
              b.cd = cooldown(A, b.atk === 'zap' ? 80 : 55);
            }
          } else if ((b.cd -= k) <= 0 && b.mt < 165) { b.atk = b.ai % 3 === 2 ? 'zap' : 'bomb'; b.ai++; b.dropT = 45; }
          if (b.mt > 190 && b.dropT <= 0 && b.blink <= 0) { b.mode = 'down'; b.mt = 0; }
        } else if (b.mode === 'down') {
          b.y += 3 * k;
          if (b.y >= lowY) { b.y = lowY; b.mode = 'low'; b.mt = TIRED * (A.easy ? 1.3 : 1) + 30; A.say && A.say(name + ' is low! Bonk it!', name); }
        } else if (b.mode === 'low') {                 // low + tired: jump on its dome!
          b.vuln = true; b.mt -= dt;
          b.x += Math.sign(px - b.x) * 0.8 * k;
          b.y = lowY + Math.sin(b.t * 0.1) * 4;
          if (b.mt <= 0) { b.mode = 'up'; b.vuln = false; }
        } else {
          b.y -= 3 * k;
          if (b.y <= topY) { b.y = topY; b.mode = 'fly'; b.mt = 0; b.cd = cooldown(A, 40); }
        }
        b.x = clamp(b.x, w / 2, A.W - w / 2); b.y = clamp(b.y, h / 2, A.GROUND - h / 2);
      },
      draw: function (ctx, b, A) {
        curT = A.t; if (hurtFlash(b)) return;
        if (b.blink > 0 && curT % 4 < 2) return;
        var w = this.w, h = this.h, x = b.x - w / 2, y = b.y - h / 2, look = Math.sign(A.player.x - b.x) * 4;
        ctx.save();
        if (b.blink > 0) ctx.translate(((curT * 37) % 14) - 7, 0);
        drawSaucer(ctx, b, x, y, w, h, lk, look);
        if (b.dropT > 0) { circle(ctx, b.x, y + h - 4, 7 + Math.sin(curT * 0.6) * 3, curT % 10 < 5 ? '#ff1744' : '#ffea00'); bang(ctx, b.x, y - 34); }
        if (b.vuln) dizzy(ctx, b.x, y - 6);
        ctx.restore();
      },
      onBonk: function (b, A) { b.mode = 'up'; b.vuln = false; A.sfx('clank'); },
    };
  }
  makeSaucer('megasaucer', 'Mega Saucer', 'Robo Jump', 'plain', 4, false);
  makeSaucer('warpsaucer', 'Warp Saucer', 'Robo Jump 2', 'warp', 5, true);
  makeSaucer('circuitsaucer', 'Circuit Saucer', 'Robo Jump 2', 'circuit', 6, true);

  // ================= 🦍 GOO-RILLA (Robo Jump 3: robojump3.html drawBoss kind 'gorilla', attacks pound/arc/charge) =================

const PZ_PHANTOM = { head: '#e0fffa', body: '#ccfff4', visor: '#003b36', eye: '#64ffda', legs: '#1de9b6', pod: '#e040fb' };
function drawRoboAt(cx, by, s, pal, o = {}) {              // Robo's Robo Jump 8 body, any size: cx = middle, by = feet
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = by - h, f = o.face || 1;
  ctx.save(); if (o.alpha) ctx.globalAlpha = o.alpha;
  if (o.rocket) { const bx = f > 0 ? x - 10 * s : x + w - 4 * s; roundRect(bx, y + h * 0.35, 14 * s, h * 0.55, 6 * s, '#ff3d00'); ctx.fillStyle = '#ffd740'; ctx.fillRect(bx + 2 * s, y + h * 0.5, 10 * s, 4 * s);
    ctx.fillStyle = '#ffab00'; ctx.beginPath(); ctx.moveTo(bx + 2 * s, y + h * 0.9); ctx.lineTo(bx + 7 * s, y + h * 0.9 + 14 * s); ctx.lineTo(bx + 12 * s, y + h * 0.9); ctx.fill(); }
  ctx.fillStyle = pal.legs; ctx.fillRect(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s); ctx.fillRect(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s);
  roundRect(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal.body);
  circle(x + w / 2, y + h * 0.7, 3 * s, pal.pod);
  roundRect(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod);
  roundRect(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal.pod);
  if (o.mega) {                                            // 🦾 Mega Robo's gold armor
    roundRect(x - 9 * s, y + h * 0.47, 12 * s, 11 * s, 4 * s, '#ffab00'); roundRect(x + w - 3 * s, y + h * 0.47, 12 * s, 11 * s, 4 * s, '#ffab00');
    starShape(x + w / 2, y + h * 0.7, 5 * s, '#fff59d');
  }
  roundRect(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal.head);
  roundRect(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal.visor);
  const ex = x + w / 2 + f * 3 * s, ey = y + h * 0.27;
  ctx.fillStyle = pal.eye; ctx.beginPath(); ctx.ellipse(ex - 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.ellipse(ex + 6 * s, ey, 3.5 * s, 5 * s, 0, 0, 7); ctx.fill();
  if (o.mega) { ctx.fillStyle = '#ffc400'; ctx.beginPath(); ctx.moveTo(x + 4 * s, y + 1 * s); ctx.lineTo(x + 8 * s, y - 8 * s); ctx.lineTo(x + 15 * s, y - 2 * s); ctx.lineTo(x + 22 * s, y - 8 * s); ctx.lineTo(x + 26 * s, y + 1 * s); ctx.fill(); }

  ctx.restore();
}
function drawPhantomRobo(cx, by, s) {                      // 👻 see-through, with a teal + purple glow (like Robo Jump 5)
  for (let k = 3; k >= 1; k--) { ctx.fillStyle = k % 2 ? 'rgba(29,233,182,.16)' : 'rgba(224,64,251,.16)'; ctx.beginPath(); ctx.ellipse(cx, by - 20 * s, 18 * s + k * 7 * s, 24 * s + k * 7 * s, 0, 0, 7); ctx.fill(); }

function drawRetroRobo(cx, by, s) {                        // 📜 Retro Camo: old-timey and pixel-y

  document.body.appendChild(printBox);
  printBack = state; state = 'printing';
}
function closePrint() {
  if (printBox) { printBox.remove(); printBox = null; }
  if (state === 'printing') state = printBack || 'prizes';
}
function updatePrinting() { if (press.esc) closePrint(); }

// ---------- 🔥 THE 6 HARD CHALLENGES (Ben picked all of them!) — open after you beat UNLIMITED BOOK NOVA ----------
THEMES.ice = { sky: ['#01579b', '#b3e5fc'], crowd: '#0d2b45', floor: '#b3e5fc', stripe: '#ffffff', beams: ['#ffffff', '#80d8ff'] };
THEMES.dark = { sky: ['#000000', '#1a1a2e'], crowd: '#05050a', floor: '#111', stripe: '#333', beams: ['#222', '#333'] };
const RUSH_FACES = ['kinggloop', 'chaosnova', 'musicalrobo', 'chaosrobo'];
const HARD = [
  { id: 'h_chaos', icon: '🌀', name: 'Chaos Robo Showdown', hard: true, ben: true, rounds: [['chaosrobo']], th: 'nova', song: 'booknova',
    tip: 'Ben\'s Secret Robo #41! When he gets MAD, EVERYTHING goes rainbow!' },
  { id: 'h_rush', icon: '🏃', name: 'BOSS RUSH', hard: true, rush: true, refill: 2, rounds: ROSTER.map(id => [id]).concat(BOSSES.chaosrobo ? [['chaosrobo']] : []), th: 'villain', song: 'ladder',
    tip: 'EVERY boss, one after another! Only 2 hearts back between bosses.' },
  { id: 'h_dark', icon: '🌑', name: 'Lights Out', hard: true, dark: true, rounds: [['kinggloop', 'glitchrobo', 'laserheart']], th: 'dark', song: 'battle',
    tip: 'You can only see a little circle around Robo!' },
  { id: 'h_clock', icon: '⏱️', name: 'Beat the Clock', hard: true, timer: 100, rounds: [['goorilla', 'timerobo', 'lockrobo']], th: 'clock', song: 'battle',
    tip: 'Bonk all 3 bosses before the clock hits zero!' },
  { id: 'h_ice', icon: '🧊', name: 'Slippery Stage', hard: true, ice: true, rounds: [['g_ice', 'g_water', 'megasaucer', 'mirrorrobo']], th: 'ice', song: 'battle',
    tip: 'Icy floor! Robo slides everywhere!' },
  { id: 'h_nohover', icon: '🚫', name: 'No Hover', hard: true, nohover: true, rounds: [['musicalrobo', 'kingelement']], th: 'royal', song: 'battle',
    tip: 'No jet-boot hovering. Jumps only!' },
];
for (const ch of HARD) ch.rounds = ch.rounds.map(r => r.filter(id => BOSSES[id])).filter(r => r.length);
const hardOpen = () => !!save.beaten.booknova;
const atKey = ch => ch.ladder ? 'ladderAt' : ch.rush ? 'rushAt' : null;      // 💾 long challenges remember which boss you reached
const isChain = ch => !!(ch.ladder || ch.rush);
function keepBeaten() {                                    // trying again: the bosses you already bonked stay bonked
  if (fight.bosses.length > 1) { const hp = {}; for (const F of fight.bosses) hp[F.k] = F.gone ? 0 : Math.max(0, F.b.hp); fight.keep = { round: fight.round, hp }; }
}
function hardRoundStart() {                                // (called from startRound)
  fight.timeLeft = fight.ch.timer ? fight.ch.timer * 60 : null; fight.timeUp = false; fight.chaosFx = false;
}
function hardUpdate() {                                    // (called from updateFight)
  if (fight.timeLeft != null && state === 'fight') {
    fight.timeLeft--;
    if (fight.timeLeft % 60 === 0 && fight.timeLeft > 0 && fight.timeLeft <= 600) sfx.click();
    if (fight.timeLeft <= 0) { keepBeaten(); fight.timeUp = true; state = 'lose'; fight.loseT = 0; sfx.ouch(); }
  }
  fight.chaosFx = fight.bosses.some(F => F.id === 'chaosrobo' && !F.gone && F.b.mad);
}
function drawDark() {                                      // 🌑 Lights Out: darkness everywhere except a circle around Robo
  const p = player, cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  const g = ctx.createRadialGradient(cx, cy, 70, cx, cy, 165); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.96)');
  ctx.fillStyle = g; ctx.fillRect(-20, -20, W + 40, H + 40);
  ctx.globalAlpha = 0.85; for (const s of fight.shots) drawShot(s); ctx.globalAlpha = 1;   // you can still see the danger glowing
  for (const z of fight.hazards) if (z.age >= z.warn || frame % 10 < 5) { ctx.globalAlpha = 0.3; ctx.fillStyle = z.color || '#ff1744'; ctx.fillRect(z.x, z.y, z.w, z.h); ctx.globalAlpha = 1; }
  for (const F of fight.bosses) if (!F.gone) {               // the bosses' glowing eyes in the dark
    const bx = F.b.x, by = F.b.y - num(F.b.h, F.def.h) * 0.2;
    if (isVuln(F)) text('⭐ DIZZY!', bx, F.b.y - num(F.b.h, F.def.h) / 2 - 10, 18, '#ffd740');
    else if (frame % 160 > 8) { circle(bx - 9, by, 4, '#ff1744'); circle(bx + 9, by, 4, '#ff1744'); }
  }
}
function drawHardHUD() {
  if (fight.timeLeft != null) { const s = Math.max(0, Math.ceil(fight.timeLeft / 60)); roundRect(W / 2 - 70, H - 46, 140, 38, 12, 'rgba(0,0,0,.6)'); text('⏱️ ' + s, W / 2, H - 18, 26, s <= 10 ? (frame % 20 < 10 ? '#ff5252' : '#fff') : '#fff'); }
  if (fight.ch.nohover) text('🚫 NO HOVER', W - 90, H - 44, 16, '#ff8a80');
  if (fight.ch.ice) text('🧊 SLIPPERY!', W - 90, H - 44, 16, '#b3e5fc');
}
let chaosFilterOn = false;
function updateChaosFilter() {                             // 🌈 the whole screen goes rainbow while Chaos Robo is MAD
  const on = !!(fight && fight.chaosFx && (state === 'fight' || state === 'pause' || state === 'intro'));
  if (on) C.style.filter = `hue-rotate(${(frame * 5) % 360}deg) saturate(1.5)`;
  else if (chaosFilterOn) C.style.filter = '';
  chaosFilterOn = on;
}
function checkHardTrophy() { if (HARD.every(c => save.beaten[c.id])) trophy('bossHard'); }

// ---------- main update + draw ----------
function update() {
  if (shakeAmt > 0) shakeAmt *= 0.88;
  if (stickerNew > 0) stickerNew--;
  if (state === 'title') updateTitle();
  else if (state === 'menu') updateMenu();
  else if (state === 'confirm') updateConfirm();
  else if (state === 'mix') updateMix();
  else if (state === 'name') updateName();
  else if (state === 'intro') updateIntro();
  else if (state === 'fight') {
    if (press.esc || inBox(tap, PAUSE_BTN)) { state = 'pause'; sfx.click(); }
    else updateFight();
  }
  else if (state === 'pause') updatePause();
  else if (state === 'between') updateBetween();
  else if (state === 'lose') updateLose();
  else if (state === 'win') updateWin();
  else if (state === 'prizes') updatePrizes();
  else if (state === 'parade') updateParade();
  else if (state === 'musicbox') updateMusicBox();
  else if (state === 'printing') updatePrinting();
  clearPress();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  if (state === 'title') drawTitle();
  else if (state === 'menu') drawMenu();
  else if (state === 'confirm') drawConfirm();
  else if (state === 'mix') drawMix();
  else if (state === 'name') drawName();
  else if (state === 'intro') drawIntro();
  else if (state === 'fight') drawFightScene();
  else if (state === 'pause') drawPause();
  else if (state === 'between') drawBetween();
  else if (state === 'lose') drawLose();
  else if (state === 'win') drawWin();
  else if (state === 'prizes' || state === 'printing') drawPrizes();
  else if (state === 'parade') drawParade();
  else if (state === 'musicbox') drawMusicBox();
  updateChaosFilter();
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
