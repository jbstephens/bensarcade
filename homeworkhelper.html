<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📚 Homework Helper Machine</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e6f7ff 0 36px, #fff4d6 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-pull { background: #ff8a80; font-size: 26px; } .b-spin { background: #ffd54f; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- 🏭 the machine screen ---------- */
  #home { flex-direction: row; gap: 10px; padding: 10px; }
  #homeL { width: 46%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #machBox { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #29b6f6;
    display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
  #machBox svg { width: 100%; height: 100%; display: block; }
  #machName { font-size: clamp(18px, 2.4vw, 28px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  #homeR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  #cats .btn { font-size: 16px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  #opts p { margin: 0; text-align: center; font-size: 17px; }
  .optRow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { font: inherit; font-size: 18px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px 10px; cursor: pointer; color: #222; box-shadow: 0 4px 0 #333; min-height: 54px; }
  .chip.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .chip.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .chip svg { width: 60px; height: 60px; display: block; margin: 0 auto; pointer-events: none; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(17px, 2vw, 24px); min-height: 32px; display: block; }
  .slot .btn { min-height: 46px; font-size: 18px; }
  .subj { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .subj .chip { font-size: 18px; padding: 6px 2px; }
  .meter { height: 26px; background: #eee; border: 4px solid #333; border-radius: 14px; overflow: hidden; position: relative; }
  .meter i { position: absolute; left: 0; top: 0; bottom: 0; background: linear-gradient(90deg, #ff4fa3, #ffd600, #69f0ae, #29b6f6); transition: width .5s; }
  .meter span { position: absolute; inset: 0; text-align: center; font-size: 15px; font-weight: bold; line-height: 18px; }
  .lvls { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; font-size: 16px; font-weight: bold; }
  .lvls div { background: #e8f5e9; border: 3px solid #333; border-radius: 12px; padding: 4px; }
  #homeBtns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  #homeBtns2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #homeBtns2 .btn { min-height: 48px; font-size: 18px; }
  #help { font-size: 15px; text-align: center; color: #555; }
  /* machine moves (only on screen) */
  #machBox .blink, #qBot .blink { animation: blink 1.1s steps(2, jump-none) infinite; }
  #machBox .gear, #qBot .gear { animation: spin 6s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #machBox .gear.ccw { animation-direction: reverse; }
  #machBox .lever { transition: transform .35s; transform-box: view-box; }
  #machBox .strip { transition: transform .8s; }
  #machBox.whir .gear { animation-duration: .7s; }
  #machBox.whir .blink { animation-duration: .25s; }
  #machBox.whir .shake { animation: shake .12s infinite; }
  #machBox.whir .lever { transform: rotate(78deg); }
  #machBox.printed .strip { transform: translateY(64px) !important; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shake { 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
  /* ---------- ❓ the practice round ---------- */
  #quiz { flex-direction: column; gap: 8px; padding: 8px 10px; }
  #qTop { display: flex; gap: 10px; align-items: center; }
  #qTop .meter { flex: 1; }
  #qNum, #qStars, #qClock { font-size: clamp(16px, 2.2vw, 24px); font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 4px 10px; white-space: nowrap; }
  #qMain { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #qBot { width: 22%; min-width: 120px; display: flex; flex-direction: column; gap: 6px; align-items: stretch; }
  #qBotArt { flex: 1; min-height: 0; background: #fff; border: 4px solid #333; border-radius: 18px; display: flex; align-items: center; justify-content: center; }
  #qBotArt svg { width: 100%; height: 100%; }
  #qSay { background: #fff; border: 4px solid #333; border-radius: 18px; padding: 6px 8px; font-size: clamp(15px, 1.8vw, 20px); font-weight: bold; text-align: center; min-height: 64px; }
  #qCard { flex: 1; min-width: 0; background: #fff; border: 5px solid #333; border-radius: 22px; box-shadow: 0 6px 0 #ffb300; padding: 10px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  #qTag { align-self: center; font-size: 17px; font-weight: bold; background: #e3f2fd; border: 3px solid #333; border-radius: 12px; padding: 2px 12px; }
  #qText { font-size: clamp(22px, 3.2vw, 38px); font-weight: bold; text-align: center; line-height: 1.25; }
  #qText .w { display: inline-block; padding: 0 4px; border-radius: 10px; }
  #qText .w.hl { background: #fff59d; }
  #qText .read { font-size: clamp(19px, 2.6vw, 30px); background: #e3f2fd; border: 3px solid #333; border-radius: 16px; padding: 6px 12px; margin-bottom: 8px; font-weight: bold; }
  #qPic { display: flex; justify-content: center; min-height: 0; }
  #qPic svg { height: clamp(110px, 26vh, 230px); max-width: 100%; }
  #qAns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .ans { font: inherit; font-size: clamp(24px, 3.4vw, 40px); font-weight: bold; min-width: 110px; min-height: 70px; background: #fff6d6; border: 5px solid #333; border-radius: 18px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; padding: 4px 16px; }
  .ans.kbd { outline: 5px dashed #1e6bff; outline-offset: 3px; }
  .ans.no { background: #e0e0e0; color: #999; animation: shake .4s; }
  .ans.yes { background: #b9f6ca; border-color: #2e7d32; }
  #tileSlots { display: flex; gap: 8px; justify-content: center; width: 100%; }
  .tslot { width: clamp(46px, 6vw, 66px); height: clamp(56px, 7.5vw, 78px); border: 4px dashed #333; border-radius: 12px; background: #fffde7; font-size: clamp(28px, 4vw, 44px); font-weight: bold; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .tslot.full { border-style: solid; background: #ffe082; }
  .tslot.good { background: #b9f6ca; }
  #tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; width: 100%; }
  .tile { font: inherit; width: clamp(52px, 6.5vw, 72px); height: clamp(56px, 7vw, 76px); font-size: clamp(28px, 4vw, 42px); font-weight: bold; background: #82b1ff; border: 4px solid #333; border-radius: 14px; box-shadow: 0 5px 0 #333; cursor: pointer; color: #111; }
  .tile.used { visibility: hidden; }
  .tile.kbd { outline: 5px dashed #ff3d6e; outline-offset: 3px; }
  #qBtns { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  #qBtns .btn { min-height: 52px; font-size: 18px; padding: 4px; }
  #how { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.45); display: none; align-items: center; justify-content: center; padding: 14px; }
  #how.on { display: flex; }
  #howBox { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 12px 16px; width: min(760px, 96vw); max-height: 94vh; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; text-align: center; }
  #howBox h2 { margin: 0; font-size: 28px; }
  #howPic svg { width: 100%; max-height: 44vh; }
  #howTxt { font-size: clamp(19px, 2.5vw, 26px); font-weight: bold; }
  #done { position: fixed; inset: 0; z-index: 45; background: rgba(20,30,60,.55); display: none; align-items: center; justify-content: center; padding: 14px; }
  #done.on { display: flex; }
  #doneBox { background: #fff; border: 6px solid #333; border-radius: 26px; padding: 12px 18px; width: min(820px, 96vw); max-height: 96vh; overflow-y: auto; display: flex; gap: 14px; align-items: center; }
  #doneStrip { width: 200px; flex: none; background: #fffef5; border: 3px dashed #999; border-radius: 6px; padding: 10px 8px; font-family: "Courier New", monospace; font-size: 16px; font-weight: bold; text-align: center; animation: print 1.4s ease-out both; }
  @keyframes print { from { transform: translateY(-60%) scaleY(.2); opacity: 0; } to { transform: none; opacity: 1; } }
  #doneR { flex: 1; display: flex; flex-direction: column; gap: 10px; text-align: center; }
  #doneR h2 { margin: 0; font-size: clamp(26px, 3.6vw, 40px); }
  #doneTxt { font-size: 21px; font-weight: bold; }
</style>
<style>
  /* ---------- gallery + sheet (same as the Toy Inventor) ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #29b6f6; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #29b6f6; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #home, #view { flex-direction: column; }
    #homeL { width: 100%; height: 40vh; }
    #qMain { flex-direction: column; } #qBot { width: 100%; flex-direction: row; height: 90px; } #qBotArt { flex: none; width: 90px; } #qSay { flex: 1; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #doneBox { flex-direction: column; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .ans { min-height: 56px; } #qBtns .btn { min-height: 44px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.25in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 8in; height: 10in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
    #paper svg[data-tall], #printAll svg[data-tall] { height: 10.45in; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="homeL">
    <div id="machBox"></div>
    <div id="machName"></div>
  </div>
  <div id="homeR">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="homeBtns">
      <button class="btn b-pull" id="bPull">🕹️ PULL THE LEVER!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
    <div id="homeBtns2">
      <button class="btn b-spin" id="bSpeed">⚡ Speed round: OFF</button>
      <button class="btn b-back" id="bMusic">🎵 Music: ON</button>
    </div>
    <div id="help">Arrows pick · Space = pull the lever · Enter = printables · M = music</div>
  </div>
</div>
<div id="quiz" class="screen">
  <div id="qTop">
    <div id="qNum"></div>
    <div class="meter" id="qMeter"><i></i><span></span></div>
    <div id="qClock" class="hide"></div>
    <div id="qStars"></div>
  </div>
  <div id="qMain">
    <div id="qBot"><div id="qBotArt"></div><div id="qSay"></div></div>
    <div id="qCard">
      <div id="qTag"></div>
      <div id="qPic"></div>
      <div id="qText"></div>
      <div id="tileSlots"></div>
      <div id="qAns"></div>
      <div id="tiles"></div>
    </div>
  </div>
  <div id="qBtns">
    <button class="btn b-back" id="bHear">🔊 Hear it</button>
    <button class="btn b-spin" id="bHint">💡 Hint</button>
    <button class="btn b-all" id="bHow">👀 Show me how</button>
    <button class="btn b-clear" id="bUndo">⌫ Take back</button>
    <button class="btn b-back" id="bStop">🏠 Stop</button>
  </div>
</div>
<div id="how"><div id="howBox"><h2>👀 Show me how!</h2><div id="howPic"></div><div id="howTxt"></div>
  <button class="btn b-print" id="bGotIt">👍 Got it!</button></div></div>
<div id="done"><div id="doneBox"><div id="doneStrip"></div><div id="doneR"><h2 id="doneH"></h2><div id="doneTxt"></div>
  <div class="meter" id="dMeter"><i></i><span></span></div>
  <div class="two"><button class="btn b-pull" id="bAgain">🕹️ Again!</button><button class="btn b-back" id="bHome">🏭 Machine</button></div>
  <button class="btn b-print" id="bDonePrint">🖨️ Print practice sheets</button></div></div></div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Machine</button>
    <button class="btn b-spin" id="bNew">🎲 New problems</button>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Pick a page! The problems match your levels. The Answer Key matches the pages.</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 📚 HOMEWORK HELPER MACHINE (Ben's idea!): design your own practice machine, pull the lever, and it gives
// a short, fun practice round (math, spelling, reading) that gets harder when you're right and easier when
// you're not. It also prints worksheets, a fold-up mini-book, a fold-up paper machine, printer strips,
// an answer key and a certificate. It never does homework FOR you: it makes practice fun so homework gets easy.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (100 units = 1 printed inch).
// Drawing engine + characters copied from the Toy Inventor / Chips Bag.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);

    for (let k = 1; k < 5; k++) o += LC('M' + n(fx + k * cell) + ' ' + n(oy) + ' L' + n(fx + k * cell) + ' ' + n(oy + 2 * cell), '#999', 1.2);
    o += LC('M' + n(fx) + ' ' + n(oy + cell) + ' L' + n(fx + 5 * cell) + ' ' + n(oy + cell), '#999', 1.2); }

}
