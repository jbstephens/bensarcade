// ---------- shared helpers for the 11 newest scenes ----------
const NEWKIT = `
// bright wiggly underwater light lines ("caustics"), 0..1
float caus(vec2 p, float t){
  p=mod(p*6.2832,6.2832)-250.; vec2 i=p; float c=1.;
  for(int n=0;n<4;n++){ float tt=t*(1.-3.5/float(n+1)); i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/.005), p.y/(cos(i.y+tt)/.005))); }
  c/=4.; c=1.17-pow(c,1.4); return clamp(pow(abs(c),8.),0.,1.);
}
float sat(float x){ return clamp(x,0.,1.); }
float ell(vec2 p, vec2 c, vec2 r){ return length((p-c)/r)-1.; }                   // ellipse (scaled, < 0 inside)
float smin(float a, float b, float k){ float h=sat(.5+.5*(b-a)/k); return mix(b,a,h)-k*h*(1.-h); }
// a soft billowy puff (steam / clouds): 0..1 density
float puff(vec2 p, float t, float seed){ return fbm4(p*3.+vec2(seed, -t*.15))*1.25-.25; }
// a simple camera: returns a ray direction for a screen point
vec3 camRay(vec2 uv, vec3 fw, float F){ vec3 r=normalize(cross(vec3(0,1,0),fw)); vec3 u=cross(fw,r); return normalize(fw*F+r*uv.x+u*uv.y); }
// sea creatures seen in their own flat "body" coordinates (x = forward). each returns a distance (< 0 inside)
float tseg(vec2 p, vec2 a, vec2 b, float r0, float r1){ vec2 pa=p-a, ba=b-a; float h=sat(dot(pa,ba)/dot(ba,ba)); return length(pa-ba*h)-mix(r0,r1,h); }
float sharkD(vec2 q, float t){
  q.y+=.07*sin(q.x*2.4-t*2.)*(1.-q.x)*.5;                                           // the body swishes
  float w=q.x>0.?.17*sqrt(sat(1.-q.x*q.x*q.x*q.x)):.17*(1.+q.x*.88);
  float b=max(abs(q.y)-w, abs(q.x)-1.)*.8;
  vec2 a=vec2(q.x,abs(q.y));
  float pec=tseg(a, vec2(.22,.10), vec2(-.06,.40), .07, .008);
  float pel=tseg(a, vec2(-.40,.06), vec2(-.52,.15), .03, .006);
  float tl=tseg(q, vec2(-.9,0.), vec2(-1.28,.04*sin(t*2.)), .03, .008);
  return min(min(b,pec),min(tl,pel));
}
float rayD(vec2 q, float t){
  vec2 a=vec2(q.x, abs(q.y)/(1.+.10*sin(t*1.3)));                                   // the wings slowly flap
  float lead=a.x-(.45-.62*pow(a.y,1.6));                                            // swept, curved leading edge
  float trail=-(a.x-(-.38+.30*a.y-.25*a.y*a.y));                                    // concave trailing edge
  float d=max(max(lead,trail)*.7, a.y-1.15);
  d=min(d, tseg(a, vec2(.40,.10), vec2(.58,.11), .035, .02));                       // the two head fins
  float tail=segD(q, vec2(-.35,0.), vec2(-1.3,.05*sin(t*1.7)))-.008;
  return min(d,tail);
}
float turtleD(vec2 q, float t){
  float fl=sin(t*1.6);
  float sh=ell(q, vec2(0.), vec2(.55,.42));
  float hd=ell(q, vec2(.66,0.), vec2(.17,.12));
  vec2 a=vec2(q.x, abs(q.y));
  vec2 f1=rot(-.6-.45*fl)*(a-vec2(.25,.32)); float ff=ell(f1, vec2(-.05,.28), vec2(.10,.34));
  vec2 f2=rot(.4+.25*fl)*(a-vec2(-.38,.28)); float fb=ell(f2, vec2(-.05,.08), vec2(.09,.16));
  return min(min(sh,hd),min(ff,fb));
}
// a little fish: body + tail (x forward)
float fishD(vec2 q, float t){
  q.y+=.08*sin(q.x*3.-t*9.)*(1.-q.x);
  float b=ell(q, vec2(0.), vec2(1.,.38));
  float tl=max(abs(q.y)-(-.95-q.x)*.9-.05, max(q.x+.85, -q.x-1.45));
  return min(b,tl);
}
`;

// ---------- 56. 🦈 AQUARIUM TUNNEL: riding a moving walkway through a glass tunnel, sharks, rays and a turtle overhead ----------
const AQUA = `
const vec3 TC=vec3(0.,.8,0.); const float TR=2.4;     // tunnel centre line (height) and radius, in metres
vec3 seaCol(vec3 d, float t){
  float up=d.y;
  vec3 c=mix(vec3(.003,.03,.07), vec3(.015,.17,.32), smoothstep(-.25,.35,up));
  c=mix(c, vec3(.08,.45,.62), smoothstep(.3,.95,up));
  if(up>.2){ vec2 s=d.xz/d.y*8.;                                                   // the bright rippling surface far above
    float w=caus(s*.07+vec2(0.,t*.02), t*.35), sn=fbm4(s*.25+t*.08);
    c+=vec3(.30,.70,.80)*smoothstep(.2,.95,up)*(.15+.7*w+.35*sn); }
  float az=atan(d.x,d.z);                                                           // sun shafts: straight down, so they line up toward the zenith
  float sh=pow(noise(vec2(az*22.+t*.04, t*.07)),4.)*1.8+pow(noise(vec2(az*53.-t*.06, t*.05+3.)),5.)*1.2;
  c+=vec3(.20,.55,.65)*sh*smoothstep(.0,.7,up)*.28*(.6+.4*fbm4(vec2(az*4.,up*3.-t*.1)));
  return c;
}
vec3 creature(vec3 col, vec3 ro, vec3 d, float t, float px, float kind, vec3 P, vec2 dir, float S){
  if(d.y<=.01) return col;
  float th=(P.y-ro.y)/d.y; vec3 H=ro+d*th;
  vec2 l=H.xz-P.xz; vec2 q=vec2(dot(l,dir), dot(l,vec2(-dir.y,dir.x)))/S;
  if(dot(q,q)>4.) return col;
  float tt=t+P.x*3.;
  float dd=kind<.5?sharkD(q,tt):kind<1.5?rayD(q,tt):turtleD(q,tt);
  float fp=th*px*1.3/max(d.y,.25)/S;
  float cv=cover(dd,fp);
  if(cv<=0.) return col;
  vec3 c;
  if(kind<.5){ c=mix(vec3(.22,.27,.31), vec3(.66,.70,.72), smoothstep(-.01,-.09,dd)*smoothstep(.2,.05,abs(q.y))); c*=.6+.4*smoothstep(.6,-.5,q.x); }   // pale belly, darker fins
  else if(kind<1.5){ c=mix(vec3(.16,.19,.22), vec3(.78,.80,.80), smoothstep(-.02,-.25,dd)*smoothstep(.75,.2,abs(q.y)));    // manta: white belly, dark wing edges
    c*=1.-.35*smoothstep(.55,.65,noise(q*7.))*smoothstep(-.1,-.3,dd); }
  else { float sc=noise(q*14.); c=mix(vec3(.09,.10,.06), vec3(.36,.33,.20), smoothstep(-.05,-.2,dd)*(.6+.4*sc));            // turtle: yellowish plastron
    if(ell(q,vec2(0.),vec2(.55,.42))>0.) c=vec3(.20,.22,.16)*(.7+.5*sc); }
  c*=vec3(.55,.80,.95)*.8;                                                          // lit by blue water light from below
  c+=vec3(.25,.60,.70)*.35*smoothstep(-.06,0.,dd);                                  // soft bright rim where the surface light wraps around
  float fog=1.-exp(-th*.045);
  return mix(col, mix(c, seaCol(d,t), fog), cv);
}
float reefH(vec2 xz){ float side=smoothstep(2.8,7.,abs(xz.x));
  return .12+.05*noise(xz*2.)+side*(fbm4(xz*.16+3.)*5.2-1.3+.5*noise(xz*.9)+.18*noise(xz*3.7)); }
vec3 aquaOutside(vec3 ro, vec3 d, float t, float px, float t0){
  vec3 col=seaCol(d,t);
  float tt=t0; vec3 S=ro; float hit=0.;
  for(int i=0;i<44;i++){ S=ro+d*tt; float h=S.y-reefH(S.xz); if(h<0.){ hit=1.; break; } tt+=max(h*.55,.06)+tt*.012; if(tt>60.) break; }
  if(hit>.5){                                                                       // sandy floor and rocky reef walls outside the tunnel
    vec2 e=vec2(.1,0.);
    vec3 n=normalize(vec3(reefH(S.xz-e.xy)-reefH(S.xz+e.xy), 2.*e.x, reefH(S.xz-e.yx)-reefH(S.xz+e.yx)));
    float rock=smoothstep(.3,.6,S.y);
    float k=fbm4(S.xz*1.3+S.y*.8);
    vec3 sand=mix(vec3(.50,.52,.46), vec3(.62,.62,.54), noise(S.xz*4.));
    vec3 rc=mix(vec3(.10,.10,.09), vec3(.32,.29,.24), k)*(.45+.8*noise(S.xz*6.+S.y*3.));
    float cor=smoothstep(.66,.72,noise(S.xz*3.1+S.y*1.7))*sat(rock);
    vec3 cc=mix(mix(vec3(.9,.25,.35), vec3(1.,.55,.15), noise(S.xz*1.3)), vec3(.55,.30,.85), step(.6,noise(S.xz*.7+9.)));
    rc=mix(rc, cc*(.6+.6*noise(S.xz*40.)), cor);  // pink and orange corals on the rocks
    vec3 g=mix(sand, rc, sat(rock));
    float lit=(.12+.9*sat(n.y)*(.35+1.3*caus(S.xz*.22, t*.5)))*(.55+.45*sat(n.y+.3));
    g*=lit*vec3(.45,.78,.92);
    col=mix(g, col, 1.-exp(-tt*.065));
  }
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 ro=vec3(.25+.12*sin(t*.07), 1.65, t*.45);                                  // riding the moving walkway
  vec3 fw=normalize(vec3(.10*sin(t*.045)-.04, .30+.04*sin(t*.06), 1.));
  vec3 d=camRay(uv, fw, 1.0);
  // where does this ray hit the glass tube or the floor?
  vec2 o=ro.xy-TC.xy; float a=dot(d.xy,d.xy), b=dot(o,d.xy), c=dot(o,o)-TR*TR;
  float tg=(-b+sqrt(max(b*b-a*c,0.)))/max(a,1e-4);
  float tf=d.y<0.?-ro.y/d.y:1e9;
  vec3 col;
  if(tf<tg){                                                                        // the walkway floor
    vec3 p=ro+d*tf;
    float walk=step(abs(p.x),.9);
    float groove=.6+.4*smoothstep(.0,.3,abs(fract(p.x*14.)-.5)*2.);
    vec3 fc=mix(vec3(.025,.035,.05), vec3(.05,.06,.07)*groove, walk);
    fc+=vec3(.15,.45,.55)*caus(p.xz*.22, t*.5)*.35*(1.-walk*.4);                     // dancing light from the water above
    fc+=seaCol(reflect(d,vec3(0,1,0)),t)*.12*walk*(.5+.5*groove);                    // glossy walkway reflections
    fc+=vec3(.1,.55,.9)*.25*smoothstep(.06,0.,abs(abs(p.x)-2.15));                   // little blue lights along the edge
    col=mix(fc, vec3(.01,.06,.11), 1.-exp(-tf*.035));
  } else {
    vec3 p=ro+d*tg;
    col=aquaOutside(ro,d,t,px,tg);
    // fish school far above, then (far to near) a shark, a turtle, another shark and a manta ray
    if(d.y>.05){ float th=(9.-ro.y)/d.y; vec2 Hs=(ro+d*th).xz+vec2(t*.9,0.);
      vec2 ci=floor(Hs/.9), cf=fract(Hs/.9)-.5; float r=h21(ci);
      if(r<.45 && fbm4(ci*.08+t*.01)>.48){ vec2 fq=(cf-(h22(ci)-.5)*.4)/.12; float fd=fishD(fq,t+r*9.);
        float fog=1.-exp(-th*.07); col=mix(col, mix(vec3(.30,.45,.50)*(.7+.6*step(.85,fract(r*31.+t*.3))), seaCol(d,t), fog), cover(fd,th*px*12./max(d.y,.3))*.9); } }
    float zs=ro.z;
    col=creature(col,ro,d,t,px,0., vec3(3.+sin(t*.05)*2.,7.5, zs+26.-mod(t*.9,34.)), normalize(vec2(-.12,-1.)), 3.2);
    col=creature(col,ro,d,t,px,2., vec3(mod(t*.32,18.)-9.,5.6, zs+7.5), normalize(vec2(1.,.2)), 1.1);
    col=creature(col,ro,d,t,px,0., vec3(-1.2+sin(t*.1)*1.2,4.1, zs-6.+mod(t*.8+12.,24.)), normalize(vec2(.15*cos(t*.1),1.)), 2.5);
    col=creature(col,ro,d,t,px,1., vec3(1.+sin(t*.06)*1.5,3.9, zs+18.-mod(t*.6+9.,24.)), normalize(vec2(.3*sin(t*.08),-1.)), 1.6);
    col=creature(col,ro,d,t,px,0., vec3(-4.+mod(t*.5+6.,16.)*.3,6.2, zs+14.-mod(t*.75+20.,28.)), normalize(vec2(.25,-1.)), 2.2);
    col*=vec3(.88,.96,1.);                                                          // the thick acrylic tints things a little
    // the tunnel's steel ribs and the dark base wall
    float ribD=abs(fract(p.z/4.+.5)-.5)*4.;
    float ang=abs(atan(p.y-TC.y,p.x));
    float aa=tg*px*2.5/max(abs(d.z)*.0+.35,.35);
    float rib=cover(ribD-.06, aa);
    vec3 ribC=vec3(.03,.05,.07)+vec3(.12,.35,.45)*.25*smoothstep(.0,.1,ribD)*smoothstep(1.2,1.57,ang);
    col=mix(col, mix(ribC, vec3(.01,.06,.11), 1.-exp(-tg*.035)), rib);
    if(p.y<.45){ vec3 bc=vec3(.02,.028,.04); bc+=vec3(.1,.5,.9)*exp(-length(vec2(fract(p.z)-.5,p.y-.3)*vec2(1.,3.))*25.)*.9;
      col=mix(bc, vec3(.01,.06,.11), 1.-exp(-tg*.035)); }
  }
  // bubbles drifting up past the glass
  for(int i=0;i<10;i++){ float fi=float(i); float sp=.05+.05*h11(fi);
    vec2 bp=vec2((h11(fi*3.1)-.5)*1.5+.02*sin(t*1.5+fi*4.), fract(t*sp+h11(fi*7.))*1.3-.65);
    float br=(.003+.006*h11(fi*5.3)); float bd=length(uv-bp);
    col+=vec3(.5,.8,.9)*(smoothstep(br,br-px*1.2,bd)*smoothstep(br*.3,br,bd)*.6+exp(-length(uv-bp-vec2(-.3,.3)*br)/(px*.9))*.6); }
  gl_FragColor=vec4(finish(col*1.2,uv),1.);
}
`;

const PENGUIN = `
const float HY=.0;
vec3 aurora(vec2 uv, float t){

vec4 penguin(vec2 p, vec2 at, float sz, float face, float t, float px){

  c+=vec3(.10,.45,.25)*.12*smoothstep(-.03,.0,body)*smoothstep(.3,.6,q.y);           // a soft green rim from the aurora

<script>
// @@BENCATS@@ ---------- 🐾 BEN'S CATS (84-89): Marble (calico, purple eyes), Guppy (gray tabby, yellow eyes),
// Beans (brown-tabby Maine Coon, green eyes), and Mr. Whiskers popping up in every scene (💡 Ben's twist!) ----------
// BENKIT draws one front-facing cat with real-looking fur. Set the g* values, then call bcDraw.
// coat: 0 Marble, 1 Guppy, 2 Beans, 3 Mr. Whiskers.  pose: 0 sitting, 1 lying (loaf), 2 peeking (head + paws)
const BENKIT = `
int gCoat, gPose, gMode;            // gMode: 0 everything, 1 no paws, 2 only the paws
float gLid, gTilt, gBR, gTW, gEW, gPup, gPaw, gBell; vec2 gLook; vec3 gEye, gL, gLC, gAMB;
float bcFl(){ return gCoat==2?1.8:(gCoat==3?1.5:1.); }                       // how fluffy
vec2 bcHC(){ return gPose==0?vec2(0.,.70):(gPose==1?vec2(0.,.34):vec2(0.,.22)); }
vec2 bcHead(vec2 q){ return rot(-gTilt)*(q-bcHC()); }
float bcHeadD(vec2 h){
  float mc=gCoat==2?1.:0.;
  float d=ellS(h,vec2(0.,.02),vec2(.175,.15),0.);
  d=smin(d, ellS(h,vec2(0.,-.05),vec2(.205+.035*mc+.015*float(gCoat==3),.105+.025*mc),0.), .07);   // fluffy cheeks (Beans has a big ruff)
  d=smin(d, ellS(h,vec2(0.,-.085),vec2(.075,.05),0.), .03);                                          // the muzzle
  return d;
}
vec2 bcEarB(float s){ return vec2(.115*s,.085); }
float bcEarA(float s){ return s<0.?1.95+gEW*.15:1.19; }
float bcEarD(vec2 h, out float inner){
  float mc=gCoat==2?1.:0.; float eh=.18+.045*mc, ew=.08+.012*mc;
  float d=1e5; inner=1e5;
  for(int k=0;k<2;k++){ float s=k==0?-1.:1.; float a=bcEarA(s); vec2 b=bcEarB(s), dir=vec2(cos(a),sin(a));
    d=min(d, earS(h,b,a,ew,eh)); inner=min(inner, earS(h,b+dir*.025,a,ew*.6,eh*.75));
    if(mc>.5){ vec2 tp=b+dir*eh; d=min(d, segD(h,tp-dir*.03,tp+vec2(cos(a-s*.1),sin(a-s*.1))*.04)-.005); } }   // Maine Coon lynx tufts
  return d;
}
float bcBodyD(vec2 q){
  float d;
  if(gPose==0){ vec2 p=vec2(q.x/(1.+.015*gBR), q.y);
    d=ellS(p,vec2(0.,.25),vec2(.235,.25),0.);
    d=smin(d, ellS(p,vec2(0.,.47),vec2(.15+.02*float(gCoat==2),.17),0.), .08);                   // chest
    d=smin(d, ellS(p,vec2(-.16,.11),vec2(.12,.11),.3), .05);                                     // haunches
    d=smin(d, ellS(p,vec2(.16,.11),vec2(.12,.11),-.3), .05);
  } else if(gPose==1){
    d=ellS(q,vec2(0.,.22),vec2(.37,.14+.006*gBR),0.);                                            // the back and hips, going away from us
    d=smin(d, ellS(q,vec2(0.,.15),vec2(.25,.16+.006*gBR),0.), .12);                             // chest and shoulders
  } else d=ellS(q,vec2(0.,-.04),vec2(.17,.21),0.);                                              // neck + shoulders (hidden behind things)
  return d+.004*(fbm3(q*16.)-.5);
}
float bcLegD(vec2 q){
  if(gPose==0){ float d=1e5;
    for(int k=0;k<2;k++){ float s=k==0?-1.:1.; float up=s>0.?gPaw:0.;
      vec2 ft=mix(vec2(.072*s,.06), vec2(.2,.36), up), pw=mix(vec2(.078*s,.035), vec2(.22,.40), up);
      d=min(d, smin(segD(q,vec2(.068*s,.36),ft)-.043, ellS(q,pw,vec2(.058,.036),up*.6), .03)); }
    return d; }
  if(gPose==1) return min(ellS(q,vec2(-.11,.025),vec2(.062,.03),0.), ellS(q,vec2(.11,.025),vec2(.062,.03),0.));
  return min(ellS(q,vec2(-.13,.05),vec2(.068,.042),0.), ellS(q,vec2(.13,.05),vec2(.068,.042),0.));   // paws hooked over an edge
}
float bcTailD(vec2 q, out float s){
  s=0.; if(gPose==2) return 1e5;
  float th=gCoat==2?.075:(gCoat==3?.06:.045);
  vec2 P0=gPose==0?vec2(.24,.15):vec2(.34,.07), P1=gPose==0?vec2(.25,.02):vec2(.27,.01), P2=gPose==0?vec2(.05,-.005):vec2(.08,-.012),
       P3=gPose==0?vec2(-.17+.03*gTW,.03+.05*gTW):vec2(-.14+.03*gTW,.0+.035*gTW);
  float best=1e5;
  for(int k=0;k<3;k++){ vec2 a=k==0?P0:(k==1?P1:P2), b=k==0?P1:(k==1?P2:P3);
    vec2 pa=q-a, ba=b-a; float hh=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); float d=length(pa-ba*hh);
    if(d<best){ best=d; s=(float(k)+hh)/3.; } }
  return best-th*(1.-.6*s*s);
}
float bcRegD(int r, vec2 q){ float s; if(r==0) return bcBodyD(q); if(r==1) return bcLegD(q); if(r==2) return bcTailD(q,s); return bcHeadD(bcHead(q)); }

const BENKIT2 = `
// the fur colour at a spot. reg: 0 body, 1 legs + paws, 2 tail, 3 head, 4 ears. ts = how far along the tail
vec3 bcCoat(vec2 q, vec2 h, int reg, float hair, float ts){

  float wMz=reg==3?smoothstep(.02,-.015,ellS(h,vec2(0.,-.095),vec2(.1,.065),0.)+nz*.03):0.;
  vec3 c;
  if(gCoat==0){   // 🐾 Marble the calico: lots of white, with big orange and black patches
    vec3 W=vec3(.86,.84,.80), O=vec3(.80,.40,.12), K=vec3(.03,.026,.024);
    float blaze=reg==3?smoothstep(.015,-.01,abs(h.x)-.025-max(-h.y,0.)*.9+nz*.02)*step(h.y,.13):0.;
    float pO, pK;
    if(reg>=3){ float side=smoothstep(-.012,.012,h.x+.03*nz); pK=1.-side; pO=side;              // one side of the face black, one side orange
      float wide=smoothstep(-.02,.05,h.y+.06*nz); pO*=wide; pK*=wide; }
    else { pO=smoothstep(.40,.47,fbm4(q*2.2+vec2(1.7,4.1))+.18*smoothstep(-.08,-.3,q.x)); pK=smoothstep(.43,.50,fbm4(q*2.5+vec2(8.3,2.2))+.15*smoothstep(.08,.3,q.x))*(1.-pO); }
    if(reg==2){ pO=smoothstep(.4,.6,sin(ts*9.+1.)*.5+.5); pK=1.-pO; }

    float w=clamp(max(max(max(wChest,wPaw),max(wMz,blaze)),wLow),0.,1.);

  } else {   // tabbies: Guppy (gray) and Beans (brown Maine Coon)

    vec3 A=gr?vec3(.30,.31,.34):vec3(.27,.17,.085), B=gr?vec3(.58,.59,.61):vec3(.55,.42,.26), S=gr?vec3(.05,.052,.06):vec3(.035,.022,.012),
         W=gr?vec3(.82,.83,.85):vec3(.84,.78,.68);
    float str=0.;
    if(reg==0) str=smoothstep(.35,.75, sin(q.y*36.+q.x*q.x*40.+3.*fbm4(q*5.))*.5+.5+(fbm4(q*18.)-.5)*.7)*smoothstep(.03,.13,abs(q.x));
    if(reg==1) str=smoothstep(.45,.8, sin(q.y*58.+2.*noise(q*12.))*.5+.5)*smoothstep(.13,.2,q.y)*.45;
    if(reg==2) str=max(smoothstep(.35,.7, sin(ts*24.)*.5+.5), smoothstep(.85,.97,ts));
    if(reg==3){ float fs=smoothstep(.3,.8, sin(h.x*85.+2.5*noise(h*14.))*.5+.5)*smoothstep(.03,.09,h.y)*smoothstep(.11,.04,abs(h.x));   // the forehead "M"
      float cs=smoothstep(.55,.9, sin((h.y-abs(h.x)*.35)*95.)*.5+.5)*smoothstep(.11,.16,abs(h.x))*smoothstep(.04,-.02,h.y)*smoothstep(-.12,-.06,h.y);
      float ln=smoothstep(.012,.004,abs(h.y-.0-(abs(h.x)-.115)*.5))*smoothstep(.11,.13,abs(h.x))*smoothstep(.2,.15,abs(h.x));   // dark line from the eye corner

float bcLum(vec3 c){ return dot(c,vec3(.3,.59,.11)); }

// Mr. Whiskers pops up every 9 seconds: 0 = hidden ... 1 = all the way up (slow, gentle, no jump)

<script>

const BC_RAIN = `
vec3 bwh(float p){ vec3 q=fract(vec3(p)*vec3(.1031,.11369,.13787)); q+=dot(q,q.yzx+19.19); return fract(vec3((q.x+q.y)*q.z,(q.x+q.z)*q.y,(q.y+q.z)*q.x)); }
float bwSaw(float b, float x){ return smoothstep(0.,b,x)*smoothstep(1.,b,x); }
vec2 bwSlide(vec2 uv, float t){                      // drops that cling, then slide down, leaving a trail of beads
  vec2 U=uv; vec2 asp=vec2(6.,1.), grid=asp*2.;
  uv.y+=t*.70; float colX=floor(uv.x*grid.x); uv.y+=h11(colX*7.13);
  vec2 id=floor(uv*grid); vec3 n=bwh(id.x*35.2+id.y*2376.1);
  vec2 st=fract(uv*grid)-vec2(.5,0.);
  float x=n.x-.5; float wy=U.y*20.; x+=sin(wy+sin(wy))*(.5-abs(x))*(n.z-.5); x*=.7;
  float ti=fract(t*.9+n.z); float y=(bwSaw(.85,ti)-.5)*.9+.5;
  float d=length((st-vec2(x,y))*asp.yx); float drop=smoothstep(.40,.0,d);
  float r=sqrt(smoothstep(1.,y,st.y)); float cd=abs(st.x-x); float behind=smoothstep(-.02,.02,st.y-y);

float bwStill(vec2 uv, float t){ uv*=26.; vec2 id=floor(uv); uv=fract(uv)-.5; vec3 n=bwh(id.x*107.45+id.y*3543.65);
  float d=length(uv-(n.xy-.5)*.7); return smoothstep(.3,.0,d)*step(.55,fract(n.z*10.))*fract(n.z*10.)*bwSaw(.025,fract(t*.12+n.z)); }
vec2 bwDrops(vec2 uv, float t){ float s=bwStill(uv,t); vec2 a=bwSlide(uv,t), b=bwSlide(uv*1.85+3.1,t*.92);
  return vec2(smoothstep(.3,1.,s+a.x+b.x*.85), max(a.y,b.y*.8)); }

// ---------- 102. 🦦 KELP FOREST: half above, half below the water: a sea otter floating on its back holding a shell, and a golden kelp forest with sunbeams and fish below ----------

const float HZK=.31;   // the far horizon above the water

vec3 kSky(vec2 p){

    kc+=vec3(.3,.35,.15)*caus(p*1.5, t*.4)*up*.25;                  // wiggly sunlight on the blades

}
float fishK(vec2 q, float t){ q.y+=.10*sin(q.x*3.-t*8.)*(1.-q.x)*.3; float b=ell(q, vec2(0.), vec2(1.,.42));

// the sea otter, floating on its back (x = along its body, y up), in screen units around its middle
float otter(vec2 q, float px, out vec3 c){

// ---------- 103. 🏮 LANTERN LAKE: hundreds of warm paper lanterns drifting up into the night sky over a still lake that mirrors them ----------
const WD_LANT = `
const float WLL=-.10;    // the lake's far shore (the mirror line)
vec3 lSky(vec2 p){
  float y=p.y-WLL;

  c+=vec3(.35,.16,.06)*.18*exp(-y*7.);                               // the warm glow of all the lanterns on the haze

}
float lHill(float x){ return WLL+.012+.06*smoothstep(.1,.9,fbm3(vec2(x*1.6,4.)))+.012*fbm3(vec2(x*12.,1.))+.004*noise(vec2(x*120.,2.)); }
// one layer of rising lanterns. k = 0 (far, tiny, many) .. 4 (close, big, few). returns light; sets coverage m and body colour c
vec3 lanterns(vec2 p, float k, float t, float px, inout float m, inout vec3 c){
  float cell=.035+.045*k*k*.5+.02*k;

  float fl=.85+.15*sin(t*7.+on*90.)*sin(t*3.3+on*20.);              // the little flame flickers

  float w=.55+.12*d.y;

  body=max(body, length(d*vec2(.9,.6))-1.05);

  float hot=exp(-length(d-vec2(0.,-.75))*1.6);

  lc+=vec3(1.,.85,.6)*exp(-length((d-vec2(0.,-.70))*vec2(3.,2.))*3.)*1.6*fl;   // the flame itself
  lc*=mix(.55,1.,step(.04,abs(fract(d.y*2.2+.5)-.5)));            // the thin paper ribs

// everything above the water (also used, mirrored, for the reflection)
vec3 lScene(vec2 p, float t, float px){

  // the far lanterns go behind the hills, the near ones in front
