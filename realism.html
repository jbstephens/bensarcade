// ---------- 20. MILKY WAY CAMP: the Milky Way over a glowing tent, pine trees, shooting stars ----------
const CAMP = `
const vec2 LAMP=vec2(.06,-.335);
vec3 skyM(vec2 uv, float t, float px){
  vec2 p=rot(t*.002)*(uv-vec2(0.,-.6))+vec2(0.,-.6);                                   // the sky turns very slowly
  vec3 c=mix(vec3(.035,.05,.07), vec3(.004,.007,.02), smoothstep(-.15,.45,uv.y));
  c+=vec3(.05,.10,.06)*exp(-(uv.y+.12)*12.)*.6;                                        // faint green airglow
  // the Milky Way: a glowing band with dark dusty lanes and a bright core
  vec2 dir=normalize(vec2(.75,1.)); vec2 o=vec2(-.62,-.22); float along=dot(p-o,dir), across=dot(p-o,vec2(-dir.y,dir.x))+.06*sin(along*2.);
  float w=.11+.05*along;
  float band=exp(-pow(across/w,2.));
  float n=fbm(p*5.), n2=fbm(p*14.+3.);
  float core=exp(-pow((along-.18)/.3,2.))*exp(-pow(across/.13,2.));
  float dust=smoothstep(.45,.75,fbm(vec2(along*6., across*18.)+n))*exp(-pow((across+.01*sin(along*9.))/(w*.35),2.));
  vec3 mw=mix(vec3(.45,.50,.65), vec3(.95,.75,.50), core)*band*(.25+.6*n*n2)*(1.+2.*core);
  mw+=vec3(.6,.25,.3)*pow(n2,4.)*band*.6;                                                 // pinkish glowing clouds
  mw*=1.-.85*dust;
  c+=mw*.8*smoothstep(-.2,.0,uv.y);
  c+=starfield(p, px, .85)*(1.+.7*band)*smoothstep(-.18,.0,uv.y);
  c+=starLayer(p, 4.*px, .5, px, 77., .3)*band*.6*(1.-dust);                           // tiny stars packed in the band
  // shooting star
  float P=11.; float k=floor(t/P); float lt=t-k*P;
  if(lt<1.2){ vec2 a=vec2(h11(k)*1.2-.5, .3+h11(k+3.)*.15); vec2 d=normalize(vec2(h11(k+5.)>.5?1.:-1.,-.5));
    vec2 head=a+d*lt*.6, tail=head-d*.2*smoothstep(0.,.4,lt);
    float sd=segD(uv,tail,head); float hh=clamp(dot(uv-tail,head-tail)/dot(head-tail,head-tail),0.,1.);
    c+=vec3(.85,.92,1.)*exp(-sd/px*.9)*hh*hh*smoothstep(0.,.15,lt)*smoothstep(1.2,.8,lt)*1.6; }
  return c;
}
// pine trees: pointy and layered, a dark row along the horizon
float pines(vec2 uv, float base, float sc, float seed){
  float x=uv.x/sc+seed, ci=floor(x), lx=fract(x)-.5;
  float h=base+sc*(.9+1.1*h11(ci+seed))*step(.15,h11(ci*2.+seed));
  float y=(uv.y-base)/(h-base+1e-4);
  float wv=(1.-y)*.42*(.75+.25*abs(sin(y*16.+ci)));
  float tree=step(abs(lx-(h11(ci+7.)-.5)*.3),wv)*step(0.,y)*step(y,1.);
  return max(tree, step(uv.y, base+.01*sc*noise(vec2(x*8.,seed))));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyM(uv,t,px);
  float fl=.9+.06*sin(t*7.)+.04*sin(t*13.1);                                          // the lantern flickers gently
  // two rows of pine trees
  if(pines(uv,-.15,.07,3.)>0.) col=vec3(.012,.016,.022);
  if(pines(uv,-.21,.11,9.)>0.) col=vec3(.006,.008,.01);
  // the meadow
  if(uv.y<-.22+.01*noise(vec2(uv.x*6.,1.))){
    float g=noise(vec2(uv.x*240., uv.y*50.));
    col=vec3(.012,.018,.01)*(.6+.8*g);
    float ld=length((uv-LAMP)*vec2(1.,2.6));
    col+=vec3(1.,.5,.18)*(.6+.4*g)*.35*exp(-ld*8.)*fl;                                // warm light spilling on the grass
  }
  // the tent: a glowing triangle, brighter where the lantern is inside
  vec2 tq=uv-vec2(.30,-.36); float TW=.17, TH=.19;
  float inside=step(0.,tq.y)*step(abs(tq.x), TW*(1.-tq.y/TH));
  if(inside>0.){
    float side=tq.x/TW;
    vec3 fab=vec3(1.25,.45,.12)*(.25+.75*exp(-length(tq-vec2(.0,.03))*10.))*fl;
    fab*=.75+.25*smoothstep(-1.,0.,side)*(side<0.?1.:.6);
    fab*=1.-.25*smoothstep(.02,.0,abs(fract(tq.y/.045)-.5)*.045);                        // seams
    float door=step(abs(tq.x), .055*(1.-tq.y/.13))*step(tq.y,.13);
    fab=mix(fab, vec3(1.8,1.,.45)*fl*(1.-.4*tq.y/.13), door*.85);
    if(abs(tq.x)<.003 && tq.y<.13) fab*=.4;
    col=fab;
  }
  if(abs(tq.y)<.006 && abs(tq.x)<TW*1.05) col=mix(col, vec3(.02), .8);
  // guy ropes
  float rope=min(segD(uv, vec2(.30,-.36)+vec2(0.,TH), vec2(.62,-.40)), segD(uv, vec2(.30,-.36)+vec2(0.,TH), vec2(-.02,-.40)));
  col=mix(col, vec3(.25,.18,.12)*fl, smoothstep(px*1.2,0.,rope)*.6);
  // the lantern on the ground outside
  vec2 lq=uv-LAMP;
  if(abs(lq.x)<.011 && lq.y>-.016 && lq.y<.014) col=vec3(1.8,1.1,.5)*fl*(abs(lq.x)<.008?1.:.3);
  if(abs(lq.x)<.013 && abs(lq.y-.017)<.004) col=vec3(.08,.06,.05);
  col+=vec3(1.,.55,.2)*(.08*exp(-length(lq)*18.)+.5*exp(-length(lq)*90.))*fl;
  gl_FragColor=vec4(finish(col*1.1,uv),1.);
}
`;

<script>
// ---------- 21. SATURN: the ringed planet, its shadow on the rings, and little moons ----------
const SATURN = `
const float R=.23, B=.47;                     // planet size, how much we see the rings from above
// how much stuff is in the rings at a distance r (in planet radii): C, B, Cassini gap, A ring, Encke gap
float ringD(float r){
  float d=smoothstep(1.23,1.26,r)*smoothstep(2.28,2.26,r);
  float c=mix(.22,.35,smoothstep(1.23,1.52,r));
  float b=smoothstep(1.52,1.56,r)*smoothstep(1.96,1.94,r)*(.75+.25*smoothstep(1.6,1.9,r));
  float a=smoothstep(2.02,2.04,r)*(.62-.12*smoothstep(2.1,2.27,r))*(1.-.9*smoothstep(.006,.0,abs(r-2.215)));
  float o=max(c*step(r,1.53),max(b,a));
  o*=.8+.35*noise(vec2(r*420.,.5))+.15*noise(vec2(r*90.,1.5));
  return clamp(o*d,0.,1.);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=starfield(uv+vec2(t*.0006,0.), px, .55)+vec3(.003,.004,.008);
  vec3 L=normalize(vec3(-.75,.35,.55));
  vec3 N=vec3(0., cos(B), sin(B));                                                    // the rings' "up" direction
  vec2 q=rot(.32)*(uv-vec2(.06,.02));
  float r2=dot(q,q);
  // the rings, where the line of sight crosses their plane
  float zr=-q.y*N.y/N.z; vec3 P=vec3(q,zr); float rr=length(P)/R;
  float rd=ringD(rr);
  float ld=dot(P,L); float sh=(ld<0. && length(P-L*ld)<R)?1.:0.;                      // Saturn's shadow on the rings
  vec3 rc=mix(vec3(.55,.50,.44), vec3(1.,.95,.86), smoothstep(1.5,1.7,rr)*step(rr,1.97)+.8*step(2.,rr))*(.6+.4*noise(vec2(rr*160.,3.)));
  rc*=(1.-.92*sh)*(.55+.6*max(dot(N,L),0.));
  float sz=r2<R*R ? sqrt(R*R-r2) : -1e3;
  bool ringFront=zr>sz;
  if(!ringFront || r2>=R*R) col=mix(col, rc, rd*.95);
  // the planet
  if(r2<R*R){
    vec3 n=vec3(q,sz)/R;
    float lat=dot(n,N);
    float ndl=max(dot(n,L),0.);
    float b=lat*9.+.25*fbm4(vec2(lat*30., atan(n.x,n.z)*2.+t*.01))+.06*sin(atan(n.x,n.z)*14.+lat*40.);
    vec3 pc=mix(vec3(.88,.70,.44), vec3(.66,.46,.26), .5+.5*sin(b*2.1));
    pc=mix(pc, vec3(.95,.86,.66), smoothstep(.6,1.,sin(b*1.3+1.))*.5);
    pc=mix(pc, vec3(.55,.55,.52), smoothstep(.75,.95,lat)*.6);                            // blue-grey north pole
    // the rings' shadow falling across the planet
    vec3 S=n*R; float tt=-dot(S,N)/dot(L,N); float rs=(tt>0.) ? ringD(length(S+L*tt)/R) : 0.;
    float lim=pow(max(n.z,0.),.35);
    vec3 pl=pc*(ndl*1.25*(1.-.85*rs)*lim+.012);
    pl+=vec3(.9,.8,.6)*.04*rd*step(0.,-lat)*(1.-ndl);                                  // ringshine on the night side
    col=pl;
    if(ringFront) col=mix(col, rc, rd*.95);
  }
  // soft glow around the bright side
  col+=vec3(.9,.8,.6)*.025*exp(-max(sqrt(r2)-R,0.)*30.);
  // moons: Titan (orange, hazy) and little icy Enceladus
  vec2 m1=uv-vec2(-.58,.27); float d1=length(m1);
  if(d1<.016){ vec3 mn=vec3(m1,sqrt(.016*.016-d1*d1))/.016; col=vec3(1.,.62,.28)*(max(dot(mn,L),0.)*.9+.02); }
  col+=vec3(1.,.6,.3)*.04*exp(-d1*60.);
  vec2 m2=uv-vec2(.62+.02*sin(t*.03),-.30); float d2=length(m2);
  if(d2<.006){ vec3 mn=vec3(m2,sqrt(.006*.006-d2*d2))/.006; col=vec3(1.)*(max(dot(mn,L),0.)*1.2+.02); }
  gl_FragColor=vec4(finish(col,uv),1.);
}
`;
</script>

// ---------- 22. EARTH FROM SPACE: the curve of our planet, clouds, a thin blue sky line, a sunrise ----------
const EARTH = `
const vec2 EC=vec2(.15,-1.78); const float ER=1.6;
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

  float side=dot(normalize(p),sdir);
  float dayRim=smoothstep(-.35,.45,side);
  vec3 rim=mix(vec3(1.,.38,.12), vec3(.30,.55,1.2), smoothstep(.55,.95,side)*0.+smoothstep(.2,.8,dayRim));
  rim=mix(vec3(.05,.08,.25), rim, smoothstep(-.4,.3,side));
  if(h>0.) col+=rim*(exp(-h/.008)*1.1+exp(-h/.035)*.18)*(.25+.9*smoothstep(-.4,.6,side));
  if(r<ER){
    vec3 n=vec3(p, sqrt(ER*ER-r*r))/ER;

    vec3 m=n; m.xz=rot(t*.012)*m.xz; m.yz=rot(.35)*m.yz;
    float lon=atan(m.x,m.z), lat=asin(clamp(m.y,-1.,1.));
    vec2 g=vec2(lon*2.4, lat*4.2);
    float land=smoothstep(.54,.58,fbm(g*1.3+vec2(4.,1.)));
    float ice=smoothstep(.8,.9,abs(m.y)+.05*noise(g*8.));
    vec3 ground=mix(vec3(.10,.18,.06), vec3(.35,.28,.16), smoothstep(.4,.7,fbm4(g*5.)));
    vec3 ocean=mix(vec3(.004,.03,.11), vec3(.01,.08,.20), fbm4(g*3.));
    vec3 surf=mix(ocean, ground, land); surf=mix(surf, vec3(.8,.85,.9), ice);
    // swirling clouds
    vec2 cq=g*2.+vec2(t*.004,0.);
    vec2 wq=vec2(fbm4(cq+3.), fbm4(cq+7.+t*.003));

    lit+=vec3(1.,.4,.15)*.15*exp(-abs(ndl)*14.)*day;                                   // warm sunrise light on the line
    // city lights on the night side

    lit+=vec3(1.,.62,.25)*city*(1.-day)*1.2;
    // blue air seen at a slant near the edge
    float slant=pow(1.-n.z,2.5);
    lit=mix(lit, vec3(.3,.55,1.1)*max(ndl+.15,0.), slant*.55*day);

  }
  // the sunrise flare peeking over the edge
  vec2 sp=uv-sunP; float sd=length(sp);
  float up=smoothstep(-.01,.006,dot(sp,sdir)+.004);
  vec3 fl=vec3(1.6,1.4,1.2)*(exp(-sd*70.)*2.5+exp(-sd*14.)*.35);
  fl+=vec3(1.,.8,.6)*exp(-abs(sp.y)*260.)*exp(-abs(sp.x)*3.)*.5;                        // long streak
  float an=atan(sp.y,sp.x); fl+=vec3(1.,.9,.8)*pow(abs(sin(an*6.+.3)),60.)*exp(-sd*11.)*.3;   // star points
  col+=fl*(.35+.65*up);

  gl_FragColor=vec4(finish(col,uv),1.);
}
`;

<script>
// ---------- 23. HOT-AIR BALLOONS: colourful balloons drifting over a misty valley at sunrise ----------
const BALLOONS = `
const vec2 SUN=vec2(.42,.07);
vec3 skyH(vec2 uv, float t){
  float y=uv.y;
  vec3 c=mix(vec3(1.45,.78,.35), vec3(1.05,.65,.55), smoothstep(-.05,.12,y));
  c=mix(c, vec3(.42,.58,.90), smoothstep(.06,.33,y)); c=mix(c, vec3(.16,.32,.75), smoothstep(.3,.55,y));
  float sd=length(uv-SUN);
  c+=vec3(1.5,1.0,.55)*exp(-sd*6.)*.6+vec3(2.,1.7,1.2)*smoothstep(.035,.03,sd);
  float cl=fbm(vec2(uv.x*1.5-t*.004, y*7.));
  c=mix(c, vec3(1.25,.85,.65)*(1.+exp(-sd*3.)), smoothstep(.62,.85,cl)*smoothstep(.1,.25,y)*.6);
  return c;
}
vec3 BPAL(float k){ k=mod(k,6.);
  return k<1.?vec3(.9,.08,.06):k<2.?vec3(1.,.55,.02):k<3.?vec3(1.,.85,.1):k<4.?vec3(.1,.55,.15):k<5.?vec3(.08,.25,.85):vec3(.55,.12,.6); }
// one balloon: returns colour + coverage
vec4 balloon(vec2 uv, vec2 pos, float s, float seed, float t){
  vec2 q=(uv-pos)/s;
  if(abs(q.x)>1.1 || q.y>1.05 || q.y<-1.8) return vec4(0);
  float w=q.y>-.5 ? sqrt(max(1.-q.y*q.y,0.)) : mix(.28,.866,clamp((q.y+1.35)/.85,0.,1.));
  vec3 c=vec3(0); float a=0.;
  if(q.y>-1.35 && abs(q.x)<w){
    float u=q.x/w, az=asin(clamp(u,-1.,1.));
    float pat=h11(seed*5.);
    float gore=floor((az/PI+.5)*12.);
    float k=pat<.35 ? gore+floor(seed*7.) : pat<.7 ? (mod(gore,2.)<1.?floor(seed*3.):floor(seed*3.)+3.) : floor(seed*6.)+step(abs(q.y-.1+.25*sin(az*6.)),.18)*2.;
    c=BPAL(k);
    if(pat>.7 && q.y<-.6) c=BPAL(floor(seed*6.)+4.);
    float seam=smoothstep(.04,.0,abs(fract((az/PI+.5)*12.)-.5)*2.-.94);
    c*=1.-.35*seam;
    // light from the low sun on the right, darker on the shady side
    float nz=sqrt(max(1.-u*u,0.));
    float lam=clamp(.65*u+.35*nz+.15*q.y,0.,1.);
    vec3 sh=c*(.12+1.25*lam)+vec3(1.,.7,.4)*pow(max(u,0.),6.)*.35*nz;
    // the burner flickering on: the inside glows orange
    float burn=step(.55,h11(seed*3.+floor(t*.25+seed)))*(.6+.4*noise(vec2(t*12.,seed)));
    sh+=vec3(1.4,.6,.15)*burn*.55*smoothstep(-.2,-1.35,q.y)*(1.-.5*abs(u));
    c=sh; a=smoothstep(w,w-.04,abs(q.x));
  }
  // the mouth, ropes, basket and flame
  float burn2=step(.55,h11(seed*3.+floor(t*.25+seed)))*(.5+.5*noise(vec2(t*15.,seed+1.)));
  if(q.y<-1.3 && q.y>-1.6 && min(abs(q.x-mix(.28,.15,(-1.3-q.y)/.3)),abs(q.x+mix(.28,.15,(-1.3-q.y)/.3)))<.025){ c=vec3(.08,.06,.05); a=1.; }
  if(q.y<-1.6 && q.y>-1.8 && abs(q.x)<.17){ c=vec3(.40,.24,.10)*(.6+.4*step(.5,fract(q.y*25.)))*(.7+.4*step(0.,q.x)); a=1.; }
  vec2 fq=(q-vec2(0.,-1.42))*vec2(1.,.6);
  float fl=exp(-dot(fq,fq)*90.)*burn2;
  c=mix(c, vec3(2.,1.2,.4), clamp(fl,0.,1.)); a=max(a,clamp(fl,0.,1.));
  return vec4(c,a);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyH(uv,t);
  for(int L=0;L<5;L++){
    float k=float(L);
    // a ridge of hills, then a band of glowing morning mist in front of it
    float top=.01-k*.075+(.06+.02*k)*fbm4(vec2(uv.x*(1.3+k*.5)+k*5.,k));
    if(uv.y<top){
      vec3 hc=mix(vec3(.04,.08,.04), vec3(.12,.18,.09), fbm4(uv*vec2(20.,30.)+k))*(.7+.5*noise(uv*vec2(160.,120.)));
      hc+=vec3(.5,.35,.15)*.25*smoothstep(-.4,.6,uv.x)*smoothstep(top-.04,top,uv.y);    // sun on the ridge tops
      col=mix(hc, mix(vec3(.95,.70,.55),vec3(.55,.55,.70),.4+.1*k), clamp(.8-k*.21,0.,1.));
    }
    float mist=smoothstep(.04,.0,abs(uv.y-(top-.05-.02*k)))*0.+smoothstep(top-.0,top-.07,uv.y)*smoothstep(top-.16,top-.08,uv.y);
    float mn=fbm4(vec2(uv.x*3.-t*.01*(1.+k*.3), uv.y*10.+k));
    col=mix(col, vec3(1.2,.92,.72)*(.8+.4*smoothstep(-.4,.6,uv.x)), mist*(.3+.6*smoothstep(.35,.75,mn))*(.85-k*.12));
    // balloons at this distance
    for(int i=0;i<3;i++){
      float sd=k*3.+float(i)+1.;
      float s=.018+.016*k+.008*h11(sd*7.);
      float sp=.004+.004*h11(sd*3.);
      vec2 pos=vec2(-1.15+fract(h11(sd)+t*sp)*2.3, -.02+.3*h11(sd*1.7)-k*.03+.012*sin(t*.3+sd));
      if(L==4 && i==0) pos=vec2(-.32+.04*sin(t*.05), .18+.015*sin(t*.25));                 // one big balloon close by
      if(L==4 && i==0) s=.11;
      vec4 b=balloon(uv,pos,s,sd,t);
      b.rgb=mix(b.rgb, vec3(.95,.75,.65), clamp(.5-k*.13,0.,1.));
      col=mix(col,b.rgb,b.a);
    }
  }
  col+=vec3(1.,.7,.4)*.12*exp(-length((uv-SUN)*vec2(.5,1.5))*2.5);
  gl_FragColor=vec4(finish(col*.85,uv),1.);
}
`;
</script>
<script>
// ---------- 24. GLACIER BAY: blue ice cliffs, floating icebergs, calm water, a whale tail now and then ----------
const GLACIER = `
const float WL=-.08;                  // the water line
vec3 aboveG(vec2 uv, float t){
  float y=uv.y;
  vec3 col=mix(vec3(.78,.86,.92), vec3(.32,.52,.80), smoothstep(-.05,.45,y));
  float cl=fbm(vec2(uv.x*1.4+t*.004, y*4.));
  col=mix(col, vec3(.95,.97,1.)*(.8+.3*smoothstep(.1,.4,y)), smoothstep(.5,.8,cl)*.75);
  // snowy mountains behind, fading into the haze
  float m1=.10+.17*pow(1.-abs(fract(uv.x*1.1+.3)-.5)*2.,1.6)+.05*fbm4(vec2(uv.x*5.,1.));
  if(y<m1){ float r=fbm4(uv*vec2(26.,9.)); float snow=smoothstep(.45,.6,r+.5*(y-m1)/.1+.3);
    col=mix(mix(vec3(.30,.33,.40), vec3(.9,.93,.98), snow)*(.7+.4*smoothstep(-.3,.3,uv.x+r*.3)), vec3(.72,.80,.88), .45); }
  float m2=.02+.13*pow(1.-abs(fract(uv.x*1.6+.65)-.5)*2.,1.4)+.03*fbm4(vec2(uv.x*8.,3.));
  if(y<m2){ float r=fbm4(uv*vec2(40.,12.)+5.); float snow=smoothstep(.5,.62,r+.4*(y-m2)/.08+.2);
    col=mix(vec3(.16,.17,.20), vec3(.92,.95,1.), snow)*(.65+.45*smoothstep(-.2,.2,r-.5+uv.x*.2)); col=mix(col, vec3(.72,.80,.88), .2); }
  // the glacier: a river of ice coming down the valley between the mountains...
  float vw=.5-5.*max(y-.02,0.)+.03*noise(vec2(y*60.,3.));
  if(y>.0 && y<.11 && abs(uv.x+.12+.4*(y-.02))<vw){
    float k=(y-.0)/.11; float cr=smoothstep(.6,.9,noise(vec2(uv.x*(40.+200.*k), y*(250.+600.*k))));
    vec3 g=mix(vec3(.88,.92,.97), vec3(.45,.58,.72), cr*.7+.2*k)*(.85+.2*noise(uv*vec2(80.,300.)));
    g=mix(g, vec3(.45,.45,.48), smoothstep(.012,.0,abs(uv.x+.12+.15*(y-.02)+.12*(1.-k)*.5))*.6);   // a dark stripe of rocks
    col=mix(g, vec3(.72,.80,.88), .25*k);
  }
  // ...ending in a tall cliff of blue ice at the water
  if(y>WL && y<.05 && uv.x>-.78 && uv.x<.5){
    float top=.012+.022*noise(vec2(uv.x*14.,1.))+.012*noise(vec2(uv.x*45.,2.))-.03*smoothstep(.35,.5,uv.x)-.03*smoothstep(-.6,-.78,uv.x);
    if(y<top){
      float c1=fbm4(vec2(uv.x*30.,y*3.)), c2=noise(vec2(uv.x*90.,y*8.));
      float d=(top-y)/(top-WL);
      vec3 ice=mix(vec3(.90,.96,1.02), vec3(.35,.66,.90), smoothstep(.05,.9,d+.4*(c1-.5)));
      ice=mix(ice, vec3(.08,.30,.62), smoothstep(.55,.8,c2)*smoothstep(.0,.3,d)*.7);       // deep blue cracks
      ice*=.85+.3*c1;
      ice=mix(ice, vec3(.5,.5,.52), smoothstep(.006,.0,abs(y-WL-.06-.012*sin(uv.x*14.)))*.35);
      col=ice;
    }
  }
  return col;
}
// an iceberg: an irregular white lump with blue shady sides
vec4 berg(vec2 uv, vec2 p, float w, float h, float seed){
  vec2 q=uv-p; if(abs(q.x)>w) return vec4(0);
  if(q.y<0.){ float uw=smoothstep(w*.9,w*.3,abs(q.x))*smoothstep(-h*1.2,0.,q.y); return vec4(vec3(.15,.55,.65),uw*.45); }
  float x=q.x/w;
  float top=h*(1.-x*x)*(.6+.5*noise(vec2(x*3.+seed,seed)))+h*.15*noise(vec2(x*12.,seed));
  if(q.y>top) return vec4(0);
  float sh=smoothstep(-.6,.6,x+.4*noise(vec2(q.y/h*4.,seed)));
  vec3 c=mix(vec3(.95,.98,1.05), vec3(.35,.62,.85), sh*.75);
  c=mix(c, vec3(.15,.45,.75), smoothstep(.25,.0,q.y/h)*.4);
  return vec4(c*(.9+.15*noise(q*300.)),1.);
}
void bergs(inout vec3 col, vec2 uv){
  vec4 b;
  b=berg(uv,vec2(-.55,-.13),.09,.05,1.); col=mix(col,b.rgb,b.a);
  b=berg(uv,vec2(.15,-.11),.05,.025,2.); col=mix(col,b.rgb,b.a);
  b=berg(uv,vec2(.62,-.17),.13,.07,3.); col=mix(col,b.rgb,b.a);
  b=berg(uv,vec2(-.2,-.30),.16,.08,4.); col=mix(col,b.rgb,b.a);
}
// a humpback whale's tail rising out of the water and sliding back down
void tail(inout vec3 col, vec2 uv, float t){
  float P=22., lt=mod(t,P);
  if(lt>8.) return;
  float e=smoothstep(0.,2.5,lt)*smoothstep(8.,5.,lt);
  vec2 base=vec2(.30,-.22); float s=.12;
  vec2 q=(uv-base)/s; q.y+=(1.-e)*1.6;
  if(q.y<0. && uv.y<base.y) return;
  float lean=.15*sin(lt*.5);
  q.x-=lean*q.y;
  float stem=step(abs(q.x),.16-.04*q.y)*step(q.y,.9);
  float ax=abs(q.x);
  float lobeB=.8+.28*ax-.05, lobeT=.95+.32*ax-.25*ax*ax*ax-.1*smoothstep(.12,.0,ax);
  float fl=step(ax,1.)*step(lobeB,q.y)*step(q.y,lobeT);
  if(max(stem,fl)>0. && uv.y>base.y-.002){
    vec3 c=vec3(.05,.06,.08)*(.8+.4*noise(q*20.));
    c=mix(c, vec3(.85,.88,.9), fl*smoothstep(.5,.7,noise(q*6.))*.8);                   // white patterns underneath
    col=c;
  }
  // water dripping off the tail, and a soft splash ring
  float drip=step(.93,h21(vec2(floor(uv.x*400.),1.)))*step(abs(q.x),1.)*step(q.y,lobeB)*step(0.,q.y)*e;
  col=mix(col, vec3(.85,.92,1.), drip*.35*smoothstep(.3,.7,fract(uv.y*60.+t*5.)));
  float ring=smoothstep(.006,.0,abs(length((uv-base)*vec2(1.,4.))-.12*(.6+.4*e)))*e;
  col=mix(col, vec3(.9,.95,1.), ring*.6);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col;
  if(uv.y>=WL) col=aboveG(uv,t);
  else {
    float d=WL-uv.y, z=1./(d+.02);
    float rip=fbm3(vec2(uv.x*z*1.2, z*6.)+vec2(t*.04,t*.2));
    vec2 m=vec2(uv.x+(rip-.5)*.006*(.5+d*4.), WL+d*.95+(rip-.5)*.012);
    col=aboveG(m,t)*vec3(.30,.42,.47)+vec3(.01,.035,.045);
    col=mix(col, vec3(.015,.05,.07), smoothstep(.0,.3,d)*.6);
    col+=vec3(.9,.95,1.)*step(.94,noise(vec2(uv.x*z*20., z*40.)))*.25*smoothstep(.3,.0,d);   // little bits of floating ice
  }
  bergs(col,uv);
  tail(col,uv,t);
  gl_FragColor=vec4(finish(col*.85,uv),1.);
}
`;

<script>
// ---------- 25. FIREFLY MEADOW: a summer field at dusk, hundreds of blinking fireflies, the moon rising ----------
const FIREFLY = `
const float HZ=-.06;                   // horizon
vec3 skyF(vec2 uv, float t, float px){
  float y=uv.y-HZ;
  vec3 c=mix(vec3(.95,.50,.30), vec3(.45,.35,.50), smoothstep(.0,.12,y));
  c=mix(c, vec3(.07,.11,.30), smoothstep(.06,.3,y)); c=mix(c, vec3(.012,.025,.09), smoothstep(.25,.55,y));
  c*=.75+.4*smoothstep(.7,-.8,uv.x);                                                 // last light on the left
  c+=starfield(uv, px, .5)*smoothstep(.2,.45,y);
  // the moon rising on the right, big and golden near the horizon
  vec2 mc=vec2(.52, HZ+.05+t*.0006); vec2 mp=uv-mc; float md=length(mp);
  float mr=.075;
  if(md<mr){ float cr=fbm4(mp*40.+3.); vec3 mn=vec3(mp,sqrt(mr*mr-md*md))/mr;
    c=vec3(1.25,.95,.62)*(.75+.3*cr-.25*smoothstep(.45,.65,fbm4(mp*14.)))*(.7+.3*mn.z); }
  c+=vec3(1.,.8,.5)*(exp(-max(md-mr,0.)*18.)*.18+exp(-max(md-mr,0.)*60.)*.2);
  return c;
}
// tall grass blades swaying in the evening breeze
float blades(vec2 uv, float t, float w, float base, float hmax, float seed){
  float res=0.;
  for(int o=-1;o<=1;o++){
    float ci=floor(uv.x/w)+float(o);
    float r=h11(ci+seed);
    float cx=(ci+.5+.6*(h11(ci*1.7+seed)-.5))*w;
    float h=hmax*(.4+.6*r);
    float y=(uv.y-base)/h;
    if(y<0. || y>1.) continue;
    float bend=(.15*(r-.5)+.05*sin(t*.8+ci*.7+seed))*h;
    float x=cx+bend*y*y;
    float th=w*.32*(1.-y)+.0006;
    res=max(res, smoothstep(th,th*.5,abs(uv.x-x)));
  }
  return res;
}
// fireflies: each one drifts in little loops and blinks on and off
vec3 flies(vec2 uv, float t, float cell, float seed, float bright){
  vec3 c=vec3(0);
  vec2 g=uv/cell; vec2 gi=floor(g);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 id=gi+vec2(i,j);
    if(h21(id+seed)>.8) continue;
    vec2 hp=h22(id+seed);
    vec2 pos=(id+.5+.35*vec2(sin(t*(.3+.3*hp.x)+hp.y*6.), sin(t*(.25+.3*hp.y)+hp.x*6.)))*cell;
    float per=2.+3.*h21(id*1.3+seed), ph=fract(t/per+hp.x);
    float blink=smoothstep(.0,.1,ph)*smoothstep(.6,.35,ph);
    float d=length(uv-pos);
    c+=vec3(.75,1.,.25)*blink*(exp(-d*d/(cell*cell*.0012))*1.6+exp(-d/(cell*.12))*.12)*bright;
  }
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyF(uv,t,px);
  // a line of round trees far away
  float tl=HZ+.035+.03*fbm4(vec2(uv.x*8.,1.))+.015*noise(vec2(uv.x*40.,2.));
  if(uv.y<tl) col=vec3(.012,.02,.025)+vec3(.12,.08,.1)*.15*smoothstep(tl-.03,tl,uv.y);
  // the meadow
  if(uv.y<HZ){
    float d=HZ-uv.y;
    col=mix(vec3(.025,.035,.025), vec3(.008,.014,.008), smoothstep(.0,.3,d))*(.7+.5*noise(vec2(uv.x*200./(1.+d*8.), d*400.)));
    col+=vec3(.6,.35,.2)*.05*exp(-d*25.)*smoothstep(.6,-.6,uv.x);
  }
  col+=flies(uv,t,.09,1.,.55)*smoothstep(.12,-.02,uv.y);                              // far fireflies
  // grass in front, then the closest fireflies
  float g0=blades(uv,t,.005,-.2,.07,1.);
  col=mix(col, vec3(.012,.02,.012), g0*.8);
  float g1=blades(uv,t,.008,-.4,.18,3.);
  col=mix(col, vec3(.008,.014,.008), g1);
  col+=flies(uv,t*.9,.13,5.,1.)*smoothstep(.2,-.1,uv.y);
  float g2=blades(uv,t,.014,-.56,.34,9.);
  col=mix(col, vec3(.004,.007,.005)+vec3(.05,.05,.08)*.12, g2);
  col+=flies(uv,t*.8,.24,9.,1.2)*smoothstep(.3,-.2,uv.y);
  float g3=blades(uv,t,.03,-.62,.4,13.);
  col=mix(col, vec3(.002,.003,.002), g3);
  gl_FragColor=vec4(finish(col*.85,uv),1.);
}
`;
