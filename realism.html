<script>
'use strict';
// ---------- Shared shader bits: hashing, noise, fbm, stars, and a filmic "camera" finish ----------
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
// star colour from a 0..1 "temperature" (red dwarf -> sun -> blue giant)
vec3 starCol(float k){ return k<.5 ? mix(vec3(1.,.62,.38), vec3(1.,.95,.88), k*2.) : mix(vec3(1.,.95,.88), vec3(.62,.75,1.), (k-.5)*2.); }
// one layer of stars: point-spread "blobs" a pixel or two wide, twinkling
vec3 starLayer(vec2 p, float cell, float dens, float px, float seed, float tw){
  vec2 q=p/cell; vec2 id=floor(q); vec2 f=fract(q)-.5;
  float r=h21(id+seed); if(r>dens) return vec3(0);
  vec2 o=(h22(id+seed*1.3)-.5)*.6; float d=length(f-o)*cell/px;
  float m=pow(h21(id*1.71+seed), 6.);
  float twk=1.-tw+tw*(.55+.45*sin(uT*(1.5+4.*h21(id+9.1))+r*60.));
  float core=exp(-d*d*(1.6-m*.9)); float halo=exp(-d*.55)*m*.25;
  return starCol(h21(id*3.7+seed))*(core*(.25+2.8*m)+halo)*twk;
}
vec3 starfield(vec2 p, float px, float amt){
  vec3 c=starLayer(p, 26.*px, .55, px, 1., .5)*.55+starLayer(p+.13, 11.*px, .45, px, 31., .4)*.22;
  c+=starLayer(p+.37, 43.*px, .5, px, 7., .6);
  c+=starLayer(p+.71, 97.*px, .55, px, 13., .7)*1.5;
  return c*amt;
}
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;

// ---------- 1. GALAXY ----------
const GALAXY = `
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec2 p=uv+vec2(t*.0015,t*.0004);
  // background nebula: domain-warped fbm clouds
  vec2 q=p*1.5;
  vec2 w=vec2(fbm4(q+vec2(0.,t*.012)), fbm4(q+vec2(5.2,1.3)-t*.009));
  float n=fbm(q*1.1+w*2.4), n2=fbm(q*2.2-w*1.7+7.3);
  float band=smoothstep(.5,.85, fbm4(q*.55+vec2(2.,t*.003)) + .25*(.5-abs(uv.y+uv.x*.45+.1)*1.4));
  vec3 neb=vec3(.62,.10,.36)*pow(smoothstep(.35,.95,n),1.5)*1.3
          +vec3(.06,.32,.55)*pow(smoothstep(.4,.95,n2),1.5)*1.1
          +vec3(.95,.45,.15)*pow(smoothstep(.62,1.05,n*n2*1.8),2.)*.9;
  float dust=smoothstep(.42,.72,fbm(q*2.6+w*3.+11.));
  neb*=(1.-.85*dust)*band*.5*(.45+1.1*fbm4(q*7.+w*2.));
  vec3 col=vec3(.002,.0025,.006)+neb;
  // the spiral galaxy (tilted disc, rotating very slowly)
  vec2 gc=vec2(.18,.06);
  vec2 g=rot(.55)*(uv-gc); g.y/=.42;
  float R=.50; float r=length(g)/R; float spin=t*.025;
  vec2 gr=rot(-spin)*g;
  float th=atan(gr.y,gr.x);
  float s=th-log(r+.02)*2.3;
  float arm=pow(max(.5+.5*cos(2.*s),0.),2.5);
  float clump=fbm(gr*9.);
  float fine=noise(gr*38.);
  float disk=exp(-r*2.6)*smoothstep(1.35,.5,r);
  vec3 gal=vec3(.55,.68,1.)*disk*(.12+arm*(.55+1.1*clump))*1.7;
  gal+=vec3(1.,.35,.55)*pow(clump*fine,3.)*arm*disk*14.*smoothstep(.1,.3,r);   // pink star-forming knots
  gal+=starLayer(uv, 7.*px, .6, px, 21., .3)*disk*(.3+arm)*3.;            // resolved bright stars in the arms
  float bul=exp(-r*r*28.); float core=exp(-r*16.);
  gal+=vec3(1.,.82,.55)*bul*1.6+vec3(1.,.95,.85)*core*3.5;
  float lane=pow(max(.5+.5*cos(2.*(s-.55)),0.),7.)*smoothstep(.06,.28,r)*smoothstep(1.2,.5,r);
  lane*=.55+.6*fbm4(gr*14.+3.);
  float near=smoothstep(.25,-.35,g.y/ (r*R+.001)*.42);
  gal*=1.-clamp(lane*(.7+.3*near),0.,.93);
  col=col*(1.-.6*clamp(disk*2.,0.,1.)*lane)+gal;
  col+=vec3(1.,.85,.6)*.06/(1.+length(uv-gc)*40.);                       // soft glare
  // stars
  col+=starfield(p, px, 1.)*(1.-.7*dust*band);
  // occasional shooting star
  float P=9.; float k=floor(t/P); float lt=t-k*P;
  if(lt<1.4){
    vec2 a=vec2(h11(k)*1.4-.7, .15+h11(k+3.)*.3); vec2 dir=normalize(vec2(h11(k+5.)>.5?1.:-1., -.45));
    vec2 head=a+dir*lt*.55; vec2 tail=head-dir*.22*smoothstep(0.,.4,lt);
    vec2 pa=uv-tail, ba=head-tail; float hh=clamp(dot(pa,ba)/dot(ba,ba),0.,1.);
    float d=length(pa-ba*hh);
    float fade=smoothstep(0.,.15,lt)*smoothstep(1.4,.9,lt);
    col+=vec3(.8,.9,1.)*exp(-d/px*.9)*hh*hh*fade*1.6;
  }
  gl_FragColor=vec4(finish(col*1.15,uv),1.);
}`;
// ---------- the drawing engine: one full-screen rectangle, one shader per scene ----------
const SRC = [];          // filled in by the scene blocks below (GALAXY, FIRE, OCEAN, AURORA, SEA)
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
const progs = [];
let scene = 0, want = 0, fade = 0, sceneT = SCENES.map(() => 30), last = 0, running = true, raf = 0;
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
let scale = Math.min(window.devicePixelRatio || 1, 1) * (isTouch ? 0.7 : 0.9);
const frameTimes = [];
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
  return s;
}
function build(i) {
  if (progs[i]) return progs[i];
  const vs = compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
  const fs = compile(gl.FRAGMENT_SHADER, COMMON + SRC[i]);
  if (!vs || !fs) return null;
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(p)); return null; }
  progs[i] = { p, res: gl.getUniformLocation(p, 'uRes'), t: gl.getUniformLocation(p, 'uT'), fade: gl.getUniformLocation(p, 'uFade') };
  return progs[i];
}
function resize() {
  const w = Math.max(1, Math.round(innerWidth * scale)), h = Math.max(1, Math.round(innerHeight * scale));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
}
function frame(now) {
  raf = 0; if (!running) return;
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 0.016); last = now;
  // smooth fade between scenes
  if (want !== scene) { fade = Math.max(0, fade - dt * 2.2); if (fade === 0) { scene = want; build(scene); } }
  else fade = Math.min(1, fade + dt * 1.4);
  sceneT[scene] = (sceneT[scene] + dt) % 3600;
  // keep it smooth: if frames are slow, draw fewer pixels (stretched up by the browser)
  frameTimes.push(dt); if (frameTimes.length > 50) {
    const avg = frameTimes.reduce((a, b) => a + b) / frameTimes.length; frameTimes.length = 0;
    if (avg > 0.026 && scale > 0.4) { scale *= 0.85; resize(); }
  }
  const pr = build(scene);
  if (pr) {
    gl.viewport(0, 0, cv.width, cv.height); gl.useProgram(pr.p);
    gl.uniform2f(pr.res, cv.width, cv.height); gl.uniform1f(pr.t, sceneT[scene]);
    gl.uniform1f(pr.fade, fade * fade * (3 - 2 * fade));
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }
  raf = requestAnimationFrame(frame);
}
function startEngine() {
  if (!gl) { document.getElementById('oops').style.display = 'flex'; return; }
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  resize(); addEventListener('resize', resize);
  raf = requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange', () => {
  running = !document.hidden;
  if (running) { last = 0; if (!raf) raf = requestAnimationFrame(frame); }
  Sound.pause(!running);
});

// ---------- buttons ----------
const ui = document.getElementById('ui'), sceneBox = document.getElementById('scenes');
const factEl = document.getElementById('fact'), nameEl = document.getElementById('name');
const seen = new Set(); let nameTimer = 0, seenTimer = 0;
const tabBox = document.getElementById('tabs'); let group = -1;
const groupOf = i => GROUPS.findIndex(g => g.s.includes(i));
function showGroup(gi) {
  group = gi;
  [...tabBox.children].forEach((b, j) => b.classList.toggle('on', j === gi));
  sceneBox.innerHTML = '';
  GROUPS[gi].s.forEach(i => {
    const s = SCENES[i], b = document.createElement('button'); b.className = 'scene'; b.dataset.i = i;
    b.innerHTML = `<span class="e">${s.e}</span><span class="t">${s.t}</span>`;
    b.classList.toggle('on', i === want);
    b.addEventListener('click', e => { e.stopPropagation(); go(i); });
    sceneBox.appendChild(b);
  });
}
GROUPS.forEach((g, gi) => {
  const b = document.createElement('button'); b.className = 'tab';
  b.textContent = g.e + ' ' + g.t;
  b.addEventListener('click', e => { e.stopPropagation(); if (groupOf(want) === gi) showGroup(gi); else go(g.s[0]); });
  tabBox.appendChild(b);

function go(i) {

  if (groupOf(want) !== group) showGroup(groupOf(want));
  [...sceneBox.children].forEach(b => b.classList.toggle('on', +b.dataset.i === want));
  factEl.textContent = '🤓 ' + SCENES[want].fact;
  nameEl.textContent = SCENES[want].e + ' ' + SCENES[want].t; nameEl.classList.add('show');

    col=mix(col, vec3(.03,.02,.015)+vec3(1.,.25,.03)*hot*1.6*(1.-cd), smoothstep(1.,.7,cd)); }
  // smoke: soft grey wisps rising and drifting, lit warm from below
  vec2 sp=uv-FB; float sy=sp.y-.25;
  if(sy>-.1){
    vec2 sq=vec2(sp.x-sy*sy*.25-sin(t*.3+sy*3.)*.04, sy);
    float sm=fbm(vec2(sq.x*4., sq.y*2.5-t*.35)+fbm4(sq*3.-vec2(0.,t*.2)));
    float wide=.12+sy*.45;
    float smk=smoothstep(.45,.85,sm)*smoothstep(wide,0.,abs(sq.x))*smoothstep(-.1,.1,sy)*smoothstep(.9,.2,sy);
    col=mix(col, vec3(.10,.09,.085)+vec3(.35,.12,.03)*L*smoothstep(.5,0.,sy)*.6, smk*.55);
  }
  // the flames: turbulent noise rising upward, hot white-yellow core -> orange -> red tips
  vec2 f=uv-FB;
  float y=f.y;
  float n1=fbm4(vec2(f.x*5.5, y*3.6-t*2.2)+fbm3(vec2(f.x*3.,y*2.-t*1.3))*.8);
  float n2=fbm4(vec2(f.x*13.+3., y*9.-t*4.1));
  float n=n1*.65+n2*.35;
  float rise=smoothstep(-.03,.35,y);
  float xw=f.x+(n-.5)*.22*rise+sin(y*7.-t*3.)*.012*rise;
  float H=.42+.05*sin(t*1.7)+.05*(noise(vec2(t*1.2,3.))-.5);
  float width=.20*(1.-smoothstep(-.04,H,y)*.85)*smoothstep(-.09,-.02,y);
  float T=(1.-abs(xw)/max(width,.001))*.9+(1.-y/H)*.55-.25;
  T-=(1.-n)*1.15*rise+(1.-n2)*.3;
  T=clamp(T*1.35,0.,1.)*smoothstep(-.1,-.03,y);
  vec3 flame=fireRamp(T)*pow(T,1.4)*2.5*(.9+.2*L);
  // a soft blue base right on the wood
  col+=flame;
  // front log + front stones hide the bottom of the flames
  lg=logCol(uv, vec2(-.075,-.275), vec2(.05,-.15), .038, 5.1, t, L); col=mix(col,lg.rgb,lg.a);
  s=stones(uv,true,L); col=mix(col,s.rgb,s.a);
  // warm glow in the air around the fire
  float gd=length((uv-FB-vec2(0.,.08))*vec2(1.,1.4));
  col+=vec3(1.,.35,.06)*.10*L/(1.+gd*gd*60.);
  // sparks: tiny glowing bits riding the hot air, fading as they cool
  for(int i=0;i<34;i++){
    float fi=float(i); float life=1.6+2.2*h11(fi*1.3);
    float ph=fract(t/life+h11(fi*7.7)); float cyc=floor(t/life+h11(fi*7.7));
    float sd=h11(fi*3.1+cyc*1.7);
    vec2 sp0=FB+vec2((sd-.5)*.22, .02);
    vec2 pos=sp0+vec2(sin(t*2.+fi)*.03*ph+(h11(fi+cyc)-.5)*.25*ph*ph, ph*(.55+.45*h11(fi*5.3+cyc)));
    vec2 dv=uv-pos; dv.y*=.45;
    float d=length(dv)/px;
    float heat=(1.-ph); float tw=.6+.4*sin(t*30.+fi*9.);
    col+=mix(vec3(1.,.25,.03), vec3(1.,.75,.35), heat)*exp(-d*d*.35)*heat*heat*tw*2.2;
  }
  gl_FragColor=vec4(finish(col,uv),1.);
}`;

<script>
// ---------- 3. OCEAN SUNSET ----------
const OCEAN = `
const vec3 SUN=vec3(0.,.042,.9991);
vec3 skyCol(vec3 rd, float t, float cloudAmt){
  float e=rd.y; float sd=max(dot(rd,SUN),0.);
  vec3 c=mix(vec3(.5,.14,.04), vec3(.12,.045,.09), smoothstep(-.01,.1,e));
  c=mix(c, vec3(.01,.016,.06), smoothstep(.05,.3,e));
  c+=vec3(1.,.32,.05)*pow(sd,12.)*.35+vec3(1.,.5,.15)*pow(sd,120.)*1.1;
  c+=vec3(1.,.72,.4)*smoothstep(.99964,.99976,sd)*14.;               // the sun itself
  if(cloudAmt>0. && e>0.){
    vec2 cp=rd.xz/(e+.035);
    vec2 q=vec2(cp.x*.22+t*.006, cp.y*.9);
    float dens=fbm(q+fbm4(q*1.7+vec2(t*.004,0.))*.6);
    float cl=smoothstep(.48,.7,dens)*smoothstep(.005,.07,e)*cloudAmt;
    float lit=pow(sd,3.)*.9+.1;
    vec3 under=mix(vec3(.07,.03,.05), vec3(.45,.13,.05), lit);
    vec3 edge=mix(vec3(.36,.12,.11), vec3(1.4,.6,.2), pow(sd,10.));
    vec3 cc=mix(edge, under, smoothstep(.52,.8,dens));
    cc=mix(cc, vec3(.05,.03,.07), smoothstep(.2,.5,e)*.7);
    c=mix(c, cc, cl*.92);
  }
  return c;
}
// sum of sharp-crested waves: returns the slope (for lighting) and height (for foam)
vec3 waves(vec2 p, float t, float dist, out float h){
  float a=1., w=.3, hs=0., hx=0., hz=0., ws=0., it=0.;
  for(int i=0;i<22;i++){
    vec2 d=vec2(sin(it),cos(it));
    float ph=dot(d,p)*w+t*sqrt(9.8*w)*.9;
    float e=exp(sin(ph)-1.), dc=e*cos(ph);
    float fade=a*smoothstep(1.,.25,w*dist*.0035);
    hs+=e*fade; hx+=dc*w*d.x*fade; hz+=dc*w*d.y*fade; ws+=a;
    p-=d*dc*a*.18;              // little "drag" makes crests bunch up like real water
    it+=1232.399963; w*=1.17; a*=.83;
  }
  h=hs/ws;
  return normalize(vec3(-hx*.5, 1., -hz*.5));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 rd=normalize(vec3(uv.x, uv.y+.03, 1.7));
  vec3 col;
  if(rd.y>=0.){
    col=skyCol(rd,t,1.);
    col+=starfield(uv, px, .25)*smoothstep(.25,.45,rd.y);
  } else {
    float dist=-3.5/rd.y; vec3 p=vec3(0.,3.5,0.)+rd*dist;
    float h; vec3 n=waves(p.xz, t, dist, h);
    n=normalize(mix(n, vec3(0.,1.,0.), smoothstep(80.,600.,dist)*.6));
    vec3 r=reflect(rd,n); r.y=abs(r.y)+.002;
    float fr=.02+.98*pow(1.-max(dot(-rd,n),0.),5.);
    vec3 refl=skyCol(r,t,.85);
    // light that goes into the water and scatters back out of thin wave tops
    vec3 body=vec3(.004,.016,.028)+vec3(.35,.13,.05)*pow(clamp(h*1.4-.25,0.,1.),2.)*.35*max(dot(rd,SUN)*.5+.5,0.);
    col=mix(body, refl*.8, clamp(fr,0.,1.));
    float sd=max(dot(r,SUN),0.);
    float fadeG=exp(-dist*.0012);
    col+=vec3(1.,.72,.42)*pow(sd,1400.)*55.*(.4+.6*fadeG);            // glitter on the waves
    col+=vec3(1.,.45,.15)*pow(sd,60.)*.5;
    // gentle foam on the biggest crests near us
    float fm=fbm4(p.xz*vec2(.8,.6)+vec2(t*.1,0.))*smoothstep(.62,.9,h)*smoothstep(60.,10.,dist);
    fm*=.5+.5*noise(p.xz*4.);
    col=mix(col, vec3(.85,.55,.42)*.75, smoothstep(.35,.7,fm)*.7);
    // haze toward the horizon
    col=mix(col, skyCol(normalize(vec3(rd.x,.0,rd.z)),t,0.)*.85, 1.-exp(-dist*.0025));
  }
  gl_FragColor=vec4(finish(col*.95,uv),1.);
}`;
</script>
<script>
// ---------- 4. NORTHERN LIGHTS over snowy mountains and a frozen lake ----------
const AURORA = `
const float HZ=-.12;   // lake shoreline on screen
float tri(float x){ return clamp(abs(fract(x)-.5),.01,.49); }
vec2 tri2(vec2 p){ return vec2(tri(p.x)+tri(p.y), tri(p.y+tri(p.x))); }
// folded "curtain" noise: thin bright sheets that slowly ripple
float curtain(vec2 p, float t){
  float z=1.8, z2=2.5, rz=0.;
  p*=rot(p.x*.06); vec2 bp=p;
  for(int i=0;i<5;i++){
    vec2 dg=tri2(bp*1.85)*.75; dg*=rot(t*.07);
    p-=dg/z2; bp*=1.3; z2*=.45; z*=.42;
    p*=1.21+(rz-1.)*.02;
    rz+=tri(p.x+tri(p.y))*z;
    p*=-mat2(.95534,.29552,-.29552,.95534);
  }
  return clamp(1./pow(rz*29.,1.3),0.,.55);
}
vec3 aurora(vec3 rd, float t){
  vec3 col=vec3(0); vec3 avg=vec3(0);
  float jit=.006*h21(gl_FragCoord.xy);
  for(int i=0;i<34;i++){
    float fi=float(i);
    float pt=(.8+pow(fi,1.4)*.0022)/(rd.y*2.+.4)-jit*smoothstep(0.,15.,fi);
    vec2 p=(pt*rd).zx+vec2(t*.01,0.);
    float rz=curtain(p,t);
    vec3 c2=mix(vec3(.05,1.,.35), vec3(.0,.75,.7), smoothstep(4.,14.,fi));
    c2=mix(c2, vec3(.85,.15,.55), smoothstep(16.,30.,fi))*rz;
    avg=mix(avg,c2,.5);
    col+=avg*exp2(-fi*.065-2.5)*smoothstep(0.,5.,fi);
  }
  col=col*col*3.5;
  return col*clamp(rd.y*12.+.3,0.,1.)*smoothstep(-.02,.12,rd.y);
}
// mountain ridge height at screen x (two ranges)
float ridge(float x, float k){
  float h=0., a=.5, f=1.;
  for(int i=0;i<6;i++){ h+=a*(1.-abs(noise(vec2(x*f*2.2+k*13.,k))*2.-1.)); f*=2.1; a*=.48; }
  return h;
}
vec3 land(vec2 uv, float t, vec3 skyc, vec3 glow, out float hit){
  hit=0.; vec3 col=skyc;
  for(int k=0;k<2;k++){
    float fk=float(k);
    float base=HZ+(k==0?.02:.0); float amp=k==0?.6:.34;
    float hx=base+amp*pow(ridge(uv.x*(k==0?.9:1.4)+fk*3.,fk+1.),3.);
    if(uv.y<hx){
      hit=1.;
      float e=.002; float sl=(base+amp*pow(ridge((uv.x+e)*(k==0?.9:1.4)+fk*3.,fk+1.),3.)-hx)/e;
      float depth=hx-uv.y;
      vec2 q=uv*vec2(9.,7.)+fk*5.;
      float m0=1.-abs(fbm4(q)*2.-1.);
      float mx=(1.-abs(fbm4(q+vec2(.03,0.))*2.-1.)-m0)/.03, my=(1.-abs(fbm4(q+vec2(0.,.03))*2.-1.)-m0)/.03;
      float rock=smoothstep(.75,.95,m0+noise(uv*90.)*.25)*(.6+.4*smoothstep(.0,.1,depth));
      float lit=clamp(.45-mx*.18+my*.08-sl*exp(-depth*40.)*.25,0.,1.);   // moonlight from the left
      vec3 snow=vec3(.075,.095,.14)*(.2+lit*1.6)+glow*.1;
      vec3 c=mix(snow, vec3(.008,.01,.014), rock*.9);
      c*=.85+.3*noise(uv*vec2(120.,120.));
      if(k==0) c=mix(c, skyc*.5+vec3(.01,.02,.03), .5); else c*=.75;      // far range fades into the air
      col=c*(1.-.5*smoothstep(.0,.2,depth));
    }
  }
  // spruce trees along the far shore
  float tx=uv.x*55.; float ti=floor(tx); float tf=(fract(tx)-.5)/55.;
  float th=.012+.035*h11(ti*1.3)*step(.25,h11(ti+7.));
  float yy=(uv.y-HZ)/th; float tier=fract(yy*5.+h11(ti));
  if(yy<1. && yy>-.2 && abs(tf)<(1.-yy)*(.25+.2*tier)/55.){ hit=1.; col=vec3(.006,.01,.012); }
  if(uv.y<HZ+.005){ hit=1.; col=vec3(.03,.04,.055)+glow*.05; }   // snowy shore strip
  return col;
}
vec3 skyAt(vec2 uv, float t, float px, out vec3 glow){
  vec3 rd=normalize(vec3(uv.x, uv.y-HZ+.02, 1.2));
  vec3 c=mix(vec3(.02,.05,.07), vec3(.003,.006,.018), smoothstep(-.05,.5,rd.y));
  vec3 a=aurora(rd,t);
  glow=vec3(.05,.6,.35)*.12;
  c+=starfield(uv+vec2(t*.0006,0.), px, .8)*(1.-clamp(length(a)*1.5,0.,.8));
  c+=vec3(.02,.12,.08)*exp(-max(rd.y,0.)*6.)*.35;          // green airglow near the horizon
  return c+a;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 glow; vec3 col; float hit;
  if(uv.y>=HZ){
    col=land(uv,t,skyAt(uv,t,px,glow),glow,hit);
  } else {
    // frozen lake: a mirror of the sky, slightly blurred by the ice, with cracks and snow drifts
    float d=HZ-uv.y;
    vec2 m=vec2(uv.x+(noise(vec2(uv.x*8.,d*60.))-.5)*.006*d*8., HZ+d);
    vec3 sk=skyAt(m,t,px,glow);
    vec3 r=land(m,t,sk,glow,hit)*vec3(.5,.58,.66);
    vec2 g=vec2(uv.x/(d+.02), 1./(d+.02));
    float crack=smoothstep(.015,.0,abs(fbm4(g*vec2(.9,.25))-.5))*smoothstep(.0,.08,d);
    float drift=smoothstep(.5,.75,fbm(g*vec2(.35,.12)+3.))*smoothstep(.02,.25,d);
    vec3 ice=r+vec3(.6,.8,.9)*crack*.025+glow*.03;
    vec3 snow=vec3(.05,.065,.09)*(.75+.5*noise(g*3.))+glow*.15;
    col=mix(ice, snow, drift*.9);
  }
  gl_FragColor=vec4(finish(col,uv),1.);
}`;

<script>
// ---------- 5. UNDERWATER: sun rays, dancing caustics, kelp, fish and bubbles ----------
const SEA = `
vec3 waterCol(float y){ return mix(vec3(.0,.035,.075), vec3(.03,.30,.40), smoothstep(-.4,.8,y)); }
// light focused by the wavy surface (the classic iterative caustic pattern)
float caustic(vec2 p, float t){
  p=mod(p*6.28318,6.28318)-250.; vec2 i=p; float c=1., inten=.005;
  for(int n=0;n<4;n++){
    float tt=t*(1.-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c/=4.; c=1.17-pow(c,1.4); return pow(abs(c),7.);
}
float godRays(vec2 uv, float t){
  float a=(uv.x+.25)/(1.6-uv.y);
  float r=noise(vec2(a*14., t*.15))*.6+noise(vec2(a*31.+5., t*.23))*.4;
  return pow(r,3.)*smoothstep(-.6,.55,uv.y);
}
// one kelp stalk: returns (mask, shade)
vec2 kelp(vec2 uv, float x0, float y0, float sc, float t, float seed){
  float h=uv.y-y0; if(h<0.) return vec2(0);
  float sway=sin(t*.5+seed*4.+h*2.2)*.05*h+sin(t*.9+seed+h*5.)*.012*h;
  float dx=(uv.x-x0-sway)/sc;
  float leaf=pow(max(0., sin(h/sc*5.+seed*3.)),.7)*smoothstep(.0,.15,h);
  float side=sign(sin(h/sc*3.5+seed*7.));
  float w=.012+.1*leaf*(dx*side>0.?1.:.35)*(.8+.4*noise(vec2(h/sc*3.,seed)));
  float m=smoothstep(w,w*.6,abs(dx));
  return vec2(m, .5+.5*dx/w*side);
}
// a fish seen from the side; returns (mask, shade 0 back..1 belly)
vec2 fish(vec2 uv, vec2 c, float s, float dir, float t, float seed){
  vec2 q=(uv-c)/s; q.x*=dir;
  float wig=sin(t*7.+seed*5.)*.12*smoothstep(0.,-1.,q.x);
  q.y+=wig*q.x*.5;
  float body=length(q*vec2(.55,1.45))-.5;
  vec2 tq=q-vec2(-1.05,0.); float tail=max(abs(tq.y)-(-tq.x)*.75-.05, max(tq.x-.15, -tq.x-.38));
  float d=min(body, tail*.8);
  return vec2(smoothstep(.03,-.03,d), clamp(.5-q.y*1.6,0.,1.));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 rd=normalize(vec3(uv.x, uv.y+.06, 1.3));
  vec3 col=waterCol(uv.y);
  // shimmering surface far above
  if(rd.y>.2){
    vec2 sp=rd.xz/rd.y*3.;
    float sh=caustic(sp*.35+vec2(t*.01,0.), t*.5);
    col+=vec3(.5,.85,.9)*(sh*.7+.12)*smoothstep(.2,.45,rd.y);
  }
  // sandy sea floor with ripples and caustics
  float floorZ=1e5;
  if(rd.y<0.){
    float dist=3./-rd.y; floorZ=dist; vec2 g=rd.xz*dist;
    float rip=sin(g.x*3.2+fbm4(g*.6)*5.+g.y*.6)*.5+.5;
    float grain=noise(g*25.);
    vec3 sand=mix(vec3(.55,.5,.36), vec3(.75,.68,.5), rip*.6+grain*.4);
    float rockN=fbm4(g*.35+7.); sand=mix(sand, vec3(.18,.2,.18)*(.7+.6*grain), smoothstep(.62,.7,rockN));
    float cs=caustic(g*.16, t*.55)*1.6+caustic(g*.16+.33, t*.55+1.3)*.6;
    vec3 lit=sand*(vec3(.18,.42,.5)+vec3(.8,1.,.95)*cs*(.6+.4*rip));
    float fogA=1.-exp(-dist*.09);
    col=mix(lit, waterCol(-.05), fogA);
  }
  // kelp forest: far stalks are bluer (lost in the water), near ones darker and sharper
  for(int i=0;i<12;i++){
    float fi=float(i); float z=13.-fi*.9; float sc=1.3/z;
    float x0=(mod(fi,2.)<.5?-1.:1.)*(.4+.5*h11(fi*3.7))+(h11(fi*1.1)-.5)*.2; float y0=-3.*1.3/z-.06;
    vec2 k=kelp(uv, x0, y0, sc, t, fi);
    if(k.x>0.){
      vec3 kc=mix(vec3(.04,.045,.012), vec3(.22,.19,.05), k.y*.7+smoothstep(-.2,.6,uv.y)*.3);
      kc*=(.75+.5*noise(uv*vec2(30.,6.)/sc))*(.55+.45*smoothstep(.0,.35,k.y)*smoothstep(1.,.65,k.y));
      kc+=vec3(.25,.32,.06)*smoothstep(.0,.7,uv.y)*.5*k.y;       // sunlight glowing through the leaves
      col=mix(col, mix(kc, waterCol(uv.y), 1.-exp(-z*.085)), k.x*.97);
    }
  }
  // a school of silver fish swimming by, plus a few loners
  for(int i=0;i<12;i++){
    float fi=float(i); bool school=i<9;
    float dir=school?1.:(h11(fi*5.1)>.5?1.:-1.);
    float z=school?6.+h11(fi*1.7)*2.:4.+fi*.6;
    float sp=school?.06:.04+.04*h11(fi*2.3);
    float x=mod(t*sp*dir+(school?(h11(fi*3.)-.5)*.35:h11(fi*9.)*4.),4.)-2.;
    float y=(school?.12+(h11(fi*7.3)-.5)*.2:-.2+.5*h11(fi*7.3))+.02*sin(t*.5+fi*1.3);
    vec2 f=fish(uv, vec2(x,y), .2/z, dir, t, fi);
    if(f.x>0.){
      vec3 fc=mix(vec3(.008,.02,.035), vec3(.42,.52,.56), smoothstep(.45,.9,f.y));
      fc+=vec3(.4,.55,.55)*smoothstep(.45,.55,f.y)*smoothstep(.65,.55,f.y)*.6;   // shiny side stripe
      col=mix(col, mix(fc, waterCol(y), 1.-exp(-z*.06)), f.x*.95);
    }
  }
  // sun rays from the surface
  col+=vec3(.35,.7,.75)*godRays(uv,t)*.35+vec3(.3,.6,.65)*godRays(uv*1.3+.2,t*1.3)*.2;
  // floating particles (marine snow), drifting slowly
  for(int L=0;L<2;L++){
    float fl=float(L); vec2 p=uv*(5.+fl*6.)+vec2(t*.03, t*(.02+fl*.015));
    vec2 id=floor(p); vec2 o=fract(p)-.5-(h22(id+fl)-.5)*.7;
    float d=length(o)/(5.+fl*6.)/px; float sz=fl<.5?2.2:1.2;
    col+=vec3(.6,.8,.8)*smoothstep(sz,sz*.3,d)*step(.55,h21(id*1.3+fl))*(fl<.5?.18:.25);
  }
  // bubbles rising with a wobble
  for(int i=0;i<12;i++){
    float fi=float(i); float life=5.+3.*h11(fi);
    float ph=fract(t/life+h11(fi*3.3));
    vec2 b=vec2(.55+(h11(fi*1.9)-.5)*.12+sin(t*3.+fi*2.)*.012, -.45+ph*1.15);
    float r=.006+.012*h11(fi*6.6);
    float d=length(uv-b);
    float ring=smoothstep(r,r*.75,d)*(smoothstep(r*.55,r,d)*.8+.1);
    float hl=smoothstep(r*.35,0.,length(uv-b-vec2(-r*.35,r*.35)));
    col+=vec3(.7,.9,.95)*(ring*.5+hl*.8)*smoothstep(1.,.85,ph);
  }
  gl_FragColor=vec4(finish(col*1.05,uv),1.);
}`;

<script>
// ---------- 6. MOUNTAIN: Mount Diablo at golden hour ----------
const MOUNTAIN = `
const vec2 SUNP=vec2(-.56,.14);
vec3 skyM(vec2 uv, float warm){
  float sd=length((uv-SUNP)*vec2(.8,1.));
  vec3 c=mix(vec3(1.15,.58,.24), vec3(.55,.56,.66), smoothstep(-.04,.20,uv.y));
  c=mix(c, vec3(.10,.24,.55), smoothstep(.12,.62,uv.y));
  c+=vec3(1.,.48,.16)*exp(-sd*3.)*.85*warm+vec3(1.,.78,.45)*exp(-sd*14.)*1.1;
  c+=vec3(1.,.93,.75)*smoothstep(.030,.025,length(uv-SUNP))*9.;
  return c;
}
vec3 hazeM(vec2 uv, float warm){ return mix(vec3(.36,.44,.64), vec3(1.05,.62,.32), exp(-length(uv-SUNP)*1.7)*warm); }
float rl(float x, float k){ return fbm4(vec2(x*(1.1+k*.5)+k*7.3, k*2.1)); }
float rdg(float x, float k){ float h=0., a=.5; for(int i=0;i<5;i++){ h+=a*(1.-abs(noise(vec2(x,k))*2.-1.)); x=x*2.03+1.7; a*=.47; } return h; }
float diablo(float x){
  float dx=x-.12; float w=dx<0.?.30:.42;
  float h=-.13+.32*exp(-pow(dx/w,2.))+.09*exp(-pow((x+.24)/.16,2.));
  return h+.07*(fbm(vec2(x*4.,3.))-.5)+.010*(noise(vec2(x*45.,1.))-.5)*smoothstep(.06,.16,h);
}
float layerY(float x, int k){
  if(k==0) return -.03+.13*pow(rdg(x*1.3+3.,1.),2.5);
  if(k==1) return -.09+.12*pow(rdg(x*1.7+11.,2.),2.)+.03*rl(x*3.,1.);
  if(k==2) return diablo(x);
  if(k==3) return -.25+.10*rl(x,3.)+.07*smoothstep(.2,-.7,x);
  return -.37+.05*rl(x*1.4,4.)+.11*smoothstep(-.1,.9,x);
}
// grassy hillside with ridges and canyons; dark oak woods fill the shady canyons
vec3 slopeCol(vec2 uv, vec2 q, float sl, float d, float s, vec3 sun, float cs){
  float g0=-abs(fbm4(q)-.5)+.4*fbm3(q*.5)+.04*noise(q*7.), gx=-abs(fbm4(q+vec2(.05,0.))-.5)+.4*fbm3(q*.5+vec2(.025,0.))+.04*noise(q*7.+vec2(.35,0.));
  float gul=(gx-g0)/.05;
  float lit=clamp(.58+gul*.24+sl*.9*exp(-d*4.),0.,1.);
  float dif=smoothstep(.12,.9,lit)*(1.-.6*cs);
  float oakA=smoothstep(.40,.22,lit+(fbm3(q*2.3+4.)-.5)*.35);
  float dots=smoothstep(.4,.7,noise(uv*s*8.)+noise(uv*s*17.)*.45);
  float oak=clamp(oakA*(.55+.6*dots),0.,1.);
  float gd=fbm3(vec2(uv.x*s*3., d*s*2.));
  vec3 amb=vec3(.16,.19,.30);
  vec3 alb=mix(mix(vec3(.50,.30,.11), vec3(.66,.45,.19), gd), vec3(.03,.055,.02)*(.7+.6*dots), oak*.95);
  return alb*(amb+sun*dif);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  float warm=.86+.14*sin(t*.03);
  vec3 sun=vec3(1.9,1.1,.5)*warm;
  vec3 col=skyM(uv,warm);
  // a few clouds drifting, lit gold on the side toward the sun
  if(uv.y>.06){
    vec2 cp=vec2(uv.x*1.5+t*.005, uv.y*4.);
    float dn=fbm(cp)+.15*fbm4(cp*3.-t*.01);
    float dn2=fbm(cp+normalize(SUNP-uv)*vec2(1.5,4.)*.035)+.15*fbm4(cp*3.-t*.01);
    float cm=smoothstep(.62,.74,dn)*smoothstep(.1,.22,uv.y)*smoothstep(.62,.42,uv.y);
    float lc=clamp(.5+(dn-dn2)*6.,0.,1.);
    vec3 cc=mix(vec3(.36,.36,.48), vec3(1.35,.82,.48)*warm, lc);
    col=mix(col, cc, cm*.92);
  }
  // two hawks circling high up
  for(int i=0;i<2;i++){
    float fi=float(i); float a=t*(.10+fi*.03)+fi*2.;
    vec2 c=vec2(-.1+fi*.32+.13*cos(a), .30+fi*.04+.035*sin(a));
    vec2 q=(uv-c)/(.010-fi*.003); float y0=.32*abs(q.x)-.22*q.x*q.x+.08*sin(t*1.3+fi)*abs(q.x);
    col=mix(col, vec3(.06,.05,.05), smoothstep(.28,.08,abs(q.y-y0))*step(abs(q.x),1.4)*.85);
  }
  float cs=smoothstep(.5,.72,fbm4(vec2(uv.x*1.4-t*.012, uv.y*3.)+2.));   // cloud shadows sliding over the hills
  for(int k=0;k<5;k++){
    float fk=float(k);
    float y=layerY(uv.x,k);
    float e=.004; float sl=(layerY(uv.x+e,k)-y)/e;
    float hz=k==0?.48:k==1?.32:k==2?.06:k==3?.02:0.;
    if(uv.y<y){
      float d=y-uv.y; float s=k==2?8.:k==3?13.:k==4?8.:7.;
      vec2 q=vec2(uv.x*s+sl*d*s*.8, d*s*1.3);
      if(k==2){ vec2 r=uv-vec2(.13,.22); q=vec2(uv.x*7.+r.x*d*14., d*9.); }   // ridges fan out from the summit
      vec3 c=slopeCol(uv, q, sl, d, s, sun, k>=2?cs:0.);
      if(k==2){ // rocky summit
        float rk=smoothstep(.045,.012,d+(fbm4(uv*60.)-.5)*.04)*smoothstep(.1,.17,y);
        float rn=fbm4(uv*vec2(90.,140.));
        vec3 ra=mix(vec3(.30,.27,.24), vec3(.55,.46,.36), rn);
        c=mix(c, ra*(vec3(.16,.19,.30)+sun*clamp(.35+sl*.6+(rn-.5)*1.6,0.,1.)), rk);
        float rd=abs(uv.x-.06-.04*sin(d*55.)-.3*d);   // a dusty fire road winding up
        c=mix(c, vec3(.75,.58,.40)*sun*.7, smoothstep(.0025,.0008,rd)*smoothstep(.03,.06,d)*smoothstep(.28,.16,d)*.5);
      }
      if(k==4){ // near grass: blades and wind waves
        float bl=noise(vec2(uv.x*420., uv.y*70.))*.6+noise(uv*160.)*.4; float wv=sin(uv.x*7.-t*.7+fbm3(uv*4.)*4.);
        c*=.80+.32*bl+.08*wv;
        // the winding trail climbing up the hill
        float tt=clamp((uv.y+.5)/(y+.5),0.,1.);
        float xc=.08+.2*sin(tt*4.2+.4)*(1.-tt*.6)+.05*tt;
        float w=mix(.075,.006,pow(tt,.8));
        float tr=smoothstep(w,w*.6,abs(uv.x-xc+(noise(vec2(uv.y*60.,2.))-.5)*w*.3));
        vec3 dirt=mix(vec3(.42,.32,.22), vec3(.62,.50,.36), noise(uv*vec2(80.,200.)));
        dirt*=vec3(.16,.19,.30)+sun*(1.-.6*cs)*(.55+.25*smoothstep(-1.,1.,-(uv.x-xc)/w));
        c=mix(c, dirt, tr);
      }
      hz+=(1.-hz)*.14*smoothstep(.0,.1,d)*(k<=1?1.:k==2?.3:.1);   // low valley haze
      col=mix(c, hazeM(uv,warm), hz);
    }
    // oak trees dotted on the near hills, in clumps (a tree may poke above the ridge line)
    if(k>=3){
      float cell=k==3?.026:.06;
      for(int j=-1;j<=0;j++){
        float cx=floor(uv.x/cell)+float(j);
        float cy=floor(uv.y/cell);
        for(int m=0;m<2;m++){
          vec2 id=vec2(cx, cy-float(m));
          vec2 c=(id+.3+.4*h22(id+fk))*cell;
          float yb=layerY(c.x,k);
          float r=cell*(.16+.16*h21(id+3.));
          float clump=fbm3(c*vec2(9.,14.)+fk*5.);
          if(h21(id*1.3+fk*9.)>clump*2.2-.75 || c.y>yb-r*.4 || c.y<yb-(k==3?.12:.4)) continue;
          vec2 sq=(uv-c-vec2(r*1.8,-r*.9))/vec2(r*2.4,r*.4);   // long shadow cast away from the low sun
          if(uv.y<y && length(sq)<1.) col*=mix(1., .45, smoothstep(1.,.5,length(sq))*(1.-hz));
          vec2 q=(uv-c)/r;
          float dd=min(length(q*vec2(.8,1.2)), length((q-vec2(.45,-.15))*vec2(1.,1.3))*1.1);
          dd+=(fbm3(q*3.5+id)-.5)*.6;
          if(k==4 && abs(uv.x-c.x+q.y*r*.06)<r*.08 && q.y<-.4 && q.y>-1.1) dd=min(dd,.9);
          if(dd<1.){
            float lt=clamp(.45-q.x*.45+q.y*.35+(noise(q*6.+id)-.5)*.9,0.,1.);
            vec3 tc=vec3(.06,.075,.03)*(vec3(.16,.19,.30)+sun*lt*lt*1.3);
            col=mix(col, mix(tc, hazeM(uv,warm), hz), smoothstep(1.,.85,dd));
          }
        }
      }
    }
  }
  col+=vec3(1.,.55,.25)*exp(-length(uv-SUNP)*3.5)*.10*warm;   // sun glare in the air
  gl_FragColor=vec4(finish(col,uv),1.);
}
`;

<script>
// ---------- 7. SEATTLE: the skyline at dusk across Elliott Bay ----------
const SEATTLE = `
const float SH=-.10;   // shoreline of Elliott Bay
float segD(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float litFrac(float t){ return .28+.5*smoothstep(25.,170.,t); }   // more windows switch on as it gets dark
vec3 skyS(vec2 uv, float t, float px){
  float y=uv.y-SH;
  vec3 c=mix(vec3(1.05,.44,.18), vec3(.62,.24,.30), smoothstep(.0,.14,y));
  c=mix(c, vec3(.16,.16,.38), smoothstep(.08,.34,y));
  c=mix(c, vec3(.02,.035,.13), smoothstep(.28,.62,y));
  c*=.85+.3*smoothstep(-.8,.8,uv.x);                             // brighter toward the sunset side
  float cl=fbm(vec2(uv.x*1.1+t*.004, uv.y*8.))+.2*fbm4(vec2(uv.x*4.-t*.006, uv.y*20.));
  float cm=smoothstep(.62,.85,cl)*smoothstep(.07,.2,y)*smoothstep(.55,.3,y);
  c=mix(c, mix(vec3(.95,.38,.36), vec3(.10,.08,.18), smoothstep(.1,.36,y)), cm*.8);
  c+=starfield(uv, px, .3)*smoothstep(.32,.5,y);
  return c;
}
// Mount Rainier far away: snowy, pink in the last light, half lost in the haze
vec3 rainier(vec2 uv, vec3 sky){
  float dx=uv.x-.30;
  float top=SH+.01+.135*exp(-pow(abs(dx)/.25,1.25))+.018*exp(-pow((dx-.09)/.06,2.))-.01*exp(-pow((dx+.06)/.03,2.))+.010*(fbm4(vec2(uv.x*22.,5.))-.5);
  if(uv.y>top) return sky;
  float gl=1.-abs(fbm4(vec2(uv.x*38.+(uv.y-top)*20.*sign(dx), (uv.y-top)*12.))*2.-1.);
  float lit=clamp(.55+dx*2.5+(gl-.5)*.9,0.,1.);
  vec3 snow=mix(vec3(.18,.20,.40), vec3(1.05,.55,.55), lit)*(.75+.25*smoothstep(.0,.06,top-uv.y));
  snow=mix(snow, vec3(.12,.12,.22), smoothstep(.05,.13,top-uv.y)*.6);    // dark rock lower down
  return mix(snow, sky, .5+.4*smoothstep(SH+.07,SH+.01,uv.y));
}
// one row of buildings: returns rgb + coverage
vec4 towers(vec2 uv, float t, float cw, float hmax, float seed, float near){
  float ci=floor(uv.x/cw); float lx=fract(uv.x/cw);
  float prof=exp(-pow((uv.x-.14)/.17,2.))*.9+.25*exp(-pow((uv.x-.42)/.15,2.))+.08;
  float hs=h11(ci*1.7+seed);
  float h=SH+.012+hmax*prof*(.35+.65*hs*hs);
  float m0=.02+.08*h11(ci+seed*3.), m1=1.-.02-.08*h11(ci*2.3+seed);
  float st=h11(ci*5.1+seed);
  if(st>.65 && uv.y>h-.035*hmax*3.) { m0+=.18; m1-=.18; }                                  // stepped top
  if(st>.88 && abs(lx-(m0+m1)*.5)<.012 && uv.y<h+.03*hmax*3.) return vec4(vec3(.02,.02,.035),1.);   // antenna
  if(lx<m0 || lx>m1 || uv.y>h) return vec4(0);
  float bx=(lx-m0)/(m1-m0);
  vec3 c=vec3(.018,.022,.04)+vec3(.55,.30,.32)*.10*h11(ci+9.)*smoothstep(SH,h,uv.y)*(1.-bx*.6);   // glass catching the sky
  vec2 wq=vec2(bx*floor(5.+8.*h11(ci+seed*5.)), (uv.y-SH)/.0052);
  vec2 wi=floor(wq), wf=fract(wq);
  float row=h21(vec2(ci,wi.y)+seed);
  float dark=step(.85,h11(ci*3.3+seed));
  float on=(1.-dark)*step(h21(wi+ci*31.+seed),litFrac(t)*(.5+.9*row))*step(.18,wf.x)*step(wf.x,.82)*step(.22,wf.y)*step(wf.y,.78);
  vec3 wc=mix(vec3(1.,.70,.38), vec3(.75,.85,1.), step(.7,h21(wi.yx+ci)))*(1.2+1.3*h21(wi*1.3+ci));
  c+=wc*on*near*step(uv.y,h-.004);
  if(hs>.6 && length((uv-vec2((floor(uv.x/cw)+(m0+m1)*.5)*cw, h+.003))/vec2(1.,1.))<.003)       // red light on top
    c+=vec3(2.,.15,.1)*smoothstep(.2,.8,sin(t*2.+ci));
  return vec4(c,1.);
}
// the Space Needle: legs pinched at the waist, a flying-saucer top and a spire
vec4 needle(vec2 uv, float t){
  vec2 q=uv-vec2(-.28,SH-.01); float H=.37; float y=q.y/H, x=abs(q.x);
  float d=1e3, w=.0036;
  d=min(d, segD(vec2(x,y*H), vec2(.034,0.), vec2(.0065,.33*H)));
  d=min(d, segD(vec2(x,y*H), vec2(.0065,.33*H), vec2(.019,.785*H)));
  d=min(d, segD(vec2(x,y*H), vec2(.012,0.), vec2(.003,.33*H))+.0008);
  d=min(d, abs(x)-.0022);
  if(y>.2 && y<.21) d=min(d, x-.013);   // the halo ring
  vec3 c=vec3(.025,.025,.04); float lt=0.;
  float a=smoothstep(w,w*.4,d)*step(y,.8)*step(0.,y);
  lt=a*.12*smoothstep(.0,.5,y)*(1.-smoothstep(.0,.0025,abs(d-w*.6)));
  float hw=y<.86 ? mix(.019,.054,smoothstep(.78,.86,y)) : mix(.054,.031,(y-.86)/.026);
  if(y>.78 && y<.886 && x<hw){ a=1.; lt=y<.86?.005+.045*smoothstep(.8,.86,y)*(1.-x/hw*.5):.004;
    if(y>.862 && y<.878) lt=.25+.35*step(.5,fract(q.x*420.));                 // the glowing ring of windows
  }
  if(y>.886 && y<.91 && x<.012){ a=1.; lt=.02+.5*step(.895,y)*step(y,.9); }
  if(y>.91 && y<1. && x<.0013){ a=1.; }
  vec3 o=c+vec3(1.,.72,.42)*lt*1.3;
  o+=vec3(2.5,.2,.1)*exp(-pow(length(q-vec2(0.,H))/.003,2.))*smoothstep(.3,.9,sin(t*1.8));
  return vec4(o,a);
}
vec3 above(vec2 uv, float t, float px){
  vec3 col=skyS(uv,t,px);
  col=rainier(uv,col);
  float hill=SH+.012+.02*fbm4(vec2(uv.x*4.,2.))*smoothstep(-.1,-.6,uv.x)+.006;                 // low hills with houses
  if(uv.y<hill){ col=vec3(.025,.03,.05);
    vec2 g=uv*vec2(260.,300.); vec2 gi=floor(g); float hl=step(.9,h21(gi))*smoothstep(.35,.1,length(fract(g)-.5));
    col+=vec3(1.,.72,.4)*hl*1.4*step(h21(gi+3.),litFrac(t)+.2); }
  vec4 b=towers(uv,t,.019,.13,1.,.6); col=mix(col, mix(b.rgb, col, .3), b.a);
  b=towers(uv,t,.03,.26,7.,1.); col=mix(col, b.rgb, b.a);
  // the tallest tower (dark, with stepped corners) right in the middle of downtown
  float cx=abs(uv.x-.13); float ct=SH+.31-step(.012,cx)*.02-step(.019,cx)*.025;
  if(cx<.026 && uv.y<ct){ col=vec3(.012,.014,.028)+vec3(.4,.2,.25)*.06*smoothstep(SH,ct,uv.y);
    vec2 wq=vec2(uv.x*520., (uv.y-SH)/.005); col+=vec3(1.,.75,.45)*1.4*step(h21(floor(wq)),litFrac(t)*.7)*step(.3,fract(wq.x))*step(.3,fract(wq.y)); }
  // waterfront: piers and a row of lights along the shore
  if(uv.y<SH+.006){ col=vec3(.02,.022,.035); vec2 g=vec2(uv.x*180., 0.); float li=step(.5,h21(floor(g)))*smoothstep(.4,.1,abs(fract(g.x)-.5));
    col+=vec3(1.,.8,.5)*li*smoothstep(.003,.0,abs(uv.y-SH-.0035))*3.; }
  vec4 n=needle(uv,t); col=mix(col, n.rgb, n.a);
  return col;
}
// the Washington State ferry: white decks, green stripe, rows of warm windows
vec4 ferry(vec2 q){
  float L=.12;
  if(q.y<0. || q.y>.043 || abs(q.x)>L) return vec4(0);
  vec3 wh=vec3(.12,.12,.17); vec3 c=vec3(0); float a=0.;
  float hullL=L-.016*(1.-q.y/.011);
  if(q.y<.011 && abs(q.x)<hullL){ a=1.; c=wh*.8; if(q.y>.0065 && q.y<.009) c=vec3(.02,.12,.07); if(q.y<.0025) c=vec3(.03); }
  if(q.y>=.011 && q.y<.022 && abs(q.x)<L*.86){ a=1.; c=wh; if(q.y>.0135 && q.y<.019 && fract(q.x*190.)>.35) c=vec3(1.6,1.1,.6); }
  if(q.y>=.022 && q.y<.03 && abs(q.x)<L*.62){ a=1.; c=wh*.9; if(q.y>.0235 && q.y<.028 && fract(q.x*170.)>.4) c=vec3(1.5,1.,.55); }
  if(q.y>=.03 && q.y<.036 && abs(abs(q.x)-L*.45)<.008){ a=1.; c=wh*.8; }
  if(q.y>=.03 && q.y<.043 && abs(q.x)<.0045){ a=1.; c=q.y>.039?vec3(.02):vec3(.3,.3,.36); }
  return vec4(c,a);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col;
  vec2 fp=vec2(-1.+mod(t*.006+.55,2.), SH-.11);                 // ferry position
  if(uv.y>=SH) col=above(uv,t,px);
  else {
    float d=SH-uv.y;
    float z=1./(d+.012); vec2 wp=vec2(uv.x*z*1.5, z*9.);
    float rip=fbm3(wp*vec2(1.,.35)+vec2(t*.15,t*.5))+.5*noise(wp*vec2(2.5,.9)-vec2(0.,t*.8));
    float wob=(rip-.75)*.010*(.4+d*6.);
    float str=(rip-.75)*d*.45;
    vec2 m=vec2(uv.x+wob, SH+d*.75+str);
    vec3 refl=above(m,t,px);
    float fr=.75-.45*smoothstep(.0,.35,d);
    vec3 base=vec3(.012,.025,.05);
    col=base+refl*fr*vec3(.38,.40,.52)*(.7+.6*smoothstep(.4,1.1,rip));
    col+=vec3(.9,.45,.4)*pow(noise(vec2(uv.x*60., d*500.+t*1.2)),6.)*.25*smoothstep(.3,.0,d);   // tiny sparkles
    // ferry reflection and its wake
    float fd=fp.y-uv.y;
    if(fd>0. && fd<.045){ vec4 fr2=ferry(vec2(uv.x-fp.x+wob*1.5, fd)); col=mix(col, fr2.rgb*.45, fr2.a*.8); }
    vec2 wq=uv-fp; float back=-wq.x-.07;
    if(back>0. && back<.6){
      float spread=.004+back*.03;
      float foam=smoothstep(spread*.4,0.,abs(abs(wq.y+.001)-spread*.55))*noise(vec2(uv.x*120.,uv.y*400.));
      col+=vec3(.35,.35,.45)*foam*exp(-back*5.)*.8;
    }
  }
  vec4 f=ferry(uv-fp); col=mix(col, f.rgb, f.a);
  gl_FragColor=vec4(finish(col,uv),1.);
}
`;

<script>
// ---------- 8. FALLING LEAVES: a big autumn tree with sunbeams ----------
const LEAVES = `
const vec2 SUNL=vec2(.42,.40);
const float GY=-.17;   // where the grass meets the far park
float capsule(vec2 p, vec2 a, vec2 b, float ra, float rb){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(ra,rb,h); }
vec3 leafHue(float k){ return k<.5 ? mix(vec3(.62,.07,.03), vec3(.95,.34,.04), k*2.) : mix(vec3(.95,.34,.04), vec3(1.,.70,.10), k*2.-1.); }
// how much of the big tree's leaves cover this spot (cheap version, also used for the sunbeams)
float crownV(vec2 p, float t){
  vec2 q=(p-vec2(-.06,.33))/vec2(.62,.34);
  float sh=length(q)+(fbm4(p*2.6+3.)-.5)*.6;
  vec2 w=p+vec2(sin(t*.6+p.y*3.)*.004, 0.);
  float f=fbm4(w*11.)*.75+noise(w*42.)*.25;
  float v=(1.-sh)*.75+(f-.5)*1.3-.04*smoothstep(.55,.75,noise(w*7.))+(noise(w*95.)-.5)*.07;
  return v;
}
float crown(vec2 p, float t){ return smoothstep(.0,.025,crownV(p,t)); }
float branches(vec2 p){
  float d=capsule(p, vec2(-.12,-.34), vec2(-.085,.12), .048, .03);
  d=min(d, capsule(p, vec2(-.085,.10), vec2(-.42,.33), .024, .006));
  d=min(d, capsule(p, vec2(-.08,.12), vec2(.30,.40), .022, .006));
  d=min(d, capsule(p, vec2(-.085,.14), vec2(-.04,.56), .022, .007));
  d=min(d, capsule(p, vec2(-.10,.02), vec2(-.36,.15), .016, .004));
  d=min(d, capsule(p, vec2(-.25,.22), vec2(-.20,.45), .009, .003));
  d=min(d, capsule(p, vec2(.10,.26), vec2(.20,.50), .009, .003));
  d=min(d, capsule(p, vec2(-.08,.04), vec2(.15,.18), .013, .004));
  d=min(d, capsule(p, vec2(.06,.14), vec2(.36,.22), .008, .002));
  return d+(noise(p*90.)-.5)*.003;
}
// one maple-ish leaf; returns (mask, side shade)
vec2 leafShape(vec2 q, float s, float blur){
  float a=atan(q.x,q.y); float r=length(q)/s;
  float R=.62+.38*pow(abs(cos(a*2.5)),.7)-.18*smoothstep(.6,1.,abs(a)/PI);
  float m=smoothstep(R, R-.12-blur, r);
  m=max(m, smoothstep(.06+blur,.0,abs(q.x)/s)*step(q.y,0.)*step(-.95,q.y/s)); // the stem
  return vec2(m, .5+.5*q.x/s);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 sunC=vec3(1.5,1.05,.6);
  float sg=exp(-length(uv-SUNL)*3.);
  // soft, out-of-focus park behind the tree
  vec3 col=mix(vec3(1.0,.78,.48), vec3(.38,.55,.80), smoothstep(-.05,.5,uv.y-uv.x*.2));
  col+=sunC*sg*.5+vec3(1.,.9,.7)*exp(-length(uv-SUNL)*14.)*1.4;
  float bg=fbm4(vec2(uv.x*3.5, uv.y*2.)+5.);
  float far=smoothstep(GY+.10+.22*bg, GY+.04+.22*bg, uv.y);
  float bn=fbm4(uv*7.+2.);
  vec3 farC=mix(vec3(.10,.14,.04), leafHue(fbm4(uv*2.5)), smoothstep(.35,.6,fbm4(uv*3.+7.)))*(.35+.9*bn)*(.6+.5*sg)+sunC*sg*.12;
  col=mix(col, farC, far*.92);
  // bokeh: soft discs of light in the background trees
  for(int i=0;i<10;i++){ float fi=float(i); vec2 bp=vec2(h11(fi*3.1)*1.8-.9, GY+.02+.18*h11(fi*7.3)); float br=.018+.02*h11(fi);
    col+=sunC*.10*smoothstep(br,br*.85,length(uv-bp))*(.4+sg); }
  // grass, sunlit with long dappled shadow under the tree
  if(uv.y<GY){
    float z=.12/(GY-uv.y+.02); vec2 g=vec2(uv.x*z, z);
    float gr=fbm4(g*vec2(3.,6.)); float bl=noise(vec2(uv.x*500., uv.y*60.));
    vec3 grass=mix(vec3(.08,.13,.025), vec3(.34,.38,.08), gr)*(.6+.5*bl);
    float shade=smoothstep(.5,.0,length((uv-vec2(-.2,-.3))/vec2(.75,.2)));
    float dap=smoothstep(.45,.65,fbm4(uv*vec2(14.,30.)+vec2(sin(t*.5)*.05,0.)));
    float lt=mix(1., .25+.6*dap, shade);
    col=grass*(vec3(.18,.2,.26)+sunC*lt*.9);
    // fallen leaves scattered on the grass
    vec2 c=uv*vec2(60.,110.)/(1.+(GY-uv.y)*1.5); vec2 ci=floor(c); vec2 cf=fract(c)-.5-(h22(ci)-.5)*.4;
    float lm=smoothstep(.32,.22,length(cf*vec2(1.,1.4+.6*h21(ci+3.))))*step(h21(ci),.35+.4*shade);
    col=mix(col, leafHue(h21(ci*1.7))*(vec3(.18,.2,.26)+sunC*lt)*(.6+.5*cf.y), lm);
    col=mix(col, farC*.8, smoothstep(GY-.07,GY,uv.y)*.8);
  }
  // sunbeams: light that slips through gaps in the leaves (sampled along the line toward the sun)
  float beam=0.;
  for(int i=0;i<10;i++){ float f=(float(i)+h21(gl_FragCoord.xy+t))/10.; vec2 sp=mix(uv,SUNL,f*.7); beam+=1.-crown(sp,t)*.92; }
  beam/=10.;
  float beamDir=.6+.4*noise(vec2(atan(uv.y-SUNL.y,uv.x-SUNL.x)*30., t*.1));
  // tree trunk and branches (warm bark, lit from the right)
  float bd=branches(uv);
  if(bd<.004){
    float u=clamp((uv.x+.105-.035*(uv.y+.3))/.05,-1.,1.);
    float bark=noise(vec2(uv.x*140., uv.y*9.))*.6+noise(uv*vec2(60.,25.))*.4;
    vec3 bc=mix(vec3(.05,.035,.025), vec3(.22,.15,.10), bark)*(vec3(.18,.18,.22)+sunC*clamp(.15+u*.6,0.,1.)*.8);
    vec2 gn=vec2(branches(uv+vec2(.002,0.))-bd, branches(uv+vec2(0.,.002))-bd)/.002;
    bc+=sunC*vec3(.30,.20,.12)*pow(clamp(dot(gn,normalize(SUNL-uv)),0.,1.),2.)*smoothstep(-.012,.0,bd);
    col=mix(col, bc, smoothstep(.004,.0,bd));
  }
  // the leaf pile at the bottom of the trunk
  vec2 pq=(uv-vec2(-.11,-.335))/vec2(.36,.10);
  float ptop=.95*pow(max(1.-pq.x*pq.x,0.),.8)+(fbm4(vec2(uv.x*40.,1.))-.5)*.3;
  float pbot=-.6*sqrt(max(1.-pq.x*pq.x,0.));
  col*=1.-.5*smoothstep(1.3,.8,length(pq*vec2(.9,1.6)-vec2(-.05,-.2)));          // soft shadow around the pile
  if(abs(pq.x)<1. && pq.y<ptop && pq.y>pbot+(noise(uv*vec2(90.,40.))-.5)*.1){
    float best=0.; vec3 lc=vec3(0);
    for(int j=0;j<3;j++){
      float fj=float(j); vec2 c=rot(fj*1.1)*uv*vec2(80.+fj*25.,120.+fj*30.)+fj*vec2(.33,.5); vec2 ci=floor(c);
      vec2 cf=(fract(c)-.5-(h22(ci+fj*3.)-.5)*.5)*rot(h21(ci+fj)*6.28);
      float m=smoothstep(.5,.3,length(cf*vec2(1.,1.5))/(.75+.5*h21(ci*1.9+fj)));
      if(m>best*.9){ best=m; lc=leafHue(fract(h21(ci*1.3+float(j)*7.)*.7+fbm4(uv*9.)*.6))*(.65+.5*(cf.y+.5)); }
    }
    float lump=fbm4(uv*vec2(18.,26.));
    float lt=clamp(.15+(pq.y-pbot)/(ptop-pbot+.001)*.6+pq.x*.15+(lump-.5)*.9,0.,1.);
    col=lc*(vec3(.12,.1,.12)+sunC*lt*lt*.95)*(.5+.5*best);
  }
  // the crown of leaves: glowing where the sun shines through, darker deep inside
  float cv=crownV(uv,t); float cr=smoothstep(.0,.025,cv);
  float lm=0., lb=0.;
  for(int j=0;j<3;j++){ float fj=float(j); vec2 c=rot(fj*.9)*uv*(62.+fj*17.)+fj*vec2(.5,.37)+vec2(sin(t*.7+uv.y*9.)*.08,0.); vec2 ci=floor(c);
    vec2 cf=(fract(c)-.5-(h22(ci+fj)-.5)*.5)*rot(h21(ci+fj*5.)*6.28); float m=smoothstep(.42,.24,length(cf*vec2(1.,1.6))/(.7+.5*h21(ci*2.1+fj)));
    if(m>lm){ lm=m; lb=h21(ci*1.7+float(j)*3.); } }
  cr*=mix(lm, 1., smoothstep(.03,.14,cv));                                         // leafy, ragged edge
  if(cr>0.){
    float hue=fbm4(uv*3.+1.3)*1.5-.35+(noise(uv*40.)-.5)*.35;
    vec3 lc=leafHue(clamp(hue,0.,1.));
    vec2 sd=normalize(SUNL-uv);
    float C0=fbm4(uv*7.+1.), C1=fbm4((uv+sd*.015)*7.+1.);                       // big leaf clumps
    float clLit=clamp(.45+(C0-C1)*12.,0.,1.);
    float top=smoothstep(.2,.65,C0);                                               // gaps between clumps are shady
    float under=smoothstep(.25,-.02,uv.y);                                         // the underside of the crown is darker
    float lv=noise(uv*160.); float lv2=noise(uv*330.+7.);
    vec3 sl=mix(lc, vec3(.80,.16,.04), .5*(1.-clLit*top));
    vec3 cc=sl*(vec3(.12,.07,.06)+sunC*(.08+.85*clLit*top)*(1.-.6*under))*(.75+.3*lv)*mix(.4,.75+.6*lb,lm);
    cc+=lc*lc*sunC*(sg*1.2+.15)*(1.-smoothstep(.07,.22,cv))*(1.-.5*under);           // light shining through thin edges
    col=mix(col, cc, cr);
  }
  col+=sunC*vec3(1.,.9,.7)*pow(beam,3.)*beamDir*smoothstep(1.,.0,length(uv-SUNL))*.45*(1.-cr*.85);
  // falling leaves: swinging like little pendulums, flipping and tumbling down
  for(int i=0;i<26;i++){
    float fi=float(i);
    float z=.6+1.6*h11(fi*1.7);                                                  // depth: big = near
    float sp=.035+.03*h11(fi*2.3); float y0=.32+.15*h11(fi*5.1), y1=-.30-.15*h11(fi*6.2);
    float P=(y0-y1)/sp; float ph=fract(t/P+h11(fi*9.7)); float cyc=floor(t/P+h11(fi*9.7));
    float w=1.4+1.2*h11(fi*3.3+cyc); float tt=t*w+fi*4.;
    vec2 pos=vec2(-.6+1.3*h11(fi*4.4+cyc*1.31)+ph*.25+.09*sin(tt)*z, mix(y0,y1,ph)-.012*abs(cos(tt)));
    float s=.010*z;
    vec2 q=uv-pos; if(dot(q,q)>s*s*4.) continue;
    q=rot(.9*cos(tt)+fi+t*.4*sign(h11(fi)-.5))*q;
    float flip=cos(tt*.7+fi*2.); q.x/=max(abs(flip),.18);
    vec2 lf=leafShape(q, s, .04*abs(z-1.2));
    vec3 lc=leafHue(h11(fi*8.1+cyc))*(vec3(.2,.18,.2)+sunC*(.45+.45*lf.y)*(flip>0.?1.:.6));
    col=mix(col, lc, lf.x*smoothstep(1.,.93,ph)*smoothstep(0.,.03,ph));
  }
  gl_FragColor=vec4(finish(col*.92,uv),1.);
}
`;

<script>
// ---------- 9. SNOWY FOREST at twilight ----------
const SNOWY = `
vec3 fogS(float y){ return mix(vec3(.22,.27,.46), vec3(.15,.20,.38), smoothstep(-.1,.2,y)); }
float groundY(float x, float k){ return -.03-k*.085+.018*(fbm4(vec2(x*(1.5+k*.4)+k*5., k))-.5); }
// one snowy spruce in cell ti of row k; returns rgb + coverage
vec4 spruce(vec2 uv, float k, float t, float K, float ti){
  float jit=(h11(ti*1.7+k)-.5)*.5;
  if(h11(ti*3.1+k*7.)<(k==3.?.4:.1)) return vec4(0);                        // a few gaps
  float cx=(ti+.5+jit)/K-k*.37/K;
  if(k>=1. && abs(cx-.20)<(k==1.?.07:k==2.?.10:.22)) return vec4(0);           // keep the cabin visible
  float base=groundY(cx,k)-.004;
  float H=(k==0.?.15:k==1.?.24:k==2.?.42:.85)*(.65+.55*h11(ti*2.3+k));
  float yy=(uv.y-base)/H;
  if(yy<-.05 || yy>1.) return vec4(0);
  float x=uv.x-cx-sin(t*.4+ti)*.002*yy*yy;
  float wmax=H*.27*pow(max(1.-yy,0.),.95)+H*.006;
  float ax=abs(x)/max(wmax,.0001);
  float N=7.+4.*h11(ti+k*3.);
  float tc=yy*N+h11(ti*5.+k)+ax*ax*.55+(noise(vec2(x*90./H, yy*N*.5+ti))-.5)*.35;                                       // branch tips droop down
  float tier=fract(tc);
  float rag=(noise(vec2(uv.y*N/H*1.5, ti+x*200./H))-.5)*.3+(noise(vec2(uv.y, x)*500./H+ti)-.5)*.3;
  float hw=wmax*(.45+.55*(1.-tier)+rag);
  float m=smoothstep(hw,hw-.0012-.0015*(3.-k),abs(x));
  m=max(m, step(abs(x),H*.02)*step(yy,.08)*step(-.05,yy));
  if(m<=0.) return vec4(0);
  // snow sits on top of each layer of branches; dark needles show underneath
  float sn=smoothstep(.35,.62,tier+(noise(vec2(x*400./H,uv.y*300./H))-.5)*.5)*smoothstep(.02,.1,yy);
  sn=max(sn, smoothstep(.85,.97,yy));
  vec3 needles=vec3(.008,.018,.024)*(.7+.6*noise(vec2(x,uv.y)*600./H));
  vec3 snow=mix(vec3(.18,.24,.44), vec3(.40,.48,.74), clamp(tier*.9-x/wmax*.15,0.,1.))*(.85+.25*noise(vec2(x,uv.y)*450./H));
  return vec4(mix(needles, snow, sn*.95), m);
}
vec4 spruces(vec2 uv, float k, float t){
  float K=k==0.?24.:k==1.?14.:k==2.?7.:3.6;
  float tx=uv.x*K+k*.37; float ti=floor(tx);
  vec4 r=vec4(0);
  for(int j=-1;j<=1;j++){ vec4 s=spruce(uv,k,t,K,ti+float(j)); if(s.a>r.a) r=s; }
  return r;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  // twilight sky: the last glow low down, deep blue above, first stars
  vec3 col=mix(vec3(.46,.36,.48), vec3(.16,.22,.44), smoothstep(-.05,.16,uv.y));
  col=mix(col, vec3(.015,.03,.10), smoothstep(.1,.5,uv.y));
  col+=starfield(uv, px, .55)*smoothstep(.15,.4,uv.y);
  vec2 cab=vec2(.20,groundY(.20,1.)+.002);
  for(int ki=0;ki<4;ki++){
    float k=float(ki);
    float gy=groundY(uv.x,k);
    float hz=k==0.?.62:k==1.?.42:k==2.?.2:.0;
    if(uv.y<gy){ // snowy ground with soft drifts and blue shadows
      float d=gy-uv.y;
      float z=1./(uv.y+.62); vec2 gp=vec2(uv.x*z*2., z*6.);
      float dr=fbm4(gp+k*3.), dr2=fbm4(gp+vec2(.0,.06)+k*3.);
      float lit=clamp(.55+(dr2-dr)*9.,0.,1.);                                       // drifts lit by the sky, blue in the dips
      vec3 g=mix(vec3(.13,.17,.34), vec3(.40,.47,.72), lit)*(.9+.12*noise(gp*30.));
      g+=vec3(.9,.95,1.)*step(.985,h21(floor(gl_FragCoord.xy*.7)))*smoothstep(.4,1.,sin(t*2.+h21(floor(gl_FragCoord.xy))*40.))*.4*(k*.3);   // sparkles
      col=mix(g, fogS(uv.y), hz);
      // warm light from the cabin window spilling on the snow
      col+=vec3(1.,.55,.2)*.18*exp(-length((uv-cab-vec2(.0,-.02))*vec2(4.,14.))*2.)*step(1.,k);
    }
    if(ki==1){ // the little log cabin far away, with a glowing window and chimney smoke
      vec2 q=uv-cab;
      float wall=step(abs(q.x),.045)*step(0.,q.y)*step(q.y,.032);
      float roof=step(q.y,.032+.03-abs(q.x)*.7)*step(.028,q.y)*step(abs(q.x),.056);
      float chim=step(abs(q.x-.022),.005)*step(q.y,.072)*step(.04,q.y);
      if(wall+roof+chim>0.){
        vec3 c=vec3(.05,.035,.035)*(.8+.4*step(.5,fract(q.y*260.)));
        if(roof>0.) c=mix(vec3(.45,.52,.78), vec3(.62,.70,.95), smoothstep(.0,.06,q.y-.028+abs(q.x)*.3));
        if(chim>0.) c=vec3(.04,.035,.04);
        vec2 w=q-vec2(-.014,.012); float win=step(abs(w.x),.009)*step(abs(w.y),.007);
        float mun=step(abs(w.x),.0008)+step(abs(w.y),.0008);
        c=mix(c, vec3(2.2,1.15,.45)*(.9+.1*sin(t*3.)*sin(t*1.7)), win*(1.-min(mun,1.)));
        col=mix(c, fogS(uv.y), .42);
      }
      col+=vec3(1.,.55,.22)*.22*exp(-length(q-vec2(-.014,.012))*40.);          // glow around the window
      vec2 sq=q-vec2(.022,.075); if(sq.y>0.){
        float sm=fbm4(vec2(sq.x*40.-sq.y*12.-sin(sq.y*20.+t*.3)*.6, sq.y*18.-t*.25));
        col=mix(col, vec3(.35,.38,.55), smoothstep(.5,.75,sm)*smoothstep(.02+sq.y*.6,0.,abs(sq.x-sq.y*sq.y*.8))*smoothstep(.2,.0,sq.y)*.5);
      }
    }
    vec4 tr=spruces(uv,k,t);
    col=mix(col, mix(tr.rgb, fogS(uv.y), hz), tr.a);
  }
  // falling snow in layers: far flakes small and slow, near flakes big and soft
  for(int l=0;l<4;l++){
    float fl=float(l); float cs=.025+fl*.028; float sp=.025+fl*.022;
    vec2 p=uv+vec2(t*.008+sin(t*.25+fl)*.02, t*sp);
    vec2 id=floor(p/cs); vec2 f=fract(p/cs)-.5;
    if(h21(id+fl*7.)>.3) continue;
    vec2 o=(h22(id+fl)-.5)*.4+vec2(sin(t*(.8+h21(id)*.6)+h21(id*3.)*6.)*.1,0.);
    float r=(.025+.03*h21(id*2.+fl))*(1.+fl*.25); float blur=.02+fl*.03;
    float fm=smoothstep(r+blur, r*.3, length(f-o));
    col=mix(col, vec3(.62,.68,.88), fm*(.5+.1*fl));
  }
  gl_FragColor=vec4(finish(col*1.05,uv),1.);
}
`;
</script>
<script>
// ---------- 10. WATERFALL with mist and a rainbow ----------
const FALLS = `
const float TOP=.40, POOL=-.20;
float fallW(float y){ return .055+.05*clamp((TOP-y)/(TOP-POOL),0.,1.); }
// wet basalt cliff with ledges: height field for bump lighting
float rockH(vec2 p){ return .6*fbm(p*vec2(3.5,1.1))+.4*fbm4(p*vec2(11.,4.5))+.12*noise(p*vec2(45.,28.)); }
vec3 rockCol(vec2 p, float wet, vec3 sunC){
  float h=rockH(p), hx=rockH(p+vec2(.003,0.)), hy=rockH(p+vec2(0.,.003));
  vec3 n=normalize(vec3((h-hx),(h-hy),.006));
  vec3 L=normalize(vec3(-.5,.6,.6));
  float dif=max(dot(n,L),0.);
  float moss=smoothstep(.3,.7,n.y+(fbm4(p*9.)-.5)*.8)*smoothstep(.3,.6,fbm4(p*4.+3.))*smoothstep(.2,.6,noise(p*110.)+.35);
  vec3 alb=mix(vec3(.025,.024,.022), vec3(.075,.07,.06), fbm4(p*20.));
  alb=mix(alb, mix(vec3(.02,.04,.008), vec3(.06,.10,.02), fbm4(p*30.)), moss);
  alb*=1.-.45*wet;
  alb*=.65+.5*noise(p*vec2(120.,70.))+.25*noise(p*260.);   // fine grit and lichen
  vec3 c=alb*(vec3(.12,.16,.16)+sunC*(.25+.75*dif)*.8)*(.55+.6*smoothstep(.3,.9,h));
  c+=vec3(.6,.7,.7)*pow(max(dot(reflect(-L,n),vec3(0,0,1)),0.),20.)*wet*.4;   // wet shine
  return c;
}
// one fern frond: a curved stem with leaflets getting smaller toward the tip
float fern(vec2 p, vec2 base, float ang, float len, float bend, float t){
  vec2 q=rot(ang+sin(t*.8+base.x*9.)*.03)*(p-base);
  float u=q.y/len; if(u<0. || u>1.) return 0.;
  float sy=q.x-bend*u*u*len;
  float w=len*.24*(1.-u)*sqrt(u*4.+.02);
  float k=u*16.+abs(sy)/len*9.;
  float leaf=smoothstep(.5,.25,abs(fract(k)-.5)+abs(sy)/max(w,.0001)*.35);
  return max(step(abs(sy),len*.008), leaf*step(abs(sy),w));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 sunC=vec3(1.45,1.25,.95);
  // bright sky and forest canopy above the cliff top
  vec3 col=mix(vec3(.85,.92,.95), vec3(.45,.65,.85), smoothstep(.35,.6,uv.y));
  float lip=TOP+.015+.04*fbm4(vec2(uv.x*3.,1.))-.02*smoothstep(.15,.0,abs(uv.x));
  float forest=lip+.05+.12*fbm(vec2(uv.x*4.,2.))+.08*smoothstep(.1,.6,abs(uv.x));
  if(uv.y<forest){ float f=fbm(uv*vec2(18.,22.)); col=mix(vec3(.01,.025,.008), vec3(.07,.13,.03), f)*(.4+1.*smoothstep(.3,.8,fbm4(uv*30.)))*(1.+.8*smoothstep(forest-.03,forest,uv.y));
    col=mix(col, vec3(.45,.55,.6), .15); }
  // the cliff: darker and wetter close to the falls
  float fw=fallW(uv.y);
  if(uv.y<lip){
    float wet=smoothstep(fw*2.6,fw,abs(uv.x));
    col=rockCol(uv,wet,sunC)*(.75+.25*smoothstep(-.3,.4,uv.y));
    col*=1.-.55*smoothstep(fw*2.2,fw*.8,abs(uv.x))*step(POOL,uv.y);          // shady hollow behind the water
    col*=1.-.45*smoothstep(.25,.8,abs(uv.x));                                // the cliff curves toward us at the sides
  }
  // the waterfall: fast streaks of white water, see-through at the thin edges
  float ex=abs(uv.x)/fw+(noise(vec2(uv.y*12.,t*.5))-.5)*.12;
  if(ex<1.2 && uv.y<lip+.005 && uv.y>POOL-.02){
    float yy=uv.y+t*.55; float sx=uv.x/fw;
    float s1=fbm4(vec2(sx*9., yy*3.)), s2=noise(vec2(sx*36., yy*9.+t*.6)), s3=noise(vec2(sx*80., yy*20.+t));
    float dens=smoothstep(1.15,.75,ex)*(.55+.45*s1)+.25*s2-.1;
    float wtr=clamp(dens*1.3,0.,1.)*(.75+.25*s3);
    float acc=clamp((lip-uv.y)/.08,0.,1.);
    vec3 wc=mix(vec3(.30,.38,.36), vec3(1.05,1.08,1.05), smoothstep(.25,.85,wtr*(.6+.4*acc)));
    wc*=.85+.3*smoothstep(.5,.9,s2)*(1.-ex*.6);
    wc=mix(wc, vec3(.12,.2,.17), smoothstep(.12,.0,lip-uv.y)*.6);   // glassy green lip
    col=mix(col, wc, clamp(wtr*1.4,0.,1.)*smoothstep(1.2,.95,ex));
  }
  // the pool: dark green water, rings of ripples, drifting foam
  float wl=POOL+.012*(fbm4(vec2(uv.x*9.,4.))-.5)*smoothstep(fw*1.2,fw*2.,abs(uv.x));
  if(uv.y<wl){
    float d=max(POOL-uv.y,0.); float z=1./(d+.03);
    vec2 g=vec2(uv.x*z, z*2.);
    float rip=sin(length(vec2(uv.x,(uv.y-POOL)*4.))*90.-t*4.)*.5+.5;
    vec3 water=mix(vec3(.004,.012,.01), vec3(.012,.03,.022), fbm4(g*2.+t*.1));
    float refl=smoothstep(fw*1.6,0.,abs(uv.x+(noise(vec2(uv.y*80.,t))-.5)*.02))*smoothstep(.25,.0,d);
    water+=vec3(.5,.55,.55)*refl*(.3+.4*rip)*.45;
    water+=vec3(.25,.3,.3)*pow(noise(g*vec2(6.,1.5)-vec2(0.,t*.8)),5.)*.25;
    float fm=smoothstep(.6,.85,fbm4(g*vec2(3.,1.5)+vec2(0.,-t*.25)))*smoothstep(.3,.0,d)*smoothstep(.0,.02,d);
    water=mix(water, vec3(.55,.6,.6), fm*.5);
    col=water;
  }
  // white churning foam where the water lands
  vec2 fq=(uv-vec2(0.,POOL+.01))/vec2(fw*2.,.05);
  float foam=smoothstep(1.,.3,length(fq)+(fbm4(uv*vec2(30.,40.)+vec2(0.,t*1.5))-.5)*.8);
  col=mix(col, vec3(1.,1.02,1.), clamp(foam,0.,1.)*.95);
  // mist billowing up and drifting, with a rainbow in it
  vec2 mp=uv-vec2(0.,POOL);

  col+=vec3(1.,.95,.8)*pow(ray,3.)*.12*(.3+mist);

<script>
// ---------- 11. DESERT DUNES at sunrise ----------
const DUNES = `
// dune profile: long gentle slope up, a sharp crest, then a steep slip face down
float duneP(float f){ return f<.75 ? pow(f/.75,1.7) : pow((1.-f)/.25,1.25); }
float duneS(vec2 p){ vec2 q=p*.085; return -q.x*.9-q.y*.3+fbm3(q*.6)*1.8; }
float H(vec2 p){
  vec2 q=p*.085;
  float h=(2.4+1.6*noise(q*.6+3.))*duneP(fract(duneS(p)));
  vec2 q2=p*.24; float s2=-q2.x-q2.y*.5+fbm3(q2*.8+5.)*1.6;
  return h+.14*duneP(fract(s2));
}
vec3 skyD(vec3 rd, vec3 sd){
  float e=rd.y; float sa=max(dot(rd,sd),0.);
  vec3 c=mix(vec3(1.25,.56,.26), vec3(.62,.52,.56), smoothstep(-.02,.14,e));
  c=mix(c, vec3(.16,.32,.62), smoothstep(.1,.5,e));
  c+=vec3(1.,.48,.18)*pow(sa,8.)*.9+vec3(1.,.7,.4)*pow(sa,90.)*1.2;
  c+=vec3(1.7,.95,.45)*smoothstep(.99935,.9995,sa)*2.6;                  // the big low sun
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 sd=normalize(vec3(.42,.065,.9));
  vec3 ro=vec3(t*.06, 5.2, t*.02);
  vec3 rd=normalize(vec3(uv.x, uv.y-.10, 1.25));
  vec3 col;
  float tt=.5; bool hit=false;
  for(int i=0;i<130;i++){
    vec3 p=ro+rd*tt; float d=p.y-H(p.xz);
    if(d<.0015*tt){ hit=true; break; }
    if(tt>300.) break;
    tt+=max(d*(tt>25.?.55:.35), .006*tt);
  }
  if(hit){ float a=tt*.97, b=tt; for(int i=0;i<6;i++){ float m=(a+b)*.5; vec3 p=ro+rd*m; if(p.y-H(p.xz)>0.) a=m; else b=m; } tt=b; }
  vec3 haze=skyD(normalize(vec3(rd.x,.01,rd.z)),sd)*vec3(.72,.58,.5);
  if(hit){
    vec3 p=ro+rd*tt; float e=.004*tt+.01;
    float h0=H(p.xz);
    vec3 n=normalize(vec3(h0-H(p.xz+vec2(e,0.)), e, h0-H(p.xz+vec2(0.,e))));
    // wind ripples in the sand, fading with distance
    float fade=exp(-tt*.09);
    float rp=dot(p.xz,vec2(.35,1.))*48.+fbm3(p.xz*.8)*12.;
    n=normalize(n+vec3(.35,0.,1.)*cos(rp)*.07*fade*smoothstep(1.5,5.,tt));
    // soft shadow from the dunes in front of the sun
    float sh=1., st=.15;
    for(int i=0;i<22;i++){ vec3 q=p+n*.03+sd*st; float dd=q.y-H(q.xz); sh=min(sh, 10.*dd/st); st+=.25+st*.18; if(sh<0. || st>40.) break; }
    sh=clamp(sh,0.,1.); sh=sh*sh*(3.-2.*sh);
    float dif=max(dot(n,sd),0.);
    vec3 alb=mix(vec3(.80,.44,.21), vec3(.92,.56,.28), noise(p.xz*1.5))*(.92+.16*noise(p.xz*30.));
    vec3 lin=vec3(3.4,1.9,.85)*dif*sh+vec3(.13,.17,.36)*(.55+.45*n.y)*.38+vec3(.4,.2,.1)*max(-n.y*.0+.15,0.)*.3;
    col=alb*lin;
    // crest glow where the low sun skims the sharp ridge lines
    float cr=fract(duneS(p.xz)); col+=vec3(1.,.55,.25)*smoothstep(.06,.0,abs(cr-.75))*sh*.12*fade;
    // blowing sand streaming off the crests
    float bl=fbm4(vec2(p.x*.9-t*1.6, p.z*.25)+p.y)*smoothstep(.12,.0,abs(cr-.76))*smoothstep(.5,2.5,h0);
    col+=vec3(1.,.62,.32)*bl*.25*(.4+pow(max(dot(rd,sd),0.),4.));
    col=mix(col, haze, 1.-exp(-tt*.0045));
  } else col=rd.y<0. ? haze*.8 : skyD(rd,sd);
  // a low veil of drifting sand near the ground
  float veil=fbm4(vec2(uv.x*2.5-t*.08, uv.y*14.))*smoothstep(.06,-.1,uv.y-.03)*smoothstep(-.5,-.05,uv.y);
  col=mix(col, vec3(1.,.66,.40)*(.6+.5*pow(max(dot(rd,sd),0.),6.)), veil*.18);
  col+=vec3(1.,.55,.25)*pow(max(dot(rd,sd),0.),30.)*.25;
  gl_FragColor=vec4(finish(col*.8,uv),1.);
}

<script>
// ---------- shared bits for the 4 big cities ----------
const CITYKIT = `
float segD(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float boxD(vec2 p, vec2 c, vec2 hw){ vec2 d=abs(p-c)-hw; return max(d.x,d.y); }      // < 0 inside
float cover(float d, float e){ return clamp(.5-d/e,0.,1.); }                            // soft edge, e = one pixel
// rows of windows: 1 = a lit pane. frac = how many are switched on
float panes(vec2 p, vec2 cell, float seed, float frac, vec2 m){

  float rowk=h21(vec2(gi.y, seed)), on=step(h21(gi+seed*7.13), frac*(.55+.9*rowk));

vec3 paneCol(vec2 gi){ float r=h21(gi*1.37+.5); return mix(vec3(1.,.66,.34), vec3(.72,.84,1.), step(.72,r))*(.8+.7*h21(gi+3.3)); }

// ---------- 12. SAN FRANCISCO: the Golden Gate Bridge with fog rolling in, at sunset into twilight ----------
const SANFRAN = `
const float H=-.10;                 // far shore of the bay
const float XA=-.36, XB=.34;        // the two towers (A is the near one, so it looks bigger)
const float YA=-.34, YB=-.27;       // where the towers stand in the water
const float HA=.63, HB=.49;

float kAt(float x){ return mix(1., HB/HA, clamp((x-XA)/(XB-XA),-.4,1.25)); }
float baseY(float x){ return mix(YA, YB, (x-XA)/(XB-XA)); }
float deckY(float x){
  float dA=YA+.3*HA, dB=YB+.3*HB;
  if(x<=XB) return mix(dA, dB, (x-XA)/(XB-XA));
  return dB+(H-.006-dB)*(1.-exp(-(x-XB)*3.));                 // the far end runs off toward the city
}
float cableY(float x){
  float tA=YA+HA*1.005, tB=YB+HB*1.005;
  if(x<XA){ float xl=XA-.8; float s=clamp((x-xl)/(XA-xl),0.,1.); return mix(deckY(xl)+.01, tA, pow(s,1.5)); }
  if(x>XB){ float xr=XB+.62; float s=clamp((xr-x)/(xr-XB),0.,1.); return mix(deckY(xr)+.006, tB, pow(s,1.5)); }

vec3 skySF(vec2 uv, float t, float px){
  float y=uv.y-H;
  vec3 h0=mix(vec3(1.35,.58,.24), vec3(.80,.33,.26), tw), h1=mix(vec3(.95,.38,.40), vec3(.36,.19,.36), tw);
  vec3 h2=mix(vec3(.34,.25,.50), vec3(.09,.10,.30), tw), h3=mix(vec3(.08,.11,.27), vec3(.012,.022,.085), tw);
  vec3 c=mix(h0,h1,smoothstep(.0,.13,y)); c=mix(c,h2,smoothstep(.08,.34,y)); c=mix(c,h3,smoothstep(.28,.62,y));
  float sx=uv.x+.95;                                                    // the sun just went down, off to the left
  c+=mix(vec3(1.2,.55,.18), vec3(.6,.22,.12), tw)*exp(-length(vec2(sx*.8,y*2.2))*2.6)*(1.1-.5*tw);
  c*=.8+.32*smoothstep(.9,-.9,uv.x);

  float cm=smoothstep(.66,.9,cl)*smoothstep(.12,.22,y)*smoothstep(.5,.3,y);
  vec3 cc=mix(mix(vec3(1.3,.55,.45), vec3(.42,.20,.30), tw), vec3(.10,.08,.18), smoothstep(.18,.46,y));
  c=mix(c, cc*(.8+.4*smoothstep(.6,-.8,uv.x)), cm*.85);

float hillsSF(float x){

  return H+h*smoothstep(-.03,.04,x);
}
// the far side of the bay: the city on its hills, downtown towers, the Transamerica Pyramid, Alcatraz, Marin hills
vec3 farSF(vec2 uv, float t, float px){
  vec3 col=skySF(uv,t,px);
  vec3 haze=mix(vec3(.85,.45,.42), vec3(.20,.16,.30), tw);
  float lit=.15+.85*tw;
  // East Bay hills far away, pale in the haze
  float eb=H+.022+.01*fbm4(vec2(uv.x*6.,4.));
  if(uv.x>.15 && uv.y<eb) col=mix(col, haze*.75, .8*smoothstep(.15,.3,uv.x));
  // downtown skyscrapers

    float cw=.011, ci=floor(bx/cw), lx=fract(bx/cw);
    float bh=H+.035+.075*pow(h11(ci*3.1),1.6)*exp(-pow((bx-.57)/.08,2.));

      col+=paneCol(floor(vec2(bx*900.,uv.y*700.)))*panes(vec2(bx,uv.y), vec2(.0016,.0021), ci, lit*.7, vec2(.25))*.9*lit;
    }

  float tp=H+.155-abs(uv.x-.515)*5.2;
  if(abs(uv.x-.515)<.012 && uv.y<tp){ col=mix(vec3(.32,.26,.30), haze, .35)*(1.-.4*step(.515,uv.x)); col+=vec3(1.,.8,.55)*panes(uv, vec2(.002,.0024), 4., lit*.6, vec2(.3))*.7*lit; }
  if(abs(uv.x-.515)<.0012 && uv.y<H+.19) col=vec3(.25,.22,.3);

    col+=vec3(.8,.9,1.)*panes(uv, vec2(.0018,.002), 9., lit*.5, vec2(.3))*.6*lit;
    col+=vec3(1.,.9,.8)*smoothstep(.15,.176,sq.y)*tw*.9; }              // its glowing crown
  // the hills, covered in little houses
  float hh=hillsSF(uv.x);

    float row=floor(uv.y*560.); vec2 g=vec2(uv.x*420.+h11(row)*7., uv.y*560.); vec2 gi=floor(g), gf=fract(g);

    float w=step(.55,h21(gi*1.9+5.))*step(h21(gi+8.),lit)*step(.3,gf.x)*step(gf.x,.7)*step(.35,gf.y)*step(gf.y,.7);

  vec2 ct=uv-vec2(.29,hillsSF(.29)); if(abs(ct.x)<.0028 && ct.y>-.004 && ct.y<.026){ col=mix(vec3(.85,.7,.6), vec3(.6,.55,.6), tw)*(1.-.4*step(0.,ct.x)); col+=vec3(1.,.8,.6)*tw*.4; }
  // a little red cable car climbing Russian Hill
  float cx=.205+.022*sin(t*.06); float cy=hillsSF(cx)-.004; float sl=(hillsSF(cx+.004)-hillsSF(cx-.004))/.008;

    if(cq.y>.004 && cq.y<.0072 && fract(cq.x*260.)>.4) col=vec3(1.4,1.,.6);
    if(cq.y>.0078) col=vec3(.3,.05,.04); }

  float ax=uv.x+.06;

  if(abs(ax+.034)<.0016 && uv.y<H+.045) col=mix(vec3(.7,.65,.6), vec3(.2,.2,.25), tw);

  if(uv.y<mh){ float gr=fbm4(uv*vec2(40.,90.)); col=mix(vec3(.05,.05,.04), vec3(.13,.10,.07), gr)*(1.-.5*tw);
    col=mix(col, haze*.5, .3*smoothstep(mh-.12,mh,uv.y)); col+=vec3(.6,.25,.1)*.15*(1.-tw)*smoothstep(mh-.02,mh,uv.y); }

}

<script>
const SANFRAN2 = `
const vec3 ORANGE=vec3(.62,.075,.028);          // "International Orange"
// one tower seen from the front: two legs that step inward as they rise, joined by portal beams, X-braces below the deck
void ggTower(inout vec3 col, vec2 uv, float xc, float y0, float h, float px, float t, float far){
  vec2 q=vec2(uv.x-xc, uv.y-y0)/h; float v=q.y, ax=abs(q.x), e=px/h;
  if(v<-.02 || v>1.08 || ax>.13) return;
  float st=step(.535,v)*.0065+step(.69,v)*.0065+step(.84,v)*.0065;
  float wo=.098-.028*v-st, lw=.042-.012*v-st*.45, wi=wo-lw;
  float d=max(ax-wo, wi-ax);
  float beam=1e3;
  beam=min(beam, abs(v-.505)-.028); beam=min(beam, abs(v-.675)-.02); beam=min(beam, abs(v-.825)-.017); beam=min(beam, abs(v-.962)-.038);
  d=min(d, max(beam, ax-wi-.003));
  float xb=min(segD(vec2(ax,v), vec2(0.,.165), vec2(wi,.045)), segD(vec2(ax,v), vec2(0.,.165), vec2(wi,.285)));
  d=min(d, max(xb-.006, ax-wi-.002));
  d=min(d, boxD(vec2(ax,v), vec2(wi+lw*.5, 1.006), vec2(lw*.32, .012)));      // little caps on top of each leg

  float leg=clamp((ax-wi)/lw,0.,1.); float side=q.x<0.?1.:0.;
  float sh=mix(.5,1.15,side)*(.75+.35*(q.x<0.?1.-leg:leg))*(.7+.4*smoothstep(.0,.9,v));
  if(beam<0. && ax<wi) sh=.8-.35*smoothstep(-.012,.0,beam)*step(fract(q.x/(wi*.25)),.85);        // panels on the beams
  float flute=smoothstep(.06,.0,abs(fract(leg*3.)-.5)-.4)*step(.08,v)*.35;
  sh*=1.-flute;
  sh*=1.-.45*smoothstep(.0,.03,-(v-.505+.03))*smoothstep(.06,.03,-(v-.505));      // shadow under the first beam
  vec3 c=ORANGE*sh*mix(1.,.38,tw);
  c+=ORANGE*vec3(1.3,1.5,1.3)*tw*.62*(1.15-.85*v)*(.45+.55*side)*(.6+.4*leg);                       // floodlit at night
  c+=vec3(1.,.45,.2)*.2*(1.-tw)*side*smoothstep(.6,1.,1.-leg)*smoothstep(.2,1.,v);  // warm rim from the sunset
  c=mix(c, mix(vec3(.9,.45,.40),vec3(.2,.16,.3),tw), far);

  vec2 lp=vec2(ax-(wi+lw*.5), v-1.03); col+=vec3(2.5,.18,.08)*exp(-dot(lp,lp)/(e*e*4.))*(.4+.6*smoothstep(.2,.9,sin(t*1.6+xc*9.)));

void bridgeSF(inout vec3 col, vec2 uv, float px, float t){

    col=mix(col, ORANGE*mix(.6,.5,tw)+ORANGE*tw*.5, smoothstep(px*.9,px*.2,g)*.6); }

  float sl=(cableY(x+.002)-cableY(x-.002))/.004; float cd=(uv.y-cy)/sqrt(1.+sl*sl); float cr=.0034*k+px*.3;
  if(abs(cd)<cr+px){ vec3 cc=ORANGE*(.7+.6*smoothstep(-cr,cr,cd))*mix(1.,.45,tw)+ORANGE*tw*.38+vec3(.6,.3,.15)*(1.-tw)*smoothstep(0.,cr,cd)*.4;
    col=mix(col, cc, cover(abs(cd)-cr, px)); }

  float th=.014*k; float dd=dy-uv.y;
  if(dd>-.004*k && dd<th){
    float tr=fract(x/(.009*k)); float web=smoothstep(.12,.0,abs(tr-dd/th*.5-.25)-.0)+smoothstep(.12,.0,abs(tr+dd/th*.5-.75));
    vec3 c=ORANGE*(dd<.0035*k?1.:.45+.35*web)*mix(1.,.45,tw)+ORANGE*tw*.55;

    col=mix(col, c, cover(max(-dd-.004*k, dd-th), px));

const PARIS = `
const float W=-.27;                    // the river's surface

vec3 beams(vec2 uv, float t){
  vec2 ap=vec2(TX, TY+TH*.905); vec2 p=uv-ap; vec3 c=vec3(0);

vec3 aboveC(vec2 uv, float t, float px){

// petals drifting down, tumbling
vec3 petals(vec2 uv, float t, float sc, float seed, out float a){

<script>
// ---------- 17. TROPICAL BEACH: turquoise water over white sand, waves with foam, palm trees ----------
const BEACH = `
const float Y0=.07, EYE=1.6;
vec3 skyB(vec2 uv, float t){
  float y=uv.y-Y0;
  vec3 c=mix(vec3(.55,.78,.95), vec3(.08,.32,.80), smoothstep(.0,.35,y));
  float cl=fbm(vec2(uv.x*2.2+t*.004, y*5.5))-.9*smoothstep(.02,.3,y)-.12;
  float cm=smoothstep(.15,.45,cl);
  c=mix(c, vec3(1.05,1.05,1.05)*(.75+.35*smoothstep(-.1,.4,fbm4(uv*9.+1.)))*(.85+.6*y), cm*smoothstep(.0,.02,y));
  c+=vec3(1.,.95,.8)*.25*exp(-length(uv-vec2(.35,.6))*3.);                            // the bright sun, high up
  return c;
}
float shoreZ(float wx, float t){ return 6.+.9*sin(t*.45)+.5*sin(wx*.23+t*.2)+.4*(noise(vec2(wx*.3,t*.1))-.5); }
// light patterns on the shallow sea floor
float caustic(vec2 p, float t){
  vec2 q=p*1.6; float c=0.;
  for(int i=0;i<2;i++){ q+=vec2(sin(q.y*1.7+t*1.1), cos(q.x*1.5-t*.9))*.5; c+=pow(1.-abs(sin(q.x+q.y*.7)*cos(q.y-q.x*.6)),6.); q*=1.7; }
  return c;
}
vec3 groundB(vec2 uv, float t){
  float z=EYE/(Y0-uv.y), wx=uv.x*z;
  float zs=shoreZ(wx,t);
  vec3 sand=vec3(1.,.78,.54)*(.78+.14*noise(vec2(wx*3.,z*3.))+.08*noise(vec2(wx*40.,z*40.)))*(.9+.15*fbm4(vec2(wx,z)*.4));
  sand*=1.-.06*smoothstep(.3,.9,sin(z*5.+noise(vec2(wx,z))*4.));                       // little ripples in the sand
  if(z<zs){
    float wet=smoothstep(-1.8,0.,z-zs);
    vec3 c=mix(sand, sand*.6+skyB(vec2(uv.x,2.*Y0-uv.y),t)*.25, wet);
    float foam=smoothstep(.35,.0,zs-z)*smoothstep(.3,.7,noise(vec2(wx*4.,z*6.+t)));
    return mix(c, vec3(1.1), foam*.9);
  }
  float dz=z-zs, depth=dz*.05+dz*dz*.002;
  vec3 shallow=vec3(.25,.95,.85), mid=vec3(.02,.55,.68), deep=vec3(.01,.18,.45);
  vec3 wc=mix(shallow, mid, smoothstep(.0,.8,depth)); wc=mix(wc, deep, smoothstep(.7,3.,depth));
  vec3 floorC=sand*(1.+1.4*caustic(vec2(wx,z)*.9,t)*exp(-depth*2.5))*exp(-depth*vec3(3.,.6,.4));
  vec3 c=mix(floorC, wc, smoothstep(.0,.6,depth)*.75+.15);
  // waves rolling in: soft lines of foam and the bright crests
  float wp=dz-mod(t*1.2,7.);
  float ph=fract((dz+t*1.2)/7.);
  float crest=smoothstep(.1,.0,abs(ph-.5)-.02)*smoothstep(1.,6.,dz)*smoothstep(60.,20.,dz);
  float fn=noise(vec2(wx*2.,dz*3.-t));
  c=mix(c, vec3(1.05), crest*smoothstep(.35,.7,fn)*.75);
  c=mix(c, vec3(1.08), smoothstep(.5,.0,dz)*smoothstep(.3,.6,noise(vec2(wx*5.,t*1.5)))*.9);   // foam at the edge
  // sky reflection and sun glitter
  float fres=.08+.5*pow(1.-clamp((Y0-uv.y)*2.5,0.,1.),5.);
  c=mix(c, skyB(vec2(uv.x,2.*Y0-uv.y),t), fres);
  float gl=pow(noise(vec2(wx*6.+t*.3, z*4.-t*.8))*noise(vec2(wx*13.-t*.5, z*9.)),5.);
  c+=vec3(1.4,1.35,1.2)*gl*6.*exp(-pow(uv.x-.3,2.)*6.)*smoothstep(.0,.3,uv.y+.25);
  return c;
}
// a palm tree: curved trunk with rings and a crown of drooping fronds that sway
void palm(inout vec3 col, vec2 uv, vec2 base, vec2 top, float sc, float t, float seed){
  if(uv.x<min(base.x,top.x)-.5*sc || uv.x>max(base.x,top.x)+.5*sc || uv.y<base.y-.02) return;
  float sw=.012*sc*sin(t*.7+seed);
  vec2 tp=top+vec2(sw,0.);
  vec2 ctl=mix(base,tp,.5)+vec2(-.12,.02)*sc*sign(top.x-base.x);
  // trunk (a curve made of short pieces)
  float bd=1e3, bs=0.; vec2 prev=base;
  for(int i=1;i<=8;i++){ float s=float(i)/8.; vec2 p=mix(mix(base,ctl,s),mix(ctl,tp,s),s);
    vec2 pa=uv-prev, ba=p-prev; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); float d=length(pa-ba*h);
    if(d<bd){ bd=d; bs=s-(1.-h)/8.; } prev=p; }
  float w=mix(.020,.010,bs)*sc;
  if(bd<w){ float ring=.8+.2*smoothstep(.1,.5,fract(bs*55.*sc))*smoothstep(.9,.6,fract(bs*55.*sc));
    col=vec3(.42,.32,.22)*ring*(.55+.45*smoothstep(-.5,.5,(uv.x-mix(base.x,tp.x,bs))/w)); }

  for(int k=0;k<9;k++){
    float an=float(k)/9.*6.283+seed+.12*sin(t*.9+float(k));
    vec2 dir=vec2(cos(an), .55*sin(an)+.25); float L=(.24+.06*h11(float(k)+seed))*sc;
    float fd=1e3, fs=0., sd=0.; vec2 pv=tp;
    for(int j=1;j<=6;j++){ float s=float(j)/6.; vec2 p=tp+dir*L*s-vec2(0.,.4*L*s*s*(1.+.6*h11(float(k)*3.+seed)))+vec2(.01*sc*sin(t*1.3+float(k)+s*2.)*s,0.);
      vec2 pa=uv-pv, ba=p-pv; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); float d=length(pa-ba*h);
      if(d<fd){ fd=d; fs=s-(1.-h)/6.; sd=sign(ba.x*pa.y-ba.y*pa.x); } pv=p; }
    float leaf=.055*sc*pow(sin(PI*clamp(fs*1.05,0.,1.)),.7);

      float strip=smoothstep(.62,.35,abs(fract(u)-.5)*2.)*smoothstep(leaf,leaf*.6,fd+.008*sc*noise(vec2(u,1.)));

      col=mix(col, g, max(strip, vein)*.97); }
  }

  float cc=min(length(uv-tp-vec2(.008,-.012)*sc), length(uv-tp-vec2(-.01,-.015)*sc))-.009*sc;
  if(cc<0.) col=vec3(.25,.2,.08);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=uv.y>Y0?skyB(uv,t):groundB(uv,t);
  if(abs(uv.y-Y0)<.003) col=mix(col, vec3(.25,.55,.75), .5);                           // the far horizon line
  // a little island far away
  float isl=Y0+.025*smoothstep(.12,.0,abs(uv.x+.25))*(.7+.3*noise(vec2(uv.x*60.,1.)));
  if(uv.y>Y0 && uv.y<isl) col=mix(col, vec3(.15,.35,.3), .7);

  palm(col,uv,vec2(.62,-.27),vec2(.56,.22),.75,t,4.);
  palm(col,uv,vec2(.86,-.24),vec2(.86,.15),.6,t,2.5);
  gl_FragColor=vec4(finish(col*.85,uv),1.);
}

// ---------- 18. RAINFOREST: misty jungle, giant leaves, sunbeams, drops, and a blue butterfly ----------
const JUNGLE = `
vec3 MIST=vec3(.55,.68,.55);
// far jungle: layers of trunks and leafy masses fading into the bright mist
vec3 forestBack(vec2 uv, float t){
  vec3 col=mix(vec3(.66,.76,.55), vec3(.30,.42,.26), smoothstep(-.1,.45,abs(uv.y-.05)+abs(uv.x)*.3));

// one big leaf: a long oval with a middle rib, side veins and a shiny wet surface
vec4 leaf(vec2 uv, vec2 base, float ang, float L, float W, float t, float seed){

  float u=p.x/L; if(u<0. || u>1.) return vec4(0);

vec3 beamsJ(vec2 uv, float t){

void butterfly(inout vec3 col, vec2 uv, float t){

}

<script>
// ---------- 19. GRAND CANYON: layers of red rock at sunset, deep shadows, a river far below ----------
const CANYON = `
const vec2 SUN=vec2(-.62,.13);
vec3 skyG(vec2 uv, float t){
  float y=uv.y-.06;
  vec3 c=mix(vec3(1.25,.62,.28), vec3(.85,.45,.42), smoothstep(.0,.12,y));
  c=mix(c, vec3(.30,.34,.62), smoothstep(.08,.35,y)); c=mix(c, vec3(.08,.14,.38), smoothstep(.3,.6,y));
  float sd=length(uv-SUN);
  c+=vec3(1.4,.8,.35)*exp(-sd*5.)*.7+vec3(2.2,1.4,.7)*smoothstep(.028,.024,sd);
  float cl=fbm(vec2(uv.x*1.3+t*.003, y*8.));
  c=mix(c, mix(vec3(1.3,.55,.35), vec3(.45,.25,.35), smoothstep(.1,.35,y))*(1.+.8*exp(-sd*3.)), smoothstep(.6,.85,cl)*smoothstep(.06,.15,y)*.8);
  return c;
}
float terr(float v){ v*=3.; float f=fract(v); return (floor(v)+smoothstep(.45,.75,f))/3.; }
float prof(float x, float k){
  float p=.06-k*.085+(.03+.035*k)*terr(fbm4(vec2(x*(1.2+k*.4)+k*7.1, k*3.)));
  if(k>3.5) p+=.05-.26*smoothstep(.3,.02,abs(x-.06+.03*sin(x*9.)));                    // a deep notch: the inner gorge
  return p;
}
// rock colour: stripes of cream, orange and red stone; sunny faces glow, the rest is in blue shadow
vec3 rock(vec2 uv, float k, float top, float t){
  float d=top-uv.y;
  float wob=fbm4(vec2(uv.x*6., uv.y*2.+k))*.012;
  float sy=(uv.y+k*.013+wob)*(32.-k*4.);
  float b1=noise(vec2(k*.0+.5, sy)), b2=noise(vec2(3.5, sy*4.));
  vec3 c=mix(vec3(.92,.62,.40), vec3(.70,.24,.11), smoothstep(.35,.65,b1));
  c=mix(c, vec3(.95,.80,.60), smoothstep(.8,.95,b1)*.8);
  c*=.88+.2*b2;
  float e=.006, s=prof(uv.x+e,k)-prof(uv.x-e,k);
  float face=fbm4(vec2(uv.x*(5.+k*2.), d*6.+k*3.));                                     // big sunny and shady patches
  float lit=smoothstep(.42,.58,face+s*25.+.1*(noise(vec2(uv.x*60.,d*30.))-.5));
  lit*=1.-.9*smoothstep(.02,.08+.02*k,d);
  lit=max(lit, .8*smoothstep(.008,.0,d)*smoothstep(.3,.6,face));                                            // the canyon floor is already in shadow
  float gully=1.-.18*smoothstep(.55,.8,noise(vec2(uv.x*(90.+k*30.), d*12.)));
  vec3 sun=vec3(1.5,.82,.48), shade=vec3(.16,.13,.27);
  return c*mix(shade, sun, lit)*gully;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyG(uv,t);
  if(uv.y<.06+.004*noise(vec2(uv.x*30.,1.))) col=mix(vec3(.55,.38,.45), skyG(vec2(uv.x,.07),t), .5);   // the far flat rim
  vec3 haze=vec3(.72,.50,.55);
  for(int i=0;i<5;i++){
    float k=float(i);
    float top=prof(uv.x,k);
    if(uv.y<top){
      col=rock(uv,k,top,t);
      col=mix(col, haze*(1.-.12*k), clamp(.58-k*.15,0.,1.));
      if(i==3){                                                                        // the Colorado River, deep in the gorge
        float rx=.06+.035*sin(uv.y*22.+1.)+.012*sin(uv.y*61.);
        float rw=.006+.15*max(-.3-uv.y,0.);
        float rv=smoothstep(rw,rw*.5,abs(uv.x-rx))*smoothstep(-.29,-.31,uv.y);
        vec3 water=vec3(.30,.32,.34)+vec3(.8,.5,.4)*.25+vec3(1.,.75,.5)*pow(noise(vec2(uv.x*150., uv.y*260.+t*2.)),8.)*1.2;
        col=mix(col, water*.7, rv);
      }
    }
  }
  col+=vec3(1.,.55,.3)*.10*exp(-length((uv-SUN)*vec2(.6,2.))*2.);
  gl_FragColor=vec4(finish(col*.8,uv),1.);
}
`;
