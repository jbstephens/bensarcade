<script>
'use strict';
// ---------- Shared shader bits: hashing, noise, fbm, stars, and a filmic "camera" finish ----------
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
// star colour from a 0..1 "temperature" (red dwarf -> sun -> blue giant)
vec3 starCol(float k){ return k<.5 ? mix(vec3(1.,.62,.38), vec3(1.,.95,.88), k*2.) : mix(vec3(1.,.95,.88), vec3(.62,.75,1.), (k-.5)*2.); }
// one layer of stars: point-spread "blobs" a pixel or two wide, twinkling
vec3 starLayer(vec2 p, float cell, float dens, float px, float seed, float tw){
  vec2 q=p/cell; vec2 id=floor(q); vec2 f=fract(q)-.5;
  float r=h21(id+seed); if(r>dens) return vec3(0);
  vec2 o=(h22(id+seed*1.3)-.5)*.6; float d=length(f-o)*cell/px;
  float m=pow(h21(id*1.71+seed), 6.);
  float twk=1.-tw+tw*(.55+.45*sin(uT*(1.5+4.*h21(id+9.1))+r*60.));
  float core=exp(-d*d*(1.6-m*.9)); float halo=exp(-d*.55)*m*.25;
  return starCol(h21(id*3.7+seed))*(core*(.25+2.8*m)+halo)*twk;
}
vec3 starfield(vec2 p, float px, float amt){
  vec3 c=starLayer(p, 26.*px, .55, px, 1., .5)*.55+starLayer(p+.13, 11.*px, .45, px, 31., .4)*.22;
  c+=starLayer(p+.37, 43.*px, .5, px, 7., .6);
  c+=starLayer(p+.71, 97.*px, .55, px, 13., .7)*1.5;
  return c*amt;
}
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;

// ---------- 1. GALAXY ----------
const GALAXY = `
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec2 p=uv+vec2(t*.0015,t*.0004);
  // background nebula: domain-warped fbm clouds
  vec2 q=p*1.5;
  vec2 w=vec2(fbm4(q+vec2(0.,t*.012)), fbm4(q+vec2(5.2,1.3)-t*.009));
  float n=fbm(q*1.1+w*2.4), n2=fbm(q*2.2-w*1.7+7.3);
  float band=smoothstep(.5,.85, fbm4(q*.55+vec2(2.,t*.003)) + .25*(.5-abs(uv.y+uv.x*.45+.1)*1.4));
  vec3 neb=vec3(.62,.10,.36)*pow(smoothstep(.35,.95,n),1.5)*1.3
          +vec3(.06,.32,.55)*pow(smoothstep(.4,.95,n2),1.5)*1.1
          +vec3(.95,.45,.15)*pow(smoothstep(.62,1.05,n*n2*1.8),2.)*.9;
  float dust=smoothstep(.42,.72,fbm(q*2.6+w*3.+11.));
  neb*=(1.-.85*dust)*band*.5*(.45+1.1*fbm4(q*7.+w*2.));
  vec3 col=vec3(.002,.0025,.006)+neb;
  // the spiral galaxy (tilted disc, rotating very slowly)
  vec2 gc=vec2(.18,.06);
  vec2 g=rot(.55)*(uv-gc); g.y/=.42;
  float R=.50; float r=length(g)/R; float spin=t*.025;
  vec2 gr=rot(-spin)*g;
  float th=atan(gr.y,gr.x);
  float s=th-log(r+.02)*2.3;
  float arm=pow(max(.5+.5*cos(2.*s),0.),2.5);
  float clump=fbm(gr*9.);
  float fine=noise(gr*38.);
  float disk=exp(-r*2.6)*smoothstep(1.35,.5,r);
  vec3 gal=vec3(.55,.68,1.)*disk*(.12+arm*(.55+1.1*clump))*1.7;
  gal+=vec3(1.,.35,.55)*pow(clump*fine,3.)*arm*disk*14.*smoothstep(.1,.3,r);   // pink star-forming knots
  gal+=starLayer(uv, 7.*px, .6, px, 21., .3)*disk*(.3+arm)*3.;            // resolved bright stars in the arms
  float bul=exp(-r*r*28.); float core=exp(-r*16.);
  gal+=vec3(1.,.82,.55)*bul*1.6+vec3(1.,.95,.85)*core*3.5;
  float lane=pow(max(.5+.5*cos(2.*(s-.55)),0.),7.)*smoothstep(.06,.28,r)*smoothstep(1.2,.5,r);
  lane*=.55+.6*fbm4(gr*14.+3.);
  float near=smoothstep(.25,-.35,g.y/ (r*R+.001)*.42);
  gal*=1.-clamp(lane*(.7+.3*near),0.,.93);
  col=col*(1.-.6*clamp(disk*2.,0.,1.)*lane)+gal;
  col+=vec3(1.,.85,.6)*.06/(1.+length(uv-gc)*40.);                       // soft glare
  // stars
  col+=starfield(p, px, 1.)*(1.-.7*dust*band);
  // occasional shooting star
  float P=9.; float k=floor(t/P); float lt=t-k*P;
  if(lt<1.4){
    vec2 a=vec2(h11(k)*1.4-.7, .15+h11(k+3.)*.3); vec2 dir=normalize(vec2(h11(k+5.)>.5?1.:-1., -.45));
    vec2 head=a+dir*lt*.55; vec2 tail=head-dir*.22*smoothstep(0.,.4,lt);

const FIRE = `

const OCEAN = `

vec3 waves(vec2 p, float t, float dist, out float h){
  float a=1., w=.3, hs=0., hx=0., hz=0., ws=0., it=0.;

      float lit=clamp(.45-mx*.18+my*.08-sl*exp(-depth*40.)*.25,0.,1.);   // moonlight from the left
      vec3 snow=vec3(.075,.095,.14)*(.2+lit*1.6)+glow*.1;
      vec3 c=mix(snow, vec3(.008,.01,.014), rock*.9);
      c*=.85+.3*noise(uv*vec2(120.,120.));
      if(k==0) c=mix(c, skyc*.5+vec3(.01,.02,.03), .5); else c*=.75;      // far range fades into the air
      col=c*(1.-.5*smoothstep(.0,.2,depth));
    }
  }
  // spruce trees along the far shore
  float tx=uv.x*55.; float ti=floor(tx); float tf=(fract(tx)-.5)/55.;
  float th=.012+.035*h11(ti*1.3)*step(.25,h11(ti+7.));
  float yy=(uv.y-HZ)/th; float tier=fract(yy*5.+h11(ti));
  if(yy<1. && yy>-.2 && abs(tf)<(1.-yy)*(.25+.2*tier)/55.){ hit=1.; col=vec3(.006,.01,.012); }
  if(uv.y<HZ+.005){ hit=1.; col=vec3(.03,.04,.055)+glow*.05; }   // snowy shore strip
  return col;
}
vec3 skyAt(vec2 uv, float t, float px, out vec3 glow){
  vec3 rd=normalize(vec3(uv.x, uv.y-HZ+.02, 1.2));
  vec3 c=mix(vec3(.02,.05,.07), vec3(.003,.006,.018), smoothstep(-.05,.5,rd.y));
  vec3 a=aurora(rd,t);
  glow=vec3(.05,.6,.35)*.12;
  c+=starfield(uv+vec2(t*.0006,0.), px, .8)*(1.-clamp(length(a)*1.5,0.,.8));
  c+=vec3(.02,.12,.08)*exp(-max(rd.y,0.)*6.)*.35;          // green airglow near the horizon
  return c+a;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 glow; vec3 col; float hit;
  if(uv.y>=HZ){
    col=land(uv,t,skyAt(uv,t,px,glow),glow,hit);
  } else {
    // frozen lake: a mirror of the sky, slightly blurred by the ice, with cracks and snow drifts
    float d=HZ-uv.y;
    vec2 m=vec2(uv.x+(noise(vec2(uv.x*8.,d*60.))-.5)*.006*d*8., HZ+d);
    vec3 sk=skyAt(m,t,px,glow);
    vec3 r=land(m,t,sk,glow,hit)*vec3(.5,.58,.66);
    vec2 g=vec2(uv.x/(d+.02), 1./(d+.02));
    float crack=smoothstep(.015,.0,abs(fbm4(g*vec2(.9,.25))-.5))*smoothstep(.0,.08,d);
    float drift=smoothstep(.5,.75,fbm(g*vec2(.35,.12)+3.))*smoothstep(.02,.25,d);
    vec3 ice=r+vec3(.6,.8,.9)*crack*.025+glow*.03;
    vec3 snow=vec3(.05,.065,.09)*(.75+.5*noise(g*3.))+glow*.15;
    col=mix(ice, snow, drift*.9);
  }
  gl_FragColor=vec4(finish(col,uv),1.);
}`;

<script>
// ---------- 5. UNDERWATER: sun rays, dancing caustics, kelp, fish and bubbles ----------
const SEA = `
vec3 waterCol(float y){ return mix(vec3(.0,.035,.075), vec3(.03,.30,.40), smoothstep(-.4,.8,y)); }
// light focused by the wavy surface (the classic iterative caustic pattern)
float caustic(vec2 p, float t){
  p=mod(p*6.28318,6.28318)-250.; vec2 i=p; float c=1., inten=.005;
  for(int n=0;n<4;n++){
    float tt=t*(1.-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c/=4.; c=1.17-pow(c,1.4); return pow(abs(c),7.);
}
float godRays(vec2 uv, float t){
  float a=(uv.x+.25)/(1.6-uv.y);
  float r=noise(vec2(a*14., t*.15))*.6+noise(vec2(a*31.+5., t*.23))*.4;
  return pow(r,3.)*smoothstep(-.6,.55,uv.y);
}
// one kelp stalk: returns (mask, shade)
vec2 kelp(vec2 uv, float x0, float y0, float sc, float t, float seed){
  float h=uv.y-y0; if(h<0.) return vec2(0);
  float sway=sin(t*.5+seed*4.+h*2.2)*.05*h+sin(t*.9+seed+h*5.)*.012*h;
  float dx=(uv.x-x0-sway)/sc;
  float leaf=pow(max(0., sin(h/sc*5.+seed*3.)),.7)*smoothstep(.0,.15,h);
  float side=sign(sin(h/sc*3.5+seed*7.));
  float w=.012+.1*leaf*(dx*side>0.?1.:.35)*(.8+.4*noise(vec2(h/sc*3.,seed)));
  float m=smoothstep(w,w*.6,abs(dx));
  return vec2(m, .5+.5*dx/w*side);
}
// a fish seen from the side; returns (mask, shade 0 back..1 belly)
vec2 fish(vec2 uv, vec2 c, float s, float dir, float t, float seed){
  vec2 q=(uv-c)/s; q.x*=dir;
  float wig=sin(t*7.+seed*5.)*.12*smoothstep(0.,-1.,q.x);
  q.y+=wig*q.x*.5;
  float body=length(q*vec2(.55,1.45))-.5;
  vec2 tq=q-vec2(-1.05,0.); float tail=max(abs(tq.y)-(-tq.x)*.75-.05, max(tq.x-.15, -tq.x-.38));
  float d=min(body, tail*.8);
  return vec2(smoothstep(.03,-.03,d), clamp(.5-q.y*1.6,0.,1.));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 rd=normalize(vec3(uv.x, uv.y+.06, 1.3));
  vec3 col=waterCol(uv.y);
  // shimmering surface far above
  if(rd.y>.2){
    vec2 sp=rd.xz/rd.y*3.;
    float sh=caustic(sp*.35+vec2(t*.01,0.), t*.5);
    col+=vec3(.5,.85,.9)*(sh*.7+.12)*smoothstep(.2,.45,rd.y);
  }
  // sandy sea floor with ripples and caustics
  float floorZ=1e5;
  if(rd.y<0.){
    float dist=3./-rd.y; floorZ=dist; vec2 g=rd.xz*dist;
    float rip=sin(g.x*3.2+fbm4(g*.6)*5.+g.y*.6)*.5+.5;
    float grain=noise(g*25.);
    vec3 sand=mix(vec3(.55,.5,.36), vec3(.75,.68,.5), rip*.6+grain*.4);
    float rockN=fbm4(g*.35+7.); sand=mix(sand, vec3(.18,.2,.18)*(.7+.6*grain), smoothstep(.62,.7,rockN));
    float cs=caustic(g*.16, t*.55)*1.6+caustic(g*.16+.33, t*.55+1.3)*.6;
    vec3 lit=sand*(vec3(.18,.42,.5)+vec3(.8,1.,.95)*cs*(.6+.4*rip));
    float fogA=1.-exp(-dist*.09);
    col=mix(lit, waterCol(-.05), fogA);
  }
  // kelp forest: far stalks are bluer (lost in the water), near ones darker and sharper
  for(int i=0;i<12;i++){
    float fi=float(i); float z=13.-fi*.9; float sc=1.3/z;
    float x0=(mod(fi,2.)<.5?-1.:1.)*(.4+.5*h11(fi*3.7))+(h11(fi*1.1)-.5)*.2; float y0=-3.*1.3/z-.06;
    vec2 k=kelp(uv, x0, y0, sc, t, fi);
    if(k.x>0.){
      vec3 kc=mix(vec3(.04,.045,.012), vec3(.22,.19,.05), k.y*.7+smoothstep(-.2,.6,uv.y)*.3);
      kc*=(.75+.5*noise(uv*vec2(30.,6.)/sc))*(.55+.45*smoothstep(.0,.35,k.y)*smoothstep(1.,.65,k.y));
      kc+=vec3(.25,.32,.06)*smoothstep(.0,.7,uv.y)*.5*k.y;       // sunlight glowing through the leaves
      col=mix(col, mix(kc, waterCol(uv.y), 1.-exp(-z*.085)), k.x*.97);
    }
  }
  // a school of silver fish swimming by, plus a few loners
  for(int i=0;i<12;i++){
    float fi=float(i); bool school=i<9;
    float dir=school?1.:(h11(fi*5.1)>.5?1.:-1.);
    float z=school?6.+h11(fi*1.7)*2.:4.+fi*.6;
    float sp=school?.06:.04+.04*h11(fi*2.3);
    float x=mod(t*sp*dir+(school?(h11(fi*3.)-.5)*.35:h11(fi*9.)*4.),4.)-2.;
    float y=(school?.12+(h11(fi*7.3)-.5)*.2:-.2+.5*h11(fi*7.3))+.02*sin(t*.5+fi*1.3);
    vec2 f=fish(uv, vec2(x,y), .2/z, dir, t, fi);
    if(f.x>0.){
      vec3 fc=mix(vec3(.008,.02,.035), vec3(.42,.52,.56), smoothstep(.45,.9,f.y));
      fc+=vec3(.4,.55,.55)*smoothstep(.45,.55,f.y)*smoothstep(.65,.55,f.y)*.6;   // shiny side stripe
      col=mix(col, mix(fc, waterCol(y), 1.-exp(-z*.06)), f.x*.95);
    }
  }
  // sun rays from the surface
  col+=vec3(.35,.7,.75)*godRays(uv,t)*.35+vec3(.3,.6,.65)*godRays(uv*1.3+.2,t*1.3)*.2;
  // floating particles (marine snow), drifting slowly
  for(int L=0;L<2;L++){
    float fl=float(L); vec2 p=uv*(5.+fl*6.)+vec2(t*.03, t*(.02+fl*.015));
    vec2 id=floor(p); vec2 o=fract(p)-.5-(h22(id+fl)-.5)*.7;
    float d=length(o)/(5.+fl*6.)/px; float sz=fl<.5?2.2:1.2;
    col+=vec3(.6,.8,.8)*smoothstep(sz,sz*.3,d)*step(.55,h21(id*1.3+fl))*(fl<.5?.18:.25);
  }
  // bubbles rising with a wobble
  for(int i=0;i<12;i++){
    float fi=float(i); float life=5.+3.*h11(fi);
    float ph=fract(t/life+h11(fi*3.3));
    vec2 b=vec2(.55+(h11(fi*1.9)-.5)*.12+sin(t*3.+fi*2.)*.012, -.45+ph*1.15);
    float r=.006+.012*h11(fi*6.6);
    float d=length(uv-b);
    float ring=smoothstep(r,r*.75,d)*(smoothstep(r*.55,r,d)*.8+.1);
    float hl=smoothstep(r*.35,0.,length(uv-b-vec2(-r*.35,r*.35)));
    col+=vec3(.7,.9,.95)*(ring*.5+hl*.8)*smoothstep(1.,.85,ph);
  }
  gl_FragColor=vec4(finish(col*1.05,uv),1.);
}`;

<script>
// ---------- 6. MOUNTAIN: Mount Diablo at golden hour ----------
const MOUNTAIN = `
const vec2 SUNP=vec2(-.56,.14);
vec3 skyM(vec2 uv, float warm){
  float sd=length((uv-SUNP)*vec2(.8,1.));
  vec3 c=mix(vec3(1.15,.58,.24), vec3(.55,.56,.66), smoothstep(-.04,.20,uv.y));
  c=mix(c, vec3(.10,.24,.55), smoothstep(.12,.62,uv.y));
  c+=vec3(1.,.48,.16)*exp(-sd*3.)*.85*warm+vec3(1.,.78,.45)*exp(-sd*14.)*1.1;
  c+=vec3(1.,.93,.75)*smoothstep(.030,.025,length(uv-SUNP))*9.;
  return c;
}
vec3 hazeM(vec2 uv, float warm){ return mix(vec3(.36,.44,.64), vec3(1.05,.62,.32), exp(-length(uv-SUNP)*1.7)*warm); }
float rl(float x, float k){ return fbm4(vec2(x*(1.1+k*.5)+k*7.3, k*2.1)); }
float rdg(float x, float k){ float h=0., a=.5; for(int i=0;i<5;i++){ h+=a*(1.-abs(noise(vec2(x,k))*2.-1.)); x=x*2.03+1.7; a*=.47; } return h; }
float diablo(float x){
  float dx=x-.12; float w=dx<0.?.30:.42;
  float h=-.13+.32*exp(-pow(dx/w,2.))+.09*exp(-pow((x+.24)/.16,2.));
  return h+.07*(fbm(vec2(x*4.,3.))-.5)+.010*(noise(vec2(x*45.,1.))-.5)*smoothstep(.06,.16,h);
}
float layerY(float x, int k){
  if(k==0) return -.03+.13*pow(rdg(x*1.3+3.,1.),2.5);
  if(k==1) return -.09+.12*pow(rdg(x*1.7+11.,2.),2.)+.03*rl(x*3.,1.);
  if(k==2) return diablo(x);
  if(k==3) return -.25+.10*rl(x,3.)+.07*smoothstep(.2,-.7,x);
  return -.37+.05*rl(x*1.4,4.)+.11*smoothstep(-.1,.9,x);
}
// grassy hillside with ridges and canyons; dark oak woods fill the shady canyons
vec3 slopeCol(vec2 uv, vec2 q, float sl, float d, float s, vec3 sun, float cs){
  float g0=-abs(fbm4(q)-.5)+.4*fbm3(q*.5)+.04*noise(q*7.), gx=-abs(fbm4(q+vec2(.05,0.))-.5)+.4*fbm3(q*.5+vec2(.025,0.))+.04*noise(q*7.+vec2(.35,0.));
  float gul=(gx-g0)/.05;
  float lit=clamp(.58+gul*.24+sl*.9*exp(-d*4.),0.,1.);
  float dif=smoothstep(.12,.9,lit)*(1.-.6*cs);
  float oakA=smoothstep(.40,.22,lit+(fbm3(q*2.3+4.)-.5)*.35);
  float dots=smoothstep(.4,.7,noise(uv*s*8.)+noise(uv*s*17.)*.45);
  float oak=clamp(oakA*(.55+.6*dots),0.,1.);
  float gd=fbm3(vec2(uv.x*s*3., d*s*2.));
  vec3 amb=vec3(.16,.19,.30);
  vec3 alb=mix(mix(vec3(.50,.30,.11), vec3(.66,.45,.19), gd), vec3(.03,.055,.02)*(.7+.6*dots), oak*.95);
  return alb*(amb+sun*dif);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  float warm=.86+.14*sin(t*.03);
  vec3 sun=vec3(1.9,1.1,.5)*warm;
  vec3 col=skyM(uv,warm);
  // a few clouds drifting, lit gold on the side toward the sun
  if(uv.y>.06){
    vec2 cp=vec2(uv.x*1.5+t*.005, uv.y*4.);
    float dn=fbm(cp)+.15*fbm4(cp*3.-t*.01);
    float dn2=fbm(cp+normalize(SUNP-uv)*vec2(1.5,4.)*.035)+.15*fbm4(cp*3.-t*.01);
    float cm=smoothstep(.62,.74,dn)*smoothstep(.1,.22,uv.y)*smoothstep(.62,.42,uv.y);
    float lc=clamp(.5+(dn-dn2)*6.,0.,1.);
    vec3 cc=mix(vec3(.36,.36,.48), vec3(1.35,.82,.48)*warm, lc);
    col=mix(col, cc, cm*.92);
  }
  // two hawks circling high up
  for(int i=0;i<2;i++){
    float fi=float(i); float a=t*(.10+fi*.03)+fi*2.;
    vec2 c=vec2(-.1+fi*.32+.13*cos(a), .30+fi*.04+.035*sin(a));
    vec2 q=(uv-c)/(.010-fi*.003); float y0=.32*abs(q.x)-.22*q.x*q.x+.08*sin(t*1.3+fi)*abs(q.x);
    col=mix(col, vec3(.06,.05,.05), smoothstep(.28,.08,abs(q.y-y0))*step(abs(q.x),1.4)*.85);
  }
  float cs=smoothstep(.5,.72,fbm4(vec2(uv.x*1.4-t*.012, uv.y*3.)+2.));   // cloud shadows sliding over the hills
  for(int k=0;k<5;k++){
    float fk=float(k);
    float y=layerY(uv.x,k);
    float e=.004; float sl=(layerY(uv.x+e,k)-y)/e;
    float hz=k==0?.48:k==1?.32:k==2?.06:k==3?.02:0.;
    if(uv.y<y){
      float d=y-uv.y; float s=k==2?8.:k==3?13.:k==4?8.:7.;
      vec2 q=vec2(uv.x*s+sl*d*s*.8, d*s*1.3);
      if(k==2){ vec2 r=uv-vec2(.13,.22); q=vec2(uv.x*7.+r.x*d*14., d*9.); }   // ridges fan out from the summit
      vec3 c=slopeCol(uv, q, sl, d, s, sun, k>=2?cs:0.);
      if(k==2){ // rocky summit
        float rk=smoothstep(.045,.012,d+(fbm4(uv*60.)-.5)*.04)*smoothstep(.1,.17,y);
        float rn=fbm4(uv*vec2(90.,140.));
        vec3 ra=mix(vec3(.30,.27,.24), vec3(.55,.46,.36), rn);
        c=mix(c, ra*(vec3(.16,.19,.30)+sun*clamp(.35+sl*.6+(rn-.5)*1.6,0.,1.)), rk);
        float rd=abs(uv.x-.06-.04*sin(d*55.)-.3*d);   // a dusty fire road winding up
        c=mix(c, vec3(.75,.58,.40)*sun*.7, smoothstep(.0025,.0008,rd)*smoothstep(.03,.06,d)*smoothstep(.28,.16,d)*.5);
      }
      if(k==4){ // near grass: blades and wind waves
        float bl=noise(vec2(uv.x*420., uv.y*70.))*.6+noise(uv*160.)*.4; float wv=sin(uv.x*7.-t*.7+fbm3(uv*4.)*4.);
        c*=.80+.32*bl+.08*wv;
        // the winding trail climbing up the hill
        float tt=clamp((uv.y+.5)/(y+.5),0.,1.);
        float xc=.08+.2*sin(tt*4.2+.4)*(1.-tt*.6)+.05*tt;
        float w=mix(.075,.006,pow(tt,.8));
        float tr=smoothstep(w,w*.6,abs(uv.x-xc+(noise(vec2(uv.y*60.,2.))-.5)*w*.3));
        vec3 dirt=mix(vec3(.42,.32,.22), vec3(.62,.50,.36), noise(uv*vec2(80.,200.)));
        dirt*=vec3(.16,.19,.30)+sun*(1.-.6*cs)*(.55+.25*smoothstep(-1.,1.,-(uv.x-xc)/w));
        c=mix(c, dirt, tr);
      }
      hz+=(1.-hz)*.14*smoothstep(.0,.1,d)*(k<=1?1.:k==2?.3:.1);   // low valley haze
      col=mix(c, hazeM(uv,warm), hz);
    }
    // oak trees dotted on the near hills, in clumps (a tree may poke above the ridge line)
    if(k>=3){
      float cell=k==3?.026:.06;
      for(int j=-1;j<=0;j++){
        float cx=floor(uv.x/cell)+float(j);
        float cy=floor(uv.y/cell);
        for(int m=0;m<2;m++){
          vec2 id=vec2(cx, cy-float(m));
          vec2 c=(id+.3+.4*h22(id+fk))*cell;
          float yb=layerY(c.x,k);
          float r=cell*(.16+.16*h21(id+3.));
          float clump=fbm3(c*vec2(9.,14.)+fk*5.);
          if(h21(id*1.3+fk*9.)>clump*2.2-.75 || c.y>yb-r*.4 || c.y<yb-(k==3?.12:.4)) continue;
          vec2 sq=(uv-c-vec2(r*1.8,-r*.9))/vec2(r*2.4,r*.4);   // long shadow cast away from the low sun
          if(uv.y<y && length(sq)<1.) col*=mix(1., .45, smoothstep(1.,.5,length(sq))*(1.-hz));
          vec2 q=(uv-c)/r;
          float dd=min(length(q*vec2(.8,1.2)), length((q-vec2(.45,-.15))*vec2(1.,1.3))*1.1);
          dd+=(fbm3(q*3.5+id)-.5)*.6;
          if(k==4 && abs(uv.x-c.x+q.y*r*.06)<r*.08 && q.y<-.4 && q.y>-1.1) dd=min(dd,.9);
          if(dd<1.){
            float lt=clamp(.45-q.x*.45+q.y*.35+(noise(q*6.+id)-.5)*.9,0.,1.);
            vec3 tc=vec3(.06,.075,.03)*(vec3(.16,.19,.30)+sun*lt*lt*1.3);
            col=mix(col, mix(tc, hazeM(uv,warm), hz), smoothstep(1.,.85,dd));
          }
        }
      }
    }
  }
  col+=vec3(1.,.55,.25)*exp(-length(uv-SUNP)*3.5)*.10*warm;   // sun glare in the air
  gl_FragColor=vec4(finish(col,uv),1.);
}
`;

<script>
// ---------- 7. SEATTLE: the skyline at dusk across Elliott Bay ----------
const SEATTLE = `
const float SH=-.10;   // shoreline of Elliott Bay
float segD(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float litFrac(float t){ return .28+.5*smoothstep(25.,170.,t); }   // more windows switch on as it gets dark
vec3 skyS(vec2 uv, float t, float px){
  float y=uv.y-SH;
  vec3 c=mix(vec3(1.05,.44,.18), vec3(.62,.24,.30), smoothstep(.0,.14,y));
  c=mix(c, vec3(.16,.16,.38), smoothstep(.08,.34,y));
  c=mix(c, vec3(.02,.035,.13), smoothstep(.28,.62,y));
  c*=.85+.3*smoothstep(-.8,.8,uv.x);                             // brighter toward the sunset side
  float cl=fbm(vec2(uv.x*1.1+t*.004, uv.y*8.))+.2*fbm4(vec2(uv.x*4.-t*.006, uv.y*20.));
  float cm=smoothstep(.62,.85,cl)*smoothstep(.07,.2,y)*smoothstep(.55,.3,y);
  c=mix(c, mix(vec3(.95,.38,.36), vec3(.10,.08,.18), smoothstep(.1,.36,y)), cm*.8);
  c+=starfield(uv, px, .3)*smoothstep(.32,.5,y);
  return c;
}
// Mount Rainier far away: snowy, pink in the last light, half lost in the haze
vec3 rainier(vec2 uv, vec3 sky){
  float dx=uv.x-.30;
  float top=SH+.01+.135*exp(-pow(abs(dx)/.25,1.25))+.018*exp(-pow((dx-.09)/.06,2.))-.01*exp(-pow((dx+.06)/.03,2.))+.010*(fbm4(vec2(uv.x*22.,5.))-.5);
  if(uv.y>top) return sky;
  float gl=1.-abs(fbm4(vec2(uv.x*38.+(uv.y-top)*20.*sign(dx), (uv.y-top)*12.))*2.-1.);
  float lit=clamp(.55+dx*2.5+(gl-.5)*.9,0.,1.);
  vec3 snow=mix(vec3(.18,.20,.40), vec3(1.05,.55,.55), lit)*(.75+.25*smoothstep(.0,.06,top-uv.y));
  snow=mix(snow, vec3(.12,.12,.22), smoothstep(.05,.13,top-uv.y)*.6);    // dark rock lower down
  return mix(snow, sky, .5+.4*smoothstep(SH+.07,SH+.01,uv.y));
}
// one row of buildings: returns rgb + coverage
vec4 towers(vec2 uv, float t, float cw, float hmax, float seed, float near){
  float ci=floor(uv.x/cw); float lx=fract(uv.x/cw);
  float prof=exp(-pow((uv.x-.14)/.17,2.))*.9+.25*exp(-pow((uv.x-.42)/.15,2.))+.08;
  float hs=h11(ci*1.7+seed);
  float h=SH+.012+hmax*prof*(.35+.65*hs*hs);
  float m0=.02+.08*h11(ci+seed*3.), m1=1.-.02-.08*h11(ci*2.3+seed);
  float st=h11(ci*5.1+seed);

<script>
// ---------- 8. FALLING LEAVES: a big autumn tree with sunbeams ----------
const LEAVES = `
const vec2 SUNL=vec2(.42,.40);
const float GY=-.17;   // where the grass meets the far park
float capsule(vec2 p, vec2 a, vec2 b, float ra, float rb){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-mix(ra,rb,h); }
vec3 leafHue(float k){ return k<.5 ? mix(vec3(.62,.07,.03), vec3(.95,.34,.04), k*2.) : mix(vec3(.95,.34,.04), vec3(1.,.70,.10), k*2.-1.); }
// how much of the big tree's leaves cover this spot (cheap version, also used for the sunbeams)
float crownV(vec2 p, float t){
  vec2 q=(p-vec2(-.06,.33))/vec2(.62,.34);
  float sh=length(q)+(fbm4(p*2.6+3.)-.5)*.6;
  vec2 w=p+vec2(sin(t*.6+p.y*3.)*.004, 0.);
  float f=fbm4(w*11.)*.75+noise(w*42.)*.25;
  float v=(1.-sh)*.75+(f-.5)*1.3-.04*smoothstep(.55,.75,noise(w*7.))+(noise(w*95.)-.5)*.07;
  return v;
}
float crown(vec2 p, float t){ return smoothstep(.0,.025,crownV(p,t)); }
float branches(vec2 p){
  float d=capsule(p, vec2(-.12,-.34), vec2(-.085,.12), .048, .03);
  d=min(d, capsule(p, vec2(-.085,.10), vec2(-.42,.33), .024, .006));
  d=min(d, capsule(p, vec2(-.08,.12), vec2(.30,.40), .022, .006));
  d=min(d, capsule(p, vec2(-.085,.14), vec2(-.04,.56), .022, .007));
  d=min(d, capsule(p, vec2(-.10,.02), vec2(-.36,.15), .016, .004));
  d=min(d, capsule(p, vec2(-.25,.22), vec2(-.20,.45), .009, .003));
  d=min(d, capsule(p, vec2(.10,.26), vec2(.20,.50), .009, .003));
  d=min(d, capsule(p, vec2(-.08,.04), vec2(.15,.18), .013, .004));
  d=min(d, capsule(p, vec2(.06,.14), vec2(.36,.22), .008, .002));

}
// one maple-ish leaf; returns (mask, side shade)
vec2 leafShape(vec2 q, float s, float blur){
  float a=atan(q.x,q.y); float r=length(q)/s;
  float R=.62+.38*pow(abs(cos(a*2.5)),.7)-.18*smoothstep(.6,1.,abs(a)/PI);

void main(){

      if(m>best*.9){ best=m; lc=leafHue(fract(h21(ci*1.3+float(j)*7.)*.7+fbm4(uv*9.)*.6))*(.65+.5*(cf.y+.5)); }

// ---------- 9. SNOWY FOREST at twilight ----------
const SNOWY = `
vec3 fogS(float y){ return mix(vec3(.22,.27,.46), vec3(.15,.20,.38), smoothstep(-.1,.2,y)); }
float groundY(float x, float k){ return -.03-k*.085+.018*(fbm4(vec2(x*(1.5+k*.4)+k*5., k))-.5); }
// one snowy spruce in cell ti of row k; returns rgb + coverage
vec4 spruce(vec2 uv, float k, float t, float K, float ti){
  float jit=(h11(ti*1.7+k)-.5)*.5;
  if(h11(ti*3.1+k*7.)<(k==3.?.4:.1)) return vec4(0);                        // a few gaps
  float cx=(ti+.5+jit)/K-k*.37/K;
  if(k>=1. && abs(cx-.20)<(k==1.?.07:k==2.?.10:.22)) return vec4(0);           // keep the cabin visible
  float base=groundY(cx,k)-.004;
  float H=(k==0.?.15:k==1.?.24:k==2.?.42:.85)*(.65+.55*h11(ti*2.3+k));
  float yy=(uv.y-base)/H;
  if(yy<-.05 || yy>1.) return vec4(0);
  float x=uv.x-cx-sin(t*.4+ti)*.002*yy*yy;
  float wmax=H*.27*pow(max(1.-yy,0.),.95)+H*.006;
  float ax=abs(x)/max(wmax,.0001);
  float N=7.+4.*h11(ti+k*3.);
  float tc=yy*N+h11(ti*5.+k)+ax*ax*.55+(noise(vec2(x*90./H, yy*N*.5+ti))-.5)*.35;                                       // branch tips droop down
  float tier=fract(tc);
  float rag=(noise(vec2(uv.y*N/H*1.5, ti+x*200./H))-.5)*.3+(noise(vec2(uv.y, x)*500./H+ti)-.5)*.3;
  float hw=wmax*(.45+.55*(1.-tier)+rag);
  float m=smoothstep(hw,hw-.0012-.0015*(3.-k),abs(x));
  m=max(m, step(abs(x),H*.02)*step(yy,.08)*step(-.05,yy));
  if(m<=0.) return vec4(0);
  // snow sits on top of each layer of branches; dark needles show underneath
  float sn=smoothstep(.35,.62,tier+(noise(vec2(x*400./H,uv.y*300./H))-.5)*.5)*smoothstep(.02,.1,yy);
  sn=max(sn, smoothstep(.85,.97,yy));
  vec3 needles=vec3(.008,.018,.024)*(.7+.6*noise(vec2(x,uv.y)*600./H));
  vec3 snow=mix(vec3(.18,.24,.44), vec3(.40,.48,.74), clamp(tier*.9-x/wmax*.15,0.,1.))*(.85+.25*noise(vec2(x,uv.y)*450./H));
  return vec4(mix(needles, snow, sn*.95), m);

vec4 spruces(vec2 uv, float k, float t){

void main(){

vec3 rockCol(vec2 p, float wet, vec3 sunC){

  vec3 n=normalize(vec3((h-hx),(h-hy),.006));

// one fern frond: a curved stem with leaflets getting smaller toward the tip
float fern(vec2 p, vec2 base, float ang, float len, float bend, float t){

<script>
// ---------- 11. DESERT DUNES at sunrise ----------
const DUNES = `
// dune profile: long gentle slope up, a sharp crest, then a steep slip face down
float duneP(float f){ return f<.75 ? pow(f/.75,1.7) : pow((1.-f)/.25,1.25); }
float duneS(vec2 p){ vec2 q=p*.085; return -q.x*.9-q.y*.3+fbm3(q*.6)*1.8; }
float H(vec2 p){
  vec2 q=p*.085;
  float h=(2.4+1.6*noise(q*.6+3.))*duneP(fract(duneS(p)));
  vec2 q2=p*.24; float s2=-q2.x-q2.y*.5+fbm3(q2*.8+5.)*1.6;
  return h+.14*duneP(fract(s2));
}
vec3 skyD(vec3 rd, vec3 sd){
  float e=rd.y; float sa=max(dot(rd,sd),0.);
  vec3 c=mix(vec3(1.25,.56,.26), vec3(.62,.52,.56), smoothstep(-.02,.14,e));
  c=mix(c, vec3(.16,.32,.62), smoothstep(.1,.5,e));
  c+=vec3(1.,.48,.18)*pow(sa,8.)*.9+vec3(1.,.7,.4)*pow(sa,90.)*1.2;
  c+=vec3(1.7,.95,.45)*smoothstep(.99935,.9995,sa)*2.6;                  // the big low sun
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 sd=normalize(vec3(.42,.065,.9));
  vec3 ro=vec3(t*.06, 5.2, t*.02);
  vec3 rd=normalize(vec3(uv.x, uv.y-.10, 1.25));
  vec3 col;
  float tt=.5; bool hit=false;
  for(int i=0;i<130;i++){
    vec3 p=ro+rd*tt; float d=p.y-H(p.xz);
    if(d<.0015*tt){ hit=true; break; }
    if(tt>300.) break;
    tt+=max(d*(tt>25.?.55:.35), .006*tt);
  }
  if(hit){ float a=tt*.97, b=tt; for(int i=0;i<6;i++){ float m=(a+b)*.5; vec3 p=ro+rd*m; if(p.y-H(p.xz)>0.) a=m; else b=m; } tt=b; }
  vec3 haze=skyD(normalize(vec3(rd.x,.01,rd.z)),sd)*vec3(.72,.58,.5);
  if(hit){
    vec3 p=ro+rd*tt; float e=.004*tt+.01;
    float h0=H(p.xz);
    vec3 n=normalize(vec3(h0-H(p.xz+vec2(e,0.)), e, h0-H(p.xz+vec2(0.,e))));
    // wind ripples in the sand, fading with distance
    float fade=exp(-tt*.09);
    float rp=dot(p.xz,vec2(.35,1.))*48.+fbm3(p.xz*.8)*12.;
    n=normalize(n+vec3(.35,0.,1.)*cos(rp)*.07*fade*smoothstep(1.5,5.,tt));
    // soft shadow from the dunes in front of the sun
    float sh=1., st=.15;
    for(int i=0;i<22;i++){ vec3 q=p+n*.03+sd*st; float dd=q.y-H(q.xz); sh=min(sh, 10.*dd/st); st+=.25+st*.18; if(sh<0. || st>40.) break; }
    sh=clamp(sh,0.,1.); sh=sh*sh*(3.-2.*sh);
    float dif=max(dot(n,sd),0.);
    vec3 alb=mix(vec3(.80,.44,.21), vec3(.92,.56,.28), noise(p.xz*1.5))*(.92+.16*noise(p.xz*30.));
    vec3 lin=vec3(3.4,1.9,.85)*dif*sh+vec3(.13,.17,.36)*(.55+.45*n.y)*.38+vec3(.4,.2,.1)*max(-n.y*.0+.15,0.)*.3;
    col=alb*lin;
    // crest glow where the low sun skims the sharp ridge lines
    float cr=fract(duneS(p.xz)); col+=vec3(1.,.55,.25)*smoothstep(.06,.0,abs(cr-.75))*sh*.12*fade;
    // blowing sand streaming off the crests
    float bl=fbm4(vec2(p.x*.9-t*1.6, p.z*.25)+p.y)*smoothstep(.12,.0,abs(cr-.76))*smoothstep(.5,2.5,h0);
    col+=vec3(1.,.62,.32)*bl*.25*(.4+pow(max(dot(rd,sd),0.),4.));
    col=mix(col, haze, 1.-exp(-tt*.0045));
  } else col=rd.y<0. ? haze*.8 : skyD(rd,sd);
  // a low veil of drifting sand near the ground
  float veil=fbm4(vec2(uv.x*2.5-t*.08, uv.y*14.))*smoothstep(.06,-.1,uv.y-.03)*smoothstep(-.5,-.05,uv.y);
  col=mix(col, vec3(1.,.66,.40)*(.6+.5*pow(max(dot(rd,sd),0.),6.)), veil*.18);
  col+=vec3(1.,.55,.25)*pow(max(dot(rd,sd),0.),30.)*.25;
  gl_FragColor=vec4(finish(col*.8,uv),1.);
}

// ---------- shared bits for the 4 big cities ----------
const CITYKIT = `
float segD(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float boxD(vec2 p, vec2 c, vec2 hw){ vec2 d=abs(p-c)-hw; return max(d.x,d.y); }      // < 0 inside
float cover(float d, float e){ return clamp(.5-d/e,0.,1.); }                            // soft edge, e = one pixel
// rows of windows: 1 = a lit pane. frac = how many are switched on
float panes(vec2 p, vec2 cell, float seed, float frac, vec2 m){

// ---------- 12. SAN FRANCISCO: the Golden Gate Bridge with fog rolling in, at sunset into twilight ----------
const SANFRAN = `
const float H=-.10;                 // far shore of the bay
const float XA=-.36, XB=.34;        // the two towers (A is the near one, so it looks bigger)
const float YA=-.34, YB=-.27;       // where the towers stand in the water
const float HA=.63, HB=.49;
float tw;                           // 0 = sunset ... 1 = twilight

float baseY(float x){ return mix(YA, YB, (x-XA)/(XB-XA)); }
float deckY(float x){

  return dB+(H-.006-dB)*(1.-exp(-(x-XB)*3.));                 // the far end runs off toward the city

float cableY(float x){
  float tA=YA+HA*1.005, tB=YB+HB*1.005;

  vec3 h2=mix(vec3(.34,.25,.50), vec3(.09,.10,.30), tw), h3=mix(vec3(.08,.11,.27), vec3(.012,.022,.085), tw);

  c*=.8+.32*smoothstep(.9,-.9,uv.x);

  float cl=fbm(vec2(uv.x*1.2+t*.004, y*9.))+.25*fbm4(vec2(uv.x*5.-t*.007, y*26.));

const TOKYO2 = `
// the tall buildings along the right side of the street (z = distance, Y = height, in metres)
float hR(float z){ return 14.+34.*h11(floor(z/11.)*3.7+1.); }
vec3 wallT(float z, float Y, float t){

const CHERRY = `
const float PY=-.125;                // the pond's far edge

  d=min(d, segR(p, vec2(-.20,.02), vec2(-.04,.16+sw), .013, .006));

vec4 blossoms(vec2 p, float t, float px){

  f=max(f, 1.-length(q-vec2(-.05,.23))/.13); f=max(f, 1.-length(q-vec2(.10,.19))/.09);

vec3 aboveC(vec2 uv, float t, float px){

// light patterns on the shallow sea floor
float caustic(vec2 p, float t){
  vec2 q=p*1.6; float c=0.;

// a palm tree: curved trunk with rings and a crown of drooping fronds that sway
void palm(inout vec3 col, vec2 uv, vec2 base, vec2 top, float sc, float t, float seed){

// ---------- 19. GRAND CANYON: layers of red rock at sunset, deep shadows, a river far below ----------
const CANYON = `
const vec2 SUN=vec2(-.62,.13);
vec3 skyG(vec2 uv, float t){
  float y=uv.y-.06;
  vec3 c=mix(vec3(1.25,.62,.28), vec3(.85,.45,.42), smoothstep(.0,.12,y));
  c=mix(c, vec3(.30,.34,.62), smoothstep(.08,.35,y)); c=mix(c, vec3(.08,.14,.38), smoothstep(.3,.6,y));
  float sd=length(uv-SUN);

  float cl=fbm(vec2(uv.x*1.3+t*.003, y*8.));
  c=mix(c, mix(vec3(1.3,.55,.35), vec3(.45,.25,.35), smoothstep(.1,.35,y))*(1.+.8*exp(-sd*3.)), smoothstep(.6,.85,cl)*smoothstep(.06,.15,y)*.8);
  return c;
}
float terr(float v){ v*=3.; float f=fract(v); return (floor(v)+smoothstep(.45,.75,f))/3.; }
float prof(float x, float k){
  float p=.06-k*.085+(.03+.035*k)*terr(fbm4(vec2(x*(1.2+k*.4)+k*7.1, k*3.)));
  if(k>3.5) p+=.05-.26*smoothstep(.3,.02,abs(x-.06+.03*sin(x*9.)));                    // a deep notch: the inner gorge
  return p;
}
// rock colour: stripes of cream, orange and red stone; sunny faces glow, the rest is in blue shadow
vec3 rock(vec2 uv, float k, float top, float t){
  float d=top-uv.y;
  float wob=fbm4(vec2(uv.x*6., uv.y*2.+k))*.012;
  float sy=(uv.y+k*.013+wob)*(32.-k*4.);
  float b1=noise(vec2(k*.0+.5, sy)), b2=noise(vec2(3.5, sy*4.));
  vec3 c=mix(vec3(.92,.62,.40), vec3(.70,.24,.11), smoothstep(.35,.65,b1));
  c=mix(c, vec3(.95,.80,.60), smoothstep(.8,.95,b1)*.8);
  c*=.88+.2*b2;
  float e=.006, s=prof(uv.x+e,k)-prof(uv.x-e,k);
  float face=fbm4(vec2(uv.x*(5.+k*2.), d*6.+k*3.));                                     // big sunny and shady patches
  float lit=smoothstep(.42,.58,face+s*25.+.1*(noise(vec2(uv.x*60.,d*30.))-.5));
  lit*=1.-.9*smoothstep(.02,.08+.02*k,d);

// ---------- 20. MILKY WAY CAMP: the Milky Way over a glowing tent, pine trees, shooting stars ----------
const CAMP = `
const vec2 LAMP=vec2(.06,-.335);
vec3 skyM(vec2 uv, float t, float px){
  vec2 p=rot(t*.002)*(uv-vec2(0.,-.6))+vec2(0.,-.6);                                   // the sky turns very slowly
  vec3 c=mix(vec3(.035,.05,.07), vec3(.004,.007,.02), smoothstep(-.15,.45,uv.y));
  c+=vec3(.05,.10,.06)*exp(-(uv.y+.12)*12.)*.6;                                        // faint green airglow
  // the Milky Way: a glowing band with dark dusty lanes and a bright core
  vec2 dir=normalize(vec2(.75,1.)); vec2 o=vec2(-.62,-.22); float along=dot(p-o,dir), across=dot(p-o,vec2(-dir.y,dir.x))+.06*sin(along*2.);
  float w=.11+.05*along;
  float band=exp(-pow(across/w,2.));
  float n=fbm(p*5.), n2=fbm(p*14.+3.);
  float core=exp(-pow((along-.18)/.3,2.))*exp(-pow(across/.13,2.));
  float dust=smoothstep(.45,.75,fbm(vec2(along*6., across*18.)+n))*exp(-pow((across+.01*sin(along*9.))/(w*.35),2.));
  vec3 mw=mix(vec3(.45,.50,.65), vec3(.95,.75,.50), core)*band*(.25+.6*n*n2)*(1.+2.*core);
  mw+=vec3(.6,.25,.3)*pow(n2,4.)*band*.6;                                                 // pinkish glowing clouds
  mw*=1.-.85*dust;
  c+=mw*.8*smoothstep(-.2,.0,uv.y);
  c+=starfield(p, px, .85)*(1.+.7*band)*smoothstep(-.18,.0,uv.y);
  c+=starLayer(p, 4.*px, .5, px, 77., .3)*band*.6*(1.-dust);                           // tiny stars packed in the band
  // shooting star
  float P=11.; float k=floor(t/P); float lt=t-k*P;
  if(lt<1.2){ vec2 a=vec2(h11(k)*1.2-.5, .3+h11(k+3.)*.15); vec2 d=normalize(vec2(h11(k+5.)>.5?1.:-1.,-.5));

    float sd=segD(uv,tail,head); float hh=clamp(dot(uv-tail,head-tail)/dot(head-tail,head-tail),0.,1.);

}
// pine trees: pointy and layered, a dark row along the horizon
float pines(vec2 uv, float base, float sc, float seed){
  float x=uv.x/sc+seed, ci=floor(x), lx=fract(x)-.5;
  float h=base+sc*(.9+1.1*h11(ci+seed))*step(.15,h11(ci*2.+seed));

  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

  // the meadow

// ---------- 21. SATURN: the ringed planet, its shadow on the rings, and little moons ----------
const SATURN = `
const float R=.23, B=.47;                     // planet size, how much we see the rings from above
// how much stuff is in the rings at a distance r (in planet radii): C, B, Cassini gap, A ring, Encke gap
float ringD(float r){
  float d=smoothstep(1.23,1.26,r)*smoothstep(2.28,2.26,r);
  float c=mix(.22,.35,smoothstep(1.23,1.52,r));
  float b=smoothstep(1.52,1.56,r)*smoothstep(1.96,1.94,r)*(.75+.25*smoothstep(1.6,1.9,r));
  float a=smoothstep(2.02,2.04,r)*(.62-.12*smoothstep(2.1,2.27,r))*(1.-.9*smoothstep(.006,.0,abs(r-2.215)));
  float o=max(c*step(r,1.53),max(b,a));
  o*=.8+.35*noise(vec2(r*420.,.5))+.15*noise(vec2(r*90.,1.5));
  return clamp(o*d,0.,1.);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=starfield(uv+vec2(t*.0006,0.), px, .55)+vec3(.003,.004,.008);
  vec3 L=normalize(vec3(-.75,.35,.55));
  vec3 N=vec3(0., cos(B), sin(B));                                                    // the rings' "up" direction
  vec2 q=rot(.32)*(uv-vec2(.06,.02));
  float r2=dot(q,q);
  // the rings, where the line of sight crosses their plane
  float zr=-q.y*N.y/N.z; vec3 P=vec3(q,zr); float rr=length(P)/R;
  float rd=ringD(rr);
  float ld=dot(P,L); float sh=(ld<0. && length(P-L*ld)<R)?1.:0.;                      // Saturn's shadow on the rings

  col+=vec3(.9,.8,.6)*.025*exp(-max(sqrt(r2)-R,0.)*30.);

<script>
// ---------- 23. HOT-AIR BALLOONS: colourful balloons drifting over a misty valley at sunrise ----------
const BALLOONS = `
const vec2 SUN=vec2(.42,.07);
vec3 skyH(vec2 uv, float t){
  float y=uv.y;
  vec3 c=mix(vec3(1.45,.78,.35), vec3(1.05,.65,.55), smoothstep(-.05,.12,y));
  c=mix(c, vec3(.42,.58,.90), smoothstep(.06,.33,y)); c=mix(c, vec3(.16,.32,.75), smoothstep(.3,.55,y));
  float sd=length(uv-SUN);

  float cl=fbm(vec2(uv.x*1.5-t*.004, y*7.));

vec3 BPAL(float k){ k=mod(k,6.);
  return k<1.?vec3(.9,.08,.06):k<2.?vec3(1.,.55,.02):k<3.?vec3(1.,.85,.1):k<4.?vec3(.1,.55,.15):k<5.?vec3(.08,.25,.85):vec3(.55,.12,.6); }
// one balloon: returns colour + coverage
vec4 balloon(vec2 uv, vec2 pos, float s, float seed, float t){

  float w=q.y>-.5 ? sqrt(max(1.-q.y*q.y,0.)) : mix(.28,.866,clamp((q.y+1.35)/.85,0.,1.));

    float u=q.x/w, az=asin(clamp(u,-1.,1.));

    float k=pat<.35 ? gore+floor(seed*7.) : pat<.7 ? (mod(gore,2.)<1.?floor(seed*3.):floor(seed*3.)+3.) : floor(seed*6.)+step(abs(q.y-.1+.25*sin(az*6.)),.18)*2.;
    c=BPAL(k);
    if(pat>.7 && q.y<-.6) c=BPAL(floor(seed*6.)+4.);
    float seam=smoothstep(.04,.0,abs(fract((az/PI+.5)*12.)-.5)*2.-.94);
    c*=1.-.35*seam;

    float nz=sqrt(max(1.-u*u,0.));
    float lam=clamp(.65*u+.35*nz+.15*q.y,0.,1.);
    vec3 sh=c*(.12+1.25*lam)+vec3(1.,.7,.4)*pow(max(u,0.),6.)*.35*nz;
    // the burner flickering on: the inside glows orange
    float burn=step(.55,h11(seed*3.+floor(t*.25+seed)))*(.6+.4*noise(vec2(t*12.,seed)));
    sh+=vec3(1.4,.6,.15)*burn*.55*smoothstep(-.2,-1.35,q.y)*(1.-.5*abs(u));

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

      hc+=vec3(.5,.35,.15)*.25*smoothstep(-.4,.6,uv.x)*smoothstep(top-.04,top,uv.y);    // sun on the ridge tops

    }

// ---------- 24. GLACIER BAY: blue ice cliffs, floating icebergs, calm water, a whale tail now and then ----------
const GLACIER = `
const float WL=-.08;                  // the water line
vec3 aboveG(vec2 uv, float t){
  float y=uv.y;

  if(y<m1){ float r=fbm4(uv*vec2(26.,9.)); float snow=smoothstep(.45,.6,r+.5*(y-m1)/.1+.3);
    col=mix(mix(vec3(.30,.33,.40), vec3(.9,.93,.98), snow)*(.7+.4*smoothstep(-.3,.3,uv.x+r*.3)), vec3(.72,.80,.88), .45); }
  float m2=.02+.13*pow(1.-abs(fract(uv.x*1.6+.65)-.5)*2.,1.4)+.03*fbm4(vec2(uv.x*8.,3.));
  if(y<m2){ float r=fbm4(uv*vec2(40.,12.)+5.); float snow=smoothstep(.5,.62,r+.4*(y-m2)/.08+.2);
    col=mix(vec3(.16,.17,.20), vec3(.92,.95,1.), snow)*(.65+.45*smoothstep(-.2,.2,r-.5+uv.x*.2)); col=mix(col, vec3(.72,.80,.88), .2); }
  // the glacier: a river of ice coming down the valley between the mountains...
  float vw=.5-5.*max(y-.02,0.)+.03*noise(vec2(y*60.,3.));
  if(y>.0 && y<.11 && abs(uv.x+.12+.4*(y-.02))<vw){
    float k=(y-.0)/.11; float cr=smoothstep(.6,.9,noise(vec2(uv.x*(40.+200.*k), y*(250.+600.*k))));
    vec3 g=mix(vec3(.88,.92,.97), vec3(.45,.58,.72), cr*.7+.2*k)*(.85+.2*noise(uv*vec2(80.,300.)));
    g=mix(g, vec3(.45,.45,.48), smoothstep(.012,.0,abs(uv.x+.12+.15*(y-.02)+.12*(1.-k)*.5))*.6);   // a dark stripe of rocks
    col=mix(g, vec3(.72,.80,.88), .25*k);
  }

  if(y>WL && y<.05 && uv.x>-.78 && uv.x<.5){

      ice*=.85+.3*c1;

}
// an iceberg: an irregular white lump with blue shady sides
vec4 berg(vec2 uv, vec2 p, float w, float h, float seed){

  if(q.y<0.){ float uw=smoothstep(w*.9,w*.3,abs(q.x))*smoothstep(-h*1.2,0.,q.y); return vec4(vec3(.15,.55,.65),uw*.45); }

void tail(inout vec3 col, vec2 uv, float t){

<script>
// ---------- 25. FIREFLY MEADOW: a summer field at dusk, hundreds of blinking fireflies, the moon rising ----------
const FIREFLY = `
const float HZ=-.06;                   // horizon
vec3 skyF(vec2 uv, float t, float px){
  float y=uv.y-HZ;
  vec3 c=mix(vec3(.95,.50,.30), vec3(.45,.35,.50), smoothstep(.0,.12,y));
  c=mix(c, vec3(.07,.11,.30), smoothstep(.06,.3,y)); c=mix(c, vec3(.012,.025,.09), smoothstep(.25,.55,y));
  c*=.75+.4*smoothstep(.7,-.8,uv.x);                                                 // last light on the left
  c+=starfield(uv, px, .5)*smoothstep(.2,.45,y);
  // the moon rising on the right, big and golden near the horizon
  vec2 mc=vec2(.52, HZ+.05+t*.0006); vec2 mp=uv-mc; float md=length(mp);
  float mr=.075;
  if(md<mr){ float cr=fbm4(mp*40.+3.); vec3 mn=vec3(mp,sqrt(mr*mr-md*md))/mr;
    c=vec3(1.25,.95,.62)*(.75+.3*cr-.25*smoothstep(.45,.65,fbm4(mp*14.)))*(.7+.3*mn.z); }
  c+=vec3(1.,.8,.5)*(exp(-max(md-mr,0.)*18.)*.18+exp(-max(md-mr,0.)*60.)*.2);
  return c;
}
// tall grass blades swaying in the evening breeze
float blades(vec2 uv, float t, float w, float base, float hmax, float seed){
  float res=0.;
  for(int o=-1;o<=1;o++){
    float ci=floor(uv.x/w)+float(o);
    float r=h11(ci+seed);
    float cx=(ci+.5+.6*(h11(ci*1.7+seed)-.5))*w;
    float h=hmax*(.4+.6*r);
    float y=(uv.y-base)/h;
    if(y<0. || y>1.) continue;
    float bend=(.15*(r-.5)+.05*sin(t*.8+ci*.7+seed))*h;
    float x=cx+bend*y*y;
    float th=w*.32*(1.-y)+.0006;
    res=max(res, smoothstep(th,th*.5,abs(uv.x-x)));
  }
  return res;
}
// fireflies: each one drifts in little loops and blinks on and off
vec3 flies(vec2 uv, float t, float cell, float seed, float bright){
  vec3 c=vec3(0);

<script>
// ---------- 26. GIANT REDWOODS: Muir Woods, huge red trunks rising out of view, fog, slanting sunbeams, ferns ----------
const REDWOOD = `
vec3 fogR(vec2 uv){ return mix(vec3(.12,.16,.12), vec3(.50,.54,.47), smoothstep(-.35,.6,uv.y)); }
// sun shafts slanting down from the upper left
float shaftsR(vec2 uv, float t){
  vec2 d=normalize(vec2(.42,-1.)); float r=dot(uv, vec2(-d.y,d.x)), al=dot(uv,d);
  float b=pow(noise(vec2(r*7.+t*.015, .5)),3.)*1.7+pow(noise(vec2(r*19.-t*.012, 3.)),4.)*.9;
  return b*smoothstep(-.75,.45,uv.y)*(.55+.45*noise(vec2(r*3.,al*2.5+t*.04)));
}
// one row of trunks. fogK: how much fog is in front of this row
vec4 trunksR(vec2 uv, float px, float cell, float wmin, float wmax, float base, float seed, float fogK, float t){
  float ci=floor(uv.x/cell); vec4 res=vec4(0);
  for(int o=-1;o<=1;o++){
    float c=ci+float(o);
    if(h11(c*1.3+seed)<.22) continue;
    float y=uv.y-base;
    float cx=(c+.5+.55*(h11(c+seed)-.5))*cell; cx=cx*(1.-.2*(uv.y+.25))+y*.02*(h11(c*5.+seed)-.5);   // looking up: trunks lean in
    float w=mix(wmin,wmax,h11(c*2.1+seed));
    float W=w*(1.+.75*exp(-max(y,0.)/(w*2.2))-.05*y)+w*.05*(noise(vec2(y*4./max(w*8.,.3),c))-.5);   // roots flare out at the bottom
    float x=uv.x-cx;
    float a=cover(abs(x)-W, px)*smoothstep(-.03,.0,y);
    if(a<=0.) continue;
    float nx=x/W;
    // deep fibrous bark: long vertical ridges and grooves
    float rid=noise(vec2(nx*9.+c*3., y*.05/w+seed))*.55+noise(vec2(nx*26.+c, y*.15/w))*.3+noise(vec2(nx*70., y*.4/w))*.15;
    float groove=smoothstep(.32,.62,rid);
    float lt=clamp(.5-.7*nx,0.,1.)*.9+.06;                       // light from the left
    vec3 bark=mix(vec3(.03,.01,.006), vec3(.40,.12,.05), groove*lt+.12*lt);
    bark*=.8+.35*noise(vec2(nx*40.,y*8./w*.05));
    bark+=vec3(1.,.5,.2)*pow(clamp(-nx,0.,1.),5.)*.5*(.2+shaftsR(uv,t))*groove;   // sunlit edge
    bark=mix(bark, vec3(.10,.16,.05), smoothstep(.06,.0,y)*.7);    // moss near the ground
    float f=clamp(fogK+.25*fogK*(1.-smoothstep(-.3,.3,uv.y)),0.,.97);
    res=vec4(mix(bark, fogR(uv), f), a);
  }
  return res;
}
// a sword fern: arching fronds with saw-tooth leaflets
vec4 fernR(vec2 uv, vec2 b, float L, float seed, float t, float px){
  vec2 p=(uv-b)/L; if(p.y<-.1||abs(p.x)>1.4||p.y>1.1) return vec4(0);
  float a=atan(p.x,p.y), r=length(p);
  vec4 res=vec4(0);
  for(int i=0;i<11;i++){
    float fi=float(i);
    float a0=(fi/10.-.5)*2.9+.2*(h11(fi+seed)-.5);
    float len=.7+.35*h11(fi*3.+seed);
    float s=r/len; if(s>1.) continue;
    float aa=a0+sign(a0)*(.2+.55*abs(a0))*s*s+.03*sin(t*.6+fi*1.7+seed);
    float d=(a-aa)*r;
    float pin=fract(s*24.);
    float w=.085*sin(3.14*min(s*1.05,1.))*(.45+.55*smoothstep(.0,.5,pin)*smoothstep(1.,.7,pin))+.004;
    float cv=clamp(.5-(abs(d)-w)*L/px,0.,1.);

      vec3 g=mix(vec3(.015,.05,.01), vec3(.16,.34,.05), .5+.3*sign(d)+.25*h11(fi+seed))*(.45+.7*s);
      g*=.8+.25*pin;
      g=mix(g, vec3(.03,.07,.02), smoothstep(.006,.0,abs(d))*.6);     // the stem down the middle

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

  float sh=shaftsR(uv,t);

  float gy=-.18+.03*fbm4(vec2(uv.x*2.,1.));

  if(uv.y<gy){ float d=gy-uv.y; float n=fbm4(vec2(uv.x*30./(1.+d*6.), d*90.));
    float so=smoothstep(.45,.65,noise(vec2(uv.x*7./(1.+d*4.),d*18.)));                 // clover-like sorrel patches on brown needles
    vec3 g=mix(mix(vec3(.07,.035,.02), vec3(.20,.11,.06), n), mix(vec3(.04,.09,.02), vec3(.18,.30,.06), n), so)*(.6+.6*noise(vec2(uv.x*40./(1.+d*5.),d*120.)));
    g+=vec3(.5,.45,.15)*smoothstep(.6,.9,noise(vec2(uv.x*6.-d*3.,d*12.)))*.25;     // sunny patches
    col=mix(g, fogR(uv), .6*exp(-d*7.)); }
  col+=vec3(1.,.9,.65)*sh*.35*smoothstep(.1,-.4,uv.y);
  tr=trunksR(uv,px,.22,.025,.045,-.24,3.,.30,t); col=mix(col,tr.rgb,tr.a);
  // the high canopy: dark needle sprays against the bright fog
  float cn=fbm(vec2(uv.x*16.+.3*sin(uv.y*3.), uv.y*26.)+vec2(t*.003,0.))*.7+.3*fbm4(uv*vec2(5.,8.));
  float ca=smoothstep(.5,.6,cn+1.2*(uv.y-.43))*smoothstep(.3,.42,uv.y);

  col+=vec3(1.,.95,.75)*(1.-ca)*smoothstep(.3,.5,uv.y)*.25;                         // bright sky peeking through
  // sunbeams in the foggy air, with dust and tiny bugs floating in them
  col+=vec3(1.,.82,.5)*sh*.55;
  vec2 mg=uv*42.+vec2(t*.05, -t*.03); vec2 mi=floor(mg); vec2 mo=h22(mi)-.5;
  col+=vec3(1.,.9,.7)*exp(-length(fract(mg)-.5-mo*.6)*28.)*step(.7,h21(mi))*sh*1.5*(.5+.5*sin(t*1.3+h21(mi)*40.));
  tr=trunksR(uv,px,.42,.06,.09,-.33,4.,.12,t); col=mix(col,tr.rgb,tr.a);
  // ferns on the forest floor
  vec4 f;
  for(int i=0;i<6;i++){ float fi=float(i);
    f=fernR(uv, vec2(-.75+fi*.3+.08*h11(fi+2.), -.34-.03*h11(fi)), .12+.05*h11(fi*3.), fi, t, px); f.rgb=mix(f.rgb,fogR(uv),.25); col=mix(col,f.rgb,f.a); }
  tr=trunksR(uv,px,1.05,.15,.21,-.58,7.,.0,t); col=mix(col,tr.rgb,tr.a);
  for(int i=0;i<4;i++){ float fi=float(i);
    f=fernR(uv, vec2(-.95+fi*.62+.15*h11(fi+9.), -.56), .26+.08*h11(fi*5.), fi+10., t, px); col=mix(col,f.rgb*(1.+.6*sh),f.a); }

  float fg=fbm4(vec2(uv.x*1.5-t*.012, uv.y*4.));

  gl_FragColor=vec4(finish(col*.66,uv),1.);

<script>
// ---------- 27. AUTUMN MAPLES: red and gold maples along a clear stream with pebbles; leaves float and drift down ----------
const MAPLE = `
const float Y0=.10, EYE=1.6;
float sxM(float z){ return 2.2*sin(z*.13+.4)-1.1+.8*sin(z*.05); }       // the stream's middle (metres)
float hwM(float z){ return 1.7+.015*z; }
vec3 skyM(vec2 uv){ vec3 c=mix(vec3(.95,.88,.72), vec3(.42,.62,.88), smoothstep(Y0,.5,uv.y)); return c+vec3(1.,.8,.5)*.35*exp(-length(uv-vec2(-.35,.32))*3.); }
// a maple leaf shape: 5 pointy lobes. p in leaf units, returns 1 inside
float leafM(vec2 p){ float a=atan(p.x,p.y), r=length(p); float lob=.36+.64*pow(abs(cos(a*2.5)),2.)*(1.-.35*smoothstep(1.6,2.6,abs(a))); return step(r,lob)+step(abs(p.x),.03)*step(p.y,0.)*step(-.6,p.y); }
vec3 leafCol(float k){ return k<.4?mix(vec3(.75,.06,.02),vec3(.95,.22,.03),k/.4):k<.8?mix(vec3(.95,.35,.03),vec3(1.,.65,.08),(k-.4)/.4):vec3(.95,.78,.15); }
// leaf clumps: round bumps with dark gaps between them (x = shade, y = gap)
vec2 clumpM(vec2 q, float sd){
  vec2 g=q*7.+.9*vec2(noise(q*3.+sd),noise(q*3.+sd+5.)), gi=floor(g), gf=fract(g); float d1=9.; vec2 best=vec2(0);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 o=vec2(i,j); vec2 c=o+.5+.8*(h22(gi+o+sd)-.5); vec2 dd=gf-c; float d=dot(dd,dd); if(d<d1){ d1=d; best=dd; } }
  float b=sqrt(d1)/.62; return vec2(clamp(.6-.9*best.x+.9*best.y,0.,1.)*(1.-b*.4), smoothstep(.8,1.1,b)*smoothstep(.35,.65,noise(q*5.+sd)));
}
// rows of maple trees on both banks
vec3 treesM(vec2 uv, vec3 col, float t, float px){
  for(int k=0;k<6;k++){
    float z=48./pow(1.55,float(k)); float s=1./z;                    // far rows first
    float yb=Y0-EYE*s;
    if(uv.y<yb-.02*s*z*.0) {}
    float wx=uv.x*z; float sp=3.2; float ci=floor(wx/sp);
    for(int o=-1;o<=1;o++){
      float c=ci+float(o), r=h21(vec2(c,float(k)));
      float tx=(c+.5+.6*(r-.5))*sp;
      if(abs(tx-sxM(z))<hwM(z)+.8+(k>3?2.5:0.) || (k==5 && r<.5)) continue;     // no trees in the stream
      float th=7.+5.*h21(vec2(c,float(k)+9.)), cr=2.6+1.4*h21(vec2(c+3.,float(k)));
      vec2 p=vec2(wx-tx, (uv.y-yb)*z);
      // trunk
      float tw=.16+.04*cr;
      float bx=p.x+.15*sin(p.y*.8+c)-.25*smoothstep(th*.3,th*.7,p.y)*sign(r-.5)*(p.y-th*.3), tww=tw*(1.-.4*p.y/th);
      float br=abs(p.x-(p.y-th*.35)*.6*sign(h11(c+5.)-.5))-tww*.45;                   // one big branch
      if(p.y>0. && p.y<th*.75 && (abs(bx)<tww || (br<0. && p.y>th*.35))){
        float sh=.35+.65*smoothstep(tww,-tww,bx);
        vec3 bk=mix(vec3(.07,.06,.05), vec3(.22,.20,.17), noise(vec2(bx*12., p.y*3.))*sh)*sh;
        col=mix(bk, skyM(uv), smoothstep(8.,70.,z)*.75);
      }
      // the leafy crown: a lumpy round cloud of leaves
      vec2 q=(p-vec2(0.,th-cr*.8))/cr;
      float d=length(q*vec2(.95,1.1));
      if(d<1.4){
        float n=fbm4(q*2.5+c*7.)+.3*noise(q*11.+c)+.15*noise(q*30.);
        float edge=.75+.35*n-d;
        if(edge>0.){
          float lk=h21(vec2(c*1.7,float(k)+4.));
          vec3 lc=leafCol(clamp(lk+.12*(noise(q*1.5+c)-.5),0.,1.));
          float lit=clamp(.55-.45*q.x+.4*q.y,0.,1.);
          float lf=min(z*.2+.6,2.5);
          float leaves=noise(q*30.*lf+c)*.6+noise(q*70.*lf)*.4;                // clusters of little leaves
          vec2 cl=clumpM(q, c*3.1+float(k));
          float gap=cl.y;
          vec3 cc=lc*(.2+.75*lit+.3*cl.x)*(.6+.7*leaves)*mix(1.,.3,gap);
          cc+=lc*smoothstep(.12,.0,edge)*.5*smoothstep(.0,.6,-q.x+.3);          // backlit edges glow
          cc*=1.-.45*smoothstep(.3,.9,-q.y)*(1.-lit);
          cc=mix(cc, skyM(uv)*vec3(1.,.85,.7), smoothstep(6.,70.,z)*.75);       // haze far away
          col=mix(col, cc, smoothstep(0.,.08,edge)*(1.-gap*smoothstep(.25,.0,edge)));
        }
      }
    }
  }
  return col;
}
vec3 aboveM(vec2 uv, float t, float px){ return treesM(uv, skyM(uv), t, px); }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyM(uv);
  if(uv.y<Y0){
    float z=EYE/(Y0-uv.y), wx=uv.x*z;
    float sd=abs(wx-sxM(z))-hwM(z);
    // the banks: grass covered in fallen leaves
    vec2 gp=vec2(wx,z);
    float lv=noise(gp*1.5), lv2=noise(gp*vec2(9.,9.)), lv3=noise(gp*24.);
    vec3 g=mix(vec3(.13,.15,.05), vec3(.30,.28,.09), noise(gp*.7));
    vec3 lc=mix(leafCol(.35+.5*lv), vec3(.35,.18,.07), .35+.3*lv3);
    g=mix(g, lc, smoothstep(.35,.6,lv*.5+lv2*.5+.1))*(.45+.7*lv3*lv2+.2*lv);
    g=mix(g, skyM(vec2(uv.x,Y0))*.8, smoothstep(10.,80.,z));
    col=g;
    // rocks along the water's edge
    vec2 rc=gp*vec2(2.2,1.6); vec2 ri=floor(rc); vec2 rf=fract(rc)-.5-.3*(h22(ri)-.5);
    float rock=step(abs(sd),.45)*step(length(rf*vec2(1.,1.3)),.38*h21(ri+1.)+.1);
    col*=1.-.45*smoothstep(.9,.0,sd)*step(0.,sd);                                   // damp dark mud by the water
    if(rock>0.){ float sh=.55+.6*clamp(-rf.x-rf.y,-.5,.5); col=mix(vec3(.32,.30,.27),vec3(.55,.52,.46),h21(ri))*sh*(.8+.3*noise(gp*40.)); col=mix(col, skyM(vec2(uv.x,Y0))*.8, smoothstep(10.,80.,z)); }
    if(sd<0.){
      // the clear stream: pebbles on the bottom, trees reflected on top, ripples flowing toward us
      float rp=fbm3(vec2(wx*2., z*1.5+t*1.2))+.5*noise(vec2(wx*6., z*4.+t*2.5));
      vec2 pc=gp*vec2(7.,5.)+(rp-.7)*.6; vec2 pi=floor(pc); vec2 pf=fract(pc)-.5-.35*(h22(pi)-.5);
      float peb=smoothstep(.42,.32,length(pf));
      peb=smoothstep(.45,.2,length(pf))*(.6+.4*h21(pi+7.));
      vec3 bed=mix(vec3(.12,.10,.06), mix(vec3(.45,.36,.24),vec3(.33,.32,.30),h21(pi+2.))*(.6+.5*h21(pi)), peb*smoothstep(12.,3.,z));
      bed*=.75+.5*pow(noise(gp*vec2(4.,3.)+vec2(0.,t*.6)+rp),2.)*1.4;            // sunlight wiggles on the bottom
      bed*=vec3(.75,.85,.7);
      vec3 refl=aboveM(vec2(uv.x+(rp-.7)*.012, 2.*Y0-uv.y+.02*(rp-.7)*(1.+z*.02)), t, px);
      float fr=clamp(.35+.65*smoothstep(2.,9.,z),0.,1.);
      col=mix(bed*vec3(.8,.9,.75), refl*vec3(.75,.8,.8), fr);
      col+=vec3(1.,.9,.7)*pow(noise(vec2(wx*25., z*20.+t*3.)),30.)*1.2*smoothstep(25.,3.,z);  // glints
      col*=.7+.3*smoothstep(-.5,-.05,sd);
      // leaves floating down the stream
      vec2 fp=vec2(wx-sxM(z)*.0, z+t*.35)*vec2(1.6,1.2); vec2 fi=floor(fp);
      if(h21(fi)>.55){ vec2 lp=(fract(fp)-.5-.25*(h22(fi)-.5))*rot(h21(fi+3.)*6.28+t*.1*(h21(fi)-.5))/.15;
        if(leafM(lp)>0.){ col=leafCol(h21(fi+5.)*.85)*(.4+.35*noise(lp*3.))*(.8+.2*lp.y); col=mix(col, skyM(vec2(uv.x,Y0))*.8, smoothstep(10.,60.,z)); } }
      col=mix(col, skyM(vec2(uv.x,Y0))*.75, smoothstep(15.,90.,z)*.6);
    }
  }
  col=treesM(uv,col,t,px);

  for(int i=0;i<2;i++){
    float cs=.16+.1*float(i); vec2 lp=uv+vec2(sin(t*.3+float(i))*.05, t*(.04+.02*float(i)));
    vec2 ci=floor(lp/cs); if(h21(ci+float(i)*7.)>.35) continue;
    vec2 o=(h22(ci)-.5)*.6*cs+vec2(.03*sin(t*1.3+h21(ci)*9.),0.);
    vec2 q=(lp-(ci+.5)*cs-o)*rot(t*(.8+h21(ci))+h21(ci)*6.)/(cs*(.08+.03*float(i)));
    q.x/=.4+.6*abs(sin(t*1.5+h21(ci)*7.));                                      // tumbling

}

<script>
// ---------- 28. BAY BRIDGE AT NIGHT: the western span with the "Bay Lights" twinkling on its cables ----------
// m = metres along the bridge from the San Francisco anchorage; z = how far away that spot is
const BAYB = `
const float Y0=-.17;                                 // horizon
const float Z0=416.5, DZ=.2365, X0=-453.6, DX=.4068;
float mAt(float x){ return (x*Z0-X0)/(DX-x*DZ); }
float zAt(float m){ return Z0+m*DZ; }
float yW(float h, float z){ return Y0+(h-5.)/z; }     // screen height of something h metres above the water
float cableH(float m){                               // main cables: dip between towers, down to the deck at the ends
  if(m<353.) return mix(56.,160.,pow(clamp(m/353.,0.,1.),1.4));
  if(m<1057.){ float u=(m-705.)/352.; return 72.+88.*u*u; }
  if(m<1410.) return mix(160.,62.,pow((m-1057.)/353.,.7));
  if(m<1763.) return mix(62.,160.,pow((m-1410.)/353.,1.4));
  if(m<2467.){ float u=(m-2115.)/352.; return 72.+88.*u*u; }
  return mix(160.,56.,pow(clamp((m-2467.)/353.,0.,1.),.7));
}
float glow;    // how much the Bay Lights are on in this pixel (for the reflection)
vec3 skyBB(vec2 uv, float px, float t){
  float y=uv.y-Y0;
  vec3 c=mix(vec3(.05,.045,.09), vec3(.012,.02,.055), smoothstep(.0,.25,y)); c=mix(c, vec3(.003,.006,.02), smoothstep(.2,.6,y));
  c+=vec3(.30,.15,.08)*exp(-y*16.)*.45;                                        // city glow low in the sky
  float cl=fbm(vec2(uv.x*1.3+t*.004, y*5.));
  c=mix(c, vec3(.09,.06,.08)*(1.-smoothstep(.1,.45,y)*.6), smoothstep(.55,.8,cl)*.5);
  c+=starfield(uv,px,.12)*smoothstep(.12,.4,y);
  vec2 mp=uv-vec2(.52,.33); float md=length(mp);                               // a small moon
  if(md<.025) c=vec3(.9,.88,.8)*(.8+.2*fbm4(mp*90.)); c+=vec3(.5,.5,.6)*exp(-md*25.)*.1;
  return c;
}
vec3 farBB(vec2 uv, float px, float t){
  vec3 col=skyBB(uv,px,t);
  // the East Bay far away: dark hills sprinkled with lights
  float hh=Y0+.012+.02*fbm4(vec2(uv.x*3.,2.))*smoothstep(-.2,.6,uv.x);
  if(uv.y<hh){ col=vec3(.02,.02,.035)+vec3(.12,.07,.05)*smoothstep(hh-.02,hh,uv.y)*.4;

    col+=vec3(1.,.75,.45)*smoothstep(.5,.0,abs(v-.45))*.04;                        // the lower deck glows inside
    float car=step(.6,h11(floor(m/18.+t*1.2)))*smoothstep(.35,.0,abs(fract(m/18.+t*1.2)-.5));
    col+=vec3(1.3,1.1,.9)*car*smoothstep(.12,.0,abs(v-.92))*1.2;

vec4 pyramidPY(vec2 uv, vec2 a, float yb, float w, float xr, float cap, float px, float seed){
  float h=a.y-yb; float v=(a.y-uv.y)/h;                     // 0 at the top, 1 at the bottom

<script>
// ---------- 32. MOUNT EVEREST: the highest peak, a plume of snow blowing off the summit, a sea of clouds below ----------
const EVEREST = `
// a real 3D landscape (kilometres): Everest in the middle, Lhotse to the right, the Nuptse wall in front
const vec3 SUND=vec3(-.85,.38,.15);
float ridgedE(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ float r=1.-abs(noise(p)*2.-1.); s+=a*r*r; p=M2*p+vec2(1.7,9.2); a*=.5; } return s; }
float ridged3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ float r=1.-abs(noise(p)*2.-1.); s+=a*r*r; p=M2*p+vec2(1.7,9.2); a*=.5; } return s; }
float smax(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(a,b,h)+k*h*(1.-h); }
float baseE(vec2 p){
  vec2 e=p; float ev=8.85-(abs(e.x*.82+e.y*.25)+abs(e.y*.85-e.x*.3))*1.15;            // the big three-sided summit pyramid
  float lh=8.5-length((p-vec2(3.2,1.2))*vec2(1.,.9))*1.25;                           // Lhotse
  float nu=7.3-abs(p.y+3.2+.12*p.x)*1.5-max(abs(p.x+2.2)-1.6,0.)*.9;                  // Nuptse: a long sharp wall
  float lo=4.9-.18*length(p-vec2(0.,-6.));
  return smax(smax(smax(ev,lh,.6),nu,.5),lo,.6);
}
float terrE(vec2 p, bool fine){
  float b=baseE(p);
  vec2 q=vec2(p.x*.9, p.y*.45)+.3*vec2(noise(p*.5),noise(p*.5+4.));                   // ribs and gullies run down the slopes
  float r=fine?ridgedE(q):ridged3(q);
  return b+(r-.4)*1.6*smoothstep(4.5,7.,b)*(.35+.65*smoothstep(.1,1.2,length(p)));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 ro=vec3(-.5,6.5,-14.5), rd=normalize(vec3(uv.x, uv.y-.10, 1.75));
  vec3 L=normalize(SUND);
  // sky: deep blue above, paler at the horizon

  sky+=vec3(1.,.9,.75)*.18*pow(max(dot(rd,L),0.),6.);

  for(int i=0;i<90;i++){
    p=ro+rd*tt; float h=p.y-terrE(p.xz,false);
    if(h<.004*tt){ hit=1.; break; }
    if(p.y<5.0 || tt>45.) break;
    tt+=max(h*.45,.01*tt);
  }
  float cloudT=(5.2-ro.y)/rd.y;
  if(hit>0. && (rd.y>=0. || tt<cloudT)){
    for(int i=0;i<5;i++){ float h=p.y-terrE(p.xz,true); tt+=h*.5; p=ro+rd*tt; }
    float e=.012;
    float hc=terrE(p.xz,true);
    vec3 n=normalize(vec3(terrE(p.xz-vec2(e,0.),true)-terrE(p.xz+vec2(e,0.),true), 2.*e, terrE(p.xz-vec2(0.,e),true)-terrE(p.xz+vec2(0.,e),true)));
    float dif=max(dot(n,L),0.);
    // a quick shadow check toward the sun
    float sh=1.; float st=.08;
    for(int i=0;i<16;i++){ vec3 q=p+L*st; float d=q.y-terrE(q.xz,false); if(d<0.){ sh=0.; break; } st+=max(d*.6,.06); }
    float snow=smoothstep(.42,.62,n.y+.15*noise(p.xz*14.))*smoothstep(9.2,7.,p.y)+smoothstep(.62,.8,n.y);
    snow=clamp(snow,0.,1.);
    vec3 rock=mix(vec3(.07,.06,.06), vec3(.24,.20,.17), noise(p.xz*30.+p.y*9.));
    float band=smoothstep(.12,.0,abs(p.y-8.25))*.6;                                     // the Yellow Band near the top
    rock=mix(rock, vec3(.40,.31,.18), band);
    vec3 alb=mix(rock, vec3(.92,.94,.98), snow);

    float cov=smoothstep(.38,.55,d0);

    float k=max(q.x,0.), cy=.01*k+.05*k*k-.026;
    vec2 pp=vec2(q.x*9.-t*.15, (q.y-cy)*30./(1.+k*6.));
    float dens=fbm(pp+vec2(0.,t*.04))*exp(-pow((q.y-cy)/(.008+.07*k),2.))*exp(-k*4.)*smoothstep(-.012,.01,q.x)*1.3;
    col=mix(col, mix(vec3(.72,.80,.94), vec3(1.25,1.2,1.15), smoothstep(.2,.55,dens)), smoothstep(.1,.45,dens)*.85);

<script>
// ---------- 33. NIAGARA FALLS: the curved Horseshoe Falls, huge mist, a rainbow, a little boat near the bottom ----------
const NIAGARA = `
const float Y0=.17;
// the horseshoe: the left arm goes away from us, the deep middle is far, the right (Canadian) arm comes close
float brinkY(float x){ return .145-.04*smoothstep(-.2,-.8,x)-.17*smoothstep(.15,.85,x)+.003*noise(vec2(x*50.,1.)); }

vec3 skyN(vec2 uv){ return mix(vec3(.48,.60,.78), vec3(.10,.28,.66), smoothstep(.15,.5,uv.y)); }

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

  col+=vec3(1.,.75,.45)*.5*exp(-length(uv-SUNG)*3.)+vec3(1.,.95,.8)*smoothstep(.04,.03,length(uv-SUNG));
  for(int k=0;k<5;k++){

    vec4 w=vec4(0);

<script>
// ---------- 36. TAJ MAHAL: white marble glowing pink and gold at sunrise, reflected in the long pool ----------
const TAJ = `
const float PB=-.115;                      // the top of the big platform (the water line of the reflection)
vec3 skyT(vec2 uv){
  float y=uv.y-PB;
  vec3 c=mix(vec3(1.05,.55,.35), vec3(.75,.48,.55), smoothstep(.0,.2,y)); c=mix(c, vec3(.28,.32,.58), smoothstep(.15,.6,y));
  c+=vec3(1.,.55,.25)*.5*exp(-length(uv-vec2(-.9,PB+.05))*2.2);
  float cl=fbm(vec2(uv.x*1.5,y*6.)); c=mix(c, mix(vec3(1.2,.65,.5), vec3(.45,.35,.5), smoothstep(.2,.5,y)), smoothstep(.6,.85,cl)*smoothstep(.15,.3,y)*.6);
  return c;
}
vec3 marble(float lit, float x, float y){ vec3 c=mix(vec3(.09,.09,.18), vec3(1.05,.62,.44), lit*lit*(3.-2.*lit)); return c*(.92+.08*noise(vec2(x*300.,y*300.))); }
// an onion dome: base at y0, half-width w, total height h. returns colour + coverage
vec4 domeT(vec2 uv, float cx, float y0, float w, float h, float px){
  float u=(uv.y-y0)/h; if(u<0. || u>1.25) return vec4(0);
  float v=clamp((u-.32)/.68,0.,1.);
  float r=u<.32?mix(w*.78,w,smoothstep(.0,.32,u)):w*sqrt(max(1.-v*v,0.))*(1.-.55*v*v*v);
  float dx=uv.x-cx;
  float d=abs(dx)-r;
  if(u>.98) d=abs(dx)-max(w*.025,px*.8);                                 // the golden spike on top
  float a=cover(d,px); if(a<=0.) return vec4(0);
  float nx=clamp(dx/max(r,.001),-1.,1.);
  float lit=clamp(.55-.75*nx+.15*(u-.4),0.,1.);
  vec3 c=marble(lit,uv.x,uv.y);
  if(u>.98) c=vec3(1.1,.75,.30)*(.6+.5*lit);
  return vec4(c,a);
}
vec4 tajT(vec2 uv, float px, float t){
  vec4 res=vec4(0); float ax=abs(uv.x);
  // four tall minarets with balconies and little domes
  float mx=ax-.50;
  if(abs(mx)<.03 && uv.y>PB && uv.y<.33){
    float y=uv.y, w=.019-.005*(y-PB)/.42;
    float bal=step(abs(fract((y-PB)/.115)-.92),.035)*step(y,.22);
    float d=abs(mx)-w-.006*bal;
    if(y>.22 && y<.26) d=abs(mx)-.016*step(fract((mx+.02)/.008),.6)-.002;      // the little open kiosk on top
    vec4 dm=domeT(vec2(mx+.5*sign(uv.x)*0.,uv.y),0.,.255,.017,.05,px);
    float a=max(cover(d,px)*step(y,.255), dm.a);
    float lit=uv.x<0.?clamp(.6-mx/w*.5,0.,1.):clamp(.35-mx/w*.5,0.,1.);
    vec3 c=marble(lit*(.85+.15*bal),uv.x,uv.y)*(1.-.15*step(.5,fract(y*60.)));
    if(dm.a>0. && y>.255) c=dm.rgb;
    res=vec4(c,a);
  }
  // the main building: a big square with cut corners, a huge pointed arch in the middle
  if(ax<.27 && uv.y>PB && uv.y<.135){
    float side=step(.21,ax);                                                   // the angled corner panels
    float lit=uv.x<0.?.82:.5; lit*=1.-.3*side; lit*=.85+.15*smoothstep(PB,.13,uv.y);
    vec3 c=marble(lit,uv.x,uv.y);
    // the tall central arch (iwan) with a frame of black inlay
    float ia=ax/.07, iy=(uv.y-PB)/(.11-PB);
    float arch=step(ia,1.)*step(iy,.82+.18*sqrt(max(1.-ia*ia,0.))-.12*ia);
    float frame=step(ax,.088)*step(uv.y,.128)*(1.-step(ax,.081)*step(uv.y,.12));
    c=mix(c, marble(.25,uv.x,uv.y)*vec3(.9,.85,.95), arch);
    c=mix(c, vec3(.35,.25,.20), frame*.8);
    c=mix(c, vec3(.06,.05,.06), step(ia,.42)*step(iy,.30+.08*sqrt(max(1.-pow(ia/.42,2.),0.))));               // the doorway
    // two stories of smaller arches on each side
    float sx=fract((ax-.10)/.055), sy=fract((uv.y-PB)/.12), row=floor((uv.y-PB)/.12);
    float sa=step(.18,sx)*step(sx,.82)*step(.12,sy)*step(sy,.72+.15*sqrt(max(1.-pow((sx-.5)/.32,2.),0.)))*step(.1,ax)*step(ax,.265)*step(row,1.);
    c=mix(c, marble(.18,uv.x,uv.y), sa*.9);
    res=vec4(c,1.);
    if(uv.y>.128 && step(.5,fract(uv.x*90.))>0.) res.a=0.;                     // a lacy top edge
  }
  // the drum, the four little domed kiosks and the great dome
  if(ax<.105 && uv.y>.13 && uv.y<.175){ float lit=clamp(.62-.5*uv.x/.105,0.,1.); res=vec4(marble(lit,uv.x,uv.y)*(1.-.25*step(.6,fract(uv.x*60.))*step(.14,uv.y)),1.); }
  vec4 k=domeT(vec2(ax,uv.y),.175,.165,.032,.06,px);
  if(ax>.155 && ax<.195 && uv.y>.12 && uv.y<.168){ float pil=step(.55,fract((ax-.155)/.01)); k=vec4(mix(skyT(uv)*.5,marble(uv.x<0.?.75:.5,uv.x,uv.y),max(pil,step(uv.y,.128)+step(.16,uv.y))),1.); }
  if(k.a>0.) res=vec4(mix(res.rgb,k.rgb,k.a),max(res.a,k.a));
  vec4 dm=domeT(uv,0.,.172,.118,.20,px);
  if(dm.a>0.) res=vec4(mix(res.rgb,dm.rgb,dm.a),max(res.a,dm.a));
  // the wide platform
  if(ax<.62 && uv.y<PB+.002 && uv.y>PB-.03){ res=vec4(marble(.6,uv.x,uv.y)*(.85+.15*step(.5,fract(uv.x*40.))),1.); }
  return res;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyT(uv);
  // trees behind on both sides, far away
  if(uv.y<PB+.04+.025*fbm4(vec2(uv.x*10.,1.))+.012*noise(vec2(uv.x*60.,2.)) && uv.y>PB-.03) col=mix(vec3(.02,.04,.02)*(.7+.6*noise(uv*150.)), vec3(.30,.25,.38), .3);
  vec4 tj=tajT(uv,px,t); col=mix(col,tj.rgb,tj.a);
  // the garden: lawns, rows of dark cypress trees, and the long reflecting pool in the middle
  float yb=PB-.03;
  if(uv.y<yb){
    float d=yb-uv.y, z=.05/(d+.012);
    float pw=.015+d*.42;
    col=mix(vec3(.012,.035,.01), vec3(.05,.11,.025), noise(vec2(uv.x*z*20.,z*8.)))*(.8+.3*noise(vec2(uv.x*200.,uv.y*300.)));
    col+=vec3(.9,.45,.2)*.04*smoothstep(.6,-.6,uv.x);                                            // first warm light across the grass
    col=mix(col, vec3(.70,.50,.42)*.7*(uv.x<0.?1.1:.8), step(abs(uv.x),pw+.012+d*.15)*step(pw,abs(uv.x)));     // the stone walkways
    if(abs(uv.x)<pw){
      float rip=noise(vec2(uv.x*z*40., z*20.+t*.3));
      vec2 m=vec2(uv.x+(rip-.5)*.002, 2.*yb-uv.y+(rip-.5)*.004);
      vec3 r=skyT(m); vec4 rt=tajT(m,px*2.,t); r=mix(r,rt.rgb,rt.a);
      col=vec3(.02,.04,.06)+r*vec3(.62,.66,.72);
    }
  }
  // cypress trees in two rows beside the pool
  for(int j=0;j<9;j++){ float fj=float(j); float d=.012+fj*fj*.006; float ty=yb-d; float sc=.4+d*9.;
    for(int i=0;i<2;i++){ float sg=i==0?-1.:1.; float tx=sg*(.015+d*.42+.025+d*.25);
      vec2 q=(uv-vec2(tx,ty))/(.05*sc); float wq=.11*(1.-q.y)*sqrt(max(q.y,0.)*1.5+.05);
      if(q.y>0. && q.y<1. && abs(q.x)<wq) col=mix(vec3(.02,.05,.02),vec3(.10,.16,.06),clamp(.6-q.x/wq*.5*sg*-1.,0.,1.))*(.8+.4*noise(q*30.)); } }
  gl_FragColor=vec4(finish(col*.8,uv),1.);
}
`;

// ---------- 37. 🎁 MYSTERY SURPRISE: Ben's Game Factory at sunset, a rocket launching, fireworks shaped like game icons,
//            and Sparks the robot dog with Charlie and August watching from the hill ----------
const FACTORY = `
const float HY=-.02;
vec3 skyGF(vec2 uv, float px){
  float y=uv.y-HY;
  vec3 c=mix(vec3(1.1,.45,.15), vec3(.75,.25,.30), smoothstep(.0,.15,y)); c=mix(c, vec3(.18,.10,.28), smoothstep(.12,.4,y)); c=mix(c, vec3(.03,.03,.10), smoothstep(.35,.6,y));
  c+=vec3(1.2,.55,.15)*exp(-length((uv-vec2(.62,HY+.02))*vec2(1.,1.6))*4.)*.8;
  float cl=fbm(vec2(uv.x*1.4,y*7.)); c=mix(c, mix(vec3(1.3,.5,.3), vec3(.3,.12,.25), smoothstep(.08,.3,y)), smoothstep(.62,.85,cl)*smoothstep(.06,.15,y)*.7);
  c+=starfield(uv,px,.4)*smoothstep(.3,.5,y);
  return c;
}
// a firework burst shaped like a game icon: 0 = star, 1 = heart, 2 = ring, 3 = smiley
vec3 fireGF(vec2 uv, float t, float id){
  float P=6., lt=mod(t+id*2.,P), k=floor((t+id*2.)/P);
  if(lt>3.2) return vec3(0);
  vec2 c=vec2(-.55+1.1*h11(k*3.1+id), .22+.12*h11(k*7.3+id));
  float shape=floor(h11(k*5.7+id)*4.);
  vec3 colr=.5+.5*cos(6.28*(h11(k+id*9.)+vec3(0.,.33,.67)));
  float R=.09*(1.-exp(-lt*2.2)), fade=smoothstep(3.2,1.2,lt)*smoothstep(0.,.1,lt);
  vec3 o=vec3(0);
  for(int i=0;i<36;i++){
    float a=float(i)/36.*6.2832; vec2 d=vec2(cos(a),sin(a)); float r=1.;
    if(shape<1.) r=.55+.45*pow(abs(cos(a*2.5+1.5708)),2.);                                       // star
    else if(shape<2.){ float s=a; d=vec2(16.*pow(sin(s),3.), 13.*cos(s)-5.*cos(2.*s)-2.*cos(3.*s)-cos(4.*s))/17.; r=1.; }   // heart
    else if(shape>2.5 && i>27){ d=vec2((float(i-28)/7.-.5)*1.,-.35-.25*sin(float(i-28)/7.*3.14)); }      // the smiley's mouth
    vec2 p=c+d*r*R+vec2(0.,-.03*lt*lt);
    if(shape>2.5 && (i==3 || i==6)) p=c+vec2(i==3?-.3:.3,.3)*R+vec2(0.,-.03*lt*lt);               // its eyes
    float dd=length(uv-p);
    o+=colr*(exp(-dd*dd/.000016)*2.2+exp(-dd/.008)*.12)*fade;
  }
  return o;
}
// little seated animals seen from behind, for the hill in front
float ellD(vec2 p, vec2 c, vec2 r){ return length((p-c)/r)-1.; }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyGF(uv,px);
  col+=fireGF(uv,t,0.)+fireGF(uv,t,1.)+fireGF(uv,t,2.);
  // the rocket gently launching from its pad on the right, with a soft glowing trail
  float RP=24., rl=mod(t,RP), ry=-.08+.012*rl*rl*.18; float rx=.48+.0004*rl*rl;
  if(rl<16.){
    vec2 q=(uv-vec2(rx,ry))/1.6;
    float trail=exp(-pow(q.x/(.004+.02*max(-q.y,0.)),2.))*step(q.y,0.)*exp(q.y*6.)*smoothstep(.0,1.,rl);
    col=mix(col, vec3(1.,.85,.75), clamp(trail*.9*(.6+.4*fbm4(vec2(q.x*40.,q.y*20.-t))),0.,.85));
    float body=step(abs(q.x),.012*(1.-smoothstep(.03,.06,q.y)))*step(-.0,q.y)*step(q.y,.065);
    float fins=step(abs(q.x),.022-q.y*.3)*step(0.,q.y)*step(q.y,.018);
    float win=step(length(q-vec2(0.,.035)),.006);
    if(body+fins>0.){ col=mix(vec3(.95,.92,.88), vec3(.9,.15,.12), max(step(.05,q.y),fins))*(.55+.5*smoothstep(.012,-.012,q.x)); if(win>0.) col=vec3(.3,.7,1.); }
    float fl=exp(-length((q-vec2(0.,-.012))*vec2(2.5,1.))/.008)*(.8+.2*sin(t*30.));
    col+=vec3(1.5,.8,.3)*fl*smoothstep(.0,.5,rl);

  if(uv.y<h1){ col=mix(vec3(.006,.010,.006), vec3(.025,.032,.012), noise(uv*vec2(30.,60.)))*(.8+.4*noise(uv*vec2(200.,300.)));
    col+=vec3(1.,.45,.15)*.12*smoothstep(h1-.02,h1,uv.y)*smoothstep(-.4,.6,uv.x); }

  if(abs(uv.x-.48)<.045 && uv.y<-.08 && uv.y>-.10) col=vec3(.02,.018,.022);
  // the factory on the hill: brick walls, a saw-tooth roof, glowing windows, chimneys puffing rainbow bubbles, a big turning gear
  vec2 f=uv-vec2(-.12,-.10);
  if(f.x>-.30 && f.x<.30 && f.y>0. && f.y<.16+.035*(1.-fract((f.x+.3)/.1))*step(.12,f.y)){
    float brick=step(.1,fract(f.y*120.))*step(.06,fract(f.x*60.+floor(f.y*120.)*.5));
    col=mix(vec3(.025,.008,.006), vec3(.11,.035,.02), brick*(.7+.3*noise(f*200.)))*(.6+.6*smoothstep(-.3,.3,f.x));
    if(f.y>.16) col=vec3(.015,.012,.02)+vec3(1.,.6,.3)*.6*step(.6,fract((f.x+.3)/.1));           // the roof, with skylights
    vec2 w=vec2(fract((f.x+.3)/.06)-.5, f.y);
    if(abs(w.x)<.3 && ((w.y>.025 && w.y<.06) || (w.y>.09 && w.y<.125))) col=vec3(1.6,.95,.45)*(.8+.3*noise(vec2(f.x*90.,t*.5)))*(1.-.25*step(.45,fract(w.y*80.)));
  }

  if(abs(f.x)<.31 && f.y<0. && f.y>-.03) col=mix(vec3(.006,.01,.005),vec3(.02,.028,.01),noise(uv*80.));     // grass at its feet
  vec2 gq=f-vec2(0.,.075); float gr=length(gq), ga=atan(gq.y,gq.x)+t*.4;
  float gear=step(gr,.040+.008*step(.5,fract(ga/6.2832*10.)))*step(.012,gr);

  for(int i=0;i<2;i++){ float cx=-.24+float(i)*.12; vec2 cq=uv-vec2(cx-.12,-.10);

    for(int j=0;j<5;j++){ float fj=float(j); float pl=fract(t*.12+fj*.2+float(i)*.1);

      col=mix(col, bc*(.7+.5*smoothstep(br,-br,uv.x-bp.x+uv.y-bp.y)), smoothstep(br,br-.003,bd)*(1.-pl)*.85); } }
  // the hill in front where three friends sit watching the show
  float fh=-.30+.04*sin(uv.x*3.)+.01*noise(vec2(uv.x*40.,1.));
  if(uv.y<fh){ col=mix(vec3(.004,.007,.003), vec3(.018,.026,.008), noise(uv*vec2(80.,200.))*.6+.4*noise(uv*vec2(20.,40.)))*(1.-.4*smoothstep(fh,fh-.2,uv.y)); col+=vec3(1.,.5,.15)*.12*smoothstep(fh-.01,fh,uv.y); }
  // Sparks: a long yellow robot dog with a purple head-top, ears, back and tail
  vec2 s=uv-vec2(-.10,-.27);
  float sd=ellD(s,vec2(0.,.035),vec2(.11,.04));
  sd=min(sd, ellD(s,vec2(.10,.085),vec2(.04,.038)));
  float ears=min(ellD(s,vec2(.08,.125),vec2(.012,.025)), ellD(s,vec2(.12,.125),vec2(.012,.025)));
  float tail=segD(s,vec2(-.11,.04),vec2(-.15,.08+.01*sin(t*4.)))-.008;
  float legs=min(ellD(s,vec2(-.07,.0),vec2(.018,.02)), ellD(s,vec2(.06,.0),vec2(.018,.02)));
  if(min(min(sd,legs),min(ears,tail/.03))<0.){
    col=vec3(.85,.62,.06)*(.45+.6*smoothstep(-.1,.1,s.x));
    if(ellD(s,vec2(0.,.07),vec2(.10,.012))<0. || ellD(s,vec2(.10,.11),vec2(.035,.016))<0. || ears<0. || tail<.0) col=vec3(.30,.08,.55)*(.6+.5*smoothstep(-.1,.1,s.x));
    col+=vec3(1.,.5,.2)*.25*smoothstep(-.02,.05,s.x+s.y);

  for(int i=0;i<2;i++){ float fi=float(i); vec2 c=uv-vec2(.16+fi*.16,-.285); float sc=fi>.5?1.25:1.;

    vec2 ec=vec2(abs(c.x)-.017,c.y-.112); float ear=max(-ec.y, abs(ec.x)-.012*(1.-ec.y/.032)); ear=max(ear, ec.y-.032);
    float tl=segD(c,vec2(.03,.01),vec2(.07,.03+.02*sin(t*2.+fi)))-.007-fz;
