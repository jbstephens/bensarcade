<script>
// ---------- 23. HOT-AIR BALLOONS: colourful balloons drifting over a misty valley at sunrise ----------
const BALLOONS = `
const vec2 SUN=vec2(.42,.07);
vec3 skyH(vec2 uv, float t){
  float y=uv.y;
  vec3 c=mix(vec3(1.45,.78,.35), vec3(1.05,.65,.55), smoothstep(-.05,.12,y));
  c=mix(c, vec3(.42,.58,.90), smoothstep(.06,.33,y)); c=mix(c, vec3(.16,.32,.75), smoothstep(.3,.55,y));
  float sd=length(uv-SUN);
  c+=vec3(1.5,1.0,.55)*exp(-sd*6.)*.6+vec3(2.,1.7,1.2)*smoothstep(.035,.03,sd);
  float cl=fbm(vec2(uv.x*1.5-t*.004, y*7.));
  c=mix(c, vec3(1.25,.85,.65)*(1.+exp(-sd*3.)), smoothstep(.62,.85,cl)*smoothstep(.1,.25,y)*.6);
  return c;
}
vec3 BPAL(float k){ k=mod(k,6.);
  return k<1.?vec3(.9,.08,.06):k<2.?vec3(1.,.55,.02):k<3.?vec3(1.,.85,.1):k<4.?vec3(.1,.55,.15):k<5.?vec3(.08,.25,.85):vec3(.55,.12,.6); }
// one balloon: returns colour + coverage
vec4 balloon(vec2 uv, vec2 pos, float s, float seed, float t){
  vec2 q=(uv-pos)/s;
  if(abs(q.x)>1.1 || q.y>1.05 || q.y<-1.8) return vec4(0);
  float w=q.y>-.5 ? sqrt(max(1.-q.y*q.y,0.)) : mix(.28,.866,clamp((q.y+1.35)/.85,0.,1.));
  vec3 c=vec3(0); float a=0.;
  if(q.y>-1.35 && abs(q.x)<w){
    float u=q.x/w, az=asin(clamp(u,-1.,1.));
    float pat=h11(seed*5.);
    float gore=floor((az/PI+.5)*12.);
    float k=pat<.35 ? gore+floor(seed*7.) : pat<.7 ? (mod(gore,2.)<1.?floor(seed*3.):floor(seed*3.)+3.) : floor(seed*6.)+step(abs(q.y-.1+.25*sin(az*6.)),.18)*2.;
    c=BPAL(k);
    if(pat>.7 && q.y<-.6) c=BPAL(floor(seed*6.)+4.);
    float seam=smoothstep(.04,.0,abs(fract((az/PI+.5)*12.)-.5)*2.-.94);
    c*=1.-.35*seam;
    // light from the low sun on the right, darker on the shady side
    float nz=sqrt(max(1.-u*u,0.));
    float lam=clamp(.65*u+.35*nz+.15*q.y,0.,1.);
    vec3 sh=c*(.12+1.25*lam)+vec3(1.,.7,.4)*pow(max(u,0.),6.)*.35*nz;
    // the burner flickering on: the inside glows orange
    float burn=step(.55,h11(seed*3.+floor(t*.25+seed)))*(.6+.4*noise(vec2(t*12.,seed)));
    sh+=vec3(1.4,.6,.15)*burn*.55*smoothstep(-.2,-1.35,q.y)*(1.-.5*abs(u));
    c=sh; a=smoothstep(w,w-.04,abs(q.x));
  }
  // the mouth, ropes, basket and flame
  float burn2=step(.55,h11(seed*3.+floor(t*.25+seed)))*(.5+.5*noise(vec2(t*15.,seed+1.)));
  if(q.y<-1.3 && q.y>-1.6 && min(abs(q.x-mix(.28,.15,(-1.3-q.y)/.3)),abs(q.x+mix(.28,.15,(-1.3-q.y)/.3)))<.025){ c=vec3(.08,.06,.05); a=1.; }
  if(q.y<-1.6 && q.y>-1.8 && abs(q.x)<.17){ c=vec3(.40,.24,.10)*(.6+.4*step(.5,fract(q.y*25.)))*(.7+.4*step(0.,q.x)); a=1.; }
  vec2 fq=(q-vec2(0.,-1.42))*vec2(1.,.6);
  float fl=exp(-dot(fq,fq)*90.)*burn2;
  c=mix(c, vec3(2.,1.2,.4), clamp(fl,0.,1.)); a=max(a,clamp(fl,0.,1.));
  return vec4(c,a);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyH(uv,t);
  for(int L=0;L<5;L++){
    float k=float(L);
    // a ridge of hills, then a band of glowing morning mist in front of it
    float top=.01-k*.075+(.06+.02*k)*fbm4(vec2(uv.x*(1.3+k*.5)+k*5.,k));
    if(uv.y<top){
      vec3 hc=mix(vec3(.04,.08,.04), vec3(.12,.18,.09), fbm4(uv*vec2(20.,30.)+k))*(.7+.5*noise(uv*vec2(160.,120.)));
      hc+=vec3(.5,.35,.15)*.25*smoothstep(-.4,.6,uv.x)*smoothstep(top-.04,top,uv.y);    // sun on the ridge tops
      col=mix(hc, mix(vec3(.95,.70,.55),vec3(.55,.55,.70),.4+.1*k), clamp(.8-k*.21,0.,1.));
    }
    float mist=smoothstep(.04,.0,abs(uv.y-(top-.05-.02*k)))*0.+smoothstep(top-.0,top-.07,uv.y)*smoothstep(top-.16,top-.08,uv.y);
    float mn=fbm4(vec2(uv.x*3.-t*.01*(1.+k*.3), uv.y*10.+k));
    col=mix(col, vec3(1.2,.92,.72)*(.8+.4*smoothstep(-.4,.6,uv.x)), mist*(.3+.6*smoothstep(.35,.75,mn))*(.85-k*.12));
    // balloons at this distance
    for(int i=0;i<3;i++){
      float sd=k*3.+float(i)+1.;
      float s=.018+.016*k+.008*h11(sd*7.);
      float sp=.004+.004*h11(sd*3.);
      vec2 pos=vec2(-1.15+fract(h11(sd)+t*sp)*2.3, -.02+.3*h11(sd*1.7)-k*.03+.012*sin(t*.3+sd));
      if(L==4 && i==0) pos=vec2(-.32+.04*sin(t*.05), .18+.015*sin(t*.25));                 // one big balloon close by
      if(L==4 && i==0) s=.11;
      vec4 b=balloon(uv,pos,s,sd,t);
      b.rgb=mix(b.rgb, vec3(.95,.75,.65), clamp(.5-k*.13,0.,1.));
      col=mix(col,b.rgb,b.a);
    }

  col+=vec3(1.,.7,.4)*.12*exp(-length((uv-SUN)*vec2(.5,1.5))*2.5);
  gl_FragColor=vec4(finish(col*.85,uv),1.);
}
`;

// ---------- 25. FIREFLY MEADOW: a summer field at dusk, hundreds of blinking fireflies, the moon rising ----------
const FIREFLY = `
const float HZ=-.06;                   // horizon
vec3 skyF(vec2 uv, float t, float px){
  float y=uv.y-HZ;
  vec3 c=mix(vec3(.95,.50,.30), vec3(.45,.35,.50), smoothstep(.0,.12,y));
  c=mix(c, vec3(.07,.11,.30), smoothstep(.06,.3,y)); c=mix(c, vec3(.012,.025,.09), smoothstep(.25,.55,y));
  c*=.75+.4*smoothstep(.7,-.8,uv.x);                                                 // last light on the left
  c+=starfield(uv, px, .5)*smoothstep(.2,.45,y);
  // the moon rising on the right, big and golden near the horizon
  vec2 mc=vec2(.52, HZ+.05+t*.0006); vec2 mp=uv-mc; float md=length(mp);
  float mr=.075;
  if(md<mr){ float cr=fbm4(mp*40.+3.); vec3 mn=vec3(mp,sqrt(mr*mr-md*md))/mr;
    c=vec3(1.25,.95,.62)*(.75+.3*cr-.25*smoothstep(.45,.65,fbm4(mp*14.)))*(.7+.3*mn.z); }
  c+=vec3(1.,.8,.5)*(exp(-max(md-mr,0.)*18.)*.18+exp(-max(md-mr,0.)*60.)*.2);
  return c;
}
// tall grass blades swaying in the evening breeze
float blades(vec2 uv, float t, float w, float base, float hmax, float seed){
  float res=0.;
  for(int o=-1;o<=1;o++){
    float ci=floor(uv.x/w)+float(o);
    float r=h11(ci+seed);
    float cx=(ci+.5+.6*(h11(ci*1.7+seed)-.5))*w;
    float h=hmax*(.4+.6*r);
    float y=(uv.y-base)/h;
    if(y<0. || y>1.) continue;
    float bend=(.15*(r-.5)+.05*sin(t*.8+ci*.7+seed))*h;
    float x=cx+bend*y*y;
    float th=w*.32*(1.-y)+.0006;
    res=max(res, smoothstep(th,th*.5,abs(uv.x-x)));
  }
  return res;
}
// fireflies: each one drifts in little loops and blinks on and off
vec3 flies(vec2 uv, float t, float cell, float seed, float bright){
  vec3 c=vec3(0);
  vec2 g=uv/cell; vec2 gi=floor(g);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 id=gi+vec2(i,j);
    if(h21(id+seed)>.8) continue;
    vec2 hp=h22(id+seed);
    vec2 pos=(id+.5+.35*vec2(sin(t*(.3+.3*hp.x)+hp.y*6.), sin(t*(.25+.3*hp.y)+hp.x*6.)))*cell;
    float per=2.+3.*h21(id*1.3+seed), ph=fract(t/per+hp.x);
    float blink=smoothstep(.0,.1,ph)*smoothstep(.6,.35,ph);
    float d=length(uv-pos);
    c+=vec3(.75,1.,.25)*blink*(exp(-d*d/(cell*cell*.0012))*1.6+exp(-d/(cell*.12))*.12)*bright;
  }
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyF(uv,t,px);
  // a line of round trees far away
  float tl=HZ+.035+.03*fbm4(vec2(uv.x*8.,1.))+.015*noise(vec2(uv.x*40.,2.));
  if(uv.y<tl) col=vec3(.012,.02,.025)+vec3(.12,.08,.1)*.15*smoothstep(tl-.03,tl,uv.y);
  // the meadow
  if(uv.y<HZ){
    float d=HZ-uv.y;
    col=mix(vec3(.025,.035,.025), vec3(.008,.014,.008), smoothstep(.0,.3,d))*(.7+.5*noise(vec2(uv.x*200./(1.+d*8.), d*400.)));
    col+=vec3(.6,.35,.2)*.05*exp(-d*25.)*smoothstep(.6,-.6,uv.x);
  }
  col+=flies(uv,t,.09,1.,.55)*smoothstep(.12,-.02,uv.y);                              // far fireflies
  // grass in front, then the closest fireflies
  float g0=blades(uv,t,.005,-.2,.07,1.);
  col=mix(col, vec3(.012,.02,.012), g0*.8);
  float g1=blades(uv,t,.008,-.4,.18,3.);
  col=mix(col, vec3(.008,.014,.008), g1);
  col+=flies(uv,t*.9,.13,5.,1.)*smoothstep(.2,-.1,uv.y);
  float g2=blades(uv,t,.014,-.56,.34,9.);
  col=mix(col, vec3(.004,.007,.005)+vec3(.05,.05,.08)*.12, g2);
  col+=flies(uv,t*.8,.24,9.,1.2)*smoothstep(.3,-.2,uv.y);
  float g3=blades(uv,t,.03,-.62,.4,13.);
  col=mix(col, vec3(.002,.003,.002), g3);
  gl_FragColor=vec4(finish(col*.85,uv),1.);
}
`;

// ---------- 26. GIANT REDWOODS: Muir Woods, huge red trunks rising out of view, fog, slanting sunbeams, ferns ----------
const REDWOOD = `
vec3 fogR(vec2 uv){ return mix(vec3(.12,.16,.12), vec3(.50,.54,.47), smoothstep(-.35,.6,uv.y)); }
// sun shafts slanting down from the upper left
float shaftsR(vec2 uv, float t){
  vec2 d=normalize(vec2(.42,-1.)); float r=dot(uv, vec2(-d.y,d.x)), al=dot(uv,d);
  float b=pow(noise(vec2(r*7.+t*.015, .5)),3.)*1.7+pow(noise(vec2(r*19.-t*.012, 3.)),4.)*.9;
  return b*smoothstep(-.75,.45,uv.y)*(.55+.45*noise(vec2(r*3.,al*2.5+t*.04)));
}
// one row of trunks. fogK: how much fog is in front of this row
vec4 trunksR(vec2 uv, float px, float cell, float wmin, float wmax, float base, float seed, float fogK, float t){
  float ci=floor(uv.x/cell); vec4 res=vec4(0);
  for(int o=-1;o<=1;o++){
    float c=ci+float(o);
    if(h11(c*1.3+seed)<.22) continue;
    float y=uv.y-base;
    float cx=(c+.5+.55*(h11(c+seed)-.5))*cell; cx=cx*(1.-.2*(uv.y+.25))+y*.02*(h11(c*5.+seed)-.5);   // looking up: trunks lean in
    float w=mix(wmin,wmax,h11(c*2.1+seed));
    float W=w*(1.+.75*exp(-max(y,0.)/(w*2.2))-.05*y)+w*.05*(noise(vec2(y*4./max(w*8.,.3),c))-.5);   // roots flare out at the bottom
    float x=uv.x-cx;
    float a=cover(abs(x)-W, px)*smoothstep(-.03,.0,y);
    if(a<=0.) continue;
    float nx=x/W;
    // deep fibrous bark: long vertical ridges and grooves
    float rid=noise(vec2(nx*9.+c*3., y*.05/w+seed))*.55+noise(vec2(nx*26.+c, y*.15/w))*.3+noise(vec2(nx*70., y*.4/w))*.15;
    float groove=smoothstep(.32,.62,rid);
    float lt=clamp(.5-.7*nx,0.,1.)*.9+.06;                       // light from the left
    vec3 bark=mix(vec3(.03,.01,.006), vec3(.40,.12,.05), groove*lt+.12*lt);

// a sword fern: arching fronds with saw-tooth leaflets
vec4 fernR(vec2 uv, vec2 b, float L, float seed, float t, float px){

    vec3 g=mix(mix(vec3(.07,.035,.02), vec3(.20,.11,.06), n), mix(vec3(.04,.09,.02), vec3(.18,.30,.06), n), so)*(.6+.6*noise(vec2(uv.x*40./(1.+d*5.),d*120.)));
    g+=vec3(.5,.45,.15)*smoothstep(.6,.9,noise(vec2(uv.x*6.-d*3.,d*12.)))*.25;     // sunny patches

  tr=trunksR(uv,px,.22,.025,.045,-.24,3.,.30,t); col=mix(col,tr.rgb,tr.a);
  // the high canopy: dark needle sprays against the bright fog
  float cn=fbm(vec2(uv.x*16.+.3*sin(uv.y*3.), uv.y*26.)+vec2(t*.003,0.))*.7+.3*fbm4(uv*vec2(5.,8.));

<script>
// ---------- 27. AUTUMN MAPLES: red and gold maples along a clear stream with pebbles; leaves float and drift down ----------
const MAPLE = `
const float Y0=.10, EYE=1.6;
float sxM(float z){ return 2.2*sin(z*.13+.4)-1.1+.8*sin(z*.05); }       // the stream's middle (metres)
float hwM(float z){ return 1.7+.015*z; }
vec3 skyM(vec2 uv){ vec3 c=mix(vec3(.95,.88,.72), vec3(.42,.62,.88), smoothstep(Y0,.5,uv.y)); return c+vec3(1.,.8,.5)*.35*exp(-length(uv-vec2(-.35,.32))*3.); }
// a maple leaf shape: 5 pointy lobes. p in leaf units, returns 1 inside
float leafM(vec2 p){ float a=atan(p.x,p.y), r=length(p); float lob=.36+.64*pow(abs(cos(a*2.5)),2.)*(1.-.35*smoothstep(1.6,2.6,abs(a))); return step(r,lob)+step(abs(p.x),.03)*step(p.y,0.)*step(-.6,p.y); }
vec3 leafCol(float k){ return k<.4?mix(vec3(.75,.06,.02),vec3(.95,.22,.03),k/.4):k<.8?mix(vec3(.95,.35,.03),vec3(1.,.65,.08),(k-.4)/.4):vec3(.95,.78,.15); }
// leaf clumps: round bumps with dark gaps between them (x = shade, y = gap)
vec2 clumpM(vec2 q, float sd){
  vec2 g=q*7.+.9*vec2(noise(q*3.+sd),noise(q*3.+sd+5.)), gi=floor(g), gf=fract(g); float d1=9.; vec2 best=vec2(0);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 o=vec2(i,j); vec2 c=o+.5+.8*(h22(gi+o+sd)-.5); vec2 dd=gf-c; float d=dot(dd,dd); if(d<d1){ d1=d; best=dd; } }
  float b=sqrt(d1)/.62; return vec2(clamp(.6-.9*best.x+.9*best.y,0.,1.)*(1.-b*.4), smoothstep(.8,1.1,b)*smoothstep(.35,.65,noise(q*5.+sd)));
}
// rows of maple trees on both banks
vec3 treesM(vec2 uv, vec3 col, float t, float px){
  for(int k=0;k<6;k++){
    float z=48./pow(1.55,float(k)); float s=1./z;                    // far rows first
    float yb=Y0-EYE*s;
    if(uv.y<yb-.02*s*z*.0) {}
    float wx=uv.x*z; float sp=3.2; float ci=floor(wx/sp);
    for(int o=-1;o<=1;o++){
      float c=ci+float(o), r=h21(vec2(c,float(k)));
      float tx=(c+.5+.6*(r-.5))*sp;
      if(abs(tx-sxM(z))<hwM(z)+.8+(k>3?2.5:0.) || (k==5 && r<.5)) continue;     // no trees in the stream
      float th=7.+5.*h21(vec2(c,float(k)+9.)), cr=2.6+1.4*h21(vec2(c+3.,float(k)));
      vec2 p=vec2(wx-tx, (uv.y-yb)*z);
      // trunk
      float tw=.16+.04*cr;
      float bx=p.x+.15*sin(p.y*.8+c)-.25*smoothstep(th*.3,th*.7,p.y)*sign(r-.5)*(p.y-th*.3), tww=tw*(1.-.4*p.y/th);
      float br=abs(p.x-(p.y-th*.35)*.6*sign(h11(c+5.)-.5))-tww*.45;                   // one big branch
      if(p.y>0. && p.y<th*.75 && (abs(bx)<tww || (br<0. && p.y>th*.35))){
        float sh=.35+.65*smoothstep(tww,-tww,bx);
        vec3 bk=mix(vec3(.07,.06,.05), vec3(.22,.20,.17), noise(vec2(bx*12., p.y*3.))*sh)*sh;
        col=mix(bk, skyM(uv), smoothstep(8.,70.,z)*.75);
      }
      // the leafy crown: a lumpy round cloud of leaves
      vec2 q=(p-vec2(0.,th-cr*.8))/cr;
      float d=length(q*vec2(.95,1.1));
      if(d<1.4){
        float n=fbm4(q*2.5+c*7.)+.3*noise(q*11.+c)+.15*noise(q*30.);
        float edge=.75+.35*n-d;
        if(edge>0.){
          float lk=h21(vec2(c*1.7,float(k)+4.));
          vec3 lc=leafCol(clamp(lk+.12*(noise(q*1.5+c)-.5),0.,1.));
          float lit=clamp(.55-.45*q.x+.4*q.y,0.,1.);
          float lf=min(z*.2+.6,2.5);

          cc+=lc*smoothstep(.12,.0,edge)*.5*smoothstep(.0,.6,-q.x+.3);          // backlit edges glow

}
vec3 aboveM(vec2 uv, float t, float px){ return treesM(uv, skyM(uv), t, px); }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyM(uv);

      float rp=fbm3(vec2(wx*2., z*1.5+t*1.2))+.5*noise(vec2(wx*6., z*4.+t*2.5));
      vec2 pc=gp*vec2(7.,5.)+(rp-.7)*.6; vec2 pi=floor(pc); vec2 pf=fract(pc)-.5-.35*(h22(pi)-.5);
      float peb=smoothstep(.42,.32,length(pf));
      peb=smoothstep(.45,.2,length(pf))*(.6+.4*h21(pi+7.));
      vec3 bed=mix(vec3(.12,.10,.06), mix(vec3(.45,.36,.24),vec3(.33,.32,.30),h21(pi+2.))*(.6+.5*h21(pi)), peb*smoothstep(12.,3.,z));
      bed*=.75+.5*pow(noise(gp*vec2(4.,3.)+vec2(0.,t*.6)+rp),2.)*1.4;            // sunlight wiggles on the bottom
      bed*=vec3(.75,.85,.7);
      vec3 refl=aboveM(vec2(uv.x+(rp-.7)*.012, 2.*Y0-uv.y+.02*(rp-.7)*(1.+z*.02)), t, px);
      float fr=clamp(.35+.65*smoothstep(2.,9.,z),0.,1.);
      col=mix(bed*vec3(.8,.9,.75), refl*vec3(.75,.8,.8), fr);
      col+=vec3(1.,.9,.7)*pow(noise(vec2(wx*25., z*20.+t*3.)),30.)*1.2*smoothstep(25.,3.,z);  // glints
      col*=.7+.3*smoothstep(-.5,-.05,sd);
      // leaves floating down the stream
      vec2 fp=vec2(wx-sxM(z)*.0, z+t*.35)*vec2(1.6,1.2); vec2 fi=floor(fp);
      if(h21(fi)>.55){ vec2 lp=(fract(fp)-.5-.25*(h22(fi)-.5))*rot(h21(fi+3.)*6.28+t*.1*(h21(fi)-.5))/.15;
        if(leafM(lp)>0.){ col=leafCol(h21(fi+5.)*.85)*(.4+.35*noise(lp*3.))*(.8+.2*lp.y); col=mix(col, skyM(vec2(uv.x,Y0))*.8, smoothstep(10.,60.,z)); } }
      col=mix(col, skyM(vec2(uv.x,Y0))*.75, smoothstep(15.,90.,z)*.6);
    }
  }
  col=treesM(uv,col,t,px);
  // a few leaves drifting down
  for(int i=0;i<2;i++){
    float cs=.16+.1*float(i); vec2 lp=uv+vec2(sin(t*.3+float(i))*.05, t*(.04+.02*float(i)));
    vec2 ci=floor(lp/cs); if(h21(ci+float(i)*7.)>.35) continue;

<script>
// ---------- 28. BAY BRIDGE AT NIGHT: the western span with the "Bay Lights" twinkling on its cables ----------
// m = metres along the bridge from the San Francisco anchorage; z = how far away that spot is
const BAYB = `
const float Y0=-.17;                                 // horizon
const float Z0=416.5, DZ=.2365, X0=-453.6, DX=.4068;
float mAt(float x){ return (x*Z0-X0)/(DX-x*DZ); }
float zAt(float m){ return Z0+m*DZ; }
float yW(float h, float z){ return Y0+(h-5.)/z; }     // screen height of something h metres above the water
float cableH(float m){                               // main cables: dip between towers, down to the deck at the ends
  if(m<353.) return mix(56.,160.,pow(clamp(m/353.,0.,1.),1.4));
  if(m<1057.){ float u=(m-705.)/352.; return 72.+88.*u*u; }
  if(m<1410.) return mix(160.,62.,pow((m-1057.)/353.,.7));
  if(m<1763.) return mix(62.,160.,pow((m-1410.)/353.,1.4));
  if(m<2467.){ float u=(m-2115.)/352.; return 72.+88.*u*u; }
  return mix(160.,56.,pow(clamp((m-2467.)/353.,0.,1.),.7));
}
float glow;    // how much the Bay Lights are on in this pixel (for the reflection)
vec3 skyBB(vec2 uv, float px, float t){
  float y=uv.y-Y0;
  vec3 c=mix(vec3(.05,.045,.09), vec3(.012,.02,.055), smoothstep(.0,.25,y)); c=mix(c, vec3(.003,.006,.02), smoothstep(.2,.6,y));
  c+=vec3(.30,.15,.08)*exp(-y*16.)*.45;                                        // city glow low in the sky
  float cl=fbm(vec2(uv.x*1.3+t*.004, y*5.));
  c=mix(c, vec3(.09,.06,.08)*(1.-smoothstep(.1,.45,y)*.6), smoothstep(.55,.8,cl)*.5);
  c+=starfield(uv,px,.12)*smoothstep(.12,.4,y);

  return c;
}
vec3 farBB(vec2 uv, float px, float t){
  vec3 col=skyBB(uv,px,t);
  // the East Bay far away: dark hills sprinkled with lights
  float hh=Y0+.012+.02*fbm4(vec2(uv.x*3.,2.))*smoothstep(-.2,.6,uv.x);
  if(uv.y<hh){ col=vec3(.02,.02,.035)+vec3(.12,.07,.05)*smoothstep(hh-.02,hh,uv.y)*.4;
    vec2 g=vec2(uv.x*700., uv.y*900.); vec2 gi=floor(g);
    col+=mix(vec3(1.,.7,.35),vec3(.85,.9,1.),step(.7,h21(gi+3.)))*step(.96,h21(gi))*smoothstep(.25,.65,length(fract(g)-.5)*-1.+1.)*1.1; }
  // Yerba Buena Island on the right, where the bridge ends

  if(uv.x>.55 && uv.y<yb && uv.y>Y0-.03){ col=vec3(.012,.015,.02)+vec3(.04,.05,.04)*fbm4(uv*vec2(60.,80.));
    col+=vec3(1.,.75,.4)*step(.985,h21(floor(uv*vec2(500.,500.))))*1.5; }
  // San Francisco's skyline on the left, behind the end of the bridge
  if(uv.x<-.30){
    float cw=.016, ci=floor(uv.x/cw), lx=fract(uv.x/cw);
    float bh=Y0+.03+.14*pow(h11(ci*3.7),1.8)*smoothstep(-.30,-.55,uv.x);
    if(lx>.08 && lx<.94 && uv.y<bh){
      col=vec3(.02,.022,.035)*(1.-.3*lx);
      col+=paneCol(floor(vec2(uv.x*1100.,uv.y*900.)))*panes(uv, vec2(.0018,.0024), ci, .55, vec2(.25))*.95;
    }

    if(abs(sq.x)<sw && sq.y<.26+.008*(1.-pow(sq.x/sw,2.))){ col=vec3(.03,.035,.05)*(1.-.4*step(0.,sq.x));
      col+=vec3(.75,.85,1.)*panes(uv, vec2(.002,.0024), 9., .45, vec2(.3))*.8;
      col+=vec3(.9,.95,1.)*smoothstep(.23,.262,sq.y)*(.6+.3*sin(t*.4)); }
  }

// the bridge: towers, cables, Bay Lights, deck
void bridgeBB(inout vec3 col, vec2 uv, float px, float t){
  float m=mAt(uv.x); float z=zAt(m); float k=1./z;
  if(uv.x>.66 || m<-200.) return;
  float dTop=yW(64.,z), dBot=yW(50.,z);
  // towers (with X-braces) and the big concrete anchorage in the middle
  float TW[4]; TW[0]=353.; TW[1]=1057.; TW[2]=1763.; TW[3]=2467.;
  for(int i=0;i<4;i++){
    float tm=TW[i], tz=zAt(tm), tx=(X0+DX*tm)/tz;
    float hw=13./tz, dxp=uv.x-tx;
    float top=yW(165.,tz);

      float leg=step(.62,abs(dxp)/hw);
      float br=abs(fract(v*7.)-.5-dxp/hw*.5)<.07 || abs(fract(v*7.)-.5+dxp/hw*.5)<.07 ? 1.:0.;
      if(leg>0. || br>0. || abs(fract(v*7.)-.5)>.46){

        col+=vec3(.6,.65,.75)*.05*smoothstep(.0,.5,v);                                   // soft white floodlight

  }

  if(abs(uv.x-ax)<22./az && uv.y<yW(80.,az)-abs(uv.x-ax)*.4 && uv.y>yW(0.,az)) col=vec3(.04,.04,.05)+vec3(.15)*smoothstep(yW(0.,az),yW(80.,az),uv.y)*.15;

    float sp=9.4, ci=floor(m/sp), f=abs(fract(m/sp)-.5)*sp*k;           // distance to the nearest cable (screen units)
    float wire=exp(-f*f/(px*px*.5));
    float h=(uv.y-dTop)/(cy-dTop);                                    // 0 at the deck, 1 at the cable
    float hm=(ch-64.)*h;                                              // metres up the cable
    // gentle patterns that slowly change: drifting waves, soft falling drops, and twinkles
    float ph=t*.025, w1=.5+.5*sin(ci*.09-t*.45+sin(hm*.03+t*.2)*1.5);

    } }

<script>
// ---------- 31. PYRAMIDS OF EGYPT: Giza at sunset, golden sand, a camel caravan, heat shimmer ----------
const PYRA = `
const float Y0=-.06;
const vec2 SUNP=vec2(-.58,.035);
vec3 skyPY(vec2 uv){
  float y=uv.y-Y0;
  vec3 c=mix(vec3(.95,.30,.05), vec3(.55,.16,.06), smoothstep(.0,.12,y));
  c=mix(c, vec3(.16,.07,.10), smoothstep(.08,.35,y)); c=mix(c, vec3(.03,.03,.09), smoothstep(.3,.6,y));
  float sd=length((uv-SUNP)*vec2(1.,1.3));
  c+=vec3(1.2,.5,.12)*exp(-sd*5.)*.6+vec3(.9,.4,.1)*exp(-sd*1.6)*.25;
  c+=vec3(1.6,.75,.25)*smoothstep(.042,.036,length(uv-SUNP))*1.6;                      // the sun
  float cl=fbm(vec2(uv.x*1.2, y*10.))+.2*noise(vec2(uv.x*6.,y*40.));
  c=mix(c, mix(vec3(1.0,.32,.10), vec3(.18,.07,.10), smoothstep(.1,.3,y))*(1.+.6*exp(-sd*3.)), smoothstep(.65,.85,cl)*smoothstep(.06,.15,y)*.7);
  return c;
}
// a pyramid: apex a, base line yb, half width w, corner edge at xr (as a fraction). cap = smooth limestone top
vec4 pyramidPY(vec2 uv, vec2 a, float yb, float w, float xr, float cap, float px, float seed){
  float h=a.y-yb; float v=(a.y-uv.y)/h;                     // 0 at the top, 1 at the bottom
  if(v<0. || v>1.) return vec4(0);
  float hwv=w*v;

  float rough=(noise(vec2(uv.y*400.,seed))-.5)*.0025*(1.-cap*step(v,cap));
  float d=max(xl-uv.x+rough, uv.x-xR+rough);
  float al=cover(d,px); if(al<=0.) return vec4(0);
  float ex=a.x+hwv*xr;                                     // the corner edge facing us
  float lit=step(uv.x,ex);
  float course=step(.18,fract(v*h*900.))*.25+.75;           // rows of stone blocks
  float blocks=step(.1,fract(uv.x*900.+floor(v*h*900.)*.5))*.12+.88;
  vec3 stone=mix(vec3(.50,.26,.10), vec3(.78,.48,.24), noise(uv*vec2(200.,800.))*.6+.4*noise(uv*vec2(30.,90.)+seed));
  vec3 c=stone*mix(vec3(.16,.07,.06), vec3(1.1,.50,.18), lit*(.8+.2*v))*course*blocks;
  c*=.8+.2*noise(uv*vec2(60.,30.)+seed);
  if(v<cap){ c=mix(vec3(.22,.12,.08), vec3(.9,.52,.25), lit)*(.85+.15*noise(uv*300.)); }        // smooth casing stones at the top
  c=mix(c, skyPY(vec2(uv.x,Y0+.02))*.75, .25);                                              // desert haze
  c+=vec3(1.,.55,.2)*.25*smoothstep(px*3.,0.,abs(uv.x-xl))*lit;                              // sunlit rim

}
// a walking camel, side-on, facing right. s = height on screen
float camelPY(vec2 uv, vec2 b, float s, float t){
  vec2 q=(uv-b)/s; if(q.x<-.8 || q.x>1. || q.y<-.05 || q.y>1.35) return 0.;
  float d=length((q-vec2(0.,.66))/vec2(.46,.19))-1.;

  d=min(d, segD(q,vec2(.36,.66),vec2(.56,1.0))/.075-1.);                        // neck
  d=min(d, length((q-vec2(.66,1.02))/vec2(.14,.065))-1.);                       // head
  d=min(d, segD(q,vec2(-.44,.62),vec2(-.52,.38))/.025-1.);                       // tail
  for(int i=0;i<4;i++){ float fi=float(i); float hx=fi<2.?-.3:.28; float ph=t*3.+fi*1.6+(fi<2.?0.:3.14);
    vec2 hip=vec2(hx+.04*mod(fi,2.),.55), foot=vec2(hx+.12*sin(ph), .0+.05*max(cos(ph),0.)), knee=mix(hip,foot,.5)+vec2(.04,0.);
    d=min(d, min(segD(q,hip,knee), segD(q,knee,foot))/.045-1.); }
  return step(d,0.);
}
float riderPY(vec2 uv, vec2 b, float s){ vec2 q=(uv-b)/s; float d=length((q-vec2(-.05,1.2))/vec2(.1,.2))-1.; d=min(d, length(q-vec2(-.03,1.46))/.075-1.); return step(d,0.); }
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

  vec3 col=skyPY(su);

  vec4 p;
  p=pyramidPY(su,vec2(.40,.135),Y0-.003,.27,.30,0.,px,3.); col=mix(col,p.rgb*.92,p.a);        // Khufu (the Great Pyramid), a bit farther away
  p=pyramidPY(su,vec2(.00,.175),Y0-.006,.30,.25,.13,px,2.); col=mix(col,p.rgb,p.a);           // Khafre, still wearing its smooth cap
  p=pyramidPY(su,vec2(-.32,.04),Y0-.008,.14,.2,0.,px,1.); col=mix(col,p.rgb,p.a);             // Menkaure, the smallest of the three

    float d=Y0-uv.y, z=1./(d+.004);

    vec3 sand=mix(vec3(.20,.07,.02), vec3(.85,.36,.10), clamp(.55-sl*25.,0.,1.));

  if(uv.y<ry){ float d=ry-uv.y; vec3 sd=mix(vec3(.85,.36,.10), vec3(.16,.06,.02), smoothstep(.0,.25,d+.08*sin(uv.x*3.)));
    sd*=.9+.1*sin((uv.x*90.+uv.y*40.)+noise(uv*20.)*5.); col=sd*mix(1.,.8,smoothstep(.0,.3,d)); }
  float cx0=mod(t*.012+.9,2.4)-1.25;
  float cam=0.;
  for(int i=0;i<5;i++){ float fi=float(i); float x=cx0-fi*.10; float yb=-.22+.03*sin(x*2.3+1.)+.012*sin(x*7.)-.002;
    cam=max(cam, camelPY(uv, vec2(x,yb), .075, t+fi*.7)); if(i==0||i==2) cam=max(cam, riderPY(uv, vec2(x,yb), .075)); }
  col=mix(col, vec3(.035,.015,.01), cam);
  gl_FragColor=vec4(finish(col*.75,uv),1.);
}
`;

<script>
// ---------- 32. MOUNT EVEREST: the highest peak, a plume of snow blowing off the summit, a sea of clouds below ----------
const EVEREST = `
// a real 3D landscape (kilometres): Everest in the middle, Lhotse to the right, the Nuptse wall in front
const vec3 SUND=vec3(-.85,.38,.15);
float ridgedE(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ float r=1.-abs(noise(p)*2.-1.); s+=a*r*r; p=M2*p+vec2(1.7,9.2); a*=.5; } return s; }
float ridged3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ float r=1.-abs(noise(p)*2.-1.); s+=a*r*r; p=M2*p+vec2(1.7,9.2); a*=.5; } return s; }
float smax(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(a,b,h)+k*h*(1.-h); }
float baseE(vec2 p){
  vec2 e=p; float ev=8.85-(abs(e.x*.82+e.y*.25)+abs(e.y*.85-e.x*.3))*1.15;            // the big three-sided summit pyramid
  float lh=8.5-length((p-vec2(3.2,1.2))*vec2(1.,.9))*1.25;                           // Lhotse
  float nu=7.3-abs(p.y+3.2+.12*p.x)*1.5-max(abs(p.x+2.2)-1.6,0.)*.9;                  // Nuptse: a long sharp wall
  float lo=4.9-.18*length(p-vec2(0.,-6.));
  return smax(smax(smax(ev,lh,.6),nu,.5),lo,.6);
}
float terrE(vec2 p, bool fine){
  float b=baseE(p);
  vec2 q=vec2(p.x*.9, p.y*.45)+.3*vec2(noise(p*.5),noise(p*.5+4.));                   // ribs and gullies run down the slopes
  float r=fine?ridgedE(q):ridged3(q);
  return b+(r-.4)*1.6*smoothstep(4.5,7.,b)*(.35+.65*smoothstep(.1,1.2,length(p)));
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 ro=vec3(-.5,6.5,-14.5), rd=normalize(vec3(uv.x, uv.y-.10, 1.75));
  vec3 L=normalize(SUND);
  // sky: deep blue above, paler at the horizon
  vec3 sky=mix(vec3(.32,.50,.80), vec3(.02,.07,.30), smoothstep(.0,.55,rd.y+.12));
  sky+=vec3(1.,.9,.75)*.18*pow(max(dot(rd,L),0.),6.);
  vec3 col=sky;
  // march to the mountains, stopping at the cloud layer below
  float tt=4., hit=0.; vec3 p;
  for(int i=0;i<90;i++){
    p=ro+rd*tt; float h=p.y-terrE(p.xz,false);
    if(h<.004*tt){ hit=1.; break; }
    if(p.y<5.0 || tt>45.) break;
    tt+=max(h*.45,.01*tt);
  }
  float cloudT=(5.2-ro.y)/rd.y;
  if(hit>0. && (rd.y>=0. || tt<cloudT)){
    for(int i=0;i<5;i++){ float h=p.y-terrE(p.xz,true); tt+=h*.5; p=ro+rd*tt; }
    float e=.012;
    float hc=terrE(p.xz,true);
    vec3 n=normalize(vec3(terrE(p.xz-vec2(e,0.),true)-terrE(p.xz+vec2(e,0.),true), 2.*e, terrE(p.xz-vec2(0.,e),true)-terrE(p.xz+vec2(0.,e),true)));
    float dif=max(dot(n,L),0.);
    // a quick shadow check toward the sun
    float sh=1.; float st=.08;
    for(int i=0;i<16;i++){ vec3 q=p+L*st; float d=q.y-terrE(q.xz,false); if(d<0.){ sh=0.; break; } st+=max(d*.6,.06); }
    float snow=smoothstep(.42,.62,n.y+.15*noise(p.xz*14.))*smoothstep(9.2,7.,p.y)+smoothstep(.62,.8,n.y);
    snow=clamp(snow,0.,1.);
    vec3 rock=mix(vec3(.07,.06,.06), vec3(.24,.20,.17), noise(p.xz*30.+p.y*9.));
    float band=smoothstep(.12,.0,abs(p.y-8.25))*.6;                                     // the Yellow Band near the top
    rock=mix(rock, vec3(.40,.31,.18), band);
    vec3 alb=mix(rock, vec3(.92,.94,.98), snow);
    vec3 amb=vec3(.09,.13,.28)*(.5+.5*n.y);
    col=alb*(amb+vec3(2.1,1.95,1.75)*dif*sh);
    col=mix(col, sky*vec3(.95,.97,1.), 1.-exp(-tt*.008));                               // thin air haze
  } else if(rd.y<0.){
    // the sea of clouds below, puffy and lit by the sun
    vec3 c=ro+rd*cloudT;
    vec2 cp=c.xz*.55+vec2(t*.012,0.);
    float d0=fbm(cp)+.3*noise(cp*4.), d1=fbm(cp+L.xz*.04)+.3*noise((cp+L.xz*.04)*4.);
    float lit=clamp(.55+(d0-d1)*5.,0.,1.);

    float cov=smoothstep(.38,.55,d0);
    col=mix(vec3(.05,.08,.16)+vec3(.04,.06,.1)*noise(cp*9.), cc, cov);                    // gaps show dark valleys far below
    col=mix(col, sky*.92, 1.-exp(-cloudT*.025));

  vec3 sm=vec3(0.,8.85,0.)-ro; vec2 ss=vec2(sm.x, sm.y)/sm.z*1.75+vec2(0.,.10);

    float k=max(q.x,0.), cy=.01*k+.05*k*k-.026;
    vec2 pp=vec2(q.x*9.-t*.15, (q.y-cy)*30./(1.+k*6.));
    float dens=fbm(pp+vec2(0.,t*.04))*exp(-pow((q.y-cy)/(.008+.07*k),2.))*exp(-k*4.)*smoothstep(-.012,.01,q.x)*1.3;
    col=mix(col, mix(vec3(.72,.80,.94), vec3(1.25,1.2,1.15), smoothstep(.2,.55,dens)), smoothstep(.1,.45,dens)*.85);
  }

}
`;

<script>
// ---------- 33. NIAGARA FALLS: the curved Horseshoe Falls, huge mist, a rainbow, a little boat near the bottom ----------
const NIAGARA = `
const float Y0=.17;
// the horseshoe: the left arm goes away from us, the deep middle is far, the right (Canadian) arm comes close
float brinkY(float x){ return .145-.04*smoothstep(-.2,-.8,x)-.17*smoothstep(.15,.85,x)+.003*noise(vec2(x*50.,1.)); }
float baseY(float x){ return brinkY(x)-(.17+.08*smoothstep(-.2,-.8,x)+.19*smoothstep(.15,.85,x)); }
vec3 skyN(vec2 uv){ return mix(vec3(.48,.60,.78), vec3(.10,.28,.66), smoothstep(.15,.5,uv.y)); }
float mistD(vec2 uv, float t){
  float m=fbm(vec2(uv.x*2.6, uv.y*2.6-t*.06))*.65+fbm4(vec2(uv.x*7.+t*.02, uv.y*6.-t*.13))*.35;
  float plume=exp(-pow((uv.x-.02)/(.32+.35*max(.1-uv.y,0.)),2.));

  return clamp(mix(1.,.4,smoothstep(baseY(uv.x)+.06,brinkY(uv.x)+.02,uv.y))*smoothstep(top, top-.16, uv.y)*smoothstep(lo-.06,lo+.04,uv.y+.05*(m-.5))*(.12+.88*plume)*(.5+.7*m),0.,1.);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col=skyN(uv);
  float cl=fbm(vec2(uv.x*1.3+t*.005,uv.y*4.)); col=mix(col, vec3(1.02,1.,.97)*(.8+.25*smoothstep(.25,.5,uv.y)), smoothstep(.55,.8,cl)*smoothstep(.2,.3,uv.y)*.8);
  // far shore: trees, and the town's hotels on the right
  float fs=Y0+.012+.01*fbm4(vec2(uv.x*12.,1.));
  if(uv.y<fs) col=mix(vec3(.10,.20,.10), skyN(vec2(uv.x,Y0)), .5);
  float cw=.024, ci=floor(uv.x/cw);
  if(uv.x>.3 && uv.y<Y0+.015+.06*pow(h11(ci*3.3),3.)*step(.35,h11(ci)) && fract(uv.x/cw)>.15) col=mix(vec3(.55,.55,.56), skyN(vec2(uv.x,Y0)), .4)*(.85+.15*step(.5,fract(uv.y*300.)));
  float B=brinkY(uv.x), Bs=baseY(uv.x);
  // the upper river: rapids rushing toward the edge
  if(uv.y<Y0 && uv.y>=B){
    float z=1./(Y0-uv.y+.008);
    vec2 rp=vec2(uv.x*z*1.2, z*.6+t*.9);
    float foam=smoothstep(.5,.85,fbm4(rp*vec2(1.,.5))+.3*noise(rp*vec2(4.,1.)));
    col=mix(vec3(.04,.14,.12), vec3(.14,.28,.26), noise(rp*.5))*(.8+.3*noise(rp*3.));

  float gi=.13+.025*fbm4(vec2(uv.x*20.,3.))-.02*smoothstep(-.7,-.95,uv.x);
  float gx=-.70-.02*fbm4(vec2(uv.y*30.,4.))+.03*smoothstep(.0,-.2,uv.y);
  if(uv.x<gx && uv.y<gi){ float n=fbm4(uv*vec2(60.,80.)); col=mix(vec3(.03,.07,.02), vec3(.16,.28,.08), n)*(.7+.5*noise(uv*220.));
    if(uv.y<gi-.045-.015*noise(vec2(uv.x*40.,1.))) col=mix(vec3(.10,.09,.08), vec3(.34,.31,.27), noise(vec2(uv.x*10.,uv.y*80.)))*(.65+.45*noise(uv*vec2(60.,200.))); }
  // the Horseshoe Falls: a curved wall of falling water, deep green where it is thickest, white spray below
  if(uv.y<B && uv.y>Bs-.03 && uv.x>gx){
    float v=(B-uv.y)/(B-Bs);
    float sp=v*v*1.3+v*.5;
    float st=fbm4(vec2(uv.x*240., (sp-t*.5)*5.))*.6+noise(vec2(uv.x*700., (sp-t*.65)*12.))*.4;
    float deep=exp(-pow((uv.x-.0)/.18,2.));                                      // the thick green water in the middle of the horseshoe

<script>
// ---------- 34. VENICE: a canal at golden hour, colourful old houses, a little arched bridge, gondolas ----------
// metres: the canal is 12 m wide, we float 1.8 m above the water, looking straight down the canal
const VENICE = `
const float Y0=.03, EYE=1.8, W=6., F=1.2, ZB=38.;
vec3 skyV(vec2 uv){ float y=uv.y-Y0; vec3 c=mix(vec3(1.25,.72,.35), vec3(.55,.55,.70), smoothstep(.0,.25,y)); c=mix(c, vec3(.22,.36,.66), smoothstep(.2,.5,y)); return c+vec3(1.,.6,.25)*.35*exp(-length(uv-vec2(.1,Y0+.05))*6.); }
// a house front on the canal wall: z along the canal, h up from the water. side -1 = left (sunny), +1 = right (shady)
vec3 facadeV(float z, float h, float side, float px, out float sky){
  float L=7.+3.*h11(floor(z/9.)+side*13.); float bi=floor(z/9.); float bz=fract(z/9.)*9.;
  float H=11.+7.*h11(bi*1.9+side*5.);
  sky=step(H,h);
  if(sky>0.) return vec3(0);
  float r=h11(bi*3.1+side*7.);
  vec3 wall=r<.2?vec3(.75,.28,.16):r<.4?vec3(.88,.55,.25):r<.6?vec3(.85,.62,.58):r<.8?vec3(.90,.80,.60):vec3(.62,.20,.15);
  wall*=.8+.3*noise(vec2(z*3.,h*3.))*noise(vec2(z*.7,h*.9)+5.);                                         // weathered plaster
  float bare=smoothstep(.62,.7,noise(vec2(z*.9,h*.7)+bi*3.)+.15*noise(vec2(z*6.,h*6.)));                // plaster fallen off: old bricks show
  vec3 brk=mix(vec3(.40,.16,.10), vec3(.62,.30,.18), step(.15,fract(h*12.))*step(.08,fract(z*4.+floor(h*12.)*.5)));
  wall=mix(wall, brk, bare);
  wall*=1.-.35*smoothstep(.55,.85,noise(vec2(z*5.,h*.4)))*smoothstep(H,H-6.,h);                       // dark streaks from the rain
  wall=mix(wall, vec3(.16,.17,.10), smoothstep(.8,.15,h)*.8);                                            // green algae just above the water
  float fl=floor((h-1.5)/3.2), fh=fract((h-1.5)/3.2);
  float wz=fract(bz/2.2), wid=floor(bz/2.2);
  float win=step(.3,wz)*step(wz,.7)*step(.2,fh)*step(fh,.72+.08*(1.-pow((wz-.5)/.2,2.)))*step(0.,fl)*step(h,H-1.2)*step(.6,bz)*step(bz,8.4);
  float shut=(step(.18,wz)*step(wz,.3)+step(.7,wz)*step(wz,.82))*step(.2,fh)*step(fh,.72)*step(0.,fl)*step(h,H-1.2)*step(.6,bz)*step(bz,8.4)*step(.5,h11(wid+bi*7.+fl*3.));
  vec3 c=wall;
  float frame=step(.25,wz)*step(wz,.75)*step(.14,fh)*step(fh,.80+.08*(1.-pow((wz-.5)/.25,2.)))*step(0.,fl)*step(h,H-1.2)*step(.6,bz)*step(bz,8.4);
  c=mix(c, vec3(.92,.88,.80), frame*.85);                                                            // white stone window frames
  c=mix(c, vec3(.03,.025,.025)+vec3(1.1,.7,.35)*.2*step(.75,h11(wid*5.+fl+bi)), win);                // dark or warmly lit windows
  c=mix(c, vec3(.15,.12,.10), win*smoothstep(.36,.3,wz)*.0+step(.3,wz)*step(wz,.34)*win*.5);        // window reveal shadow
  c=mix(c, vec3(.10,.30,.18), shut);                                                                  // green shutters
  float box=step(.25,wz)*step(wz,.75)*step(abs(fh-.11),.045)*step(1.,fl)*step(h,H-1.2)*step(.6,bz)*step(bz,8.4)*step(.6,h11(wid*3.+fl*7.+bi));
  c=mix(c, mix(vec3(.75,.08,.10), vec3(.15,.40,.10), step(.5,noise(vec2(z*60.,h*40.))))*(.6+.6*noise(vec2(z*90.,h*60.))), box);   // flower boxes
  c=mix(c, vec3(.92,.88,.80), step(abs(h-(H-.35)),.35)*.7);                                         // white stone cornice
  c*=1.-.45*step(H-.75,h)*step(h,H-.7)*0.-.4*smoothstep(H-.7,H-1.2,h)*step(h,H-.7);                   // shadow under the cornice
  c=mix(c, wall*.6, step(abs(fh-.15),.02)*step(0.,fl)*.6);
  c=mix(c, vec3(.08,.06,.05), step(h,2.4)*step(.40,fract(bz/4.5))*step(fract(bz/4.5),.60)*step(.5,h11(bi+side)));   // water doors
  c*=step(.04,abs(bz-.0))*1.;                                                                         // a gap between houses
  return c;
}
vec3 aboveV(vec2 uv, float t, float px){
  float side=uv.x<0.?-1.:1.;

  float h=(uv.y-Y0)*z/F+EYE;
  vec3 col=skyV(uv);
  if(z<220.){
    float sk; vec3 f=facadeV(z,h,side,px,sk);
    if(sk<1.){
      float lit=side<0.?1.:0.;
      vec3 light=mix(vec3(.10,.11,.17), vec3(1.15,.74,.40), lit*smoothstep(-3.,4.,h+z*.05));
      col=f*light;
      col=mix(col, skyV(vec2(uv.x,Y0+.02))*.85, 1.-exp(-z*.008));
    }
  }

  for(int i=0;i<2;i++){ float sg=i==0?-1.:1.; float zp=W*.9*F/max(abs(uv.x),.0001); float zn=floor(zp/13.)*13.+4.; if(h11(zn+float(i)*7.)<.45) continue;
    float xs=sg*W*.9*F/zn; float hp=(uv.y-Y0)*zn/F+EYE;
    if(uv.x*sg>0. && abs(uv.x-xs)<.12*F/zn && hp<4.2 && hp>-1. && zn>3.) col=mix(vec3(.9,.9,.92), sg<0.?vec3(.15,.25,.65):vec3(.65,.12,.10), step(.5,fract(hp*1.6)))*(sg<0.?1.1:.6);
  }
  return col;
}
// the little arched stone bridge across the canal
vec4 bridgeV(vec2 uv, float px){
  float X=uv.x*ZB/F, Hh=(uv.y-Y0)*ZB/F+EYE;
  if(abs(X)>W+2.) return vec4(0);
  float arch=1.9+2.0*sqrt(max(1.-pow(X/(W-.6),2.),0.));
  float top=4.5+.5*(1.-pow(X/(W+2.),2.));
  if(Hh>top+1.1 || Hh<-.1 || (Hh<arch && abs(X)<W-.6)) return vec4(0);
  float brick=step(.12,fract(Hh*6.))*step(.08,fract(X*3.+floor(Hh*6.)*.5));
  vec3 c=mix(vec3(.30,.12,.08), vec3(.62,.30,.18), brick*(.7+.3*noise(vec2(X*9.,Hh*20.))));
  c=mix(c, vec3(.95,.90,.80), smoothstep(.35,.25,abs(Hh-arch-.15))*step(abs(X),W-.6)+step(top-.25,Hh)*step(Hh,top));   // white stone trim
  if(Hh>top){ float bal=step(.35,fract(X*2.2))*step(Hh,top+.95); c=mix(skyV(uv), vec3(.92,.86,.75)*.95, max(bal,step(top+.95,Hh)+step(Hh,top+.15))); }   // a railing
  c*=mix(.75,1.15,smoothstep(-W,W,X));
  c=mix(c, vec3(.55,.45,.40), smoothstep(.25,.0,abs(Hh-arch))*step(abs(X),W-.6)*.5);
  return vec4(c*vec3(1.1,.85,.6), 1.);
}
`;

<script>
const VENICE2 = `
vec3 sceneV(vec2 uv, float t, float px){
  vec3 c=aboveV(uv,t,px);

  return c;
}
// a gondola, seen side-on along the plane x = xg. z0 = its back end, dir = which way it goes
void gondolaV(inout vec3 col, inout float zHit, vec2 uv, float xg, float z0, float dir, float t, float px){
  if(uv.x*xg<=0.) return;
  float z=xg*F/uv.x; if(z<2. || z>zHit) return;
  float h=(uv.y-Y0)*z/F+EYE;
  float s=(z-z0)/11.; if(dir<0.) s=1.-s;                       // s: 0 = the front, 1 = the back
  float e=px*z/F;
  vec3 c=vec3(-1.);
  if(s>-.02 && s<1.02){
    float top=.42+.75*pow(abs(s-.5)*2.,5.)+.05*step(s,.0);
    if(h>-.06 && h<top) c=vec3(.025,.022,.025)+vec3(.35,.25,.15)*smoothstep(.06,.0,abs(h-top+.06))*.5;   // shiny black hull
    if(s<.05 && h>top-.1 && h<top+.45 && abs(s-.0)<.03){ c=vec3(.75,.75,.72); if(fract(h*12.)<.4 && h<top+.3) c=vec3(.12); }   // the silver "ferro" on the front
    // the gondolier at the back: striped shirt, straw hat, a long oar
    float gs=(s-.86)*11.;
    if(abs(gs)<.22 && h>.45 && h<1.45) c=mix(vec3(.95,.95,.95), vec3(.05,.08,.30), step(.5,fract(h*7.)))*(.75+.25*step(0.,gs*-dir));
    if(abs(gs)<.22 && h>.42 && h<.75) c=vec3(.06,.06,.08);
    if(length(vec2(gs,(h-1.62)*.9))<.14) c=vec3(.85,.62,.48);
    if(abs(gs)<.32 && abs(h-1.76)<.035) c=vec3(.95,.82,.40);
    if(abs(gs)<.14 && h>1.76 && h<1.88) c=vec3(.95,.80,.38);
    if(abs(h-(1.2-(gs-.35)*1.2))<.05 && gs>-.1 && gs<1.6) c=vec3(.35,.22,.12);
  }
  if(c.x>=0.){ col=c*mix(vec3(.6,.6,.75), vec3(1.2,.9,.6), step(xg,0.)); zHit=z; }
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  float zw=W*F/max(abs(uv.x),.0001);
  vec3 col=sceneV(uv,t,px);
  float zHit=zw;
  if(uv.y<Y0){
    float zg=EYE*F/(Y0-uv.y);
    if(zg<zw){
      zHit=zg;
      // the canal: reflections of the houses, the bridge and the sky, broken up by little ripples
      vec2 wp=vec2(uv.x*zg/F, zg);
      float rip=noise(wp*vec2(1.5,.6)+vec2(0.,t*.5))*.6+noise(wp*vec2(4.,1.5)-vec2(t*.3,t*.8))*.4;

      col=vec3(.02,.06,.05)+r*vec3(.50,.55,.48)*(.7+.5*rip);
      col+=vec3(1.4,.9,.45)*pow(noise(vec2(wp.x*10., wp.y*5.+t*1.2)),22.)*1.6*smoothstep(.4,.0,abs(uv.x-.05)*1.5);   // golden glints
    }

  float zA=90.-mod(t*1.3,80.), zB=10.+mod(t*1.1+30.,85.);

}

<script>
// ---------- 35. GREAT WALL OF CHINA: the wall winding over green ridges, watchtowers, morning mist in the valleys ----------
const GWALL = `
const vec2 SUNG=vec2(-.55,.20);
float rdgG(float x, float k){ float h=0., a=.5; for(int i=0;i<5;i++){ h+=a*(1.-abs(noise(vec2(x,k))*2.-1.)); x=x*2.1+1.3; a*=.48; } return h; }
float ridgeY(float x, int k){
  float fk=float(k);
  if(k==0) return .02+.30*pow(rdgG(x*1.8+2.,1.),2.5);
  if(k==1) return -.06+.34*pow(rdgG(x*1.5+7.,2.),2.5);
  if(k==2) return -.16+.40*pow(rdgG(x*1.2+3.,3.),2.5);
  if(k==3) return -.28+.45*pow(rdgG(x*1.0+11.,4.),2.4)+.05*smoothstep(-.2,.6,x);
  return -.50+.42*pow(rdgG(x*.8+5.,5.),2.2)+.22*smoothstep(-.6,.5,x)-.10*smoothstep(.55,.9,x);
}
vec3 hazeG(float k, vec2 uv){ return mix(vec3(.62,.68,.74), vec3(1.05,.80,.55), exp(-length(uv-SUNG)*1.6)*.6)*mix(.95,.6,k/4.); }
// a stretch of the wall along a ridge, with crenellations and watchtowers. s = size of the layer
vec4 wallG(vec2 uv, int k, float s, float x0, float x1, float px){
  if(uv.x<x0 || uv.x>x1) return vec4(0);
  float R=ridgeY(uv.x,k), hw=.012*s;
  float e=px;
  vec3 st=vec3(.40,.36,.30);
  float top=R+hw;
  float mer=step(.45,fract(uv.x/(.006*s)));
  float d=max(uv.y-(top+hw*.35*mer), R-hw*.8-uv.y);
  vec4 res=vec4(0);
  if(d<e){ float sl=(ridgeY(uv.x+.003,k)-ridgeY(uv.x-.003,k))/.006;
    vec3 c=st*(.75+.35*clamp(.5-sl*.8,0.,1.))*(.85+.2*noise(uv*vec2(400.,900.)));
    c*=.85+.15*step(.15,fract((uv.y-R)/(hw*.25)));                                            // rows of bricks
    if(uv.y>top-hw*.3 && uv.y<top) c=mix(c, vec3(.55,.50,.42), .6);                        // the walkway on top
    res=vec4(c, cover(d,e)); }
  // watchtowers
  float tc=.16*s/max(s,.6)*1.6, ci=floor(uv.x/tc);
  float tx=(ci+.5)*tc;
  if(h11(ci*3.7+float(k))>.35 && tx>x0+.02 && tx<x1-.02){
    float tw=.022*s, th=.05*s, ty=ridgeY(tx,k);
    vec2 q=uv-vec2(tx,ty);
    float bt=max(abs(q.x)-tw, max(-q.y-.03*s, q.y-th-.012*s*step(.45,fract(q.x/(.007*s)))));
    if(bt<e){
      vec3 c=st*(q.x<0.?1.05:.7)*(.85+.2*noise(uv*vec2(300.,700.)));
      c*=.85+.15*step(.15,fract(q.y/(th*.12)));
      vec2 wq=vec2(fract((q.x+tw)/(tw*.66))-.5, (q.y-th*.55)/(th*.22));
      if(abs(wq.x)<.18 && wq.y>-.6 && wq.y<.4+.25*(1.-pow(wq.x/.18,2.)) && abs(q.x)<tw*.85) c=vec3(.05,.04,.04);   // arched windows
      res=vec4(mix(res.rgb,c,cover(bt,e)), max(res.a,cover(bt,e)));
    }
  }
  return res;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  // soft morning sky
  vec3 col=mix(vec3(1.0,.82,.60), vec3(.28,.45,.75), smoothstep(.05,.5,uv.y));
  col+=vec3(1.,.75,.45)*.5*exp(-length(uv-SUNG)*3.)+vec3(1.,.95,.8)*smoothstep(.04,.03,length(uv-SUNG));
  for(int k=0;k<5;k++){
    float fk=float(k), R=ridgeY(uv.x,k);
    if(uv.y<R){
      float d=R-uv.y;
      // the hillside: forest of bumpy trees, shadier on the side away from the sun
      float sl=(ridgeY(uv.x+.004,k)-ridgeY(uv.x-.004,k))/.008;
      float sc=12.+fk*14.;
      vec2 hp=vec2(uv.x*sc*.5, uv.y*sc*.8+fk*3.);
      float h0=fbm4(hp), hx=fbm4(hp+vec2(.06,0.)), hy=fbm4(hp+vec2(0.,.06));
      float lit=clamp(.55-sl*.6-(hx-h0)*9.+(hy-h0)*4.,0.,1.);                                     // bumpy slopes lit from the left
      float tr=smoothstep(.3,.7,noise(uv*sc*9.))*.6+noise(uv*sc*22.)*.4;                            // little round treetops
      vec3 g=mix(vec3(.015,.035,.015), vec3(.20,.32,.09), lit)*(.55+.7*tr);
      col=mix(g, hazeG(fk,uv), clamp(mix(.80,.0,fk/4.),0.,1.));
      // morning mist filling the valley below this ridge
      float mist=smoothstep(.10,.30,d+.08*(fbm4(vec2(uv.x*3.-t*.01,fk))-.5))*smoothstep(.12,-.25,uv.y);
      col=mix(col, hazeG(fk*.5,uv)*1.05, mist*mix(.9,.6,fk/4.)*(.6+.4*fbm4(vec2(uv.x*4.+t*.015,uv.y*8.+fk))));
    }
    // the Great Wall riding along the crest of the ridges
    vec4 w=vec4(0);
    if(k==1) w=wallG(uv,1,.45,-.9,.2,px);
    if(k==2) w=wallG(uv,2,.6,-.1,.9,px);
    if(k==3) w=wallG(uv,3,.85,-.9,.25,px);
    if(k==4) w=wallG(uv,4,2.1,-.9,.9,px);
    w.rgb=mix(w.rgb, hazeG(fk,uv), clamp(mix(.75,.0,fk/4.),0.,1.));
    col=mix(col,w.rgb,w.a);
  }
  gl_FragColor=vec4(finish(col*.8,uv),1.);
}
`;

<script>
// ---------- 36. TAJ MAHAL: white marble glowing pink and gold at sunrise, reflected in the long pool ----------
const TAJ = `
const float PB=-.115;                      // the top of the big platform (the water line of the reflection)
vec3 skyT(vec2 uv){
  float y=uv.y-PB;
  vec3 c=mix(vec3(1.05,.55,.35), vec3(.75,.48,.55), smoothstep(.0,.2,y)); c=mix(c, vec3(.28,.32,.58), smoothstep(.15,.6,y));
  c+=vec3(1.,.55,.25)*.5*exp(-length(uv-vec2(-.9,PB+.05))*2.2);
  float cl=fbm(vec2(uv.x*1.5,y*6.)); c=mix(c, mix(vec3(1.2,.65,.5), vec3(.45,.35,.5), smoothstep(.2,.5,y)), smoothstep(.6,.85,cl)*smoothstep(.15,.3,y)*.6);

vec3 marble(float lit, float x, float y){ vec3 c=mix(vec3(.09,.09,.18), vec3(1.05,.62,.44), lit*lit*(3.-2.*lit)); return c*(.92+.08*noise(vec2(x*300.,y*300.))); }
// an onion dome: base at y0, half-width w, total height h. returns colour + coverage
vec4 domeT(vec2 uv, float cx, float y0, float w, float h, float px){
  float u=(uv.y-y0)/h; if(u<0. || u>1.25) return vec4(0);
  float v=clamp((u-.32)/.68,0.,1.);
  float r=u<.32?mix(w*.78,w,smoothstep(.0,.32,u)):w*sqrt(max(1.-v*v,0.))*(1.-.55*v*v*v);
  float dx=uv.x-cx;
  float d=abs(dx)-r;
  if(u>.98) d=abs(dx)-max(w*.025,px*.8);                                 // the golden spike on top
  float a=cover(d,px); if(a<=0.) return vec4(0);
  float nx=clamp(dx/max(r,.001),-1.,1.);
  float lit=clamp(.55-.75*nx+.15*(u-.4),0.,1.);
  vec3 c=marble(lit,uv.x,uv.y);
  if(u>.98) c=vec3(1.1,.75,.30)*(.6+.5*lit);
  return vec4(c,a);
}
vec4 tajT(vec2 uv, float px, float t){
  vec4 res=vec4(0); float ax=abs(uv.x);

const FACTORY = `
const float HY=-.02;
vec3 skyGF(vec2 uv, float px){

// a firework burst shaped like a game icon: 0 = star, 1 = heart, 2 = ring, 3 = smiley
vec3 fireGF(vec2 uv, float t, float id){
  float P=6., lt=mod(t+id*2.,P), k=floor((t+id*2.)/P);

    float a=float(i)/36.*6.2832; vec2 d=vec2(cos(a),sin(a)); float r=1.;

float ellD(vec2 p, vec2 c, vec2 r){ return length((p-c)/r)-1.; }

    float fins=step(abs(q.x),.022-q.y*.3)*step(0.,q.y)*step(q.y,.018);

  for(int i=0;i<2;i++){ float cx=-.24+float(i)*.12; vec2 cq=uv-vec2(cx-.12,-.10);
    if(abs(cq.x+.12)<.016 && cq.y>.15 && cq.y<.26) col=vec3(.06,.02,.015)*(.7+.6*step(0.,cq.x+.12));
    for(int j=0;j<5;j++){ float fj=float(j); float pl=fract(t*.12+fj*.2+float(i)*.1);
      vec2 bp=vec2(cx-.12+.05*pl+.01*sin(t+fj), -.10+.27+pl*.22); float br=.012+.025*pl;
      float bd=length(uv-bp);
      vec3 bc=.55+.45*cos(6.28*(fj*.2+float(i)*.5+vec3(0.,.33,.67)));
      col=mix(col, bc*(.7+.5*smoothstep(br,-br,uv.x-bp.x+uv.y-bp.y)), smoothstep(br,br-.003,bd)*(1.-pl)*.85); } }
  // the hill in front where three friends sit watching the show
  float fh=-.30+.04*sin(uv.x*3.)+.01*noise(vec2(uv.x*40.,1.));
  if(uv.y<fh){ col=mix(vec3(.004,.007,.003), vec3(.018,.026,.008), noise(uv*vec2(80.,200.))*.6+.4*noise(uv*vec2(20.,40.)))*(1.-.4*smoothstep(fh,fh-.2,uv.y)); col+=vec3(1.,.5,.15)*.12*smoothstep(fh-.01,fh,uv.y); }
  // Sparks: a long yellow robot dog with a purple head-top, ears, back and tail
  vec2 s=uv-vec2(-.10,-.27);
  float sd=ellD(s,vec2(0.,.035),vec2(.11,.04));
  sd=min(sd, ellD(s,vec2(.10,.085),vec2(.04,.038)));
  float ears=min(ellD(s,vec2(.08,.125),vec2(.012,.025)), ellD(s,vec2(.12,.125),vec2(.012,.025)));
  float tail=segD(s,vec2(-.11,.04),vec2(-.15,.08+.01*sin(t*4.)))-.008;
  float legs=min(ellD(s,vec2(-.07,.0),vec2(.018,.02)), ellD(s,vec2(.06,.0),vec2(.018,.02)));
  if(min(min(sd,legs),min(ears,tail/.03))<0.){
    col=vec3(.85,.62,.06)*(.45+.6*smoothstep(-.1,.1,s.x));
    if(ellD(s,vec2(0.,.07),vec2(.10,.012))<0. || ellD(s,vec2(.10,.11),vec2(.035,.016))<0. || ears<0. || tail<.0) col=vec3(.30,.08,.55)*(.6+.5*smoothstep(-.1,.1,s.x));
    col+=vec3(1.,.5,.2)*.25*smoothstep(-.02,.05,s.x+s.y);

  for(int i=0;i<2;i++){ float fi=float(i); vec2 c=uv-vec2(.16+fi*.16,-.285); float sc=fi>.5?1.25:1.;

    float tl=segD(c,vec2(.03,.01),vec2(.07,.03+.02*sin(t*2.+fi)))-.007-fz;

<script>
// ---------- 🐱 CATS: shared helpers for soft fur ----------
const CATKIT = `
float smin(float a, float b, float k){ float h=clamp(.5+.5*(b-a)/k,0.,1.); return mix(b,a,h)-k*h*(1.-h); }
// ellipse (centre c, radii r, turned by a): roughly the distance to its edge, < 0 inside
float ellS(vec2 p, vec2 c, vec2 r, float a){ p=rot(-a)*(p-c); float k0=length(p/r), k1=length(p/(r*r)); return k0*(k0-1.)/max(k1,1e-5); }
// a cat ear: a rounded triangle from its base point b, pointing along angle a
float earS(vec2 p, vec2 b, float a, float w, float h){ vec2 q=rot(-a)*(p-b);
  float side=(abs(q.y)-w*(1.-q.x/h))*.9; return max(max(side,-q.x),q.x-h); }
// fur strands that flow along angle a (0..1), fine hairs on top of soft clumps
float furT(vec2 p, float a, float sc){ vec2 q=rot(-a)*p; return .5*noise(q*vec2(sc*.07,sc))+.3*noise(q*vec2(sc*.14,sc*2.2)+5.3)+.2*noise(q*vec2(sc*.03,sc*.3)+9.1); }
// furry coverage: single hairs poke out up to fw past the smooth edge
float furA(float d, float hair, float fw, float px){ return clamp((-d+fw*(hair*1.8-.7))/(1.4*px)+.5,0.,1.); }
// a soft, round "dome" height made from a distance field (R = how thick that body part is)
float domeH(float d, float R){ float s=clamp(-d/R,0.,1.); return R*sqrt(1.-(1.-s)*(1.-s)); }
// a little twitch now and then: 0 most of the time, a quick soft wiggle once every P seconds
float twitch(float t, float P, float ph){ float k=mod(t+ph,P); return k<1.2 ? sin(k/1.2*PI)*sin(k*10.) : 0.; }
// light on fur: wrapped soft diffuse + a glowing rim where light passes through the hair tips
vec3 furLit(vec3 base, vec3 N, vec3 L, vec3 sun, vec3 amb, float occ){
  float dif=clamp((dot(N,L)+.4)/1.4,0.,1.); dif*=dif;
  float rim=pow(1.-clamp(N.z,0.,1.),2.5)*clamp(dot(normalize(N.xy+1e-4),normalize(L.xy))*.7+.3,0.,1.);
  return base*(amb*occ*(.55+.45*N.z)+sun*dif)+sun*base*rim*.9+sun*rim*rim*.08;
}
// a soft round bokeh disc (out-of-focus light)
float bokeh(vec2 p, float r){ float d=length(p); return smoothstep(r,r*.85,d)*(.75+.25*smoothstep(r*.4,r*.95,d)); }
`;
// ---------- 38. 🛏️ COZY NAP: a brown tabby curled up asleep in a sunbeam on a soft blanket ----------
const NAP = `
const vec2 CC=vec2(.06,-.11);       // middle of the curled-up cat
const vec2 HC=vec2(-.13,-.06);      // the head (from CC)
const float HA=.42;                 // head tilt
float BR, TW, EW;                   // breathing, tail-tip twitch, ear twitch
float bodyD(vec2 p){
  p-=CC; p.y=(p.y-.03)/(1.+.03*BR)+.03; p.x/=1.+.01*BR;              // the side gently rises and falls
  float d=ellS(p,vec2(.03,.03),vec2(.235,.14),-.06);
  d=smin(d, ellS(p,vec2(.175,.06),vec2(.135,.135),.25), .05);       // the round back hip
  d=smin(d, ellS(p,vec2(-.10,.025),vec2(.12,.105),.45), .05);       // the shoulder
  d=smin(d, ellS(p,vec2(.215,-.065),vec2(.06,.035),-.5), .03);      // a back foot tucked in by the tail
  d=smin(d, ellS(p,vec2(-.215,-.135),vec2(.045,.026),.15), .02);    // a front paw peeking out under the chin
  return d+.005*(fbm4(p*14.)-.5);
}
// the tail wraps around the front like a scarf; s = 0 at the hip ... 1 at the tip
float tailD(vec2 p, out float s){
  vec2 q=(p-CC-vec2(.01,.0))/vec2(1.2,.72); float a=atan(q.y,q.x), r=length(q);
  const float A0=-.12, A1=-2.45;
  s=(A0-a)/(A0-A1);
  float tip=smoothstep(.72,1.,s);
  float R=.215+.025*TW*tip-.012*tip;
  float th=mix(.042,.028,s)*(1.-.35*tip*tip);
  float d;
  if(s>=0. && s<=1.) d=abs(r-R)-th;
  else { vec2 e=s<0.?vec2(cos(A0),sin(A0))*(.215):vec2(cos(A1),sin(A1))*(.215+.025*TW-.012); d=length(q-e)-(s<0.?.042:.018); s=clamp(s,0.,1.); }
  return d*.8;
}
vec2 headQ(vec2 p){ return rot(-HA)*(p-CC-HC); }
float headD(vec2 p){
  vec2 q=headQ(p);
  float d=ellS(q,vec2(0.,.0),vec2(.085,.07),0.);
  d=smin(d, ellS(q,vec2(0.,-.022),vec2(.098,.052),0.), .03);        // fluffy cheeks
  d=smin(d, ellS(q,vec2(0.,-.045),vec2(.048,.032),0.), .02);        // the muzzle
  return d;
}
float earsD(vec2 q, out float inner){
  float e1=earS(q,vec2(-.048,.036),2.05+EW*.18,.042,.075), e2=earS(q,vec2(.05,.04),1.1,.042,.072);
  float i1=earS(q,vec2(-.048,.042),2.05+EW*.18,.026,.055), i2=earS(q,vec2(.049,.046),1.1,.026,.052);
  inner=min(i1,i2); return min(e1,e2);
}
float catAll(vec2 p){ float s; float d=min(bodyD(p),tailD(p,s)); vec2 q=headQ(p); float inn; return min(d,min(headD(p),earsD(q,inn))); }
// brown tabby colours: dark stripes on warm brown, ticked hairs, a creamy chin and tummy
vec3 tabby(float str, float hair, float cream){
  vec3 dark=vec3(.03,.022,.016), warm=vec3(.25,.17,.095), tick=vec3(.46,.37,.25);
  vec3 c=mix(warm, tick, smoothstep(.4,.9,hair))*(.85+.25*hair);
  c=mix(c, dark*(.8+.4*hair), str);

// ---------- 42. ⭐ TIGER'S STARRY SKY: a calm night over a meadow; stars slowly join up into a happy, curled-up cat ----------
const TIGERSKY = `
vec2 cP(int i){                       // the constellation: a cat curled up asleep (head on the left, ears up, tail wrapped round)
  if(i==0) return vec2(-.58,.06);  if(i==1) return vec2(-.50,.30);  if(i==2) return vec2(-.42,.19);

  // the cat constellation (it sits up high, in the middle of the sky)

<script>
// ---------- 43. 🦁 BIG CATS: lions resting on the African savanna at sunset, golden haze, an acacia tree ----------
const BIGCATS = `
const float HZ=-.06;
float BR, FLK, EW;
// a lion lying down like a sphinx, facing left. mane = 1 for the big male
float lionD(vec2 q, float mane, out float maneD){
  q.y/=1.+.015*BR;
  float d=ellS(q,vec2(.0,.085),vec2(.24,.08),0.);                                 // body
  d=smin(d, ellS(q,vec2(.17,.10),vec2(.11,.095),0.), .05);                      // back hip
  d=smin(d, ellS(q,vec2(-.15,.105),vec2(.10,.10),.2), .05);                     // shoulder
  d=smin(d, segD(q,vec2(-.18,.03),vec2(-.36,.022))-.028, .03);                  // front legs stretched out
  d=smin(d, ellS(q,vec2(-.375,.024),vec2(.042,.022),0.), .02);
  vec2 h=q-vec2(-.25,.235-.012*(1.-mane));
  float hd=ellS(h,vec2(0.),vec2(.068,.064),-.2);
  hd=smin(hd, ellS(h,vec2(-.06,-.03),vec2(.05,.038),-.25), .03);               // the muzzle
  hd=smin(hd, min(length(h-vec2(.012,.056))-.019-.003*EW, length(h-vec2(.045,.045))-.018), .01);   // round ears
  d=smin(d, hd, .04);
  d=smin(d, segD(q,vec2(-.20,.13),vec2(-.24,.2))-.05, .04);                      // the neck
  // the mane: big, shaggy, fluffy round the head and chest
  maneD=1.;
  if(mane>.5){ vec2 m=q-vec2(-.20,.21); float a=atan(m.y,m.x);
    maneD=ellS(m,vec2(0.),vec2(.12,.14),-.3)+.018*(fbm4(vec2(a*3.,1.)+5.)-.5)+.012*(noise(vec2(a*14.,2.))-.5);
    maneD=max(maneD, -ellS(h,vec2(-.035,-.01),vec2(.07,.055),-.2));               // the face shows in front
    d=min(d, maneD); }
  // the tail lies along the ground and the tip flicks up
  vec2 t0=vec2(.26,.08), t1=vec2(.36,.02), t2=vec2(.46,.015), t3=vec2(.52,.03+.05*FLK);
  float tl=min(min(segD(q,t0,t1),segD(q,t1,t2)),segD(q,t2,t3))-.012;
  tl=min(tl, length(q-t3)-.022);                                                 // the dark tuft
  return min(d,tl);
}
float acacia(vec2 uv){
  vec2 p=uv-vec2(.56,HZ);

  vec2 sunP=vec2(.08,HZ+.07); float sr=.10;
  // sky: deep orange near the sun, rose and purple higher up, a few long thin clouds
  float y=uv.y-HZ;
  vec3 col=mix(vec3(.95,.38,.08), vec3(.50,.17,.10), smoothstep(.0,.25,y)); col=mix(col, vec3(.10,.05,.10), smoothstep(.2,.6,y));
  col+=vec3(1.4,.6,.15)*exp(-length((uv-sunP)*vec2(.6,1.2))*3.5)*.7;
  float cl=fbm(vec2(uv.x*1.5+t*.004,y*14.)); float cm=smoothstep(.55,.8,cl)*smoothstep(.08,.16,y)*smoothstep(.5,.25,y);
  col=mix(col, mix(vec3(1.4,.55,.25), vec3(.35,.12,.18), smoothstep(.1,.4,y))*(1.+1.5*exp(-length(uv-sunP)*3.)), cm*.8);
  // the big sun, sitting low in the dusty air
  float sd=length(uv-sunP);
  col=mix(col, vec3(2.4,1.25,.45)*(1.-.15*sd/sr), smoothstep(sr,sr-px*2.,sd)*smoothstep(HZ-.01,HZ+.02,uv.y));
  col+=vec3(1.5,.7,.2)*exp(-max(sd-sr,0.)*20.)*.5;

  // the lions: almost silhouettes, with golden light glowing round their fur
  for(int k=0;k<2;k++){

vec3 hazeC(vec2 uv){ return mix(vec3(1.05,.66,.40), vec3(.42,.48,.66), smoothstep(-.7,.4,uv.x))*(1.+.6*exp(-length(uv-SUNP)*2.5)); }
float alpsH(float x){

float pines(float x, float w, float seed){

vec4 tower(vec2 p, float cx, float y0, float y1, float r, float hc, float px){

// a waving flag on a pole: blue and white diamonds like the flag of Bavaria
vec4 flag(vec2 p, vec2 tip, float L, float px, float t){

// a flat wall from a (bottom-left) to b (top-right), with rows of arched windows
vec4 wall(vec2 p, vec2 a, vec2 b, float diff, float warm, vec2 cell, float rows, float px){

  c*=1.-.25*smoothstep(.006,0.,b.x-p.x);                                   // the far corner turns away from the sun
  vec2 q=p-a, gi=floor(q/cell), f=q-(gi+.5)*cell;

// a steep blue roof seen from the side, on top of a wall
vec4 roof(vec2 p, float x0, float x1, float y0, float h, float ins, float px){
  float u=(p.y-y0)/h; if(u<0. || u>1.) return vec4(0);

// a stepped gable (the stair-step shaped top of a wall end)
vec4 gable(vec2 p, float x0, float x1, float y0, float h, float diff, float px){
  float m=(x0+x1)*.5, hw=(x1-x0)*.5, s=1.-abs(p.x-m)/hw; if(s<0. || p.y<y0) return vec4(0);

// ---------- 45-51: lava lake, surf tube, black hole, sunflowers, desert night, ice cave, carnival ----------
// ---------- 45. LAVA LAKE: a glowing lava lake at night, deep in a volcano's crater ----------
const LAVA = `
const float H=.16, EYE=1., ZC=6.2, R=3.3;       // horizon, eye height, lake centre distance + radius
// glowing lava colour from a 0..1+ temperature
vec3 heat(float k){ k=max(k,0.); return vec3(1.,.16,.02)*k*1.3+vec3(1.,.45,.06)*k*k*1.5+vec3(1.,.85,.45)*pow(k,5.)*1.4; }
// cooled crust plates: distance to the crack between the two nearest plate centres
vec3 plates(vec2 p, float t){
  vec2 gi=floor(p), gf=fract(p); float d1=8., d2=8.; vec2 id=vec2(0);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec2 c=vec2(float(i),float(j)), o=h22(gi+c); o=.5+.42*sin(t*.07+6.28*o);
    vec2 r=c+o-gf; float d=dot(r,r);
    if(d<d1){ d2=d1; d1=d; id=gi+c; } else if(d<d2) d2=d;
  }
  return vec3(sqrt(d2)-sqrt(d1), h21(id), h21(id+7.7));
}
// the lake surface, at ground point g (metres-ish), lit from inside
vec3 lake(vec2 g, float t, float px, float z, float rr){
  vec2 q=g-vec2(0.,ZC); float r=length(q);
  q=rot(t*.006+.25*(1.-r/R)*sin(t*.03))*q;                                   // the whole lake swirls very slowly
  vec2 w=vec2(fbm4(q*.35+t*.02), fbm4(q*.35+vec2(4.,1.)-t*.017));
  vec2 p=q*2.+w*2.6;
  vec3 a=plates(p,t), b=plates(p*2.7+3.,t*1.3);
  float aa=px*z*1.8;                                                           // crack softness grows with distance
  float open=smoothstep(.55,.78,fbm4(q*.5+w+vec2(t*.03,0.)));                  // big patches where the skin melts open
  float edge=smoothstep(.9,.995,rr);                     // a bright ring where lava licks the walls
  float cw=.012+.03*a.y*(.5+.5*sin(t*.4+a.z*30.))+.10*open;                    // cracks slowly open and close
  float crack=smoothstep(cw+aa,cw*.2,a.x), crk2=smoothstep(.012+aa,.0,b.x)*(1.-open)*.28;
  float glow=exp(-a.x*9.)*.22;

  crust+=vec3(.45,.07,.01)*glow*(.6+.4*sin(t*.7+a.y*20.));                     // dull red shining through thin crust
  float swirl=fbm(q*1.8+w*3.+vec2(0.,t*.08));

  vec3 col=mix(crust, heat(k*(.8+.4*noise(p*6.+t*.3))), clamp(k*1.3,0.,1.));

}
// the crater walls: dark, craggy rock lit orange by the lake below
vec3 rock(vec2 uv, float d, float t){
  vec2 w=vec2(fbm4(uv*vec2(4.,8.)), fbm4(uv*vec2(4.,8.)+4.));
  float n=fbm(uv*vec2(14.,30.)+w*2.), n2=noise(uv*vec2(110.,190.)+w*6.);
  float gul=fbm4(vec2(uv.x*38.+w.x*6., uv.y*5.));                              // streaky gullies running down the walls
  float ledge=.75+.25*smoothstep(-.3,.3,sin(uv.y*70.+w.x*10.+uv.x*6.));         // rough terraces of old lava flows
  float rg=1.-abs(2.*fbm3(uv*vec2(9.,40.)+w*1.5)-1.); rg=pow(rg,8.);           // sharp rocky ridges catch the light
  float sh=smoothstep(.35,.65,fbm4(uv*vec2(22.,36.)+w*2.));                       // and deep shadowy cracks

  vec3 c=vec3(.028,.022,.02)*(.25+.9*n)*(.55+.7*gul)*(.75+.4*n2);

  c+=vec3(1.,.2,.035)*lit*(.06+.45*n*gul*(.6+.6*n2))*ledge;

}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

  vec2 u2=uv+hz*.0035*smoothstep(.35,-.05,uv.y);

  // where the far shore is, for this column
  float A=x*x+1., disc=ZC*ZC-A*(ZC*ZC-R*R);
  float gzF=disc>0. ? (ZC+sqrt(disc))/A : 0.; float ys=disc>0. ? H-EYE/gzF : -1.;
  float yt=.16+.16*x*x+.05*fbm4(vec2(x*3.,1.))+.02*noise(vec2(x*20.,2.));       // the crater rim
  vec3 col;
  // sky: stars + a red glow from the lava on the clouds of gas
  vec3 sky=vec3(.004,.005,.012)+starfield(uv+vec2(t*.002,0.),px,1.)*smoothstep(.12,.35,uv.y);
  float gl=exp(-max(uv.y-yt,0.)*5.);

  float pl=fbm(vec2(uv.x*2.2-.4, uv.y*1.6-t*.05)+fbm4(uv*3.-vec2(0.,t*.04)));   // a big steam plume rising out of the crater

  sky=mix(sky, mix(vec3(.45,.12,.035), vec3(.05,.045,.06), smoothstep(.15,.5,uv.y))*(.3+.7*pl), plm*.6);
  col=sky;
  float yn=H-EYE/(ZC-R), yf=H-EYE/(ZC+R), cy=(yn+yf)*.5;               // the lake's outline on screen, as an ellipse

  if(u2.y<yt) col=rock(u2,de,t);
  if(u2.y<=ys){
    float z=EYE/(H-u2.y); vec2 g=vec2(x*z, z);
    vec2 gc=g-vec2(0.,ZC); float an=atan(gc.y,gc.x);
    float rr=length(gc)/(R*(1.+.12*(fbm4(vec2(an*2.,1.))-.5)+.03*(noise(vec2(an*12.,5.))-.5)));   // a ragged shoreline
    if(rr<1.) col=lake(g,t,px,z,rr);

  }

  float P=11., k=floor(t/P), lt=t-k*P;
  vec2 fb=vec2(-.25+.5*h11(k), -.06-.1*h11(k+2.));                          // where it bursts, on screen
  float act=smoothstep(0.,.4,lt)*smoothstep(4.5,3.,lt);
  if(act>0.){
    float dome=exp(-length((uv-fb)*vec2(1.,2.5))*90.)*act;
    col+=heat(1.1)*dome*1.4;
    for(int i=0;i<28;i++){
      float fi=float(i), s0=h11(fi+k*13.)*1.6, tt=lt-s0; if(tt<0. || tt>2.) continue;
      vec2 v=vec2((h11(fi*3.1+k)-.5)*.34, .25+.32*h11(fi*7.3+k));
      vec2 pp=fb+v*tt+vec2(0.,-.42*tt*tt);
      if(pp.y<fb.y-.01) continue;
      vec2 vv=v+vec2(0.,-.84*tt);                                                // drawn as a short streak along its path
      float d=segD(uv,pp,pp-vv*.05), sz=px*(1.6+2.4*h11(fi+1.));
      col+=heat(1.15-.3*tt)*(exp(-d/sz)*2.2+exp(-d/(sz*7.))*.3);
    }
    col+=vec3(1.,.3,.05)*.07*act*exp(-length(uv-fb)*5.);                    // it lights up the air around it
  }
  // steam drifting across, lit orange from below
  float st=fbm(vec2(uv.x*3.+t*.03, uv.y*5.-t*.06)+fbm4(uv*4.+t*.02)*1.5);
  float sm=smoothstep(.55,.95,st)*smoothstep(.25,-.05,uv.y)*exp(-de*6.)*.2;
  col=mix(col, vec3(.55,.2,.08)*(.6+.6*st)+col*.4, sm);

  float fr=-.40+.05*fbm4(vec2(uv.x*4.,3.))+.015*noise(vec2(uv.x*40.,1.))+.06*smoothstep(.3,.8,abs(uv.x));

// ---------- 51. CARNIVAL AT NIGHT: a Ferris wheel and a carousel glowing under a cotton-candy sky ----------
const CARNIVAL = `
const float G=-.20;                                  // the ground line
const vec2 WC=vec2(-.30,.13); const float WR=.33;    // the Ferris wheel's hub and size
vec3 hue(float h){ return clamp(abs(fract(h+vec3(0.,.667,.333))*6.-3.)-1.,0.,1.); }
vec3 bulbCol(float k){ return mix(vec3(1.,.72,.35), hue(k)*vec3(1.,.9,.9)+.15, step(.55,fract(k*3.7))); }
vec3 skyC(vec2 uv, float px, float t){
  float y=uv.y;
  vec3 c=mix(vec3(1.05,.55,.42), vec3(.85,.38,.58), smoothstep(G,.12,y));          // peach near the ground, cotton-candy pink, then...
  c=mix(c, vec3(.30,.20,.48), smoothstep(.10,.38,y));                                // ...lavender and
  c=mix(c, vec3(.06,.07,.20), smoothstep(.32,.6,y));                                 // deep evening blue
  float cl=fbm(vec2(uv.x*1.6+t*.004, y*5.));
  c=mix(c, mix(vec3(1.,.55,.6), vec3(.55,.3,.55), smoothstep(.0,.3,y)), smoothstep(.55,.8,cl)*.55*smoothstep(G,.0,y-.05));
  c+=starfield(uv,px,.6)*smoothstep(.3,.5,y);
  return c*.42;
}
// the Ferris wheel: returns colour + coverage
vec4 wheel(vec2 uv, float px, float t, out vec3 glow){
  glow=vec3(0.);
  vec2 p=uv-WC; float r=length(p), a=atan(p.y,p.x), rot0=t*.07;
  float cov=0.; vec3 c=vec3(.02,.015,.03);
  // the steel: two rims, spokes and the legs
  cov=max(cov, smoothstep(px*1.2,0.,abs(r-WR)-.003));
  cov=max(cov, smoothstep(px*1.2,0.,abs(r-WR*.9)-.0015)*.8);
  float sa=(a-rot0)*16./6.2832, sd=abs(fract(sa)-.5)*6.2832/16.*r;
  cov=max(cov, smoothstep(px*1.2,0.,sd-.0012)*step(r,WR));
  float zig=abs(fract(sa*2.+r*40.)-.5);                                               // criss-cross bracing between the rims
  cov=max(cov, smoothstep(px,0.,zig*.02-.001)*step(WR*.9,r)*step(r,WR)*.5);
  cov=max(cov, smoothstep(px*1.5,0.,r-.016));
  for(int k=0;k<2;k++){ float sx=k==0?-1.:1.; cov=max(cov, smoothstep(px*1.2,0.,segD(uv,WC,vec2(WC.x+sx*.17,G+.01))-.004)); }
  // bulbs around the rim and along the spokes, chasing in colours
  float nb=72., bi=floor((a-rot0)*nb/6.2832+.5), ba=bi*6.2832/nb+rot0;
  float tw=.6+.4*sin(t*4.-bi*.7);
  float bd=length(p-vec2(cos(ba),sin(ba))*WR);
  vec3 bc=hue(bi/24.+t*.08)*.8+.2;
  glow+=bc*tw*(exp(-bd/(px*1.3))*2.5+exp(-bd/.012)*.25);
  float si=floor(sa+.5), spa=si*6.2832/16.+rot0;
  vec2 sp=vec2(cos(spa),sin(spa)); float along=dot(p,sp), sk=floor(along/(WR/7.)+.5)*(WR/7.);
  if(sk>.02 && sk<WR*.95){ float d2=length(p-sp*sk); glow+=vec3(1.,.82,.5)*(.6+.4*sin(t*3.+sk*40.-si))*(exp(-d2/(px*1.1))*1.8+exp(-d2/.01)*.12); }
  // gondolas, hanging straight down from the rim and rocking gently
  float gi=floor((atan(p.y+.03,p.x)-rot0)*16./6.2832+.5);
  for(int k=-1;k<=1;k++){
    float ga=(gi+float(k))*6.2832/16.+rot0; vec2 piv=WC+vec2(cos(ga),sin(ga))*WR;
    vec2 q=uv-piv; q*=rot(.08*sin(t*1.3+gi));

    float arm=abs(q.x)-.0012; arm=max(arm, max(q.y-.0, -.016-q.y));

      vec3 gcol=hue(fract((gi+float(k))*.37))*.5+.1;
      gcol=mix(gcol, vec3(1.,.8,.5)*1.2, step(gb,0.)*step(abs(q.y+.024),.005)*step(abs(q.x),.012));   // a lit window band

// the carousel: a striped tent roof with bulbs, glowing gold inside, horses going round
void carousel(inout vec3 col, vec2 uv, float px, float t){
  vec2 c=vec2(.46,G); float W=.26, RB=G+.17, AP=G+.32;
  vec2 p=uv-c;

    vec3 in1=vec3(1.,.5,.18)*(.03+.12*smoothstep(G,RB,uv.y))*(.6+.6*smoothstep(W,0.,abs(p.x)));
    float rt=t*.35;

      vec2 hq=(p-vec2(x,.07+bob))/(.035*(1.+.25*dep));
      float fx=sign(cos(ang+1.57)); hq.x*=fx;                                         // which way it faces
      float hd=length(hq*vec2(1.,2.1))-1.;                                             // body
      hd=min(hd, segD(hq,vec2(.6,.2),vec2(.95,.95))-.2);                                // neck
      hd=min(hd, segD(hq,vec2(.95,.95),vec2(1.45,.7))-.14);                             // head
      hd=min(hd, segD(hq,vec2(-.95,.1),vec2(-1.4,-.4))-.06);                            // tail
      hd=min(hd, min(segD(hq,vec2(.55,-.2),vec2(.9,-.75))-.08, segD(hq,vec2(-.55,-.2),vec2(-.6,-.95))-.08));   // legs, galloping
      float horse=step(hd,0.);
      vec3 hc=mix(vec3(.95,.92,.88), vec3(.45,.25,.2), step(.5,fract(float(k)*.5)))*(.06+.08*dep);
      in1=mix(in1, vec3(1.,.75,.3)*.5, pole*step(0.,dep)*.9);
      in1=mix(in1, hc, clamp(horse,0.,1.)*step(-.2,dep));

  float yr=(uv.y-RB)/(AP-RB), hw=W*(1.-yr)+.004;
  float scal=.012*abs(sin(p.x*60.));
  if(uv.y>RB-.012+scal && yr<1. && abs(p.x)<hw){

    vec3 rc=mix(vec3(.8,.08,.10), vec3(1.,.92,.82), st)*(.07+.2*smoothstep(1.,.0,yr));
    col=rc;

  float bx=floor(p.x/.022+.5)*.022;
  if(abs(bx)<W){ float d=length(p-vec2(bx,RB-.004-c.y+G)); float tw=.6+.4*sin(t*5.+bx*90.);
    col+=vec3(1.,.8,.45)*tw*(exp(-d/(px*1.2))*2.+exp(-d/.012)*.2); }
  col+=vec3(1.,.6,.25)*.10*exp(-length(p-vec2(0.,.08))*6.);                         // its warm glow
  // a little flag on top
  vec2 f=uv-vec2(c.x,AP); if(f.x>0. && f.x<.03 && f.y>.02 && f.y<.035+.004*sin(t*4.+f.x*100.)) col=vec3(.9,.8,.2)*.6;
  if(abs(f.x)<.0015 && f.y>0. && f.y<.04) col=vec3(.1);
}
// everything above the ground (also used for the reflections)
vec3 above(vec2 uv, float px, float t){
  vec3 col=skyC(uv,px,t);
  // trees and tents far behind, dark against the pink sky
  float tr=G+.05+.03*fbm4(vec2(uv.x*9.,1.))+.02*noise(vec2(uv.x*40.,2.));
  if(uv.y<tr) col=vec3(.03,.025,.05);
  float tx=fract(uv.x*3.2+.3)-.5, tent=G+.09-abs(tx)*.25;
  if(uv.y<tent && abs(tx)<.3 && abs(uv.x+.95)>.0){
    vec3 tc=mix(vec3(.6,.15,.25), vec3(.7,.6,.4), step(.5,fract(tx*10.)))*.12;
    col=tc+vec3(1.,.6,.3)*.12*smoothstep(G+.02,G,uv.y);
  }
  vec3 glow; vec4 w=wheel(uv,px,t,glow);
  col=mix(col, w.rgb, w.a);
  col+=glow;
  col+=vec3(1.,.5,.6)*.05*exp(-length(uv-WC)/.3);                                     // a soft halo from all its lights

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  vec3 col;
  if(uv.y>G) col=above(uv,px,t);

    float z=.10/max(G-uv.y,.001); vec2 g=vec2(uv.x*z, z);
    float pud=smoothstep(.56,.62,fbm4(g*vec2(2.,3.5)+3.));
    float rip=noise(vec2(g.x*30., g.y*12.-t*.5))-.5;
    float rough=1.-pud*.85;

    vec3 rf2=above(m+vec2(rip*.01*rough,.03*rough+.01),px,t);                                       // the wet ground smears the reflections
    col=mix(gr+(rf+rf2)*.08, (rf*.6+rf2*.4)*.5, pud);

  for(int k=0;k<2;k++){
    float fk=float(k), y0=.42-fk*.07, sag=.08+.03*fk, sp=.085-.02*fk;
    float x=uv.x+fk*.03, c0=floor(x/sp+.5);

// a low, round desert bush, dark with a silvery moonlit top

vec3 skyN(vec2 uv, float px, float t){

// ---------- 47. BLACK HOLE: a glowing golden disk around a black hole, with its light bent all around it ----------
const BHOLE = `
// the starry sky in a given direction (with a soft milky band and colourful clouds)
vec3 skyDir(vec3 d, float px){
  vec2 s=vec2(atan(d.z,d.x), asin(clamp(d.y,-1.,1.)));
  vec2 q=s*vec2(1.,1.)*.9;

  c+=vec3(.5,.45,.4)*band*.04;
  return c;
}
// the glowing gas of the disk at radius r, angle a
vec3 diskCol(vec2 xz, float t, out float alpha){
  float r=length(xz), a=atan(xz.y,xz.x);
  float w=1.8*pow(r,-1.5);                                                   // inner gas goes round faster
  float aa=a+t*w*1.2;

  float n=fbm(vec2(r*2.2, aa*2.)+fbm4(pp*.5)*1.8), n2=noise(vec2(r*9., aa*6.)+n*3.);

  float I=inner*outer*pow(3./r,1.4)*(.3+1.*n)*rings;

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  float inc=.10+.025*sin(t*.05), yaw=t*.01;

// soft drifting fog: amount 0..1 below the line "top"
float fogBand(vec2 uv, float t, float top, float thick, float sp, float seed){

// ---------- 54. 🎃 JACK-O'-LANTERN PATCH: friendly carved pumpkins glowing in a field at dusk ----------
const PUMPKIN = `
float triD(vec2 p, vec2 a, vec2 b, vec2 c){                         // signed distance to a triangle (< 0 inside)
  vec2 e0=b-a, e1=c-b, e2=a-c, v0=p-a, v1=p-b, v2=p-c;
  vec2 pq0=v0-e0*clamp(dot(v0,e0)/dot(e0,e0),0.,1.), pq1=v1-e1*clamp(dot(v1,e1)/dot(e1,e1),0.,1.), pq2=v2-e2*clamp(dot(v2,e2)/dot(e2,e2),0.,1.);
  float s=sign(e0.x*e2.y-e0.y*e2.x);
  vec2 d=min(min(vec2(dot(pq0,pq0), s*(v0.x*e0.y-v0.y*e0.x)), vec2(dot(pq1,pq1), s*(v1.x*e1.y-v1.y*e1.x))), vec2(dot(pq2,pq2), s*(v2.x*e2.y-v2.y*e2.x)));
  return -sqrt(d.x)*sign(d.y);
}
// the carved face, in the pumpkin's own coordinates (radius 1). style changes the eyes. < 0 = a hole
float faceD(vec2 q, float style){
  float eyes;
  vec2 e=vec2(abs(q.x),q.y);
  if(style<.5) eyes=triD(e,vec2(.16,.10),vec2(.50,.10),vec2(.33,.42));          // triangle eyes
  else if(style<1.5) eyes=length((e-vec2(.32,.22))*vec2(1.,1.15))-.15;            // round eyes
  else eyes=max(length(e-vec2(.32,.16))-.17, -(length(e-vec2(.32,.05))-.16));       // happy closed-eye crescents
  float nose=triD(q,vec2(-.08,-.02),vec2(.08,-.02),vec2(0.,.12));
  float mx=q.x/.62; float top=-.17+.20*mx*mx, bot=-.20-.30*(1.-mx*mx);
  float mouth=max(max(q.y-top, bot-q.y), abs(q.x)-.62);
  mouth=max(mouth, -boxD(q,vec2(.20,top-.04),vec2(.06,.06)));                       // two little teeth
  mouth=max(mouth, -boxD(q,vec2(-.20,bot+.04),vec2(.06,.06)));
  return min(min(eyes,nose),mouth);
}
vec3 duskSky(vec2 uv, float t, float px){
  float y=uv.y;

  c=mix(c, vec3(.13,.09,.24), smoothstep(.08,.32,y));

}
void main(){

    if(rr>1.08 && stem>px*2.) continue;

    float rib=pow(abs(cos(asin(u)*3.5)),.35);                               // the ribs

  // fireflies drifting over the patch
  for(int i=0;i<10;i++){ float fi=float(i);
    vec2 fp=vec2((fract(h11(fi*3.)+t*.01*(h11(fi)-.5))-.5)*1.7, -.30+.25*h11(fi*7.)+.03*sin(t*.5+fi*2.));
    float b=pow(max(0.,sin(t*(.7+.4*h11(fi*5.))+fi*4.)),6.);
    col+=vec3(.9,1.,.4)*b*(exp(-length(uv-fp)/(px*1.6))*.9+exp(-length(uv-fp)*120.)*.15); }

  col=litUp(col);
  gl_FragColor=vec4(finish(col*1.05,uv),1.);

// ---------- 55. 🦇 BAT CAVE MOUTH: a huge swirling river of bats pouring out of a desert cave at sunset ----------
const BATCAVE = `
const vec2 SUNB=vec2(.50,.015);
const vec2 CAVE=vec2(-.30,-.17);
// the path the bat river follows: up out of the cave in a slow swirl, then away to the upper right
vec2 batPath(float s, float t){
  return CAVE+vec2(.03*sin(s*9.-t*.6)*(1.-s)+.95*s*s, .03+.62*s-.12*s*s);
}
float batW(float s){ return .025+.10*s; }
float batD(vec2 q, float fl){                                        // one bat seen from below, wings up or down
  float wy=.55*fl;
  float d=min(segD(q,vec2(0.,.05),vec2(.55,.15+wy*.6)), segD(q,vec2(0.,.05),vec2(-.55,.15+wy*.6)))-.20;
  d=min(d, min(segD(q,vec2(.5,.15+wy*.6),vec2(1.,wy)), segD(q,vec2(-.5,.15+wy*.6),vec2(-1.,wy)))-.11);
  d=min(d, length(q*vec2(1.7,1.))-.24);

}

  vec3 col=mix(vec3(1.5,.55,.16), vec3(.90,.32,.30), smoothstep(-.05,.14,y));
  col=mix(col, vec3(.28,.16,.36), smoothstep(.10,.32,y));

  col+=vec3(1.,.55,.2)*(.5*exp(-sd*3.)+.9*exp(-sd*12.));
  col=mix(col, vec3(2.4,1.7,.9), smoothstep(.042,.040,sd));

  col=mix(col, mix(vec3(.55,.25,.30), vec3(1.6,.75,.35), exp(-sd*2.5)), cl*.6);
  // far mesas in the haze
  float m1=-.04+.05*smoothstep(-.1,.1,sin(uv.x*2.2+1.))+.025*fbm4(vec2(uv.x*8.,1.))+.012*noise(vec2(uv.x*40.,2.));

  float m2=-.08+.03*fbm4(vec2(uv.x*3.+4.,2.));

    float dd=segD(uv,batPath(s0,t),batPath(s1,t)); if(dd<dmin){ dmin=dd; smin2=s0; } }

// ---------- 56. 🌫️ MISTY SWAMP: will-o'-wisps drifting over still black water between mossy cypress trees ----------
const SWAMP = `
const float WL=-.12;                                                 // the water line
const vec2 MSW=vec2(-.42,.30);
vec2 wispP(float i, float t){
  float a=t*(.11+.05*h11(i*3.))+i*2.3;
  return vec2(-.75+1.5*fract(h11(i*7.)+.012*t*(h11(i)-.4))+.05*sin(a*1.3), WL+.04+.07*h11(i*5.)+.025*sin(a*2.)+.01*sin(t*1.7+i));
}
// a bald cypress: a flared trunk, ragged clumps of leaves on crooked branches, and long hanging moss. returns (coverage, moss)
vec2 cypress(vec2 p, float x, float h, float seed, float px){
  float sy=(p.y-WL)/h, dx=(p.x-x)/h;
  if(sy<-.05 || sy>1.25 || abs(dx)>.75) return vec2(0.);
  vec2 q=vec2(dx,sy);
  float tx=dx-.04*sin(sy*2.6+seed);
  float tw=.020+.11*exp(-sy*7.)+.006*(noise(vec2(sy*40.,seed))-.5);
  float d=max(abs(tx)-tw, sy-.80);
  for(int k=0;k<5;k++){ float fk=float(k);
    vec2 cc=vec2((h11(seed+fk*1.7)-.5)*.95, .70+.30*h11(seed*2.3+fk));
    cc.x*=1.-.5*(cc.y-.7);
    vec2 r=vec2(.10+.08*h11(fk+seed*3.), .035+.025*h11(fk*5.+seed));
    vec2 o=vec2(.04*sin((cc.y-.2)*2.6+seed), cc.y-.18-.1*h11(fk*9.+seed));
    d=min(d, segD(q,o,cc)-.007);                                               // a crooked branch out to the clump
    float cd=length((q-cc)/r)-1.+.9*(fbm4(q*vec2(16.,26.)+seed+fk*4.)-.5);
    d=min(d, cd*r.y);
  }
  float a=cover(d*h,px);
  // Spanish moss: soft grey-green strands hanging under the branches
  float w=.011, id=floor(dx/w), fx=fract(dx/w)-.5;
  float top=.70+.10*h11(id*1.3+seed), L=.06+.24*h11(id*2.7+seed);
  float yy=(top-sy)/L;
  float mask=step(.45,noise(vec2(dx*9.,seed)))*smoothstep(.55,.35,abs(dx));
  float strand=step(0.,yy)*step(yy,1.)*smoothstep(.45*(1.-yy)+.06,.15*(1.-yy),abs(fx+.15*sin(sy*30.+id)));
  return vec2(a, strand*mask);
}
vec3 above(vec2 p, float t, float px, bool refl){
  float md=length(p-MSW);
  vec3 c=mix(vec3(.07,.10,.11), vec3(.015,.025,.04), smoothstep(-.1,.5,p.y));
  c+=vec3(.25,.35,.38)*(.25*exp(-md*3.)+.35*exp(-md*10.));
  c=mix(c, vec3(.75,.85,.82)*1.1, smoothstep(.05,.048,md)*.55);                 // the moon, blurred by mist
  // three rows of cypress trees, each farther one paler in the mist
  for(int r=0;r<3;r++){ float fr=float(r);
    float far=1.-fr/2.;
    vec3 tc=mix(vec3(.012,.018,.018), vec3(.09,.12,.13), far*.85);
    vec3 mc=mix(vec3(.05,.07,.05), vec3(.12,.15,.14), far*.85);
    for(int k=0;k<4;k++){ float fk=float(k);
      float x=(fk-1.5)*.55+(h11(fk+fr*11.)-.5)*.3+fr*.17;
      float h=mix(.42,.18,far)*(.8+.4*h11(fk*3.+fr));
      vec2 cy=cypress(p, x, h, fk*7.+fr*31., px*(1.+far*2.));
      c=mix(c, mc, cy.y*.7);
      c=mix(c, tc, cy.x);
    }

    if(!refl) c=mix(c, vec3(.12,.16,.17), fogBand(p,t+fr*40.,WL+.10-fr*.02,.10,.015+fr*.01,fr*5.)*.55);

void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;

    float dz=WL-uv.y;

    vec2 rp=vec2(uv.x+rip.x*.012*(.3+dz*3.), 2.*WL-uv.y+rip.x*.006);
    col=above(rp,t,px*1.5,true)*vec3(.55,.65,.65);

      vec2 lp=vec2((h11(fk*4.1)-.5)*1.5, WL-.06-.32*h11(fk*2.3));
      float s=.02+.05*(WL-lp.y);

      col=mix(col, vec3(.03,.06,.035)+vec3(.12,.18,.16)*.4*smoothstep(-.4,0.,q.y)*step(-.2,-pad), cover(pad*s*.45,px)); }

    vec2 wp=wispP(fi,t);
    float pulse=.75+.25*sin(t*(1.1+.3*h11(fi))+fi*3.);
    vec3 wc=mix(vec3(.45,1.,.85), vec3(.6,.85,1.), h11(fi*9.));
    float d=length(uv-wp);
    col+=wc*pulse*(exp(-d/(px*3.))*.9+exp(-d*45.)*.35+exp(-d*9.)*.06);
    // a faint trail of sparkles behind it
    for(int j=1;j<4;j++){ float fj=float(j); vec2 tp=wispP(fi,t-fj*.5);
      col+=wc*pulse*exp(-length(uv-tp)/(px*1.6))*.25/fj; }
    // its wobbly reflection
    vec2 rp=vec2(wp.x+.004*sin(uv.y*300.+t*2.), 2.*WL-wp.y);
    float rd=length((uv-rp)*vec2(1.,.35));
    col+=wc*pulse*step(uv.y,WL)*(exp(-rd*70.)*.35+exp(-rd*14.)*.05)*(.6+.4*sin(uv.y*400.+t*3.));
  }
  // low mist sliding over the water, lit a little by the wisps
  float f=fogBand(uv,t,WL+.03,.10,.02,8.);
  col=mix(col, vec3(.13,.18,.18), f*.6);
  // reeds and cattails in front
  for(int j=0;j<2;j++){ float fj=float(j); float w=.030+fj*.02;
    for(int o=-1;o<=1;o++){ float ci=floor(uv.x/w)+float(o); float r=h11(ci+fj*17.); if(r<.62) continue;
      float cx=(ci+.5)*w+(r-.5)*w*.6;
      float base=-.52, hgt=(.10+.14*h11(ci*1.7+fj))*(1.+fj*.5); float yy=(uv.y-base)/hgt;
      if(yy<0. || yy>1.12) continue;
      float xx=cx+(.25*(r-.5)+.03*sin(t*.5+ci))*hgt*yy*yy; float th=.0018*(1.+fj);
      float cat=length(vec2(uv.x-xx,(uv.y-(base+hgt*.88))*.35))-.0055*(1.+fj)*step(.75,r);
      col=mix(col, vec3(.008,.012,.012), max(smoothstep(th+px,th,abs(uv.x-xx))*step(yy,1.), cover(cat,px))); } }
  col=litUp(col);
  gl_FragColor=vec4(finish(col*1.15,uv),1.);
}
`;
