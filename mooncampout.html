<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🏕️ The Great Moon Camp-Out</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #0a1430; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  canvas {
    width: min(100vw, calc(100vh * 960 / 520));
    height: auto; display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none;
  }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// 🏕️ THE GREAT MOON CAMP-OUT — a movie for Ben (made with love)
// Robo, Dusty and the whole crew go camping at Moon Base. Nega-Robo has NEVER been camping before (his very first
// trip with friends!): he toasts marshmallows with his laser eyes, his tent gets all goopy, he zips himself into his
// sleeping bag upside down... and he COPIES King Gloop's little burp into a BURP SO BIG IT SHAKES THE WHOLE WORLD
// (💡 Ben's idea!). Low-gravity hiking, campfire songs, stargazing and a cozy goodnight.
// Narrator + character voices (speechSynthesis), subtitles, original WebAudio music.
// Tap / Space = next line. Buttons: previous / pause / next scene, chapters, subtitles, music.
// Saves where you stopped in localStorage.moonCampout. Trophy 'moonCampout' when you watch it to the end.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, GROUND = 440;
let frame = 0;

// ---------- Saves + trophy ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { ch: 0, sc: 0, ln: 0, started: false, subs: true, music: true, done: false };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('moonCampout') || 'null'); if (s && typeof s === 'object') Object.assign(save, s); } catch (_) {}
  save.ch = Math.max(0, Math.floor(+save.ch || 0)); save.sc = Math.max(0, Math.floor(+save.sc || 0)); save.ln = Math.max(0, Math.floor(+save.ln || 0));
}
function writeSave() { try { localStorage.setItem('moonCampout', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- Drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  const R = Array.isArray(r) ? r : [r, r, r, r], k = v => Math.max(0, Math.min(+v || 0, w / 2, h / 2));   // [top-left, top-right, bottom-right, bottom-left]
  const [a, b, c, d] = [k(R[0]), k(R[1]), k(R[2]), k(R[3])];
  ctx.moveTo(x + a, y); ctx.arcTo(x + w, y, x + w, y + h, b); ctx.arcTo(x + w, y + h, x, y + h, c);
  ctx.arcTo(x, y + h, x, y, d); ctx.arcTo(x, y, x + w, y, a); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
function pawPrint(x, y, r, col) {                     // a little paw print
  ellipse(x, y + r * 0.25, r * 0.55, r * 0.45, col);
  for (let i = 0; i < 4; i++) { const a = -2.4 + i * 0.53; ellipse(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.75, r * 0.22, r * 0.27, col); }
}
function starPaw(x, y, r, t, a = 1) {                 // Tiger's twinkly star paw print: golden glow + paw
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  glow(x, y, r * 3, 'rgba(255,214,90,.75)', 0.7 + Math.sin(t * 0.08 + x) * 0.2);
  pawPrint(x, y, r, '#ffe27a');
  twinkle(x + r * 0.9, y - r * 0.9, r * 0.5 * (0.7 + 0.3 * Math.sin(t * 0.15 + y)), 1);
  ctx.restore();
}
function wrapLines(str, maxW, size) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  const words = String(str).split(' '), out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
// seeded random for scenery that stays put
function rng(seed) { let v = (seed >>> 0) || 1; return () => { v = (v * 1664525 + 1013904223) >>> 0; return v / 4294967296; }; }
const STARS = (() => { const r = rng(7), a = []; for (let i = 0; i < 140; i++) a.push([r() * W, r() * 330, 0.6 + r() * 1.8, r() * 6]); return a; })();
function starField(t, a = 1, drift = 0) {
  for (const [x, y, s, p] of STARS) {
    const xx = ((x - drift * 0.05) % W + W) % W;
    circle(xx, y, s, `rgba(255,255,240,${clamp(a * (0.55 + 0.45 * Math.sin(t * 0.04 + p)), 0, 1)})`);
  }
}

// =====================================================================
// 🎵 SOUND + MUSIC ENGINE (voices borrowed from Rocky's Outdoor Fun: lead with vibrato + echo, pads, bass, plucks, drums)
// =====================================================================
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? MUSIC_VOL : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  }
}
function wakeAudio() {
  try {
    if (!actx) { const A = window.AudioContext || window.webkitAudioContext; if (!A) return; actx = new A(); setupAudio(); }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
  } catch (_) { actx = null; }
}
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx || !sfxBus) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus);
  o.start(t); o.stop(t + dur + 0.02);
}
function whooshNoise(start, dur, from, to, vol) {
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime + start, s = actx.createBufferSource(); s.buffer = noiseBuf;
  const f = actx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 1.4; f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + dur * 0.4); g.gain.linearRampToValueAtTime(0, t + dur);
  s.connect(f); f.connect(g); g.connect(sfxBus); s.start(t); s.stop(t + dur + 0.05);
}
const SFX = {
  meow:    () => { note(700, 0, 0.12, 'sine', 0.1, 1000); note(1000, 0.12, 0.25, 'sine', 0.09, 620); },
  mew:     () => { note(1300, 0, 0.1, 'sine', 0.07, 1700); note(1600, 0.1, 0.18, 'sine', 0.06, 1000); },
  purr:    () => { for (let i = 0; i < 8; i++) note(55 + (i % 2) * 6, i * 0.11, 0.1, 'sawtooth', 0.035); },
  twinkle: () => [1319, 1568, 1976, 2637].forEach((f, i) => note(f, i * 0.07, 0.35, 'sine', 0.06)),
  chime:   () => [784, 988, 1175, 1568, 1976].forEach((f, i) => note(f, i * 0.09, 0.6, 'sine', 0.07)),
  boing:   () => note(260, 0, 0.3, 'sine', 0.14, 700),
  pop:     () => { note(900, 0, 0.08, 'sine', 0.12, 1600); },
  giggle:  () => [988, 1175, 988, 1175, 1319].forEach((f, i) => note(f, i * 0.08, 0.07, 'triangle', 0.07)),
  grumble: () => { note(160, 0, 0.35, 'sawtooth', 0.05, 120); note(140, 0.3, 0.3, 'sawtooth', 0.04, 110); },
  creak:   () => { note(300, 0, 0.4, 'sawtooth', 0.03, 220); note(260, 0.35, 0.3, 'sawtooth', 0.03, 330); },
  click:   () => note(700, 0, 0.06, 'square', 0.05),
  door:    () => { [392, 523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.1, 0.5, 'triangle', 0.08)); whooshNoise(0, 0.8, 300, 2000, 0.08); },
  whoosh:  () => whooshNoise(0, 0.35, 600, 3500, 0.2),
  hiyah:   () => { whooshNoise(0, 0.3, 500, 4000, 0.18); note(520, 0, 0.12, 'square', 0.06, 900); },
  bonk:    () => { note(220, 0, 0.18, 'square', 0.12, 90); note(1400, 0.02, 0.1, 'sine', 0.08, 2200); [1568, 1319, 1568].forEach((f, i) => note(f, 0.12 + i * 0.07, 0.1, 'triangle', 0.05)); },
  boom:    () => { note(110, 0, 0.5, 'sine', 0.2, 40); whooshNoise(0, 0.6, 2500, 200, 0.12); },

  const f = F('fire');
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; ellipse(x + Math.cos(a) * 48, y + Math.sin(a) * 12, 13, 8, i % 2 ? '#757575' : '#9e9e9e'); }
  ctx.save(); ctx.translate(x, y); ctx.fillStyle = '#6d4c41';
  for (const r of [-0.35, 0.35, 0]) { ctx.save(); ctx.rotate(r); roundRect(-40, -8, 80, 13, 6, r ? '#795548' : '#5d4037'); ctx.restore(); }
  ctx.restore();
  if (f > 0.02) {
    glow(x, y - 40, 260 * f, 'rgba(255,170,60,.55)', f);
    for (let k = 0; k < 3; k++) {
      ctx.fillStyle = ['#ff5722', '#ff9800', '#ffeb3b'][k]; ctx.beginPath(); const w = (34 - k * 10) * f, hh = (95 - k * 25) * f;
      ctx.moveTo(x - w, y - 4);
      for (let i = 0; i <= 6; i++) { const u = i / 6; ctx.lineTo(x - w + u * 2 * w, y - 4 - Math.sin(u * Math.PI) * hh * (0.75 + 0.25 * Math.sin(t * 0.3 + i * 2 + k))); }
      ctx.closePath(); ctx.fill();
    }
    for (let i = 0; i < 6; i++) { const u = ((t * 0.012 + i / 6) % 1); ctx.save(); ctx.globalAlpha = (1 - u) * f; circle(x + Math.sin(t * 0.05 + i * 2) * 26, y - 60 - u * 160, 2.5, '#ffcc80'); ctx.restore(); }
  }
}

// =====================================================================
// 🏠 TITLE · 📖 CHAPTERS · 🤖 MEET THE CAST · 💙 THE END

let menuSel = 0, cardHop = {};
const canResume = () => save.started && (save.ch > 0 || save.sc > 0);
function playFrom(ch, sc) { wakeAudio(); PLAY.paused = false; if (actx && actx.resume) try { actx.resume(); } catch (_) {} startScene(ch, sc, sc === 0); }
function openMenu() { stopSpeech(); PLAY.phase = 'idle'; PLAY.paused = false; mode = 'menu'; menuSel = PLAY.ch || 0; setSong('camp'); }
function goTitle() { stopSpeech(); PLAY.phase = 'idle'; PLAY.paused = false; mode = 'title'; setSong('camp'); }
function topToggles() {

}
function titleScene(big) {                             // Crater Camp at night, the campfire, and the friends around it

const CARDS = [
  ['robo', 'Robo', "Hangs a tiny lantern on his antenna as a nightlight.", "Who wants s'mores?"],
  ['dusty', 'Dusty', "Taught everybody to toast marshmallows slowly.", "Round and round!"],
  ['nega', 'Nega-Robo', "His first camping trip ever! He made a world-shaking burp.", "Excuse me!"],
  ['gloop', 'King Gloop', "Bonked his crown on a moon-rock arch. Twice ouch!", "Ouch, my crown!"],

  ['pink', 'Pink Robo', "The very first girl Robo. Her tent has hearts!", "Heart marshmallows!"],

  });

// =====================================================================
// 👆 INPUT (tap / click; touchpad.js turns iPad touches on the canvas into mouse events) + ⌨️ keys
// =====================================================================
function toCanvas(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / (r.width || W), y: (e.clientY - r.top) * H / (r.height || H) }; }
function onTap(x, y) {
  wakeAudio();
  for (let i = BTNS.length - 1; i >= 0; i--) { const b = BTNS[i]; if (x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) { sfx('click'); b.fn(); return; } }
  if (mode === 'play') skipLine();
  else if (mode === 'title' && y > 360) playFrom(canResume() ? save.ch : 0, canResume() ? save.sc : 0);
}
C.addEventListener('mousedown', e => { const p = toCanvas(e); onTap(p.x, p.y); if (e.preventDefault) e.preventDefault(); });
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k.indexOf('Arrow') === 0) { if (e.preventDefault) e.preventDefault(); }
  if (e.repeat) return;
  wakeAudio();
  if (mode === 'play') {
    if (k === ' ') skipLine();
    else if (k === 'Enter') togglePause();
    else if (k === 'ArrowRight') goNextScene();
    else if (k === 'ArrowLeft') goPrevScene();
    else if (k === 'Escape') openMenu();
  } else if (mode === 'title') {
    if (k === ' ' || k === 'Enter') playFrom(canResume() ? save.ch : 0, canResume() ? save.sc : 0);
    else if (k === 'ArrowRight') mode = 'cast';
    else if (k === 'ArrowLeft' || k === 'ArrowDown') { mode = 'menu'; menuSel = save.ch || 0; }
  } else if (mode === 'menu') {
    if (k === 'ArrowRight') menuSel = (menuSel + 1) % CHAPTERS.length;
    else if (k === 'ArrowLeft') menuSel = (menuSel + CHAPTERS.length - 1) % CHAPTERS.length;
    else if (k === 'ArrowDown') menuSel = Math.min(CHAPTERS.length - 1, menuSel + Math.ceil(CHAPTERS.length / 2));
    else if (k === 'ArrowUp') menuSel = Math.max(0, menuSel - Math.ceil(CHAPTERS.length / 2));
    else if (k === ' ' || k === 'Enter') playFrom(menuSel, 0);
    else if (k === 'Escape') goTitle();
  } else if (mode === 'cast') {
    if (k === ' ') { const c = CARDS[Math.floor(frame / 60) % CARDS.length]; cardHop[c[0]] = frame; speak(c[0], c[3]); }
    else if (k === 'Escape' || k === 'Enter') goTitle();
  } else if (mode === 'end') {
    if (k === ' ' || k === 'Enter') playFrom(0, 0);
    else if (k === 'Escape') goTitle();
  }
});

// =====================================================================
// 🔁 MAIN LOOP (fixed 60 steps a second)
// =====================================================================
let lastT = 0, acc = 0;
function render() {
  BTNS = [];
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (mode === 'play') renderPlay();
  else if (mode === 'menu') renderMenu();
  else if (mode === 'cast') renderCast();
  else if (mode === 'end') renderEnd();
  else renderTitle();
}
function step(dt) {
  if (mode === 'play') updatePlay(dt);
  else { frame++; beatClock++; updateFx(dt); }
}
function loop(ts) {
  if (!lastT) lastT = ts;
  acc = Math.min(0.25, acc + (ts - lastT) / 1000); lastT = ts;
  while (acc >= 1 / 60) { step(1 / 60); acc -= 1 / 60; }
  musicTick();
  render();
  requestAnimationFrame(loop);
}
setSong('camp');
requestAnimationFrame(loop);
