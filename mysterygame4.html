// ---------- 🔈 SOFT sounds (master volume 0.13, fades in; starts on the first tap or key) ----------
let actx = null, master = null, musicBus = null, musicOn = true;
function audio() {

      master.gain.linearRampToValueAtTime(0.13, actx.currentTime + 1.5); master.connect(actx.destination);

const SFX = {
  tap() { bleep(660, 0.08, 0.04); },
  good() { bleep(784, 0.1, 0.05); bleep(1047, 0.12, 0.04, 0.07); },
  bonus() { [784, 988, 1175, 1568].forEach((f, i) => bleep(f, 0.12, 0.04, i * 0.06)); },
  oops() { bleep(330, 0.28, 0.05, 0, 'triangle', -120); },
  pop() { bleep(700, 0.07, 0.045, 0, 'sine', 500); },
  dig() { bleep(170, 0.08, 0.05, 0, 'triangle', -50); },
  start() { [392, 523, 659].forEach((f, i) => bleep(f, 0.14, 0.045, i * 0.1)); },
  level() { [523, 659, 784, 1047].forEach((f, i) => bleep(f, 0.16, 0.045, i * 0.1)); },
  win() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => bleep(f, 0.18, 0.045, i * 0.12)); },

// 🎵 a short catchy loop: TUNE = { bpm, wave, chords: 4 chords (midi), mel: 32 eighth notes (midi, 0 = rest) on the chord tones }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let nextNote = 0, step = 0;
function musicTick() {
  if (!actx || actx.state !== 'running' || !musicOn) return;
  const now = actx.currentTime, e = 60 / TUNE.bpm / 2;
  if (nextNote < now) nextNote = now + 0.05;           // never pile up old notes
  while (nextNote < now + 0.25) {

    if (m) tone(mtof(m), nextNote, e * 1.7, 0.05, TUNE.wave || 'triangle', 0, musicBus);
    if (step % 4 === 0) tone(mtof(ch[0] - 12), nextNote, e * 3.5, 0.06, 'sine', 0, musicBus);
    if (step % 4 === 2) tone(mtof(ch[1]), nextNote, e * 1.5, 0.02, 'sine', 0, musicBus);

setInterval(musicTick, 50);

  musicOn = !musicOn; audio();

const TUNE = { bpm: 116, wave: 'triangle',

  { name: 'Sandy Beach', tip: 'Sand falls when you dig under it! Find 5 bones.', bones: 5, rocks: 7, sand: 16, peek: 0 },
  { name: 'Dino Dig', tip: 'Dig up 6 dino bones to build a dinosaur!', bones: 6, rocks: 14, sand: 12, peek: 1, dino: 1 },

const GAME = {

  update(L) {

GAME.reset(LEVELS[0]);
// 🐶 SPARKS (he): the comic-book look from sparks.html (long yellow robot dog, purple head-top/ears/back/tail, big window with Charlie & August), via arcaderoom.html

const DIG_PAL = {

  if (c.k === 'empty') { ctx.fillStyle = P.hole; ctx.fillRect(px, py, CELL, CELL); return; }
  ctx.fillStyle = P.dirt; ctx.fillRect(px, py, CELL, CELL);
  for (let i = 0; i < 4; i++) circle(px + ((x * 37 + y * 23 + i * 17) % 50) + 5, py + ((x * 13 + y * 41 + i * 29) % 50) + 5, 3, P.dot);
  if (L.dino && y % 2) { ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fillRect(px, py + 20, CELL, 10); }
  if (c.bone) {
    if (L.peek) drawBone(px + 30, py + 32, 0.9, L.dino, 0.55);
    else if ((frame + x * 31 + y * 17) % 90 < 30) twinkle(px + 30, py + 30, 10, 1 - ((frame + x * 31 + y * 17) % 90) / 30, '#fffde7');
  }
  if (c.k === 'rock') {
    ctx.fillStyle = P.dirt; ctx.fillRect(px, py, CELL, CELL);
    ellipse(px + 30, py + 32, 27, 24, P.rock); ellipse(px + 22, py + 22, 10, 6, 'rgba(255,255,255,.3)', -0.4);
    circle(px + 38, py + 40, 4, 'rgba(0,0,0,.15)'); circle(px + 20, py + 42, 3, 'rgba(0,0,0,.15)');
  } else if (c.k === 'sand') {
    const sh = c.wob > 0 && !c.fall ? Math.sin(frame * 0.9) * 3 : 0;
    ctx.fillStyle = P.hole; ctx.fillRect(px, py, CELL, CELL);
    roundRect(px + 2 + sh, py + 2, CELL - 4, CELL - 4, 10, P.sand);
    for (let i = 0; i < 6; i++) circle(px + sh + 10 + (i * 19) % 40, py + 12 + (i * 23) % 38, 2.5, 'rgba(180,140,60,.45)');
    if (c.wob > 0 && !c.fall) text('!', px + 30, py + 42, 34, '#ff7043');
  }
}
function drawDigWorld(L, title) {
  const P = DIG_PAL[L.name];
  sky(P.sky[0], P.sky[1]);
  if (L.name === 'Backyard') {
    for (let i = 0; i < 3; i++) cloud(((i * 340 + frame * 0.3) % (W + 200)) - 100, 40 + i * 12, 0.6);
    ctx.fillStyle = '#fff8e1'; for (let x = 0; x < W; x += 30) { ctx.fillRect(x + 6, 72, 16, 48); ctx.beginPath(); ctx.moveTo(x + 6, 72); ctx.lineTo(x + 14, 62); ctx.lineTo(x + 22, 72); ctx.fill(); }
    ctx.fillRect(0, 86, W, 6);
    roundRect(830, 66, 90, 54, 4, '#e53935'); ctx.fillStyle = '#8e24aa'; ctx.beginPath(); ctx.moveTo(820, 70); ctx.lineTo(875, 36); ctx.lineTo(930, 70); ctx.fill();
    roundRect(860, 86, 30, 34, [15, 15, 0, 0], '#3e2723'); text('SPARKS', 875, 82, 12, '#fff');
  } else if (L.name === 'Sandy Beach') {
    ctx.fillStyle = '#29b6f6'; ctx.fillRect(0, 84, W, 20);
    ctx.strokeStyle = '#e1f5fe'; ctx.lineWidth = 3; ctx.beginPath(); for (let x = 0; x <= W; x += 20) ctx.lineTo(x, 86 + Math.sin(x * 0.05 + frame * 0.05) * 3); ctx.stroke();
    circle(860, 46, 26, '#fff59d');
    ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(760, 120); ctx.lineTo(760, 66); ctx.stroke();
    ctx.fillStyle = '#ff5252'; ctx.beginPath(); ctx.arc(760, 70, 46, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#fff'; for (const a of [-2.6, -1.57, -0.55]) { ctx.beginPath(); ctx.moveTo(760, 70); ctx.arc(760, 70, 46, a - 0.25, a + 0.25); ctx.fill(); }
  } else {
    ctx.fillStyle = '#e0955a'; ctx.beginPath(); ctx.moveTo(380, 120); ctx.lineTo(420, 64); ctx.lineTo(520, 64); ctx.lineTo(560, 120); ctx.fill();
    ctx.fillStyle = '#43a047'; roundRect(860, 62, 16, 58, 8, '#43a047'); roundRect(844, 78, 10, 24, 5, '#43a047'); roundRect(844, 96, 18, 8, 4, '#43a047'); roundRect(882, 70, 10, 22, 5, '#43a047');
    roundRect(700, 74, 120, 34, 6, '#795548'); text('DINO DIG', 760, 99, 18, '#ffe0b2');
  }
  ctx.fillStyle = P.grass; ctx.fillRect(0, TOP - 8, W, 8);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) drawCell(x, y, grid[y][x], P, L);
  ctx.fillStyle = '#3e2723'; ctx.fillRect(0, TOP + ROWS * CELL, W, H);
}
function drawDinoProgress(n, total, x = 590, y = 58, s = 0.75) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineCap = 'round';
  roundRect(-90, -50, 180, 96, 16, 'rgba(62,39,35,.55)');
  const parts = [
    () => { ctx.beginPath(); ctx.ellipse(58, -24, 14, 9, 0.2, 0, 7); ctx.stroke(); },
    () => { ctx.beginPath(); ctx.moveTo(36, -2); ctx.quadraticCurveTo(46, -10, 50, -20); ctx.stroke(); },
    () => { ctx.beginPath(); ctx.ellipse(8, 2, 30, 14, 0, Math.PI, 0); ctx.stroke(); for (let i = -2; i <= 2; i++) { ctx.beginPath(); ctx.moveTo(8 + i * 10, -8); ctx.lineTo(8 + i * 10, 10); ctx.stroke(); } },
    () => { ctx.beginPath(); ctx.moveTo(-22, 2); ctx.quadraticCurveTo(-50, 0, -72, -16); ctx.stroke(); },
    () => { ctx.beginPath(); ctx.moveTo(26, 6); ctx.lineTo(28, 34); ctx.lineTo(36, 34); ctx.stroke(); },
    () => { ctx.beginPath(); ctx.moveTo(-10, 6); ctx.lineTo(-12, 34); ctx.lineTo(-4, 34); ctx.stroke(); },
  ];
  parts.forEach((p, i) => {
    const on = i < Math.round(n / total * parts.length);
    ctx.strokeStyle = on ? '#fff8e1' : 'rgba(255,255,255,.25)'; ctx.lineWidth = on ? 6 : 4; ctx.setLineDash(on ? [] : [5, 6]); p();
  });
  ctx.setLineDash([]);
  if (n >= total) { circle(62, -26, 3, '#3e2723'); }
  ctx.restore();
}
// ---------- ✨ sparkles, pop-up words and confetti ----------
let parts = [], confetti = [];
function burst(x, y, cols, n = 12, sp = 4) { for (let i = 0; i < n; i++) { const a = Math.random() * 7, v = rand(1, sp); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1, life: rand(25, 45), max: 45, r: rand(3, 6), col: pick(cols) }); } }
function popText(x, y, str, col = '#fff') { parts.push({ x, y, vx: 0, vy: -1.2, life: 55, max: 55, str, col }); }
function makeConfetti(n = 160) { for (let i = 0; i < n; i++) confetti.push({ x: rand(0, W), y: rand(-H, 0), vx: rand(-1, 1), vy: rand(1.5, 3.5), a: rand(0, 7), va: rand(-0.2, 0.2), col: pick(['#ff5c8a', '#ffd740', '#69f0ae', '#40c4ff', '#b388ff', '#ff9e40']) }); }
function updateParts() {
  for (const p of parts) { p.x += p.vx; p.y += p.vy; if (!p.str) p.vy += 0.12; p.life--; }
  parts = parts.filter(p => p.life > 0);
  for (const c of confetti) { c.x += c.vx + Math.sin(frame * 0.05 + c.a) * 0.6; c.y += c.vy; c.a += c.va; if (c.y > H + 20) { c.y = -10; c.x = rand(0, W); } }
}
function drawParts() {
  for (const p of parts) {
    ctx.save(); ctx.globalAlpha = clamp(p.life / 25, 0, 1);
    if (p.str) text(p.str, p.x, p.y, 26, p.col); else circle(p.x, p.y, p.r, p.col);
    ctx.restore();
  }
}
function drawConfetti() { for (const c of confetti) { ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.a); ctx.fillStyle = c.col; ctx.fillRect(-6, -3, 12, 6); ctx.restore(); } }

// ---------- 🎮 keys, taps and the game flow ----------
const keys = {};
const pointer = { x: W / 2, y: H / 2, down: false };
const MUSIC_BTN = { x: W - 64, y: H - 60, w: 52, h: 48 };
let state = 'title', level = 0, lives = 3, timer = 0, hurtFlash = 0;
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function toCanvas(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  audio(); keys[k] = true;
  if (e.repeat) return;
  if (k === 'm' || k === 'M') { toggleMusic(); return; }
  if (state === 'play') { if (GAME.key) GAME.key(k); }
  else if (k === 'Enter' || k === ' ') press();
});
addEventListener('keyup', e => { keys[e.key] = false; });
C.addEventListener('mousedown', e => {
  audio(); const p = toCanvas(e); pointer.x = p.x; pointer.y = p.y; pointer.down = true;
  if (inBox(p, MUSIC_BTN)) { toggleMusic(); return; }
  if (state === 'play') { if (GAME.tap) GAME.tap(p.x, p.y); } else press();
});
addEventListener('mousemove', e => { const p = toCanvas(e); pointer.x = p.x; pointer.y = p.y; });
addEventListener('mouseup', () => { pointer.down = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.down = false; });
function press() {
  if (state === 'title') { SFX.start(); level = 0; startLevel(); }
  else if (state === 'intro' && timer > 25) state = 'play';
  else if (state === 'levelDone' && timer > 45) { level++; startLevel(); }
  else if (state === 'fail' && timer > 40) startLevel();
  else if (state === 'win' && timer > 120) { state = 'title'; timer = 0; confetti = []; }
}
function startLevel() { state = 'intro'; timer = 0; lives = GAME.lives; parts = []; hurtFlash = 0; GAME.reset(LEVELS[level]); }
function levelWon() {
  if (level >= LEVELS.length - 1) { state = 'win'; timer = 0; makeConfetti(); SFX.win(); trophy(GAME.id); }
  else { state = 'levelDone'; timer = 0; SFX.level(); burst(W / 2, H / 2, ['#ffd740', '#69f0ae', '#ff80ab'], 30, 6); }
}
function loseLife() {                                  // forgiving: a little "oops", and the level restarts only when all hearts are gone
  lives--; hurtFlash = 30; SFX.oops();
  if (lives <= 0) { state = 'fail'; timer = 0; }
}

// ---------- 🖼️ screens ----------
function panel(x, y, w, h, col = 'rgba(20,16,50,.78)') { roundRect(x, y, w, h, 24, col); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4; rrect(x, y, w, h, 24); ctx.stroke(); }
function drawHUD() {
  const L = LEVELS[level];
  text(`Level ${level + 1}: ${L.name}`, 20, 42, 28, '#fff', 'left');
  if (GAME.hud) text(GAME.hud(L), 20, 78, 24, '#ffe57f', 'left');
  for (let i = 0; i < GAME.lives; i++) heart(W - 36 - i * 40, 34, 17, i < lives ? '#ff4f81' : 'rgba(255,255,255,.3)');
}
function drawMusicBtn() { roundRect(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.w, MUSIC_BTN.h, 14, 'rgba(0,0,0,.35)'); emoji(musicOn ? '🎵' : '🔇', MUSIC_BTN.x + 26, MUSIC_BTN.y + 25, 26); }
function drawTitle() {
  GAME.draw(LEVELS[0], true);
  ctx.fillStyle = 'rgba(10,8,30,.35)'; ctx.fillRect(0, 0, W, H);
  panel(130, 22, 700, 496);
  text(`❓ Mystery Game ${GAME.num}`, W / 2, 72, 30, '#ffd740');
  const bob = Math.sin(frame * 0.06) * 4;
  text(GAME.name, W / 2, 128 + bob, 50, GAME.color || '#7df9ff');
  GAME.titleArt();
  GAME.instr.forEach((s, i) => text(s, W / 2, 380 + i * 34, 23, '#fff'));
  if (Math.floor(frame / 30) % 2 === 0) text('Tap, press SPACE or START to play!', W / 2, 496, 26, '#69f0ae');
}
function drawOverlays() {
  const L = LEVELS[level];
  if (state === 'intro') {
    const s = Math.min(1, timer / 15);
    ctx.save(); ctx.globalAlpha = s; panel(W / 2 - 300, 170, 600, 190);
    text(`Level ${level + 1}`, W / 2, 228, 34, '#ffd740'); text(L.name, W / 2, 284, 52, '#fff'); text(L.tip, W / 2, 334, 24, '#b9f6ca');
    ctx.restore();
  } else if (state === 'levelDone') {
    panel(W / 2 - 300, 170, 600, 200);
    text(pick2(['Great job! ⭐', 'Super! 🌟', 'Hooray! 🎉'], level), W / 2, 240, 56, '#ffd740');
    text(`You beat ${L.name}!`, W / 2, 292, 30);
    if (timer > 45) text('Tap or press SPACE for the next level', W / 2, 342, 24, '#69f0ae');
  } else if (state === 'fail') {
    panel(W / 2 - 300, 170, 600, 200);
    text('Oops! 💛', W / 2, 240, 56, '#ffd740'); text("That's OK! Let's try this level again.", W / 2, 292, 28);
    if (timer > 40) text('Tap or press SPACE to try again', W / 2, 342, 24, '#69f0ae');
  } else if (state === 'win') {
    ctx.fillStyle = 'rgba(10,8,30,.45)'; ctx.fillRect(0, 0, W, H);
    panel(W / 2 - 330, 90, 660, 360, 'rgba(20,16,50,.93)'); drawConfetti();
    text('YOU DID IT! 🏆', W / 2, 168, 64, '#ffd740'); text(`You beat all 3 levels of ${GAME.name}!`, W / 2, 222, GAME.name.length > 20 ? 21 : 26);
    if (GAME.winArt) GAME.winArt();
    text('🏆 You won a new trophy for the Trophy Room!', W / 2, 404, 24, '#69f0ae');
    if (timer > 120) text('Tap to play again', W / 2, 436, 20, '#fff');
  }
}
const pick2 = (arr, i) => arr[i % arr.length];
function update() {
  frame++; timer++;
  if (state === 'intro' && timer > 110) state = 'play';
  if (state === 'play') GAME.update(LEVELS[level]);
  else if (GAME.idle) GAME.idle(LEVELS[level]);
  if (hurtFlash > 0) hurtFlash--;
  updateParts();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'title') drawTitle();
  else {
    GAME.draw(LEVELS[level], false); drawParts();
    if (hurtFlash > 0) { ctx.fillStyle = `rgba(255,120,150,${hurtFlash / 120})`; ctx.fillRect(0, 0, W, H); }
    drawHUD(); drawOverlays();
  }
  drawMusicBtn();
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
