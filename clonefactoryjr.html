<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clone Factory Jr.</title>
<script>TOUCHPAD = { dpad: true, south: [' ', 'JUMP'], east: ['x', 'ZAP'] };</script>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; }
  body {
    margin: 0; background: #0b1440; display: flex;
    align-items: center; justify-content: center; overflow: hidden;
  }
  canvas {
    width: min(100vw, calc(100vh * 960 / 520));
    height: auto; display: block; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.6);
  }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// ===== CLONE FACTORY JR.: the EASY Clone Factory (Ben's idea: an easy Clone Factory for his brother!) =====
// No hearts, no losing: bumps are just happy bounces, pits pop Robo back on the edge, the boss is a big friendly Mecha Robo.
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }   // for the Trophy Room in the Game Factory book
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book
let stickerNew = 0;

// ---------- Saved progress (localStorage.cloneFactoryJr) ----------
const NUM_LEVELS = 5, BOSS = 4, LAST = NUM_LEVELS - 1;
let unlocked = 1, everWon = false, totalArmy = 0, autoWalk = true;
try {
  const s = JSON.parse(localStorage.getItem('cloneFactoryJr') || '{}') || {};
  everWon = !!s.won; totalArmy = Math.max(0, s.army || 0);
  unlocked = Math.max(1, Math.min(NUM_LEVELS, s.unlocked || 1));
  if (s.auto === false) autoWalk = false;
  if (everWon) unlocked = NUM_LEVELS;
} catch (_) {}
function saveProgress(won) {
  try {
    const s = JSON.parse(localStorage.getItem('cloneFactoryJr') || '{}') || {};
    s.unlocked = Math.max(s.unlocked || 1, unlocked); s.army = Math.max(s.army || 0, totalArmy); s.auto = autoWalk;
    if (won) s.won = true;
    localStorage.setItem('cloneFactoryJr', JSON.stringify(s));
  } catch (_) {}
}

const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, FLOOR = 440;
const GRAV = 0.6, SPEED = 3.4, JUMP = 13.2, MAXFALL = 12;
const RS = 1.3, CS = 1.25;                                  // Robo and the clones are drawn a bit BIGGER than in Clone Factory

function hex(c) { const n = parseInt(c.slice(1), 16); return [n >> 16, (n >> 8) & 255, n & 255]; }
function mix(a, b, t) {
  const A = hex(a), B = hex(b), k = Math.max(0, Math.min(1, t));
  return `rgb(${Math.round(A[0] + (B[0] - A[0]) * k)},${Math.round(A[1] + (B[1] - A[1]) * k)},${Math.round(A[2] + (B[2] - A[2]) * k)})`;
}
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------- Sound (soft and gentle: no booms, no blasts) ----------
let actx = null, woke = false;
function wake() { woke = true; if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } }
function note(freq, start, dur, wave = 'triangle', vol = 0.08, slideTo = null) {
  if (!actx) return;
  vol = Math.min(0.09, vol * 0.7);
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump:   () => note(380, 0, 0.16, 'sine', 0.1, 720),
  beam:   () => { note(1200, 0, 0.12, 'sine', 0.06, 1700); note(1600, 0.05, 0.1, 'triangle', 0.04); },
  good:   () => [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.07, 0.18, 'triangle', 0.1)),
  boing:  () => note(260, 0, 0.28, 'sine', 0.12, 620),
  star:   () => { note(1320, 0, 0.1, 'sine', 0.08); note(1760, 0.07, 0.14, 'sine', 0.08); },
  pop:    () => note(900, 0, 0.12, 'sine', 0.08, 500),
  tick:   () => note(700, 0, 0.06, 'triangle', 0.06, 900),
  bridge: () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.08, 0.2, 'sine', 0.09)),
  door:   () => [392, 523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.09, 0.22, 'triangle', 0.09)),
  giggle: () => [880, 990, 880, 1100].forEach((f, i) => note(f, i * 0.07, 0.08, 'sine', 0.08)),
  land:   () => note(140, 0, 0.18, 'sine', 0.1, 90),
  glow:   () => [660, 880, 660, 880].forEach((f, i) => note(f, i * 0.12, 0.1, 'sine', 0.06)),
  win:    () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.13, 0.24, 'triangle', 0.1)),
};

// ---------- Music: the same bouncy "Clone Factory" tune, a little softer ----------
let musicOn = true, nextNoteTime = 0, step = 0;
const BPM = 128;
const MELODY = [
  72, 0, 76, 0, 79, 0, 76, 0, 77, 0, 74, 0, 71, 0, 67, 0,
  72, 0, 76, 79, 84, 0, 79, 0, 81, 79, 77, 76, 74, 0, 0, 0,
  69, 0, 72, 0, 77, 0, 72, 0, 76, 0, 79, 0, 84, 0, 79, 0,
  77, 76, 74, 72, 71, 0, 74, 0, 72, 0, 67, 0, 72, 0, 0, 0,
];
const BASS = [48, 43, 48, 43, 41, 48, 43, 48].flatMap(r => [r, 0, r + 12, 0, r + 7, 0, r + 12, 0]);
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function playMusic() {
  if (!actx || !musicOn) return;
  const stepDur = 60 / BPM / 2, shift = state === 'win' ? 5 : 0;
  if (nextNoteTime < actx.currentTime) nextNoteTime = actx.currentTime + 0.05;
  while (nextNoteTime < actx.currentTime + 0.2) {
    const t = nextNoteTime - actx.currentTime;
    const m = MELODY[step % MELODY.length], b = BASS[step % BASS.length];
    if (m) note(midi(m + shift), t, stepDur * 0.85, 'square', 0.035);
    if (b) note(midi(b + shift), t, stepDur * 0.9, 'triangle', 0.08);
    if (step % 4 === 0) note(2400, t, 0.03, 'sine', 0.012);
    nextNoteTime += stepDur; step++;
  }
}

// ---------- A friendly voice reads the short instructions out loud ----------
let lastSaid = '', sayT = 0;
function speak(str) {
  if (!woke || !str) return;
  try {
    const s = window.speechSynthesis; if (!s || !window.SpeechSynthesisUtterance) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(str); u.rate = 0.9; u.pitch = 1.15;
    s.speak(u); lastSaid = str; sayT = 0;
  } catch (_) {}
}
const PRAISE = ['Great job!', 'Yay!', 'Super!', 'Wow!', 'Awesome!', 'You did it!', 'Hooray!', 'Nice zap!'];
const praiseWord = () => PRAISE[Math.floor(Math.random() * PRAISE.length)];

// ---------- Input: arrows / SPACE = jump / X = zap / Enter / Escape, plus big taps ----------
const keys = { left: false, right: false, jump: false, fire: false };
let jumpPressed = false, okPressed = false, firePressed = false;
addEventListener('keydown', e => {
  wake();
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (!keys.left && state === 'map') moveSel(-1); keys.left = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (!keys.right && state === 'map') moveSel(1); keys.right = true; }
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') {
    if (!keys.jump) jumpPressed = true;
    keys.jump = true; if (e.preventDefault) e.preventDefault();
  }
  if (k === 'ArrowDown' && e.preventDefault) e.preventDefault();
  if (k === 'x' || k === 'X' || k === 'z' || k === 'Z' || k === 'f' || k === 'F') { if (!keys.fire) firePressed = true; keys.fire = true; }
  if ((k === ' ' || k === 'Enter' || k === 'x' || k === 'X') && !e.repeat) okPressed = true;
  if (k === 't' || k === 'T') toggleAuto();
  if (state === 'map' && k >= '1' && k <= '5') { mapSel = +k - 1; tryStart(mapSel); }
  if (k === 'm' || k === 'M') musicOn = !musicOn;
  if (k === 'Escape') goBack();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
  if (k === 'x' || k === 'X' || k === 'z' || k === 'Z' || k === 'f' || k === 'F') keys.fire = false;
});
const PLAY_BTN = { x: W / 2 - 170, y: 318, w: 340, h: 86 };
const BACK_BTN = { x: 14, y: 12, w: 110, h: 60 };
const AUTO_BTN = { x: 10, y: 10, w: 270, h: 60 };
const HOME_BTN = { x: 290, y: 10, w: 66, h: 60 };
const NEXT_BTN = { x: W / 2 - 150, y: 318, w: 300, h: 82 };
const NODES = [{ x: 120, y: 250 }, { x: 300, y: 300 }, { x: 480, y: 250 }, { x: 660, y: 300 }, { x: 850, y: 260 }];
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function toggleAuto() { autoWalk = !autoWalk; sfx.tick(); saveProgress(); if (state === 'play') speak(autoWalk ? 'Auto walk on!' : 'Auto walk off!'); }
C.addEventListener('mousedown', e => {                 // taps: big buttons on the menus; in the game a tap = JUMP + ZAP
  wake();
  const r = C.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (state === 'title') { okPressed = true; return; }
  if (state === 'map') {
    if (inBox(BACK_BTN, x, y)) { goBack(); return; }
    for (let i = 0; i < NUM_LEVELS; i++) if (Math.hypot(x - NODES[i].x, y - NODES[i].y) < 66) { mapSel = i; tryStart(i); return; }
    return;
  }
  if (state === 'play') {
    if (inBox(AUTO_BTN, x, y)) { toggleAuto(); return; }
    if (inBox(HOME_BTN, x, y)) { goBack(); return; }
    jumpPressed = true; firePressed = true; return;
  }
  if (state === 'levelDone' || state === 'win') okPressed = true;
});

// ---------- Levels: short and flat, tiny gaps, slow clones ----------
//  fl = the floor ('_' ground, ' ' a tiny gap)      hi = big chunky ledges ('=' ledge, '*' ledge with a star on top)
//  lo = things on the floor:  P start   D exit door   * star   clones: g gray  b bouncy  r round  i ice  j jet-pack
const LEVELS = [
  { name: 'The Clone Lab', icon: '🧪', bg: 'lab', sky: ['#1e3c72', '#7fd3ff'], top: '#00e5ff', dirt: '#2c3e70', ledge: '#cfd8dc',
    say: 'Grumpy clones! Press ZAP to make them happy!',
    fl: '____________________________________________',
    hi: '            ==*==             ==*==         ',
    lo: '  P      g        *     g          *  g   D ' },
  { name: 'The Bouncy Room', icon: '🎈', bg: 'size', sky: ['#ff9a8b', '#ffe29f'], top: '#ff6f00', dirt: '#8d4a2f', ledge: '#fff3e0',
    say: 'Bouncy clones! Zap them! Jump over the hole!',
    fl: '____________________ _________________________',
    hi: '         ==*==                  ==*==         ',
    lo: '  P    b       *          *  r         b    D ' },
  { name: 'The Freezer', icon: '❄️', bg: 'ice', sky: ['#4fc3f7', '#e1f5fe'], top: '#ffffff', dirt: '#5fa8d3', ledge: '#e1f5fe',
    say: 'Brrr! Icy clones! Zap them warm and happy!',
    fl: '________________ ________________ ________________',
    hi: '                      ==*==                       ',
    lo: '  P     i     *     i      *  i       *    i   D  ' },
  { name: 'The Sky Lab', icon: '☁️', bg: 'sky', sky: ['#64b5f6', '#fff9c4'], top: '#ffffff', dirt: '#bbdefb', ledge: '#ffffff',
    say: 'Way up high! Zap the jet pack clones!',
    fl: '______________ _______________  ____________________',
    hi: '       ==*==          ==*==           ==*==         ',
    lo: '  P   j     *    g    *    j      *   g     j    D  ' },
  { name: 'Friendly Mecha', icon: '🤖', bg: 'mecha', sky: ['#0f2027', '#2c5364'], top: '#ffd740', dirt: '#1c2b33', ledge: '#cfd8dc',
    say: 'Mecha Robo is lonely. Zap him when he glows!',
    fl: '________________________', hi: '', lo: '     P                  ' },
];
const CT = {   // clone kinds (all SLOW and only one zap each)
  g: { shape: 'robo',  s: 1, speed: 0.45, range: 70, pal: 'gray' },
  b: { shape: 'robo',  s: 1, speed: 0.4,  range: 60, pal: 'bouncy' },
  r: { shape: 'round', s: 1, speed: 0.45, range: 70, pal: 'round' },
  i: { shape: 'robo',  s: 1, speed: 0.4,  range: 70, pal: 'ice' },
  j: { shape: 'robo',  s: 1, speed: 0.5,  range: 80, pal: 'jet' },
};
const PAL = {
  gray:   { body: '#9e9e9e', belly: '#bdbdbd', visor: '#424242', eye: '#e0e0e0', ear: '#757575', feet: '#616161' },
  bouncy: { body: '#90a4ae', belly: '#b0bec5', visor: '#37474f', eye: '#e0e0e0', ear: '#607d8b', feet: '#546e7a' },
  round:  { body: '#a1a1a1', belly: '#c4c4c4', visor: '#454545', eye: '#e0e0e0', ear: '#7a7a7a', feet: '#5e5e5e' },
  ice:    { body: '#b3e5fc', belly: '#e1f5fe', visor: '#01579b', eye: '#ffffff', ear: '#4fc3f7', feet: '#0288d1' },
  jet:    { body: '#b0bec5', belly: '#cfd8dc', visor: '#263238', eye: '#ffab40', ear: '#ff7043', feet: '#546e7a' },
};
const GOOD_COLS = ['#ff80ab', '#69f0ae', '#ffd740', '#80d8ff', '#b388ff', '#ffab40', '#a7ffeb', '#f4ff81'];
const goodPal = col => ({ body: col, belly: '#ffffff', visor: '#111827', eye: '#40c4ff', ear: '#ffffff', feet: '#3d5afe' });
const THANKS = ['Thanks, Robo!', 'I feel GOOD!', 'Yay!', 'Robo Army!', 'Hooray!', 'I am happy!'];

let state = 'title', levelIndex = 0, frame = 0, mapSel = 0, doneT = 0, winT = 0, titleT = 0;
let map = [], rows = 13, cols = 24, gaps = [];
let player = null, clones = [], army = [], beams = [], parts = [], bubbles = [], pops = [], stars = [], door = null;
let camX = 0, banner = 0, bannerText = '', bannerSub = '', savedHere = 0, starsHere = 0, hintT = 0, zapHint = 0;
let boss = null, bossState = 'none', bossT = 0;

function newPlayer(x, y) { return { x, y, w: 30, h: 46, vx: 0, vy: 0, kb: 0, onGround: false, face: 1, coyote: 0, jbuf: 0, cd: 0, boing: 0, inPit: null, wait: 0, waitGap: null }; }
function makeClone(type, x) {
  const k = CT[type], w = Math.round(28 * CS), h = Math.round(36 * CS);
  return { type, x, y: FLOOR - h, w, h, vx: 0, vy: 0, dir: Math.random() < 0.5 ? -1 : 1, home: x, onGround: true, face: -1,
           good: false, flash: 0, col: '#ffffff', t: Math.floor(rnd(0, 200)), lineT: 0 };
}
function buildLevel(i) {
  const L = LEVELS[i];
  cols = Math.max(L.fl.length, L.lo.length, L.hi.length); rows = 13;
  map = []; for (let r = 0; r < rows; r++) map.push(new Array(cols).fill(r >= 11 ? '#' : ' '));
  clones = []; army = []; beams = []; parts = []; bubbles = []; pops = []; stars = []; gaps = []; door = null;
  boss = null; bossState = 'none'; bossT = 0; savedHere = 0; starsHere = 0; hintT = 0; zapHint = 0;
  for (let c = 0; c < cols; c++) if (L.fl[c] === ' ') { map[11][c] = ' '; map[12][c] = ' '; }
  for (let c = 0; c < cols; c++) if (map[11][c] === ' ' && (c === 0 || map[11][c - 1] !== ' ')) { let e = c; while (e < cols && map[11][e] === ' ') e++; gaps.push({ c0: c, c1: e - 1, falls: 0, bridge: 0 }); }
  for (let c = 0; c < L.hi.length; c++) {
    const ch = L.hi[c];
    if (ch === '=' || ch === '*') map[8][c] = '=';
    if (ch === '*') stars.push({ x: c * T + 20, y: 8 * T - 34, got: false });
  }
  let start = { x: 80, y: FLOOR - 46 };
  for (let c = 0; c < L.lo.length; c++) {
    const ch = L.lo[c];
    if (ch === 'P') start = { x: c * T + 6, y: FLOOR - 46 };
    else if (CT[ch]) clones.push(makeClone(ch, c * T + 4));
    else if (ch === '*') stars.push({ x: c * T + 20, y: FLOOR - 70, got: false });
    else if (ch === 'D') door = { x: c * T - 20, y: FLOOR - 118, w: 84, h: 118 };
  }
  player = newPlayer(start.x, start.y);
  camX = 0;
}
function startLevel(i) {
  levelIndex = i; buildLevel(i); state = 'play';
  jumpPressed = false; okPressed = false; firePressed = false; keys.fire = false;
  banner = 170; bannerText = LEVELS[i].icon + ' ' + LEVELS[i].name; bannerSub = '';
  speak(LEVELS[i].say);
  if (i === BOSS) startBoss();
}
function tryStart(i) { if (i < unlocked) { sfx.tick(); startLevel(i); } else { sfx.pop(); speak('Play the one before it first!'); } }
function moveSel(d) { mapSel = clamp(mapSel + d, 0, LAST); sfx.tick(); }
function goMap(sel) { state = 'map'; mapSel = clamp(sel == null ? mapSel : sel, 0, Math.max(0, unlocked - 1)); boss = null; bossState = 'none'; okPressed = false; jumpPressed = false; speak('Pick a level!'); }
function goBack() {
  if (state === 'play' || state === 'levelDone' || state === 'win') goMap(levelIndex);
  else if (state === 'map') { state = 'title'; okPressed = false; }
}

// ---------- Moving things around ----------
const tileAt = (c, r) => (c < 0 || c >= cols) ? '#' : (r < 0 || r >= rows) ? ' ' : map[r][c];
const isGap = x => { const c = Math.floor(x / T); return c >= 0 && c < cols && map[11][c] === ' '; };
const gapAt = x => { const c = Math.floor(x / T); return gaps.find(g => c >= g.c0 && c <= g.c1) || null; };
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const midX = o => o.x + o.w / 2;
function moveX(o) {
  o.x += o.vx; let hit = false;
  if (o.x < 0) { o.x = 0; hit = true; }
  if (o.x + o.w > cols * T) { o.x = cols * T - o.w; hit = true; }
  return hit;
}
function moveY(o) {                                         // ledges are one-way: jump up through them, land on top
  const prevBottom = o.y + o.h;
  o.vy = Math.min(o.vy, MAXFALL);
  o.y += o.vy; o.onGround = false;
  if (o.vy >= 0) {
    const r = Math.floor((o.y + o.h) / T);
    if (r < 11) {
      const c0 = Math.floor((o.x + 4) / T), c1 = Math.floor((o.x + o.w - 4) / T);
      for (let c = c0; c <= c1; c++) if (tileAt(c, r) === '=' && prevBottom <= r * T + 0.5) { o.y = r * T - o.h; o.vy = 0; o.onGround = true; break; }
    }
  }
  if (!o.onGround && o.y + o.h >= FLOOR && prevBottom <= FLOOR + 0.5 && !isGap(midX(o))) { o.y = FLOOR - o.h; o.vy = 0; o.onGround = true; }
}
function burst(x, y, colors, n = 10, sp = 4, kind = 'dot') {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: rnd(-sp, sp), vy: rnd(-sp, sp * 0.4) - 1, life: 34 + Math.random() * 26, col: colors[i % colors.length], size: 5 + Math.random() * 5, kind });
}
function confetti(n = 30) { for (let i = 0; i < n; i++) parts.push({ x: camX + rnd(0, W), y: rnd(-40, -5), vx: rnd(-1, 1), vy: rnd(1, 3), life: 200, col: GOOD_COLS[Math.floor(rnd(0, 8))], size: rnd(6, 11), kind: 'conf' }); }
function say(o, txt, t = 130, col = '#1a237e') { bubbles = bubbles.filter(b => b.o !== o); bubbles.push({ o, text: txt, t, col }); }
function pop(txt, x, y, col = '#ffeb3b', size = 40) { pops.push({ txt, x, y, col, size, t: 70 }); }   // big floating words: "Great job!"

// ---------- Robo (he can never lose!) ----------
function makeBridge(g) {
  if (g.bridge) return;
  g.bridge = 1; for (let c = g.c0; c <= g.c1; c++) { map[11][c] = 'B'; map[12][c] = 'B'; }
  sfx.bridge(); burst((g.c0 + g.c1 + 1) * T / 2, FLOOR, GOOD_COLS, 22, 5, 'star');
  pop('🌈 A bridge!', (g.c0 + g.c1 + 1) * T / 2, FLOOR - 150, '#ffffff', 40); speak('Here is a rainbow bridge!');
}
function nearestBad(x, range) {
  let best = null, bd = range;
  for (const c of clones) if (!c.good) { const d = Math.abs(midX(c) - x); if (d < bd) { bd = d; best = c; } }
  return best;
}
function autoStop(p) {                                     // auto-walk waits at holes (JUMP!) and grumpy clones (ZAP!)
  if (!p.onGround) return false;
  const g = gapAt(midX(p) + 34);
  if (g && !g.bridge && !isGap(midX(p))) { p.waitGap = g; hintT = 2; if (++p.wait > 300) { makeBridge(g); p.wait = 0; } if (p.wait === 20) speak('Jump!'); return true; }
  for (const c of clones) if (!c.good && !c.skip && midX(c) > midX(p) && midX(c) - midX(p) < 240 && c.y > FLOOR - 200) {

  drawBot(670, gy - Math.abs(Math.sin(frame * 0.1)) * 14, 2, -1, goodPal('#ff80ab'), { shape: 'robo', mood: 'happy' });
  const hop = Math.abs(Math.sin(frame * 0.08)) * 16;
  drawRobo(120, FLOOR - hop, 2.6, 1, { happy: true, hov: hop > 10 });
  for (let i = 0; i < 4; i++) drawBot(880 - i * 50, FLOOR - Math.abs(Math.sin(frame * 0.1 + i)) * 10, 1.3, -1, goodPal(GOOD_COLS[i + 1]), { shape: i % 2 ? 'round' : 'robo', mood: 'happy' });
  drawButton(PLAY_BTN, '▶ PLAY', frame % 60 < 30 ? '#ff4081' : '#f50057', 50);
  if (everWon) text('⭐ Mecha Robo is your friend! ⭐', W / 2, 296, 26, '#ffeb3b');
  text("💡 Ben's idea: an easy Clone Factory for his brother!", W / 2, 470, 22, '#ffffff');
  text(CONTROLS, W / 2, 504, 17, '#cfe8ff');
}
function drawMap() {
  camX = 0;
  ctx.fillStyle = '#123a7a'; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = 'rgba(255,255,255,.08)'; ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  rainbowText('Pick one!', W / 2, 70, 56);
  drawButton(BACK_BTN, '◀', '#455a64', 34);
  for (let i = 0; i < LAST; i++) {                    // dotted path
    const a = NODES[i], b = NODES[i + 1];
    for (let t = 0; t <= 1; t += 0.08) dot(a.x + (b.x - a.x) * t, a.y + (b.y - a.y) * t, 7, i + 1 < unlocked ? '#ffd740' : 'rgba(255,255,255,.3)');
  }
  for (let i = 0; i < NUM_LEVELS; i++) {
    const n = NODES[i], open = i < unlocked, sel = i === mapSel, big = i === BOSS ? 10 : 0;
    if (sel) { ctx.strokeStyle = '#ffeb3b'; ctx.lineWidth = 8; ctx.beginPath(); ctx.arc(n.x, n.y, 66 + big + Math.sin(frame * 0.15) * 4, 0, 7); ctx.stroke(); }
    dot(n.x, n.y, 58 + big, open ? GOOD_COLS[i % GOOD_COLS.length] : '#546e7a');
    dot(n.x, n.y, 49 + big, open ? '#ffffff' : '#78909c');
    text(open ? LEVELS[i].icon : '🔒', n.x, n.y + 18, 50 + big);
    roundRect(n.x - 20, n.y + 40 + big, 40, 32, 10, '#0b1440'); text(String(i + 1), n.x, n.y + 66 + big, 26, '#ffd740');
  }
  const s = NODES[mapSel]; drawRobo(s.x, s.y - 62 - Math.abs(Math.sin(frame * 0.12)) * 10, 1.2, 1, { happy: true });
  if (frame % 50 < 38) drawArrow(s.x, s.y + 120, 0, '#69f0ae', 0.9);
  text('Tap one!', W / 2, 490, 30, '#ffffff');
}
const WIN_MECHA = { gk: 1, mode: 'good', squash: 1 };
function drawWin() {                                       // THE END: a big happy parade!
  drawFloorScene('#ff9a8b', '#a8e6cf', '#ffd740', '#3d5afe');
  for (let i = 0; i < 7; i++) { const px = i * 150 + 40, py = 160 + Math.sin(frame * 0.02 + i) * 14; ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(px, py + 26); ctx.lineTo(px, py + 80); ctx.stroke(); dot(px, py, 24, GOOD_COLS[i % 8]); }
  const span = W + 900, head = (winT * 1.6 + 900) % span, n = clamp(totalArmy, 6, 14);
  const at = d => ((head - d) % span + span) % span - 300;  // everyone marches to the right, in one long line
  const bounce = k => Math.abs(Math.sin(frame * 0.14 + k)) * 14;
  ctx.save(); ctx.translate(at(n * 52 + 170), FLOOR - bounce(0) * 0.4); ctx.scale(0.62, 0.62); drawMechaJr(WIN_MECHA, 0, 0); ctx.restore();
  for (let i = 0; i < n; i++) {
    const kinds = 'gbrij', k = CT[kinds[i % 5]];
    drawBot(at(80 + i * 52), FLOOR - bounce(i * 0.7), 1.25, 1, goodPal(GOOD_COLS[i % 8]), { shape: k.shape, mood: 'happy' });
  }
  drawRobo(at(0), FLOOR - bounce(5) * 1.3, 1.8, 1, { happy: true, hov: bounce(5) > 10 });
  drawParts();
  rainbowText('YOU DID IT!', W / 2, 80, 76);
  text('Mecha Robo is your friend! ♥', W / 2, 136, 34, '#ffffff');
  text("💡 Ben's idea: an easy Clone Factory for his brother!", W / 2, 500, 22, '#ffffff');
  if (stickerNew > 0) text('⭐ NEW STICKER! ⭐', W / 2, 186, 32, '#ffeb3b');
  if (winT > 120) drawButton({ x: W / 2 - 90, y: 200, w: 180, h: 70 }, '▶', frame % 60 < 30 ? '#ff4081' : '#f50057', 40);
}
function draw() {
  ctx.save();
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'win') drawWin();
  else { drawWorld(); drawHUD(); if (state === 'levelDone') { drawLevelDone(); drawParts(); } }
  ctx.restore();
}

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
