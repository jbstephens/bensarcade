<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🪞 Funhouse Mirror Room</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }

  #top { display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; flex-wrap: wrap; justify-content: center; }
  #top h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); color: #fff; -webkit-text-stroke: 2px #2a1d4a; text-shadow: 3px 3px 0 #2a1d4a; letter-spacing: 1px; white-space: nowrap; }
  #bubble { flex: 1; min-width: 260px; max-width: 760px; background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 20px;
    padding: 6px 14px; font-size: clamp(16px, 1.9vw, 22px); font-weight: bold; cursor: pointer; }
  #sceneBox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  #scene { width: 100%; height: 100%; display: block; overflow: hidden; }
  .spot { cursor: pointer; transform-box: fill-box; transform-origin: center; transition: transform .15s; }
  .spot:hover { transform: scale(1.04); }
  .spot.pop { animation: pop .45s; }
  @keyframes pop { 30% { transform: scale(1.12) rotate(-3deg); } 60% { transform: scale(.96) rotate(2deg); } }
  .twinkle { animation: tw 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tw { 50% { opacity: .25; transform: scale(.7); } }
  .blink { animation: bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  #bar { display: flex; gap: 10px; padding: 6px 12px 12px; justify-content: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #2a1d4a; border-radius: 16px; background: #ffe082;
    padding: 8px 14px; cursor: pointer; box-shadow: 0 5px 0 #2a1d4a; color: #222; min-height: 56px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1d4a; }
  .b1 { background: #a5f2a5; } .b2 { background: #b3e5fc; } .b3 { background: #d1b8ff; } .b4 { background: #ffccbc; } .b5 { background: #fff0c8; }

  .panel { position: fixed; inset: 0; background: rgba(20, 16, 50, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .panel.on { display: flex; }
  .card { background: #fffbe8; border: 6px solid #2a1d4a; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1100px;
    max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.2vw, 36px); }
  .hint { margin: 0; text-align: center; font-size: 19px; font-weight: bold; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .big { font-size: 26px; padding: 10px 14px; border: 4px solid #2a1d4a; border-radius: 14px; width: 100%; background: #fff; }
  #prGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .thumb { background: #fff; border: 5px solid #2a1d4a; border-radius: 16px; padding: 6px; cursor: pointer; box-shadow: 0 5px 0 #ffb74d;
    display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding-top: 4px; }
  .thumb:active { transform: scale(.96); }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(50vh, 600px); width: auto; max-width: 100%; border: 4px solid #2a1d4a; border-radius: 8px; background: #fff; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fffbe8; border: 5px solid #2a1d4a;
    border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 90; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px 10px; } #top h1 { font-size: 22px; } }

    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }

  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  body { background: radial-gradient(circle at 50% 30%, #3d2a5c, #120a24 75%); }
  .vil { transition: transform .7s cubic-bezier(.5, 1.6, .5, 1); transform-box: view-box; }
  .vil.slow { transition: transform 1s ease-in-out; }
  #roboDoor { transition: transform .6s cubic-bezier(.5, 1.6, .5, 1), opacity .4s; transform-box: fill-box; transform-origin: center bottom; }
  .alarm #scene { animation: wob .5s ease-in-out 4; }
  body { background: repeating-linear-gradient(90deg, #ff5f7e 0 46px, #ffe066 46px 92px); }

  #top, #bar, #sceneBox { position: relative; }
  #bubble { min-height: 44px; }
  #strip { display: flex; gap: 4px; background: #2a1d4a; padding: 4px 6px; border-radius: 10px; cursor: pointer; min-height: 54px; align-items: center; }

  .bulb { cursor: pointer; }
  .bulb .lt { animation: tw 1.8s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .bulb.lit .lt { animation: none; }
  .bulb .on { display: none; } .bulb.lit .on { display: inline; }
  .bulb.flash .lt { animation: fl .5s; }

  .mirror { cursor: pointer; }
  #secretDoor { transition: transform 1.3s ease-in-out; transform-box: fill-box; transform-origin: 0% 50%; }

  #flash { position: fixed; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 80; }
  #flash.on { animation: flash .6s ease-out; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  #pickGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  #pickGrid .thumb svg { height: 110px; }
  #photoGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  #photoGrid svg { width: 100%; height: auto; display: block; }
  #hall { width: 100%; height: auto; max-height: 62vh; display: block; border: 5px solid #2a1d4a; border-radius: 16px; background: #1a0f3a; }
  .shim { animation: shim 4.5s ease-in-out infinite; }
  @keyframes shim { 0% { transform: translateX(-900px); } 100% { transform: translateX(1100px); } }
  .glint { animation: tw 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
</style>
</head>
<body>
<div id="room">
  <div id="top">
    <h1>🪞 FUNHOUSE MIRRORS</h1>
    <div id="bubble">🎪 Welcome to the funhouse! Tap a mirror to stand in front of it!</div>
    <div id="strip" title="My funny photos"></div>
  </div>
  <div id="sceneBox"><svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="bar">
    <button class="btn b3" id="bPick">🎭 Pick a friend</button>
    <button class="btn b1" id="bSnap">📸 Funny photo</button>
    <button class="btn b2" id="bPhotos">🎞️ My photos</button>
    <button class="btn b5" id="bPrint">🖨️ Silly faces to color</button>
  </div>
</div>
<div id="flash"></div>
<div id="pickPanel" class="panel"><div class="card">
  <h2>🎭 Who goes in the funhouse?</h2>
  <div id="pickGrid"></div>
  <button class="btn b4" data-close="1">❌ Close</button>
</div></div>
<div id="photoPanel" class="panel"><div class="card">
  <h2>🎞️ My Funny Photos</h2>
  <p class="hint" id="photoHint"></p>
  <div id="photoGrid"></div>
  <div class="row"><button class="btn b6" id="photoClear">🧽 Clear my photos</button><button class="btn b4" data-close="1">❌ Close</button></div>
</div></div>
<div id="hallPanel" class="panel"><div class="card">
  <h2>✨ The Hall of Infinite Robos! ✨</h2>
  <p class="hint">Two mirrors facing each other... so the Robos go on FOREVER!</p>
  <svg id="hall" viewBox="0 0 1000 600" xmlns="http://www.w3.org/2000/svg"></svg>
  <div class="row"><button class="btn b5" id="hallCount">🔢 Count the Robos!</button><button class="btn b4" id="hallBack">⬅️ Back to the mirrors</button></div>
</div></div>
<script>
