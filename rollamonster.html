<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎲 Roll-a-Monster</title>
<script src="touchpad.js?v=3"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #c8f7d0 0 36px, #b6efc4 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 6px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.sel { outline: 5px solid #1e6bff; outline-offset: 2px; }
  .b-back { background: #9be3ff; } .b-roll { background: #ffe066; } .b-all { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); font-size: 24px; }
  .b-save { background: #8ef08e; } .b-time { background: #ffb347; } .b-print { background: #c3a6ff; } .b-zoo { background: #ffc2d6; } .b-new { background: #fff; }
  .b-mode { background: #fff; font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .panel { background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #2e8b57; }
  /* ---------- roll screen ---------- */
  #roll { flex-direction: column; padding: 8px 10px 10px; gap: 8px; }
  #top { display: flex; align-items: center; gap: 8px; }
  #top h1 { margin: 0; flex: 1; font-size: clamp(24px, 4vw, 44px); color: #fff; -webkit-text-stroke: 2.5px #333;
    text-shadow: 4px 4px 0 #7b2ff7; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
  #top .btn { font-size: 18px; min-height: 50px; }
  #main { flex: 1; min-height: 0; display: flex; gap: 10px; }
  #diceP { width: 31%; display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 0; }
  #chips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .chip { font: inherit; font-weight: bold; font-size: 14px; border: 3px solid #333; border-radius: 12px; background: #f3f3f3;
    padding: 3px 2px; cursor: pointer; line-height: 1.1; min-height: 46px; box-shadow: 0 3px 0 #333; }
  .chip i { font-style: normal; font-size: 20px; display: block; }
  .chip.done { background: #d6ffd6; }
  .chip.cur { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 3px 0 #ff3d6e; }
  #stage { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; perspective: 700px; }
  #hop.hop { animation: hop .9s ease-out; }
  @keyframes hop { 0% { transform: translateY(0); } 25% { transform: translateY(-34px); } 50% { transform: translateY(0); } 70% { transform: translateY(-12px); } 100% { transform: translateY(0); } }
  .die { --s: min(15vh, 130px); width: var(--s); height: var(--s); position: relative; transform-style: preserve-3d;
    transition: transform .9s cubic-bezier(.2, .7, .3, 1); }
  .face { position: absolute; inset: 0; border: 4px solid #333; border-radius: 18%; display: grid;
    grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 10%; background: radial-gradient(circle at 30% 25%, #fff, var(--dc, #ffd6e8) 70%); }
  .pip { width: 72%; height: 72%; margin: auto; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #666, #111); }
  #result { display: flex; align-items: center; gap: 8px; padding: 6px; border: 4px dashed #333; border-radius: 16px; background: #fffbe0; min-height: 0; }
  #resPic { width: min(17vh, 120px); flex: none; }
  #resPic svg { width: 100%; height: auto; display: block; }
  #resTxt { font-size: clamp(16px, 2.2vw, 24px); font-weight: bold; line-height: 1.15; }
  #resTxt small { display: block; font-size: 15px; color: #7b2ff7; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #prevP { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; padding: 6px; gap: 4px; min-height: 0;
    background: radial-gradient(circle at 50% 45%, #fff 30%, #f1e6ff 100%); }
  #mName { font-size: clamp(20px, 2.8vw, 32px); font-weight: bold; text-align: center; color: #7b2ff7; line-height: 1.1; }
  #mWho { font-size: 16px; color: #555; }
  #pv { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #pv svg { height: 100%; width: 100%; max-height: 100%; display: block; }
  #pv.pop svg { animation: pop .45s ease-out; }
  @keyframes pop { 0% { transform: scale(.85) rotate(-3deg); } 60% { transform: scale(1.06) rotate(2deg); } 100% { transform: scale(1); } }
  #recP { width: 27%; display: flex; flex-direction: column; gap: 6px; padding: 8px; min-height: 0; }
  #recP h2 { margin: 0; text-align: center; font-size: 22px; }
  #recipe { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0; padding: 0; list-style: none; }
  #recipe li { font-size: 17px; padding: 4px 6px; border-bottom: 2px dotted #bbb; display: flex; gap: 6px; align-items: center; }
  #recipe li b { min-width: 0; }
  #recipe li.no { color: #aaa; }
  #recipe .sw { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #333; display: inline-block; flex: none; }
  #recBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #recBtns .btn { font-size: 16px; min-height: 48px; padding: 4px; }
  /* ---------- overlays ---------- */
  .over { position: fixed; inset: 0; background: rgba(30, 20, 60, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 14px; }
  .over.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1100px;
    max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.4vw, 36px); }
  #themeGrid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .tcard { border: 4px solid #333; border-radius: 16px; padding: 6px; cursor: pointer; text-align: center; font-weight: bold; font-size: 17px; background: #f8f4ff; }
  .tcard svg { width: 100%; height: auto; display: block; }
  .tcard.sel { border-color: #1e6bff; background: #fff6c2; box-shadow: 0 0 0 4px #1e6bff; }
  #whoGrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  #timerCard { align-items: center; max-width: 760px; }
  #tClock { font-size: clamp(60px, 14vh, 130px); font-weight: bold; color: #ff3d6e; -webkit-text-stroke: 3px #333; line-height: 1; }
  #tBar { width: 100%; height: 26px; border: 4px solid #333; border-radius: 14px; overflow: hidden; background: #eee; }
  #tFill { height: 100%; width: 100%; background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); transition: width .3s linear; }
  #tPic { height: min(30vh, 240px); }
  #tPic svg { height: 100%; width: auto; display: block; }
  #tMsg { font-size: 24px; font-weight: bold; text-align: center; }
  #zooGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; }
  .zcard { border: 4px solid #333; border-radius: 16px; padding: 6px; text-align: center; background: #f2fff4; display: flex; flex-direction: column; gap: 4px; }
  .zcard svg { width: 100%; height: auto; display: block; }
  .zcard b { font-size: 16px; line-height: 1.1; }
  .zcard .row { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .zcard .btn { font-size: 15px; min-height: 42px; padding: 2px; }
  .zcard.sel { border-color: #1e6bff; box-shadow: 0 0 0 4px #1e6bff; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- printables gallery + sheet view (from the Craft Room) ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { display: flex; align-items: center; gap: 10px; padding: 8px 12px 2px; }
  #gHead h1 { margin: 0; flex: 1; text-align: center; font-size: clamp(26px, 4.6vw, 50px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #7b2ff7; }
  #gHead .btn { font-size: 18px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #2e8b57; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #2e8b57; }
  #side { width: min(40vw, 400px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #modes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .b-p { background: #8ef08e; font-size: 22px; } .b-set { background: #c3a6ff; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #main { flex-direction: column; overflow-y: auto; }
    #diceP, #recP, #prevP { width: 100%; flex: none; } #prevP { height: 55vh; } #stage { min-height: 170px; } #recipe { flex: none; }
    #view { flex-direction: column; } #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #themeGrid { grid-template-columns: repeat(3, 1fr); }
  }
  @media (max-height: 620px) { .btn { min-height: 46px; font-size: 17px; } #recBtns .btn { min-height: 42px; font-size: 15px; } .chip { min-height: 40px; font-size: 13px; } .chip i { font-size: 17px; } #recipe li { font-size: 15px; } }
  /* ---------- PRINT: only the sheet (or a whole set of sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="roll" class="screen on">
  <div id="top">
    <h1>🎲 ROLL-A-MONSTER</h1>
    <button class="btn" id="bTheme" style="background:#ffe066">🎨 Classic</button>
    <button class="btn" id="bWho" style="background:#ffc2d6">🙂 Ben</button>
    <button class="btn b-back" id="bLeave">⬅️ Back</button>
  </div>
  <div id="main">
    <div id="diceP" class="panel">
      <div id="chips"></div>
      <div id="stage"><div id="hop"><div class="die" id="die"></div></div></div>
      <div id="result"><div id="resPic"></div><div id="resTxt">Tap 🎲 to roll!<small>Each roll picks a monster part.</small></div></div>
      <div class="two">
        <button class="btn b-roll" id="bRoll">🎲 Roll BODY</button>
        <button class="btn b-all" id="bAll">🎲 ROLL ALL!</button>
      </div>
    </div>
    <div id="prevP" class="panel">
      <div id="mName">Monster Maker</div>
      <div id="mWho">Roll the dice to build a monster!</div>
      <div id="pv"></div>
      <button class="btn" id="bName" style="background:#9bf6ff;font-size:18px;min-height:46px">🏷️ Silly name!</button>
    </div>
    <div id="recP" class="panel">
      <h2>📜 Monster Recipe</h2>
      <ul id="recipe"></ul>
      <div id="recBtns">
        <button class="btn b-save" id="bSave">💾 Save to Zoo</button>
        <button class="btn b-zoo" id="bZoo">🦁 My Zoo</button>
        <button class="btn b-time" id="bTime">⏱️ Draw it!</button>
        <button class="btn b-print" id="bSheets">🖨️ Printables</button>
        <button class="btn b-new" id="bNew" style="grid-column:1 / -1">🧽 New monster</button>
      </div>
    </div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Back</button>
    <h1>🖨️ MONSTER PRINTABLES</h1>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color</button>
      <button class="btn b-mode" id="bLine">🖍️ Black lines<br>(color it!)</button>
    </div>
    <div id="pHelp"></div>
    <button class="btn b-p" id="bPrint">🖨️ Print it!</button>
    <button class="btn b-set" id="bPrintAll">🖨️ Print the whole set</button>
    <button class="btn b-back" id="bVBack">⬅️ Back to printables</button>
  </div>
</div>
<div id="themeOv" class="over"><div class="card"><h2>🎨 Pick a monster set!</h2><div id="themeGrid"></div>
  <button class="btn b-back" id="bThemeClose">👍 Done</button></div></div>
<div id="whoOv" class="over"><div class="card"><h2>🙂 Who is rolling?</h2><div id="whoGrid"></div></div></div>
<div id="timerOv" class="over"><div class="card" id="timerCard"><h2>✏️ DRAW IT!</h2>
  <div id="tClock">2:00</div><div id="tBar"><div id="tFill"></div></div>
  <div id="tPic"></div><div id="tMsg">Grab a pencil and draw your monster!</div>
  <div class="two" style="width:100%"><button class="btn b-roll" id="bTPause">⏸️ Pause</button><button class="btn b-back" id="bTStop">✅ Done</button></div></div></div>
<div id="zooOv" class="over"><div class="card"><h2>🦁 My Monster Zoo</h2><div id="zooMsg" style="text-align:center;font-size:19px"></div>
  <div id="zooGrid"></div>
  <div class="two"><button class="btn b-print" id="bZooPrint">🖨️ Print recipe cards</button><button class="btn b-back" id="bZooClose">👍 Close</button></div></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎲 ROLL-A-MONSTER: roll dice for each monster part, see an example monster, then draw your own!
// Printables are portrait letter pages, viewBox 0 0 800 1000. LINE = true draws black lines to color.
// Art helpers + characters are copied from the Craft Room / Art Gallery (gradients, no SVG filters).
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}

  $('printAll').innerHTML = kindSheets(kind).map(i => buildSheet(i, isLine())).join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + kindSheets(kind).length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
function printZooCards() {
  closeOv('zooOv'); makeSheets();
  if (!state.zoo.length) { toast('🦁 Save a monster to your Zoo first!'); return; }
  printSet('zoo');
}
// =====================================================================
// LEAVING (back to the Game Factory book)
// =====================================================================
function leave() {
  stopTimer(); hush();
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
// =====================================================================
// KEYS: arrows pick, Enter rolls/opens, Space = ROLL ALL, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key, ov = openOv();
  if (ov) {
    if (k === 'Escape' || k === 'Backspace') { closeOv(ov); e.preventDefault(); return; }
    if (ov === 'themeOv' || ov === 'whoOv') {
      const N = ov === 'themeOv' ? THEMES.length : NAMES.length;
      if (k === 'ArrowRight' || k === 'ArrowDown') ovSel = (ovSel + 1) % N;
      else if (k === 'ArrowLeft' || k === 'ArrowUp') ovSel = (ovSel + N - 1) % N;
      else if (k === 'Enter' || k === ' ') { (ov === 'themeOv' ? pickTheme : pickWho)(ovSel); e.preventDefault(); return; }
      else return;
      markOv(ovSel); blip(520, 0, .06); e.preventDefault();
    } else if (ov === 'timerOv' && (k === ' ' || k === 'Enter')) { pauseTimer(); e.preventDefault(); }
    else if (k === 'Enter') { closeOv(ov); e.preventDefault(); }
    return;
  }
  if (view === 'roll') {
    if (k === 'ArrowRight' || k === 'ArrowDown') { if (!rolling) { curPart = (curPart + 1) % PK.length; renderChips(); blip(520, 0, .06); } }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { if (!rolling) { curPart = (curPart + PK.length - 1) % PK.length; renderChips(); blip(520, 0, .06); } }
    else if (k === 'Enter') rollPart(curPart);
    else if (k === ' ') rollAll();
    else if (k === 'p' || k === 'P') openPrintables();
    else if (k === 'n' || k === 'N') newName();
    else if (k === 'Escape' || k === 'Backspace') leave();
    else return;
    e.preventDefault();
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else if (k === 'Escape' || k === 'Backspace') { setView('roll'); e.preventDefault(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
// wake up sound on the first tap (iPad)
function audio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (_) {} }
function init() {
  loadState(); makeSheets();
  buildDie(); dieShow(1, false); dieColor('body');
  curPart = nextOpen(); renderChips(); renderRecipe(); renderPreview(); markThemeBtn();
  $('bWho').textContent = '🙂 ' + state.who;
  const tap = (id, fn) => $(id).addEventListener('click', e => { audio(); fn(e); try { e.currentTarget.blur(); } catch (_) {} });
  tap('bRoll', () => rollPart(curPart));
  tap('bAll', rollAll);
  tap('bName', newName);
  tap('bSave', saveToZoo);
  tap('bZoo', openZoo);
  tap('bTime', openTimer);
  tap('bSheets', openPrintables);
  tap('bNew', newMonster);
  tap('bTheme', openThemes);
  tap('bWho', openWho);
  tap('bLeave', leave);
  tap('bThemeClose', () => closeOv('themeOv'));
  tap('bTPause', pauseTimer);
  tap('bTStop', () => closeOv('timerOv'));
  tap('bZooClose', () => closeOv('zooOv'));
  tap('bZooPrint', printZooCards);
  tap('bGBack', () => setView('roll'));
  tap('bColor', () => setMode('color'));
  tap('bLine', () => setMode('line'));
  tap('bPrint', printSheet);
  tap('bPrintAll', () => printSet(SHEETS[cur].kind));
  tap('bVBack', backToGallery);
  ['themeOv', 'whoOv', 'zooOv'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) closeOv(id); }));
  window.addEventListener('afterprint', endPrintAll);
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
