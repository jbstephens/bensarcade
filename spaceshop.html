<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Laserheart's Space Shop</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b0730; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #f4f2ff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #e3dcea; border-bottom: 2px solid #c9bfd6; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #c2185b; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #0d0533, #3a0d5c 45%, #c2185b); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #1a0033; }
  #logo .big i { color: #ff80ab; font-style: normal; }
  #logo .small { font-size: 15px; color: #b3e5fc; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #0b0730; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #ff4081; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #ff4081; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #ffd740; color: #4e2600; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #c79100; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fff8e1; color: #6d4c00; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #e3e6fb; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #1a237e; box-shadow: 0 4px 0 #9fa8da; }
  #nav button.on { background: #3949ab; color: #fff; box-shadow: 0 4px 0 #1a237e; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff1744; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c51162; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f48fb1; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(26,35,126,.18); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }
  .card.must { border-color: #ffc400; background: #fffdf0; }
  .card.sel { outline: 4px solid #ff4081; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #eef0fc; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #1a237e; line-height: 1.1; }
  .card .blurb { font-size: 15px; color: #555; }
  .card .price { font-size: 22px; font-weight: 900; color: #00873e; margin: 4px 0; }
  .card .price s { color: #999; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: #ffc400; color: #4e2600; }
  .tag.new { background: #00c853; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #1a237e; box-shadow: 0 4px 0 #9fa8da; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #e8eaf6; color: #283593; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #3949ab; color: #fff; box-shadow: 0 4px 0 #1a237e; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #eef0fc; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #283593; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #e8eaf6; box-shadow: 0 4px 0 #9fa8da; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(26,35,126,.15); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #1a237e; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #00873e; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #3949ab; box-shadow: 0 5px 0 #1a237e; }
  .bigbtn.green { background: #00c853; box-shadow: 0 5px 0 #00873e; }
  .bigbtn.blue { background: #2979ff; box-shadow: 0 5px 0 #1a4fb5; }
  .bigbtn.gray { background: #9e9e9e; box-shadow: 0 5px 0 #616161; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #1a237e; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #283593; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #1a237e; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(11,7,48,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(11,7,48,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8eaf6; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8eaf6; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #283593; }
  #printBox .pbTip { font-size: 20px; color: #1a237e; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<body>
<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
    <div id="url">🔒 <b>www.laserheart.space</b></div>
  </div>
  <div id="head">
    <canvas id="helper" width="208" height="208"></canvas>

    <div id="bubble">Ba-bum! Welcome to my Space Shop!</div>
    <div id="wallet"><div class="lbl">MY STAR CREDITS</div><div class="amt" id="amt">1000</div><button id="moreBucks">⭐ Get more</button></div>
  </div>

<div id="revBox"><div class="in" id="revIn"></div></div>
<script>
// 💗 LASERHEART'S SPACE SHOP: buy paper space stuff with pretend Star Credits,
// then pick which orders to PRINT on your printer. Nothing prints by itself.
// Laserheart is the heart of the Time Portal (Robo Jump 9). She is kind now and on Robo's team!
// Save: localStorage.spaceShop = { credits, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'spaceShop';
let S = { credits: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.credits >= 0)) S.credits = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, frame = 0;
const FONT = '"Trebuchet MS", Arial, sans-serif';
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.lineJoin = 'round'; ctx.stroke(); }
}
function line(x1, y1, x2, y2, col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw || 2; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, r2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * r2, y + Math.sin(a) * r2]); }
  poly(p, fill, stroke, 2);
}
function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
// the little helpers from Robo Jump 9 (Laserheart's drawing code uses these)
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, r2 = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * r2, y + Math.sin(a) * r2); }
  ctx.closePath(); ctx.fill();
}
function heartPath(x, y, s) {                            // a heart shape: (x, y) = middle, s = half width
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
  ctx.closePath();
}
// 💗 LASERHEART: copied from drawLaserheart() in Robo Jump 9: a big glowing crystal heart in a chrome frame,
// with beam arms and the gold crown. She is the NICE Laserheart now (o.nice: pink glow, happy eyes, smile).
// o.wave = her right beam arm waves hello (the shop helper); o.noArms = just the heart (small stickers)
function drawLaserheart(x, y, w, h, o = {}) {
  const cx = x + w / 2, cy = y + h / 2, pulse = 1 + Math.sin(frame * (o.nice ? 0.08 : 0.25)) * 0.05, s = w / 2 * pulse;
  ctx.save();
  for (let k = 3; k >= 1; k--) circle(cx, cy, s * (1 + k * 0.18), o.nice ? `rgba(255,182,193,${0.07 * k})` : `rgba(255,23,68,${0.06 * k})`);
  if (!o.noArms) for (const d of [-1, 1]) {              // 🦾 chrome beam arms with glowing emitters
    const wave = o.wave && d === 1, wob = wave ? -s * 0.9 + Math.sin(frame * 0.25) * s * 0.3 : Math.sin(frame * 0.07 + d) * s * 0.15;
    const ax = cx + d * s * 0.95, ay = cy - s * 0.1, ex = cx + d * s * 1.55, ey = cy + s * 0.35 + wob;
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = s * 0.15; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.beginPath(); ctx.moveTo(ax, ay); ctx.lineTo(cx + d * s * 1.3, cy - s * 0.4 + (wave ? wob * 0.3 : wob * 0.5)); ctx.lineTo(ex, ey); ctx.stroke();
    ctx.strokeStyle = '#eceff1'; ctx.lineWidth = s * 0.06; ctx.stroke();
    circle(ex, ey, s * 0.17, '#546e7a'); circle(ex, ey, s * 0.11, o.nice ? '#ff80ab' : '#ff1744');
  }
  ctx.fillStyle = '#b0bec5'; heartPath(cx, cy, s * 1.1); ctx.fill();                // chrome frame
  ctx.fillStyle = '#eceff1'; heartPath(cx - s * 0.03, cy - s * 0.04, s * 1.02); ctx.fill();
  const gr = ctx.createLinearGradient(cx - s, cy - s, cx + s, cy + s);
  gr.addColorStop(0, o.nice ? '#ffc1e3' : '#ff4f81'); gr.addColorStop(0.5, o.nice ? '#ff80ab' : '#e0003c'); gr.addColorStop(1, o.nice ? '#f06292' : '#8b0030');
  ctx.fillStyle = gr; heartPath(cx, cy, s * 0.9); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = Math.max(1, s * 0.03); ctx.beginPath();     // crystal facets
  for (const [fx, fy] of [[-0.6, -0.45], [0.6, -0.45], [-0.75, 0.15], [0.75, 0.15], [0, 0.75], [0, -0.35]]) { ctx.moveTo(cx, cy + s * 0.1); ctx.lineTo(cx + fx * s, cy + fy * s); }
  ctx.stroke();
  ellipse(cx - s * 0.4, cy - s * 0.38, s * 0.18, s * 0.09, 'rgba(255,255,255,.7)', -0.6);
  const ey = cy - s * 0.05;                              // 👀 happy eyes + smile (the nice Laserheart)
  ctx.strokeStyle = '#fff'; ctx.lineWidth = Math.max(2, s * 0.06); ctx.lineCap = 'round';
  if (o.blink) for (const d of [-1, 1]) line(cx + d * s * 0.2, ey, cx + d * s * 0.4, ey, '#fff', Math.max(2, s * 0.06));
  else for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + d * s * 0.3, ey, s * 0.1, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  ctx.strokeStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy + s * 0.25, s * 0.16, 0.2, Math.PI - 0.2); ctx.stroke();
  if (o.crown !== false) {                               // 👑 the REAL Laserheart wears the gold crown
    const ty = cy - s * 0.95, k = s / 65; ctx.fillStyle = '#ffd740';
    ctx.beginPath(); ctx.moveTo(cx - s * 0.32, ty + 6 * k); ctx.lineTo(cx - s * 0.36, ty - 14 * k); ctx.lineTo(cx - s * 0.16, ty - 4 * k); ctx.lineTo(cx, ty - 20 * k); ctx.lineTo(cx + s * 0.16, ty - 4 * k); ctx.lineTo(cx + s * 0.36, ty - 14 * k); ctx.lineTo(cx + s * 0.32, ty + 6 * k); ctx.closePath(); ctx.fill();
    circle(cx, ty - 2 * k, 3.5 * k, '#ff1744'); drawStar(cx + s * 0.4, ty - 14 * k, 6 * k, '#fff', 0.3);
  }
  ctx.restore();
}
// handy: Laserheart by her CENTER and a size (the heart is size wide; arms stick out past that)
function LH(cx, cy, size, o = {}) { drawLaserheart(cx - size / 2, cy - size / 2, size, size, Object.assign({ nice: true }, o)); }
</script>
<script>
// ---------- 🖨️ printable pages: drawn on 850 x 1100 (8.5 x 11 inch) canvases. 100 px = 1 inch ----------
const PW = 850, PH = 1100;
function makePage(fn, sc = 1.5) {
  const cv = document.createElement('canvas'); cv.width = Math.round(PW * sc); cv.height = Math.round(PH * sc);
  const old = ctx, oldF = frame; ctx = cv.getContext('2d'); frame = 0;
  try { ctx.scale(sc, sc); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH); fn(); } finally { ctx = old; frame = oldF; }
  return cv;
}
function pageHead(title, sub) {
  rr(30, 24, 790, 84, 22, '#120a3a');
  for (let i = 0; i < 18; i++) circ(150 + (i * 97) % 650, 34 + (i * 37) % 64, 1.5 + i % 2, '#fff');
  ctx.fillStyle = '#ff4081'; ctx.fillRect(50, 98, 750, 5);
  LH(88, 64, 70);
  txt("LASERHEART'S SPACE SHOP", 150, 48, 17, '#ff80ab', 'left');
  txt(title, 150, 78, 34, '#fff', 'left', true, 640);

function updateTop() {
  $('amt').textContent = S.credits; $('cCount').textContent = S.cart.length;
  for (const [id, v] of [['tShop', 'shop'], ['tCart', 'cart'], ['tOrders', 'orders']]) $(id).classList.toggle('on', view === v);
}
function show(v) { view = v; render(); $('main').scrollTop = 0; }
function render() {
  updateTop(); const m = $('main'); m.innerHTML = '';
  if (view === 'shop') renderShop(m); else if (view === 'cart') renderCart(m); else renderOrders(m);
}
function renderShop(m) {
  const bar = el('div', 'cats'); m.appendChild(bar);
  for (const [c, nm] of CATS) { const n = c === 'all' ? PRODUCTS.length : PRODUCTS.filter(p => p.cat === c).length;
    const b = el('button', 'catb' + (CAT === c ? ' on' : ''), nm + ' <span>' + n + '</span>'); b.onclick = () => { CAT = c; sfx.click(); say(c === 'fold' ? 'Fold-Ups! Build real 3D spaceships!' : c === 'mega' ? 'The MEGA SET! A GIANT space station!' : nm.replace(/^\S+ /, '') + '! Ba-bum!'); show('shop'); }; bar.appendChild(b); }
  const grid = el('div'); grid.id = 'grid'; m.appendChild(grid);
  const order = PRODUCTS.filter(p => CAT === 'all' || p.cat === CAT).sort((a, b) => (b.cat === 'mega' ? 2 : 0) + (b.k === DEAL ? 1 : 0) - (a.cat === 'mega' ? 2 : 0) - (a.k === DEAL ? 1 : 0));
  for (const p of order) {
    const card = el('div', 'card' + (p.cat === 'mega' ? ' must' : '')); card.id = 'card_' + p.k;
    if (p.cat === 'mega') card.appendChild(el('div', 'tag gold', '🎁 MEGA SET'));
    else if (p.k === DEAL) card.appendChild(el('div', 'tag', '🔥 DEAL: HALF PRICE!'));
    else if (p.isNew) card.appendChild(el('div', 'tag new', '✨ NEW!'));
    card.appendChild(thumbCanvas(p.k));
    card.appendChild(el('h3', '', p.name)); card.appendChild(el('div', 'blurb', p.blurb));
    card.appendChild(el('div', 'price', (p.k === DEAL ? '<s>' + p.price + '</s>' : '') + '⭐ ' + priceOf(p.k) + ' Star Credits'));
    const r = p.revs[0]; card.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`));
    const row = el('div', 'row'), inCart = S.cart.includes(p.k);
    const add = el('button', 'add' + (inCart ? ' in' : ''), inCart ? '✅ IN CART' : '🛒 ADD TO CART');
    add.onclick = () => toggleCart(p.k);
    const rb = el('button', 'revbtn', '⭐ ' + avg(p)); rb.onclick = () => openReviews(p.k);
    row.append(add, rb); card.appendChild(row); grid.appendChild(card);
  }
}
function toggleCart(k) {
  const i = S.cart.indexOf(k);
  if (i >= 0) { S.cart.splice(i, 1); sfx.click(); say('Okay! I took it out of your cart.'); }
  else { S.cart.push(k); sfx.add(); say(k === 'mega' ? 'The GIANT Space Station! The biggest thing in my whole shop! Ba-bum!' : k === 'buddy' ? 'Aww, that is me! Thank you, Ben!' : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {
  const p = P(k), box = $('revIn'); box.innerHTML = '';
  box.appendChild(el('div', 'h2', '⭐ Reviews: ' + p.name));
  p.revs.forEach(r => box.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`)));
  const c = el('button', 'bigbtn', '👍 OK!'); c.style.marginTop = '10px'; c.style.width = '100%'; c.onclick = closeReviews; box.appendChild(c);
  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what my friends on the team say!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) {
    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  for (const k of S.cart) {
    const line = el('div', 'line'); line.appendChild(thumbCanvas(k, 150, 110));
    line.appendChild(el('div', 'nm', P(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '')));
    line.appendChild(el('div', 'pr', '⭐ ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); L.appendChild(line);
  }
  const t = el('div', 'total');
  const g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'Gift wrap! I will add space wrapping paper to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: ⭐ ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (tot > S.credits) { sfx.glitch(); say('Not enough Star Credits! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.credits -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreBucks() {
  S.credits += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['Here are 500 more Star Credits!', 'Ka-ching! 500 Star Credits, straight from the Time Portal!', 'Ba-bum! More Star Credits for Ben!']));
}
// 🚚 delivery animation
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.vroom(); say('Launching your order... 3, 2, 1!'); requestAnimationFrame(shipLoop); }
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#0b0730'); g.addColorStop(1, '#3a0d5c'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 30; i++) circ((i * 173 + shipT * (i % 3 + 1) * 0.5) % 960, (i * 97) % 300, 2 + i % 3, 'rgba(255,255,255,.6)');
    planet('Earth', 820, 470, 120); planet('Moon', 120, 430, 50);
    const done = shipT > 150, tx = done ? 330 : -380 + Math.min(1, shipT / 140) * 710 + (shipT < 140 ? Math.sin(shipT * 0.5) * 3 : 0), ty = 330;
    if (!done) for (let i = 0; i < 5; i++) { ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(tx - 60 - i * 40, ty + 20 + i * 12, 40, 5); }
    // the delivery rocket (flies sideways, boxes in its cargo bay)
    ctx.save(); ctx.translate(tx + 160, ty + 50); ctx.rotate(Math.PI / 2 + (done ? 0 : Math.sin(shipT * 0.3) * 0.02));
    rocketIcon(0, 0, 380, '#eceff1', '#ff4081', true); ctx.restore();
    txt('LASERHEART', tx + 106, ty + 38, 22, '#c2185b', 'center', true, 116); txt('EXPRESS', tx + 106, ty + 66, 20, '#1a237e');
    for (let i = 0; i < Math.min(shipCount, 6); i++) { const bx = tx + 40 + i * 32, by = ty - 6; rr(bx, by, 28, 26, 3, '#d7a86e', '#6d4c41', 2); ctx.fillStyle = '#6d4c41'; ctx.fillRect(bx + 11, by, 6, 26); }
    if (done) LH(tx + 330, ty - 40, 70, { wave: true });
    if (!done) { txt('Launching' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 110, 54, '#fff'); rr(280, 160, 400, 26, 13, 'rgba(255,255,255,.3)'); rr(280, 160, Math.max(26, 400 * Math.min(1, shipT / 150)), 26, 13, '#ff4081'); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); rr(480 + Math.cos(a) * d, 140 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.5, 12, 8, 2, ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff'][i % 4]); }
      txt('ORDER CONFIRMED!', 480, 105, 66, '#1a0033'); txt('ORDER CONFIRMED!', 480, 100, 66, '#ff80ab');
      txt(shipCount + (shipCount === 1 ? ' thing is' : ' things are') + ' in MY ORDERS, ready to print!', 480, 175, 30, '#fff');
    }
  } finally { ctx = old; }
  if (shipT > 150 && !shipDone) { shipDone = true; sfx.cash(); say('ORDER CONFIRMED! Ba-bum! Tap PRINT on the things you want!'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    if (!P(o.k)) continue;
    const line = el('div', 'line'); line.appendChild(thumbCanvas(o.k, 150, 110));
    line.appendChild(el('div', 'nm', P(o.k).name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${P(o.k).pages.length + (o.gift ? 1 : 0)} page${P(o.k).pages.length + (o.gift ? 1 : 0) > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function openPrint(list) {
  closePrint(true);
  const fns = [];
  for (const o of list) { const p = P(o.k); if (!p) continue; if (o.gift) fns.push(() => pageGift(p.name)); p.pages.forEach(f => fns.push(f)); }
  if (!fns.length) return;
  const sc = fns.length > 24 ? 1 : fns.length > 8 ? 1.15 : 1.5, name = list.length === 1 ? P(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('spaceShop'); say('Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  Tip: turn on color printing!'));
  document.body.appendChild(printBox);
  for (const f of fns) { const img = new Image(); img.className = 'pbPage'; img.alt = name; img.src = makePage(f, sc).toDataURL('image/png'); printBox.appendChild(img); }
  sfx.click(); say(list.length === 1 && list[0].k === 'mega' ? 'The Giant Space Station! Tap PRINT to print all 7 pages!' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT >= 0 && shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! Let us go shopping!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).cat !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'Ba-bum! Welcome back, Ben! Your orders are in MY ORDERS.' : 'Ba-bum! Welcome to my Space Shop, Ben! Everything prints on paper!'; }, 50);
</script>
