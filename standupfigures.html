<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🧍 Stand-up Figures</title>
<script src="touchpad.js?v=11"></script>
<style>

}

// 🎭 BONUS: the paper stage. Fold the page in half and stand it up like a tent. Two backdrops: turn it around to switch!
// =====================================================================
function gear(x, y, r, col) {
  let d = ''; for (let i = 0; i < 16; i++) { const a = i * Math.PI / 8, rr = i % 2 ? r : r * 1.2; d += (i ? ' L' : 'M') + n(x + Math.cos(a) * rr) + ' ' + n(y + Math.sin(a) * rr) + ' L' + n(x + Math.cos(a + Math.PI / 8) * rr) + ' ' + n(y + Math.sin(a + Math.PI / 8) * rr); }
  return P(d + ' Z', vshade(col), OL, 2.2) + C(x, y, r * .35, '#fff', OL, 2);
}
function stageFront(y0) {   // the Game Factory stage, in a 740 x 450 box starting at y0
  let s = R(30, y0, 740, 450, 18, lin([[0, '#ede7f6'], [1, '#d1c4e9']]), OL, 3);
  s += gear(170, y0 + 170, 34, '#ffca28') + gear(632, y0 + 160, 28, '#4fc3f7') + gear(220, y0 + 250, 20, '#81c784');
  [[300, 150], [500, 140], [400, 240], [560, 260], [250, 330]].forEach(([x, y], i) => { s += P(starD(x, y0 + y, 14 + (i % 2) * 6), ball(['#ffd740', '#ff80ab', '#80d8ff'][i % 3]), OL, 1.6); });
  s += R(240, y0 + 76, 320, 64, 20, vshade('#ffb300'), OL, 3) + BT(400, y0 + 118, 'THE GAME FACTORY', 30, '#fff59d');
  s += P('M30 ' + (y0 + 380) + ' L770 ' + (y0 + 380) + ' L770 ' + (y0 + 450) + ' L30 ' + (y0 + 450) + ' Z', vshade('#a1887f'), OL, 2.4);
  for (let x = 90; x < 770; x += 70) s += L('M' + x + ' ' + (y0 + 382) + ' L' + (x - 16) + ' ' + (y0 + 448), '#6d4c41', 2);
  const curtain = sx => { const x = sx < 0 ? 30 : 770, w = 130 * sx;   // left curtain (sx = -1) / right curtain (sx = 1)
    return P('M' + x + ' ' + (y0 + 30) + ' L' + (x - w) + ' ' + (y0 + 30) + ' Q' + (x - w * .55) + ' ' + (y0 + 210) + ' ' + (x - w * .3) + ' ' + (y0 + 260) + ' Q' + (x - w * .5) + ' ' + (y0 + 330) + ' ' + (x - w * .7) + ' ' + (y0 + 386) + ' L' + x + ' ' + (y0 + 386) + ' Z', vshade('#e53935'), OL, 2.6) +
      L('M' + (x - w * .3) + ' ' + (y0 + 40) + ' Q' + (x - w * .3) + ' ' + (y0 + 200) + ' ' + (x - w * .15) + ' ' + (y0 + 380) + ' M' + (x - w * .65) + ' ' + (y0 + 40) + ' Q' + (x - w * .5) + ' ' + (y0 + 150) + ' ' + (x - w * .34) + ' ' + (y0 + 255), '#b71c1c', 2) +
      E(x - w * .3, y0 + 262, 16, 9, ball('#ffd740'), OL, 1.8); };
  s += curtain(-1) + curtain(1);
  let val = 'M30 ' + (y0 + 18); for (let i = 0; i < 10; i++) val += ' L' + (30 + i * 74) + ' ' + (y0 + 50) + ' Q' + (67 + i * 74) + ' ' + (y0 + 84) + ' ' + (104 + i * 74) + ' ' + (y0 + 50);
  s += P(val + ' L770 ' + (y0 + 18) + ' Z', vshade('#c62828'), OL, 2.6) + R(30, y0, 740, 24, 12, vshade('#ffb300'), OL, 2.4);
  s += T(400, y0 + 436, playerName() + "'s Show", 20, '#4e342e');
  return s;
}
function stageBack(y0) {    // a Moon Base night sky (turn the tent around for a space show)
  let s = R(30, y0, 740, 450, 18, lin([[0, '#1a237e'], [1, '#5c6bc0']]), OL, 3);
  const r = rng(9); for (let i = 0; i < 26; i++) s += P(starD(50 + r() * 700, y0 + 20 + r() * 260, 5 + r() * 7), '#fff59d', OL, 1.2);
  s += C(640, y0 + 100, 52, ball('#fff8e1'), OL, 2.4) + C(622, y0 + 86, 10, '#e0e0e0', OL, 1.4) + C(656, y0 + 118, 7, '#e0e0e0', OL, 1.4) + C(660, y0 + 78, 5, '#e0e0e0', OL, 1.4);
  s += E(180, y0 + 120, 74, 16, 0, OL, 2.4, -12) + C(180, y0 + 120, 40, ball('#ff8a65'), OL, 2.4) + P('M110 ' + (y0 + 128) + ' Q180 ' + (y0 + 150) + ' 252 ' + (y0 + 108), 0, OL, 2.4);
  s += P('M30 ' + (y0 + 330) + ' Q200 ' + (y0 + 290) + ' 400 ' + (y0 + 320) + ' Q600 ' + (y0 + 350) + ' 770 ' + (y0 + 300) + ' L770 ' + (y0 + 450) + ' L30 ' + (y0 + 450) + ' Z', vshade('#b0bec5'), OL, 2.6);
  [[140, 380, 40], [420, 400, 56], [650, 370, 34]].forEach(([x, y, w]) => { s += E(x, y0 + y, w, w * .3, '#90a4ae', OL, 2) + E(x, y0 + y - 3, w * .7, w * .18, '#78909c', 0); });
  // the Moon Base dome
  s += P('M300 ' + (y0 + 322) + ' A100 90 0 0 1 500 ' + (y0 + 322) + ' Z', lin([[0, '#e1f5fe'], [1, '#81d4fa']]), OL, 2.6) + R(280, y0 + 318, 240, 22, 8, vshade('#78909c'), OL, 2.4);
  s += L('M400 ' + (y0 + 232) + ' L400 ' + (y0 + 200), OL, 3) + P('M400 ' + (y0 + 200) + ' L436 ' + (y0 + 210) + ' L400 ' + (y0 + 220) + ' Z', '#ff5252', OL, 2);
  s += R(330, y0 + 280, 34, 28, 6, '#fff59d', OL, 2) + R(436, y0 + 280, 34, 28, 6, '#fff59d', OL, 2) + BT(400, y0 + 60, 'MOON BASE', 34, '#b3e5fc');
  return s;
}
function stagePage() {
  let s = '<g transform="rotate(180 400 255)">' + stageBack(30) + '</g>' + stageFront(520);
  s += FOLD('M14 500 L786 500') + R(220, 486, 360, 28, 14, '#fff', OL, 2) + T(400, 506, 'FOLD HERE, then stand it up like a tent!', 16, OL);
  s += T(400, 994, 'BONUS STAGE: one side is the Game Factory stage, turn it around for Moon Base!', 14, '#546e7a');
  return svgWrap(s);
}
// =====================================================================
// 🖱️ PICKING CHARACTERS (on screen)
// =====================================================================
const MAXPICK = 18;
let st = { pick: ['robo', 'nega', 'sammy', 'sparks', 'dusty', 'pink'], printed: 0 };
st = load(SAVEKEY, st);
st.pick = (Array.isArray(st.pick) ? st.pick : []).filter(k => ALLC[k]).slice(0, MAXPICK);
const HI = { robo: 'Robo is ready for the show!', nega: 'Nega-Robo joins in. Nice things only!', sammy: 'Sammy is here. Purr!', sparks: 'Woof! Sparks wants to play!', dusty: 'Dusty swishes onto the stage!',
  pink: 'Pink Robo fixes her bow. Ready!', baby: 'Baby Gloop says: again, again!', king: 'King Gloop wobbles on stage!', brick: 'Brick Robo clicks into place!', mag: 'Magnetron sticks the landing!',
  kraken: 'The Kraken King waves all his arms!', claude: 'Claude is here to help with the show!', mini: 'Mini Robo, reporting for duty!', duke: 'Duke Googool tips his fancy hat!',
  nova: 'Chaos Nova sparkles on stage!', maxx: 'Mothership Max lands on stage!', pinch: 'Captain Pinch snaps hello!', goo: 'Goo-Rilla thumps his chest!', heart: 'Laserheart joins the team!' };
function chips(keys, boss) {
  return keys.map(k => '<button class="who' + (boss ? ' boss' : '') + '" data-k="' + k + '">' + charThumb(k) + '<b>' + esc(nameOf(k)) + '</b><span class="num"></span></button>').join('');
}
function markChips() {
  document.querySelectorAll('.who').forEach(b => { const i = st.pick.indexOf(b.dataset.k); b.classList.toggle('sel', i >= 0); b.querySelector('.num').textContent = i >= 0 ? i + 1 : ''; });
}
let PAGES = [];
function buildPages() {
  const chunks = []; for (let i = 0; i < st.pick.length; i += 6) chunks.push(st.pick.slice(i, i + 6));
  PAGES = chunks.map((c, i) => ({ id: 'fig' + i, name: 'Figures sheet ' + (i + 1), build: () => figPage(c, i, chunks.length), how: 'Cut on the solid lines, fold on the dotted lines, glue the backs together.' }));
  PAGES.push({ id: 'stage', name: 'Bonus: the stage', build: stagePage, how: 'Fold it in half and stand it up like a tent. Turn it around for Moon Base!' });
}
function drawSheets() {
  buildPages(); const nf = PAGES.length - 1;
  $('sheetLab').textContent = nf ? '📄 Your ' + (nf > 1 ? nf + ' sheets' : 'sheet') + ' (' + st.pick.length + ' figures)' : '📄 Your sheet';
  if (!nf) { $('sheets').innerHTML = '<div class="empty">👈 Tap the characters you want!</div>'; return; }
  const was = COLOR; COLOR = true;
  $('sheets').innerHTML = PAGES.slice(0, nf).map(p => pageSVG(p)).join('');
  COLOR = was;
}
function save() { store(SAVEKEY, st); }
function refresh() { markChips(); drawSheets(); }
function tapChip(k) {
  const i = st.pick.indexOf(k);
  if (i >= 0) { st.pick.splice(i, 1); blip(420, 0, .14, 'triangle'); $('bubble').textContent = '👋 ' + nameOf(k) + ' left the sheet.'; }
  else if (st.pick.length >= MAXPICK) { oops(); $('bubble').textContent = '📄 That is ' + MAXPICK + ' figures, 3 whole sheets! Tap someone to take them off.'; return; }
  else { st.pick.push(k); blip(660 + st.pick.length * 30, 0, .14); blip(990, .08, .12); $('bubble').textContent = '🎭 ' + HI[k]; speak(HI[k], .95, 1.1); }
  save(); refresh();
}
window.onPrinted = () => { if (!st.printed) { st.printed = 1; save(); } if (!hasTrophy('standupFigures')) { trophy('standupFigures'); setTimeout(() => { toast('🏆 Trophy: Show Starter!', 3500); tada(); }, 600); } };
// ---------- start ----------
$('gFriends').innerHTML = chips(CK); $('gBosses').innerHTML = chips(BK, true);
initPrints();
document.addEventListener('click', e => { const b = e.target.closest('.who'); if (b) tapChip(b.dataset.k); });
$('bAll').onclick = () => { st.pick = AK.slice(0, MAXPICK); save(); refresh(); tada(); $('bubble').textContent = '🎉 Everybody is on the sheets! (Up to ' + MAXPICK + ' figures.)'; };
$('bClear').onclick = () => { st.pick = []; save(); refresh(); slide(600, 250, 0, .3); $('bubble').textContent = '🧹 All clear! Tap characters to add them.'; };
$('bDice').onclick = () => { const a = AK.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  st.pick = a.slice(0, 6); save(); refresh(); tune([523, 659, 784, 988], .09); $('bubble').textContent = '🎲 Surprise cast: ' + st.pick.map(nameOf).join(', ') + '!'; };
$('bPrint').onclick = () => { buildPages(); if (PAGES.length < 2) { oops(); $('bubble').textContent = '👈 Pick some characters first!'; return; } openPrints(0); };
$('bStage').onclick = () => { buildPages(); openPrints(PAGES.length - 1); };
$('sheets').onclick = () => { buildPages(); if (PAGES.length > 1) openPrints(0); };
refresh();
</script>
