<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🔮 Kaleidoscope Studio</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #dff3ff 0 36px, #cdeaff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #studio { position: absolute; inset: 0; display: flex; gap: 10px; padding: 10px; }
  /* ---------- tools (left) ---------- */
  #tools { width: 96px; flex: none; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .tool { font: inherit; font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 16px; box-shadow: 0 4px 0 #333;
    cursor: pointer; padding: 3px 2px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #222; }
  .tool i { font-style: normal; font-size: 30px; line-height: 1.05; }
  .tool span { font-size: 13px; }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #333; }
  .tool.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  /* ---------- the drawing board (middle) ---------- */
  #board { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; position: relative; }
  #cvWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { touch-action: none; cursor: crosshair; display: block; }
  /* ---------- side panel (right) ---------- */
  #side { width: min(36vw, 390px); flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 4px 10px 0; }
  #side h1 { margin: 0; text-align: center; font-size: clamp(22px, 2.8vw, 34px); color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 var(--accent, #ff3b30); letter-spacing: 1px; }
  #help { font-size: 16px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 5px 8px; font-weight: bold; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 7px; }
  .row3 .btn, .row4 .btn { font-size: 16px; padding: 5px 3px; }
  #pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; min-height: 34px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .lbl { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: -4px; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px; padding: 6px 8px; cursor: pointer;
    box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-sur { background: #9bf6ff; } .b-save { background: #8ef08e; } .b-gal { background: #ffd180; } .b-print { background: #c3a6ff; }
  .b-no { background: #ffc2d6; } .b-back { background: #9be3ff; }
  input[type=range] { width: 100%; height: 40px; accent-color: #ff3d6e; }
  .hide { display: none !important; }
  /* ---------- pop-up boxes ---------- */
  .ov { position: fixed; inset: 0; background: rgba(20, 30, 70, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1180px; max-height: 100%;
    display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3.2vw, 34px); }
  .cards { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 4px 4px 10px; }
  .pick { background: #f4f9ff; border: 4px solid #333; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .pick img { width: 100%; max-width: 150px; aspect-ratio: 1; object-fit: contain; display: block; border: 2px solid #999; border-radius: 8px; background: #222; cursor: pointer; }
  .pick .row2 { width: 100%; gap: 5px; }
  .pick .btn { font-size: 15px; min-height: 44px; padding: 3px; border-radius: 12px; box-shadow: 0 3px 0 #333; }
  .pick .btn.armed { background: #ff3b30; color: #fff; }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 22px; padding: 30px; }
  #askCard { max-width: 640px; text-align: center; }
  #askText { font-size: 26px; font-weight: bold; }
  #askBtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  #askBtns .btn { font-size: 22px; min-height: 64px; }
  #prCard { max-width: 760px; align-items: center; }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(58vh, 640px); width: auto; max-width: 100%; border: 4px solid #333; border-radius: 8px; background: #fff; }
  #prCard .row3 { width: 100%; }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; pointer-events: none; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #studio { flex-wrap: wrap; align-content: flex-start; overflow-y: auto; }
    #tools { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .tool { min-width: 76px; }
    #board { width: 100%; flex: none; height: 58vh; }
    #side { width: 100%; overflow: visible; }
    #pal { display: flex; flex-wrap: wrap; justify-content: center; }
    #pal .sw { width: 54px; height: 54px; min-height: 0; flex: none; }
  }
  @media (max-height: 600px) { .tool { min-height: 54px; } .tool i { font-size: 24px; } .btn { min-height: 46px; font-size: 16px; } #help { font-size: 14px; } .sw { min-height: 26px; } }
  /* ---------- PRINT: only the printed sheet ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  body { --accent: #b04dff; background: radial-gradient(circle at 50% 40%, #f3e1ff, #c9b6ff 60%, #9d8cff); }
  #cv { border-radius: 50%; border: 6px solid #333; box-shadow: 0 0 0 8px #ffd60a, 0 0 0 13px #333, 0 10px 30px rgba(60, 0, 120, .45); }
  .tool.stamp i { font-size: 28px; }
</style>
</head>
<body>
<div id="studio">
  <div id="tools">
    <button class="tool" data-b="pen"><i>✏️</i><span>Pen</span></button>
    <button class="tool" data-b="rainbow"><i>🌈</i><span>Rainbow</span></button>
    <button class="tool" data-b="sparkle"><i>✨</i><span>Sparkles</span></button>
    <button class="tool stamp" data-b="star"><i>⭐</i><span>Stars</span></button>
    <button class="tool stamp" data-b="heart"><i>💗</i><span>Hearts</span></button>
    <button class="tool stamp" data-b="robo"><i>🤖</i><span>Robo</span></button>
    <button class="tool" id="tUndo"><i>↩️</i><span>Undo</span></button>
    <button class="tool" id="tClear"><i>🗑️</i><span>Clear</span></button>
  </div>
  <div id="board">
    <div id="cvWrap"><canvas id="cv" width="640" height="640"></canvas></div>
  </div>
  <div id="side">
    <h1>🔮 KALEIDOSCOPE</h1>
    <div id="help">Draw in the circle! Every line copies itself all the way around. ✨</div>
    <div class="lbl">🍕 Slices</div>
    <div class="row4" id="slices">
      <button class="btn" data-n="4">4</button><button class="btn" data-n="6">6</button>
      <button class="btn" data-n="8">8</button><button class="btn" data-n="12">12</button>
    </div>
    <div class="row2">
      <button class="btn" id="bMirror">🪞 Mirror: ON</button>
      <button class="btn" id="bBg">🌙 Dark</button>
    </div>
    <div class="lbl">🖌️ Brush size</div>
    <div class="row3" id="sizes">
      <button class="btn" data-s="4">• Thin</button><button class="btn" data-s="10">● Medium</button><button class="btn" data-s="20">⬤ Fat</button>
    </div>
    <div class="lbl">🎨 Colors</div>
    <div id="pal"></div>
    <div class="row3">
      <button class="btn b-sur" id="bSurprise">🎲 Surprise!</button>
      <button class="btn b-save" id="bSave">💾 Save</button>
      <button class="btn b-gal" id="bGallery">🖼️ Gallery</button>
    </div>
    <button class="btn b-print" id="bPrint">🖨️ Print it (coloring page!)</button>
  </div>
</div>
<div class="ov" id="galBox"><div class="card"><h2 id="galTitle">🖼️ My Gallery</h2>
  <div class="cards" id="galList"></div>
  <button class="btn b-back" id="bGalClose">⬅️ Back to making art</button></div></div>
<div class="ov" id="askBox"><div class="card" id="askCard"><div id="askText"></div><div id="askBtns"></div></div></div>
<div class="ov" id="prBox"><div class="card" id="prCard"><h2>🖨️ Print my picture</h2>
  <div class="row2" style="width:100%"><button class="btn mode" id="prBW">⚫ Black &amp; White</button><button class="btn mode" id="prCol">🌈 Color</button></div>
  <div id="prHow" style="font-size:18px;font-weight:bold;text-align:center"></div>
  <div id="prBig"></div>
  <div class="row2" style="width:100%"><button class="btn b-save" id="prGo">🖨️ Print it!</button><button class="btn b-back" id="prClose">⬅️ Back</button></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// SHARED ART-ROOM HELPERS (same in Kaleidoscope, Spin Art, Glow Pegs, Sand Art):
// soft sounds, toast, yes/no box, trophy, undo, 🖼️ gallery (12 pictures), 🖨️ print with ⚫ B&W / 🌈 Color.
// Each file fills in APP = { key, trophy, trophyMsg, title, getState, setState, snap, load, printCanvas, isEmpty, clear }.
// =====================================================================
const $ = id => document.getElementById(id);
const MAX_ART = 12;
// ---------- soft sounds (master volume 0.1) ----------
let actx = null, master = null;
function AC() {
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.1; master.connect(actx.destination); }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function blip(f, when, len, type, vol) {
  try {
    const a = AC(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0), l = len || 0.2;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.4, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + l);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + l + 0.03);
  } catch (_) {}
}
const tune = (notes, gap) => notes.forEach((f, i) => blip(f, i * (gap || 0.13), 0.35));
const tada = () => tune([523, 659, 784, 1047, 1319], .12);
let lastTick = 0;
function tick(f) { const n = performance.now(); if (n - lastTick < 70) return; lastTick = n; blip(f || 900 + Math.random() * 500, 0, .06, 'sine', .15); }
// ---------- toast + yes/no box ----------
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), ms || 2600);
}
function openBox(id) { document.querySelectorAll('.ov').forEach(b => b.classList.toggle('on', b.id === id + 'Box')); }
function closeBoxes() { openBox(''); }
function ask(text, opts) {
  $('askText').textContent = text; $('askBtns').innerHTML = '';
  opts.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + cls; b.textContent = label;
    b.onclick = () => { closeBoxes(); blip(600, 0, .1); if (fn) fn(); }; $('askBtns').appendChild(b); });
  openBox('ask'); blip(520, 0, .12);
}
// ---------- trophy ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function hasTrophy(id) { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}')[id]; } catch (_) { return false; } }
// ---------- ↩️ undo ----------
const undoStack = [];
function pushUndo() { undoStack.push(APP.getState()); if (undoStack.length > (APP.undoMax || 25)) undoStack.shift(); }
function undo() { if (!undoStack.length) { toast('↩️ Nothing to undo!'); return; } APP.setState(undoStack.pop()); blip(440, 0, .12, 'triangle'); }
function askClear() {
  ask('🗑️ Clear the whole picture?', [['✅ Yes, clear it', 'b-no', () => { pushUndo(); APP.clear(); toast('🧽 All clean!'); }], ['❌ No, keep it', 'b-back', null]]);
}
// ---------- 🖼️ gallery: localStorage APP.key = { art: [{ img, data, t }], saved } ----------
let gal = { art: [], saved: 0 };
function galLoad() { try { const s = JSON.parse(localStorage.getItem(APP.key) || 'null'); if (s && Array.isArray(s.art)) gal = { art: s.art.slice(0, MAX_ART), saved: s.saved || 0 }; } catch (_) {} }
function galStore() { try { localStorage.setItem(APP.key, JSON.stringify(gal)); return true; } catch (_) { return false; } }
function saveArt() {
  if (APP.isEmpty()) { toast('🎨 Make some art first!'); return; }
  if (gal.art.length >= MAX_ART) { toast('🖼️ Your gallery is full (12)! Delete one first.', 3400); openGallery(); return; }
  const item = Object.assign({ t: Date.now() }, APP.snap());
  gal.art.unshift(item); gal.saved++;
  if (!galStore()) { gal.art.shift(); gal.saved--; toast('😮 No room to save! Delete an old picture first.', 3400); return; }
  if (!hasTrophy(APP.trophy)) { trophy(APP.trophy); setTimeout(tada, 300); toast(APP.trophyMsg, 4200); }
  else { tune([660, 880, 1047]); toast('💾 Saved in your gallery!'); }
}
function openGallery() { openBox('gal'); renderGallery(); blip(660, 0, .1); }
function renderGallery() {
  $('galTitle').textContent = '🖼️ My Gallery (' + gal.art.length + ' / ' + MAX_ART + ')';
  $('galList').innerHTML = gal.art.length ? gal.art.map((a, i) => `<div class="pick"><img src="${a.img}" data-i="${i}" data-a="open" alt="">
    <div class="row2"><button class="btn b-save" data-i="${i}" data-a="open">📂 Open</button><button class="btn b-no" data-i="${i}" data-a="del">🗑️</button></div></div>`).join('')
    : '<div class="empty">No pictures yet! Make some art, then tap 💾 Save.</div>';
}
function galClick(e) {
  const b = e.target.closest('[data-a]'); if (!b) return;
  const i = +b.dataset.i, a = gal.art[i]; if (!a) return;
  if (b.dataset.a === 'open') { pushUndo(); APP.load(a); closeBoxes(); tune([523, 784]); toast('📂 Here it is!'); }
  else if (b.dataset.a === 'del') {
    if (!b.classList.contains('armed')) { b.classList.add('armed'); b.textContent = '🗑️ Sure?'; blip(330, 0, .15, 'triangle');
      setTimeout(() => { if (b.isConnected) { b.classList.remove('armed'); b.textContent = '🗑️'; } }, 2500); return; }
    gal.art.splice(i, 1); galStore(); renderGallery(); blip(220, 0, .2, 'triangle'); toast('🗑️ Deleted!');
  }
}
// ---------- canvas helpers ----------
function mkCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; }
// a small picture of a canvas for the gallery (JPEG keeps the save small)
function shrink(src, size, bg, type) {
  const s = size / Math.max(src.width, src.height), c = mkCanvas(Math.round(src.width * s), Math.round(src.height * s)), x = c.getContext('2d');
  x.fillStyle = bg || '#fff'; x.fillRect(0, 0, c.width, c.height); x.imageSmoothingQuality = 'high'; x.drawImage(src, 0, 0, c.width, c.height);
  return c.toDataURL(type || 'image/jpeg', 0.78);
}
function loadImg(url) { return new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; }); }
// ✏️ line art: black lines wherever the color changes, on white (for coloring in).
// Colors that differ by more than thr across a pixel become lines (thick = extra fatness), then it's scaled up by `up` and made crisp.
function lineArt(src, up, thr, thick) {
  const W = src.width, H = src.height, d = src.getContext('2d').getImageData(0, 0, W, H).data, edge = new Uint8Array(W * H);
  const diff = (p, q) => Math.abs(d[p] - d[q]) + Math.abs(d[p + 1] - d[q + 1]) + Math.abs(d[p + 2] - d[q + 2]);
  for (let y = 1; y < H - 1; y++) for (let i = 1; i < W - 1; i++) {
    const p = (y * W + i) * 4;
    if (diff(p - 4, p + 4) > thr || diff(p - W * 4, p + W * 4) > thr || diff(p - W * 4 - 4, p + W * 4 + 4) > thr * 1.3 || diff(p - W * 4 + 4, p + W * 4 - 4) > thr * 1.3) edge[y * W + i] = 1;
  }
  const sm = mkCanvas(W, H), sx = sm.getContext('2d'), img = sx.createImageData(W, H), o = img.data, k = thick || 0;
  for (let y = 0; y < H; y++) for (let i = 0; i < W; i++) {
    let on = 0;
    for (let dy = -k; dy <= k && !on; dy++) { const yy = y + dy; if (yy < 0 || yy >= H) continue; for (let dx = -k; dx <= k; dx++) { const xx = i + dx; if (xx >= 0 && xx < W && edge[yy * W + xx]) { on = 1; break; } } }
    const p = (y * W + i) * 4, v = on ? 0 : 255; o[p] = o[p + 1] = o[p + 2] = v; o[p + 3] = 255;
  }
  sx.putImageData(img, 0, 0);
  const c = mkCanvas(Math.round(W * up), Math.round(H * up)), x = c.getContext('2d');
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high'; x.drawImage(sm, 0, 0, c.width, c.height);
  const big = x.getImageData(0, 0, c.width, c.height), b = big.data;
  for (let i = 0; i < b.length; i += 4) { const v = b[i] < 165 ? 20 : 255; b[i] = b[i + 1] = b[i + 2] = v; }
  x.putImageData(big, 0, 0); return c;
}
// ---------- 🖨️ print: ⚫ Black & White (default, line art to color in) or 🌈 Color, remembered ----------
let COLOR = false;
function loadColor() { try { COLOR = localStorage.getItem(APP.key + 'Color') === '1'; } catch (_) {} }
function setColor(c) { COLOR = c; try { localStorage.setItem(APP.key + 'Color', c ? '1' : '0'); } catch (_) {} showPrint(); blip(c ? 880 : 520, 0, .12); }
const xmlEsc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
function pageSVG() {
  const cv = APP.printCanvas(!COLOR), url = cv.toDataURL('image/png');
  const top = 118, bot = 990, aw = 736, ah = bot - top, s = Math.min(aw / cv.width, ah / cv.height), w = cv.width * s, h = cv.height * s;
  const sub = COLOR ? 'Made by Ben' : 'Made by Ben  -  color it in!';
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 816 1056" preserveAspectRatio="xMidYMid meet">
    <rect x="0" y="0" width="816" height="1056" fill="#fff"/>
    <rect x="14" y="14" width="788" height="1028" rx="26" fill="none" stroke="${COLOR ? APP.ink || '#333' : '#222'}" stroke-width="5"/>
    <text x="408" y="82" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, sans-serif" font-size="46" font-weight="bold" fill="#222">${xmlEsc(APP.title)}</text>
    <image href="${url}" x="${(816 - w) / 2}" y="${top + (ah - h) / 2}" width="${w}" height="${h}" preserveAspectRatio="none"/>
    <text x="408" y="1024" text-anchor="middle" font-family="Comic Sans MS, Chalkboard SE, sans-serif" font-size="24" fill="#555">${sub}</text></svg>`;
}
function showPrint() {
  $('prBW').classList.toggle('sel', !COLOR); $('prCol').classList.toggle('sel', COLOR);
  $('prHow').textContent = COLOR ? '🌈 Your picture in full color!' : '⚫ Line art to color in with crayons!';
  $('prBig').innerHTML = pageSVG();
}
function openPrint() { if (APP.isEmpty()) { toast('🎨 Make some art first!'); return; } openBox('pr'); showPrint(); blip(700, 0, .1); }
function doPrint() {
  $('printArea').innerHTML = $('prBig').innerHTML; toast('🖨️ Printing!');
  setTimeout(() => { try { window.print(); } catch (_) {} }, 80);
}
// ---------- wire up the shared buttons ----------
function initShared() {
  galLoad(); loadColor();
  $('tUndo').onclick = undo; $('tClear').onclick = askClear;
  $('bSave').onclick = saveArt; $('bGallery').onclick = openGallery; $('bPrint').onclick = openPrint;
  $('galList').onclick = galClick; $('bGalClose').onclick = () => { closeBoxes(); blip(440, 0, .1); };
  $('prBW').onclick = () => setColor(false); $('prCol').onclick = () => setColor(true);
  $('prGo').onclick = doPrint; $('prClose').onclick = () => { closeBoxes(); blip(440, 0, .1); };
  window.addEventListener('afterprint', () => { $('printArea').innerHTML = ''; });
  window.addEventListener('keydown', e => {
    if (e.key === 'Escape' && document.querySelector('.ov.on')) closeBoxes();
    if ((e.metaKey || e.ctrlKey) && e.key === 'z') { e.preventDefault(); undo(); }
  });
  document.querySelectorAll('.ov').forEach(o => o.addEventListener('click', e => { if (e.target === o && o.id !== 'askBox') closeBoxes(); }));

// fit the square-ish canvas into its box (CSS size only; the drawing size stays the same)
function fitCanvas(cv, ratio) {
  const wrap = $('cvWrap'), W = wrap.clientWidth - 8, H = wrap.clientHeight - 8, r = ratio || 1;
  let w = Math.min(W, H / r); w = Math.max(160, Math.floor(w)); cv.style.width = w + 'px'; cv.style.height = Math.floor(w * r) + 'px';
}
// where a pointer is, in canvas pixels
function cvPos(cv, e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * cv.width / r.width, y: (e.clientY - r.top) * cv.height / r.height }; }
// =====================================================================
// 🔮 KALEIDOSCOPE STUDIO: draw in a round window and every stroke copies itself into 4 / 6 / 8 / 12 slices
// (with 🪞 mirror: every other slice is flipped, like a real kaleidoscope). Brushes: pen, rainbow pen,
// sparkles, and stamps (stars, hearts, Robo heads). 🎲 Surprise draws a pattern by itself.
// Save: localStorage 'gfKaleido' (gallery) + 'gfKaleidoColor' (print mode). Trophy: 'kaleidoscope'.
// =====================================================================
const cv = $('cv'), ctx = cv.getContext('2d'), S = cv.width, C = S / 2, R = S / 2 - 2;
const art = mkCanvas(S, S), ax = art.getContext('2d');       // the drawing (see-through), shown on top of the background
const COLS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#a8e61d', '#2ecc40', '#1abc9c', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#ffffff', '#111111'];
const BG = { dark: '#14142e', white: '#ffffff' };
let brush = 'pen', color = COLS[8], size = 10, slices = 8, mirror = true, bg = 'dark', marks = 0, hue = 0;
// ---------- drawing all the copies ----------
// fn(x) draws ONE copy in "slice space" (center = 0,0); it gets called once for every slice
function eachCopy(fn) {

function line(x0, y0, x1, y1, col, w) {

}
function sparkle(px, py, col, w) {

    dots.push([px + Math.cos(a) * d, py + Math.sin(a) * d, 1.5 + Math.random() * w * .45, Math.random() < .35 ? '#fff' : (col === 'rainbow' ? 'hsl(' + Math.floor(Math.random() * 360) + ',100%,60%)' : col), Math.random() < .3]); }

}
// ---------- stamp shapes (drawn at 0,0, size s) ----------
function starPath(x, s) { x.beginPath(); for (let i = 0; i < 10; i++) { const r = i % 2 ? s * .42 : s, a = -Math.PI / 2 + i * Math.PI / 5; x.lineTo(Math.cos(a) * r, Math.sin(a) * r); } x.closePath(); }
function heartPath(x, s) {

  x.bezierCurveTo(-s * 1.3, 0, -s * .7, -s * 1.05, 0, -s * .4); x.bezierCurveTo(s * .7, -s * 1.05, s * 1.3, 0, 0, s * .9); x.closePath();
}
function rrect(x, a, b, w, h, r) { x.beginPath(); x.moveTo(a + r, b); x.arcTo(a + w, b, a + w, b + h, r); x.arcTo(a + w, b + h, a, b + h, r); x.arcTo(a, b + h, a, b, r); x.arcTo(a, b, a + w, b, r); x.closePath(); }
function drawStamp(x, kind, s, col) {
  const dark = col === '#111111' ? '#ffffff' : '#111111';
  x.lineWidth = Math.max(2, s * .12); x.strokeStyle = dark; x.lineJoin = 'round';
  if (kind === 'star') { starPath(x, s); x.fillStyle = col; x.fill(); x.stroke(); }
  else if (kind === 'heart') { heartPath(x, s); x.fillStyle = col; x.fill(); x.stroke(); }
  else { // 🤖 Robo head: antenna, head, eyes, smile
    x.beginPath(); x.moveTo(0, -s * .7); x.lineTo(0, -s * 1.05); x.stroke(); x.beginPath(); x.arc(0, -s * 1.1, s * .16, 0, Math.PI * 2); x.fillStyle = '#ff3b30'; x.fill(); x.stroke();
    rrect(x, -s * .85, -s * .7, s * 1.7, s * 1.4, s * .3); x.fillStyle = col; x.fill(); x.stroke();
    [-1, 1].forEach(e => { x.beginPath(); x.arc(e * s * .38, -s * .12, s * .24, 0, Math.PI * 2); x.fillStyle = '#fff'; x.fill(); x.stroke();
      x.beginPath(); x.arc(e * s * .38, -s * .1, s * .1, 0, Math.PI * 2); x.fillStyle = '#1e6bff'; x.fill(); });

}
function stamp(px, py, kind, col, s) {
  const ang = Math.atan2(py, px) + Math.PI / 2;   // stamps lean out from the middle, like flower petals
  eachCopy(x => { x.translate(px, py); x.rotate(ang); drawStamp(x, kind, s, col); });
}
// ---------- what's on screen: background + faint slice lines + the drawing ----------
function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, S, S);
  ctx.fillStyle = BG[bg]; ctx.beginPath(); ctx.arc(C, C, R + 2, 0, Math.PI * 2); ctx.fill();
  const n = mirror ? slices : slices; ctx.strokeStyle = bg === 'dark' ? 'rgba(255,255,255,.13)' : 'rgba(0,0,80,.12)'; ctx.lineWidth = 2;
  for (let k = 0; k < n; k++) { const a = k * Math.PI * 2 / n; ctx.beginPath(); ctx.moveTo(C, C); ctx.lineTo(C + Math.cos(a) * R, C + Math.sin(a) * R); ctx.stroke(); }

// the finished picture on a background (for saving and color printing)
function composite(bgCol) {
  const c = mkCanvas(S, S), x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, S, S);
  x.fillStyle = bgCol; x.beginPath(); x.arc(C, C, R, 0, Math.PI * 2); x.fill(); x.drawImage(art, 0, 0); return c;
}
// ---------- finger / mouse drawing ----------
let down = false, last = null, travel = 0;
const stampSize = () => size * 1.6 + 8;
function local(e) { const p = cvPos(cv, e); return { x: p.x - C, y: p.y - C }; }
function paint(a, b) {    // draw from point a to point b with the current brush
  if (brush === 'pen') line(a.x, a.y, b.x, b.y, color, size);
  else if (brush === 'rainbow') { hue = (hue + 4) % 360; line(a.x, a.y, b.x, b.y, 'hsl(' + hue + ',100%,55%)', size); }
  else if (brush === 'sparkle') sparkle(b.x, b.y, color, size);
  else { travel += Math.hypot(b.x - a.x, b.y - a.y); if (a === b || travel > stampSize() * 2.2) { travel = 0; stamp(b.x, b.y, brush, color, stampSize()); } }
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); AC(); try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pushUndo(); down = true; travel = 0; last = local(e); paint(last, last); render(); tick();
});
cv.addEventListener('pointermove', e => {
  if (!down) return; const p = local(e);
  if (Math.hypot(p.x - last.x, p.y - last.y) < 2) return;
  paint(last, p); last = p; render(); tick(brush === 'rainbow' ? 600 + hue * 2 : undefined);
});
const penUp = () => { down = false; last = null; };
cv.addEventListener('pointerup', penUp); cv.addEventListener('pointercancel', penUp);
// ---------- 🎲 Surprise pattern: the kaleidoscope draws by itself ----------
let auto = [], autoOn = false;
function surprise() {
  pushUndo(); ax.clearRect(0, 0, S, S); marks = 0;
  slices = [6, 8, 12][Math.floor(Math.random() * 3)]; mirror = true; syncButtons();
  const pick = () => COLS[Math.floor(Math.random() * (bg === 'dark' ? 11 : 10))], rnd = (a, b) => a + Math.random() * (b - a);
  auto = [];
  // wiggly lines growing out from the middle
  for (let s = 0; s < 4; s++) {
    const col = Math.random() < .3 ? 'rainbow' : pick(), w = [4, 8, 14][s % 3], a0 = rnd(.1, .5), wig = rnd(.12, .4), f = rnd(.8, 2.2), r0 = rnd(10, 80);
    let prev = null;
    for (let r = r0; r < R - 10; r += 6) { const a = a0 + Math.sin(r / 45 * f) * wig, p = { x: Math.cos(a) * r, y: Math.sin(a) * r };
      if (prev) auto.push({ b: col === 'rainbow' ? 'rainbow' : 'pen', c: col, s: w, a: prev, p }); prev = p; }
  }
  // rings of stamps and sparkles
  ['star', 'heart', 'robo', 'star'].sort(() => Math.random() - .5).slice(0, 2).forEach((k, i) => {
    const r = i ? rnd(R * .62, R * .8) : rnd(R * .3, R * .45), a = rnd(0, .4), p = { x: Math.cos(a) * r, y: Math.sin(a) * r };
    auto.push({ b: k, c: pick(), s: [4, 10][i], a: p, p });
  });
  for (let i = 0; i < 14; i++) { const r = rnd(30, R - 15), a = rnd(0, Math.PI / slices), p = { x: Math.cos(a) * r, y: Math.sin(a) * r }; auto.push({ b: 'sparkle', c: Math.random() < .5 ? 'rainbow' : pick(), s: 8, a: p, p }); }

}
function autoStep() {
  const keep = { brush, color, size }; travel = 0;
  for (let i = 0; i < 4 && auto.length; i++) { const s = auto.shift(); brush = s.b; color = s.c === 'rainbow' && s.b !== 'sparkle' ? color : s.c; size = s.s; paint(s.a, s.p); }
  brush = keep.brush; color = keep.color; size = keep.size; render();
  if (auto.length) { if (Math.random() < .3) tick(); requestAnimationFrame(autoStep); } else autoOn = false;
}
// ---------- the shared helpers' hooks ----------
const APP = {
  key: 'gfKaleido', trophy: 'kaleidoscope', title: "Ben's Kaleidoscope", ink: '#7b2cbf', undoMax: 15,
  trophyMsg: '🏆 KALEIDOSCOPE trophy! You saved your first pattern!',
  getState: () => ({ d: ax.getImageData(0, 0, S, S), m: marks }),
  setState: st => { ax.putImageData(st.d, 0, 0); marks = st.m; render(); },
  isEmpty: () => marks === 0,
  clear: () => { auto = []; ax.clearRect(0, 0, S, S); marks = 0; render(); },
  snap: () => ({ img: shrink(composite(BG[bg]), 420), bg }),
  load: item => loadImg(item.img).then(im => {
    if (!im) return; auto = []; bg = item.bg === 'white' ? 'white' : 'dark'; ax.clearRect(0, 0, S, S); ax.drawImage(im, 0, 0, S, S);
    // take the background color back out, so the 🌙/☀️ switch still works
    const d = ax.getImageData(0, 0, S, S), p = d.data, b = bg === 'dark' ? [20, 20, 46] : [255, 255, 255];
    for (let i = 0; i < p.length; i += 4) { const x = (i / 4) % S - C, y = Math.floor(i / 4 / S) - C;
      if (x * x + y * y > (R - 3) * (R - 3) || Math.abs(p[i] - b[0]) + Math.abs(p[i + 1] - b[1]) + Math.abs(p[i + 2] - b[2]) < 50) p[i + 3] = 0; }
    ax.putImageData(d, 0, 0); marks = 1; syncButtons(); render();
  }),
  printCanvas: bw => {
    if (!bw) { const c = mkCanvas(S * 2, S * 2), x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(composite(BG[bg]), 0, 0, S * 2, S * 2); return c; }
    const la = lineArt(composite('#808080'), 2, 110, 0), x = la.getContext('2d');   // a mandala to color in
    x.strokeStyle = '#141414'; x.lineWidth = 6; x.beginPath(); x.arc(S, S, R * 2 - 1, 0, Math.PI * 2); x.stroke(); return la;
  },
};
// ---------- buttons ----------
function syncButtons() {
  document.querySelectorAll('[data-b]').forEach(b => b.classList.toggle('on', b.dataset.b === brush));
  document.querySelectorAll('#slices .btn').forEach(b => b.classList.toggle('on', +b.dataset.n === slices));
  document.querySelectorAll('#sizes .btn').forEach(b => b.classList.toggle('on', +b.dataset.s === size));
  document.querySelectorAll('.sw').forEach(b => b.classList.toggle('sel', b.dataset.c === color));
  $('bMirror').textContent = mirror ? '🪞 Mirror: ON' : '🪞 Mirror: OFF'; $('bMirror').classList.toggle('on', mirror);
  $('bBg').textContent = bg === 'dark' ? '🌙 Dark' : '☀️ White';
}
function init() {
  initShared();
  $('pal').innerHTML = COLS.map(c => `<div class="sw" data-c="${c}" style="background:${c}"></div>`).join('');
  $('pal').onclick = e => { const s = e.target.closest('.sw'); if (!s) return; color = s.dataset.c; if (brush === 'rainbow') brush = 'pen'; syncButtons(); blip(500 + COLS.indexOf(color) * 60, 0, .12); };
  document.querySelectorAll('[data-b]').forEach(b => b.onclick = () => { brush = b.dataset.b; syncButtons(); blip(700, 0, .1); });
  document.querySelectorAll('#slices .btn').forEach(b => b.onclick = () => { slices = +b.dataset.n; syncButtons(); render(); blip(400 + slices * 40, 0, .12); });
  document.querySelectorAll('#sizes .btn').forEach(b => b.onclick = () => { size = +b.dataset.s; syncButtons(); blip(900 - size * 20, 0, .1); });
  $('bMirror').onclick = () => { mirror = !mirror; syncButtons(); blip(mirror ? 880 : 440, 0, .12); toast(mirror ? '🪞 Mirror ON: every other slice flips!' : '🪞 Mirror OFF: the slices just spin around!'); };
  $('bBg').onclick = () => { bg = bg === 'dark' ? 'white' : 'dark'; syncButtons(); render(); blip(600, 0, .12); };
  $('bSurprise').onclick = surprise;
  const fit = () => fitCanvas(cv); addEventListener('resize', fit); fit();
  syncButtons(); render();
}
init();
