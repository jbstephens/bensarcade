<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { background: #14102a; }   /* no white strip peeking out on the iPad */
  body { min-height: 100dvh; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", sans-serif;
    background: radial-gradient(circle at 50% 0%, #4a3480, #14102a 70%);
    color: #2d2340; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  .gear { position: fixed; font-size: 140px; opacity: .1; animation: spin 14s linear infinite; pointer-events: none; }
  .g1 { top: -40px; left: -40px; } .g2 { bottom: 30px; right: -40px; font-size: 180px; animation-direction: reverse; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---- the book ---- */
  .stage { display: flex; align-items: center; gap: 18px; padding: 0 16px; position: relative; z-index: 1; }   /* above the night sky and party floaters */
  .book {
    position: relative; width: 640px; aspect-ratio: 4 / 3.2; perspective: 2200px;
  }
  .book::after {                               /* the spine / page edges */
    content: ""; position: absolute; top: 6px; bottom: -10px; right: -12px; left: 12px; z-index: -1;
    border-radius: 6px 22px 22px 6px; background: repeating-linear-gradient(0deg, #f3e9d2 0 3px, #d9ccae 3px 4px);
    box-shadow: 0 20px 40px rgba(0,0,0,.5);
  }
  .page {
    position: absolute; inset: 0; border-radius: 6px 22px 22px 6px; overflow: hidden;
    background: #fffaf0; box-shadow: inset 18px 0 24px -14px rgba(0,0,0,.35);
    transform-origin: left center; backface-visibility: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
    padding: 4% 7%;
  }
  .page.turning { transition: transform .7s ease-in-out; z-index: 3; }
  .page.flipped { transform: rotateY(-180deg); }
  .page.under { z-index: 1; }
  .page.top { z-index: 2; }

  .pageNum { position: absolute; bottom: 12px; right: 22px; font-size: 16px; color: #9a8a70; }
  .corner { position: absolute; bottom: 0; right: 0; width: 46px; height: 46px; background: linear-gradient(135deg, transparent 50%, #e8dcc0 50%); border-radius: 0 0 22px 0; }

  /* cover */
  .cover { background: linear-gradient(160deg, #66bb6a, #1b5e20); color: #fff; box-shadow: inset 22px 0 30px -16px rgba(0,0,0,.5); }
  .cover h1 { font-size: 64px; margin: 0; color: #ffe34d; text-shadow: 4px 4px 0 #0b3d14, 0 0 20px rgba(255,227,77,.6); line-height: 1.05; }
  .cover .icons { font-size: 30px; margin: 12px 0; letter-spacing: 3px; line-height: 1.25; }   /* small so all the games fit on the cover */
  .cover p { font-size: 22px; margin: 4px 0; }
  .cover .open { margin-top: 18px; font-size: 20px; background: rgba(0,0,0,.25); padding: 8px 22px; border-radius: 999px; animation: pulse 1.2s infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }

  /* contents */
  .contents h2 { margin: 0 0 10px; font-size: 30px; color: #ff5aa5; }
  .toc { list-style: none; padding: 0; margin: 0; width: 100%; max-width: 560px; text-align: left; columns: 2; column-gap: 22px; }   /* two columns so all the games fit */
  .toc li { display: flex; align-items: baseline; gap: 6px; font-size: 13px; padding: 0 6px; break-inside: avoid; border-radius: 10px; cursor: pointer; }
  .toc li:hover { background: #fff0c4; }
  .toc .dots { flex: 1; border-bottom: 3px dotted #c9b89a; transform: translateY(-5px); }

  /* game pages */
  .pic { width: 100%; height: 42%; border-radius: 18px; background: var(--c); display: flex; align-items: center; justify-content: center; position: relative; box-shadow: inset 0 -8px 0 rgba(0,0,0,.15); }
  .pic .icon { font-size: 100px; animation: float 2s ease-in-out infinite alternate; }
  .pic .mini { position: absolute; font-size: 34px; opacity: .9; }
  @keyframes float { to { transform: translateY(-10px) rotate(-5deg); } }
  .game h2 { margin: 12px 0 4px; font-size: 42px; color: var(--t); text-shadow: 2px 2px 0 rgba(0,0,0,.12); }
  .game .desc { font-size: 19px; margin: 0 0 6px; }
  .game .ctrl { font-size: 15px; color: #7a6a58; margin: 0 0 10px; }
  .playBtn {
    font: inherit; font-size: 24px; color: #fff; cursor: pointer; border: none;
    padding: 8px 40px; border-radius: 999px; background: var(--t);
    box-shadow: 0 6px 0 rgba(0,0,0,.3); transition: transform .1s;
  }
  .playBtn:hover { transform: scale(1.07); }
  .playBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.3); }

  /* back cover */
  .end { background: linear-gradient(160deg, #26c6da, #3949ab); color: #fff; }
  /* trophy room */
  .trophies { background: linear-gradient(160deg, #3e2723, #1b0f0a); color: #fff; padding: 3% 4%; }
  .trophies h2 { margin: 0; font-size: 34px; color: #ffd740; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .trophies .count { font-size: 16px; color: #ffe0b2; margin: 2px 0 4px; }
  .shelf { display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px; width: 100%; }
  .tro { background: rgba(255,255,255,.08); border-radius: 12px; padding: 3px 3px; line-height: 1.05; cursor: pointer; }   /* tap one to see how to win it */
  .tro .ic { font-size: 28px; display: block; }
  .tro b { display: block; font-size: 12px; color: #ffd740; }
  .troInfo { font-size: 15px; color: #ffe0b2; min-height: 22px; margin-top: 6px; }
  .tro i { display: block; font-size: 9px; font-style: normal; color: #d7ccc8; }
  .tro.no { opacity: .45; } .tro.no .ic { filter: grayscale(1) brightness(.6); }
  .tro.yes { background: rgba(255,215,64,.18); box-shadow: 0 0 0 2px #ffd740 inset; }
  .tropBtn { margin-left: 10px; font-size: 16px; background: #ffd740; color: #5d4037; border-radius: 999px; padding: 4px 12px; cursor: pointer; vertical-align: middle; }
  /* puzzle room */
  .puzzle { background: linear-gradient(160deg, #1a237e, #0d0a2b); color: #fff; padding: 3% 4%; }
  .puzzle h2 { margin: 0; font-size: 34px; color: #80d8ff; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .puzzle .count { font-size: 16px; color: #b3e5fc; margin: 2px 0 8px; }
  .board { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; width: 540px; aspect-ratio: 8 / 5; background: rgba(0,0,0,.35); padding: 3px; border-radius: 10px; }
  .board.done { gap: 0; padding: 0; box-shadow: 0 0 0 4px #ffd740, 0 0 30px #ffd740; animation: glow 1s infinite alternate; }
  @keyframes glow { to { box-shadow: 0 0 0 4px #fff, 0 0 50px #ffd740; } }
  .pz { border-radius: 6px; background-size: 500% 400%; position: relative; }
  .board.done .pz { border-radius: 0; }
  .pz.no { background: rgba(255,255,255,.07) !important; border: 2px dashed rgba(255,255,255,.25); display: flex; align-items: center; justify-content: center; font-size: 22px; filter: grayscale(1); opacity: .6; }
  .pz.yes { animation: pop .5s ease-out; }
  @keyframes pop { from { transform: scale(.3) rotate(-20deg); opacity: 0; } }
  .puzzle .msg { margin-top: 8px; font-size: 18px; color: #ffd740; }
  /* jukebox */
  .jukebox { background: radial-gradient(circle at 50% 0%, #6a1b9a, #1a0b33 75%); color: #fff; padding: 3% 4%; }
  .jukebox h2 { margin: 0; font-size: 34px; color: #ff80ab; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .nowPlaying { margin: 4px 0 8px; font-size: 16px; color: #ffe0f0; min-height: 22px; }
  .nowPlaying .eq span { display: inline-block; width: 5px; margin: 0 1px; background: #ff80ab; animation: eq .5s infinite alternate; vertical-align: bottom; }
  @keyframes eq { from { height: 4px; } to { height: 18px; } }
  .jbLyrics { display: none; margin: -4px 0 6px; padding: 5px 14px; border-radius: 16px; background: rgba(0,0,0,.4); border: 2px solid #ff80ab; font-size: 15px; }
  .jbLyrics.on { display: block; }
  .jbLyrics .lit { color: #ffd740; }
  .jbLyrics.glitchy { border-color: #00ffd0; } .jbLyrics.glitchy .lit { color: #00ffd0; }
  .jbGroup { font-size: 13px; color: #ce93d8; margin: 4px 0 3px; text-align: left; width: 100%; }
  .tracks { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; width: 100%; }
  .track { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.25); border-radius: 12px; padding: 4px 6px; font-size: 13px; cursor: pointer; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track:hover { background: rgba(255,128,171,.25); }
  .track.on { background: #ff4081; border-color: #fff; }
  .jbStop { margin-top: 8px; font-size: 16px; background: #fff; color: #6a1b9a; border-radius: 999px; padding: 5px 18px; cursor: pointer; display: inline-block; }
  /* hall of heroes */
  .heroes { background: linear-gradient(160deg, #0d47a1, #1a0b33); color: #fff; padding: 3% 4%; }
  .heroes h2 { margin: 0; font-size: 34px; color: #ffd740; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .heroes .sub { font-size: 14px; color: #bbdefb; margin: 0 0 3px; }
  .cards { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: 100%; }
  .hero { background: linear-gradient(180deg, #fff8e1, #ffe082); color: #4e342e; border-radius: 10px; padding: 3px 2px; cursor: pointer; border: 3px solid #fff; box-shadow: 0 3px 0 rgba(0,0,0,.3); line-height: 1.05; }
  .hero:hover, .hero.on { transform: translateY(-3px); border-color: #ff4081; }
  .hero .ic { font-size: 19px; display: block; }
  .hero b { font-size: 9px; display: block; }
  .heroInfo { margin-top: 4px; min-height: 52px; width: 100%; background: rgba(255,255,255,.12); border-radius: 14px; padding: 6px 12px; display: flex; align-items: center; gap: 12px; text-align: left; font-size: 15px; }
  .heroInfo .big { font-size: 44px; }
  .heroInfo .from { color: #ffd740; font-size: 13px; }
  .tropBtns { display: flex; gap: 6px; justify-content: center; margin: -4px 0 8px; flex-wrap: wrap; }
  .tropBtns .tropBtn { margin: 0; font-size: 14px; }
  /* clubhouse */
  .club { background: #3e2723; color: #fff; padding: 2.5% 3%; }
  .club h2 { margin: 0; font-size: 30px; color: #ffcc80; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .club .sub { font-size: 13px; color: #ffe0b2; margin: 0 0 5px; min-height: 17px; }
  .room { position: relative; width: 100%; height: 270px; border-radius: 12px; overflow: hidden; touch-action: none; box-shadow: inset 0 0 0 4px #5d4037;
          background: linear-gradient(180deg, var(--wall) 0 62%, #a1683a 62% 100%); }
  .room .boards { position: absolute; left: 0; right: 0; top: 62%; bottom: 0; background: repeating-linear-gradient(90deg, transparent 0 58px, rgba(0,0,0,.18) 58px 61px); }
  .room .win { position: absolute; left: 40%; top: 9%; width: 20%; height: 34%; border: 6px solid #fff; border-radius: 8px; background: linear-gradient(#4fc3f7, #b3e5fc); }
  .room .win::after { content: '☀️'; position: absolute; right: 6px; top: 2px; font-size: 22px; }
  .room .rug { position: absolute; left: 25%; width: 50%; top: 70%; height: 22%; border-radius: 50%; background: radial-gradient(#ff8a80 0 30%, #ffd180 30% 55%, #80d8ff 55%); opacity: .85; }
  .placed { position: absolute; font-size: 40px; transform: translate(-50%, -50%); cursor: grab; user-select: none; touch-action: none; filter: drop-shadow(0 4px 2px rgba(0,0,0,.35)); }
  .placed.drag { font-size: 48px; cursor: grabbing; z-index: 5; }
  .wallBtn { position: absolute; right: 8px; top: 8px; font-size: 13px; background: rgba(0,0,0,.35); border-radius: 999px; padding: 3px 10px; cursor: pointer; z-index: 6; }
  .toybox { display: grid; grid-template-columns: repeat(12, 1fr); gap: 3px; width: 100%; margin-top: 6px; max-height: 118px; overflow-y: auto; background: rgba(0,0,0,.25); border-radius: 10px; padding: 4px; }
  .toy { font-size: 24px; cursor: pointer; border-radius: 8px; padding: 2px 0; position: relative; }
  .toy:hover { background: rgba(255,255,255,.15); }
  .toy.out { opacity: .35; }
  .toy.locked { filter: grayscale(1) brightness(.5); }
  .toy.locked::after { content: '🔒'; position: absolute; right: 0; bottom: 0; font-size: 11px; filter: none; }
  /* joke machine */
  .jokes { background: linear-gradient(160deg, #ff9800, #e65100); color: #fff; padding: 3% 5%; }
  .jokes h2, .fortune h2, .aqua h2 { margin: 0; font-size: 32px; text-shadow: 3px 3px 0 rgba(0,0,0,.3); }
  .jokeBot { font-size: 70px; line-height: 1; margin: 4px 0; }
  .jokeBot.talk { animation: wobble .25s 6 alternate; }
  @keyframes wobble { from { transform: rotate(-8deg); } to { transform: rotate(8deg) scale(1.05); } }
  .jokeBox { background: #fff; color: #4e342e; border-radius: 20px; padding: 10px 18px; min-height: 92px; width: 92%; font-size: 21px; display: flex; flex-direction: column; justify-content: center; box-shadow: 0 6px 0 rgba(0,0,0,.2); }
  .jokeBox .punch { color: #e65100; font-size: 24px; margin-top: 6px; }
  .bigBtn { margin-top: 12px; font-size: 22px; background: #fff176; color: #e65100; border-radius: 999px; padding: 10px 28px; cursor: pointer; box-shadow: 0 6px 0 rgba(0,0,0,.25); display: inline-block; user-select: none; }
  .bigBtn:active { transform: translateY(4px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }
  /* fortune machine */
  .fortune { background: radial-gradient(circle at 50% 40%, #4a148c, #12002b 75%); color: #fff; padding: 3% 5%; }
  .ball { width: 170px; height: 170px; border-radius: 50%; margin: 8px auto 4px; background: radial-gradient(circle at 35% 30%, #fff 0 6%, #e1bee7 10%, #7c4dff 45%, #311b92 80%); box-shadow: 0 0 40px #b388ff, inset -12px -16px 30px rgba(0,0,0,.4); display: flex; align-items: center; justify-content: center; font-size: 40px; cursor: pointer; }
  .ball.spin { animation: glowSpin 1.2s ease-in-out; }
  @keyframes glowSpin { 50% { transform: scale(1.12) rotate(180deg); box-shadow: 0 0 90px #ea80fc, inset -12px -16px 30px rgba(0,0,0,.4); } }
  .stand { width: 130px; height: 26px; margin: -6px auto 8px; background: linear-gradient(#8d6e63, #4e342e); border-radius: 10px 10px 4px 4px; }
  .fortuneText { font-size: 22px; min-height: 60px; color: #ffe57f; text-shadow: 0 0 12px #b388ff; padding: 0 10px; }
  /* bundle room */
  .bundles { background: radial-gradient(circle at 50% 0%, #00897b, #062b26 80%); color: #fff; padding: 2.5% 3%; justify-content: flex-start; }
  .bundles h2 { margin: 0; font-size: 32px; color: #ffd740; text-shadow: 3px 3px 0 rgba(0,0,0,.4); }
  .bundles .sub { font-size: 14px; color: #b2dfdb; margin: 0 0 6px; min-height: 18px; }
  .bTabs { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; width: 100%; }
  .bTab { background: rgba(255,255,255,.1); border: 2px solid rgba(255,255,255,.2); border-radius: 12px; padding: 2px 2px; cursor: pointer; line-height: 1.1; font-size: 12px; }
  .bTab .ic { font-size: 22px; } .bTab b { color: #ffd740; }
  .bTab.on { background: #ffd740; color: #4e342e; border-color: #fff; } .bTab.on b { color: #4e342e; }
  .bWallet { margin: 8px 0 6px; font-size: 18px; } .bWallet b { color: #ffd740; font-size: 22px; }
  .bCards { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; }
  .bCard { background: linear-gradient(180deg, #fff8e1, #ffe082); color: #4e342e; border-radius: 16px; padding: 6px 4px 8px; border: 3px solid #fff; box-shadow: 0 4px 0 rgba(0,0,0,.3); }
  .bCard.mega { background: linear-gradient(180deg, #f3e5f5, #ce93d8); }
  .bCard .box { font-size: 40px; line-height: 1.1; }
  .bCard.can .box { animation: wiggle .5s infinite alternate; }
  @keyframes wiggle { from { transform: rotate(-8deg); } to { transform: rotate(8deg) scale(1.08); } }
  .bCard .nm { font-weight: bold; font-size: 15px; }
  .bCard .items { font-size: 30px; letter-spacing: 4px; margin: 2px 0; }
  .bCard .extra { font-size: 12px; color: #6a1b9a; min-height: 30px; line-height: 1.2; }
  .bBtn { display: inline-block; margin-top: 4px; font-size: 16px; border-radius: 999px; padding: 4px 14px; cursor: pointer; user-select: none; background: #9e9e9e; color: #fff; }
  .bCard.can .bBtn { background: #e91e63; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  .bCard.got .bBtn { background: #43a047; }
  .bOpen { position: absolute; inset: 0; background: rgba(0,20,18,.88); display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9; cursor: pointer; }
  .bOpen .gift { font-size: 120px; animation: shake .12s 7 alternate; }
  @keyframes shake { from { transform: rotate(-12deg) scale(1); } to { transform: rotate(12deg) scale(1.15); } }
  .bOpen .gift.boom { animation: boom .4s forwards; }
  @keyframes boom { to { transform: scale(2.4); opacity: 0; } }
  .bOpen .got { display: flex; gap: 14px; font-size: 64px; min-height: 80px; }
  .bOpen .got span { animation: popUp .5s backwards; }
  @keyframes popUp { from { transform: translateY(60px) scale(.2); opacity: 0; } 70% { transform: translateY(-14px) scale(1.2); } }
  .bOpen .say { font-size: 22px; color: #ffd740; margin-top: 10px; padding: 0 20px; }
  /* 🌙 night mode (7pm - 6am) and 🕹️ party mode (secret code) */
  body.night { background: radial-gradient(circle at 70% 10%, #283593, #050314 70%); }
  .sky { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .sky .st { position: absolute; color: #fff; animation: twinkle 2s ease-in-out infinite alternate; }
  .sky .moon { position: absolute; right: 4%; top: 4%; font-size: 70px; filter: drop-shadow(0 0 30px #fff59d); }
  .sky .shoot { position: absolute; width: 90px; height: 2px; background: linear-gradient(90deg, #fff, transparent); animation: shoot 7s linear infinite; }
  @keyframes twinkle { from { opacity: .2; transform: scale(.7); } to { opacity: 1; transform: scale(1.2); } }
  @keyframes shoot { 0%, 90% { transform: translate(0, 0) rotate(-30deg); opacity: 0; } 92% { opacity: 1; } 100% { transform: translate(-500px, 280px) rotate(-30deg); opacity: 0; } }
  body.night .book { filter: drop-shadow(0 0 22px rgba(144,202,249,.55)); }
  body.night .page::after { content: ''; position: absolute; inset: 0; background: rgba(20,20,80,.16); pointer-events: none; border-radius: inherit; }
  .modeTag { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 2; font-size: 15px; color: #fff; background: rgba(0,0,0,.35); padding: 3px 12px; border-radius: 999px; pointer-events: none; }
  body.party { animation: disco 3s linear infinite; }
  @keyframes disco { 0% { background: #ff1744; } 20% { background: #ff9100; } 40% { background: #00e676; } 60% { background: #2979ff; } 80% { background: #d500f9; } 100% { background: #ff1744; } }
  .confetti { position: fixed; top: -40px; font-size: 26px; pointer-events: none; z-index: 30; animation: fall 3s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  body.party .partyFloat { position: fixed; bottom: -40px; font-size: 28px; pointer-events: none; z-index: 0; animation: floatUp 6s linear infinite; }
  @keyframes floatUp { to { transform: translateY(-120vh) rotate(360deg); } }
  body.goldbook .cover { background: linear-gradient(160deg, #fff176, #ffb300 45%, #e65100); }
  body.goldbook .cover h1 { color: #fff; text-shadow: 4px 4px 0 #bf360c, 0 0 24px #fff59d; }
  /* 📸 photo booth */
  .booth { background: linear-gradient(160deg, #ec407a, #6a1b9a); color: #fff; padding: 2% 3%; justify-content: flex-start; }

}

let puzzlePic = null;
function drawPuzzlePicture() {
  const c = document.createElement('canvas'); c.width = 800; c.height = 500; const x = c.getContext('2d');
  const sky = x.createLinearGradient(0, 0, 0, 500); sky.addColorStop(0, '#4fc3f7'); sky.addColorStop(1, '#e1f5fe'); x.fillStyle = sky; x.fillRect(0, 0, 800, 500);
  ['#ff5252', '#ff9800', '#ffeb3b', '#66bb6a', '#42a5f5', '#7e57c2'].forEach((col, i) => { x.strokeStyle = col; x.lineWidth = 18; x.beginPath(); x.arc(400, 420, 330 - i * 18, Math.PI, 0); x.stroke(); });
  x.fillStyle = '#fff'; [[110, 80], [640, 60], [520, 130]].forEach(([cx, cy]) => { for (const [dx, r] of [[0, 30], [30, 38], [65, 28]]) { x.beginPath(); x.arc(cx + dx, cy, r, 0, 7); x.fill(); } });
  x.fillStyle = '#ffd740'; x.beginPath(); x.arc(720, 90, 45, 0, 7); x.fill();

function glitchWord(w, k) {
  if (k === 0) return w.slice(0, 3) + '-' + w.slice(0, 3).toLowerCase() + '-' + w.toUpperCase();
  if (Math.random() < 0.25) return w.split('').map(c => LEET[c] && Math.random() < 0.6 ? LEET[c] : c).join('');
  if (Math.random() < 0.06) return w.split('').reverse().join('');

function robotVoice() {
  const vs = 'speechSynthesis' in window ? speechSynthesis.getVoices() : [];
  return vs.find(v => /zarvox|trinoids|ralph|fred|albert/i.test(v.name) && /^en/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
function youngVoice() {   // a kid-sounding voice if there is one ("Junior"), or a bright English voice
  const vs = 'speechSynthesis' in window ? speechSynthesis.getVoices() : [];
  return vs.find(v => /junior/i.test(v.name)) || vs.find(v => /samantha|google us english|karen|moira|tessa/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
}
function voiceStop() { try { if ('speechSynthesis' in window) speechSynthesis.cancel(); } catch (_) {} }
function voiceWake() { try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); speechSynthesis.speak(new SpeechSynthesisUtterance(' ')); } } catch (_) {} }   // the iPad only lets it talk after a tap
function sayLine(line, glitch) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const v = robotVoice(), say = (txt, pitch, rate) => { const u = new SpeechSynthesisUtterance(txt); if (v) u.voice = v; u.pitch = pitch; u.rate = rate; u.volume = 1; speechSynthesis.speak(u); };
    if (!glitch) { const yv = youngVoice(); const u = new SpeechSynthesisUtterance(line); if (yv) u.voice = yv; u.pitch = 1.5; u.rate = 1.1; u.volume = 1; speechSynthesis.speak(u); return; }   // a young voice (Ben asked for younger, not old)
    // glitchy voice: stutters, and jumps between high and low
    const words = line.replace(/[,!]/g, '').split(' ');
    const first = words.shift();
    say(`${first.slice(0, 3)}, ${first.slice(0, 3)}, ${first}`, 2, 1.5);
    for (let i = 0; i < words.length; i += 2) say(words.slice(i, i + 2).join(' '), [0.1, 0.5, 1.6, 2][Math.floor(Math.random() * 4)], 1.35 + Math.random() * 0.4);
  } catch (_) {}
}
// karaoke words in the jukebox: k = which half-beat we're on (one line every 8 beats = 16 half-beats)
function jbLyrics(S, k) {
  const el = document.querySelector('.jbLyrics'); if (!el) return;
  const line = Math.floor(k / 16), p = (k % 16) / 16;
  if (!S.edm || line >= HYPER_WORDS.length) { el.className = 'jbLyrics'; return; }
  if (k % 2 && !S.glitch) return;   // update a couple of times a beat
  if (k % 16 === 0) sayLine(HYPER_WORDS[line], S.glitch);   // the voice says each line as it starts
  const words = HYPER_WORDS[line].split(' ').map((w, i) => S.glitch ? glitchWord(w, i) : w), lit = Math.ceil(p * words.length * 1.15);
  el.className = 'jbLyrics on' + (S.glitch ? ' glitchy' : '');

const MK_ITEMS = ['⭐', '🪙', '💎', '🍕', '🍩', '🍎', '🦴', '🐟', '🎁', '🌈'];
const MK_BGS = [['space', 'radial-gradient(#3949ab, #0d0221)'], ['grass', 'linear-gradient(#81d4fa 60%, #66bb6a 60%)'], ['ocean', 'linear-gradient(#4fc3f7, #01579b)'],
  ['candy', 'linear-gradient(135deg, #f8bbd0, #ce93d8)'], ['lava', 'linear-gradient(#4e342e 55%, #ff6d00 55%)'], ['snow', 'linear-gradient(#e3f2fd 60%, #fff 60%)']];
const MK_COVER = ['#ef5350', '#ff9800', '#fdd835', '#66bb6a', '#42a5f5', '#ab47bc'];
let makerView = 'shelf', makerEdit = null, makerDel = '';
function myGames() { const a = readSave('gfMyGames'); return Array.isArray(a) ? a : []; }
function myGamesStore(a) { try { localStorage.setItem('gfMyGames', JSON.stringify(a)); } catch (_) {} }
const escHTML = t => String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function makerHTML() {
  const games = myGames();
  if (makerView === 'edit' && makerEdit) {
    const g = makerEdit, opt = (key, list, fmt) => list.map((x, i) => { const v = Array.isArray(x) ? x[0] : x; return `<span class="bOpt ${fmt === 'wide' ? 'wide' : ''} ${String(g[key]) === String(v) ? 'on' : ''}" data-mkg="${key}" data-mkv="${v}" ${fmt === 'bg' ? `style="background:${x[1]}"` : fmt === 'color' ? `style="background:${v}"` : ''}>${fmt === 'bg' || fmt === 'color' ? '' : fmt === 'wide' ? x[1] + ' ' + x[2] : v}</span>`; }).join('');
    return `<div class="page maker2"><h2>🛠️ Make Your Game!</h2>
      <div class="sub">Pick everything, then tap ✅ Make it! Your game goes on your shelf.</div>
      <div class="mkForm">
        <div class="bRow"><span class="lbl">Name:</span><input id="mkTitle" maxlength="24" value="${escHTML(g.title)}" placeholder="My Awesome Game" autocomplete="off"></div>
        <div class="bRow"><span class="lbl">Game:</span>${opt('type', MK_TYPES, 'wide')}</div>
        <div class="bRow"><span class="lbl">Hero:</span>${opt('hero', MK_HEROES)}</div>
        <div class="bRow"><span class="lbl">Bad guys:</span>${opt('enemy', MK_ENEMIES)}</div>
        <div class="bRow"><span class="lbl">Collect:</span>${opt('item', MK_ITEMS)}</div>
        <div class="bRow"><span class="lbl">Place:</span>${opt('bg', MK_BGS, 'bg')}</div>
        <div class="bRow"><span class="lbl">Speed:</span>${opt('speed', [[1, '🐢', 'Easy'], [2, '🐇', 'Medium'], [3, '🚀', 'Hard']], 'wide')}</div>
        <div class="bRow"><span class="lbl">Music:</span>${opt('music', [[0, '😀', 'Happy'], [1, '👻', 'Spooky'], [2, '⚡', 'Fast']], 'wide')}</div>
        <div class="bRow"><span class="lbl">Cover:</span>${opt('color', MK_COVER, 'color')}</div>
      </div>
      <div class="bRow" style="margin-top:8px"><span class="fBtn go" data-mkdo="save">✅ Make it!</span><span class="fBtn" data-mkdo="try">▶ Try it</span><span class="fBtn" data-mkdo="shelf">Cancel</span></div>
      <div class="pageNum">${GAMES.length + 19}</div></div>`;
  }
  return `<div class="page maker2"><h2>🛠️ The Game Maker</h2>
    <div class="sub">${games.length ? 'Your very own Game Factory games! Tap ▶ to play.' : 'Make your VERY OWN Game Factory game! Tap ➕ to start.'}</div>
    <div class="myShelf">${games.map(g => `<div class="myCard" style="background:${escHTML(g.color)}"><span class="ic">${escHTML(g.hero)}</span><b>${escHTML(g.title)}</b>
        <span style="font-size:11px">${(MK_TYPES.find(t => t[0] === g.type) || MK_TYPES[0])[1]} ${(MK_TYPES.find(t => t[0] === g.type) || MK_TYPES[0])[2]}</span>
        <div class="row"><span data-mkplay="${escHTML(g.id)}">▶ Play</span><span data-mkedit="${escHTML(g.id)}">✏️</span><span data-mkdel="${escHTML(g.id)}">${makerDel === g.id ? '❗' : '🗑️'}</span></div></div>`).join('')}
      ${games.length < 16 ? '<div class="myCard new" data-mkdo="new"><span class="ic">➕</span><b>Make a new game!</b></div>' : ''}</div>
    <div class="pageNum">${GAMES.length + 19}</div></div>`;
}
function playMyGame(g) { openFile({ file: 'mygame.html?id=' + encodeURIComponent(g.id), name: g.title || 'My Game' }); }
function makerClick(e) {
  if (!e.target.closest('.maker2')) return false;
  const t = k => e.target.closest('[data-' + k + ']'), games = myGames();
  const ti = document.getElementById('mkTitle'); if (ti && makerEdit) makerEdit.title = ti.value.slice(0, 24);
  if (t('mkg')) { const k = t('mkg').dataset.mkg, v = t('mkg').dataset.mkv; makerEdit[k] = (k === 'speed' || k === 'music') ? +v : v; beep(880, 0.04); }
  else if (t('mkplay')) { const g = games.find(x => x.id === t('mkplay').dataset.mkplay); if (g) playMyGame(g); return true; }
  else if (t('mkedit')) { const g = games.find(x => x.id === t('mkedit').dataset.mkedit); if (g) { makerEdit = JSON.parse(JSON.stringify(g)); makerView = 'edit'; } makerDel = ''; }
  else if (t('mkdel')) { const id = t('mkdel').dataset.mkdel; if (makerDel === id) { myGamesStore(games.filter(x => x.id !== id)); makerDel = ''; beep(220, 0.15); } else { makerDel = id; beep(330, 0.1); } }
  else if (t('mkdo')) {
    const d = t('mkdo').dataset.mkdo; makerDel = '';
    if (d === 'new') { makerEdit = { id: 'g' + Date.now(), title: '', type: 'jump', hero: '🤖', enemy: '👾', item: '⭐', bg: 'space', speed: 1, music: 0, color: '#42a5f5', icon: '🎮', by: 'Ben' }; makerView = 'edit'; }
    else if (d === 'shelf') makerView = 'shelf';
    else if (d === 'save' || d === 'try') {
      makerEdit.title = (makerEdit.title || '').trim() || 'My Awesome Game';
      const i = games.findIndex(x => x.id === makerEdit.id); if (i >= 0) games[i] = makerEdit; else games.push(makerEdit);
      myGamesStore(games);
      if (d === 'try') { playMyGame(makerEdit); return true; }
      makerView = 'shelf'; [660, 880, 1320].forEach((f, k) => setTimeout(() => beep(f, 0.1), k * 70)); speak(`${makerEdit.title} is ready to play!`, 1.3);
    }
  } else return true;
  show(cur);
  return true;
}

function endHTML() {
  return `<div class="page end"><h2>The End!</h2><p>…or is it? 🤔</p>
    <p>Every game in this book was dreamed up by Ben &amp; his brother.</p>
    <p>What game will you make next? 🚀 <span class="tropBtn" data-go="${MAKER_PAGE()}">🛠️ Make one!</span></p><div class="pageNum">${GAMES.length + 20}</div></div>`;
}
const PAGES = [coverHTML, contentsHTML, ...GAMES.map((g, i) => g.secret ? () => gameHTML(i) : gameHTML(i)), trophyHTML, puzzleHTML, jukeboxHTML, heroesHTML, clubHTML, jokeHTML, fortuneHTML, aquaHTML, bundleHTML, folderHTML, boothHTML, stickersHTML, doorHTML, labHTML, galaxyHTML, glitchHTML, makerHTML, endHTML];   // the trophy page is worked out fresh each time it's shown

// ---- sounds ----
let actx = null;
function audio() { try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} return actx; }
function beep(f, d = 0.08, type = 'square', v = 0.06) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime;
  o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.001, t + d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + d);
}
function swish(forward = true) {                      // a classic video-game "blip"
  const a = audio(); if (!a) return;
  const t = a.currentTime;
  [[forward ? 660 : 990, 0], [forward ? 990 : 660, 0.06]].forEach(([f, d]) => {
    const o = a.createOscillator(), g = a.createGain();
    o.type = 'square'; o.frequency.value = f;
    g.gain.setValueAtTime(0.07, t + d); g.gain.exponentialRampToValueAtTime(0.001, t + d + 0.08);
    o.connect(g); g.connect(a.destination); o.start(t + d); o.stop(t + d + 0.09);
  });
}

// ---- flipping ----
const book = document.getElementById('book'), prevB = document.getElementById('prev'), nextB = document.getElementById('next');
let cur = 0, busy = false;
try { cur = Math.max(0, Math.min(PAGES.length - 1, +(localStorage.getItem('factoryPage') || 0))); } catch (_) {}

function makePage(i, cls) {
  const wrap = document.createElement('div');
  wrap.innerHTML = typeof PAGES[i] === 'function' ? PAGES[i]() : PAGES[i];
  const el = wrap.firstElementChild;
  el.classList.add(cls);
  return el;
}
function show(i) {
  book.innerHTML = '';
  book.appendChild(makePage(i, 'top'));
  cur = i; updateButtons();
  if (i !== GLITCH_PAGE()) book.classList.remove('upside');
  labAfterShow(); const pg = book.querySelector('.page'); if (pg) addCrack(pg, i);
  if (i === DOOR_PAGE() && keysFound().length >= KEY_SPOTS.length && !readSave('gfKeyParty')) {   // the very first time the door is open
    try { localStorage.setItem('gfKeyParty', 'true'); } catch (_) {}
    setTimeout(bigParty, 600);
  }
  try { localStorage.setItem('factoryPage', i); } catch (_) {}
}
function updateButtons() { prevB.disabled = cur === 0; nextB.disabled = cur === PAGES.length - 1; }

function flipTo(i) {
  if (i !== cur) { jbStop(); voiceStop(); }
  if (busy || i === cur || i < 0 || i >= PAGES.length) return;
  busy = true;
  const forward = i > cur;
  swish(forward);
  book.innerHTML = '';
  if (forward) {
    const under = makePage(i, 'under'), top = makePage(cur, 'top');
    book.append(under, top);
    requestAnimationFrame(() => requestAnimationFrame(() => { top.classList.add('turning', 'flipped'); }));
    setTimeout(() => { show(i); busy = false; }, 720);
  } else {
    const under = makePage(cur, 'under'), top = makePage(i, 'top');
    top.classList.add('flipped'); book.append(under, top);
    requestAnimationFrame(() => requestAnimationFrame(() => { top.classList.add('turning'); top.classList.remove('flipped'); }));
    setTimeout(() => { show(i); busy = false; }, 720);
  }
}
prevB.addEventListener('click', () => flipTo(cur - 1));
nextB.addEventListener('click', () => flipTo(cur + 1));
book.addEventListener('click', e => {
  const play = e.target.closest('[data-play]'), go = e.target.closest('[data-go]');
  const track = e.target.closest('[data-track]'), hero = e.target.closest('[data-hero]');
  if (track) { jbPlay(track.dataset.track); return; }
  if (e.target.closest('[data-jbstop]')) { jbStop(); return; }
  if (hero) { showHero(+hero.dataset.hero); return; }
  if (e.target.closest('[data-joke]')) { tellJoke(); return; }
  if (e.target.closest('[data-fortune]')) { tellFortune(); return; }
  const tro = e.target.closest('[data-tro]'); if (tro) { const x = TROPHIES[+tro.dataset.tro], el = document.querySelector('.troInfo'); if (el) el.textContent = `${x[0]} ${x[1]}: ${x[2]}`; beep(990, 0.05); return; }
  if (folderClick(e)) return;
  if (boothClick(e)) return;
  const hs = e.target.closest('[data-hstar]'); if (hs) { tapStar(hs); return; }
  const ck = e.target.closest('[data-crack]'); if (ck) { tapCrack(ck); return; }
  if (labClick(e)) return;
  if (makerClick(e)) return;
  if (e.target.closest('[data-rush]')) { if (starsFound() >= 5) openFile({ file: 'bossrush.html', name: 'Galaxy Boss Rush' }); return; }
  if (e.target.closest('[data-glitch]')) { const on = !readSave('gfGlitch'); try { localStorage.setItem('gfGlitch', on ? 'true' : 'false'); } catch (_) {} glitchMode(on); beep(on ? 200 : 600, 0.2, 'square', 0.06); show(cur); return; }
  if (e.target.closest('[data-climb]')) { book.classList.remove('upside'); beep(880, 0.1); show(cur); return; }
  if (e.target.closest('.galaxy') || e.target.closest('.glitchRoom')) return;
  const stk = e.target.closest('[data-stk]'); if (stk) { tapSticker(+stk.dataset.stk); return; }
  const hole = e.target.closest('[data-hole]'); if (hole) { tapHole(+hole.dataset.hole); return; }
  if (e.target.closest('[data-party]')) { bigParty(); return; }
  if (e.target.closest('[data-gold]')) { const on = !readSave('gfGoldBook'); try { localStorage.setItem('gfGoldBook', on ? 'true' : 'false'); } catch (_) {} goldBook(on); beep(on ? 1320 : 440, 0.12); show(cur); return; }
  if (e.target.closest('.stickers') || e.target.closest('.door') ) return;
  if (cur === 0 && Date.now() - swipeEat < 400) return;   // that was a secret-code swipe
  if (e.target.closest('[data-feed]')) { feedFish(); return; }
  const btab = e.target.closest('[data-btab]'); if (btab) { bundleTab = +btab.dataset.btab; beep(880, 0.04); bundleRefresh(); return; }
  const buy = e.target.closest('[data-buy]'); if (buy) { buyBundle(+buy.dataset.buy); return; }
  if (e.target.closest('.bOpen')) { if (!bundleBusy) bundleRefresh(); return; }
  if (e.target.closest('.bCards') || e.target.closest('.bTabs')) return;
  const fishEl = e.target.closest('[data-fish]'); if (fishEl) { tapFish(+fishEl.dataset.fish); return; }
  if (e.target.closest('.tank')) return;
  const toy = e.target.closest('[data-toy]'); if (toy) { clubTapToy(toy.dataset.toy); return; }
  if (e.target.closest('[data-wall]')) { const c = clubSave(); c.wall = (c.wall + 1) % WALLS.length; clubStore(c); beep(700, 0.05); clubRefresh(); return; }
  if (e.target.closest('.placed') || e.target.closest('.room')) return;   // clicks in the room never turn the page
  if (play) openGame(+play.dataset.play);
  else if (go) flipTo(+go.dataset.go);
  else if (e.target.closest('.corner') || e.target.closest('.cover')) flipTo(cur + 1);
});

// ---- playing a game ----
const player = document.getElementById('player');
let frame = null;
function openFile(g) {   // play a game file that has no page of its own
  jbStop(); voiceStop(); addFish(g.name);
  [660, 880, 1320].forEach((f, k) => setTimeout(() => beep(f, 0.1), k * 70));
  frame = document.createElement('iframe'); frame.title = g.name; frame.src = g.file + (g.file.includes('?') ? '&' : '?') + 'v=' + Date.now();
  player.appendChild(frame); player.classList.add('open'); document.title = g.name + ' – The Game Factory';
  frame.onload = () => frame.focus();
  playing = { name: g.name, file: g.file, t: Date.now() };
  gtag('event', 'page_view', { page_title: g.name, page_location: new URL(g.file, location.href).href });
  gtag('event', 'game_start', { game_name: g.name });
}
function openGame(i) {
  if (GAMES[i].secret && !secretOpen()) { beep(220, 0.15); return; }   // still locked!
  jbStop(); voiceStop();
  const pl = playedSave(), wasOpen = secretOpen();
  if (!pl.games.includes(GAMES[i].file)) pl.games.push(GAMES[i].file);
  if (!wasOpen && GAMES.every(g => g.secret || pl.games.includes(g.file))) { pl.rainbow = true; justUnlocked = true; }
  if (wasOpen) pl.rainbow = true;   // once it's open it stays open, even when new games are added
  playedStore(pl);
  addFish(GAMES[i].name);   // a new fish for the aquarium!
  [660, 880, 1320].forEach((f, k) => setTimeout(() => beep(f, 0.1), k * 70));
  frame = document.createElement('iframe');      // a fresh game window each time
  frame.title = GAMES[i].name; frame.src = GAMES[i].file + '?v=' + Date.now();   // always the newest version
  player.appendChild(frame);
  player.classList.add('open');
  document.title = GAMES[i].name + ' – The Game Factory';
  frame.onload = () => frame.focus();
  playing = { name: GAMES[i].name, file: GAMES[i].file, t: Date.now() };
  // each game shows up as its own page in GA's "Pages and screens" report, plus a game_start event
  gtag('event', 'page_view', { page_title: GAMES[i].name, page_location: new URL(GAMES[i].file, location.href).href });
  gtag('event', 'game_start', { game_name: GAMES[i].name });
}
let playing = null;
function endPlay() {
  if (!playing) return;
  gtag('event', 'game_end', { game_name: playing.name, play_seconds: Math.round((Date.now() - playing.t) / 1000) });
  playing = null;
}
addEventListener('pagehide', endPlay);   // closing the app mid-game still counts the play time
function closeGame() {
  endPlay();
  if (frame) { frame.remove(); frame = null; }       // stops the game and its music
  player.classList.remove('open');
  document.title = 'The Game Factory';
  window.focus();                                    // so the arrow keys flip pages again
  beep(440, 0.12);
  if (justUnlocked) {                                 // they just played the last game: show the secret!
    justUnlocked = false;
    const ri = GAMES.findIndex(g => g.secret);
    setTimeout(() => { flipTo(ri + 2); [523, 659, 784, 1047, 1319, 1568].forEach((f, k) => setTimeout(() => beep(f, 0.15, 'triangle', 0.08), 400 + k * 120)); }, 300);
  }
}
let justUnlocked = false;
document.getElementById('back').addEventListener('click', closeGame);

addEventListener('keydown', e => {
  if (player.classList.contains('open')) return;
  if (e.target.closest && e.target.closest('input')) { if (e.key === 'Enter' && e.target.id === 'fName') { fNew.name = e.target.value; folderClick({ target: document.querySelector('[data-fdo="create"]') }); } return; }   // typing a folder name
  if (e.key === 'ArrowRight') { e.preventDefault(); flipTo(cur + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); flipTo(cur - 1); }
  else if (e.key === ' ' || e.key === 'Enter') {
    e.preventDefault();
    if (cur >= 2 && cur < 2 + GAMES.length) openGame(cur - 2); else flipTo(cur + 1);
  }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown') codeStep(e.key === 'ArrowUp' ? 'U' : 'D');
  else if (e.key >= '1' && e.key <= '9') flipTo(+e.key + 1);
  else if (e.key === '0') flipTo(11);
});

if (location.hash === '#secret') cur = GAMES.findIndex(g => g.secret) + 2;
if (location.hash === '#door') cur = DOOR_PAGE();
if (location.hash === '#stickers') cur = STICKER_PAGE();
if (location.hash === '#crack') cur = crackPage();
if (location.hash === '#maker') cur = MAKER_PAGE();   // a link straight to the secret game's page
seasonStart(); nightCheck();   // night first, so tonight's Glitch Hole crack can appear on the first page shown
show(cur); fitBook();
setInterval(nightCheck, 60000);
if (readSave('gfParty') === 1) partyMode(true);
if (readSave('gfGoldBook')) goldBook(true);
if (readSave('gfGlitch')) glitchMode(true);
</script>
