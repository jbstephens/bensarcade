<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>💨 Stinky Smell Shop</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e8f9d0 0 36px, #d6f2b4 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #7cb342; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 6px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 21px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-tv { background: #ff8a80; } .b-spin { background: #ffd54f; }
  .b-mix { background: linear-gradient(90deg, #b2ff59, #ffee58, #ffab40); font-size: 24px; }
  .b-fam { background: #80deea; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🧪 the Smell Lab ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 46%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #stage { position: relative; flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #7cb342; overflow: hidden; }
  #stageArt { position: absolute; inset: 0; }
  #stage svg { width: 100%; height: 100%; display: block; }
  .card svg { display: block; width: 100%; }
  #nextSniff { position: absolute; right: 8px; bottom: 8px; font-size: 17px; min-height: 44px; background: #fff59d; }
  #meterRow { display: flex; gap: 8px; align-items: stretch; height: clamp(110px, 21vh, 170px); }
  #meter { flex: 1; min-width: 0; background: #fffbe0; border: 4px solid #333; border-radius: 16px; overflow: hidden; }
  #meter svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(17px, 2.2vw, 25px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 48px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 21px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 16px; font-weight: bold; background: #f4fff0; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; position: relative; }
  .opt svg { width: 64px; height: 64px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .opt.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .opt .num { position: absolute; top: -8px; left: -8px; width: 30px; height: 30px; border-radius: 50%; background: #ff3d6e; color: #fff; border: 3px solid #333; font-size: 17px; line-height: 24px; }
  .opt small { font-size: 13px; color: #666; font-weight: normal; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #f4fff0; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(17px, 2.1vw, 25px); min-height: 34px; display: block; }
  .slot .btn { min-height: 46px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  #acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invHelp { font-size: 14px; text-align: center; color: #555; }
  /* stage animations */
  #stage g.swirl, #tvArt g.swirl { animation: spn 6s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #stage.mixing g.swirl { animation-duration: .6s; }
  #stage.mixing g.shake { animation: shk .12s linear infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  g.bub { animation: bub 2.2s ease-in infinite; }
  #stage.mixing g.bub { animation-duration: .7s; }
  g.waft { animation: waft 1.6s ease-in-out infinite alternate; }
  g.heart { animation: rise 1.8s ease-out infinite; }
  g.tear { animation: drip 1s ease-in infinite; }
  g.faint { animation: faint 1.4s cubic-bezier(.5, 0, .7, 1.4) both; transform-box: fill-box; transform-origin: 0% 100%; }
  g.run { animation: run 1.3s ease-in .5s both; }
  g.wob, #tvArt g.wob { animation: wig .35s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  g.stars { animation: spn 1.5s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes spn { to { transform: rotate(360deg); } }
  @keyframes shk { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  @keyframes bub { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-90px); opacity: 0; } }
  @keyframes waft { from { transform: translate(0, 0); opacity: .5; } to { transform: translate(14px, -10px); opacity: 1; } }
  @keyframes rise { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }
  @keyframes drip { from { transform: translateY(0); opacity: 1; } to { transform: translateY(40px); opacity: 0; } }
  @keyframes faint { 0% { transform: rotate(0); } 30% { transform: rotate(-12deg); } 100% { transform: rotate(84deg) translateY(10px); } }
  @keyframes run { from { transform: translateX(0); } to { transform: translateX(700px); } }
  @keyframes wig { from { transform: rotate(-5deg); } to { transform: rotate(5deg); } }
  /* ---------- 👃 family Sniff Test ---------- */
  #fam { flex-direction: column; align-items: center; padding: 10px; gap: 8px; overflow-y: auto; }
  #famBox { width: min(1100px, 100%); flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
  .card { background: #fff; border: 5px solid #333; border-radius: 20px; padding: 10px; box-shadow: 0 6px 0 #7cb342; }
  .card h2 { margin: 0 0 6px; text-align: center; font-size: clamp(20px, 3vw, 32px); }
  .who { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .faces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .face { font: inherit; font-weight: bold; font-size: 16px; border: 4px solid #333; border-radius: 18px; background: #fff; cursor: pointer; box-shadow: 0 5px 0 #333; padding: 4px; display: flex; flex-direction: column; align-items: center; color: #222; }
  .face span { font-size: clamp(36px, 7vh, 64px); line-height: 1.1; }
  .face:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .face.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  #famArt { flex: 1; min-height: 120px; }
  #famArt svg { width: 100%; height: 100%; display: block; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #7cb342; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #7cb342; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 📺 TV commercial ---------- */
  #tv { position: fixed; inset: 0; z-index: 50; background: #222; display: none; align-items: center; justify-content: center; padding: 12px; }
  #tv.on { display: flex; }
  #tvSet { position: relative; width: min(96vw, 150vh); aspect-ratio: 16 / 10; max-height: 96vh; background: #6d4c41; border: 8px solid #111; border-radius: 34px; padding: 3%; box-shadow: 0 10px 0 #111; }
  #tvScreen { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; border: 6px solid #111; background: #f8bbd0; }
  #tvScreen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tvSay { position: absolute; left: 4%; right: 4%; bottom: 4%; background: rgba(255,255,255,.93); border: 4px solid #333; border-radius: 18px;
    font-size: clamp(17px, 2.8vw, 32px); font-weight: bold; text-align: center; padding: 6px 10px; }
  #tvSay.dreamy { font-style: italic; color: #8e24aa; }
  #tvStop { position: absolute; top: 2%; right: 2%; z-index: 2; }
  #tvArt svg g.flt { animation: flt 5s linear infinite; }
  #tvArt svg g.drift { animation: drift 7s ease-in-out infinite alternate; }
  #tvArt svg g.slow { animation: slow 3.8s ease-in-out both; }
  #tvArt svg g.pop { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg g.zoomL { animation: zoomL 1.2s ease-in .3s both; }
  #tvArt svg g.zoomR { animation: zoomR 1.2s ease-in .5s both; }
  #tvArt svg g.toward { animation: toward 1.6s ease-out both; }
  #tvArt svg g.puff { animation: puff 1.4s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes flt { from { transform: translateY(-60px); } to { transform: translateY(560px); } }
  @keyframes drift { from { transform: translate(-20px, 0); } to { transform: translate(20px, -16px); } }
  @keyframes slow { from { transform: translateX(-140px); } to { transform: translateX(0); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes zoomL { from { transform: translateX(0); } to { transform: translateX(-900px); } }
  @keyframes zoomR { from { transform: translateX(0); } to { transform: translateX(900px); } }
  @keyframes toward { from { transform: translateX(var(--fx, 0)); } to { transform: translateX(0); } }
  @keyframes puff { from { transform: scale(.1); opacity: 1; } to { transform: scale(1.6); opacity: .85; } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view { flex-direction: column; overflow-y: auto; }
    #invLeft { width: 100%; height: 56vh; flex: none; }
    #invRight { min-height: 60vh; flex: none; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 640px) { .btn { min-height: 44px; font-size: 16px; padding: 3px; } .b-mix { font-size: 19px; } #pHelp { font-size: 15px; } .opt svg { width: 46px; height: 46px; } #invHelp { display: none; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #tv { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">💨 STINKY SMELL SHOP</h1>
    <div id="stage"><div id="stageArt"></div><button class="btn hide" id="nextSniff">👃 Next sniffer!</button></div>
    <div id="meterRow"><div id="meter"></div></div>
    <div id="invName"></div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="acts">
      <button class="btn b-mix" id="bMix">🌀 MIX &amp; SNIFF!</button>
      <button class="btn b-tv" id="bTV">📺 Commercial!</button>
      <button class="btn b-fam" id="bFam">👃 Family Sniff Test</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a tab, ⬅️➡️ pick · Space = mix · C = commercial · S = sniff test · Enter = printables</div>
  </div>
</div>
<div id="fam" class="screen"><div id="famBox"></div></div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Smell Lab</button>
    <h1 class="big">🖨️ PRINT &amp; MAKE</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. Paper, tape and crayons. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="tv"><div id="tvSet"><div id="tvScreen"><div id="tvArt"></div><div id="tvSay"></div></div>
  <button class="btn b-back" id="tvStop">⏹️ Stop</button></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 💨 STINKY SMELL SHOP: mix up to 3 silly smells into pretend perfume or shampoo, watch the Smell-O-Meter wobble,
// see the Game Factory gang sniff it, spin a fancy name, watch a perfume-ad commercial, play the family Sniff Test,
// then print fold-up paper bottles, labels, smell stickers, a shop poster and a Master Sniffer certificate.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is full color, LINE = true is black lines to color in. Art + helpers copied from the Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
