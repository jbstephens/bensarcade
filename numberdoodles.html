<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🔢 Number Doodles</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #fff6c9 0 36px, #ffedb0 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(28px, 5vw, 54px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff7a2f; letter-spacing: 2px; text-align: center; }
  .sub { margin: 2px 0 6px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.sel { outline: 5px solid #1e6bff; outline-offset: 2px; }
  .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-print { background: #8ef08e; } .b-go { background: #ffe066; }
  .b-pink { background: #ffc2d6; } .b-purple { background: #d7c2ff; } .b-orange { background: #ffcf8a; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .col { flex-direction: column; overflow: hidden; }
  .head { padding: 8px 10px 2px; position: relative; }
  .head .btn.corner { position: absolute; left: 10px; top: 8px; min-height: 48px; font-size: 18px; }
  /* home */
  #home .tiles { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 10px 22px 24px; align-content: center; }
  .tile { border: 5px solid #333; border-radius: 22px; box-shadow: 0 7px 0 #333; cursor: pointer; padding: 10px; text-align: center;
    font-size: clamp(18px, 2.4vw, 26px); font-weight: bold; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 120px; }
  .tile i { font-style: normal; font-size: clamp(36px, 6vw, 60px); line-height: 1.1; }
  .tile small { font-size: clamp(13px, 1.5vw, 17px); font-weight: normal; }
  .tile:active { transform: translateY(5px); box-shadow: 0 2px 0 #333; }
  .tile.sel { outline: 6px solid #1e6bff; outline-offset: 3px; }
  /* galleries */
  .grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; margin: 4px 4px -4px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #ff7a2f; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb .done { position: absolute; right: 6px; top: 4px; font-size: 22px; }
  /* lesson / sheet views */
  .view { flex-direction: row; gap: 10px; padding: 10px; }
  .paper { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; }
  .paper > svg, .padWrap { background: #fff; border: 5px solid #333; border-radius: 14px; box-shadow: 0 8px 0 #ff7a2f; max-width: 100%; max-height: 100%; }
  #lPaper > svg { height: calc(100vh - 40px); width: auto; aspect-ratio: 1; }
  #sPaper > svg, #nPaper > svg { height: calc(100vh - 40px); width: auto; aspect-ratio: 4 / 5; }
  #gPaper > svg { height: calc(100vh - 40px); width: auto; aspect-ratio: 1; }
  .side { width: min(42vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .title { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .help { font-size: 20px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px; min-height: 64px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .dots { display: flex; justify-content: center; gap: 10px; }
  .dots span { width: 22px; height: 22px; border-radius: 50%; border: 3px solid #333; background: #fff; }
  .dots span.on { background: #ff7a2f; }
  .keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .keys .btn { min-height: 46px; padding: 2px; font-size: 22px; }
  .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .names .btn { min-height: 44px; font-size: 16px; padding: 2px; }
  /* svg drawing animation (pathLength = 1) */
  .dr { stroke-dasharray: 1 1.2; stroke-dashoffset: 1.1; fill-opacity: 0; animation: drawIn var(--d, .9s) ease-out forwards; }
  @keyframes drawIn { 60% { stroke-dashoffset: 0; fill-opacity: 0; } 100% { stroke-dashoffset: 0; fill-opacity: 1; } }
  .glyph { transition: stroke .6s; }
  .pulse { animation: pulse .7s ease-in-out 4 alternate; }
  @keyframes pulse { to { stroke-width: 16; } }
  /* guess */
  #gChoices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #gChoices .btn { font-size: 48px; min-height: 90px; }
  #gChoices .btn.right { background: #8ef08e; } #gChoices .btn.wrong { background: #ff9a9a; }
  /* pad */
  .padWrap { position: relative; height: calc(100vh - 40px); aspect-ratio: 1; }
  .padWrap svg, .padWrap canvas { position: absolute; inset: 0; width: 100%; height: 100%; border-radius: 10px; }
  .padWrap canvas { touch-action: none; cursor: crosshair; }
  #crayons { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .picker { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; }
  .picker .btn { min-height: 42px; padding: 0; font-size: 22px; }
  .picker .btn.on { background: #ffe066; border-color: #ff3d6e; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (orientation: portrait) {
    .view { flex-direction: column; }
    .side { width: 100%; max-height: 46vh; }
    #lPaper > svg, #sPaper > svg, #nPaper > svg, #gPaper > svg, .padWrap { height: auto; width: 100%; max-height: 50vh; }
    #home .tiles { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } .help { font-size: 16px; min-height: 0; } .tile { min-height: 90px; } #gChoices .btn { min-height: 64px; font-size: 36px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="home" class="screen col on">
  <div class="head"><button class="btn b-back corner" id="hBack">⬅️ Back</button>
    <h1 class="big">🔢 NUMBER DOODLES</h1>
    <p class="sub">Turn numbers and letters into pictures with your pencil! ✏️</p></div>
  <div class="tiles" id="tiles"></div>
</div>
<div id="gal" class="screen col">
  <div class="head"><button class="btn b-back corner" id="galBack">⬅️ Back</button>
    <h1 class="big" id="galTitle"></h1><p class="sub" id="galSub"></p></div>
  <div class="grid" id="galGrid"></div>
</div>
<div id="lesson" class="screen view">
  <div class="paper" id="lPaper"></div>
  <div class="side">
    <div class="title" id="lTitle"></div>
    <div class="dots" id="lDots"></div>
    <div class="help" id="lHelp"></div>
    <div class="two">
      <button class="btn b-pink" id="lPrev">◀️ Step back</button>
      <button class="btn b-go" id="lNext">Next step ▶️</button>
    </div>
    <button class="btn b-purple" id="lReplay">🔁 Watch it again</button>
    <button class="btn b-print" id="lPrint">🖨️ Print the step sheet</button>
    <button class="btn b-orange" id="lPad">✏️ Try it on the Doodle Pad</button>
    <button class="btn b-back" id="lBack">⬅️ Back to doodles</button>
  </div>
</div>
<div id="name" class="screen view">
  <div class="paper" id="nPaper"></div>
  <div class="side">
    <div class="title">✍️ Name Doodle Maker</div>
    <div class="help" id="nHelp">Tap letters to make a name. Every letter turns into a doodle!</div>
    <div class="names" id="nNames"></div>
    <div class="keys" id="nKeys"></div>
    <div class="two">
      <button class="btn b-pink" id="nDel">⌫ Take one off</button>
      <button class="btn b-pink" id="nClear">🧽 Clear</button>
    </div>
    <button class="btn b-print" id="nPrint">🖨️ Print my poster</button>
    <button class="btn b-back" id="nBack">⬅️ Back</button>
  </div>
</div>
<div id="guess" class="screen view">
  <div class="paper" id="gPaper"></div>
  <div class="side">
    <div class="title">❓ Guess the Doodle</div>
    <div class="help" id="gHelp"></div>
    <div id="gChoices"></div>
    <button class="btn b-go" id="gNext">➡️ Next doodle</button>
    <button class="btn b-back" id="gBack">⬅️ Back</button>
  </div>
</div>
<div id="pad" class="screen view">
  <div class="paper"><div class="padWrap" id="padWrap"><div id="padBg"></div><canvas id="padCv"></canvas></div></div>
  <div class="side">
    <div class="title">✏️ Doodle Pad</div>
    <div class="help" id="pHelp">Pick a number, then draw on it. What can it turn into?</div>
    <div class="picker" id="pPick"></div>
    <button class="btn b-purple" id="pAbc">🔤 Show letters</button>
    <div id="crayons"></div>
    <div class="two">
      <button class="btn b-pink" id="pUndo">↩️ Undo</button>
      <button class="btn b-pink" id="pClear">🧽 Clear</button>
    </div>
    <button class="btn b-print" id="pPrint">🖨️ Print my doodle</button>
    <button class="btn b-back" id="pBack">⬅️ Back</button>
  </div>
</div>
<div id="sheet" class="screen view">
  <div class="paper" id="sPaper"></div>
  <div class="side">
    <div class="title" id="sTitle"></div>
    <div class="help" id="sHelp"></div>
    <div class="names hide" id="sNames"></div>
    <button class="btn b-print" id="sPrint">🖨️ Print it!</button>
    <div class="two">
      <button class="btn b-pink" id="sPrev">◀️ Last one</button>
      <button class="btn b-go" id="sNext">Next one ▶️</button>
    </div>
    <button class="btn b-back" id="sBack">⬅️ Back to printables</button>
  </div>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🔢 NUMBER DOODLES: numbers 0-9 and letters A-Z turned into pictures, step by step.
// Every doodle lives in a 200 x 200 box. The big number/letter ("glyph") fills x 50-150, y 28-172.
// Doodle parts are SVG <path>s with pathLength="1" so they can draw themselves on screen.
// A part that starts with '^' is drawn ON TOP of the glyph; the rest go behind it.
// Printed sheets are 800 x 1000 (portrait letter).
// =====================================================================
const K = '#333';
const n1 = v => Math.round(v * 10) / 10;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// ---------- drawing helpers (every part is a <path> so it can animate) ----------
function p(d, f, s, w) {
  return '<path d="' + d + '" fill="' + (f || 'none') + '" stroke="' + (s === undefined ? K : (s || 'none')) + '" stroke-width="' + (w || 4) +
    '" stroke-linecap="round" stroke-linejoin="round" pathLength="1"/>';
}
const cD = (x, y, r) => 'M' + n1(x - r) + ' ' + n1(y) + ' A' + r + ' ' + r + ' 0 1 0 ' + n1(x + r) + ' ' + n1(y) + ' A' + r + ' ' + r + ' 0 1 0 ' + n1(x - r) + ' ' + n1(y) + ' Z';
const eD = (x, y, rx, ry) => 'M' + n1(x - rx) + ' ' + n1(y) + ' A' + rx + ' ' + ry + ' 0 1 0 ' + n1(x + rx) + ' ' + n1(y) + ' A' + rx + ' ' + ry + ' 0 1 0 ' + n1(x - rx) + ' ' + n1(y) + ' Z';
const c = (x, y, r, f, s, w) => p(cD(x, y, r), f, s, w);
const e = (x, y, rx, ry, f, s, w) => p(eD(x, y, rx, ry), f, s, w);
const l = (d, s, w) => p(d, 'none', s || K, w || 4);
const dot = (x, y, r, f) => p(cD(x, y, r), f || K, 'none', 0);
const fill = (d, f) => p(d, f, 'none', 0);
const F = s => '^' + s;                     // draw on top of the number
const FA = arr => arr.map(F);
const U = s => '_' + s;                     // draw UNDER everything (big backgrounds)
function starD(x, y, r, pts, inner) {
  pts = pts || 5; inner = inner || .45; let d = '';
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + i * Math.PI / pts, rr = i % 2 ? r * inner : r;
    d += (i ? ' L' : 'M') + n1(x + Math.cos(a) * rr) + ' ' + n1(y + Math.sin(a) * rr); }
  return d + ' Z';
}
const star = (x, y, r, f, s) => p(starD(x, y, r), f || '#ffd740', s === undefined ? '#f9a825' : s, 3);
const cloud = (x, y, k) => { k = k || 1; return p('M' + n1(x - 24 * k) + ' ' + y + ' a' + 12 * k + ' ' + 12 * k + ' 0 0 1 ' + 10 * k + ' -' + 14 * k + ' a' + 14 * k + ' ' + 14 * k + ' 0 0 1 ' + 26 * k + ' -' + 2 * k + ' a' + 11 * k + ' ' + 11 * k + ' 0 0 1 ' + 12 * k + ' ' + 16 * k + ' Z', '#fff', '#64b5f6', 3); };
function wave(x, y, count, len, amp, col, w) {
  let d = 'M' + x + ' ' + y; for (let i = 0; i < count; i++) d += ' q' + len / 2 + ' ' + (-amp) + ' ' + len + ' 0';
  return l(d, col || '#42a5f5', w || 4);
}
// ---------- the big numbers and letters (stroke paths in the 200 box) ----------
const GLYPH = {
  0: 'M100 28 C162 28 162 172 100 172 C38 172 38 28 100 28 Z',
  1: 'M74 58 L106 28 L106 172 M74 172 L138 172',
  2: 'M58 64 Q58 28 100 28 Q142 28 142 66 Q142 98 58 172 L148 172',
  3: 'M58 48 Q76 28 100 28 Q138 28 138 62 Q138 96 98 98 Q142 100 142 136 Q142 172 100 172 Q72 172 56 152',
  4: 'M122 172 L122 28 L50 128 L152 128',
  5: 'M140 30 L72 30 L64 92 Q80 80 102 80 Q144 80 144 126 Q144 172 100 172 Q72 172 56 154',
  6: 'M134 44 Q120 28 100 28 Q58 28 58 104 Q58 172 102 172 Q142 172 142 132 Q142 94 102 94 Q64 94 58 124',
  7: 'M54 30 L148 30 L88 172',
  8: 'M100 96 Q64 96 64 62 Q64 28 100 28 Q136 28 136 62 Q136 96 100 96 Q58 96 58 134 Q58 172 100 172 Q142 172 142 134 Q142 96 100 96 Z',
  9: 'M140 68 Q140 28 100 28 Q60 28 60 68 Q60 106 100 106 Q140 106 140 68 L140 124 Q140 172 96 172 Q70 172 62 156',
  A: 'M50 172 L100 28 L150 172 M70 118 L130 118',
  B: 'M62 28 L62 172 M62 28 L104 28 Q136 28 136 62 Q136 96 104 96 L62 96 M104 96 Q144 96 144 134 Q144 172 104 172 L62 172',
  C: 'M142 54 Q126 28 98 28 Q52 28 52 100 Q52 172 98 172 Q126 172 142 146',
  D: 'M60 28 L60 172 L94 172 Q148 172 148 100 Q148 28 94 28 Z',
  E: 'M140 28 L62 28 L62 172 L140 172 M62 100 L126 100',
  F: 'M140 28 L64 28 L64 172 M64 98 L124 98',
  G: 'M142 54 Q126 28 98 28 Q52 28 52 100 Q52 172 98 172 Q144 172 144 112 L106 112',
  H: 'M58 28 L58 172 M142 28 L142 172 M58 100 L142 100',
  I: 'M70 28 L130 28 M100 28 L100 172 M70 172 L130 172',
  J: 'M118 30 L118 136 Q118 172 86 172 Q58 172 54 144',
  K: 'M62 28 L62 172 M138 28 L62 112 M90 82 L142 172',
  L: 'M66 28 L66 172 L140 172',
  M: 'M50 172 L58 28 L100 120 L142 28 L150 172',
  N: 'M60 172 L60 28 L140 172 L140 28',
  O: 'M100 28 C166 28 166 172 100 172 C34 172 34 28 100 28 Z',
  P: 'M64 172 L64 28 L104 28 Q142 28 142 66 Q142 104 104 104 L64 104',
  Q: 'M100 28 C160 28 160 160 100 160 C40 160 40 28 100 28 Z M118 134 L150 176',
  R: 'M62 172 L62 28 L104 28 Q140 28 140 64 Q140 100 104 100 L62 100 M98 100 L142 172',
  S: 'M140 52 Q126 28 100 28 Q60 28 60 62 Q60 92 100 100 Q142 108 142 138 Q142 172 100 172 Q70 172 56 148',
  T: 'M48 30 L152 30 M100 30 L100 172',
  U: 'M56 28 L56 120 Q56 172 100 172 Q144 172 144 120 L144 28',
  V: 'M50 28 L100 172 L150 28',
  W: 'M44 28 L70 172 L100 70 L130 172 L156 28',
  X: 'M54 28 L146 172 M146 28 L54 172',
  Y: 'M54 28 L100 96 L146 28 M100 96 L100 172',
  Z: 'M54 30 L146 30 L54 170 L146 170'
};
const DIGITS = '0123456789'.split(''), LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
// ---------- doodle book: {id, ch, name, rot, ink, steps: [[text, parts...], ...]} (step 1, the glyph, is added for you) ----------
const DOODLES = [];
function D(id, ch, name, ink, rot, steps) { DOODLES.push({ id: id, ch: ch, name: name, ink: ink, rot: rot || 0, steps: steps }); }
// ===== 0 =====
D('n0robo', '0', 'Robo\'s head', '#1d2836', 0, [
  ['Draw a dark visor inside, with two blue eyes.', p('M78 66 L122 66 Q136 66 136 80 L136 98 Q136 112 122 112 L78 112 Q64 112 64 98 L64 80 Q64 66 78 66 Z', '#1d2836'),
    e(86, 89, 8, 10, '#40c4ff', '#40c4ff', 2), e(114, 89, 8, 10, '#40c4ff', '#40c4ff', 2), dot(83, 85, 2.5, '#fff'), dot(111, 85, 2.5, '#fff')],
  ['Add blue ear pods on both sides and a little smile.', e(44, 100, 9, 17, '#2979ff'), e(156, 100, 9, 17, '#2979ff'), l('M86 136 Q100 148 114 136')],
  ['Top it with an antenna. Beep boop, it\'s Robo!', l('M100 28 L100 10'), c(100, 9, 7, '#ff5252'), l('M126 44 Q142 62 144 86', '#81d4fa', 5)]]);
D('n0balloon', '0', 'a hot air balloon', '#e53935', 0, [
  ['Add stripes down the balloon.', l('M100 28 Q66 100 100 172', '#ff5252', 6), l('M100 28 Q134 100 100 172', '#40c4ff', 6), l('M50 100 Q100 118 150 100', '#ffd740', 7)],
  ['Draw ropes and a basket under it.', l('M70 152 L86 180 M130 152 L114 180', '#795548', 3), p('M82 178 L118 178 L114 197 L86 197 Z', '#c68642')],
  ['Add fluffy clouds. Up, up and away!', cloud(36, 60), cloud(172, 130, .8), cloud(160, 40, .7)]]);
// ===== 1 =====
D('n1rocket', '1', 'a rocket', '#c62828', 0, [
  ['Draw a tall rocket body around the 1.', p('M106 14 Q140 44 138 96 L138 150 L74 150 L74 96 Q72 44 106 14 Z', '#eceff1')],
  ['Add a round window and two fins.', F(c(106, 92, 13, '#81d4fa', K, 4)), p('M74 112 L50 156 L74 148 Z', '#ff5252'), p('M138 112 L162 156 L138 148 Z', '#ff5252')],
  ['Blast off with fire and stars!', p('M86 174 Q94 200 106 186 Q118 200 126 174 Z', '#ffb300', '#ff6d00', 4), star(36, 40, 10), star(166, 70, 8), star(40, 120, 7)]]);
D('n1candle', '1', 'a birthday candle', '#8e24aa', 0, [
  ['Draw a candle around the 1.', p('M86 42 L126 42 L126 172 L86 172 Z', '#ce93d8')],
  ['Add a flickery flame on top.', p('M106 38 Q88 20 106 2 Q124 20 106 38 Z', '#ffd54f', '#ff8f00', 4)],
  ['Add stripes and a yummy cake under it!', F(l('M86 74 L126 62 M86 108 L126 96 M86 142 L126 130', '#fff59d', 6)), F(p('M36 172 L164 172 L164 196 L36 196 Z', '#f8bbd0')), F(wave(36, 182, 8, 16, -6, '#fff', 4))]]);
// ===== 2 =====
D('n2swan', '2', 'a swan', '#546e7a', 0, [
  ['The top of the 2 is a neck. Add an orange beak and an eye.', p('M60 56 L38 72 L62 70 Z', '#ff9800'), dot(72, 48, 4)],
  ['Draw a big round body at the bottom, with a wing.', p('M58 172 Q52 132 92 128 Q124 126 150 150 L170 124 Q176 172 150 186 Q100 198 58 172 Z', '#fff', '#90a4ae', 4), F(l('M88 154 Q118 140 142 166', '#90a4ae', 4))],
  ['Add ripples in the water.', wave(14, 192, 6, 28, 7), wave(150, 112, 1, 30, 6, '#90caf9')]]);

let AC = null;

const tada = () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => blip(f, .2, 'triangle', .14), i * 110));

let toastT = 0;

// =====================================================================
// SCREENS
// =====================================================================
const $ = id => document.getElementById(id);
let screen = 'home', galMode = 'num', selIdx = 0;

const TILES = [
  ['🔢', 'Number Lessons', '0 to 9 turn into pictures', '#ffe066', () => openGal('num')],
  ['🔤', 'Letter Doodles', 'A to Z Game Factory doodles', '#9be3ff', () => openGal('let')],
  ['✍️', 'Name Doodle Maker', 'Your name, all doodled!', '#ffc2d6', () => openName()],
  ['❓', 'Guess the Doodle', 'Which number was it?', '#b9f6ca', () => openGuess()],
  ['✏️', 'Doodle Pad', 'Draw on a big number', '#ffcf8a', () => openPad('6')],

function renderHome() {
  $('tiles').innerHTML = TILES.map((t, i) => '<div class="tile" data-i="' + i + '" style="background:' + t[3] + '"><i>' + t[0] + '</i>' + t[1] + '<small>' + t[2] + '</small></div>').join('');

function goHome() { show('home'); selIdx = 0; markSel(); }
// ---- galleries: number lessons, letter doodles, printables ----
const PRINTS = [];

MATH.forEach((m, i) => PRINTS.push({ name: '➕ Doodle Math ' + (i + 1), help: 'Solve each sum, then turn the answer into a doodle!', build: () => mathSheet(i) }));
MONSTERS.forEach((m, i) => PRINTS.push({ name: '👾 Number Monster ' + (i + 1), help: 'Glue numbers together into a silly creature!', build: () => monsterSheet(i) }));
PRINTS.push({ name: '🏆 Doodle Champion', help: 'A prize certificate! Pick who it\'s for.', build: () => certSheet(certWho), cert: true });
let certWho = 'Ben';
function galItems() { return galMode === 'num' ? NUM_DOODLES : galMode === 'let' ? LET_DOODLES : PRINTS; }
function openGal(mode) {
  galMode = mode; show('gal'); selIdx = 0;
  $('galTitle').textContent = mode === 'num' ? '🔢 NUMBER LESSONS' : mode === 'let' ? '🔤 LETTER DOODLES' : '🖨️ PRINTABLES';
  $('galSub').textContent = mode === 'print' ? 'Tap a page to see it, then print it!' : 'Tap a doodle to learn it step by step!';

    if (mode === 'print') h += '<div class="thumb" data-i="' + i + '">' + it.build().replace('<svg ', '<svg style="aspect-ratio:4/5" ') + '<b>' + esc(it.name) + '</b></div>';
    else h += '<div class="thumb" data-i="' + i + '">' + (state.done[it.id] ? '<span class="done">✅</span>' : '') + svg200(doodle(it)) + '<b>' + it.ch + ' → ' + esc(it.name) + '</b></div>';

  markSel();
}
function openItem(i) { blip(660, .08); if (galMode === 'print') openSheet(i); else openLesson(galItems()[i].id); }
function navEls() { return screen === 'home' ? Array.from(document.querySelectorAll('#tiles .tile')) : screen === 'gal' ? Array.from(document.querySelectorAll('#galGrid .thumb')) : []; }
function markSel() {
  navEls().forEach((el, i) => { el.classList.toggle('sel', i === selIdx); if (i === selIdx && el.scrollIntoView && screen === 'gal') { try { el.scrollIntoView({ block: 'nearest' }); } catch (_) {} } });
}
function gridCols(els) { if (!els.length) return 1; let k = 0; const top = els[0].offsetTop; els.forEach(t => { if (t.offsetTop === top) k++; }); return Math.max(1, k); }
// ---- doodle lessons ----
let cur = null, step = 0, lessonList = NUM_DOODLES;
function openLesson(id) {

  step = 0; show('lesson'); $('lTitle').textContent = cur.ch + ' → ' + cur.name; renderLesson(0);
}
function renderLesson(anim) {
  const all = stepsOf(cur), last = all.length - 1;
  $('lPaper').innerHTML = svg200(doodle(cur, { upto: step, anim: anim }));
  $('lDots').innerHTML = all.map((s, i) => '<span class="' + (i <= step ? 'on' : '') + '"></span>').join('');

  $('lPrev').classList.toggle('hide', step === 0);
}
function nextStep() {
  const last = nSteps(cur) - 1;
  if (step >= last) { const i = lessonList.indexOf(cur); openLesson(lessonList[(i + 1) % lessonList.length].id); return; }

function prevStep() { if (step > 0) { step--; renderLesson(-1); blip(440, .06); } }
function finishLesson() {
  const first = !state.done[cur.id];
  state.done[cur.id] = 1; saveState(); award();
  setTimeout(tada, 900);
  toast((first ? '⭐ ' : '') + 'You made ' + cur.name + '!');
}
function printLesson() { printSVG(stepSheet(cur)); toast('🖨️ Printing the step sheet!'); }
// ---- Guess the Doodle ----
let gCur = null, gDone = false, gLast = '';
function openGuess() { show('guess'); newGuess(); }
function newGuess() {
  let pool = NUM_DOODLES.filter(d => d.id !== gLast); gCur = pool[Math.floor(Math.random() * pool.length)]; gLast = gCur.id; gDone = false;
  $('gPaper').innerHTML = svg200(doodle(gCur, { anim: 0, guess: true, glyphCol: gCur.ink, gap: .75, dur: 1.4 }));
  const opts = [gCur.ch]; while (opts.length < 4) { const k = DIGITS[Math.floor(Math.random() * 10)]; if (opts.indexOf(k) < 0) opts.push(k); }
  opts.sort();
  $('gChoices').innerHTML = opts.map(k => '<button class="btn" data-k="' + k + '">' + k + '</button>').join('');
  $('gChoices').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => pickGuess(b.dataset.k)));
  $('gHelp').textContent = 'Watch it draw… which NUMBER is hiding in this doodle? (Right so far: ' + (state.guessRight || 0) + ')';
}
function pickGuess(k) {
  if (gDone || !gCur) return;
  const b = Array.from($('gChoices').querySelectorAll('.btn')).find(x => x.dataset.k === k);
  if (k !== gCur.ch) { if (b) b.classList.add('wrong'); blip(200, .25, 'sawtooth', .06); $('gHelp').textContent = 'Hmm, not ' + k + '. Look for the hidden number and try again!'; return; }
  gDone = true; if (b) b.classList.add('right');
  state.guessRight = (state.guessRight || 0) + 1; saveState(); tada();
  $('gPaper').querySelectorAll('.dr').forEach(el => el.classList.remove('dr'));
  const g = $('gPaper').querySelector('.glyph'); if (g) { g.setAttribute('stroke', '#ff1744'); g.classList.add('pulse'); }
  $('gHelp').textContent = 'YES! It was a ' + gCur.ch + '! It turned into ' + gCur.name + '. 🎉 (Right so far: ' + state.guessRight + ')';
}
// ---- Doodle Pad ----
const CRAYONS = ['#222222', '#e53935', '#fb8c00', '#fdd835', '#43a047', '#1e88e5', '#8e24aa', '#8d6e63'];
let padCh = '6', padAbc = false, pen = '#222222', strokes = {}, stroke = null;
function openPad(ch) { show('pad'); setPadCh(ch || padCh); renderPicker(); sizePad(); }
function setPadCh(ch) {
  padCh = ch; padAbc = /[A-Z]/.test(ch);
  $('padBg').innerHTML = svg200(faintGlyph(ch, '#cfcfcf', 9));
  const ideas = DOODLES.filter(d => d.ch === ch).map(d => d.name);
  $('pHelp').textContent = 'Draw on the ' + ch + '! Ideas: ' + ideas.join(' or ') + '… or something new!';
  renderPicker(); drawPad();
}
function renderPicker() {
  const list = padAbc ? LETTERS : DIGITS;
  $('pPick').innerHTML = list.map(k => '<button class="btn' + (k === padCh ? ' on' : '') + '" data-k="' + k + '">' + k + '</button>').join('');
  $('pPick').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => { blip(600, .06); setPadCh(b.dataset.k); }));
  $('pAbc').textContent = padAbc ? '🔢 Show numbers' : '🔤 Show letters';
}
function renderCrayons() {
  $('crayons').innerHTML = CRAYONS.map(c => '<div class="sw' + (c === pen ? ' sel' : '') + '" data-c="' + c + '" style="background:' + c + '"></div>').join('');
  $('crayons').querySelectorAll('.sw').forEach(el => el.addEventListener('click', () => { pen = el.dataset.c; renderCrayons(); }));
}
function sizePad() { const cv = $('padCv'); if (!cv) return; cv.width = 800; cv.height = 800; drawPad(); }

function drawPad() { const cv = $('padCv'); const ctx = cv && cv.getContext && cv.getContext('2d'); if (!ctx) return; ctx.clearRect(0, 0, 800, 800); strokeAll(ctx, strokes[padCh] || [], 1); }
function padXY(ev) { const r = $('padCv').getBoundingClientRect(); return [n1((ev.clientX - r.left) / (r.width || 1) * 800), n1((ev.clientY - r.top) / (r.height || 1) * 800)]; }
function penDown(ev) { if (screen !== 'pad') return; if (ev.preventDefault) ev.preventDefault(); const xy = padXY(ev); stroke = { c: pen, p: xy }; (strokes[padCh] = strokes[padCh] || []).push(stroke); drawPad(); }

}
function printPad() { printSVG(padSheet(padCh, padImage())); toast('🖨️ Printing your doodle!'); }
// ---- Name Doodle Maker ----
let word = 'BEN';
function nameButtons(boxId, onPick, isOn) {
  $(boxId).innerHTML = PEOPLE.map(p2 => '<button class="btn' + (isOn(p2) ? ' b-go' : '') + '" data-n="' + p2 + '">' + p2 + '</button>').join('');
  $(boxId).querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => { blip(600, .06); onPick(b.dataset.n); }));
}
function openName() {
  show('name');
  $('nKeys').innerHTML = LETTERS.map(k => '<button class="btn" data-k="' + k + '">' + k + '</button>').join('');
  $('nKeys').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => addLetter(b.dataset.k)));
  renderName();
}
function renderName() {
  nameButtons('nNames', nm => { word = nm.toUpperCase(); renderName(); }, nm => nm.toUpperCase() === word);
  $('nPaper').innerHTML = namePoster(word);
  $('nHelp').textContent = word ? word.split('').map(ch => ch + ' = ' + LETTER_DOODLE[ch].name).join(', ') : 'Tap letters to make a name. Every letter turns into a doodle!';
}
function addLetter(k) { if (word.length >= 10) { toast('That\'s 10 letters, the most that fit!'); return; } if (!LETTER_DOODLE[k]) return; word += k; scratch(); renderName(); }
function delLetter() { word = word.slice(0, -1); blip(400, .06); renderName(); }
function printName() { if (!word) { toast('Pick some letters first!'); return; } printSVG(namePoster(word)); toast('🖨️ Printing your name poster!'); }
// ---- printable sheet view ----
let sheetI = 0;
function openSheet(i) { sheetI = (i + PRINTS.length) % PRINTS.length; selIdx = sheetI; show('sheet'); renderSheet(); }
function renderSheet() {
  const pr = PRINTS[sheetI];
  $('sTitle').textContent = pr.name; $('sHelp').textContent = pr.help;
  $('sNames').classList.toggle('hide', !pr.cert);
  if (pr.cert) nameButtons('sNames', nm => { certWho = nm; renderSheet(); }, nm => nm === certWho);
  $('sPaper').innerHTML = pr.build();
}
function printSheet() { const pr = PRINTS[sheetI]; printSVG(pr.build()); toast('🖨️ Printing ' + pr.name.replace(/^\S+ /, '') + '!'); }
// ---- printing (Chrome + iPad Safari): only #printArea shows on paper ----
function printSVG(svg) {
  $('printArea').innerHTML = svg;
  state.prints = (state.prints || 0) + 1; saveState(); award();
  setTimeout(() => { try { if (typeof window.print === 'function') window.print(); } catch (_) {} }, 60);
}
// ---- leaving ----
function leave() {
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
function goBack() {
  if (screen === 'home') leave();
  else if (screen === 'lesson') { openGal(/[0-9]/.test(cur.ch) ? 'num' : 'let'); selIdx = Math.max(0, galItems().indexOf(cur)); markSel(); }
  else if (screen === 'sheet') { const k = sheetI; openGal('print'); selIdx = k; markSel(); }
  else { stroke = null; goHome(); }
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function onKey(ev) {
  const k = ev.key;
  if (k === 'Escape' || (k === 'Backspace' && screen !== 'name')) { ev.preventDefault(); goBack(); return; }
  if (screen === 'home' || screen === 'gal') {
    const els = navEls(), N = els.length, cols = gridCols(els);
    if (k === 'ArrowRight') selIdx = Math.min(N - 1, selIdx + 1);
    else if (k === 'ArrowLeft') selIdx = Math.max(0, selIdx - 1);
    else if (k === 'ArrowDown') selIdx = Math.min(N - 1, selIdx + cols);
    else if (k === 'ArrowUp') selIdx = Math.max(0, selIdx - cols);
    else if (k === 'Enter' || k === ' ') { ev.preventDefault(); if (screen === 'home') TILES[selIdx][4](); else openItem(selIdx); return; }
    else if ((k === 'p' || k === 'P') && screen === 'gal' && galMode === 'print') { sheetI = selIdx; printSheet(); return; }

  } else if (screen === 'lesson') {
    if (k === 'ArrowRight' || k === 'Enter' || k === ' ') { ev.preventDefault(); nextStep(); }
    else if (k === 'ArrowLeft') { ev.preventDefault(); prevStep(); }
    else if (k === 'r' || k === 'R') renderLesson(0);
    else if (k === 'p' || k === 'P') printLesson();

  } else if (screen === 'pad') {
    if (/^[0-9]$/.test(k)) setPadCh(k);
    else if (k === 'p' || k === 'P') printPad();

    if (k === 'Backspace') { ev.preventDefault(); delLetter(); }
    else if (k === 'Enter' || k === 'p' || k === 'P') printName();
  } else if (screen === 'sheet') {
    if (k === 'ArrowRight' || k === 'ArrowDown') { ev.preventDefault(); openSheet(sheetI + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { ev.preventDefault(); openSheet(sheetI - 1); }

  }
}
function init() {
  loadState(); renderHome(); renderCrayons(); markSel();
  const tap = (id, fn) => $(id).addEventListener('click', ev => { fn(ev); try { ev.currentTarget.blur(); } catch (_) {} });

  tap('lNext', nextStep); tap('lPrev', prevStep); tap('lReplay', () => renderLesson(0)); tap('lPrint', printLesson); tap('lPad', () => openPad(cur.ch)); tap('lBack', goBack);
  tap('nDel', delLetter); tap('nClear', () => { word = ''; renderName(); }); tap('nPrint', printName); tap('nBack', goBack);
  tap('gNext', newGuess); tap('gBack', goBack);
  tap('pAbc', () => { padAbc = !padAbc; renderPicker(); }); tap('pUndo', () => { (strokes[padCh] || []).pop(); drawPad(); });
  tap('pClear', () => { strokes[padCh] = []; drawPad(); }); tap('pPrint', printPad); tap('pBack', goBack);
  tap('sPrint', printSheet); tap('sPrev', () => openSheet(sheetI - 1)); tap('sNext', () => openSheet(sheetI + 1)); tap('sBack', goBack);

}
