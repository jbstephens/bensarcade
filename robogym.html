<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🏋️ Robo's Training Gym</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }

  input, textarea { font: inherit; user-select: text; -webkit-user-select: text; }

  #top { display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; flex-wrap: wrap; justify-content: center; }
  #top h1 { margin: 0; font-size: clamp(24px, 3.2vw, 42px); color: #fff; -webkit-text-stroke: 2px #2a1d4a; text-shadow: 3px 3px 0 #2a1d4a; letter-spacing: 1px; white-space: nowrap; }
  #bubble { flex: 1; min-width: 260px; max-width: 760px; background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 20px;
    padding: 6px 14px; font-size: clamp(16px, 1.9vw, 22px); font-weight: bold; cursor: pointer; }
  #sceneBox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; padding: 0 8px; }
  #scene { width: 100%; height: 100%; display: block; overflow: hidden; }

  .spot:hover { transform: scale(1.04); }
  .spot.pop { animation: pop .45s; }
  @keyframes pop { 30% { transform: scale(1.12) rotate(-3deg); } 60% { transform: scale(.96) rotate(2deg); } }
  .twinkle { animation: tw 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes tw { 50% { opacity: .25; transform: scale(.7); } }
  .blink { animation: bl 1s steps(2) infinite; }
  @keyframes bl { 50% { opacity: 0; } }
  #bar { display: flex; gap: 10px; padding: 6px 12px 12px; justify-content: center; flex-wrap: wrap; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #2a1d4a; border-radius: 16px; background: #ffe082;
    padding: 8px 14px; cursor: pointer; box-shadow: 0 5px 0 #2a1d4a; color: #222; min-height: 56px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1d4a; }
  .b1 { background: #a5f2a5; } .b2 { background: #b3e5fc; } .b3 { background: #d1b8ff; } .b4 { background: #ffccbc; } .b5 { background: #fff0c8; }

  .panel { position: fixed; inset: 0; background: rgba(20, 16, 50, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .panel.on { display: flex; }
  .card { background: #fffbe8; border: 6px solid #2a1d4a; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1100px;

  .card h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.2vw, 36px); }
  .hint { margin: 0; text-align: center; font-size: 19px; font-weight: bold; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .big { font-size: 26px; padding: 10px 14px; border: 4px solid #2a1d4a; border-radius: 14px; width: 100%; background: #fff; }
  #prGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .thumb { background: #fff; border: 5px solid #2a1d4a; border-radius: 16px; padding: 6px; cursor: pointer; box-shadow: 0 5px 0 #ffb74d;
    display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding-top: 4px; }
  .thumb:active { transform: scale(.96); }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(50vh, 600px); width: auto; max-width: 100%; border: 4px solid #2a1d4a; border-radius: 8px; background: #fff; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fffbe8; border: 5px solid #2a1d4a;
    border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 90; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px 10px; } #top h1 { font-size: 22px; } }

    @page { size: letter portrait; margin: 0.3in; }

    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  body { background: radial-gradient(circle at 50% 30%, #4fc3f7, #01579b 80%); }
  #meter { display: flex; align-items: center; gap: 6px; background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 16px; padding: 4px 10px; font-size: 20px; font-weight: bold; white-space: nowrap; }
  #meter .bar { width: 120px; height: 20px; border: 3px solid #2a1d4a; border-radius: 10px; background: #fff; overflow: hidden; }
  #meter .fill { height: 100%; width: 0; background: linear-gradient(90deg, #ffd740, #69f0ae); transition: width .6s; }
  #meter.full { animation: pop .6s 3; background: #fff59d; }

  .act { font-size: 30px; min-width: 240px; min-height: 76px; touch-action: manipulation; }
  .pbar { width: min(520px, 90%); height: 26px; border: 4px solid #2a1d4a; border-radius: 14px; background: #fff; overflow: hidden; }
  .pbar div { height: 100%; width: 0; background: linear-gradient(90deg, #ff8a65, #ffd740, #69f0ae); }
  #irl { background: #e8f5e9; border: 4px dashed #2e7d32; border-radius: 18px; padding: 8px 12px; display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #irlTxt { font-size: clamp(18px, 2.2vw, 24px); font-weight: bold; text-align: center; flex: 1; min-width: 240px; }
  #cd { position: fixed; inset: 0; z-index: 80; display: none; align-items: center; justify-content: center; flex-direction: column; background: rgba(1, 87, 155, .88); color: #fff; }
  #cd.on { display: flex; }
  #cdNum { font-size: min(34vh, 260px); font-weight: bold; -webkit-text-stroke: 6px #2a1d4a; text-shadow: 8px 8px 0 #2a1d4a; line-height: 1; }
  #cdTxt { font-size: clamp(24px, 4vw, 44px); font-weight: bold; text-align: center; padding: 0 16px; -webkit-text-stroke: 1.5px #2a1d4a; }
  #cdRobo { width: min(30vh, 220px); height: auto; }
  .bounce { animation: bnc .7s ease-in-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  @keyframes bnc { 50% { transform: translateY(-14%) scaleY(1.04); } }
  .beat { transform-box: fill-box; transform-origin: center; transition: transform .1s; }
  .belt { animation: belt .5s linear infinite; }
  @keyframes belt { to { transform: translateX(-40px); } }
  .swing { animation: swing .5s ease-out; transform-box: view-box; transform-origin: 300px 20px; }
  @keyframes swing { 30% { transform: rotate(-8deg); } 70% { transform: rotate(4deg); } }
</style>
</head>
<body>
<div id="room">
  <div id="top">
    <h1>🏋️ ROBO'S GYM</h1>
    <div id="bubble">🤖 Welcome to my Training Gym! Tap a station to train. Get a ⭐ at every station to fill my READY meter!</div>

  </div>
  <div id="sceneBox"><svg id="scene" viewBox="0 0 1000 620" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div id="bar">
    <button class="btn b4" data-st="lift">🏋️ Lift</button>
    <button class="btn b2" data-st="tread">🏃 Treadmill</button>
    <button class="btn b1" data-st="jump">🦘 Jump</button>
    <button class="btn b5" data-st="punch">🥊 Punch</button>
    <button class="btn b3" data-st="stretch">🧘 Stretch</button>
    <button class="btn b5" id="bCert">📜 Certificate</button>
  </div>
</div>
<div id="stPanel" class="panel"><div class="card">
  <h2 id="stTitle">🏋️ Weight Lift</h2>
  <p class="hint" id="stHow"></p>
  <div id="gArea"></div>
  <div id="gStatus"></div>
  <div id="irl"><div id="irlTxt"></div><button class="btn b1" id="irlGo">▶️ Let's go!</button></div>
  <div class="row"><button class="btn b2" id="gAgain">🔁 Play again</button><button class="btn b4" data-close="1">⬅️ Back to the gym</button></div>
</div></div>
<div id="cd"><svg id="cdRobo" viewBox="-70 -75 140 140" xmlns="http://www.w3.org/2000/svg"></svg><div id="cdNum">3</div><div id="cdTxt"></div><button class="btn b4" id="cdStop" style="margin-top:12px">⏹️ Stop</button></div>
<script>

    '<path d="M-4 -3 L13 -9.6 M-4 3 L13 9.6" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" fill="none"/>' +

// =====================================================================
