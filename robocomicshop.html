<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Robo Comic Shop</title>
<script src="touchpad.js?v=10"></script>
<style id="pageSize">@page { size: letter portrait; margin: 0.3in; }</style>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #1a1033; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas#game { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fff3e0; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fff3e0; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #6d4c41; }
  #printBox .pbTip { font-size: 20px; color: #5d4037; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  #printBox.land .pbPage { width: min(94vw, 960px); }
  @media print {
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage, #printBox.land .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
// 📚 THE ROBO COMIC SHOP: read 8 ready-made Robo comic books, make your own (no typing, all buttons),
// then print them as big pages or as a little folded book. Characters are copied from the real games:
// Robo (robomovie.html), the crew + Dusty (robojump13.html drawCast), King + Baby Gloop and Sparks (snowdaymovie.html).
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
let frame = 0, beatClock = 0;
const beatLen = () => 30;                                 // (Musical Robo's speaker thump needs these)
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function sledShape() {} function snowball() {} function mug() {}   // (Sparks + Gloop have snowy extras we never use here)
// ===================== 🎨 drawing helpers + the characters, copied from the games =====================
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h);
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(str, x, y);   // the classic Robo Jump outline
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function heartPath(x, y, s) {                            // a heart shape: (x, y) = middle, s = half width
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
  ctx.closePath();
}
function heart(x, y, s, fill = '#ff5c8a') {              // (the movie's little heart, for Dusty's happy screen)
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function poly(pts, c, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw == null ? 3 : lw; ctx.stroke(); }
}
function bang(x, y) { roundRect(x - 14, y - 40, 28, 40, 8, '#ffd740'); text('!', x, y - 8, 30, '#d50000'); }
// ----- 🤖 Robo + his team: the same Robo body as always (Robo Jump 8-11), in each friend's own colors -----
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true };       // 💚 ROBO 2.0 (no antenna!)
const PAL_GLINT = { head: '#ffe3ef', body: '#fff0e0', visor: '#1a2540', eye: '#64ffda', legs: '#ff9e80', pod: '#64ffda', glint: true };  // ✨ GLINT
const PAL_PINK = { head: '#f8bbd0', body: '#fce4ec', visor: '#4a148c', eye: '#ff80ab', legs: '#ec407a', pod: '#f06292', pink: true };    // 🎀 PINK ROBO (big bow + a heart)
const PAL_NEGA = { head: '#37474f', body: '#263238', visor: '#b71c1c', eye: '#e040fb', legs: '#4a148c', pod: '#7b1fa2', nega: true };    // 🛡️ NEGA-ROBO
const PAL_PROTO = { head: '#ffd740', body: '#ffe57f', visor: '#3e2723', eye: '#ffea00', legs: '#ff8f00', pod: '#ff6f00' };               // 🏆 GOLDEN PROTOTYPE
const TEAM_PAL = { robo: PAL_ROBO, robo2: PAL_R2, glint: PAL_GLINT, pink: PAL_PINK, nega: PAL_NEGA };
function drawRoboBase(p, pal, hat) {
  const sx = 1 / (p.squash || 1), sy = p.squash || 1;
  const w = p.w * sx, h = p.h * sy, face = p.face || 1;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h, es = w / 30;
  if (p.hovering || p.dashT > 0) {                       // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = pal.pink ? '#ff80ab' : '#7df9ff';
    for (const fx of [x + w * 0.23, x + w * 0.77]) { ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill(); }
  }
  ctx.fillStyle = pal.legs;
  ctx.fillRect(x + 4 * es, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); ctx.fillRect(x + w - 12 * es, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40));
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6 * es, pal.body);
  if (!pal.r2 && !pal.pink) circle(x + w / 2, y + h * 0.7, 3 * es, pal.nega ? '#e040fb' : pal.pod);
  roundRect(x - 5 * es, y + h * 0.3 - 3, 6 * es, 9 * (h / 40), 3, pal.pod);
  roundRect(x + w - 1 * es, y + h * 0.3 - 3, 6 * es, 9 * (h / 40), 3, pal.pod);
  roundRect(x - 2, y, w + 4, h * 0.55, 12 * es, pal.head);
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9 * es, pal.visor);
  const ex = x + w / 2 + face * 3 * es, ey = y + h * 0.27, blink = frame % 180 < 6 ? 1 : 5 * (h / 40);
  if (pal.nega) { circle(ex - 6 * es, ey, 6 * es, 'rgba(224,64,251,.35)'); circle(ex + 6 * es, ey, 6 * es, 'rgba(224,64,251,.35)'); }
  ctx.fillStyle = pal.eye;
  ctx.beginPath(); ctx.ellipse(ex - 6 * es, ey, 3.5 * es, Math.max(0.5, blink), 0, 0, 7); ctx.ellipse(ex + 6 * es, ey, 3.5 * es, Math.max(0.5, blink), 0, 0, 7); ctx.fill();
  if (pal.r2) {                                          // 💚 Robo 2.0: a happy smile, cute pixel freckles and a "2.0" (no antenna!)
    ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey + 6 * es, 3.5 * es, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.fillStyle = '#ff00e5'; ctx.fillRect(x + 3, y + 3, 4 * es, 4 * es); ctx.fillStyle = '#00e676'; ctx.fillRect(x + w - 7 * es, y + 5, 4 * es, 4 * es);
    ctx.fillStyle = '#7b1fa2'; ctx.font = `bold ${Math.round(9 * es)}px Arial`; ctx.textAlign = 'center'; ctx.fillText('2.0', x + w / 2, y + h * 0.84);
  }
  if (pal.pink) {                                        // 🎀 Pink Robo: a BIG pink bow, eyelashes and a heart on her chest
    ctx.strokeStyle = '#4a148c'; ctx.lineWidth = Math.max(1, 1.3 * es);
    for (const d of [-1, 1]) for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(ex + d * 6 * es + k * 2 * es, ey - 4 * es); ctx.lineTo(ex + d * 6 * es + k * 3 * es, ey - 7 * es); ctx.stroke(); }
    ctx.fillStyle = '#ff4081'; heartPath(x + w / 2, y + h * 0.69, 4.5 * es); ctx.fill();
    const bx = x + w - 5 * es, by = y + 1 * es, s = es;
    poly([bx, by, bx - 11 * s, by - 8 * s, bx - 11 * s, by + 8 * s], '#ff4081', '#c2185b', 1.2);
    poly([bx, by, bx + 11 * s, by - 8 * s, bx + 11 * s, by + 8 * s], '#ff4081', '#c2185b', 1.2);
    circle(bx, by, 3.2 * s, '#f50057');
  }
  if (pal.nega) { ctx.fillStyle = '#7b1fa2'; ctx.beginPath(); ctx.moveTo(x + 4, y + 2); ctx.lineTo(x + 2, y - 8 * es); ctx.lineTo(x + 11 * es, y + 1); ctx.moveTo(x + w - 4, y + 2); ctx.lineTo(x + w - 2, y - 8 * es); ctx.lineTo(x + w - 11 * es, y + 1); ctx.fill(); }
  if (pal.glint && frame % 50 < 25) drawStar(x + w + 2, y - 2, 4 * es, '#64ffda', frame * 0.1);   // ✨ Glint sparkles
  if (pal === PAL_PROTO) { ctx.strokeStyle = '#ff6f00'; ctx.lineWidth = 2 * es; ctx.beginPath(); ctx.moveTo(x + 6 * es, y + 6 * es); ctx.lineTo(x + w - 6 * es, y + h * 0.5 - 8 * es); ctx.moveTo(x + w - 6 * es, y + 6 * es); ctx.lineTo(x + 6 * es, y + h * 0.5 - 8 * es); ctx.stroke(); }
  if (hat) drawHat(hat, x + w / 2, y + 1, w + 4, face);
}
// ----- 🧹 DUSTY: copied EXACTLY from the movie "Robo: The Beginning" (robomovie.html). (x, y) = between her wheels, o.s = size -----
// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,
// a fluffy pink duster on a springy stick, a twirly brush skirt and two little wheels.
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');                  // the twirly brush skirt
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;   // the springy duster
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// ----- ⚙️ ROBO ZERO: the very first prototype robot. A rusty silver-gray Robo shape with bolts and patches, an "X" visor
// with ONE flickering yellow eye, a big WIND-UP KEY in his back and mismatched ear pods (one round, one square).
// o.nice = polished and shiny (after he becomes a friend). (cx, gy) = middle of his feet, s = size (1 = Robo's size)
function drawZero(cx, gy, s = 1, face = -1, o = {}) {
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = gy - h, nice = !!o.nice, k = s;
  const head = nice ? '#eceff1' : '#9e9e9e', body = nice ? '#f5f5f5' : '#8a8a8a', rust = '#a1663a', dark = nice ? '#90a4ae' : '#616161';
  ctx.save();
  if (o.hovering) { ctx.fillStyle = '#ffca28'; for (const fx of [x + w * 0.23, x + w * 0.77]) { const f = (8 + Math.random() * 8) * k / 2; ctx.beginPath(); ctx.moveTo(fx - 4 * k / 2, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4 * k / 2, y + h); ctx.fill(); } }
  // 🔑 the big wind-up key in his back (it turns!)
  const kx = cx - face * (w / 2 + 2 * k), ky = y + h * 0.66, turn = Math.cos(frame * (o.tired ? 0.03 : 0.12));
  ctx.fillStyle = nice ? '#ffd740' : '#b0855a'; ctx.fillRect(Math.min(kx, kx - face * 6 * k), ky - 1.5 * k, 6 * k, 3 * k);
  const kk = kx - face * 7 * k;
  ellipse(kk, ky - 5 * k, 3.2 * k * Math.abs(turn) + 0.5, 4.5 * k, nice ? '#ffd740' : '#b0855a'); ellipse(kk, ky + 5 * k, 3.2 * k * Math.abs(turn) + 0.5, 4.5 * k, nice ? '#ffd740' : '#b0855a');
  circle(kk, ky, 2 * k, nice ? '#ffab00' : '#8d6e63');
  // legs (bolted on)
  ctx.fillStyle = dark; ctx.fillRect(x + 4 * k, y + h - 7 * k, 8 * k, 7 * k); ctx.fillRect(x + w - 12 * k, y + h - 7 * k, 8 * k, 7 * k);
  circle(x + 8 * k, y + h - 3.5 * k, 1.3 * k, '#cfd8dc'); circle(x + w - 8 * k, y + h - 3.5 * k, 1.3 * k, '#cfd8dc');
  // body with patches + bolts
  roundRect(x + 2 * k, y + h * 0.5, w - 4 * k, h * 0.4, 6 * k, body);
  if (!nice) { roundRect(x + 5 * k, y + h * 0.55, 8 * k, 6 * k, 1.5 * k, rust); roundRect(x + w - 13 * k, y + h * 0.7, 7 * k, 5 * k, 1, '#7d8b91'); }
  else roundRect(x + 5 * k, y + h * 0.54, 3 * k, 8 * k, 2, 'rgba(255,255,255,.8)');
  for (const [bx, by] of [[x + 5 * k, y + h * 0.86], [x + w - 5 * k, y + h * 0.86], [x + w / 2, y + h * 0.56]]) circle(bx, by, 1.2 * k, nice ? '#b0bec5' : '#424242');
  ctx.strokeStyle = nice ? '#ffd740' : '#5d4037'; ctx.lineWidth = 1.2 * k; ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.72, 3.2 * k, 0, 7); ctx.stroke();   // a little "0" on his chest
  // mismatched ear pods: one ROUND (faded blue), one SQUARE (orange)
  circle(x - 2 * k, y + h * 0.3 + 1.5 * k, 4 * k, nice ? '#4fc3f7' : '#6f8fa0');
  roundRect(x + w - 1 * k, y + h * 0.3 - 3 * k, 7 * k, 8 * k, 1, nice ? '#ffab40' : '#c66a1c');
  // head (rusty spots, bolts)
  roundRect(x - 2 * k, y, w + 4 * k, h * 0.55, 12 * k, head);
  if (!nice) { ellipse(x + 5 * k, y + 4 * k, 3 * k, 2 * k, rust); ellipse(x + w - 3 * k, y + h * 0.45, 2.5 * k, 1.6 * k, rust); }
  else { ellipse(x + 6 * k, y + 4 * k, 4 * k, 1.5 * k, 'rgba(255,255,255,.9)', -0.3); }
  circle(x + 1 * k, y + h * 0.5 - 2 * k, 1 * k, '#424242'); circle(x + w - 1 * k, y + h * 0.5 - 2 * k, 1 * k, '#424242');
  roundRect(x + 2 * k, y + 4 * k, w - 4 * k, h * 0.55 - 9 * k, 9 * k, '#14171c');
  // the X visor + ONE yellow eye in the middle (it flickers... until he gets polished)
  ctx.strokeStyle = nice ? '#90a4ae' : '#3a3f46'; ctx.lineWidth = 3 * k; ctx.lineCap = 'round';
  const vx0 = x + 5 * k, vx1 = x + w - 5 * k, vy0 = y + 6 * k, vy1 = y + h * 0.55 - 7 * k;
  ctx.beginPath(); ctx.moveTo(vx0, vy0); ctx.lineTo(vx1, vy1); ctx.moveTo(vx1, vy0); ctx.lineTo(vx0, vy1); ctx.stroke();
  const ex = x + w / 2 + face * 1.5 * k, ey = (vy0 + vy1) / 2, flick = nice ? 1 : (Math.sin(frame * 0.9) > -0.3 || frame % 50 > 8 ? 1 : 0.25);
  ctx.globalAlpha = o.tired ? 0.35 : flick;
  circle(ex, ey, 5 * k, 'rgba(255,214,0,.35)'); circle(ex, ey, 3.2 * k, nice ? '#40c4ff' : '#ffd600'); circle(ex + 0.8 * k, ey - 0.8 * k, 1 * k, '#fff');
  ctx.globalAlpha = 1;
  if (nice) for (let i = 0; i < 3; i++) drawStar(cx + Math.cos(frame * 0.05 + i * 2.1) * w * 0.8, y + h * 0.4 + Math.sin(frame * 0.05 + i * 2.1) * h * 0.5, 2.5 * k, '#fff59d', frame * 0.1);
  if (o.tired) for (let i = 0; i < 3; i++) { const a = frame * 0.1 + i * 2.1; drawStar(cx + Math.cos(a) * w * 0.6, y - 6 * k + Math.sin(a) * 3 * k, 3 * k, '#ffea00', a); }

function goBack() { sfx.click(); speak(''); if (state === 'read' && cameFrom === 'make') state = 'make'; else state = 'shop'; }

let mPage = 0, mPanel = 0, tab = 'who', linePg = 0, speaker = 0, newAsk = 0;

}
function grid(n, cols, x, y, w, h, gap = 6) { const rows = Math.ceil(n / cols), cw = (w - gap * (cols - 1)) / cols, ch = (h - gap * (rows - 1)) / rows; return i => ({ x: x + (i % cols) * (cw + gap), y: y + Math.floor(i / cols) * (ch + gap), w: cw, h: ch }); }
function editTitle(ex, ew) {

function editWho(p, ex, ew) {
  const g = grid(CAST.length, 4, ex + 8, 72, ew - 16, 326);
  CAST.forEach((c, i) => {
    const r = g(i), k = p.c.findIndex(q => q[0] === c[0]), on = k >= 0;

function editPlace(p, ex, ew) {

    ctx.strokeStyle = on ? '#ff1744' : '#5d4037'; ctx.lineWidth = on ? 5 : 2; ctx.strokeRect(r.x, r.y, r.w, r.h);

function editPose(p, ex, ew) {

function editWords(p, ex, ew) {
  if (!p.c.length) { fitText('Pick WHO is in this box first!', ex + ew / 2, 240, 24, ew - 20, '#5d4037', 'center', false); return; }

    btn(r.x, r.y, r.w, r.h, l, mineLine === l ? '#d84315' : '#5d4037', () => edit(() => setLine(p, l)), 16, mineLine === l); });
  btn(ex + 8, 372, 50, 44, '◀', '#a1887f', () => { linePg = (linePg + pages - 1) % pages; sfx.flip(); }, 22);
  fitText((linePg + 1) + '/' + pages, ex + 84, 402, 18, 50, '#5d4037', 'center', false);
  btn(ex + 110, 372, 50, 44, '▶', '#a1887f', () => { linePg = (linePg + 1) % pages; sfx.flip(); }, 22);
  btn(ex + 168, 372, 158, 44, '✏️ BLANK BUBBLE', mineLine === '' ? '#d84315' : '#00897b', () => edit(() => { setLine(p, ''); say('A blank bubble! After you print it, write your own words with a pencil!'); }), 15, mineLine === '');
  btn(ex + 332, 372, 112, 44, '❌ NO WORDS', '#78909c', () => edit(() => { p.say = p.say.filter(s => s[0] !== speaker); }, 'click'), 15);
}
function setLine(p, l) { p.say = p.say.filter(s => s[0] !== speaker); p.say.push([speaker, l]); if (p.say.length > 2) p.say.shift(); if (l) speak(l); }
function editBoom(p, ex, ew) {
  const list = mPage === 0 ? COVER_FX : SFX, g = grid(list.length + 1, 3, ex + 8, 72, ew - 16, 326);
  [...list, ''].forEach((s, i) => { const r = g(i), on = p.fx === s;
    if (s) { ctx.save(); ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.clip(); roundRect(r.x, r.y, r.w, r.h, 10, on ? '#ffcc80' : '#fff'); boom(s, r.x + r.w / 2, r.y + r.h / 2, Math.min(r.h * 0.42, r.w * 0.3), i + 2); ctx.restore();
      ctx.strokeStyle = on ? '#d84315' : '#bcaaa4'; ctx.lineWidth = on ? 5 : 2; rrect(r.x, r.y, r.w, r.h, 10); ctx.stroke(); hit(r.x, r.y, r.w, r.h, () => edit(() => { p.fx = s; speak(s.toLowerCase()); }, 'boing')); }
    else btn(r.x, r.y, r.w, r.h, '❌ NONE', on ? '#d84315' : '#78909c', () => edit(() => { p.fx = ''; }, 'click'), 18, on);
  });
}
function editBox(p, ex, ew) {

    btn(r.x, r.y, r.w, r.h, c || '❌ NO BOX', on ? '#d84315' : c ? '#f9a825' : '#78909c', () => edit(() => { p.cap = c; if (c) speak(c); }), 16, on); });
}
// ===================== 🖨️ THE PRINT PREVIEW (nothing prints until Ben presses PRINT) =====================
let printBox = null;
function setPageSize(land) { const st = document.getElementById('pageSize'); if (st) st.textContent = `@page { size: letter ${land ? 'landscape' : 'portrait'}; margin: 0.3in; }`; }
function printPages(cm, mode) {
  if (mode === 'book') return [...bookSheets(cm), makePage(LW, LH, () => drawHowTo(LW, LH, 'book', cm))];
  return [0, 1, 2, 3, 4].map(i => pageCanvas(cm, i)).concat([makePage(PW, PH, () => drawHowTo(PW, PH, 'big', cm))]);
}
function doPrint() { trophy('roboComicShop'); try { window.print(); } catch (_) {} }
function closePrint() { if (printBox) { printBox.remove(); printBox = null; } setPageSize(false); sfx.click(); }
function openPrint(cm, mode) {
  if (printBox) closePrint();
  const pages = printPages(cm, mode), book = mode === 'book';
  setPageSize(book);
  printBox = document.createElement('div'); printBox.id = 'printBox'; if (book) printBox.className = 'land';
  const bar = document.createElement('div'); bar.className = 'pbBar';
  const back = document.createElement('button'); back.className = 'pbBack'; back.textContent = '⬅ BACK';

// ===================== 🎮 taps + keys =====================
C.addEventListener('mousedown', e => { const r = C.getBoundingClientRect(); tap = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; });
addEventListener('keydown', e => {
  const k = e.key;

    if (k === 'ArrowRight') sel = sel === 8 ? 8 : sel % 4 === 3 ? 8 : sel + 1;
    else if (k === 'ArrowLeft') sel = sel === 8 ? 3 : Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = sel < 4 ? sel + 4 : 8;
    else if (k === 'ArrowUp') sel = sel === 8 ? 3 : sel >= 4 ? sel - 4 : sel;
    else if (k === 'Enter' || k === ' ') { if (sel === 8) { state = 'make'; sfx.pick(); } else openComic(COMICS[sel]); }

  } else if (state === 'make') {

    else if (k === 'ArrowDown') { mPage = Math.min(4, mPage + 1); mPanel = 0; sfx.flip(); } else if (k === 'ArrowUp') { mPage = Math.max(0, mPage - 1); mPanel = 0; sfx.flip(); }
    else if (k === 'Escape' || k === 'Backspace') { state = 'shop'; sfx.click(); } else if (k === 'p' || k === 'P') openPrint(mine, 'big'); else return;
  }

});
function loop() {

}
requestAnimationFrame(loop);
