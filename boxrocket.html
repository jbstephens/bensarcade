<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🚀 Big Box Rocket Cockpit</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 30%, #fff 0 1.5px, transparent 2px) 0 0 / 90px 90px,
      radial-gradient(circle at 70% 60%, #cfe8ff 0 1.2px, transparent 2px) 0 0 / 130px 130px,
      linear-gradient(160deg, #0b1440, #1d0f4a 60%, #050a24);
    color: #222; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #fff; -webkit-text-stroke: 2px #111;
    text-shadow: 4px 4px 0 #ff5a1f; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #111; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #111; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #111; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-mc { background: linear-gradient(180deg, #ff8a65, #ff3d00); color: #fff; font-size: 22px; -webkit-text-stroke: .5px #111; }
  .b-spin { background: #ffd54f; font-size: 21px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🚀 the rocket designer ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #boxPrev { flex: 1; min-height: 0; background: linear-gradient(#0d1b4d, #27125a); border: 5px solid #111; border-radius: 20px; box-shadow: 0 6px 0 #ff5a1f;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #boxPrev svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(18px, 2.3vw, 26px); font-weight: bold; text-align: center; background: #fff7d6; border: 4px solid #111; border-radius: 14px; padding: 4px; letter-spacing: 1px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #111;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #e8f1ff; border: 4px solid #111; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #111; }
  .opt svg { width: 70px; height: 70px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #111; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #111; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #e8f1ff; border: 4px solid #111; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  .meas { display: grid; grid-template-columns: 1.3fr 60px 1fr 60px; gap: 8px; align-items: center; font-size: 19px; font-weight: bold; }
  .meas b { text-align: center; font-size: 26px; background: #fff7d6; border: 3px solid #111; border-radius: 12px; padding: 4px; }
  .meas .btn { min-height: 50px; }
  .note { font-size: 17px; background: #fff7d6; border: 3px solid #111; border-radius: 12px; padding: 6px 10px; text-align: center; }
  .diag svg { width: 100%; height: auto; display: block; }
  #invHelp { font-size: 15px; text-align: center; color: #dfe8ff; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; color: #fff; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #111; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff5a1f; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #111; border-radius: 10px; box-shadow: 0 8px 0 #ff5a1f; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #111; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fff7d6; border: 4px solid #111; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #111; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 🛰️ MISSION CONTROL ---------- */
  #mc { flex-direction: column; gap: 8px; padding: 8px; background: #050a24; }
  #mcTop { display: flex; gap: 8px; align-items: center; }
  #mcTop h1 { flex: 1; font-size: clamp(20px, 3.2vw, 36px); }
  #mcTop .btn { min-height: 50px; font-size: 18px; }
  #mcMain { flex: 1; min-height: 0; display: flex; gap: 8px; }
  #space { position: relative; flex: 1; min-width: 0; border: 5px solid #8fa3c7; border-radius: 26px; overflow: hidden; background: #000; box-shadow: inset 0 0 40px #000; }
  #sky, #layer { position: absolute; inset: 0; width: 100%; height: 100%; }
  #layer svg { width: 100%; height: 100%; display: block; }
  #big { position: absolute; left: 0; right: 0; top: 8%; text-align: center; font-size: clamp(40px, 11vw, 150px); font-weight: 900; color: #fff;
    -webkit-text-stroke: 3px #111; text-shadow: 0 0 30px #ff9100, 5px 5px 0 #ff3d00; pointer-events: none; }
  #big.small { font-size: clamp(26px, 5vw, 60px); }
  .side { position: absolute; bottom: 12px; width: 30%; min-height: 26%; font-size: clamp(22px, 3.4vw, 44px); border-radius: 26px; opacity: .92; }
  #goL { left: 12px; background: #4fc3f7; } #goR { right: 12px; background: #ffd54f; }
  #mcSide { width: min(36vw, 380px); display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #radio { flex: 1; min-height: 80px; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #0f2a1a; border: 5px solid #8fa3c7; border-radius: 18px; padding: 8px;
    display: flex; flex-direction: column; gap: 6px; }
  .say { font-size: 17px; font-weight: bold; border: 3px solid #111; border-radius: 14px; padding: 5px 9px; max-width: 94%; }
  .say i { font-style: normal; display: block; font-size: 13px; opacity: .75; }
  .say.mc { background: #b9f6ca; align-self: flex-start; } .say.me { background: #fff59d; align-self: flex-end; }
  .say.pal { background: #e1bee7; align-self: flex-start; }
  #ctrl { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #ctrl .btn { min-height: 64px; font-size: 19px; }
  #ctrl .wide { grid-column: span 2; }
  .swt { display: flex; align-items: center; gap: 6px; justify-content: center; background: #37474f; color: #fff; }
  .swt svg { width: 34px; height: 46px; flex: none; }
  .swt.go { background: #2e7d32; }
  .b-launch { background: radial-gradient(circle at 40% 35%, #ff8a80, #d50000); color: #fff; font-size: 24px !important; -webkit-text-stroke: .5px #111; }
  .b-fire { background: radial-gradient(circle at 40% 35%, #ffd180, #ff6d00); font-size: 24px !important; }
  #mc.shake #space { animation: shk .09s linear infinite; }
  #mc.shake2 #space { animation: shk .16s linear infinite; }
  @keyframes shk { 0% { transform: translate(0, 0); } 25% { transform: translate(-6px, 4px); } 50% { transform: translate(5px, -5px); } 75% { transform: translate(-4px, -3px); } 100% { transform: translate(0, 0); } }
  #layer svg .bob { animation: bob 2.2s ease-in-out infinite alternate; }
  #layer svg .spin { animation: spin 14s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #layer svg .pop { animation: pop .6s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes bob { from { transform: translateY(-8px); } to { transform: translateY(10px); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.12); } to { transform: scale(1); } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #111; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view, #mcMain { flex-direction: column; }
    #invLeft { width: 100%; height: 40vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side, #mcSide { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 52px; height: 52px; }
    #ctrl .btn { min-height: 50px; font-size: 16px; } .say { font-size: 15px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🚀 BIG BOX ROCKET</h1>
    <div id="boxPrev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-mc" id="bMC">🛰️ MISSION CONTROL</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · Space = spin a name · M = Mission Control · Enter = printables</div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Designer</button>
    <h1 class="big">🖨️ PRINT &amp; BUILD</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. Start with the Build Guide! A grown-up does all the cutting. ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="mc" class="screen">
  <div id="mcTop">
    <button class="btn b-back" id="bMcBack">⬅️ Designer</button>
    <h1 class="big" id="mcTitle">🛰️ MISSION CONTROL</h1>
    <button class="btn" id="bMusic">🎵 Music</button>
  </div>
  <div id="mcMain">
    <div id="space"><canvas id="sky"></canvas><div id="layer"></div><div id="big"></div>
      <button class="btn side hide" id="goL">⬅️ LEFT</button><button class="btn side hide" id="goR">RIGHT ➡️</button></div>
    <div id="mcSide">
      <div id="radio"></div>
      <div id="ctrl"></div>
    </div>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🚀 BIG BOX ROCKET COCKPIT: turn a big cardboard box into a rocket you sit in.
// Designer (name slot machine, mission patch, hull colors, measure-your-box) → printables
// (build guide, braces, control panel, side panels, portholes, nose cone, fins, name banner + decals,
// patch, ID cards, mission log) → 🛰️ MISSION CONTROL to play while sitting in the box.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);

  if (!isLine()) setMode('line');
  state.magic[SHEETS[cur].id] = true; saveState(); renderSheet(); drawTraces();
  tune([660, 880, 1100]); toast('✨ Ta-da! Now press 🖨️ Print my colors!');
}
function setMode(m) { state.mode = m; saveState(); if (view === 'sheet') { renderSheet(); updateSide(); sizeCanvas(); } }
function updateSide() {
  const p = SHEETS[cur], line = isLine(), blank = false;
  $('bColor').classList.toggle('on', !line); $('bLine').classList.toggle('on', line); $('modes').classList.toggle('hide', blank);
  $('pHelp').textContent = p.help + (line ? ' Pick a crayon and color right on it!' : '');
  $('pens').classList.toggle('on', line); $('lineBtns').classList.toggle('hide', !line);
  $('bPrint').classList.toggle('hide', line); $('trace').classList.toggle('on', line);
}
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    d.innerHTML = buildSheet(k, false) + '<b>' + esc(p.name) + '</b>';
    d.addEventListener('click', () => { sel = k; openSheet(k); });
    g.appendChild(d);
  });
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openGallery() { endPrintAll(); renderGallery(); setView('gallery'); markSel(); blip(660); }
function openSheet(k) {
  cur = k; sel = k;
  $('pTitle').textContent = SHEETS[k].name;
  renderSheet(); updateSide(); setView('sheet'); sizeCanvas(); blip(660);
}
function backToGallery() { endPrintAll(); setView('gallery'); markSel(); }
function backToInventor() { endPrintAll(); setView('inv'); renderPreview(); renderOpts(); }
function clearSheet() { const id = SHEETS[cur].id; state.traces[id] = []; delete state.magic[id]; saveState(); renderSheet(); drawTraces(); }
const PENS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222'];
const BORDER = 5;
function sheetBox() {
  const r = $('wrap').getBoundingClientRect(), w = r.width - BORDER * 2, h = r.height - BORDER * 2;
  const s = Math.min(w / 800, h / 1000) || 1;
  return { r, s, ox: BORDER + (w - 800 * s) / 2, oy: BORDER + (h - 1000 * s) / 2 };
}
const f1 = v => Math.round(v * 10) / 10;
function toSheet(e) { const b = sheetBox(); return [f1((e.clientX - b.r.left - b.ox) / b.s), f1((e.clientY - b.r.top - b.oy) / b.s)]; }
function sizeCanvas() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(b.r.width * dpr)); cv.height = Math.max(1, Math.round(b.r.height * dpr));
  drawTraces();
}
function strokeAll(ctx, list) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 12;
  list.forEach(t => { ctx.strokeStyle = t.c; ctx.beginPath(); for (let i = 0; i < t.p.length; i += 2) (i ? ctx.lineTo : ctx.moveTo).call(ctx, t.p[i], t.p[i + 1]); if (t.p.length === 2) ctx.lineTo(t.p[0] + 0.1, t.p[1]); ctx.stroke(); });
}
function drawTraces() {

  const ctx = cv.getContext('2d'); if (!ctx) return;

  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);

}
function penDown(e) {
  if (view !== 'sheet' || !isLine()) return;
  if (document.body.classList.contains('pAll')) endPrintAll();
  e.preventDefault();
  const [x, y] = toSheet(e), id = SHEETS[cur].id;
  stroke = { c: pen, p: [x, y] };
  (state.traces[id] = state.traces[id] || []).push(stroke);
  drawTraces();
}
function penMove(e) {
  if (!stroke) return;
  const [x, y] = toSheet(e), p = stroke.p, k = p.length;
  if (Math.hypot(x - p[k - 2], y - p[k - 1]) < 4) return;

function penUp() { if (!stroke) return; stroke = null; saveState(); }
function renderPens() {
  const box = $('pens'); box.innerHTML = '';
  PENS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (c === pen ? ' sel' : ''); s.style.background = c;
    s.addEventListener('click', () => { pen = c; box.querySelectorAll('.sw').forEach((el, i) => el.classList.toggle('sel', PENS[i] === c)); });
    box.appendChild(s);
  });
}
function traceImage() {                // your crayon coloring as a picture laid on the sheet for printing
  const list = state.traces[SHEETS[cur].id] || []; if (!list.length || typeof document === 'undefined') return '';
  const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 2000; const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return '';
  ctx.scale(2, 2); ctx.globalAlpha = .8; strokeAll(ctx, list);
  return cv.toDataURL('image/png');
}
// =====================================================================
// PRINTING: only the sheet prints (see @media print). "Print them all" prints one sheet per page.
// The first print (or the first finished mission) wins the 🏆 trophy.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function notePrinted() { state.printed++; saveState(); checkTrophy('You printed your rocket!'); }
function printSheet() {
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); renderSheet(true); notePrinted(); doPrint(() => renderSheet());
}
function printColors() {
  if (view !== 'sheet') openSheet(sel);
  if (!isLine()) setMode('line');
  endPrintAll(); renderSheet();
  const img = traceImage(), svg = $('svgBox').querySelector('svg');
  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }
  notePrinted(); doPrint(() => renderSheet());
}
function printAll() {
  $('printAll').innerHTML = SHEETS.map((p, i) => buildSheet(i, state.mode === 'line')).join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + SHEETS.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, M = Mission Control)
// In Mission Control: Space/Enter = the big action, ⬅️➡️ steer, Escape = back
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function mcKey(k) {
  if (k === 'Escape' || k === 'Backspace') { closeMC(); return true; }
  if (MC.game && MC.game.kind === 'asteroids' && (k === 'ArrowLeft' || k === 'ArrowRight')) { steer(k === 'ArrowLeft' ? -1 : 1); return true; }
  if (k !== ' ' && k !== 'Enter') return false;
  if (MC.phase === 'check') nextCheck();
  else if (MC.land) fireThrusters();
  else if (MC.game && MC.game.items) tapNext();
  else if (MC.phase === 'menu') { const k2 = MKEYS.find(m => !state.missions[m]) || MKEYS[0]; startMission(k2); }
  else if (MC.phase === 'menuWait') missionMenu(false);
  return true;
}
function onKey(e) {
  const k = e.key;
  if (view === 'mc') { if (mcKey(k)) e.preventDefault(); return; }
  if (view === 'inv') {
    if (k === 'ArrowUp' || k === 'ArrowDown') { catI = (catI + (k === 'ArrowDown' ? 1 : CATS.length - 1)) % CATS.length; renderCats(); renderOpts(); blip(520, 0, .06); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') nudge(k === 'ArrowRight' ? 1 : -1);
    else if (k === ' ') spinName();
    else if (k === 'Enter') openGallery();
    else if (k === 'm' || k === 'M') openMC();
    else if (k === 'p' || k === 'P') { sel = 0; openSheet(0); printSheet(); }
    else return;
    e.preventDefault();
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToInventor(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {
  loadState();
  renderCats(); renderOpts(); renderPreview(); renderPens();

  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bMC').addEventListener('click', openMC);
  $('bMcBack').addEventListener('click', closeMC);
  $('bMusic').addEventListener('click', toggleMusic);
  $('goL').addEventListener('click', e => { e.stopPropagation(); steer(-1); });
  $('goR').addEventListener('click', e => { e.stopPropagation(); steer(1); });
  $('layer').addEventListener('click', layerTap);
  $('space').addEventListener('click', spaceTap);
  $('bPrints').addEventListener('click', openGallery);
  $('bGBack').addEventListener('click', backToInventor);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });

if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
