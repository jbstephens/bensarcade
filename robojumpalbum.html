<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Jump: The Album</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: radial-gradient(circle at 30% 20%, #2a1b5e, #0b0820 70%); color: #fff; overflow: hidden;
    font-family: "Trebuchet MS", "Arial Rounded MT Bold", Arial, sans-serif; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; touch-action: manipulation; }
  .screen { position: fixed; inset: 0; display: none; padding: 1.6vmin; }
  .screen.on { display: flex; }
  .big { background: linear-gradient(#7c4dff, #5e35b1); border-radius: 2.4vmin; padding: 1.6vmin 3vmin; font-size: clamp(18px, 4vmin, 40px); font-weight: bold;
    box-shadow: 0 .8vmin 0 #311b92, 0 1.2vmin 2vmin rgba(0,0,0,.4); transition: transform .08s; }
  .big:active, .sm:active, .tk:active, .pk:active { transform: translateY(.5vmin) scale(.97); }
  .big.go { background: linear-gradient(#ffd740, #ffab00); color: #3e2700; box-shadow: 0 .8vmin 0 #c67c00, 0 1.2vmin 2vmin rgba(0,0,0,.4); }
  .sm { background: rgba(255,255,255,.14); border-radius: 2vmin; padding: 1vmin 2vmin; font-size: clamp(16px, 3.4vmin, 32px); font-weight: bold; min-height: 8vmin; min-width: 8vmin; }
  .sm.lit { background: #ffd740; color: #3e2700; }
  /* ---- 💿 cover ---- */
  #sCover { flex-direction: column; align-items: center; justify-content: center; gap: 2vmin; }
  #cover { width: min(96vw, calc(78vh * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 2.5vmin; box-shadow: 0 2vmin 5vmin rgba(0,0,0,.6); }
  .coverBtns { display: flex; gap: 2.5vmin; flex-wrap: wrap; justify-content: center; }
  /* ---- 🎵 track list ---- */
  #sList, #sPlay { flex-direction: column; gap: 1.4vmin; }
  .bar { display: flex; align-items: center; gap: 1.4vmin; flex-wrap: wrap; }
  .bar h1 { flex: 1; margin: 0; font-size: clamp(22px, 5vmin, 48px); text-shadow: 0 .5vmin 0 #311b92; white-space: nowrap; }
  #tracks, #pickGrid { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); gap: 1.2vmin; align-content: start; padding: .4vmin; }
  .tk { display: flex; align-items: center; gap: 1.4vmin; border-radius: 2vmin; padding: 1vmin 1.4vmin; text-align: left; min-height: 10.5vmin; cursor: pointer; background: var(--c, #5e35b1);
    box-shadow: 0 .6vmin 0 rgba(0,0,0,.35); }
  .tk.playing { outline: .6vmin solid #ffd740; }
  .tk .ic { font-size: clamp(26px, 6vmin, 54px); width: 1.4em; text-align: center; }
  .tk .nm { flex: 1; font-size: clamp(16px, 3.4vmin, 30px); font-weight: bold; line-height: 1.1; text-shadow: 0 .3vmin 0 rgba(0,0,0,.35); }
  .tk .nm small { display: block; font-size: .72em; opacity: .9; font-weight: normal; margin-top: .4vmin; }
  .tk .hrt { font-size: clamp(22px, 5vmin, 44px); background: rgba(0,0,0,.18); border-radius: 50%; width: 1.7em; height: 1.7em; flex: none; }
  .tk .hrt.off { filter: grayscale(1); opacity: .45; }
  .mood { grid-column: 1 / -1; font-size: clamp(16px, 3.4vmin, 30px); font-weight: bold; margin: 1vmin 0 0 .6vmin; color: #ffd740; }
  /* ---- 🎧 now playing ---- */
  #sNow { gap: 2vmin; align-items: center; justify-content: center; }
  #viz { width: min(60vw, calc(92vh * 16 / 9)); max-height: 94vh; aspect-ratio: 16 / 9; border-radius: 2.5vmin; box-shadow: 0 2vmin 5vmin rgba(0,0,0,.6); flex: none; }
  .panel { flex: 1; max-width: 38vw; display: flex; flex-direction: column; gap: 1.5vmin; min-width: 0; }
  .panel .top { display: flex; gap: 1.2vmin; align-items: center; flex-wrap: wrap; }
  #nQueue { font-size: clamp(14px, 2.8vmin, 24px); opacity: .85; }
  #nTitle { margin: 0; font-size: clamp(22px, 5.4vmin, 52px); line-height: 1.05; text-shadow: 0 .5vmin 0 #311b92; }
  #nMood { font-size: clamp(14px, 3vmin, 26px); color: #ffd740; font-weight: bold; }
  #nLine { margin: 0; font-size: clamp(14px, 3vmin, 26px); font-style: italic; opacity: .95; }
  #prog { cursor: pointer; height: 4.4vmin; background: rgba(255,255,255,.18); border-radius: 3vmin; overflow: hidden; position: relative; }
  #progFill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: linear-gradient(90deg, #ff4081, #ffd740); border-radius: 3vmin; }
  .saveBar { height: 5vmin; background: rgba(0,0,0,.12); border-radius: 3vmin; overflow: hidden; margin-top: 1vmin; }
  #saveFill { height: 100%; width: 0; background: linear-gradient(90deg, #ff4081, #ffd740); border-radius: 3vmin; transition: width .4s; }
  .times { display: flex; justify-content: space-between; font-size: clamp(14px, 2.8vmin, 24px); opacity: .9; margin-top: -.8vmin; }
  .ctrl { display: flex; gap: 2vmin; justify-content: center; }
  .ctrl .big { font-size: clamp(26px, 7vmin, 64px); padding: 1.2vmin 3vmin; min-width: 14vmin; }
  .ctrl2 { display: flex; gap: 1.2vmin; justify-content: center; flex-wrap: wrap; }
  /* ---- 📝 playlist maker ---- */
  #plChips { display: flex; gap: 1vmin; flex-wrap: wrap; min-height: 7vmin; align-items: center; font-size: clamp(14px, 3vmin, 26px); background: rgba(0,0,0,.25); border-radius: 2vmin; padding: 1vmin; }
  #plChips span.chip { background: #ffd740; color: #3e2700; border-radius: 2vmin; padding: .4vmin 1.4vmin; font-weight: bold; }
  .pk { display: flex; align-items: center; gap: 1.2vmin; border-radius: 2vmin; padding: 1vmin 1.4vmin; min-height: 9vmin; background: var(--c, #5e35b1); text-align: left;
    font-size: clamp(16px, 3.2vmin, 28px); font-weight: bold; box-shadow: 0 .6vmin 0 rgba(0,0,0,.35); }
  .pk .ic { font-size: 1.6em; }
  .pk .num { margin-left: auto; background: #ffd740; color: #3e2700; border-radius: 50%; min-width: 1.8em; height: 1.8em; display: grid; place-items: center; }
  /* ---- 📜 liner notes ---- */
  .modal { cursor: pointer; position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: center; justify-content: center; z-index: 10; padding: 2vmin; }
  .modal.on { display: flex; }
  .card { cursor: default; background: #fff8e1; color: #3e2723; border-radius: 3vmin; padding: 3vmin 4vmin; width: min(92vw, 120vmin); max-height: 96vh; overflow: auto; box-shadow: 0 2vmin 6vmin rgba(0,0,0,.6);
    border: 1vmin solid var(--c, #7c4dff); }
  .card h2 { margin: 0 0 1vmin; font-size: clamp(22px, 5.4vmin, 50px); }
  .card .say { font-size: clamp(18px, 4vmin, 36px); font-weight: bold; margin: 1vmin 0 2vmin; color: #6a1b9a; }
  .card .facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.2vmin; font-size: clamp(15px, 3vmin, 26px); }
  .card .facts div { background: rgba(0,0,0,.06); border-radius: 1.6vmin; padding: 1.2vmin 1.6vmin; }
  .card .row { display: flex; justify-content: flex-end; margin-top: 2vmin; gap: 1.5vmin; }
  #toast { position: fixed; left: 50%; top: 3vmin; transform: translateX(-50%) translateY(-30vmin); background: #ffd740; color: #3e2700; font-weight: bold; padding: 1.6vmin 3vmin;
    border-radius: 3vmin; font-size: clamp(18px, 4vmin, 36px); z-index: 20; transition: transform .35s; box-shadow: 0 1vmin 3vmin rgba(0,0,0,.5); text-align: center; }
  #toast.on { transform: translateX(-50%) translateY(0); }
  @media (max-aspect-ratio: 1/1) {          /* tall screens: stack the picture on top */
    #sNow { flex-direction: column; } #viz { width: 96vw; } .panel { max-width: 96vw; width: 96vw; }
  }
</style>
</head>
<body>
<section id="sCover" class="screen on">
  <canvas id="cover" width="960" height="540"></canvas>
  <div class="coverBtns">
    <button class="big go" id="bPlayAll">▶ Play the Album</button>
    <button class="big" id="bSongs">🎵 Songs</button>
    <button class="big" id="bMakeList">📝 Playlist</button>
    <button class="big" id="bSaveAll">💾 Save ALL songs</button>
  </div>
</section>
<section id="sList" class="screen">
  <div class="bar"><button class="sm" id="lHome">🏠</button><h1>🎵 The Songs</h1>
    <button class="sm" id="lFav">❤️ Play Favorites</button><button class="sm" id="lPl">📝 Playlist</button><button class="sm" id="lNow">🎧</button><button class="sm vol">🔊</button></div>
  <div id="tracks"></div>
</section>
<section id="sNow" class="screen">
  <canvas id="viz" width="800" height="450"></canvas>
  <div class="panel">
    <div class="top"><button class="sm" id="nList">🎵 Songs</button><button class="sm" id="nHome">🏠</button><span id="nQueue"></span></div>
    <h2 id="nTitle"></h2><div id="nMood"></div><p id="nLine"></p>
    <div id="prog"><div id="progFill"></div></div>
    <div class="times"><span id="tNow">0:00</span><span id="tAll">0:00</span></div>
    <div class="ctrl"><button class="big" id="cPrev">⏮</button><button class="big go" id="cPlay">▶</button><button class="big" id="cNext">⏭</button></div>
    <div class="ctrl2"><button class="sm" id="cShuf">🔀</button><button class="sm" id="cLoop">🔁 All</button><button class="sm" id="cFav">❤️</button>
      <button class="sm" id="cNotes">📜 Notes</button><button class="sm vol">🔊</button>
      <button class="sm" id="cSave">💾 Save Song</button></div>
  </div>
</section>
<section id="sPlay" class="screen">
  <div class="bar"><button class="sm" id="pBack">⬅</button><h1>📝 My Playlist</h1>
    <button class="big go" id="pGo">▶ Play It!</button><button class="sm" id="pClear">🗑️ Clear</button></div>
  <div id="plChips"></div>
  <div id="pickGrid"></div>
</section>
<div id="notes" class="modal"><div class="card" id="notesCard"></div></div>
<div id="saveBox" class="modal" style="cursor:default"><div class="card" id="saveCard"></div></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎧 ROBO JUMP: THE ALBUM   (Ben asked for "really good melody music that sounds like it would go in a Robo Jump game... a whole album")
// 14 brand-new songs: 4 level songs, 4 boss songs, 3 chill secret-level songs and 3 victory songs.
// The music engine is copied from Robo Jump 11 (scale-degree melodies, chord pads, punchy bass, drums, sparkly arpeggios,
// a key change on the last chorus). NEW here: marimba, electric piano and choir lead voices, bongos, cowbell, vinyl crackle,
// form tokens like 'C@2' (play the chorus 2 steps higher) and a real ending on every song.
// Save: localStorage 'robojumpAlbum' = { fav: {id: 1}, list: [ids], heard: {id: 1}, vol, shuffle, loop }.
// Jukebox: robojumpalbum.html?song=<id> (or window.JUKEBOX.song) plays one track forever.
// =====================================================================
const JB = window.JUKEBOX && window.JUKEBOX.song !== undefined ? window.JUKEBOX : null;      // 🎶 the book's hidden jukebox copy
function trophy(id) { if (JB) return; try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = false;                                   // true = playing (the book's jukebox sets this to true)
const VOLS = [0.75, 0.45, 0.22, 0];                    // 🔊 🔉 🔈 🔇
let volIx = 0;
const musicVol = () => JB ? 0.6 : VOLS[volIx];
function wakeAudio() {                                 // the first tap starts the sound (iPad needs a real tap)
  try {
    if (!actx) {
      actx = (JB && JB.makeCtx && JB.makeCtx()) || new (window.AudioContext || window.webkitAudioContext)();
      setupAudio();
    }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
  } catch (_) {}
}
function setVolume() {
  if (!actx || !musicBus) return;
  const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicVol(), t + 0.15);
}
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicVol(); musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell' || kind === 'marimba' || kind === 'keys') {   // hit-and-ring voices (steel drum, bell, marimba, electric piano)
    const mar = kind === 'marimba', keys = kind === 'keys';
    g = envGain(t, 0.004, vol * (mar ? 1.3 : 1), mar ? 0.06 : keys ? 0.55 : 0.25, Math.min(dur, mar ? 0.25 : keys ? 1.4 : 0.6), mar ? 0.18 : 0.25, out);
    const parts = { steel: [[1, 1], [2, 0.35], [3.01, 0.12]], marimba: [[1, 1], [3.93, 0.22], [9.4, 0.04]], keys: [[1, 1], [2, 0.22], [3.01, 0.06], [0.5, 0.15]] }[kind]
      || [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else if (kind === 'choir') {                       // 🎤 a choir singing "aah" (the pad's formant trick, as a melody voice)
    g = envGain(t, 0.06, vol * 1.6, 0.85, dur, 0.18, out);
    const src = actx.createGain(); src.gain.value = 0.5;
    const o1 = osc('sawtooth', f, t, end, -8), o2 = osc('sawtooth', f, t, end, 8), o3 = osc('sawtooth', f, t, end, 0);
    o1.connect(src); o2.connect(src); o3.connect(src);
    for (const [ff, q, v] of [[730, 5, 1], [1090, 6, 0.6], [2440, 7, 0.3]]) {
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
      const bg = actx.createGain(); bg.gain.value = v * 2; src.connect(bp); bp.connect(bg); bg.connect(g);
    }
    const lfo = osc('sine', 5, t, end), lg = actx.createGain(); lg.gain.value = f * 0.007; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency); lg.connect(o3.frequency);
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out, att) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, att || (kind === 'choir' ? 0.35 : 0.22), vol, 0.85, dur, 0.5, out);   // att: a long attack = a pad that SWELLS
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'marimba') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.2; osc('sine', f * 3.93, t, end).connect(g2); g2.connect(g); }
  else if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {

  save.fav = save.fav || {}; save.heard = save.heard || {}; save.tro = save.tro || {};

  volIx = Math.max(0, Math.min(3, save.vol | 0));
}
function writeSave() { if (JB) return; try { localStorage.setItem('robojumpAlbum', JSON.stringify(save)); } catch (_) {} }

const URL_SONG = (() => { const m = /[?&]song=([^&#]*)/.exec(location.search); const id = m && decodeURIComponent(m[1]); return id && SONG_DEFS[id] ? id : null; })();

function shuffleQueue(first) {

}

}
function nextTrack(auto) {
