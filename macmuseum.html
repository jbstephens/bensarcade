<style>

<canvas id="game" width="960" height="540"></canvas>
<script>
// 💻 THE MACBOOK MUSEUM — Ben's idea! A museum of laptops: old ones, new ones, Ben's own MacBook Neo,
// and MacBook Robo (a laptop robot Ben invented in the Secret Print Shop).
// Tap an exhibit to see it up close (and make it do its thing), collect a 📘 passport stamp for each one,
// then visit the 🎁 Gift Shop to print souvenirs — including a FOLD-UP PAPER LAPTOP.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { seen: {} };
try { const s = JSON.parse(localStorage.getItem('macMuseum') || 'null'); if (s && s.seen) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('macMuseum', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;

</script>
<script>
// ---------- THE LAPTOPS (simple cartoon drawings, each with a happy face on its screen) ----------
const OR = '#2f80ed', OR2 = '#64b5f6', OR3 = '#1a4f8f', CREAM = '#e8f1fb', DARK = '#263238', GOLD = '#ffc94d', SIL = '#c9d1d9', SIL2 = '#eef2f6';
let PRINTING = false;
function sparkle(cx, cy, r, col, rot = 0, lw) {               // a twinkle: 8 rounded rays
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw || Math.max(1.5, r * 0.28); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, q = i % 2 ? 0.7 : 1; ctx.moveTo(cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.25); ctx.lineTo(cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q); }
  ctx.stroke(); ctx.restore();
}
function eyes(cx, cy, s, gap = 12, size = 6, col = DARK) {
  const bl = !PRINTING && frame % 220 < 6 ? 0.15 : 1;
  for (const d of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx + d * gap * s, cy, size * s * 0.8, size * s * bl, 0, 0, 7); ctx.fill(); }
}
function smile(cx, cy, s, w = 7, col = DARK, open = 0) {
  ctx.strokeStyle = col; ctx.lineWidth = 2.4 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, w * s, 0.2, Math.PI - 0.2); ctx.stroke(); ctx.lineCap = 'butt';
  if (open > 0) { ctx.fillStyle = '#c62828'; ctx.beginPath(); ctx.ellipse(cx, cy + w * 0.6 * s, w * 0.8 * s, w * 0.7 * open * s, 0, 0, 7); ctx.fill(); }
}
function screenFace(x, y, w, h, s, col = '#fff', open = 0) { eyes(x + w / 2, y + h * 0.42, s, 14, 6, col); smile(x + w / 2, y + h * 0.55, s, 9, col, open); }
// o: { body, body2, bezel, scr (screen color or [top,bottom]), keys, w, h, base, round, lid (0 open .. 1 shut), draw(x,y,w,h) for the screen, cam, touchBar, handle }
function laptop(cx, cy, s, o) {
  const w = (o.w || 150) * s, h = (o.h || 86) * s, bd = (o.base || 40) * s, hy = cy + 8 * s, R = (o.round || 8) * s, lid = o.lid || 0;
  const bw = w * 1.16;                                         // the base is a bit wider at the front (it is closer to us)
  // base (keyboard half)
  ctx.fillStyle = o.body; ctx.beginPath(); ctx.moveTo(cx - w / 2, hy); ctx.lineTo(cx + w / 2, hy); ctx.lineTo(cx + bw / 2, hy + bd); ctx.lineTo(cx - bw / 2, hy + bd); ctx.closePath(); ctx.fill();
  rr(cx - bw / 2, hy + bd - 2 * s, bw, (o.thick || 7) * s, 3 * s, o.body2 || '#9aa4ae');
  if (o.handle) { ctx.strokeStyle = o.body2; ctx.lineWidth = 6 * s; ctx.beginPath(); ctx.arc(cx - bw / 2 - 2 * s, hy + bd * 0.4, 16 * s, Math.PI * 0.5, Math.PI * 1.5); ctx.stroke(); }
  const rows = 4;
  for (let r = 0; r < rows; r++) { const t = (r + 0.6) / (rows + 2.4), yy = hy + 4 * s + t * bd * 0.7, rw = (w + (bw - w) * t) * 0.84, n = 11, kw = rw / n;
    for (let k = 0; k < n; k++) rr(cx - rw / 2 + k * kw + kw * 0.12, yy, kw * 0.76, bd * 0.11, 1.5 * s, o.keys || '#37474f'); }
  if (o.touchBar) rr(cx - w * 0.38, hy + 2 * s, w * 0.76, 3.4 * s, 1.5 * s, o.touchBar);
  rr(cx - w * 0.17, hy + bd * 0.72, w * 0.34, bd * 0.2, 3 * s, o.pad || 'rgba(0,0,0,.12)');
  if (o.sleep !== undefined) circle(cx + bw * 0.3, hy + bd + 1.5 * s, 2.5 * s, `rgba(255,255,255,${o.sleep})`);
  // lid (screen half): it squashes toward the hinge as it closes
  if (lid > 0.5) {                                             // shut: the lid lies flat on top of the keyboard
    ctx.fillStyle = o.body; ctx.beginPath(); ctx.moveTo(cx - w / 2, hy); ctx.lineTo(cx + w / 2, hy); ctx.lineTo(cx + bw / 2, hy + bd); ctx.lineTo(cx - bw / 2, hy + bd); ctx.closePath(); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.moveTo(cx - w * 0.3, hy + 4 * s); ctx.lineTo(cx - w * 0.1, hy + 4 * s); ctx.lineTo(cx - w * 0.2, hy + bd - 4 * s); ctx.lineTo(cx - w * 0.42, hy + bd - 4 * s); ctx.fill();
    ctx.fillStyle = 'rgba(0,0,0,.12)'; ctx.fillRect(cx - bw / 2, hy + bd - 3 * s, bw, 2 * s); return;
  }
  const lh = h * (1 - lid * 0.96);
  ctx.save(); ctx.translate(0, hy); ctx.scale(1, lh / h); ctx.translate(0, -hy);
  const ly = hy - h; rr(cx - w / 2, ly, w, h, R, o.body);
  const inset = (o.inset || 6) * s; rr(cx - w / 2 + inset * 0.6, ly + inset * 0.6, w - inset * 1.2, h - inset * 0.8, R * 0.7, o.bezel || '#222');
  const sx = cx - w / 2 + inset * 1.4, sy = ly + inset * 1.4, sw = w - inset * 2.8, sh = h - inset * 2.6;
  if (Array.isArray(o.scr)) { const g = ctx.createLinearGradient(0, sy, 0, sy + sh); g.addColorStop(0, o.scr[0]); g.addColorStop(1, o.scr[1]); rr(sx, sy, sw, sh, 3 * s, g); } else rr(sx, sy, sw, sh, 3 * s, o.scr || '#4fc3f7');
  if (o.cam) circle(cx, ly + inset * 0.8, 1.6 * s, '#111');
  ctx.save(); ctx.beginPath(); ctx.rect(sx, sy, sw, sh); ctx.clip();
  if (o.draw) o.draw(sx, sy, sw, sh); else screenFace(sx, sy, sw, sh, s);
  ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.beginPath(); ctx.moveTo(sx, sy); ctx.lineTo(sx + sw * 0.45, sy); ctx.lineTo(sx + sw * 0.2, sy + sh); ctx.lineTo(sx, sy + sh); ctx.fill();
  ctx.restore(); ctx.restore();
}
// a tiny Game Factory book (for the MacBook Neo's screen and the paper laptop)
function gfBook(cx, cy, s, flip = 0) {
  rr(cx - 46 * s, cy - 28 * s, 92 * s, 60 * s, 5 * s, '#8e24aa');
  rr(cx - 42 * s, cy - 26 * s, 41 * s, 54 * s, 3 * s, '#fffde7'); rr(cx + 1 * s, cy - 26 * s, 41 * s, 54 * s, 3 * s, '#fffde7');
  ctx.fillStyle = 'rgba(0,0,0,.15)'; ctx.fillRect(cx - 1 * s, cy - 26 * s, 2 * s, 54 * s);
  const ic = [['#ff7043', '#43a047', '#29b6f6'], ['#ab47bc', '#ffca28', '#ef5350']][Math.floor(flip) % 2];
  text('GAME', cx - 21 * s, cy - 13 * s, 8 * s, '#6a1b9a', 'center', false); text('FACTORY', cx - 21 * s, cy - 4 * s, 7 * s, '#6a1b9a', 'center', false);
  star(cx - 21 * s, cy + 13 * s, 9 * s, GOLD);
  ic.forEach((c, k) => rr(cx + 6 * s + (k % 2) * 17 * s, cy - 20 * s + Math.floor(k / 2) * 22 * s + (k === 2 ? 0 : 0), 14 * s, 14 * s, 3 * s, c));
  rr(cx + 6 * s + 17 * s, cy + 2 * s, 14 * s, 14 * s, 3 * s, '#26a69a');
}
</script>
<script>
// each: [id, name, emoji, action button, where it was "found", fun facts (only TRUE ones!), draw(cx, cy, s, a)]  (a = 0..1 while it does its thing)
const CLAM_COLS = ['#ff8f00', '#1e88e5', '#7cb342', '#5c6bc0', '#757575'];
const CHARS = [
  ['clam', 'iBook Clamshell', '🍊', 'CHANGE COLOR!', 'A school backpack, back in 1999', ['It came out in 1999, with a carry HANDLE like a lunch box!', 'It came in fun colors like tangerine, blueberry and key lime.', 'Shut, it looked like a clam shell. That is how it got its name!'],
    (cx, cy, s, a) => { const col = a > 0 ? CLAM_COLS[Math.floor(a * 10) % CLAM_COLS.length] : CLAM_COLS[0];
      laptop(cx, cy, s, { body: col, body2: col, bezel: '#f5f5f5', scr: ['#81d4fa', '#4fc3f7'], keys: '#fafafa', round: 30, inset: 9, base: 38, thick: 10, handle: true, pad: 'rgba(255,255,255,.5)' });
      if (a > 0) text(['TANGERINE!', 'BLUEBERRY!', 'KEY LIME!', 'INDIGO!', 'GRAPHITE!'][Math.floor(a * 10) % 5], cx, cy - 92 * s, 22 * s, '#fff'); }],
  ['ti', 'PowerBook G4 Titanium', '🛡️', 'SHINE!', 'A super hero\'s briefcase, in 2001', ['It came out in 2001.', 'Its case was made of TITANIUM, a super strong metal!', 'People called it the "TiBook" for short.'],
    (cx, cy, s, a) => { laptop(cx, cy, s, { body: '#b0b8c0', body2: '#8a939c', bezel: '#90979e', scr: ['#5c6bc0', '#7986cb'], keys: '#455a64', w: 166, h: 92, base: 36, thick: 4, inset: 4, round: 4 });
      if (a > 0) { const x = cx - 120 * s + a * 300 * s; ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.moveTo(x, cy - 90 * s); ctx.lineTo(x + 26 * s, cy - 90 * s); ctx.lineTo(x - 14 * s, cy + 60 * s); ctx.lineTo(x - 40 * s, cy + 60 * s); ctx.fill();
        for (let i = 0; i < 4; i++) sparkle(cx + Math.cos(i * 1.7 + a * 8) * 90 * s, cy - 40 * s + Math.sin(i * 2.3) * 40 * s, 10 * s, '#fff', i); } }],
  ['white', 'White MacBook', '🤍', 'CLOSE THE LID!', 'A cozy desk, in 2006', ['It came out in 2006.', 'It was made of shiny white plastic. (There was a black one too!)', 'When it was asleep, a little light on the front glowed slowly, like it was breathing.'],
    (cx, cy, s, a) => { const lid = a > 0 ? Math.min(1, a * 3) * (a < 0.85 ? 1 : (1 - a) / 0.15) : 0, br = 0.5 + Math.sin(frame * 0.06) * 0.5;
      laptop(cx, cy, s, { body: '#f7f7f7', body2: '#dcdcdc', bezel: '#f0f0f0', scr: ['#90caf9', '#64b5f6'], keys: '#ffffff', pad: 'rgba(0,0,0,.08)', lid, sleep: lid > 0.9 ? br : 0, cam: true });
      if (a > 0 && lid > 0.9) { text('Z', cx + 50 * s, cy - 30 * s - br * 10 * s, 18 * s, '#fff'); text('z', cx + 70 * s, cy - 50 * s - br * 10 * s, 14 * s, '#fff'); } }],
  ['pro', 'First MacBook Pro', '📷', 'BOOT UP!', 'A movie maker\'s studio, in 2006', ['It came out in 2006 too!', 'It was made of shiny aluminum metal.', 'It had a little camera built in above the screen.'],
    (cx, cy, s, a) => { const on = a <= 0 || a > 0.35;
      laptop(cx, cy, s, { body: '#c3c9cf', body2: '#99a2ab', bezel: '#2b2b2b', scr: !on ? '#111' : a > 0 && a < 0.5 ? '#fff' : ['#4fc3f7', '#1e88e5'], keys: '#e0e0e0', cam: true, w: 160,
        draw: (x, y, w, h) => { if (on && !(a > 0 && a < 0.5)) screenFace(x, y, w, h, s, '#fff', a > 0 ? 1 : 0); else if (a > 0 && a < 0.5 && on) { ctx.fillStyle = '#9e9e9e'; ctx.beginPath(); ctx.arc(x + w / 2, y + h / 2, 10 * s, 0, 7); ctx.fill(); } } });
      if (a > 0.35 && a < 0.6) text('DING!', cx, cy - 92 * s, 26 * s, '#fff'); }],
  ['air', 'MacBook Air', '✉️', 'OUT OF THE ENVELOPE!', 'Inside a paper office envelope, in 2008', ['It came out in 2008.', 'It was SO thin that it was pulled out of a paper office envelope to show it off!', 'Its thickest part was less than one inch.'],
    (cx, cy, s, a) => { const t = a > 0 ? Math.min(1, a * 1.6) : 1, dy = (1 - t) * 150 * s, ey = cy + 40 * s;
      if (a > 0) { rr(cx - 120 * s, ey - 6 * s, 240 * s, 90 * s, 6 * s, '#c8a26a'); }
      ctx.save(); if (a > 0) { ctx.beginPath(); ctx.rect(cx - 200 * s, cy - 200 * s, 400 * s, 240 * s + ey - cy); ctx.clip(); }
      laptop(cx, cy + dy, s, { body: '#d5dbe0', body2: '#b0b8c0', bezel: '#1b1b1b', scr: ['#b39ddb', '#7e57c2'], keys: '#263238', base: 36, thick: 3, w: 158 }); ctx.restore();
      if (a > 0) { rr(cx - 120 * s, ey, 240 * s, 84 * s, 6 * s, '#e0b97a'); tri(cx - 120 * s, ey, cx + 120 * s, ey, cx, ey + 40 * s, '#d4a862'); text('OFFICE MAIL', cx, ey + 66 * s, 14 * s, '#795548', 'center', false); }
      if (a > 0.6) text('TA-DA! SO THIN!', cx, cy - 96 * s, 22 * s, '#fff'); }],
  ['twelve', '12-inch MacBook', '🥇', 'GO GOLD!', 'A treasure chest, in 2015', ['It came out in 2015.', 'It came in GOLD! (And silver and gray too.)', 'It had just ONE plug hole, for charging AND everything else.'],
    (cx, cy, s, a) => { laptop(cx, cy, s, { body: '#e8c98f', body2: '#cfa968', bezel: '#1b1b1b', scr: ['#ffe082', '#ffb300'], keys: '#2b2b2b', w: 140, base: 34, thick: 3 });
      if (a > 0) for (let i = 0; i < 9; i++) { const an = i / 9 * 6.28 + a * 5, d = 70 * s + a * 50 * s; star(cx + Math.cos(an) * d, cy - 20 * s + Math.sin(an) * d * 0.6, 9 * s, GOLD); } }],
  ['touch', 'MacBook Pro with Touch Bar', '🌈', 'TOUCH THE BAR!', 'A music studio, in 2016', ['It came out in 2016.', 'Above the keys was a skinny touch screen called the Touch Bar.', 'The Touch Bar buttons changed for each app you used.'],
    (cx, cy, s, a) => { const g = ctx.createLinearGradient(cx - 60 * s, 0, cx + 60 * s, 0); ['#f44336', '#ffeb3b', '#4caf50', '#2196f3', '#9c27b0'].forEach((c, i) => g.addColorStop(i / 4, c));
      laptop(cx, cy, s, { body: '#7a8088', body2: '#5f656c', bezel: '#141414', scr: ['#26c6da', '#00838f'], keys: '#1b1b1b', touchBar: a > 0 ? g : '#111', w: 156, base: 40 });
      if (a > 0) ['🎵', '😀', '🎨', '⭐'].forEach((e, i) => { const t = (a * 2 + i * 0.25) % 1; emoji(e, cx - 60 * s + i * 40 * s, cy - 84 * s - t * 60 * s, 20 * s); }); }],
  ['m1', 'MacBook Air with M1', '🤫', 'LISTEN...', 'A quiet library, in 2020', ['It came out in 2020.', 'Inside is the M1, a computer chip made by Apple itself.', 'It has NO fan, so it is totally silent. Shhh!'],
    (cx, cy, s, a) => { laptop(cx, cy, s, { body: '#d8dde2', body2: '#b3bbc3', bezel: '#141414', scr: ['#f48fb1', '#ce93d8'], keys: '#1b1b1b', w: 154, base: 38, thick: 4,
        draw: (x, y, w, h) => { if (a > 0) { eyes(x + w / 2, y + h * 0.4, s, 14, 4, '#fff'); circle(x + w / 2, y + h * 0.62, 4 * s, '#fff'); } else screenFace(x, y, w, h, s); } });
      if (a > 0) { text('🤫 shhh...', cx, cy - 92 * s, 22 * s, '#fff'); fit('No fan = no noise!', cx, cy + 82 * s, 18 * s, 220 * s, '#fff59d'); } }],
  ['robo', 'MacBook Robo', '🤖', 'BEEP BOOP!', 'The Secret Print Shop (💡 Ben\'s idea!)', ['💡 Ben invented him in the Secret Print Shop!', 'His face is a SCREEN and his tummy is a KEYBOARD.', 'He is shiny silver with a bright blue screen.'],
    (cx, cy, s, a) => { const by = cy + 52 * s - (a > 0 ? Math.abs(Math.sin(a * 12)) * 22 * s : 0), wave = a > 0 ? Math.sin(a * 30) * 0.6 : Math.sin(frame * 0.05) * 0.15;
      rr(cx - 26 * s, by - 18 * s, 16 * s, 18 * s, 4 * s, '#90a4ae'); rr(cx + 10 * s, by - 18 * s, 16 * s, 18 * s, 4 * s, '#90a4ae');           // legs
      rr(cx - 32 * s, by - 6 * s, 26 * s, 8 * s, 4 * s, '#607d8b'); rr(cx + 6 * s, by - 6 * s, 26 * s, 8 * s, 4 * s, '#607d8b');
      for (const d of [-1, 1]) { ctx.save(); ctx.translate(cx + d * 44 * s, by - 70 * s); ctx.rotate(-d * (0.5 + (d > 0 ? Math.abs(wave) * 2 : 0))); rr(-5 * s, 0, 10 * s, 34 * s, 5 * s, '#b0bec5'); circle(0, 36 * s, 7 * s, '#78909c'); ctx.restore(); }
      rr(cx - 46 * s, by - 76 * s, 92 * s, 60 * s, 10 * s, SIL);                                           // tummy = keyboard
      for (let r = 0; r < 3; r++) for (let k = 0; k < 7; k++) rr(cx - 38 * s + k * 11 * s, by - 68 * s + r * 11 * s, 9 * s, 8 * s, 2 * s, '#37474f');
