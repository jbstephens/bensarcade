<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🤪 Silly Story Fill-Ins</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #fff3a8 0 40px, #ffe97a 40px 80px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; flex-direction: column; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(28px, 4.6vw, 52px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff5cb8; letter-spacing: 2px; text-align: center; }
  .sub { margin: 2px 0 6px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 12px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide { display: none; }
  .btn:disabled { opacity: .45; }
  .b-back { background: #9be3ff; } .b-pink { background: #ffb3d9; } .b-green { background: #8ef08e; }
  .b-orange { background: #ffc46b; } .b-purple { background: #d3b8ff; } .b-yellow { background: #fff36b; }
  .b-rain { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-read { background: linear-gradient(90deg, #ff6ec7, #ffb347); font-size: 24px; }
  .bar .btn { font-size: 18px; min-height: 52px; padding: 6px 10px; }
  .bar .b-read { font-size: 21px; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; padding: 6px 10px; }
  /* ---------- home ---------- */
  #home .top { padding: 8px 10px 0; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; align-content: start; }
  .card { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #e0569c; display: flex; flex-direction: column; align-items: center; transition: transform .1s; }
  .card svg { width: 100%; height: auto; display: block; border-radius: 10px; pointer-events: none; }
  .card b { font-size: 17px; text-align: center; padding: 4px 2px 0; line-height: 1.15; }
  .card .icons { font-size: 18px; letter-spacing: 1px; text-align: center; padding: 3px 0 0; line-height: 1.3; }
  .card .done { font-size: 14px; color: #2a8a2a; font-weight: bold; }
  .card.sel { border-color: #ff3d6e; transform: scale(1.04) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .card:active { transform: scale(.96); }
  /* ---------- play ---------- */
  #play .head, #read .head, #coll .head, #cert .head { display: flex; align-items: center; gap: 10px; padding: 8px 10px 4px; }
  .head .ttl { flex: 1; font-size: clamp(20px, 3vw, 32px); font-weight: bold; text-align: center; color: #fff;
    -webkit-text-stroke: 1.6px #333; text-shadow: 3px 3px 0 #333; }
  #pMain { flex: 1; display: flex; gap: 10px; padding: 4px 10px; min-height: 0; }
  #pLeft { width: min(40vw, 420px); display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #pPic svg { width: 100%; max-height: 24vh; display: block; border: 4px solid #333; border-radius: 14px; background: #fff; }
  #chips { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 6px; padding: 2px; }
  .chip { display: flex; align-items: center; gap: 8px; background: #fff; border: 4px solid #333; border-radius: 14px;
    padding: 4px 8px; cursor: pointer; font-size: 17px; min-height: 50px; }
  .chip .n { width: 32px; height: 32px; border-radius: 50%; background: #ffd54f; border: 3px solid #333; display: flex;
    align-items: center; justify-content: center; font-weight: bold; flex: none; }
  .chip .ic { font-size: 24px; flex: none; }
  .chip .lb { flex: 1; line-height: 1.1; }
  .chip .lb small { display: block; font-size: 12px; color: #666; }
  .chip .wd { font-weight: bold; color: #d81b60; font-size: 19px; }
  .chip.sel { border-color: #ff3d6e; background: #ffe3f0; box-shadow: 0 0 0 4px #ff3d6e55; }
  .chip.full .n { background: #8ef08e; }
  #pRight { flex: 1; display: flex; flex-direction: column; min-width: 0; background: #fff; border: 5px solid #333;
    border-radius: 18px; box-shadow: 0 6px 0 #3a86c9; padding: 8px; min-height: 0; }
  #bankHead { display: flex; align-items: center; gap: 10px; }
  #bankTitle { flex: 1; font-size: clamp(18px, 2.4vw, 26px); font-weight: bold; line-height: 1.15; }
  #bankTitle small { display: block; font-size: 15px; color: #666; font-weight: bold; }
  #bank { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; gap: 8px; padding: 8px 2px;
    grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); align-content: start; }
  .tile { font: inherit; background: #f4f9ff; border: 4px solid #333; border-radius: 14px; cursor: pointer; padding: 4px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 84px; color: #222; }
  .tile .em { font-size: 32px; line-height: 1.1; }
  .tile .sw { width: 40px; height: 30px; border-radius: 10px; border: 3px solid #333; }
  .tile .num { font-size: 26px; font-weight: bold; color: #1e6bff; }
  .tile span.t { font-size: 16px; font-weight: bold; text-align: center; line-height: 1.1; }
  .tile.sel { border-color: #ff3d6e; background: #ffe3f0; transform: scale(1.05); }
  .tile.cur { background: #d6ffd6; }
  .tile:active { transform: scale(.94); }
  /* ---------- read ---------- */
  #rMain { flex: 1; display: flex; gap: 12px; padding: 4px 12px; min-height: 0; }
  #rPic { width: min(30vw, 320px); flex: none; }
  #rPic svg { width: 100%; display: block; border: 4px solid #333; border-radius: 14px; background: #fff; }
  #rText { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fffdf4; border: 5px solid #333;
    border-radius: 18px; padding: 12px 18px; font-size: clamp(18px, 2.3vw, 26px); line-height: 1.55; box-shadow: 0 6px 0 #e0569c; }
  .w { display: inline-block; background: #fff36b; border: 3px solid #ff8a1f; border-radius: 10px; padding: 0 6px;
    color: #c2185b; font-weight: bold; line-height: 1.25; }
  .sen.on { background: #d9f2ff; border-radius: 8px; }
  .w.bounce { animation: bnc .6s ease; }
  @keyframes bnc { 0% { transform: translateY(0) scale(1); } 35% { transform: translateY(-14px) scale(1.25) rotate(-4deg); }
    65% { transform: translateY(2px) scale(.95); } 100% { transform: translateY(0) scale(1); } }
  /* ---------- collection + certificate ---------- */
  #cGrid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; align-content: start; }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 24px; font-weight: bold; background: #fff;
    border: 4px solid #333; border-radius: 18px; padding: 24px; }
  #certBox { flex: 1; display: flex; gap: 12px; padding: 4px 12px 12px; min-height: 0; }
  #certPrev { flex: 1; overflow-y: auto; display: flex; justify-content: center; align-items: flex-start; }
  #certPrev .certpage { width: 100%; max-width: 640px; }
  #certSide { width: min(34vw, 340px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .names .btn { font-size: 18px; min-height: 50px; padding: 4px; }
  .names .btn.sel { background: #ffb3d9; border-color: #d81b60; }
  .note { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 8px; font-size: 18px; text-align: center; font-weight: bold; }
  /* ---------- fun stuff ---------- */
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 50; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  .conf { position: fixed; top: -30px; width: 14px; height: 20px; z-index: 40; pointer-events: none; border-radius: 3px;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  .haha { position: fixed; bottom: 10px; font-size: 44px; z-index: 41; pointer-events: none; animation: up 2s ease-out forwards; }
  @keyframes up { to { transform: translateY(-70vh) rotate(20deg); opacity: 0; } }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #pMain, #rMain, #certBox { flex-direction: column; }
    #pLeft, #rPic, #certSide { width: 100%; }
    #pLeft { max-height: 42vh; } #rPic { display: none; }
  }
  /* ---------- printed pages (also used for the certificate preview) ---------- */
  .pg { background: #fff; color: #222; font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif; }
  .pg h2 { margin: 0; text-align: center; font-size: 30px; line-height: 1.15; }
  .pg .kick { text-align: center; font-size: 15px; font-weight: bold; color: #d81b60; letter-spacing: 1px; }
  .pg .tip { text-align: center; font-size: 15px; margin: 4px 0 10px; padding: 6px; border: 3px dashed #999; border-radius: 12px; }
  .pg .pic { width: 3.4in; margin: 6px auto; display: block; }
  .pg .pic svg { width: 100%; display: block; border: 3px solid #333; border-radius: 12px; }
  .wl { display: flex; align-items: center; gap: 12px; padding: 7px 0; border-bottom: 2px dotted #bbb; }
  .wl .n { width: 40px; height: 40px; border-radius: 50%; border: 3px solid #333; display: flex; align-items: center;
    justify-content: center; font-weight: bold; font-size: 20px; flex: none; }
  .wl .ic { font-size: 30px; width: 40px; text-align: center; flex: none; }
  .wl .lb { width: 2.6in; flex: none; font-size: 17px; font-weight: bold; line-height: 1.1; }
  .wl .lb small { display: block; font-size: 12px; font-weight: normal; color: #555; }
  .wl .line { flex: 1; border-bottom: 3px solid #222; height: 40px; }
  .st { font-size: 18px; line-height: 2.6; margin-top: 6px; }
  .bl { display: inline-block; min-width: 1.6in; border-bottom: 3px solid #222; position: relative; height: 1.5em; vertical-align: -0.35em; margin: 0 2px; }
  .bl i { position: absolute; left: 0; right: 0; bottom: -1.25em; font-size: 10.5px; font-style: normal; text-align: center;
    line-height: 1; color: #555; white-space: nowrap; }
  .bl i b { color: #d81b60; }
  .bl.rep { min-width: 1.1in; }
  .fw { font-weight: bold; color: #c2185b; background: #fff59d; border-radius: 6px; padding: 0 4px; }
  .sto { font-size: 21px; line-height: 1.8; margin-top: 8px; }
  .byline { text-align: center; font-size: 15px; margin-top: 10px; color: #555; }
  .certpage { border: 12px double #d81b60; border-radius: 22px; padding: 22px 26px; text-align: center; background: #fffdf4; }
  .certpage .medal { font-size: 64px; line-height: 1; }
  .certpage h2 { font-size: 40px; color: #6a1b9a; }
  .certpage .who { font-size: 46px; font-weight: bold; color: #d81b60; border-bottom: 4px solid #333; display: inline-block;
    padding: 0 30px; margin: 10px 0; }
  .certpage p { font-size: 20px; margin: 8px 0; }
  .certpage .chars svg { width: 100%; display: block; }
  .certpage .sign { display: flex; justify-content: space-around; margin-top: 18px; font-size: 16px; }
  .certpage .sign div { border-top: 3px solid #333; padding-top: 4px; min-width: 2.2in; }
  @media print {
    @page { size: letter portrait; margin: 0.4in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    .pg { break-after: page; page-break-after: always; height: 10.1in; overflow: hidden; position: relative; }
    .pg:last-child { break-after: auto; page-break-after: auto; }
    .certpage { height: 9.9in; display: flex; flex-direction: column; justify-content: center; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div class="top">
    <h1 class="big">🤪 SILLY STORY FILL-INS</h1>
    <div class="sub">Pick a story! Fill in the words (no peeking!), then hear your super silly story!</div>
    <div class="bar">
      <button class="btn b-back" id="hLeave">⬅️ Back to the book</button>
      <button class="btn b-purple" id="hColl">📚 My Silly Story Collection</button>
      <button class="btn b-yellow" id="hCert">🏅 Silliest Storyteller</button>
      <button class="btn b-green" id="hRand">🎲 Surprise story!</button>
    </div>
  </div>
  <div id="grid"></div>
</div>
<div id="play" class="screen">
  <div class="head">
    <button class="btn b-back" id="pBack">⬅️ Stories</button>
    <div class="ttl" id="pTitle"></div>
  </div>
  <div id="pMain">
    <div id="pLeft"><div id="pPic"></div><div id="chips"></div></div>
    <div id="pRight">
      <div id="bankHead">
        <div id="bankTitle"></div>
        <button class="btn b-green" id="bDice">🎲 Random!</button>
      </div>
      <div id="bank"></div>
    </div>
  </div>
  <div class="bar">
    <button class="btn b-orange" id="bAll">🎲🎲 Fill them ALL!</button>
    <button class="btn b-rain hide" id="bSillier">🤪 Make it sillier!</button>
    <button class="btn b-read" id="bRead" disabled>📖 Read my silly story!</button>
    <button class="btn b-pink" id="bPWords">🖨️ Word list</button>
    <button class="btn b-pink" id="bPStory">🖨️ Story page</button>
    <button class="btn" id="bClear">🧽 Start over</button>
  </div>
</div>
<div id="read" class="screen">
  <div class="head">
    <button class="btn b-back" id="rBack">⬅️ Back</button>
    <div class="ttl" id="rTitle"></div>
  </div>
  <div id="rMain"><div id="rPic"></div><div id="rText"></div></div>
  <div class="bar">
    <button class="btn b-read" id="rRead">🔊 Read it out loud!</button>
    <button class="btn b-yellow" id="rLaugh">😂 Laugh track</button>
    <button class="btn b-rain" id="rSillier">🤪 Make it sillier!</button>
    <button class="btn b-purple" id="rSave">⭐ Save to my collection</button>
    <button class="btn b-pink" id="rPrint">🖨️ Print my storybook page</button>
    <button class="btn hide" id="rDel">🗑️ Take it out</button>
  </div>
</div>
<div id="coll" class="screen">
  <div class="head">
    <button class="btn b-back" id="cBack">⬅️ Stories</button>
    <div class="ttl">📚 MY SILLY STORY COLLECTION</div>
    <button class="btn b-pink" id="cPrint">🖨️ Print my storybook</button>
  </div>
  <div id="cGrid"></div>
</div>
<div id="cert" class="screen">
  <div class="head">
    <button class="btn b-back" id="tBack">⬅️ Stories</button>
    <div class="ttl">🏅 SILLIEST STORYTELLER</div>
  </div>
  <div id="certBox">
    <div id="certPrev"></div>
    <div id="certSide">
      <div class="note">Who is the Silliest Storyteller? Tap a name!</div>
      <div class="names" id="names"></div>
      <div class="note" id="certCount"></div>
      <button class="btn b-pink" id="tPrint">🖨️ Print my certificate</button>
    </div>
  </div>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// ================== character art (copied from the Trading Cards) ==================
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aT(x, y, txt, size, f, s) { return '<text x="' + _n(x) + '" y="' + _n(y) + '" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="bold" font-size="' + size + '" fill="' + f + '"' + (s ? ' stroke="' + s + '" stroke-width="1"' : '') + '>' + txt + '</text>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
function ngonD(x, y, r, n, rot) { const pts = []; for (let k = 0; k < n; k++) { const a = (rot || 0) + k * Math.PI * 2 / n; pts.push(x + Math.cos(a) * r, y + Math.sin(a) * r); } return polyD(pts); }
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');

// ----- faces -----
// kinds: cute, dot, angry, happy, sleepy, glow, pixel, dizzy, mad (glow + brows)
function eyes(x, y, gap, r, kind, col) {
  col = col || '#1b1b2f'; let s = '';
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    if (kind === 'happy') s += aL('M' + _n(ex - r) + ' ' + _n(y + r * .3) + ' Q' + _n(ex) + ' ' + _n(y - r * 1.1) + ' ' + _n(ex + r) + ' ' + _n(y + r * .3), OL, Math.max(2, r * .45));
    else if (kind === 'dot') s += aC(ex, y, r * .6, col, 0) + aC(ex - r * .2, y - r * .2, r * .2, '#fff', 0);
    else if (kind === 'pixel') s += aR(ex - r * .8, y - r * .8, r * 1.6, r * 1.6, 0, '#fff', OL, 1.5) + aR(ex - r * .4, y - r * .3, r * .8, r * .8, 0, col, 0);
    else if (kind === 'glow' || kind === 'mad') s += aE(ex, y, r * .75, r, col, OL, 1.5) + aC(ex - r * .2, y - r * .35, r * .25, '#fff', 0);
    else if (kind === 'dizzy') s += aL('M' + _n(ex - r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex + r * .7) + ' ' + _n(y + r * .7) + ' M' + _n(ex + r * .7) + ' ' + _n(y - r * .7) + ' L' + _n(ex - r * .7) + ' ' + _n(y + r * .7), OL, Math.max(2, r * .4));
    else {
      s += aE(ex, y, r * .85, r, '#fff', OL, 1.8) + aC(ex + sx * r * .1, y + r * .15, r * .55, col, 0) + aC(ex + sx * r * .1 - r * .2, y - r * .1, r * .2, '#fff', 0);
      if (kind === 'sleepy') s += aP('M' + _n(ex - r * .9) + ' ' + _n(y) + ' A' + _n(r * .9) + ' ' + _n(r) + ' 0 0 1 ' + _n(ex + r * .9) + ' ' + _n(y) + ' Z', '#0000001a', OL, 1.5);
    }
    if (kind === 'angry' || kind === 'mad') s += aL('M' + _n(ex - sx * r * 1.1) + ' ' + _n(y - r * 1.5) + ' L' + _n(ex + sx * r * .7) + ' ' + _n(y - r * .9), OL, Math.max(2, r * .4));
  }
  return s;
}
// kinds: smile, grin, fang, o, grr, flat, frown, teeth
function mouth(x, y, w, kind) {

  const st = STORIES[rd.story];
  $('rTitle').textContent = titleOf(rd.story, rd.words);
  $('rPic').innerHTML = sceneSVG(st.who, st.bg, st.back);
  $('rText').innerHTML = sentences(rd.story, rd.words).map((s, j) => '<span class="sen" id="sen' + j + '">' + s.html + '</span>').join('');
  $('rSillier').classList.toggle('hide', rd.mode !== 'play');

  $('rDel').textContent = '🗑️ Take it out'; delArmed = false;

  $('rRead').textContent = '🔊 Read it out loud!';
}
function readSillier() {
  stopReading(); sillier(rd.words, rd.story); words = rd.words.slice(); keepWords(); SFX.boing(); renderRead(); toast('🤪 Even sillier! Tap 🔊 to hear it!');
}
function saveToColl() {
  const same = S.coll.some(c => c.sid === STORIES[rd.story].id && c.w.join('|') === rd.words.join('|'));
  if (same) { toast('⭐ This one is already in your collection!'); return; }
  S.coll.unshift({ sid: STORIES[rd.story].id, w: rd.words.slice(), t: Date.now() });
  if (S.coll.length > MAX_COLL) S.coll.length = MAX_COLL;
  saveState(); tune([659, 784, 988, 1319]); toast('⭐ Saved to your Silly Story Collection!');
}
let delArmed = false;
function delFromColl() {
  if (!delArmed) { delArmed = true; $('rDel').textContent = '🗑️ Tap again to take it out'; return; }
  S.coll.splice(rd.coll, 1); saveState(); delArmed = false; openColl(); toast('🗑️ Taken out of your collection.');
}
// ----- read it out loud (speechSynthesis), sentence by sentence; the filled words bounce -----
let reading = null;
function pickVoice() {
  try {
    const vs = speechSynthesis.getVoices() || [];
    return vs.find(v => /^en[-_]US/i.test(v.lang) && /Samantha|Google US|Karen|Daniel/i.test(v.name)) || vs.find(v => /^en/i.test(v.lang)) || null;
  } catch (_) { return null; }
}
function stopReading() {
  if (!reading) return;
  reading.stop = true; reading.timers.forEach(clearTimeout); reading = null;
  try { if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel(); } catch (_) {}
  if (typeof document !== 'undefined') document.querySelectorAll('.sen.on').forEach(e => e.classList.remove('on'));
  if ($('rRead')) $('rRead').textContent = '🔊 Read it out loud!';
}
function bounce(el) { if (!el) return; el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce'); }
function readAloud() {
  if (reading) { stopReading(); return; }
  const list = sentences(rd.story, rd.words), st = STORIES[rd.story];
  const me = reading = { stop: false, timers: [], j: 0 };
  const hasTTS = typeof speechSynthesis !== 'undefined' && typeof SpeechSynthesisUtterance !== 'undefined';
  const voice = hasTTS ? pickVoice() : null, RATE = 0.92, MS = 68 / RATE;
  $('rRead').textContent = '⏹️ Stop reading';
  S.reads++; S.done[st.id] = 1; saveState(); winTrophy();
  try { if (hasTTS) speechSynthesis.cancel(); } catch (_) {}
  const say = (txt, end) => {
    let doneOnce = false; const fin = () => { if (!doneOnce) { doneOnce = true; end(); } };
    me.timers.push(setTimeout(fin, txt.length * MS * 1.6 + 2500));       // safety net if 'end' never comes
    if (!hasTTS) { me.timers.push(setTimeout(fin, txt.length * MS + 300)); return null; }
    try {
      const u = new SpeechSynthesisUtterance(txt); u.rate = RATE; u.pitch = 1.15; if (voice) u.voice = voice;
      u.onend = fin; u.onerror = fin; speechSynthesis.speak(u); return u;
    } catch (_) { me.timers.push(setTimeout(fin, txt.length * MS + 300)); return null; }
  };
  const step = () => {
    if (me.stop) return;
    document.querySelectorAll('.sen.on').forEach(e => e.classList.remove('on'));
    if (me.j === 0) { say(titleOf(rd.story, rd.words) + '.', () => { me.j = 1; step(); }); return; }
    const k = me.j - 1;
    if (k >= list.length) { finishReading(me); return; }
    const sen = $('sen' + k); if (sen) { sen.classList.add('on'); if (sen.scrollIntoView) sen.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
    const ws = sen ? sen.querySelectorAll('.w') : [], hit = [];
    const pop = n => { if (!hit[n]) { hit[n] = 1; bounce(ws[n]); blip(700 + n * 90, 0, .08, 'sine', .05); } };
    list[k].offs.forEach((o, n) => me.timers.push(setTimeout(() => { if (!me.stop) pop(n); }, o * MS + 250)));
    const u = say(list[k].text, () => { me.j++; step(); });
    if (u) u.onboundary = e => { if (me.stop) return; list[k].offs.forEach((o, n) => { if (e.charIndex >= o) pop(n); }); };
  };
  step();
}
function finishReading(me) {
  if (me.stop) return;
  reading = null; me.timers.forEach(clearTimeout);
  $('rRead').textContent = '🔊 Read it again!';
  confetti(); SFX.fanfare(); setTimeout(laughTrack, 500);
  toast('🎉 THE END! What a silly story!');
}
// ----- the collection -----
function openColl() { show('coll'); collSel = 0; renderColl(); }
function renderColl() {
  $('cGrid').innerHTML = S.coll.length ? S.coll.map((c, j) => {
    const i = STORIES.findIndex(st => st.id === c.sid), st = STORIES[i], txt = plainText(i, c.w);
    return '<div class="card' + (j === collSel ? ' sel' : '') + '" data-j="' + j + '">' + sceneSVG(st.who, st.bg, st.back) + '<b>' + esc(titleOf(i, c.w)) +
      '</b><div class="icons" style="font-size:14px">' + esc(txt.slice(0, 70)) + '...</div></div>';
  }).join('') : '<div class="empty">📚 No silly stories saved yet!<br>Fill in a story, read it, then tap ⭐ Save to my collection.</div>';
  $('cGrid').querySelectorAll('.card').forEach(c => c.addEventListener('click', () => { audio(); SFX.tap(); openRead('saved', +c.dataset.j); }));
}
// ----- the certificate -----
function certCount() { return Math.max(S.reads, S.coll.length); }
function openCert() { show('cert'); renderCert(); }
function renderCert() {
  $('names').innerHTML = TYPES.NM.words.map(w => '<button class="btn' + (w[0] === S.teller ? ' sel' : '') + '" data-n="' + esc(w[0]) + '">' + w[1] + ' ' + esc(w[0]) + '</button>').join('');
  $('names').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => { S.teller = b.dataset.n; saveState(); SFX.tap(); renderCert(); }));
  $('certPrev').innerHTML = certPage(S.teller, certCount());
  $('certCount').textContent = '📖 Stories read out loud: ' + S.reads + ' · ⭐ Saved: ' + S.coll.length;
}
// ================== printing (Chrome + iPad Safari) ==================
function printPages(html) {
  $('printArea').innerHTML = html;
  S.prints++; saveState(); winTrophy();
  setTimeout(() => { try { if (typeof window.print === 'function') window.print(); } catch (_) {} }, 80);
}
const printWords = i => printPages(wordListPage(i));
const printStory = i => printPages(storyPage(i));
const printBoth = i => printPages(wordListPage(i) + storyPage(i));
const printFilled = () => printPages(filledPage(rd.story, rd.words, S.teller));
function printBook() {
  if (!S.coll.length) { toast('📚 Save a silly story first!'); return; }
  printPages(S.coll.map(c => filledPage(STORIES.findIndex(st => st.id === c.sid), c.w, S.teller)).join(''));
}
const printCert = () => printPages(certPage(S.teller, certCount()));
// ================== leaving ==================
function leave() {
  stopReading();
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
// ================== keys ==================
function gridCols(sel) {
  const th = document.querySelectorAll(sel); if (!th.length) return 1;
  let n = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) n++; });
  return Math.max(1, n);
}
function arrow(k, idx, n, cols) {
  if (k === 'ArrowRight') return Math.min(n - 1, idx + 1);
  if (k === 'ArrowLeft') return Math.max(0, idx - 1);
  if (k === 'ArrowDown') return Math.min(n - 1, idx + cols);
  if (k === 'ArrowUp') return Math.max(0, idx - cols);
  return idx;
}
const isArrow = k => /^Arrow/.test(k);
function onKey(e) {
  const k = e.key;
  if (view === 'home') {
    if (isArrow(k)) { sel = arrow(k, sel, STORIES.length, gridCols('#grid .card')); markSel(); }
    else if (k === 'Enter' || k === ' ') openStory(sel);
    else if (k === 'p' || k === 'P') printBoth(sel);
    else if (k === 'Escape') leave();
    else return;
  } else if (view === 'play') {
    const T = TYPES[blanksOf(cur)[curBlank].type];
    if (isArrow(k)) {
      tileSel = arrow(k, tileSel, T.words.length, gridCols('#bank .tile'));
      document.querySelectorAll('#bank .tile').forEach((t, j) => t.classList.toggle('sel', j === tileSel));
      const t = document.querySelectorAll('#bank .tile')[tileSel]; if (t && t.scrollIntoView) t.scrollIntoView({ block: 'nearest' });
    }
    else if (k === 'Enter' || k === ' ') { if (k === 'Enter' && allFilled() && e.shiftKey) openRead('play'); else pickWord(T.words[tileSel][0]); }
    else if (k === 'r' || k === 'R') diceOne();
    else if (k === 'Tab') { curBlank = (curBlank + (e.shiftKey ? words.length - 1 : 1)) % words.length; tileSel = 0; renderPlay(); }
    else if (k === 'p' || k === 'P') printStory(cur);
    else if (k === 'w' || k === 'W') printWords(cur);
    else if (k === 'Escape' || k === 'Backspace') goHome();
    else return;
  } else if (view === 'read') {
    if (k === 'Enter' || k === ' ') readAloud();
    else if (k === 'l' || k === 'L') laughTrack();
    else if ((k === 's' || k === 'S') && rd.mode === 'play') readSillier();
    else if (k === 'p' || k === 'P') printFilled();
    else if (k === 'Escape' || k === 'Backspace') readBack();
    else return;
  } else if (view === 'coll') {
    if (isArrow(k) && S.coll.length) { collSel = arrow(k, collSel, S.coll.length, gridCols('#cGrid .card')); renderColl(); }
    else if ((k === 'Enter' || k === ' ') && S.coll.length) openRead('saved', collSel);
    else if (k === 'p' || k === 'P') printBook();
    else if (k === 'Escape' || k === 'Backspace') goHome();
    else return;
  } else if (view === 'cert') {
    const ns = TYPES.NM.words.map(w => w[0]); let j = ns.indexOf(S.teller);
    if (k === 'ArrowRight' || k === 'ArrowDown') j = (j + 1) % ns.length;
    else if (k === 'ArrowLeft' || k === 'ArrowUp') j = (j + ns.length - 1) % ns.length;
    else if (k === 'p' || k === 'P' || k === 'Enter') { printCert(); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { goHome(); e.preventDefault(); return; }
    else return;
    S.teller = ns[j]; saveState(); renderCert();
  }
  e.preventDefault();
}
function readBack() { if (rd.mode === 'play') { show('play'); renderPlay(); } else openColl(); }
// ================== start ==================
function init() {
  loadState(); renderHome();
  const tap = (id, fn) => $(id).addEventListener('click', e => { audio(); fn(e); try { e.currentTarget.blur(); } catch (_) {} });
  tap('hLeave', leave);
  tap('hColl', openColl);
  tap('hCert', openCert);
  tap('hRand', () => openStory(rnd(STORIES.length)));
  tap('pBack', goHome);
  tap('bDice', diceOne);
  tap('bAll', fillAll);
  tap('bSillier', makeSillier);
  tap('bRead', () => { if (allFilled()) { openRead('play'); readAloud(); } });
  tap('bPWords', () => printWords(cur));
  tap('bPStory', () => printStory(cur));
  tap('bClear', clearStory);
  tap('rBack', readBack);
  tap('rRead', readAloud);
  tap('rLaugh', laughTrack);
  tap('rSillier', readSillier);
  tap('rSave', saveToColl);
  tap('rPrint', printFilled);
  tap('rDel', delFromColl);
  tap('cBack', goHome);
  tap('cPrint', printBook);
  tap('tBack', goHome);
  tap('tPrint', printCert);
  window.addEventListener('keydown', onKey);
  try { if (typeof speechSynthesis !== 'undefined') { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } } catch (_) {}
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
