<script>
// ================= shared bits (helpers, soft sounds, gentle music) =================
const C = document.getElementById('c'), W = 960, H = 540;
const ctx = C.getContext('2d');
let frame = 0, PRINTING = false;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (Array.isArray(r)) { if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); return; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }

function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();

// the same text style as Robo Jump 1: bold, white, dark outline
function text(str, x, y, size, color = '#fff', align = 'center') {

  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);

function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(str, x, y); }

function drawStar(x, y, r, fill, rot = 0) { star(x, y, r, fill, rot, 5, 0.45); }

// ---------- 🔈 SOFT sounds (master volume 0.13, fades in; starts on the first tap or key) ----------
let actx = null, master = null, musicBus = null, musicOn = true;
function audio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.setValueAtTime(0.0001, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.13, actx.currentTime + 1.5); master.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.5 : 0; musicBus.connect(master);

  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

function bleep(f, d = 0.12, v = 0.05, delay = 0, type = 'sine', slide = 0) { if (actx) tone(f, actx.currentTime + delay, d, v, type, slide); }
const SFX = {
  tap() { bleep(660, 0.08, 0.04); },
  good() { bleep(784, 0.1, 0.05); bleep(1047, 0.12, 0.04, 0.07); },
  bonus() { [784, 988, 1175, 1568].forEach((f, i) => bleep(f, 0.12, 0.04, i * 0.06)); },
  oops() { bleep(330, 0.28, 0.05, 0, 'triangle', -120); },
  pop() { bleep(700, 0.07, 0.045, 0, 'sine', 500); },
  dig() { bleep(170, 0.08, 0.05, 0, 'triangle', -50); },
  start() { [392, 523, 659].forEach((f, i) => bleep(f, 0.14, 0.045, i * 0.1)); },
  level() { [523, 659, 784, 1047].forEach((f, i) => bleep(f, 0.16, 0.045, i * 0.1)); },
  win() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => bleep(f, 0.18, 0.045, i * 0.12)); },

// 🎵 a short catchy loop: TUNE = { bpm, wave, chords: 4 chords (midi), mel: 32 eighth notes (midi, 0 = rest) on the chord tones }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let nextNote = 0, step = 0;
function musicTick() {
  if (!actx || actx.state !== 'running' || !musicOn) return;
  const now = actx.currentTime, e = 60 / TUNE.bpm / 2;
  if (nextNote < now) nextNote = now + 0.05;           // never pile up old notes
  while (nextNote < now + 0.25) {
    const ch = TUNE.chords[Math.floor(step / 8) % TUNE.chords.length], m = TUNE.mel[step % TUNE.mel.length];
    if (m) tone(mtof(m), nextNote, e * 1.7, 0.05, TUNE.wave || 'triangle', 0, musicBus);
    if (step % 4 === 0) tone(mtof(ch[0] - 12), nextNote, e * 3.5, 0.06, 'sine', 0, musicBus);
    if (step % 4 === 2) tone(mtof(ch[1]), nextNote, e * 1.5, 0.02, 'sine', 0, musicBus);
    nextNote += e; step++;

setInterval(musicTick, 50);
function toggleMusic() {
  musicOn = !musicOn; audio();

// ================= 🐟 SAMMY'S FISH CATCH (❓ Mystery Game 1, 💡 Ben's idea!) =================
// Sammy the cat balances a basket on his head on the dock. Fish fall from the sky: catch them!
// Old boots fall too: dodge them (a boot in the basket costs a heart). Catch enough fish to win the level.
// Level 1 Sunny Dock (easy), Level 2 Rainy River (rain + wiggly fish), Level 3 Starry Sea (night + golden fish worth 3).
const TUNE = { bpm: 112, wave: 'triangle',
  chords: [[60, 64, 67], [65, 69, 72], [67, 71, 74], [60, 64, 67]],
  mel: [72, 0, 76, 79, 76, 0, 72, 0, 77, 0, 81, 0, 77, 76, 72, 0, 74, 0, 79, 0, 83, 79, 74, 0, 79, 76, 72, 0, 72, 0, 0, 0] };
const LEVELS = [
  { name: 'Sunny Dock', tip: 'Catch 10 fish! Dodge the old boots.', goal: 10, every: 62, speed: 2.1, boot: 0.16, wiggle: 0, gold: 0 },
  { name: 'Rainy River', tip: 'Rain! The fish wiggle as they fall. Catch 14!', goal: 14, every: 52, speed: 2.5, boot: 0.22, wiggle: 1, gold: 0 },
  { name: 'Starry Sea', tip: 'Golden fish are worth 3! Get 20 points!', goal: 20, every: 46, speed: 2.9, boot: 0.26, wiggle: 0.6, gold: 0.22 },
];
const DOCK = 462;
const sammy = { x: W / 2, face: 1, moving: false, happy: 0, ouch: 0 };
let items = [], score = 0, spawnT = 0, rain = [], splashes = [];
const GAME = {
  id: 'mgame1', num: 1, name: "Sammy's Fish Catch", color: '#7df9ff', lives: 4,
  instr: ['⬅️ ➡️ Move Sammy (or drag your finger)', '🐟 Catch the fish in Sammy\'s basket', '👢 Dodge the old boots!'],
  reset(L) {
    sammy.x = W / 2; sammy.face = 1; sammy.happy = 0; sammy.ouch = 0; items = []; score = 0; spawnT = 30; splashes = [];
    rain = []; for (let i = 0; i < 90; i++) rain.push({ x: rand(0, W), y: rand(0, H), v: rand(7, 11) });
  },
  hud(L) { return `🐟 ${score} / ${L.goal}`; },
  key() {},
  tap() {},
  update(L) {
    // move Sammy
    let dx = 0; const sp = 6.2;
    if (keys.ArrowLeft || keys.a) dx -= sp;
    if (keys.ArrowRight || keys.d) dx += sp;
    if (pointer.down && Math.abs(pointer.x - basketX()) > 8) dx = clamp(pointer.x - basketX(), -sp * 1.3, sp * 1.3);
    sammy.x = clamp(sammy.x + dx, 50, W - 50); sammy.moving = Math.abs(dx) > 0.5;
    if (dx > 0.5) sammy.face = 1; else if (dx < -0.5) sammy.face = -1;
    if (sammy.happy > 0) sammy.happy--; if (sammy.ouch > 0) sammy.ouch--;

      spawnT = L.every + rand(-10, 10);

      items.push({ kind, x: rand(70, W - 70), y: -30, x0: 0, vy: L.speed * (kind === 'boot' ? 1.1 : 1) * rand(0.9, 1.1), t: rand(0, 7), col: pick(['#4fc3f7', '#ff8a65', '#81c784', '#ba68c8']) });
      items[items.length - 1].x0 = items[items.length - 1].x;
    }

    for (const it of items) {
      it.t += 0.05; it.y += it.vy;
      if (L.wiggle && it.kind !== 'boot') it.x = clamp(it.x0 + Math.sin(it.t * 1.6) * 60 * L.wiggle, 30, W - 30);
      if (!it.done && it.y > by - 10 && it.y < by + 22 && Math.abs(it.x - bx) < 52) {
        it.done = true;
        if (it.kind === 'boot') { loseLife(); sammy.ouch = 40; popText(bx, by - 30, 'Bonk! 👢', '#ffccbc'); burst(bx, by, ['#8d6e63', '#bcaaa4'], 8); }
        else { const pts = it.kind === 'gold' ? 3 : 1; score += pts; sammy.happy = 25;
          if (pts === 3) { SFX.bonus(); popText(bx, by - 30, '+3 ✨', '#ffd740'); burst(bx, by, ['#ffd740', '#fff59d', '#fff'], 18, 5); }
          else { SFX.good(); popText(bx, by - 30, '+1', '#b9f6ca'); burst(bx, by, ['#b3e5fc', '#fff'], 8); } }
      }

    }

    for (const s of splashes) s.t++; splashes = splashes.filter(s => s.t < 30);
    for (const r of rain) { r.y += r.v; r.x -= 1.5; if (r.y > H) { r.y = -10; r.x = rand(0, W + 60); } }
    if (score >= L.goal && state === 'play') { items = []; levelWon(); }
  },
  idle() { for (const r of rain) { r.y += r.v; r.x -= 1.5; if (r.y > H) { r.y = -10; r.x = rand(0, W + 60); } } if (sammy.happy > 0) sammy.happy--; },
  draw(L, title) {
    drawWorld(L);
    if (title) return;

  },
  titleArt() {
    drawSammy(W / 2 - 10, 340, 1, frame % 160 < 40 ? 'happy' : 'idle');
    for (let i = 0; i < 4; i++) drawFish(W / 2 - 230 + i * 150 + (i > 1 ? 40 : 0), 210 + Math.sin(frame * 0.05 + i) * 10, ['#4fc3f7', '#ff8a65', '#ffd740', '#81c784'][i], i === 2, 1.1);
    drawBoot(W / 2 + 240, 300 + Math.sin(frame * 0.04) * 6, 0.2);
  },
  winArt() { drawSammy(W / 2, 372, 1, 'happy'); drawFish(W / 2 - 200, 300, '#4fc3f7', false, 1.2); drawFish(W / 2 + 200, 300, '#ff8a65', false, 1.2); drawFish(W / 2 + 26, 238 + Math.sin(frame * 0.1) * 5, '#ffd740', true, 1); },
};
function basketX() { return sammy.x + 26 * sammy.face; }
// 🐱 THE CATS: copied from The Cats' Cozy Corner (via arcaderoom.html). Sammy is a cat!
const CATS = {
  sammy: { fur: '#8d6e63', dark: '#4e342e', belly: '#e2c8a4', ear: '#ffb3c6', eye: '#ffd54f', line: '#3e2a22', stripes: true, eyeRim: '#fff4dc' },
  jimmy: { fur: '#f59a3c', dark: '#c25e12', belly: '#fff3e0', ear: '#ffb3c6', eye: '#3fbf48', line: '#8a4a12', stripes: true, paws: '#ffffff', eyeRim: '#fffbe8' },
  rocky: { fur: '#a3a9b2', dark: '#646b75', belly: '#eceff3', ear: '#ffb3c6', eye: '#ffc93c', line: '#4a5059', stripes: true, paws: '#eceff3' },
  mimo:  { fur: '#1f1f28', dark: '#121218', belly: '#2c2c38', ear: '#ff9fbf', eye: '#8dff4a', line: '#5a5a70', shine: true, muzzle: '#34343f', blink: '#c9ffb0', whisk: 'rgba(255,255,255,.75)', collar: true },
  // 🤍💙 CHARLIE (Ben's design): a soft, normal WHITE cat, BLUE on the top of the head (from the middle of the eyes up),
  // both ears, the top of the back (where you pet) and the tail. Same color pattern as Sparks, on a real furry cat.
  charlie: { fur: '#fbfbfd', dark: '#dfe3ea', belly: '#ffffff', ear: '#ffb3c6', eye: '#5cbf4a', line: '#8790a3', cap: '#3f7fe0', eyeRim: '#ffffff' },
  tiger: { fur: '#a07856', dark: '#4a3020', belly: '#ecd3ad', ear: '#ffb3c6', eye: '#5ad15a', line: '#3e2a22', spots: true, fewStripes: true, glow: true, eyeRim: '#fff6d8' },

function drawTail(c, t, up, pose) {

}

function drawLegs(c, pose, t) {

    catLine(c); ctx.beginPath(); ctx.ellipse(hx, hy, 14, 12.5, 0, 0, 7); ctx.stroke(); }

  if (c.spots) { for (const [sx, sy, r] of [[-10, 2, 1.8], [-7, 6, 1.5], [-11, -4, 1.4], [-4, -10, 1.3]]) circle(hx + sx, hy + sy, r, c.dark); }
  if (c.shine) ellipse(hx - 4, hy - 7, 6, 2.6, 'rgba(255,255,255,.22)', -0.3);

function bodyMarks(c, sp) {                            // stripes, or Tiger's polka dots (+ just a few stripes)

const MARKS_STAND = { stripes: [[-12, -34], [-4, -34], [4, -34], [12, -34]], spots: [[-10, -27, 2.8], [-1, -30, 2.6], [8, -26, 2.8], [-15, -19, 2.2], [14, -32, 2], [3, -21, 2.2], [-6, -20, 1.8]], few: [[-15, -34], [16, -33]] };

function drawBody(c, pose) {
  const rx = pose === 'pounce' ? 25 : 21, ry = pose === 'pounce' ? 11 : 13;

// x, y = between the cat's feet. o = { face, pose, t, s, mouth, shut, grumpy, rot }
function drawCat(who, x, y, o = {}) {
  const c = CATS[who] || CATS.sammy, face = o.face || 1, s = o.s || 1, t = o.t === undefined ? frame : o.t, pose = o.pose || 'idle';

function twinkles(c, x, y, s, t) {                    // little stars that float around Tiger
  if (!c.glow) return;

// ---------- 🎨 drawing ----------

  ctx.fillStyle = '#c8894a'; ctx.beginPath(); ctx.moveTo(bx - 44, by - 12); ctx.lineTo(bx + 44, by - 12); ctx.lineTo(bx + 34, by + 14); ctx.lineTo(bx - 34, by + 14); ctx.closePath(); ctx.fill();

function drawFish(x, y, col, gold, s = 1) {

function drawBoot(x, y, rot = 0) {

  roundRect(-14, 0, 40, 16, 8, '#6d4c41');                      // foot

function drawItem(it) {

function drawRain() { ctx.strokeStyle = 'rgba(200,225,255,.55)'; ctx.lineWidth = 2; ctx.beginPath(); for (const r of rain) { ctx.moveTo(r.x, r.y); ctx.lineTo(r.x - 3, r.y + 12); } ctx.stroke(); }

GAME.reset(LEVELS[0]);
// ---------- ✨ sparkles, pop-up words and confetti ----------
let parts = [], confetti = [];

// ---------- 🎮 keys, taps and the game flow ----------
const keys = {};
const pointer = { x: W / 2, y: H / 2, down: false };
const MUSIC_BTN = { x: W - 64, y: H - 60, w: 52, h: 48 };
let state = 'title', level = 0, lives = 3, timer = 0, hurtFlash = 0;
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
function toCanvas(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
addEventListener('keydown', e => {
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();

C.addEventListener('mousedown', e => {

addEventListener('mousemove', e => { const p = toCanvas(e); pointer.x = p.x; pointer.y = p.y; });

addEventListener('blur', () => { for (const k in keys) keys[k] = false; pointer.down = false; });
function press() {

  else if (state === 'levelDone' && timer > 45) { level++; startLevel(); }

}
function drawMusicBtn() { roundRect(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.w, MUSIC_BTN.h, 14, 'rgba(0,0,0,.35)'); emoji(musicOn ? '🎵' : '🔇', MUSIC_BTN.x + 26, MUSIC_BTN.y + 25, 26); }

  GAME.draw(LEVELS[0], true);

    text(pick2(['Great job! ⭐', 'Super! 🌟', 'Hooray! 🎉'], level), W / 2, 240, 56, '#ffd740');
    text(`You beat ${L.name}!`, W / 2, 292, 30);
    if (timer > 45) text('Tap or press SPACE for the next level', W / 2, 342, 24, '#69f0ae');
  } else if (state === 'fail') {

    text('YOU DID IT! 🏆', W / 2, 168, 64, '#ffd740'); text(`You beat all 3 levels of ${GAME.name}!`, W / 2, 222, GAME.name.length > 20 ? 21 : 26);
    if (GAME.winArt) GAME.winArt();
    text('🏆 You won a new trophy for the Trophy Room!', W / 2, 404, 24, '#69f0ae');

const pick2 = (arr, i) => arr[i % arr.length];
function update() {
  frame++; timer++;
  if (state === 'intro' && timer > 110) state = 'play';

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;

}
requestAnimationFrame(loop);
