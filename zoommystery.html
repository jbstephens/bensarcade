<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🔍 Zoom-In Mystery</title>
<script src="touchpad.js?v=4"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #d9f2ff 0 36px, #c9eaff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(30px, 6vw, 64px); color: #fff; -webkit-text-stroke: 3px #333; text-shadow: 5px 5px 0 #7c4dff; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.sel { outline: 5px solid #1e6bff; outline-offset: 3px; }
  .hide { display: none !important; }
  .b-yellow { background: #ffe066; } .b-green { background: #8ef08e; } .b-blue { background: #9be3ff; } .b-pink { background: #ffc2d6; }
  .b-purple { background: #c3a6ff; } .b-orange { background: #ffb347; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- home ---------- */
  #home { flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; overflow-y: auto; }
  #home p { margin: 0; font-size: clamp(17px, 2.4vw, 24px); font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 6px 14px; }
  #homeBtns { display: grid; grid-template-columns: repeat(3, minmax(170px, 260px)); gap: 14px; }
  #homeBtns .btn { font-size: clamp(19px, 2.4vw, 26px); min-height: 90px; }
  #homeStats { font-size: 20px; font-weight: bold; }
  #homeArt { display: flex; gap: 10px; }
  #homeArt svg { width: clamp(70px, 11vw, 120px); height: auto; border: 4px solid #333; border-radius: 50%; background: #fff; }
  /* ---------- family setup ---------- */
  #setup { flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 12px; }
  #names { display: grid; grid-template-columns: repeat(4, minmax(130px, 200px)); gap: 12px; }
  #names .btn { font-size: 24px; min-height: 70px; }
  #names .btn.on { background: #8ef08e; border-color: #1a7f1a; }
  .card { background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px 14px; font-size: 22px; font-weight: bold; text-align: center; }
  /* ---------- play ---------- */
  #play { flex-direction: row; gap: 12px; padding: 10px; align-items: stretch; }
  #zoomWrap { flex: none; height: calc(100vh - 20px); width: calc(100vh - 20px); max-width: calc(100vw - 440px); max-height: calc(100vw - 440px);
    position: relative; align-self: center; }
  #zoomBox { position: absolute; inset: 0; border: 8px solid #333; border-radius: 28px; overflow: hidden; background: #fff; box-shadow: 0 8px 0 #7c4dff; }
  #zoomBox svg { width: 100%; height: 100%; display: block; }
  #lvl { position: absolute; left: 14px; top: 14px; background: rgba(255,255,255,.92); border: 3px solid #333; border-radius: 14px; padding: 4px 10px; font-size: 20px; font-weight: bold; }
  #pside { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #turn { font-size: 24px; }
  #starsUp { font-size: 22px; text-align: center; }
  #choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .ch { display: flex; flex-direction: column; align-items: center; padding: 6px; min-height: 0; font-size: 20px; }
  .ch svg { width: 100%; max-width: 120px; height: auto; border-radius: 12px; border: 3px solid #333; pointer-events: none; }
  .ch.wrong { opacity: .35; background: #ddd; }
  .ch.right { background: #8ef08e; border-color: #1a7f1a; }
  #msg { font-size: 22px; font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 16px; padding: 6px; }
  #score { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  #score span { background: #fff; border: 3px solid #333; border-radius: 12px; padding: 3px 9px; font-size: 18px; font-weight: bold; }
  #score span.now { background: #ffe066; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- confetti ---------- */
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .cf { position: absolute; top: -20px; width: 12px; height: 18px; border-radius: 3px; animation: fall 2.6s linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #7c4dff; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 10px; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet view ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg.sheet { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #7c4dff; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #pens { display: grid; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #certNames { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #certNames .btn { font-size: 16px; min-height: 46px; padding: 4px; }
  #certNames .btn.on { background: #8ef08e; }
  /* ---------- overlays ---------- */
  .over { position: fixed; inset: 0; background: rgba(30, 20, 70, .74); display: none; z-index: 50; align-items: center; justify-content: center; padding: 14px; }
  .over.on { display: flex; }
  .overCard { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1100px;
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .overCard h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.4vw, 38px); }
  #cmpRow { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  #cmpRow > div { text-align: center; font-size: 22px; font-weight: bold; }
  #cmpMine, #cmpReal { position: relative; width: 100%; max-height: 62vh; aspect-ratio: 1; margin: 0 auto; border: 4px solid #333; border-radius: 14px; overflow: hidden; background: #fff; }
  #cmpMine svg, #cmpReal svg, #cmpMine img { position: absolute; inset: 0; width: 100%; height: 100%; }
  #doneList { display: flex; flex-direction: column; gap: 6px; font-size: 24px; font-weight: bold; align-items: center; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 80; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #play, #view { flex-direction: column; }
    #zoomWrap { width: min(calc(100vw - 20px), 52vh); height: min(calc(100vw - 20px), 52vh); max-width: none; max-height: none; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #homeBtns { grid-template-columns: 1fr 1fr; } #names { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px; } #pHelp, #msg { font-size: 15px; } .ch svg { max-width: 80px; } #homeBtns .btn { min-height: 64px; } }
  /* ---------- PRINT: only the sheet (or a whole set of sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, .over { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg.sheet, #printAll svg.sheet { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg.sheet { break-after: page; page-break-after: always; }
    #printAll svg.sheet:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <h1 class="big">🔍 ZOOM-IN MYSTERY</h1>
  <div id="homeArt"></div>
  <p>We zoomed WAY in on a picture! Can you guess what it is?</p>
  <div id="homeBtns">
    <button class="btn b-yellow" data-go="solo">🔍 Play!<br><small>Ben's mystery</small></button>
    <button class="btn b-green" data-go="family">👨‍👩‍👦 Family Mode<br><small>take turns</small></button>
    <button class="btn b-pink" data-go="draw">✏️ Draw the rest!<br><small>crayons + print</small></button>
    <button class="btn b-purple" data-go="cert">🏅 Detective<br>Certificate</button>
    <button class="btn b-orange" data-go="printall">🖨️ Print the<br>whole book</button>
    <button class="btn b-blue" data-go="back">⬅️ Back</button>
  </div>
  <div id="homeStats"></div>
</div>
<div id="setup" class="screen">
  <h1 class="big">👨‍👩‍👦 Who's playing?</h1>
  <div class="card">Tap everybody who wants a turn!</div>
  <div id="names"></div>
  <div class="row2" style="width:min(600px,92vw)">
    <button class="btn b-blue" id="bSetupBack">⬅️ Back</button>
    <button class="btn b-green" id="bSetupGo">▶️ Start!</button>
  </div>
</div>
<div id="play" class="screen">
  <div id="zoomWrap"><div id="zoomBox"></div><div id="lvl"></div></div>
  <div id="pside">
    <div class="card" id="turn"></div>
    <div class="card" id="starsUp"></div>
    <button class="btn b-yellow" id="bZoom">🔍 Zoom out</button>
    <div id="choices"></div>
    <div id="msg"></div>
    <div id="score"></div>
    <div class="row2">
      <button class="btn b-pink" id="bSay">🔊 Hear it</button>
      <button class="btn b-blue" id="bQuit">🏠 Home</button>
    </div>
    <button class="btn b-green hide" id="bNext">➡️ Next mystery!</button>
    <button class="btn b-purple hide" id="bDrawThis">✏️ Draw the rest of this one</button>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <h1 class="big">✏️ DRAW THE REST!</h1>
    <p>Pick a mystery piece. What could it be? Draw the rest of the picture!</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="row2" id="modes">
      <button class="btn b-mode" id="bDrawMode">✏️ Draw the rest</button>
      <button class="btn b-mode" id="bSillyMode">🤪 Silly ideas</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <div id="certNames" class="hide"></div>
    <button class="btn b-magic" id="bCompare">🔎 Show the real one!</button>
    <div class="row2">
      <button class="btn b-green" id="bPrint">🖨️ Print blank</button>
      <button class="btn b-orange" id="bPrintMine">🖨️ Print my drawing</button>
    </div>
    <div class="row2">
      <button class="btn b-pink" id="bClear">🧽 Clear</button>
      <button class="btn b-purple" id="bPrintAll">🖨️ Print them all</button>
    </div>
    <button class="btn b-blue" id="bBack">⬅️ Back to pieces</button>
  </div>
</div>
<div id="compare" class="over"><div class="overCard"><h2 id="cmpTitle"></h2>
  <div id="cmpRow"><div>🖍️ Yours!<div id="cmpMine"></div></div><div>🔍 The real one!<div id="cmpReal"></div></div></div>
  <button class="btn b-green" id="bCmpClose">👍 Cool!</button></div></div>
<div id="done" class="over"><div class="overCard"><h2 id="doneTitle"></h2><div id="doneList"></div>
  <div class="row2"><button class="btn b-green" id="bAgain">🔁 Play again</button><button class="btn b-blue" id="bDoneHome">🏠 Home</button></div></div></div>
<div id="printAll"></div>
<div id="confetti"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🔍 ZOOM-IN MYSTERY: guess a super zoomed-in piece of a picture, then draw the rest!
// Every mystery picture is drawn in SVG in a 400 x 400 box (a "spot" says where we zoom in).
// Character art style is copied from the Art Gallery (gradients + highlights, no SVG filters).
// Printed sheets are portrait letter pages, viewBox 0 0 800 1000.
// =====================================================================
const OL = '#1b1b2f';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'a0_', artSeq = 0;
function beginArt() { DEFS = []; GC = {}; GP = 'a' + (++artSeq) + '_'; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
// ---- gradients (registered per picture, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
// a round, lit-from-top-left body color
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
// a soft vertical body color
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
// soft glow + soft shadow (fake blur with transparent gradient edges)
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- shapes ----
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
function paint(f, s, w) { return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', w || 2) + ' stroke-linejoin="round" stroke-linecap="round"' : ''); }
const C = (x, y, r, f, s, w, ex) => '<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"' + paint(f, s, w) + (ex || '') + '/>';
const E = (x, y, rx, ry, f, s, w, rot, ex) => '<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + paint(f, s, w) + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : '') + (ex || '') + '/>';
const R = (x, y, w, h, r, f, s, sw, rot, ex) => '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + paint(f, s, sw) + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : '') + (ex || '') + '/>';
const P = (d, f, s, w, ex) => '<path d="' + d + '"' + paint(f, s, w) + (ex || '') + '/>';
const L = (d, col, w, ex) => '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
const O = (op, inner) => '<g opacity="' + op + '">' + inner + '</g>';
const T = (x, y, txt, size, col, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (col || OL) + '" text-anchor="middle" font-weight="bold" font-family="Chalkboard SE, Comic Sans MS, sans-serif"' + (ex || '') + '>' + txt + '</text>';
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const eglow = (x, y, rx, ry, c, a) => E(x, y, rx, ry, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function zoomBox(i, w) { const [sx, sy] = PICS[i].spot; return [clamp(sx - w / 2, 0, 400 - w), clamp(sy - w / 2, 0, 400 - w), w, w]; }
const vbStr = b => b.map(v => n(v)).join(' ');
function picBody(i) { beginArt(); const body = PICS[i].draw(); return { body, defs: DEFS.join('') }; }
function picSVG(i, box, ex) {
  const p = picBody(i);
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vbStr(box || [0, 0, 400, 400]) + '" preserveAspectRatio="xMidYMid slice" ' + (ex || '') + '><defs>' + p.defs + '</defs>' + p.body + '</svg>';

}
function renderSheet(extra) { if (hasDOM()) $('svgBox').innerHTML = buildSheet(cur.kind, cur.i, null, extra); }
function updateSide() {

  $('pTitle').textContent = d ? '🔍 Mystery #' + (cur.i + 1) : cert ? '🏅 Mystery Detective' : '🔑 Answer page ' + (cur.i + 1);
  $('bDrawMode').classList.toggle('on', cur.kind === 'draw'); $('bSillyMode').classList.toggle('on', cur.kind === 'silly');
  $('modes').classList.toggle('hide', !d); $('pens').classList.toggle('hide', !d); $('bCompare').classList.toggle('hide', !d);
  $('bPrintMine').classList.toggle('hide', !d); $('bClear').classList.toggle('hide', !d); $('trace').classList.toggle('on', d);
  $('certNames').classList.toggle('hide', !cert);

function setSheetMode(m) { if (!drawable()) return; save.sheetMode = m; saveNow(); openSheet(m, cur.i); }
function renderCertNames() {
  const box = $('certNames'); box.innerHTML = '';
  NAMES.forEach(nm => { const b = document.createElement('button'); b.className = 'btn' + (save.cert === nm ? ' on' : ''); b.textContent = nm;
    b.addEventListener('click', () => { save.cert = nm; saveNow(); renderSheet(); renderCertNames(); blip(700); }); box.appendChild(b); });

let fromGame = false;
function backToGallery() { endPrintAll(); closeOver(); if (fromGame && G0) { fromGame = false; show('play'); return; } renderGallery(); show('gallery'); markSel(); }
function clearSheet() { const id = traceId(); if (!id) return; save.traces[id] = []; saveNow(); drawTraces(); blip(300); }
// ---------- crayons (copied from the Craft Room) ----------
const PENS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222'];
const BORDER = 5;
function sheetBox() {
  const r = $('wrap').getBoundingClientRect(), w = r.width - BORDER * 2, h = r.height - BORDER * 2;
  const s = Math.min(w / 800, h / 1000) || 1;

function toSheet(e) { const b = sheetBox(); return [f1((e.clientX - b.r.left - b.ox) / b.s), f1((e.clientY - b.r.top - b.oy) / b.s)]; }
function sizeCanvas() {

}
function drawTraces() {

  ctx.globalAlpha = .9; strokeAll(ctx, save.traces[id] || []); ctx.globalAlpha = 1;
}
function penDown(e) {
  if (screen !== 'view' || !traceId()) return;
  if (document.body.classList.contains('pAll')) endPrintAll();
  if (e.preventDefault) e.preventDefault();
  const [x, y] = toSheet(e), id = traceId();
  stroke = { c: pen, p: [x, y] };
  (save.traces[id] = save.traces[id] || []).push(stroke);
  drawTraces();
}
function penMove(e) {
  if (!stroke) return;
  const [x, y] = toSheet(e), p = stroke.p, k = p.length;

function penUp() { if (!stroke) return; stroke = null; saveNow(); }
function renderPens() {
  const box = $('pens'); box.innerHTML = '';
  PENS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (c === pen ? ' sel' : ''); s.style.background = c;
    s.addEventListener('click', () => { pen = c; box.querySelectorAll('.sw').forEach((el, i) => el.classList.toggle('sel', PENS[i] === c)); });
    box.appendChild(s);
  });
}
function traceImage() {                  // your crayon drawing as a picture laid on the sheet
  const id = traceId(), list = (id && save.traces[id]) || []; if (!list.length || typeof document === 'undefined') return '';
  const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 2000; const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return '';
  ctx.scale(2, 2); ctx.globalAlpha = .9; strokeAll(ctx, list);

const imgTag = img => img ? '<image href="' + img + '" x="0" y="0" width="800" height="1000"/>' : '';
// ---------- 🔎 compare: yours vs the real one ----------
function openCompare() {
  if (!drawable()) return false;
  const fr = FRAME, img = traceImage();
  $('cmpTitle').textContent = '🔎 It was ' + PICS[cur.i].say + '!';
  $('cmpMine').innerHTML = buildSheet(cur.kind, cur.i, fr.join(' '), imgTag(img)).replace('class="sheet"', '');
  $('cmpReal').innerHTML = picSVG(cur.i);
  $('compare').classList.add('on'); tada(); confetti(); speak('Ta-da! It was ' + PICS[cur.i].say + '!');
  return true;
}
// =====================================================================
// PRINTING: only the sheet prints (see @media print). A "set" prints one sheet per page.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}

  }, 60);
}
function notePrint() { save.printed++; saveNow(); earnTrophy('You printed your first mystery sheet!'); }
function printSheet() {                  // the blank sheet (no crayons)
  if (screen !== 'view') return false;
  endPrintAll(); renderSheet(); notePrint(); doPrint(() => renderSheet()); return true;
}
function printMine() {                   // the sheet + your crayon drawing

  endPrintAll(); renderSheet(imgTag(traceImage())); notePrint(); doPrint(() => renderSheet()); return true;
}
function setPages(list) {
  $('printAll').innerHTML = list.map(p => buildSheet(p[0], p[1])).join('');
  document.body.classList.add('pAll'); notePrint();
  toast('🖨️ Printing ' + list.length + ' pages!'); doPrint(endPrintAll);
  return list.length;
}
const answerList = () => Array.from({ length: ansPages() }, (_, i) => ['answers', i]);
function printSet(kind) { return setPages(PICS.map((p, i) => [kind, i]).concat(answerList())); }   // answers go at the back
function printBook() { return setPages(PICS.map((p, i) => ['draw', i]).concat(answerList(), [['cert', 0]])); }
function printAllBtn() { if (cur.kind === 'cert') printBook(); else printSet(cur.kind === 'silly' ? 'silly' : 'draw'); }
function endPrintAll() {
  if (!hasDOM()) return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens/picks, Escape goes back, P prints, Z zooms out, 1-4 guess
// =====================================================================
let navSel = 0;
function navList() {
  if (screen === 'home') return Array.from(document.querySelectorAll('#homeBtns .btn'));
  if (screen === 'setup') return Array.from(document.querySelectorAll('#names .btn')).concat([$('bSetupBack'), $('bSetupGo')]);
  return [];
}
function markNav() { navList().forEach((b, i) => b.classList.toggle('sel', i === navSel)); }
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key, overOn = document.querySelector('.over.on');
  if (overOn) {
    if (k === 'Escape' || k === 'Enter' || k === ' ' || k === 'Backspace') { e.preventDefault(); if (overOn.id === 'done') { if (k === 'Escape' || k === 'Backspace') goHome(); else { closeOver(); startGame(G0.players); } } else closeOver(); }
    return;
  }
  if (screen === 'home' || screen === 'setup') {
    const list = navList(), cols = screen === 'home' ? 3 : 4;
    if (k === 'ArrowRight') navSel = Math.min(list.length - 1, navSel + 1);
    else if (k === 'ArrowLeft') navSel = Math.max(0, navSel - 1);
    else if (k === 'ArrowDown') navSel = Math.min(list.length - 1, navSel + cols);
    else if (k === 'ArrowUp') navSel = Math.max(0, navSel - cols);
    else if (k === 'Enter' || k === ' ') { if (list[navSel]) list[navSel].click(); e.preventDefault(); return; }

    e.preventDefault(); markNav(); blip(520, 0, .06);
  } else if (screen === 'play') {
    if (k >= '1' && k <= '4') { guess(+k - 1); return; }
    if (k === 'ArrowRight' || k === 'ArrowDown') { G0.pick = ((G0.pick === undefined ? -1 : G0.pick) + (k === 'ArrowDown' ? 2 : 1)) % 4; renderPlay(); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { G0.pick = ((G0.pick === undefined ? 0 : G0.pick) + (k === 'ArrowUp' ? 2 : 3)) % 4; renderPlay(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { e.preventDefault(); if (G0.solved) nextRound(); else if (G0.pick !== undefined) guess(G0.pick); else zoomOut(); }
    else if (k === 'z' || k === 'Z') zoomOut();
    else if (k === 'h' || k === 'H') sayChoices();
    else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); goHome(); }
  } else if (screen === 'gallery') {
    const cols = gridCols(), N = ITEMS().length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openItem(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { openItem(sel); printSheet(); return; }
    else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); goHome(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else if (screen === 'view') {
    const N = ITEMS().length;

    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openItem((sel + 1) % N); e.preventDefault(); }

}
// =====================================================================
// START
// =====================================================================
function homeGo(what) {

  else if (what === 'draw') { renderGallery(); show('gallery'); markSel(); }

function init() {

  $('bAgain').addEventListener('click', () => { closeOver(); startGame(G0.players); }); $('bDoneHome').addEventListener('click', goHome);
