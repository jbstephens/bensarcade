<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📍 Secret Grid Pictures</title>
<script src="touchpad.js?v=3"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background-color: #e9f6ff;
    background-image: linear-gradient(#cfe8ff 2px, transparent 2px), linear-gradient(90deg, #cfe8ff 2px, transparent 2px);
    background-size: 40px 40px;
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead h1 { margin: 0; font-size: clamp(28px, 4.6vw, 54px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff3d6e; letter-spacing: 2px; }
  #gHead p { margin: 2px 0 6px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; }
  #tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #tools .btn { font-size: 19px; min-height: 52px; padding: 6px 12px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333;
    text-shadow: 3px 3px 0 #333; margin: 6px 4px -6px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #3a86c9; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 0; pointer-events: none; }
  .thumb small { font-size: 13px; pointer-events: none; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb.done::after { content: '✅'; position: absolute; right: -8px; top: -10px; font-size: 28px; }
  .thumb:active { transform: scale(.96); }
  /* ---------- play + maker screens ---------- */
  #view, #maker { flex-direction: row; gap: 10px; padding: 10px; }
  .boardWrap { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  .board { height: calc(100vh - 20px); max-width: 100%; aspect-ratio: 1; background: #fff; border: 5px solid #333;
    border-radius: 14px; box-shadow: 0 8px 0 #3a86c9; touch-action: none; display: block; }
  .side { width: min(40vw, 380px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 5px; }
  #clueCard { font-size: 24px; font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333;
    border-radius: 14px; padding: 8px; line-height: 1.3; }
  #clueCard .sw2 { display: inline-block; width: 26px; height: 26px; border: 3px solid #333; border-radius: 6px; vertical-align: middle; }
  #clueCard .tip { display: block; font-size: 17px; font-weight: normal; color: #555; }
  #prog { text-align: center; font-size: 17px; font-weight: bold; }
  #clueList { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; font-size: 17px;
    min-height: 90px; max-height: 32vh; overflow-y: auto; -webkit-overflow-scrolling: touch; flex-shrink: 0; }
  #clueList div { padding: 3px 6px; border-radius: 8px; }
  #clueList .ok { color: #999; text-decoration: line-through; }
  #clueList .now { background: #ffe066; font-weight: bold; }
  #clueList i { display: inline-block; width: 16px; height: 16px; border: 2px solid #333; border-radius: 4px; vertical-align: -2px; margin-right: 4px; }
  .row2 { display: flex; gap: 8px; } .row2 .btn { flex: 1; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide { display: none; }
  .b-back { background: #9be3ff; } .b-print { background: #8ef08e; } .b-print2 { background: #ffb347; }
  .b-find { background: #ffe066; } .b-help { background: #d1b3ff; } .b-pink { background: #ffc2d6; }
  .b-make { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-on { background: #ff8ac0; }
  #crayons { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 14px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 4px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .names { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .names .btn { font-size: 17px; min-height: 46px; padding: 4px 10px; }
  /* ---------- pop-up box ---------- */
  #box { position: fixed; inset: 0; background: rgba(20, 30, 70, .6); z-index: 40; display: none; align-items: center; justify-content: center; }
  #box.on { display: flex; }
  #boxIn { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 16px 20px; max-width: 92vw; max-height: 92vh; overflow-y: auto;
    text-align: center; box-shadow: 0 10px 0 #ff3d6e; }
  #boxIn h2 { margin: 4px 0 10px; font-size: 30px; }
  #boxIn p { font-size: 20px; margin: 6px 0; }
  #boxIn .btn { margin: 5px; }
  #boxIn svg { max-height: 42vh; max-width: 70vw; }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 55; }
  #printArea { display: none; }
  @keyframes blink { 0%, 100% { opacity: .15; } 50% { opacity: .75; } }
  .flash { animation: blink .5s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { stroke-width: 4; } 50% { stroke-width: 9; } }
  .pulse { animation: pulse .7s ease-in-out infinite; }
  @media (orientation: portrait) {
    #view, #maker { flex-direction: column; }
    .board { height: auto; width: 100%; max-height: 56vh; }
    .side { width: 100%; flex: 1; }

  /* ---------- PRINT: only the pages in #printArea ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printArea svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>

<div id="gallery" class="screen on">
  <div id="gHead">

<div id="box"><div id="boxIn"></div></div>
<canvas id="fx"></canvas>
<div id="printArea"></div>

    if (!isTouchy()) clearPrint();      // Chrome waits in print(); iPad clears on 'afterprint'
  }, 60);
}
function pagesFor(p, withAns) { const n = numOf(p) || 1; return puzzlePages(p, n).concat(withAns ? answerPages([{ p, num: n }]) : []); }
function printPuzzle(withAns) { if (cur) { printPages(pagesFor(cur, withAns)); toast('🖨️ Printing!'); } }
// 📕 book builder
let book = { lv: { 1: true, 2: true, 3: false, 0: false }, ans: true };
function bookList() { rebuildList(); return LIST.filter(p => book.lv[p.lvl]); }
function bookPages() {
  const list = bookList(); if (!list.length) return [];
  let pages = [coverPage(list.length), howToPage()];
  list.forEach(p => { pages = pages.concat(puzzlePages(p, numOf(p))); });
  if (book.ans) pages = pages.concat(answerPages(list.map(p => ({ p, num: numOf(p) }))));
  return pages.map((s, i) => i ? addPageNum(s, i + 1) : s);
}
function bookBox() {
  rebuildList();
  const chip = (k, label) => `<button class="btn ${book.lv[k] ? 'b-on' : ''}" data-act="lv" data-v="${k}">${book.lv[k] ? '✅' : '⬜'} ${label}</button>`;
  const n = bookList().length;
  openBox(`<h2>📕 Make a book!</h2><p>Pick what goes in BEN'S SECRET GRID PICTURES:</p><div>` +
    chip(1, '⭐ Easy') + chip(2, '⭐⭐ Medium') + chip(3, '⭐⭐⭐ Hard') + (state.mine.length ? chip(0, '🎨 My own') : '') + `</div>` +
    `<div><button class="btn ${book.ans ? 'b-on' : ''}" data-act="ans">${book.ans ? '✅' : '⬜'} 🔑 Answers at the back</button></div>` +
    `<p>${n} puzzles · about ${n ? bookPages().length : 0} pages</p>` +
    `<div><button class="btn b-print" data-act="printBook"${n ? '' : ' disabled'}>🖨️ Print my book!</button><button class="btn b-back" data-act="close">❌ Close</button></div>`);
}
// 🏅 certificate
const NAMES = ['Ben', 'Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
let certName = 'Ben';
function certBox() {
  openBox(`<h2>🏅 Grid Genius Spy certificate</h2><div class="names">` +
    NAMES.map(n => `<button class="btn ${n === certName ? 'b-on' : ''}" data-act="cname" data-v="${n}">${n}</button>`).join('') + `</div>` +
    `<div style="margin:8px auto;width:min(36vh,300px)">${certPage(certName, certName === 'Ben' ? solvedCount() : 0).replace('<svg ', '<svg style="width:100%;height:auto;border:3px solid #333;border-radius:10px" ')}</div>` +
    `<div><button class="btn b-print" data-act="printCert">🖨️ Print it!</button><button class="btn b-back" data-act="close">❌ Close</button></div>`);
}
function boxAct(act, v) {
  if (act === 'guess') revealBox(v);
  else if (act === 'next') { closeBox(); openPuzzle((sel + 1) % LIST.length); }
  else if (act === 'look') closeBox();
  else if (act === 'printOne') printPuzzle(true);
  else if (act === 'gallery') { closeBox(); backToGallery(); }
  else if (act === 'close') closeBox();
  else if (act === 'lv') { book.lv[v] = !book.lv[v]; bookBox(); }
  else if (act === 'ans') { book.ans = !book.ans; bookBox(); }
  else if (act === 'printBook') { const pg = bookPages(); if (pg.length) { printPages(pg); toast(`📕 Printing ${pg.length} pages!`); } }
  else if (act === 'cname') { certName = v; certBox(); }
  else if (act === 'printCert') printPages([certPage(certName, certName === 'Ben' ? solvedCount() : 0)]);
  else if (act === 'delYes') { state.mine = state.mine.filter(m => m.id !== cur.id); saveState(); closeBox(); sel = 0; backToGallery(); toast('🗑️ Deleted'); }
}
function backToGallery() { cur = null; clearTimeout(findIt.tm); renderGallery(); setView('gallery'); markSel(); }
function leave() {
  try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (_) {}
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
// ---------- 🎨 make your own secret picture ----------
const CRAYONS = ['r', 'o', 'y', 'g', 'G', 's', 'b', 'p', 'k', 'B', 'T', 'a', 'x'].map(ch => LETTER[ch]).concat([0]);   // 0 = eraser
let mk = { n: 8, cells: new Array(64).fill(0), color: LETTER.r, by: 'Ben', undo: [], painting: false, cursor: { r: 0, c: 0 }, showCursor: false };
const mkRows = () => { const out = []; for (let r = 0; r < mk.n; r++) out.push(mk.cells.slice(r * mk.n, r * mk.n + mk.n).map(v => v ? PAL[v][2] : '.').join('')); return out; };
const mkPuzzle = () => ({ id: 'tmp', lvl: 0, kind: 'color', name: `${mk.by}'s Secret Picture`, emoji: '🎨', mystery: true, mine: true, by: mk.by, rows: mkRows() });
function renderMaker() {
  if (typeof document === 'undefined') return;
  const n = mk.n, S = boardSize(n, 'color'), x = c => BM + c * BC;
  let s = `<rect width="${S}" height="${S}" fill="#fff"/>`;
  mk.cells.forEach((v, i) => { if (v) s += `<rect x="${x(i % n)}" y="${x(Math.floor(i / n))}" width="${BC + .5}" height="${BC + .5}" fill="${PAL[v][0]}"/>`; });
  for (let i = 0; i <= n; i++) { const t = i % 4 === 0 && n > 8, c = t ? '#666' : '#b8c4d0', w = t ? 2.2 : 1.2;
    s += `<line x1="${x(i)}" y1="${BM}" x2="${x(i)}" y2="${BM + n * BC}" stroke="${c}" stroke-width="${w}"/><line x1="${BM}" y1="${x(i)}" x2="${BM + n * BC}" y2="${x(i)}" stroke="${c}" stroke-width="${w}"/>`; }
  s += `<rect x="${BM}" y="${BM}" width="${n * BC}" height="${n * BC}" fill="none" stroke="#222" stroke-width="3"/>` + labelsSVG(n, i => x(i) + BC / 2, null);
  if (mk.showCursor) s += `<rect x="${x(mk.cursor.c) + 2}" y="${x(mk.cursor.r) + 2}" width="${BC - 4}" height="${BC - 4}" fill="none" stroke="#1e6bff" stroke-width="4" stroke-dasharray="7 5"/>`;
  const svg = $('mBoard'); svg.setAttribute('viewBox', `0 0 ${S} ${S}`); svg.innerHTML = s;
  $('crayons').innerHTML = CRAYONS.map(v => `<div class="sw${v === mk.color ? ' sel' : ''}" data-v="${v}" style="background:${v ? PAL[v][0] : '#fff'}">${v ? '' : '🧽'}</div>`).join('');
  $('mNames').innerHTML = NAMES.map(nm => `<button class="btn ${nm === mk.by ? 'b-on' : ''}" data-v="${nm}">${nm}</button>`).join('');
  [8, 12, 16].forEach(k => $('mS' + k).classList.toggle('b-on', k === n));
  const sq = mk.cells.filter(v => v && v !== WHITE).length, p = mkPuzzle(), d = info(p);
  $('mInfo').textContent = sq ? `${sq} squares · ${d.order.length} color${d.order.length === 1 ? '' : 's'} · ${d.steps.length} clues` : 'Tap the squares to draw a secret picture!';
}
function mkPush() { mk.undo.push({ n: mk.n, cells: mk.cells.slice() }); if (mk.undo.length > 40) mk.undo.shift(); }
function mkPaint(r, c) { const i = r * mk.n + c; if (mk.cells[i] !== mk.color) { mk.cells[i] = mk.color; renderMaker(); } }
function mkSize(n) { if (n === mk.n) return; mkPush(); mk.n = n; mk.cells = new Array(n * n).fill(0); mk.cursor = { r: 0, c: 0 }; renderMaker(); }
function mkUndo() { const u = mk.undo.pop(); if (u) { mk.n = u.n; mk.cells = u.cells; renderMaker(); } }
function mkClear() { if (mk.cells.some(v => v)) { mkPush(); mk.cells = new Array(mk.n * mk.n).fill(0); renderMaker(); } }
const mkReady = () => { if (mk.cells.filter(v => v).length < 3) { toast('🎨 Color at least 3 squares first!'); return false; } return true; };
function mkPrint() { if (!mkReady()) return; const p = mkPuzzle(); printPages(puzzlePages(p, state.mine.length + PUZZLES.length + 1).concat(answerPages([{ p, num: state.mine.length + PUZZLES.length + 1 }]))); toast('🖨️ Printing your clue sheet!'); }
function mkSave() {
  if (!mkReady()) return false;
  state.mine.push({ id: 'mine' + Date.now().toString(36) + state.mine.length, by: mk.by, rows: mkRows() });
  if (state.mine.length > 20) state.mine.shift();
  saveState(); rebuildList(); sndWin(); toast('💾 Saved! It is in 🎨 My Secret Pictures!'); return true;
}
function mkPointer(e, down) {
  if (down) { mk.painting = true; mkPush(); audio(); }
  if (!mk.painting) return;
  const q = svgPoint($('mBoard'), e, boardSize(mk.n, 'color')), hit = cellAt({ kind: 'color', rows: { length: mk.n } }, q.x, q.y);
  if (hit) { mk.showCursor = false; mkPaint(hit.r, hit.c); }
  if (e.preventDefault) e.preventDefault();
}
function openMaker() { setView('maker'); renderMaker(); }
// ---------- ⌨️ keys ----------
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let n = 0; const top = th[0].offsetTop; th.forEach(t => { if (t.offsetTop === top) n++; }); return Math.max(1, n);
}
const ARROW = { ArrowUp: [-1, 0], ArrowDown: [1, 0], ArrowLeft: [0, -1], ArrowRight: [0, 1] };
function onKey(e) {
  const k = e.key;
  if (boxOpen()) { if (k === 'Escape') { closeBox(); e.preventDefault(); } return; }
  if (view === 'gallery') {
    const n = LIST.length, cols = gridCols();
    if (k === 'ArrowRight') sel = Math.min(n - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(n - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openPuzzle(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printPages(pagesFor(LIST[sel], true)); return; }
    else if (k === 'Escape') { leave(); return; }
    else return;
    e.preventDefault(); markSel();
  } else if (view === 'view') {
    const n = cur ? info(cur).n : 8;
    if (ARROW[k]) { showCursor = true; cursor = { r: Math.max(0, Math.min(n - 1, cursor.r + ARROW[k][0])), c: Math.max(0, Math.min(n - 1, cursor.c + ARROW[k][1])) }; renderPlay(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { tapAt(cursor.r, cursor.c); showCursor = true; renderPlay(); e.preventDefault(); }
    else if (k === 'f' || k === 'F') findIt();
    else if (k === 'p' || k === 'P') printPuzzle(false);
    else if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
  } else if (view === 'maker') {
    if (ARROW[k]) { mk.showCursor = true; mk.cursor = { r: Math.max(0, Math.min(mk.n - 1, mk.cursor.r + ARROW[k][0])), c: Math.max(0, Math.min(mk.n - 1, mk.cursor.c + ARROW[k][1])) }; renderMaker(); e.preventDefault(); }
    else if (k === 'Enter' || k === ' ') { mkPush(); mk.showCursor = true; mk.cells[mk.cursor.r * mk.n + mk.cursor.c] = -1; mkPaint(mk.cursor.r, mk.cursor.c); e.preventDefault(); }
    else if (k === 'p' || k === 'P') mkPrint();
    else if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
  }
}
// ---------- 🚀 start ----------
function init() {
  loadState(); rebuildList(); renderGallery();
  const tap = (id, fn) => $(id).addEventListener('click', e => { audio(); fn(e); try { e.currentTarget.blur(); } catch (_) {} });
  tap('bMake', openMaker); tap('bBook', bookBox); tap('bCert', certBox); tap('bLeave', leave);
  tap('bFind', findIt); tap('bHelp', doOne); tap('bPrint', () => printPuzzle(false)); tap('bPrintAns', () => printPuzzle(true));
  tap('bRestart', restart); tap('bBack', backToGallery);
  tap('bDel', () => openBox(`<h2>🗑️ Delete this picture?</h2><button class="btn b-pink" data-act="delYes">Yes, delete it</button><button class="btn b-back" data-act="close">No, keep it!</button>`));
  tap('mS8', () => mkSize(8)); tap('mS12', () => mkSize(12)); tap('mS16', () => mkSize(16));
  tap('mPrint', mkPrint); tap('mSave', mkSave); tap('mUndo', mkUndo); tap('mClear', mkClear); tap('mBack', backToGallery);
  $('crayons').addEventListener('click', e => { const t = e.target.closest('[data-v]'); if (t) { mk.color = +t.dataset.v; blip(500 + mk.color * 20, 0, .1); renderMaker(); } });
  $('mNames').addEventListener('click', e => { const t = e.target.closest('[data-v]'); if (t) { mk.by = t.dataset.v; renderMaker(); } });
  $('board').addEventListener('click', boardTap);
  const mb = $('mBoard');
  mb.addEventListener('pointerdown', e => mkPointer(e, true));
  mb.addEventListener('pointermove', e => mkPointer(e, false));
  window.addEventListener('pointerup', () => { mk.painting = false; });
  window.addEventListener('pointercancel', () => { mk.painting = false; });
  $('box').addEventListener('click', e => {
    const t = e.target.closest('[data-act]');
    if (t) { audio(); boxAct(t.dataset.act, t.dataset.v); } else if (e.target === $('box')) closeBox();
  });
  window.addEventListener('afterprint', clearPrint);
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
