<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>⏰ The Game Factory Time Machine</title>
<script src="touchpad.js?v=2"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: linear-gradient(#7c4dff, #40c4ff); color: #222; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; z-index: 2; }
  .screen.on { display: flex; }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 1; display: none; pointer-events: none; }
  #fx.on { display: block; }
  #fx.top { z-index: 60; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #222; border-radius: 16px;
    padding: 8px 12px; cursor: pointer; box-shadow: 0 5px 0 #222; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #222; }
  .btn.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn:disabled { opacity: .4; }
  .hide { display: none !important; }
  .b-go { background: #69f0ae; } .b-gold { background: linear-gradient(#fff59d, #ffc400); }
  .b-blue { background: #9be3ff; } .b-pink { background: #ffc2d6; } .b-purple { background: #d1b3ff; }
  .b-orange { background: #ffcc80; } .b-red { background: #ff8a80; } .b-yel { background: #ffe066; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .glowy { animation: glowy 1s ease-in-out infinite alternate; }
  @keyframes glowy { from { box-shadow: 0 5px 0 #222, 0 0 0 0 #fff59d; } to { box-shadow: 0 5px 0 #222, 0 0 0 10px rgba(255,245,157,.7); } }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 54px); color: #fff59d; -webkit-text-stroke: 2.5px #222;
    text-shadow: 4px 4px 0 #e91e63; letter-spacing: 1px; text-align: center; line-height: 1.05; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; justify-content: center; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .safe { background: #fffbe0; border: 4px solid #222; border-radius: 16px; padding: 6px 10px; font-size: clamp(14px, 1.6vw, 17px); font-weight: bold; text-align: center; }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #222; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 80; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-12px); } }
  @keyframes pop { 0% { transform: scale(.2) rotate(-10deg); } 70% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1); } }
  /* ---------- 🎁 gift ---------- */
  #gift { flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle at 50% 45%, #69f0ae, #2979ff 60%, #1a1446); }
  #giftBox { width: min(48vh, 70vw); cursor: pointer; animation: wobble 1.4s ease-in-out infinite; }
  .ov { position: fixed; inset: 0; background: rgba(20, 0, 40, .8); display: none; z-index: 55; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  /* ---------- 🖨️ printables (same setup as the Craft Room) ---------- */
  #gallery { flex-direction: column; overflow: hidden; background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #b2ebf2 36px 72px); }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #222; text-shadow: 3px 3px 0 #222; }
  .sec .btn { font-size: 17px; min-height: 46px; padding: 4px 12px; }
  .thumb { background: #fff; border: 5px solid #222; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #e91e63; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  #view { flex-direction: row; gap: 10px; padding: 10px; background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #b2ebf2 36px 72px); }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #222; border-radius: 10px; box-shadow: 0 8px 0 #e91e63; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #222; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #222; border-radius: 14px; padding: 6px 8px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #222; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #222; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #222; }
  #printAll { display: none; }
  /* ---------- big overlay ---------- */
  #big { position: fixed; inset: 0; z-index: 58; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; }
  #big.on { display: flex; }
  #big.count { background: rgba(26, 20, 70, .95); }
  #big.calm { background: rgba(0, 120, 90, .95); }
  #bigEmo { font-size: clamp(60px, 14vh, 140px); line-height: 1; animation: bob .4s infinite alternate; }
  #bigTxt { font-size: clamp(34px, 6.4vw, 84px); color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #000; font-weight: bold; line-height: 1.05; max-width: 1200px; }
  #bigTxt.num { font-size: clamp(120px, 34vh, 300px); animation: pop .5s ease-out; }
  #bigSub { font-size: clamp(20px, 3vw, 34px); color: #fff; font-weight: bold; -webkit-text-stroke: 1.2px #000; }
  #big.warp { background: rgba(10, 0, 40, .55); }
  #big.crys { background: radial-gradient(circle, rgba(120,60,255,.92), rgba(10,0,40,.96)); }
  #big.glitch { background: repeating-linear-gradient(0deg, rgba(255,0,140,.9) 0 8px, rgba(0,230,255,.9) 8px 16px); }
  #bigCrys { width: min(34vh, 260px); display: none; }
  #big.crys #bigCrys { display: block; animation: crysSpin 2.4s ease-in-out infinite; }
  @keyframes crysSpin { 0% { transform: rotateY(0) scale(1); } 50% { transform: rotateY(180deg) scale(1.12); } 100% { transform: rotateY(360deg) scale(1); } }
  #bigCrys svg { width: 100%; height: auto; display: block; }
  /* ---------- 🎁 gift ---------- */
  #gift { flex-direction: column; align-items: center; justify-content: center; gap: 10px; overflow: hidden;
    background: radial-gradient(circle at 50% 45%, #b388ff, #3d1a8f 55%, #0d0630); }
  #giftBox { width: min(50vh, 70vw); cursor: pointer; animation: wobble 1.4s ease-in-out infinite; position: relative; z-index: 2; }
  #giftBox svg { width: 100%; height: auto; display: block; overflow: visible; }
  #giftBox.open { animation: none; }
  #giftBox .lid { transition: transform 1s cubic-bezier(.3,1.6,.5,1); }
  #giftBox.open .lid { transform: translate(-30px, -260px) rotate(-38deg); }
  #giftBox .rib { transition: opacity .3s; } #giftBox.open .rib { opacity: 0; }
  #giftBox .wrapL, #giftBox .wrapR { transition: transform 1.1s cubic-bezier(.5,0,.3,1) .15s, opacity 1s .4s; }
  #giftBox.open .wrapL { transform: translate(-260px, 120px) rotate(-50deg); opacity: 0; }
  #giftBox.open .wrapR { transform: translate(260px, 120px) rotate(50deg); opacity: 0; }
  #giftBox.open #gPop { opacity: 1 !important; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-5deg) scale(1.03); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } }
  #giftBox.shake { animation: shake .12s linear infinite; }
  @keyframes shake { 0% { transform: translate(0,0) rotate(0); } 25% { transform: translate(-6px,3px) rotate(-3deg); } 50% { transform: translate(5px,-4px) rotate(3deg); } 75% { transform: translate(-3px,-2px) rotate(-1deg); } }
  #giftMsg { color: #fff; font-size: clamp(20px, 3vw, 30px); font-weight: bold; text-align: center; text-shadow: 2px 2px 0 #000; padding: 0 12px; position: relative; z-index: 2; }
  #bUnwrap { position: relative; z-index: 2; }
  .stars { position: absolute; inset: 0; background-image: radial-gradient(2px 2px at 20% 30%, #fff, transparent), radial-gradient(2px 2px at 70% 20%, #fff, transparent),
    radial-gradient(3px 3px at 85% 70%, #fff59d, transparent), radial-gradient(2px 2px at 35% 80%, #fff, transparent), radial-gradient(2px 2px at 55% 55%, #b3e5fc, transparent),
    radial-gradient(3px 3px at 10% 65%, #fff, transparent), radial-gradient(2px 2px at 92% 40%, #fff, transparent); animation: twinkle 2s ease-in-out infinite alternate; pointer-events: none; }
  @keyframes twinkle { from { opacity: .4; } to { opacity: 1; } }
  /* ---------- ⏰ the opening: clock, sparks, time tunnel ---------- */
  #intro { overflow: hidden; background: #0d0630; }
  .tun { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #iClock { position: absolute; left: 50%; top: 46%; width: min(62vh, 70vw); transform: translate(-50%, -50%) scale(.05); opacity: 0; z-index: 4;
    transition: transform 1s cubic-bezier(.3,1.6,.5,1), opacity .4s; }
  #iClock svg { width: 100%; height: auto; display: block; }
  #intro.s1 #iClock { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  #intro.s2 #iClock { animation: clockShake .1s linear infinite; }
  @keyframes clockShake { 0% { margin-left: 0; } 25% { margin-left: -5px; margin-top: 3px; } 50% { margin-left: 5px; margin-top: -3px; } 75% { margin-left: -2px; } }
  #intro.s3 #iClock { transition: transform 1.1s cubic-bezier(.6,0,.9,.4), opacity 1.1s; transform: translate(-50%, -50%) scale(.02) rotate(720deg); opacity: 0; animation: none; }
  #iFlash, #wFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; z-index: 9; }
  .flash { animation: flash .9s ease-out; }
  @keyframes flash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
  #iRobo { position: absolute; left: 50%; bottom: 13%; width: min(46vh, 40vw); transform: translate(-50%, 140%) rotate(-20deg); z-index: 6; transition: transform 1s cubic-bezier(.3,1.5,.5,1); }
  #iRobo svg { width: 100%; height: auto; display: block; }
  #intro.s4 #iRobo { transform: translate(-50%, 0) rotate(0); }
  #intro.s4 #iRobo svg { animation: bob .6s ease-in-out infinite alternate; }
  #intro.s5 #iRobo { transform: translate(-95%, 0) rotate(-4deg) scale(.82); }
  #iTitle { position: absolute; left: 0; right: 0; top: 7%; text-align: center; z-index: 7; opacity: 0; transform: scale(.2);
    transition: transform .8s cubic-bezier(.3,1.6,.5,1), opacity .4s; pointer-events: none; }
  #iTitle.on { opacity: 1; transform: scale(1); }
  #iTitle h1 { font-size: clamp(36px, 7vw, 96px); }
  #iTitle div { font-size: clamp(20px, 3.2vw, 40px); color: #fff; -webkit-text-stroke: 1.5px #222; font-weight: bold; text-shadow: 3px 3px 0 #222; }
  #iBtns { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; z-index: 10; }
  #iCap { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); width: min(92vw, 900px); text-align: center; z-index: 8;
    background: rgba(255,255,255,.95); border: 5px solid #222; border-radius: 20px; padding: 6px 12px; font-size: clamp(18px, 2.6vw, 30px); font-weight: bold; }
  #iCap:empty { display: none; }
  /* ---------- 🕹️ time machine dashboard ---------- */
  #hub { flex-direction: row; gap: 12px; padding: 10px; background: radial-gradient(circle at 30% 40%, #4a2fb0, #170b4a 70%); overflow: hidden; }
  #hubL { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: center; position: relative; z-index: 1; }
  #hubArt { flex: 1; min-height: 0; width: 100%; position: relative; }
  #hubArt svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #hubR { width: min(40vw, 440px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; position: relative; z-index: 1; }
  #hubR .btn { font-size: clamp(16px, 2vw, 22px); }
  #eraBtns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #eraBtns .btn { font-size: clamp(14px, 1.65vw, 18px); min-height: 52px; padding: 3px 6px; line-height: 1.1; }
  #eraBtns .btn.got { background: #b9f6ca; }
  #eraBtns .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; transform: scale(1.04); }
  #bTravel { min-height: 80px; font-size: clamp(24px, 3.2vw, 36px) !important; background: radial-gradient(circle at 40% 30%, #fff59d, #ff9100 60%, #ff3d00); }
  #bHome { min-height: 70px; font-size: clamp(20px, 2.6vw, 30px) !important; }
  .dial { cursor: pointer; }
  .ptr { transition: transform 1s cubic-bezier(.3,1.5,.5,1); }
  .blink { animation: blink 1s steps(2) infinite; } .blink2 { animation: blink 1.4s steps(2) infinite .5s; }
  @keyframes blink { 0% { opacity: 1; } 100% { opacity: .25; } }
  .hubLbl { color: #fff; font-weight: bold; text-align: center; font-size: clamp(14px, 1.7vw, 18px); -webkit-text-stroke: .6px #000; }
  /* ---------- 🙋 crew ---------- */
  #crew { flex-direction: column; gap: 10px; padding: 12px; background: linear-gradient(#7c4dff, #40c4ff); overflow-y: auto; -webkit-overflow-scrolling: touch; align-items: center; justify-content: center; }
  .panel { background: #fff; border: 5px solid #222; border-radius: 20px; padding: 10px 14px; display: flex; flex-direction: column; gap: 8px; width: min(96vw, 1000px); }
  .panel h3 { margin: 0; font-size: clamp(18px, 2.4vw, 26px); text-align: center; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .names .btn { font-size: clamp(18px, 2.2vw, 24px); min-height: 62px; min-width: 130px; }
  .names .btn.on { background: #69f0ae; border-color: #00796b; box-shadow: 0 5px 0 #00796b; }
  #crewTxt { font-size: clamp(16px, 2vw, 22px); font-weight: bold; text-align: center; }
  /* ---------- 🌀 warp ---------- */
  #warp { overflow: hidden; background: #0d0630; }
  #wSpin { position: absolute; inset: -30%; }
  #warp.spin #wSpin { animation: wspin 2.4s cubic-bezier(.5,0,.5,1) infinite; }
  @keyframes wspin { 0% { transform: rotate(0) scale(1); } 50% { transform: rotate(180deg) scale(1.25); } 100% { transform: rotate(360deg) scale(1); } }
  #warp.spin #wRobo { animation: wrobo .5s ease-in-out infinite alternate; }
  @keyframes wrobo { from { transform: translate(-50%, -50%) rotate(-14deg) scale(.95); } to { transform: translate(-50%, -50%) rotate(14deg) scale(1.08); } }
  #wRobo { position: absolute; left: 50%; top: 52%; width: min(34vh, 30vw); transform: translate(-50%, -50%); z-index: 3; }
  #wRobo svg { width: 100%; height: auto; display: block; }
  #wTxt { position: absolute; left: 0; right: 0; top: 6%; text-align: center; z-index: 4; font-size: clamp(30px, 5.4vw, 70px); font-weight: bold; color: #fff59d; -webkit-text-stroke: 2.5px #000; text-shadow: 4px 4px 0 #e91e63; line-height: 1.05; padding: 0 10px; }
  #wNum { position: absolute; left: 0; right: 0; bottom: 6%; text-align: center; z-index: 4; font-size: clamp(30px, 5vw, 60px); font-weight: bold; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 3px 3px 0 #000; }
  #wNum.num { font-size: clamp(110px, 30vh, 260px); animation: pop .5s ease-out; line-height: 1; }
  #wSkip { position: absolute; right: 12px; top: 12px; z-index: 10; }
  /* ---------- 🌍 an era ---------- */
  #era { flex-direction: row; gap: 10px; padding: 10px; background: #222; }
  #eraL { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #eraArt { flex: 1; min-height: 0; position: relative; border: 5px solid #222; border-radius: 20px; overflow: hidden; background: #fff; }
  #eraArt svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #eraName { position: absolute; left: 0; right: 0; top: 6px; text-align: center; z-index: 2; pointer-events: none; }
  #eraName h1 { font-size: clamp(26px, 4vw, 52px); }
  #eraName div { display: inline-block; margin-top: 4px; background: #1d2836; color: #69f0ae; border: 3px solid #000; border-radius: 10px; padding: 1px 12px; font-size: clamp(16px, 2.2vw, 26px); font-family: "Courier New", monospace; font-weight: bold; }
  #fact { background: #fffbe0; border: 5px solid #222; border-radius: 18px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
  #factTxt { flex: 1; font-size: clamp(15px, 1.9vw, 21px); font-weight: bold; line-height: 1.2; }
  #fact .btn { font-size: clamp(14px, 1.6vw, 18px); min-height: 50px; padding: 3px 8px; flex-shrink: 0; }
  #eraR { width: min(40vw, 440px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #eraHead { background: #fff; border: 4px solid #222; border-radius: 16px; padding: 6px 10px; font-size: clamp(16px, 2vw, 22px); font-weight: bold; text-align: center; }
  .chal { text-align: left; display: flex; align-items: center; gap: 10px; font-size: clamp(16px, 2vw, 22px) !important; min-height: 76px !important; line-height: 1.12; }
  .chal .ce { font-size: clamp(30px, 4vw, 44px); flex-shrink: 0; }
  .chal small { display: block; font-size: .75em; color: #444; }
  .chal.done { background: #b9f6ca; }
  .chal.done::after { content: '✅'; margin-left: auto; font-size: 1.4em; }
  #eraCrys { display: flex; align-items: center; gap: 10px; justify-content: center; background: rgba(255,255,255,.95); border: 4px solid #222; border-radius: 16px; padding: 4px 10px; font-weight: bold; font-size: clamp(15px, 1.8vw, 20px); }
  #eraCrys svg { width: 54px; height: 54px; flex-shrink: 0; }
  .sway { animation: sway 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .floaty { animation: floaty 2.6s ease-in-out infinite alternate; }
  @keyframes floaty { from { transform: translateY(0); } to { transform: translateY(-14px); } }
  .drift { animation: drift 9s linear infinite; }
  @keyframes drift { from { transform: translateX(-120px); } to { transform: translateX(900px); } }
  .rock { animation: rock 2.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 90%; }
  @keyframes rock { from { transform: rotate(-4deg); } to { transform: rotate(4deg); } }
  .puff { animation: puff 2s ease-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes puff { 0% { transform: translateY(0) scale(.6); opacity: .9; } 100% { transform: translateY(-50px) scale(1.4); opacity: 0; } }
  .twk { animation: blink 1.2s ease-in-out infinite alternate; }
  /* ---------- 🎭 challenge card ---------- */
  #chCard { flex-direction: row; align-items: stretch; animation: cardIn .6s cubic-bezier(.3,1.5,.5,1); }
  @keyframes cardIn { 0% { transform: rotateY(90deg) scale(.4); } 100% { transform: rotateY(0) scale(1); } }
  #chArt { width: min(30vw, 290px); flex-shrink: 0; border: 5px solid #222; border-radius: 20px; position: relative; min-height: 180px; overflow: hidden; }
  #chArt svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #chArt.go svg { animation: boogie .35s ease-in-out infinite alternate; }
  @keyframes boogie { from { transform: rotate(-6deg) translateY(0); } to { transform: rotate(6deg) translateY(-8px); } }
  #chR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  #chTitle { margin: 0; text-align: center; font-size: clamp(24px, 3.6vw, 44px); color: #fff59d; -webkit-text-stroke: 2px #222; text-shadow: 3px 3px 0 #e91e63; line-height: 1.05; }
  #chRole { text-align: center; font-size: clamp(16px, 2vw, 22px); font-weight: bold; color: #6a1b9a; }
