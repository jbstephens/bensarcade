<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Robo Jump Fold-Up Shop</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0b1026; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #f4f6ff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.6); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #e8ecfa; border-bottom: 2px solid #c9d1ee; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #555; white-space: nowrap; overflow: hidden; }
  #url b { color: #5b2bbf; }
  /* store header: Moon Base night sky to Crystal Planet purple */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #0b1026, #2b3a7a 45%, #4a1f6b); color: #fff; flex: none; min-height: 100px; border-bottom: 5px solid #7df9ff; position: relative; }
  #logo { line-height: 1; flex: none; }
  #logo .big { font-size: 27px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 3px 0 #000, 0 0 10px #7df9ff; }
  #logo .big i { color: #7df9ff; font-style: normal; }
  #logo .small { font-size: 15px; color: #ffd740; margin-top: 4px; font-weight: bold; }
  #helper { width: 110px; height: 104px; flex: none; }
  #speech { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #who { font-size: 15px; font-weight: 900; color: #7df9ff; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble { position: relative; background: #fff; color: #1a1446; border-radius: 18px; padding: 8px 14px; font-size: 18px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #1a1446; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #7df9ff; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #fff; color: #1a1446; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #ffb300; border: 3px solid #1a1446; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #ffd740; color: #1a1446; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #e8ecfa; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #1a1446; box-shadow: 0 4px 0 #b3bde6; }
  #nav button.on { background: #5b2bbf; color: #fff; box-shadow: 0 4px 0 #2e1470; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff4081; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #5b2bbf; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #ffd740; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 14px 30px 14px; background-color: #f4f6ff;
    background-image: linear-gradient(180deg, #dfe4ff 0, #f4f6ff 420px); background-attachment: local; }
  .idea { display: inline-block; font-size: 17px; font-weight: 900; color: #1a1446; background: #fff3b0; border: 3px dashed #ffb300; border-radius: 14px; padding: 6px 12px; margin: 0 0 8px; }
  /* departments (one per planet): one row that scrolls sideways */
  .cats { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; }
  .catb { flex: none; font-size: 17px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 12px; background: #fff; color: #1a1446; box-shadow: 0 4px 0 #b3bde6; white-space: nowrap; }

  .catb.secret { background: linear-gradient(90deg, #ffd740, #ffa000); color: #3d2e00; box-shadow: 0 4px 0 #a67c00; }

  .dept canvas { width: 84px; height: 66px; flex: none; }
  .dept b { font-size: 22px; display: block; } .dept small { font-size: 16px; color: #fff; opacity: .92; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(26,20,70,.15); display: flex; flex-direction: column; position: relative; border: 3px solid #1a1446; }

  .card.sel { outline: 5px solid #5b2bbf; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #e8ecfa; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #1a1446; line-height: 1.1; }
  .card .from { font-size: 13px; font-weight: bold; color: #5b2bbf; }
  .card .blurb { font-size: 15px; color: #4a4e69; }
  .card .price { font-size: 21px; font-weight: 900; color: #1e7f4f; margin: 4px 0; }
  .card .price s { color: #aaa; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff4081; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-5deg); }
  .tag.gold { background: #ffd740; color: #1a1446; }
  .tag.new { background: #5b2bbf; }

  .rev .who { font-weight: bold; color: #5b2bbf; }
  .stars { color: #f2b544; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #2ec27e; color: #fff; box-shadow: 0 4px 0 #1e7f4f; }
  .add.in { background: #d5f5e3; color: #1e7f4f; box-shadow: 0 4px 0 #9fdcbc; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #fff3b0; box-shadow: 0 4px 0 #f2c94c; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(26,20,70,.13); border: 2px solid #1a1446; flex-wrap: wrap; }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #1a1446; min-width: 160px; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #1e7f4f; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #ff6d00; box-shadow: 0 5px 0 #bf360c; }
  .bigbtn.green { background: #2ec27e; box-shadow: 0 5px 0 #1e7f4f; }
  .bigbtn.blue { background: #5b2bbf; box-shadow: 0 5px 0 #2e1470; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .namebtn { font-size: 19px; font-weight: 900; border: 3px dashed #5b2bbf; border-radius: 14px; padding: 10px 14px; background: #fff3b0; color: #1a1446; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #fdecef; color: #b0526b; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #1a1446; border: 2px solid #1a1446; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #ff4081; border-radius: 14px; padding: 9px 14px; background: #fff; color: #c2185b; }
  .gift.on { background: #ff4081; color: #fff; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; background: #ffe0ec; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 19px; font-weight: bold; color: #c2185b; }
  .names button { font-size: 18px; font-weight: bold; border: 0; border-radius: 12px; padding: 8px 12px; background: #fff; color: #1a1446; box-shadow: 0 3px 0 #f3b6cf; }
  .names button.on { background: #ff4081; color: #fff; box-shadow: 0 3px 0 #c2185b; }
  .empty { text-align: center; font-size: 26px; color: #1a1446; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #1a1446; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(5,6,15,.95); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(11,16,38,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; border: 4px solid #1a1446; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8ecfa; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8ecfa; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #printBox .pbPrint { background: #2ec27e; } #printBox .pbBack { background: #5b2bbf; }
  #printBox .pbTip { font-size: 20px; color: #1a1446; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 🚀 THE ROBO JUMP FOLD-UP SHOP: Ben's idea! A 3D fold-up store run by the bosses of the FIRST Robo Jump (platformer.html).
// Each planet from the game is a department, run by that level's boss (now friendly shopkeepers). Moon Base has no shop boss, so
// Robo and Dusty run it. Buy printable PAPER things: 3D fold-ups with real nets, two-page PLAY SETS, finger puppets, masks and more.
// Save: localStorage.rjFoldShop = { coins, cart:[keys], gift, giftTo, orders:[{k, gift, to, n, name}], printed, n, galaxy }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'rjFoldShop';
let S = { coins: 1000, cart: [], gift: false, giftTo: 'Mom', orders: [], printed: 0, n: 0, galaxy: false };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.coins >= 0)) S.coins = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, frame = 40;
const FONT = '"Trebuchet MS", Arial, sans-serif';
function rrPath(x, y, w, h, r) {                       // rounded box path; r can be one number or [top-left, top-right, bottom-right, bottom-left]
  const R = Array.isArray(r) ? r : [r, r, r, r], m = Math.min(w / 2, h / 2), [a, b, c, d] = R.map(v => Math.max(0, Math.min(v, m)));
  ctx.beginPath(); ctx.moveTo(x + a, y); ctx.arcTo(x + w, y, x + w, y + h, b); ctx.arcTo(x + w, y + h, x, y + h, c); ctx.arcTo(x, y + h, x, y, d); ctx.arcTo(x, y, x + w, y, a); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { rrPath(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fillStyle = fill; ctx.fill(); }
function rr(x, y, w, h, r, fill, stroke, lw) { rrPath(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function circ(x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function circle(x, y, r, fill) { circ(x, y, r, fill); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function pp(pts, fill, stroke, lw) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.lineJoin = 'round'; ctx.stroke(); } }
function heart(x, y, s, fill = '#ff5c8a') { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.9); ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.6, y - s * 1.3, x, y - s * 0.45); ctx.bezierCurveTo(x + s * 0.6, y - s * 1.3, x + s * 1.6, y - s * 0.2, x, y + s * 0.9); ctx.fill(); }
function txt(s, x, y, size, color = '#333', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#333', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function starP(x, y, r, fill, stroke, rot = 0) { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * q, y + Math.sin(a) * q]); } pp(p, fill, stroke, 2); }
function sparkle(x, y, r, col) { pp([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
function snowflake(x, y, r, col = '#fff', lw = 2.5) {    // a drawn snowflake (no emoji)
  ctx.save(); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i < 6; i++) { const a = i * Math.PI / 3, c = Math.cos(a), s = Math.sin(a); ctx.moveTo(x, y); ctx.lineTo(x + c * r, y + s * r);
    const bx = x + c * r * 0.6, by = y + s * r * 0.6; for (const d of [-1, 1]) { const a2 = a + d * 0.7; ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a2) * r * 0.32, by + Math.sin(a2) * r * 0.32); } }
  ctx.stroke(); ctx.restore();
}
function dashLine(x1, y1, x2, y2, col, lw, dash) { ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
const CUTC = '#8a8a8a', FOLDC = '#1e88e5';
const cutL = (x1, y1, x2, y2) => dashLine(x1, y1, x2, y2, CUTC, 2.2, [10, 7]);
const foldL = (x1, y1, x2, y2) => { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); dashLine(x1, y1, x2, y2, FOLDC, 2.6, [4, 6]); };
function cutPoly(pts) { ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); ctx.stroke(); ctx.restore(); }
function cutBox(x, y, w, h, r = 0) { ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; if (r) rrPath(x, y, w, h, r); else { ctx.beginPath(); ctx.rect(x, y, w, h); } ctx.stroke(); ctx.restore(); }
function cutCirc(x, y, r) { ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
function cutArc(x, y, r, a0, a1) { ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, r, a0, a1); ctx.stroke(); ctx.restore(); }
function cutEll(x, y, rx, ry) { ctx.save(); ctx.setLineDash([8, 6]); ctx.strokeStyle = '#555'; ctx.lineWidth = 2.6; ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, 7); ctx.stroke(); ctx.restore(); }
function scissors(x, y, s = 1) {                      // little scissors picture (no emoji)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = '#555'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-9, -7, 6, 0, 7); ctx.moveTo(-3, 7); ctx.arc(-9, 7, 6, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(16, 6); ctx.moveTo(-4, 4); ctx.lineTo(16, -6); ctx.stroke(); ctx.restore();
}

const CH = {

  dusty:  { n: 'Dusty', w: 32, h: 44, top: 0 },
  gloop:  { n: 'King Gloop', boss: ['blob', ''], w: 94, h: 80, top: 24 },

// ---------- 📐 FOLD-UP NETS. A net = { faces:[{pts, fill, art}], folds:[[a, b]], tabs:[{a, b, from, meets:[c, d], kind}], checks:[[what, len1, len2]] }
// Every tab says which edge it MEETS when the model is folded; checkNet() makes sure the two edges are the same length.
const dist = (a, b) => Math.hypot(a[0] - b[0], a[1] - b[1]);
const cen = pts => [pts.reduce((s, p) => s + p[0], 0) / pts.length, pts.reduce((s, p) => s + p[1], 0) / pts.length];

function tabPts(t) {                                   // the tab's 4 corners, sticking out AWAY from the face it hangs on
  const [a, b] = [t.a, t.b], L = dist(a, b), ux = (b[0] - a[0]) / L, uy = (b[1] - a[1]) / L; let nx = -uy, ny = ux;
  const m = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]; if ((m[0] + nx - t.from[0]) ** 2 + (m[1] + ny - t.from[1]) ** 2 < (m[0] - nx - t.from[0]) ** 2 + (m[1] - ny - t.from[1]) ** 2) { nx = -nx; ny = -ny; }
  const d = Math.min(t.depth, L * 0.45), ins = Math.min(d * 0.8, L * 0.25);
  return [a, b, [b[0] + nx * d - ux * ins, b[1] + ny * d - uy * ins], [a[0] + nx * d + ux * ins, a[1] + ny * d + uy * ins]];
}
function drawNet(net) {
  for (const t of net.tabs) { const q = tabPts(t); tapeTab(q, dist(t.a, t.b) > 46 ? t.kind : ''); ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.moveTo(q[1][0], q[1][1]); ctx.lineTo(q[2][0], q[2][1]); ctx.lineTo(q[3][0], q[3][1]); ctx.lineTo(q[0][0], q[0][1]); ctx.stroke(); ctx.restore(); }

  return n;
}

<script>
