<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>❓ Mystery Game 7: King Gloop's Crown Tower</title>
<script>TOUCHPAD = { south: [' ', 'DROP'] };</script><script src="touchpad.js?v=11"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #120a2a; display: flex; align-items: center; justify-content: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 16px; touch-action: none; }
</style>

<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
// ===== ❓ MYSTERY GAME shared bits: drawing helpers, soft sounds, gentle music, screens (title / level / win) =====
const C = document.getElementById('c'), W = 960, H = 540;
let ctx = C.getContext('2d');
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
function rrect(x, y, w, h, r) {
  ctx.beginPath(); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
const el = ellipse;
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35); ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function glow(x, y, r, col, a = 1) {
  r = Math.max(1, r); const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
// big friendly words with a dark outline (same style as Robo Jump 1)
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = size / 5; ctx.strokeStyle = '#1b1b2f'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(str, x, y); }
function bubble(str, x, y, size = 22) {               // a white speech bubble pointing down at (x, y)
  ctx.font = `bold ${size}px "Comic Sans MS", "Chalkboard SE", sans-serif`;
  const w = ctx.measureText(str).width + 30, h = size + 22, bx = clamp(x - w / 2, 8, W - w - 8), by = y - h - 14;
  roundRect(bx, by, w, h, 14, '#fff');
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x - 10, by + h - 1); ctx.lineTo(x, y); ctx.lineTo(x + 10, by + h - 1); ctx.fill();
  ctx.fillStyle = '#3a2a5a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, bx + w / 2, by + h / 2 + 1);
}
// ---------- 🔈 SOFT sounds (master volume 0.15, fades in gently) ----------
let actx = null, master = null, musicBus = null, musicOn = true;
function audio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.setValueAtTime(0.0001, actx.currentTime); master.gain.linearRampToValueAtTime(0.15, actx.currentTime + 1.2);
      master.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
    }
    if (actx.state !== 'running') actx.resume();
  } catch (_) {}
  return actx;
}
function tone(f, d = 0.12, v = 0.05, when = 0, type = 'sine', slide = 0, bus) {
  if (!actx || actx.state !== 'running') return;
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.linearRampToValueAtTime(Math.max(40, f + slide), t + d);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(bus || master); o.start(t); o.stop(t + d + 0.05);
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
const SFX = {
  tap() { tone(700, 0.08, 0.05, 0, 'triangle'); },
  good() { tone(784, 0.12, 0.06, 0, 'triangle'); tone(1175, 0.16, 0.05, 0.08, 'triangle'); },
  oops() { tone(330, 0.25, 0.06, 0, 'sine', -90); },
  pop() { tone(500, 0.1, 0.06, 0, 'sine', 300); },
  thud() { tone(160, 0.18, 0.08, 0, 'sine', -40); },
  level() { [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.22, 0.05, i * 0.12, 'triangle')); },
  win() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, 0.25, 0.05, i * 0.13, 'triangle')); },
  note(m) { tone(mtof(m), 0.5, 0.06, 0, 'sine'); tone(mtof(m + 12), 0.3, 0.015, 0, 'triangle'); },
};
// ---------- 🎵 gentle music loop: TUNE = { bpm, chords: [[root, third, fifth] per bar], melody: [MIDI per 8th note, 0 = rest] } ----------
let musStep = 0, musNext = 0;
function musicTick() {
  if (!actx || actx.state !== 'running' || typeof TUNE === 'undefined') return;
  const e8 = 30 / TUNE.bpm, now = actx.currentTime;
  if (musNext < now) musNext = now + 0.08;
  while (musNext < now + 0.35) {
    const i = musStep % TUNE.melody.length, m = TUNE.melody[i], ch = TUNE.chords[Math.floor(i / 8) % TUNE.chords.length];
    if (m) tone(mtof(m), e8 * 1.6, 0.05, musNext - now, 'triangle', 0, musicBus);
    if (i % 4 === 0) tone(mtof(ch[0] - 24), e8 * 3.6, 0.07, musNext - now, 'sine', 0, musicBus);
    if (i % 2 === 1) tone(mtof(ch[1 + (i >> 1) % 2] - 12), e8 * 0.9, 0.018, musNext - now, 'sine', 0, musicBus);
    musStep++; musNext += e8;
  }
}
setInterval(musicTick, 90);
function toggleMusic() {
  musicOn = !musicOn; audio();
  if (musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.6); }
}
// ---------- 🎉 confetti + sparkles ----------
const parts = [];
const CONF = ['#ff5c8a', '#ffd740', '#69f0ae', '#40c4ff', '#b388ff', '#ff9e40'];
function burst(x, y, n = 20, cols = CONF, spd = 5) {
  for (let i = 0; i < n; i++) { const a = rand(0, Math.PI * 2), v = rand(1, spd); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 2, c: pick(cols), r: rand(3, 6), life: rand(40, 70), rot: rand(0, 6), g: 0.15 }); }
}
function confettiRain(n = 3) { for (let i = 0; i < n; i++) parts.push({ x: rand(0, W), y: -10, vx: rand(-1, 1), vy: rand(1.5, 3.5), c: pick(CONF), r: rand(4, 7), life: 260, rot: rand(0, 6), g: 0.02 }); }
function updateParts() {
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.g; p.rot += 0.1; if (--p.life <= 0 || p.y > H + 20) parts.splice(i, 1); }
}
function drawParts() {
  for (const p of parts) { ctx.save(); ctx.globalAlpha = clamp(p.life / 30, 0, 1); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c; ctx.fillRect(-p.r, -p.r / 2, p.r * 2, p.r); ctx.restore(); }
}
// ---------- 🎮 game flow: title -> level card -> play -> level done -> ... -> win (hearts lost = try THIS level again) ----------
let state = 'title', level = 0, hearts = 3, stateT = 0, hurtT = 0;
const keys = {}, mouse = { x: 0, y: 0, down: false };
const MUSIC_BTN = { x: W - 62, y: H - 58, w: 50, h: 46 };
function setState(s) { state = s; stateT = 0; }
function startLevel(i) { level = i; hearts = GAME.hearts || 3; hurtT = 0; parts.length = 0; GAME.start(i); setState('card'); }
function levelWin() {
  if (state !== 'play') return;
  if (level >= 2) { setState('win'); SFX.win(); burst(W / 2, H / 2, 80); trophy('mgame' + GAME.n); }
  else { setState('done'); SFX.level(); burst(W / 2, 200, 50); }
}
function loseHeart() {                                // returns true if the level has to start again
  if (state !== 'play') return false;
  hearts--; hurtT = 50; SFX.oops();
  if (hearts <= 0) { setState('fail'); return true; }
  return false;
}
const GO = k => k === 'Enter' || k === ' ';
function press(k) {
  if (k === 'm' || k === 'M') { toggleMusic(); return; }
  if (state === 'title') { if (GO(k)) startLevel(0); return; }
  if (state === 'card') { if (GO(k) && stateT > 25) setState('play'); return; }
  if (state === 'done') { if (GO(k) && stateT > 40) startLevel(level + 1); return; }
  if (state === 'fail') { if (GO(k) && stateT > 40) startLevel(level); return; }
  if (state === 'win') { if (GO(k) && stateT > 120) setState('title'); return; }
  if (state === 'play' && GAME.key) GAME.key(k);
}
addEventListener('keydown', e => {
  audio(); const k = e.key;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (keys[k]) return; keys[k] = true; press(k);
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function canvasPos(e) { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
const inBox = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
C.addEventListener('mousedown', e => {
  audio(); const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; mouse.down = true;
  if (inBox(p, MUSIC_BTN)) { toggleMusic(); return; }
  if (state === 'play') { if (GAME.tap) GAME.tap(p.x, p.y); } else press('Enter');
});
addEventListener('mousemove', e => { const p = canvasPos(e); mouse.x = p.x; mouse.y = p.y; if (mouse.down && state === 'play' && GAME.drag) GAME.drag(p.x, p.y); });
addEventListener('mouseup', () => { if (mouse.down && GAME.release) GAME.release(); mouse.down = false; });
// ---------- screens ----------
function panel(x, y, w, h, col = 'rgba(20,10,50,.72)') { roundRect(x, y, w, h, 22, col); ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; rrect(x, y, w, h, 22); ctx.stroke(); }
function drawHUD() {
  const L = GAME.levels[level];
  text(`Level ${level + 1}: ${L.name}`, 20, 42, 28, '#fff', 'left');
  if (!GAME.noHearts) for (let i = 0; i < (GAME.hearts || 3); i++) {
    const s = i === hearts && hurtT > 0 ? 1 + hurtT / 50 : 1;
    heart(W - 34 - i * 40, 32, 16 * s, i < hearts ? '#ff4f7b' : 'rgba(255,255,255,.3)');
  }
  if (hurtT > 0) hurtT--;
}
function drawMusicBtn() {
  roundRect(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.w, MUSIC_BTN.h, 14, 'rgba(0,0,0,.35)');
  emoji(musicOn ? '🎵' : '🔇', MUSIC_BTN.x + 25, MUSIC_BTN.y + 24, 26);
}
function drawTitle() {
  GAME.drawTitle();
  ctx.fillStyle = 'rgba(10,5,30,.25)'; ctx.fillRect(0, 0, W, H);
  text(`❓ Mystery Game ${GAME.n}`, W / 2, 70, 34, '#ffe066');
  const s = 1 + Math.min(1, frame / 40) * 0, bounce = Math.sin(frame * 0.06) * 4;
  text(`${GAME.icon} ${GAME.name} ${GAME.icon}`, W / 2, 140 + bounce, 54 * s, GAME.color || '#fff');
  panel(W / 2 - 330, 175, 660, 44 + GAME.lines.length * 38);
  GAME.lines.forEach((l, i) => text(l, W / 2, 212 + i * 38, 25, '#fff'));
  if (frame % 60 < 42) text('Tap or press SPACE to start!', W / 2, 505, 32, '#7dffb0');
}
function drawCard() {
  const L = GAME.levels[level], a = Math.min(1, stateT / 15);
  ctx.save(); ctx.globalAlpha = a; ctx.fillStyle = 'rgba(10,5,30,.55)'; ctx.fillRect(0, 0, W, H);
  text(`Level ${level + 1}`, W / 2, 190, 40, '#ffe066');
  text(L.name, W / 2, 262, 64, '#fff');
  text(L.tip, W / 2, 330, 28, '#9fe8ff');
  if (stateT > 25 && frame % 60 < 42) text('Tap or press SPACE to go!', W / 2, 420, 28, '#7dffb0');
  ctx.restore();
}
function drawDone() {
  ctx.fillStyle = 'rgba(10,5,30,.45)'; ctx.fillRect(0, 0, W, H);
  text(GAME.doneText ? GAME.doneText(level) : 'Level complete!', W / 2, 220, 60, '#ffe066');
  text('⭐ ⭐ ⭐', W / 2, 290, 44, '#ffd740');
  if (stateT > 40 && frame % 60 < 42) text('Tap or press SPACE for the next level!', W / 2, 380, 30, '#7dffb0');
}
function drawFail() {
  ctx.fillStyle = 'rgba(10,5,30,.5)'; ctx.fillRect(0, 0, W, H);
  text(GAME.failText || 'Oops! Let\'s try again!', W / 2, 220, 52, '#ffb3c6');
  text('No worries, you get fresh hearts! 💖', W / 2, 285, 30, '#fff');
  if (stateT > 40 && frame % 60 < 42) text('Tap or press SPACE to try this level again', W / 2, 370, 28, '#7dffb0');
}
function drawWin() {
  ctx.fillStyle = 'rgba(10,5,30,.4)'; ctx.fillRect(0, 0, W, H);
  if (frame % 2 === 0) confettiRain(2);
  text('🎉 YOU DID IT! 🎉', W / 2, 150 + Math.sin(frame * 0.08) * 6, 66, '#ffe066');
  text(GAME.winLine, W / 2, 220, 30, '#fff');
  panel(W / 2 - 230, 250, 460, 70, 'rgba(90,50,0,.7)');
  text('🏆 New trophy for the Trophy Room!', W / 2, 296, 28, '#ffd740');
  if (stateT > 120 && frame % 60 < 42) text('Tap or press SPACE to play again', W / 2, 395, 28, '#7dffb0');
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') drawTitle();
  else {
    GAME.draw();
    drawHUD();
    if (state === 'card') drawCard(); else if (state === 'done') drawDone(); else if (state === 'fail') drawFail(); else if (state === 'win') drawWin();
  }
  drawParts();
  drawMusicBtn();
}
function step() {
  frame++; stateT++;
  if (state === 'play') GAME.update();
  else if (GAME.idle) GAME.idle();
  updateParts();
}
let last = 0, acc = 0;
function loop(now) {
  if (!last) last = now;
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { step(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
function boot() { requestAnimationFrame(loop); }

// (King Gloop copied from The Arcade Room / Robo: The Beginning)
// 👑 KING GLOOP (same look as Robo Jump: a PURPLE goo blob, gold crown, big white eyes, grumpy eyebrows)
// o = { s, face, t, pose, mouth, grumpy, happy, dizzy, hit, gear (carrying the Golden Gear) }
const GLOOP = { body: '#7c4dff', dark: '#651fff', crown: '#ffd740', mouth: '#311b92' };
function drawGloop(x, y, o = {}) {
  const s = o.s || 1.5, f = o.face || -1, t = o.t || frame, pose = o.pose || 'idle';
  const hop = pose === 'walk' || pose === 'run' ? Math.abs(Math.sin(t * (pose === 'run' ? 0.35 : 0.2))) : 0;
  const hit = (o.hit || 0) / 30;
  let wob = Math.sin(t * 0.15) * 3 + hit * 14 - hop * 5;
  if (pose === 'happy') wob = Math.sin(t * 0.3) * 6;
  ctx.save(); ctx.translate(x, y - hop * 10); ctx.scale(s, s);
  const w = 96 + wob, h = 84 - wob, top = -h;
  ellipse(0, 1 + hop * 10 / s, w * 0.55, 6, 'rgba(0,0,0,.18)');
  ctx.fillStyle = GLOOP.dark; rrect(-w / 2 - 2, top + 2, w + 4, h, 42); ctx.fill();
  ctx.fillStyle = GLOOP.body; rrect(-w / 2, top, w, h - 2, 40); ctx.fill();
  for (let i = 0; i < 5; i++) {                       // gooey drips
    const dx = -w / 2 + 12 + i * (w - 24) / 4, dl = 3 + ((i * 7 + Math.floor(t / 20)) % 4) * 1.5;
    ellipse(dx, -2 + dl * 0.4, 5, dl, GLOOP.body);
  }
  ellipse(-w / 2 + 25, top + 22, 12, 7, 'rgba(255,255,255,.35)', -0.5);
  ctx.fillStyle = GLOOP.crown; ctx.beginPath(); ctx.moveTo(-25, top + 6);   // 👑 crown
  for (let i = 0; i <= 4; i++) ctx.lineTo(-25 + i * 12.5, top - (i % 2 ? 4 : 22));
  ctx.lineTo(25, top + 6); ctx.closePath(); ctx.fill();
  circle(0, top - 4, 3, '#e91e63'); circle(-12.5, top, 2.2, '#40c4ff'); circle(12.5, top, 2.2, '#40c4ff');
  const look = f * 4;
  for (const ex of [-18, 18]) {
    circle(ex, top + 32, 11, '#fff');
    if (o.dizzy) { ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); for (let a = 0; a < 13; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.6, top + 32 + Math.sin(a + t * 0.2) * a * 0.6); ctx.stroke(); }
    else if (o.happy && !o.mouth) { ctx.strokeStyle = '#000'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(ex, top + 35, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    else { const bl = (t % 190) < 6 ? 1 : 5; ellipse(ex + look, top + 34, 5, bl, '#000'); if (bl > 2) circle(ex + look + 1.5, top + 32, 1.6, '#fff'); }
  }
  if (o.grumpy && !o.happy) {                          // grumpy eyebrows
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(-30, top + 16); ctx.lineTo(-8, top + 24); ctx.moveTo(30, top + 16); ctx.lineTo(8, top + 24); ctx.stroke();
  }
  const mo = o.mouth ? 0.6 + 0.4 * Math.abs(Math.sin(t * 0.45)) : 0;
  if (o.happy) {
    ctx.fillStyle = GLOOP.mouth; ctx.beginPath(); ctx.moveTo(-16, top + 54); ctx.quadraticCurveTo(0, top + 72 + mo * 6, 16, top + 54); ctx.closePath(); ctx.fill();
    circle(-28, top + 52, 5, 'rgba(255,128,171,.6)'); circle(28, top + 52, 5, 'rgba(255,128,171,.6)');
  } else if (o.dizzy) ellipse(0, top + 60, 9, 6 + mo * 3, GLOOP.mouth);
  else ellipse(0, top + 58, 18, 6 + mo * 6, GLOOP.mouth);
  ctx.restore();
  if (o.gear) drawGear(x + f * 70 * s / 1.5, y - 60 * s / 1.5 - hop * 10, 22, t * 0.03);
  if (o.dizzy) for (let i = 0; i < 4; i++) { const a = t * 0.08 + i * 1.6; star(x + Math.cos(a) * 46 * s / 1.5, y - (h + 24) * s + Math.sin(a) * 9, 8, '#ffd54f', a); }
}
// ===================== 👑 KING GLOOP'S CROWN TOWER (❓ Mystery Game 7) =====================
// A block swings from King Gloop's balloon. Drop it (SPACE / tap) to stack a tall tower!
// If a block lands too far over the edge, the tower wobbles and the block falls off: "Ouch, my crown!"
// 3 levels: Castle Yard, Windy Hill (wind pushes the swing), Up in the Clouds (the balloon drifts too).
const TUNE = { bpm: 100, chords: [[67, 71, 74], [64, 67, 71], [60, 64, 67], [62, 66, 69]], melody: [
  74, 0, 71, 74, 79, 0, 74, 0,   71, 0, 67, 71, 76, 0, 71, 0,   72, 0, 67, 64, 67, 72, 76, 0,   74, 0, 69, 0, 66, 69, 74, 0] };
const GROUND = 480, BH = 44, ROPE = 118;
const BLOCK_COLS = ['#ff8a80', '#ffd180', '#ccff90', '#80d8ff', '#b388ff', '#ff80ab', '#a7ffeb', '#ffe57f'];
let tower = [], hang = null, falling = null, offs = [], camY = 0, swingT = 0, nextT = 0, wobble = 0, wobDir = 1;
let placed = 0, kingSay = "", kingT = 0, dizzyT = 0, hookX = 480, wind = 0, crownT = 0;
let clouds = Array.from({ length: 7 }, () => ({ x: rand(0, W), y: rand(-900, 400), s: rand(0.6, 1.3) }));
const LV = () => GAME.levels[level];
function topBlock() { return tower[tower.length - 1]; }

function hangPos() {
  const a = Math.sin(swingT * LV().spd) * (LV().amp + wind * 0.25), hy = camY + 116;
  return { x: hookX + Math.sin(a) * ROPE, y: hy + Math.cos(a) * ROPE, a, hy };
}
function kingTalk(s, t = 120) { kingSay = s; kingT = t; }
function drop() {
  if (!hang || falling) return;

}
const GAME = {
  n: 7, name: "King Gloop's Crown Tower", icon: '👑', color: '#e1bee7',
  lines: ['A block swings from King Gloop\'s balloon.', 'Press SPACE or TAP to drop it!', 'Stack the blocks into a super tall tower.', 'Drop it near the middle, or it falls off!'],
  winLine: 'King Gloop has the tallest crown tower in the land!',
  levels: [
    { name: 'Castle Yard', tip: 'Drop the blocks right on top of each other!', goal: 7, bw: 150, spd: 0.032, amp: 0.85, wind: 0, drift: 0 },
    { name: 'Windy Hill', tip: 'Whoosh! The wind pushes the blocks around!', goal: 9, bw: 136, spd: 0.036, amp: 0.8, wind: 1, drift: 0 },
    { name: 'Up in the Clouds', tip: 'The balloon floats side to side. Wait for it!', goal: 11, bw: 124, spd: 0.04, amp: 0.7, wind: 0, drift: 1 },
  ],
  doneText: () => 'What a tall tower! 👑',
  failText: 'Uh-oh! Let\'s build it again!',
  start(i) {

    kingT = 0; dizzyT = 0; crownT = 0; hookX = 480; wind = 0; nextT = 0; newBlock();
    clouds = Array.from({ length: 7 }, () => ({ x: rand(0, W), y: rand(-900, 400), s: rand(0.6, 1.3) }));
    kingTalk(['Build me a tower!', 'Higher, please!', 'To the clouds!'][i], 150);
  },
  key(k) { if (k === ' ' || k === 'Enter' || k === 'ArrowDown') drop(); },
  tap() { drop(); },
  idle() { swingT++; },
  update() {
    swingT++; if (kingT > 0) kingT--; if (dizzyT > 0) dizzyT--; if (crownT) crownT++;
    if (LV().wind) wind = Math.sin(frame * 0.006) * 0.9 + Math.sin(frame * 0.017) * 0.3;
    if (LV().drift) hookX = 480 + Math.sin(frame * 0.012) * 150;
    wobble *= 0.985;
    const goalCam = Math.min(0, topY() - 385); camY += (goalCam - camY) * 0.06;
    for (const c of clouds) { c.x += 0.2 + (LV().wind ? 1.2 + wind : 0); if (c.x > W + 120) c.x = -120; }
    if (!hang && !falling && !crownT && --nextT <= 0) newBlock();
    if (falling) {
      const b = falling;
      if (b.mode === 'fall') {
        b.vy = Math.min(b.vy + 0.45, 14); b.y += b.vy; b.x += wind * 0.8;
        const tb = topBlock();
        if (b.y + BH >= tb.y) {
          const off = b.x - tb.x, lim = Math.min(b.w, tb.w) * 0.5;
          if (Math.abs(off) <= (b.w + tb.w) / 2 - 8) { b.y = tb.y - BH; SFX.thud(); b.off = off; burst(b.x, tb.y, 6, ['#fff', '#eee'], 2); }
          if (Math.abs(off) <= lim) {                       // 👍 it stays!
            b.mode = 'land'; tower.push(b); falling = null; placed++; nextT = 28;
            wobble = Math.min(10, wobble + Math.abs(off) / 7); wobDir = Math.sign(off) || 1;
            if (Math.abs(off) < 10) { kingTalk(pick(['PERFECT!', 'Ooh, so neat!', 'Royal stacking!']), 80); burst(b.x, b.y, 14); SFX.good(); }
            else if (Math.abs(off) > lim * 0.7) kingTalk('Whoa, wobbly!', 80);
            if (placed >= LV().goal) { crownT = 1; hang = null; kingTalk('MY TOWER! Hooray!', 200); SFX.level(); }
          } else if (Math.abs(off) <= (b.w + tb.w) / 2 - 8) {     // 😬 teeters... then tips off
            b.mode = 'teeter'; b.t = 0; b.dir = Math.sign(off); b.tb = tb; kingTalk('Uh-oh...', 60);
          } else { b.mode = 'tumble'; b.dir = Math.sign(off) || 1; }
        }
      } else if (b.mode === 'teeter') {
        b.t++; b.rot = Math.sin(b.t * 0.4) * 0.12 * b.dir; wobble = 6; wobDir = b.dir;
        if (b.t > 40) { b.mode = 'tumble'; b.vy = -2; b.vx = b.dir * 3; }
      } else if (b.mode === 'tumble') {
        b.vy = Math.min(b.vy + 0.45, 14); b.y += b.vy; b.x += b.vx || b.dir * 2 || 0; b.rot += 0.06 * (b.dir || 1);
        if (b.y - camY > H + 60) {
          falling = null; dizzyT = 90; kingTalk('Ouch, my crown!', 130); SFX.pop(); nextT = 40;
          loseHeart();
        }
      }
    }
    if (crownT > 150) levelWin();
  },
  drawTitle() {
    level = 0; drawBack(0);
    for (let i = 0; i < 5; i++) drawBlock(620 + Math.sin(frame * 0.05) * i * 1.5, 430 - i * BH, 150 - i * 6, BLOCK_COLS[i], 0, i % 2, i === 2);
    drawCrown(620, 430 - 5 * BH, 1.2);
    drawGloop(220, 500, { s: 1.1, face: 1, happy: true, pose: 'happy' });
  },
  draw() {
    drawBack(level);
    const sway = Math.sin(frame * 0.15) * wobble * wobDir, n = tower.length;
    tower.forEach((b, i) => {
      if (b.base) { drawBase(b.x, b.y - camY, b.w); return; }
      drawBlock(b.x + sway * i / n, b.y - camY, b.w, b.col, sway * 0.004, b.win, b.face);
    });
    if (crownT) { const k = Math.min(1, crownT / 30); drawCrown(topBlock().x + sway, topY() - camY + 4 - (1 - k) * 80, 1.3 * k); if (crownT % 10 === 0) burst(topBlock().x, topY() - camY - 20, 8); }
    // 🎈 the balloon + rope + swinging block
    const p = hangPos(), hy = p.hy - camY;
    if (!crownT) {
      ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(hookX, hy - 22); ctx.lineTo(hookX, hy); ctx.stroke();
      ellipse(hookX, hy - 52, 26, 32, '#ab47bc'); ellipse(hookX - 9, hy - 62, 7, 10, 'rgba(255,255,255,.4)', -0.4);
      ctx.fillStyle = '#ffd740'; ctx.beginPath(); ctx.moveTo(hookX - 12, hy - 78); for (let i = 0; i <= 4; i++) ctx.lineTo(hookX - 12 + i * 6, hy - (i % 2 ? 82 : 92)); ctx.lineTo(hookX + 12, hy - 78); ctx.fill();
      circle(hookX, hy, 5, '#90a4ae');
      if (hang) {
        const bx = p.x, by = p.y - camY;
        ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(hookX, hy); ctx.lineTo(bx, by); ctx.stroke();
        drawBlock(bx, by, hang.w, hang.col, -p.a * 0.5, hang.win, hang.face);
        // a soft dotted guide line straight down
        ctx.setLineDash([6, 10]); ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx, by + BH + 6); ctx.lineTo(bx, topY() - camY); ctx.stroke(); ctx.setLineDash([]);
      }
    }
    if (falling) drawBlock(falling.x, falling.y - camY, falling.w, falling.col, falling.rot, falling.win, falling.face);
    if (LV().wind) {                                       // 💨 wind streaks
      ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      for (let i = 0; i < 6; i++) { const x = ((frame * (4 + wind * 3) + i * 190) % 1100) - 70, y = 120 + i * 62 + Math.sin(frame * 0.05 + i) * 10; ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + 30, y - 8, x + 60, y); ctx.stroke(); }
      text(wind > 0.15 ? '💨 Wind →' : wind < -0.15 ? '← Wind 💨' : '🍃 calm', W / 2, 526, 24, '#e0f7fa');
    }
    // 👑 King Gloop watching (on a cloud way up high)
    if (level === 2) for (const [dx, dy, r] of [[-60, 6, 30], [-20, -4, 38], [30, 2, 34], [64, 10, 26]]) circle(110 + dx, 528 + dy, r, '#fff');
    drawGloop(110, level === 2 ? 515 : 530, { s: 0.75, face: 1, dizzy: dizzyT > 0, happy: crownT > 0 || (kingT > 0 && !dizzyT && kingSay.length < 18 && kingSay !== 'Uh-oh...'), mouth: kingT > 0 });
    if (kingT > 0) bubble(kingSay, 120, 432, 22);
    text(`Blocks: ${Math.min(placed, LV().goal)} / ${LV().goal}`, 650, 42, 28, '#ffe57f');
  },
};
function drawBlock(x, y, w, col, rot, win, face) {
  ctx.save(); ctx.translate(x, y + BH / 2); ctx.rotate(rot || 0); ctx.translate(-x, -(y + BH / 2));
  roundRect(x - w / 2, y + 3, w, BH, 8, 'rgba(0,0,0,.18)');
  roundRect(x - w / 2, y, w, BH - 2, 8, col);
  ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(x - w / 2 + 4, y + BH / 2 - 1); ctx.lineTo(x + w / 2 - 4, y + BH / 2 - 1);
  for (const k of [-0.3, 0.2]) { ctx.moveTo(x + w * k, y + 2); ctx.lineTo(x + w * k, y + BH / 2 - 1); }
  for (const k of [-0.05, 0.38]) { ctx.moveTo(x + w * k, y + BH / 2); ctx.lineTo(x + w * k, y + BH - 4); }
  ctx.stroke();
  ellipse(x - w / 2 + 16, y + 8, 9, 3, 'rgba(255,255,255,.45)');
  if (win) { roundRect(x + w * 0.22, y + 8, 18, 26, 9, '#5d4037'); roundRect(x + w * 0.22 + 3, y + 11, 12, 20, 6, '#ffe082'); }
  if (face) {                                          // a happy little block face
    circle(x - 12, y + 18, 3.2, '#3e2723'); circle(x + 4, y + 18, 3.2, '#3e2723');
    ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(x - 4, y + 23, 6, 0.2, Math.PI - 0.2); ctx.stroke();
    circle(x - 20, y + 25, 3, 'rgba(255,100,140,.5)'); circle(x + 12, y + 25, 3, 'rgba(255,100,140,.5)');
  }
  ctx.restore();
}
function drawBase(x, y, w) {                             // the stone foundation
  roundRect(x - w / 2, y, w, 40, 6, '#9e9e9e'); roundRect(x - w / 2, y, w, 10, 4, '#bdbdbd');
  ctx.strokeStyle = 'rgba(0,0,0,.2)'; ctx.lineWidth = 2; for (let i = 1; i < 5; i++) { ctx.beginPath(); ctx.moveTo(x - w / 2 + i * w / 5, y + 10); ctx.lineTo(x - w / 2 + i * w / 5, y + 40); ctx.stroke(); }
}
function drawCrown(x, y, s) {                            // (x, y) = bottom middle
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  glow(0, -24, 60, 'rgba(255,215,64,.5)');
  ctx.fillStyle = '#ffd740'; ctx.strokeStyle = '#c79100'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(-40, 0);
  for (let i = 0; i <= 4; i++) ctx.lineTo(-40 + i * 20, i % 2 ? -22 : -48); ctx.lineTo(40, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
  circle(0, -16, 7, '#e91e63'); circle(-22, -12, 5, '#40c4ff'); circle(22, -12, 5, '#69f0ae');
  for (const i of [0, 2, 4]) circle(-40 + i * 20, -50, 5, '#fff59d');
  ctx.restore();
}
function drawBack(lv) {
  const sky = [['#64b5f6', '#e1f5fe'], ['#4fc3f7', '#c8e6c9'], ['#f8bbd0', '#b3e5fc']][lv];
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, sky[0]); g.addColorStop(1, sky[1]); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const py = -camY * 0.3;
  if (lv === 2) { ctx.lineWidth = 16; ['#ff8a80', '#ffd180', '#ffff8d', '#b9f6ca', '#80d8ff', '#b388ff'].forEach((c, i) => { ctx.strokeStyle = c; ctx.globalAlpha = 0.45; ctx.beginPath(); ctx.arc(480, 620 + py * 0.5, 470 - i * 16, Math.PI, 0); ctx.stroke(); }); ctx.globalAlpha = 1; }
  else circle(820, 90 + py * 0.3, 44, '#fff59d');
  for (const c of clouds) { const y = c.y + py; for (const [dx, dy, r] of [[0, 0, 30], [32, -10, 36], [66, 0, 28]]) circle(c.x + dx * c.s, y + dy * c.s, r * c.s, 'rgba(255,255,255,.85)'); }
  const gy = GROUND - camY;
  if (lv === 0) {                                      // 🏰 castle walls behind the yard
    ctx.fillStyle = '#b0bec5'; ctx.fillRect(0, gy - 150 + py * 0.2, W, 160);
    for (let x = 0; x < W; x += 60) ctx.fillRect(x, gy - 176 + py * 0.2, 34, 28);
    for (const tx of [60, 900]) { ctx.fillStyle = '#90a4ae'; ctx.fillRect(tx - 40, gy - 260 + py * 0.2, 80, 270); ctx.fillStyle = '#ec407a'; ctx.beginPath(); ctx.moveTo(tx - 48, gy - 260 + py * 0.2); ctx.lineTo(tx, gy - 330 + py * 0.2); ctx.lineTo(tx + 48, gy - 260 + py * 0.2); ctx.fill(); }
    ctx.fillStyle = '#7cb342'; ctx.fillRect(0, gy, W, H);
  } else if (lv === 1) {                               // ⛰️ the windy hill + a little windmill
    ctx.fillStyle = '#9ccc65'; ctx.beginPath(); ctx.ellipse(480, gy + 120, 760, 190, 0, 0, 7); ctx.fill();
    const wx = 830, wy = gy - 70; ctx.fillStyle = '#fff3e0'; ctx.fillRect(wx - 16, wy, 32, 70);
    ctx.save(); ctx.translate(wx, wy); ctx.rotate(frame * 0.03 * (1 + Math.abs(wind))); for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); roundRect(-6, 0, 12, 56, 4, '#ef9a9a'); } ctx.restore(); circle(wx, wy, 6, '#6d4c41');
    ctx.strokeStyle = '#558b2f'; ctx.lineWidth = 3; for (let x = 10; x < W; x += 26) { ctx.beginPath(); ctx.moveTo(x, gy + 6); ctx.lineTo(x + 6 + wind * 6, gy - 10); ctx.stroke(); }
  } else {                                             // ☁️ a soft cloud floor
    for (let x = -40; x < W + 60; x += 70) circle(x, gy + 20 + Math.sin(x) * 8, 54, '#ffffff');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, gy + 30, W, H);
  }
}
boot();
