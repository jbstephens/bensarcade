<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🚂 Paper Train Set</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3f2ff 0 36px, #ffe3f1 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff4fa3; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-tv { background: #ff8a80; font-size: 22px; } .b-spin { background: #ffd54f; font-size: 22px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🧸 the Train Designer ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #boxPrev { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #ff4fa3;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #boxPrev svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(18px, 2.3vw, 26px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 70px; height: 70px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .opt.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  #invHelp { font-size: 16px; text-align: center; color: #555; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff4fa3; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff4fa3; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view { flex-direction: column; }
    #invLeft { width: 100%; height: 42vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 52px; height: 52px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.25in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #trip { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 8in; height: 10in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
<style>
  body { background: repeating-linear-gradient(45deg, #e3f7ea 0 36px, #fff3d6 36px 72px); }
  h1.big { text-shadow: 4px 4px 0 #e53935; }
  #boxPrev { box-shadow: 0 6px 0 #e53935; position: relative; }
  .optRow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px 10px; cursor: pointer; color: #222; box-shadow: 0 4px 0 #333; min-height: 50px; }
  .chip.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .chip.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  #opts h4 { margin: 4px 0 0; font-size: 19px; text-align: center; }
  #invLeft .two .btn { min-height: 50px; font-size: 19px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .three .btn { font-size: 15px; padding: 4px 2px; }
  .b-ride { background: #ffd54f; font-size: 22px; }
  .numRow { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .numRow b { font-size: 46px; min-width: 120px; text-align: center; background: #263238; color: #ffd740; border: 4px solid #333; border-radius: 14px; padding: 2px 10px; }
  .thumb { box-shadow: 0 6px 0 #e53935; }
  #paper svg { box-shadow: 0 8px 0 #e53935; }
  /* ---------- 🚉 ALL ABOARD! ---------- */
  #trip { position: fixed; inset: 0; z-index: 50; background: #1d2a44; display: none; flex-direction: column; gap: 8px; padding: 8px 10px; }
  #trip.on { display: flex; }
  #tripTop { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #tripTop h1.big { font-size: clamp(22px, 3.4vw, 40px); text-shadow: 4px 4px 0 #ffb300; }
  #tripTop .btn { min-height: 50px; font-size: 18px; }
  .b-whistle { background: #b3e5fc; } .b-bell { background: #ffe082; }
  #tripMain { flex: 1; min-height: 0; position: relative; border: 6px solid #111; border-radius: 22px; overflow: hidden; background: #81d4fa; }
  #tripMain > div { position: absolute; inset: 0; display: none; }
  #tripMain > div.on { display: flex; }
  #scene svg { width: 100%; height: 100%; display: block; }
  #board { flex-direction: column; background: #111; padding: 10px 14px; gap: 6px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #board h2 { margin: 0; color: #ffd740; font-family: "Courier New", monospace; font-size: clamp(20px, 3vw, 34px); text-align: center; letter-spacing: 3px; }
  .dep { font: inherit; display: grid; grid-template-columns: 1.1fr 3fr 1fr 1.6fr; gap: 8px; align-items: center; background: #222; color: #ffd740; border: 3px solid #444; border-radius: 10px;
    padding: 6px 10px; font-family: "Courier New", monospace; font-weight: bold; font-size: clamp(15px, 2.2vw, 26px); cursor: pointer; text-align: left; min-height: 50px; }
  .dep.kbd, .dep:hover { border-color: #ffd740; background: #2c2c10; }
  .dep .st { color: #69f0ae; } .dep .st.blink { animation: blink 1s steps(2) infinite; }
  .dep.head { cursor: default; color: #fff; background: transparent; border-color: transparent; font-size: clamp(13px, 1.6vw, 18px); min-height: 0; }
  @keyframes blink { 50% { opacity: .15; } }
  #ticket { align-items: center; justify-content: center; background: radial-gradient(#ffe0b2, #ffab91); cursor: pointer; }
  #ticket svg { width: min(92%, 130vh); height: auto; max-height: 92%; }
  #tripSay { background: #fff; border: 5px solid #333; border-radius: 20px; font-size: clamp(18px, 2.8vw, 32px); font-weight: bold; text-align: center; padding: 6px 12px; min-height: 2.2em; }
  #scene .puff { animation: puff 1.6s ease-out infinite; transform-box: fill-box; transform-origin: 50% 50%; opacity: 0; }
  #scene.go .puff { opacity: 1; }
  @keyframes puff { from { transform: translate(0, 0) scale(.4); opacity: .95; } to { transform: translate(-160px, -170px) scale(2.3); opacity: 0; } }
  #scene .flash1 { animation: blink .6s steps(2) infinite; } #scene .flash2 { animation: blink .6s steps(2) infinite reverse; }
  @media (orientation: portrait) { .dep { grid-template-columns: 1fr 2.4fr 1fr; } .dep .pl { display: none; } }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🚂 PAPER TRAIN SET</h1>
    <div id="boxPrev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-ride" id="bRide">🚉 All Aboard!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · Space = spin · A = All Aboard! · Enter = printables</div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Designer</button>
    <h1 class="big">🖨️ PRINT &amp; BUILD</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. Everything is REAL SIZE. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="three" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it<br>(black lines)</button>
      <button class="btn b-mode" id="bBlank">⬜ Blank<br>(draw your own)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="trip">
  <div id="tripTop">
    <button class="btn b-back" id="tStop">⏹️ Stop</button>
    <h1 class="big" id="tripTitle">🚉 ALL ABOARD!</h1>
    <button class="btn b-whistle" id="tWhistle">📯 Whistle</button>
    <button class="btn b-bell" id="tBell">🔔 Bell</button>
  </div>
  <div id="tripMain"><div id="board"></div><div id="ticket"></div><div id="scene"></div></div>
  <div id="tripSay"></div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🚂 PAPER TRAIN SET: design a train (name slot machine, colors per car, engine number, logo, passengers),
// ride it on screen ("All Aboard!": departure board, ticket punch, conductor voice, chugging, whistle, bell,
// road crossing, tunnel, arrival announcements), then print REAL-SIZE fold-up cars, track, a station,
// a tunnel, crossing signs, tickets and a Train Engineer card. All paper: printer paper, tape/glue, a pencil.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 printed at 8 x 10 in: 100 units = 1 inch.
// LINE = false is full color, LINE = true is black lines to color in; BLANK = true leaves the design off.
// Drawing engine + characters copied from Toy Inventor / Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {

    [1150, 1300, 1450].map(x => P(poly([x, 470, x - 60, 600, x + 60, 600]), '#2e7d32', OL, 2) + P(poly([x, 470, x - 30, 535, x + 30, 535]), '#fff', 0)).join('');
  return P('M100 654 L260 380 L320 380 L480 654 Z', '#8d6e63', OL, 3) + E(290, 370, 40, 14, '#ff7043', OL, 2) + E(290, 330, 30, 30, '#ffab91', 0, 0, 0, ' opacity=".7"') +
    P('M1100 654 Q1100 560 1200 560 L1300 560 Q1360 560 1380 480 Q1390 420 1430 420 Q1470 420 1460 450 Q1420 450 1410 500 Q1400 600 1340 620 L1340 654 L1300 654 L1300 620 L1180 620 L1180 654 Z', '#66bb6a', OL, 3) + C(1435, 432, 4, OL, 0);
}
function crossingArt() {
  return R(-120, RAILY - 30, 240, 40, 0, '#546e7a', 0) + R(-150, RAILY - 300, 12, 270, 3, '#eceff1', OL, 2) + crossbuck(-144, RAILY - 300, 1.2) +
    R(-200, RAILY - 240, 112, 44, 20, '#263238', OL, 2) + '<g class="flash1">' + C(-174, RAILY - 218, 15, '#ff1744', OL, 2) + '</g><g class="flash2">' + C(-114, RAILY - 218, 15, '#ff1744', OL, 2) + '</g>' +
    R(-330, RAILY - 80, 130, 50, 16, '#29b6f6', OL, 2.4) + R(-310, RAILY - 106, 80, 34, 10, '#81d4fa', OL, 2) + C(-305, RAILY - 30, 14, '#263238', OL, 2) + C(-225, RAILY - 30, 14, '#263238', OL, 2);

// the tunnel: a mountain in front of the train with a stone portal at each end (1800 long)
const TUN_L = 1800;
function tunnelArt() {
  let o = P(`M-60 ${RAILY + 30} L-60 ${RAILY - 300} Q300 ${RAILY - 520} 900 ${RAILY - 480} Q1500 ${RAILY - 520} ${TUN_L + 60} ${RAILY - 300} L${TUN_L + 60} ${RAILY + 30} Z`, '#558b2f', OL, 4);
  [0, TUN_L].forEach(x => { o += R(x - 70, RAILY - 330, 140, 360, 8, '#9e9e9e', OL, 3); for (let v = RAILY - 300; v < RAILY + 20; v += 40) o += L(`M${x - 70} ${v} L${x + 70} ${v}`, '#757575', 2); });
  return o + R(700, RAILY - 400, 400, 60, 10, '#5d4037', OL, 3) + T(900, RAILY - 358, 'TUNNEL', 40, '#fff');
}
// ---------- the trip ----------
let trip = null;
const tripOn = () => !!trip;
function later(fn, ms) { if (!trip) return; const t = trip, id = setTimeout(() => { if (trip === t) fn(); }, ms); t.timers.push(id); }
function showPane(id) { ['board', 'ticket', 'scene'].forEach(p => $(p).classList.toggle('on', p === id)); }
function tripSay(txt, opt) { $('tripSay').textContent = txt; say(txt, opt); }
function openTrip() {
  stopTrip(true); endPrintAll();
  trip = { phase: 'board', holes: 0, kbd: state.dest, timers: [] };
  $('trip').classList.add('on'); showPane('board'); renderBoard();
  tripSay('Welcome to ' + (NAME_A[state.a] + ' Station') + '! Where shall we go today? Tap a train on the board!');
  bell(1);
}
function renderBoard() {
  const b = $('board'); b.innerHTML = '';
  b.appendChild(mkDiv('', '<h2>DEPARTURES · ' + esc(stationName(state)) + '</h2>'));
  b.appendChild(mkDiv('dep head', '<span>TIME</span><span>TO</span><span class="pl">PLATFORM</span><span>STATUS</span>'));
  DESTS.forEach((d, i) => b.appendChild(mkBtn('dep' + (i === trip.kbd ? ' kbd' : ''), '<span>' + d.time + '</span><span>' + esc(d.name.toUpperCase()) + '</span><span class="pl">' + (i % 3 + 1) + '</span>' +
    '<span class="st' + (i === trip.kbd ? ' blink' : '') + '">' + (i === trip.kbd ? 'BOARDING' : 'ON TIME') + '</span>', () => pickDest(i))));
}
function pickDest(i) {
  if (!trip || trip.phase !== 'board') return;
  state.dest = i; saveState(); trip.phase = 'ticket'; trip.holes = 0;
  showPane('ticket'); renderTicket(); blip(880, 0, .1);
  tripSay('One ticket to ' + DESTS[i].name + ', please! Tap your ticket so the conductor can punch it.');
}
function renderTicket() {
  const d = DESTS[state.dest];
  $('ticket').innerHTML = mini(() => { let o = ticketArt(0, 0, state, d, state.dest);
    for (let k = 0; k < trip.holes; k++) o += C(TICKET.w - 74 + k * 26, 136, 9, '#3e2723', 0);
    return o; }, '-10 -10 ' + (TICKET.w + 20) + ' ' + (TICKET.h + 20));
}
function punch() {
  if (!trip || trip.phase !== 'ticket' || trip.holes >= 3) return;
  trip.holes++; renderTicket(); blip(1900, 0, .05, 'square', .12); blip(180, .02, .08, 'square', .1);
  if (trip.holes === 1) { tripSay('Click! Thank you. Your ticket is punched. All aboard!'); later(startRide, 2600); }
}
// the ride timeline (ms)
function rideEvents(s) {
  const d = DESTS[s.dest], nm = trainName(s);
  return [
    [0, () => { bell(3); tripSay('All aboard the ' + nm + '! This train is going to ' + d.name + '. Push your paper train along with me!'); }],
    [5000, () => { whistle([[0, .45], [.65, 1.2]]); trip.target = SPEED; $('scene').classList.add('go'); }],
    [10500, () => tripSay('Welcome aboard! Engineer ' + s.who + ' is driving engine number ' + engNum(s) + ' today.')],
    [16000, () => { trip.obj.oCross = trip.pos + SW + 420; ding(16); tripSay('Ding ding ding! A road crossing. The cars wait while the train goes by.'); }],
    [17000, () => whistle([[0, 1], [1.2, 1], [2.4, .4], [3, 1.4]])],
    [25000, () => { trip.obj.oTun = trip.pos + SW + 60; tripSay('Here comes a tunnel! Hold on tight!'); }],
    [27000, () => whistle([[0, 1.6]])],
    [34500, () => tripSay(d.fact)],
    [40000, () => { trip.obj.oDest = trip.pos + 1700 + 100; trip.brake = trip.v * trip.v / (2 * 1700); bell(2); tripSay('Next stop: ' + d.name + '! ' + d.name + '!');
      const sky = $('SKY'); if (sky) sky.style.fill = d.sky; const gr = $('GROUND'); if (gr) gr.style.fill = d.ground; }],
  ];
}
function sceneSVG(s) {
  const d = DESTS[s.dest], tx = trainX(), eu = engineAt(), stackX = tx + (eu + carOf('engine').L - 55) * TK, stackY = RAILY - engineTall() * TK;
  let puffs = ''; for (let i = 0; i < 6; i++) puffs += '<circle class="puff" style="animation-delay:' + (i * .27).toFixed(2) + 's" cx="' + n(stackX) + '" cy="' + n(stackY - 10) + '" r="22" fill="#eceff1" stroke="#b0bec5" stroke-width="2"/>';
  return mini(() => '<rect id="SKY" x="0" y="0" width="1600" height="620" fill="#81d4fa" style="transition: fill 4s"/>' + C(1380, 270, 56, '#fff59d', 0) +
    '<g id="L1">' + farLayer() + '</g>' + '<rect id="GROUND" x="0" y="600" width="1600" height="300" fill="#9ccc65" style="transition: fill 4s"/>' +
    '<g id="L2">' + midLayer() + '</g>' +
    '<g id="oHome">' + stationArt(stationName(s), null, homeBuilding(s)) + '</g>' +
    '<g id="oDest">' + destBuilding(d.id) + stationArt(d.name.toUpperCase(), HOSTS[d.id], '') + '</g>' +
    '<g id="oCross">' + crossingArt() + '</g>' +
    R(0, RAILY + 4, 1600, 30, 0, '#a1887f', 0) + '<g id="L3">' + tieLayer() + '</g>' + R(0, RAILY - 2, 1600, 8, 2, '#78909c', OL, 1.6) +
    '<g id="TR">' + puffs + trainView(s, tx, RAILY, TK, true) + '</g>' +
    '<g id="oTun">' + tunnelArt() + '</g>' + '<rect id="DARK" x="0" y="0" width="1600" height="900" fill="#000" opacity="0"/>', '0 180 1600 640');
}
function startRide() {
  if (!trip) return;
  trip.timers.forEach(clearTimeout); trip.timers = [];
  clearInterval(trip.iv);
  Object.assign(trip, { phase: 'ride', T: 0, pos: 0, v: 0, target: 0, brake: 0, ev: rideEvents(state), evI: 0, nextChuff: 0, nextClack: 287, arrived: false, obj: { oHome: 0, oDest: -1e6, oCross: -1e6, oTun: -1e6 } });
  state.trips++; saveState(); checkTrophy('You took your first train ride!');
  showPane('scene'); $('scene').classList.remove('go'); $('scene').innerHTML = sceneSVG(state);
  const sc = $('scene');
  trip.wheels = sc.querySelectorAll ? Array.from(sc.querySelectorAll('.wh')) : [];
  trip.rods = sc.querySelectorAll ? Array.from(sc.querySelectorAll('.rod')) : [];
  rideFrame(); trip.iv = setInterval(rideTick, 40);
}
function rideTick() {
  const t = trip; if (!t || t.phase !== 'ride') return;
  const dt = .04; t.T += 40;
  while (t.evI < t.ev.length && t.ev[t.evI][0] <= t.T) t.ev[t.evI++][1]();
  if (t.brake) t.v = Math.max(0, t.v - t.brake * dt);
  else if (t.v < t.target) t.v = Math.min(t.target, t.v + ACCEL * dt);
  t.pos += t.v * dt;
  const inTun = t.obj.oTun - t.pos < 900 && t.obj.oTun + TUN_L - t.pos > 400;
  if (t.v > 2 && t.pos >= t.nextChuff) { chuff(Math.min(.45, .15 + t.v / 900), inTun); t.nextChuff = t.pos + Math.max(2 * Math.PI * 40 * TK / 4, t.v * .16); }
  if (t.pos >= t.nextClack) { blip(95, 0, .04, 'square', .05); blip(95, .09, .04, 'square', .05); t.nextClack += TRACK.len * TK; }
  rideFrame();
  if (t.brake && t.v === 0 && !t.arrived) arrive();
}
function rideFrame() {
  const t = trip, tf = (id, x) => { const e = $(id); if (e) e.setAttribute('transform', 'translate(' + n(x) + ' 0)'); };
  tf('L1', -((t.pos * .15) % SW)); tf('L2', -((t.pos * .45) % SW)); tf('L3', -(t.pos % SW));
  Object.keys(t.obj).forEach(k => tf(k, t.obj[k] - t.pos));
  const cover = Math.min(1, Math.max(0, Math.min(800 - (t.obj.oTun - t.pos), t.obj.oTun + TUN_L - t.pos - 800) / 300));
  const dk = $('DARK'); if (dk) dk.setAttribute('opacity', (cover * .55).toFixed(2));
  const ang = t.pos / TK;                                         // wheel turn (train units)
  t.wheels.forEach(w => { const r = +w.getAttribute('data-r') || 30, g = w.firstChild || w.children && w.children[0]; if (g && g.setAttribute) g.setAttribute('transform', 'rotate(' + n((ang / r) * 180 / Math.PI % 360) + ')'); });
  const a = ang / 40; t.rods.forEach(r => r.setAttribute('transform', 'translate(' + n(12 * Math.cos(a)) + ' ' + n(12 * Math.sin(a)) + ')'));
}
function arrive() {
  const t = trip, d = DESTS[state.dest]; t.arrived = true; $('scene').classList.remove('go');
  hiss(2); bell(3);
  tripSay('Now arriving at ' + d.name + '. Please mind the gap, and take all your things. Thank you for riding the ' + trainName(state) + '!');
  later(rideDone, 9000);
}
function rideDone() {
  if (!trip) return; trip.phase = 'done'; clearInterval(trip.iv);
  const box = $('tripSay'); box.innerHTML = '';
  box.appendChild(mkBtn('btn b-ride', '🔁 Ride again', () => startRide()));
  box.appendChild(document.createTextNode ? document.createTextNode(' ') : mkDiv('', ' '));
  box.appendChild(mkBtn('btn b-back', '🚉 New trip', () => { stopTrip(true); openTrip(); }));
  say('The end! Where shall we go next?');
}
function stopTrip(quiet) {
  if (!trip) return;
  trip.timers.forEach(clearTimeout); clearInterval(trip.iv); trip = null;
  if (typeof document !== 'undefined' && $('trip')) { $('trip').classList.remove('on'); $('scene').innerHTML = ''; }
  hush(); if (!quiet) blip(440, 0, .1);
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, A = All Aboard!)
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function tripKey(k) {
  if (k === 'Escape' || k === 'Backspace') { stopTrip(); return true; }
  if (k === 'w' || k === 'W') { whistle([[0, .9]]); return true; }
  if (k === 'b' || k === 'B') { bell(2); return true; }
  if (trip.phase === 'board') {
    if (k === 'ArrowDown' || k === 'ArrowUp') { trip.kbd = (trip.kbd + (k === 'ArrowDown' ? 1 : DESTS.length - 1)) % DESTS.length; renderBoard(); blip(520, 0, .05); return true; }
    if (k === 'Enter' || k === ' ') { pickDest(trip.kbd); return true; }
  } else if (trip.phase === 'ticket') { if (k === 'Enter' || k === ' ') { punch(); return true; } }
  else if (trip.phase === 'done') { if (k === 'Enter' || k === ' ') { startRide(); return true; } }
  else if (k === ' ') { whistle([[0, .9]]); return true; }
  return false;
}
function onKey(e) {
  const k = e.key;
  if (tripOn()) { if (tripKey(k)) e.preventDefault(); return; }
  if (view === 'inv') {
    if (k === 'ArrowUp' || k === 'ArrowDown') { catI = (catI + (k === 'ArrowDown' ? 1 : CATS.length - 1)) % CATS.length; renderCats(); renderOpts(); blip(520, 0, .06); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') nudge(k === 'ArrowRight' ? 1 : -1);
    else if (k === ' ') spinName();
    else if (k === 'Enter') openGallery();
    else if (k === 'a' || k === 'A') openTrip();
    else if (k === 'p' || k === 'P') { sel = 0; openSheet(0); printSheet(); }
    else return;
    e.preventDefault();
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToDesigner(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {

if (typeof window !== 'undefined' && !window.__TEST__) {

}
