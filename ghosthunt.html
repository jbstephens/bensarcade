<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>👻 Ghost Hunt</title>
<script>TOUCHPAD = { dpad: true, south: [' ', 'UV'], east: ['x', 'JAR'] };</script>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #05060f; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 520)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// 👻 GHOST HUNT
// A spooky old house with 8 rooms. In each room a friendly ghost is hiding, invisible!
// Roll Dusty around with the 📟 ghost meter (it beeps faster when you get close), shine the UV light
// so the ghost slowly shimmers into view, then catch it gently in a glowing jar.
// Catch all 8, then let them all out for a GHOST PARTY in the moonlit garden. 🔆 Lights On makes it less spooky.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function wrapText(str, x, y, maxW, size, color = '#fff', lineH = 1.25, outline = false, align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  const words = str.split(' '); let line = '', yy = y; const lines = [];
  for (const w of words) { const t2 = line ? line + ' ' + w : w; if (ctx.measureText(t2).width > maxW && line) { lines.push(line); line = w; } else line = t2; }
  if (line) lines.push(line);
  for (const l of lines) { text(l, x, yy, size, color, align, outline); yy += size * lineH; }
  return lines.length;
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') { ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore(); }
let frame = 0;

// ---------- save (caught ghosts + Lights On), always in try/catch ----------
let save = { caught: [], lights: false, party: false };
try { const s = JSON.parse(localStorage.getItem('ghostHunt') || 'null'); if (s && Array.isArray(s.caught)) save = Object.assign(save, s); } catch (_) {}
function store() { try { localStorage.setItem('ghostHunt', JSON.stringify(save)); } catch (_) {} }
let lights = !!save.lights;

// ---------- 🎵 gentle sound: a slow music box, soft meter beeps. Master never above 0.12, always fades ----------
const Snd = (() => {
  let ac = null, master = null, music = null, sfx = null, nextT = 0, step = 0, song = 'spooky', muted = false;
  const MAX = 0.11;
  // the spooky theme: a slow minor waltz on a music box (MIDI numbers, 0 = rest), one note per beat
  const MELODY = [69, 72, 76, 75, 76, 72, 71, 74, 77, 76, 74, 71, 69, 72, 76, 81, 79, 76, 77, 76, 74, 72, 0, 0,
    72, 76, 79, 78, 79, 76, 74, 77, 81, 80, 81, 77, 76, 74, 72, 71, 72, 74, 69, 68, 69, 69, 0, 0];
  const BASS = [45, 45, 50, 52, 45, 50, 50, 45, 48, 48, 50, 53, 45, 52, 45, 45];
  // the party tune: the same waltz, but happy (C major) and a little quicker
  const PARTY = [72, 76, 79, 77, 79, 76, 74, 77, 81, 79, 77, 74, 72, 76, 79, 84, 83, 79, 81, 79, 77, 76, 0, 0,
    76, 79, 84, 83, 84, 79, 77, 81, 84, 83, 81, 77, 79, 77, 76, 74, 76, 77, 72, 71, 72, 72, 0, 0];
  const PBASS = [48, 48, 53, 55, 48, 53, 53, 48, 52, 52, 53, 57, 48, 55, 48, 48];
  const hz = m => 440 * Math.pow(2, (m - 69) / 12);
  function init() {
    if (ac) { if (ac.state === 'suspended' && ac.resume) ac.resume(); return; }
    try { ac = (window.JUKEBOX && JUKEBOX.makeCtx && JUKEBOX.makeCtx()) || new (window.AudioContext || window.webkitAudioContext)(); } catch (_) { ac = null; return; }
    if (window.JUKEBOX && JUKEBOX.song === 'party') song = 'party';   // 🎶 the book's Jukebox can ask for ?song=party
    master = ac.createGain(); master.gain.value = 0; master.connect(ac.destination);
    master.gain.linearRampToValueAtTime(muted ? 0 : MAX, ac.currentTime + 2.5);
    music = ac.createGain(); music.gain.value = lights ? 0.45 : 0.8; music.connect(master);
    sfx = ac.createGain(); sfx.gain.value = 1; sfx.connect(master);
    nextT = ac.currentTime + 0.3;
  }
  function bell(f, t, v, dur, dest) {           // a soft music-box / celesta note
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f; o2.type = 'sine'; o2.frequency.value = f * 3.01;
    const g2 = ac.createGain(); g2.gain.value = 0.18;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + 0.015); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
    o.connect(g); o2.connect(g2); g2.connect(g); g.connect(dest || sfx);
    o.start(t); o2.start(t); o.stop(t + dur + 0.05); o2.stop(t + dur + 0.05);
  }
  function pad(f, t, v, dur) {                    // a soft, slow pad under the tune
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'triangle'; o2.type = 'triangle'; o.frequency.value = f; o2.frequency.value = f * 1.004; lp.type = 'lowpass'; lp.frequency.value = 600;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(v, t + dur * 0.4); g.gain.linearRampToValueAtTime(0, t + dur);
    o.connect(lp); o2.connect(lp); lp.connect(g); g.connect(music); o.start(t); o2.start(t); o.stop(t + dur + 0.1); o2.stop(t + dur + 0.1);
  }
  function tick() {                               // called every frame: schedules the music a little ahead
    if (!ac || muted) return;
    const party = song === 'party', bpm = party ? 104 : 80, beat = 60 / bpm;
    const mel = party ? PARTY : MELODY, bass = party ? PBASS : BASS;
    while (nextT < ac.currentTime + 0.25) {
      const m = mel[step % mel.length];
      if (m) bell(hz(m), nextT, party ? 0.16 : 0.13, beat * 2.4, music);
      if (step % 3 === 0) { const b = bass[Math.floor(step / 3) % bass.length]; pad(hz(b), nextT, 0.10, beat * 3); pad(hz(b + (party ? 16 : 15)), nextT, 0.05, beat * 3); }
      if (party && step % 3 !== 0) bell(hz(mel[(step + 1) % mel.length] || 79) * 2, nextT + beat / 2, 0.025, beat, music);
      nextT += beat; step++;
    }
  }
  function setSong(s) { if (s === song) return; song = s; step = 0; if (ac) nextT = ac.currentTime + 0.4; }
  function soft(on) { if (!ac) return; const t = ac.currentTime; music.gain.cancelScheduledValues(t); music.gain.setValueAtTime(music.gain.value, t); music.gain.linearRampToValueAtTime(on ? 0.45 : 0.8, t + 1.2); }
  function beep(close) {                          // the ghost meter: a soft little "bip"
    if (!ac || muted) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = 700 + close * 500;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.10, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, t + 0.09);
    o.connect(g); g.connect(sfx); o.start(t); o.stop(t + 0.12);
  }
  function shimmer() {                            // a ghost slowly appears: soft glassy notes going up
    if (!ac || muted) return; const t = ac.currentTime;
    [81, 84, 88, 91, 93].forEach((m, i) => bell(hz(m), t + i * 0.22, 0.07, 1.6));
  }
  function chime() {                              // caught! a cosy little chime
    if (!ac || muted) return; const t = ac.currentTime;
    [72, 76, 79, 84].forEach((m, i) => bell(hz(m), t + i * 0.13, 0.10, 1.8));
  }
  function creak() {                              // a soft, far-away floor creak
    if (!ac || muted) return; const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(), lp = ac.createBiquadFilter();
    o.type = 'sawtooth'; o.frequency.setValueAtTime(95, t); o.frequency.linearRampToValueAtTime(70, t + 0.9);
    lp.type = 'lowpass'; lp.frequency.value = 380;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(0.03, t + 0.3); g.gain.linearRampToValueAtTime(0, t + 1);
    o.connect(lp); lp.connect(g); g.connect(sfx); o.start(t); o.stop(t + 1.1);
  }
  let uvO = null, uvG = null;
  function uv(on) {                               // a very quiet hum while the UV light is on
    if (!ac || muted) return;
    if (on && !uvO) { uvO = ac.createOscillator(); uvG = ac.createGain(); uvO.type = 'sine'; uvO.frequency.value = 220; uvG.gain.value = 0;
      uvO.connect(uvG); uvG.connect(sfx); uvO.start(); uvG.gain.linearRampToValueAtTime(0.03, ac.currentTime + 0.3); }
    if (!on && uvO) { const o = uvO, g = uvG; uvO = null; g.gain.cancelScheduledValues(ac.currentTime); g.gain.setValueAtTime(g.gain.value, ac.currentTime); g.gain.linearRampToValueAtTime(0, ac.currentTime + 0.3); setTimeout(() => { try { o.stop(); } catch (_) {} }, 500); }
  }
  function note(m, v = 0.08) { if (ac && !muted) bell(hz(m), ac.currentTime, v, 1.4); }
  function mute(m) { muted = m; if (!ac) return; const t = ac.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(m ? 0 : MAX, t + 0.8); if (m) uv(false); }
  function pause(p) { if (!ac) return; if (p) ac.suspend && ac.suspend(); else ac.resume && ac.resume(); }
  return { init, tick, setSong, soft, beep, shimmer, chime, creak, uv, note, mute, pause, get muted() { return muted; }, MELODY, PARTY };
})();
document.addEventListener('visibilitychange', () => Snd.pause(document.hidden));

// ---------- 👻 the 8 friendly ghosts ----------
// spot = where they hide in their room (fx 0..1 across, fz 0..1 back->front, up = pixels above the floor)
const GHOSTS = [
  { id: 'plink', name: 'Plink', room: 0, col: '#e3f2fd', tint: '#90caf9', spot: [0.24, 0.30, 70],
    story: 'Plink hides inside the old piano and plays it at midnight. Plink only knows half a song... Plink hopes Ben can hum the rest!',
    hello: 'Plink! Plonk! You found me in the piano!', hint: 'I hear a soft plink-plonk... is something in the piano?' },
  { id: 'mira', name: 'Mira', room: 1, col: '#fce4ec', tint: '#f48fb1', spot: [0.78, 0.18, 85], mirror: true,
    story: 'Mira is very, very shy. She only shows up in the mirror! She brushes her wispy hair 100 times every night.',
    hello: 'Oh! Um... hi. I\'m Mira. You can only see me in the mirror.', hint: 'Shy ghosts like mirrors. Shine the light on the mirror!' },
  { id: 'topsy', name: 'Topsy', room: 2, col: '#fff8e1', tint: '#ffcc80', spot: [0.70, 0.35, 120], upside: true,

  { id: 'whisker', name: 'Whiskerwisp', room: 3, col: '#e0f7fa', tint: '#80deea', spot: [0.30, 0.55, 30], cat: true,
    story: 'Whiskerwisp is a silvery ghost cat with a curly tail. She chases moonbeams across the attic and purrs so softly it sounds like a whisper.',
    hello: 'Mrrrrow... purrrr. (Whiskerwisp says hi!)', hint: 'I hear a tiny purr near the yarn and old boxes...' },
  { id: 'prof', name: 'Professor Boo', room: 4, col: '#f3e5f5', tint: '#ce93d8', spot: [0.82, 0.25, 90], specs: true,
    story: 'Professor Boo has read every single book in the library, two times! His favorite is a joke book. He reads it upside down to make it funnier.',
    hello: 'Ahem! Professor Boo, at your service. Shhh, this is a library!', hint: 'Maybe someone is reading behind the tall bookshelf?' },
  { id: 'bubbles', name: 'Bubbles', room: 5, col: '#e8f5e9', tint: '#a5d6a7', spot: [0.30, 0.40, 45], bath: true,
    story: 'Bubbles loves bubble baths so much that she lives in the bathtub! She has a rubber duck named Sir Quackers.',
    hello: 'Blub blub! I\'m Bubbles. Want to meet Sir Quackers?', hint: 'The bathtub has lots of bubbles... and maybe a ghost?' },
  { id: 'teeny', name: 'Teeny', room: 6, col: '#fffde7', tint: '#fff59d', spot: [0.74, 0.45, 40], baby: true,
    story: 'Teeny is the littlest ghost in the house. Teeny hides in the toy box and giggles. Teeny\'s first word was "BOO", but it came out "boo-boo-ba!"',
    hello: 'Hee hee hee! Boo-boo-ba! (That means hi!)', hint: 'Did the toy box just giggle?' },
  { id: 'gus', name: 'Big Gus', room: 7, col: '#ede7f6', tint: '#b39ddb', spot: [0.55, 0.20, 95], big: true,
    story: 'Big Gus is the biggest ghost in the house, but he is scared of the dark! He carries a little night-light everywhere he goes.',
    hello: 'Oh phew, it\'s you! I\'m Big Gus. It\'s sooo dark down here...', hint: 'Somebody big is hiding by the old furnace. I think they\'re scared!' },

// the 8 rooms: name, wallpaper, floor, and where they are on the house map (floor row 0 = attic ... 3 = cellar)
const ROOMS = [
  { name: 'Music Room', e: '🎹', wall: '#3b2a4a', pat: '#4a3560', floor: '#4a3020', row: 2, col: 1 },
  { name: 'Bedroom', e: '🪞', wall: '#2f3b52', pat: '#3d4a66', floor: '#4b3325', row: 1, col: 0 },
  { name: 'Kitchen', e: '🍳', wall: '#3a4a3a', pat: '#465a46', floor: '#3d3a36', row: 2, col: 2 },
  { name: 'Attic', e: '🧶', wall: '#4a3a2a', pat: '#56442f', floor: '#5a4027', row: 0, col: 0 },
  { name: 'Library', e: '📚', wall: '#4a2a2a', pat: '#5a3434', floor: '#3e2a1c', row: 2, col: 0 },
  { name: 'Bathroom', e: '🛁', wall: '#2a4a4a', pat: '#365a5a', floor: '#3a4448', row: 1, col: 1 },
  { name: 'Toy Room', e: '🧸', wall: '#4a3a50', pat: '#5a4862', floor: '#4a3428', row: 1, col: 2 },
  { name: 'Cellar', e: '🕯️', wall: '#2e2e36', pat: '#383842', floor: '#2a2622', row: 3, col: 0 },
];

// ---------- 🧹 DUSTY (same look as in the Robo Movie): teal dome, orange stripe, one big green eye, pink duster ----------
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// the 📟 ghost meter Dusty holds: a little box with a needle and a light
function drawMeterSmall(x, y, s, close, t) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  roundRect(-9, -7, 18, 14, 3, '#5d4037'); roundRect(-7, -5, 14, 7, 2, '#fff8e1');
  const a = -2.4 + close * 1.6; ctx.strokeStyle = '#d32f2f'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 2); ctx.lineTo(Math.cos(a) * 6, 2 + Math.sin(a) * 6); ctx.stroke();
  circle(6, 5, 1.6, close > 0.75 ? (t % 20 < 10 ? '#b2ff59' : '#33691e') : '#33691e');
  ctx.restore();
}

// ---------- 👻 drawing a ghost. o = { s, a (see-through 0..1), t, happy, small } ----------
function ghostBody(g, s) {                     // the classic floaty sheet shape with a wavy bottom
  ctx.beginPath(); ctx.moveTo(-28, -40);
  ctx.arc(0, -42, 28, Math.PI, 0);
  ctx.lineTo(28, -6);
  for (let i = 0; i < 4; i++) { const x0 = 28 - i * 14; ctx.quadraticCurveTo(x0 - 7, 6 + Math.sin(s * 0.12 + i * 1.7) * 4, x0 - 14, -4 + Math.sin(s * 0.12 + i) * 2); }
  ctx.closePath();
}
function ghostFace(g, t, o, cx = 0, cy = -42) {
  const shy = g.mirror && !o.happy, look = shy ? 3 : 0, blink = (t % 200) < 7;

    else { eyesInDark(x + w / 2, y + 80, t, i); text('?', x + w / 2, y + 140, 40, '#9575cd'); text(ROOMS[g.room].e + ' ' + ROOMS[g.room].name, x + w / 2, y + h - 14, 16, '#b39ddb'); }
    ctx.strokeStyle = i === jsel ? '#ffd54f' : 'rgba(0,0,0,.2)'; ctx.lineWidth = i === jsel ? 5 : 2; rrect(x, y, w, h, 16); ctx.stroke();
    btns.push({ x, y, w, h, act: 'card' + i });
  });
  if (jopen >= 0) { ghostCard(GHOSTS[jopen], t, '📖 Ghost Journal'); btns = []; button(W / 2 - 90, 474, 180, 44, '✔ OK', 'house', { size: 22 }); }
  else {
    button(10, 8, 130, 44, '🏠 House', 'house', { size: 21 });
    if (allCaught()) button(W - 330, H - 46, 300, 42, '🌙 Release them all!', 'party', { bg: 'rgba(255,64,129,.95)', size: 21 });
  }
  topButtons();
}
// 🎉 the ghost party in the garden, under the moon
function drawParty(t) {
  nightSky(t, lights);
  ctx.fillStyle = lights ? '#558b2f' : '#1b2a1c'; ctx.beginPath(); ctx.moveTo(0, 360); ctx.quadraticCurveTo(480, 330, W, 360); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();
  for (let i = 0; i < 9; i++) ellipse(60 + i * 110, 365, 70, 34, lights ? '#33691e' : '#122014');            // the hedges
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, 150); ctx.quadraticCurveTo(480, 230, W, 150); ctx.stroke();
  const LC = ['#ff8a80', '#ffd180', '#ffff8d', '#b9f6ca', '#80d8ff', '#ea80fc'];
  for (let i = 0; i < 12; i++) { const f = (i + 0.5) / 12, x = f * W, y = 150 + 4 * f * (1 - f) * 80 + 12; glow(x, y + 8, 44, LC[i % 6], 0.5); roundRect(x - 11, y - 4, 22, 26, 9, LC[i % 6]); }  // paper lanterns
  for (let i = 0; i < 16; i++) { const fx = (i * 173 + t * 0.4 * (i % 3 + 1)) % W, fy = 260 + Math.sin(t * 0.02 + i) * 60; twinkle(fx, fy, 3, 0.4 + 0.4 * Math.sin(t * 0.1 + i), '#f4ff81'); }
  // the open jars on a bench
  roundRect(250, 430, 460, 14, 4, '#6d4c41'); roundRect(270, 444, 14, 40, 3, '#5d4037'); roundRect(676, 444, 14, 40, 3, '#5d4037');
  for (let i = 0; i < 8; i++) drawJar(290 + i * 54, 430, 0.62, null, 0.3);
  // the ghosts float out one by one, then dance in a big circle
  GHOSTS.forEach((g, i) => {
    const out = clamp((stT / 60 - i * 0.6) / 2.5, 0, 1); if (out <= 0) return;
    const a = t * 0.012 + i * Math.PI / 4, cx = W / 2 + Math.cos(a) * 300, cy = 235 + Math.sin(a) * 60 + Math.sin(t * 0.06 + i) * 12;
    const sx = 290 + i * 54, sy = 400, k = ease(out);
    drawGhost(g, lerp(sx, cx, k), lerp(sy, cy, k), { a: 0.2 + 0.8 * k, s: lerp(0.2, Math.sin(a) > 0 ? 0.85 : 0.7, k), t, happy: true });
  });
  drawDusty(W / 2, 425, { s: 2.6, t, pose: 'happy' });
  if (stT > 300) { text('🎉 Ghost Party under the moon! 🎉', W / 2, 60, 36, '#fff'); text('All 8 ghosts are friends now. 💜', W / 2, 100, 24, '#ffe082'); }
  else text('Open the jars... 🌙', W / 2, 60, 32, '#e1f5fe');
  button(10, H - 64, 210, 52, '🏠 Back to the house', 'house', { size: 20 });
  topButtons();
}
// ---------- the main loop ----------
let last = 0;
function loop(now) {
  const dt = Math.min(0.05, last ? (now - last) / 1000 : 1 / 60); last = now;
  frame++; stT++; btns = [];
  if (say.t > 0) say.t--;
  Snd.tick();
  if (state === 'room') updateRoom(dt);
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') drawTitle(frame);
  else if (state === 'map') drawMap(frame);
  else if (state === 'room') drawRoom(frame);
  else if (state === 'caught') drawCaught(frame);
  else if (state === 'journal') drawJournal(frame);
  else if (state === 'party') drawParty(frame);
  if (say.t > 0 && (state === 'room' || state === 'map')) {     // Dusty talking
    ctx.save(); ctx.globalAlpha = clamp(say.t / 20, 0, 1);
    const bx = 250, bw = 460, by = 60;
    bubble(bx, by, bw, say.txt, 19);
    drawDusty(bx - 22, by + 62, { s: 1.4, t: frame, pose: 'idle', mouth: true });
    ctx.restore();
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
