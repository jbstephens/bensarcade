<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Cozy Crew Store</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #2e2645; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fff9f3; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #efe6f3; border-bottom: 2px solid #ddd0e6; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #555; white-space: nowrap; overflow: hidden; }
  #url b { color: #8e6cc9; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #8e7cc3, #b9a2df 40%, #f2bcd4 75%, #ffdcbf); color: #fff; flex: none; min-height: 100px; }
  #logo { line-height: 1; flex: none; }
  #logo .big { font-size: 29px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #6a4c93; }
  #logo .big i { color: #fff3c4; font-style: normal; }
  #logo .small { font-size: 15px; color: #fff; margin-top: 4px; text-shadow: 0 1px 0 #6a4c93; }
  #helper { width: 110px; height: 104px; flex: none; }
  #speech { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #who { font-size: 15px; font-weight: 900; color: #fff; text-shadow: 0 1px 0 #6a4c93; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble { position: relative; background: #fff; color: #4a3763; border-radius: 18px; padding: 8px 14px; font-size: 18px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #f3b6cf; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #f3b6cf; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #ffe9a8; color: #6b4a12; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #e2c065; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fffaf0; color: #6b4a12; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #f6eefa; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #6a4c93; box-shadow: 0 4px 0 #d9c7ec; }
  #nav button.on { background: #9b7fd1; color: #fff; box-shadow: 0 4px 0 #6a4c93; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #f48fb1; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #8e4a9e; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f3b6cf; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 14px 30px; }
  /* departments: one row that scrolls sideways */
  .cats { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; }
  .catb { flex: none; font-size: 17px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 12px; background: #fff; color: #6a4c93; box-shadow: 0 4px 0 #d9c7ec; white-space: nowrap; }
  .catb span { display: inline-block; min-width: 22px; border-radius: 12px; background: #f1e8fa; color: #6a4c93; font-size: 13px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #9b7fd1; color: #fff; box-shadow: 0 4px 0 #6a4c93; } .catb.on span { background: #fff; }
  .dept { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #fdeef5, #f1e8fa); border-radius: 16px; padding: 8px 14px; margin-bottom: 12px; color: #6a4c93; }
  .dept canvas { width: 70px; height: 66px; flex: none; }
  .dept b { font-size: 22px; display: block; } .dept small { font-size: 16px; color: #8a6fae; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(106,76,147,.15); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }
  .card.must { border-color: #f7c873; background: #fffaf0; }
  .card.sel { outline: 4px solid #9fd8c0; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #f6eefa; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #5b3f86; line-height: 1.1; }
  .card .from { font-size: 13px; font-weight: bold; color: #c2739a; }
  .card .blurb { font-size: 15px; color: #5f5668; }
  .card .price { font-size: 21px; font-weight: 900; color: #4f8a69; margin: 4px 0; }
  .card .price s { color: #aaa; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #f48fb1; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-5deg); }
  .tag.gold { background: #f7c873; color: #6b4a12; }
  .tag.new { background: #7fc8a9; }
  .rev { font-size: 14px; background: #f8f2fc; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #444; min-height: 44px; }
  .rev .who { font-weight: bold; color: #8a5fb8; }
  .stars { color: #f2b544; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #7fc8a9; color: #fff; box-shadow: 0 4px 0 #579f81; }
  .add.in { background: #d7efe4; color: #2f6b52; box-shadow: 0 4px 0 #a9d8c3; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #f1e8fa; box-shadow: 0 4px 0 #d9c7ec; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(106,76,147,.13); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #5b3f86; }
  .line .nm small { display: block; font-size: 15px; color: #888; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #4f8a69; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #9b7fd1; box-shadow: 0 5px 0 #6a4c93; }
  .bigbtn.green { background: #7fc8a9; box-shadow: 0 5px 0 #579f81; }
  .bigbtn.blue { background: #7fa7d9; box-shadow: 0 5px 0 #5279ad; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #fdecef; color: #b0526b; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #5b3f86; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f3b6cf; border-radius: 14px; padding: 9px 14px; background: #fff; color: #b0527e; }
  .gift.on { background: #f3b6cf; color: #fff; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; background: #fdf3f8; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 19px; font-weight: bold; color: #b0527e; }
  .names button { font-size: 18px; font-weight: bold; border: 0; border-radius: 12px; padding: 8px 12px; background: #fff; color: #8a5fb8; box-shadow: 0 3px 0 #e7cfe0; }
  .names button.on { background: #c9a7e0; color: #fff; box-shadow: 0 3px 0 #8a5fb8; }
  .empty { text-align: center; font-size: 26px; color: #6a4c93; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #6a4c93; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(46,38,69,.94); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(46,38,69,.7); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #f6eefa; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #f6eefa; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #printBox .pbPrint { background: #7fc8a9; } #printBox .pbBack { background: #9b7fd1; }
  #printBox .pbTip { font-size: 20px; color: #6a4c93; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<body>
<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff8a80"></span><span style="background:#ffd180"></span><span style="background:#a5d6a7"></span></div>
    <div id="url">🔒 <b>www.cozy-crew.robo</b></div>
  </div>
  <div id="head">
    <canvas id="helper" width="220" height="208"></canvas>
    <div id="logo"><div class="big">THE <i>COZY</i><br>CREW STORE</div><div class="small">Snuggly paper things to PRINT</div></div>
    <div id="speech"><div id="who">Robo</div><div id="bubble">Welcome to the Cozy Crew Store!</div></div>
    <div id="wallet"><div class="lbl">MY COZY COINS</div><div class="amt" id="amt">1000</div><button id="moreBucks">🪙 Get more</button></div>
  </div>
  <div id="nav">
    <button id="tShop" class="on">🏡 SHOP</button>
    <button id="tCart">🧺 CART<span class="count" id="cCount">0</span></button>
    <button id="tOrders">📦 MY ORDERS</button>
    <button id="deal">🌙 Deal of the Day</button>
  </div>
  <div id="main"></div>
</div>
<div id="ship"><canvas id="shipCv" width="960" height="540"></canvas><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button></div>
<div id="revBox"><div class="in" id="revIn"></div></div>
<script>
// 🌙 THE COZY CREW STORE: Ben's idea! EVERY Robo runs it together, plus Dusty and Sammy.
// Each shopkeeper has a cozy department; the shopkeeper in the header changes to whoever runs it.
// Buy paper cozy things with pretend Cozy Coins, then pick which orders to PRINT. Nothing prints by itself.
// Save: localStorage.cozyCrewStore = { coins, cart:[keys], gift, giftTo, orders:[{k, gift, to, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'cozyCrewStore';
let S = { coins: 1000, cart: [], gift: false, giftTo: 'Mom', orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.coins >= 0)) S.coins = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🤖 THE CHARACTERS: copied exactly from Robo's Surprise Party (robobirthday.html), which copies Robo + Dusty from robomovie.html and the crew from robojump13.html ----------
let ctx = null, frame = 40, beatClock = 0; const beatLen = () => 25; const FLAGS = {};
// ---------- Drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
function pawPrint(x, y, r, col) {                     // a little paw print
  ellipse(x, y + r * 0.25, r * 0.55, r * 0.45, col);
  for (let i = 0; i < 4; i++) { const a = -2.4 + i * 0.53; ellipse(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.75, r * 0.22, r * 0.27, col); }
}
function starPaw(x, y, r, t, a = 1) {                 // Tiger's twinkly star paw print: golden glow + paw
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  glow(x, y, r * 3, 'rgba(255,214,90,.75)', 0.7 + Math.sin(t * 0.08 + x) * 0.2);
  pawPrint(x, y, r, '#ffe27a');
  twinkle(x + r * 0.9, y - r * 0.9, r * 0.5 * (0.7 + 0.3 * Math.sin(t * 0.15 + y)), 1);
  ctx.restore();
}
// =====================================================================
// 🤖 THE CHARACTERS (x, y = between the feet)
// Robo: same look as the Robo Jump games: white round robot, dark visor, blue eyes, blue ear pods, blue legs,
// plus his little antenna. Dusty: Robo's first friend, a tiny cleaning bot. King Gloop: PURPLE goo, gold crown.
// =====================================================================
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)
    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    const lit = pose === 'off' ? 0.25 : 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0);
    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);

function gPanel(x, y, w, h, draw, tabs = '', title) {   // tabs: any of 't r b l'
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip(); draw(x, y, w, h); ctx.restore();
  const T = 30, pts = [[x, y]];
  if (tabs.includes('t')) { tapeTab([[x, y], [x + 20, y - T], [x + w - 20, y - T], [x + w, y]]); pts.push([x + 20, y - T], [x + w - 20, y - T]); } pts.push([x + w, y]);
  if (tabs.includes('r')) { tapeTab([[x + w, y], [x + w + T, y + 20], [x + w + T, y + h - 20], [x + w, y + h]]); pts.push([x + w + T, y + 20], [x + w + T, y + h - 20]); } pts.push([x + w, y + h]);
  if (tabs.includes('b')) { tapeTab([[x, y + h], [x + 20, y + h + T], [x + w - 20, y + h + T], [x + w, y + h]]); pts.push([x + w - 20, y + h + T], [x + 20, y + h + T]); } pts.push([x, y + h]);

    const cols = ['#f8bbd0', '#d1c4e9', '#fff3c4', '#b2ebf2', '#c8e6c9', '#ffe0b2']; for (let i = 0; i < 6; i++) { ctx.fillStyle = cols[i]; ctx.fillRect(bx - 95 + i * 32, by - 240, 32, 240); } ctx.restore();
    ctx.strokeStyle = '#6a4c93'; ctx.lineWidth = 3; ctx.beginPath(); ctx.ellipse(bx, by - 120, 95, 110, 0, 0, 7); ctx.stroke();
    heartP(bx, by - 130, 26, '#fff');
    ctx.strokeStyle = '#8d6e63'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(bx - 60, by - 40); ctx.lineTo(bx - 40, by + 20); ctx.moveTo(bx + 60, by - 40); ctx.lineTo(bx + 40, by + 20); ctx.stroke();
    who('robo', bx - 14, by + 40, 70, { happy: done, wave: true, t: shipT }); who('dusty', bx + 22, by + 40, 48, { happy: true, t: shipT });
    rr(bx - 48, by + 18, 96, 54, 10, '#e8c08f', '#94643c', 3); for (let i = 0; i < 4; i++) rr(bx - 44 + i * 23, by + 26, 20, 10, 4, '#d9a66b');
    for (let i = 0; i < Math.min(shipCount, 6); i++) { const px = bx - 75 + i * 30, py = by + 80 + (i % 2) * 6; ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(bx, by + 72); ctx.lineTo(px + 12, py); ctx.stroke(); rr(px, py, 26, 24, 4, '#ffe0b2', '#c99a6e', 2); ctx.fillStyle = '#f48fb1'; ctx.fillRect(px + 10, py, 6, 24); }
    if (!done) { txt('Floating to you' + '...'.slice(0, 1 + Math.floor(shipT / 15) % 3), 600, 100, 44, '#fff'); rr(440, 140, 320, 22, 11, 'rgba(255,255,255,.3)'); rr(440, 140, Math.max(22, 320 * Math.min(1, shipT / 160)), 22, 11, '#fff3c4'); }
    else {
      for (let i = 0; i < 30; i++) { const a = i * 2.4, d = Math.min(220, (shipT - 160) * (2 + i % 3)); heartP(600 + Math.cos(a) * d, 150 + Math.sin(a) * d * 0.5 + (shipT - 160) * 0.6, 7, ['#f8bbd0', '#fff3c4', '#d1c4e9', '#b2ebf2'][i % 4]); }
      txt('ORDER CONFIRMED!', 610, 104, 52, '#4a3763', 'center', true, 560); txt('ORDER CONFIRMED!', 610, 100, 52, '#fff3c4', 'center', true, 560);
      txt(shipCount + (shipCount === 1 ? ' cozy thing is' : ' cozy things are') + ' in MY ORDERS,', 610, 160, 28, '#fff'); txt('ready to print!', 610, 198, 28, '#fff');
    }
  } finally { ctx = old; frame = oldF; }
  if (shipT > 160 && !shipDone) { shipDone = true; sfx.cash(); say('Order confirmed! Tap PRINT on the cozy things you want.', 'robo'); $('shipGo').style.display = 'block'; }
  if (shipT < 420) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something cozy, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏡 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    if (!P(o.k)) continue;
    const pages = P(o.k).pages.length + (o.gift ? 1 : 0), line = el('div', 'line'); line.appendChild(thumbCanvas(o.k, 150, 110));
    line.appendChild(el('div', 'nm', P(o.k).name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift for ' + (o.to || 'someone') : ''}  •  ${pages} page${pages > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function openPrint(list) {
  closePrint(true);
  const fns = [];
  for (const o of list) { const p = P(o.k); if (!p) continue; if (o.gift) fns.push(() => pageGift(p.name, o.to)); p.pages.forEach(f => fns.push(f)); }
  if (!fns.length) return;
  const sc = fns.length > 24 ? 1 : fns.length > 8 ? 1.15 : 1.5, name = list.length === 1 ? P(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('cozyStore'); say('Printing! Ask a grown-up to help with the printer.', KEEPER); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  Tip: turn on color printing!'));
  document.body.appendChild(printBox);
  for (const f of fns) { const img = new Image(); img.className = 'pbPage'; img.alt = name; img.src = makePage(f, sc).toDataURL('image/png'); printBox.appendChild(img); }
  sfx.click(); say(list.length === 1 ? 'Here it is! Tap PRINT if you want it on paper.' : 'Here are all your cozy things! Tap PRINT when you are ready.', list.length === 1 ? DEPT(P(list[0].k).d).who : 'robo');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 160) closeShip(); else if (view !== 'shop') show('shop'); else if (CAT !== 'all') goDept('all'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 160) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your basket! Tap CHECKOUT when you are ready.' : 'Your basket is empty. Let\'s find something cozy!', 'robo'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!', 'robo'); };
$('moreBucks').onclick = moreCoins;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).d !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price!', DEPT(P(DEAL).d).who);
};
$('deal').textContent = '🌙 Deal: ' + P(DEAL).name;
setKeeper('robo');
render();
requestAnimationFrame(drawHelper);
if (talkT === 0) $('bubble').textContent = S.orders.length ? 'Welcome back, Ben! Your cozy orders are in MY ORDERS.' : 'Welcome to the Cozy Crew Store, Ben! All my friends run a cozy shop in here.';
</script>
