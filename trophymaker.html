<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🏅 Trophy &amp; Medal Maker</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #fff4c2 0 36px, #ffe0b8 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #ffd740; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #c77800; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-cer { background: #ffd740; font-size: 22px; } .b-spin { background: #ffd54f; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🏅 the designer ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #boxPrev { flex: 1; min-height: 0; background: radial-gradient(circle at 50% 35%, #fffdf0, #ffe9a8); border: 5px solid #333; border-radius: 20px;
    box-shadow: 0 6px 0 #c77800; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; position: relative; }
  #boxPrev svg { width: 100%; height: 100%; display: block; }
  #prevFlip { position: absolute; right: 8px; bottom: 8px; font-size: 15px; background: #fff6d6; border: 3px solid #333; border-radius: 12px; padding: 2px 8px; pointer-events: none; }
  #invName { font-size: clamp(16px, 2.1vw, 24px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 21px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 70px; height: 70px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .dateRow { display: grid; grid-template-columns: 64px 1fr 64px; gap: 8px; align-items: center; text-align: center; font-size: 22px; font-weight: bold; }
  .dateRow .btn { min-height: 52px; }
  #invHelp { font-size: 15px; text-align: center; color: #555; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #c77800; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #c77800; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 🏆 awards ceremony ---------- */
  #cer { flex-direction: row; gap: 10px; padding: 10px; background: radial-gradient(ellipse at 50% 0%, #4a2a7a, #1a1030 75%); }
  #cerLeft { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #stage { flex: 1; min-height: 0; border: 5px solid #ffd740; border-radius: 20px; overflow: hidden; background: #22143d; position: relative; }
  #stage svg { width: 100%; height: 100%; display: block; }
  #cerSay { font-size: clamp(18px, 2.6vw, 30px); font-weight: bold; text-align: center; background: #fff; border: 5px solid #333; border-radius: 22px; padding: 6px 12px; min-height: 56px; }
  #cerRight { width: min(40vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .panel { background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .panel h3 { margin: 0; text-align: center; font-size: 19px; }
  .names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
  .names .btn { min-height: 44px; font-size: 15px; padding: 2px; }
  .pRow { display: grid; grid-template-columns: 54px 50px 1fr 50px; gap: 5px; align-items: center; font-weight: bold; font-size: 18px; text-align: center; }
  .pRow .btn { min-height: 44px; padding: 2px; }
  .b-ann { background: linear-gradient(90deg, #ffd740, #ff9800); font-size: 24px; }
  .b-clap { background: #ffab91; } .b-music { background: #b39ddb; } .b-pod { background: #80deea; font-size: 21px; }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 40; overflow: hidden; }
  .cf { position: absolute; top: -30px; width: 12px; height: 18px; border-radius: 3px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  #stage svg g.pop { animation: pop .6s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  #stage svg g.spot { animation: spot 1.2s ease-in-out infinite alternate; }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes spot { from { opacity: .55; } to { opacity: .9; } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view, #cer { flex-direction: column; }
    #invLeft { width: 100%; height: 42vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side, #cerRight { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 52px; height: 52px; } }
  /* ---------- PRINT: only the sheet (or the whole set), at real size ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.25in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #confetti { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 8in; height: 10in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🏅 TROPHY MAKER</h1>
    <div id="boxPrev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-cer" id="bCer">🏆 Ceremony!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>

  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Designer</button>
    <h1 class="big">🖨️ PRINT &amp; MAKE</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. REAL SIZE: print at 100%. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="cer" class="screen">
  <div id="cerLeft">
    <div id="stage"></div>
    <div id="cerSay"></div>
  </div>
  <div id="cerRight">
    <button class="btn b-back" id="bCerBack">⬅️ Designer</button>
    <div class="panel" id="annPanel"></div>
    <div class="panel" id="podPanel"></div>
    <div class="two">
      <button class="btn b-clap" id="bClap">👏 Applause!</button>
      <button class="btn b-music" id="bMusic">🎵 Music</button>
    </div>
  </div>
</div>
<div id="confetti"></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🏅 TROPHY & MEDAL MAKER: design a REAL-SIZE paper trophy (cup with handles, star, or Robo on top) or wearable medals
// with buttons, hold an 🏆 Awards Ceremony for family game night (drum roll, announcer, fanfare, confetti, podium),
// then print: the trophy (3 pages), medals (3 per page) + ribbon strips, blanks, certificates and a ceremony program.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000, printed at exactly 8in x 10in: 100 units = 1 inch.
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from the Paper Camera.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function renderStage() { if (typeof document !== 'undefined' && $('stage')) $('stage').innerHTML = mini(stageArt, '0 0 800 500'); }

const PENS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222'];
const BORDER = 5;
