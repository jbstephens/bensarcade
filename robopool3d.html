<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Robo's Basement Pool</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="touchpad.js?v=11"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1a10; font-family: 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif; color: #fff;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: none; }

  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .ui { position: fixed; z-index: 10; pointer-events: none; text-shadow: 0 2px 0 rgba(0,0,0,.55); }

    padding: 7px 12px; cursor: pointer; touch-action: manipulation; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .btn:active { transform: translateY(2px); }
  .btn.on { background: linear-gradient(#66bb6a, #2e7d32); }
  #players { top: calc(8px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .pl { background: rgba(30,20,10,.72); border: 3px solid rgba(255,255,255,.3); border-radius: 18px; padding: 5px 12px; display: flex; align-items: center; gap: 8px;
    min-width: 160px; transition: .25s; }
  .pl.act { border-color: #ffd54f; background: rgba(125,80,10,.88); box-shadow: 0 0 18px #ffd54f; }
  .pl img, .pl .emo { width: 46px; height: 46px; border-radius: 50%; background: #fff2; font-size: 34px; display: flex; align-items: center; justify-content: center; }
  .pl .nm { font-size: 18px; font-weight: bold; }
  .pl .grp { font-size: 14px; color: #ffe9b0; }
  .pl .left { display: flex; gap: 2px; margin-top: 3px; min-height: 14px; }
  .mini { width: 14px; height: 14px; border-radius: 50%; display: inline-block; border: 1px solid #0007; box-sizing: border-box; }
  #msg { left: 0; right: 0; top: 19%; text-align: center; font-size: clamp(26px, 5vw, 46px); font-weight: bold; color: #ffeb3b; opacity: 0; transition: opacity .3s; padding: 0 70px; }
  #say { top: calc(84px + env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); background: #fffbe8; color: #4a2a10; text-shadow: none; border: 3px solid #ffb74d;
    border-radius: 18px; padding: 6px 14px; font-size: 19px; max-width: 70vw; text-align: center; opacity: 0; transition: opacity .3s; }
  #hint { left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); font-size: 17px; background: rgba(30,20,10,.62); border-radius: 14px;
    padding: 5px 12px; text-align: center; max-width: 62vw; }
  #tools { left: 10px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
  #powerWrap { right: 12px; top: 54%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 8px; }
  #power { pointer-events: auto; width: 66px; height: min(44vh, 290px); border-radius: 33px; border: 4px solid #ffe0a0; background: rgba(30,20,10,.75); position: relative;
    overflow: hidden; touch-action: none; cursor: pointer; }
  #powerFill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: linear-gradient(0deg, #66bb6a, #ffeb3b 60%, #ff7043); }
  #powerLbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; writing-mode: vertical-rl; font-size: 17px; font-weight: bold; }
  #nudge { display: flex; gap: 6px; }
  #nudge .btn { font-size: 24px; padding: 6px 12px; }
  #ready { left: 50%; transform: translateX(-50%); bottom: calc(56px + env(safe-area-inset-bottom)); }
  #ready .btn { font-size: 26px; padding: 10px 24px; background: linear-gradient(#66bb6a, #2e7d32); }
  .screen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px;
    padding: 16px; box-sizing: border-box; overflow-y: auto; }
  .dim { background: rgba(25,12,5,.74); }
  .screen h1 { font-size: clamp(40px, 8vw, 84px); margin: 0; color: #ffe082; text-shadow: 0 5px 0 #8d4a12, 0 10px 18px rgba(0,0,0,.55); line-height: 1.05; }
  .screen h1 small { display: block; font-size: .36em; color: #c8f7c5; text-shadow: 0 3px 0 #1b5e20; margin-top: 8px; }
  .screen h2 { font-size: clamp(28px, 5vw, 44px); margin: 0; color: #ffe082; text-shadow: 0 4px 0 #8d4a12; }
  .screen p { font-size: 20px; margin: 0; max-width: 760px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .big { font-size: 25px; padding: 12px 22px; border-radius: 22px; background: linear-gradient(#ffb74d, #d84315); border: 4px solid #fff3d0; }
  .big.green { background: linear-gradient(#81c784, #2e7d32); }
  .big.blue { background: linear-gradient(#64b5f6, #1565c0); }
  .big.purple { background: linear-gradient(#ba68c8, #6a1b9a); }
  .cards { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; max-width: 920px; }
  .card { pointer-events: auto; cursor: pointer; width: 196px; background: rgba(255,248,230,.96); color: #4a2a10; border: 4px solid #ffb74d; border-radius: 22px; padding: 10px;
    text-shadow: none; box-sizing: border-box; }
  .card:active { transform: scale(.97); }
  .card img { width: 92px; height: 92px; border-radius: 50%; }
  .card b { display: block; font-size: 21px; }
  .card .lvl { font-size: 15px; color: #a0522d; }
  .card .ln { font-size: 15px; margin-top: 4px; }
  .card .wins { font-size: 14px; color: #2e7d32; margin-top: 4px; }
  .card .stars { font-size: 24px; letter-spacing: 2px; }

  .tro { width: 180px; background: #fff8; color: #3e2410; text-shadow: none; border-radius: 14px; padding: 8px; font-size: 15px; }
  .tro .ic { font-size: 50px; }
  .tro.off .ic { filter: grayscale(1) brightness(.6); opacity: .5; }
  .credit { font-size: 18px; color: #ffe9b0; }

  @media (max-width: 700px) { .pl { min-width: 0; padding: 4px 8px; } .pl .nm { font-size: 15px; } .pl img, .pl .emo { width: 36px; height: 36px; font-size: 26px; }
    .btn { font-size: 16px; padding: 6px 9px; } #hint { font-size: 14px; } }

<body>
<canvas id="game"></canvas>
<div id="flash"></div>
<div id="hud" hidden>
  <div id="players" class="ui"><div class="pl" id="pl0"></div><div class="pl" id="pl1"></div></div>
  <div id="say" class="ui"></div>
  <div id="msg" class="ui"></div>
  <div id="hint" class="ui"></div>

    <button class="btn" id="spinBtn">🌀 Spin: none</button>
    <button class="btn" id="musicBtn">🎵 Music: ON</button>
    <button class="btn" id="menuBtn">☰ Menu</button>
  </div>

    <div id="power"><div id="powerFill"></div><div id="powerLbl">HOLD, LET GO!</div></div>
    <div id="nudge"><button class="btn" id="nudL">◀</button><button class="btn" id="nudR">▶</button></div>
  </div>
  <div id="ready" class="ui" hidden><button class="btn" id="readyBtn">✅ Ready!</button></div>
</div>
<div id="title" class="screen">
  <h1>🎱 Robo's Basement Pool<small>Grab a cue! It's pool night in the basement!</small></h1>
  <div class="row">
    <button class="btn big" id="bCpu">🤖 vs Computer</button>
    <button class="btn big blue" id="bTwo">👫 2 Players</button>
    <button class="btn big green" id="bTrick">🎯 Trick Shots</button>
    <button class="btn big purple" id="bShelf">🏆 Trophy Shelf</button>
  </div>
  <p>Drag to aim. Pull back from the white ball (or hold the power bar), then let go to shoot!</p>
  <p class="credit">💡 Robo's Basement Pool is Ben's idea!</p>
  <div class="row"><button class="btn" id="tMusic">🎵 Music: ON</button></div>
</div>
<div id="pick" class="screen dim" hidden><h2>Who do you want to play?</h2><div class="cards" id="oppCards"></div><button class="btn big" data-back>⬅ Back</button></div>
<div id="tricks" class="screen dim" hidden><h2>🎯 Trick Shots</h2><p id="trickTotal"></p><div class="cards" id="trickCards"></div><button class="btn big" data-back>⬅ Back</button></div>
<div id="shelfScr" class="screen dim" hidden><h2>🏆 Trophy Shelf</h2><div class="shelf" id="shelf"></div><p id="shelfStats"></p><button class="btn big" data-back>⬅ Back</button></div>
<div id="pause" class="screen dim" hidden><h2>☰ Paused</h2><div class="row">
  <button class="btn big green" id="pResume">▶ Keep Playing</button><button class="btn big blue" id="pRestart">🔄 Start Over</button><button class="btn big" id="pQuit">🏠 Main Menu</button></div></div>
<div id="over" class="screen dim" hidden><h2 id="overT"></h2><p id="overP"></p><div class="row">
  <button class="btn big green" id="oAgain">🔄 Play Again</button><button class="btn big" id="oMenu">🏠 Main Menu</button></div></div>
<script>
// ROBO'S BASEMENT POOL  (💡 Ben's idea: a 3D pool game, like the real pool table in Ben's basement!)
// A cozy basement game room: wood walls, a rug, a hanging lamp over the table, a dartboard, a mini fridge, a couch and Game Factory posters.
// Eight-ball vs Baby Gloop, Sammy, Robo or King Gloop, 2 players on one iPad, or trick shots for stars. Gentle sounds only.
const $ = id => document.getElementById(id);
const JB = window.JUKEBOX || null;                 // 🎶 the book's Jukebox (music only)
const SAVE_KEY = 'roboPool';
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function hasTrophy(id) { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}')[id]; } catch (_) { return false; } }
function freshSave() { return { v: 1, wins: { baby: 0, sammy: 0, robo: 0, king: 0 }, games: 0, two: 0, stars: {}, helper: true, music: true, view: 'top', spinTip: false }; }
let SV = freshSave();
try {
  const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
  if (s && s.v === 1) SV = Object.assign(freshSave(), s, { wins: Object.assign(freshSave().wins, s.wins || {}), stars: Object.assign({}, s.stars || {}) });
} catch (_) {}
function save() { if (JB) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(SV)); } catch (_) {} }

// ---------- sound: soft clicks, a gentle plop and a cozy tune. Everything goes through ONE quiet master volume (0.15) ----------
let actx = null, master = null, musicBus = null, noiseBuf = null;
let musicOn = SV.music !== false;
function wakeAudio() {
  if (!actx) {
    try {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0.15;
      const comp = actx.createDynamicsCompressor(); comp.threshold.value = -20; comp.ratio.value = 4;
      master.connect(comp); comp.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = 0.5; musicBus.connect(master);
    } catch (_) { actx = null; }
  }
  if (actx && actx.state !== 'running') try { actx.resume(); } catch (_) {}
}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const aNow = () => (actx ? actx.currentTime : 0);
function tone(f, at, dur, type, vol, slide, bus) {
  if (!actx || actx.state !== 'running') return;
  const t = Math.max(at, actx.currentTime), o = actx.createOscillator(), g = actx.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  o.connect(g); g.connect(bus || master); o.start(t); o.stop(t + dur + 0.03);
}
function hiss(at, dur, vol, freq, bus) {
  if (!actx || actx.state !== 'running') return;
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const t = Math.max(at, actx.currentTime), s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'bandpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0005, t + dur);
  s.connect(f); f.connect(g); g.connect(bus || master); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
}
let lastClick = 0, lastThud = 0;
const sfx = {
  click(v) {                                        // two balls touching: a soft "tock", quieter for slow taps
    const n = performance.now(), a = Math.min(1, v / 3); if (a < 0.03 || n - lastClick < 25) return; lastClick = n;
    const t = aNow(); tone(2300 + Math.random() * 500, t, 0.05, 'sine', 0.3 * a); tone(1150, t, 0.035, 'triangle', 0.12 * a);
  },
  cushion(v) { const n = performance.now(), a = Math.min(1, v / 3); if (a < 0.06 || n - lastThud < 40) return; lastThud = n; tone(150, aNow(), 0.12, 'sine', 0.28 * a, 105); },
  plop() {                                          // a gentle pocket "plop" and a tiny rattle
    const t = aNow(); tone(340, t, 0.22, 'sine', 0.32, 150); tone(210, t + 0.1, 0.2, 'sine', 0.18, 120);
    [0.24, 0.31, 0.37].forEach((d, i) => tone(620 - i * 60, t + d, 0.04, 'triangle', 0.05));
  },
  cue(p) { const t = aNow(); tone(880, t, 0.045, 'triangle', 0.16 + 0.18 * p); hiss(t, 0.03, 0.06, 2600); },
  chime() { const t = aNow(); [72, 76, 79, 84].forEach((m, i) => tone(mf(m), t + i * 0.13, 0.9, 'sine', 0.2)); },
  star() { const t = aNow(); [84, 88, 91].forEach((m, i) => tone(mf(m), t + i * 0.09, 0.5, 'sine', 0.14)); },
  oops() { const t = aNow(); tone(392, t, 0.3, 'sine', 0.16, 349); tone(330, t + 0.28, 0.45, 'sine', 0.16, 262); },
  tap() { tone(660, aNow(), 0.07, 'sine', 0.12); },
};
// ---------- 🎶 the music: soft electric piano, walking bass and brushes. Two songs (?song=lounge / ?song=chalk) ----------
const Q = { M: [0, 4, 7, 11], m: [0, 3, 7, 10], d: [0, 4, 7, 10] };
const SONGS = {
  // 🛋️ BASEMENT LOUNGE: slow and swingy, like a cozy pool night (C major)
  lounge: { bpm: 84, ch: [[48, 'M'], [45, 'm'], [50, 'm'], [43, 'd'], [52, 'm'], [45, 'd'], [50, 'm'], [43, 'd']],
    mel: [[[76, 1.5], [79, .5], [76, 1], [74, 1]], [[72, 2], [69, 1], [72, 1]], [[74, 1.5], [77, .5], [76, 1], [74, 1]], [[71, 3], [0, 1]],
      [[71, 1.5], [74, .5], [79, 1], [76, 1]], [[73, 2], [76, 1], [79, 1]], [[77, 1.5], [76, .5], [74, 1], [72, 1]], [[74, 2], [71, 1], [67, 1]]] },
  // 🎯 CHALK AND CHILL: a light bossa for practicing trick shots (F major)
  chalk: { bpm: 96, ch: [[53, 'M'], [50, 'm'], [55, 'm'], [48, 'd'], [57, 'm'], [50, 'd'], [55, 'm'], [48, 'd']],
    mel: [[[72, 1], [69, 1], [76, 1.5], [74, .5]], [[72, 2], [69, 1], [65, 1]], [[70, 1], [74, 1], [77, 1.5], [76, .5]], [[74, 2], [72, 2]],
      [[72, 1], [76, 1], [79, 1], [76, 1]], [[78, 2], [74, 1], [72, 1]], [[70, 1.5], [74, .5], [77, 1], [74, 1]], [[72, 3], [0, 1]]] },
};
const SONG_REQ = (JB && JB.song) || (/[?&]song=([a-z]+)/.exec(location.search) || [])[1] || '';
let song = null, songBar = 0, nextBarT = 0;
function setSong(id) {
  if (SONG_REQ && SONGS[SONG_REQ]) id = SONG_REQ;
  if (!SONGS[id] || song === id) return;
  song = id; songBar = 0; nextBarT = 0;
}
function ep(m, t, dur, vol) { tone(mf(m), t, dur, 'sine', vol, null, musicBus); tone(mf(m) * 2, t, dur * 0.5, 'sine', vol * 0.18, null, musicBus); }
function scheduleBar(S, bar, t) {
  const b = 60 / S.bpm, [r, q] = S.ch[bar % 8], nx = S.ch[(bar + 1) % 8][0], iv = Q[q];
  const voice = iv.map(i => r + 12 + i);
  voice.forEach(m => ep(m, t, b * 2.4, 0.05));                                    // the chord, soft and long
  voice.slice(1).forEach(m => ep(m, t + b * 1.66, b * 0.6, 0.03));                // a little swing stab
  voice.slice(1).forEach(m => ep(m, t + b * 3, b * 0.7, 0.025));
  [r - 12, r - 12 + iv[1], r - 12 + 7, nx - 13].forEach((m, i) => {               // walking bass
    tone(mf(m), t + i * b, b * 0.9, 'sine', 0.2, null, musicBus); tone(mf(m) * 2, t + i * b, b * 0.3, 'triangle', 0.03, null, musicBus);
  });
  [1, 3].forEach(i => hiss(t + i * b, b * 0.5, 0.025, 3200, musicBus));            // brushes
  hiss(t + 1.66 * b, b * 0.2, 0.012, 5000, musicBus); hiss(t + 3.66 * b, b * 0.2, 0.012, 5000, musicBus);
  if (Math.floor(bar / 8) % 3 === 2) return;                                     // every third time round: just the band
  let at = 0;
  for (const [m, len] of S.mel[bar % 8]) {
    const tt = t + at * b * (at % 1 ? 1.08 : 1);                                  // a lazy swing on the off-beats
    if (m) { tone(mf(m), tt, Math.min(len * b * 1.1, 1.4), 'sine', 0.1, null, musicBus); tone(mf(m) * 4, tt, 0.25, 'sine', 0.012, null, musicBus); }
    at += len;
  }
}
function musicTick() {
  if (!actx || !musicBus || !musicOn || !song || actx.state !== 'running') return;
  const S = SONGS[song];
  if (nextBarT < actx.currentTime) nextBarT = actx.currentTime + 0.08;
  while (nextBarT < actx.currentTime + 0.4) { scheduleBar(S, songBar, nextBarT); nextBarT += 4 * 60 / S.bpm; songBar++; }
}
// ---------- THE TABLE: real 8-foot table sizes in meters. x = the long way, z = the short way, the felt is at y = 0 ----------
const L = 2.24, W = 1.12, R = 0.0286, HX = L / 2, HZ = W / 2, D2 = 4 * R * R;
const DT = 1 / 120;                          // physics runs 120 steps a second, with extra mini-steps for fast balls (no tunneling)
const MU_C = 0.17, MU_K = 0.40;              // rolling friction: a steady slow-down plus a speedy-ball slow-down
const E_BALL = 0.94, E_CUSH = 0.76;          // bounciness: ball on ball, ball on cushion
const MAX_SPEED = 4.6, BREAK_SPEED = 5.2;
const CG = 0.08, SG = 0.066;                 // the cushions stop this far from a corner / side pocket (the pocket mouths)
const POCKETS = [
  { x: -HX - 0.02, z: -HZ - 0.02, r: 0.066 }, { x: 0, z: -HZ - 0.036, r: 0.062 }, { x: HX + 0.02, z: -HZ - 0.02, r: 0.066 },
  { x: -HX - 0.02, z: HZ + 0.02, r: 0.066 }, { x: 0, z: HZ + 0.036, r: 0.062 }, { x: HX + 0.02, z: HZ + 0.02, r: 0.066 }];
const SEGS = [];                             // the cushion edges (and the angled pocket jaws) that balls bounce off
function seg(ax, az, bx, bz) { SEGS.push({ ax, az, bx, bz, dx: bx - ax, dz: bz - az, len2: (bx - ax) ** 2 + (bz - az) ** 2 }); }
for (const s of [-1, 1]) {
  seg(-HX + CG, s * HZ, -SG, s * HZ); seg(SG, s * HZ, HX - CG, s * HZ);                              // long cushions
  seg(-HX + CG, s * HZ, -HX + CG - 0.032, s * (HZ + 0.05)); seg(HX - CG, s * HZ, HX - CG + 0.032, s * (HZ + 0.05));   // corner jaws
  seg(-SG, s * HZ, -SG + 0.012, s * (HZ + 0.05)); seg(SG, s * HZ, SG - 0.012, s * (HZ + 0.05));     // side pocket jaws
  seg(s * HX, -HZ + CG, s * HX, HZ - CG);                                                            // short cushions
  seg(s * HX, -HZ + CG, s * (HX + 0.05), -HZ + CG - 0.032); seg(s * HX, HZ - CG, s * (HX + 0.05), HZ - CG + 0.032);
}
const groupOf = n => (n === 0 ? 'cue' : n < 8 ? 'solid' : n === 8 ? 'eight' : 'stripe');
function mkBall(n, x, z) { return { n, x, z, vx: 0, vz: 0, on: true }; }
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function rackBalls() {                       // the triangle: 1 in front, 8 in the middle, a solid and a stripe in the back corners
  const B = [mkBall(0, -HX / 2, 0)];
  const sol = shuffle([2, 3, 4, 5, 6, 7]), str = shuffle([9, 10, 11, 12, 13, 14, 15]);
  let c1 = sol.pop(), c2 = str.pop(); if (Math.random() < 0.5) [c1, c2] = [c2, c1];
  const rest = shuffle(sol.concat(str));

  musicTick();
  renderer.render(scene, camera);
}
function resize() { const w = innerWidth, h = innerHeight; renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = w / h < 0.95 ? 62 : 50; camera.updateProjectionMatrix(); camSnap = true; }
addEventListener('resize', resize); resize();
let lastT = performance.now();
function loop(now) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, Math.max(0, (now - lastT) / 1000)); lastT = now;
  if (JB) { if (JB.started) { wakeAudio(); setSong(SONG_REQ || 'lounge'); musicTick(); } return; }   // 🎶 Jukebox: music only
  try { frame(dt); } catch (err) { console.error(err); }
}
addEventListener('pointerdown', () => { wakeAudio(); if (!song) setSong('lounge'); }, true);
$('viewBtn').textContent = '📷 View: ' + (st.view === 'top' ? 'Top' : 'Cue');
$('helpBtn').textContent = '🎯 Helper: ' + (st.helper ? 'ON' : 'OFF'); $('helpBtn').classList.toggle('on', st.helper);
for (const id of ['musicBtn', 'tMusic']) $(id).textContent = '🎵 Music: ' + (musicOn ? 'ON' : 'OFF');
if (!JB) { goTitle(); requestAnimationFrame(loop); } else requestAnimationFrame(loop);
</script>
