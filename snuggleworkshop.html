<script>
// 🧸 THE SNUGGLE WORKSHOP: a cozy toy workshop by a snowy window, with a warm lamp and shelves of yarn and fabric.
// Make your own plushie (Robo, Sammy, Dusty or Baby Gloop): pick fabric, pick button eyes, trace the stitches, tap in the
// stuffing, add a heart patch, then tap-and-hold to hug it. Plushies go on the shelf and snuggle in the basket.
// Robo's comfort talk, a breathing yarn ball, and a printable "I love you, Mom!" card.
// All sound is VERY soft (master volume 0.1, slow fades). Trophy 'snuggleWorkshop' after making a plushie and hugging it.
// Save: localStorage.snuggleWorkshop. Music for the book's Jukebox: snuggleworkshop.html?song=musicbox (or window.JUKEBOX.song)
const C = document.getElementById('c'), W = 960, H = 540;
let ctx = C.getContext('2d'), frame = 0;

// ---------- VERY soft sounds: one master knob (0.1), everything fades in and out slowly ----------
const MASTER = 0.1;
let actx = null, master = null, musBus = null, sfx = null, soundOn = true, musicOn = true;
function audio() {

    if (!actx) {

      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
      musBus = actx.createGain(); musBus.gain.value = 0; musBus.connect(master);

    const speaking = window.speechSynthesis && speechSynthesis.speaking;

  } catch (_) {}

function softNote(f, d = 1, v = 0.12, when = 0, bus = sfx) {   // a round, gentle bell

  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();

const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.9, 0.1); }
function chime() { softNote(784, 1.6, 0.09); softNote(1175, 1.8, 0.05, 0.08); }

let noiseBuf = null;
function noise() {

}
let stitchN = 0;
function stitchSound() { puff(1800, 0.12, 0.12); softNote([659, 784, 880, 784][stitchN++ % 4], 0.35, 0.035); }
function squish() { puff(380, 0.6, 0.35); softNote(330, 0.5, 0.05); softNote(262, 0.7, 0.04, 0.12); }
// 🗣️ the gentle voice (slow and soft). The music gets quieter while someone talks.
function speak(line, rate = 0.8, pitch = 1.05) {

    if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’:-]/g, '').replace(/\s+/g, ' ').trim());
    u.rate = rate; u.pitch = pitch; u.volume = 0.7; u.onend = fadeAll; speechSynthesis.speak(u); setTimeout(fadeAll, 150);
  } catch (_) {}
}
function hush() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (_) {} setTimeout(fadeAll, 100); }
// 🎶 "Snowy Workshop Music Box": an original, slow music-box tune in F (4/4). Plays VERY quietly. Loops every ~35 seconds.
const TUNE = [[72, 1], [77, 1], [81, 1], [79, 1], [77, 2], [72, 2], [74, 1], [76, 1], [77, 1], [74, 1], [72, 4],
  [70, 1], [74, 1], [77, 1], [76, 1], [74, 2], [70, 2], [72, 1], [74, 1], [76, 1], [77, 1], [79, 4],
  [81, 1], [84, 1], [82, 1], [81, 1], [79, 2], [77, 2], [76, 1], [77, 1], [79, 1], [76, 1], [74, 4],
  [70, 1], [74, 1], [77, 1], [74, 1], [72, 2], [76, 2], [79, 1], [76, 1], [74, 1], [76, 1], [77, 4]];
const TUNE_BASS = [41, 41, 43, 48, 46, 46, 48, 48, 41, 43, 48, 50, 46, 48, 48, 41];
const BEAT = 0.55, TUNE_BEATS = 64;
const TUNE_EV = (() => { const ev = []; let b = 0;
  TUNE.forEach(([m, d]) => { ev.push({ b, m, d: 2.2, v: 0.2, box: 1 }); b += d; });
  TUNE_BASS.forEach((m, bar) => { ev.push({ b: bar * 4, m, d: 2.4, v: 0.12 }); ev.push({ b: bar * 4 + 2, m: m + 19, d: 1.4, v: 0.03 }); });
  return ev.sort((a, c) => a.b - c.b); })();
const mus = { timer: null, t0: null, k: 0, loop: 0, last: 0 };
function boxNote(e, t) {   // a music-box "ting": a sine with a small, quick-fading sparkle above it
  try {
    const f = 440 * Math.pow(2, (e.m - 69) / 12), o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(e.v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + e.d);
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + e.d + 0.05);

  mus.last = now;

    const e = TUNE_EV[mus.k], t = mus.t0 + (mus.loop * TUNE_BEATS + e.b) * BEAT;

function startMusic() { if (!mus.timer) mus.timer = setInterval(musicTick, 100); fadeAll(); }
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || (/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '';
// ---------- save + trophy ----------

try { Object.assign(save, JSON.parse(localStorage.getItem('snuggleWorkshop') || '{}')); } catch (_) {}
if (!Array.isArray(save.shelf)) save.shelf = [];
function store() { try { localStorage.setItem('snuggleWorkshop', JSON.stringify(save)); } catch (_) {} }
let toast = '', toastT = 0;
function checkTrophy() {
  if (save.trophy || save.made < 1 || save.hugs < 1) return;
  save.trophy = true; trophy('snuggleWorkshop'); store(); toast = '🏆 You earned the Snuggle Workshop trophy! 💛'; toastT = 360;

// ---------- 🧵 fabrics (soft patterns on each friend's own colors) + 🔘 button eyes ----------
const FABRICS = [['fleece', 'Fleece'], ['dots', 'Polka dots'], ['stars', 'Stars'], ['stripes', 'Stripes'], ['hearts', 'Hearts'], ['checks', 'Checks']];

const patCache = {};
function fabricPat(kind, col) {   // a little repeating 36×36 tile, made once

  else if (kind === 'stars') { for (const [x, y, r] of [[10, 10, 6], [27, 26, 4.5]]) { q.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; q.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); } q.fill(); } }

  text("🤖 Robo's Comfort Talk", 22, 30, 26, '#fff3dc', 'left');

// ---------- 🧶 THE BREATHING YARN BALL: it slowly grows (breathe in) and shrinks (breathe out) ----------
const breath = { t: 0 };
const BREATH_LEN = 480;   // frames per breath (4 s in + 4 s out)
function swell(f, d, v) { if (!running()) return; const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + d * 0.5); g.gain.linearRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(sfx); o.start(t); o.stop(t + d + 0.1); }
function openBreath() { scr = 'breath'; breath.t = 0; save.breaths++; store(); hush(); }
function updateBreath() {
  const t = breath.t++, k = t % BREATH_LEN;
  if (t >= BREATH_LEN * 3) { if (t === BREATH_LEN * 3) speak('Lovely breathing, Ben. You are calm and cozy.', 0.75); return; }
  if (k === 0) { speak('Breathe in', 0.7); swell(262, 4, 0.1); swell(392, 4, 0.05); }
  if (k === 240) { speak('Breathe out', 0.7); swell(330, 4, 0.08); swell(196, 4, 0.06); }
}
function drawBreathRoom() {
  ctx.drawImage(bg, 0, 0); drawWindow();
  ctx.save(); ctx.globalAlpha = 0.7; ctx.fillStyle = '#2a1a22'; ctx.fillRect(0, 0, W, H); ctx.restore();
  text('🧶 Breathe with the Yarn Ball', 22, 30, 26, '#fff3dc', 'left');
  const t = breath.t, k = t % BREATH_LEN, done = t >= BREATH_LEN * 3;
  const grow = done ? 0.5 : k < 240 ? (1 - Math.cos(k / 240 * Math.PI)) / 2 : (1 + Math.cos((k - 240) / 240 * Math.PI)) / 2;
  const r = 60 + grow * 70;
  glow(W / 2, 250, r * 2.3, 'rgba(255,170,200,.55)', 0.4 + grow * 0.4);
  ctx.strokeStyle = '#ff8fab'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(W / 2 + r * 0.7, 250 + r * 0.7);   // the loose yarn tail
  ctx.bezierCurveTo(W / 2 + r + 40, 250 + r + 30, W / 2 + 140, 420, W / 2 + 260, 400 + Math.sin(frame * 0.03) * 8); ctx.stroke();
  ctx.save(); ctx.translate(W / 2, 250); ctx.rotate(Math.sin(t * 0.004) * 0.3); yarnBall(0, 0, r, '#ff8fab'); ctx.restore();
  drawRobo(180, 470, { s: 3 + grow * 0.15, happy: done });
  if (done) text('💛 Lovely breathing, Ben! 💛', W / 2, 440, 32, '#ffe9b8');
  else {
    const n = Math.floor((k % 240) / 60) + 1;
    text(k < 240 ? '🌬️ Breathe in...  ' + n : '😌 Breathe out...  ' + n, W / 2, 432, 34, '#ffe9b8');
    text('Breath ' + (Math.floor(t / BREATH_LEN) + 1) + ' of 3', W / 2, 474, 18, 'rgba(255,233,184,.7)', 'center', false);
  }
  if (done) button(W / 2 - 100, 480, 200, 46, '🧶 Again', '#ffb3c6', openBreath, 19);
  button(W - 140, 470, 120, 46, '🏠 Home', '#e8d4c4', goHome, 18);
}
// ---------- 💌 A CARD FOR MOM (show it on screen, or print it) ----------
function drawCardArt(x, y, w, h) {   // drawn with shapes only (no emoji), so it prints nicely
  ctx.save(); ctx.translate(x, y); ctx.scale(w / 600, h / 400);
  roundRect(6, 8, 600, 400, 26, 'rgba(0,0,0,.15)'); roundRect(0, 0, 600, 400, 26, '#fffaf2');
  ctx.save(); ctx.setLineDash([12, 9]); ctx.strokeStyle = '#ff8fab'; ctx.lineWidth = 5; rrect(16, 16, 568, 368, 18); ctx.stroke(); ctx.restore();
  for (const [hx, hy, hs, c] of [[52, 52, 12, '#ffb3c6'], [548, 52, 12, '#ffd166'], [52, 350, 12, '#a0d8ff'], [548, 350, 12, '#ffb3c6']]) heart(hx, hy, hs, c);
  for (const [sx, sy] of [[120, 70], [330, 350], [300, 40], [560, 200]]) star(sx, sy, 9, '#ffd166', 0.2);
  heart(165, 250, 120, '#ffe0ea');
  ctx.save(); const ofr = frame; frame = 30; drawRobo(150, 326, { s: 3.4, happy: true, wave: true }); frame = ofr; ctx.restore();
  heart(250, 196, 40, '#ff5c8a'); heart(238, 182, 10, 'rgba(255,255,255,.4)');
  text('I love you,', 420, 150, 50, '#d6336c'); text('Mom!', 420, 214, 66, '#d6336c');
  text('Love, Ben', 420, 300, 36, '#6b3f2a');
  ctx.restore();
}
let printBusy = false;
function printCard() {
  if (printBusy) return; printBusy = true;
  try {
    const cv = document.createElement('canvas'); cv.width = 1500; cv.height = 1000;
    withCtx(cv.getContext('2d'), () => drawCardArt(0, 0, 1500, 1000));
    const img = document.getElementById('printImg');
    img.onload = () => { setTimeout(() => { try { window.print(); } catch (_) {} printBusy = false; }, 100); };
    img.src = cv.toDataURL('image/png');
  } catch (_) { printBusy = false; }
  setTimeout(() => { printBusy = false; }, 4000);
}
function openCard() { scr = 'card'; save.cards++; store(); chime(); say('Here is a card for Mom. You can show it to her, or print it!', '💌'); }
function drawCardRoom() {
  ctx.drawImage(bg, 0, 0); drawWindow(); drawLampGlow();
  ctx.save(); ctx.globalAlpha = 0.45; ctx.fillStyle = '#3a2418'; ctx.fillRect(0, 0, W, H); ctx.restore();
  text('💌 A Card for Mom', 22, 30, 26, '#fff3dc', 'left');
  drawCardArt(W / 2 - 270, 64, 540, 360);
  button(W / 2 - 230, 466, 220, 48, '🖨️ Print it', '#ffd9a8', printCard, 21);
  button(W / 2 + 10, 466, 220, 48, '🏠 Home', '#e8d4c4', goHome, 21);
}
// ---------- 🏠 the main workshop picture ----------
let started = !!JB_WANT, down = false;
function goHome() { scr = 'home'; hearts = []; hush(); }
const ROBO_SPOT = { x: 330, y: 470 };
function drawHome() {
  ctx.drawImage(bg, 0, 0); drawWindow(); drawLampGlow(); drawBench(); drawShelves(); drawYarnFloor(); drawHomeBasket();
  drawRobo(ROBO_SPOT.x, ROBO_SPOT.y, { s: 2.4, wave: frame % 600 < 120, mouth: !!talk && talkT < 200 });

    label('🤖 Robo', ROBO_SPOT.x, 334); label('💌 Card', ENV.x, 270); label('🧶 Breathe', BALL.x, 408); label('🧺 Basket', BASKET.x, 418);
    const bs = [['🧵 Make a Plushie!', 222, '#ffb3c6', startMaking], ['🧺 Basket', 132, '#ffd9a8', () => { scr = 'basket'; chime(); }],
      ['🤖 Robo Talk', 160, '#bfe3ff', openTalk], ['🧶 Breathe', 140, '#d4f5c4', openBreath], ['💌 Card for Mom', 190, '#ffd1dc', openCard]];
    let x = 24; for (const [l, w, c, fn] of bs) { button(x, 482, w, 48, l, c, fn, 20); x += w + 12; }
  }
}
function drawTopButtons() {
  if (!started || scr === 'breath') return;
  button(W - 252, 12, 120, 42, musicOn ? '🎵 Music' : '🎵 Off', musicOn ? '#ffd9a8' : '#c9b8b0', () => { musicOn = !musicOn; fadeAll(); }, 18);
  button(W - 124, 12, 112, 42, soundOn ? '🔈 Sound' : '🔇 Off', soundOn ? '#ffd9a8' : '#c9b8b0', () => { soundOn = !soundOn; if (!soundOn) hush(); fadeAll(); }, 18);
}
const DRAW = { home: drawHome, pick: drawPick, fabric: drawFabricPick, eyes: drawEyePick, stitch: drawStitch, stuff: drawStuff, patch: drawPatch,
  done: drawDone, basket: drawBasketRoom, talk: drawTalkRoom, breath: drawBreathRoom, card: drawCardRoom };
function draw() {
  BTN = [];
  DRAW[scr]();
  drawFx(); drawTopButtons();
  if (scr === 'home' || scr === 'basket') drawTalk(62);
  drawToast();
  if (!started) {
    ctx.save(); ctx.globalAlpha = 0.55; ctx.fillStyle = '#2a1a14'; ctx.fillRect(0, 0, W, H); ctx.restore();
    roundRect(W / 2 - 270, 160, 540, 220, 30, 'rgba(255,244,224,.97)');
    text('🧸 The Snuggle Workshop 🧸', W / 2, 212, 34, '#8a4a5a');
    text('A cozy toy workshop on a snowy night ❄️💛', W / 2, 256, 20, '#8a5a4a', 'center', false);
    text('Make your very own soft plushie!', W / 2, 286, 20, '#8a5a4a', 'center', false);
    roundRect(W / 2 - 150, 310, 300, 56, 28, '#ffb3c6'); text('👉 Tap to come inside!', W / 2, 339, 24, '#6b3f2a');
  }
}
function update() {
  mk.t++; if (shelfWig.t > 0) shelfWig.t--;
  if (mk.wait > 0 && --mk.wait === 0) { if (scr === 'stuff') { scr = 'patch'; speak('Now tap your plushie to sew on a heart patch!'); } else if (scr === 'patch') finishPlush(); }
  if (scr === 'breath') updateBreath();
  if (scr === 'done') {
    if (mk.holding) {
      mk.hold++; mk.hugK = lerp(mk.hugK, 1, 0.12);
      if (mk.hold % 10 === 1) addHeart(MK.x, MK.y - 200);
      if (mk.hold === 40) { save.hugs++; store(); if (!mk.hugged) { mk.hugged = true; say(HUG_LINES[mk.p.k], KINDS[mk.p.k].icon); } checkTrophy(); }
    } else mk.hugK = lerp(mk.hugK, 0, 0.1);
  }
}
function loop() { frame++; update(); draw(); requestAnimationFrame(loop); }
// ---------- tapping, tracing and hugging ----------
function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function begin() {
  started = true; audio(); fadeAll(); startMusic(); setTimeout(fadeAll, 300);
  say("Hi Ben! Welcome to the Snuggle Workshop. Let's make something soft and cozy together.", '🤖');
}
function tap(x, y) {
  if (!started) { begin(); return; }
  audio();
  for (const b of BTN.slice().reverse()) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); plip(); return; }
  if (scr === 'stitch') { traceAt(x, y); return; }
  if (scr === 'stuff') { addStuffing(); return; }
  if (scr === 'patch') { if (mk.p.hx === null) placePatch(x, y); return; }
  if (scr === 'done') { if (inDonePlush(x, y)) { mk.holding = true; mk.hold = 0; squish(); } return; }
  if (scr === 'basket') { tapBasket(x, y); return; }
  if (scr !== 'home') return;
  for (const s of SHELF_SPOTS) if (Math.abs(x - s.x) < 26 && y < s.y + 6 && y > s.y - 72) { plushSay(s.p, s.x, s.y - 60); shelfWig.i = save.shelf.indexOf(s.p); shelfWig.t = 30; return; }
  if (Math.abs(x - ROBO_SPOT.x) < 50 && y > ROBO_SPOT.y - 130 && y < ROBO_SPOT.y + 10) { openTalk(); return; }
  if (Math.abs(x - ENV.x) < 40 && Math.abs(y - ENV.y) < 30) { openCard(); return; }
  if (Math.hypot(x - BALL.x, y - BALL.y) < 40) { openBreath(); return; }
  if (Math.abs(x - BASKET.x) < 70 && y > BASKET.y - 70 && y < BASKET.y + 24) { scr = 'basket'; chime(); return; }
  if (x > WIN.x && x < WIN.x + WIN.w && y > WIN.y && y < WIN.y + WIN.h) { softNote(1047, 1.2, 0.04); say('Look at the soft snow falling outside. So peaceful.', '❄️'); return; }
  if (Math.abs(x - LAMP.x + 20) < 50 && y > LAMP.y - 90 && y < LAMP.y) { softNote(659, 0.8, 0.06); return; }
}
C.addEventListener('pointerdown', e => { const [x, y] = pos(e); down = true; tap(x, y); });
C.addEventListener('pointermove', e => { if (!down) return; const [x, y] = pos(e); if (scr === 'stitch') traceAt(x, y); });
function release() { down = false; if (mk.holding) { mk.holding = false; if (mk.hold > 5) softNote(523, 0.6, 0.04); } }
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });
if (JB_WANT) { audio(); musicOn = true; soundOn = true; setTimeout(() => { audio(); fadeAll(); startMusic(); }, 50); }
loop();
