function bookSpots() {

      out.push({ i, x: x + gap, y: y + ROW_H - h, w: 52, h, gap0: x }); x += gap + 56; } });
  return out;
}
const SPOTS_B = bookSpots();
function fillerBooks(x, y, w, h, seed) {   // skinny plain books (not tappable)

function riddleNow() {
  if (st.open) { const l = 'You found the hidden reading nook! Tap the treasure chest anytime.'; say(l + ' ✨', '🐱'); pagesSay(l); return; }
  const l = RIDDLES[st.riddle][1]; say('🧩 ' + l, '🐱'); pagesSay(l); toast('🧩 Riddle ' + (st.riddle + 1) + ' of 3', 2200);
}
function tapBook(i) {
  const goal = !st.open && RIDDLES[st.riddle][0] === i;
  if (goal && st.riddle < 2) {
    st.riddle++; store(SAVEKEY, st); drawScene(); tune([660, 880, 1100]);
    const l = 'Yes! It is ' + BOOKS[i][1].replace(/!$/, '') + '! A note falls out of the book. It is the next riddle!';
    say('🎉 ' + l, '🐱'); toast('🎉 Riddle solved! ' + st.riddle + '/3', 2600); pagesSay(l); setTimeout(riddleNow, 4200); return;
  }
  if (goal) return pullBook();
  showCover(i);
  if (!st.open && st.riddle > 0) setTimeout(() => say('That\'s ' + BOOKS[i][1] + '. Not the riddle book, keep looking! 🔍', '🐱'), 300);
}
function pullBook() {
  st.open = true; store(SAVEKEY, st); trophy('secretLibrary');
  const g = document.querySelector('.bk.out') || document.querySelector('[data-i="1"]'); if (g) g.style.transform = 'translateY(-30px) rotate(-8deg)';
  blip(330, 0, .2, 'square', .15); slide(220, 660, .4, 1.2, 'triangle');
  say('Click! Clunk... the whole bookshelf is SPINNING around! 😮', '🐱');
  setTimeout(() => { const sh = $('shelf'); if (sh) sh.classList.add('turn'); }, 500);
  setTimeout(() => { drawScene(); const sh = $('shelf'); sh.classList.add('turn'); requestAnimationFrame(() => requestAnimationFrame(() => sh.classList.remove('turn'))); }, 1250);
  setTimeout(() => { tada(); toast('🏆 Secret Library trophy! You found the hidden reading nook!', 4200); const l = 'You found my hidden reading nook! Open the treasure chest!'; say('✨ ' + l, '🐱'); pagesSay(l); }, 2100);
}

// =====================================================================
// 🔖 BOOKMARK MAKER (4 bookmarks on a page; each one: a character + a saying)
// =====================================================================
const BM_WHO = ['robo', 'sammy', 'sparks', 'pages', 'pink', 'dusty'];
const BM_EMO = { robo: '🤖', sammy: '🐱', sparks: '🐶', pages: '📚', pink: '🎀', dusty: '🧹' };
const BM_SAY = ['Keep reading, Ben!', 'One more chapter!', 'Books are magic!', 'Shhh... reading time!', 'I stopped right here!', 'Reading is my superpower!', 'Turn the page!', 'This book belongs to Ben'];
const BM_COL = ['#2979ff', '#00c853', '#ff9800', '#d500f9'];
const DEF_MARKS = [[0, 0], [1, 3], [2, 6], [3, 2]];
let bmSlot = 0;
const marks = () => (Array.isArray(st.marks) && st.marks.length === 4 ? st.marks : (st.marks = DEF_MARKS.map(m => m.slice())));
function bookmark(x, y, w, h, m, col) {
  const k = BM_WHO[m[0]] || 'robo', cx = x + w / 2;
  let s = R(x, y, w, h, 22, LINE ? '#fff' : lin([[0, lite(col, .75)], [1, lite(col, .45)]]), 0) + CUT(rr(x, y, w, h, 22));
  s += PUNCH(cx, y + 34, 13) + T(cx, y + 74, "BEN'S BOOKMARK", 15, dark(col, .3));
  s += C(cx, y + 168, 66, LINE ? '#fff' : lite(col, .9), OL, 3) + who(k, cx, y + 172, k === 'sparks' ? .82 : .9);
  const lines = wrapLines(BM_SAY[m[1]] || BM_SAY[0], 10), sz = lines.length > 3 ? 26 : 30;
  lines.forEach((l, i) => { s += BT(cx, y + 300 + i * sz * 1.2, l, sz, col); });
  [[x + 24, y + 470, 13], [x + w - 26, y + 500, 10], [x + 30, y + 548, 9], [x + w - 30, y + 440, 8]].forEach(([sx, sy, r]) => { s += P(starD(sx, sy, r), ball('#ffd740'), OL, 1.6); });
  for (let i = 0; i < 4; i++) s += R(cx - 48 + i * 4, y + 590 - i * 20, 96 - i * 8, 20, 4, vshade(RAINBOW[(i + m[0]) % 8]), OL, 1.6);
  s += T(cx, y + 640, 'I stopped on', 17, OL) + T(cx, y + 662, 'page:', 17, OL) + R(cx - 44, y + 676, 88, 46, 10, '#fff', OL, 2.4);
  s += T(cx, y + h - 18, (CAST[k] ? CAST[k][0].replace(' (Book Cat)', '') : ''), 15, '#555');
  return s;
}
function bookmarksPage() {
  let s = banner('COLOR  •  CUT  •  READ', 'MY BOOKMARKS', '#ff7043', 46);
  marks().forEach((m, i) => { s += bookmark(28 + i * 190, 128, 174, 770, m, BM_COL[i]); });
  s += SCIS(28, 300, 90) + needBox(908, 'printer paper, crayons, scissors (a grown-up cuts), glue stick', 19);
  s += T(400, 990, 'Extra strong: glue it onto a second paper strip. Tassel: snip a paper strip into fringe, poke it through the hole.', 14.5, OL);
  return svgWrap(s);
}
function libCardPage() {
  let s = frame('#1565c0') + banner('ONLY FOR READERS WHO FOUND THE HIDDEN NOOK', 'MY LIBRARY CARD', '#1565c0', 46);
  [150, 470].forEach((y, k) => {
    s += R(54, y, 692, 252, 20, LINE ? '#fff' : '#e3f2fd', 0) + CUT(rr(54, y, 692, 252, 20)) + FOLD('M400 ' + (y + 8) + ' L400 ' + (y + 244)) + SCIS(54, y + 200, 90);
    s += cardFront(62, y + 16) + cardBack(408, y + 16) + T(400, y + 270, k ? 'a second card, for a friend or a grown-up!' : 'fold on the dashed line and glue it flat', 15, '#555');
  });
  s += needBox(790, 'printer paper, crayons, scissors (a grown-up cuts), glue stick', 19);
  [['A grown-up cuts out the card.', 1], ['Fold on the dashed line. Glue it flat. Double strong!', 2], ['Write the books you read on the back!', 3]].forEach(([t, k], i) => { s += numDot(68, 878 + i * 40, k) + T(98, 886 + i * 40, t, 21, OL, 'start'); });
  return svgWrap(s);
}
const PAGES = [
  { id: 'marks', name: '🔖 My 4 Bookmarks', build: bookmarksPage, how: 'Color them, a grown-up cuts them out, and keep your place in every book!' },
  { id: 'card', name: '🪪 My Library Card', build: libCardPage, how: 'Fold it in half, glue it flat, and write the books you read on the back!', show: () => st.open },
];
function bmRender() {
  const M = marks(), m = M[bmSlot];
  chipRow('bmSlots', [0, 1, 2, 3], bmSlot, (c, i) => '🔖 ' + (i + 1));
  chipRow('bmWho', BM_WHO, m[0], k => BM_EMO[k] + ' ' + CAST[k][0].replace(' (Book Cat)', ''));
  chipRow('bmSay', BM_SAY, m[1], t => esc(t));
  $('bmPrev').innerHTML = pageSVG(PAGES[0]);
}
function openMarks() { openPanel('bmPanel'); bmRender(); say('Make 4 bookmarks! Pick who is on each one, and what it says. 🔖', '🐱'); }
function initLibrary() {
  st = load(SAVEKEY, st); if (!(st.riddle >= 0 && st.riddle <= 2)) st.riddle = 0; if (!(st.lad >= 0 && st.lad <= 2)) st.lad = 0;
  initPrints(); drawScene();
  $('scene').addEventListener('click', onScene);
  $('bRiddle').onclick = riddleNow; $('bubble').onclick = riddleNow; $('riddleBox').onclick = riddleNow;
  $('bBook').onclick = () => showCover(Math.floor(Math.random() * BOOKS.length));
  $('bMarks').onclick = openMarks;
  $('coverSay').onclick = () => speak(BOOKS[coverI][1] + '. ' + BOOKS[coverI][4]);
  $('bStory').onclick = () => speak(STORY.join('. '), .92, 1.1);
  $('bPrintCard').onclick = () => openPrints(1);
  $('bmSlots').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; bmSlot = +b.dataset.i; blip(600, 0, .08); bmRender(); };
  $('bmWho').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; marks()[bmSlot][0] = +b.dataset.i; store(SAVEKEY, st); blip(700, 0, .08); bmRender(); };
  $('bmSay').onclick = e => { const b = e.target.closest('.chip'); if (!b) return; marks()[bmSlot][1] = +b.dataset.i; store(SAVEKEY, st); blip(800, 0, .08); speak(BM_SAY[+b.dataset.i]); bmRender(); };
  $('bmPrint').onclick = () => printList([0]); $('bmMore').onclick = () => openPrints();
  hello(st.open ? 'Welcome back to the Secret Library, Ben!' : 'Welcome to the Secret Library! I am Pages, the librarian. Tap me for a riddle!');
}
if (typeof window !== 'undefined' && !window.__TEST__) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initLibrary); else initLibrary(); }
