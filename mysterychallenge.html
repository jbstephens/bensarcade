<script>
// ================= shared bits (helpers, soft sounds, gentle music) =================
const C = document.getElementById('c'), W = 960, H = 540;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

function rrect(x, y, w, h, r) {

function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }

// the same text style as Robo Jump 1: bold, white, dark outline

// ---------- 🔈 SOFT sounds (master volume 0.13, fades in; starts on the first tap or key) ----------
let actx = null, master = null, musicBus = null, musicOn = true;
function audio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.setValueAtTime(0.0001, actx.currentTime);
      master.gain.linearRampToValueAtTime(0.13, actx.currentTime + 1.5); master.connect(actx.destination);
      musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.5 : 0; musicBus.connect(master);

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

const SFX = {
  tap() { bleep(660, 0.08, 0.04); },
  good() { bleep(784, 0.1, 0.05); bleep(1047, 0.12, 0.04, 0.07); },
  bonus() { [784, 988, 1175, 1568].forEach((f, i) => bleep(f, 0.12, 0.04, i * 0.06)); },
  oops() { bleep(330, 0.28, 0.05, 0, 'triangle', -120); },
  pop() { bleep(700, 0.07, 0.045, 0, 'sine', 500); },
  dig() { bleep(170, 0.08, 0.05, 0, 'triangle', -50); },
  start() { [392, 523, 659].forEach((f, i) => bleep(f, 0.14, 0.045, i * 0.1)); },
  level() { [523, 659, 784, 1047].forEach((f, i) => bleep(f, 0.16, 0.045, i * 0.1)); },
  win() { [523, 659, 784, 659, 784, 1047].forEach((f, i) => bleep(f, 0.18, 0.045, i * 0.12)); },

// 🎵 a short catchy loop: TUNE = { bpm, wave, chords: 4 chords (midi), mel: 32 eighth notes (midi, 0 = rest) on the chord tones }
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
let nextNote = 0, step = 0;
function musicTick() {
  if (!actx || actx.state !== 'running' || !musicOn) return;
  const now = actx.currentTime, e = 60 / TUNE.bpm / 2;
  if (nextNote < now) nextNote = now + 0.05;           // never pile up old notes
  while (nextNote < now + 0.25) {
    const ch = TUNE.chords[Math.floor(step / 8) % TUNE.chords.length], m = TUNE.mel[step % TUNE.mel.length];
    if (m) tone(mtof(m), nextNote, e * 1.7, 0.05, TUNE.wave || 'triangle', 0, musicBus);
    if (step % 4 === 0) tone(mtof(ch[0] - 12), nextNote, e * 3.5, 0.06, 'sine', 0, musicBus);
    if (step % 4 === 2) tone(mtof(ch[1]), nextNote, e * 1.5, 0.02, 'sine', 0, musicBus);

setInterval(musicTick, 50);
function toggleMusic() {
  musicOn = !musicOn; audio();

// ================= 🤖 THE FRIENDS: copied from Robo Jump 13 (via arcaderoom.html) and Sparks from the mystery games =================
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };

const PAL_PINK = { head: '#f8bbd0', body: '#fce4ec', visor: '#4a148c', eye: '#ff80ab', legs: '#ec407a', pod: '#f06292', pink: true };    // 🎀 PINK ROBO (big bow + a heart)
function heartPath(x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
  ctx.closePath();

  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);

  roundRect(x + w - 1 * es, y + h * 0.3 - 3, 6 * es, 9 * (h / 40), 3, pal.pod);

    for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(ex + d * 6 * es, ey + 2 * es, 3.4 * es, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  } else {
    ctx.fillStyle = pal.eye;

  }
  if (pal.r2) {                                          // 💚 Robo 2.0: a happy smile, cute pixel freckles and a "2.0" (no antenna!)
    ctx.strokeStyle = '#00e676'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(ex, ey + 6 * es, 3.5 * es, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.fillStyle = '#ff00e5'; ctx.fillRect(x + 3, y + 3, 4 * es, 4 * es); ctx.fillStyle = '#00e676'; ctx.fillRect(x + w - 7 * es, y + 5, 4 * es, 4 * es);
    ctx.fillStyle = '#7b1fa2'; ctx.font = `bold ${Math.round(9 * es)}px Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillText('2.0', x + w / 2, y + h * 0.84);
  }

    ctx.strokeStyle = '#4a148c'; ctx.lineWidth = Math.max(1, 1.3 * es);
    for (const d of [-1, 1]) for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(ex + d * 6 * es + k * 2 * es, ey - 4 * es); ctx.lineTo(ex + d * 6 * es + k * 3 * es, ey - 7 * es); ctx.stroke(); }

// a robot standing with its feet at (x, y)
function drawBot(x, y, pal, o = {}) { const w = (o.s || 1) * 40, h = (o.s || 1) * 44; drawRoboBase({ x: x - w / 2, y: y - h, w, h, face: o.face || 1, squash: o.squash, dizzy: o.dizzy, happy: o.happy }, pal); }

function drawSparks(x, y, o = {}) {
  const s = o.s || 1, t = o.t || frame, f = o.face || 1, w = 34, h = 30;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.translate(-w / 2, -h);
  const run = o.walk ? Math.sin(t * 0.4) * 3 : 0, GL = '#f4b942', GD = '#c98e2a', PU = '#8e5bd6', PD = '#6a3fb5';
  const bx = -7, bw = w + 14;

  ctx.fillStyle = GD;
  ctx.fillRect(bx + 6 + run, h - 9, 6, 9); ctx.fillRect(bx + 15 - run, h - 9, 6, 9);
  ctx.fillRect(bx + bw - 21 - run, h - 9, 6, 9); ctx.fillRect(bx + bw - 12 + run, h - 9, 6, 9);

// ================= ⚡ ROBO'S ZAP FLOOR (❓ Mystery Challenge: VERY HARD!) =================
// Robo hops around a big floor of tiles. Tiles glow YELLOW (with a shrinking ring) before they ZAP, always

// The zaps come in the SAME order every try, so you can learn them ("I can do it next time!").

let events = [], lt = 0, nextEv = 0, rng = Math.random, brng = Math.random, battery = null, got = 0, phase = -1, tries = 0;

function cfg() { const L = LEVELS[level]; return phase >= 0 ? Object.assign({}, L, BOSS.phases[phase], { goal: BOSS.hits }) : L; }
function roboTile() { return robo.hop >= 4 ? [robo.tc, robo.tr] : [robo.c, robo.r]; }
function zapping(c, r, t) { for (const e of events) if (t >= e.zapAt && t < e.endAt && e.tiles[r * COLS + c]) return true; return false; }

function makeEvent(L) {

  const [rc, rr] = robo.hop ? [robo.tc, robo.tr] : [robo.c, robo.r];

    if (tries <= 10) trophy('mysteryHardPro');
  }
  else { state = 'levelDone'; timer = 0; SFX.level(); burst(W / 2, H / 2, ['#ffd740', '#69f0ae', '#ff80ab'], 30, 6); }
}

// ---------- 🖼️ screens ----------
function panel(x, y, w, h, col = 'rgba(20,16,50,.78)') { roundRect(x, y, w, h, 24, col); ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 4; rrect(x, y, w, h, 24); ctx.stroke(); }
function drawHUD() {
  const L = LEVELS[level];
  text(`Level ${level + 1}: ${L.name}`, 20, 42, 28, '#fff', 'left');
  text(GAME.hud(cfg()), 20, 78, 24, '#ffe57f', 'left');
  text(`💀 Tries: ${tries}`, W - 20, 42, 28, '#fff', 'right');
}
function drawMusicBtn() { roundRect(MUSIC_BTN.x, MUSIC_BTN.y, MUSIC_BTN.w, MUSIC_BTN.h, 14, 'rgba(0,0,0,.35)'); emoji(musicOn ? '🎵' : '🔇', MUSIC_BTN.x + 26, MUSIC_BTN.y + 25, 26); }
function drawTitle() {
  GAME.draw(LEVELS[0], true);
  ctx.fillStyle = 'rgba(10,8,30,.35)'; ctx.fillRect(0, 0, W, H);
  panel(110, 18, 740, 504);
  text('❓ MYSTERY CHALLENGE: VERY HARD!', W / 2, 66, 30, '#ff8a80');
  const bob = Math.sin(frame * 0.06) * 4;
  text(GAME.name + ' ⚡', W / 2, 128 + bob, 50, GAME.color);
  GAME.titleArt();
  GAME.instr.forEach((s, i) => text(s, W / 2, 396 + i * 32, 22, '#fff'));
  if (Math.floor(frame / 30) % 2 === 0) text('Tap, press SPACE or START to play!', W / 2, 502, 26, '#69f0ae');
}
const CHEERS = ['So close! You can do it! 💪', 'Watch the yellow tiles! 👀', 'Every try makes you better! ⭐', 'The zaps come the same way every time!', 'Robo believes in you! 🤖'];
function drawOverlays() {
  const L = LEVELS[level];
  if (state === 'intro') {
    const s = Math.min(1, timer / 15);
    ctx.save(); ctx.globalAlpha = s; panel(W / 2 - 310, 170, 620, 190);
    text(`Level ${level + 1}`, W / 2, 228, 34, '#ffd740'); text(L.name, W / 2, 284, 52, '#fff'); text(L.tip, W / 2, 334, 24, '#b9f6ca');
    ctx.restore();
  } else if (state === 'levelDone') {
    panel(W / 2 - 300, 170, 600, 200);
    text(['Charged up! 🔋', 'AMAZING! 🌟'][level % 2], W / 2, 240, 56, '#ffd740');
    text(`You beat ${L.name}!`, W / 2, 292, 30);
    if (timer > 45) text('Tap or press SPACE for the next level', W / 2, 342, 24, '#69f0ae');
  } else if (state === 'fail' && timer > 18) {
    panel(W / 2 - 320, 170, 640, 210);
    text('Bzzt! 💫', W / 2, 236, 56, '#7df9ff');
    text(CHEERS[tries % CHEERS.length], W / 2, 286, 26);
    text(phase >= 0 ? `🚩 Back to boss phase ${phase + 1} (checkpoint!)` : `💀 Tries: ${tries}`, W / 2, 322, 22, '#ffe57f');
    if (timer > 30) text('Tap or press SPACE to try again', W / 2, 360, 24, '#69f0ae');
  } else if (state === 'bossCard') {
    ctx.fillStyle = `rgba(10,8,30,${Math.min(0.6, timer / 40)})`; ctx.fillRect(0, 0, W, H);
    drawCloud(W / 2, 140);
    const s = clamp((timer - 20) / 20, 0, 1);
    ctx.save(); ctx.globalAlpha = s;
    text(BOSS.epithet, W / 2, 290, 34, '#b3e5fc'); text(BOSS.name, W / 2, 370, 84 + Math.sin(frame * 0.1) * 3, '#ffd740');
    text('Grab the ⭐ stars to zap RUMBLES back!', W / 2, 430, 24, '#fff');
    ctx.restore();
    if (timer > 50) text('Tap or press SPACE!', W / 2, 480, 24, '#69f0ae');
  } else if (state === 'win') {
    ctx.fillStyle = 'rgba(10,8,30,.45)'; ctx.fillRect(0, 0, W, H);
    panel(W / 2 - 340, 70, 680, 400, 'rgba(20,16,50,.93)'); drawConfetti();
    text('YOU DID IT! 🏆', W / 2, 140, 60, '#ffd740'); text('You beat the VERY HARD Mystery Challenge!', W / 2, 190, 26);
    GAME.winArt();
    text(`💀 Tries: ${tries}` + (tries <= 10 ? '   PRO! 🥇' : ''), W / 2, 386, 28, tries <= 10 ? '#ffd740' : '#fff');
    text(tries <= 10 ? '🏆🏆 You won TWO trophies for the Trophy Room!' : '🏆 You won a trophy! (Beat it in 10 tries or less for a PRO trophy!)', W / 2, 424, tries <= 10 ? 24 : 19, '#69f0ae');
    if (timer > 120) text('Tap to play again', W / 2, 456, 20, '#fff');
  }
}
function update() {
  frame++; timer++;
  if (state === 'intro' && timer > 110) state = 'play';
  if (state === 'play') GAME.update(LEVELS[level]);
  else if (GAME.idle) GAME.idle(LEVELS[level]);
  if (hurtFlash > 0) hurtFlash--;
  updateParts();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (state === 'title') drawTitle();
  else {
    GAME.draw(LEVELS[level], false); drawParts();
    drawHUD(); drawOverlays();
  }
  drawMusicBtn();
}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw(); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
