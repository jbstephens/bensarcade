<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🔤 Game Factory Puzzle Book</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #ffe9a8 0 36px, #fff1c4 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- the book builder (home) ---------- */
  #home { flex-direction: column; overflow: hidden; }
  #hHead { text-align: center; padding: 8px 130px 2px; position: relative; }
  #hHead h1 { margin: 0; font-size: clamp(22px, 3.6vw, 46px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff6ec7; letter-spacing: 2px; }
  #hHead p { margin: 2px 0 4px; font-size: clamp(15px, 2vw, 20px); font-weight: bold; }
  #bLeave { position: absolute; left: 10px; top: 8px; font-size: 18px; min-height: 50px; padding: 4px 12px; }
  #pick { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; padding: 2px 10px; }
  .chip { font: inherit; font-size: 17px; font-weight: bold; border: 3px solid #333; border-radius: 30px; padding: 6px 12px;
    background: #fff; cursor: pointer; box-shadow: 0 3px 0 #333; min-height: 44px; color: #222; }
  .chip.on { background: #8ef08e; }
  .chip.lv.on { background: #ffd23f; }
  .chip.sel { outline: 4px solid #ff3d6e; }
  #acts { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; padding: 6px 10px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { position: relative; background: #fff; border: 5px solid #333; border-radius: 16px; padding: 5px; cursor: pointer;
    box-shadow: 0 6px 0 #e0559c; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 0; }
  .thumb .done { position: absolute; right: -8px; top: -10px; font-size: 34px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  /* ---------- playing one puzzle ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 24px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #svgBox, #certBox { position: absolute; inset: 0; }
  #svgBox svg, #certBox svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #e0559c; touch-action: none; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px; }
  #pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 5px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #wheelBox { display: none; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 6px; text-align: center; }
  #wheelBox.on { display: block; }
  #wheelBox svg { width: 100%; max-width: 230px; height: auto; display: block; margin: 0 auto; }
  #wheelBtns { display: flex; gap: 8px; justify-content: center; margin-top: 4px; }
  #wheelBtns .btn { min-height: 48px; font-size: 20px; padding: 4px 18px; }
  #keys { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; background: #ff9ecf;
    border: 4px solid #333; border-radius: 16px; padding: 7px; }
  #keys.hide { display: none; }
  #keys.few { grid-template-columns: repeat(4, 1fr); }
  .key { font: inherit; font-size: 22px; font-weight: bold; border: 3px solid #333; border-radius: 10px; background: #fff;
    min-height: 46px; padding: 0; cursor: pointer; box-shadow: 0 3px 0 #333; color: #222; display: flex; align-items: center; justify-content: center; }
  .key:active { transform: translateY(3px); box-shadow: none; }
  .key svg { width: 38px; height: 38px; pointer-events: none; }
  .key.wide { grid-column: span 2; background: #ffe066; font-size: 18px; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-size: 21px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide { display: none; }
  .b-back { background: #9be3ff; } .b-check { background: #8ef08e; font-size: 24px; } .b-hint { background: #fff3a0; }
  .b-ans { background: #ffe066; } .b-ans.on { background: #ffb347; } .b-clear { background: #ffc2d6; }
  .b-print { background: #c3a6ff; } .b-new { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-book { background: #8ef08e; } .b-cert { background: #ffd23f; }
  #names { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  #names .chip.on { background: #ffd23f; }
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 50; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #fx { position: fixed; inset: 0; pointer-events: none; z-index: 45; overflow: hidden; }
  .conf { position: absolute; top: -40px; font-size: 32px; animation: fall 1.8s ease-in forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(540deg); } }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 44vh; }
  }
  /* SVG puzzle styles */
  .f { fill: #fff; stroke: #222; stroke-width: var(--sw, 4); stroke-linejoin: round; }
  .ln { fill: none; stroke: #222; stroke-width: var(--sw, 4); stroke-linecap: round; stroke-linejoin: round; }
  .tt { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif; font-weight: bold; }
  .bub { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", sans-serif; font-weight: bold;
    fill: #fff; stroke: #222; stroke-width: 9; stroke-linejoin: round; paint-order: stroke fill; }
  .cell { cursor: pointer; }
  /* ---------- PRINT: only what's in #printAll ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
    #printAll svg svg { height: auto; break-after: auto; page-break-after: auto; }
    .noprint { display: none !important; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="hHead">
    <button class="btn b-back" id="bLeave">⬅️ Back</button>
    <h1>🔤 GAME FACTORY PUZZLE BOOK</h1>
    <p>Pick puzzles, then play them here or print your very own book! ✏️</p>
  </div>
  <div id="pick"></div>
  <div id="acts">
    <button class="btn b-new" id="bNewAll">🎲 New puzzles!</button>
    <button class="btn b-book" id="bPrintBook">🖨️ Print my book</button>
    <button class="btn b-cert" id="bCert">🏅 My certificate</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <div id="wheelBox"><div id="wheel"></div>
      <div id="wheelBtns"><button class="btn b-hint" id="bWL">◀</button><button class="btn b-hint" id="bWR">▶</button></div></div>
    <div id="keys"></div>
    <button class="btn b-check" id="bCheck">✅ Check it!</button>
    <div class="row2"><button class="btn b-hint" id="bHint">💡 Hint</button><button class="btn b-ans" id="bAns">🔑 Answer</button></div>
    <div class="row2"><button class="btn b-clear" id="bClear">🧽 Clear</button><button class="btn b-print" id="bPrint">🖨️ Print</button></div>
    <button class="btn b-back" id="bBack">⬅️ Back to my book</button>
  </div>
</div>
<div id="cert" class="screen" style="flex-direction:row;gap:10px;padding:10px">
  <div id="paper2" style="flex:1;min-width:0;display:flex;align-items:center;justify-content:center"><div id="wrap2" style="position:relative;height:calc(100vh - 24px);aspect-ratio:4/5;max-width:100%"><div id="certBox"></div></div></div>
  <div id="side2" style="width:min(40vw,380px);display:flex;flex-direction:column;gap:8px;overflow-y:auto">
    <div id="cTitle" style="font-size:24px;font-weight:bold;text-align:center;background:#fff;border:4px solid #333;border-radius:14px;padding:6px">🏅 Puzzle Master!</div>
    <div style="font-size:18px;text-align:center;background:#fffbe0;border:4px solid #333;border-radius:14px;padding:6px">Whose certificate is it? Tap a name!</div>
    <div id="names"></div>
    <button class="btn b-print" id="bCertPrint">🖨️ Print it!</button>
    <button class="btn b-back" id="bCertBack">⬅️ Back to my book</button>
  </div>
</div>
<div id="printAll"></div>
<div id="fx"></div>
<div id="toast"></div>
<script>
'use strict';
// ================== drawing helpers (from the Activity Room) ==================
// PAL: when set, shapes are filled with these colors one by one (so characters come out in color)
let PAL = null, PALi = 0;
const sh = (tag, a) => { const fc = PAL ? PAL[Math.min(PALi++, PAL.length - 1)] : null; return `<${tag} class="f" ${a}${fc ? ` style="fill:${fc}"` : ''}/>`; };
const C = (x, y, r) => sh('circle', `cx="${x}" cy="${y}" r="${r}"`);
const E = (x, y, rx, ry, rot) => sh('ellipse', `cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"` + (rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''));
const R = (x, y, w, h, r, rot) => sh('rect', `x="${x}" y="${y}" width="${w}" height="${h}" rx="${r || 0}"` + (rot ? ` transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : ''));
const P = d => sh('path', `d="${d}"`);
const L = d => `<path class="ln" d="${d}"/>`;
const f1 = n => Math.round(n * 10) / 10;
const G = (x, y, s, inner, rot) => `<g style="--sw:${f1(4 / s)}" transform="translate(${f1(x)} ${f1(y)}) rotate(${rot || 0}) scale(${s})">${inner}</g>`;
function starPts(x, y, r, n, inner) {
  n = n || 5; inner = inner || 0.45; let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * inner : r;
    d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1) + ' ';
  }
  return d + 'Z';
}
const STAR = (x, y, r, n, inner) => P(starPts(x, y, r, n, inner));
const crown = (x, y, w, h) => {
  const l = x - w / 2, b = y + h / 2, t = y - h / 2;
  return P(`M${l} ${b} L${l} ${t} L${l + w * .25} ${y} L${x} ${t - h * .2} L${l + w * .75} ${y} L${l + w} ${t} L${l + w} ${b} Z`) +
    C(x, b - h * .25, Math.max(4, w * .07)) + C(l + w * .2, b - h * .22, Math.max(3, w * .05)) + C(l + w * .8, b - h * .22, Math.max(3, w * .05));
};
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const T = (x, y, size, str, anchor, color, extra) => `<text class="tt" x="${f1(x)}" y="${f1(y)}" text-anchor="${anchor || 'middle'}" font-size="${size}" fill="${color || '#222'}"${extra || ''}>${esc(str)}</text>`;
function textW(str, size) { let w = 0; for (const ch of String(str)) w += ch.codePointAt(0) > 0x2000 ? 1.25 : /[A-Z0-9]/.test(ch) ? 0.68 : /[ .,'!]/.test(ch) ? 0.32 : 0.56; return w * size; }
const Tfit = (x, y, size, str, maxW, anchor, color) => T(x, y, size, str, anchor || 'start', color, textW(str, size) > maxW ? ` textLength="${maxW}" lengthAdjust="spacingAndGlyphs"` : '');
const BOX = (x, y, w, h, fill, extra) => `<rect x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${f1(Math.min(w, h) * 0.12)}" fill="${fill || '#fff'}" stroke="#222" stroke-width="3"${extra || ''}/>`;
function wrap(str, max) {          // split text into lines of at most max characters
  const out = []; let line = '';
  String(str).split(' ').forEach(w => { if (line && (line + ' ' + w).length > max) { out.push(line); line = w; } else line = line ? line + ' ' + w : w; });
  if (line) out.push(line);
  return out;
}
function titleSVG(t) {
  const n = t.length, size = Math.min(64, Math.round(1000 / Math.max(n, 1)));
  const fit = textW(t, size) > 520 ? ' textLength="520" lengthAdjust="spacingAndGlyphs"' : '';
  return `<text class="bub" x="370" y="${f1(62 + size * 0.36)}" text-anchor="middle" font-size="${size}"${fit}>${esc(t)}</text>`;
}
// ================== characters (from the Coloring Room, drawn around 0,0) ==================
function robo(opts) {
  opts = opts || {};
  let s = L('M0 -50 L0 -72') + C(0, -78, 9) + E(-54, -6, 12, 18) + E(54, -6, 12, 18) + C(0, 0, 50) + R(-38, -24, 76, 42, 20) + E(-16, -3, 9, 11) + E(16, -3, 9, 11);
  if (!opts.noBody) {
    s += (opts.armsUp
      ? R(-62, 40, 18, 46, 9, -35) + R(44, 40, 18, 46, 9, 35) + C(-70, 34, 11) + C(70, 34, 11)
      : R(-58, 58, 18, 44, 9) + R(40, 58, 18, 44, 9) + C(-49, 106, 11) + C(49, 106, 11)) +
      R(-38, 52, 76, 62, 18) + C(0, 80, 12) + R(-30, 112, 22, 26, 8) + R(8, 112, 22, 26, 8);
  }
  return s;
}
function gloop(opts) {
  opts = opts || {};
  let s = P('M-70 50 Q-80 -10 -50 -40 Q0 -80 50 -40 Q80 -10 70 50 Q55 62 40 50 Q25 66 10 52 Q-10 68 -25 52 Q-45 66 -70 50 Z') +
    E(-22, -8, 13, 17) + E(22, -8, 13, 17) + C(-20, -4, 6) + C(24, -4, 6) + P('M-18 22 Q0 38 18 22 Q0 28 -18 22 Z') + C(-50, -6, 6) + C(48, 18, 5);
  if (opts.crown) s += crown(0, -62, 70, 36);
  return s;
}
function puppy() {
  return P('M38 110 Q80 90 70 60 Q66 92 36 96 Z') + E(0, 95, 42, 40) + E(0, 104, 24, 22) + E(-22, 136, 14, 10) + E(22, 136, 14, 10) +
    R(-30, 48, 60, 12, 6) + STAR(0, 66, 10) + E(-44, -2, 16, 32, 20) + E(44, -2, 16, 32, -20) +
    C(0, 0, 46) + E(0, 20, 24, 17) + E(0, 12, 9, 7) + C(-17, -10, 7) + C(17, -10, 7) + E(22, -24, 14, 10);
}
function cat(opts) {
  return (opts && opts.headOnly ? '' : P('M40 110 Q100 100 90 40 Q85 20 100 10 Q110 30 104 50 Q110 120 44 128 Z') + E(0, 100, 42, 44) + E(-20, 142, 15, 9) + E(20, 142, 15, 9) +
    P('M-38 86 Q-25 92 -40 100 Z') + P('M38 86 Q25 92 40 100 Z') + P('M-34 112 Q-20 118 -36 124 Z') + P('M34 112 Q20 118 36 124 Z') + P('M88 50 L100 46 L101 54 Z')) +
    P('M-40 -20 L-46 -66 L-12 -40 Z') + P('M40 -20 L46 -66 L12 -40 Z') + E(0, 0, 50, 44) + P('M-38 -50 L-40 -26 L-24 -38 Z') + P('M38 -50 L40 -26 L24 -38 Z') +
    E(-18, -6, 10, 12) + E(18, -6, 10, 12) + E(-18, -4, 4, 9) + E(18, -4, 4, 9) +
    P('M-7 12 L7 12 L0 20 Z') + L('M0 20 Q-8 30 -16 24 M0 20 Q8 30 16 24 M-20 16 L-48 10 M-20 20 L-48 24 M20 16 L48 10 M20 20 L48 24') +
    P('M-10 -42 L0 -26 L10 -42 Z') + P('M-30 -36 L-20 -24 L-26 -40 Z') + P('M30 -36 L20 -24 L26 -40 Z');
}
function nova() {
  return P('M-60 -20 L-180 -110 L-150 -10 L-200 40 L-70 30 Z') + P('M60 -20 L180 -110 L150 -10 L200 40 L70 30 Z') +
    STAR(0, 0, 110, 5, 0.5) + C(0, 0, 34) + C(0, 0, 18) + C(6, -6, 6) + P('M-24 40 Q0 58 24 40 Q0 48 -24 40 Z');
}
// colored versions: the palette lists each shape's color in drawing order
function paint(pal, fn) { PAL = pal; PALi = 0; const s = fn(); PAL = null; return s; }
const ROBO_PAL = ['#ff4d4d', '#4fa8ff', '#4fa8ff', '#ffffff', '#1d2333', '#4fd2ff', '#4fd2ff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#ffffff', '#4fd2ff', '#ffffff', '#ffffff'];
const GLOOP_PAL = ['#9b4dff', '#ffffff', '#ffffff', '#2a1440', '#2a1440', '#2a1440', '#c9a2ff', '#c9a2ff', '#ffd23f', '#ff3d6e', '#4fd2ff', '#4fd2ff'];
const BABY_PAL = ['#d4b3ff', '#ffffff', '#ffffff', '#2a1440', '#2a1440', '#2a1440', '#ecdcff', '#ecdcff'];
const SAMMY_PAL = ['#a8703f', '#a8703f', '#d9b48a', '#d9b48a', '#6b3f1d', '#6b3f1d', '#6b3f1d', '#6b3f1d', '#6b3f1d', '#a8703f', '#a8703f', '#b57a45', '#f4a6b8', '#f4a6b8',
  '#9a5b25', '#9a5b25', '#2a1608', '#2a1608', '#f48fb1', '#6b3f1d', '#6b3f1d', '#6b3f1d'];
const SPARKS_PAL = ['#e8b46a', '#e8b46a', '#fff1d6', '#e8b46a', '#e8b46a', '#ff3d3d', '#ffd23f', '#a0642d', '#a0642d', '#e8b46a', '#fff1d6', '#2a1608', '#2a1608', '#2a1608', '#a0642d'];
const NOVA_PAL = ['#9be3ff', '#ffb3f0', '#ffd23f', '#ffffff', '#9b4dff', '#ffffff', '#ff6ec7'];
const art = {
  robo: () => paint(ROBO_PAL, robo), gloop: () => paint(GLOOP_PAL, () => gloop({ crown: true })), baby: () => paint(BABY_PAL, gloop),
  sammy: () => paint(SAMMY_PAL, cat), sparks: () => paint(SPARKS_PAL, puppy), nova: () => paint(NOVA_PAL, nova),
};
// little pictures for the picture sudoku (drawn in a 100x100 box around 0,0)
const PICS = [
  ['Robo', () => G(0, 8, 0.62, paint(ROBO_PAL, () => robo({ noBody: true })))],
  ['Gloop', () => G(0, 12, 0.5, art.gloop())],
  ['Sammy', () => G(0, 4, 0.62, paint(SAMMY_PAL.slice(9), () => cat({ headOnly: true })))],
  ['Star', () => `<path d="${starPts(0, 2, 44, 5, 0.45)}" fill="#ffd23f" stroke="#222" stroke-width="4" stroke-linejoin="round"/>`],
];
// ================== seeded random ==================
function rng(seed) {
  let a = seed >>> 0;
  return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const ri = (r, n) => Math.floor(r() * n);
function shuffle(r, a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = ri(r, i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
// ================== Game Factory words ==================
// [WORD, picture, easy clue]  (clues are short so they fit on one line)
const WORDS = [
  ['ROBO', '🤖', 'White robot with jet boots'], ['GLOOP', '🟣', 'King ___, the purple goo'], ['CROWN', '👑', 'King Gloop wears a gold one'],
  ['SAMMY', '🐱', "Ben's brown tabby cat"], ['SPARKS', '🐶', 'A puppy with his own game'], ['WOOF', '🦸', 'Captain ___, the super dog'],
  ['NOVA', '🌟', 'Chaos ___ has one eye'], ['STAR', '⭐', 'It twinkles in the sky'], ['COIN', '🪙', 'Grab these for points'],
  ['JUMP', '🦘', 'Press this to hop up high'], ['BOSS', '👾', 'Big baddie at the end'], ['LAVA', '🌋', 'Hot goo! Do not touch!'],
  ['MAZE', '🌀', 'Zombie ___: find the way out'], ['ZOMBIE', '🧟', 'Zeke is a friendly one'], ['KART', '🏎️', 'Race car in Kart Party'],

  return { done: !wrong.length && !empty, wrong, empty };
}
function solve(pz) {
  const k = keyOf(pz), first = !state.solved[k];
  state.solved[k] = 1;
  if (first) state.solvedCount = (state.solvedCount || 0) + 1;
  trophy('puzzleBook'); saveState();
  SFX.ding(); confetti();
  toast(first && state.solvedCount === 3 ? '🏅 3 puzzles solved! Your Puzzle Master certificate is ready!' : '🎉 You solved it! Great job, puzzle master!');
  selCell = null; renderPage();
}
function check(auto) {
  const pz = BOOK[cur]; if (showAns) { toast('Hide the answer first, then try it! 😊'); return; }
  const st = puzzleStatus(pz);
  if (st.done) { solve(pz); return true; }
  if (auto && !st.wrong.length) return false;
  if (st.wrong.length) {
    wrongFlash = st.wrong.slice(); SFX.soft(); renderPage();
    toast(st.wrong.length === 1 ? '👀 So close! Look again at the orange box.' : `👀 Almost! Look again at the ${st.wrong.length} orange boxes.`);
    setTimeout(() => { wrongFlash = []; if (view === 'view') renderPage(); }, 2600);
  } else {
    SFX.soft();
    toast(pz.type === 'search' ? `🔍 You found ${pz.words.length - st.empty} of ${pz.words.length}! Keep looking!` : pz.type === 'logic' ? '✏️ Keep going! Every friend needs one ✓.' : `✏️ Keep going! ${st.empty} box${st.empty === 1 ? '' : 'es'} left to fill.`);
  }
  return false;
}
function hint() {
  const pz = BOOK[cur], p = prog(pz); if (showAns) return;
  if (pz.type === 'search') {
    const w = pz.words.find(x => p.f.indexOf(x) < 0); if (!w) return;
    const pl = pz.ws.place[w]; hintCell = pl.y * pz.ws.n + pl.x; renderPage(); toast('💡 A word starts at the orange circle!'); return;
  }
  if (pz.type === 'logic') {
    for (let i = 0; i < 3; i++) { const j = pz.sol[i]; if (p.m[i * 3 + j] !== 1) { p.m[i * 3 + j] = 1; saveState(); renderPage(); toast(`💡 ${pz.friends[i][0]} ${pz.set.has} ${pz.set.items[j][1]}!`); return; } }
    return;
  }
  const order = selCell !== null && selCell !== undefined ? [selCell].concat(pz.cells.map((_, i) => i)) : pz.cells.map((_, i) => i);
  const i = order.find(k => !pz.cells[k].g && p.e[k] !== pz.cells[k].a);
  if (i === undefined) return;
  p.e[i] = pz.cells[i].a; selCell = i; saveState(); SFX.find(); renderPage(); toast('💡 Here is one letter for you!');
  if (puzzleStatus(pz).done) check(true);
}
function toggleAnswer() {
  showAns = !showAns; const b = $('bAns');
  if (b) { b.classList.toggle('on', showAns); b.textContent = showAns ? '🙈 Hide answer' : '🔑 Answer'; }
  renderPage();
}
function clearPuzzle() {
  const pz = BOOK[cur]; delete state.prog[keyOf(pz)]; pend = null; hintCell = null; wrongFlash = []; saveState(); renderPage(); toast('🧽 All clean! Try again!');
}
// ---------- printing (Chrome + iPad Safari): everything goes in #printAll ----------
function doPrint(pages) {
  const pa = $('printAll'); if (!pa) return;
  pa.innerHTML = pages.join('');
  state.printed = (state.printed || 0) + 1; trophy('puzzleBook'); saveState();
  setTimeout(() => { try { if (typeof window.print === 'function') window.print(); } catch (_) {} }, 80);
}
function printBook() { toast('🖨️ Printing your book!'); doPrint(bookPages(BOOK, NAMES[state.name || 0], state.solvedCount || 0)); }
function printPage() { const pz = BOOK[cur]; doPrint([buildPage(pz, { pageNo: PAGE0 + pz.idx, ans: showAns })]); }
function printCert() { doPrint([certSVG(NAMES[certName], state.solvedCount || 0)]); }
// ---------- certificate screen ----------
function openCert() { certName = state.name || 0; setView('cert'); renderCert(); }
function renderCert() {
  if ($('certBox')) $('certBox').innerHTML = certSVG(NAMES[certName], state.solvedCount || 0);
  if ($('names')) $('names').innerHTML = NAMES.map((n, i) => `<button class="chip${i === certName ? ' on' : ''}" data-name="${i}">${n}</button>`).join('');
}
function pickName(i) { certName = state.name = i; saveState(); SFX.tap(); renderCert(); }
function backHome() { setView('home'); renderHome(); markSel(); }
function leave() {
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}
  try { location.href = 'arcade.html'; } catch (_) {}
}
// ================== keys ==================
function gridCols() {
  const th = typeof document !== 'undefined' ? document.querySelectorAll('.thumb') : []; if (!th.length) return 1;
  let n = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) n++; });
  return Math.max(1, n);
}
function moveCell(d) {
  const pz = BOOK[cur]; if (!pz.cells) return;
  const n = pz.cells.length; let i = selCell === null ? -1 : selCell;
  for (let k = 0; k < n; k++) { i = (i + d + n) % n; if (!pz.cells[i].g) break; }
  selCell = i; const gs = groupsOf(pz, i); if (gs.indexOf(curGroup) < 0) curGroup = gs[0]; renderPage();
}
function onKey(e) {
  const k = e.key;
  if (view === 'home') {
    const cols = gridCols(), n = BOOK.length;
    if (k === 'ArrowRight') sel = Math.min(n - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(n - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openPuzzle(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printBook(); return; }
    else if (k === 'Escape') { leave(); return; }
    else return;
    e.preventDefault(); markSel();
  } else if (view === 'view') {
    if (k === 'Escape' || k === 'Backspace') { backHome(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printPage();
    else if (k === 'Enter') { check(); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'ArrowDown') { moveCell(1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { moveCell(-1); e.preventDefault(); }
  } else if (view === 'cert') {
    if (k === 'Escape' || k === 'Backspace') { backHome(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printCert();
    else if (k === 'ArrowRight') pickName((certName + 1) % NAMES.length);
    else if (k === 'ArrowLeft') pickName((certName + NAMES.length - 1) % NAMES.length);
  }
}
// ================== start ==================
function on(id, fn) { const el = $(id); if (el) el.addEventListener('click', e => { fn(e); try { e.currentTarget.blur(); } catch (_) {} }); }
const near = (e, attr) => { let t = e.target; while (t && t.getAttribute) { if (t.getAttribute(attr) !== null && t.getAttribute(attr) !== undefined) return t; t = t.parentNode; } return null; };
function init() {
  loadState(); renderHome();
  on('bLeave', leave); on('bNewAll', newPuzzles); on('bPrintBook', printBook); on('bCert', openCert);
  on('bCheck', () => check()); on('bHint', hint); on('bAns', toggleAnswer); on('bClear', clearPuzzle); on('bPrint', printPage); on('bBack', backHome);
  on('bWL', () => turnWheel(-1)); on('bWR', () => turnWheel(1)); on('bCertPrint', printCert); on('bCertBack', backHome);
  $('pick').addEventListener('click', e => { const t = near(e, 'data-type'), l = near(e, 'data-lv'); if (t) toggleType(t.getAttribute('data-type')); else if (l) setLevel(l.getAttribute('data-lv')); });
  $('grid').addEventListener('click', e => { const t = near(e, 'data-k'); if (t) { SFX.tap(); openPuzzle(+t.getAttribute('data-k')); } });
  $('keys').addEventListener('click', e => { const t = near(e, 'data-key'); if (t) pressKey(t.getAttribute('data-key')); });
  $('names').addEventListener('click', e => { const t = near(e, 'data-name'); if (t) pickName(+t.getAttribute('data-name')); });
  const box = $('svgBox');
  box.addEventListener('click', e => { const c = near(e, 'data-cell'), l = near(e, 'data-lg'); if (c) tapCell(+c.getAttribute('data-cell')); else if (l) tapLogic(+l.getAttribute('data-lg')); });
  box.addEventListener('mousedown', wsDown); window.addEventListener('mouseup', wsUp);
  box.addEventListener('touchstart', wsDown, { passive: false }); box.addEventListener('touchend', wsUp, { passive: false });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
