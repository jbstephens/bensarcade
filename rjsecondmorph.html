function speak(line) {                                   // the browser's voice reads it out loud

    if (window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined') {
      const u = new SpeechSynthesisUtterance(line); u.rate = 0.95; u.pitch = 0.6; u.volume = 1;

// ---------- 🖨️ the printable CHAMPION CERTIFICATE + GLOOP POSTER (letter size, real pictures, no emoji) ----------
function paintTo(w, h, fn) {                             // draw with the game's own drawing code onto a picture
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const keep = ctx, kf = frame; ctx = cv.getContext('2d'); frame = 30;
  try { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, h); fn(); } catch (_) {}
  ctx = keep; frame = kf;
  try { return cv.toDataURL('image/png'); } catch (_) { return ''; }
}
function printCertificate(name) {
  const safe = String(name).replace(/[<>&"]/g, '');
  const row = paintTo(1400, 260, () => {
    drawRoboBase({ x: 60, y: 120, w: 80, h: 116, face: 1, squash: 1 }, save.golden ? PAL_GOLD : PAL_ROBO, null);
    drawDusty(230, 238, { s: 3, face: 1, pose: 'happy', gold: !!save.golden });
    MORPH_LIST.slice(1, 9).forEach((m, j) => { const M = MORPHS[m]; drawMorph(m, 330 + j * 70 - M.w, 230 - M.h * 2, M.w * 2, M.h * 2, 1, { pal: PAL_ROBO }); });
    drawHolo(950, 30, 160, 210, -1, { nice: true });
    drawRoboBase({ x: 1180, y: 120, w: 80, h: 116, face: -1, squash: 1 }, PAL_NEGA, null);
  });
  const cells = VILLAINS.concat(['holo', 'nova']);
  const poster = paintTo(1200, 1500, () => {
    cells.forEach((k, i) => {
      const col = i % 3, r = Math.floor(i / 3), cx = col * 400 + 200 + (i === 9 ? 0 : 0), top = r * 370 + 20, B = BOSSES[k];
      ctx.globalAlpha = 0.18; roundRect(cx - 185, top, 370, 350, 30, B.col); ctx.globalAlpha = 1;
      drawBossAny(k, cx - 120, top + 40, 240, 230, -1, { nice: true, camo: 0 });
      text(B.name, cx, top + 330, B.name.length > 14 ? 26 : 30, B.col === '#ffeb3b' || B.col === '#ffca28' ? '#f9a825' : B.col);
    });
  });
  document.getElementById('print').innerHTML =
    `<div class="pg cert"><h1>SECOND MORPH CHAMPION</h1><h2>Robo Jump: Second Morph</h2><p>This certificate is proudly given to</p>` +
    `<div class="who">${safe}</div><p>for finding all 8 morph orbs, swapping bodies with silly villains,</p><p>and teaching NEGA HOLOGRAM a brand-new morph:</p>` +
    `<p><b>FRIEND!</b></p><img class="row" src="${row}" alt="">` +
    `<p>Nega-Robo says: "Thank you for helping my little holo-brother!"</p><div class="sign"><div>Nega-Robo</div><div>Robo and Dusty</div></div></div>` +
    `<div class="pg poster"><h1>THE MORPH VILLAINS</h1><img src="${poster}" alt=""></div>`;
  try { window.print(); } catch (_) {}
}
function draw() {
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'talk') drawTalk();
  else if (state === 'play') drawPlay();
  else if (state === 'oops') drawOops();
  else if (state === 'clear') drawClear();
  else if (state === 'credits') drawCredits();
  else if (state === 'prizes') drawPrizes();
  else if (state === 'jukebox') drawJukebox();
  else if (state === 'cert') drawCertMenu();
  else if (state === 'ceremony') drawCeremony();
  else if (state === 'morphmenu') drawMorphMenu();
  if (!actx && state === 'title' && frame % 60 < 40) text('🔊 tap or press a key for sound', W / 2, 230, 16, '#fff59d');
  if (codeFX > 0) drawCodeFX();
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
