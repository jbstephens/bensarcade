<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Master Studio</title>
<script>TOUCHPAD = { dpad: true, south: [' ', 'JUMP'], west: ['j', 'POWER'] };</script>
<script src="touchpad.js?v=11"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #0d1033; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 520)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
// 🤖 ROBO MASTER STUDIO: play as 16 different Robos, each with its own POWER on the action button (J / POWER).
// Modes: 🏃 Power Run (a course built around each power), 🏁 Robo Race, 🤸 Robo Battle (friendly bonks), 🏆 Robo Tournament
// (8-Robo bracket, predictions, lucky picks, podium, Hall of Champions), 🗼 Challenge Tower (20 floors), 🖼️ Robo Gallery.
// Drawing helpers + the music engine are copied from Boss Master Studio (bossstudio.html). ?song=NAME plays a song (Jukebox).
const SAVE_KEY = 'roboMasterStudio';
const SAVE_DEFAULT = { runStars: {}, towerBest: 0, raceWins: 0, battleWins: 0, tourHall: [], tourBest: 0, music: true };
// ---------- the canvas + the basics ----------
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 520, GROUND = 460;
const GRAV = 0.6, SPEED = 4.5, JUMP = 12.5, MAXFALL = 14;
const NAME = String(window.GF_NAME || 'Ben');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const num = (v, d) => (typeof v === 'number' && isFinite(v)) ? v : d;
const rand = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let frame = 0, state = 'title', freezeT = 0, shakeAmt = 0;
let save = JSON.parse(JSON.stringify(SAVE_DEFAULT));
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') for (const k in SAVE_DEFAULT) if (k in s && typeof s[k] === typeof SAVE_DEFAULT[k]) save[k] = s[k]; } catch (_) {}
}
loadSave();
function writeSave() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

// ---------- drawing helpers (the same ones as Boss Master Studio) ----------
function roundRect(x, y, w, h, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), Math.max(0, Math.min(r, w / 2, h / 2))); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
  ctx.fill();
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
  ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function mEll(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function mPoly(pts, fill, stroke, lw) {
  ctx.beginPath(); for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function mPath(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function fitText(str, x, y, size, maxW, color, align) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align);
}
function wrapLines(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  const out = []; let line = '';
  for (const wd of String(str).split(' ')) {
    const t = line ? line + ' ' + wd : wd;
    if (line && (ctx.measureText(t).width || 0) > maxW) { out.push(line); line = wd; } else line = t;
  }
  if (line) out.push(line);
  return out;
}
function wrapText(str, x, y, size, maxW, color, gap) { wrapLines(str, size, maxW).forEach((l, i) => text(l, x, y + i * (gap || size * 1.25), size, color)); }
function button(b, label, fill, size = 22, on = false) {
  roundRect(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)');
  roundRect(b.x, b.y, b.w, b.h, 14, fill);
  if (on) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; mPath(b.x, b.y, b.w, b.h, 14); ctx.stroke(); }
  fitText(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
function heart(x, y, s, fill) {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.3);
  ctx.bezierCurveTo(x, y, x - s / 2, y, x - s / 2, y + s * 0.3); ctx.bezierCurveTo(x - s / 2, y + s * 0.6, x, y + s * 0.8, x, y + s);
  ctx.bezierCurveTo(x, y + s * 0.8, x + s / 2, y + s * 0.6, x + s / 2, y + s * 0.3); ctx.bezierCurveTo(x + s / 2, y, x, y, x, y + s * 0.3); ctx.fill();
}
function starShape(x, y, r, fill) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function drawStars(x, y, n, r = 11) { for (let i = 0; i < 3; i++) starShape(x + (i - 1) * (r * 2.3), y, r, i < n ? '#ffd740' : 'rgba(255,255,255,.25)'); }
function overlay(a = 0.55) { ctx.fillStyle = `rgba(0,0,0,${a})`; ctx.fillRect(0, 0, W, H); }
function sky(a, b) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, a); g.addColorStop(1, b); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
function selRing(r) { ctx.strokeStyle = frame % 30 < 15 ? '#fff' : '#ffd740'; ctx.lineWidth = 4; mPath(r.x - 3, r.y - 3, r.w + 6, r.h + 6, 15); ctx.stroke(); }

// ---------- effects ----------
let particles = [], popups = [];
function burst(x, y, cols, n, sp) { for (let i = 0; i < n; i++) { const a = Math.random() * 6.28, s = Math.random() * (sp || 3) + 1; particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 30 + Math.random() * 20, s: 4 + Math.random() * 3, c: pick(cols) }); } }
function popup(x, y, str, color = '#fff59d', size = 28) { popups.push({ x: clamp(num(x, W / 2), 60, W - 60), y: clamp(num(y, 200), 40, H - 40), str, color, size, t: 60 }); }
function confetti(n = 3) { for (let i = 0; i < n; i++) particles.push({ x: Math.random() * W, y: -10, vx: (Math.random() - 0.5) * 2, vy: 1 + Math.random() * 2, life: 260, s: 6, c: pick(['#ffd740', '#ff4081', '#40c4ff', '#69f0ae', '#ea80fc']), conf: 1 }); }
function updFx() {
  for (const p of particles) { p.x += p.vx; p.y += p.vy; if (!p.conf) p.vy += 0.12; p.life--; } particles = particles.filter(p => p.life > 0 && p.y < H + 30);
  for (const q of popups) { q.t--; q.y -= 0.7; } popups = popups.filter(q => q.t > 0);
  if (shakeAmt > 0) shakeAmt *= 0.86;
}
function drawParts(camX = 0) { for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life / 20); ctx.fillStyle = p.c; ctx.fillRect(p.x - (p.conf ? 0 : camX), p.y, p.s, p.conf ? p.s * 1.5 : p.s); } ctx.globalAlpha = 1; }
function drawPopups(camX = 0) { for (const q of popups) { ctx.globalAlpha = Math.min(1, q.t / 15); text(q.str, q.x - (q.w ? camX : 0), q.y, q.size, q.color); } ctx.globalAlpha = 1; }
function wpop(x, y, str, color = '#fff59d', size = 26) { popups.push({ x, y, str, color, size, t: 60, w: 1 }); }   // (a popup in the WORLD: it scrolls)
// ---------- controls: keys, the touch pad (touchpad.js sends the same keys), game pads, and taps on the screen ----------
const keys = { left: false, right: false, up: false, down: false, jump: false, act: false, k1: false, k2: false, k3: false };
const press = { jump: false, enter: false, esc: false, l: false, r: false, u: false, d: false, act: false, k1: false, k2: false, k3: false };
let tap = null, BOT = null;                                  // (BOT: tests can drive the keys)
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  else if (actx.state === 'suspended' && actx.resume) actx.resume();
}
addEventListener('keydown', e => {
  wakeAudio();
  const k = e.key, rep = e.repeat;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; if (!rep) press.l = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; if (!rep) press.r = true; }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; if (!rep) press.d = true; }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; if (!rep) press.u = true; }
  if (k === ' ') { if (!keys.jump) press.jump = true; keys.jump = true; if (e.preventDefault) e.preventDefault(); }
  if (k === 'Enter') press.enter = true;
  if (k === 'Escape') press.esc = true;
  if (k === 'j' || k === 'J' || k === 'Shift') { if (!keys.act) press.act = true; keys.act = true; }
  if (k === '1') { if (!keys.k1) press.k1 = true; keys.k1 = true; }
  if (k === '2') { if (!keys.k2) press.k2 = true; keys.k2 = true; }
  if (k === '3') { if (!keys.k3) press.k3 = true; keys.k3 = true; }
  if ((k === 'm' || k === 'M') && !rep) toggleMusic();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  if (k === ' ') keys.jump = false;
  if (k === 'j' || k === 'J' || k === 'Shift') keys.act = false;
  if (k === '1') keys.k1 = false; if (k === '2') keys.k2 = false; if (k === '3') keys.k3 = false;
});
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
C.addEventListener('mousedown', e => {
  wakeAudio();
  const r = C.getBoundingClientRect();
  tap = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  ptr = { x: tap.x, y: tap.y, down: true };
});
addEventListener('mouseup', () => { ptr.down = false; });
let ptr = { x: 0, y: 0, down: false };
const inBox = (t, b) => !!t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;
const ok = () => press.enter || press.jump;
function clearPress() { for (const k in press) press[k] = false; tap = null; }
const BACK_BTN = { x: 12, y: 8, w: 90, h: 40 };
const backHit = () => press.esc || inBox(tap, BACK_BTN);
function backBtn() { button(BACK_BTN, '⬅', 'rgba(0,0,0,.45)', 22); }

// ---------- a grid of pictures you can pick from (arrows + JUMP, or tap) ----------
function gridMove(sel, n, cols) {
  if (press.l) sel = Math.max(0, sel - 1); if (press.r) sel = Math.min(n - 1, sel + 1);
  if (press.u) sel = Math.max(0, sel - cols); if (press.d) sel = Math.min(n - 1, sel + cols);
  return sel;
}
function gridTap(n, cellFn) { for (let i = 0; i < n; i++) if (inBox(tap, cellFn(i))) return i; return -1; }

// ---------- the menu cards ----------
function drawModeCard(r, m, selected, extra) {
  roundRect(r.x, r.y + 5, r.w, r.h, 18, 'rgba(0,0,0,.35)');
  const g = ctx.createLinearGradient(r.x, r.y, r.x, r.y + r.h); g.addColorStop(0, m.c1); g.addColorStop(1, m.c2);
  roundRect(r.x, r.y, r.w, r.h, 18, g);
  ctx.globalAlpha = 0.18; roundRect(r.x + 8, r.y + 8, r.w - 16, r.h * 0.35, 14, '#fff'); ctx.globalAlpha = 1;
  const bob = selected ? Math.sin(frame * 0.15) * 4 : 0;
  text(m.icon, r.x + r.w / 2, r.y + 62 + bob, 50);
  fitText(m.name, r.x + r.w / 2, r.y + 102, 24, r.w - 16, '#fff');
  wrapLines(m.tip, 15, r.w - 24).slice(0, 2).forEach((l, i) => text(l, r.x + r.w / 2, r.y + 126 + i * 19, 15, '#fffde7'));
  if (extra) fitText(extra, r.x + r.w / 2, r.y + r.h - 10, 15, r.w - 16, '#ffd740');
  if (selected) selRing(r);
}

// ---------- the main loop (the same steady speed on every screen) ----------
const STATES = {};
function update() {
  frame++;
  if (BOT) try { BOT(); } catch (e) { console.log('bot error', e.message); }
  const S = STATES[state]; if (S && S.u) S.u();
  updFx();
  clearPress();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  const S = STATES[state]; if (S && S.d) S.d();
}
let last = performance.now(), acc = 0, LOOP_ERR = null;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  try {
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    playMusic();
    draw();
  } catch (e) { LOOP_ERR = e; console.log('loop error', e && e.stack); acc = 0; clearPress(); }
  requestAnimationFrame(loop);
}
function startLoop() { requestAnimationFrame(loop); }
// ---------- MUSIC ENGINE + SOUNDS (copied from Robo Jump 8) ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump:   () => note(400, 0, 0.15, 'sine', 0.15, 900),
  djump:  () => { note(600, 0, 0.12, 'sine', 0.14, 1300); note(900, 0.05, 0.1, 'triangle', 0.06); },
  hover:  () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  rocket: () => note(90 + Math.random() * 50, 0, 0.07, 'sawtooth', 0.04, 60),
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  star:   () => [880, 1109, 1319, 1760, 2217].forEach((f, i) => note(f, i * 0.07, 0.25, 'sine', 0.12)),
  stomp:  () => note(400, 0, 0.15, 'triangle', 0.2, 100),
  spring: () => note(200, 0, 0.3, 'sine', 0.2, 900),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  check:  () => { note(660, 0, 0.1); note(880, 0.1, 0.2); },
  dash:   () => note(300, 0, 0.2, 'sawtooth', 0.08, 1200),
  drill:  () => { note(160 + Math.random() * 40, 0, 0.08, 'square', 0.05, 120); },
  dig:    () => { note(120, 0, 0.18, 'sawtooth', 0.12, 50); note(400, 0, 0.06, 'square', 0.05, 200); },
  smash:  () => { note(110, 0, 0.4, 'sawtooth', 0.18, 35); note(70, 0.05, 0.4, 'square', 0.1, 30); },
  clank:  () => { note(1200, 0, 0.06, 'square', 0.06, 900); note(600, 0.02, 0.1, 'triangle', 0.08); },
  wall:   () => note(700, 0, 0.1, 'triangle', 0.12, 400),
  morph:  () => { [392, 523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.045, 0.16, 'square', 0.06)); note(200, 0, 0.35, 'sine', 0.12, 1600); },
  nomorph: () => { note(300, 0, 0.12, 'square', 0.07); note(220, 0.1, 0.18, 'square', 0.07); },
  splash: () => note(300, 0, 0.25, 'sine', 0.1, 80),
  bubble: () => note(600 + Math.random() * 300, 0, 0.08, 'sine', 0.06, 1200),
  boing:  () => note(260, 0, 0.22, 'sine', 0.14, 620),
  warn:   () => { note(880, 0, 0.08, 'square', 0.08); note(880, 0.12, 0.08, 'square', 0.08); },
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },

  phase:  () => { note(900, 0, 0.25, 'sine', 0.1, 220); note(1400, 0.03, 0.2, 'triangle', 0.05, 500); note(300, 0, 0.3, 'sawtooth', 0.04, 1200); },
  ready:  () => { note(1319, 0, 0.06, 'sine', 0.06); note(1760, 0.06, 0.1, 'sine', 0.06); },
  crumble: () => { note(140 + Math.random() * 40, 0, 0.25, 'sawtooth', 0.08, 50); },
  shield: () => [523, 784, 1047, 1568].forEach((f, i) => note(f, i * 0.05, 0.25, 'sine', 0.08)),
  pop:    () => { note(800, 0, 0.12, 'square', 0.08, 200); },
  goo:    () => { note(180, 0, 0.25, 'sine', 0.14, 420); note(360, 0.08, 0.2, 'sine', 0.06, 700); },
  giggle: () => [988, 1175, 988, 1319].forEach((f, i) => note(f, i * 0.08, 0.08, 'sine', 0.07)),
  glitch: () => { for (let i = 0; i < 4; i++) note(200 + Math.random() * 1600, i * 0.03, 0.04, 'square', 0.04); },
  rumble: () => { note(60, 0, 0.8, 'sawtooth', 0.12, 35); note(90, 0.1, 0.6, 'square', 0.06, 40); },
  save:   () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.06, 0.12, 'square', 0.07)),       // 💾 floppy disk SAVED
  flip:   () => { note(300, 0, 0.3, 'sine', 0.12, 1200); note(1200, 0.15, 0.3, 'sine', 0.08, 300); },  // 🙃 gravity flip

  bit:    () => [1047, 1568, 2093, 1568, 2637].forEach((f, i) => note(f, i * 0.06, 0.14, 'square', 0.07)),
  taunt:  () => { for (let i = 0; i < 7; i++) note(i % 2 ? 180 : 900 + i * 120, i * 0.045, 0.05, 'square', 0.06); },
  freeze: () => { [1568, 1319, 1047, 784, 523].forEach((f, i) => note(f, i * 0.05, 0.3, 'sine', 0.09)); note(2093, 0.3, 0.6, 'triangle', 0.05, 1047); },   // ⏸ time stops
  unfreeze: () => { [523, 784, 1047, 1319, 1568].forEach((f, i) => note(f, i * 0.04, 0.2, 'sine', 0.08)); },
  rewind: () => { for (let i = 0; i < 10; i++) note(900 - i * 60, i * 0.04, 0.05, 'sawtooth', 0.05); },             // ◀◀ VHS rewind whirr
  camo:   () => { [392, 330, 262, 196].forEach((f, i) => note(f, i * 0.05, 0.12, 'triangle', 0.08)); note(110, 0, 0.3, 'square', 0.03, 220); },   // 📜 old-timey "fwoop"
