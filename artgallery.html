<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🖼️ The Art Gallery</title>
<script src="touchpad.js?v=10"></script>
<style id="baseCss">
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: #4a2f3a; color: #3a2a1a; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- museum wall ---------- */
  #gallery { flex-direction: column;
    background: radial-gradient(ellipse at 50% 0%, #a8473f 0%, #7d2e33 45%, #561d27 100%); }
  #gallery::before { content: ''; position: absolute; inset: 0; pointer-events: none;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.035) 0 3px, transparent 3px 46px); }
  #gHead { text-align: center; padding: 10px 10px 2px; position: relative; }
  #gHead h1 { margin: 0; font-size: clamp(28px, 4.6vw, 54px); color: #ffe082; letter-spacing: 2px;
    text-shadow: 0 3px 0 #8d5a12, 0 6px 12px rgba(0,0,0,.45); }
  #gHead p { margin: 2px 0 0; font-size: clamp(15px, 2vw, 21px); color: #ffe9c4; font-weight: bold; }
  #wall { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 22px 40px; position: relative;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 26px 26px; align-items: end; }
  .piece { display: flex; flex-direction: column; align-items: center; cursor: pointer; position: relative; padding-top: 18px; }
  .piece::before { content: ''; position: absolute; top: 0; left: 50%; width: 2px; height: 22px; background: #c9a24a; }
  .piece::after { content: ''; position: absolute; top: -4px; left: calc(50% - 5px); width: 10px; height: 10px; border-radius: 50%; background: #ffd54f; box-shadow: 0 1px 2px #0006; }
  .frame { padding: 11px; border-radius: 4px; position: relative; transition: transform .15s;
    background: linear-gradient(135deg, #fff1b8 0%, #e0a82e 22%, #9c6a12 50%, #f3c95a 74%, #8a5a0e 100%);
    box-shadow: 0 10px 18px rgba(0,0,0,.5), inset 0 0 0 2px #6b4508; }
  .frame.wood { background: linear-gradient(135deg, #b77a45 0%, #7a4521 30%, #a8653a 55%, #5e3216 100%); }
  .frame .matIn { background: #fffaf0; padding: 9px; box-shadow: inset 0 0 0 1px #d8c9a8, inset 2px 2px 5px rgba(0,0,0,.25); }
  .frame svg { display: block; width: 100%; height: auto; }
  .piece.land .frame { width: 100%; }
  .piece.port .frame { width: 74%; }
  .piece.sel .frame { transform: scale(1.06) rotate(-1deg); box-shadow: 0 0 0 5px #fff, 0 0 26px 8px #ffeb3b, 0 12px 20px rgba(0,0,0,.5); }
  .label { margin-top: 10px; background: linear-gradient(#fff8e1, #f1dfb3); border: 2px solid #b8913f; border-radius: 6px;
    padding: 4px 12px; font-size: 17px; font-weight: bold; color: #4e342e; text-align: center; box-shadow: 0 3px 6px rgba(0,0,0,.35); }
  .wing { grid-column: 1 / -1; text-align: center; margin: 18px 0 -6px; color: #ffe082; font-size: clamp(24px, 3.4vw, 40px); font-weight: bold; letter-spacing: 2px;
    text-shadow: 0 3px 0 #8d5a12, 0 6px 12px rgba(0,0,0,.45); border-top: 4px dashed rgba(255,224,130,.45); padding-top: 14px; }
  .wing small { display: block; font-size: clamp(15px, 2vw, 20px); color: #ffe9c4; letter-spacing: 0; text-shadow: none; }
  .label small { display: block; font-size: 12px; color: #8d6e63; font-weight: normal; }
  .printed { position: absolute; top: 24px; right: 6px; background: #43a047; color: #fff; font-size: 13px; border-radius: 12px;
    padding: 2px 8px; border: 2px solid #fff; box-shadow: 0 2px 4px #0006; z-index: 2; }
  #trophyBar { position: absolute; top: 10px; right: 14px; color: #ffe9c4; font-size: 16px; font-weight: bold; text-align: right; }
  .homeBtn { position: absolute; top: 10px; left: 12px; }
  /* ---------- big buttons ---------- */
  .btn { border: 4px solid #3a2a1a; border-radius: 18px; padding: 10px 18px; font-size: clamp(17px, 2.2vw, 24px); font-weight: bold;
    background: linear-gradient(#fff59d, #ffca28); color: #3a2a1a; box-shadow: 0 5px 0 #3a2a1a; min-height: 56px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #3a2a1a; }
  .btn.blue { background: linear-gradient(#b3e5fc, #4fc3f7); }
  .btn.green { background: linear-gradient(#c5f5a0, #66bb6a); }
  .btn.pink { background: linear-gradient(#ffd0e0, #ff80ab); }
  .btn.small { min-height: 46px; padding: 6px 12px; font-size: 17px; }
  /* ---------- museum mode ---------- */
  #museum { flex-direction: column; align-items: center; justify-content: center; overflow: hidden;
    background: radial-gradient(ellipse at 50% 35%, #3b3155 0%, #1d1729 70%, #110d18 100%); }
  #spot { position: absolute; left: 50%; top: -10%; width: 90vmin; height: 120%; transform: translateX(-50%); pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, rgba(255,245,210,.20) 0%, rgba(255,245,210,.07) 40%, transparent 70%); }
  #bigWrap { position: relative; display: flex; align-items: center; justify-content: center; flex: 1; min-height: 0; width: 100%; padding: 12px 70px 0; }
  #bigFrame { position: relative; max-height: 100%; }
  #bigFrame svg { display: block; }
  #bigTitle { color: #ffe082; font-size: clamp(22px, 3.4vw, 38px); font-weight: bold; margin: 8px 0 4px; text-shadow: 0 3px 8px #000; text-align: center; }
  #bigAbout { color: #ffe9c4; font-size: clamp(15px, 2vw, 20px); margin: 0 16px 4px; max-width: 900px; text-align: center; line-height: 1.3; }
  #bigAbout:empty { display: none; }
  #museumBar { display: flex; gap: 12px; padding: 6px 10px 14px; flex-wrap: wrap; justify-content: center; position: relative; z-index: 3; }
  .arrow { position: absolute; top: 50%; transform: translateY(-50%); z-index: 3; width: 60px; height: 90px; font-size: 34px; border-radius: 16px;
    border: 4px solid #3a2a1a; background: linear-gradient(#fff59d, #ffca28); box-shadow: 0 5px 0 #3a2a1a; }
  #prevBtn { left: 8px; } #nextBtn { right: 8px; }
  #sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 2; }
  .spk { position: absolute; color: #fff8c4; font-size: 22px; opacity: 0; animation: twinkle 3.2s ease-in-out infinite; text-shadow: 0 0 8px #ffeb3b; }
  @keyframes twinkle { 0% { opacity: 0; transform: scale(.3) rotate(0deg); } 45% { opacity: 1; transform: scale(1) rotate(60deg); } 100% { opacity: 0; transform: scale(.3) rotate(140deg); } }
  /* ---------- print setup ---------- */
  #printSetup { background: linear-gradient(160deg, #fdf3dc, #f3dfb6); flex-direction: row; }
  #opts { width: 46%; max-width: 560px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 16px 24px; }
  #opts h2 { margin: 2px 0 6px; font-size: clamp(22px, 3vw, 32px); color: #6d3a12; }
  #opts h3 { margin: 12px 0 6px; font-size: 19px; color: #6d4c41; }
  .choices { display: flex; flex-wrap: wrap; gap: 8px; }
  .choice { border: 4px solid #8d6e63; border-radius: 14px; background: #fff; padding: 8px 12px; font-size: 18px; font-weight: bold;
    color: #4e342e; min-height: 54px; }
  .choice.on { border-color: #2e7d32; background: linear-gradient(#e8f5e9, #b9f6ca); box-shadow: 0 0 0 3px #a5d6a7; }
  .choice.on::before { content: '✔ '; color: #2e7d32; }
  .tip { background: #fff8e1; border: 3px dashed #ffb300; border-radius: 14px; padding: 8px 12px; margin-top: 12px; font-size: 16px; }
  #previewSide { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px; min-width: 0; }
  #paperHolder { position: relative; flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; min-height: 0; }
  #paperScale { position: relative; }
  #paperScale .sheet { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: #fff; box-shadow: 0 8px 22px rgba(0,0,0,.35); }
  #previewNote { font-size: 15px; color: #6d4c41; margin: 6px 0; text-align: center; }
  /* the sheet (same for preview + paper) */
  .sheet { width: 8.5in; height: 10.95in; overflow: hidden; background: #fff; }
  .pwrap { position: relative; }
  .pbox { position: absolute; background: #fff; overflow: visible; }
  .pbox .artHole { position: absolute; overflow: hidden; }
  .pbox .artHole svg { width: 100%; height: 100%; display: block; }
  .pbox .plaque { position: absolute; display: flex; align-items: center; justify-content: center; }
  .pbox .plaque span { background: linear-gradient(#fff6c8, #e9c25a 55%, #c99a2e); border: 0.012in solid #8a6316; border-radius: 0.04in;
    color: #4a3208; font-weight: bold; padding: 0.03in 0.16in; white-space: nowrap; }
  .pbox .cropLine { position: absolute; inset: -0.02in; border: 0.012in dashed #9e9e9e; pointer-events: none; }
  .pbox .scissors { position: absolute; top: -0.2in; left: -0.05in; font-size: 0.16in; color: #9e9e9e; }
  #printArea { display: none; }
  /* ---------- toast ---------- */
  #toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) scale(0); z-index: 50; background: linear-gradient(#fff59d, #ffb300);
    border: 4px solid #3a2a1a; border-radius: 20px; padding: 12px 22px; font-size: 22px; font-weight: bold; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  @media (max-height: 560px) { #gHead p { display: none; } .btn { min-height: 48px; padding: 6px 14px; } }
</style>
<style id="printCss"></style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <h1>🖼️ THE ART GALLERY</h1>
    <p>Pick a picture, then print it and put it in a frame on your wall!</p>
    <div id="trophyBar"></div>
  </div>
  <div id="wall"></div>
</div>
<div id="museum" class="screen">
  <div id="spot"></div>
  <div id="sparkles"></div>
  <button class="arrow" id="prevBtn" aria-label="previous">◀</button>
  <button class="arrow" id="nextBtn" aria-label="next">▶</button>
  <div id="bigWrap"><div id="bigFrame" class="frame"><div class="matIn" id="bigArt"></div></div></div>
  <div id="bigTitle"></div>
  <div id="bigAbout"></div>
  <div id="museumBar">
    <button class="btn" id="mBack">⬅ Back to the wall</button>
    <button class="btn green" id="mPrint">🖨️ Print it for a frame!</button>
  </div>
</div>
<div id="printSetup" class="screen">
  <div id="opts">
    <h2>🖨️ Print for a frame</h2>
    <div id="optTitle" style="font-size:18px;font-weight:bold;color:#4e342e"></div>
    <h3>📏 How big is the frame?</h3>
    <div class="choices" id="sizeChoices"></div>
    <h3>↔️ Which way?</h3>
    <div class="choices" id="orientChoices"></div>
    <h3>✂️ Fill the frame?</h3>
    <div class="choices" id="fitChoices"></div>
    <h3>✨ Extras</h3>
    <div class="choices" id="extraChoices"></div>
    <div class="tip">🌈 For the best colors, print on photo paper or cardstock! Ask a grown-up to help with the printer.</div>
    <div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">
      <button class="btn" id="pBack">⬅ Back</button>
      <button class="btn green" id="pGo">🖨️ PRINT!</button>
    </div>
  </div>
  <div id="previewSide">
    <div id="paperHolder"><div id="paperScale"></div></div>
    <div id="previewNote"></div>
  </div>
</div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
// =====================================================================
// 🖼️ THE ART GALLERY: 40 finished Game Factory posters (inline SVG, no filters). 25-40 hang in THE NEW WING.
// Landscape art is 1200x800 (3:2). Portrait art is 800x1000 (4:5).
// =====================================================================
const OL = '#1b1b2f';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'a0_', artSeq = 0;
function beginArt() { DEFS = []; GC = {}; GP = 'a' + (++artSeq) + '_'; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
// ---- gradients (registered per picture, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
// a round, lit-from-top-left body color
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
// a soft vertical body color
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
// soft glow + soft shadow (fake blur with transparent gradient edges)
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- shapes ----
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
function paint(f, s, w) { return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', w || 2) + ' stroke-linejoin="round" stroke-linecap="round"' : ''); }
const C = (x, y, r, f, s, w, ex) => '<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"' + paint(f, s, w) + (ex || '') + '/>';
const E = (x, y, rx, ry, f, s, w, rot, ex) => '<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + paint(f, s, w) + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : '') + (ex || '') + '/>';
const R = (x, y, w, h, r, f, s, sw, rot, ex) => '<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + paint(f, s, sw) + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : '') + (ex || '') + '/>';
const P = (d, f, s, w, ex) => '<path d="' + d + '"' + paint(f, s, w) + (ex || '') + '/>';
const L = (d, col, w, ex) => '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
const O = (op, inner) => '<g opacity="' + op + '">' + inner + '</g>';
const T = (x, y, txt, size, col, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (col || OL) + '" text-anchor="middle" font-weight="bold" font-family="Chalkboard SE, Comic Sans MS, sans-serif"' + (ex || '') + '>' + txt + '</text>';
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const eglow = (x, y, rx, ry, c, a) => E(x, y, rx, ry, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const twinkle = (x, y, r, col) => glow(x, y, r * 1.6, col || '#fff8c4', .7) + sparkle(x, y, r, col || '#fff');
// seeded random so every picture always looks the same
function rng(seed) { let s = seed >>> 0 || 1; return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }
function starField(W, H, count, seed, maxY, col) {
  const r = rng(seed); let s = '';
  for (let i = 0; i < count; i++) { const x = r() * W, y = r() * (maxY || H), z = r();
    s += z > .93 ? twinkle(x, y, 4 + z * 4, col) : C(x, y, .8 + z * 1.8, col || '#fff', 0, 0, ' opacity="' + n(.35 + z * .6) + '"'); }
  return s;
}
// light rays from a point (fake god rays)
function rays(x, y, len, count, col, a, spread, start) {
  let s = ''; spread = spread || Math.PI * 2; start = start === undefined ? -Math.PI / 2 - spread / 2 : start;
  for (let i = 0; i < count; i++) { const a1 = start + (i + .5) * spread / count, w = spread / count * .32;
    s += P(poly([x, y, x + Math.cos(a1 - w) * len, y + Math.sin(a1 - w) * len, x + Math.cos(a1 + w) * len, y + Math.sin(a1 + w) * len]), lin([[0, col, a], [1, col, 0]], x, y, x + Math.cos(a1) * len, y + Math.sin(a1) * len, true)); }
  return s;
}
// puffy cloud, lit from above
function cloud(x, y, s, top, bot, a) {
  const f = lin([[0, top || '#ffffff'], [1, bot || '#cfd8ec']]);
  return G(x, y, s, '<g' + (a ? ' opacity="' + a + '"' : '') + '>' + E(0, 18, 92, 22, f) + C(-48, 6, 30, f) + C(-10, -10, 42, f) + C(36, 2, 32, f) + C(64, 12, 22, f) + '</g>');
}
// finished picture wrapper
function svgWrap(W, H, body, ex) {
  const cp = clip('frame', '<rect x="0" y="0" width="' + W + '" height="' + H + '"/>');
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W + ' ' + H + '" overflow="hidden" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs><g' + cp + '>' + body + '</g></svg>';
}
// =====================================================================
// CHARACTERS (each drawn around 0,0, about 120 tall, feet near y=56)
// =====================================================================
function jetFlame(x, y, s, hot) {
  return G(x, y, s || 1, eglow(0, 16, 16, 26, hot || '#7df9ff', .7) +
    P('M-8 0 Q-10 18 0 38 Q10 18 8 0 Z', lin([[0, '#ffffff'], [.4, hot || '#7df9ff'], [1, hot || '#7df9ff', 0]])) +
    P('M-4 0 Q-5 10 0 22 Q5 10 4 0 Z', '#ffffff', 0, 0, ' opacity=".9"'));
}
// ROBO: white round robot, dark visor, blue eyes, blue ear pods, antenna, jet boots
function robo(o) {
  o = o || {}; const H = o.head || '#f4f7fb', B = o.body || H, V = o.visor || '#1d2836', EY = o.eye || '#40c4ff',
    PD = o.pod || '#2979ff', RIM = o.rim || '#bff3ff', LG = o.legs || B; let s = '';
  if (o.morph === 'rocket') s += R(-30, 2, 22, 40, 9, vshade('#ff3d00'), OL, 2.5) + R(-28, 16, 18, 6, 2, '#ffd740', 0) + P('M-30 40 L-36 52 L-8 52 L-14 40 Z', '#bf360c', OL, 2) + jetFlame(-22, 52, 1.1, '#ffab40');
  if (o.boots) s += jetFlame(-9, 54, .9, o.flame) + jetFlame(9, 54, .9, o.flame);

    else if (k === 'Escape' || k === 'Backspace') { show('gallery'); markSel(); }
    else if (k === 'p' || k === 'P' || k === 'Enter') openPrint();
    else return;
  } else if (screen === 'printSetup') {
    const i = SIZES.findIndex(z => z.id === opts.size);
    if (k === 'ArrowRight' || k === 'ArrowDown') { opts.size = SIZES[Math.min(SIZES.length - 1, i + 1)].id; renderOpts(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { opts.size = SIZES[Math.max(0, i - 1)].id; renderOpts(); }
    else if (k === 'Escape' || k === 'Backspace') openMuseum();
    else if (k === 'p' || k === 'P' || k === 'Enter') doPrint();
    else return;
  }
  e.preventDefault();
}
function init() {
  buildWall();
  $('prevBtn').addEventListener('click', () => step(-1));
  $('nextBtn').addEventListener('click', () => step(1));
  $('mBack').addEventListener('click', () => { blip(440); show('gallery'); markSel(); });
  $('mPrint').addEventListener('click', openPrint);
  $('pBack').addEventListener('click', () => { blip(440); openMuseum(); });
  $('pGo').addEventListener('click', doPrint);
  window.addEventListener('keydown', onKey);
  window.addEventListener('resize', () => { if (screen === 'museum') sizeBig(); if (screen === 'printSetup') renderPreview(); });
  window.addEventListener('afterprint', () => buildWall());
  // opened in a new tab just for printing (iPad)
  const m = /[?&]print=([^&]+)/.exec(location.search);
  if (m) { try { const q = JSON.parse(decodeURIComponent(m[1])); sel = Math.max(0, Math.min(ART.length - 1, q.i | 0)); Object.keys(opts).forEach(key => { if (q[key] !== undefined) opts[key] = q[key]; });
    show('printSetup'); renderOpts(); setTimeout(doPrint, 500); } catch (_) {} }
}
if (!window.ART_TEST) init();
</script>
