<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>💙 Dusty's Cozy Corner</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #1a2340; display: flex; align-items: center; justify-content: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 16px; touch-action: none; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
// 💙 DUSTY'S COZY CORNER: a calm, gentle place for when something feels scary.
// Breathe with Dusty's bubble, pop soft bubbles, let Dusty sweep the scary noise away, and hear kind words from friends.
// All sounds here are VERY soft. Trophy 'cozyCorner' after one full breathing round.
const C = document.getElementById('c'), ctx = C.getContext('2d'), W = 960, H = 540;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (copied from Robo: The Beginning) ----------
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(20,30,60,.8)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// ---------- VERY soft sounds (never loud: the whole page goes through one quiet volume knob) ----------
let actx = null, master = null, soundOn = true;
function audio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.25; master.connect(actx.destination); }
    if (actx.state !== 'running') actx.resume();
  } catch (_) {}
  return actx;
}
function softNote(f, d = 0.6, v = 0.05, when = 0) {      // a gentle, round "bell" note
  if (!soundOn) return; const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.5, 0.05); }
function voice(line) {
  try { if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line); u.rate = 0.85; u.pitch = 1.15; u.volume = 0.8; speechSynthesis.speak(u); } catch (_) {}
}
</script>
<script>
// ---------- the cozy room ----------
const STARS = Array.from({ length: 70 }, (_, i) => ({ x: (i * 137) % W, y: (i * 61) % 300, r: 0.8 + (i % 3) * 0.6, p: i }));
function room() {
  const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#1a2350'); g.addColorStop(1, '#3b3a6e'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  for (const s of STARS) circle(s.x, s.y, s.r, `rgba(255,255,230,${0.35 + 0.35 * Math.sin(frame * 0.02 + s.p)})`);
  circle(840, 80, 38, '#fff6c8'); circle(856, 70, 34, '#1f2754');                    // a sleepy moon
  roundRect(0, 440, W, 100, 0, '#4a3f6b'); roundRect(120, 452, 720, 70, 35, '#6a5a9a'); // a soft rug
  ctx.fillStyle = 'rgba(255,220,150,.08)'; ctx.beginPath(); ctx.arc(150, 300, 220, 0, 7); ctx.fill();  // warm lamp glow
  roundRect(132, 230, 36, 210, 8, '#8d6e63'); ctx.fillStyle = '#ffd180'; ctx.beginPath(); ctx.moveTo(95, 240); ctx.lineTo(205, 240); ctx.lineTo(180, 180); ctx.lineTo(120, 180); ctx.fill();
}
// ---------- screens ----------
let screen = 'home', btns = [], talk = '', talkT = 0, saidHello = false;
function say(line, speak = true) { talk = line; talkT = 0; if (speak) voice(line.replace(/[^\w\s!?.,'’-]/g, '')); }
function button(x, y, w, h, label, col, fn) { btns.push({ x, y, w, h, fn }); roundRect(x, y + 5, w, h, 22, 'rgba(0,0,0,.25)'); roundRect(x, y, w, h, 22, col); text(label, x + w / 2, y + h / 2, 26); }
function bubbleTalk(x, y, line) {
  if (!line) return; ctx.font = 'bold 24px "Trebuchet MS", Arial'; const lines = wrap(line, 430);
  const w = 470, h = 26 + lines.length * 32; roundRect(x, y, w, h, 20, '#fffdf5');
  ctx.fillStyle = '#fffdf5'; ctx.beginPath(); ctx.moveTo(x + 30, y + h); ctx.lineTo(x + 10, y + h + 26); ctx.lineTo(x + 70, y + h); ctx.fill();
  ctx.fillStyle = '#3a2f5c'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; lines.forEach((l, i) => ctx.fillText(l, x + 22, y + 29 + i * 32));
}
function wrap(s, maxW) { const out = []; let cur = ''; for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }

// 🏠 home
function home() {
  drawDusty(250, 430, { s: 4.2, pose: 'idle', mouth: talkT < 90 });
  bubbleTalk(330, 70, talk || "Hi Ben! That loud noise was a glitch, and it's all fixed now. You're safe here with me. Want to do something cozy?");
  text("💙 Dusty's Cozy Corner", 600, 32, 34, '#b3e5fc');
  button(360, 250, 270, 80, '🫧 Breathe with me', '#4fc3f7', () => startBreathe());
  button(650, 250, 270, 80, '🫧 Pop bubbles', '#ba68c8', () => { screen = 'bubbles'; say('Tap the bubbles. They go plip!'); });
  button(360, 345, 270, 80, '🧹 Sweep it away', '#ff8a65', () => startSweep());
  button(650, 345, 270, 80, '💌 Kind words', '#81c784', () => kindWord());
}
// 🫧 breathe: a bubble grows (breathe in) and shrinks (breathe out), 5 times
let br = null;
function startBreathe() { screen = 'breathe'; br = { t: 0, n: 0 }; say("Let's breathe together. Breathe in while the bubble grows... and out while it shrinks.", true); }
function breathe() {
  const IN = 240, OUT = 300, cyc = IN + OUT, k = br.t % cyc, grow = k < IN, p = grow ? k / IN : 1 - (k - IN) / OUT;
  const ease = 0.5 - 0.5 * Math.cos(Math.PI * p), r = 60 + ease * 130;
  const g = ctx.createRadialGradient(560, 260, r * 0.2, 560, 260, r); g.addColorStop(0, 'rgba(179,229,252,.9)'); g.addColorStop(1, 'rgba(129,212,250,.25)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(560, 260, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(560, 260, r, 0, 7); ctx.stroke();
  ellipse(560 - r * 0.4, 260 - r * 0.45, r * 0.18, r * 0.09, 'rgba(255,255,255,.7)', -0.6);
  text(grow ? 'Breathe IN...' : 'Breathe OUT...', 560, 260, 34);
  if (k === 0) softNote(392, 1.6, 0.04); if (k === IN) softNote(330, 1.8, 0.04);
  drawDusty(190, 440, { s: 3.6, pose: br.n >= 5 ? 'happy' : 'idle' });
  for (let i = 0; i < 5; i++) heart(420 + i * 70, 500, 16, i < br.n ? '#ff80ab' : 'rgba(255,255,255,.25)');
  br.t++; if (br.t % cyc === 0) { br.n++; if (br.n === 5) { trophy('cozyCorner'); say("You did it! You're calm and brave. I'm so proud of you, Ben!"); softNote(523, 1, 0.05); softNote(659, 1, 0.05, 0.25); softNote(784, 1.4, 0.05, 0.5); } }
  if (br.n >= 5) bubbleTalk(330, 20, talk);
  button(20, 20, 140, 60, '🏠 Back', '#5c6bc0', () => goHome());
}
// 🫧 bubbles
const bubbles = [];
function bubblesScreen() {
  if (frame % 40 === 0 && bubbles.length < 14) bubbles.push({ x: 300 + Math.random() * 620, y: 560, r: 26 + Math.random() * 30, sp: 0.6 + Math.random() * 0.7, ph: Math.random() * 6, pop: 0, hue: Math.floor(Math.random() * 360) });
  for (const b of bubbles) {
    if (b.pop) { b.pop++; ctx.strokeStyle = `hsla(${b.hue},80%,80%,${1 - b.pop / 15})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(b.x, b.y, b.r + b.pop * 2, 0, 7); ctx.stroke(); continue; }
    b.y -= b.sp; b.x += Math.sin(frame * 0.02 + b.ph) * 0.5;
    ctx.fillStyle = `hsla(${b.hue},80%,80%,.25)`; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, 7); ctx.fill();
    ctx.strokeStyle = `hsla(${b.hue},80%,90%,.8)`; ctx.lineWidth = 2.5; ctx.stroke(); ellipse(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.2, b.r * 0.1, 'rgba(255,255,255,.8)', -0.6);
  }
  for (let i = bubbles.length - 1; i >= 0; i--) if (bubbles[i].pop > 15 || bubbles[i].y < -80) bubbles.splice(i, 1);
  drawDusty(190, 440, { s: 3.6, pose: 'idle' });
  text('Tap the bubbles! 🫧', 600, 40, 30, '#e1bee7');
  button(20, 20, 140, 60, '🏠 Back', '#5c6bc0', () => goHome());
}
// 🧹 sweep the scary noise away: a grumpy little noise cloud; each tap, Dusty sweeps a bit until it turns into stars
let sw = null;
function startSweep() { screen = 'sweep'; sw = { hp: 6, x: 620, stars: [], done: false, dx: 330 }; say("See that grumpy noise cloud? Tap it, and I'll sweep it away!"); }
function sweepScreen() {
  if (!sw.done) {
    const r = 50 + sw.hp * 12, wob = Math.sin(frame * 0.2) * 3;
    for (const [dx, dy, k] of [[-0.6, 0.1, 0.6], [0.55, 0.1, 0.65], [0, -0.3, 0.8], [0, 0.2, 0.75]]) circle(sw.x + dx * r + wob, 250 + dy * r, r * k, '#78909c');
    circle(sw.x - 18, 240, 6, '#263238'); circle(sw.x + 18, 240, 6, '#263238');
    ctx.strokeStyle = '#263238'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(sw.x, 275, 14, Math.PI + 0.4, -0.4); ctx.stroke();
    text('BZZT', sw.x + 80, 160 + wob, 22, '#cfd8dc');
  }
  for (const s of sw.stars) { s.y += s.vy; s.vy *= 0.98; s.x += s.vx; ctx.save(); ctx.globalAlpha = Math.max(0, 1 - s.age++ / 160); heart(s.x, s.y, 10, s.c); ctx.restore(); }
  drawDusty(sw.dx, 440, { s: 3.6, pose: sw.done ? 'happy' : (frame % 60 < 30 ? 'sweep' : 'idle') });
  if (sw.done) bubbleTalk(380, 40, talk);
  else text('Tap the noise cloud! 🧹', 600, 40, 30, '#ffccbc');
  button(20, 20, 140, 60, '🏠 Back', '#5c6bc0', () => goHome());
}
function sweepHit() {
  if (sw.done) return; sw.hp--; plip(); sw.dx = Math.min(sw.x - 120, sw.dx + 40);
  for (let i = 0; i < 6; i++) sw.stars.push({ x: sw.x, y: 250, vx: (Math.random() - 0.5) * 5, vy: -1 - Math.random() * 3, age: 0, c: ['#ff80ab', '#ffd740', '#80d8ff'][i % 3] });
  if (sw.hp <= 0) { sw.done = true; say("All gone! Swish swish! That noise can't bother you anymore. It turned into hearts!"); softNote(523, 1, 0.05); softNote(784, 1.3, 0.05, 0.3); }
}
// 💌 kind words from friends
const KIND = [
  "Robo says: Being a little scared is okay. Even I get scared sometimes, and then I feel better!",
  "Dusty says: I'm right here with you, Ben. Swish swish!",
  "Pink Robo says: You are SO brave, and I'm sending you a big heart hug!",
  "Sparks says: Woof! Charlie and August say you're the best game inventor ever!",
  "King Gloop says: Even kings get startled! Ouch, my crown... but I'm fine now, and so are you!",
  "Baby Gloop says: Hug! Big squishy hug!",
  "Time Robo says: That noise is in the past now. Tick tock, all better!",
  "Musical Robo says: Let's play only soft, gentle songs today.",
  "Robo Zero says: I'm the oldest robot, and I promise: you are safe and loved.",
  "Nega-Robo says: You helped make me a friend. Now I'm your friend too!",
];
let ki = -1;
function kindWord() { screen = 'kind'; ki = (ki + 1) % KIND.length; say(KIND[ki]); softNote(659, 0.8, 0.04); }
function kindScreen() {
  for (let i = 0; i < 8; i++) heart(360 + i * 75, 470 + Math.sin(frame * 0.05 + i) * 8, 14, ['#ff80ab', '#ffd740', '#80d8ff', '#b2ff59'][i % 4]);
  drawDusty(190, 440, { s: 3.6, pose: 'happy' });
  bubbleTalk(330, 70, talk);
  button(420, 330, 300, 80, '💌 Another one!', '#81c784', () => kindWord());
  button(20, 20, 140, 60, '🏠 Back', '#5c6bc0', () => goHome());
}
function goHome() { screen = 'home'; say("I'm here whenever you need me, Ben.", false); }
// ---------- loop + taps ----------
function loop() {
  frame++; talkT++; btns = []; room();
  if (screen === 'home') home(); else if (screen === 'breathe') breathe(); else if (screen === 'bubbles') bubblesScreen(); else if (screen === 'sweep') sweepScreen(); else kindScreen();
  button(W - 170, H - 75, 150, 55, soundOn ? '🔉 Soft' : '🔇 Quiet', '#455a64', () => { soundOn = !soundOn; if (!soundOn) try { speechSynthesis.cancel(); } catch (_) {} });
  requestAnimationFrame(loop);
}
function tap(e) {
  const r = C.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  audio();
  if (!saidHello && screen === 'home') { saidHello = true; voice("Hi Ben! That loud noise was a glitch, and it's all fixed now. You're safe here with me."); }
  for (const b of btns) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); return; }
  if (screen === 'bubbles') for (const b of bubbles) if (!b.pop && Math.hypot(x - b.x, y - b.y) < b.r + 10) { b.pop = 1; plip(); return; }
  if (screen === 'sweep' && !sw.done && Math.hypot(x - sw.x, y - 250) < 130) sweepHit();
}
C.addEventListener('pointerdown', tap);
addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); if (e.key === 'Enter' && screen === 'home') startBreathe(); });
loop();
</script>
</body>
</html>
