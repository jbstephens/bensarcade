<body>

  <div id="top">
    <div id="title">🥽 Game Factory VR</div>

<script>
'use strict';
// 🥽 GAME FACTORY VR: four gentle VR places for the Meta Quest browser (WebXR), and a drag-to-look version everywhere else.
//   🏛️ Museum (teleport around halls of real Game Factory screenshots, Robo statue)   🏕️ Blanket Fort (pet Sammy, rain, cocoa)
//   🌌 Space Walk (Earth, Moon, Robo floats by, point for true facts)                 🎨 3D Paint Studio (draw glowing lines in the air)
// Comfort: you only ever move by teleporting (museum) or with your own head. The world never turns or slides by itself.
// Sound is OFF until you press 🔊, and very soft (master 0.12). Trophy 'gfVR' = try all 4 places (3 outside VR).
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const $ = id => document.getElementById(id);
const FONT = '"Trebuchet MS", Arial, sans-serif';
let renderer, world, camera, rig, fader, clockT = 0;
const EYE = { home: 1.3, museum: 1.3, fort: 0.85, space: 1.2, paint: 1.3 };
function initWorld() {
  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local-floor');   // y = 0 is the real floor
  document.body.prepend(renderer.domElement);
  world = new THREE.Scene(); world.background = new THREE.Color(0x120a2a);
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.03, 1200); camera.rotation.order = 'YXZ';
  rig = new THREE.Group(); rig.add(camera); world.add(rig);   // the "you" group: teleporting moves this (never by itself)
  // a black bubble around your eyes for a quick, soft blink when you teleport or change places
  fader = new THREE.Mesh(new THREE.SphereGeometry(0.25, 16, 12), new THREE.MeshBasicMaterial({ color: 0, side: THREE.BackSide, transparent: true, opacity: 1, depthTest: false, depthWrite: false }));
  fader.renderOrder = 999; fader.frustumCulled = false; camera.add(fader);

// ---------- canvas helpers ----------
function rr(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function fitText(c, s, x, y, maxW, size, weight) {
  let f = size; c.font = `${weight || 800} ${f}px ${FONT}`;
  while (c.measureText(s).width > maxW && f > 12) { f -= 2; c.font = `${weight || 800} ${f}px ${FONT}`; }
  c.fillText(s, x, y);
}
function wrapLines(c, s, maxW) {

  for (const w of words) { const t = line ? line + ' ' + w : w; if (c.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t; }
  if (line) lines.push(line); return lines;
}
function canvasTex(w, h, draw, repeat) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h; draw(cv.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(cv);
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
function glowTex(inner, outer) {   // a soft round glow (for fairy lights, the Sun, sparkles, steam)
  return canvasTex(128, 128, (c) => { const g = c.createRadialGradient(64, 64, 0, 64, 64, 64); g.addColorStop(0, inner || 'rgba(255,255,255,1)'); g.addColorStop(.35, outer || 'rgba(255,255,255,.35)'); g.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, 128, 128); });
}
function heartTex() {
  return canvasTex(128, 128, (c) => { c.fillStyle = '#ff7aa8'; c.beginPath(); c.moveTo(64, 108); c.bezierCurveTo(-10, 56, 26, 2, 64, 40); c.bezierCurveTo(102, 2, 138, 56, 64, 108); c.fill();
    c.fillStyle = 'rgba(255,255,255,.6)'; c.beginPath(); c.arc(44, 44, 10, 0, 7); c.fill(); });
}
const lam = (color, extra) => new THREE.MeshLambertMaterial(Object.assign({ color }, extra || {}));
const basic = (color, extra) => new THREE.MeshBasicMaterial(Object.assign({ color }, extra || {}));
function mesh(geo, mat, x, y, z, parent) { const m = new THREE.Mesh(geo, mat); m.position.set(x || 0, y || 0, z || 0); if (parent) parent.add(m); return m; }

<script>
'use strict';
// ---------- floating panels (drawn on canvases): the big menu, the toolbar, and the pop-up sign ----------
const PANELS = [];
function makePanel(W, H, meters, parent, draw) {
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const tex = new THREE.CanvasTexture(cv); tex.minFilter = THREE.LinearFilter; tex.generateMipmaps = false;
  const m = new THREE.Mesh(new THREE.PlaneGeometry(meters, meters * H / W), new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthTest: false, depthWrite: false }));
  m.renderOrder = 10; parent.add(m);
  const P = { mesh: m, cv, c: cv.getContext('2d'), tex, W, H, btns: [], hover: -1, draw };
  m.userData.panel = P; if (draw) PANELS.push(P);

}
function redraw(P) { if (!P.draw) return; P.btns.length = 0; P.c.clearRect(0, 0, P.W, P.H); P.draw(P, P.c); P.tex.needsUpdate = true; }
function btn(P, x, y, w, h, label, act, style) {
  const c = P.c, id = P.btns.length; P.btns.push({ x, y, w, h, act });

  c.fillStyle = on ? '#4a2c00' : '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  if (Array.isArray(label)) { c.font = `${Math.round(h * .38)}px sans-serif`; c.fillText(label[0], x + w / 2, y + h * .36); fitText(c, label[1], x + w / 2, y + h * .78, w - 14, Math.min(26, h * .2)); }

function shown(o) { for (; o; o = o.parent) if (!o.visible) return false; return true; }
function hitPanels(ray) {

  const h = ray.intersectObjects(ms, false)[0];
  if (!h) return null;
  const P = h.object.userData.panel, x = h.uv.x * P.W, y = (1 - h.uv.y) * P.H;
  return { d: h.distance, point: h.point, P, b: P.btns.findIndex(b => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) };

function setHover(P, i) { if (P.hover !== i) { P.hover = i; redraw(P); } }
// the pop-up sign (names, facts, "you got a trophy")
let signRoot, sign, signTimer = 0;
function showSign(text, ms, small) {
  const c = sign.c, W = sign.W, H = sign.H; c.clearRect(0, 0, W, H);
  let size = small ? 44 : 70, lines;
  for (;;) { c.font = `900 ${size}px ${FONT}`; lines = wrapLines(c, text, W - 90); if (lines.length * size * 1.22 < H - 40 || size < 22) break; size -= 3; }
  const h = lines.length * size * 1.22 + 40;
  c.fillStyle = 'rgba(12,8,36,.78)'; rr(c, 6, (H - h) / 2, W - 12, h, 36); c.fill();
  c.lineWidth = 4; c.strokeStyle = 'rgba(255,214,64,.7)'; c.stroke();
  c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle';
  let y = (H - h) / 2 + 20 + size * .62; lines.forEach(l => { c.fillText(l, W / 2, y); y += size * 1.22; });
  sign.tex.needsUpdate = true; sign.mesh.material.opacity = 1; placeUI(signRoot, true); sign.mesh.visible = true; signTimer = (ms || 2500) / 1000;
}
// put a panel group in front of wherever you are looking (it only turns left/right, never tilts the world)
const _v = new THREE.Vector3(), _w = new THREE.Vector3();
function headYaw() { camera.getWorldDirection(_v); return Math.hypot(_v.x, _v.z) < .1 ? null : Math.atan2(-_v.x, -_v.z); }
function placeUI(g, keepTurn) {
  const y = headYaw(); g.position.set(camera.position.x, 0, camera.position.z);
  if (y !== null) g.rotation.y = y - rig.rotation.y; else if (!keepTurn) g.rotation.y = 0;
  g.updateMatrixWorld(true);
  g.children.forEach(m => { if (m.userData.face) { camera.getWorldPosition(_w); m.position.y = camera.position.y + m.userData.face; m.updateMatrixWorld(true); m.lookAt(_w); } });

// ---------- 🤖 Robo: white head, dark visor, blue eyes, blue ear pods, antenna with a red ball ----------
function makeRobo() {
  const R = new THREE.Group(), W = lam(0xf4f6fb), BL = lam(0x2f8cff), DK = lam(0x1a1f36);
  const EY = basic(0x6fd0ff);
  mesh(new THREE.BoxGeometry(.5, .55, .34), W, 0, .55, 0, R);                       // body
  mesh(new THREE.BoxGeometry(.26, .2, .02), BL, 0, .6, .175, R);                   // blue chest panel
  mesh(new THREE.SphereGeometry(.07, 12, 8), basic(0xffd640), 0, .6, .19, R).scale.set(1, 1, .3);
  const head = new THREE.Group(); head.position.y = 1.08; R.add(head);
  mesh(new THREE.BoxGeometry(.6, .46, .46), W, 0, 0, 0, head);                     // white head
  mesh(new THREE.BoxGeometry(.48, .24, .04), DK, 0, .01, .235, head);              // dark visor
  [-.11, .11].forEach(x => mesh(new THREE.SphereGeometry(.045, 14, 10), EY, x, .02, .255, head));   // blue eyes
  [-.33, .33].forEach(x => mesh(new THREE.CylinderGeometry(.1, .1, .08, 18), BL, x, 0, 0, head).rotation.z = Math.PI / 2);   // ear pods
  mesh(new THREE.CylinderGeometry(.015, .015, .22, 8), lam(0xb0b8c8), 0, .34, 0, head);        // antenna
  mesh(new THREE.SphereGeometry(.055, 14, 10), lam(0xff3b3b, { emissive: 0x551010 }), 0, .47, 0, head);   // red ball

    mesh(new THREE.CylinderGeometry(.055, .05, .42, 10), W, 0, -.2, 0, p); mesh(new THREE.SphereGeometry(.075, 12, 8), BL, 0, -.43, 0, p); return p; };

  [-.13, .13].forEach(x => { mesh(new THREE.CylinderGeometry(.065, .065, .3, 10), W, x, .15, 0, R); mesh(new THREE.BoxGeometry(.15, .08, .22), BL, x, .02, .03, R); });

}
function waveRobo(R, t) { R.userData.armR.rotation.z = 2.4 + .45 * Math.sin(t * 4); R.userData.armL.rotation.z = -.15 - .05 * Math.sin(t * 1.3); R.userData.head.rotation.z = .08 * Math.sin(t * 1.1); }
// ---------- 🔈 gentle, optional sound: OFF until you press 🔊; master never above 0.12 ----------
const Sound = (() => {
  let ctx = null, master = null, noise = null, on = false, amb = null, purrN = null;
  const MAX = 0.12;
  function init() {
    if (ctx) return;

  }

<script>
'use strict';
// ---------- the places, and moving between them (always through a soft fade to black) ----------
const X = {};   // each place: { e, t, desc, col, build(), enter(), exit(), update(dt,t), tools(P,c), act(a), select(hit,ctrl), selectEnd(ctrl), targets, floor }
const ORDER = ['museum', 'fort', 'space', 'paint'];
let cur = null, pendingGo = null, pendingMove = null, fadeV = 1, fadeWant = 0, fadeRate = 2.5, uiRoot, menu, tool, toolOn = true, vrUsed = false, won = false, triedTimer = 0;
const tried = new Set();
function go(id) { if (id === cur && !pendingGo) return; pendingGo = id; fadeWant = 1; fadeRate = 2.5; }
function teleport(p) { pendingMove = p.clone(); fadeWant = 1; fadeRate = 9; Sound.whoosh(); }
function switchNow(id) {
  const old = X[cur];
  if (old) { old.group.visible = false; if (old.exit) old.exit(); }
  const P = X[id]; if (!P.group) { P.group = new THREE.Group(); world.add(P.group); P.build(P.group); }
  cur = id; P.group.visible = true;
  rig.position.copy(P.start || new THREE.Vector3()); rig.rotation.y = 0;
  if (!renderer.xr.isPresenting) { camera.position.set(0, EYE[id], 0); yaw = 0; pitch = id === 'space' ? -.12 : id === 'fort' ? -.42 : -.08; if (id === 'fort') yaw = .55; camera.rotation.set(pitch, yaw, 0); }
  world.background = P.bg || new THREE.Color(0x120a2a);
  if (P.enter) P.enter();
  menu.mesh.visible = id === 'home'; tool.mesh.visible = id !== 'home' && toolOn;
  camera.updateMatrixWorld(true); placeUI(uiRoot); redraw(menu); redraw(tool);
  Sound.ambient(id); Sound.purr(false);
  clearTimeout(triedTimer);
  if (id !== 'home') { showSign(P.e + ' ' + P.t, 2200); triedTimer = setTimeout(() => { tried.add(id); redraw(menu); checkWin(); }, 3000); }
}
function checkWin() { if (!won && tried.size >= (vrUsed ? 4 : 3)) { won = true; trophy('gfVR'); setTimeout(() => { showSign('🏆 You got the Game Factory VR trophy!', 4000); Sound.chime(); }, 600); } }

function act(a) {
  Sound.prime();

  else if (a.k === 'home') { Sound.pop(); go('home'); }
  else if (a.k === 'sound') { Sound.toggle(cur); redraw(menu); redraw(tool); }
  else if (a.k === 'hide') { setTool(false); showSign(renderer.xr.isPresenting ? '👉 Press A or X to get the buttons back!' : '👆 Tap 🏠 Menu at the top to get the buttons back!', 2800, true); }

// ---------- 🏠 the lobby: a starry purple sky and a glowing round floor ----------
const SKY_VS = 'varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
function skyDome(top, mid, bot, stars, r) {
  return new THREE.Mesh(new THREE.SphereGeometry(r || 300, 40, 20), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,

    try { const L = s.renderState.baseLayer; if (L && 'fixedFoveation' in L) L.fixedFoveation = 1; } catch (_) {}   // softer edges of your view = smoother
    $('vrBtn').textContent = '🚪 Exit VR'; placeIn = 20; setTool(true); redraw(tool);
  } catch (e) { console.warn(e); showSign('😮 VR did not start. Ask Dad to help!', 3500, true); }
}
// ---------- every frame ----------
let lastT = 0;
function loop(now) {
  const dt = Math.min(.05, lastT ? (now - lastT) / 1000 : 1 / 60), xr = renderer.xr.isPresenting; lastT = now; clockT += dt;
  // the soft fade between places / teleports
  fadeV = fadeWant > fadeV ? Math.min(fadeWant, fadeV + dt * fadeRate) : Math.max(fadeWant, fadeV - dt * fadeRate * .8);
  if (fadeV >= 1) {
    if (pendingGo) { const id = pendingGo; pendingGo = null; try { switchNow(id); } catch (e) { console.error(e); } fadeWant = 0; fadeRate = 2.5; }
    else if (pendingMove) { rig.position.copy(pendingMove); pendingMove = null; fadeWant = 0; }
  }
  fader.material.opacity = fadeV; fader.visible = fadeV > .002;
  if (placeIn > 0 && --placeIn === 0) placeUI(uiRoot);   // after stepping into VR: put the buttons where you are looking
  if (X[cur] && X[cur].group && X[cur].update) X[cur].update(dt, clockT);
  if (signTimer > 0) { signTimer -= dt; if (signTimer < .5) sign.mesh.material.opacity = Math.max(0, signTimer / .5); if (signTimer <= 0) sign.mesh.visible = false; }
  if (xr) { updateControllers(); if (session) pollPads(session); }
  else camera.rotation.set(pitch, yaw, 0);
  renderer.render(world, camera);
}
// ---------- start ----------
(() => {
  const oops = msg => { $('loading').classList.add('gone'); const o = $('oops'); if (msg) o.innerHTML = msg; o.style.display = 'flex'; };
  if (!window.THREE) return oops('😮 The 3D drawing kit did not load.<br>Check the internet, or ask Dad to help with this one!');
  try { initWorld(); } catch (e) { console.error(e); return oops(); }
  ray.camera = camera;
  initUI(); initXRInput(); initMouse();
  const q = /[?&]place=(\w+)/.exec(location.search);
  pendingGo = q && X[q[1]] ? q[1] : 'home'; fadeWant = 1;
  renderer.setAnimationLoop(loop);
  checkVR();
  setTimeout(() => $('loading').classList.add('gone'), 400);
  setTimeout(() => $('hint').classList.add('gone'), 12000);
  window.GFVR = { go, act, X, MUSE, tried, PANELS, get cur() { return cur; }, get won() { return won; }, renderer, camera, rig, world, setView(y, p) { yaw = y; pitch = p; }, menu, tool, pointHit, mouseRay, clickAt };
})();
</script>
