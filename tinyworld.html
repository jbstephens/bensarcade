<script>
'use strict';
// ---------- Shared shader bits: hashing, noise, fbm, and a filmic "camera" finish ----------
// uZ = 0..1 how far we zoomed, uM = magnification (1 = normal size), screen height = 3 cm at uM=1
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade; uniform float uZ; uniform float uM;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
vec3 h23(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yxz+33.33); return fract((p3.xxy+p3.yzz)*p3.zyx); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
float sdSeg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
float segH(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; return clamp(dot(pa,ba)/dot(ba,ba),0.,1.); }
float sdEll(vec2 p, vec2 r){ float k=length(p/r); return (k-1.)*min(r.x,r.y); }
// voronoi: x = distance to nearest point, y = distance to edge, zw = id of nearest cell
vec4 voro(vec2 p){ vec2 n=floor(p), f=fract(p); vec2 mg, mr; float md=8.;
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 g=vec2(i,j); vec2 o=h22(n+g); vec2 r=g+o-f; float d=dot(r,r); if(d<md){ md=d; mr=r; mg=g; } }
  float ed=8.;
  for(int j=-2;j<=2;j++) for(int i=-2;i<=2;i++){ vec2 g=mg+vec2(i,j); vec2 o=h22(n+g); vec2 r=g+o-f;
    if(dot(mr-r,mr-r)>.00001) ed=min(ed, dot(.5*(mr+r), normalize(r-mr))); }
  return vec4(sqrt(md), ed, n+mg); }
// "how much of this detail is bigger than a pixel" (0 = too small to see, 1 = clearly visible)
float lod(float size, float px){ return smoothstep(1.5, 5., size/px); }
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;
const SRC = [];
</script>
<script>
// ---------- 1. SNOWFLAKE on a navy wool mitten ----------
SRC.push(`
float hexd(vec2 p, float r){ p=abs(p); return max(dot(p,vec2(.866,.5)), p.y)-r; }
// the snowflake crystal, radius 1: a six-armed "stellar dendrite"
float flake(vec2 p){
  float r=length(p); float a=atan(p.y,p.x);
  a=mod(a+PI/6., PI/3.)-PI/6.; a=abs(a);
  vec2 q=r*vec2(cos(a),sin(a));
  float d=hexd(p.yx, .17);
  d=min(d, sdSeg(q, vec2(0), vec2(.93,0))-mix(.05,.02,q.x));
  for(int i=0;i<7;i++){
    float fi=float(i); float x0=.25+fi*.095;
    float L=(1.-x0)*(.42+.3*h11(fi*3.1+1.))*(1.-.12*fi/7.);
    vec2 a0=vec2(x0,0.), dir=vec2(.5,.866), b0=a0+dir*L;
    d=min(d, sdSeg(q,a0,b0)-mix(.024,.009,segH(q,a0,b0)));
    for(int k=0;k<3;k++){ float s=.28+.24*float(k); vec2 c=a0+dir*L*s; float l2=L*(1.-s)*(.5+.3*h11(fi*7.+float(k)));
      d=min(d, sdSeg(q,c,c+vec2(.87,.5)*l2*.9)-mix(.012,.005,segH(q,c,c+vec2(.87,.5)*l2*.9))); }
  }
  d=min(d, hexd((q-vec2(.95,0)).yx, .055));
  return d;
}
// how thick the ice is (ridges down the middle of every arm and branch)
float iceH(vec2 p){
  float d=flake(p);
  float r=length(p); float a=atan(p.y,p.x); a=mod(a+PI/6., PI/3.)-PI/6.; a=abs(a); vec2 q=r*vec2(cos(a),sin(a));
  float h=smoothstep(0.,.03,-d)*.6;
  h+=.35*exp(-q.y*q.y*2500.)*step(.17,q.x)*step(d,0.);        // central rib of each arm
  h+=.25*smoothstep(.006,0.,abs(hexd(p.yx,.11)))+.2*smoothstep(.005,0.,abs(hexd(p.yx,.06)));   // rings in the middle plate
  h+=.25*exp(-q.y*q.y*4000.)*step(q.x,.17);                   // ribs across the plate
  return h;
}
// navy wool: knit stitches made of fuzzy, slightly wobbly yarn
vec3 wool(vec2 p, float px){
  vec2 wp=p+(vec2(noise(p*14.),noise(p*14.+5.))-.5)*.018;
  vec2 sp=wp/vec2(.12,.1); vec2 cell=floor(sp); vec2 f=fract(sp);
  float u=f.x*2.-1.; float v=f.y;
  float side=sign(u+1e-4); float lx=side*(.05+.5*v);
  float wid=.6+.1*(noise(p*25.)-.5);
  float across=(u-lx)/wid; float ve=(v-.45)/.7;
  float k=across*across+ve*ve*1.1; float bump=sqrt(max(0.,1.-k));
  float ang=side*.45;
  vec2 fp=rot(ang)*p;
  float ply=.5+.5*sin(fp.y*70.+fp.x*900.*side+noise(fp*80.)*2.);       // twisted plies of the yarn
  float f1=noise(vec2(fp.x*900.,fp.y*50.)+cell*13.), f2=noise(vec2(fp.x*3500.,fp.y*160.)+cell*7.);
  float fibs=mix(1., .55+.9*f1, lod(.0011,px)*.8); fibs*=mix(1., .6+.8*f2, lod(.0003,px)*.8);
  float lit=.6-.45*across*side*.6+.3*(1.-abs(across));                  // light from the upper left
  float shade=pow(bump,.6)*lit*(.7+.3*ply)*fibs;
  vec3 heather=mix(vec3(.022,.04,.13), vec3(.04,.055,.16), noise(p*60.));
  vec3 col=heather*(.12+1.25*shade);
  col*=.55+.45*smoothstep(0.,.35,bump);                                 // deep shadows between loops
  // stray wool hairs: little curly arcs floating above the yarn (a bit out of focus)
  for(int L=0;L<2;L++){ float g=L==0?.02:.006; vec2 q=p/g; vec2 id=floor(q);
    for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec2 c=id+vec2(i,j); vec3 r=h23(c+float(L)*17.);
      if(r.z>.55) continue;
      vec2 a=c+r.xy; float an=r.z*40.; vec2 d1=vec2(cos(an),sin(an)); float bend=2.*(r.x-.5);
      vec2 m1=a+d1*.6; d1=rot(bend)*d1; vec2 m2=m1+d1*.6; d1=rot(bend)*d1; vec2 e=m2+d1*.6;
      float dd=min(min(sdSeg(q,a,m1),sdSeg(q,m1,m2)),sdSeg(q,m2,e))*g;
      float w=max(px*1.5, (L==0?.0003:.00016)*(1.+uZ*1.5));
      col+=vec3(.06,.09,.22)*smoothstep(w,0.,dd)*lod(L==0?.0004:.00015,px)*(.3+.4*r.y); } }
  return col;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float t=uT;
  float px=1./(uRes.y*uM);
  vec2 tgt=mix(vec2(0.), vec2(.0055,.036), smoothstep(.05,.9,uZ));
  vec2 p=tgt+uv/uM;
  vec3 col=wool(p,px);
  // tiny sparkly ice plates sprinkled on the wool
  vec4 vc=voro(p*35.); vec2 cid=vc.zw;
  if(h21(cid)<.025 && length(cid)>5.){ vec2 o=(p*35.-cid-h22(cid))/35.; float s=.003+.003*h21(cid+2.);
    float hd=hexd(rot(h21(cid+5.)*3.)*o, s); float m=smoothstep(px*1.5,-px,hd);
    col=mix(col, col*.6+vec3(.15,.2,.3)+.5*smoothstep(.0008,0.,abs(hd)), m*.6);
    col+=vec3(.9,.95,1.)*exp(-length(o)/s*3.)*pow(.5+.5*sin(t*1.7+h21(cid)*40.),8.)*1.5; }
  // the snowflake
  float R=.065; vec2 fq=rot(.08)*p/R; float fpx=px/R;
  float d=flake(fq);
  if(d<fpx*3.){
    float e=fpx*1.5;
    float h=iceH(fq), hx=iceH(fq+vec2(e,0)), hy=iceH(fq+vec2(0,e));
    vec3 n=normalize(vec3(-(hx-h)/e*.012, -(hy-h)/e*.012, 1.));
    vec3 L=normalize(vec3(-.5,.6,.6));
    float dif=max(dot(n,L),0.); float spec=pow(max(dot(reflect(-L,n),vec3(0,0,1)),0.),40.);
    float mask=smoothstep(fpx*1.2,-fpx*1.2,d);
    float rim=exp(-abs(d)/(.006+fpx*2.));
    vec3 tint=.5+.5*cos(6.28*(d*40.+vec3(0,.33,.67)));                // thin rainbow edges
    float w1=max(fpx*1.,.0009);
    float edge=exp(-abs(d)/w1);                                          // bright outline
    float band=smoothstep(w1*.8,w1*3.,-d)*smoothstep(w1*9.,w1*4.,-d);      // dark band just inside
    float inner=exp(-abs(d+.011)/(w1*.7))*step(d,0.);                    // a second line inside each arm
    vec3 ice=vec3(.1,.16,.27)*(.3+1.1*h)+vec3(.5,.65,.9)*dif*.12*h+vec3(1.)*spec*.9;
    ice+=mix(vec3(.9,.96,1.),tint,.4)*edge*1.1+vec3(.75,.85,1.)*inner*.35-vec3(.1,.1,.08)*band*.6;
    ice+=vec3(.5,.65,.9)*.12*smoothstep(.0,.004,abs(sin(-d*900.)))*lod(.006*R,px)*step(d,0.);   // growth steps up close
    ice+=vec3(.25,.3,.4)*(fbm4(fq*60.)-.5)*.4*step(d,0.);
    float bub=smoothstep(.3,.18,length(fract(fq*22.)-.5-.3*(h22(floor(fq*22.))-.5)));
    ice+=vec3(.3,.4,.5)*bub*step(h21(floor(fq*22.)),.12)*step(d,-.01)*.5;
    col=mix(col, col*.6+ice, mask)+vec3(.85,.92,1.)*edge*(1.-mask)*.25;
    // gentle twinkles
    vec2 sid=floor(fq*9.); float tw=pow(.5+.5*sin(t*2.1+h21(sid)*60.),24.)*step(h21(sid+4.),.25);
    col+=vec3(1.)*tw*exp(-length(fract(fq*9.)-.5)*10.)*mask*1.4;
  } else col+=vec3(.6,.7,.9)*.05*exp(d*6.)*0.;
  col*=1.15*(.6+.55*exp(-dot(uv,uv)*1.3));
  gl_FragColor=vec4(finish(col,uv),1.);
}`);
</script>
<script id="engine">
'use strict';
// ---------- the drawing engine: one full-screen rectangle, one shader per subject ----------
const cv = document.getElementById('gl');
const gl = cv.getContext('webgl', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });
const progs = [];
let scene = 0, want = 0, fade = 0, last = 0, running = true, raf = 0, sceneT = 0;
let zCur = 0, zWant = 0, autoZ = 0, autoDir = 1;    // zoom: where we are, where we're going, auto-zoom on/off
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
let scale = Math.min(window.devicePixelRatio || 1, 1) * (isTouch ? 0.7 : 0.9);
const frameTimes = [];
function compile(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) { console.error(gl.getShaderInfoLog(s)); return null; }
  return s;
}
function build(i) {
  if (progs[i]) return progs[i];
  const vs = compile(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}');
  const fs = compile(gl.FRAGMENT_SHADER, COMMON + SRC[i]);
  if (!vs || !fs) return null;
  const p = gl.createProgram(); gl.attachShader(p, vs); gl.attachShader(p, fs);
  gl.bindAttribLocation(p, 0, 'a'); gl.linkProgram(p);

<script id="soundCode">
'use strict';
// ---------- gentle, optional sound (OFF by default, very quiet, always fades in and out) ----------
const Sound = (() => {
  let ctx = null, master = null, noiseBuf = null, on = false, cur = null, curIdx = 0, lastZ = -1;
  const MAX = 0.12;

  const P = [['lowpass', 500, .10, [392, 587.3, 784]], ['bandpass', 1300, .06, [261.6, 329.6, 392]], ['lowpass', 650, .32, [196, 293.7]],
    ['bandpass', 1100, .07, [220, 329.6, 440]], ['bandpass', 1500, .05, [293.7, 370, 440]], ['bandpass', 900, .06, [246.9, 370]],
    ['highpass', 1800, .03, [523.3, 659.3, 784]], ['lowpass', 380, .08, [174.6, 261.6, 349.2]]];

    if (ctx) return;

    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -30; comp.ratio.value = 8;
    master.connect(comp); comp.connect(ctx.destination);

    for (let i = 0; i < d.length; i++) { const w = Math.random() * 2 - 1; b = (b + 0.02 * w) / 1.02; d[i] = w * 0.5 + b * 3; }

    const nodes = [], c = P[i];
    const n = ctx.createBufferSource(); n.buffer = noiseBuf; n.loop = true; n.start();
    const f = ctx.createBiquadFilter(); f.type = c[0]; f.frequency.value = c[1]; f.Q.value = .6;
    const g = ctx.createGain(); g.gain.value = c[2]; n.connect(f); f.connect(g); g.connect(out); nodes.push(n, lfo(0.07, c[2] * .35, g.gain));

    c[3].forEach((fr, k) => { const o = ctx.createOscillator(), og = ctx.createGain(); o.type = 'sine'; o.frequency.value = fr; og.gain.value = 1 / (k + 1.5);
      o.connect(og); og.connect(pad); o.start(); nodes.push(o, lfo(0.05 + k * 0.04, 0.3 / (k + 1.5), og.gain)); });

  // zooming in makes the sound a little brighter and dreamier (very gently)
  function zoom(z) {
    if (!on || !cur || Math.abs(z - lastZ) < 0.02) return; lastZ = z;
    const t = ctx.currentTime; cur.f.frequency.setTargetAtTime(cur.base * (1 + z * 1.2), t, 0.4); cur.pad.gain.setTargetAtTime(0.05 + z * 0.05, t, 0.6);

  }

    float fl=lod(.0008,px); en=normalize(en+vec3(ho*fl*.8,0.));
    vec3 ec=vec3(.04,.035,.03)*(.5+.6*max(dot(en,L),0.))+vec3(.9)*pow(max(dot(reflect(-L,en),vec3(0,0,1)),0.),40.)*.6+fl*smoothstep(.38,.5,length(ho))*vec3(.03);
    col=mix(col, ec, smoothstep(px,-px,ed)); }
  float an=min(sdSeg(p,vec2(-.235,.1),vec2(-.27,.17))-.0045, sdSeg(p,vec2(-.27,.17),vec2(-.315,.15+.005*sin(t)))-.004);
  col=mix(col, vec3(.05,.035,.03), smoothstep(px,-px,an));
  // near legs, the back one carrying a big orange ball of pollen
  float nleg=min(leg(p,vec2(-.16,.03),vec2(-.215,-.08),vec2(-.24,fy+.004),.01), leg(p,vec2(.0,.0),vec2(.07,-.08),vec2(.11,-.18),.011));
  col=mix(col, vec3(.07,.045,.03)*(1.+.6*smoothstep(-.01,0.,nleg)), smoothstep(px,-px,nleg));
  float pb=length((p-vec2(.055,-.068))/vec2(1.,1.25))-.027-.003*noise(p*200.);
  if(pb<px){ vec2 pq=(p-vec2(.055,-.068))/.027; vec3 pn=normalize(vec3(pq,sqrt(max(0.,1.-dot(pq,pq)))));
    vec3 pc=vec3(.95,.55,.08)*(.35+.8*max(dot(pn,L),0.)); pc*=.85+.3*smoothstep(.3,.1,length(fract(p/.0012)-.5))*lod(.0006,px);
    col=mix(col, pc, smoothstep(px,-px,pb)); }
  // see-through wings with veins and a rainbow shimmer
  vec2 wq=rot(-.22)*(p-vec2(.07,.18)); float wd=sdEll(wq,vec2(.17,.055));
  vec2 wq2=rot(-.12)*(p-vec2(.08,.135)); float wd2=sdEll(wq2,vec2(.11,.035));
  float wm=max(smoothstep(px,-px,wd), smoothstep(px,-px,wd2)*.8);
  if(wm>0.){ float vein=smoothstep(.0025+px,.001,min(min(abs(wq.y-.012*sin(wq.x*12.)), abs(wq.y+.025-.03*wq.x)), abs(length(wq-vec2(-.02,0.))-.06)));
    vec3 irid=.5+.5*cos(6.28*(wq.x*4.+wq.y*9.+vec3(0,.33,.67)));
    col=mix(col, col*.85+vec3(.08,.09,.1)+irid*.04, wm*.6); col=mix(col, vec3(.15,.1,.06), vein*wm*.8);
    col+=vec3(1.)*.1*wm*smoothstep(.05,.0,abs(wq.y-.02)); }
  // up close: real hairs, one by one, with feathery branches
  float hl=clamp((.0003/px-1.)/2.,0.,1.);
  if(hl>0. && bd<.018){
    vec4 h1=fur(p,bd,pt,px);
    vec3 hc=pt==0.?vec3(.32,.26,.18):(pt==1.?vec3(.95,.74,.4):vec3(.85,.6,.3));
    col=mix(col*(1.-.35*hl*step(bd,0.)), hc*h1.y, h1.x*hl*.95);
  }
  vec4 pl=pollen(p,px); col=mix(col, pl.rgb, pl.a*lod(.00025,px));
  gl_FragColor=vec4(finish(col*1.1,uv),1.);
}`;
</script>
<script>
// ---------- 7. DEWDROP on a little spider web: each drop is a tiny lens showing the flower upside down ----------
SRC.push(`
const vec2 HUB=vec2(-.62,.5);
// the blurry garden far behind the web, with one pink flower
vec3 bgAt(vec2 w){
  vec3 c=mix(vec3(.06,.14,.05), vec3(.3,.42,.2), smoothstep(-.6,.7,w.y+.3*fbm4(w*2.)));
  c=mix(c, vec3(.55,.68,.85), smoothstep(.35,.75,w.y+.1*fbm4(w*3.))*.7);
  vec2 f=w-vec2(.28,.22); float a=atan(f.y,f.x); float r=length(f);
  float petal=.16+.05*cos(a*6.);
  c=mix(c, mix(vec3(.95,.35,.6), vec3(1.,.6,.8), smoothstep(petal,0.,r)), smoothstep(petal+.07,petal-.07,r));
  c=mix(c, vec3(1.,.8,.2), smoothstep(.08,.02,r));
  c=mix(c, vec3(.15,.35,.1), smoothstep(.05,.005,abs(f.x+.02*f.y))*smoothstep(-.08,-.16,f.y)*smoothstep(-.9,-.6,f.y));     // its stem
  for(int i=0;i<6;i++){ vec2 o=vec2(h11(float(i)*3.1)*2.-1., h11(float(i)*7.3)-.5); float rr=.05+.04*h11(float(i)*1.7);
    c+=vec3(.8,.9,.6)*.08*smoothstep(rr,rr*.8,length(w-o)); }
  return c;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float t=uT;
  float px=1./(uRes.y*uM);
  vec2 tgt=vec2(0.);
  vec2 p=tgt+uv/uM+vec2(0.,.0015*sin(t*.6))/uM*0.;
  vec2 W0=uv*.75+tgt*.4;
  vec3 col=bgAt(W0);
  // the web: spokes from the hub and a spiral thread
  vec2 d=p-HUB; float r=length(d), th=atan(d.y,d.x);
  float r0=length(-HUB), th0=atan(-HUB.y,-HUB.x), sp=.1;
  float sw=(r-r0)/sp-(th-th0)/6.2832;
  float sdist=abs(fract(sw+.5)-.5)*sp;
  float spoke=1.; for(int i=0;i<14;i++){ float a=float(i)*.4488+.11; spoke=min(spoke, abs(sin(th-a))*r+step(cos(th-a),0.)); }
  float tw=max(px*.8,.00025);
  float thread=max(smoothstep(tw,0.,sdist), smoothstep(tw,0.,spoke)*.9);
  vec3 silk=vec3(.85,.9,.95)+.25*(.5+.5*cos(6.28*(r*30.+vec3(0,.33,.67))));
  col=mix(col, silk, thread*.75*mix(1.,.35,lod(.0008,px)));
  // dewdrops beaded along the spiral thread (and one big drop right in the middle)
  float k=floor(sw+.5); float rk=r0+(k+(th-th0)/6.2832)*sp; float arc=th*rk;
  float ds=.02; float jc=floor(arc/ds);
  vec3 drop=vec3(0); float dm=0.;
  for(int j=-1;j<=1;j++){
    float id=jc+float(j); vec3 h=h23(vec2(id,k));
    if(h.z>.8) continue;
    float R=.0016+.0065*h.x*h.x;
    float ta=(id+.5+.3*(h.y-.5))*ds/rk; vec2 c=HUB+(r0+(k+(ta-th0)/6.2832)*sp)*vec2(cos(ta),sin(ta));
    if(length(c)<.04) continue;
    vec2 q=(p-c)/R; float qq=dot(q,q);
    if(qq<1.){ vec3 n=vec3(q,sqrt(1.-qq)); vec2 sc=(c-tgt)*uM*.75+tgt*.4;
      vec3 inside=bgAt(sc-q*.55);
      float fres=pow(1.-n.z,2.5);
      vec3 dc=inside*(1.-.7*fres)+vec3(.02,.04,.03)*fres;
      dc+=vec3(1.)*smoothstep(.85,.97,dot(n,normalize(vec3(-.45,.55,.7))))*1.2;
      dc+=vec3(1.,1.,.9)*.35*smoothstep(.35,.0,length(q-vec2(.45,-.5)));
      drop=dc; dm=smoothstep(1.,1.-px/R*2.,sqrt(qq)); }
  }
  col=mix(col, drop, dm);
  // the big hero drop: perfectly round, with the flower inside upside down
  float RH=.021; vec2 hq=(p-vec2(0.,.0))/RH; float hqq=dot(hq,hq);
  col*=1.-.2*smoothstep(1.3,1.,sqrt(hqq))*(1.-step(hqq,1.));
  if(hqq<1.){ vec3 n=vec3(hq,sqrt(1.-hqq));
    vec3 inside=bgAt(W0*0.+tgt*.4-hq*.6+vec2(.25,.15)*0.+vec2(.28,.22)*0.);
    inside=bgAt(vec2(.28,.22)*.0+(-hq)*.62+vec2(.28,.12)*1.);
    float fres=pow(1.-n.z,2.2);
    vec3 dc=inside*(1.-.75*fres)+vec3(.02,.04,.03)*fres;
    dc+=vec3(1.)*smoothstep(.965,.985,dot(n,normalize(vec3(-.45,.55,.7))))*1.4+vec3(1.)*.15*smoothstep(.8,.95,dot(n,normalize(vec3(-.45,.55,.7))));                     // sparkle of sunlight
    dc+=vec3(1.)*.25*smoothstep(.93,.99,dot(n,normalize(vec3(.6,.6,.5))));
    dc+=vec3(1.,1.,.85)*.4*smoothstep(.4,.0,length(hq-vec2(.42,-.55)))*.8;                       // bright spot where light gathers
    dc*=1.-.25*smoothstep(.0,.3,abs(hq.y+.0))*0.;
    col=mix(col, dc, smoothstep(1.,1.-px/RH*2.,sqrt(hqq)));
  }
  gl_FragColor=vec4(finish(col*1.1,uv),1.);
}`);
</script>
<script>
// ---------- 8. SALT: every grain is a tiny cube (the big one has stair-step "hopper" faces) ----------
SRC.push(`
const vec3 F=vec3(0.,.5735,-.8192), UP=vec3(0.,.8192,.5735);
const float G=.02;
// the crystal in a table cell: centre xy, half size, turn
vec4 crystal(vec2 cell){
  if(cell==vec2(0.)) return vec4(.0035,.002,.0075,.45);
  if(abs(cell.x)<1.5 && abs(cell.y)<1.5) return vec4(0.,0.,-1.,0.);
  vec3 r=h23(cell*1.13+5.); float dens=.12+.75*smoothstep(.75,.15,length(cell*G+vec2(.05,-.02))+.25*noise(cell*.4));
  if(h21(cell+.5)>dens) return vec4(0.,0.,-1.,0.);
  return vec4((cell+.25+.5*r.xy)*G, .0022+.0028*r.z*r.z, r.z*6.28+r.x*3.);
}
// ray against one crystal: returns t (or -1) and the face normal (in the crystal's own frame) + local hit point
float hitBox(vec3 ro, vec3 rd, vec4 cr, out vec3 nl, out vec3 lp){
  if(cr.z<=0.) return -1.;
  vec3 c=vec3(cr.xy, cr.z); mat2 R=rot(cr.w);
  vec3 o=ro-c; o.xy=R*o.xy; vec3 d=rd; d.xy=R*d.xy;
  vec3 inv=1./d; vec3 t1=(-vec3(cr.z)-o)*inv, t2=(vec3(cr.z)-o)*inv;
  vec3 tn=min(t1,t2), tf=max(t1,t2);
  float tN=max(max(tn.x,tn.y),tn.z), tF=min(min(tf.x,tf.y),tf.z);
  if(tF<max(tN,0.)) return -1.;
  nl=tN==tn.x?vec3(-sign(d.x),0,0):(tN==tn.y?vec3(0,-sign(d.y),0):vec3(0,0,-sign(d.z)));
  lp=(o+d*tN)/cr.z;
  return tN;
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float t=uT;
  float px=1./(uRes.y*uM);
  vec2 tgt=mix(vec2(0.,-.002), vec2(.002,.008), smoothstep(.1,.9,uZ));
  vec2 p=tgt+uv/uM;
  vec3 ro=vec3(p.x,0.,0.)+UP*p.y-F; vec3 rd=F;
  vec3 L=normalize(vec3(-.45,.5,.75));
  float tt=-ro.z/rd.z; vec3 hp=ro+rd*tt;
  vec2 mc=floor((hp.xy-rd.xy*.006/(-rd.z))/G);
  float best=1e9; vec3 bn=vec3(0), blp=vec3(0); vec4 bcr=vec4(0);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){
    vec4 cr=crystal(mc+vec2(i,j)); vec3 nl, lp; float h=hitBox(ro,rd,cr,nl,lp);
    if(h>0. && h<best){ best=h; bn=nl; blp=lp; bcr=cr; } }
  // the dark slate table, with soft shadows from the crystals
  vec3 col=vec3(.045,.05,.065)*(.75+.5*noise(hp.xy/.002))*(.85+.3*noise(hp.xy/.0004)*lod(.0003,px));
  col+=vec3(.08,.09,.11)*smoothstep(.6,-.2,length(hp.xy+vec2(.25,-.35)));
  float shad=0.; vec2 sc=floor(hp.xy/G);
  for(int j=-1;j<=1;j++) for(int i=-1;i<=1;i++){ vec4 cr=crystal(sc+vec2(i,j)); vec3 nl, lp;
    if(hitBox(hp+vec3(0,0,.00001),L,cr,nl,lp)>0.) shad=1.; }
  col*=1.-.55*shad;
  if(best<1e8){
    vec3 nl=bn; vec2 fuv=nl.z!=0.?blp.xy:(nl.x!=0.?blp.yz:blp.xz);
    float e=max(abs(fuv.x),abs(fuv.y));
    mat2 Ri=rot(-bcr.w); vec3 n=nl; n.xy=Ri*n.xy;
    float hero=step(.007,bcr.z);
    // stair-step hopper faces on the big crystal's top
    float steps=0.;
    if(nl.z>.5){ float lv=e*7.; steps=hero*smoothstep(.08,.0,abs(fract(lv)-.5)-.42); n=normalize(n+hero*vec3(Ri*(sign(fuv)*step(abs(fuv.y),abs(fuv.x))*vec2(1,0)+sign(fuv)*step(abs(fuv.x),abs(fuv.y))*vec2(0,1))*.25*smoothstep(.15,.9,e),0.)); }
    float dif=max(dot(n,L),0.);
    vec3 base=vec3(.78,.8,.84);
    vec3 cc=base*(.18+.75*dif);
    cc+=vec3(.9,.95,1.)*(.25*smoothstep(.75,.98,e)+.5*smoothstep(.95,1.,e));        // light caught in the edges
    cc*=1.-.25*smoothstep(.55,.85,e)*smoothstep(1.,.9,e);                             // darker band inside each face
    cc*=1.-.35*steps;
    cc+=vec3(1.)*pow(max(dot(reflect(-L,n),-rd),0.),60.)*.8;
    cc*=.9+.2*noise(fuv*12.+bcr.xy*99.);
    cc*=1.-.2*smoothstep(.3,.7,fbm4(fuv*30.+bcr.xy*50.))*lod(.0002,px);             // tiny chips and scratches
    cc+=vec3(.95,.97,1.)*pow(.5+.5*sin(t*1.5+bcr.x*900.),40.)*smoothstep(.98,1.,e)*.8;
    col=cc;
  }
  gl_FragColor=vec4(finish(col*1.2,uv),1.);
}`);
