<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌧️ Robo's Rainy Treehouse</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #1e1a2e; display: flex; align-items: center; justify-content: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 16px; touch-action: none; }
  /* ☕ the REAL recipe card (HTML, so it prints nicely). NO emoji inside the card itself, only on the buttons. */
  #recipe { display: none; position: fixed; inset: 0; z-index: 50; background: rgba(20,15,35,.78); align-items: center; justify-content: center; }
  #recipe .card { background: #fffaf0; color: #4e342e; width: min(92vw, 640px); max-height: 92vh; overflow: auto; border-radius: 22px; padding: 18px 28px 22px; box-sizing: border-box;
    font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; border: 6px solid #8d6e63; -webkit-user-select: text; user-select: text; }
  #recipe h1 { margin: 6px 0 2px; font-size: 32px; color: #6d4c41; }
  #recipe h2 { margin: 14px 0 4px; font-size: 23px; color: #ad4b2a; }
  #recipe .sub { margin: 0; font-size: 17px; color: #8d6e63; }
  #recipe ul, #recipe ol { margin: 4px 0; padding-left: 28px; font-size: 19px; line-height: 1.45; }
  #recipe .grown { color: #c62828; }
  #recipe .tip { margin-top: 14px; font-size: 17px; background: #ffe0b2; border-radius: 12px; padding: 10px 14px; }
  #recipe .btns { display: flex; gap: 12px; justify-content: flex-end; }
  #recipe button { font: bold 22px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 12px 20px; background: #43a047; color: #fff; cursor: pointer; }
  #recipe button + button { background: #5c6bc0; }
  @media print {
    @page { size: letter; margin: 0.6in; }
    html, body { height: auto; background: #fff !important; display: block; overflow: visible; }
    body > *:not(#recipe) { display: none !important; }
    #recipe { display: block !important; position: static; background: none; }
    #recipe .card { width: auto; max-height: none; overflow: visible; border: 4px solid #8d6e63; }
    #recipe .noprint { display: none !important; }
    #recipe ul, #recipe ol { font-size: 16pt; }
  }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="recipe"><div class="card">
  <div class="noprint btns"><button onclick="window.print()">🖨️ Print it</button><button onclick="hideRecipe()">✖ Close</button></div>
  <div id="recipeBody"></div>
</div></div>
<script>
// 🌧️ ROBO'S RAINY TREEHOUSE (💡 Made by Claude for Ben: a cozy treehouse on a rainy night!)
// Robo and Dusty live in a treehouse high in a big tree. It's a gentle rainy evening. Build a pillow fort, gather
// fireflies in a jar, look through the telescope, wind up a music box, grow a flower, make a warm drink with Dusty
// (with a REAL recipe card to print), and mix sleepy rain sounds.
// No timers, no losing, nothing scary. All sounds are VERY soft (one quiet volume knob, sine/triangle notes + soft noise).
// Trophy 'treehouseCozy' after 3 different activities. Save: localStorage 'treehouseCozy'.
const C = document.getElementById('c'), ctx = C.getContext('2d'), W = 960, H = 540;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (copied from Dusty's Cozy Corner) ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(30,20,40,.8)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function glow(x, y, r, col, a = 1) {                  // soft round light
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
// 🧹 Dusty ("she", Robo's first friend): copied from Dusty's Cozy Corner
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else if (o.sleep) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 1; ctx.beginPath(); ctx.arc(1.5, -18.5, 2.6, 0.3, Math.PI - 0.3); ctx.stroke(); }
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
</script>
<script>
// 🤖 Robo: white round robot, dark visor, blue eyes, blue ear pods, blue legs, little antenna (copied from Dusty's Cozy Corner)
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0;
  if (pose === 'walk') { const k = t * 0.3; lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {
    const tip = Math.sin(t * 0.12) * (pose === 'idle' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    glow(tip, -50, 7, o.antCol || 'rgba(64,196,255,.8)', 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0) + (o.antCol ? 0.4 : 0));
    circle(tip, -50, 2.6, o.antCol ? '#fff59d' : ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    const ey = -29.5;
    if (o.sleep) {
      ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.4;
      for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey - 1.5, 3, 0.3, Math.PI - 0.3); ctx.stroke(); }
    } else if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, ey, 16, 'rgba(64,196,255,.45)', eyes);
      if (pose === 'happy' || o.happy) {
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(9, ey, 3.5, blink, 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      ctx.restore();
    }
  }
  ctx.restore();
}
// ---------- VERY soft sounds (copied from Dusty's Cozy Corner: everything goes through one quiet volume knob) ----------
let actx = null, master = null, soundOn = true;
function audio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.25; master.connect(actx.destination); }
    if (actx.state !== 'running') actx.resume();
  } catch (_) {}
  return actx;
}
function softNote(f, d = 0.6, v = 0.05, when = 0, type = 'sine') {      // a gentle, round "bell" note
  if (!soundOn) return; const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.04); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);

const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.5, 0.045); }
function chord(base = 523) { softNote(base, 1, 0.04); softNote(base * 1.26, 1, 0.035, 0.25); softNote(base * 1.5, 1.4, 0.035, 0.5); }
function voice(line, rate = 0.85) {
  try { if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’-]/g, '')); u.rate = rate; u.pitch = 1.1; u.volume = 0.8; speechSynthesis.speak(u); } catch (_) {}
}
// a soft looping noise (rain, wind). Only ever made AFTER a tap. Starts SILENT and always fades in/out slowly.
let noiseBuf = null;
function getNoise() {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  return noiseBuf;
}
function softNoise(filterHz, q = 0.7) {
  if (!actx || actx.state !== 'running') return null;
  try {
    const src = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    src.buffer = getNoise(); src.loop = true; f.type = 'lowpass'; f.frequency.value = filterHz; f.Q.value = q; g.gain.value = 0;
    src.connect(f); f.connect(g); g.connect(master); src.start();
    return { src, f, g };
  } catch (_) { return null; }
}
function noiseTo(n, v, secs = 2) { if (n && actx) try { n.g.gain.cancelScheduledValues(actx.currentTime); n.g.gain.setTargetAtTime(soundOn ? v : 0, actx.currentTime, secs / 3); } catch (_) {} }
function noiseStop(n) { if (n && actx) try { n.g.gain.cancelScheduledValues(actx.currentTime); n.g.gain.setTargetAtTime(0, actx.currentTime, 0.5); n.src.stop(actx.currentTime + 3); } catch (_) {} }
// ---------- save + trophy: do 3 different cozy activities ----------
const SAVE_KEY = 'treehouseCozy';
let SAVE = { done: {}, trophy: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') SAVE = Object.assign(SAVE, s, { done: Object.assign({}, s.done || {}) }); } catch (_) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (_) {} }
let banner = 0;
const doneCount = () => Object.keys(SAVE.done).length;
function markDone(act) {
  if (SAVE.done[act]) return; SAVE.done[act] = 1;
  if (doneCount() >= 3 && !SAVE.trophy) { SAVE.trophy = 1; trophy('treehouseCozy'); banner = 1; setTimeout(() => chord(659), 600); }
  save();
}
</script>
<script>
// ---------- the cozy treehouse room ----------
const RAIN = Array.from({ length: 80 }, (_, i) => ({ x: (i * 0.618) % 1, p: (i * 0.377) % 1, sp: 0.008 + (i % 5) * 0.0015, len: 8 + (i % 4) * 4 }));
const DROPS = Array.from({ length: 16 }, (_, i) => ({ x: ((i * 0.43) % 1) * 2 - 1, p: (i * 0.29) % 1, sp: 0.0008 + (i % 4) * 0.0004, r: 2 + (i % 3) }));
const BULBS = ['#ffe082', '#ffab91', '#b3e5fc', '#f8bbd0', '#c5e1a5'];
function lightsY(x) { return 10 + 24 * Math.sin(Math.PI * ((x % 240) / 240)); }
function fairyLights(y0 = 0, bright = 1) {
  ctx.strokeStyle = 'rgba(60,40,30,.8)'; ctx.lineWidth = 2; ctx.beginPath();
  for (let x = 0; x <= W; x += 8) { const y = y0 + lightsY(x); x ? ctx.lineTo(x, y) : ctx.moveTo(x, y); } ctx.stroke();
  for (let i = 0, x = 20; x < W; x += 40, i++) { const y = y0 + lightsY(x) + 5, c = BULBS[i % 5]; glow(x, y, 16, c, (0.3 + 0.15 * Math.sin(frame * 0.03 + i)) * bright); circle(x, y, 4, c); }
}
// the round window: a rainy night outside, with leaves, soft rain and drops sliding down the glass. clear = 0..1 (rain stops)
function drawWindow(cx, cy, r, clear = 0) {
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.clip();
  const g = ctx.createLinearGradient(0, cy - r, 0, cy + r); g.addColorStop(0, '#1b2547'); g.addColorStop(1, '#3a3366'); ctx.fillStyle = g; ctx.fillRect(cx - r, cy - r, r * 2, r * 2);
  for (let i = 0; i < 14; i++) circle(cx - r + ((i * 53) % (r * 2)), cy - r + ((i * 37) % r), 1.2, `rgba(255,250,220,${(0.15 + clear * 0.5) * (0.6 + 0.4 * Math.sin(frame * 0.03 + i))})`);
  ctx.save(); ctx.globalAlpha = 1 - clear * 0.8;
  for (let i = 0; i < 5; i++) ellipse(cx - r + i * r * 0.5 + Math.sin(frame * 0.002 + i) * 10, cy - r * 0.6 + (i % 2) * 14, r * 0.42, r * 0.17, 'rgba(90,95,130,.75)');
  ctx.restore();
  for (const [dx, dy, rr, c] of [[-0.85, 0.75, 0.42, '#1f3d2e'], [0.8, 0.8, 0.45, '#1c3a2b'], [-0.3, 1.0, 0.4, '#24493a'], [0.35, 1.05, 0.38, '#204232'], [0.95, 0.1, 0.25, '#1f3d2e']])
    ellipse(cx + dx * r, cy + dy * r, rr * r, rr * r * 0.7, c);
  ctx.strokeStyle = `rgba(190,215,255,${0.35 * (1 - clear)})`; ctx.lineWidth = 1.5; ctx.beginPath();
  for (const d of RAIN) { const u = (d.p + frame * d.sp) % 1, x = cx - r + d.x * r * 2 - u * 12, y = cy - r + u * r * 2.2 - 10; ctx.moveTo(x, y); ctx.lineTo(x - 3, y + d.len); } ctx.stroke();
  for (const d of DROPS) { const u = (d.p + frame * d.sp) % 1, x = cx + d.x * r * 0.85, y = cy - r + u * r * 2; circle(x, y, d.r * (1 - clear * 0.7), 'rgba(220,235,255,.35)'); circle(x - 0.8, y - 0.8, d.r * 0.35, 'rgba(255,255,255,.5)'); }
  ctx.restore();
  ctx.strokeStyle = '#8b5e3c'; ctx.lineWidth = 16; ctx.beginPath(); ctx.arc(cx, cy, r + 6, 0, 7); ctx.stroke();
  ctx.strokeStyle = '#a8764d'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(cx, cy, r + 9, 3.6, 5.6); ctx.stroke();
  ctx.fillStyle = '#8b5e3c'; ctx.fillRect(cx - 4, cy - r, 8, r * 2); ctx.fillRect(cx - r, cy - 4, r * 2, 8);
}
function drawLamp(x, y, s = 1) {                       // a warm little lamp; y = where the base sits
  glow(x, y - 95 * s, 230 * s, 'rgba(255,200,120,.35)');
  roundRect(x - 26 * s, y - 10 * s, 52 * s, 10 * s, 5 * s, '#6d4c41'); roundRect(x - 4 * s, y - 85 * s, 8 * s, 78 * s, 4 * s, '#8d6e63');
  ctx.fillStyle = '#ffcc80'; ctx.beginPath(); ctx.moveTo(x - 46 * s, y - 80 * s); ctx.lineTo(x + 46 * s, y - 80 * s); ctx.lineTo(x + 28 * s, y - 130 * s); ctx.lineTo(x - 28 * s, y - 130 * s); ctx.fill();
  ctx.fillStyle = '#fff3c4'; ctx.fillRect(x - 46 * s, y - 84 * s, 92 * s, 5 * s); glow(x, y - 72 * s, 40 * s, 'rgba(255,240,180,.7)');

<script>

  { id: 'rain', name: '🌧️ Soft Rain', col: '#3f849e', say: 'Robo says: Pitter patter, soft rain on the leaves.' },
  { id: 'thunder', name: '⛅ Far Thunder', col: '#6a5d9a', say: 'Robo says: That thunder is very, very far away. It just sounds like a sleepy tummy rumble.' },
  { id: 'crickets', name: '🦗 Crickets', col: '#5d8f4a', say: 'Dusty says: The crickets are singing goodnight songs.' },

  else if (RS.on.rain && RS.rain && RS.rainWas !== true) noiseTo(RS.rain, 0.3, 3);
  RS.rainWas = !!RS.on.rain && !!RS.rain;
