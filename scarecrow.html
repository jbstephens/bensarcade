<canvas id="game" width="960" height="520"></canvas>
<script>
// 🎃 DON'T WAKE THE SCARECROW
// Red light / green light in a moonlit pumpkin patch. Sneak up, GRAB the friendly glowing jack-o'-lanterns
// and bring them to the hay wagon. When Mister Scarecrow turns around (creak + caw!), FREEZE!
// 6 levels, then the Great Pumpkin glow-up where the scarecrows dance a happy jig.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const FIELD_TOP = 112, FIELD_BOT = 500;

// ---------- Saves, trophies, stickers ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book

let save = { best: 0, char: 'robo', easy: false, music: true, wins: 0 };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('scarecrow') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.best = Math.max(0, Math.min(6, save.best | 0));
}
function writeSave() { try { localStorage.setItem('scarecrow', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
function rustleNoise(vol = 0.08, dur = 0.18, freq = 3000) {   // corn leaves going shhh-shhh
  if (!actx || !noiseBuf) return;
  const t = actx.currentTime, s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = freq; fl.Q.value = 0.8;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(fl); fl.connect(g); g.connect(sfxBus || actx.destination); s.start(t); s.stop(t + dur + 0.05);
}
const sfx = {
  // 🚪 a creaky wooden turn: a wobbly low sawtooth that bends up and down
  creak: () => { for (let i = 0; i < 5; i++) note(110 + Math.random() * 60, i * 0.09, 0.12, 'sawtooth', 0.045, 160 + Math.random() * 80); },
  caw:   () => { note(720, 0, 0.16, 'sawtooth', 0.06, 420); note(700, 0.22, 0.18, 'sawtooth', 0.06, 380); },
  hoot:  () => { note(420, 0, 0.28, 'sine', 0.09, 380); note(400, 0.38, 0.4, 'sine', 0.09, 340); },
  grab:  () => { note(660, 0, 0.08, 'triangle', 0.1); note(990, 0.07, 0.16, 'triangle', 0.1); },
  drop:  () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.07, 0.2, 'sine', 0.1)),
  check: () => { note(587, 0, 0.1, 'triangle', 0.1); note(880, 0.1, 0.22, 'triangle', 0.1); },
  boing: () => note(260, 0, 0.3, 'sine', 0.12, 620),
  wahwah: () => [392, 370, 349, 330].forEach((f, i) => note(f, i * 0.22, i === 3 ? 0.5 : 0.22, 'triangle', 0.08, f * 0.97)),
  hehe:  () => [700, 820, 700, 820].forEach((f, i) => note(f, i * 0.09, 0.08, 'square', 0.035)),
  click: () => note(700, 0, 0.06, 'square', 0.05),
  win:   () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.08)),
  whoosh: () => rustleNoise(0.06, 0.6, 900),
  sparkle: () => [1319, 1568, 2093].forEach((f, i) => note(f, i * 0.05, 0.18, 'sine', 0.05)),
};
// 🗣️ the scarecrow's funny voice (the browser voice, extra low + slow, or extra squeaky)
function say(str, pitch = 0.2, rate = 0.85) {
  try {
    if (!('speechSynthesis' in window) || TESTING) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(str); u.pitch = pitch; u.rate = rate; u.volume = 0.8;
    speechSynthesis.speak(u);
  } catch (_) {}
}
var TESTING = typeof TESTING !== 'undefined' ? TESTING : false;

// ---------- MUSIC ENGINE ----------
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  }
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar, "4/5" = two per bar): degree number, M = make it major, m = minor, b = flat root (bVII), 7 = add the 7th.
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10] };
const degS = (sc, k) => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
function parseMel(str, sc) {
  return str.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean).map(tk => {
    if (tk === '.') return null;
    if (tk === '-') return 'h';
    const m = tk.match(/^([b#]?)([1-7])([',]*)$/);
    if (!m) return null;
    const acc = m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0, d = +m[2];
    const oct = (m[3].match(/'/g) || []).length - (m[3].match(/,/g) || []).length;
    let hd = d - 2, ho = oct; if (hd < 1) { hd += 7; ho--; }            // a third below, inside the scale
    return { s: sc[d - 1] + acc + 12 * oct, hs: sc[hd - 1] + 12 * ho };
  });
}
function melEvents(arr) {                              // onset -> length in 8ths (holds tie notes together)
  const ev = new Array(arr.length).fill(null);
  for (let i = 0; i < arr.length; i++) if (arr[i] && arr[i] !== 'h') { let n = 1; while (arr[i + n] === 'h') n++; ev[i] = Object.assign({ len: n }, arr[i]); }
  return ev;
}
function mirrorMel(arr) {                              // 🪞 play a melody backwards (for Mirror City's bridge)
  const runs = []; let i = 0;
  while (i < arr.length) { let n = 1; while (arr[i + n] === 'h') n++; runs.push(arr.slice(i, i + n)); i += n; }
  return runs.reverse().flat();
}
function parseChord(tk, sc) {
  let flat = false; if (tk[0] === 'b') { flat = true; tk = tk.slice(1); }
  const r = +tk[0], q = tk.slice(1), root = sc[r - 1] - (flat ? 1 : 0);
  let third = flat ? root + 4 : root + ((degS(sc, r + 2) - sc[r - 1]) % 12 + 12) % 12;
  if (q.includes('M')) third = root + 4;
  if (q.includes('m')) third = root + 3;
  const ch = [root, third, root + 7];
  if (q.includes('7')) ch.push(root + ((degS(sc, r + 6) - sc[r - 1]) % 12 + 12) % 12);
  return ch;
}
// ---- drum / bass / arpeggio styles. 16 steps per bar (12 for a waltz). Bass: R root, O octave, 5 fifth, - hold. Arp: chord tone 0-3.
const STYLES = {
  pop: {
    I: { k: 'x.......x.......', h: '..x...x...x...x.', bass: 'R-------R---R-O-', arp: '0.1.2.1.0.1.2.1.' },
    V: { k: 'x.....x.x.......', s: '....x.......x...', h: 'x.x.x.x.x.x.x.x.', bass: 'R..R..R.R..R..O.', arp: '0.1.2.1.0.1.2.1.' },
    V2: { k: 'x.....x.x.....x.', s: '....x.......x...', h: 'x.xxx.x.x.xxx.x.', bass: 'R..R..R.R..R.5O.', arp: '0121312101213121' },
    C: { k: 'x...x...x...x...', s: '....x.......x...', h: 'x.xxx.x.x.xxx.x.', o: '..............x.', bass: 'R.RO.RR.R.RO.R5.', arp: '0121312101213121' },
    B: { k: 'x.......x.......', s: '........x.......', h: 'x...x...x...x...', bass: 'R-------5-------', arp: '0...1...2...3...' } },
  waltz: {
    I: { k: 'x...........', h: '....x...x...', bass: 'R-----------', arp: '0...1...2...' },

    C: { k: 'x.....x.....', s: '....x...x...', h: 'xxx.x.x.xxx.', o: '..........x.', bass: 'R-..O-..5-..', arp: '012321012321' },
    B: { k: 'x...........', s: '........x...', h: 'x...x...x...', bass: 'R-----------', arp: '0...2...3...' } },
  calypso: {

    V: { k: 'x...x...x...x...', h: '..x...x...x...x.', r: 'x..x..x...x.x...', bass: 'R..5..R.R..5..O.', arp: '..0.1...0.2...1.' },
    C: { k: 'x...x...x...x...', s: '....x.......x...', o: '..x...x...x...x.', r: 'x..x..x...x.x...', bass: 'R..5..R.R..O.5.R', arp: '..0.1.2...0.1.2.' },
    B: { k: 'x.......x.......', r: 'x..x..x...x.x...', h: '..x...x...x...x.', bass: 'R-....5-R-....O-', arp: '0...1...2...1...' } },
  funk: {
    I: { k: 'x.....x...x.....', h: 'x.x.x.x.x.x.x.x.', bass: 'R..R.O..R.R..5O.' },

}
const night = () => easy() ? { sky1: '#3a3f8f', sky2: '#6b5fa8', g1: '#36603a', g2: '#22452c', dim: 0.0 } : { sky1: '#0b1030', sky2: '#2a2357', g1: '#1f3d2a', g2: '#11261b', dim: 0.18 };

  for (const s of scares) if (s.say > 0 && s.sayStr) bubble(s.sayStr, s.x, SC_Y + 26, s.sayStr === 'I SEE YOU!' ? '#ffeb3b' : '#fff', s.sayStr === 'I SEE YOU!' ? 30 : 18);
  for (const q of particles) { ctx.globalAlpha = Math.min(1, q.life / 30); ctx.fillStyle = q.c; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s); }
  ctx.globalAlpha = 1;
}
function drawHUD() {
  roundRect(10, 10, 50, 40, 10, 'rgba(0,0,0,.45)'); text('◀', 35, 38, 22, '#fff');
  const watching = scares.some(s => s.st === 'look' && s.lookT > 8) && dark < 0.5, warn = scares.some(s => s.st === 'turning' && !s.fake);
  const fakeNow = scares.some(s => s.st === 'fakeback' || (s.st === 'turning' && s.fake));
  let label = '🟢 SNEAK!', col = '#2e7d32';
  if (dark >= 0.5) { label = '🌙 SNEAK!'; col = '#283593'; }
  else if (watching) { label = '🔴 FREEZE!'; col = '#c62828'; }
  else if (warn || fakeNow) { label = '🟡 FREEZE!'; col = '#f9a825'; }
  roundRect(66, 10, 170, 40, 12, col); text(label, 151, 39, 24, '#fff');
  roundRect(10, 56, 226, 30, 10, 'rgba(0,0,0,.45)');
  text(`🎃 ${delivered}/${lanterns.length}   Level ${lvl + 1}`, 123, 79, 18, '#ffcc80');
  let y = 470;
  for (const m of msgs) { ctx.globalAlpha = Math.min(1, m.life / 20); text(m.str, 250, y, 18, m.color, 'left'); y -= 26; }
  ctx.globalAlpha = 1;
  if (state === 'play' && frame % 600 < 300 && lvl === 0 && delivered === 0) text('Arrows = sneak   GRAB = pick up a pumpkin', 480, 508, 16, '#e1f5fe');
}
function drawPlay() { drawWorld(); drawHUD(); }
function drawIntro() {
  drawWorld();
  ctx.fillStyle = 'rgba(10,8,30,.6)'; ctx.fillRect(0, 0, W, H);
  const L = LEVELS[lvl];
  text(`Level ${lvl + 1}`, 480, 170, 30, '#ffcc80');
  text(L.name, 480, 225, 48, '#ffb74d');
  text(L.tip, 480, 285, 24, '#fff');
  text(`Bring ${L.lan.length} glowing pumpkins to the hay wagon!`, 480, 330, 22, '#ffe082');
  text('🟢 Sneak when his back is turned   🔴 FREEZE when he looks!', 480, 380, 20, '#b9f6ca');
  if (timer > 20 && frame % 40 < 28) text('Press GRAB or tap to start', 480, 440, 20, '#e1f5fe');
}
function drawCaught() {
  drawWorld(); drawHUD();
  if (timer < 70) { text('I SEE YOU!', 480, 280, 64 + Math.sin(timer * 0.4) * 4, '#ffeb3b'); text('Back to the hay bale!', 480, 330, 26, '#fff'); }
}
function drawClear() {
  drawWorld();
  ctx.fillStyle = 'rgba(10,8,30,.55)'; ctx.fillRect(0, 0, W, H);
  text('🎃 Level Clear! 🎃', 480, 200, 54, '#ffd54f');
  text(caughtCount === 0 ? 'Super sneaky! He never saw you!' : `Caught ${caughtCount} time${caughtCount > 1 ? 's' : ''}, but you never gave up!`, 480, 260, 26, '#fff');
  for (let i = 0; i < LEVELS[lvl].lan.length; i++) drawPumpkin(480 + (i - (LEVELS[lvl].lan.length - 1) / 2) * 46, 320 + Math.sin(frame * 0.1 + i) * 5, 16, true, i, frame);
  text(lvl >= LEVELS.length - 1 ? 'Time to light the GREAT PUMPKIN...' : 'Next level coming up!', 480, 400, 24, '#b9f6ca');
}
function drawTitle() {
  const n = night();
  drawSky(n); drawField(n);
  const ph = (Math.sin(frame * 0.02) + 1) / 2;                       // he keeps peeking over his shoulder
  drawScarecrow(140, SC_Y + 2, Math.min(1, Math.max(0, ph * 1.4 - 0.2)), SC_S, {});
  drawScarecrow(820, SC_Y + 2, Math.min(1, Math.max(0, (1 - ph) * 1.4 - 0.2)), SC_S, {});
  for (let i = 0; i < 5; i++) { drawPumpkin(70 + i * 205, 505, 14, true, i, frame); }
  ctx.fillStyle = 'rgba(10,8,30,.35)'; ctx.fillRect(0, 0, W, H);
  text("🎃 Don't Wake the Scarecrow", 480, 66, 46, '#ffb74d');
  text('Sneak! Grab the glowing pumpkins! FREEZE when he turns around!', 480, 104, 19, '#fff');
  // characters
  CHARS.forEach((c, i) => {
    const x = 480 - 325 + i * 130, on = save.char === c.id;
    roundRect(x, 140, 120, 120, 16, on ? 'rgba(255,183,77,.55)' : 'rgba(0,0,0,.35)');
    if (on && menuRow === 0) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(x + 2, 142, 116, 116); }
    drawHero(c.id, x + 60, 226, 1, on ? frame * 0.2 : 0, 1.35);
    text(c.name, x + 60, 252, 18, on ? '#fff' : '#ccc');
  });
  text('Pick your sneaker:', 480, 134, 16, '#e1f5fe');
  // levels
  for (let i = 0; i < 6; i++) {
    const x = 480 - 225 + i * 75, open = i <= save.best, on = i === menuLevel;
    roundRect(x, 290, 66, 50, 12, !open ? 'rgba(80,80,80,.6)' : on ? '#ff9800' : 'rgba(0,0,0,.45)');
    if (on && menuRow === 1) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(x + 2, 292, 62, 46); }
    text(open ? String(i + 1) : '🔒', x + 33, 325, 24, '#fff');
  }
  text('Level', 480, 284, 16, '#e1f5fe');
  // not so spooky
  roundRect(330, 360, 300, 46, 14, save.easy ? '#66bb6a' : 'rgba(0,0,0,.45)');
  if (menuRow === 2) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(332, 362, 296, 42); }
  text(`😊 Not so spooky: ${save.easy ? 'ON' : 'OFF'}`, 480, 391, 22, '#fff');
  // play
  roundRect(380, 422, 200, 62, 18, menuRow === 3 ? '#ff7043' : '#e65100');
  if (menuRow === 3) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.strokeRect(382, 424, 196, 58); }
  text('▶ PLAY', 480, 465, 32, '#fff');
  roundRect(880, 10, 70, 44, 12, 'rgba(0,0,0,.45)'); text(musicOn ? '🎵' : '🔇', 915, 42, 24, '#fff');
  text('Arrows + GRAB  •  or tap!', 480, 510, 15, '#e1f5fe');
  if (save.wins) text(`⭐ Great Pumpkin lit ${save.wins}x`, 120, 32, 16, '#ffd54f');
}
function drawFinale() {
  const F = finale, n = { sky1: '#1a1450', sky2: '#4a2a7a', g1: '#2a5a34', g2: '#173a22', dim: 0 };
  drawSky(n); drawField(n);
  const g = F.glow, t = timer;
  // 🎃 the GREAT PUMPKIN
  glow(480, 290, 140 + g * 160, 'rgba(255,170,0,.7)', 0.3 + g * 0.7 + Math.min(0.4, F.lit / LANTERN_TOTAL * 0.4));
  const r = 90 + g * 10 + (g ? Math.sin(t * 0.2) * 3 : 0);
  ellipse(480, 290 + r * 0.85, r * 1.2, r * 0.25, 'rgba(0,0,0,.3)');
  for (const [ox, rr] of [[-0.62, 0.62], [0.62, 0.62], [-0.32, 0.72], [0.32, 0.72], [0, 0.75]]) ellipse(480 + ox * r, 290, rr * r, r * 0.92, g ? '#ff9100' : `rgb(${200 + F.lit * 2},${110 + F.lit},40)`);
  roundRect(470, 290 - r * 1.08, 20, 34, 6, '#558b2f');
  ctx.strokeStyle = '#7cb342'; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(505, 290 - r * 1.0, 16, Math.PI, 2.2 * Math.PI); ctx.stroke();
  const lit = Math.min(1, F.lit / LANTERN_TOTAL);
  ctx.fillStyle = `rgba(255,245,157,${0.15 + lit * 0.85})`;              // a giant happy face that lights up
  ctx.beginPath(); ctx.ellipse(445, 265, 16, 22, 0, 0, 7); ctx.ellipse(515, 265, 16, 22, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.moveTo(420, 305); ctx.quadraticCurveTo(480, 375, 540, 305); ctx.quadraticCurveTo(480, 330, 420, 305); ctx.fill();
  if (g) { circle(440, 258, 5, '#fff'); circle(510, 258, 5, '#fff'); }
  for (const f of F.flying) { drawPumpkin(f.x, f.y, 12, true, 1, frame); glow(f.x, f.y, 30, 'rgba(255,170,0,.5)'); }
  // the scarecrows dance a happy jig (once the pumpkin is lit)
  scares.forEach((s, i) => drawScarecrow(s.x, 470, 1, 1.15, { jig: F.won, t: t + i * 12 }));
  drawHero(save.char, 360, 492, 1, F.won ? t * 0.3 : 0, 1.4 + (F.won ? Math.abs(Math.sin(t * 0.2)) * 0.1 : 0));
  for (const q of particles) { ctx.globalAlpha = Math.min(1, q.life / 30); ctx.fillStyle = q.c; ctx.fillRect(q.x - q.s / 2, q.y - q.s / 2, q.s, q.s); }
  ctx.globalAlpha = 1;
  text(F.won ? '✨ THE GREAT PUMPKIN GLOWS! ✨' : `Lighting the Great Pumpkin... ${F.lit}/${LANTERN_TOTAL}`, 480, 140, F.won ? 40 : 28, '#ffd54f');
  if (F.won) {
    text('YOU WIN! The scarecrows are SO happy they\'re dancing a jig!', 480, 180, 22, '#fff');
    text('🏆 TROPHY: Great Pumpkin Glow-Up!', 480, 215, 22, '#ffe082');
    if (timer - F.wonT > 150 && frame % 40 < 28) text('Press GRAB or tap', 760, 505, 18, '#b9f6ca');
  }
  if (stickerNew > 0) text('🎃 New sticker for your Sticker Book!', 480, 250, 18, '#f8bbd0');
}
function draw() {
  if (state === 'title') drawTitle();
  else if (state === 'intro') drawIntro();
  else if (state === 'play') drawPlay();
  else if (state === 'caught') drawCaught();
  else if (state === 'clear') drawClear();
  else if (state === 'finale') drawFinale();
  if (!actx && state === 'title' && frame % 60 < 40) text('🔊 tap or press a key for sound', 480, 22, 14, '#ddd');
}

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
