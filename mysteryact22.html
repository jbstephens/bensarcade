<style>

// ---------- printing (Chrome + iPad Safari): only the sheet prints ----------
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {

    try { if (typeof window.print === 'function') window.print(); } catch (_) {}

}
function printSheet() {

}

  endPrintAll(); renderSheet();
  const img = traceImage(), svg = $('svgBox').querySelector('svg');
  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }

const kindSheets = kind => SHEETS.map((p, i) => i).filter(i => SHEETS[i].kind === kind);
function printSet(kind) {
  $('printAll').innerHTML = kindSheets(kind).map(i => buildSheet(i, isLine())).join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + kindSheets(kind).length + ' page' + (kindSheets(kind).length > 1 ? 's' : '') + '!');

// =====================================================================
// LEAVING + KEYS (arrows pick, Enter goes, Escape goes back, P prints)
// =====================================================================
function backToAct() { show('act'); renderHelper(); }
function leave() {

function gridCols(sel2) {

let evtSel = 0;
function markEvt() { const b = $('evtBtns').children || []; evtSel = Math.max(0, Math.min(b.length - 1, evtSel)); for (let i = 0; i < b.length; i++) b[i].classList.toggle('sel', i === evtSel); }
