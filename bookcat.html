<meta charset="utf-8">
<title>Book Cat</title>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #14102a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 520)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
</style>
<canvas id="game" width="960" height="520"></canvas>
<script>
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, ROWS = 13, LEN = 96;
let LW = LEN;   // how wide the current page is (the boss page is just one screen)
let frame = 0;

// ---------- Sound ----------
let actx = null, musicOn = true, nextNote = 0, mStep = 0;
function audio() { if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (_) {} } return actx; }
function note(f, start, dur, wave = 'square', vol = 0.06, slide = null) {
  if (!actx) return;
  const t = actx.currentTime + start, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur);
}
const sfx = {
  jump: () => note(500, 0, 0.12, 'square', 0.05, 900),
  jump2: () => note(700, 0, 0.12, 'square', 0.05, 1300),
  coin: () => { note(1320, 0, 0.05); note(1760, 0.05, 0.1); },
  stomp: () => note(300, 0, 0.12, 'triangle', 0.12, 90),
  meow: () => { note(700, 0, 0.15, 'sine', 0.1, 1050); note(1050, 0.15, 0.25, 'sine', 0.08, 600); },
  ouch: () => note(400, 0, 0.35, 'sawtooth', 0.08, 120),
  blip: f => { note(f ? 660 : 990, 0, 0.08, 'square', 0.07); note(f ? 990 : 660, 0.06, 0.08, 'square', 0.07); },
  right: () => [784, 988, 1175].forEach((f, i) => note(f, i * 0.07, 0.12, 'square', 0.06)),
  wrong: () => note(300, 0, 0.3, 'triangle', 0.1, 200),
  rumble: () => note(70, 0, 0.6, 'sawtooth', 0.07, 45),
  roar: () => { note(160, 0, 0.5, 'sawtooth', 0.09, 70); note(90, 0.1, 0.5, 'square', 0.05, 60); },
  splat: () => note(220, 0, 0.12, 'sine', 0.08, 90),
  win: () => [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.12, 0.25, 'square', 0.08)),
};
const TUNE = [72, 0, 76, 0, 79, 76, 72, 0, 74, 0, 77, 0, 81, 77, 74, 0, 76, 0, 79, 0, 84, 79, 76, 0, 74, 72, 71, 72, 0, 0, 0, 0];
function playMusic() {
  if (!actx || !musicOn || scene !== 'play') return;
  if (nextNote < actx.currentTime) nextNote = actx.currentTime + 0.05;
  while (nextNote < actx.currentTime + 0.2) {
    const t = nextNote - actx.currentTime, m = TUNE[mStep % TUNE.length];
    if (m) note(440 * Math.pow(2, (m - 69) / 12), t, 0.15, 'square', 0.022);
    if (mStep % 4 === 0) note(440 * Math.pow(2, ([48, 53, 55, 48][(mStep / 8 | 0) % 4] - 69) / 12), t, 0.3, 'triangle', 0.06);
    nextNote += 0.14; mStep++;
  }
}

// ---------- The pages (each one is one of Ben's games!) ----------
const PAGES = [
  { game: 'Robo Jump', sky: ['#0b1026', '#2b3a7a'], ground: '#8e9bb5', top: '#7df9ff', enemy: 'alien', item: '⭐', gravity: 0.38, note: 'Low gravity! Float through space!', space: true },
  { game: 'Sparks!', sky: ['#4fc3f7', '#e1f5fe'], ground: '#bc8f6f', top: '#cfd8dc', enemy: 'windup', item: '🐟', note: 'Jump on the wind-up robots!', city: true },
  { game: 'Sports Party', sky: ['#4fc3f7', '#b3e5fc'], ground: '#8d6e63', top: '#4caf50', enemy: 'ball', item: '🏀', note: 'Watch out for bouncing soccer balls!' },
  { game: "Ben's Quest", sky: ['#81d4fa', '#e1f5fe'], ground: '#7a5230', top: '#7cc35a', enemy: 'slime', item: '💎', note: 'Bonk the slimes like a hero!', trees: true },
  { game: 'Turbo Racers', sky: ['#81d4fa', '#fffde7'], ground: '#555b66', top: '#fff', enemy: 'car', item: '⚡', note: 'Zoom zoom! Jump over the race cars!', fast: true },
  { game: 'Build It!', sky: ['#4fc3f7', '#e1f5fe'], ground: '#c0504d', top: '#d84315', enemy: 'none', item: '🧱', note: 'Hop across the block buildings!', bricks: true },
  { game: 'Brawl Buddies', sky: ['#ff7043', '#ffe0b2'], ground: '#4e342e', top: '#6d4c41', enemy: 'fighter', item: '🥊', note: 'Bop the little fighters!', city: true },
  { game: 'Zombie Maze', sky: ['#0d0d1a', '#263238'], ground: '#546e7a', top: '#78909c', enemy: 'zombie', item: '💰', note: 'Spooky! Stomp the slow zombies!', dark: true },
  { game: 'Monster Pals', sky: ['#a5d6a7', '#e8f5e9'], ground: '#8d6e63', top: '#66bb6a', enemy: 'puff', item: '🐾', note: 'Catch the bouncy monsters!', grass: true },
  { game: 'Pet Park', sky: ['#ffe0f0', '#fff4dc'], ground: '#d6a96b', top: '#c99a5c', enemy: 'tennis', item: '🦴', note: 'Dodge the bouncing tennis balls!' },
  { game: 'Paint Studio', sky: ['#ffffff', '#f3e5f5'], ground: '#7c4dff', top: '#ff4081', enemy: 'paint', item: '🎨', note: 'Splat! Jump on the paint blobs!', paint: true },
  { game: 'Math Rocket', sky: ['#0b1026', '#2a1b5c'], ground: '#5c6bc0', top: '#ffd740', enemy: 'alien', item: '⭐', note: 'Jump into the bubble with the right answer to open the gate!', space: true, math: true },
  { game: 'Order Up! In Space', sky: ['#0b1026', '#3a1d6e'], ground: '#7e57c2', top: '#9575cd', enemy: 'alien', item: '🍕', note: 'Grab the pizzas! Watch for hungry aliens!', space: true },
  { game: 'Castle Defense', sky: ['#4fc3f7', '#b3e5fc'], ground: '#9e9e9e', top: '#7cc35a', enemy: 'slime', item: '🛡️', note: 'Arrows are flying! Jump over them!', arrows: true, castle: true },
  { game: 'The Bookworm King', secret: true, boss: true, sky: ['#fff8e7', '#f3e2c0'], ground: '#c9b89a', top: '#8d6e63', enemy: 'none', item: '📄', note: 'The BOOKWORM KING is eating the book! Jump on his head when he pops up!' },
];

// ---------- Save ----------
let SAVE = { unlocked: 1, stars: {} };
try { const s = JSON.parse(localStorage.getItem('bookCat') || 'null'); if (s) SAVE = s; } catch (_) {}
function save() { try { localStorage.setItem('bookCat', JSON.stringify(SAVE)); } catch (_) {} }

// ---------- Level generator (the same page always looks the same) ----------
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let tiles, items, enemies, bubbles, gate, portal, cat, cam, lv, P, particles = [], arrows = [], hurtFlash = 0, levelTime = 0, collected = 0, totalItems = 0;
function buildLevel(i) {
  P = PAGES[i]; lv = i; boss = null; inks = []; LW = LEN;
  if (P.boss) return buildBoss();
  const R = rng(1000 + i * 77), ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  tiles = Array.from({ length: ROWS }, () => Array(LEN).fill(0));
  items = []; enemies = []; bubbles = []; arrows = []; gate = null;
  const ground = (x) => { tiles[11][x] = 1; tiles[12][x] = 1; };
  let x = 0;
  for (; x < 8; x++) ground(x);
  const endZone = P.math ? LEN - 24 : LEN - 10;
  while (x < endZone) {
    const segLen = ri(6, 12), start = x;
    for (let k = 0; k < segLen && x < endZone; k++, x++) ground(x);
    const end = x - 1;
    // coins along the ground
    for (let cx = start + 1; cx < end; cx += 2) if (R() < 0.5) items.push({ x: cx * T + 20, y: 10 * T + 14 });
    // a floating platform in the middle of long pieces of ground
    if (end - start >= 8 && R() < 0.75) {
      const px = start + 2, pl = ri(3, Math.min(5, end - start - 4)), py = ri(7, 8);
      for (let k = 0; k < pl; k++) { tiles[py][px + k] = 2; items.push({ x: (px + k) * T + 20, y: (py - 1) * T + 14 }); }
    }
    // an enemy
    if (P.enemy !== 'none' && end - start >= 5 && R() < 0.85) enemies.push(makeEnemy(P.enemy, (start + Math.floor((end - start) / 2)) * T, start * T, (end + 1) * T));
    // a gap (or stepping stones for the brick page)
    if (x < endZone) { const g = ri(2, 3); if (P.bricks) { tiles[9][x + 1] = 2; } x += g; }
  }
  for (; x < LEN; x++) ground(x);
  if (P.math) {
    const a = ri(2, 9), b = ri(1, 9), ans = a + b, opts = [ans, ans + ri(1, 3), Math.max(0, ans - ri(1, 3))].sort(() => R() - 0.5);
    gate = { x: (LEN - 8) * T, open: false, q: `${a} + ${b} = ?`, ans, signX: (LEN - 21) * T };
    opts.forEach((v, k) => bubbles.push({ x: (LEN - 18 + k * 3) * T + 20, y: 8 * T, v, popped: 0 }));
  }
  portal = { x: (LEN - 4) * T + 20, y: 10 * T };
  totalItems = items.length; collected = 0;
  cat = { x: 2 * T, y: 9 * T, vx: 0, vy: 0, w: 30, h: 28, face: 1, onGround: false, jumps: 0, inv: 0, hearts: 3, maxH: 3, safeX: 2 * T, safeY: 9 * T };
  cam = 0; levelTime = 0; hurtFlash = 0;
}
// ---------- SECRET BOSS: the Bookworm King ----------
let boss = null, inks = [];
const clampN = (v, a, b) => Math.max(a, Math.min(b, v));
function buildBoss() {
  LW = 24;
  tiles = Array.from({ length: ROWS }, () => Array(LEN).fill(0));
  for (let x = 0; x < LW; x++) { tiles[11][x] = 1; tiles[12][x] = 1; }
  for (let x = 4; x <= 7; x++) tiles[7][x] = 2;
  for (let x = 16; x <= 19; x++) tiles[7][x] = 2;
  items = [5, 6, 17, 18].map(x => ({ x: x * T + 20, y: 6 * T + 14 }));
  enemies = []; bubbles = []; arrows = []; gate = null; portal = null; inks = [];
  totalItems = items.length; collected = 0;
  cat = { x: 2 * T, y: 9 * T, vx: 0, vy: 0, w: 30, h: 28, face: 1, onGround: false, jumps: 0, inv: 0, hearts: 5, maxH: 5, safeX: 2 * T, safeY: 9 * T };
  cam = 0; levelTime = 0; hurtFlash = 0;
  boss = { state: 'under', t: 0, x: 16 * T, hp: 5, max: 5, headY: 11 * T + 30, hurt: 0 };
}
function updateBoss() {
  const b = boss, c = cat, gY = 11 * T;
  if (!b) return;
  b.t++; if (b.hurt > 0) b.hurt--;
  const angry = b.hp <= 2;
  if (b.state === 'under') {
    if (b.t === 1) b.x = clampN(c.x + 15 + (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 120), 3 * T, 21 * T);
    if (b.t > 20 && b.t % 20 === 0) sfx.rumble();
    if (b.t > (angry ? 70 : 90)) { b.state = 'rise'; b.t = 0; sfx.roar(); }
  } else if (b.state === 'rise') {
    b.headY = gY + 30 - Math.min(1, b.t / 22) * 125;
    if (b.t >= 22) { b.state = 'up'; b.t = 0; }
  } else if (b.state === 'up') {
    b.headY = gY - 95 + Math.sin(b.t * 0.1) * 5;
    if (b.t % (angry ? 55 : 75) === 30) {
      const n = angry ? 2 : 1;
      for (let k = 0; k < n; k++) inks.push({ x: b.x, y: b.headY + 10, vx: (c.x + 15 - b.x) / 75 + (Math.random() - 0.5) * 1.5 + (k ? 2 : 0), vy: -6 - k });
      sfx.splat();
    }
    if (b.t > (angry ? 170 : 220)) { b.state = 'dive'; b.t = 0; }
  } else if (b.state === 'dive') {
    b.headY = gY - 95 + Math.min(1, b.t / 18) * 125;
    if (b.t >= 18) { b.state = 'under'; b.t = 0; }
  } else if (b.state === 'defeated') {
    if (b.t % 6 === 0) for (let k = 0; k < 6; k++) particles.push({ x: b.x + Math.random() * 60 - 30, y: b.headY + Math.random() * 120, vx: Math.random() * 6 - 3, vy: -Math.random() * 6, life: 50, c: pick(['#fffaf0', '#ffd740', '#9ccc65', '#fff']) });
    b.headY += 1.5;
    if (b.t > 100) { boss = null; portal = { x: 12 * T + 20, y: 10 * T }; toast('You beat the BOOKWORM KING! Jump into the page! 📖'); }
    return;
  }
  if (b.state === 'rise' || b.state === 'up' || b.state === 'dive') {
    const cx = c.x + 15, bottom = c.y + c.h;
    if (b.hurt === 0 && c.vy > 0 && Math.abs(cx - b.x) < 42 && bottom > b.headY - 40 && bottom - c.vy <= b.headY) {
      b.hp--; b.hurt = 45; c.vy = -11.5; c.jumps = 1; sfx.stomp(); sfx.roar();
      for (let k = 0; k < 16; k++) particles.push({ x: b.x, y: b.headY - 20, vx: Math.random() * 8 - 4, vy: -Math.random() * 6, life: 35, c: pick(['#ffd740', '#fff', '#9ccc65']) });
      if (b.hp <= 0) { b.state = 'defeated'; b.t = 0; inks = []; sfx.win(); }
      else { b.state = 'dive'; b.t = 0; toast(b.hp <= 2 ? 'He is getting ANGRY! Keep going!' : `BONK! ${b.hp} more!`); }
    }   // touching his body is safe, only the ink blobs hurt!
  }
  for (const k of inks) {
    k.x += k.vx; k.y += k.vy; k.vy += 0.25;
    if (k.y > gY - 6) { k.dead = true; sfx.splat(); for (let j = 0; j < 6; j++) particles.push({ x: k.x, y: gY - 4, vx: Math.random() * 4 - 2, vy: -Math.random() * 3, life: 25, c: '#4a148c' }); }
    if (Math.hypot(k.x - (c.x + 15), k.y - (c.y + 14)) < 17) { k.dead = true; hurtCat(); }
  }
  inks = inks.filter(k => !k.dead);
}
function drawBoss() {
  for (const k of inks) { circle(k.x - cam, k.y, 11, '#4a148c'); circle(k.x - cam - 3, k.y - 3, 3, '#9575cd'); }
  const b = boss; if (!b) return;
  const gY = 11 * T, x = b.x - cam;
  if (b.state === 'under') {
    if (b.t > (b.hp <= 2 ? 20 : 40)) {                      // a rumbling bump warns you where he'll pop up!
      const sh = Math.sin(frame * 0.8) * 3;
      el(x + sh, gY + 2, 34, 12, '#a1887f');
      for (let k = 0; k < 5; k++) circle(x - 24 + k * 12 + sh, gY - 6 - Math.abs(Math.sin(frame * 0.3 + k)) * 10, 4, '#8d6e63');
      text('!', x, gY - 30, 30, '#ff5252');
    }
    return;
  }
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, W, gY + 4); ctx.clip();
  const flash = b.hurt > 0 && frame % 6 < 3;
  let n = 0;
  for (let y = gY + 20; y > b.headY + 18; y -= 18, n++) circle(x + Math.sin((y + frame * 3) * 0.04) * 6, y, 22, flash ? '#fff' : n % 2 ? '#7cb342' : '#8bc34a');
  const hx = x + Math.sin((b.headY + frame * 3) * 0.04) * 6, hy = b.headY;
  circle(hx, hy, 32, flash ? '#fff' : '#9ccc65');
  ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 3;                     // big round glasses
  circle(hx - 12, hy - 6, 11, '#fff'); circle(hx + 12, hy - 6, 11, '#fff');
  ctx.beginPath(); ctx.arc(hx - 12, hy - 6, 11, 0, 7); ctx.moveTo(hx + 23, hy - 6); ctx.arc(hx + 12, hy - 6, 11, 0, 7); ctx.moveTo(hx - 1, hy - 6); ctx.lineTo(hx + 1, hy - 6); ctx.stroke();
  const look = Math.sign(cat.x + 15 - b.x) * 3;
  circle(hx - 12 + look, hy - 5, 4.5, '#1b1b2f'); circle(hx + 12 + look, hy - 5, 4.5, '#1b1b2f');
  ctx.fillStyle = '#5d4037'; ctx.beginPath(); ctx.ellipse(hx, hy + 14, 14, 8, 0, 0, Math.PI); ctx.fill();   // munching mouth
  ctx.fillStyle = '#fff'; ctx.fillRect(hx - 8, hy + 14, 5, 5); ctx.fillRect(hx + 3, hy + 14, 5, 5);
  ctx.fillStyle = '#fffaf0'; ctx.fillRect(hx + 10, hy + 12 + Math.sin(frame * 0.4) * 2, 14, 10);           // a page he is chewing
  ctx.fillStyle = '#ffd740'; ctx.beginPath(); ctx.moveTo(hx - 20, hy - 26);                                  // crown
  for (let k = 0; k <= 4; k++) ctx.lineTo(hx - 20 + k * 10, hy - 26 - (k % 2 ? 6 : 20)); ctx.lineTo(hx + 20, hy - 26); ctx.fill();
  ctx.restore();
}
function drawBossBar() {
  if (!boss) return;
  text('🐛 THE BOOKWORM KING', W / 2, 84, 20, '#7cb342', 'center', '#1b1b2f');
  rr(W / 2 - 150, 92, 300, 14, 7, 'rgba(0,0,0,.4)');
  rr(W / 2 - 148, 94, 296 * Math.max(0, boss.hp) / boss.max, 10, 5, '#ff5252');
}

function makeEnemy(kind, x, minX, maxX) {
  const spd = { car: 2.6, ball: 1.8, tennis: 1.6, zombie: 0.6, fighter: 1.3 }[kind] || 1.1;
  return { kind, x, y: 11 * T - 28, w: 30, h: 28, vx: -spd, minX, maxX: maxX - 30, dead: 0, bounce: 0, t: Math.random() * 100 };
}

// ---------- Physics ----------
const solid = (tx, ty) => tx < 0 || tx >= LW || (ty >= 0 && ty < ROWS && tiles[ty][tx] > 0) || (gate && !gate.open && tx === gate.x / T && ty >= 2 && ty <= 10);
function hit(e) {
  const x0 = Math.floor(e.x / T), x1 = Math.floor((e.x + e.w - 0.01) / T), y0 = Math.floor(e.y / T), y1 = Math.floor((e.y + e.h - 0.01) / T);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) if (solid(tx, ty)) return true;
  return false;
}
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

const keys = {}, pressed = new Set();
addEventListener('keydown', e => {
  audio();
  if (!keys[e.key]) pressed.add(e.key);
  keys[e.key] = true;
  if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
  if (e.key === 'm' || e.key === 'M') musicOn = !musicOn;
});
addEventListener('keyup', e => { keys[e.key] = false; });

function hurtCat() {
  if (cat.inv > 0) return;
  cat.hearts--; cat.inv = 90; hurtFlash = 12; sfx.ouch();
  if (cat.hearts <= 0) { scene = 'oops'; sceneT = 0; }
}
function updatePlay() {
  levelTime++;
  const c = cat, g = P.gravity || 0.6, spd = P.fast ? 5 : 4.2;
  const dir = (keys.ArrowRight || keys.d ? 1 : 0) - (keys.ArrowLeft || keys.a ? 1 : 0);
  c.vx += (dir * spd - c.vx) * 0.25; if (dir) c.face = dir;
  const jumpKey = pressed.has(' ') || pressed.has('ArrowUp') || pressed.has('w');
  if (jumpKey) {
    if (c.onGround) { c.vy = P.gravity ? -9 : -11.8; c.jumps = 1; sfx.jump(); }
    else if (c.jumps < 2) { c.vy = P.gravity ? -8 : -10.5; c.jumps = 2; sfx.jump2(); for (let i = 0; i < 8; i++) particles.push({ x: c.x + 15, y: c.y + c.h, vx: Math.random() * 4 - 2, vy: Math.random() * 2, life: 20, c: '#fff' }); }
  }
  if (!(keys[' '] || keys.ArrowUp || keys.w) && c.vy < -4) c.vy += 0.6;   // short hop when you let go
  c.vy = Math.min(c.vy + g, 13);
  c.x += c.vx; if (hit(c)) { c.x -= c.vx; c.vx = 0; }
  c.y += c.vy; c.onGround = false;
  if (hit(c)) { if (c.vy > 0) { c.y = Math.floor((c.y + c.h) / T) * T - c.h; c.onGround = true; c.jumps = 0; if (!c.inv) { c.safeX = c.x; c.safeY = c.y; } } else c.y = (Math.floor(c.y / T) + 1) * T; c.vy = 0; }
  if (c.inv > 0) c.inv--;
  if (hurtFlash > 0) hurtFlash--;
  if (c.y > H + 40) { hurtCat(); Object.assign(c, { x: c.safeX - c.face * 40, y: c.safeY - 20, vx: 0, vy: 0 }); if (hit(c)) c.x = c.safeX; }
  // items
  for (const it of items) if (!it.got && Math.abs(it.x - (c.x + 15)) < 24 && Math.abs(it.y - (c.y + 14)) < 26) { it.got = true; collected++; sfx.coin(); for (let k = 0; k < 6; k++) particles.push({ x: it.x, y: it.y, vx: Math.random() * 4 - 2, vy: -Math.random() * 3, life: 25, c: '#ffd740' }); }
  // enemies
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.t++; e.x += e.vx;
    if (e.x < e.minX || e.x > e.maxX) e.vx = -e.vx;
    if (e.kind === 'ball' || e.kind === 'tennis' || e.kind === 'puff') e.bounce = Math.abs(Math.sin(e.t * 0.08)) * (e.kind === 'puff' ? 30 : 50);
    const box = { x: e.x, y: e.y - e.bounce, w: e.w, h: e.h };
    if (overlap(c, box)) {
      if (c.vy > 0 && c.y + c.h - c.vy <= box.y + 12) { e.dead = 1; c.vy = -9; c.jumps = 1; sfx.stomp(); for (let k = 0; k < 10; k++) particles.push({ x: e.x + 15, y: box.y + 14, vx: Math.random() * 6 - 3, vy: Math.random() * -4, life: 30, c: pick(['#fff', '#ffd740', '#ff80ab']) }); }
      else hurtCat();
    }
  }
  enemies = enemies.filter(e => e.dead < 25);
  // flying arrows on the castle page

      rr(x, y, w, 40, 10, on ? '#fff3b0' : open ? '#fff' : '#e0d8c8', on ? '#ff9800' : '#c9b89a', on ? 3 : 1.5);
      text(`${i + 1}. ${open ? p.game : '🔒'}`, x + 10, y + 26, 15, open ? '#5d4037' : '#9e9e9e', 'left', null);
      if (open && SAVE.stars[i]) text('★'.repeat(SAVE.stars[i]), x + 178, y + 26, 12, '#ffb300', 'right', null);
    });
    text('← → pick    SPACE to jump in!', 682, 474, 15, '#7a6a58', 'center', null);
  } else if (scene === 'end') {
    drawBookPage();
    text(SAVE.boss ? 'THE TRUE END!' : 'THE END!', 278, 140, SAVE.boss ? 48 : 60, '#ff9800', 'center', '#5d4037');
    text('Pages ran through ALL', 278, 200, 22, '#5d4037', 'center', null);
    text('14 games in the book!', 278, 230, 22, '#5d4037', 'center', null);
    if (SAVE.boss) { text('AND beat the', 278, 280, 22, '#5d4037', 'center', null); text('BOOKWORM KING! 🐛👑', 278, 312, 24, '#7cb342', 'center', '#1b1b2f'); text('You are a Game Factory LEGEND!', 278, 360, 18, '#7a6a58', 'center', null); }
    else text('You are a Game Factory hero!', 278, 290, 20, '#7a6a58', 'center', null);
    drawCat(600, 260 + Math.sin(frame * 0.1) * 20, -1, frame, true, 3);
    text('🏆', 680, 140, 60, '#fff', 'center', null);
    if (sceneT > 60) text('Press SPACE', 682, 440, 22, '#ff5aa5', 'center', null);
    for (const p of particles) { ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 6, 6); }
  }
  if (flip > 0) {      // page flip!
    const k = flip > 15 ? (30 - flip) / 15 : flip / 15, w = W * k;
    ctx.fillStyle = '#fffaf0'; ctx.fillRect(W - w, 0, w, H);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(W - w, 0, 10, H);
  }
}

let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
