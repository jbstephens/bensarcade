<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🏎️ Paper Racetrack Rally</title>
<script src="touchpad.js?v=4"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #ffe680 0 40px, #ffd84d 40px 80px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 10px 10px 4px; }
  #gHead h1 { margin: 0; font-size: clamp(30px, 5vw, 56px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff3b30; letter-spacing: 2px; }
  #gHead p { margin: 4px 0 6px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; }
  .flags { display: flex; justify-content: center; gap: 0; margin: 4px auto; width: 260px; height: 22px;
    background: repeating-conic-gradient(#222 0 25%, #fff 0 50%) 0 0 / 22px 22px; border: 3px solid #222; border-radius: 6px; }
  #gBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 18px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333;
    text-shadow: 3px 3px 0 #333; margin: 6px 4px -6px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #c9302c; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #c9302c; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #trace.race { cursor: pointer; }
  #side { width: min(42vw, 400px); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 19px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px; }
  #pHelp.turn { font-size: 22px; font-weight: bold; }
  #pens { display: none; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #e53935;
    border: 4px solid #333; border-radius: 16px; padding: 10px; }
  #pens.on { display: grid; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 4px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #333; }
  .btn { font: inherit; font-size: 22px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 12px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 60px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 24px; }
  .b-print2 { background: #ffb347; font-size: 22px; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); font-size: 22px; }
  .b-all { background: #ffb347; font-size: 22px; }
  .b-play { background: #c3a6ff; font-size: 24px; } .b-new { background: #fff3a0; }
  .b-go { background: linear-gradient(90deg, #8ef08e, #2ecc40); font-size: 30px; }
  .b-name { background: #fff; }
  /* race setup */
  #setup { display: none; flex-direction: column; gap: 8px; background: #2b2b2b; border: 4px solid #333; border-radius: 16px; padding: 10px; color: #fff; }
  #setup.on { display: flex; }
  #setup h3 { margin: 2px 0; text-align: center; font-size: 22px; }
  #nBtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #nBtns .btn { font-size: 28px; padding: 6px; min-height: 54px; background: #ddd; }
  #nBtns .btn.sel { background: #ffd60a; }
  .pRow { display: grid; grid-template-columns: 40px 1fr 1fr; gap: 6px; align-items: center; }
  .pRow .dot { width: 36px; height: 36px; border-radius: 50%; border: 4px solid #fff; }
  .pRow .btn { font-size: 18px; padding: 4px; min-height: 58px; display: flex; align-items: center; justify-content: center; gap: 4px; }
  .pRow .btn svg { width: 44px; height: 44px; flex: none; }
  .b-racer { background: #9be3ff; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 50; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* finish-line party */
  #party { position: fixed; inset: 0; z-index: 40; display: none; align-items: center; justify-content: center;
    background: rgba(0, 0, 0, .45); overflow: hidden; }
  #party.on { display: flex; }
  #partyBox { background: #fff; border: 6px solid #333; border-radius: 26px; padding: 16px 26px; text-align: center;
    max-width: 92vw; max-height: 92vh; overflow-y: auto; animation: pop .5s; position: relative; z-index: 2; }
  #partyBox h2 { margin: 4px 0; font-size: clamp(30px, 5vw, 50px); color: #ff3b30; -webkit-text-stroke: 1.5px #333; }
  #partyBox p { margin: 4px 0 10px; font-size: 22px; font-weight: bold; }
  #partyArt svg { width: min(36vh, 260px); height: min(30vh, 220px); }
  #partyBtns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .cf { position: absolute; top: -40px; width: 14px; height: 22px; border-radius: 3px; z-index: 1;
    animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(720deg); } }
  @keyframes pop { from { transform: scale(.3) rotate(-8deg); } to { transform: scale(1); } }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 40vh; }
  }
  /* SVG drawing styles */
  .f { fill: #fff; stroke: #222; stroke-width: var(--sw, 4); stroke-linejoin: round; }
  .ln { fill: none; stroke: #222; stroke-width: var(--sw, 4); stroke-linecap: round; stroke-linejoin: round; }
  .tt { font-family: "Arial Rounded MT Bold", "Comic Sans MS", "Chalkboard SE", sans-serif; font-weight: 900; }
  .bub { font-family: "Arial Rounded MT Bold", "Arial Black", "Comic Sans MS", sans-serif; font-weight: 900;
    fill: #fff; stroke: #222; stroke-width: 9; stroke-linejoin: round; paint-order: stroke fill; }
  /* ---------- PRINT: only the sheet (or the whole race kit) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #party { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; }
    #paper .race { display: none !important; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <div class="flags"></div>
    <h1>🏎️ PAPER RACETRACK RALLY</h1>
    <p>Race pencil cars dot to dot! Tap a sheet to play on screen or print it. 🖨️</p>
    <div id="gBtns">
      <button class="btn b-play" id="bQuick">🎮 Race on screen!</button>
      <button class="btn b-all" id="bPrintAll">🖨️ Print the whole race kit</button>
    </div>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <div id="setup">
      <h3>🏁 How many racers?</h3>
      <div id="nBtns"></div>
      <div id="pRows"></div>
      <button class="btn b-go" id="bGo">🚦 GO!</button>
    </div>
    <div id="pens"></div>
    <button class="btn b-play hide" id="bPlay">🎮 Race on screen!</button>
    <button class="btn b-new hide" id="bNew">🔄 New race</button>
    <button class="btn b-name hide" id="bLic">🪪 Name: Ben</button>
    <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
    <button class="btn b-print" id="bPrint">🖨️ Print blank</button>
    <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
    <button class="btn b-clear" id="bClear">🧽 Clear</button>
    <button class="btn b-back" id="bBack">⬅️ Back to sheets</button>
  </div>
</div>
<div id="printAll"></div>
<div id="party"><div id="partyBox"><h2 id="partyT"></h2><div id="partyArt"></div><p id="partyP"></p>
  <div id="partyBtns"><button class="btn b-go" id="bAgain">🔄 Race again!</button><button class="btn b-back" id="bPartyBack">🏁 Done</button></div></div></div>
<div id="toast"></div>
<script>
'use strict';
// ================== drawing helpers (outline style, from the Activity Room) ==================
const f1 = n => Math.round(n * 10) / 10;
const sh = (tag, a) => `<${tag} class="f" ${a}/>`;
const C = (x, y, r) => sh('circle', `cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}"`);
const R = (x, y, w, h, r) => sh('rect', `x="${f1(x)}" y="${f1(y)}" width="${f1(w)}" height="${f1(h)}" rx="${r || 0}"`);
const P = d => sh('path', `d="${d}"`);
const L = d => `<path class="ln" d="${d}"/>`;
const T = (x, y, size, str, anchor, col) => `<text class="tt" x="${f1(x)}" y="${f1(y)}" text-anchor="${anchor || 'middle'}" font-size="${size}" fill="${col || '#222'}">${str}</text>`;
const WL = (x, y, x2, label, size) => {
  size = size || 26;
  const lw = label ? Math.round(label.length * size * 0.62) + 10 : 0;
  return (label ? T(x, y, size, label, 'start') : '') + L(`M${x + lw} ${y + 4} L${x2} ${y + 4}`);
};
function titleSVG(t) {
  const n = t.length, size = Math.min(76, Math.round(1050 / Math.max(n, 1)));
  const fit = n * size * 0.72 > 740 ? ' textLength="740" lengthAdjust="spacingAndGlyphs"' : '';
  return `<text class="bub" x="400" y="${f1(70 + size * 0.36)}" text-anchor="middle" font-size="${size}"${fit}>${t.replace(/&/g, '&amp;')}</text>`;
}
// ================== color character art (from the Trading Cards) ==================
const OL = '#1b1b2f';
const _n = v => Math.round(v * 10) / 10;
const _st = (s, w) => s === 0 ? '' : ' stroke="' + (s || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linejoin="round"';
const _rot = (rot, x, y) => rot ? ' transform="rotate(' + _n(rot) + ' ' + _n(x) + ' ' + _n(y) + ')"' : '';
function aC(x, y, r, f, s, w) { return '<circle cx="' + _n(x) + '" cy="' + _n(y) + '" r="' + _n(r) + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aE(x, y, rx, ry, f, s, w, rot) { return '<ellipse cx="' + _n(x) + '" cy="' + _n(y) + '" rx="' + _n(rx) + '" ry="' + _n(ry) + '" fill="' + f + '"' + _st(s, w) + _rot(rot, x, y) + '/>'; }
function aR(x, y, w, h, rx, f, s, sw, rot) { return '<rect x="' + _n(x) + '" y="' + _n(y) + '" width="' + _n(w) + '" height="' + _n(h) + '" rx="' + _n(rx || 0) + '" fill="' + f + '"' + _st(s, sw) + _rot(rot, x + w / 2, y + h / 2) + '/>'; }
function aP(d, f, s, w) { return '<path d="' + d + '" fill="' + f + '"' + _st(s, w) + '/>'; }
function aL(d, col, w) { return '<path d="' + d + '" fill="none" stroke="' + (col || OL) + '" stroke-width="' + (w || 2.5) + '" stroke-linecap="round" stroke-linejoin="round"/>'; }
function aG(x, y, s, inner, rot, flip) { return '<g transform="translate(' + _n(x) + ' ' + _n(y) + ')' + (rot ? ' rotate(' + _n(rot) + ')' : '') + ' scale(' + (flip ? -s : s) + ' ' + s + ')">' + inner + '</g>'; }
function aO(op, inner) { return '<g opacity="' + op + '">' + inner + '</g>'; }
function polyD(pts) { let d = ''; for (let k = 0; k < pts.length; k += 2) d += (k ? 'L' : 'M') + _n(pts[k]) + ' ' + _n(pts[k + 1]) + ' '; return d + 'Z'; }
function starD(x, y, r, n, inner, rot) {
  n = n || 5; inner = inner || 0.45; rot = rot || 0; const pts = [];
  for (let k = 0; k < n * 2; k++) { const a = -Math.PI / 2 + rot + k * Math.PI / n, rr = k % 2 ? r * inner : r; pts.push(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  return polyD(pts);
}
const shine = (x, y, rx, ry, rot) => aE(x, y, rx, ry, '#ffffff', 0, 0, rot === undefined ? -25 : rot).replace('/>', ' opacity=".45"/>');
const sparkle = (x, y, r, col) => aP(starD(x, y, r, 4, .3), col || '#fff', 0);
const tube = (d, col, w) => aL(d, OL, w + 3) + aL(d, col, w);
const flame = (x, y, s, col) => aG(x, y, s || 1, aP('M0 -14 Q9 -4 6 4 Q4 10 0 10 Q-4 10 -6 4 Q-9 -4 0 -14 Z', col || '#ff6d00', OL, 1.5) + aP('M0 -4 Q4 1 3 5 Q0 8 -3 5 Q-4 1 0 -4 Z', '#ffd740', 0));
function eyes(x, y, gap, r, kind, col) {
  col = col || '#1b1b2f'; let s = '';
  for (const sx of [-1, 1]) {
    const ex = x + sx * gap;
    if (kind === 'mad') s += aE(ex, y, r * .75, r, col, OL, 1.5) + aC(ex - r * .2, y - r * .35, r * .25, '#fff', 0) +
      aL('M' + _n(ex - sx * r * 1.1) + ' ' + _n(y - r * 1.5) + ' L' + _n(ex + sx * r * .7) + ' ' + _n(y - r * .9), OL, Math.max(2, r * .4));
    else s += aE(ex, y, r * .85, r, '#fff', OL, 1.8) + aC(ex + sx * r * .1, y + r * .15, r * .55, col, 0) + aC(ex + sx * r * .1 - r * .2, y - r * .1, r * .2, '#fff', 0);
  }
  return s;
}
const smile = (x, y, w) => aL('M' + _n(x - w / 2) + ' ' + _n(y) + ' Q' + _n(x) + ' ' + _n(y + w * .55) + ' ' + _n(x + w / 2) + ' ' + _n(y));
const cheeks = (x, y, gap, r) => aO('.55', aE(x - gap, y, r, r * .65, '#ff7aa2', 0) + aE(x + gap, y, r, r * .65, '#ff7aa2', 0));
function crownA(x, y, w, h, col) {
  col = col || '#ffd740'; const l = x - w / 2, b = y + h / 2, t = y - h / 2;
  return aP(polyD([l, b, l, t, l + w * .25, y, x, t - h * .2, l + w * .75, y, l + w, t, l + w, b]), col, OL, 2) +
    aC(x, b - h * .28, Math.max(1.8, w * .08), '#ff4081', OL, 1) + aC(l + w * .2, b - h * .25, Math.max(1.4, w * .06), '#40c4ff', OL, 1) + aC(l + w * .8, b - h * .25, Math.max(1.4, w * .06), '#69f0ae', OL, 1);
}
// Robo: white round robot, dark visor, blue eyes, blue ear pods, antenna
function roboA(o) {
  o = o || {}; const H = o.head || '#fafafa', B = o.body || H, V = o.visor || '#263238', EY = o.eye || '#40c4ff', PD = o.pod || '#2979ff';
  let s = '';
  if (!o.noBody) {
    s += o.armsUp ? aR(-34, -2, 9, 22, 4.5, B, OL, 2.5, -30) + aR(25, -2, 9, 22, 4.5, B, OL, 2.5, 30) + aC(-36, -4, 5, PD, OL, 2) + aC(36, -4, 5, PD, OL, 2)
      : aR(-31, 14, 9, 22, 4.5, B, OL, 2.5, 12) + aR(22, 14, 9, 22, 4.5, B, OL, 2.5, -12) + aC(-29, 37, 5, PD, OL, 2) + aC(29, 37, 5, PD, OL, 2);
    s += aR(-15, 38, 11, 14, 4, o.legs || B, OL, 2.5) + aR(4, 38, 11, 14, 4, o.legs || B, OL, 2.5) +
      aR(-20, 10, 40, 31, 10, B, OL, 2.5) + aC(0, 25, 5.5, o.light || PD, OL, 2) + shine(-11, 17, 4, 2.5);
  }
  s += aL('M0 -39 L0 -49', OL, 2.5) + aC(0, -51, 4.5, o.tip || '#ff5252', OL, 2) +
    aE(-27, -14, 6, 9, PD, OL, 2.2) + aE(27, -14, 6, 9, PD, OL, 2.2) +
    aC(0, -14, 25, H, OL, 2.8) + aR(-19, -27, 38, 22, 10, V, OL, 2) + shine(-10, -31, 6, 2.2, -12) +
    aE(-8, -16, 4.5, 5.5, EY, 0) + aE(8, -16, 4.5, 5.5, EY, 0) + aC(-9.5, -18, 1.6, '#fff', 0) + aC(6.5, -18, 1.6, '#fff', 0);
  if (o.mad) s += aL('M-15 -26 L-4 -22 M15 -26 L4 -22', EY, 2.4); else s += aL('M-5 1 Q0 5 5 1', OL, 2);
  return s;
}
// King Gloop: purple goo + gold crown. Baby Gloop: light purple.
function gloopA(o) {
  o = o || {}; const c = o.col || '#ab47bc';
  let s = aP('M-42 30 Q-48 -6 -30 -24 Q0 -48 30 -24 Q48 -6 42 30 Q33 37 24 30 Q15 40 6 31 Q-6 41 -15 31 Q-27 40 -42 30 Z', c, OL, 2.8) +
    aE(-24, 34, 4, 5, o.dark || c, OL, 1.5) + aE(18, 35, 3, 4, o.dark || c, OL, 1.5) +
    shine(-22, -16, 7, 4) + eyes(0, -6, 13, 8, 'cute') + smile(0, 11, 16) + cheeks(0, 6, 25, 4);
  if (o.crown) s += crownA(0, -40, 34, 16, o.crown === true ? '#ffd740' : o.crown);
  return o.scale ? aG(0, 0, o.scale, s) : s;
}
// Sammy: Ben's brown tabby cat with brown eyes
function catA() {
  const F = '#8d6e63', ST = '#4e342e', BL = '#d7b98e';
  let s = tube('M18 42 Q44 40 38 14 Q36 4 42 -2', F, 6) + aE(0, 28, 23, 22, F, OL, 2.6) + aE(0, 31, 12, 15, BL, 0) +
    aL('M-21 22 L-13 24 M-22 32 L-13 33 M21 22 L13 24 M22 32 L13 33', ST, 2.6) +
    aE(-11, 48, 7.5, 5, F, OL, 2) + aE(11, 48, 7.5, 5, F, OL, 2) +
    aP(polyD([-23, -20, -19, -46, -3, -34]), F, OL, 2.4) + aP(polyD([23, -20, 19, -46, 3, -34]), F, OL, 2.4) +
    aP(polyD([-18, -26, -17, -39, -8, -32]), '#d7a0a0', 0) + aP(polyD([18, -26, 17, -39, 8, -32]), '#d7a0a0', 0) +
    aC(0, -12, 25, F, OL, 2.6) +
    aL('M-8 -34 L-5 -27 L0 -32 L5 -27 L8 -34', ST, 2.4) + aL('M-25 -10 L-17 -9 M-24 -3 L-17 -4 M25 -10 L17 -9 M24 -3 L17 -4', ST, 2.4) +
    aE(0, -1, 11, 7.5, BL, 0) +
    aE(-9, -14, 6, 7.5, '#fff', OL, 1.8) + aE(9, -14, 6, 7.5, '#fff', OL, 1.8) +

  const list = state.traces[SHEETS[cur].id] || []; if (!list.length || typeof document === 'undefined') return '';

// ================== printing ==================
// The sheet prints by itself (see @media print). On-screen race cars never print, so you get a fresh track.
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();

}
function countPrint(list) {
  list.forEach(i => { const id = SHEETS[i].id; if (isTrack(i)) state.tracksPrinted++; state.printed[id] = num(state.printed[id]) + 1; });
  saveState(); award();
}
function printSheet() {
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); frame = 6; renderSheet(true); countPrint([cur]); doPrint(() => renderSheet());
}
function printColors() {
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); frame = 6; renderSheet();
  const img = traceImage(), svg = $('svgBox').querySelector('svg');
  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }
  countPrint([cur]); doPrint(() => renderSheet());
}
function printAll() {
  $('printAll').innerHTML = ORDER.map(i => buildSheet(i, { lic: state.lic })).join('');
  document.body.classList.add('pAll'); countPrint(ORDER);
  doPrint(endPrintAll);
}
function endPrintAll() {

}
// ================== keys (arrows pick, Enter opens, Escape goes back, P prints) ==================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let n = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) n++; });
  return Math.max(1, n);

const ARROW = { ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1] };
function onKey(e) {

    else if (k === 'ArrowDown') sel = Math.min(n - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);

    return;

  if (k === 'Escape' || k === 'Backspace') { if (racing) togglePlay(); else backToGallery(); e.preventDefault(); return; }
  if (k === 'p' || k === 'P') { printSheet(); return; }

    if (ARROW[k]) { const a = ARROW[k]; race.sel = [Math.max(-1, Math.min(1, race.sel[0] + a[0])), Math.max(-1, Math.min(1, race.sel[1] + a[1]))]; SFX.tick(); renderRace(); e.preventDefault(); }

    return;
  }
  if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % ORDER.length); e.preventDefault(); }
  else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + ORDER.length - 1) % ORDER.length); e.preventDefault(); }

}
function init() {

  renderGallery(); renderPens();
  const cv = $('trace');

  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bQuick').addEventListener('click', () => { sel = ORDER.indexOf(1); openSheet(sel); showSetup(); });
  $('bPrint').addEventListener('click', printSheet);
  $('bMagic').addEventListener('click', magicColor);
  $('bPrintColor').addEventListener('click', printColors);
  $('bPrintAll').addEventListener('click', printAll);
  $('bPlay').addEventListener('click', togglePlay);
  $('bNew').addEventListener('click', showSetup);
  $('bGo').addEventListener('click', startRace);
  $('bLic').addEventListener('click', cycleLic);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  $('bAgain').addEventListener('click', raceAgain);
  $('bPartyBack').addEventListener('click', closeParty);

  window.addEventListener('keydown', onKey);

if (typeof window !== 'undefined' && !window.__TEST__) {

}
