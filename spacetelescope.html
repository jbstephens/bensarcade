<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🔭 Space Telescope</title>
<script src="touchpad.js?v=10"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Trebuchet MS", "Avenir Next", Arial, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #gl:active { cursor: grabbing; }
  /* the round telescope view: black all around a circle, with a metal eyepiece ring */
  #scope { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(circle at var(--cx) var(--cy), transparent calc(var(--r) - 40px), rgba(0,0,0,.55) calc(var(--r) - 6px), #000 var(--r)); }
  #ring { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%; box-sizing: border-box; border: 10px solid #3a3f48; box-shadow: 0 0 0 3px #6c7480, 0 0 0 9px #1c1f24, 0 0 0 11px #555c66, inset 0 0 22px 6px rgba(0,0,0,.85), 0 0 50px rgba(120,160,255,.12); }
  #ticks { position: fixed; pointer-events: none; z-index: 1; border-radius: 50%; opacity: .35; background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.6) 0 .5deg, transparent .5deg 10deg); -webkit-mask: radial-gradient(circle closest-side, transparent calc(100% - 12px), #000 calc(100% - 11px), #000 calc(100% - 3px), transparent calc(100% - 2px)); mask: radial-gradient(circle closest-side, transparent calc(100% - 12px), #000 calc(100% - 11px), #000 calc(100% - 3px), transparent calc(100% - 2px)); }
  #top { position: fixed; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 16px; gap: 10px; pointer-events: none; z-index: 3; }
  #title { font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #idea { display: inline-block; margin-left: 10px; font-size: clamp(14px, 2vw, 20px); background: rgba(255,214,64,.92); color: #4a2c00; padding: 4px 12px; border-radius: 20px; vertical-align: middle; text-shadow: none; transform: rotate(-3deg); }
  .pill { pointer-events: auto; border: 0; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font: inherit; font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; padding: 10px 18px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 2px rgba(255,255,255,.25) inset; }
  .pill:active { transform: scale(.95); }
  #rightBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  #count { pointer-events: none; }
  #bottom { position: fixed; bottom: 10px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; z-index: 3; }
  #objs { display: flex; justify-content: center; gap: 7px; flex-wrap: wrap; padding: 0 10px; max-width: 1100px; }
  .obj { pointer-events: auto; border: 0; border-radius: 18px; min-width: 82px; padding: 6px 10px; font: inherit; font-size: clamp(13px, 1.5vw, 16px); white-space: nowrap; font-weight: 800; color: #fff; background: rgba(20,30,60,.6); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 2px rgba(255,255,255,.2) inset; display: flex; flex-direction: column; align-items: center; gap: 1px; position: relative; }
  .obj .e { font-size: clamp(24px, 3vw, 32px); line-height: 1.1; }
  .obj.on { background: rgba(255,255,255,.9); color: #1a2340; box-shadow: 0 0 22px rgba(160,200,255,.8); }
  .obj.seen::after { content: '✅'; position: absolute; top: -6px; right: -4px; font-size: 14px; }
  #factBox { pointer-events: auto; max-width: min(92vw, 760px); display: flex; align-items: center; gap: 10px; background: rgba(0,0,0,.55); padding: 8px 10px 8px 16px; border-radius: 18px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity .5s; }
  #fact { font-size: clamp(14px, 1.8vw, 19px); text-align: center; flex: 1; }
  #more { font-size: clamp(14px, 1.7vw, 17px); padding: 9px 14px; white-space: nowrap; background: rgba(255,214,64,.95); color: #4a2c00; }
  #name { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); font-size: clamp(30px, 5.5vw, 60px); font-weight: 900; text-shadow: 0 4px 30px rgba(0,0,0,.95); opacity: 0; transition: opacity .8s; pointer-events: none; white-space: nowrap; }
  #name.show { opacity: 1; }
  #sunWarn { position: fixed; z-index: 3; left: 50%; transform: translateX(-50%) scale(.8); top: 70px; background: linear-gradient(135deg,#ff7043,#ffb300); color: #3a1500; font-weight: 900; font-size: clamp(15px, 2.1vw, 21px); padding: 8px 18px; border-radius: 18px; box-shadow: 0 6px 24px rgba(0,0,0,.5); opacity: 0; transition: all .5s; pointer-events: none; text-align: center; white-space: nowrap; }
  #sunWarn.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #hint { position: fixed; z-index: 2; left: 50%; transform: translateX(-50%); font-size: clamp(14px, 1.8vw, 18px); background: rgba(0,0,0,.45); padding: 6px 14px; border-radius: 999px; pointer-events: none; transition: opacity 1s; white-space: nowrap; }
  #prize { position: fixed; z-index: 6; top: 22%; left: 50%; transform: translateX(-50%) scale(.6); background: linear-gradient(135deg,#ffe082,#ffb300); color: #4a2c00; font-size: clamp(20px, 3.5vw, 32px); font-weight: 900; padding: 16px 28px; border-radius: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.5); opacity: 0; transition: all .6s; pointer-events: none; text-align: center; }
  #prize.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #oops { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; font-size: 26px; padding: 30px; background: #123; z-index: 9; }
  @media (max-width: 600px) { #title { font-size: 22px; } #idea { font-size: 12px; margin-left: 4px; } .pill { font-size: 14px; padding: 8px 12px; } #factBox { flex-direction: column; gap: 6px; } #sunWarn { white-space: normal; width: 80vw; } }
  @media (max-width: 760px) { .obj { min-width: 50px; min-height: 50px; padding: 5px 7px; justify-content: center; } .obj .t { display: none; } }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="scope"></div><div id="ticks"></div><div id="ring"></div>
<div id="name"></div>
<div id="hint">👆 Drag to spin it!</div>
<div id="sunWarn">😎 Special Sun filter ON! Never look at the real Sun!</div>
<div id="top">
  <div id="title">🔭 Space Telescope <span id="idea">💡 Ben's idea!</span></div>
  <div id="rightBtns">
    <span class="pill" id="count">👀 0 / 10</span>
    <button class="pill" id="soundBtn">🔈 Sound off</button>
  </div>
</div>
<div id="bottom"><div id="factBox"><div id="fact"></div><button class="pill" id="more">🤓 Another fact</button></div><div id="objs"></div></div>
<div id="prize"></div>
<div id="oops">😮 This computer can't draw the telescope view.<br>Ask Dad to help with this one!</div>

// the comet: a glowing head (coma) with a straight blue gas tail and a curvy dusty tail
const COMET_FS = `
uniform float uT; uniform vec2 uDir; varying vec2 vUv;
${GL_COMMON}

const GAL_FS = `

const BLOB_FS = `uniform vec2 uAsp; uniform float uI; varying vec2 vUv;
${GL_COMMON}
void main(){ vec2 q=(vUv-.5)*2./uAsp; float r=length(q); vec3 col=vec3(1.,.88,.72)*(exp(-r*r*9.)*.8+exp(-r*5.)*.25)*uI; gl_FragColor=vec4(tone(col),1.); }`;
// ---------- trophy + saving which things Ben has looked at ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let seen = new Set();
try { seen = new Set(JSON.parse(localStorage.getItem('gfSpaceTelescope') || '[]')); } catch (_) {}
function saveSeen() { try { localStorage.setItem('gfSpaceTelescope', JSON.stringify([...seen])); } catch (_) {} }
// ---------- the 3D world ----------
const cv = document.getElementById('gl');
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
let renderer = null;

const camera = new THREE.PerspectiveCamera(35, 1, 0.02, 3000), bgCam = new THREE.PerspectiveCamera(35, 1, 1, 3000);
// the night sky behind everything
(function makeStars() {
  const N = 7000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N);

// helpers to make shaded balls, glowing air and flat glowing cards
const U = () => ({ uSun: { value: new THREE.Vector3(0, 0, 1) }, uCam: { value: new THREE.Vector3(0, 0, 5) }, uT: { value: 0 }, uExp: { value: 1 } });
const SPH = new THREE.SphereGeometry(1, 128, 96), SPH_S = new THREE.SphereGeometry(1, 48, 32);

}
function air(col, h, I) {

// each object: root (moved as a whole) > body (spun by your finger) + cards that always face the telescope
const BUILD = {
  moon(o) { o.body.add(planet(MOON_SURF)); },
  mars(o) { o.body.add(planet(MARS_SURF)); o.body.add(air([1, .55, .4], .025, .7)); },
  jupiter(o) {

    o.moons = [[.1, 1.4, 1.1, 0], [.085, 1.68, .75, 1], [.13, 1.98, .5, 2], [.12, 2.3, .3, 3]].map(([s, R, w, k], i) => {
      const m = planet(GALILEAN_SURF, { uK: { value: k } }, SPH_S); m.scale.setScalar(s); o.body.add(m); return { m, R, w, a: [0.6, 2.4, 3.6, 5.2][i] };

  },
  saturn(o) {

    const rg = new THREE.RingGeometry(1.2, 2.3, 256, 4); rg.rotateX(-Math.PI / 2);
    const rm = new THREE.ShaderMaterial({ uniforms: U(), vertexShader: PLANET_VS, fragmentShader: RING_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide });

  },
  earth(o) {

    const cl = new THREE.Mesh(new THREE.SphereGeometry(1.008, 96, 64), new THREE.ShaderMaterial({ uniforms: Object.assign(U(), { uAmt: { value: 1 } }), vertexShader: PLANET_VS, fragmentShader: CLOUD_FS, transparent: true, depthWrite: false }));

  sun(o) { o.body.add(planet(SUN_SURF)); const c = card(6, 6, CORONA_FS); o.root.add(c); o.cards.push(c); },
  venus(o) { o.body.add(planet(VENUS_SURF)); o.body.add(air([1.2, 1, .6], .05, 1.3)); },
  neptune(o) { o.body.add(planet(NEP_SURF)); o.body.add(air([.35, .6, 1.4], .05, 1.4)); },
  comet(o) {

function ensureBuilt(o) {

// ---------- the round telescope view ----------
let CX = 0, CY = 0, CR = 100;
const scopeEl = document.getElementById('scope'), ringEl = document.getElementById('ring'), ticksEl = document.getElementById('ticks');
const nameEl = document.getElementById('name'), hintEl = document.getElementById('hint');
function layout() {
  const W = innerWidth, H = innerHeight, small = W < 760;
  CR = Math.min(W * .47, H * (small ? .36 : .41)); CX = W / 2; CY = Math.max(CR + (small ? 64 : 56), H * .45);
  if (W < H) { CR = Math.min(W * .46, H * .33); CY = H * .44; }
  scopeEl.style.setProperty('--cx', CX + 'px'); scopeEl.style.setProperty('--cy', CY + 'px'); scopeEl.style.setProperty('--r', CR + 'px');
  [ringEl, ticksEl].forEach((el, k) => { const r = CR + (k ? 0 : 4); Object.assign(el.style, { left: CX - r + 'px', top: CY - r + 'px', width: r * 2 + 'px', height: r * 2 + 'px' }); });
  nameEl.style.top = (CY - CR + 18) + 'px'; hintEl.style.top = (CY + CR - 50) + 'px'; document.getElementById('sunWarn').style.top = (CY + CR - 104) + 'px';
  if (renderer) {
    renderer.setPixelRatio(scale); renderer.setSize(W, H, false);
    camera.aspect = bgCam.aspect = W / H; bgCam.updateProjectionMatrix();
    camera.setViewOffset(W, H, 0, H / 2 - CY, W, H);
    bgScene.userData.mat.uniforms.uPR.value = scale;
  }
}
// ---------- buttons and facts ----------
const objBox = document.getElementById('objs'), factEl = document.getElementById('fact'), countEl = document.getElementById('count');
let cur = -1, factI = 0, zoom = 0, seenTimer = 0, nameTimer = 0, dragged = false;
OBJS.forEach((o, i) => {
  const b = document.createElement('button'); b.className = 'obj' + (seen.has(o.id) ? ' seen' : '');
  b.innerHTML = `<span class="e">${o.e}</span><span class="t">${o.t}</span>`;
  b.addEventListener('click', e => { e.stopPropagation(); select(i); });
  objBox.appendChild(b); o.btn = b;
});
function updCount() { countEl.textContent = '👀 ' + seen.size + ' / ' + OBJS.length; }
updCount();
if (seen.size >= OBJS.length) trophy('spaceTelescope');
function select(i) {
  if (i === cur && zoom > .3) return;
  if (cur >= 0 && OBJS[cur].root) OBJS[cur].root.visible = false;
  cur = i; const o = OBJS[i]; ensureBuilt(o); o.root.visible = true; zoom = 0;
  OBJS.forEach((p, j) => p.btn.classList.toggle('on', j === i));
  factI = 0; factEl.textContent = '🤓 ' + o.facts[0];
  nameEl.textContent = o.e + ' ' + o.t; nameEl.classList.add('show');
  clearTimeout(nameTimer); nameTimer = setTimeout(() => nameEl.classList.remove('show'), 3200);
  document.getElementById('sunWarn').classList.toggle('show', o.id === 'sun');
  Sound.start(); Sound.whoosh();
  clearTimeout(seenTimer); seenTimer = setTimeout(() => {
    if (seen.has(o.id)) return;
    seen.add(o.id); saveSeen(); o.btn.classList.add('seen'); updCount(); Sound.chime(false);
    if (seen.size === OBJS.length) { trophy('spaceTelescope'); showPrize('🏆 You looked at all 10!<br>Space Telescope trophy!'); }
  }, 5000);
}
document.getElementById('more').addEventListener('click', e => {
  e.stopPropagation(); if (cur < 0) return; const f = OBJS[cur].facts; factI = (factI + 1) % f.length; factEl.textContent = '🤓 ' + f[factI];
});
function showPrize(msg) { const p = document.getElementById('prize'); p.innerHTML = msg; p.classList.add('show'); setTimeout(() => p.classList.remove('show'), 4500); }
addEventListener('keydown', e => {
  if (e.key === 'ArrowRight') select((cur + 1) % OBJS.length); else if (e.key === 'ArrowLeft') select((cur + OBJS.length - 1) % OBJS.length);
});
// ---------- drag to spin (touchpad.js turns finger drags on the canvas into mouse drags) ----------
let dragging = false, lx = 0, ly = 0, vx = 0, vy = 0, lastMove = 0;
cv.addEventListener('mousedown', e => { dragging = true; lx = e.clientX; ly = e.clientY; vx = vy = 0; Sound.start(); });
addEventListener('mousemove', e => {
  if (!dragging || cur < 0) return; const o = OBJS[cur]; if (!o.root) return;
  const k = 3 / Math.max(200, CR * 2), dx = (e.clientX - lx) * k, dy = (e.clientY - ly) * k; lx = e.clientX; ly = e.clientY;
  o.spinY += dx; o.tiltX = Math.max(-1.5, Math.min(1.5, o.tiltX + dy));
  const now = performance.now(), dt = Math.max(8, now - lastMove) / 1000; lastMove = now; vx = vx * .5 + dx / dt * .5; vy = vy * .5 + dy / dt * .5;

addEventListener('mouseup', () => { if (!dragging) return; dragging = false; if (performance.now() - lastMove > 90) vx = vy = 0; });
// ---------- drawing every frame ----------
const inv = new THREE.Matrix4(), tw = new THREE.Vector3();
let last = 0, T = 0, running = true, raf = 0, drift = 0; const frameTimes = [];
function shade(o) {
  o.root.updateMatrixWorld(true);
  o.root.traverse(m => {
    if (!m.userData.shade) return; const u = m.material.uniforms; inv.copy(m.matrixWorld).invert();
    u.uCam.value.copy(camera.position).applyMatrix4(inv); u.uSun.value.copy(o.sunV).transformDirection(inv); u.uT.value = T; if (u.uExp) u.uExp.value = o.exp || 1;
  });

}

  frameTimes.push(dt); if (frameTimes.length > 50) { const avg = frameTimes.reduce((a, b) => a + b) / frameTimes.length; frameTimes.length = 0; if (avg > 0.026 && scale > 0.45) { scale *= 0.85; layout(); } }

document.addEventListener('visibilitychange', () => {

});
addEventListener('resize', layout);
hintEl.style.opacity = 0;
factEl.textContent = '🔭 Tap a button below to point the telescope at something!';
document.getElementById('more').style.display = 'none';
const _sel = select; select = function (i) { document.getElementById('more').style.display = ''; _sel(i); };
if (renderer) { layout(); raf = requestAnimationFrame(frame); }
</script>
