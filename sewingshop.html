<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  .h2 { font-size: 28px; font-weight: 900; color: #4a148c; margin: 4px 0 12px; text-align: center; }

  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(58,13,54,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(58,13,54,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fce4ec; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fce4ec; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #ad1457; }
  #printBox .pbTip { font-size: 20px; color: #4a148c; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  /* 🖨️ TRUE SIZE: every page is drawn at 100 dots per inch on an 8.5 x 11 inch canvas and printed edge to edge at exactly 8.5 x 11 in.
     Everything important stays 0.4 in away from the paper edge, so printers that can't reach the edge only lose blank margin. */
  @media print {
    @page { size: letter portrait; margin: 0; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; margin: 0 !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 8.5in; height: 11in; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 🧵 ROBO 2.0's SEWING PATTERN SHOP: Ben's idea (and Mom's)! Buy REAL plushie sewing patterns with pretend Stitch Coins,
// then pick which orders to PRINT. Every pattern piece is drawn at TRUE SIZE (100 canvas units = 1 inch).
// Save: localStorage.sewingShop = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'sewingShop';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }

<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) — copied from Robo 2.0's Online Store ----------
let ctx = null;
const FONT = '"Trebuchet MS", Arial, sans-serif';
function rrPath(x, y, w, h, r) {
  const R = Array.isArray(r) ? r : [r, r, r, r], m = Math.min(w / 2, h / 2), [a, b, c, d] = R.map(v => Math.max(0, Math.min(v, m)));
  ctx.beginPath(); ctx.moveTo(x + a, y); ctx.arcTo(x + w, y, x + w, y + h, b); ctx.arcTo(x + w, y + h, x, y + h, c); ctx.arcTo(x, y + h, x, y, d); ctx.arcTo(x, y, x + w, y, a); ctx.closePath();
}
function rr(x, y, w, h, r, fill, stroke, lw) { rrPath(x, y, w, h, r); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function circ(x, y, r, fill, stroke, lw) { ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function ell(x, y, rx, ry, fill, rot = 0, stroke, lw) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); } }
function poly(pts, fill, stroke, lw) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.lineJoin = 'round'; ctx.stroke(); } }
function line(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 7 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapLines(s, size, maxW, bold = true) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
// left-aligned paragraph from the TOP; returns the y under it
function para(s, x, y, size, maxW, color = '#333', bold = false, lineH) {
  const L = wrapLines(s, size, maxW, bold); lineH = lineH || size * 1.25;
  L.forEach((l, i) => txt(l, x, y + size * 0.6 + i * lineH, size, color, 'left', bold)); return y + L.length * lineH;
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  const L = wrapLines(s, size, maxW); lineH = lineH || size * 1.2;
  L.forEach((l, i) => txt(l, x, y + (i - (L.length - 1) / 2) * lineH, size, color, align)); return L.length;
}
function star(x, y, r, fill, stroke) { const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * q, y + Math.sin(a) * q]); } poly(p, fill, stroke, 1.5); }
function heartPath(x, y, r) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
}
function heart(x, y, r, fill) { heartPath(x, y, r); ctx.fillStyle = fill; ctx.fill(); }
function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
function dashLine(x1, y1, x2, y2, col, lw, dash) { ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
function scissors(x, y, s = 1) {                      // little scissors picture (no emoji)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = '#555'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-9, -7, 6, 0, 7); ctx.moveTo(-3, 7); ctx.arc(-9, 7, 6, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(16, 6); ctx.moveTo(-4, 4); ctx.lineTo(16, -6); ctx.stroke(); ctx.restore();
}
function needle(x, y, ang = -0.6, len = 60, thread = '#e91e63') {   // a sewing needle with thread (no emoji)
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  ctx.fillStyle = '#90a4ae'; ctx.beginPath(); ctx.moveTo(0, -2.5); ctx.lineTo(len, 0); ctx.lineTo(0, 2.5); ctx.closePath(); ctx.fill();
  ell(5, 0, 3.5, 1.3, '#fff'); ctx.strokeStyle = thread; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(5, 0); ctx.bezierCurveTo(-20, -18, -30, 20, -55, 6); ctx.stroke();
  ctx.restore();
}
function pin(x, y, ang = 0.8, len = 34) { ctx.save(); ctx.translate(x, y); ctx.rotate(ang); line(0, 0, len, 0, '#78909c', 2); circ(0, 0, 5, '#e53935'); ctx.restore(); }

<script>
// ---------- 🤖 THE CREW: real drawing code copied from their games (frozen in a nice pose) ----------
// Robots: drawRoboBase from Robo Jump 13 (30 x 40 box, top-left 0,0) + Robo's antenna from Robo: The Beginning (robomovie.html)
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da', antenna: true };
const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true, edge: '#ce93d8' };
const PAL_PINK = { head: '#f8bbd0', body: '#fce4ec', visor: '#4a148c', eye: '#ff80ab', legs: '#ec407a', pod: '#f06292', pink: true, edge: '#f48fb1' };
const PAL_GLINT = { head: '#ffe3ef', body: '#fff0e0', visor: '#1a2540', eye: '#64ffda', legs: '#ff9e80', pod: '#64ffda', glint: true, edge: '#ffab91' };
const PAL_NEGA = { head: '#37474f', body: '#263238', visor: '#b71c1c', eye: '#e040fb', legs: '#4a148c', pod: '#7b1fa2', chest: '#e040fb', nega: true, edge: '#546e7a' };   // robojump13.html PAL_NEGA
function drawBot(pal) {                                 // units: Robo's 30 x 40 box
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (pal.antenna) { ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(15, 0); ctx.quadraticCurveTo(15.2, -5, 15.5, -9); ctx.stroke(); circ(15.5, -10, 2.6, pal.pod); circ(14.7, -10.8, 0.8, 'rgba(255,255,255,.8)'); }
  ctx.fillStyle = pal.legs; ctx.fillRect(4, 33, 8, 7); ctx.fillRect(18, 33, 8, 7);
  rr(2, 20, 26, 16, 6, pal.body, pal.edge, 0.6);
  if (!pal.r2 && !pal.pink) circ(15, 28, 3, pal.chest || pal.pod);
  if (pal.glint) for (const px of [-3, 33]) { circ(px, 14, 6.5, '#ff9e80'); circ(px, 14, 5, '#e0fff8'); circ(px - 1.6, 12.4, 1.8, '#fff'); }
  else { rr(-5, 9, 6, 9, 3, pal.pod); rr(29, 9, 6, 9, 3, pal.pod); }
  rr(-2, 0, 34, 22, 12, pal.head, pal.edge, 0.6);
  rr(2, 4, 26, 13, 9, pal.visor);
  ell(8, 6, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
  const ex = 18, ey = 10.8;
  if (pal.nega) { circ(ex - 6, ey, 6, 'rgba(224,64,251,.35)'); circ(ex + 6, ey, 6, 'rgba(224,64,251,.35)'); }   // Nega's glowing purple eyes
  ell(ex - 6, ey, 3.5, 5, pal.eye); ell(ex + 6, ey, 3.5, 5, pal.eye);
  if (pal.r2) {
    ctx.strokeStyle = '#00e676'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(ex, ey + 6, 3.5, 0.2, Math.PI - 0.2); ctx.stroke();
    ctx.fillStyle = '#ff00e5'; ctx.fillRect(1, 3, 4, 4); ctx.fillStyle = '#00e676'; ctx.fillRect(25, 2, 4, 4);
    txt('2.0', 15, 28.8, 9, '#7b1fa2');
  }

<script>
// =====================================================================================================
// ✂️ THE PATTERN ENGINE. Shapes are built from the SAME rectangles, circles and ellipses as each character's
// game drawing (in game units), scaled by k inches per unit. A smooth union rounds the inside corners so a
// 1/4 in seam allowance can follow them. The stitch line is traced from that shape (marching squares), and the
// cut line is the stitch line pushed 1/4 in outward. All lengths are in INCHES.
// =====================================================================================================
const SA = 0.25, DS = 0.03;                              // seam allowance; spacing of stitch-line points
const G = {                                              // shape primitives (game units)
  R: (x, y, w, h, r = 0) => ({ t: 'r', x, y, w, h, r }), C: (x, y, r) => ({ t: 'c', x, y, r }), E: (x, y, rx, ry, rot = 0) => ({ t: 'e', x, y, rx, ry, rot }),
  P: (pts, r = 0) => ({ t: 'p', pts, r }), L: (x1, y1, x2, y2, r) => ({ t: 'l', x1, y1, x2, y2, r }),
  U: (k, ...a) => ({ t: 'u', k, a }), X: (a, b) => ({ t: 'x', a, b }), D: (a, b) => ({ t: 'd', a, b }),
  H: (y, below = true) => ({ t: 'h', y, below }), V: (x, right = true) => ({ t: 'v', x, right }),

function smin(a, b, k) { if (k <= 0) return Math.min(a, b); const h = Math.max(k - Math.abs(a - b), 0) / k; return Math.min(a, b) - h * h * k / 4; }

function sdf(p, x, y) {
  switch (p.t) {
    case 'c': return Math.hypot(x - p.x, y - p.y) - p.r;
    case 'e': { const c = Math.cos(-p.rot), s = Math.sin(-p.rot), qx = (x - p.x) * c - (y - p.y) * s, qy = (x - p.x) * s + (y - p.y) * c; return (Math.hypot(qx / p.rx, qy / p.ry) - 1) * Math.min(p.rx, p.ry); }
    case 'r': {
      const R = Array.isArray(p.r) ? p.r : [p.r, p.r, p.r, p.r], bx = p.w / 2, by = p.h / 2, qx0 = x - p.x - bx, qy0 = y - p.y - by;

      const qx = Math.abs(qx0) - bx + r, qy = Math.abs(qy0) - by + r;

        d = Math.min(d, sdSeg(x, y, v[j][0], v[j][1], v[i][0], v[i][1]));
        if ((v[i][1] > y) !== (v[j][1] > y) && x < (v[j][0] - v[i][0]) * (y - v[i][1]) / (v[j][1] - v[i][1]) + v[i][0]) sgn = -sgn;

function quiltLines(x0, y0, x1, y1, gap, col) {        // a diamond quilting grid clipped to a box (inches)

    const pts = [[x0, d * x0 + c], [x1, d * x1 + c], [(y0 - c) / d, y0], [(y1 - c) / d, y1]].filter(([x, y]) => x >= x0 - 1e-6 && x <= x1 + 1e-6 && y >= y0 - 1e-6 && y <= y1 + 1e-6);
    const u = pts.filter((p, i) => pts.findIndex(q => Math.hypot(q[0] - p[0], q[1] - p[1]) < 1e-6) === i);
    if (u.length >= 2 && Math.hypot(u[0][0] - u[1][0], u[0][1] - u[1][1]) > 0.4) out.push({ pts: [u[0], u[1]], col });
  }

}

    card.appendChild(el('h3', '', p.name)); card.appendChild(el('div', 'lvl', lvlOf(p))); card.appendChild(el('div', 'blurb', p.blurb));
    card.appendChild(el('div', 'price', (p.k === DEAL ? '<s>' + p.price + '</s>' : '') + '🪙 ' + priceOf(p.k) + ' Stitch Coins'));
    const r = p.revs[0]; card.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`));
    const row = el('div', 'row'), inCart = S.cart.includes(p.k);
    const add = el('button', 'add' + (inCart ? ' in' : ''), inCart ? '✅ IN CART' : '🛒 ADD TO CART'); add.onclick = () => toggleCart(p.k);
    const rb = el('button', 'revbtn', '⭐ ' + avg(p)); rb.onclick = () => openReviews(p.k);
    row.append(add, rb); card.appendChild(row); grid.appendChild(card);
  }
}
function toggleCart(k) {
  const i = S.cart.indexOf(k);
  if (i >= 0) { S.cart.splice(i, 1); sfx.click(); say('Okay! I took it out of your cart.'); }
  else { S.cart.push(k); sfx.add(); say(k === 'robo-plush' ? 'B33P! The Robo Plushie! My big brother! Best choice ever!' : k === 'mega' ? 'WOW! The whole book! Every single pattern!' : P(k).cat === 'nosew' ? 'B33P! You can make this one yourself, today!' : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {
  const p = P(k), box = $('revIn'); box.innerHTML = '';
  box.appendChild(el('div', 'h2', '⭐ Reviews: ' + p.name));
  p.revs.forEach(r => box.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`)));
  const c = el('button', 'bigbtn', '👍 OK!'); c.style.marginTop = '10px'; c.style.width = '100%'; c.onclick = closeReviews; box.appendChild(c);
  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what my friends say!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) {
    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  for (const k of S.cart) {
    if (!P(k)) continue;
    const line = el('div', 'line'); line.appendChild(thumbCanvas(k, 150, 100));
    line.appendChild(el('div', 'nm', P(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '<small>' + lvlOf(P(k)) + '</small>')));
    line.appendChild(el('div', 'pr', '🪙 ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); L.appendChild(line);
  }
  const t = el('div', 'total');
  const g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'B33P! Gift wrap! I will add pretty wrapping paper to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 🪙 ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  S.cart = S.cart.filter(k => P(k));
  const tot = cartTotal();
  if (!S.cart.length) return;
  if (tot > S.bucks) { sfx.glitch(); say('B33P! Not enough Stitch Coins! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.bucks -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreBucks() {
  S.bucks += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['B33P! Here are 500 more Stitch Coins!', 'Ka-ching! 500 Stitch Coins! Pretend money is the best!', 'B33P! I mean... BEEP! More Stitch Coins for Ben!']));
}
// 🧵 delivery: Robo 2.0's sewing machine STITCHES your package shut
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.stitch(); say('Stitching up your package... B33P B33P!'); requestAnimationFrame(shipLoop); }
function drawMachine(x, y, t) {                         // a pink sewing machine; the needle goes up and down
  rr(x - 20, y + 150, 460, 34, 12, '#7b1fa2');            // base
  rr(x, y, 400, 60, 30, '#f06292', '#ad1457', 4); rr(x + 320, y + 20, 80, 150, 24, '#f06292', '#ad1457', 4); rr(x, y + 20, 70, 110, 20, '#f06292', '#ad1457', 4);
  circ(x + 360, y + 60, 26, '#fce4ec', '#ad1457', 4); circ(x + 360, y + 60, 8, '#ad1457');
  rr(x + 120, y - 34, 26, 34, 6, '#ffd740', '#c79100', 3); rr(x + 116, y - 40, 34, 8, 3, '#ffb300'); rr(x + 116, y - 2, 34, 6, 3, '#ffb300');   // a spool of thread
  ctx.strokeStyle = '#ff4081'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x + 133, y - 20); ctx.quadraticCurveTo(x + 90, y + 10, x + 40, y + 70); ctx.stroke();
  const ny = Math.abs(Math.sin(t * 0.5)) * 26;
  rr(x + 32, y + 120, 18, 14, 4, '#b0bec5'); line(x + 41, y + 126, x + 41, y + 146 - 26 + ny, '#90a4ae', 4);
  txt('ROBO 2.0', x + 200, y + 30, 26, '#fff'); txt('STITCH-O-MATIC', x + 200, y + 52, 13, '#fce4ec');
}
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#4a148c'); g.addColorStop(1, '#ad1457'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 30; i++) circ((i * 173 + shipT * (i % 3 + 1) * 0.4) % 960, (i * 97) % 240, 2 + i % 3, 'rgba(255,255,255,.5)');
    ctx.fillStyle = '#6a1b9a'; ctx.fillRect(0, 440, 960, 100);
    const done = shipT > 150, mx = 300, my = 300;
    // the package slides under the needle and gets a stitched seam
    const px = done ? 420 : 120 + Math.min(1, shipT / 140) * 300, py = 370;
    for (let i = 0; i < Math.min(shipCount, 4); i++) { rr(px - 60 - i * 8, py - 60 - i * 34, 130, 40, 6, '#d7a86e', '#6d4c41', 3); }
    const sx0 = px - 60, sx1 = Math.min(px + 70, mx + 41);
    ctx.save(); ctx.setLineDash([10, 8]); ctx.strokeStyle = '#ff4081'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(sx0, py - 40); ctx.lineTo(Math.max(sx0, done ? px + 70 : sx1), py - 40); ctx.stroke(); ctx.restore();
    drawMachine(mx, my - 100, done ? 0 : shipT);
    ctx.save(); ctx.translate(820, 440); ctx.scale(3.4, 3.4); ctx.translate(-15, -40); drawBot(PAL_R2); ctx.restore();
    if (!done) { txt('Stitching' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 60, 48, '#fff'); rr(280, 96, 400, 22, 11, 'rgba(255,255,255,.3)'); rr(280, 96, Math.max(22, 400 * Math.min(1, shipT / 150)), 22, 11, '#69f0ae'); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); rr(480 + Math.cos(a) * d, 120 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.5, 12, 8, 2, ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff'][i % 4]); }
      txt('ORDER CONFIRMED!', 480, 75, 66, '#1a0033'); txt('ORDER CONFIRMED!', 480, 70, 66, '#69f0ae');
      txt(shipCount + (shipCount === 1 ? ' pattern is' : ' patterns are') + ' in MY ORDERS, ready to print!', 480, 130, 28, '#fff');
    }
  } finally { ctx = old; }
  if (shipT > 150 && !shipDone) { shipDone = true; sfx.cash(); say('ORDER CONFIRMED! B33P! Tap PRINT on the patterns you want!'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy a pattern, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    if (!P(o.k)) continue;
    const line = el('div', 'line'); line.appendChild(thumbCanvas(o.k, 150, 100));
    line.appendChild(el('div', 'nm', P(o.k).name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${P(o.k).mega ? 'a whole book' : lvlOf(P(o.k))}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
function pageGift(name) {                               // wrapping paper (no emoji: spools, needles, buttons and Robo 2.0)
  ctx.fillStyle = '#fce4ec'; ctx.fillRect(40, 40, 770, 1020);
  for (let r = 0; r < 9; r++) for (let c = 0; c < 6; c++) { const x = 100 + c * 130 + (r % 2) * 65, y = 110 + r * 112;
    if ((r + c) % 3 === 0) { rr(x - 16, y - 22, 32, 44, 6, '#ffd740', '#c79100', 2); rr(x - 20, y - 26, 40, 8, 3, '#ffb300'); rr(x - 20, y + 18, 40, 8, 3, '#ffb300'); }
    else if ((r + c) % 3 === 1) { circ(x, y, 18, '#ab47bc'); for (const [dx, dy] of [[-6, -6], [6, -6], [-6, 6], [6, 6]]) circ(x + dx, y + dy, 3, '#fce4ec'); }
    else { ctx.save(); ctx.translate(x - 15, y - 20); ctx.scale(1.1, 1.1); drawBot(PAL_R2); ctx.restore(); } }
  rr(200, 960, 450, 60, 20, '#fff'); txt('A sewing pattern for you: ' + name, 425, 990, 18, '#ad1457', 'center', true, 430);
}
// 🖨️ print preview: nothing prints until Ben taps PRINT. Pages are drawn a few at a time so the screen never freezes.
function openPrint(list) {
  closePrint(true);
  list = list.filter(o => P(o.k)); if (!list.length) return;
  const name = list.length === 1 ? P(list[0].k).name : 'All my orders';
  const box = printBox = el('div'); box.id = 'printBox'; box.done = false;
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', '⏳ Getting pages ready...');
  pr.disabled = true; pr.style.opacity = '.6';
  back.onclick = () => closePrint();
  pr.onclick = () => { if (!box.done) return; sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('sewingShop'); say('B33P! Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, pr); box.appendChild(bar);
  const tip = el('div', 'pbTip', '🧵 ' + name + '  •  Print at 100% / Actual size, and turn on color!'); box.appendChild(tip);
  document.body.appendChild(box);
  sfx.click(); say(list.length === 1 && list[0].k === 'robo-plush' ? 'That is the Robo Plushie pattern! Tap PRINT when it is ready!' : 'Getting your pattern ready! Then tap PRINT if you want it on paper!');
  const fns = []; let li = 0, k = 0;
  const step = () => {
    if (printBox !== box) return;                         // Ben went back
    if (li < list.length) { const o = list[li++], p = P(o.k); if (o.gift) fns.push(() => pageGift(p.name)); p.pages.forEach(f => fns.push(f)); tip.textContent = '🧵 ' + name + '  •  getting pages ready... ' + fns.length; return setTimeout(step, 0); }
    const sc = fns.length > 24 ? 1 : fns.length > 8 ? 1.5 : 2;
    for (let n = 0; n < 2 && k < fns.length; n++, k++) { const img = new Image(); img.className = 'pbPage'; img.alt = name + ' page ' + (k + 1); img.src = makePage(fns[k], sc).toDataURL('image/png'); box.appendChild(img); }
    pr.textContent = '⏳ ' + k + ' of ' + fns.length + ' pages...';
    if (k < fns.length) return setTimeout(step, 0);
    box.done = true; pr.disabled = false; pr.style.opacity = ''; pr.textContent = fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT';
    tip.textContent = '🧵 ' + name + '  •  ' + fns.length + ' pages  •  Print at 100% / Actual size, and turn on color!';
  };
  setTimeout(step, 30);
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT >= 0 && shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox && printBox.done) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! B33P!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreBucks;
$('shipGo').onclick = closeShip;
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || (CAT !== 'all' && P(DEAL).cat !== CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + P(DEAL).name + '! Half price! B33P!');
};
$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'B33P! Welcome back, Ben! Your patterns are in MY ORDERS.' : 'B33P! Welcome to my Sewing Pattern Shop, Ben! Real plushie patterns!'; }, 50);
