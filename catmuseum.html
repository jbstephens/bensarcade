<style>

  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fff3e0; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }

  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }

<canvas id="game" width="960" height="540"></canvas>
<script>
// 🐱 THE CAT MUSEUM — Ben's idea! "A museum full of cats, with cool print shops."
// Tap a cat to see it up close (and make it MEOW, PURR, POUNCE...), collect a stamp for every cat in your Museum Passport,
// then visit 🖨️ THE CAT PRINT SHOP to print free paper gifts: posters, masks, cat ears, finger puppets and more.
// Save: localStorage.catMuseum = { seen: {} }. Trophy 'catMuseum' when every cat has been visited.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { seen: {} };
try { const s = JSON.parse(localStorage.getItem('catMuseum') || 'null'); if (s && s.seen) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('catMuseum', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0;
// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;

</script>
<script>
// ---------- colors + the shared helpers (from the Claude Museum) ----------
const OR = '#d97757', OR2 = '#e8956f', OR3 = '#b85c3c', CREAM = '#fbe3d3', DARK = '#3d2b23', GOLD = '#ffc94d';
function sparkle(cx, cy, r, col, rot = 0, lw) {               // the Claude sparkle: 8 rounded rays
  ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = lw || Math.max(1.5, r * 0.28); ctx.beginPath();
  for (let i = 0; i < 8; i++) { const a = rot + i * Math.PI / 4, q = i % 2 ? 0.7 : 1; ctx.moveTo(cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.25); ctx.lineTo(cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q); }
  ctx.stroke(); ctx.restore();
}
function eyes(cx, cy, s, gap = 12, size = 6, col = DARK) {
  const bl = !PRINTING && frame % 220 < 6 ? 0.15 : 1;
  for (const d of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx + d * gap * s, cy, size * s * 0.8, size * s * bl, 0, 0, 7); ctx.fill(); if (bl > 0.5) circle(cx + d * gap * s + 1.5 * s, cy - 2 * s, size * 0.35 * s, '#fff'); }
}
function smile(cx, cy, s, w = 7, col = DARK, open = 0) {
  ctx.strokeStyle = col; ctx.lineWidth = 2.2 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, w * s, 0.2, Math.PI - 0.2); ctx.stroke(); ctx.lineCap = 'butt';
  if (open > 0) { ctx.fillStyle = '#7b2d1e'; ctx.beginPath(); ctx.ellipse(cx, cy + w * 0.6 * s, w * 0.8 * s, w * 0.7 * open * s, 0, 0, 7); ctx.fill(); }
}
function blush(cx, cy, s, gap = 18) { circle(cx - gap * s, cy, 4 * s, 'rgba(255,128,128,.45)'); circle(cx + gap * s, cy, 4 * s, 'rgba(255,128,128,.45)'); }
function robot(cx, by, s, pal) {                               // a Robo Jump-style body
  const w = 30 * s, h = 40 * s, x = cx - w / 2, y = by - h;
  ctx.fillStyle = pal[4]; ctx.fillRect(x + 4 * s, y + h - 7 * s, 8 * s, 7 * s); ctx.fillRect(x + w - 12 * s, y + h - 7 * s, 8 * s, 7 * s);
  rr(x + 2 * s, y + h * 0.5, w - 4 * s, h * 0.4, 6 * s, pal[1]);
  rr(x - 5 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal[5]); rr(x + w - 1 * s, y + h * 0.3 - 3 * s, 6 * s, 9 * s, 3 * s, pal[5]);
  rr(x - 2 * s, y, w + 4 * s, h * 0.55, 12 * s, pal[0]); rr(x + 2 * s, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, pal[2]);
  return { x, y, w, h, ey: y + h * 0.27 };
}
let PRINTING = false;
// ---------- 🐱 THE CARTOON CAT (one drawing, lots of looks) ----------
// o: fur, belly, dark (stripes/points), ear (inner ear), eye, line, wh (whiskers), stripes, dots, shine, collar, headband, fluffy, bald, points, sleep
function ell(x, y, rx, ry, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), 0, 0, 7); ctx.fill(); }
function catHead(cx, hy, s, o) {
  const big = o.bald ? 1.35 : 1, earC = o.points ? o.dark : o.fur;
  for (const d of [-1, 1]) {                                   // ears
    tri(cx + d * 33 * s, hy - 6 * s, cx + d * 6 * s, hy - 25 * s, cx + d * (26 + 6 * big) * s, hy - (24 + 22 * big) * s, earC);
    tri(cx + d * 28 * s, hy - 10 * s, cx + d * 13 * s, hy - 22 * s, cx + d * (25 + 5 * big) * s, hy - (24 + 15 * big) * s, o.ear);
    if (o.fluffy) tri(cx + d * 29 * s, hy - 42 * s, cx + d * 35 * s, hy - 42 * s, cx + d * 33 * s, hy - 53 * s, o.dark);
  }
  if (o.fluffy) for (let k = 0; k < 7; k++) { const an = 0.15 + k * 0.42; for (const d of [-1, 1]) circle(cx + d * Math.cos(an) * 34 * s, hy + Math.sin(an) * 26 * s, 9 * s, o.fur); }
  ell(cx, hy, 34 * s, 28 * s, o.fur);
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, hy, 34 * s, 28 * s, 0, 0, 7); ctx.clip();
  if (o.points) { ell(cx, hy + 9 * s, 21 * s, 19 * s, o.dark); }
  else ell(cx, hy + 12 * s, 19 * s, 12 * s, o.belly);          // light muzzle
  if (o.stripes) { ctx.strokeStyle = o.dark; ctx.lineWidth = 4 * s; ctx.lineCap = 'round'; ctx.beginPath();
    for (const k of [-9, 0, 9]) { ctx.moveTo(cx + k * s, hy - 27 * s); ctx.lineTo(cx + k * 0.8 * s, hy - 16 * s); }
    for (const d of [-1, 1]) for (const k of [0, 8]) { ctx.moveTo(cx + d * 35 * s, hy + k * s - 2 * s); ctx.lineTo(cx + d * 25 * s, hy + k * s); }
    ctx.stroke(); ctx.lineCap = 'butt'; }
  if (o.fewStripes) { ctx.strokeStyle = o.dark; ctx.lineWidth = 3 * s; ctx.lineCap = 'round'; ctx.beginPath(); for (const k of [-6, 6]) { ctx.moveTo(cx + k * s, hy - 27 * s); ctx.lineTo(cx + k * 0.8 * s, hy - 19 * s); } ctx.stroke(); ctx.lineCap = 'butt'; }
  if (o.dots) for (const [x, y, r] of [[-20, -16, 4], [18, -18, 3.5], [-4, -22, 3], [26, -4, 3.5], [-27, 2, 3], [10, -12, 2.5]]) circle(cx + x * s, hy + y * s, r * s, o.dark);
  if (o.bald) { ctx.strokeStyle = 'rgba(150,90,80,.45)'; ctx.lineWidth = 1.8 * s; ctx.beginPath(); for (const k of [0, 5, 10]) { ctx.moveTo(cx - 10 * s, hy - 22 * s + k * s); ctx.quadraticCurveTo(cx, hy - 25 * s + k * s, cx + 10 * s, hy - 22 * s + k * s); } ctx.stroke(); }
  if (o.shine) { ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 4 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, hy, 27 * s, Math.PI * 1.15, Math.PI * 1.4); ctx.stroke(); ctx.lineCap = 'butt'; }
  if (o.headband) { ctx.fillStyle = '#e53935'; ctx.fillRect(cx - 40 * s, hy - 20 * s, 80 * s, 9 * s); ctx.fillStyle = '#ff8a80'; ctx.fillRect(cx - 40 * s, hy - 18 * s, 80 * s, 2 * s); }
  ctx.restore();
  if (o.headband && !o.noTail) { const wv = PRINTING ? 0 : Math.sin(frame * 0.12) * 4 * s; ctx.fillStyle = '#e53935'; ctx.beginPath(); ctx.moveTo(cx + 30 * s, hy - 18 * s); ctx.quadraticCurveTo(cx + 46 * s, hy - 22 * s + wv, cx + 58 * s, hy - 30 * s + wv); ctx.lineTo(cx + 56 * s, hy - 22 * s + wv); ctx.quadraticCurveTo(cx + 46 * s, hy - 12 * s, cx + 32 * s, hy - 11 * s); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 30 * s, hy - 14 * s); ctx.quadraticCurveTo(cx + 44 * s, hy - 8 * s - wv, cx + 54 * s, hy - 6 * s - wv); ctx.lineTo(cx + 50 * s, hy - 1 * s - wv); ctx.quadraticCurveTo(cx + 42 * s, hy - 4 * s, cx + 30 * s, hy - 10 * s); ctx.fill(); }
  const bl = o.sleep ? 0 : (!PRINTING && (frame + (o.seed || 0) * 37) % 230 < 6) ? 0.15 : 1;
  for (const d of [-1, 1]) { const ex = cx + d * 13 * s, ey = hy - 3 * s;       // eyes
    if (bl < 0.5) { ctx.strokeStyle = o.line; ctx.lineWidth = 2.5 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(ex, ey - 2 * s, 6 * s, 0.3, Math.PI - 0.3); ctx.stroke(); ctx.lineCap = 'butt'; continue; }
    ell(ex, ey, 8.5 * s, 9.5 * s, o.line); ell(ex, ey, 7.5 * s, 8.5 * s, o.eye); ell(ex, ey + 0.5 * s, 3 * s, 6.5 * s, '#1a1a1a'); circle(ex + 2.5 * s, ey - 3.5 * s, 2.4 * s, '#fff'); circle(ex - 2.5 * s, ey + 3 * s, 1.1 * s, '#fff'); }
  tri(cx - 4.5 * s, hy + 7 * s, cx + 4.5 * s, hy + 7 * s, cx, hy + 12 * s, o.nose || '#ff8fa3');
  ctx.strokeStyle = o.line; ctx.lineWidth = 1.8 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, hy + 12 * s); ctx.lineTo(cx, hy + 14 * s);
  ctx.arc(cx - 4 * s, hy + 14 * s, 4 * s, 0, Math.PI * 0.85); ctx.moveTo(cx + 8 * s, hy + 14 * s); ctx.arc(cx + 4 * s, hy + 14 * s, 4 * s, 0, Math.PI * 0.85); ctx.stroke();
  ctx.strokeStyle = o.wh || '#5d4037'; ctx.lineWidth = 1.4 * s; ctx.beginPath();
  for (const d of [-1, 1]) for (const k of [-4, 0, 4]) { ctx.moveTo(cx + d * 17 * s, hy + 9 * s + k * 0.4 * s); ctx.lineTo(cx + d * 46 * s, hy + 6 * s + k * s); }
  ctx.stroke(); ctx.lineCap = 'butt';
  if (!o.points) blush(cx, hy + 9 * s, s, 22);
}
function cat(cx, cy, s, o) {
  const tw = o.fluffy ? 15 : 9, wag = PRINTING ? 0 : Math.sin(frame * 0.07 + (o.seed || 0)) * 5 * s;   // tail
  const tail = () => { ctx.beginPath(); ctx.moveTo(cx + 20 * s, cy + 44 * s); ctx.bezierCurveTo(cx + 54 * s, cy + 48 * s, cx + 60 * s, cy + 14 * s, cx + 46 * s + wag, cy - 4 * s); };
  ctx.lineCap = 'round'; ctx.strokeStyle = o.points ? o.dark : o.fur; ctx.lineWidth = tw * s; tail(); ctx.stroke();
  if (o.stripes) { ctx.strokeStyle = o.dark; ctx.setLineDash([4 * s, 6 * s]); ctx.lineWidth = tw * s; ctx.lineCap = 'butt'; tail(); ctx.stroke(); ctx.setLineDash([]); }
  ctx.lineCap = 'butt';
  ell(cx, cy + 24 * s, 30 * s, 27 * s, o.fur);                  // body
  ctx.save(); ctx.beginPath(); ctx.ellipse(cx, cy + 24 * s, 30 * s, 27 * s, 0, 0, 7); ctx.clip();
  ell(cx, cy + 30 * s, 16 * s, 20 * s, o.belly);
  if (o.stripes) { ctx.strokeStyle = o.dark; ctx.lineWidth = 4.5 * s; ctx.beginPath(); for (const d of [-1, 1]) for (const k of [0, 13, 26]) { ctx.moveTo(cx + d * 32 * s, cy + 8 * s + k * s); ctx.quadraticCurveTo(cx + d * 24 * s, cy + 10 * s + k * s, cx + d * 18 * s, cy + 16 * s + k * s); } ctx.stroke(); }
  if (o.dots) for (const [x, y, r] of [[-20, 14, 5], [19, 10, 4.5], [-24, 32, 4], [22, 30, 5], [-8, 42, 3.5], [10, 44, 4], [0, 22, 3.5], [-14, 24, 3], [14, 20, 3]]) circle(cx + x * s, cy + y * s, r * s, o.dark);
  if (o.bald) { ctx.strokeStyle = 'rgba(150,90,80,.4)'; ctx.lineWidth = 1.6 * s; ctx.beginPath(); for (const k of [0, 6]) { ctx.moveTo(cx - 14 * s, cy + 6 * s + k * s); ctx.quadraticCurveTo(cx, cy + 10 * s + k * s, cx + 14 * s, cy + 6 * s + k * s); } ctx.stroke(); }
  ctx.restore();
  if (o.fluffy) for (let k = 0; k < 5; k++) circle(cx - 16 * s + k * 8 * s, cy + 12 * s + (k % 2) * 3 * s, 8 * s, o.belly);   // fluffy chest ruff
  for (const d of [-1, 1]) { const px = cx + d * 12 * s; ell(px, cy + 48 * s, 10 * s, 6.5 * s, o.points ? o.dark : o.fur); ctx.strokeStyle = o.line; ctx.lineWidth = 1.2 * s; ctx.beginPath(); for (const k of [-3, 3]) { ctx.moveTo(px + k * s, cy + 45 * s); ctx.lineTo(px + k * s, cy + 50 * s); } ctx.stroke(); }
  catHead(cx, cy - 16 * s, s, o);
  if (o.collar) { rr(cx - 19 * s, cy + 9 * s, 38 * s, 6 * s, 3 * s, '#ff6fa8'); circle(cx, cy + 19 * s, 5 * s, GOLD); ctx.fillStyle = '#8d6e00'; ctx.fillRect(cx - 3 * s, cy + 19 * s, 6 * s, 1.2 * s); circle(cx, cy + 22 * s, 1.2 * s, '#8d6e00'); }
}
// move/squash a cat around its feet while it does its thing
function pose(cx, cy, s, dy, sx, sy, fn) { ctx.save(); ctx.translate(cx, cy + 54 * s + dy); ctx.scale(sx, sy); ctx.translate(-cx, -(cy + 54 * s)); fn(); ctx.restore(); }
</script>
<script>
// ---------- THE 12 CATS ----------
const LOOK = {
  sammy: { fur: '#8d6e63', dark: '#4e342e', belly: '#e2c8a4', ear: '#ffb3c6', eye: '#e0a040', line: '#3e2723', stripes: true, seed: 1 },
  rocky: { fur: '#a3a9b2', dark: '#646b75', belly: '#eceff3', ear: '#ffb3c6', eye: '#ffc93c', line: '#4a5059', stripes: true, seed: 2 },
  mimo: { fur: '#1f1f28', dark: '#121218', belly: '#2c2c38', ear: '#ff9fbf', eye: '#8dff4a', line: '#5a5a70', wh: '#cfd8dc', shine: true, collar: true, seed: 3 },
  tiger: { fur: '#a07856', dark: '#4a3020', belly: '#ecd3ad', ear: '#ffb3c6', eye: '#5ad15a', line: '#3e2a22', dots: true, fewStripes: true, seed: 4 },
  ninja: { fur: '#2e2e36', dark: '#1a1a20', belly: '#45454f', ear: '#ff9fbf', eye: '#ffd600', line: '#616170', wh: '#cfd8dc', headband: true, seed: 5 },
  charlie: { fur: '#ff9800', dark: '#e65100', belly: '#ffe0b2', ear: '#ffb3c6', eye: '#66bb6a', line: '#6d3a00', stripes: true, seed: 6 },
  august: { fur: '#9e9e9e', dark: '#616161', belly: '#eeeeee', ear: '#ffb3c6', eye: '#4fc3f7', line: '#424242', seed: 7 },
  coon: { fur: '#9c6b3f', dark: '#5d3a1f', belly: '#f3e0c4', ear: '#ffb3c6', eye: '#c0ca33', line: '#3e2723', stripes: true, fluffy: true, seed: 8 },
  sphynx: { fur: '#f2c4b0', dark: '#d9a08a', belly: '#f8d7c8', ear: '#ff9fb0', eye: '#7cb342', line: '#8d5a4a', bald: true, seed: 9 },
  siamese: { fur: '#f5ead6', dark: '#5d4037', belly: '#fffaf0', ear: '#a1887f', eye: '#42a5f5', line: '#3e2723', wh: '#d7ccc8', points: true, seed: 10 },
};
function porthole(cx, cy, s, fn) {                     // Sparks's big round window
  circle(cx, cy + 4 * s, 66 * s, '#b3e5fc'); ctx.save(); ctx.beginPath(); ctx.arc(cx, cy + 4 * s, 66 * s, 0, 7); ctx.clip(); fn(); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(cx - 50 * s, cy - 50 * s, 14 * s, 40 * s); ctx.restore();
  ctx.strokeStyle = '#263238'; ctx.lineWidth = 10 * s; ctx.beginPath(); ctx.arc(cx, cy + 4 * s, 66 * s, 0, 7); ctx.stroke(); ctx.strokeStyle = '#ffd54f'; ctx.lineWidth = 4 * s; ctx.beginPath(); ctx.arc(cx, cy + 4 * s, 72 * s, 0, 7); ctx.stroke();
  for (let k = 0; k < 8; k++) circle(cx + Math.cos(k * 0.785) * 66 * s, cy + 4 * s + Math.sin(k * 0.785) * 66 * s, 2.5 * s, '#90a4ae');
}
const hop = a => a > 0 ? Math.abs(Math.sin(a * Math.PI * 3)) : 0;
// each: [id, name, emoji, action button, where it was "found", fun facts, draw(cx, cy, s, a)]  (a = 0..1 while it does its thing)
const CHARS = [
  ['sammy', 'Sammy', '🐱', 'POUNCE!', 'Robo Jump 8 (Sammy\'s Living Room)', ['Sammy is Ben\'s real brown tabby cat!', 'In Robo Jump 8, Robo frees Sammy from a cat carrier. Sammy shouts "Sweet freedom!"', 'Then Sammy teaches Robo the CAT POUNCE!'],
    (cx, cy, s, a) => { const j = a > 0 ? Math.sin(Math.min(1, a * 2) * Math.PI) : 0; pose(cx, cy, s, -j * 60 * s, 1 - j * 0.1, 1 + j * 0.15, () => cat(cx, cy, s, LOOK.sammy));
      if (a > 0.05) { rr(cx - 80 * s, cy - 118 * s, 160 * s, 32 * s, 12 * s, '#fff'); fit('Sweet freedom!', cx, cy - 96 * s, 17 * s, 150 * s, '#5d4037', 'center', false); } }],
  ['rocky', 'Rocky', '🐾', 'PLAY!', 'Rocky\'s Outdoor Fun', ['Rocky is a gray tabby with darker gray stripes.', 'Rocky LOVES playing outdoors!', 'Rocky\'s best friend is Mimo. They boop noses and have PLAY TIME!'],
    (cx, cy, s, a) => { for (let k = 0; k < 7; k++) tri(cx - 60 * s + k * 20 * s, cy + 56 * s, cx - 52 * s + k * 20 * s, cy + 56 * s, cx - 56 * s + k * 20 * s, cy + 40 * s, '#66bb6a');
