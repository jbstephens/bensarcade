<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🍳 The Game Factory Cookbook</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #fff1d6 0 36px, #ffe6bd 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead h1 { margin: 0; font-size: clamp(26px, 4.6vw, 52px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff8a1f; letter-spacing: 2px; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .thumb { position: relative; background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #e07b1a; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 10px; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; line-height: 1.15; }
  .thumb .made { position: absolute; top: -10px; right: -10px; background: #8ef08e; border: 4px solid #333; border-radius: 14px;
    font-size: 16px; font-weight: bold; padding: 2px 7px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  /* ---------- page view ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #e07b1a; }
  #paper svg [data-ing] { cursor: pointer; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #shopPick { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; }
  .b-all { background: #c3a6ff; }
  .b-made { background: #ffe066; font-size: 22px; }
  .b-made.on { background: #8ef08e; }
  .b-star { background: #fff; font-size: 26px; }
  .b-star.on { background: #ffd60a; }
  .b-shop { background: #ffb347; }
  .b-shop.on { background: #8ef08e; }
  .b-pick { background: #fff; font-size: 15px; min-height: 48px; padding: 4px; line-height: 1.1; }
  .b-pick.on { background: #8ef08e; }
  .five { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .five .btn { font-size: 18px; padding: 4px 2px; }
  .b-scale { background: #fff; font-size: 18px; } .b-scale.on { background: #7fdbff; }
  #mathLine { font-size: 18px; text-align: center; background: #eaf7ff; border: 3px dashed #1e88e5; border-radius: 12px; padding: 6px; margin-top: 8px; }
  .mode { background: #eceff1; font-size: 17px; } .mode.sel { background: #ffd740; outline: 4px solid #ff4081; outline-offset: 1px; }
  .fl { display: block; font-size: 18px; font-weight: bold; margin: 8px 2px 3px; }
  .fi { width: 100%; font: inherit; font-size: 20px; padding: 8px 10px; border: 4px solid #333; border-radius: 12px; background: #fff;
    user-select: text; -webkit-user-select: text; resize: vertical; }
  textarea.fi { min-height: 110px; line-height: 1.25; }
  .icons4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .icons4 .btn { background: #fff; padding: 2px; min-height: 64px; } .icons4 .btn.on { background: #8ef08e; }
  .icons4 svg { width: 100%; height: 52px; display: block; pointer-events: none; }
  #tPick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #tPick .btn { background: #fff; font-size: 22px; } #tPick .btn.on { background: #ffd740; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } #pTitle { font-size: 19px; } }
  /* ---------- PRINT: only the page (or the whole cookbook, one page each) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <h1>🍳 THE GAME FACTORY COOKBOOK</h1>
    <p>Real yummy food to make WITH a grown-up! Tap a recipe to open it.</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <div id="recipeBtns">
      <button class="btn b-made" id="bMade" style="width:100%">✅ We made it!</button>
      <div class="five" id="starBtns" style="margin-top:8px">
        <button class="btn b-star" data-star="1">1⭐</button>
        <button class="btn b-star" data-star="2">2⭐</button>
        <button class="btn b-star" data-star="3">3⭐</button>
        <button class="btn b-star" data-star="4">4⭐</button>
        <button class="btn b-star" data-star="5">5⭐</button>
      </div>
      <div class="three" id="scaleBtns" style="margin-top:8px">
        <button class="btn b-scale" data-scale="0.5">×½ Half</button>
        <button class="btn b-scale" data-scale="1">×1</button>
        <button class="btn b-scale" data-scale="2">×2 Double</button>
      </div>
      <div id="mathLine"></div>
      <button class="btn b-shop" id="bShopAdd" style="width:100%;margin-top:8px">🛒 Add to shopping list</button>
    </div>
    <div id="shopBtns">
      <div id="shopPick"></div>
      <div class="two" style="margin-top:8px">
        <button class="btn b-all" id="bShopAll">✅ Pick all</button>
        <button class="btn b-clear" id="bShopClear">🧽 Clear</button>
      </div>
    </div>
    <div id="formBox"></div>
    <div id="timerBox" class="hide">
      <div id="tPick"></div>
      <div class="three" style="margin-top:8px">
        <button class="btn b-print" id="tGo">▶️ Start</button>
        <button class="btn b-shop" id="tPause">⏸️ Pause</button>
        <button class="btn b-clear" id="tStop">⏹️ Stop</button>
      </div>
    </div>
    <button class="btn b-all hide" id="bBlank">🖍️ Print it BLANK (to fill in by hand)</button>
    <div class="two" id="modeBtns">
      <button class="btn mode" id="mBW">⚫ Black &amp; White</button>
      <button class="btn mode" id="mCol">🌈 Color</button>
    </div>
    <button class="btn b-print" id="bPrint">🖨️ Print this page</button>
    <button class="btn b-all" id="bPrintAll">📚 Print the whole cookbook</button>
    <div class="two">
      <button class="btn b-back" id="bPrev">⬅️ Last page</button>
      <button class="btn b-back" id="bNext">Next page ➡️</button>
    </div>
    <button class="btn b-back" id="bBack">🏠 Back to recipes</button>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🍳 THE GAME FACTORY COOKBOOK: real recipes Ben makes WITH a grown-up.
// Every page is a portrait letter page, viewBox 0 0 800 1000 (same as the Craft Room).
// Character art + helpers copied from the Craft Room / Art Gallery (gradients + highlights, no SVG filters).
// RULE: any knife / stove / oven / blender / hot / melt / bake / cook / skewer step is a 🧑 Grown-up job.
// =====================================================================
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
function svgWrap(body, ex) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs>' +
    '<rect x="0" y="0" width="800" height="1000" fill="#fff"/>' + body + '</svg>';
}
// =====================================================================
// CHARACTERS (copied from the Art Gallery; each drawn around 0,0, about 120 tall)
// =====================================================================
function robo(o) {
  o = o || {}; const H = o.head || '#f4f7fb', B = o.body || H, V = o.visor || '#1d2836', EY = o.eye || '#40c4ff',
    PD = o.pod || '#2979ff', RIM = o.rim || '#bff3ff', LG = o.legs || B; let s = '';
  if (o.morph === 'rocket') s += R(-30, 2, 22, 40, 9, vshade('#ff3d00'), OL, 2.5) + R(-28, 16, 18, 6, 2, '#ffd740', 0) + P('M-30 40 L-36 52 L-8 52 L-14 40 Z', '#bf360c', OL, 2) + jetFlame(-22, 52, 1.1, '#ffab40');
  if (o.boots) s += jetFlame(-9, 54, .9, o.flame) + jetFlame(9, 54, .9, o.flame);
  if (!o.noBody) {
    const arm = (x, y, rot) => R(x, y, 10, 25, 5, vshade(B), OL, 2.5, rot);
    if (o.arms === 'up') s += arm(-38, -4, -32) + arm(28, -4, 32) + C(-41, -7, 6, ball(PD), OL, 2) + C(41, -7, 6, ball(PD), OL, 2);
    else if (o.arms === 'wave') s += arm(-34, 14, 14) + arm(28, -4, 32) + C(-31, 39, 6, ball(PD), OL, 2) + C(41, -7, 6, ball(PD), OL, 2);
    else if (o.arms === 'fight') s += ['M-16 18 L-38 24 L-42 2', 'M16 18 L38 24 L42 2'].map(d => L(d, OL, 13) + L(d, B, 8.5)).join('') + C(-42, 0, 8, ball(PD), OL, 2.2) + C(42, 0, 8, ball(PD), OL, 2.2);
    else s += arm(-33, 14, 14) + arm(23, 14, -14) + C(-31, 39, 6, ball(PD), OL, 2) + C(31, 39, 6, ball(PD), OL, 2);

  s += P('M0 33 C-13 24 -10 13 0 19 C10 13 13 24 0 33 Z', ball('#ff1744'), OL, 1.6) + shine(-4, 20, 2.6, 1.6, -30, .8);
  const loop = sx => P('M0 0 L' + sx * 17 + ' -11 Q' + sx * 21 + ' 0 ' + sx * 17 + ' 11 Z', vshade('#ff4fa3'), OL, 2);
  return s + G(17, -38, 1, loop(-1) + loop(1) + L('M-2 3 L-7 14 M2 3 L7 14', '#ff4fa3', 3) + C(0, 0, 5, ball('#ff80bf'), OL, 1.6), 18);
}
function gearD(x, y, r, teeth) {             // a cog wheel outline
  const a = []; teeth = teeth || 8;
  for (let i = 0; i < teeth * 4; i++) { const ang = i * Math.PI * 2 / (teeth * 4), rr = (i % 4 < 2) ? r : r * .76; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
function clockFace(x, y, r, h1, h2) {         // little clock: face, ticks and two hands
  let s = C(x, y, r, rad([[0, '#ffffff'], [1, '#fff3c4']]), OL, Math.max(1, r * .18));
  for (let i = 0; i < 12; i++) { const a = i * Math.PI / 6; s += L('M' + n(x + Math.cos(a) * r * .72) + ' ' + n(y + Math.sin(a) * r * .72) + ' L' + n(x + Math.cos(a) * r * .86) + ' ' + n(y + Math.sin(a) * r * .86), OL, Math.max(.5, r * .08)); }
  const hand = (ang, len) => L('M' + n(x) + ' ' + n(y) + ' L' + n(x + Math.cos(ang) * r * len) + ' ' + n(y + Math.sin(ang) * r * len), OL, Math.max(.7, r * .13));
  return s + hand(h1 === undefined ? -1.9 : h1, .5) + hand(h2 === undefined ? -.4 : h2, .75) + C(x, y, r * .12, '#c62828', 0);
}

let COLOR = false, PRINTING = false;
function loadColor() { try { COLOR = localStorage.getItem('cookbookColor') === '1'; } catch (_) {} }
function setColor(c) { COLOR = c; try { localStorage.setItem('cookbookColor', c ? '1' : '0'); } catch (_) {} colorBtns(); blip(c ? 880 : 520, 0, .12); toast(c ? '🌈 Prints in COLOR' : '⚫ Prints in black & white'); }
function colorBtns() { if (!$('mBW')) return; $('mBW').classList.toggle('sel', !COLOR); $('mCol').classList.toggle('sel', COLOR); }
// =====================================================================
// SCREENS
// =====================================================================
const $ = id => document.getElementById(id);
function toast(msg) {
  if (typeof document === 'undefined') return;
  const t = $('toast'); if (!t) return;
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), 3000);
}
function renderSheet() { if ($('svgBox')) $('svgBox').innerHTML = buildSheet(cur); }
function setView(v) { view = v; $('gallery').classList.toggle('on', v === 'gallery'); $('view').classList.toggle('on', v === 'sheet'); }
function updateSide() {
  const p = SHEETS[cur], isR = p.kind === 'recipe';
  $('pTitle').textContent = p.name;
  $('pHelp').textContent = HELP[isR ? 'recipe' : p.kind === 'mine' ? 'mine' : p.id];
  $('recipeBtns').classList.toggle('hide', !isR); $('shopBtns').classList.toggle('hide', p.id !== 'shop');
  $('timerBox').classList.toggle('hide', p.id !== 'timer'); if (p.id === 'timer') updateTimerBtns();
  $('bBlank').classList.toggle('hide', p.id !== 'grandma' && p.id !== 'taste');
  $('bBlank').textContent = p.id === 'taste' ? '🖍️ Print a blank chart (stars to color)' : '🖍️ Print it BLANK (to fill in by hand)';
  colorBtns(); renderForm();
  if (isR) {
    const made = !!state.made[p.id], ys = state.stars[p.id] || 0;
    $('bMade').classList.toggle('on', made); $('bMade').textContent = made ? '✅ We made it! (tap to undo)' : '🍳 We made it!';
    document.querySelectorAll('.b-star').forEach(b => b.classList.toggle('on', +b.dataset.star <= ys && made));
    document.querySelectorAll('.b-scale').forEach(b => b.classList.toggle('on', +b.dataset.scale === SCALE));
    $('mathLine').textContent = '✖️ ' + mathLine(RECIPES[p.ri], SCALE);
    $('bShopAdd').classList.toggle('on', !!state.shop[p.id]); $('bShopAdd').textContent = state.shop[p.id] ? '🛒 On the shopping list ✓' : '🛒 Add to shopping list';
  }
  if (p.id === 'shop') {
    const box = $('shopPick'); box.innerHTML = '';
    RECIPES.forEach(r => { const b = document.createElement('button'); b.className = 'btn b-pick' + (state.shop[r.id] ? ' on' : '');
      b.textContent = (state.shop[r.id] ? '✅ ' : '') + r.emoji + ' ' + r.short;
      b.addEventListener('click', () => { toggleShop(r.id); blip(600); renderSheet(); updateSide(); }); box.appendChild(b); });
  }
}
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    if (k === 0 || secOf(p) !== secOf(SHEETS[k - 1])) {
      const h = document.createElement('div'); h.className = 'sec';
      h.innerHTML = '<span>' + SECS[secOf(p)] + '</span>';
      if (k === 0) { const b = document.createElement('button'); b.className = 'btn b-all'; b.textContent = '📚 Print the whole cookbook';
        b.addEventListener('click', printBook); h.appendChild(b); }
      g.appendChild(h);
    }
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    const made = p.kind === 'recipe' && state.made[p.id];
    d.innerHTML = thumbSVG(k) + '<b>' + esc(p.kind === 'recipe' ? RECIPES[p.ri].emoji + ' ' + p.thumb : p.thumb) + '</b>' +
      (made ? '<div class="made">✅' + (state.stars[p.id] ? ' ' + state.stars[p.id] + '⭐' : '') + '</div>' : '');
    d.addEventListener('click', () => { sel = k; openSheet(k); });
    g.appendChild(d);
  });
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openSheet(k) { cur = k; sel = k; endPrintAll(); renderSheet(); updateSide(); setView('sheet'); blip(660); }
function backToGallery() { endPrintAll(); renderGallery(); setView('gallery'); markSel(); }
function rebuildKeep() { const id = SHEETS[cur] && SHEETS[cur].id; buildSheets(); const k = idx(id); cur = sel = k < 0 ? 0 : k; }
function step(d) { openSheet((cur + d + SHEETS.length) % SHEETS.length); }
// =====================================================================
// PRINTING: only the page prints (see @media print). The whole cookbook = cover + every recipe + my own recipes
// (+ Grandma's recipe once it has a name) + kitchen rules. Prints use the ⚫ B&W / 🌈 Color choice.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function preparePrint(blank) { if (view !== 'sheet') openSheet(sel); endPrintAll(); BLANK = !!blank; PRINTING = true; $('svgBox').innerHTML = buildSheet(cur, true); }
function printPage(blank) { preparePrint(blank === true); doPrint(endPrintAll); }
const BOOK = () => ['cover'].concat(RECIPES.map(r => r.id), (state.mine || []).map(m => m.id), state.grandma && state.grandma.name ? ['grandma'] : [], ['rules']).map(idx);
function bookHTML() { return BOOK().map(i => buildSheet(i, true)).join(''); }
function prepareBook() { $('printAll').innerHTML = bookHTML(); document.body.classList.add('pAll'); PRINTING = true; }
function printBook() {
  prepareBook();
  document.body.classList.add('pAll');
  toast('🖨️ Printing the whole cookbook: ' + BOOK().length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
  if (PRINTING) { PRINTING = false; BLANK = false; if (view === 'sheet') renderSheet(); }
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (e.target && /^(INPUT|TEXTAREA)$/.test(e.target.tagName)) return;     // typing in a text box
  if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printPage(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printPage();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { step(1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { step(-1); e.preventDefault(); }
  }
}
function init() {
  loadState(); loadColor(); buildSheets(); renderGallery();
  $('tPick').innerHTML = [1, 2, 3, 5, 10, 15, 20, 30].map(m => '<button class="btn" data-m="' + m + '">' + m + ' min</button>').join('');
  $('tPick').querySelectorAll('.btn').forEach(b => b.addEventListener('click', () => timerSet(+b.dataset.m)));
  $('tGo').addEventListener('click', timerStart); $('tPause').addEventListener('click', timerPause); $('tStop').addEventListener('click', timerStop);
  document.querySelectorAll('.b-scale').forEach(b => b.addEventListener('click', () => { SCALE = +b.dataset.scale; blip(SCALE === 2 ? 880 : SCALE === 1 ? 660 : 520, 0, .1); renderSheet(); updateSide(); }));
  $('mBW').addEventListener('click', () => setColor(false)); $('mCol').addEventListener('click', () => setColor(true));
  $('bBlank').addEventListener('click', () => printPage(true));
  $('bMade').addEventListener('click', () => { const id = SHEETS[cur].id; setMade(id, !state.made[id]); updateSide(); });
  document.querySelectorAll('.b-star').forEach(b => b.addEventListener('click', () => { setStars(SHEETS[cur].id, +b.dataset.star); updateSide(); }));
  $('bShopAdd').addEventListener('click', () => { const id = SHEETS[cur].id; toggleShop(id); blip(600); toast(state.shop[id] ? '🛒 Added! Open the Shopping List page.' : '🛒 Taken off the list'); updateSide(); });
  $('bShopAll').addEventListener('click', () => { RECIPES.forEach(r => { state.shop[r.id] = 1; }); saveState(); renderSheet(); updateSide(); });
  $('bShopClear').addEventListener('click', () => { state.shop = {}; saveState(); renderSheet(); updateSide(); });
  $('bPrint').addEventListener('click', () => printPage());
  $('bPrintAll').addEventListener('click', printBook);
  $('bPrev').addEventListener('click', () => step(-1));
  $('bNext').addEventListener('click', () => step(1));
  $('bBack').addEventListener('click', backToGallery);
  // tap an ingredient on the card to tick it
  $('svgBox').addEventListener('click', e => {
    const rt = e.target && e.target.closest && e.target.closest('[data-rate]');
    if (rt && SHEETS[cur].id === 'taste') { const v = rt.getAttribute('data-rate'), c = v.lastIndexOf(':'); rate(v.slice(0, c), +v.slice(c + 1)); renderSheet(); return; }
    const g = e.target && e.target.closest && e.target.closest('[data-ing]'); if (!g || SHEETS[cur].kind !== 'recipe') return;
    toggleCheck(SHEETS[cur].id, g.getAttribute('data-ing')); blip(880, 0, .08); renderSheet();
  });
  window.addEventListener('afterprint', endPrintAll);
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
</body>
