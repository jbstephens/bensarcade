<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Robo Ruler</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0a1a3f; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #eef5ff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #dbe4f0; border-bottom: 2px solid #bfcde0; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #0091ea; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #0d47a1, #1565c0 55%, #00b8d4); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #0a1a3f; }
  #logo .big i { color: #ffd740; font-style: normal; }
  #logo .small { font-size: 15px; color: #b3e5fc; margin-top: 4px; }
  #logo .idea { font-size: 13px; color: #fff59d; margin-top: 3px; max-width: 250px; }
  /* 📏 timeline viewer */
  #lineBox { max-width: 980px; margin: 0 auto; text-align: center; }
  #lineCv { width: 100%; max-height: 44vh; object-fit: contain; border-radius: 18px; background: #0a1a3f; display: block; margin: 0 auto; }
  #lineSlider { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; border-radius: 17px; margin: 12px 0 6px; outline: none;
    background: repeating-linear-gradient(90deg, #ffd740 0 2px, #ffe57f 2px 26px); border: 3px solid #c79100; touch-action: none; }
  #lineSlider::-webkit-slider-thumb { -webkit-appearance: none; width: 54px; height: 54px; border-radius: 50%; background: #1565c0; border: 5px solid #fff; box-shadow: 0 3px 8px rgba(0,0,0,.4); cursor: pointer; }
  #lineSlider::-moz-range-thumb { width: 48px; height: 48px; border-radius: 50%; background: #1565c0; border: 5px solid #fff; }
  .lineRow { display: flex; gap: 10px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .lineInfo { flex: 1; min-width: 260px; background: #fff; border-radius: 16px; padding: 8px 14px; font-size: 19px; color: #0d2b6b; text-align: left; box-shadow: 0 3px 10px rgba(13,71,161,.15); }
  .lineInfo b { font-size: 24px; }
  /* name picker */
  .names { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 10px 0; }
  .names button { font-size: 22px; font-weight: 900; border: 0; border-radius: 14px; padding: 12px 18px; background: #e3f2fd; color: #0d47a1; box-shadow: 0 4px 0 #90caf9; }

  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #0a1a3f; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #ffd740; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #ffd740; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #ffd740; color: #4e2600; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #c79100; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fff8e1; color: #6d4c00; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #e3eefc; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #0d47a1; box-shadow: 0 4px 0 #90caf9; }
  #nav button.on { background: #1565c0; color: #fff; box-shadow: 0 4px 0 #0d47a1; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff1744; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c51162; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f48fb1; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(13,71,161,.18); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }
  .card.must { border-color: #ffc400; background: #fffdf0; }
  .card.sel { outline: 4px solid #00e676; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #edf4fd; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #0d2b6b; line-height: 1.1; }
  .card .blurb { font-size: 15px; color: #555; }
  .card .price { font-size: 22px; font-weight: 900; color: #00873e; margin: 4px 0; }
  .card .price s { color: #999; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: #ffc400; color: #4e2600; }
  .tag.new { background: #00c853; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #0d47a1; box-shadow: 0 4px 0 #90caf9; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #e3f2fd; color: #1565c0; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #1565c0; color: #fff; box-shadow: 0 4px 0 #0d47a1; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #edf4fd; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #1565c0; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #e3f2fd; box-shadow: 0 4px 0 #90caf9; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(13,71,161,.15); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #0d2b6b; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #00873e; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #1565c0; box-shadow: 0 5px 0 #0d47a1; }
  .bigbtn.green { background: #00c853; box-shadow: 0 5px 0 #00873e; }
  .bigbtn.blue { background: #2979ff; box-shadow: 0 5px 0 #1a4fb5; }
  .bigbtn.gray { background: #9e9e9e; box-shadow: 0 5px 0 #616161; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #0d2b6b; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #1565c0; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #0d47a1; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(10,26,63,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(10,26,63,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8f1fc; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8f1fc; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #1565c0; }
  #printBox .pbTip { font-size: 20px; color: #0d47a1; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<body>
<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
    <div id="url">🔒 <b>www.roboruler.shop</b></div>
  </div>
  <div id="head">
    <canvas id="helper" width="208" height="208"></canvas>
    <div id="logo"><div class="big">ROBO <i>RULER</i></div><div class="small">The shop ALL about Robo!</div><div class="idea">💡 Ben's idea: Robo Ruler, the shop all about Robo!</div></div>
    <div id="bubble">Beep boop! Welcome to Robo Ruler!</div>
    <div id="wallet"><div class="lbl">MY ROBO BOLTS</div><div class="amt" id="amt">1000</div><button id="moreBucks">🔩 Get more</button></div>
  </div>
  <div id="nav">
    <button id="tShop" class="on">🏬 SHOP</button>
    <button id="tCart">🛒 CART<span class="count" id="cCount">0</span></button>
    <button id="tOrders">📦 MY ORDERS</button>
    <button id="tLine">📏 TIMELINE</button>
    <button id="deal">🔥 Deal of the Day</button>
  </div>
  <div id="main"></div>
</div>
<div id="ship"><canvas id="shipCv" width="960" height="540"></canvas><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button></div>

<script>
// 📏 ROBO RULER: Ben's idea! The shop ALL about Robo. Buy paper Robo stuff with pretend Robo Bolts,
// then pick which orders to PRINT on your printer. Nothing prints by itself.
// Save: localStorage.roboRuler = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'roboRuler';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
const PAL_NEGA = { head: '#37474f', body: '#263238', visor: '#b71c1c', eye: '#e040fb', legs: '#4a148c', pod: '#7b1fa2' };
const PAL_GLITCH = { head: '#3a3a4f', body: '#26263a', visor: '#07070f', eye: '#ff00e5', legs: '#5e0b6e', pod: '#00e676', glitch: true };
const PAL_GOLD = { head: '#ffd740', body: '#ffe57f', visor: '#3e2723', eye: '#fff59d', legs: '#ff8f00', pod: '#ffab00' };
const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true };
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function coin(x, y, r) { circ(x, y, r, '#ffd740', '#c79100', Math.max(2, r * 0.12)); txt('R', x, y + r * 0.05, r * 1.1, OUT ? '#222' : '#a66f00'); }

// 💚 ROBO 2.0: copied from drawRoboBase in Robo Jump 6 (PAL_R2: smile, pixel freckles, "2.0"), all sizes scaled.
// x, y = top-left of his 30x40 box. o: pal, face, blink, line (outline color), party, wrench (no antenna, no arms: just like Robo Jump 6)
function drawR2(x, y, w, h, o = {}) {
  const pal = o.pal || PAL_ROBO, es = w / 30, face = o.face || 1, L = o.line || null, lw = 1.4 * es;
  ctx.save(); ctx.lineJoin = 'round';
  ctx.fillStyle = fillOf(pal.legs);
  for (const lx of [x + 4 * es, x + w - 12 * es]) { ctx.fillRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); if (L || OUT) { ctx.strokeStyle = OUT ? '#222' : L; ctx.lineWidth = OUT ? 5 : lw; ctx.strokeRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); } }
  rr(x + 2 * es, y + h * 0.5, w - 4 * es, h * 0.4, 6 * es, pal.body, L, lw);
  if (!pal.r2) circ(x + w / 2, y + h * 0.7, 3 * es, pal.pod, L, lw);
  rr(x - 5 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x + w - 1 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x - 2 * es, y, w + 4 * es, h * 0.55, 12 * es, pal.head, L, lw);
  rr(x + 2 * es, y + 4 * es, w - 4 * es, h * 0.55 - 9 * es, 9 * es, OUT ? '#fff' : pal.visor, L, lw);
  const ex = x + w / 2 + face * 3 * es, ey = y + h * 0.27, bl = o.blink ? 0.6 * es : 5 * (h / 40);
  ctx.fillStyle = OUT ? '#fff' : pal.eye;
  for (const d of [-6, 6]) { ctx.beginPath(); ctx.ellipse(ex + d * es, ey, 3.5 * es, bl, 0, 0, Math.PI * 2); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.stroke(); } }
  if (pal.glitch) {
    ctx.strokeStyle = '#ff00e5'; ctx.lineWidth = 1.6 * es; ctx.beginPath(); ctx.moveTo(x + 2 * es, y + 6 * es);
    for (let k = 1; k <= 6; k++) ctx.lineTo(x + 2 * es + k * (w - 4 * es) / 6, y + 6 * es + (k % 2 ? 6 : 0) * (h / 40));
    ctx.stroke();
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#00e676' : '#ff00e5'; ctx.fillRect(x + ((k * 37) % 26) * es, y + ((k * 23) % 34) * es, 3 * es, 3 * es); }
  }
  if (pal.r2) {

<script>
// ---------- 🖨️ printable pages: drawn on 850 x 1100 (8.5 x 11 inch) canvases ----------
const PW = 850, PH = 1100;
function makePage(fn, sc = 1.5) {
  const cv = document.createElement('canvas'); cv.width = Math.round(PW * sc); cv.height = Math.round(PH * sc);
  const old = ctx, oldOut = OUT; ctx = cv.getContext('2d'); OUT = false;
  try { ctx.scale(sc, sc); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, PW, PH); fn(); } finally { ctx = old; OUT = oldOut; }
  return cv;
}
function pageHead(title, sub) {
  rr(30, 24, 790, 84, 22, '#0d47a1');
  ctx.fillStyle = '#00e676'; ctx.fillRect(50, 98, 750, 5);
  R2at(88, 104, 74, { line: '#0a1a3f', pal: PAL_ROBO });
  txt('ROBO RULER  -  the shop all about Robo', 140, 48, 17, '#b3e5fc', 'left');
  txt(title, 140, 78, 34, '#fff', 'left', true, 640);
  if (sub) txt(sub, 425, 130, 21, '#0d47a1', 'center', true, 780);
}
function pageFoot(s) { txt(s || 'Printed at www.roboruler.shop  -  Beep boop! Thanks, Ben!', 425, 1076, 15, '#5c8fd6'); }
function dashLine(x1, y1, x2, y2, col, lw, dash) { ctx.save(); ctx.setLineDash(dash); ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); }
const CUTC = '#8a8a8a', FOLDC = '#1e88e5';
const cutL = (x1, y1, x2, y2) => dashLine(x1, y1, x2, y2, CUTC, 2.2, [10, 7]);
const foldL = (x1, y1, x2, y2) => { ctx.save(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore(); dashLine(x1, y1, x2, y2, FOLDC, 2.6, [4, 6]); };
function cutBox(x, y, w, h, r = 0) { ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath(); if (r) { ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); } else ctx.rect(x, y, w, h); ctx.stroke(); ctx.restore(); }
function cutCirc(x, y, r) { ctx.save(); ctx.setLineDash([10, 7]); ctx.strokeStyle = CUTC; ctx.lineWidth = 2.2; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
function scissors(x, y, s = 1) {                      // little scissors picture (no emoji)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.strokeStyle = '#555'; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.arc(-9, -7, 6, 0, 7); ctx.moveTo(-3, 7); ctx.arc(-9, 7, 6, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4, -4); ctx.lineTo(16, 6); ctx.moveTo(-4, 4); ctx.lineTo(16, -6); ctx.stroke(); ctx.restore();
}
function legend(y) {                                  // what the lines mean
  rr(40, y, 770, 44, 14, '#e8f1fc');
  scissors(70, y + 22); dashLine(95, y + 22, 150, y + 22, CUTC, 2.2, [10, 7]); txt('= CUT (a grown-up helps)', 158, y + 22, 17, '#444', 'left');
  dashLine(420, y + 22, 475, y + 22, FOLDC, 2.6, [4, 6]); txt('= FOLD', 483, y + 22, 17, '#1565c0', 'left');
  rr(570, y + 10, 50, 24, 4, '#e0e0e0', '#9e9e9e', 1.5); txt('TAPE', 595, y + 22, 12, '#555'); txt('= tape or glue here', 628, y + 22, 17, '#444', 'left');
}
function tapeTab(pts, label = 'TAPE') {               // a gray trapezoid tab
  poly(pts, '#e8e8e8'); const cx = pts.reduce((a, p) => a + p[0], 0) / pts.length, cy = pts.reduce((a, p) => a + p[1], 0) / pts.length;

// 🚚 delivery animation

function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.vroom(); say('Placing your order... beep beep!'); requestAnimationFrame(shipLoop); }

    poly([[tx + 10, by + 22], [tx - 30, by - 20], [tx + 60, by + 22]], '#ff1744', '#0a1a3f', 3); poly([[tx + 10, by + 98], [tx - 30, by + 140], [tx + 60, by + 98]], '#ff1744', '#0a1a3f', 3);
    rr(tx, by + 20, 240, 80, 40, '#f5f7ff', '#0a1a3f', 4); poly([[tx + 236, by + 22], [tx + 320, by + 60], [tx + 236, by + 98]], '#2979ff', '#0a1a3f', 4);
    circ(tx + 185, by + 60, 30, '#b3e5fc', '#0a1a3f', 4); ctx.save(); ctx.beginPath(); ctx.arc(tx + 185, by + 60, 27, 0, 7); ctx.clip(); MOVIE.robo(tx + 185, by + 96, { s: 1.2, t: shipT, pose: 'happy' }); ctx.restore();
    txt('ROBO', tx + 90, by + 48, 26, '#1565c0'); txt('ROCKET', tx + 90, by + 76, 20, '#ff1744');

    if (!done) { txt('Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 110, 54, '#fff'); rr(280, 160, 400, 26, 13, 'rgba(255,255,255,.3)'); rr(280, 160, Math.max(26, 400 * Math.min(1, shipT / 150)), 26, 13, '#ffd740'); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); rr(480 + Math.cos(a) * d, 140 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.5, 12, 8, 2, ['#ff4081', '#ffd740', '#ffd740', '#40c4ff'][i % 4]); }

  if (shipT < 400) requestAnimationFrame(shipLoop);

function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
