<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎄 The Holiday Craft Room</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: #fff3e0; color: #333; overflow: hidden; user-select: none; -webkit-user-select: none; transition: background .4s;
  }
  /* each holiday room has its own decorated look */
  body.r-thanks { background: repeating-linear-gradient(45deg, #ffe0b2 0 40px, #ffcc80 40px 80px); }
  body.r-winter { background: radial-gradient(circle at 20% 30%, #fff 0 3px, transparent 4px) 0 0 / 60px 60px, radial-gradient(circle at 70% 70%, #fff 0 2px, transparent 3px) 0 0 / 44px 44px, linear-gradient(#90caf9, #e3f2fd); }
  body.r-newyear { background: radial-gradient(circle at 30% 30%, #ffd740 0 3px, transparent 4px) 0 0 / 50px 50px, radial-gradient(circle at 70% 60%, #ff80ab 0 3px, transparent 4px) 0 0 / 70px 70px, linear-gradient(#311b92, #5e35b1); }
  body.r-valentine { background: repeating-linear-gradient(90deg, #ffe1f1 0 46px, #ffd0e8 46px 92px); }
  body.r-stpat { background: repeating-linear-gradient(45deg, #dcedc8 0 36px, #c5e1a5 36px 72px); }
  body.r-spring { background: repeating-linear-gradient(0deg, #fff9c4 0 40px, #f3e5f5 40px 80px, #e0f7fa 80px 120px); }
  body.r-july4 { background: radial-gradient(circle at 50% 50%, #fff 0 3px, transparent 4px) 0 0 / 40px 40px, linear-gradient(#1565c0, #42a5f5); }
  body.r-halloween { background: radial-gradient(circle at 30% 40%, #ffb74d 0 3px, transparent 4px) 0 0 / 56px 56px, linear-gradient(#4a148c, #ff9800); }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; position: relative; }
  #gHead h1 { margin: 0; font-size: clamp(24px, 3.2vw, 46px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #e53935, 8px 8px 0 #43a047; letter-spacing: 2px; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(16px, 2.2vw, 22px); font-weight: bold; background: rgba(255,255,255,.7); display: inline-block; border-radius: 12px; padding: 0 10px; }
  #picker { display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 6px 12px 10px; flex-shrink: 0; }
  .hol { font: inherit; flex: 0 0 auto; border: 4px solid #333; border-radius: 18px; padding: 4px 12px; cursor: pointer; background: #fff;
    box-shadow: 0 5px 0 #333; font-size: 17px; font-weight: bold; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
  .hol big { font-size: 28px; }
  .hol.on { background: #ffe066; border-color: #e53935; box-shadow: 0 5px 0 #e53935; transform: translateY(-2px) scale(1.05); }
  .hol.now::after { content: "⭐ NOW"; font-size: 12px; color: #c62828; }
  .hol:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  #room { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 16px 30px; }
  #roomHead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 4px 12px;
    background: rgba(255,255,255,.85); border: 4px solid #333; border-radius: 18px; padding: 6px 12px; }
  #roomHead span { font-size: 30px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  #roomHead i { font-style: normal; font-size: 17px; font-weight: bold; flex: 1; min-width: 200px; }
  #roomHead .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #c62828; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  .thumb:active { transform: scale(.96); }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #c62828; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #modes, .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-mode { background: #fff; font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; }
  .b-print { background: #8ef08e; font-size: 22px; }
  #gHead .deco { position: absolute; font-size: 34px; top: 10px; animation: bob 2.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-8px) rotate(8deg); } }
  .b-cap { background: #ffd54f; }
  .b-all { background: #c3a6ff; }
  .b-fold { background: #9bf6ff; }
  .b-music { background: #ffe0f0; font-size: 16px; min-height: 44px; }
  #gHead .b-music { position: absolute; right: 10px; top: 8px; }
  .idea { background: #fff59d; border: 3px solid #333; border-radius: 12px; padding: 0 8px; white-space: nowrap; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- 📖 how to make it ---------- */
  #fold { position: fixed; inset: 0; background: rgba(40, 30, 10, .72); display: none; z-index: 40;
    align-items: center; justify-content: center; padding: 14px; }
  #fold.on { display: flex; }
  #foldCard { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1180px;
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #foldCard h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.4vw, 36px); }
  #steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .step { background: #fff6d6; border: 4px solid #333; border-radius: 16px; padding: 6px; text-align: center; font-size: clamp(14px, 1.6vw, 19px); font-weight: bold; }
  .step svg { width: 100%; height: auto; display: block; }
  .step i { display: inline-block; background: #ff7043; color: #fff; border-radius: 50%; width: 32px; height: 32px; line-height: 32px; font-style: normal; font-size: 20px; margin-bottom: 2px; }
  #printAll { display: none; }
  @media (max-width: 760px) { #gHead .b-music { position: static; margin-bottom: 4px; } #gHead .deco { display: none; } }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #steps { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-height: 560px) { .btn { min-height: 48px; font-size: 17px; padding: 5px; } #pHelp { font-size: 15px; } .hol { min-height: 52px; } .hol big { font-size: 22px; } }
  /* ---------- PRINT: only the sheet (or a whole room of sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #fold { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
<body class="r-thanks">
<div id="gallery" class="screen on">
  <div id="gHead">
    <span class="deco" style="left:14px">🦃</span><span class="deco" style="left:64px;animation-delay:.6s">🎄</span>

</div>

</div>
<div id="fold"><div id="foldCard"><h2 id="foldTitle"></h2><div id="steps"></div>

<script>
// =====================================================================
// 🎄 THE HOLIDAY CRAFT ROOM (💡 Ben's idea!): printable holiday crafts in 8 holiday rooms:
// 🦃 Thanksgiving, 🎄 Winter holidays (incl. Hanukkah + Kwanzaa), 🎆 New Year's, 💝 Valentine's Day, ☘️ St. Patrick's Day,
// 🐣 Spring/Easter, 🎇 Fourth of July, 🎃 Halloween. The picker shows the room for the coming holiday first.
// Engine + art helpers + characters copied from secretsurprise.html (newest) and craft helpers from craftroom2.html.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units = 1 inch when printed).
// LINE = false is color, LINE = true is black and white. Printed pages use SVG shapes, no emoji.
// Paper only: printer paper, scissors (a grown-up cuts), tape or a glue stick, crayons, a pencil (+ yarn for hanging).
// Save: localStorage 'holidayCraftRoom' (which holidays were opened/printed + color mode + music + last room).
// Trophy 'holidayCraftRoom': open or print crafts from 5 different holidays.
// Music: holidaycraftroom.html?song=theme (Jukebox)
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
const FOLD = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-dasharray="10 7" stroke-linecap="round"/>';
const HOLE = (x, y, rx, ry) => '<ellipse data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(rx) + '" ry="' + n(ry) + '" fill="#fff" stroke="' + INK + '" stroke-width="3.5" stroke-dasharray="11 7"/>';
const PUNCH = (x, y, r) => '<circle data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r || 11) + '" fill="#fff" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 5"/>' +

// ---------- sounds ----------
let actx = null;

// =====================================================================
// SCREENS
// =====================================================================
const $ = id => document.getElementById(id);

  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), 3000);
}
const isLine = () => state.mode === 'line';
const foldOpen = () => typeof document !== 'undefined' && $('fold') && $('fold').classList.contains('on');
function openFold() {
  const p = SHEETS[cur];
  $('foldTitle').textContent = '📖 How to make it: ' + p.name.replace(/^\S+\s/, '');
  $('steps').innerHTML = howSteps(p).map((s, i) => '<div class="step"><i>' + (i + 1) + '</i>' + s.pic + '<div>' + esc(s.text) + '</div></div>').join('');

}
function closeFold() { if (typeof document !== 'undefined' && $('fold')) $('fold').classList.remove('on'); }
// =====================================================================
// PRINTING: only the sheet prints (see @media print). A "set" prints one sheet per page.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);

}
function printSheet() {

  endPrintAll();
  renderSheet(); noteSeen(SHEETS[cur].kind, true); doPrint();
}
function printPages(list, msg) {

  if (msg) toast(msg);

}
function printSet(kind) { noteSeen(kind, true); printPages(setSheets(kind), '🖨️ Printing ' + setSheets(kind).length + ' pages!'); }

// =====================================================================
// =====================================================================
// SAVE + TROPHY
// =====================================================================
let state = { mode: 'color', printed: {}, seen: {}, music: true };
let view = 'gallery', sel = 0, cur = 0, room = 'thanks';
function loadState() {
  try { const s = JSON.parse(localStorage.getItem('holidayCraftRoom') || 'null');
    if (s && typeof s === 'object') { state.mode = s.mode === 'line' ? 'line' : 'color'; state.printed = s.printed || {}; state.seen = s.seen || {}; state.music = s.music !== false; } } catch (_) {}
}
function saveState() { try { localStorage.setItem('holidayCraftRoom', JSON.stringify(state)); } catch (_) {} }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }

// opening or printing crafts from 5 different holidays = 🏆 Holiday Crafter trophy
function noteSeen(kind, printed) {
  state.seen[kind] = 1; if (printed) state.printed[kind] = 1; saveState();
  if (Object.keys(KINDS).filter(k => state.seen[k]).length >= 5 && !hasTrophy()) { trophy('holidayCraftRoom'); tune([523, 659, 784, 1047, 1319]); toast('🏆 Holiday Crafter trophy! You tried 5 holidays!'); return true; }
  return false;
}
// =====================================================================
// SCREENS
// =====================================================================
function renderSheet() { if (typeof document === 'undefined' || !$('svgBox')) return; $('svgBox').innerHTML = buildSheet(cur, isLine()); }

function updateSide() {
  const p = SHEETS[cur], line = isLine();
  $('bColor').classList.toggle('on', !line); $('bLine').classList.toggle('on', line);
  $('pHelp').textContent = p.help || KINDS[p.kind].help;
  $('bPrintAll').textContent = KINDS[p.kind].all;
}
function setView(v) { view = v; $('gallery').classList.toggle('on', v === 'gallery'); $('view').classList.toggle('on', v === 'sheet'); }
const ORDER = roomOrder();
function renderPicker() {
  $('picker').innerHTML = '';

    const b = document.createElement('button'); b.className = 'hol' + (k === room ? ' on' : '') + (i === 0 ? ' now' : '');

}
function pickRoom(k) {

}
function renderGallery() {
  const K = KINDS[room], h = $('roomHead');
  h.innerHTML = '<span>' + K.title + '</span><i>' + esc(K.sub) + '</i>';
  const b = document.createElement('button'); b.className = 'btn b-all'; b.textContent = K.all;
  b.addEventListener('click', () => printSet(room)); h.appendChild(b);

    const d = document.createElement('div'); d.className = 'thumb' + (k === sel ? ' sel' : ''); d.dataset.i = k;
    d.innerHTML = buildSheet(k, false) + '<b>' + esc(SHEETS[k].name) + '</b>';
