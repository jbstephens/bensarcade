<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sparks's Pet Supply Store</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #22163a; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fff9ef; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #e3dcea; border-bottom: 2px solid #c9bfd6; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #d99a1e; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #4b2a7b, #7e4fc4 55%, #d99a1e); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 30px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #2a1747; }
  #logo .big i { color: #ffd77a; font-style: normal; }
  #logo .small { font-size: 15px; color: #f3e3ff; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #22163a; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #f4b942; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #f4b942; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #ffd740; color: #4e2600; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #c79100; }
  #wallet .amt { font-size: 24px; }
  #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #fff8e1; color: #6d4c00; margin-top: 3px; }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #f4ead8; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #4b2a7b; box-shadow: 0 4px 0 #b39ddb; }
  #nav button.on { background: #7e4fc4; color: #fff; box-shadow: 0 4px 0 #4b2a7b; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff1744; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c51162; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #f48fb1; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }
  /* product grid */
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(74,20,140,.18); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }
  .card.must { border-color: #ffc400; background: #fffaf0; }
  .card.sel { outline: 4px solid #f4b942; }
  .card canvas { width: 100%; height: auto; border-radius: 12px; background: #f8f0e2; display: block; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #3d2366; line-height: 1.1; }
  .card .blurb { font-size: 15px; color: #555; }
  .card .price { font-size: 22px; font-weight: 900; color: #1f7a4a; margin: 4px 0; }
  .card .price s { color: #999; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff1744; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-6deg); }
  .tag.gold { background: #ffc400; color: #4e2600; }
  .tag.new { background: #2fae6a; }
  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #4b2a7b; box-shadow: 0 4px 0 #b39ddb; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #ede7f6; color: #6a1b9a; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #7e4fc4; color: #fff; box-shadow: 0 4px 0 #4b2a7b; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #f8f0e2; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #6a1b9a; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #2fae6a; color: #fff; box-shadow: 0 4px 0 #1f7a4a; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #ede7f6; box-shadow: 0 4px 0 #b39ddb; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(74,20,140,.15); }
  .line canvas { width: 76px; height: auto; border-radius: 8px; flex: none; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #3d2366; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #1f7a4a; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #7e4fc4; box-shadow: 0 5px 0 #4b2a7b; }
  .bigbtn.green { background: #2fae6a; box-shadow: 0 5px 0 #1f7a4a; }
  .bigbtn.blue { background: #2979ff; box-shadow: 0 5px 0 #1a4fb5; }
  .bigbtn.gray { background: #9e9e9e; box-shadow: 0 5px 0 #616161; }
  .bigbtn.small { font-size: 19px; padding: 10px 16px; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #3d2366; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #6a1b9a; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #4b2a7b; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(43,15,69,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(43,15,69,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #f6ecdc; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #f6ecdc; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #2fae6a; } #printBox .pbBack { background: #6a1b9a; }
  #printBox .pbTip { font-size: 20px; color: #4b2a7b; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  /* name chooser in the print preview */
  #printBox .pbNames { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; margin: 4px auto; max-width: 900px; }
  #printBox .pbNames b { font-size: 19px; color: #4b2a7b; margin-right: 4px; }
  #printBox .pbNames button { font-size: 18px; padding: 8px 14px; background: #fff; color: #4b2a7b; box-shadow: 0 4px 0 #c9b2ea; border-radius: 12px; }
  #printBox .pbNames button.on { background: #7e4fc4; color: #fff; box-shadow: 0 4px 0 #4b2a7b; }
  @media print { #printBox .pbNames { display: none !important; } }
  #wallet .amt { white-space: nowrap; }
  #logo .big { font-size: 27px; }
  @media (max-height: 640px) { #head { min-height: 80px; } #helper { width: 92px; height: 92px; } #bubble { font-size: 17px; } #nav button { font-size: 19px; padding: 7px 14px; } }
</style>

<body>
<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff5f57"></span><span style="background:#febc2e"></span><span style="background:#28c840"></span></div>
    <div id="url">🔒 <b>www.sparks.pet</b></div>
  </div>
  <div id="head">
    <canvas id="helper" width="208" height="208"></canvas>
    <div id="logo"><div class="big">SPARKS'S <i>PET</i><br>SUPPLY</div><div class="small">Cozy paper stuff for your stuffed pets!</div></div>
    <div id="bubble">Woof! Welcome to my pet supply store!</div>
    <div id="wallet"><div class="lbl">MY DOG BONES</div><div class="amt" id="amt">🦴 1000</div><button id="moreBucks">🦴 Get more</button></div>
  </div>
  <div id="nav">
    <button id="tShop" class="on">🏬 SHOP</button>

</div>
<div id="ship"><canvas id="shipCv" width="960" height="540"></canvas><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button></div>
<div id="revBox"><div class="in" id="revIn"></div></div>
<script>
// 🐶 SPARKS'S PET SUPPLY STORE: buy cozy paper pet supplies (for stuffed animals and pretend pets)
// with pretend Dog Bones, then pick which orders to PRINT. Nothing prints by itself.
// Save: localStorage.petSupply = { bones, cart:[keys], gift, orders:[{k, gift, n}], printed, n, who, pet }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'petSupply';
let S = { bones: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0, who: 'Ben', pet: 'Buddy' };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bones >= 0)) S.bones = 1000;
const WHO = ['Ben', 'Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
const PETS = ['Buddy', 'Luna', 'Biscuit', 'Max', 'Coco', 'Pepper', 'Teddy'];
if (!WHO.includes(S.who)) S.who = 'Ben'; if (!PETS.includes(S.pet)) S.pet = 'Buddy';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
let MK_SC = 1;                                       // the makePage scale, so coloring lines stay the same thickness
function outW() { const t = ctx.getTransform(); return 3.2 * MK_SC / Math.max(0.01, Math.hypot(t.a, t.b)); }
function dot(x, y, rx, ry, col) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fillStyle = OUT ? '#222' : col; ctx.fill(); }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? outW() : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? outW() : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? outW() : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
const OL = '#1b1b2f';
const lc = () => OUT ? '#222' : OL;
function ell(x, y, rx, ry, fill, lw, rot = 0, alpha = 1) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2);
  if (fill) { ctx.save(); ctx.globalAlpha = OUT ? 1 : alpha; ctx.fillStyle = fillOf(fill); ctx.fill(); ctx.restore(); }
  if (lw) { ctx.strokeStyle = lc(); ctx.lineWidth = OUT ? outW() : lw; ctx.stroke(); }
}
function pathFill(d, fill, lw) { const p = new Path2D(d); if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(p); } if (lw) { ctx.strokeStyle = lc(); ctx.lineWidth = OUT ? outW() : lw; ctx.stroke(p); } }
function pathLine(d, col, lw) { ctx.strokeStyle = OUT ? (col === '#fff' ? '#fff' : '#222') : col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.stroke(new Path2D(d)); }
function rrl(x, y, w, h, r, fill, lw) { rr(x, y, w, h, r, fill, OL, lw); }

// 🐶 SPARKS, copied from sparksDog in comicmaker.html (his real comic-book look, same as sparks.html):
// a LONG YELLOW robot dog, PURPLE from the middle of his eyes up, purple floppy ear, purple back + tail,
// NO collar, and a big window in his side with Charlie (orange) and August (gray) driving him.
// Drawn in comic units (about 116 wide x 87 tall). o: flip, blink, wag, sleepy
function drawSparks(o = {}) {
  const F = '#f4b942', D = '#c98e2a', PU = '#8e5bd6', EAR = '#6a3fb5', wag = o.wag || -6;
  ctx.save(); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  pathLine(`M-40 14 Q-52 ${2 + wag} -50 ${-10 + wag}`, OL, 9); pathLine(`M-40 14 Q-52 ${2 + wag} -50 ${-10 + wag}`, OUT ? '#fff' : PU, 6);   // purple tail
  if (OUT) pathLine(`M-40 14 Q-52 ${2 + wag} -50 ${-10 + wag}`, '#fff', 5.5);
  for (const lx of [-34, -18, 10, 24]) { rrl(lx, 32, 9, 20, 3, D, 2); ell(lx + 4.5, 52, 7, 3.5, D, 1.6); }        // legs + paws
  rrl(-44, 2, 76, 34, 15, F, 2.6);                                                                        // long body
  pathFill('M-42 14 Q-42 3 -29 3 L17 3 Q30 3 30 14 Z', OUT ? null : PU);                                // purple back (where you pet him)
  if (OUT) pathLine('M-42 14 L30 14', '#222', 1.6);
  pathLine('M-30 26 L-24 26 M-30 30 L-24 30', D, 2); circ(-14, 28, 2.2, '#e53935', lc(), 1);              // robot vents + light
  circ(-6, 21, 13, '#b3e5fc', lc(), 2.4); if (!OUT) pathLine('M-12 12 Q-8 9 -3 10', '#fff', 2);          // big window
  for (const [cx, col] of [[-11, '#ff9800'], [-1, '#9e9e9e']]) {                                         // Charlie + August
    pathFill(`M${cx - 4.5} 21 L${cx - 3.5} 16 L${cx - 1} 19.5 Z M${cx + 1} 19.5 L${cx + 3.5} 16 L${cx + 4.5} 21 Z`, col, 0.8);
    circ(cx, 24, 5, col, lc(), 1.2); ctx.fillStyle = OL; ctx.fillRect(cx - 2.4, 22.6, 1.3, 1.8); ctx.fillRect(cx + 1.1, 22.6, 1.3, 1.8);
  }
  rrl(18, -30, 36, 32, 13, F, 2.6);                                                                       // head
  pathFill('M19.3 -18 L19.3 -17 Q19.3 -29 31 -29 L41 -29 Q52.7 -29 52.7 -17 L52.7 -18 Z', OUT ? null : PU);   // purple from the middle of his eyes up
  if (OUT) pathLine('M19.5 -18 L52.5 -18', '#222', 1.4);
  rrl(40, -14, 20, 15, 6, F, 2.2);                                                                        // snout
  dot(59, -11, 4.2, 3.4, '#2b2b2b'); if (!OUT) circ(58, -12.4, 1, '#fff');                               // nose
  ell(16, -16, 7, 15, EAR, 2.2, (o.sleepy ? 30 : 14) * Math.PI / 180);                                    // long floppy purple ear
  for (const ex of [30.5, 43.5]) {                                                                        // eyes

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }

function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }

// 🖨️ print preview: nothing prints until Ben taps PRINT
