<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🧪 The Potion Shop</title>
<script src="touchpad.js?v=11"></script>
<style>

    <button class="btn b4" id="bEmpty">🫗 Empty</button>
    <button class="btn b2" id="bShelf">🧴 My Shelf</button>
    <button class="btn b1" id="bPrints">🖨️ Print Labels</button>
  </div>
  <div id="jars"></div>

</div></div>
<script>
