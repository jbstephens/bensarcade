<style>
  html, body { height: 100%; }
  body { margin: 0; background: #0b1530; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas#game { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e3ecff; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e3ecff; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #455a64; }
  #printBox .pbTip { font-size: 20px; color: #1a237e; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 🤖 THE ROBO MUSEUM: every Robo ever, as big statues on stands. Walk through the halls with Robo (the movie Robo)
// as your guide, tap a statue to see it up close, collect a 📘 passport stamp for each one, and print souvenirs
// in the 🎁 Gift Shop. Every Robo is drawn with the REAL drawing code from his own game (copied from roboruler.html,
// which copied it from each game), so they look EXACTLY like they do in the games.
// Save: localStorage.roboMuseum = { seen: {id: 1}, allDone }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { seen: {} };
try { const s = JSON.parse(localStorage.getItem('roboMuseum') || 'null'); if (s && s.seen) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('roboMuseum', JSON.stringify(save)); } catch (_) {} }
</script>
<!-- ===== the REAL Robo drawing code, copied from roboruler.html (which copied it from each game) ===== -->
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false;                        // OUT = coloring-book mode: white fills + black lines
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
const PAL_NEGA = { head: '#37474f', body: '#263238', visor: '#b71c1c', eye: '#e040fb', legs: '#4a148c', pod: '#7b1fa2' };
const PAL_GLITCH = { head: '#3a3a4f', body: '#26263a', visor: '#07070f', eye: '#ff00e5', legs: '#5e0b6e', pod: '#00e676', glitch: true };
const PAL_GOLD = { head: '#ffd740', body: '#ffe57f', visor: '#3e2723', eye: '#fff59d', legs: '#ff8f00', pod: '#ffab00' };
const PAL_R2 = { head: '#fdf4ff', body: '#effff4', visor: '#1a0033', eye: '#00e676', legs: '#d500f9', pod: '#00e676', r2: true };
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 5 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke) {
  const p = []; for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function gear(x, y, r, fill, teeth = 8) {
  const p = []; for (let i = 0; i < teeth * 4; i++) { const a = i * Math.PI * 2 / (teeth * 4), k = i % 4 < 2 ? 1 : 0.78; p.push([x + Math.cos(a) * r * k, y + Math.sin(a) * r * k]); }
  poly(p, fill, '#37474f', 2); circ(x, y, r * 0.3, '#fff', '#37474f', 2);
}
function wrench(x, y, len, ang, fill = '#90a4ae') {
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  rr(-len * 0.08, 0, len * 0.16, len, len * 0.08, fill, '#37474f', 2);
  circ(0, 0, len * 0.2, fill, '#37474f', 2);
  ctx.fillStyle = OUT ? '#fff' : '#fff'; ctx.fillRect(-len * 0.07, -len * 0.24, len * 0.14, len * 0.2);
  ctx.restore();
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function coin(x, y, r) { circ(x, y, r, '#ffd740', '#c79100', Math.max(2, r * 0.12)); txt('R', x, y + r * 0.05, r * 1.1, OUT ? '#222' : '#a66f00'); }

// 💚 ROBO 2.0: copied from drawRoboBase in Robo Jump 6 (PAL_R2: smile, pixel freckles, "2.0"), all sizes scaled.
// x, y = top-left of his 30x40 box. o: pal, face, blink, line (outline color), party, wrench (no antenna, no arms: just like Robo Jump 6)
function drawR2(x, y, w, h, o = {}) {
  const pal = o.pal || PAL_ROBO, es = w / 30, face = o.face || 1, L = o.line || null, lw = 1.4 * es;
  ctx.save(); ctx.lineJoin = 'round';
  ctx.fillStyle = fillOf(pal.legs);
  for (const lx of [x + 4 * es, x + w - 12 * es]) { ctx.fillRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); if (L || OUT) { ctx.strokeStyle = OUT ? '#222' : L; ctx.lineWidth = OUT ? 5 : lw; ctx.strokeRect(lx, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); } }
  rr(x + 2 * es, y + h * 0.5, w - 4 * es, h * 0.4, 6 * es, pal.body, L, lw);
  if (!pal.r2) circ(x + w / 2, y + h * 0.7, 3 * es, pal.pod, L, lw);
  rr(x - 5 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x + w - 1 * es, y + h * 0.3 - 3 * es, 6 * es, 9 * (h / 40), 3 * es, pal.pod, L, lw);
  rr(x - 2 * es, y, w + 4 * es, h * 0.55, 12 * es, pal.head, L, lw);
  rr(x + 2 * es, y + 4 * es, w - 4 * es, h * 0.55 - 9 * es, 9 * es, OUT ? '#fff' : pal.visor, L, lw);
  const ex = x + w / 2 + face * 3 * es, ey = y + h * 0.27, bl = o.blink ? 0.6 * es : 5 * (h / 40);
  ctx.fillStyle = OUT ? '#fff' : pal.eye;
  for (const d of [-6, 6]) { ctx.beginPath(); ctx.ellipse(ex + d * es, ey, 3.5 * es, bl, 0, 0, Math.PI * 2); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 5; ctx.stroke(); } }
  if (pal.glitch) {
    ctx.strokeStyle = '#ff00e5'; ctx.lineWidth = 1.6 * es; ctx.beginPath(); ctx.moveTo(x + 2 * es, y + 6 * es);
    for (let k = 1; k <= 6; k++) ctx.lineTo(x + 2 * es + k * (w - 4 * es) / 6, y + 6 * es + (k % 2 ? 6 : 0) * (h / 40));
    ctx.stroke();
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k % 2 ? '#00e676' : '#ff00e5'; ctx.fillRect(x + ((k * 37) % 26) * es, y + ((k * 23) % 34) * es, 3 * es, 3 * es); }
  }
  if (pal.r2) {
    ctx.strokeStyle = OUT ? '#222' : '#00e676'; ctx.lineWidth = OUT ? 6 : 2 * es * 0.75; ctx.beginPath(); ctx.arc(ex, ey + 6 * es, 3.5 * es, 0.2, Math.PI - 0.2); ctx.stroke();
    if (!OUT) { ctx.fillStyle = '#ff00e5'; ctx.fillRect(x + 1 * es, y + 3 * es, 4 * es, 4 * es); ctx.fillStyle = '#00e676'; ctx.fillRect(x + w - 5 * es, y + 2 * es, 4 * es, 4 * es); }
    txt('2.0', x + w / 2, y + h * 0.72, Math.round(9 * es), OUT ? '#222' : '#7b1fa2');
  }
  if (o.party) { poly([[x + w / 2 - 7 * es, y + 1], [x + w / 2 + 1 * es, y - 15 * es], [x + w / 2 + 7 * es, y + 1]], '#ff4081', L, lw); circ(x + w / 2 + 1 * es, y - 15 * es, 2.6 * es, '#ffeb3b', L, lw); }
  if (o.wrench) wrench(x - 7 * es, y + h * 0.62, 16 * es, 0.5);
  ctx.restore();
}
// handy: draw Robo 2.0 by his CENTER-x and FEET-y with a height
function R2at(cx, feetY, hgt, o) { const w = hgt * 0.75; drawR2(cx - w / 2, feetY - hgt, w, hgt, o); }
</script>
<script>
// ======================================================================
// 🤖 THE REAL ROBOS: drawing code copied straight out of Ben's games by a script (one closure per game,
// so every game keeps its own roundRect/circle/hats). Each one draws Robo in a 30x40 box, like in the game.
// ======================================================================
// ===== copied from platformer.html: drawLook, roundRect, drawHat =====
const RJ1 = (function () {
let frame = 100, goldDraw = false; const gc = (c, g) => goldDraw ? g : c, isGold = () => false;
function roundRect(x, y, w, h, r, fill) {
  ctx.beginPath(); ctx.roundRect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill();
}
function drawLook(p, id, gold = isGold()) {
  const sx = 1 / p.squash, sy = p.squash;
  const w = p.w * sx, h = p.h * sy;
  const x = p.x + (p.w - w) / 2, y = p.y + p.h - h;
  goldDraw = gold;
  if (id === 'monster') {                              // 🧪 My Monster from the Mad Science Lab
    const cfg = myMonster || { body: 0, color: '#66bb6a', eyes: 2, horns: 0, mouth: 0, wings: false };
    const hat = monsterHat && lookOpen(LOOKS.find(l => l.id === monsterHat)) ? monsterHat : '';
    if (p.hovering && !cfg.wings) {                    // no wings? jet boots then!
      const f = 8 + Math.random() * 8;
      ctx.fillStyle = gc('#7df9ff', '#ffe57f');
      for (const fx of [x + 7, x + w - 7]) { ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill(); }
    }
    const top = drawMonsterLook(cfg, x, y, w, h, p.face || 1, frame, {
      gold, hat: !!hat, fly: !!p.hovering || (p.onGround === false && Math.abs(p.vy || 0) > 0.5),
      idle: p.onGround !== false && Math.abs(p.vx || 0) < 0.5, walk: p.onGround !== false && Math.abs(p.vx || 0) >= 0.5 });
    if (hat) drawHat(hat, x + w / 2, top + 1, w + 4, p.face || 1);
    if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8);
    goldDraw = false; return;
  }
  if (id === 'pinch') { drawPinch(p, x, y, w, h); if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return; }
  if (id === 'boo') {                                  // 👻 Boo the Ghost: see-through, wavy tail, floats extra long
    const t = frame * 0.15, f = p.face || 1;
    ctx.save(); ctx.globalAlpha = 0.85;
    ctx.fillStyle = gold ? '#ffd740' : '#f5f9ff'; ctx.beginPath();
    ctx.moveTo(x, y + h); ctx.lineTo(x, y + 14); ctx.arc(x + w / 2, y + 14, w / 2, Math.PI, 0); ctx.lineTo(x + w, y + h);
    for (let k = 0; k < 4; k++) ctx.lineTo(x + w - (k + 0.5) * w / 4, y + h - 6 + Math.sin(t + k) * 3), ctx.lineTo(x + w - (k + 1) * w / 4, y + h);
    ctx.fill(); ctx.globalAlpha = 1;
    ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.ellipse(x + w / 2 - 6 + f * 2, y + 14, 3, 4.5, 0, 0, 7); ctx.ellipse(x + w / 2 + 6 + f * 2, y + 14, 3, 4.5, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + w / 2 + f * 2, y + 24, 4, 3, 0, 0, 7); ctx.fill();
    ctx.restore();
    if (monsterHat) drawHat(monsterHat, x + w / 2, y + 1, w + 4, f);
    if (gold) goldSparkles(x - 6, y - 6, w + 12, h + 8); goldDraw = false; return;
  }
  if (p.hovering) {                                    // jet boot flames
    const f = 8 + Math.random() * 8;
    ctx.fillStyle = gc('#7df9ff', '#ffe57f');
    for (const fx of [x + 7, x + w - 7]) {
      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();

  ctx.fillStyle = gc('#3d5afe', '#ff8f00');            // legs

  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6, gc('#f5f7ff', '#ffb300'));   // body
  ctx.fillStyle = gc('#2979ff', '#fff');               // chest light
  ctx.beginPath(); ctx.arc(x + w / 2, y + h * 0.7, 3, 0, 7); ctx.fill();
  roundRect(x - 5, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00')); // ear pods
  roundRect(x + w - 1, y + h * 0.3 - 3, 6, 9, 3, gc('#2979ff', '#ff8f00'));
  roundRect(x - 2, y, w + 4, h * 0.55, 12, gc('#ffffff', '#ffd740'));  // big round head
  if (gold) {                                          // ✨ shiny streak + a white highlight
    ctx.save(); ctx.beginPath(); ctx.roundRect(x - 2, y, w + 4, h * 0.55, 12); ctx.roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6); ctx.clip();

    ctx.fillStyle = 'rgba(255,255,255,.8)'; ctx.beginPath(); ctx.ellipse(x + 3, y + 3, 3, 1.6, -0.5, 0, 7); ctx.fill();
  }
  roundRect(x + 2, y + 4, w - 4, h * 0.55 - 9, 9, '#111827');  // dark visor
  const ex = x + w / 2 + p.face * 3, ey = y + h * 0.27;  // glowing eyes
  const blink = frame % 180 < 6 ? 1 : 5;
  ctx.fillStyle = '#40c4ff';
  ctx.beginPath(); ctx.ellipse(ex - 6, ey, 3.5, blink, 0, 0, 7); ctx.ellipse(ex + 6, ey, 3.5, blink, 0, 0, 7); ctx.fill();

}
function drawHat(id, cx, top, hw, face) {
  ctx.save();

  const shape = (fill, f) => { ctx.fillStyle = fill; ctx.beginPath(); f(); ctx.fill(); ctx.stroke(); };
  if (id === 'tophat') {
    shape('#212121', () => ctx.ellipse(cx, top, hw * 0.62, 4, 0, 0, 7));          // brim
    shape('#212121', () => ctx.rect(cx - hw * 0.36, top - 22, hw * 0.72, 22));     // tall part
    ctx.fillStyle = '#e53935'; ctx.fillRect(cx - hw * 0.36, top - 8, hw * 0.72, 5);  // red band
    ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(cx - hw * 0.28, top - 20, 3, 10);
  } else if (id === 'cap') {
    shape('#e53935', () => ctx.ellipse(cx + face * hw * 0.45, top + 1, hw * 0.4, 3.5, 0, 0, 7));  // bill sticks out the way you face
    shape('#ff1744', () => ctx.arc(cx, top + 2, hw * 0.48, Math.PI, 0));                         // dome
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, top + 2 - hw * 0.48, 2.5, 0, 7); ctx.fill();  // button
    ctx.fillStyle = '#ffeb3b'; ctx.beginPath(); ctx.arc(cx - face * 3, top - 5, 3, 0, 7); ctx.fill();   // star badge
  } else if (id === 'cowboy') {
    shape('#8d5524', () => {                                                       // curvy brim
      ctx.moveTo(cx - hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx - hw * 0.6, top + 4, cx, top + 3);
      ctx.quadraticCurveTo(cx + hw * 0.6, top + 4, cx + hw * 0.8, top - 6);
      ctx.quadraticCurveTo(cx + hw * 0.6, top - 1, cx, top - 1);
      ctx.quadraticCurveTo(cx - hw * 0.6, top - 1, cx - hw * 0.8, top - 6);
    });
    shape('#a0682f', () => {                                                       // crown with a dent
      ctx.moveTo(cx - hw * 0.34, top);
      ctx.lineTo(cx - hw * 0.3, top - 15);
      ctx.quadraticCurveTo(cx, top - 10, cx + hw * 0.3, top - 15);
      ctx.lineTo(cx + hw * 0.34, top);
      ctx.closePath();
    });
    ctx.fillStyle = '#4e342e'; ctx.fillRect(cx - hw * 0.33, top - 5, hw * 0.66, 3);   // band
  } else if (id === 'crown') {
    shape('#ffd740', () => {
      ctx.moveTo(cx - hw * 0.42, top + 1);
      ctx.lineTo(cx - hw * 0.46, top - 14);
      ctx.lineTo(cx - hw * 0.22, top - 6);
      ctx.lineTo(cx, top - 18);
      ctx.lineTo(cx + hw * 0.22, top - 6);
      ctx.lineTo(cx + hw * 0.46, top - 14);
      ctx.lineTo(cx + hw * 0.42, top + 1);
      ctx.closePath();
    });
    ctx.fillStyle = '#e91e63'; ctx.beginPath(); ctx.arc(cx, top - 3, 2.6, 0, 7); ctx.fill();   // jewels
    ctx.fillStyle = '#2979ff'; ctx.beginPath(); ctx.arc(cx - hw * 0.25, top - 2, 2, 0, 7); ctx.arc(cx + hw * 0.25, top - 2, 2, 0, 7); ctx.fill();

})();

// ===== copied from robojump2.html: drawRobo, roundRect, drawHat =====
const RJ2 = (function () {

      ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill();
    }

// 🤖 ROBO PRIME: copied from backstage.html (drawRes 'prime') with its little helpers
const PRIME = (function () {
  function rrect(x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
  function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
  function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
    ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
    if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
    ctx.fillStyle = color; ctx.fillText(str, x, y);
  }
  function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
  function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
  function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
    ctx.fillStyle = fill; ctx.beginPath();
    for (let i = 0; i < pts * 2; i++) { const a = rot + i * Math.PI / pts - Math.PI / 2, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.closePath(); ctx.fill();
  }
  function limb(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
  function eyesPair(x1, x2, y, r, t, seed = 0, col = '#1a1a2e') {
    const bl = (t + seed * 37) % 200 < 6;
    for (const ex of [x1, x2]) { if (bl) { ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(ex - r, y); ctx.lineTo(ex + r, y); ctx.stroke(); }
      else { circle(ex, y, r, col); circle(ex + r * 0.35, y - r * 0.35, r * 0.4, '#fff'); } }
  }
  function smile(x, y, r, col = '#1a1a2e', lw = 2) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(x, y, r, 0.2, Math.PI - 0.2); ctx.stroke(); }
  function draw(x, y, s, t, doing) {
    ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.lineJoin = 'round';
    ellipse(0, 0, 26, 5, 'rgba(0,0,0,.15)');
    roundRect(-14, -16, 10, 16, 3, '#78909c'); roundRect(4, -16, 10, 16, 3, '#78909c');
    limb(-22, -44, -30, doing ? -60 : -24, '#90a4ae', 6); limb(22, -44, 30, -24, '#90a4ae', 6);
    roundRect(-22, -54, 44, 40, 9, '#ffca28'); circle(0, -34, 9, '#fff8e1'); text('1', 0, -29, 13, '#e65100', 'center', false);
    roundRect(-21, -88, 42, 34, 8, '#cfd8dc'); circle(-21, -71, 3.5, '#90a4ae'); circle(21, -71, 3.5, '#90a4ae');
    roundRect(-15, -82, 30, 17, 6, '#263238'); eyesPair(-6, 6, -74, 3.2, t, 1, '#ffd740');
    smile(0, -64, 4, '#607d8b'); limb(0, -88, 0, -98, '#90a4ae', 2.5); star(0, -101, 6, '#ffd740', t * 0.02);
    if (doing) { roundRect(-44, -70, 24, 18, 3, '#e57373'); limb(-32, -70, -32, -52, '#fff', 1.5); }      // his story book
    ctx.restore();
  }
  return { draw };
})();
const IMG3D = {};

function img3d(k, cx, feetY, hgt) {                     // a 3D render, feet on the line, hgt = Robo height

}

function inBox(cx, feetY, hgt, bw, bh, fn) {
