<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #6a4c93; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #app { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fffdf4; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  #top { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: linear-gradient(90deg, #ffd23f, #ff8c42 50%, #ff5d8f); border-bottom: 4px dashed #fff; flex: none; flex-wrap: wrap; }
  #top h1 { margin: 0; font-size: clamp(22px, 3.4vw, 36px); color: #fff; text-shadow: 0 3px 0 #8e3b12, 0 0 3px #8e3b12; letter-spacing: 1px; white-space: nowrap; }
  .idea { font-size: 16px; font-weight: 900; color: #2b2d42; background: #fff3b0; border: 3px dashed #ffb347; border-radius: 14px; padding: 4px 10px; }
  #pgNum { margin-left: auto; font-size: 19px; font-weight: 900; color: #2b2d42; background: #fff; border-radius: 14px; padding: 6px 12px; border: 3px solid #2b2d42; white-space: nowrap; }
  #chaps { display: flex; gap: 8px; padding: 8px 10px 6px; overflow-x: auto; -webkit-overflow-scrolling: touch; flex: none; background: #f3ecff; }
  .chip { flex: none; font-size: 17px; font-weight: 900; border: 3px solid #2b2d42; border-radius: 16px; padding: 7px 12px; background: #fff; color: #2b2d42; box-shadow: 0 3px 0 #2b2d42; white-space: nowrap; min-height: 46px; }
  .chip.on { background: #9b7fd1; color: #fff; }
  #mid { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 8px; min-height: 0; }
  .arrow { flex: none; width: 74px; height: 120px; font-size: 44px; font-weight: 900; border: 4px solid #2b2d42; border-radius: 22px; background: #ffd23f; color: #2b2d42; box-shadow: 0 5px 0 #2b2d42; }
  .arrow:disabled { opacity: .35; }
  #pageWrap { height: 100%; display: flex; flex-direction: column; align-items: center; min-width: 0; }
  #pageCv { height: 100%; max-width: 100%; object-fit: contain; background: #fff; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); border: 2px solid #ddd; }
  #names { display: none; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; padding: 6px 10px 0; flex: none; font-size: 19px; font-weight: 900; color: #c2185b; }

  #names button { font-size: 18px; font-weight: 900; border: 3px solid #c2185b; border-radius: 14px; padding: 8px 12px; background: #fff; color: #2b2d42; min-height: 46px; }
  #names button.on { background: #ff5d8f; color: #fff; }
  #acts { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; padding: 8px 10px 10px; flex: none; }
  .big { font-size: 21px; font-weight: 900; border: 0; border-radius: 16px; padding: 12px 18px; color: #fff; background: #2ec27e; box-shadow: 0 5px 0 #1e7f4f; min-height: 54px; }
  .big.blue { background: #3d7be0; box-shadow: 0 5px 0 #1e4fa3; }
  .big.purple { background: #9b7fd1; box-shadow: 0 5px 0 #6a4c93; }
  .big.yellow { background: #ffd23f; color: #2b2d42; box-shadow: 0 5px 0 #c99a00; }
  #say { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: #fff; border: 4px solid #2b2d42; border-radius: 20px; padding: 10px 18px; font-size: 21px; font-weight: 900; color: #2b2d42; z-index: 50; display: none; max-width: 90vw; text-align: center; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #eef3fb; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #eef3fb; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #printBox .pbPrint { background: #2ec27e; } #printBox .pbBack { background: #3d7be0; }
  #printBox .pbTip { font-size: 20px; color: #2b2d42; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 6px; }
  @media (max-width: 700px) { .arrow { width: 54px; height: 96px; font-size: 34px; } .idea { display: none; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

<body>
<div id="app">
  <div id="top">
    <h1>📚 The Giant Puzzle Book</h1>
    <span class="idea">💡 Ben's idea: a giant puzzle book!</span>

<script>
// 📚 THE GIANT PUZZLE BOOK (💡 Ben's idea: a giant puzzle book!) A big PRINTABLE book of puzzles starring Ben's characters:
// mazes, dot-to-dots, word searches, spot the difference, math, color-by-number, logic grids, drawing, a crossword,
// secret codes, and an answer key at the back. Browse the pages, then print one page, one chapter or the whole book.
// Every maze and puzzle is made by code from a seed (so a page and its answer key always match).
// Characters are copied from their games: Robo + Dusty + King Gloop (robomovie.html), Pink Robo + Robo 2.0 (robojump13.html,
// via the Pencil Fun Shop), the cats (catcozycorner.html). Printed pages are black outlines with NO emoji.
// Save: localStorage.giantPuzzleBook = { seed, name, page, printed }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'giantPuzzleBook';
let S = { seed: 1, name: 'Ben', page: 0, printed: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!(S.seed >= 1)) S.seed = 1; if (typeof S.name !== 'string') S.name = 'Ben'; if (!(S.page >= 0)) S.page = 0;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🤖 THE CHARACTERS: copied exactly from Robo's Surprise Party (robobirthday.html), which copies Robo + Dusty from robomovie.html and the crew from robojump13.html ----------
let ctx = null, frame = 40, beatClock = 0; const beatLen = () => 25; const FLAGS = {};
// ---------- Drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
function pawPrint(x, y, r, col) {                     // a little paw print
  ellipse(x, y + r * 0.25, r * 0.55, r * 0.45, col);
  for (let i = 0; i < 4; i++) { const a = -2.4 + i * 0.53; ellipse(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.75, r * 0.22, r * 0.27, col); }
}
function starPaw(x, y, r, t, a = 1) {                 // Tiger's twinkly star paw print: golden glow + paw
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  glow(x, y, r * 3, 'rgba(255,214,90,.75)', 0.7 + Math.sin(t * 0.08 + x) * 0.2);
  pawPrint(x, y, r, '#ffe27a');
  twinkle(x + r * 0.9, y - r * 0.9, r * 0.5 * (0.7 + 0.3 * Math.sin(t * 0.15 + y)), 1);
  ctx.restore();
}
// =====================================================================
// 🤖 THE CHARACTERS (x, y = between the feet)
// Robo: same look as the Robo Jump games: white round robot, dark visor, blue eyes, blue ear pods, blue legs,
// plus his little antenna. Dusty: Robo's first friend, a tiny cleaning bot. King Gloop: PURPLE goo, gold crown.
// =====================================================================
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)
    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    const lit = pose === 'off' ? 0.25 : 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0);
    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);
      const ey = -29.5;
      if (o.dizzy) {                                   // 💫 swirly dizzy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.1;
        for (const ex of [-3, 9]) { ctx.beginPath(); for (let a = 0; a < 12; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.3, ey + Math.sin(a + t * 0.2) * a * 0.3); ctx.stroke(); }
      } else if (pose === 'happy' || o.happy) {        // ^ ^ happy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5, talk = o.mouth ? 0.85 + 0.15 * Math.sin(t * 0.6) : 1;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      if (o.mouth) { ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, -25); ctx.lineTo(1 + 2 + Math.abs(Math.sin(t * 0.5)) * 3, -25); ctx.stroke(); }
      ctx.restore();
    }
  }
  if (o.wave) {                                        // 👋 a little waving hand
    const a = Math.sin(t * 0.3) * 0.5;
    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();
  }
  ctx.restore();
  if (o.dizzy) for (let i = 0; i < 3; i++) { const a = t * 0.08 + i * 2.1; star(x + Math.cos(a) * 22 * s / 2.6, y - 118 * s / 2.6 + Math.sin(a) * 6, 7, '#ffd54f', a); }
}
// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,
// a fluffy pink duster on a springy stick, a twirly brush skirt and two little wheels.
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');                  // the twirly brush skirt
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;   // the springy duster
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// ⚙️ The GOLDEN GEAR (the heart of the Game Factory: it makes every machine go)
function drawGear(x, y, r, rot = 0, a = 1, col = '#ffd740', dark = '#ffa000') {
  if (r <= 0.5) return;
  ctx.save(); ctx.globalAlpha *= clamp(a, 0, 1);
  if (col === '#ffd740') glow(x, y, r * 2.2, 'rgba(255,215,64,.55)', 0.8 + 0.2 * Math.sin(frame * 0.08));

  for (const g of [0, 1]) { const gx = x + g * (cs * 3 + 40); ctx.beginPath(); for (const k of [1, 2]) { ctx.moveTo(gx + k * cs, y); ctx.lineTo(gx + k * cs, y + 3 * cs); ctx.moveTo(gx, y + k * cs); ctx.lineTo(gx + 3 * cs, y + k * cs); } ctx.stroke();
    for (let k = 0; k < 9; k++) { const cx = gx + (k % 3 + 0.5) * cs, cy = y + (Math.floor(k / 3) + 0.5) * cs; txt(String.fromCharCode(65 + g * 9 + k), cx - (g ? 9 : 0), cy, 20, INKC); if (g) circ(cx + 10, cy, 3.5, INKC); } }
  for (const g of [0, 1]) { const cx = x + (cs * 3 + 40) * 2 + 20 + cs * 1.5 + g * (cs * 3 + 30), cy = y + cs * 1.5, h = cs * 1.3;
    ctx.beginPath(); ctx.moveTo(cx - h, cy - h); ctx.lineTo(cx + h, cy + h); ctx.moveTo(cx + h, cy - h); ctx.lineTo(cx - h, cy + h); ctx.stroke();
    [[0, -0.6], [-0.6, 0], [0.6, 0], [0, 0.6]].forEach(([dx, dy], k) => { const lx = cx + dx * h, ly = cy + dy * h; txt(String.fromCharCode(83 + g * 4 + k), lx - (g ? (dx ? 0 : 9) : 0), ly - (g && dx ? 9 : 0), 20, INKC); if (g) circ(lx + (dx ? 0 : 10), ly + (dx ? 9 : 0), 3.5, INKC); }); }
}
function codeLines(msg, x0, y0, w, box, drawSym) {      // the coded message, with a blank under each letter
  const words = msg.split(' '), step = box + 10; let x = x0, y = y0;
  for (const wd of words) { if (x + wd.length * step > x0 + w) { x = x0; y += box + 85; }
    for (const ch of wd) { drawSym(ch, x + box / 2, y + box / 2); ctx.strokeStyle = INKC; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(x + 4, y + box + 50); ctx.lineTo(x + box - 4, y + box + 50); ctx.stroke(); x += step; }
    x += step * 0.8; }
}
function pagePigpen() {

  frameBox(40, 170, 770, 240, 18, 2.5); txt('CODE KEY', 60, 192, 18, INKC, 'left'); pigKey(72, 215, 50);

  codeLines(pigMsg(), 70, 500, 710, 52, (ch, x, y) => drawPig(ch, x, y, 40));

  pageFoot();
}

  frameBox(40, 170, 770, 150, 18, 2.5);
  for (let i = 0; i < 26; i++) { const x = 70 + (i % 13) * 56, y = 205 + Math.floor(i / 13) * 68; txt(String.fromCharCode(65 + i), x + 20, y, 24, INKC); txt(String(i + 1), x + 20, y + 30, 18, '#555'); }
  codeLines(numMsg(), 70, 370, 710, 52, (ch, x, y) => { frameBox(x - 26, y - 26, 52, 52, 10, 2.5); txt(String(ch.charCodeAt(0) - 64), x, y + 1, 24, INKC); });
  sayBox(60, 900, 730, 110, 'robo', 'Now make your OWN secret message for a friend on the back of this page!', 20);

}

<script>
// =====================================================================
// 📚 THE BOOK: chapters + pages, the page viewer, and printing
// =====================================================================
const CHAPTERS = [
  { k: 'cover', icon: '📚', name: 'Cover', who: 'robo' },
  { k: 'maze', icon: '🌀', name: 'Mazes', who: 'robo' },
  { k: 'dots', icon: '🔢', name: 'Dot-to-Dots', who: 'pink' },
  { k: 'words', icon: '🔤', name: 'Word Searches', who: 'r2' },
  { k: 'spot', icon: '🔍', name: 'Spot the Difference', who: 'rocky' },
  { k: 'math', icon: '➕', name: 'Math + Color', who: 'pink' },
  { k: 'logic', icon: '🧩', name: 'Logic Grids', who: 'mimo' },
  { k: 'draw', icon: '✏️', name: 'Draw It', who: 'august' },
  { k: 'cross', icon: '📝', name: 'Crossword', who: 'pages' },
  { k: 'code', icon: '🕵️', name: 'Secret Codes', who: 'robo' },
  { k: 'key', icon: '🎉', name: 'Answer Key', who: 'dusty' },
];
const BOOK = [];                                         // { ch, title, fn }
function addPage(ch, title, fn) { BOOK.push({ ch, title, fn }); }
addPage('cover', 'Cover', pageCover); addPage('cover', 'What is inside', pageContents);
MAZES.forEach((z, n) => addPage('maze', 'Maze ' + (n + 1), pageMaze(n)));
if (typeof PUZZLE_PAGES === 'function') PUZZLE_PAGES();
addPage('key', 'Answers: Mazes 1-4', pageMazeKey(0)); addPage('key', 'Answers: Mazes 5-8', pageMazeKey(1));
if (typeof KEY_PAGES === 'function') KEY_PAGES();
const chapOf = i => CHAPTERS.find(c => c.k === BOOK[i].ch);
const firstOf = k => BOOK.findIndex(p => p.ch === k);
function renderPage(i, sc = 1) {                         // one page on its own canvas (850 x 1100 at sc = 1)
  return makePage(() => { PAGE_NO = i + 1; CHAP_NAME = chapOf(i).name; BOOK[i].fn(); }, sc);
}
// ---------- 🖥️ the screen ----------
const $ = id => document.getElementById(id);
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.textContent = html; return e; };
let sayT = null;
function say(s) { const b = $('say'); b.textContent = s; b.style.display = 'block'; clearTimeout(sayT); sayT = setTimeout(() => { b.style.display = 'none'; }, 3200); }
let actx = null;
function beep(f = 660, d = 0.08, v = 0.05) {           // a tiny soft click sound
  try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.type = 'triangle'; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + d + 0.02); } catch (_) {}
}
const CACHE = {};
function show(i) {
  S.page = Math.max(0, Math.min(BOOK.length - 1, i)); save();
  const key = S.page + '|' + S.seed + '|' + S.name;
  if (!CACHE[key]) CACHE[key] = renderPage(S.page, 1.5);   // sharp on the iPad screen

  }

  printBox.appendChild(el('div', 'pbTip', '📚 ' + label + '  •  Tip: a grown-up can pick "Fit to page"'));

}

$('prev').onclick = () => { beep(500); show(S.page - 1); };
$('next').onclick = () => { beep(600); show(S.page + 1); };
$('prOne').onclick = () => { beep(700); openPrint([S.page], 'Page ' + (S.page + 1) + ': ' + BOOK[S.page].title); };
$('prChap').onclick = () => { beep(700); const c = chapOf(S.page); openPrint(BOOK.map((p, i) => i).filter(i => BOOK[i].ch === c.k), c.icon + ' ' + c.name); };

  else if (e.key === 'ArrowRight') $('next').click();

</script>
