<style>
  html, body { height: 100%; }
  body { margin: 0; background: #0d1233; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8eaf6; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8eaf6; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #3949ab; }
  #printBox .pbTip { font-size: 20px; color: #283593; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<canvas id="game" width="960" height="540"></canvas>
<script>
// 🌙 THE MIDNIGHT MUSEUM — a surprise museum Claude designed for Ben.
// In the daytime the exhibits sit still. Press the big 🌙 MIDNIGHT button: the lights go dark blue, the moon rises,
// and everything COMES ALIVE! Beamy the Night Guard (a friendly flashlight robot) walks around helping.
// Visit every exhibit to fill your passport and unlock a SECRET exhibit (only at midnight, in Hall 3).
// Then print souvenirs in the 🎁 Midnight Gift Shop (incl. a paper flashlight and a Night Guard badge).
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { seen: {} };
try { const s = JSON.parse(localStorage.getItem('midnightMuseum') || 'null'); if (s && s.seen) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('midnightMuseum', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0, T = 0, PRINTING = false, ptr = { x: W / 2, y: H / 2 };

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function ln(x1, y1, x2, y2) { ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill, rot = 0, inner = 0.45) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;
// colors
const INK = '#2b2440', BONE = '#f6eedb', BONE2 = '#a08c70', GLOW = '#ffe066', NAVY = '#1a2350', MOON = '#fff6c9', GOLD = '#ffc94d';
const PAST = ['#e8eaf6', '#fce4ec', '#e0f2f1', '#fff8e1', '#f3e5f5', '#e1f5fe', '#fbe9e7', '#ede7f6', '#fffde7', '#e8f5e9', '#fff3e0', '#e0f7fa', '#fffde7'];
// eyes: closed (asleep, in the daytime) or open (alive at midnight). lx/ly = where they look
function eyesN(cx, cy, s, gap, size, n, col = INK, lx = 0, ly = 0) {
  if (n < 0.5) { ctx.strokeStyle = col; ctx.lineWidth = 2.2 * s; ctx.lineCap = 'round'; for (const d of [-1, 1]) { ctx.beginPath(); ctx.arc(cx + d * gap * s, cy - size * 0.3 * s, size * 0.8 * s, 0.35, Math.PI - 0.35); ctx.stroke(); } return; }
  const bl = !PRINTING && T % 200 < 6 ? 0.15 : 1;
  for (const d of [-1, 1]) { ctx.fillStyle = col; ctx.beginPath(); ctx.ellipse(cx + d * gap * s + lx * s, cy + ly * s, size * s * 0.8, size * s * bl, 0, 0, 7); ctx.fill(); if (bl > 0.5) circle(cx + d * gap * s + lx * s + size * 0.25 * s, cy + ly * s - size * 0.35 * s, size * 0.32 * s, '#fff'); }
}
function smile(cx, cy, s, w = 7, col = INK, open = 0) {
  ctx.strokeStyle = col; ctx.lineWidth = 2.2 * s; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(cx, cy, w * s, 0.2, Math.PI - 0.2); ctx.stroke();
  if (open > 0) { ctx.fillStyle = '#7b2d1e'; ctx.beginPath(); ctx.ellipse(cx, cy + w * 0.6 * s, w * 0.8 * s, w * 0.7 * open * s, 0, 0, 7); ctx.fill(); }
}
function blush(cx, cy, s, gap = 18) { circle(cx - gap * s, cy, 4 * s, 'rgba(255,128,128,.5)'); circle(cx + gap * s, cy, 4 * s, 'rgba(255,128,128,.5)'); }
function bone(x, y, len, rot, s, col = BONE) {               // a cartoon dog-bone
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
  for (const [c, e] of [[BONE2, 2.5 * s], [col, 0]]) { rr(-len / 2 - e / 2, -5 * s - e / 2, len + e, 10 * s + e, 4 * s, c); for (const dx of [-1, 1]) for (const dy of [-1, 1]) circle(dx * len / 2, dy * 6 * s, 7 * s + e / 2, c); }
  ctx.restore();
}
function stroke2(fn, w) { ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = BONE2; ctx.lineWidth = w + 4; fn(); ctx.stroke(); ctx.strokeStyle = BONE; ctx.lineWidth = w; fn(); ctx.stroke(); }
function glowBall(x, y, r, col) { const g = ctx.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, col); g.addColorStop(1, col.replace(/[\d.]+\)$/, '0)')); ctx.fillStyle = g; ctx.fillRect(x - r, y - r, r * 2, r * 2); }
function bubble(str, x, y, size = 16, maxW = 220) {        // a speech bubble pointing down at (x, y)
  const lines = wrap(str, size, maxW), w = Math.min(maxW, Math.max(...lines.map(l => ctx.measureText(l).width))) + 24, h = lines.length * (size + 4) + 14;
  const bx = clamp(x - w / 2, 6, W - w - 6), by = y - h - 12;
  rr(bx, by, w, h, 12, '#fff'); tri(x - 8, by + h - 1, x + 8, by + h - 1, x, by + h + 11, '#fff');
  lines.forEach((l, i) => text(l, bx + w / 2, by + 10 + size + i * (size + 4) - 4, size, INK, 'center', false));
}
</script>
<script>

let caveP = 0;
function fig(x, y, s, k) {                                   // a cave-painting stick person (k = dance move)
  circle(x, y - 26 * s, 6 * s, ctx.strokeStyle); ln(x, y - 20 * s, x, y);
  ln(x, y - 14 * s, x - 12 * s, y - 14 * s - k * 12 * s); ln(x, y - 14 * s, x + 12 * s, y - 14 * s + k * 12 * s);
  ln(x, y, x - 8 * s, y + 16 * s); ln(x, y, x + 8 * s, y + 16 * s);
}
const EX = [
  { id: 'rex', name: 'Rexy the T-Rex', e: '🦖', act: 'THROW THE BONE!', found: 'Dino Valley, under a giant puddle',

        stroke2(() => { ctx.beginPath(); ctx.moveTo(cx + hx * s, y + 14 * s); ctx.lineTo(cx + (hx - 12) * s + st, y + 50 * s); ctx.lineTo(cx + (hx + 4) * s + st, y + 84 * s); ctx.lineTo(cx + (hx + 18) * s + st, y + 90 * s); }, 8 * s); }
      stroke2(() => { ctx.beginPath(); ctx.moveTo(cx - 24 * s, y + 4 * s); ctx.quadraticCurveTo(cx, y - 22 * s, cx + 34 * s, y - 40 * s); }, 8 * s);
      for (let i = 0; i < 5; i++) { const rx = cx - 18 * s + i * 10 * s, top = y - i * 6 * s; stroke2(() => { ctx.beginPath(); ctx.moveTo(rx, top); ctx.quadraticCurveTo(rx - 8 * s, top + 16 * s, rx + 2 * s, top + (30 - i * 2) * s); }, 3.5 * s); }
      const aw = n * Math.sin(T * 0.3) * 5 * s; stroke2(() => { ctx.beginPath(); ctx.moveTo(cx + 24 * s, y - 24 * s); ctx.lineTo(cx + 36 * s, y - 14 * s); ctx.lineTo(cx + 42 * s, y - 20 * s + aw); }, 4 * s);
      ctx.save(); ctx.translate(cx + 48 * s, y - 60 * s + nod);
      const jaw = a > 0 ? Math.abs(Math.sin(a * 20)) * 8 * s : 0;
      rr(-14 * s, 6 * s + jaw, 58 * s, 14 * s, 6 * s, BONE2); rr(-12 * s, 7.5 * s + jaw, 54 * s, 11 * s, 5 * s, BONE);
      rr(-22 * s, -20 * s, 70 * s, 32 * s, 14 * s, BONE2); rr(-20 * s, -18 * s, 66 * s, 28 * s, 12 * s, BONE);
      for (let k = 0; k < 5; k++) tri(-2 * s + k * 9 * s, 9 * s, 4 * s + k * 9 * s, 9 * s, 1 * s + k * 9 * s, 15 * s, '#fff');
      circle(0, -5 * s, 8 * s, '#5d4037'); circle(36 * s, -10 * s, 2.5 * s, '#5d4037');
      if (n >= 0.5) { glowBall(0, -5 * s, 16 * s, 'rgba(255,224,102,.8)'); circle(0, -5 * s, 6 * s, GLOW); circle(2 * s, -5 * s, 3 * s, INK); }
      ctx.restore();
      if (a > 0) { bone(cx + 70 * s - Math.sin(a * Math.PI) * 170 * s, cy - 70 * s - Math.sin(a * Math.PI) * 40 * s, 30 * s, a * 20, s); text('FETCH!!', cx, cy - 104 * s, 24 * s, '#fff'); } } },
  { id: 'whale', name: 'Wally the Whale', e: '🐋', act: 'SING A SONG!', found: 'Hanging from the ceiling of Hall 1',
    facts: ['He is the BIGGEST thing in the whole museum.', 'At midnight he swims through the air like it is water.', 'His songs are so loud they make the windows hum.'],

    draw: (cx, cy, s, a, n) => { const bob = Math.sin(T * 0.05) * 8 * s * n - (a > 0 ? Math.sin(a * Math.PI) * 20 * s : 0), y = cy - 20 * s + bob, flap = Math.sin(T * 0.12) * n * 0.35;
      ctx.globalAlpha = 1 - n * 0.85; ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 2 * s; ln(cx - 40 * s, y - 16 * s, cx - 40 * s, cy - 140 * s); ln(cx + 40 * s, y - 14 * s, cx + 40 * s, cy - 140 * s); ctx.globalAlpha = 1;
      if (n > 0) { ctx.globalAlpha = 0.5 * n; ctx.fillStyle = '#4fc3f7'; ctx.beginPath(); ctx.ellipse(cx + 8 * s, y - 2 * s, 92 * s, 36 * s, 0, 0, 7); ctx.fill(); ctx.globalAlpha = 1; }
      ctx.save(); ctx.translate(cx - 80 * s, y); ctx.rotate(flap); stroke2(() => { ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-16 * s, 0); ctx.quadraticCurveTo(-24 * s, -14 * s, -34 * s, -22 * s); ctx.moveTo(-16 * s, 0); ctx.quadraticCurveTo(-24 * s, 14 * s, -34 * s, 22 * s); }, 6 * s); ctx.restore();

      for (let i = 0; i < 6; i++) { const rx = cx - 52 * s + i * 17 * s, top = y - 12 * s - Math.sin(i / 5 * Math.PI) * 7 * s; stroke2(() => { ctx.beginPath(); ctx.moveTo(rx, top); ctx.quadraticCurveTo(rx - 10 * s, top + 18 * s, rx + 2 * s, top + (32 - Math.abs(i - 2.5) * 3) * s); }, 4 * s); }
      stroke2(() => { ctx.beginPath(); ctx.moveTo(cx + 22 * s, y + 14 * s); ctx.lineTo(cx + 4 * s, y + 36 * s + flap * 20 * s); }, 6 * s);
      rr(cx + 38 * s, y - 28 * s, 62 * s, 44 * s, 20 * s, BONE2); rr(cx + 40 * s, y - 26 * s, 58 * s, 40 * s, 18 * s, BONE);
      eyesN(cx + 66 * s, y - 10 * s, s, 11, 5, n); smile(cx + 68 * s, y + 1 * s, s, 8, INK, a > 0 ? 1 : 0);
      if (n > 0.5) for (let i = 0; i < 3; i++) text(i % 2 ? '♫' : '♪', cx + (i * 40 - 40) * s, y - 40 * s - ((T * 0.5 + i * 15) % 40) * s, 18 * s, '#b3e5fc', 'center', false);
      if (a > 0) { for (let i = 0; i < 6; i++) text(i % 2 ? '♫' : '♪', cx - 90 * s + i * 36 * s, y - 50 * s - ((a * 160 + i * 20) % 60) * s, 24 * s, ['#fff59d', '#b3e5fc', '#f8bbd0'][i % 3]); text('LA LA LAAA!', cx, cy - 100 * s, 24 * s, '#fff'); } } },
  { id: 'mummy', name: 'Mummy Cat Mittens', e: '🐱', act: 'UNWRAP A BIT!', found: 'A teeny-tiny pyramid',
    facts: ['She is wrapped up like a burrito!', 'She napped for 3,000 years. That is the longest cat nap EVER.', 'At midnight she chases her own loose bandage.'],
    says: ['Mew! I am a burrito!', 'Where is my yarn?', 'Purrrr...'],

      const tw = n * Math.sin(T * 0.15) * 20 * s + (a > 0 ? Math.sin(a * 30) * 22 * s : 0), tail = () => { ctx.beginPath(); ctx.moveTo(x + 26 * s, y + 70 * s); ctx.bezierCurveTo(x + 70 * s, y + 84 * s, x + 74 * s + tw, y + 40 * s, x + 60 * s + tw, y + 6 * s); };

      ctx.save(); ctx.translate(x, y + 84 * s); ctx.rotate(sway); ctx.translate(-x, -(y + 84 * s));
