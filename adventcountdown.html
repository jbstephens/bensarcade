<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎄 Countdown to Christmas</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #top h1 { margin: 0; font-size: clamp(26px, 3.4vw, 44px); color: #fff; -webkit-text-stroke: 2px #2a1d4a; text-shadow: 3px 3px 0 #2a1d4a; letter-spacing: 1px; text-align: center; }

  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1d4a; }
  .b1 { background: #a5f2a5; } .b2 { background: #b3e5fc; } .b3 { background: #d1b8ff; } .b4 { background: #ffccbc; } .b5 { background: #fff0c8; } .b6 { background: #ffb74d; } .b7 { background: #ff9ecb; }

  .panel { position: fixed; inset: 0; background: rgba(20, 16, 50, .72); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .panel.on { display: flex; }

  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding-top: 4px; }
  .thumb:active { transform: scale(.96); }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(56vh, 640px); width: auto; max-width: 100%; border: 4px solid #2a1d4a; border-radius: 8px; background: #fff; }

  #printAll { display: none; }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }

  .chip.sel { background: #ffd740; outline: 4px solid #ff4081; outline-offset: 1px; }

  #cal { width: 100%; height: auto; max-height: 74vh; display: block; border: 6px solid #2a1d4a; border-radius: 22px; background: #10224a; }

  .door .lid { transition: transform .5s cubic-bezier(.4, 1.5, .5, 1); transform-box: fill-box; transform-origin: 0% 50%; }
  .door:active .lid { transform: scale(.96); }

  #dArt svg { width: min(60vw, 300px); height: auto; display: block; }
  #dLine { font-size: 24px; max-width: 520px; }
  #bPeek.on { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <h1>🎄 COUNTDOWN TO CHRISTMAS</h1>
    <div id="bubble">🎅 Tap a door to open it!</div>
  </div>
  <div id="calBox"><svg id="cal" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>

    <button class="btn b2" id="bPeek">👀 Peek mode: OFF</button>
    <button class="btn b5 hide" id="bShut">🚪 Close all doors</button>
    <button class="btn b1" id="bPrint">🖨️ Print a paper calendar</button>
    <button class="btn b3" id="bSay">🔊 Read it again</button>
  </div>
</div>
<div id="doorPanel" class="panel"><div class="card" id="doorCard">
  <h2 id="dTitle">Day 1</h2>
  <div id="dArt"></div>
  <p class="hint" id="dLine"></p>
  <div class="row"><button class="btn b3" id="dSay">🔊 Say it again</button><button class="btn b1" data-close="1">✅ Close the door</button></div>
</div></div>

  const can = peeking() || canOpenReal(d), isToday = INDEC && d === DAY && !open;
  let s = '<g class="door' + (can ? '' : ' locked') + (isToday ? ' today' : '') + '" data-d="' + d + '">';
  const rc = dark(DOOR_COLS[(slot * 7 + 2) % 6], .2);   // every door is a little house with a snowy roof
  s += P(poly([x - 12, y + 2, x + w / 2, y - 30, x + w + 12, y + 2]), vshade(rc), OL, 2.4) + P('M' + (x - 12) + ' ' + (y + 2) + ' L' + (x + w / 2) + ' ' + (y - 30) + ' L' + (x + w + 12) + ' ' + (y + 2) + ' Q' + (x + w / 2) + ' ' + (y - 14) + ' ' + (x - 12) + ' ' + (y + 2) + ' Z', '#fff', OL, 1.6);
  if (slot % 3 === 1) s += R(x + w - 26, y - 34, 14, 20, 2, vshade('#8d6e63'), OL, 1.8);
  s += R(x - 5, y - 2, w + 10, h + 7, 10, '#2a1d4a', 0) + E(x + w / 2, y + h + 6, w / 2 + 14, 6, '#fff', OL, 1.4);
  if (open) {
    s += R(x, y, w, h, 10, rad([[0, '#fff8d6'], [1, '#ffcc80']]), OL, 2.4) + insideArt(d, x + w / 2 + 8, y + h / 2 + 4, h * .82);
    s += P('M' + x + ' ' + y + ' L' + (x - 26) + ' ' + (y + 12) + ' L' + (x - 26) + ' ' + (y + h - 12) + ' L' + x + ' ' + (y + h) + ' Z', vshade(dark(col, .2)), OL, 2.2);
    s += C(x + w - 16, y + 16, 12, '#fff', OL, 1.6) + T(x + w - 16, y + 21, String(d), 14, OL);
  } else {
    s += '<g class="lid">' + R(x, y, w, h, 10, vshade(col), OL, 2.6) + R(x + 8, y + 8, w - 16, h - 16, 7, 0, lite(col, .45), 2);
    s += L('M' + (x + w / 2) + ' ' + y + ' L' + (x + w / 2) + ' ' + (y + h) + ' M' + x + ' ' + (y + h / 2) + ' L' + (x + w) + ' ' + (y + h / 2), '#ffd740', 6) + P(starD(x + w / 2, y + h / 2, 10), ball('#ffd740'), OL, 1.4);
    s += C(x + w / 2, y + h / 2, 30, '#fff', '#2a1d4a', 3, ' class="ring"') + BT(x + w / 2, y + h / 2 + 13, String(d), 36, col);

    s += '</g>';

}
function drawCal() {
  beginArt(false);

  const r = rng(5); for (let i = 0; i < 26; i++) body += '<g class="fall" style="animation-duration:' + (7 + r() * 8).toFixed(1) + 's;animation-delay:-' + (r() * 12).toFixed(1) + 's">' + C(r() * 1000, 0, 2 + r() * 3, '#fff', 0) + '</g>';

// ---------- tapping doors ----------
let curDoor = 0;
function msg() {

function tapDoor(d) {

// 🖨️ PRINTABLE PAPER CALENDAR (3 pages): how-to steps, the village door page, the inside page

const HOUSE_COLS = ['#ef5350', '#66bb6a', '#42a5f5', '#ffca28', '#ab47bc', '#ff7043'];
function pHouse(h) { const c = h % 4, r = Math.floor(h / 4); return [22 + c * 190, 140 + r * 265]; }
function pSlot(s) { const [x0, y0] = pHouse(Math.floor(s / 2)), cx = x0 + 88; return s % 2 ? [cx - 56, y0 + 168, 112, 82] : [cx - 56, y0 + 76, 112, 80]; }
const cornerMarks = () => CUT('M30 150 L30 130 L50 130 M770 150 L770 130 L750 130 M30 920 L30 940 L50 940 M770 920 L770 940 L750 940');
function housesPage() {
  let s = '';

    s += P('M' + (x0 - 6) + ' ' + (y0 + 66) + ' L' + (x0 + 88) + ' ' + (y0 + 6) + ' L' + (x0 + 182) + ' ' + (y0 + 66) + ' Q' + (x0 + 170) + ' ' + (y0 + 74) + ' ' + (x0 + 160) + ' ' + (y0 + 64) +
      ' Q' + (x0 + 88) + ' ' + (y0 + 18) + ' ' + (x0 + 16) + ' ' + (y0 + 64) + ' Q' + (x0 + 6) + ' ' + (y0 + 74) + ' ' + (x0 - 6) + ' ' + (y0 + 66) + ' Z', '#fff', OL, 2);
    s += R(x0, y0 + 64, 176, 194, 4, vshade(lite(col, .35)), OL, 2.6) + P(starD(x0 + 88, y0 + 40, 9), ball('#ffd740'), OL, 1.4);
    s += E(x0 + 88, y0 + 258, 96, 9, '#fff', OL, 2);

}
function topDoor(s) {
  const [x, y, w, h] = pSlot(s), d = ORDER[s], col = HOUSE_COLS[(d * 5) % 6];
  let o = R(x, y, w, h, 0, vshade(lite(col, .1)), 0) + R(x + 9, y + 9, w - 18, h - 18, 6, 0, lite(col, .55), 2);

}
function pageVillage() {
  let s = banner('PAGE 2: THE VILLAGE (this page goes on TOP)', 'COUNTDOWN TO CHRISTMAS', '#e53935', 40) + housesPage();

  const r = rng(3);

function miniSheet(x, y, w, h, label, inner) { return R(x, y, w, h, 4, '#fff', OL, 2.4) + (inner || '') + T(x + w / 2, y + h + 18, label, 14, OL); }

  } else {

}
const STEPS = ['Print page 2 (the village) and page 3 (the inside).', 'Color the houses on page 2 with crayons or pencils.',
