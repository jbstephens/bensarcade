<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎬 The Movie Factory</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; color: #2a1a3a; overflow: hidden;
    user-select: none; -webkit-user-select: none; background: linear-gradient(135deg, #3b1d6e, #7b2c8f 55%, #d84a6b); }
  input { font: inherit; user-select: text; -webkit-user-select: text; }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 6px; padding: 6px 8px 8px; }
  #top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #top h1 { margin: 0; font-size: clamp(20px, 2.4vw, 32px); color: #ffd740; -webkit-text-stroke: 1.5px #2a1a3a; text-shadow: 3px 3px 0 #2a1a3a; white-space: nowrap; }
  #title { font-size: 20px; padding: 6px 12px; border: 4px solid #2a1a3a; border-radius: 14px; width: min(280px, 60vw); background: #fffbe8; text-align: center; font-weight: bold; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #2a1a3a; border-radius: 16px; background: #ffe082; padding: 6px 12px;
    cursor: pointer; box-shadow: 0 5px 0 #2a1a3a; color: #222; min-height: 52px; touch-action: manipulation; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1a3a; }
  .btn:disabled { opacity: .45; }
  .b1 { background: #a5f2a5; } .b2 { background: #b3e5fc; } .b3 { background: #d1b8ff; } .b4 { background: #ffccbc; } .b5 { background: #fff0c8; } .b6 { background: #ffb74d; } .b7 { background: #ff9ecb; }
  .play { background: linear-gradient(#ff5252, #d50000); color: #fff; font-size: 22px; text-shadow: 2px 2px 0 #2a1a3a; }
  #midRow { display: flex; gap: 8px; align-items: center; }
  #scenes { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: center; overflow-x: auto; padding: 2px 2px 6px; }
  .sc { flex: none; width: 116px; background: #222; border: 4px solid #2a1a3a; border-radius: 10px; padding: 3px; cursor: pointer; position: relative; box-shadow: 0 4px 0 #2a1a3a; }
  .sc svg { width: 100%; height: auto; display: block; border-radius: 4px; pointer-events: none; }
  .sc b { position: absolute; left: 4px; top: 2px; background: #ffd740; border: 2px solid #2a1a3a; border-radius: 8px; padding: 0 6px; font-size: 14px; }
  .sc.sel { outline: 5px solid #ffd740; outline-offset: 1px; }
  .sc .film { position: absolute; left: 0; right: 0; height: 5px; background: repeating-linear-gradient(90deg, #fff 0 6px, transparent 6px 12px); opacity: .55; }
  #main { flex: 1; min-height: 0; display: flex; gap: 8px; }
  #stageBox { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; align-items: center; justify-content: flex-start; }
  #stage { width: 100%; max-height: 100%; aspect-ratio: 1000 / 560; display: block; border: 6px solid #2a1a3a; border-radius: 14px; background: #8fd3ff; touch-action: none; }
  #stageWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #stageWrap svg { max-width: 100%; height: auto; max-height: 100%; width: auto; }
  #sceneBar { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; color: #fff; font-weight: bold; font-size: 17px; }

  .tab.sel { background: #ff7043; color: #fff; text-shadow: 1px 1px 0 #2a1a3a; }

  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
  .pick { font: inherit; background: #fff; border: 3px solid #2a1a3a; border-radius: 12px; padding: 3px; cursor: pointer; font-size: 14px; font-weight: bold; text-align: center; touch-action: none; box-shadow: 0 3px 0 #2a1a3a; }
  .pick svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .pick.sel { background: #ffd740; outline: 4px solid #ff4081; }
  .pick.big { font-size: 17px; min-height: 56px; touch-action: manipulation; }
  .lab { margin: 2px 0 0; font-weight: bold; font-size: 17px; text-align: center; }
  .tin { font-size: 19px; padding: 6px 10px; border: 3px solid #2a1a3a; border-radius: 12px; width: 100%; background: #fff; }
  .row { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .hide { display: none !important; }
  .actor { cursor: grab; }
  #ghost { position: fixed; width: 90px; pointer-events: none; z-index: 80; opacity: .85; display: none; }

  .card h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.2vw, 36px); }
  .hint { margin: 0; text-align: center; font-size: 19px; font-weight: bold; }
  #mvGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .mv { background: #fff; border: 5px solid #2a1a3a; border-radius: 16px; padding: 6px; cursor: pointer; position: relative; box-shadow: 0 5px 0 #ff7043; text-align: center; font-weight: bold; font-size: 17px; }
  .mv svg { width: 100%; height: auto; display: block; border-radius: 8px; pointer-events: none; }
  .mv .x { position: absolute; top: -12px; right: -10px; font-size: 15px; min-height: 0; padding: 3px 8px; border-width: 3px; box-shadow: 0 3px 0 #2a1a3a; background: #ffccbc; }

  /* 🎭 theater */
  #theater { position: fixed; inset: 0; z-index: 60; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px;

  #theater.on { display: flex; }
  body.th .tpMore { display: none !important; }
  #marquee { color: #ffd740; font-size: clamp(20px, 3vw, 34px); font-weight: bold; text-shadow: 0 0 10px #ff9100, 2px 2px 0 #000; letter-spacing: 2px; text-align: center; }
  #marquee i { font-style: normal; display: inline-block; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #screenBox { position: relative; width: min(94vw, calc((100vh - 170px) * 1.786)); aspect-ratio: 1000 / 560; border: 10px solid #c9a227; border-radius: 10px;

  #screen { width: 100%; height: 100%; display: block; }
  .curtain { position: absolute; top: 0; bottom: 0; width: 51%; z-index: 3; transition: transform 1.4s ease-in-out;

  #curL { left: 0; transform-origin: left; } #curR { right: 0; transform-origin: right; }
  #screenBox.open #curL { transform: translateX(-96%) scaleX(.6); } #screenBox.open #curR { transform: translateX(96%) scaleX(.6); }

  .thumb b { font-size: 16px; text-align: center; padding-top: 4px; }
  #prBig { display: flex; justify-content: center; }

  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }

  <div id="top">

  <div id="main">
    <div id="stageBox">
      <div id="stageWrap"><svg id="stage" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
      <div id="sceneBar"></div>
    </div>
    <div id="tools">
      <div id="tabs"></div>
      <div id="bubble">🎬 Welcome to the Movie Factory!</div>
      <div id="pane"></div>
    </div>
  </div>
</div>
<div id="ghost"></div>
<div id="theater">
  <div id="marquee"><i>★</i> NOW SHOWING <i>★</i></div>
  <div id="screenBox"><svg id="screen" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg>

    <button class="btn b4" id="thStop">⬅️ Back to the factory</button>
  </div>
  <div id="seats"></div>
</div>
<div id="mvPanel" class="panel"><div class="card">
  <h2>📂 My Movies</h2>
  <p class="hint" id="mvHint">Tap a movie to open it. You can keep up to 8 movies!</p>
  <div id="mvGrid"></div>
  <div class="row"><button class="btn b6" id="mvExample">🍕 Get the example movie</button><button class="btn b4" data-close="1">❌ Close</button></div>
</div></div>

  $('prGrid').innerHTML = shownPages().map(i => '<div class="thumb" data-i="' + i + '">' + pageSVG(PAGES[i]) + '<b>' + esc(PAGES[i].name) + '</b></div>').join('');
}
function openPrints(i) {
  openPanel('prPanel'); colorBtns(); $('prView').classList.add('hide'); $('prGrid').classList.remove('hide'); $('prHint').classList.remove('hide'); prCur = -1; renderPrints();
  if (i !== undefined) previewPage(i);
}
function previewPage(i) {
  prCur = i; $('prBig').innerHTML = pageSVG(PAGES[i]); $('prHow').textContent = PAGES[i].how || '';
  $('prGrid').classList.add('hide'); $('prHint').classList.add('hide'); $('prView').classList.remove('hide'); $('prPanel').querySelector('.card').scrollTop = 0;
}
function printList(list) {
  $('printAll').innerHTML = list.map(i => pageSVG(PAGES[i])).join('');
  if (window.onPrinted) onPrinted(list);
  toast('🖨️ Printing ' + list.length + (list.length > 1 ? ' pages!' : ' page!'));
  setTimeout(() => { try { window.print(); } catch (_) {} }, 80);
}
function initPrints() {
  document.body.insertAdjacentHTML('beforeend', printPanelHTML()); loadColor();
  $('prBW').onclick = () => setColor(false); $('prCol').onclick = () => setColor(true);
  $('prGrid').onclick = e => { const t = e.target.closest('.thumb'); if (t) { previewPage(+t.dataset.i); blip(700, 0, .1); } };
  $('prPrint').onclick = () => printList([prCur]);
  $('prAll').onclick = () => printList(shownPages());
  $('prBack').onclick = () => openPrints();
  document.addEventListener('click', e => { const c = e.target.closest('[data-close]'); if (c) closePanels(); const p = e.target.classList && e.target.classList.contains('panel'); if (p) closePanels(); });
  window.addEventListener('afterprint', () => { $('printAll').innerHTML = ''; });
  window.addEventListener('keydown', e => { if (e.key === 'Escape' && document.querySelector('.panel.on')) closePanels(); });
}
