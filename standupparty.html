<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎉 Stand-Up Party Printables</title>
<script src="touchpad.js?v=11"></script>
<style>

  #app { min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 10px 12px 28px; gap: 12px; }

    letter-spacing: 1px; text-align: center; }
  #bubble { width: 100%; max-width: 820px; background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 22px; padding: 8px 16px;
    font-size: clamp(18px, 2.2vw, 24px); font-weight: bold; text-align: center; }

  .set small { font-size: 18px; }
  .cafe { background: #ffd6a5; } .parade { background: #b9f6ca; } .band { background: #d1b8ff; } .all { background: #fff59d; }

  #view { width: 100%; max-width: 1200px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }

    #printArea { display: block !important; }

  }
</style>
</head>
<body>
<div id="app">

  <div id="menu">

    <button class="btn set parade" data-set="parade"><span id="pic-parade"></span>🤖 Copier Chain Parade<small id="n-parade"></small></button>
    <button class="btn set band" data-set="band"><span id="pic-band"></span>🎸 Robo Rock Band<small id="n-band"></small></button>
  </div>
  <button class="btn all" id="bAll">🖨️ Print ALL</button>
  <div id="view" class="hide">
    <h2 id="vTitle"></h2>
    <div class="bar">
      <button class="btn" id="bBack" style="background:#b3e5fc">⬅️ Back</button>
      <button class="btn" id="bPrint" style="background:#a5f2a5">🖨️ Print</button>
    </div>
    <div id="sheets"></div>
  </div>
</div>
<div id="big" class="hide"><div class="holder" id="bigHold"></div><button class="btn" id="bBigClose" style="background:#ffccbc">❌ Close</button></div>
<div id="toast"></div>
<div id="printArea"></div>

function ticket(x, y, w, h, i) {

  let s = R(x, y, w, h, 14, lin([[0, lite(c, .5)], [1, c]]), 0) + R(x + 8, y + 8, w - 66, h - 16, 10, 0, '#fff', 2.4);
  s += L('M' + (x + w - 50) + ' ' + (y + 6) + ' L' + (x + w - 50) + ' ' + (y + h - 6), dark(c, .35), 2);
  s += BT(x + (w - 50) / 2, y + 40, 'ADMIT ONE', 26, '#fff') + T(x + (w - 50) / 2, y + 66, 'ROBO ROCK BAND', 18, '#311b92') + T(x + (w - 50) / 2, y + 88, 'FRONT ROW', 16, dark(c, .55));
  s += T(x + (w - 50) / 2, y + 111, 'Admit One • Robo Rock Band • Front Row', 8.2, '#4a148c');
  s += '<g transform="rotate(-90 ' + (x + w - 25) + ' ' + (y + h / 2) + ')">' + T(x + w - 25, y + h / 2 + 6, 'SEAT A' + (i + 1), 15, '#311b92') + '</g>';
  s += P(starD(x + 24, y + 84, 9), ball('#fff59d'), OL, 1.2) + P(starD(x + w - 82, y + 84, 9), ball('#fff59d'), OL, 1.2);
  return s + CUTL('M' + (x + 14) + ' ' + y + ' L' + (x + w - 14) + ' ' + y + ' Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + 14) + ' L' + (x + w) + ' ' + (y + h - 14) + ' Q' + (x + w) + ' ' + (y + h) + ' ' + (x + w - 14) + ' ' + (y + h) +
    ' L' + (x + 14) + ' ' + (y + h) + ' Q' + x + ' ' + (y + h) + ' ' + x + ' ' + (y + h - 14) + ' L' + x + ' ' + (y + 14) + ' Q' + x + ' ' + y + ' ' + (x + 14) + ' ' + y);
}
function setListArt(cx, y0, w, h) {
  const x0 = cx - w / 2; let s = R(x0, y0, w, h, 0, lin([[0, '#212121'], [1, '#424242']]), 0) + R(x0 + 10, y0 + 8, w - 20, h - 16, 12, 0, '#ffd740', 3);
  s += BT(cx, y0 + 44, 'SET LIST', 34, '#ffd740') + bolt(cx - 120, y0 + 32, 1.5, '#ff80ab') + bolt(cx + 120, y0 + 32, 1.5, '#ff80ab');
  SONGS.forEach((t, i) => { const yy = y0 + 76 + i * 21; s += T(cx - 110, yy, (i + 1) + '.', 17, '#69f0ae', 'start') + T(cx - 84, yy, t, 17, '#ffffff', 'start'); });
  return s + noteMark(x0 + 44, y0 + 150, '#40c4ff', 1.2) + noteMark(x0 + w - 56, y0 + 150, '#ff80ab', 1.2);
}
function bandTickets() {
  let s = '';
  for (let i = 0; i < 6; i++) s += ticket(30 + (i % 3) * 250, 190 + Math.floor(i / 3) * 144, 240, 130, i);
  s += tent(150, 484, 500, 190, 64, 22, { bg: '#424242', art: setListArt, base: (cx, y0) => T(cx, y0 + 38, 'SET LIST  -  BOTTOM (the band can read the back!)', 15, '#424242') });
  return sheet('ROBO ROCK BAND  -  PAGE 3 OF 3  -  TICKETS + SET LIST', 'TICKETS + SET LIST', BAND_COL,
    [['Cut out the', '6 tickets.'], ['Give one to each', 'person in your family!'], ['Fold the set list', 'into a triangle.'], ['Stand it by the', 'stage. ROCK ON!']], s);
}
const BAND_PAGES = [['The fold-up stage', bandStage], ['The band (5 + a sign)', bandPeople], ['Tickets + set list', bandTickets]];
// =====================================================================
// 🖥️ THE SCREEN: a menu with 3 sets, a preview of each set's pages, and 🖨️ print buttons (print CSS shows only #printArea)
// =====================================================================
const SETS = {
  cafe: { name: '🐱 Cat Café', pages: CAFE_PAGES, say: '🐱 The Cat Café! Six cats, a counter, tables, food, a menu and coins to pay with!' },
  parade: { name: '🤖 Copier Chain Parade', pages: PARADE_PAGES, say: '🤖 All 15 copiers in a line, with Robo in front and a big banner!' },
  band: { name: '🎸 Robo Rock Band', pages: BAND_PAGES, say: '🎸 A rock stage, the band, tickets for your family and a set list. ROCK ON!' },
};
const ORDER = ['cafe', 'parade', 'band'];
let cur = null;
function pageSVG(build) { beginArt(false); return build(); }
function picSVG(body) { return '<svg class="pic" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 130"><defs>' + DEFS.filter(d => !/stop-opacity/.test(d)).join('') + '</defs>' + body + '</svg>'; }
function menuPics() {
  beginArt(false); $('pic-cafe').innerHTML = picSVG(R(0, 0, 240, 130, 18, '#fff3e0', 0) + drawIn(CATS.sammy, 60, 66, 100) + drawIn(CATS.mimo, 180, 66, 100) + drawIn(fishCake, 120, 92, 50));
  beginArt(false); $('pic-parade').innerHTML = picSVG(R(0, 0, 240, 130, 18, '#e0f2f1', 0) + drawIn(() => niceNega(), 46, 66, 96) + drawIn(mirrorRobo, 120, 66, 96) + drawIn(glitchRobo, 196, 66, 92));
  beginArt(false); $('pic-band').innerHTML = picSVG(R(0, 0, 240, 130, 18, '#311b92', 0) + drawIn(BAND.robo, 70, 66, 104) + drawIn(BAND.pip, 172, 66, 100));
  ORDER.forEach(k => { $('n-' + k).textContent = SETS[k].pages.length + ' pages to print'; });
}
function hasTrophy(id) { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}')[id]; } catch (_) { return false; } }
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), ms || 3000); }
function openSet(k) {
  cur = k; const S = SETS[k];
  $('menu').classList.add('hide'); $('bAll').classList.add('hide'); $('view').classList.remove('hide');
  $('vTitle').textContent = S.name; $('bPrint').textContent = '🖨️ Print ' + S.name.replace(/^\S+\s/, '');
  $('bubble').textContent = S.say + ' Tap a page to see it big.';
  $('sheets').innerHTML = S.pages.map((p, i) => '<div class="sheet" data-i="' + i + '">' + pageSVG(p[1]) + '<b>Page ' + (i + 1) + ': ' + p[0] + '</b></div>').join('');
  window.scrollTo(0, 0);
}
function backToMenu() {
  cur = null; $('view').classList.add('hide'); $('menu').classList.remove('hide'); $('bAll').classList.remove('hide'); $('sheets').innerHTML = '';
  $('bubble').textContent = '✂️ Pick a party set! Print it in color, then cut, fold and tape your own stand-ups! 🐱🤖🎸';
}
function showBig(i) { $('bigHold').innerHTML = pageSVG(SETS[cur].pages[i][1]); $('big').classList.remove('hide'); }
function closeBig() { $('big').classList.add('hide'); $('bigHold').innerHTML = ''; }
// fills #printArea with one set ('cafe' / 'parade' / 'band') or 'all'; returns the page count
function preparePrint(which) {
  const keys = which === 'all' ? ORDER : [which];
  const list = []; keys.forEach(k => SETS[k].pages.forEach(p => list.push(p[1])));
  $('printArea').innerHTML = list.map(pageSVG).join('');
  return list.length;
}
function printSet(which) {
  const nPages = preparePrint(which);
  toast('🖨️ Printing ' + nPages + ' pages in COLOR!');
  try { if (!hasTrophy('standupParty')) { trophy('standupParty'); setTimeout(() => toast('🏆 Trophy: Party Planner!', 3500), 1400); } } catch (_) {}
  setTimeout(() => { try { window.print(); } catch (_) {} }, 150);
}
// ---------- start ----------
menuPics();
document.querySelectorAll('.set').forEach(b => { b.onclick = () => openSet(b.dataset.set); });
$('bAll').onclick = () => printSet('all');
$('bPrint').onclick = () => { if (cur) printSet(cur); };
$('bBack').onclick = backToMenu;
$('bBigClose').onclick = closeBig;
$('big').onclick = e => { if (e.target.id === 'big') closeBig(); };
$('sheets').onclick = e => { const t = e.target.closest('.sheet'); if (t) showBig(+t.dataset.i); };
window.addEventListener('beforeprint', () => { if (!$('printArea').innerHTML) preparePrint(cur || 'all'); });
window.addEventListener('afterprint', () => { $('printArea').innerHTML = ''; });
window.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!$('big').classList.contains('hide')) closeBig(); else if (cur) backToMenu(); } });
</script>
</body>
</html>
