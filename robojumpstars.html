function speak(line) {                                   // the browser's voice reads it out loud
  try {
    if (window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined') {
      const u = new SpeechSynthesisUtterance(line); u.rate = 0.95; u.pitch = 0.6; u.volume = 1;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }
  } catch (_) {}
}
// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);

const isSolid = ch => ch === '#' || ch === '=';
const tileAt = (c, r) => (c < 0 || c >= cols) ? '#' : r >= ROWS ? ' ' : r < 0 ? ((isSolid(map[0][c])) ? map[0][c] : ' ') : map[r][c];
const solidAt = (c, r) => isSolid(tileAt(c, r));
const center = (c, r) => ({ x: c * T + T / 2, y: r * T + T / 2 });
const hash = n => { const s = Math.sin(n * 12.9898) * 43758.5453; return s - Math.floor(s); };   // steady "random" for drawing
function clearObjects() {
  coins = []; minis = []; enemies = []; springs = []; flags = []; hearts = []; signs = []; movers = []; zappers = []; zones = []; meteors = []; craters = [];
  goal = null; statue = null; pals = []; waves = []; lasers = []; shots = []; marks = [];
}
function buildLevel(w) {
  const WMAX = 400;
  map = []; for (let r = 0; r < ROWS; r++) map.push(new Array(WMAX).fill(' '));
  clearObjects();
  let x = 0, gy = 11, ii = 0, si = 0;
  const set = (c, r, ch) => { if (r >= 0 && r < ROWS && c >= 0 && c < WMAX) map[r][c] = ch; };
  const ground = (n, coinsToo) => {
    for (let i = 0; i < n; i++, x++) {
      for (let r = gy; r < ROWS; r++) set(x, r, '#');
      if (coinsToo) coins.push(Object.assign(center(x, gy - 2), { got: false }));
    }
  };
  const had = (save.stars[stageId] || []);
  const addStar = (px, py) => { const k = si++; minis.push({ x: px, y: py, k, st: had[k] ? 'home' : 'stuck', fx: px, fy: py, t: 0, crack: 0 }); };
  for (const tok of w.map.trim().split(/\s+/)) {
    const ch = tok[0], n = parseInt(tok.slice(1)) || 0;
    if (ch === 'F') ground(n || 1);
    else if (ch === 'C') ground(n || 1, true);
    else if (ch === 'G') x += n || 2;
    else if (ch === 'U') gy -= n || 1;
    else if (ch === 'D') gy += n || 1;
    else if (ch === 'A') { gy -= n || 4; ground(1); }      // a tall cliff (double jump or wall jump!)
    else if (ch === 'B') {
      const x0 = x; ground(n);
      for (let i = 1; i < n - 1; i++) { set(x0 + i, gy - 3, '='); coins.push(Object.assign(center(x0 + i, gy - 4), { got: false })); }
    }
    else if (ch === 'E') { enemies.push({ x: x * T + 6, y: (gy - 1) * T + 10, w: 30, h: 30, vx: -1, dead: 0, x0: (x - 2) * T, x1: (x + 3) * T }); ground(1); }
    else if (ch === 'M') { springs.push({ x: x * T + 2, y: gy * T - 22, w: T - 4, h: 22, t: 0 }); ground(1); }
    else if (ch === 'J') { springs.push({ x: x * T + 2, y: gy * T - 26, w: T - 4, h: 26, t: 0, crystal: true, power: 16 }); ground(1); }   // 💎 a BOUNCY STAR CRYSTAL
    else if (ch === 'K') { flags.push({ x: x * T + 14, y: gy * T, on: false }); ground(1); }   // 🌟 a star beacon checkpoint
    else if (ch === 'S') { const c = center(x, gy - 1 - (n || 1)); addStar(c.x, c.y); ground(1); }     // ⭐ a MINI STAR stuck in a crystal
    else if (ch === 'Q') {                               // ⭐ hidden on a little crystal ledge up high
      const x0 = x; ground(5);
      for (let i = 1; i <= 3; i++) set(x0 + i, gy - 4, '=');
      const c = center(x0 + 2, gy - 5); addStar(c.x, c.y);
    }
    else if (ch === 'O') { const c = center(x + Math.floor((n || 4) / 2), gy - 3); addStar(c.x, c.y); x += n || 4; }   // ⭐ floating over a gap
    else if (ch === 'R') {                               // ☄️ a METEOR ZONE: meteors drop where the shadows are
      zones.push({ x0: x * T, x1: (x + (n || 6)) * T, gy: gy * T, t: 40 });
      craters.push({ x: x * T + (n || 6) * T / 2, y: gy * T, r: 46 });
      ground(n || 6, true);
    }
    else if (ch === 'H') { hearts.push(Object.assign(center(x, gy - 2), { got: false })); ground(1); }
    else if (ch === 'I') { signs.push({ x: x * T + 4, y: gy * T, text: w.signs[ii++] || '' }); ground(1); }
    else if (ch === '^') { for (let i = 0; i < (n || 1); i++) { set(x, gy - 1, '^'); ground(1); } }
    else if (ch === 'V') {

// ---------- Robo's moves + bumping into tiles (same Robo moves as Robo Jump 11) ----------
function overlapsSolid(e) {
  for (let c = Math.floor(e.x / T); c <= Math.floor((e.x + e.w - 0.01) / T); c++)
    for (let r = Math.floor(e.y / T); r <= Math.floor((e.y + e.h - 0.01) / T); r++) if (isSolid(tileAt(c, r))) return true;
  return false;
}
function moveX(e) {
  e.x += e.vx;
  if (!overlapsSolid(e)) return false;
  if (e.vx > 0) e.x = Math.floor((e.x + e.w) / T) * T - e.w - 0.01;
  else if (e.vx < 0) e.x = (Math.floor(e.x / T) + 1) * T;
  e.vx = 0; return true;
}
function moveY(e) {
  e.y += e.vy;
  e.onGround = false;
  if (!overlapsSolid(e)) return false;
  if (e.vy > 0) { e.y = Math.floor((e.y + e.h) / T) * T - e.h; e.onGround = true; }
  else e.y = (Math.floor(e.y / T) + 1) * T;
  e.vy = 0; return true;
}
function touchingWall(p, d) {
  const c = Math.floor(d > 0 ? (p.x + p.w + 2) / T : (p.x - 2) / T);
  for (let y = p.y + 4; y < p.y + p.h - 4; y += 10) { const t = tileAt(c, Math.floor(y / T)); if ('#='.includes(t)) return true; }
  return false;
}
function updatePlayer() {
  const p = player, dir = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
  if (p.wallLock > 0) p.wallLock--;
  p.hovering = false;
  if (p.wallLock === 0) { p.vx += (dir * SPEED - p.vx) * (p.onGround ? 0.35 : 0.2); if (dir) p.face = dir; }
  p.vy += GRAV;
  if (!p.onGround && keys.jump && p.vy > 0 && p.fuel > 0) { p.vy = Math.min(p.vy, 1.2); p.fuel--; p.hovering = true; if (frame % 5 === 0) sfx.hover(); }   // 🪂 hover
  p.wallDir = 0;
  if (!p.onGround && dir && p.vy > 0 && touchingWall(p, dir)) {                  // slide down walls
    p.wallDir = dir; p.vy = Math.min(p.vy, 2); p.fuel = HOVER;
    if (frame % 4 === 0) particles.push({ x: p.x + (dir > 0 ? p.w : 0), y: p.y + p.h, vx: 0, vy: -0.5, life: 12, c: '#fff', s: 4 });
  }
  p.vy = Math.min(p.vy, MAXFALL);
  if (press.jump) {
    const wd = touchingWall(p, 1) ? 1 : touchingWall(p, -1) ? -1 : 0;
    if (p.onGround || p.coyote > 0) { p.vy = -JUMP; p.onGround = false; p.coyote = 0; p.squash = 0.7; p.ride = null; sfx.jump(); }
    else if (wd) { p.vy = -12; p.vx = -wd * 7.5; p.face = -wd; p.wallLock = 12; sfx.wall(); burst(p.x + (wd > 0 ? p.w : 0), p.y + p.h / 2, ['#fff', '#b3e5fc'], 6, 3); }
    else if (p.jumps > 0) { p.vy = -DJUMP; p.jumps = 0; sfx.djump(); burst(p.x + p.w / 2, p.y + p.h, ['#7df9ff', '#fff'], 8, 3); }
  }
  if (p.coyote > 0) p.coyote--;
  const wasGround = p.onGround;
  moveX(p);
  if (p.ride) { p.x += p.ride.dx; if (overlapsSolid(p)) p.x -= p.ride.dx; }
  const fallV = p.vy;
  moveY(p);
  const was = p.ride; p.ride = null;
  for (const m of movers) {                              // land on moving platforms
    const near = was === m ? 10 : 0;
    if (fallV >= 0 && p.x + p.w > m.x && p.x < m.x + m.w && p.y + p.h >= m.y - near && p.y + p.h - fallV <= m.y + 8) { p.y = m.y - p.h; p.vy = 0; p.onGround = true; p.ride = m; }
  }
  if (p.onGround) {
    if (!wasGround && Math.abs(fallV) > 6) p.squash = 1.3;
    p.jumps = 1; p.fuel = HOVER; p.coyote = 6;

  }

}
function burst(x, y, colors, n = 14, power = 4) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = Math.random() * power + 1;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1, life: 30 + Math.random() * 20, c: colors[i % colors.length], s: 3 + Math.random() * 4 });
  }
}
const hitBox = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
const hitCircle = (p, x, y, r) => { const nx = Math.max(p.x, Math.min(x, p.x + p.w)), ny = Math.max(p.y, Math.min(y, p.y + p.h)); return (nx - x) * (nx - x) + (ny - y) * (ny - y) < r * r; };
function hurt(knock = true) {

  p.hp--; p.inv = 90; shake = 10; sfx.ouch();
  if (knock) { p.vy = -7; p.vx = -p.face * 4; }
  if (p.hp <= 0) { state = 'oops'; timer = 0; burst(p.x + p.w / 2, p.y + p.h / 2, ['#fff', '#40c4ff', '#3d5afe'], 24, 6); }

}

  }
  meteors = [];
  for (const s of minis) if (s.st === 'free') { s.fx = player.x; s.fy = player.y; }
  if (boss) restartPhase();

// ---------- ⭐ MINI STARS, ☄️ METEORS and the rest of the world ----------
const starSaved = () => minis.filter(s => s.st !== 'stuck').length;
function rescueStar(s) {                                 // 💎 CRACK! The crystal breaks and the mini star is FREE
  if (s.st !== 'stuck') return;
  s.st = 'free'; s.t = 0; levelStars++;
  const arr = save.stars[stageId] || (save.stars[stageId] = []);
  arr[s.k] = true; writeSave();                          // saved RIGHT AWAY: losing a life never loses a star
  sfx.crack(); sfx.rescue(); shake = 6;
  burst(s.x, s.y, [theme.glow, '#fff', '#fff59d', '#ffd740'], 26, 6);
  pals.push({ x: s.x, y: s.y + 40, t: 0, line: ['Thank you, Robo!', 'I\'m free! Yay!', 'You saved me!', 'Let\'s go home!', 'Twinkle twinkle!'][s.k % 5], fixed: true });
  banner = `⭐ MINI STAR ${starSaved()} of ${STARS_PER_LEVEL}!`; bannerT = 120;
  bankCoin(1);
  checkAllStars();
}
function updateMinis() {
  const p = player;
  let n = 0;
  for (const s of minis) {
    s.t++;
    if (s.st === 'stuck' && hitCircle(p, s.x, s.y + Math.sin(frame * 0.06 + s.k) * 4, 28)) rescueStar(s);
    if (s.st === 'free') {                               // ⭐ rescued stars follow Robo in a happy little line
      n++;
      const tx = p.x + p.w / 2 - p.face * (30 + n * 26), ty = p.y - 10 + Math.sin(frame * 0.1 + n) * 6;
      const k = 0.12 / Math.sqrt(n);
      s.fx += (tx - s.fx) * k; s.fy += (ty - s.fy) * k;
    }
  }
}
function updateMeteors() {                               // ☄️ the METEOR ZONES: a shadow first, THEN the meteor
  const p = player, px = p.x + p.w / 2;
  for (const z of zones) {
    if (px < z.x0 - 220 || px > z.x1 + 160) continue;
    if (meteors.some(m => m.z === z)) continue;
    z.t--;
    if (z.t <= 0) {
      const x = Math.max(z.x0 + 20, Math.min(z.x1 - 20, px + (Math.random() - 0.5) * 140)), gy = groundY(Math.floor(x / T));
      meteors.push({ z, x, gy, warn: 75, y: -60, vy: 10, spin: Math.random() * 6 });
      z.t = (theme.fast ? 80 : 110) + Math.floor(Math.random() * 60);
      sfx.meteor();
    }
  }
  for (const m of meteors) {
    if (m.warn > 0) { m.warn--; continue; }
    m.y += m.vy; m.vy = Math.min(16, m.vy + 0.4); m.spin += 0.2;
    if (hitCircle(p, m.x, m.y, 18)) hurt();
    if (m.y >= m.gy - 16) {
      m.dead = true; sfx.boom(); shake = Math.max(shake, 8);
      burst(m.x, m.gy - 6, ['#ff9100', '#ffd740', theme.glow, '#fff'], 22, 6);
      if (Math.abs(px - m.x) < 36 && p.y + p.h > m.gy - 46 && p.y < m.gy) hurt();
      craters.push({ x: m.x, y: m.gy, r: 22, fresh: 240 });
    }
  }
  meteors = meteors.filter(m => !m.dead);

}
function updateWorld() {
  const p = player, sk = theme.fast ? 1.6 : 1;
  if (p.inv > 0) p.inv--;
  for (const c of coins) if (!c.got && hitCircle(p, c.x, c.y, 16)) { c.got = true; levelCoins++; bankCoin(1); sfx.coin(); burst(c.x, c.y, ['#ffd740', '#fff'], 5, 2); }
  for (const h of hearts) if (!h.got && hitCircle(p, h.x, h.y, 18)) { h.got = true; p.hp = Math.min(MAX_HP, p.hp + 1); sfx.star(); }
  updateMinis();
  // springs + 💎 bouncy star crystals
  for (const s of springs) { if (s.t > 0) s.t--; if (p.vy > 0 && hitBox(p, s) && p.y + p.h - p.vy <= s.y + 12) { p.vy = -(s.power || SPRING); p.onGround = false; s.t = 12; if (s.crystal) { sfx.bouncy(); burst(s.x + s.w / 2, s.y, [theme.glow, '#fff'], 8, 3); } else sfx.spring(); p.jumps = 1; p.fuel = HOVER; } }
  // 🌟 star beacon checkpoints
  for (const f of flags) if (!f.on && p.x + p.w > f.x - 10 && p.x < f.x + 30) {
    f.on = true; respawn = { x: f.x - 10, y: f.y - 40 }; fails = 0; sfx.check(); burst(f.x + 6, f.y - 50, ['#ffd740', '#fff59d', theme.glow], 16, 4);
    pals.push({ x: f.x + 6, y: f.y - 30, t: 0, line: ['Star beacon ON!', 'Checkpoint!', 'Shine on, Robo!'][(f.x >> 3) % 3], fixed: true });
  }
  signText = ''; for (const s of signs) if (Math.abs(p.x + p.w / 2 - (s.x + 16)) < 70) signText = s.text;
  // 🪨 Rock Bots (little meteor rocks that woke up): stomp them!
  for (const e of enemies) {
    if (e.dead) { e.dead++; continue; }
    e.x += e.vx * sk;
    if (e.x < e.x0 || e.x > e.x1) e.vx *= -1;
    if (hitBox(p, e)) {
      if (p.vy > 0 && p.y + p.h - p.vy <= e.y + 12) { e.dead = 1; p.vy = -10; sfx.stomp(); levelCoins++; bankCoin(1); burst(e.x + 15, e.y + 15, [theme.glow, '#8d6e63', '#fff'], 12, 4); }
      else hurt();
    }
  }
  enemies = enemies.filter(e => e.dead < 30);
  for (const m of movers) {
    const sp = 1.6 * (theme.fast ? 2.2 : 1), ox = m.x;
    m.x += m.dir * sp; if (m.x > m.x1) { m.x = m.x1; m.dir = -1; } if (m.x < m.x0) { m.x = m.x0; m.dir = 1; }
    m.dx = m.x - ox;
  }
  for (const z of zappers) { z.t += sk; z.y = z.y0 - 60 + Math.sin(z.t * 0.04 + z.ph) * 70; if (hitCircle(p, z.x, z.y, 16)) hurt(); }
  updateMeteors();
  if (state !== 'play') return;
  // 💎 crystal spikes
  const c0 = Math.floor((p.x + 4) / T), c1 = Math.floor((p.x + p.w - 4) / T), rr = Math.floor((p.y + p.h - 2) / T);
  for (let c = c0; c <= c1; c++) if (tileAt(c, rr) === '^' && p.y + p.h > rr * T + 18) { if (hurt()) p.vy = -9; }

  if (p.y > H + 20) {
    hurt(false);

    for (const s of minis) if (s.st === 'free') { s.st = 'home'; burst(s.fx, s.fy, ['#fff59d', '#fff'], 10, 4); }
    stageClear();
  }
}

function update() {

  } else if (state === 'title') {

    else if (inBox(tap, INTRO_BTN) || press.d) { sfx.click(); watchIntro(); }

    else if (press.r) cycleLook(1);
    for (const b of LOOK_BTNS) if (inBox(tap, b)) cycleLook(b.d);
    if (state === 'title' && (press.jump || press.enter || inBox(tap, TITLE_BTN))) {
      sfx.click();
      if (open) { state = 'map'; mapSel = firstOpen(); } else { state = 'locked'; timer = 0; }
    }
    else if (state === 'title' && (press.esc || inBox(tap, BACK_BTN))) goBack();
  } else if (state === 'locked') {                       // 🔒 not yet! Beat every Robo Jump first
    timer++;

    if (timer > 10 && (press.jump || press.enter || inBox(tap, LOCK_INTRO_BTN))) { sfx.click(); watchIntro(); }

  } else if (state === 'map') {

function draw() {
  if (state === 'title') drawTitle();
  else if (state === 'locked') drawLocked();

  else if (state === 'play') drawPlay();

// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
