<script>
// 👻 PHANTOM ROBO'S GLOW SHOP: buy cozy nighttime paper things with pretend Moonbeams,
// then pick which orders to PRINT. Nothing prints by itself. NO candles, NO flames: lanterns use a FLASHLIGHT only.
// Save: localStorage.glowShop = { beams, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'glowShop';
let S = { beams: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.beams >= 0)) S.beams = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false, frame = 12;             // OUT = coloring-book mode: white fills + black lines
const FONT = '"Trebuchet MS", Arial, sans-serif';
const NAVY = '#0d1638', TEAL = '#1de9b6', MINT = '#a7ffeb', PURP = '#e040fb', LAV = '#ea80fc', VIO = '#7c4dff', MOONY = '#fff59d';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke, rot = 0) {
  const p = []; for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, rr2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * rr2, y + Math.sin(a) * rr2]); }
  poly(p, fill, stroke, 2);
}
function heart(x, y, r, fill) {
  ctx.beginPath(); ctx.moveTo(x, y + r * 0.9); ctx.bezierCurveTo(x - r * 1.6, y - r * 0.2, x - r * 0.6, y - r * 1.3, x, y - r * 0.45);
  ctx.bezierCurveTo(x + r * 0.6, y - r * 1.3, x + r * 1.6, y - r * 0.2, x, y + r * 0.9); ctx.closePath();
  ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
function moonPath(x, y, r, ang = -0.5) {              // a crescent: outer circle minus a bite circle (center 0.55r away, radius 0.82r)
  const th = 0.9609, ph = 1.5430;                      // where the two circles cross (worked out for 0.55 / 0.82)
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.beginPath(); ctx.arc(0, 0, r, th, 2 * Math.PI - th, false); ctx.arc(r * 0.55, 0, r * 0.82, 2 * Math.PI - ph, ph, true); ctx.closePath(); ctx.restore();
}
function moon(x, y, r, fill = '#fff59d', bgc = null, ang = -0.5) {
  moonPath(x, y, r, ang); ctx.fillStyle = fillOf(fill); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke(); }
}
function moonCoin(x, y, r) { circ(x, y, r, '#3a2a7a', '#ea80fc', Math.max(2, r * 0.12)); moon(x, y, r * 0.62, MOONY); }
// copied helpers from Robo Jump 5 (so drawPhantom is the exact same code)
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h)); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.fill();
}
// 👻 PHANTOM ROBO: copied from drawPhantom in Robo Jump 5 (see-through teal/purple ghost Robo, wavy ghost tail,
// flickering outline, hollow glowing eyes). The shop always uses his FRIENDLY good look (the smile). x, y = top-left of his w x h box.
function drawPhantom(x, y, w, h, face, opts = {}) {
  const t = frame, mini = !!opts.mini, good = !!opts.good || mini;
  const flick = 0.75 + Math.sin(t * 0.3) * 0.1 + (t % 47 < 3 ? -0.3 : 0);
  ctx.save();
  if (opts.alpha !== undefined) ctx.globalAlpha = opts.alpha;
  const cx = x + w / 2, s = w / 30;
  if (!opts.noAura) for (let k = 4; k >= 1; k--) ellipse(cx, y + h * 0.5, w * 0.5 + k * 7 * s, h * 0.55 + k * 7 * s, k % 2 ? 'rgba(29,233,182,.07)' : 'rgba(224,64,251,.07)');   // glow aura
  const gx = t % 61 < 4 ? (Math.random() - .5) * 8 : 0;                                                                                      // glitch jump
  ctx.globalAlpha *= 0.55 * flick + 0.2;
  ctx.fillStyle = 'rgba(124,77,255,.55)'; ctx.beginPath(); ctx.moveTo(x + 2 + gx, y + h * 0.55);                                         // a wavy ghost tail instead of legs
  for (let i = 0; i <= 6; i++) ctx.lineTo(x + 2 + gx + i * (w - 4) / 6, y + h + Math.sin(t * 0.2 + i * 1.3) * 4 * s + (i % 2 ? -5 * s : 0));
  ctx.lineTo(x + w - 2 + gx, y + h * 0.55); ctx.fill();
  roundRect(x + 2 + gx, y + h * 0.48, w - 4, h * 0.38, 6 * s, 'rgba(29,233,182,.55)');
  roundRect(x - 5 * s + gx, y + h * 0.3 - 3 * s, 6 * s, 9 * (h / 40), 3 * s, 'rgba(224,64,251,.6)');
  roundRect(x + w - 1 * s + gx, y + h * 0.3 - 3 * s, 6 * s, 9 * (h / 40), 3 * s, 'rgba(224,64,251,.6)');
  roundRect(x - 2 * s + gx, y, w + 4 * s, h * 0.55, 12 * s, 'rgba(100,255,218,.55)');
  roundRect(x + 2 * s + gx, y + 4 * s, w - 4 * s, h * 0.55 - 9 * s, 9 * s, 'rgba(20,0,40,.7)');
  ctx.globalAlpha = opts.alpha !== undefined ? opts.alpha : 1;

    const row = el('div', 'row'), inCart = S.cart.includes(p.k);

}
function toggleCart(k) {

  else { S.cart.push(k); sfx.add(); say(k === 'theater' ? 'The GIANT Shadow Theater! Oooo, showtime! Best choice ever!' : P(k).safe ? pick(ADD_LINES) + ' Remember: flashlight only, never a candle!' : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {

  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what my friends say!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) {
    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }

    line.appendChild(el('div', 'nm', P(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '')));
    line.appendChild(el('div', 'pr', '🌙 ' + priceOf(k)));

  }

  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'Gift wrap! I will add starry wrapping paper to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 🌙 ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (tot > S.beams) { sfx.oops(); say('Oops! Not enough Moonbeams. Tap Get more!'); const b = $('moreBeams'); b.style.background = '#ff4081'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.beams -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreBeams() {
  S.beams += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['Here are 500 more Moonbeams! I caught them from the moon.', 'Oooo! 500 Moonbeams for Ben! Pretend money is the best!', 'Swoosh! 500 more sparkly Moonbeams!']));
}
// 🌙 delivery animation: Phantom Robo floats your order across the night sky
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function startShip(n) { shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.whoosh(); say('Floating your order over... Oooo!'); requestAnimationFrame(shipLoop); }
function shipLoop() {
  if (shipT < 0) return;
  const c = $('shipCv'), old = ctx, oldF = frame; ctx = c.getContext('2d'); shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7)); frame = shipT;
  try {
    const g = ctx.createLinearGradient(0, 0, 0, 540); g.addColorStop(0, '#050a1c'); g.addColorStop(0.7, '#1a237e'); g.addColorStop(1, '#311b92'); ctx.fillStyle = g; ctx.fillRect(0, 0, 960, 540);
    for (let i = 0; i < 60; i++) { const tw = (Math.sin(shipT * 0.08 + i) + 1) / 2; circ((i * 173) % 960, (i * 97) % 380, 1 + tw * 1.6, i % 4 ? 'rgba(255,255,255,.8)' : 'rgba(167,255,235,.9)'); }
    moon(120, 330, 50, MOONY, null, -0.6);
    ctx.fillStyle = '#9e9e9e'; ctx.fillRect(0, 440, 960, 100); ctx.fillStyle = '#bdbdbd'; ctx.fillRect(0, 440, 960, 6);
    drawMoonBase(700, 440, 0.9);
    const done = shipT > 150, k = Math.min(1, shipT / 140), px = done ? 420 : -120 + k * 540, py = 250 + Math.sin(shipT * 0.08) * 20 - (done ? 0 : Math.sin(k * Math.PI) * 60);
    for (let i = 1; i <= 8 && !done; i++) sparkle(px - i * 34, py + 40 + Math.sin(shipT * 0.2 + i) * 10, 9 - i * 0.8, i % 2 ? MINT : LAV);
    PH(px, py + 90, 150, { aura: true });
    for (let i = 0; i < Math.min(shipCount, 6); i++) { const bx = px + 50 + (i % 3) * 30, by = py + 30 - Math.floor(i / 3) * 30; rr(bx, by, 28, 28, 4, '#7c4dff', '#1de9b6', 2); ctx.fillStyle = '#fff59d'; ctx.fillRect(bx + 11, by, 6, 28); }
    if (!done) { txt('Sending your order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3), 480, 70, 48, '#fff'); rr(280, 110, 400, 24, 12, 'rgba(255,255,255,.25)'); rr(280, 110, Math.max(24, 400 * k), 24, 12, TEAL); }
    else {
      for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); star(480 + Math.cos(a) * d, 150 + Math.sin(a) * d * 0.7 + (shipT - 150) * 1.2, 7, ['#fff59d', '#1de9b6', '#ea80fc', '#fff'][i % 4]); }
      txt('ORDER CONFIRMED! 📦', 480, 85, 62, '#311b92'); txt('ORDER CONFIRMED! 📦', 480, 80, 62, MINT);
      txt(shipCount + (shipCount === 1 ? ' thing is' : ' things are') + ' in MY ORDERS, ready to print!', 480, 150, 30, '#fff');
    }
  } finally { ctx = old; frame = oldF; }
  if (shipT > 150 && !shipDone) { shipDone = true; sfx.cash(); say('ORDER CONFIRMED! Oooo! Tap PRINT on the things you want.'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;

// 🖨️ print preview: nothing prints until Ben taps PRINT
function openPrint(list) {

  const fns = [];
  for (const o of list) { const p = P(o.k); if (!p) continue; if (o.gift) fns.push(() => pageGift(p.name)); p.pages.forEach(f => fns.push(f)); }
  if (!fns.length) return;

function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
window.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! Oooo...'); };

$('deal').textContent = '🔥 Deal: ' + P(DEAL).name;
render();
requestAnimationFrame(drawHelper);
setTimeout(() => { $('bubble').textContent = S.orders.length ? 'Oooo... welcome back, Ben! Your orders are in MY ORDERS.' : 'Oooo... hello, Ben! I used to be lonely on Moon Base. Now I run a Glow Shop!'; }, 50);
