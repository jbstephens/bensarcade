<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Space Museum</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #05081c; display: flex; align-items: center; justify-content: center; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); touch-action: none; }
</style>
<canvas id="game" width="960" height="540"></canvas>
<script>
// 🚀 THE SPACE MUSEUM: Ben's idea! Real rockets in a giant hall (drawn to the same scale as each other),
// a moon rock, spacesuits Robo can try on, Hubble, the ISS, a Mars rover, Voyager 1 and the planets wall.
// Only TRUE facts on the cards. Guide: Robo (drawn with the same code as Robo's Movie).
// ---------- shared core: helpers, Robo (copied from robomovie.html), sounds ----------
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
let frame = 0;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function rr(x, y, w, h, r, fill, stroke, lw = 3) {
  rrect(x, y, Math.max(0, w), Math.max(0, h), r);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); }
}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
const dot = circle;
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
const ell = (x, y, rx, ry, c, rot = 0) => ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), c, rot);
function glow(x, y, r, col, a = 1) {
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, q = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, q), y + Math.sin(a) * Math.max(0, q)); }
  ctx.closePath(); ctx.fill();
}
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function poly(pts, fill, stroke, lw = 2) { ctx.beginPath(); pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](p[0], p[1])); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw; ctx.stroke(); } }
function line(x1, y1, x2, y2, col, lw) { ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = typeof outline === 'string' ? outline : 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", Arial`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let ln = '';
  for (const wd of String(str).split(' ')) { const t = ln ? ln + ' ' + wd : wd; if (ln && ctx.measureText(t).width > maxW) { out.push(ln); ln = wd; } else ln = t; }
  if (ln) out.push(ln); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;
function bubble(x, y, w, h, tx, ty, fill = '#fff') {          // speech bubble with a little tail pointing at (tx, ty)
  rr(x, y, w, h, 14, fill, 'rgba(0,0,0,.25)', 2);
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(clamp(tx, x + 16, x + w - 30), y + h - 1); ctx.lineTo(tx, ty); ctx.lineTo(clamp(tx, x + 16, x + w - 30) + 16, y + h - 1); ctx.closePath(); ctx.fill();
}

const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)
    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    const lit = pose === 'off' ? 0.25 : 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0);
    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);
      const ey = -29.5;
      if (o.dizzy) {                                   // 💫 swirly dizzy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.1;
        for (const ex of [-3, 9]) { ctx.beginPath(); for (let a = 0; a < 12; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.3, ey + Math.sin(a + t * 0.2) * a * 0.3); ctx.stroke(); }
      } else if (pose === 'happy' || o.happy) {        // ^ ^ happy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5, talk = o.mouth ? 0.85 + 0.15 * Math.sin(t * 0.6) : 1;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      if (o.mouth) { ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, -25); ctx.lineTo(1 + 2 + Math.abs(Math.sin(t * 0.5)) * 3, -25); ctx.stroke(); }
      ctx.restore();
    }
  }
  if (o.wave) {                                        // 👋 a little waving hand
    const a = Math.sin(t * 0.3) * 0.5;
    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();
  }
  ctx.restore();
  if (o.dizzy) for (let i = 0; i < 3; i++) { const a = t * 0.08 + i * 2.1; star(x + Math.cos(a) * 22 * s / 2.6, y - 118 * s / 2.6 + Math.sin(a) * 6, 7, '#ffd54f', a); }
}

// ---------- sounds (soft! master volume 0.12) ----------
let AC = null, MASTER = null;
function beep(f, t = 0, d = 0.12, type = 'triangle', v = 0.35) {
  try { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.12; MASTER.connect(AC.destination); }
    const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime + t;
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(0.0001, n); g.gain.linearRampToValueAtTime(Math.min(0.5, v), n + 0.015); g.gain.exponentialRampToValueAtTime(0.001, n + d);
    o.connect(g); g.connect(MASTER); o.start(n); o.stop(n + d + 0.05); } catch (_) {}
}
const tune = (notes, gap = 0.12, d = 0.18, type = 'triangle', v = 0.35) => notes.forEach((f, i) => f && beep(f, i * gap, d, type, v));
const sfx = {
  click: () => beep(660, 0, 0.07),
  whoosh: () => beep(320, 0, 0.25, 'sine', 0.3),
  stamp: () => { beep(200, 0, 0.12, 'sine', 0.4); tune([784, 988, 1175], 0.07, 0.15); },
  yay: () => tune([523, 659, 784, 1047], 0.1, 0.3),
};
// ---------- 🚀 rockets (feet on y = 0; 1 unit is about 0.38 meters, so the rockets are the right sizes next to each other) ----------
const k01 = a => a > 0 ? Math.sin(Math.PI * clamp(a, 0, 1)) : 0;
function flame(x, y, w, len, t) {
  const f = len * (0.85 + 0.15 * Math.sin(t * 0.9));
  ctx.fillStyle = 'rgba(255,183,77,.9)'; ctx.beginPath(); ctx.moveTo(x - w, y); ctx.quadraticCurveTo(x, y + f * 1.2, x + w, y); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,200,.95)'; ctx.beginPath(); ctx.moveTo(x - w * 0.5, y); ctx.quadraticCurveTo(x, y + f * 0.7, x + w * 0.5, y); ctx.fill();
}
function smoke(k, w, t) {
  if (k < 0.05) return;
  for (let i = 0; i < 9; i++) { const sx = (i - 4) * w * 0.32, r = w * (0.24 + 0.06 * Math.sin(t * 0.05 + i)) * (0.4 + k); glow(sx, -r * 0.3, r * 1.3, 'rgba(250,250,250,.95)', k); circle(sx, -r * 0.2, r * 0.55, `rgba(236,239,241,${0.7 * k})`); }
}
function bell(x, y, w, h, col = '#37474f') { poly([[x - w * 0.3, y], [x + w * 0.3, y], [x + w * 0.5, y + h], [x - w * 0.5, y + h]], col); }
function launchPad(w) { rr(-w / 2, -6, w, 6, 2, '#546e7a', '#37474f', 1.5); }
function drawSaturn(cx, by, s, a) {
  const k = k01(a), t = frame, up = k * 40;
  ctx.translate(cx, by); ctx.scale(s, s); launchPad(110);
  ctx.save(); ctx.translate(0, -up);
  if (k > 0.05) for (const x of [-9, 0, 9]) flame(x, -6, 5, 30 + k * 30, t + x);
  for (const x of [-9, 0, 9]) bell(x, -18, 9, 12);
  for (const sd of [-1, 1]) poly([[sd * 13, -34], [sd * 22, -10], [sd * 22, -4], [sd * 13, -16]], '#eceff1', '#90a4ae', 1);     // fins
  rr(-13, -118, 26, 102, 2, '#fafafa', '#b0bec5', 1);                                         // 1st stage (S-IC)
  ctx.fillStyle = '#212121'; ctx.fillRect(-13, -44, 9, 28); ctx.fillRect(4, -72, 9, 28); ctx.fillRect(-13, -118, 26, 8);
  ctx.save(); ctx.translate(4, -100); ctx.fillStyle = '#c62828'; ctx.font = 'bold 9px Arial'; ctx.textAlign = 'center'; ['U', 'S', 'A'].forEach((c, i) => ctx.fillText(c, -4, i * 10 + 8)); ctx.restore();
  rr(-13, -194, 26, 76, 1, '#fafafa', '#b0bec5', 1); ctx.fillStyle = '#212121'; ctx.fillRect(-13, -132, 26, 4); ctx.fillRect(-13, -194, 26, 3);   // 2nd stage (S-II)
  poly([[-13, -194], [13, -194], [8.7, -206], [-8.7, -206]], '#eceff1', '#b0bec5', 1);
  rr(-8.7, -240, 17.4, 34, 1, '#fafafa', '#b0bec5', 1); ctx.fillStyle = '#212121'; ctx.fillRect(-8.7, -222, 6, 16);   // 3rd stage (S-IVB)
  ctx.fillStyle = '#90a4ae'; ctx.fillRect(-8.7, -243, 17.4, 3);
  poly([[-8.7, -243], [8.7, -243], [5, -263], [-5, -263]], '#eceff1', '#b0bec5', 1);       // adapter
  poly([[-5, -263], [5, -263], [1.4, -274], [-1.4, -274]], '#cfd8dc', '#90a4ae', 1);       // command module cover
  ctx.strokeStyle = '#c62828'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.moveTo(-1.4, -274); ctx.lineTo(0, -286); ctx.lineTo(1.4, -274); ctx.moveTo(-0.8, -280); ctx.lineTo(0.8, -280); ctx.stroke();   // escape tower
  rr(-1.4, -294, 2.8, 8, 1, '#c62828'); tri(-1.4, -294, 1.4, -294, 0, -299, '#c62828');
  line(-10, -112, -10, -24, 'rgba(255,255,255,.7)', 1.5);
  ctx.restore(); smoke(k, 120, t);
  if (k > 0.3) text('3, 2, 1... LIFT OFF!', 0, -300 - up, 14, '#fff59d');
}
function drawShuttle(cx, by, s, a) {
  const k = k01(a), t = frame, up = k * 26;
  ctx.translate(cx, by); ctx.scale(s, s); launchPad(90);
  ctx.save(); ctx.translate(0, -up);
  if (k > 0.05) { flame(-16, -2, 5, 26 + k * 20, t); flame(20, -10, 3, 16 + k * 10, t + 3); }
  bell(-16, -8, 8, 7); for (const y of [-14, -10]) bell(20, y, 6, 5);
  rr(-21, -122, 10, 114, 2, '#fafafa', '#b0bec5', 1); poly([[-21, -122], [-11, -122], [-16, -134]], '#fafafa', '#b0bec5', 1);   // solid rocket booster
  ctx.fillStyle = '#90a4ae'; for (const y of [-40, -80]) ctx.fillRect(-21, y, 10, 1.5);
  const g = ctx.createLinearGradient(-11, 0, 11, 0); g.addColorStop(0, '#bf5a17'); g.addColorStop(0.5, '#f08a3e'); g.addColorStop(1, '#a84b10');
  ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(-11, -6); ctx.lineTo(-11, -128); ctx.quadraticCurveTo(0, -152, 11, -128); ctx.lineTo(11, -6); ctx.closePath(); ctx.fill();   // big orange tank
  ctx.strokeStyle = 'rgba(0,0,0,.15)'; ctx.lineWidth = 1; for (const y of [-40, -90]) { ctx.beginPath(); ctx.moveTo(-11, y); ctx.lineTo(11, y); ctx.stroke(); }
  // the orbiter (nose up, belly against the tank)
  ctx.fillStyle = '#fafafa'; ctx.beginPath(); ctx.moveTo(12, -16); ctx.lineTo(12, -100); ctx.quadraticCurveTo(14, -112, 19, -112); ctx.quadraticCurveTo(26, -108, 26, -96); ctx.lineTo(26, -16); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#263238'; ctx.beginPath(); ctx.moveTo(12, -16); ctx.lineTo(12, -100); ctx.quadraticCurveTo(14, -112, 19, -112); ctx.lineTo(19, -106); ctx.quadraticCurveTo(15, -104, 15, -96); ctx.lineTo(15, -16); ctx.closePath(); ctx.fill();   // black heat tiles
  poly([[17, -103], [24, -101], [24, -97], [17, -98]], '#263238');                             // windows
  poly([[26, -18], [42, -36], [42, -42], [26, -40]], '#fafafa', '#90a4ae', 1);              // tail fin
  rr(24, -30, 6, 12, 3, '#eceff1', '#90a4ae', 1);                                              // engine pods
  ctx.fillStyle = '#90a4ae'; ctx.fillRect(16, -70, 10, 1); ctx.fillRect(16, -50, 10, 1);
  ctx.restore(); smoke(k, 100, t);
  if (k > 0.3) text('LIFT OFF!', -40, -120 - up, 12, '#fff59d');
}
function drawBooster(cx, by, s, a) {
  const k = k01(a), t = frame, hgt = k * 90;
  ctx.translate(cx, by); ctx.scale(s, s);
  rr(-40, -4, 80, 4, 2, '#455a64'); ctx.strokeStyle = '#fff59d'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(0, -2, 22, Math.PI, 0); ctx.stroke(); text('X', 0, -6, 10, '#fff59d', 'center', false);   // the landing pad
  ctx.save(); ctx.translate(0, -hgt);
  const legsOut = hgt < 60;
  if (k > 0.05) flame(0, -6, 4, 14 + 16 * Math.min(1, hgt / 40), t);
  bell(0, -12, 9, 6, '#424242');
  for (const sd of [-1, 1]) { if (legsOut) { line(sd * 5, -30, sd * 26, 0, '#37474f', 2.6); line(sd * 26, 0, sd * 20, 0, '#37474f', 2); line(sd * 5, -14, sd * 18, -6, '#546e7a', 1.4); } else line(sd * 5.6, -30, sd * 5.6, -12, '#37474f', 2.6); }
  rr(-5, -116, 10, 106, 1.5, '#fafafa', '#b0bec5', 1);
  ctx.fillStyle = 'rgba(80,70,60,.35)'; ctx.fillRect(-5, -60, 10, 44); ctx.fillRect(-5, -100, 4, 20);   // soot from flying back!
  rr(-5, -128, 10, 12, 1, '#212121');                                                         // black interstage
  for (const sd of [-1, 1]) { ctx.strokeStyle = '#78909c'; ctx.lineWidth = 0.8; ctx.strokeRect(sd > 0 ? 5 : -11, -124, 6, 6); line(sd * 5, -121, sd * 11, -121, '#78909c', 0.6); }   // grid fins
  ctx.restore();
  if (k > 0.2 && hgt < 30 && a > 0.5) text('TOUCHDOWN!', 0, -150, 14, '#fff59d');
}
// ---------- 🌑 MOON ROCK under glass ----------
function drawMoonRock(cx, by, s, a) {
  const k = k01(a), t = frame;
  ctx.translate(cx, by); ctx.scale(s, s);
  rr(-60, -110, 120, 110, 8, '#37474f', '#263238', 2); rr(-72, -122, 144, 14, 5, '#455a64');
  rr(-56, -70, 112, 30, 6, '#ffd54f'); text('APOLLO 11 • 1969', 0, -49, 11, '#4e342e', 'center', false);

// ---------- the museum engine (same way of walking + tapping as the MacBook Museum) ----------
let save = { seen: {}, bag: {} };

const ART = { x: 0, y: 60, w: 560, h: 480 };

function openExhibit(id) {

    if (seenCount() === EX.length && !save.allDone) { save.allDone = 1; writeSave(); trophy(MUSE.trophyId); setTimeout(() => { say('🏆 You saw EVERY exhibit! ' + MUSE.master, 260); confetti(W / 2, 200, 120); sfx.yay(); }, 700); } }
}
function goHall(h) { hall = (h + HALLS.length) % HALLS.length; sel = 0; hallT = 0; shopPop = null; sfx.whoosh(); }
// ---------- input (taps, drags, and arrow keys / Enter / Escape) ----------
const toXY = e => { const r = C.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
C.addEventListener('mousedown', e => { tap = toXY(e); down = true; });

C.addEventListener('mousemove', e => { if (!down || !(e.buttons & 1)) return; const p = toXY(e); if (state === 'close' && EX[showI].drag && p.x < 560 && p.y > 60) EX[showI].drag(p.x, p.y); });

// ---------- 🎁 gift shop ----------

// ---------- drawing ----------
function drawGuide(x, y, s) { drawRobo(x, y, { s, mouth: msgT > 0, pose: msgT > 0 ? 'happy' : 'idle', wave: msgT > 0 || hallT < 120 }); }

function drawBar() {

function drawClose() {

let last = performance.now(), acc = 0;
function loop(now) { acc += Math.min(100, now - last); last = now; while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } draw(); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
