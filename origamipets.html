<style>
  html, body { height: 100%; }
  body { margin: 0; background: #1a2a3a; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fff3e0; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fff3e0; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #6d4c41; }
  #printBox .pbTip { font-size: 20px; color: #5d4037; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

<canvas id="game" width="960" height="540"></canvas>
<script>
// 🦢 ORIGAMI PET STUDIO — Ben asked for origami Game Factory pets (and let Claude pick 15).
// 5 REAL easy folds (Cat Face, Puppy, Square Face, Blob, Heart) for printer paper. Each pet has its own printable
// paper (with the pet's colors, printed so the right parts end up on the front) + a sheet of face stickers to cut out.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { made: {} };
try { const s = JSON.parse(localStorage.getItem('origamiPets') || 'null'); if (s && s.made) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('origamiPets', JSON.stringify(save)); } catch (_) {} }
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
let frame = 0;

// ---------- drawing helpers ----------
function rr(x, y, w, h, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, w, h); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function tri(a, b, c, d, e, f, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(a, b); ctx.lineTo(c, d); ctx.lineTo(e, f); ctx.closePath(); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function fit(str, x, y, size, maxW, color, align, outline) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const w = ctx.measureText(str).width || 0;
  text(str, x, y, w > maxW ? Math.max(9, Math.floor(size * maxW / w)) : size, color, align, outline);
}
function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }
function star(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < 10; i++) { const a = -Math.PI / 2 + i * Math.PI / 5, q = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q); } ctx.closePath(); ctx.fill(); }
function wrap(str, size, maxW) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; const out = []; let line = '';
  for (const wd of String(str).split(' ')) { const t = line ? line + ' ' + wd : wd; if (line && ctx.measureText(t).width > maxW) { out.push(line); line = wd; } else line = t; }
  if (line) out.push(line); return out;
}
function button(b, label, fill, size = 22) {
  rr(b.x, b.y + 4, b.w, b.h, 14, 'rgba(0,0,0,.35)'); rr(b.x, b.y, b.w, b.h, 14, fill);
  fit(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size, b.w - 12);
}
const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;

</script>
<script>
// ---------- THE 15 PETS ----------
// model: cat | puppy | square | blob | heart.  pat = the paper's pattern.  eye = eye color.  bits = extra face stickers.
const PETS = [
  { id: 'sammy', name: 'Sammy', from: 'Ben\'s real cat (Robo Jump 8)', model: 'cat', col: '#8d6e63', ear: '#6d4c41', pat: 'stripes', eye: '#ffca28', bits: ['nose'] },
  { id: 'rocky', name: 'Rocky', from: 'Rocky\'s Outdoor Fun', model: 'cat', col: '#9e9e9e', ear: '#757575', pat: 'stripes', eye: '#aed581', bits: ['nose'] },
  { id: 'mimo', name: 'Mimo', from: 'Rocky\'s Outdoor Fun', model: 'cat', col: '#212121', ear: '#111', pat: 'shine', eye: '#76ff03', bits: ['nose', 'bell'] },
  { id: 'claudecat', name: 'Claude Cat', from: 'The Claude Museum', model: 'cat', col: '#e8956f', ear: '#d97757', pat: 'sparkles', eye: '#a5d6a7', bits: ['visor', 'sparkle'] },
  { id: 'ninjacat', name: 'Ninja Cat', from: 'Robo Jump 8', model: 'cat', col: '#262626', ear: '#424242', pat: 'plain', eye: '#ffeb3b', bits: ['band', 'nose'] },
  { id: 'sparks', name: 'Sparks', from: 'Sparks to the Rescue', model: 'puppy', col: '#ffd600', ear: '#8e24aa', pat: 'sparks', eye: '#3e2723', bits: ['dognose', 'tongue'] },
  { id: 'robo', name: 'Robo', from: 'Robo Jump', model: 'square', col: '#eceff1', ear: '#2979ff', pat: 'bolts', eye: '#40c4ff', bits: ['visor', 'antenna'] },
  { id: 'robo2', name: 'Robo 2.0', from: 'Robo Jump 6', model: 'square', col: '#f3e5f5', ear: '#d500f9', pat: 'bolts', eye: '#00e676', bits: ['visor', 'antenna'] },
  { id: 'lockrobo', name: 'Lock Robo', from: 'Robo Jump 8', model: 'square', col: '#90a4ae', ear: '#ffc400', pat: 'bolts', eye: '#ffd740', bits: ['visor', 'lock'] },
  { id: 'timerobo', name: 'Time Robo', from: 'Robo Jump 7', model: 'square', col: '#ffca28', ear: '#8d6e63', pat: 'gears', eye: '#fff', bits: ['visor', 'clock'] },
  { id: 'shark', name: 'Shark Robo', from: 'The Secret Print Shop', model: 'square', col: '#78909c', ear: '#546e7a', pat: 'waves', eye: '#fff', bits: ['visor', 'fin', 'teeth'] },
  { id: 'kinggloop', name: 'King Gloop', from: 'Robo Jump', model: 'blob', col: '#7c4dff', ear: '#5e35b1', pat: 'dots', eye: '#fff', bits: ['eyes', 'crown'] },
  { id: 'babygloop', name: 'Baby Gloop', from: 'Robo Jump 3D', model: 'blob', col: '#b388ff', ear: '#9575cd', pat: 'dots', eye: '#fff', bits: ['eyes', 'tinycrown'] },
  { id: 'claudegloop', name: 'Claude Gloop', from: 'The Claude Museum', model: 'blob', col: '#e8956f', ear: '#b85c3c', pat: 'sparkles', eye: '#fff', bits: ['eyes', 'sparkle'] },
  { id: 'laserheart', name: 'Laserheart', from: 'Robo Jump 9', model: 'heart', col: '#ff4081', ear: '#c51162', pat: 'shine', eye: '#fff', bits: ['eyes', 'tinycrown'] },
];
const MODELS = { cat: { name: 'Cat Face', stars: 1 }, puppy: { name: 'Puppy Face', stars: 1 }, square: { name: 'Square Face', stars: 1 }, blob: { name: 'Blob', stars: 1 }, heart: { name: 'Heart', stars: 2 } };
let PRINTING = false;
// ---------- shapes (in a 200 x 200 box) ----------
const poly = (pts, fill, line) => { ctx.beginPath(); pts.forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); if (fill) { ctx.fillStyle = fill; ctx.fill(); } if (line) { ctx.strokeStyle = line; ctx.lineWidth = 2; ctx.stroke(); } };
function heartPath() { ctx.beginPath(); ctx.moveTo(100, 165); ctx.bezierCurveTo(30, 120, 25, 70, 55, 52); ctx.bezierCurveTo(78, 40, 96, 52, 100, 70); ctx.bezierCurveTo(104, 52, 122, 40, 145, 52); ctx.bezierCurveTo(175, 70, 170, 120, 100, 165); ctx.closePath(); }
function blobPath() { ctx.beginPath(); ctx.moveTo(28, 150); ctx.lineTo(172, 150); ctx.bezierCurveTo(176, 105, 150, 74, 100, 74); ctx.bezierCurveTo(50, 74, 24, 105, 28, 150); ctx.closePath(); }
function patternFill(p, x0, y0, w, h, sc = 1) {          // the paper's pattern (used on screen AND on the printed paper)
  ctx.fillStyle = p.col; ctx.fillRect(x0, y0, w, h);
  const step = 22 * sc;
  if (p.pat === 'stripes') { ctx.fillStyle = 'rgba(0,0,0,.22)'; for (let x = x0 - h; x < x0 + w; x += step * 1.4) { ctx.beginPath(); ctx.moveTo(x, y0); ctx.lineTo(x + 7 * sc, y0); ctx.lineTo(x + 7 * sc + h * 0.35, y0 + h); ctx.lineTo(x + h * 0.35, y0 + h); ctx.fill(); } }
  if (p.pat === 'dots') for (let y = y0; y < y0 + h; y += step) for (let x = x0 + ((y - y0) / step % 2) * step / 2; x < x0 + w; x += step) circle(x, y, 4 * sc, 'rgba(255,255,255,.25)');
  if (p.pat === 'shine') { ctx.fillStyle = 'rgba(255,255,255,.12)'; for (let x = x0; x < x0 + w; x += step * 3) ctx.fillRect(x, y0, 8 * sc, h); }
  if (p.pat === 'sparkles') for (let y = y0 + step; y < y0 + h; y += step * 1.6) for (let x = x0 + step; x < x0 + w; x += step * 1.6) sparkleAt(x, y, 6 * sc, 'rgba(255,255,255,.35)');
  if (p.pat === 'bolts') for (let y = y0 + step; y < y0 + h; y += step * 2) for (let x = x0 + step; x < x0 + w; x += step * 2) { circle(x, y, 3 * sc, 'rgba(0,0,0,.15)'); }
  if (p.pat === 'gears') for (let y = y0 + step; y < y0 + h; y += step * 2.2) for (let x = x0 + step; x < x0 + w; x += step * 2.2) { circle(x, y, 6 * sc, 'rgba(141,110,99,.3)'); circle(x, y, 2.5 * sc, p.col); }
  if (p.pat === 'waves') { ctx.strokeStyle = 'rgba(255,255,255,.25)'; ctx.lineWidth = 2 * sc; for (let y = y0 + 10; y < y0 + h; y += step) { ctx.beginPath(); for (let x = x0; x <= x0 + w; x += 4) ctx.lineTo(x, y + Math.sin(x / (10 * sc)) * 4 * sc); ctx.stroke(); } }
  if (p.pat === 'sparks') { ctx.fillStyle = 'rgba(255,255,255,.2)'; for (let y = y0; y < y0 + h; y += step * 2) for (let x = x0; x < x0 + w; x += step * 2) star(x + step, y + step, 5 * sc, 'rgba(255,255,255,.35)'); }
}
function sparkleAt(cx, cy, r, col) { ctx.save(); ctx.strokeStyle = col; ctx.lineCap = 'round'; ctx.lineWidth = Math.max(1.5, r * 0.3); ctx.beginPath(); for (let i = 0; i < 8; i++) { const a = i * Math.PI / 4, q = i % 2 ? 0.65 : 1; ctx.moveTo(cx + Math.cos(a) * r * 0.25, cy + Math.sin(a) * r * 0.25); ctx.lineTo(cx + Math.cos(a) * r * q, cy + Math.sin(a) * r * q); } ctx.stroke(); ctx.restore(); }
function clipShape(model) {                                  // the finished pet's outline
  if (model === 'cat') { ctx.beginPath(); [[40, 95], [55, 62], [42, 16], [86, 61], [114, 61], [158, 16], [145, 62], [160, 95], [125, 135], [75, 135]].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
  else if (model === 'puppy') { ctx.beginPath(); [[56, 62], [144, 62], [118, 146], [82, 146]].forEach(([x, y], i) => i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)); ctx.closePath(); }
  else if (model === 'square') { ctx.beginPath(); ctx.rect(45, 45, 110, 110); }
  else if (model === 'blob') blobPath(); else heartPath();
}
</script>
<script>
// ---------- the face pieces (drawn on the finished pet, AND printed as stickers to cut out) ----------
const DK = '#263238';
const BITS = {
  catEyes: (p, u) => [[-20, 0], [20, 0]].map(([dx]) => () => { circle(dx * u, 0, 7 * u, p.eye); ctx.fillStyle = '#000'; ctx.beginPath(); ctx.ellipse(dx * u, 0, 2 * u, 5.5 * u, 0, 0, 7); ctx.fill(); circle(dx * u + 2 * u, -2.5 * u, 1.5 * u, '#fff'); }),
  nose: (p, u) => { tri(-5 * u, -3 * u, 5 * u, -3 * u, 0, 4 * u, '#ff8a80'); },
  whiskers: (p, u) => { ctx.strokeStyle = p.col === '#212121' || p.col === '#262626' ? '#bdbdbd' : '#fff'; ctx.lineWidth = 1.2 * u; ctx.beginPath(); for (const d of [-1, 1]) for (const k of [-3, 0, 3]) { ctx.moveTo(d * 10 * u, 0); ctx.lineTo(d * 34 * u, k * u - 2 * u); } ctx.stroke(); },
  bell: (p, u) => { rr(-30 * u, -4 * u, 60 * u, 8 * u, 4 * u, '#ff80ab'); circle(0, 7 * u, 6 * u, '#ffc400'); ctx.fillStyle = '#8d6e63'; ctx.fillRect(-0.8 * u, 7 * u, 1.6 * u, 5 * u); },
  band: (p, u) => { rr(-46 * u, -5 * u, 92 * u, 10 * u, 3 * u, '#e53935'); tri(-46 * u, -4 * u, -62 * u, 4 * u, -58 * u, -10 * u, '#e53935'); },
  visor: (p, u, w = 76, h = 34) => { rr(-w / 2 * u, -h / 2 * u, w * u, h * u, 14 * u, DK); for (const d of [-1, 1]) { circle(d * 16 * u, 0, 7 * u, p.eye); circle(d * 16 * u + 2 * u, -2.5 * u, 2 * u, '#fff'); } },
  sparkle: (p, u) => { circle(0, 0, 11 * u, p.col); sparkleAt(0, 0, 9 * u, '#fbe3d3'); },
  dogEyes: (p, u) => [[-16], [16]].map(([dx]) => () => { circle(dx * u, 0, 6 * u, '#fff'); circle(dx * u, 0.5 * u, 4 * u, p.eye); circle(dx * u + 1.5 * u, -1.5 * u, 1.3 * u, '#fff'); }),
  dognose: (p, u) => { ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.ellipse(0, 0, 8 * u, 5.5 * u, 0, 0, 7); ctx.fill(); circle(-2.5 * u, -2 * u, 1.5 * u, '#fff'); },
  tongue: (p, u) => { rr(-5 * u, -6 * u, 10 * u, 12 * u, 5 * u, '#ff80ab'); },
  antenna: (p, u) => { ctx.fillStyle = '#90a4ae'; ctx.fillRect(-2 * u, -10 * u, 4 * u, 22 * u); circle(0, -12 * u, 6 * u, p.ear); },
  lock: (p, u) => { ctx.strokeStyle = '#ffc400'; ctx.lineWidth = 3.5 * u; ctx.beginPath(); ctx.arc(0, -4 * u, 8 * u, Math.PI, 0); ctx.stroke(); rr(-12 * u, -4 * u, 24 * u, 18 * u, 4 * u, '#ffc400'); circle(0, 3 * u, 2.5 * u, '#5d4037'); },
  clock: (p, u) => { circle(0, 0, 12 * u, '#fff8e1'); ctx.strokeStyle = '#3e2723'; ctx.lineWidth = 1.8 * u; ctx.beginPath(); ctx.arc(0, 0, 12 * u, 0, 7); ctx.moveTo(0, 0); ctx.lineTo(0, -8 * u); ctx.moveTo(0, 0); ctx.lineTo(6 * u, 2 * u); ctx.stroke(); },
  fin: (p, u) => { tri(-14 * u, 12 * u, 14 * u, 12 * u, 6 * u, -18 * u, p.col); ctx.strokeStyle = p.ear; ctx.lineWidth = 1.5 * u; ctx.stroke(); },
  teeth: (p, u) => { rr(-22 * u, -5 * u, 44 * u, 10 * u, 2 * u, '#37474f'); for (let k = 0; k < 6; k++) tri(-20 * u + k * 7 * u, -5 * u, -14 * u + k * 7 * u, -5 * u, -17 * u + k * 7 * u, 2 * u, '#fff'); },
  blobEyes: (p, u, angry) => [[-20], [20]].map(([dx]) => () => { circle(dx * u, 0, 11 * u, '#fff'); circle(dx * u + 2 * u, 2 * u, 5 * u, '#212121'); circle(dx * u + 3.5 * u, 0.5 * u, 1.6 * u, '#fff'); if (angry) { ctx.fillStyle = '#212121'; ctx.save(); ctx.translate(dx * u, -13 * u); ctx.rotate(dx < 0 ? 0.35 : -0.35); ctx.fillRect(-10 * u, -2 * u, 20 * u, 4 * u); ctx.restore(); } }),
  crown: (p, u, k = 1) => { ctx.fillStyle = '#ffc400'; ctx.beginPath(); ctx.moveTo(-30 * k * u, 12 * k * u); ctx.lineTo(-30 * k * u, -6 * k * u); ctx.lineTo(-17 * k * u, 4 * k * u); ctx.lineTo(0, -14 * k * u); ctx.lineTo(17 * k * u, 4 * k * u); ctx.lineTo(30 * k * u, -6 * k * u); ctx.lineTo(30 * k * u, 12 * k * u); ctx.closePath(); ctx.fill(); circle(0, 2 * k * u, 3 * k * u, '#e53935'); },
  smile: (p, u) => { ctx.strokeStyle = '#212121'; ctx.lineWidth = 2.5 * u; ctx.lineCap = 'round'; ctx.beginPath(); ctx.arc(0, -4 * u, 8 * u, 0.3, Math.PI - 0.3); ctx.stroke(); ctx.lineCap = 'butt'; },
};
const at = (x, y, fn) => { ctx.save(); ctx.translate(x, y); fn(); ctx.restore(); };
function drawFace(p, u) {                                    // face pieces placed on the finished pet (box coords, u = 1)
  const b = p.bits;
  if (p.model === 'cat') { BITS.catEyes(p, u).forEach(f => at(100, 92, f)); if (b.includes('visor')) at(100, 92, () => BITS.visor(p, u, 72, 26)); at(100, 108, () => BITS.nose(p, u)); at(100, 110, () => BITS.whiskers(p, u));
    if (b.includes('bell')) at(100, 128, () => BITS.bell(p, u)); if (b.includes('band')) at(100, 74, () => BITS.band(p, u)); if (b.includes('sparkle')) at(100, 70, () => BITS.sparkle(p, u * 0.7)); }
  if (p.model === 'puppy') { BITS.dogEyes(p, u).forEach(f => at(100, 98, f)); at(100, 118, () => BITS.dognose(p, u)); at(100, 134, () => BITS.tongue(p, u)); }
  if (p.model === 'square') { at(100, 86, () => BITS.visor(p, u)); if (b.includes('antenna')) at(100, 38, () => BITS.antenna(p, u)); if (b.includes('lock')) at(100, 130, () => BITS.lock(p, u)); if (b.includes('clock')) at(100, 86, () => BITS.clock(p, u * 0.9));
    if (b.includes('fin')) at(100, 34, () => BITS.fin(p, u)); if (b.includes('teeth')) at(100, 124, () => BITS.teeth(p, u)); }
  if (p.model === 'blob') { BITS.blobEyes(p, u, p.id === 'kinggloop').forEach(f => at(100, 114, f)); at(100, 136, () => BITS.smile(p, u)); if (b.includes('crown')) at(100, 70, () => BITS.crown(p, u)); if (b.includes('tinycrown')) at(100, 74, () => BITS.crown(p, u, 0.5)); if (b.includes('sparkle')) at(100, 70, () => BITS.sparkle(p, u)); }
  if (p.model === 'heart') { BITS.blobEyes(p, u * 0.85).forEach(f => at(100, 96, f)); at(100, 124, () => BITS.smile(p, u)); at(100, 60, () => BITS.crown(p, u, 0.5)); }
}
function drawPet(i, cx, cy, size, bob = 0) {                // the FINISHED origami pet
  const p = PETS[i]; ctx.save(); ctx.translate(cx - size / 2, cy - size / 2 + bob); ctx.scale(size / 200, size / 200);
  if (p.model === 'puppy') for (const e of [[[50, 60], [80, 60], [40, 136]], [[120, 60], [150, 60], [160, 136]]]) poly(e, p.ear, 'rgba(0,0,0,.35)');
  ctx.save(); clipShape(p.model); ctx.clip(); patternFill(p, 0, 0, 200, 200);
  if (p.model === 'cat') for (const e of [[[42, 16], [55, 62], [86, 61]], [[158, 16], [145, 62], [114, 61]]]) { poly(e, p.ear); poly([[e[0][0] + (e[0][0] < 100 ? 6 : -6), e[0][1] + 14], [e[1][0] + (e[0][0] < 100 ? 6 : -6), e[1][1] - 4], [e[2][0] + (e[0][0] < 100 ? -10 : 10), e[2][1] - 2]], '#ffab91'); }
  if (p.model === 'puppy') { ctx.fillStyle = p.ear; ctx.fillRect(0, 60, 200, 22); }
  if (p.model === 'square') { ctx.strokeStyle = 'rgba(0,0,0,.18)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(45, 45); ctx.lineTo(155, 155); ctx.moveTo(155, 45); ctx.lineTo(45, 155); ctx.stroke(); }
  ctx.restore(); clipShape(p.model); ctx.strokeStyle = 'rgba(0,0,0,.45)'; ctx.lineWidth = 3; ctx.stroke();
  drawFace(p, 1); ctx.restore();
}
function stickerList(p) {                                    // the pieces to cut out for one pet: [width, height, draw] in box units
  const L = [], b = p.bits;

  document.body.appendChild(printBox);
}
</script>
