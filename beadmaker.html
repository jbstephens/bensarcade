<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📿 Bead Maker</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; color: #333; overflow: hidden;
    user-select: none; -webkit-user-select: none; background: var(--bg); }
  #studio { position: absolute; inset: 0; display: flex; gap: 10px; padding: 10px; }
  /* ---------- tools (left) ---------- */
  #tools { width: 96px; flex: none; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .tool { font: inherit; font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 16px; box-shadow: 0 4px 0 #333;
    cursor: pointer; padding: 3px 2px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #222; flex: none; }
  .tool i { font-style: normal; font-size: 30px; line-height: 1.05; }
  .tool span { font-size: 13px; }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #333; }
  .tool.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .tool.dim { opacity: .4; }
  .tool.t-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- the board (middle) ---------- */
  #board { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #cvWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { background: #fff; border: 5px solid #333; border-radius: 12px; box-shadow: 0 7px 0 var(--accent); touch-action: none; cursor: crosshair; display: block; }
  /* ---------- side panel (right) ---------- */
  #side { width: min(36vw, 390px); flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 4px 10px 0; }
  #side h1 { margin: 0; text-align: center; font-size: clamp(22px, 2.8vw, 34px); color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 var(--accent); letter-spacing: 1px; }
  #help { font-size: 16px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 5px 8px; font-weight: bold; }
  .fact { font-size: 15px; text-align: center; background: #fff3e0; border: 4px dashed #8d6e63; border-radius: 14px; padding: 5px 8px; font-weight: bold; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .row3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .row4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .row3 .btn, .row4 .btn { font-size: 15px; padding: 5px 3px; }
  #pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; min-height: 34px; }
  .sw.sq { border-radius: 8px; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .lbl { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: -4px; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px; padding: 6px 8px; cursor: pointer;
    box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-tpl { background: #c3a6ff; } .b-sur { background: #9bf6ff; } .b-save { background: #8ef08e; } .b-gal { background: #ffd180; }
  .b-print { background: #8ef08e; } .b-p2 { background: #ffb347; } .b-no { background: #ffc2d6; } .b-back { background: #9be3ff; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .hide { display: none !important; }
  input[type=range] { width: 100%; height: 40px; accent-color: var(--accent); touch-action: none; }
  /* ---------- pop-up boxes ---------- */
  .ov { position: fixed; inset: 0; background: rgba(20, 30, 70, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1180px; max-height: 100%;
    display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3.2vw, 34px); }
  .cards { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 4px 4px 10px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tabs .btn { font-size: 18px; min-height: 50px; padding: 4px 14px; background: #e8eefc; }
  .tabs .btn.on { background: #ffd60a; box-shadow: 0 0 0 4px #1e6bff; }
  .pick { background: #f4f9ff; border: 4px solid #333; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .pick svg { width: 100%; max-width: 140px; height: auto; display: block; border: 2px solid #999; border-radius: 6px; background: #fff; cursor: pointer; }
  .pick b { font-size: 17px; text-align: center; }
  .pick .row2 { width: 100%; gap: 5px; }
  .pick .btn { font-size: 15px; min-height: 44px; padding: 3px; border-radius: 12px; box-shadow: 0 3px 0 #333; }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 22px; padding: 30px; }
  #askCard { max-width: 640px; text-align: center; }
  #askText { font-size: 26px; font-weight: bold; }
  #askBtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  #askBtns .btn { font-size: 22px; min-height: 64px; }
  #prCard { max-width: 760px; }
  #prBig { display: flex; justify-content: center; min-height: 0; flex: 1; }
  #prBig svg { height: min(58vh, 640px); width: auto; max-width: 100%; border: 4px solid #333; border-radius: 8px; background: #fff; }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; pointer-events: none; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #studio { flex-wrap: wrap; align-content: flex-start; overflow-y: auto; }
    #tools { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .tool { min-width: 76px; }
    #board { width: 100%; flex: none; height: 62vh; }
    #side { width: 100%; overflow: visible; }
  }
  @media (max-height: 600px) { .tool { min-height: 54px; } .tool i { font-size: 24px; } .btn { min-height: 46px; font-size: 16px; } #help { font-size: 14px; } .sw { min-height: 26px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  :root { --accent: #ff6ec7; --bg: repeating-linear-gradient(45deg, #ffe3f3 0 36px, #ffd1ea 36px 72px); }
  #cv { background: #fff; cursor: pointer; }
  #shapes .btn { font-size: 15px; padding: 4px 2px; }
  #bIron { font-size: 24px; min-height: 62px; }
  #bIron.on { background: #ffe0b2; }
  #pal { grid-template-columns: repeat(8, 1fr); gap: 6px; }
</style>
</head>
<body>
<div id="studio">
  <div id="tools">
    <button class="tool" id="tBead"><i>📿</i><span>Beads</span></button>
    <button class="tool" id="tFill"><i>🪣</i><span>Fill</span></button>
    <button class="tool" id="tEraser"><i>🧽</i><span>Eraser</span></button>
    <button class="tool" id="tUndo"><i>↩️</i><span>Undo</span></button>
    <button class="tool" id="tClear"><i>🗑️</i><span>Clear</span></button>
  </div>
  <div id="board"><div id="cvWrap"><canvas id="cv" width="696" height="696"></canvas></div></div>
  <div id="side">
    <h1>📿 BEAD MAKER</h1>
    <div id="help">Pick a bead color, then tap or drag on the pegs!</div>
    <div class="lbl">🔲 Pegboard</div>
    <div class="row4" id="shapes">
      <button class="btn" data-s="square">⬜<br>Square</button>
      <button class="btn" data-s="heart">❤️<br>Heart</button>
      <button class="btn" data-s="circle">⚪<br>Circle</button>
      <button class="btn" data-s="star">⭐<br>Star</button>
    </div>
    <div class="lbl">🎨 Bead colors</div>
    <div id="pal"></div>
    <button class="btn b-magic" id="bIron">✨ Iron it!</button>
    <button class="btn b-tpl" id="bTpl">📋 Start from a picture</button>
    <div class="row3">
      <button class="btn b-save" id="bSave">💾 Save</button>
      <button class="btn b-gal" id="bGal">🖼️ Gallery</button>
      <button class="btn b-p2" id="bPrint">🖨️ Print</button>
    </div>
  </div>
</div>
<div class="ov" id="tplBox"><div class="card"><h2>📋 Start from a picture</h2>
  <div class="tabs" id="tplTabs"></div>
  <div class="cards" id="tplList"></div>
  <button class="btn b-back" data-close="1">⬅️ Back to my beads</button></div></div>
<div class="ov" id="galBox"><div class="card"><h2 id="galTitle">🖼️ My Gallery</h2>
  <div class="cards" id="galList"></div>
  <button class="btn b-back" data-close="1">⬅️ Back</button></div></div>
<div class="ov" id="prBox"><div class="card" id="prCard"><h2>🖨️ Print it out</h2>
  <div class="row2"><button class="btn mode" id="prBW">⚫ Black &amp; White</button><button class="btn mode" id="prCol">🌈 Color</button></div>
  <div id="prBig"></div>
  <div id="prHow" class="lbl" style="margin:0"></div>
  <div class="row2"><button class="btn b-print" id="prGo">🖨️ Print it!</button><button class="btn b-back" data-close="1">⬅️ Back</button></div></div></div>
<div class="ov" id="askBox"><div class="card" id="askCard"><div id="askText"></div><div id="askBtns"></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// ---------- 📋 the Pixel Art Studio templates (copied from pixelart.html): PAL colors + 16 x 16 drawings ----------
const PAL = [null,
  ['#ff3b30', 'Red', 'r'], ['#ff8a1f', 'Orange', 'o'], ['#ffd60a', 'Yellow', 'y'], ['#a8e61d', 'Lime', 'l'],
  ['#2ecc40', 'Green', 'g'], ['#127a35', 'Dark Green', 'G'], ['#1abc9c', 'Teal', 't'], ['#5ac8fa', 'Sky Blue', 's'],
  ['#1e6bff', 'Blue', 'b'], ['#1a2a6c', 'Navy', 'n'], ['#9b59ff', 'Purple', 'p'], ['#d1b3ff', 'Light Purple', 'P'],
  ['#ff6ec7', 'Pink', 'k'], ['#ffc2d6', 'Light Pink', 'K'], ['#c2185b', 'Berry', 'm'], ['#8b5a2b', 'Brown', 'B'],
  ['#d9a35b', 'Tan', 'T'], ['#ffd9b3', 'Peach', 'e'], ['#f5b301', 'Gold', 'd'], ['#ffffff', 'White', 'W'],
  ['#c8ccd4', 'Light Gray', 'a'], ['#7a808c', 'Gray', 'A'], ['#3a3f4a', 'Dark Gray', 'D'], ['#111111', 'Black', 'x']];
const NCOL = PAL.length - 1, BLACK = 24;
const LETTER = {}; PAL.forEach((p, i) => { if (p) LETTER[p[2]] = i; });
// ---------- 📋 the templates, drawn as 16 x 16 pixel rows ('.' = empty) ----------
const STAR = [
  '.......XX.......', '.......XX.......', '......XXXX......', '......XXXX......',
  'XXXXXXXXXXXXXXXX', '.XXXXXXXXXXXXXX.', '..XXXXXXXXXXXX..', '...XXXXXXXXXX...',
  '....XXXXXXXX....', '....XXXXXXXX....', '...XXXXXXXXXX...', '...XXXXXXXXXX...',
  '..XXXXX..XXXXX..', '..XXXX....XXXX..', '.XXX........XXX.', '.XX..........XX.'];
// put pixels on top of a drawing: marks = [[row, col, letter], ...]
function stamp(rows, marks) { const g = rows.map(r => r.split('')); marks.forEach(([r, c, ch]) => { g[r][c] = ch; }); return g.map(r => r.join('')); }
// add an outline of one color around a shape
function ring(rows, ch) {
  const H = rows.length, W = rows[0].length, at = (r, c) => r >= 0 && c >= 0 && r < H && c < W && rows[r][c] !== '.';
  return rows.map((row, r) => row.split('').map((v, c) => v !== '.' ? v : (at(r - 1, c) || at(r + 1, c) || at(r, c - 1) || at(r, c + 1)) ? ch : '.').join(''));
}
const NOVA_BANDS = 'rrroooyyggssbbpp';
// the plain Robo drawing, then fun versions of him made by recoloring and stamping new pixels on top
const ROBO = [
  '.......bb.......', '.......aa.......', '.......aa.......', '....xxxxxxxx....',
  '...xWWWWWWWWx...', '..xWWWWWWWWWWx..', 'bbxWxxxxxxxxWxbb', 'bbxWxsbxxsbxWxbb',
  'bbxWxbbxxbbxWxbb', 'bbxWxxxxxxxxWxbb', '..xWWWWWWWWWWx..', '..xWWKWWWWKWWx..',
  '...xWWWWWWWWx...', '....xxxxxxxx....', '.....xaaaax.....', '....xbbbbbbx....'];
const EYES = [[7, 5], [7, 6], [7, 9], [7, 10], [8, 5], [8, 6], [8, 9], [8, 10]];
// swap colors: map = { W: 'd' } turns every white pixel gold; rowsOnly = which rows to change (all if left out)
function recolor(rows, map, rowsOnly) { return rows.map((r, i) => rowsOnly && !rowsOnly.includes(i) ? r : r.split('').map(ch => map[ch] || ch).join('')); }
function setRows(rows, repl) { const g = rows.slice(); Object.keys(repl).forEach(k => { g[+k] = repl[k]; }); return g; }
function roboVariants() {
  const eyes = ch => EYES.map(([r, c]) => [r, c, ch]);
  return [
    { id: 'robogold', name: '🌟 Golden Robo', rows: stamp(recolor(ROBO, { W: 'd' }), [[11, 5, 'y'], [11, 10, 'y']]) },
    { id: 'robolove', name: '😍 Love Robo', rows: stamp(ROBO, eyes('k').concat([[11, 5, 'r'], [11, 10, 'r']])) },
    { id: 'robocool', name: '😎 Cool Robo', rows: stamp(recolor(ROBO, { x: 'D' }, [6, 7, 8, 9]),
      [[7, 4, 'x'], [7, 5, 'x'], [7, 6, 'x'], [7, 7, 'x'], [7, 8, 'x'], [7, 9, 'x'], [7, 10, 'x'], [7, 11, 'x'], [8, 5, 'x'], [8, 6, 'x'], [8, 9, 'x'], [8, 10, 'x'], [7, 5, 'W'], [7, 9, 'W']]) },
    { id: 'robosleepy', name: '😴 Sleepy Robo', rows: stamp(ROBO, eyes('x').concat([[8, 5, 's'], [8, 6, 's'], [8, 9, 's'], [8, 10, 's'],
      [0, 11, 's'], [0, 12, 's'], [0, 13, 's'], [1, 12, 's'], [2, 11, 's'], [2, 12, 's'], [2, 13, 's']])) },
    { id: 'robopumpkin', name: '🎃 Pumpkin Robo', rows: stamp(recolor(ROBO, { W: 'o', K: 'y' }), [[0, 7, 'G'], [0, 8, 'G'], [1, 7, 'g'], [2, 8, 'g'], [1, 8, '.'], [2, 7, '.']]) },
    { id: 'roboice', name: '🥶 Ice Robo', rows: recolor(ROBO, { W: 's', b: 'W', K: 'W' }) },
    { id: 'roboking', name: '👑 King Robo', rows: setRows(ROBO, { 0: '....d..dd..d....', 1: '....dddddddd....', 2: '....drdddbdd....' }) },
    { id: 'robopirate', name: '🏴‍☠️ Pirate Robo', rows: stamp(recolor(ROBO, { W: 'r' }, [4]), [[8, 5, 'x'], [7, 5, 'x'], [7, 6, 'x'], [8, 6, 'x'], [5, 4, 'x'], [5, 5, 'x'], [5, 6, 'x']]) },
    { id: 'robosanta', name: '🎅 Santa Robo', rows: setRows(ROBO, { 0: '..........WW....', 1: '.......rrrrW....', 2: '.....rrrrrr.....', 3: '...WWWWWWWWWW...' }) },
    { id: 'robocat', name: '🐱 Cat Robo', rows: stamp(setRows(ROBO, { 0: '................', 1: '...xx......xx...', 2: '...xKx....xKx...' }), [[11, 3, 'a'], [11, 12, 'a'], [10, 2, 'a'], [10, 13, 'a']]) },
    { id: 'robophantom', name: '👻 Phantom Robo', rows: setRows(recolor(ROBO, { W: 'P', x: 'p', b: 't', s: 't', K: 'W', a: 'P' }),
      { 13: '...pPPPPPPPPp...', 14: '...pPp.pPp.pPp..', 15: '....p...p...p...' }) },
    { id: 'robo2', name: '💚 Robo 2.0', rows: stamp(setRows(recolor(recolor(ROBO, { b: 'g', s: 'l', K: 'k' }), { g: 'p' }, [0, 15]),   // Robo 2.0 has NO antenna
      { 0: '................', 1: '................', 2: '................' }), [[4, 12, 'k'], [12, 3, 'l']]) },
    // ⏰ Time Robo & 🔒 Lock Robo only use the bead colors Ben HAS: pink, red, 4 blues, lime, orange, yellow, brown, white (no black, gray or purple)
    { id: 'robotime', name: '⏰ Time Robo', rows: stamp(recolor(ROBO, { x: 'B', W: 'y', b: 'o', a: 'B', K: 'o', s: 'k' }),
      [6, 7, 8, 9].flatMap(r => [4, 5, 6, 7, 8, 9, 10, 11].map(c => [r, c, 'n']))
        .concat(EYES.map(([r, c]) => [r, c, 'k']), [[7, 7, 'W'], [7, 8, 'W'], [8, 7, 'W'], [8, 8, 'B'], [0, 7, 'r'], [0, 8, 'r'], [5, 4, 'W'], [5, 11, 'W']],
          [5, 6, 7, 8, 9, 10].map(c => [15, c, 'k']))) },
    { id: 'robolock', name: '🔒 Lock Robo', rows: stamp(recolor(ROBO, { x: 'n', W: 's', b: 't', a: 'b', K: 'b', s: 'y' }),
      [6, 7, 8, 9].flatMap(r => [4, 5, 6, 7, 8, 9, 10, 11].map(c => [r, c, 'b']))
        .concat(EYES.map(([r, c]) => [r, c, 'y']), [[7, 7, 'W'], [7, 8, 'W'], [8, 7, 'n'], [8, 8, 'n'], [0, 7, 'y'], [0, 8, 'y'],
          [10, 6, 'y'], [10, 7, 'y'], [10, 8, 'y'], [10, 9, 'y'], [11, 6, 'y'], [11, 7, 'B'], [11, 8, 'B'], [11, 9, 'y'], [12, 6, 'y'], [12, 7, 'y'], [12, 8, 'y'], [12, 9, 'y'],
          [4, 4, 'W'], [4, 11, 'W']])) },
    { id: 'roborainbow', name: '🌈 Rainbow Robo', rows: recolor(recolor(recolor(recolor(recolor(recolor(ROBO, { W: 'r' }, [4]), { W: 'o' }, [5]), { W: 'y' }, [6, 7, 8, 9]), { W: 'g' }, [10]), { W: 's' }, [11]), { W: 'p' }, [12]) },
  ];
}
// 🤖 HEAD-ONLY Robo portraits (Ben: every Robo template shows just the HEAD, like the first Robo!)
// HEAD is the first Robo's head as a stencil. Each number is a part that gets its own color:
// 1 antenna tip, 2 antenna stem, 3 outline, 4 head, 5 ear pods, 6 visor, 7 eye shine, 8 eyes, 9 cheeks, 0 neck, - collar
const HEAD = [
  '.......11.......', '.......22.......', '.......22.......', '....33333333....',
  '...3444444443...', '..344444444443..', '5534666666664355', '5534678667864355',
  '5534688668864355', '5534666666664355', '..344444444443..', '..344944449443..',
  '...3444444443...', '....33333333....', '.....300003.....', '....3------3....'];
const HEAD_PART = { tip: 1, stem: 2, line: 3, head: 4, pod: 5, visor: 6, shine: 7, eye: 8, cheek: 9, neck: 0, collar: '-' };
// rhead({ head: 'p', pod: 'o' }, { 0: 'new row 0' }, [[row, col, letter], ...]): a Robo head in new colors, with new rows + pixels on top
function rhead(o, rows, marks) {
  const c = { 1: 'b', 2: 'a', 3: 'x', 4: 'W', 5: 'b', 6: 'x', 7: 's', 8: 'b', 9: 'K', 0: 'a', '-': 'b' };
  Object.keys(o || {}).forEach(k => { c[HEAD_PART[k]] = o[k]; });
  let g = HEAD.map(r => r.replace(/[0-9-]/g, ch => c[ch]));
  if (rows) g = setRows(g, rows);
  return marks ? stamp(g, marks) : g;
}
const HAPPY = ch => [[7, 5, ch], [8, 4, ch], [8, 6, ch], [7, 10, ch], [8, 9, ch], [8, 11, ch]];       // ^ ^ happy eyes (set eye + shine to the visor color)
const SMILE = ch => [[11, 6, ch], [12, 7, ch], [12, 8, ch], [11, 9, ch]];                               // a little smile under the visor
const POD = (ch, rows) => rows.flatMap(r => [[r, 0, ch], [r, 1, ch], [r, 14, ch], [r, 15, ch]]);         // recolor ear-pod rows
const CROWN_ORBS = '...rdbdgdBdsy...';   // fire, water, wind, earth, ice + lightning orbs
// 🏭 the Sus Factory crew: each one's own head SHAPE (rows 3 to 13: # = outline, - = body color, * = their extra color),
// with the crew's dark visor + white eyes, dark side pods, a ball antenna and a little neck
const SUS_SHAPE = {

// vy = how many rows lower the visor sits (for pointy shapes)
function sus(shape, body, line, ball, extra, marks, vy = 0) {
  const g = Array.from({ length: 16 }, () => '.'.repeat(16).split(''));
  SUS_SHAPE[shape].forEach((r, i) => r.split('').forEach((ch, c) => { g[i + 3][c] = ch === '#' ? line : ch === '-' ? body : ch === '*' ? extra : '.'; }));
  g[0][7] = g[0][8] = ball;                                                         // the ball antenna, down to the head
  for (let r = 1; r < 16 && g[r][7] === '.'; r++) g[r][7] = g[r][8] = line;
  for (let c = 6; c <= 9; c++) { g[14][c] = line; for (let r = 13; r > 3 && g[r][c] === '.'; r--) g[r][c] = line; }   // the neck
  for (let c = 5; c <= 10; c++) g[15][c] = 'D';
  for (let r = 6 + vy; r <= 9 + vy; r++) {
    for (let c = 0; c < 8 && g[r][c] === '.'; c++) g[r][c] = 'D';                 // dark side pods
    for (let c = 15; c > 7 && g[r][c] === '.'; c--) g[r][c] = 'D';
    const edge = r === 6 + vy || r === 9 + vy;
    for (let c = edge ? 5 : 4; c <= (edge ? 10 : 11); c++) g[r][c] = 'D';          // the dark visor...
    if (!edge) [5, 6, 9, 10].forEach(c => { g[r][c] = 'W'; });                     // ...with white eyes
  }
  (marks || []).forEach(([r, c, ch]) => { g[r][c] = ch; });
  return g.map(r => r.join(''));
}

// ✨ IRON IT: melt the beads with a gentle animation (tap again to pop them back to beads)

  pushUndo(); ironed = true; ironT = 0; updateUI();

// ---------- 📋 start from a Pixel Art Studio picture: it scales onto the board ----------
function tplGrid(t) { return t.rows.map(r => r.split('').map(ch => ch === '.' ? 0 : (LETTER[ch] || 0))); }

function placeTpl(g, S) {

let tplTab = 'all';
function renderTemplates() {
  $('tplTabs').innerHTML = TPL_TABS.map(([k, label]) => `<button class="btn${k === tplTab ? ' on' : ''}" data-tab="${k}">${label}</button>`).join('');
  $('tplTabs').querySelectorAll('button').forEach(b => b.onclick = () => { tplTab = b.dataset.tab; renderTemplates(); $('tplList').scrollTop = 0; blip(520, 0, .06); });

// ---------- 🖼️ gallery hooks ----------
const CODE = '0123456789abcdefghijklmno';
function getArt() { if (!cells.some(v => v)) return null; return { shape, c: cells.map(v => CODE[v]).join(''), ironed }; }

// ---------- 🖨️ print: Color = bead chart + color key + counts; B&W = a number in every bead square + numbered key ----------
