<script>
// 🎉 BEN'S BIG KID PARTY! (💡 Party ideas by Ben!)
// Robo and ALL the Game Factory friends throw a giant party just for Ben, the Big Kid.
// Areas (tap them on the Party Map):
//   🏰 Giant Bouncy Castle (Ben's idea)   🐱 Cat Lounge (Ben's idea)   🎂 Cake (Ben's idea)   🎮 Party Games (Ben's idea)
//   🕹️ Mega Mall Arcade + claw machines + prize counter, claw prizes PRINT as paper cube buddies (Ben's idea)
//   🎁 Present Pile, 🪅 Piñata, 🎆 Sparkle Fireworks (🤖 Robo's surprises!)
// Everything is tap-friendly. Keys: arrows + Space/Enter, Escape = back to the map, M = music.
// All sound is soft: one master volume of 0.15 with fades. Balloons pop softly, fireworks only sparkle (no bangs).
// Save: localStorage 'bigKidParty' (tickets, prizes, plushies). Trophies: bigKidParty, partyClaw, partyCake.
// Music for the Jukebox: bigkidparty.html?song=party | arcade | bigkid  (or window.JUKEBOX.song)
const C = document.getElementById('c'), W = 960, H = 540;
let ctx = C.getContext('2d');
let frame = 0;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);

function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); if (t[id]) return; t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (from Robo's Birthday Surprise) ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath(); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); ctx.textBaseline = 'alphabetic'; }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {
  r = Math.max(1, r); const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');

}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35); ctx.fill();
}
function heartPath(x, y, s) { ctx.beginPath(); ctx.moveTo(x, y + s * 0.35); ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45); ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35); }
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();

const drawStar = star;

  const words = String(str).split(' '), out = []; let cur = '';

  if (cur) out.push(cur); return out;
}
function rng(seed) { let v = ((seed * 2654435761) >>> 0) || 1; for (let i = 0; i < 3; i++) v = (v * 1664525 + 1013904223) >>> 0; return () => { v = (v * 1664525 + 1013904223) >>> 0; return v / 4294967296; }; }

  ctx.save(); ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(0, -26); ctx.lineTo(10, 0); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#fff59d'; ctx.lineWidth = 2.4; ctx.beginPath(); ctx.moveTo(-6, -9); ctx.lineTo(5, -12); ctx.moveTo(-3, -17); ctx.lineTo(3, -19); ctx.stroke();
  circle(0, -27, 3.6, '#fff59d'); ctx.restore();
}
function balloon(x, y, col, t = frame, str = 70, r = 22) {   // 🎈 x, y = middle of the balloon
  const sw = Math.sin(t * 0.04 + x) * 4;
  ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y + r);
  ctx.quadraticCurveTo(x + sw, y + r + str / 2, x - sw, y + r + str); ctx.stroke();
  ellipse(x, y, r * 0.86, r, col); ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(x - 4, y + r + 4); ctx.lineTo(x, y + r - 2); ctx.lineTo(x + 4, y + r + 4); ctx.fill();
  ellipse(x - r * 0.3, y - r * 0.4, r * 0.2, r * 0.32, 'rgba(255,255,255,.5)', -0.4);
}
const BCOLS = ['#ff5252', '#ffd740', '#40c4ff', '#69f0ae', '#e040fb', '#ff9100', '#ff80ab', '#7c4dff'];
function crown(x, y, s, shine = 1) {                      // 👑 Ben's golden BIG KID crown (x, y = bottom middle)
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  if (shine) glow(0, -12, 40, 'rgba(255,220,90,.55)', 0.6 + 0.3 * Math.sin(frame * 0.06));
  poly([-22, 0, -24, -24, -12, -12, 0, -30, 12, -12, 24, -24, 22, 0], '#ffd54f', '#c99400', 2.5);
  ctx.fillStyle = '#ffecb3'; ctx.fillRect(-20, -7, 40, 4);
  circle(0, -16, 4, '#e91e63'); circle(-12, -8, 3, '#40c4ff'); circle(12, -8, 3, '#69f0ae');
  for (const [px, py] of [[-24, -24], [0, -30], [24, -24]]) circle(px, py, 3.2, '#fff59d');
  twinkle(16, -30, 5 + Math.sin(frame * 0.15) * 2, 1);
  ctx.restore();
}

<script>
// =====================================================================
// 🔊 SOUND: one quiet master knob (0.15), soft round notes, everything fades. No bangs.
// =====================================================================
let actx = null, master = null, soundOn = true;
function audio() {
  try {
    if (!actx) {
      actx = (window.JUKEBOX && window.JUKEBOX.makeCtx && window.JUKEBOX.makeCtx()) || new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor(); comp.threshold.value = -24; comp.ratio.value = 6;
      master = actx.createGain(); master.gain.value = 0.0001; comp.connect(master); master.connect(actx.destination);
      master.gain.setTargetAtTime(0.15, actx.currentTime, 0.4); master.inp = comp;   // fade in, never above 0.15
    }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
  } catch (_) {}
  return actx;
}
function softNote(f, d = 0.5, v = 0.3, when = 0, type = 'sine', glide) {
  if (!soundOn || !audio() || !master) return;
  try {
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(Math.min(v, 0.5), t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master.inp); o.start(t); o.stop(t + d + 0.05);
  } catch (_) {}
}
let noiseBuf = null;
function softNoise(d = 0.15, v = 0.15, lo = 900, when = 0, type = 'lowpass') {   // a soft "fff" (never a bang)
  if (!soundOn || !audio() || !master) return;
  try {
    if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate); const a = noiseBuf.getChannelData(0); for (let i = 0; i < a.length; i++) a[i] = Math.random() * 2 - 1; }
    const t = actx.currentTime + when, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
    s.buffer = noiseBuf; f.type = type; f.frequency.value = lo;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(Math.min(v, 0.3), t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    s.connect(f); f.connect(g); g.connect(master.inp); s.start(t); s.stop(t + d + 0.05);
  } catch (_) {}
}
const PENT = [523, 587, 659, 784, 880, 1047, 1175];
const plip = () => softNote(pick(PENT), 0.35, 0.22);
const boop = () => { softNote(440, 0.18, 0.25, 0, 'sine', 620); };
const tick = () => softNote(1320, 0.08, 0.12);
const popSoft = () => { softNoise(0.12, 0.2, 700); softNote(520, 0.15, 0.18, 0, 'sine', 300); };          // 🎈 a soft balloon "pfft-plip"
const ticketSnd = () => { softNote(880, 0.12, 0.2); softNote(1175, 0.18, 0.2, 0.08); };
const yay = () => { [523, 659, 784, 1047].forEach((f, i) => softNote(f, 0.5, 0.2, i * 0.08)); };
const sparkleSnd = () => { for (let i = 0; i < 5; i++) softNote(pick(PENT) * 2, 0.4, 0.08, i * 0.06); };
const whoosh = () => softNoise(0.7, 0.12, 1400, 0, 'bandpass');
const mrrp = () => { softNote(330, 0.25, 0.18, 0, 'triangle', 470); };
const nom = () => { softNote(300, 0.08, 0.2); softNote(360, 0.08, 0.2, 0.12); softNote(300, 0.08, 0.2, 0.24); };
const boing = (k = 1) => softNote(220 * k, 0.35, 0.25, 0, 'sine', 520 * k);
const oops = () => { softNote(440, 0.25, 0.15, 0, 'sine', 330); };
function voice(line) {
  try { if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?,.'-]/g, '')); u.rate = 0.95; u.pitch = 1.15; u.volume = 0.7; speechSynthesis.speak(u); } catch (_) {}
}

<script>
// =====================================================================
// 🎵 MUSIC (all original). mel = [midi, beats]; chords = [root, minor] one per bar. Melody notes sit on the chord tones.
//   party  = "Big Kid Bounce" (C major, bouncy)      arcade = "Mega Mall Lights" (G major, sparkly)
//   bigkid = "Happy Big Kid Day" (F major waltz, the cake song, plays once)
// =====================================================================
const SONGS = {
  party: { beat: 0.33, bar: 4, loop: true, name: 'Big Kid Bounce',
    mel: [[72, 1], [76, 1], [79, 1], [76, 1], [76, 1], [72, 1], [69, 2], [77, 1], [72, 1], [69, 1], [72, 1], [74, 1], [79, 1], [71, 1], [74, 1],
          [79, 1.5], [76, 0.5], [72, 2], [72, 1], [76, 1], [81, 2], [81, 1], [77, 1], [72, 1], [77, 1], [79, 1], [74, 1], [71, 1], [67, 1]],
    chords: [[48], [45, 1], [41], [43], [48], [45, 1], [41], [43]] },
  arcade: { beat: 0.27, bar: 4, loop: true, name: 'Mega Mall Lights',
    mel: [[67, .5], [71, .5], [74, .5], [79, .5], [74, 1], [71, 1], [76, 1], [71, 1], [67, .5], [71, .5], [76, 1], [72, .5], [76, .5], [79, .5], [76, .5], [72, 2],
          [74, 1], [78, 1], [81, 1], [78, 1], [79, 1], [74, .5], [71, .5], [67, 2], [64, 1], [67, 1], [71, 1], [76, 1], [76, 1], [72, 1], [67, 1], [72, 1], [74, .5], [78, .5], [81, 1], [74, 2]],
    chords: [[43], [40, 1], [48], [50], [43], [40, 1], [48], [50]] },
  bigkid: { beat: 0.42, bar: 3, loop: false, name: 'Happy Big Kid Day',
    mel: [[65, 1], [69, 1], [72, 1], [72, 2], [67, 1], [70, 1], [74, 1], [77, 1], [77, 2], [72, 1], [69, 1], [72, 1], [77, 1], [74, 2], [70, 1], [72, 1], [76, 1], [79, 1], [77, 3]],
    chords: [[41], [48], [46], [41], [41], [46], [48], [41]],
    words: ['Happy Big Kid Day to you!', 'Ben, you\'re awesome through and through!', 'Robo, cats and friends all say:', 'Hip hip hooray, it\'s Big Kid Day!'] },
};
function songEvents(S) {
  const ev = []; let b = 0;
  S.mel.forEach(([m, d]) => { ev.push({ b, m, d: d * S.beat * 0.92, v: 0.16, w: 'triangle' }); b += d; });
  S.chords.forEach(([r, minor], bar) => {
    const t = bar * S.bar;
    ev.push({ b: t, m: r, d: S.beat * 1.3, v: 0.22, w: 'sine' });
    if (S.bar === 4) ev.push({ b: t + 2, m: r + 12, d: S.beat * 1.1, v: 0.16, w: 'sine' });
    for (let k = 1; k < S.bar; k++) {                 // soft off-beat chord "chk"s
      const at = t + k + (S.bar === 4 ? 0.5 : 0);
      ev.push({ b: at, m: r + 12 + (minor ? 3 : 4), d: S.beat * 0.45, v: 0.06, w: 'sine' });

for (const k in SONGS) SONGS[k].ev = songEvents(SONGS[k]);
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || decodeURIComponent((/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '');
const mus = { want: 'party', id: null, t0: null, k: 0, loop: 0, last: 0, gain: null, timer: null, done: null, on: true };
function musNote(e, t, S) {

    const o = actx.createOscillator(), g = actx.createGain();
    o.type = e.w; o.frequency.setValueAtTime(440 * Math.pow(2, (e.m - 69) / 12), t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(e.v, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + e.d);

  } catch (_) {}
}
function musicTick() {
  if (!mus.id || !actx || actx.state !== 'running' || !mus.gain) { mus.t0 = null; return; }
  const S = SONGS[mus.id], now = actx.currentTime;
  if (mus.t0 === null || now - mus.last > 1) { mus.t0 = now + 0.15; mus.k = 0; mus.loop = 0; }   // (re)start cleanly, never a pile-up

  sammy: { fur: '#8d6e63', dark: '#1d1512', belly: '#f3e3c3', ear: '#ffb3c6', eye: '#b5b83a', line: '#3e2a22', stripes: true, paws: '#f3e3c3', eyeRim: '#fff4dc' },

SCREENS.pinata = {
  start() { Object.assign(PN, { hits: 0, swing: 0, sv: 0, open: false, goodies: [], bonk: 0 }); },
  update() {
    PN.sv += -PN.swing * 0.02; PN.sv *= 0.985; PN.swing += PN.sv; if (PN.bonk > 0) PN.bonk--;
    for (const g of PN.goodies) { if (g.got) continue; g.vy += 0.35; g.x += g.vx; g.y += g.vy; if (g.y > 470) { g.y = 470; g.vy *= -0.4; g.vx *= 0.8; } if (g.x < 30 || g.x > 930) g.vx *= -1; }
  },
  hit() {

    floatText(pick(['BONK!', 'Boing!', 'Whee!', 'Again!']), PN_X + rnd(-80, 80), PN_Y - 60, '#fff', 30);
    if (PN.hits >= PN.need) {
      PN.open = true; yay(); confettiBurst(PN_X, PN_Y, 80); banner('🪅 It opened! Tap the goodies to catch them!', '#ffeb3b');
      const items = ['🍬', '🍭', '🍫', '🧸', '⭐', '🍬', '🍭', '🎟️', '🎟️', '🎟️', '🎟️', '🎟️', '🎟️', '🍩', '🪀', '🍬'];
      PN.goodies = items.map(e => ({ e, x: PN_X + rnd(-30, 30), y: PN_Y, vx: rnd(-6, 6), vy: rnd(-9, -2), got: false }));
    }
  },
  tap(x, y) {
    if (!PN.open) { this.hit(); return; }
    for (const g of PN.goodies) if (!g.got && Math.hypot(g.x - x, g.y - y) < 46) { this.grab(g); return; }
  },
  grab(g) { g.got = true; if (g.e === '🎟️') { addTickets(1, g.x, g.y); PN.got++; } else { PN.yum++; floatText(g.e + ' Yum!', g.x, g.y - 20, '#fff', 26); plip(); } },
  draw() {

// 🎆 THE SPARKLE SHOW (🤖 Robo's surprise!): tap the sky for gentle sparkle fireworks. No bangs, just twinkles!
// The GRAND FINALE writes BIG KID BEN in the sky.
// =====================================================================
const FW = { rockets: [], parts: [], shapeI: 0, finale: 0, letters: null, said: false };
const FW_SHAPES = ['ring', 'heart', 'star', 'smile', 'ring2'];
function fwBurst(x, y, shape, col) {
  const add = (vx, vy, c) => FW.parts.push({ x, y, vx, vy, c: c || col, life: rnd(70, 110), tw: rnd(0, 6) });
  const N = 44;
  for (let i = 0; i < N; i++) {
    const a = i / N * Math.PI * 2;
    if (shape === 'heart') { const t = a, hx = 16 * Math.pow(Math.sin(t), 3), hy = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)); add(hx * 0.22, hy * 0.22, '#ff80ab'); }
    else if (shape === 'star') { const k = i % 2 ? 0.45 : 1, aa = -Math.PI / 2 + Math.floor(i / (N / 10)) * Math.PI / 5; const p0 = Math.floor(i / 4.4); const a1 = -Math.PI / 2 + p0 * Math.PI / 5, a2 = a1 + Math.PI / 5, r1 = p0 % 2 ? 2.2 : 4.8, r2 = p0 % 2 ? 4.8 : 2.2, u = (i % 4.4) / 4.4;
      add(lerp(Math.cos(a1) * r1, Math.cos(a2) * r2, u), lerp(Math.sin(a1) * r1, Math.sin(a2) * r2, u), '#ffd740'); }

    else if (shape === 'ring2') { add(Math.cos(a) * 4.5, Math.sin(a) * 4.5, col); add(Math.cos(a) * 2.6, Math.sin(a) * 2.6, pick(BCOLS)); }
    else add(Math.cos(a) * rnd(3.5, 4.8), Math.sin(a) * rnd(3.5, 4.8), i % 3 ? col : '#fff');
  }
  sparkleSnd(); softNoise(0.6, 0.05, 3000, 0, 'highpass');                  // a soft "shhhh" sparkle, never a bang
}
function fwLaunch(tx, ty, shape) { FW.rockets.push({ x: tx + rnd(-60, 60), y: H, sx: 0, tx, ty: clamp(ty, 60, 330), k: 0, shape: shape || FW_SHAPES[FW.shapeI++ % FW_SHAPES.length], col: pick(BCOLS) }); softNoise(0.5, 0.06, 900, 0, 'bandpass'); }

SCREENS.fireworks = {
  start() { FW.rockets = []; FW.parts = []; FW.finale = 0; FW.letters = null; },
  update() {
    for (const r of FW.rockets) { r.k += 0.025; if (r.k >= 1 && !r.done) { r.done = true; fwBurst(r.tx, r.ty, r.shape, r.col); } }

    ctx.fillStyle = '#1b0f3d'; ctx.beginPath(); ctx.moveTo(0, 430); ctx.quadraticCurveTo(480, 380, W, 430); ctx.lineTo(W, H); ctx.lineTo(0, H); ctx.fill();

    if (FW.letters) for (const l of FW.letters) { ctx.globalAlpha = 0.7 + 0.3 * Math.sin(frame * 0.2 + l.tw); glow(l.x, l.y, 9, l.c, 0.5); circle(l.x, l.y, 3, l.c); }
    ctx.restore();
    ['charlie', 'august', 'robo', 'ben', 'tiger', 'sparks', 'mimo'].forEach((id, i) => drawWho(id, 120 + i * 82, 525, { s: id === 'ben' ? 0.62 : 0.55, face: i < 3 ? 1 : -1, happy: FW.parts.length > 0 || !!FW.letters }));
    topBar('🎆 The Sparkle Show');
    if (!FW.finale && !FW.parts.length && !FW.rockets.length) emojiText('Tap the sky to launch a sparkle firework! ✨', W / 2, 200, 26, '#fff59d');
    button(W - 250, 466, 236, 62, '🌟 Grand Finale!', FW.finale ? '#9e9e9e' : '#ff4081', () => { if (!FW.finale) { FW.finale = 1; FW.letters = null; } }, 24, { ring: !FW.finale && frame % 60 < 30 });
  },
  tap(x, y) { if (y < 400) fwLaunch(x, y); },
  key(k) { if (k === ' ') fwLaunch(rnd(150, 810), rnd(90, 300)); else if (k === 'Enter' && !FW.finale) FW.finale = 1; },
};
