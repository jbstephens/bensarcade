<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Retro Arcade</title>
<script>TOUCHPAD = { dpad: true, south: [' ', 'GO'] };</script>
<script src="touchpad.js?v=2"></script>
<style>
  html, body { margin: 0; height: 100%; background: #07040f; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  #crt { position: relative; border-radius: 22px; padding: 10px; background: #1a1026;
    box-shadow: 0 0 0 4px #3b2a55, 0 0 28px 6px rgba(0, 255, 200, .45), 0 0 70px 14px rgba(255, 0, 200, .25); }
  #game { display: block; border-radius: 14px; background: #050208; image-rendering: pixelated; touch-action: none; }
  #scan { position: absolute; inset: 10px; border-radius: 14px; pointer-events: none;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,.28) 0 2px, rgba(0,0,0,0) 2px 4px),
                radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%); }
</style>
</head>
<body>
<div id="crt"><canvas id="game" width="960" height="520"></canvas><div id="scan"></div></div>
<script>
// ===================== RETRO ARCADE: core =====================
const W = 960, H = 520, STEP = 1 / 60;
const cv = document.getElementById('game'), ctx = cv.getContext('2d');
const crt = document.getElementById('crt');

function fit() {
  const s = Math.min((innerWidth - 40) / W, (innerHeight - 40) / H);
  cv.style.width = Math.floor(W * s) + 'px'; cv.style.height = Math.floor(H * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- chunky 3x5 pixel font ----------
const FONT = {
  A:'010101111101101', B:'110101110101110', C:'011100100100011', D:'110101101101110', E:'111100110100111',
  F:'111100110100100', G:'011100101101011', H:'101101111101101', I:'111010010010111', J:'001001001101010',
  K:'101101110101101', L:'100100100100111', M:'101111111101101', N:'110101101101101', O:'010101101101010',
  P:'110101110100100', Q:'010101101110011', R:'110101110101101', S:'011100010001110', T:'111010010010010',
  U:'101101101101111', V:'101101101101010', W:'101101111111101', X:'101101010101101', Y:'101101010010010',
  Z:'111001010100111', '0':'111101101101111', '1':'010110010010111', '2':'110001010100111', '3':'110001010001110',
  '4':'101101111001001', '5':'111100110001110', '6':'011100111101111', '7':'111001010010010', '8':'111101111101111',
  '9':'111101111001110', '.':'000000000000010', ',':'000000000010100', '!':'010010010000010', '?':'110001010000010',
  ':':'000010000010000', "'":'010010000000000', '-':'000000111000000', '/':'001001010100100', '+':'000010111010000',
  '<':'001010100010001', '>':'100010001010100', '(':'001010010010001', ')':'100010010010100', '=':'000111000111000',
  '#':'101111101111101', '^':'010101000000000', ' ':'000000000000000'
};
function textW(s, p) { return s.length * 4 * p - p; }
// draw pixel text: p = pixel size, align 'left' | 'center' | 'right', shadow = darker copy underneath
function txt(s, x, y, p, color, align = 'center', shadow = '#000') {
  s = String(s).toUpperCase();
  let x0 = align === 'center' ? x - textW(s, p) / 2 : align === 'right' ? x - textW(s, p) : x;
  x0 = Math.round(x0); y = Math.round(y);
  for (const pass of shadow ? [0, 1] : [1]) {
    ctx.fillStyle = pass ? color : shadow;
    const o = pass ? 0 : Math.max(1, p >> 1);
    for (let i = 0; i < s.length; i++) {
      const g = FONT[s[i]] || FONT['?'];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++)
        if (g[r * 3 + c] === '1') ctx.fillRect(x0 + i * 4 * p + c * p + o, y + r * p + o, p, p);
    }
  }
}
function emoji(e, x, y, size) {
  ctx.font = size + 'px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(e, x, y);
}

// ---------- beepy square-wave sounds ----------
let soundOn = true, actx = null, toast = null;
function audio() {
  if (!actx) { const AC = window.AudioContext || window.webkitAudioContext; if (AC) try { actx = new AC(); } catch (_) {} }
  if (actx && actx.state === 'suspended' && actx.resume) actx.resume();
  return actx;
}
function beep(freq, dur = 0.08, type = 'square', vol = 0.08, delay = 0) {
  if (!soundOn) return; const a = audio(); if (!a) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + dur + 0.02);
}
function tune(notes, len = 0.1) { notes.forEach((f, i) => f && beep(f, len * 0.9, 'square', 0.07, i * len)); }
const SFX = {
  blip: () => beep(660, 0.05), boop: () => beep(330, 0.06), select: () => beep(880, 0.06),
  start: () => tune([523, 659, 784, 1047], 0.08), point: () => tune([784, 1047], 0.09),
  miss: () => tune([300, 220], 0.12), win: () => tune([523, 659, 784, 1047, 784, 1047, 1319], 0.11),
  lose: () => tune([392, 330, 262, 196], 0.16), chomp: () => { beep(520, 0.04); beep(780, 0.05, 'square', 0.07, 0.04); },
  bonk: () => { beep(140, 0.25, 'sawtooth', 0.09); beep(90, 0.3, 'square', 0.07, 0.1); }
};
function showToast(s) { toast = { s, t: 1.4 }; }

// ---------- input ----------
const held = new Set();
let scene = null;          // current scene object: { update(), draw(), key(k), down(x,y), move(x,y,btn), up(x,y) }
const scenes = {};
function go(name) { scene = scenes[name]; scene.enter && scene.enter(); }

addEventListener('keydown', e => {
  const k = e.key;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(k)) e.preventDefault && e.preventDefault();
  audio();
  if (held.has(k)) return; held.add(k);
  if (k === 'm' || k === 'M') { soundOn = !soundOn; showToast(soundOn ? 'SOUND ON' : 'SOUND OFF'); return; }
  if (k === 'Escape' && scene !== scenes.menu) { SFX.boop(); go('menu'); return; }
  scene && scene.key && scene.key(k);
});
addEventListener('keyup', e => held.delete(e.key));
addEventListener('blur', () => held.clear());

function gamePos(e) {
  const r = cv.getBoundingClientRect();
  return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height];
}
let mouseHeld = false;
cv.addEventListener('mousedown', e => { audio(); mouseHeld = true; const [x, y] = gamePos(e); scene && scene.down && scene.down(x, y); });
cv.addEventListener('mousemove', e => { const [x, y] = gamePos(e); scene && scene.move && scene.move(x, y, mouseHeld || e.buttons > 0); });
addEventListener('mouseup', e => { if (!mouseHeld) return; mouseHeld = false; const [x, y] = gamePos(e); scene && scene.up && scene.up(x, y); });

// ---------- shared drawing bits ----------
let clock = 0;   // seconds since start (for blinking)
const blink = (rate = 2) => Math.floor(clock * rate) % 2 === 0;
function clear(bg = '#050208') { ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H); }
function freeLine(y) { txt("INSERT COIN... JUST KIDDING, IT'S FREE!", W / 2, y, 4, blink(1.5) ? '#ffe600' : '#ff4fd8'); }
function panel(x, y, w, h, fill = 'rgba(10,4,20,.85)', edge = '#00ffd0') {
  ctx.fillStyle = edge; ctx.fillRect(x - 4, y - 4, w + 8, h + 8);
  ctx.fillStyle = fill; ctx.fillRect(x, y, w, h);
}

// ===================== MENU: two cabinets =====================
const CABS = [
  { id: 'pong',  name: 'ROBO PONG',      icon: '🏓', x: 170, color: '#00e5ff', trim: '#2979ff' },
  { id: 'snake', name: 'SNAKE SNATCHER', icon: '🐍', x: 550, color: '#c86bff', trim: '#7c2cff' }
];
const CAB_Y = 118, CAB_W = 240, CAB_H = 300;
scenes.menu = {
  sel: 0,
  enter() { this.sel = Math.max(0, CABS.findIndex(c => c.id === startGame)); },
  key(k) {
    if (k === 'ArrowLeft' || k === 'ArrowRight') { this.sel = 1 - this.sel; SFX.blip(); }
    else if (k === ' ' || k === 'Enter') this.pick(this.sel);
  },
  pick(i) { SFX.start(); go(CABS[i].id); },
  down(x, y) {
    CABS.forEach((c, i) => { if (x > c.x - 20 && x < c.x + CAB_W + 20 && y > CAB_Y - 20 && y < CAB_Y + CAB_H + 40) { this.sel = i; this.pick(i); } });
  },
  update() {},
  draw() {
    clear('#08030f');
    // starfield
    for (let i = 0; i < 60; i++) {
      const sx = (i * 157 + clock * (10 + i % 3 * 8)) % W, sy = (i * 89) % H;
      ctx.fillStyle = i % 5 ? '#3a2d5c' : '#8a7cff'; ctx.fillRect(Math.floor(sx), sy, 3, 3);
    }
    txt('RETRO ARCADE', W / 2 + 3, 22, 9, '#ff4fd8', 'center', '#5a0050');
    txt('SECRET ROOM - SHH!', W / 2, 78, 3, '#8affea');
    CABS.forEach((c, i) => drawCab(c, i === this.sel));
    freeLine(466);
    txt('< > PICK   SPACE OR TAP TO PLAY', W / 2, 498, 2, '#9a8cc0', 'center', null);
  }
};
function drawCab(c, on) {
  const x = c.x, y = CAB_Y + (on ? Math.round(Math.sin(clock * 6) * 3) : 0);
  // glow when selected
  if (on) { ctx.fillStyle = c.color; ctx.globalAlpha = 0.25 + 0.15 * Math.sin(clock * 5); ctx.fillRect(x - 14, y - 14, CAB_W + 28, CAB_H + 28); ctx.globalAlpha = 1; }
  // cabinet body
  ctx.fillStyle = c.trim; ctx.fillRect(x, y, CAB_W, CAB_H);
  ctx.fillStyle = '#140a22'; ctx.fillRect(x + 10, y + 10, CAB_W - 20, CAB_H - 20);
  // marquee
  ctx.fillStyle = c.color; ctx.fillRect(x + 16, y + 16, CAB_W - 32, 46);
  txt(c.name, x + CAB_W / 2, y + 30, c.name.length > 10 ? 3 : 4, '#14001f', 'center', null);
  // little screen
  ctx.fillStyle = '#000'; ctx.fillRect(x + 30, y + 76, CAB_W - 60, 130);
  ctx.fillStyle = '#062b22'; ctx.fillRect(x + 36, y + 82, CAB_W - 72, 118);
  if (c.id === 'pong') {
    const bx = x + 60 + (Math.abs(((clock * 90) % 240) - 120)), by = y + 120 + Math.sin(clock * 3) * 30;
    ctx.fillStyle = '#9ff'; ctx.fillRect(x + 46, y + 110 + Math.sin(clock * 3) * 25, 8, 34); ctx.fillRect(x + CAB_W - 54, y + 120 - Math.sin(clock * 3) * 25, 8, 34);
    ctx.fillStyle = '#fff'; ctx.fillRect(Math.min(bx, x + CAB_W - 70), by, 8, 8);
  } else {
    const n = Math.floor(clock * 4) % 12;
    for (let k = 0; k < 6; k++) { ctx.fillStyle = k ? '#ff9a3c' : '#a24bff'; ctx.fillRect(x + 50 + ((n + 6 - k) % 12) * 12, y + 136, 10, 10); }
    ctx.fillStyle = '#7fd4ff'; ctx.fillRect(x + 50 + 11 * 12, y + 136, 10, 10);
  }
  emoji(c.icon, x + CAB_W / 2, y + 232, 40);
  // buttons + coin slot
  ctx.fillStyle = '#ff1744'; ctx.fillRect(x + 60, y + 262, 18, 18);
  ctx.fillStyle = '#ffe600'; ctx.fillRect(x + 92, y + 262, 18, 18);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 150, y + 258, 30, 26);
  ctx.fillStyle = on && blink(3) ? '#ffe600' : '#555'; ctx.fillRect(x + 163, y + 262, 4, 18);
  if (on) txt('PLAY!', x + CAB_W / 2, y + CAB_H + 14, 4, blink(3) ? '#fff' : c.color);
}

// ===================== ROBO PONG =====================
const PW = 18, PH = 100, WIN_SCORE = 5;
scenes.pong = {
  enter() { this.state = 'title'; this.reset(); },
  reset() {
    this.me = { y: H / 2 - PH / 2 }; this.cpu = { y: H / 2 - PH / 2 };
    this.sMe = 0; this.sCpu = 0; this.target = null; this.sparks = [];
    this.serve(1);
  },
  serve(dir) {
    this.ball = { x: W / 2 - 8, y: H / 2 - 8, vx: 0, vy: 0, speed: 5.5 };
    this.dir = dir; this.wait = 70; this.cpuErr = 0;
  },
  launch() {
    const b = this.ball, a = (Math.random() * 0.8 - 0.4);
    b.vx = Math.cos(a) * b.speed * this.dir; b.vy = Math.sin(a) * b.speed;
  },
  begin() { SFX.start(); this.reset(); this.state = 'play'; },
  key(k) {
    if ((k === ' ' || k === 'Enter') && this.canRestart()) this.begin();
  },
  canRestart() { return this.state === 'title' || (this.state !== 'play' && clock - this.over > 0.7); },
  down(x, y) { if (this.state !== 'play') { if (this.canRestart()) this.begin(); return; } this.target = y; },
  move(x, y, btn) { if (btn && this.state === 'play') this.target = y; },
  up() { this.target = null; },
  update() {
    this.sparks = this.sparks.filter(p => (p.x += p.vx, p.y += p.vy, --p.life > 0));
    if (this.state !== 'play') return;
    // you (Robo)
    const me = this.me;
    if (held.has('ArrowUp')) me.y -= 8;
    if (held.has('ArrowDown')) me.y += 8;
    if (this.target !== null) { const d = this.target - (me.y + PH / 2); me.y += Math.max(-14, Math.min(14, d)); }
    me.y = Math.max(0, Math.min(H - PH, me.y));
    // King Gloop (CPU): slowish, a little wobbly, and only watches the ball when it's coming
    const cpu = this.cpu, b = this.ball;
    let aim = H / 2;
    if (b.vx > 0 && b.x > W * 0.4) aim = b.y + 8 + this.cpuErr;
    const d = aim - (cpu.y + PH / 2), cs = 3.6 + 0.25 * this.sMe;   // gets a tiny bit better as you score
    if (Math.abs(d) > 10) cpu.y += Math.max(-cs, Math.min(cs, d));
    cpu.y = Math.max(0, Math.min(H - PH, cpu.y));
    // ball
    if (this.wait > 0) { if (--this.wait === 0) this.launch(); return; }
    b.x += b.vx; b.y += b.vy;
    if (b.y < 0) { b.y = 0; b.vy = Math.abs(b.vy); SFX.blip(); }
    if (b.y > H - 16) { b.y = H - 16; b.vy = -Math.abs(b.vy); SFX.blip(); }
    const hit = (px, py, side) => {
      if (b.y + 16 < py || b.y > py + PH) return false;
      if (side < 0 ? !(b.x <= px + PW && b.x >= px - 10 && b.vx < 0) : !(b.x + 16 >= px && b.x + 16 <= px + PW + 10 && b.vx > 0)) return false;
      const off = ((b.y + 8) - (py + PH / 2)) / (PH / 2 + 8);   // -1 .. 1
      b.speed = Math.min(13, b.speed + 0.45);
      const a = off * 0.9;
      b.vx = Math.cos(a) * b.speed * -side; b.vy = Math.sin(a) * b.speed;
      b.x = side < 0 ? px + PW : px - 16;
      for (let i = 0; i < 10; i++) this.sparks.push({ x: b.x + 8, y: b.y + 8, vx: -side * Math.random() * 4, vy: Math.random() * 6 - 3, life: 20, c: side < 0 ? '#9ff' : '#7dff6a' });
      return true;
    };
    if (hit(40, me.y, -1)) {
      SFX.blip();
      // King Gloop sometimes guesses wrong (more often when the ball is fast)
      this.cpuErr = Math.random() < 0.35 ? (Math.random() < 0.5 ? -1 : 1) * (60 + Math.random() * 40) : (Math.random() * 40 - 20);
    }
    if (hit(W - 40 - PW, cpu.y, 1)) SFX.boop();
    if (b.x < -30) this.score(false);
    else if (b.x > W + 30) this.score(true);
  },
  score(mine) {
    if (mine) this.sMe++; else this.sCpu++;
    if (this.sMe >= WIN_SCORE || this.sCpu >= WIN_SCORE) {
      this.state = this.sMe >= WIN_SCORE ? 'win' : 'lose'; this.over = clock; this.target = null;
      (this.state === 'win' ? SFX.win : SFX.lose)(); return;
    }
    (mine ? SFX.point : SFX.miss)();
    this.serve(mine ? 1 : -1);
  },
  draw() {
    clear('#04020a');
    ctx.fillStyle = '#2a2147'; for (let y = 6; y < H; y += 32) ctx.fillRect(W / 2 - 4, y, 8, 18);
    txt(this.sMe, W / 2 - 80, 24, 12, '#9ff', 'center', '#04304a');
    txt(this.sCpu, W / 2 + 80, 24, 12, '#7dff6a', 'center', '#0d3a06');
    drawRobo(40, this.me.y); drawGloop(W - 40 - PW, this.cpu.y);
    for (const p of this.sparks) { ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, 4, 4); }
    if (this.state === 'play') {
      const b = this.ball; ctx.fillStyle = '#fff'; ctx.fillRect(Math.round(b.x), Math.round(b.y), 16, 16);
      if (this.wait > 0 && blink(4)) txt('GET READY!', W / 2, H / 2 + 40, 5, '#ffe600');
      return;
    }
    if (this.state === 'title') {
      panel(150, 110, 660, 300);
      txt('ROBO PONG', W / 2, 132, 10, '#9ff', 'center', '#1a4a6a'); emoji('🏓', W / 2 + 270, 158, 44);
      txt('YOU ARE ROBO (LEFT). BEAT KING GLOOP!', W / 2, 212, 3, '#fff');
      txt('UP / DOWN TO MOVE, OR DRAG YOUR FINGER', W / 2, 242, 3, '#fff');
      txt('FIRST TO 5 WINS!', W / 2, 272, 4, '#ffe600');
      freeLine(320);
      if (blink(2)) txt('PRESS SPACE OR TAP TO START', W / 2, 368, 4, '#ff4fd8');
    } else {
      const won = this.state === 'win';
      panel(170, 140, 620, 230, 'rgba(10,4,20,.9)', won ? '#ffe600' : '#7dff6a');
      txt(won ? 'YOU WIN!' : 'KING GLOOP WINS!', W / 2, 166, won ? 12 : 8, won ? '#ffe600' : '#7dff6a');
      txt(won ? 'ROBO IS THE PONG CHAMP!' : 'SO CLOSE! TRY AGAIN!', W / 2, 250, 4, '#fff');
      txt(this.sMe + ' - ' + this.sCpu, W / 2, 286, 5, '#9ff');
      if (this.canRestart() && blink(2)) txt('SPACE OR TAP TO PLAY AGAIN', W / 2, 334, 4, '#ff4fd8');
    }
  }
};
function drawRobo(x, y) {          // a paddle with a little robot face
  ctx.fillStyle = '#5fb8ff'; ctx.fillRect(x, y, PW, PH);
  ctx.fillStyle = '#c8ecff'; ctx.fillRect(x + 3, y + 3, PW - 6, 6);
  ctx.fillStyle = '#ffe600'; ctx.fillRect(x + PW / 2 - 2, y - 12, 4, 12); ctx.fillRect(x + PW / 2 - 4, y - 18, 8, 6);   // antenna
  ctx.fillStyle = '#04020a'; ctx.fillRect(x + 4, y + 28, 10, 10); ctx.fillRect(x + 4, y + 48, 10, 10);
  ctx.fillStyle = blink(1) ? '#ff1744' : '#00ffd0'; ctx.fillRect(x + 7, y + 31, 4, 4); ctx.fillRect(x + 7, y + 51, 4, 4);
  ctx.fillStyle = '#04020a'; ctx.fillRect(x + 4, y + 70, 10, 4); ctx.fillRect(x + 4, y + 78, 10, 4);
}
function drawGloop(x, y) {         // a slimy green paddle wearing a crown
  ctx.fillStyle = '#3ddc3d'; ctx.fillRect(x, y, PW, PH);
  ctx.fillStyle = '#2aa82a'; ctx.fillRect(x, y + PH, 6, 8 + Math.sin(clock * 4) * 4); ctx.fillRect(x + 11, y + PH, 6, 5);   // drips
  ctx.fillStyle = '#ffd700'; ctx.fillRect(x - 3, y - 8, PW + 6, 8);
  ctx.fillRect(x - 3, y - 16, 5, 8); ctx.fillRect(x + PW / 2 - 2, y - 18, 5, 10); ctx.fillRect(x + PW - 2, y - 16, 5, 8);
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 3, y + 28, 12, 12); ctx.fillRect(x + 3, y + 48, 12, 12);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 3, y + 32, 6, 6); ctx.fillRect(x + 3, y + 52, 6, 6);
  ctx.fillStyle = '#0d4a0d'; ctx.fillRect(x + 2, y + 72, 6, 14);
}

// ===================== SNAKE SNATCHER =====================
const CELL = 40, COLS = 24, ROWS = 12, TOP = 40;   // grid sits under a 40px score bar
const DIRS = { ArrowUp: [0, -1], ArrowDown: [0, 1], ArrowLeft: [-1, 0], ArrowRight: [1, 0] };
let snakeBest = 0;   // only kept while the page is open
scenes.snake = {
  enter() { this.state = 'title'; this.reset(); },
  reset() {
    this.body = [[6, 6], [5, 6], [4, 6]];   // body[0] = Snatcher, the rest = stolen fish
    this.dir = [1, 0]; this.queue = []; this.score = 0; this.timer = 0; this.pops = [];
    this.placeFish();
  },
  begin() { SFX.start(); this.reset(); this.state = 'play'; this.over = 0; },
  delay() { return Math.max(7, 14 - Math.floor(this.score / 3)); },   // ticks per step: slow start, gentle speed-up
  placeFish() {
    const free = [];
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) if (!this.body.some(b => b[0] === x && b[1] === y)) free.push([x, y]);
    this.fish = free.length ? free[Math.floor(Math.random() * free.length)] : null;
  },
  turn(d) {
    const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
    if ((d[0] === -last[0] && d[1] === -last[1]) || (d[0] === last[0] && d[1] === last[1])) return;
    if (this.queue.length < 2) this.queue.push(d);
  },
  canRestart() { return this.state === 'title' || clock - this.over > 0.7; },
  key(k) {
    if (this.state === 'play') { if (DIRS[k]) this.turn(DIRS[k]); return; }
    if ((k === ' ' || k === 'Enter') && this.canRestart()) this.begin();
  },
  down(x, y) { this.sx = x; this.sy = y; this.touching = true; },
  up(x, y) {
    if (!this.touching) return; this.touching = false;
    if (this.state !== 'play') { if (this.canRestart()) this.begin(); return; }
    const dx = x - this.sx, dy = y - this.sy;
    if (Math.hypot(dx, dy) > 30) {   // swipe
      this.turn(Math.abs(dx) > Math.abs(dy) ? [Math.sign(dx), 0] : [0, Math.sign(dy)]);
    } else {                          // tap the side you want to turn toward
      const [hx, hy] = this.body[0], cx = hx * CELL + CELL / 2, cy = TOP + hy * CELL + CELL / 2;
      const d = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
      if (d[0] !== 0) this.turn([0, y < cy ? -1 : 1]); else this.turn([x < cx ? -1 : 1, 0]);
    }
  },
  update() {
    this.pops = this.pops.filter(p => (p.y -= 1, --p.life > 0));
    if (this.state !== 'play') return;
    if (++this.timer < this.delay()) return;
    this.timer = 0;
    if (this.queue.length) this.dir = this.queue.shift();
    const [hx, hy] = this.body[0], nx = hx + this.dir[0], ny = hy + this.dir[1];
    const eat = this.fish && nx === this.fish[0] && ny === this.fish[1];
    const tail = eat ? this.body : this.body.slice(0, -1);   // the tail end moves out of the way unless we grow
    if (nx < 0 || ny < 0 || nx >= COLS || ny >= ROWS || tail.some(b => b[0] === nx && b[1] === ny)) return this.crash();
    this.body.unshift([nx, ny]);
    if (eat) {
      this.score++; SFX.chomp();
      if (this.score > snakeBest) snakeBest = this.score;
      this.pops.push({ x: nx * CELL + CELL / 2, y: TOP + ny * CELL, life: 40 });
      this.placeFish();
      if (!this.fish) { this.state = 'won'; this.over = clock; SFX.win(); }
    } else this.body.pop();
  },
  crash() { this.state = 'over'; this.over = clock; SFX.bonk(); },
  draw() {
    clear('#04020a');
    // play field: dark checkerboard
    for (let x = 0; x < COLS; x++) for (let y = 0; y < ROWS; y++) {
      ctx.fillStyle = (x + y) % 2 ? '#0d0820' : '#120b2a'; ctx.fillRect(x * CELL, TOP + y * CELL, CELL, CELL);
    }
    ctx.fillStyle = '#c86bff'; ctx.fillRect(0, TOP - 4, W, 4);
    txt('FISH: ' + this.score, 16, 10, 4, '#ffe600', 'left');
    txt('BEST: ' + snakeBest, W - 16, 10, 4, '#8affea', 'right');
    txt('SNAKE SNATCHER', W / 2, 12, 3, '#c86bff', 'center', null);
    if (this.fish) drawFish(this.fish[0] * CELL, TOP + this.fish[1] * CELL + Math.round(Math.sin(clock * 6) * 3), 1, true);
    for (let i = this.body.length - 1; i > 0; i--) {
      const [x, y] = this.body[i], [px, py] = this.body[i - 1];
      drawFish(x * CELL, TOP + y * CELL, px >= x ? (px > x ? 1 : (i % 2 ? 1 : -1)) : -1, false);
    }
    drawCat(this.body[0][0] * CELL, TOP + this.body[0][1] * CELL, this.dir);
    for (const p of this.pops) txt('+1', p.x, p.y, 3, '#ffe600');
    if (this.state === 'title') {
      panel(150, 100, 660, 330);
      txt('SNAKE SNATCHER', W / 2, 122, 8, '#c86bff', 'center', '#3a0a5a');
      txt('YOU ARE SNATCHER THE SNEAKY CAT!', W / 2, 180, 3, '#fff');
      txt('GRAB FISH - THEY FOLLOW YOU IN A LINE!', W / 2, 206, 3, '#fff');
      txt("DON'T BUMP THE WALLS OR YOUR FISH!", W / 2, 232, 3, '#ff8a8a');
      txt('ARROWS, SWIPE, OR TAP WHERE TO TURN', W / 2, 262, 3, '#8affea');
      emoji('😼', W / 2 - 40, 306, 40); emoji('🐟', W / 2 + 10, 306, 32); emoji('🐟', W / 2 + 48, 306, 32);
      freeLine(338);
      if (blink(2)) txt('PRESS SPACE OR TAP TO START', W / 2, 386, 4, '#ff4fd8');
    } else if (this.state !== 'play') {
      const won = this.state === 'won';
      panel(190, 140, 580, 240, 'rgba(10,4,20,.9)', won ? '#ffe600' : '#ff4fd8');
      txt(won ? 'ALL THE FISH!' : 'BONK!', W / 2, 162, 10, won ? '#ffe600' : '#ff4fd8');
      txt('YOU SNATCHED ' + this.score + ' FISH!', W / 2, 236, 5, '#fff');
      txt(this.score >= snakeBest && this.score > 0 ? 'NEW BEST!' : 'BEST: ' + snakeBest, W / 2, 278, 4, '#8affea');
      if (this.canRestart() && blink(2)) txt('SPACE OR TAP TO PLAY AGAIN', W / 2, 330, 4, '#ffe600');
    }
  }
};
function drawFish(x, y, face, loose) {   // pixel fish in a 40x40 cell; face = 1 looks right, -1 left
  const c = loose ? '#4fc3ff' : '#ff9a3c', d = loose ? '#1f7bbf' : '#c85f10';
  const R = (rx, ry, w, h) => ctx.fillRect(face > 0 ? x + rx : x + CELL - rx - w, y + ry, w, h);
  ctx.fillStyle = d; R(4, 10, 8, 20); R(8, 14, 6, 12);               // tail
  ctx.fillStyle = c; R(12, 12, 20, 16); R(16, 9, 12, 22);            // body
  ctx.fillStyle = d; R(18, 6, 8, 4);                                 // fin
  ctx.fillStyle = '#fff'; R(26, 15, 5, 5); ctx.fillStyle = '#000'; R(28, 16, 3, 3);   // eye
  if (loose && blink(3)) { ctx.fillStyle = '#fff'; R(34, 4, 3, 3); }   // sparkle
}
function drawCat(x, y, dir) {            // Snatcher: purple cat with a black burglar mask
  ctx.fillStyle = '#a24bff';
  ctx.fillRect(x + 4, y + 8, 32, 28);                                // head
  ctx.fillRect(x + 4, y + 1, 9, 9); ctx.fillRect(x + 27, y + 1, 9, 9);   // ears
  ctx.fillStyle = '#ff8ad8'; ctx.fillRect(x + 7, y + 4, 4, 5); ctx.fillRect(x + 29, y + 4, 4, 5);
  ctx.fillStyle = '#111'; ctx.fillRect(x + 2, y + 14, 36, 10);       // mask
  const lx = dir[0] * 2, ly = dir[1] * 2;
  ctx.fillStyle = '#fff'; ctx.fillRect(x + 9, y + 16, 7, 6); ctx.fillRect(x + 24, y + 16, 7, 6);
  ctx.fillStyle = '#000'; ctx.fillRect(x + 11 + lx, y + 17 + ly / 2, 3, 4); ctx.fillRect(x + 26 + lx, y + 17 + ly / 2, 3, 4);
  ctx.fillStyle = '#ff8ad8'; ctx.fillRect(x + 18, y + 26, 4, 3);     // nose
  ctx.fillStyle = '#3b0a66'; ctx.fillRect(x + 14, y + 31, 12, 2);    // sly grin
  ctx.fillStyle = '#e0c8ff'; ctx.fillRect(x, y + 27, 8, 1); ctx.fillRect(x + 32, y + 27, 8, 1);   // whiskers
}


// ---------- fixed-timestep loop ----------
let last = null, acc = 0;
function tick() {
  clock += STEP;
  if (toast && (toast.t -= STEP) <= 0) toast = null;
  scene.update && scene.update();
}
function render() {
  scene.draw();
  if (toast) { panel(W / 2 - 110, 14, 220, 34); txt(toast.s, W / 2, 21, 4, '#fff'); }
}
function frame(now) {
  if (last === null) last = now;
  acc += Math.min(0.25, (now - last) / 1000); last = now;
  while (acc >= STEP) { tick(); acc -= STEP; }
  render();
  requestAnimationFrame(frame);
}
const startGame = (new URLSearchParams(location.search).get('game') || '').toLowerCase();
go(scenes[startGame] && startGame !== 'menu' ? startGame : 'menu');
requestAnimationFrame(frame);
</script>
