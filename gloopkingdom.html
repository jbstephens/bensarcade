<!DOCTYPE html>
<html lang="en">

<script src="touchpad.js?v=9"></script>
<style>

  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; break-inside: avoid; }

    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }

<script>

// 👑 THE GLOOP KINGDOM STORE, home of the GLOOP PLAYSETS. Buy printable paper Gloop stuff with pretend Goo Gems,

const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}

function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;

  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);

// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,

const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);

// a tape tab on edge A->B, sticking out along (nx, ny)

  const mx = (ax + bx) / 2 + nx * T0 * .5, my = (ay + by) / 2 + ny * T0 * .5;
  return '<path d="' + poly(p) + '" fill="' + (LINE ? '#fff' : '#e3e7f3') + '" stroke="none"/>' +
    CUT('M' + n(p[0]) + ' ' + n(p[1]) + ' L' + n(p[2]) + ' ' + n(p[3]) + ' L' + n(p[4]) + ' ' + n(p[5]) + ' L' + n(p[6]) + ' ' + n(p[7])) +
    FOLD('M' + n(ax) + ' ' + n(ay) + ' L' + n(bx) + ' ' + n(by)) +
    (len > 30 ? '<text x="' + n(mx) + '" y="' + n(my) + '" font-size="' + (String(label).length > 2 ? 11 : 14) + '" fill="' + INK + '" text-anchor="middle" dominant-baseline="central"' + FONT + '>' + esc(label === undefined ? 'TAPE' : label) + '</text>' : '');

// PLATFORM (an open-bottom box): top W x D in the middle, 4 walls of height H around it, tape tabs on the front + back walls.
// Size on paper: (W + 2H) x (D + 2H).
function trayNet(name, X0, Y0, W, D, H, topArt, wallArt) {
  const xL = X0, xT = X0 + H, xR = X0 + H + W, xE = X0 + 2 * H + W, yB = Y0, yT = Y0 + H, yF = Y0 + H + D, yE = Y0 + 2 * H + D;

  let s = '';
  s += tab(xT, yF, xT, yE, -1, 0) + tab(xR, yF, xR, yE, 1, 0) + tab(xT, yB, xT, yT, -1, 0) + tab(xR, yB, xR, yT, 1, 0);
  EDGES.push([name + ' front-left corner', yE - yF, xT - xL], [name + ' front-right corner', yE - yF, xE - xR], [name + ' back-left corner', yT - yB, xT - xL], [name + ' back-right corner', yT - yB, xE - xR]);
  for (const k in panels) { const [x, y, w, h] = panels[k]; s += '<g' + clipRect(x, y, w, h) + '>' + (k === 'top' ? topArt(x, y, w, h) : wallArt(k, x, y, w, h)) + '</g>'; }
  s += FOLD(`M${n(xT)} ${n(yT)} H${n(xR)} V${n(yF)} H${n(xT)} Z`);
  s += CUT(`M${n(xT)} ${n(yB)} H${n(xR)} M${n(xR)} ${n(yT)} H${n(xE)} V${n(yF)} H${n(xR)} M${n(xR)} ${n(yE)} H${n(xT)} M${n(xT)} ${n(yF)} H${n(xL)} V${n(yT)} H${n(xT)}`);
  return s;
}
// RAMP (a wedge): back (Hr) | base (B) | slope (L) | tab, with a right-triangle side on each side of the base.
// Size: (W + 2Hr + 2TAB) wide, (Hr + B + L + TAB) tall. x0 = left edge of the left triangle's tab.
function rampNet(name, X0, Y0, W, B, Hr, art) {
  const L0 = Math.hypot(B, Hr), xs = X0 + TAB + Hr, y1 = Y0 + Hr, y2 = y1 + B, y3 = y2 + L0;
  let s = bgR(xs, Y0, W, Hr, '#90a4ae') + bgR(xs, y1, W, B, '#cfd8dc') + bgR(xs, y2, W, L0, '#ffd740');
  if (art) s += '<g' + clipRect(xs, y2, W, L0) + '>' + art(xs, y2, W, L0) + '</g>';
  s += label(xs + W / 2, Y0 + Hr / 2 + 5, 'back', 13) + label(xs + W / 2, y1 + B / 2 + 5, 'bottom', 13);
  for (const d of [-1, 1]) {                            // the two triangle sides
    const xe = d < 0 ? xs : xs + W, tri = [xe, y1, xe + d * Hr, y1, xe, y2];
    s += P(poly(tri), LINE ? '#fff' : '#b0bec5', 0) + label(xe + d * Hr * .32, y1 + B * .3, 'side', 12);
    s += tab(xe + d * Hr, y1, xe, y1, 0, -1, 'TAPE', 20);
    const hx = d < 0 ? -B / L0 : B / L0, hy = Hr / L0;
    s += tab(xe + d * Hr, y1, xe, y2, hx, hy, 'TAPE', 20);
    EDGES.push([name + ' side ' + (d < 0 ? 'L' : 'R') + ' up edge', Hr, y1 - Y0], [name + ' side ' + (d < 0 ? 'L' : 'R') + ' slope edge', Math.hypot(Hr, B), y3 - y2]);
  }
  s += tab(xs + W, y3, xs, y3, 0, 1, 'TAPE');
  EDGES.push([name + ' top', W, W]);
  s += FOLD(`M${n(xs)} ${n(y1)} H${n(xs + W)} M${n(xs)} ${n(y2)} H${n(xs + W)} M${n(xs)} ${n(y1)} V${n(y2)} M${n(xs + W)} ${n(y1)} V${n(y2)}`);
  s += CUT(`M${n(xs)} ${n(y1)} V${n(Y0)} H${n(xs + W)} V${n(y1)} M${n(xs)} ${n(y2)} V${n(y3)} M${n(xs + W)} ${n(y2)} V${n(y3)}`);
  return s;
}
// CUBE (a die or a crate): a cross of 6 squares, 7 tape tabs

  let s = '';
  for (const k in F) { const [x, y] = F[k]; s += '<g' + clipRect(x, y, sz, sz) + '>' + paint(k, x, y, sz) + '</g>'; }
  const yl = Y0 + sz, yb = Y0 + 2 * sz, xr = X0 + 2 * sz, xe = X0 + 3 * sz;
  s += tab(X0, yl, xc, yl, 0, -1) + tab(xc, yb, X0, yb, 0, 1) + tab(X0, yb, X0, yl, -1, 0);
  s += tab(xr, yl, xe, yl, 0, -1) + tab(xe, yb, xr, yb, 0, 1) + tab(xe, yl, xe, yb, 1, 0);
  s += tab(xr, Y0 + 4 * sz, xc, Y0 + 4 * sz, 0, 1);

  s += CUT(`M${n(xc)} ${n(yl)} V${n(Y0)} H${n(xr)} V${n(yl)} M${n(xc)} ${n(yb)} V${n(Y0 + 4 * sz)} M${n(xr)} ${n(yb)} V${n(Y0 + 4 * sz)}`);

}

function standup(x, y, w, h, b, art, nm, col) {
  const cx = x + w / 2, yh = y + h, yf = y + 2 * h, yb = yf + b;
  let s = bgR(x, y, w, h, col || '#e3f2fd') + bgR(x, yh, w, h, col || '#e3f2fd') + bgR(x, yf, w, b, '#cfd8dc');
  const tall = h * .84 - 4, wide = w - 10;

  s += '<g' + clipRect(x, y, w, h) + '><g transform="rotate(180 ' + n(cx) + ' ' + n(yh) + ')">' + art(cx, yf - 5, tall, wide) + '</g></g>';

  s += tab(x + w, yb, x, yb, 0, 1, w > 60 ? 'TAPE' : '', Math.min(TAB, 20));

// =====================================================================
const pt = (x, y) => n(x) + ' ' + n(y);
// CONE (a tower roof, a rocket nose): a circle slice. Its curved edge wraps into a circle of radius rB.
function coneNet(name, cx, cy, Rs, rB, paint) {
  const th = 2 * Math.PI * rB / Rs, a0 = Math.PI / 2 - th / 2, a1 = a0 + th;
  const A = [cx + Rs * Math.cos(a0), cy + Rs * Math.sin(a0)], B = [cx + Rs * Math.cos(a1), cy + Rs * Math.sin(a1)];
  const d = 'M' + pt(cx, cy) + ' L' + pt(A[0], A[1]) + ' A' + n(Rs) + ' ' + n(Rs) + ' 0 ' + (th > Math.PI ? 1 : 0) + ' 1 ' + pt(B[0], B[1]) + ' Z';
  let s = '<g' + clipPath(d) + '>' + paint(cx - Rs, cy - Rs, 2 * Rs, 2 * Rs) + '</g>';
  s += tab(cx, cy, B[0], B[1], Math.cos(a1 + Math.PI / 2), Math.sin(a1 + Math.PI / 2), 'TAPE', 20);
  s += CUT('M' + pt(cx, cy) + ' L' + pt(A[0], A[1]) + ' A' + n(Rs) + ' ' + n(Rs) + ' 0 ' + (th > Math.PI ? 1 : 0) + ' 1 ' + pt(B[0], B[1]));
  EDGES.push([name + ' seam', Rs, Math.hypot(B[0] - cx, B[1] - cy)], [name + ' rim makes the right circle', th * Rs, 2 * Math.PI * rB]);
  return s;
}
// TUBE (a well, a rocket body, a finger puppet band): a strip of length = circumference, with a tape tab on the end
function tubeNet(name, x, y, len, h, paint) {
  let s = '<g' + clipRect(x, y, len, h) + '>' + paint(x, y, len, h) + '</g>' + tab(x + len, y, x + len, y + h, 1, 0, 'TAPE', 22);
  EDGES.push([name + ' seam', h, h]);
  return s + CUT('M' + pt(x + len, y) + ' H' + n(x) + ' V' + n(y + h) + ' H' + n(x + len));
}
// DISC with little fold-down tabs all round (a well's water top, a pool lid): fold the tabs down, tape them inside the tube
function discNet(name, cx, cy, r, k, paint, tubeLen) {
  let s = '';

  s += '<g' + clipPath('M' + pt(cx - r, cy) + ' A' + r + ' ' + r + ' 0 1 1 ' + pt(cx + r, cy) + ' A' + r + ' ' + r + ' 0 1 1 ' + pt(cx - r, cy) + ' Z') + '>' + paint(cx - r, cy - r, 2 * r, 2 * r) + '</g>';

// PYRAMID (the volcano): square base W in the middle, 4 triangles of slant height hs; one tape tab per triangle
function pyramidNet(name, cx, cy, W, hs, paint) {

  let s = bgR(cx - h, cy - h, W, W, '#a1887f') + T(cx, cy + 5, 'bottom', 15, '#3e2723'), cut = '';

    const [ax, ay] = sq[i], [bx, by] = sq[(i + 1) % 4], mx = (ax + bx) / 2, my = (ay + by) / 2, ox = (mx - cx) / h, oy = (my - cy) / h, px = mx + ox * hs, py = my + oy * hs;

    const ex = px - bx, ey = py - by, L0 = Math.hypot(ex, ey); let nx = ey / L0, ny = -ex / L0; if (nx * (ax - bx) + ny * (ay - by) > 0) { nx = -nx; ny = -ny; }
    s += tab(bx, by, px, py, nx, ny, 'TAPE', 20); cut += 'M' + pt(ax, ay) + ' L' + pt(px, py) + ' ';
    EDGES.push([name + ' side ' + (i + 1) + ' meets side ' + ((i + 1) % 4 + 1), Math.hypot(px - bx, py - by), side], [name + ' face ' + (i + 1) + ' on the base', Math.hypot(bx - ax, by - ay), W]);
  }

}

function roofNet(name, x0, y0, W, D, hr, paint) {

    const ex = sd < 0 ? x0 : x0 + D, E2 = [ex + sd * Ls * Math.sin(phi), yr - Ls * Math.cos(phi)], tri = poly([ex, yr, ex, y0, E2[0], E2[1]]);

    let nx = -(E2[1] - yr), ny = E2[0] - ex; const l = Math.hypot(nx, ny); nx /= l; ny /= l; if (nx * 0 + ny * (y0 - yr) > 0) { nx = -nx; ny = -ny; }

    card.appendChild(el('h3', '', p.name)); card.appendChild(el('div', 'blurb', p.blurb));
    card.appendChild(el('div', 'price', (p.k === DEAL ? '<s>' + p.price + '</s>' : '') + '💜 ' + priceOf(p.k) + ' Goo Gems'));
    const r = p.revs[0]; card.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`));
    const row = el('div', 'row'), inCart = S.cart.includes(p.k);
    const add = el('button', 'add' + (inCart ? ' in' : ''), inCart ? '✅ IN CART' : '🛒 ADD TO CART');
    add.onclick = () => toggleCart(p.k);
    const rb = el('button', 'revbtn', '⭐ ' + avg(p)); rb.onclick = () => openReviews(p.k);
    row.append(add, rb); card.appendChild(row); grid.appendChild(card);
  }
}
function toggleCart(k) {
  const i = S.cart.indexOf(k);
  if (i >= 0) { S.cart.splice(i, 1); sfx.click(); say('Okay! I took it out of your cart.'); }
  else { S.cart.push(k); sfx.add(); say(k === 'castle' ? 'THE GOO CASTLE! With a drawbridge that really opens! The best thing in the whole store!' : k === 'decree' ? 'A Royal Decree for Ben! Signed by King Gloop himself!' : k === 'mega' ? 'The MEGA SET! Everything GIANT! Awesome!' : PR(k).must ? 'That is Ben\'s own idea! ' + pick(ADD_LINES) : pick(ADD_LINES)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {
  const p = PR(k), box = $('revIn'); box.innerHTML = '';
  box.appendChild(el('div', 'h2', '⭐ Reviews: ' + p.name));
  p.revs.forEach(r => box.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`)));
  const c = el('button', 'bigbtn', '👍 OK!'); c.style.marginTop = '10px'; c.style.width = '100%'; c.onclick = closeReviews; box.appendChild(c);
  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what everybody says!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) {
    L.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  for (const k of S.cart) {
    const line = el('div', 'line'); line.appendChild(thumbEl(k));
    line.appendChild(el('div', 'nm', PR(k).name + (k === DEAL ? '<small>🔥 Deal of the Day: half price!</small>' : '<small>' + PR(k).pages.length + ' page' + (PR(k).pages.length > 1 ? 's' : '') + '</small>')));
    line.appendChild(el('div', 'pr', '💜 ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); L.appendChild(line);
  }
  const t = el('div', 'total');
  const g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'Gift wrap! I will add a wrapping paper page to print!' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g); t.appendChild(el('span', '', 'TOTAL: 💜 ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go);
  L.appendChild(t);
}
function checkout() {
  const tot = cartTotal();
  if (!S.cart.length) return;
  if (tot > S.coins) { sfx.nope(); say('Not enough Goo Gems! Tap Get more!'); const b = $('moreCoins'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.coins -= tot;
  for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop();
  startShip(count);
}
function moreCoins() {
  S.coins += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['Here are 500 more Goo Gems!', 'Ka-ching! 500 Goo Gems! Pretend money is the best!', 'More Goo Gems for Ben, by royal order!']));
}
// 🚚 delivery: the royal goo coach rolls across the kingdom
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function shipScene() {
  beginArt(false);
  let s = '<rect width="960" height="540" fill="#2a0b45"/>' + starsIn(0, 0, 960, 380, 40) + castleSil(700, 420, 220, 150, '#b39ddb') + '<rect y="420" width="960" height="120" fill="#9ccc65"/>';
  for (let i = 0; i < 8; i++) s += gemArt(60 + i * 125, 470 + (i % 2) * 30, 14);
  let truck = R(0, 0, 230, 110, 16, '#7c4dff', OL, 4) + R(230, 30, 90, 80, 16, '#ff4081', OL, 4) + R(250, 42, 52, 38, 8, '#e1bee7', OL, 2) + fitG(gl('king'), 276, 84, 40, 48);
  truck += T(115, 44, 'GLOOP KINGDOM', 24, '#ffd740') + T(115, 80, 'EXPRESS', 24, '#fff');
  for (const wx of [55, 260]) truck += C(wx, 112, 26, '#212121', 0) + C(wx, 112, 11, '#bdbdbd', 0);
  truck += '<g id="boxes"></g>';
  s += '<g id="truck">' + truck + '</g>' + '<g id="conf"></g>';
  s += '<text id="shipTxt" x="480" y="110" font-size="54" fill="#fff" text-anchor="middle"' + FONT + '>Placing order...</text><text id="shipSub" x="480" y="170" font-size="28" fill="#e1bee7" text-anchor="middle"' + FONT + '></text>';
  s += '<rect x="280" y="190" width="400" height="24" rx="12" fill="#ffffff" opacity=".3"/><rect id="shipBar" x="280" y="190" width="24" height="24" rx="12" fill="#ffd740"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><defs>' + DEFS.join('') + '</defs>' + s + '</svg><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button>';
}
function startShip(n) {
  shipT = 0; shipCount = n; shipStart = performance.now(); shipDone = false;
  $('ship').innerHTML = shipScene(); $('ship').style.display = 'flex'; $('shipGo').onclick = closeShip;
  let b = ''; for (let i = 0; i < Math.min(n, 6); i++) b += R(20 + i * 33, -32, 30, 30, 3, '#d7a86e', '#6d4c41', 2) + R(32 + i * 33, -32, 6, 30, 0, '#6d4c41', 0);
  $('boxes').innerHTML = b; sfx.vroom(); say('Placing your order... Here we go!'); requestAnimationFrame(shipLoop);
}
function shipLoop() {
  if (shipT < 0) return;
  shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  const done = shipT > 150, tx = done ? 320 : -380 + Math.min(1, shipT / 140) * 700, bob = done ? 0 : Math.sin(shipT * .5) * 3;
  $('truck').setAttribute('transform', 'translate(' + n(tx) + ' ' + n(300 + bob) + ')');
  $('shipBar').setAttribute('width', n(Math.max(24, 400 * Math.min(1, shipT / 150))));
  if (!done) $('shipTxt').textContent = 'Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3);
  else {
    let c = ''; for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); c += '<rect x="' + n(480 + Math.cos(a) * d) + '" y="' + n(140 + Math.sin(a) * d * .7 + (shipT - 150) * 1.5) + '" width="12" height="8" fill="' + ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff'][i % 4] + '"/>'; }
    $('conf').innerHTML = c; $('shipTxt').textContent = 'ORDER CONFIRMED!'; $('shipTxt').setAttribute('fill', '#ffd740');
    $('shipSub').textContent = shipCount + (shipCount === 1 ? ' thing is' : ' things are') + ' in MY ORDERS, ready to print!';
  }
  if (done && !shipDone) { shipDone = true; sfx.cash(); say('ORDER CONFIRMED! Tap PRINT on the things you want!'); $('shipGo').style.display = 'block'; }
  if (shipT < 400) requestAnimationFrame(shipLoop);
}
function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    const p = PR(o.k); if (!p) continue;
    const np = p.pages.length + (o.gift ? 1 : 0), line = el('div', 'line'); line.appendChild(thumbEl(o.k));
    line.appendChild(el('div', 'nm', p.name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${np} page${np > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function printFns(list) {
  const fns = [];
  for (const o of list) { const p = PR(o.k); if (!p) continue; if (o.gift) fns.push(() => giftWrap(p.name)); p.pages.forEach(f => fns.push(f)); }
  return fns;
}
function openPrint(list) {
  closePrint(true);
  const fns = printFns(list); if (!fns.length) return;
  printList = list;
  const name = list.length === 1 ? PR(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), ink = el('button', 'pbInk' + (S.ink ? '' : ' off'), S.ink ? '🖤 Ink Saver: ON' : '🎨 Full color');
  const pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  ink.onclick = () => { toggleInk(); openPrint(printList); };
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('gloopKingdom'); say('Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, ink, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  ' + (S.ink ? '🖤 Ink Saver is ON: black lines to color in!' : '🎨 Full color: turn on color printing!')));
  document.body.appendChild(printBox);
  for (const f of fns) printBox.appendChild(el('div', 'pbPage', buildPage(f, S.ink)));
  sfx.click(); say(list.length === 1 && list[0].k === 'castle' ? 'The Goo Castle! Tap PRINT for all 7 pages!' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
function toggleInk() { S.ink = !S.ink; save(); sfx.click(); updateTop(); say(S.ink ? 'Ink Saver ON! Black lines, so you can color them in.' : 'Full color! That uses lots of ink.'); }
// 👑 MASCOT PARADE: every Gloop marches across and says hi
let parT = -1, parStart = 0, parSaid = -1;
const PAR_GAP = 190, PAR_SPEED = 2.2;
function openParade() {
  const row = $('paradeRow'); row.innerHTML = '';
  GL.forEach(r => { const d = el('div', 'pr', mascotSvg(r) + '<b>' + r.name + '</b>'); row.appendChild(d); });
  $('paradeBox').style.display = 'flex'; parT = 0; parStart = performance.now(); parSaid = -1; $('psay').textContent = 'Here they come!';
  sfx.click(); say('MASCOT PARADE! Every Gloop, march!', 'king'); requestAnimationFrame(paradeLoop);
}
function paradeLoop() {
  if (parT < 0) return;
  parT = Math.max(parT + (window.__shipStep || 0), Math.floor((performance.now() - parStart) / 16.7));
  const W = window.innerWidth, kids = $('paradeRow').children;
  for (let i = 0; i < kids.length; i++) {
    const x = W + 20 - parT * PAR_SPEED + i * PAR_GAP, hop = Math.abs(Math.sin((parT + i * 9) * .16)) * 18;
    kids[i].style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(-hop) + 'px)';
    if (x < W / 2 - 75 && i > parSaid) { parSaid = i; const r = GL[i]; $('psay').textContent = r.name + ': "' + MASCOTS[r.id][3] + '"'; sfx.march(i); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.name + '!'); u.pitch = Math.min(2, MASCOTS[r.id][0]); u.rate = MASCOTS[r.id][1]; speechSynthesis.speak(u); } } catch (_) {} }
  }
  const last = W + 20 - parT * PAR_SPEED + (kids.length - 1) * PAR_GAP;
  if (last < -200) { $('psay').textContent = 'That is EVERY Gloop! Tap OK to go shopping.'; parT = -1; return; }
  requestAnimationFrame(paradeLoop);
}
function closeParade() { parT = -1; $('paradeBox').style.display = 'none'; sfx.click(); showMascot(MI); }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  const parade = $('paradeBox').style.display === 'flex';
  if (e.key === 'Escape') { if (printBox) closePrint(); else if (parade) closeParade(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (parade) closeParade(); else if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && !parade && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreCoins').onclick = moreCoins;
$('parade').onclick = openParade;
$('paradeOk').onclick = closeParade;
$('ink').onclick = toggleInk;
$('mascot').onclick = () => { sfx.click(); say(pick(MASCOTS[curM().id].slice(2))); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || !inCat(PR(DEAL), CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
showMascot(Math.floor(Math.random() * GL.length), true);
render(); rotate();
setTimeout(() => { $('bubble').textContent = S.orders.length ? MASCOTS[curM().id][2] + ' Your orders are in MY ORDERS.' : MASCOTS[curM().id][2]; }, 50);
</script>
