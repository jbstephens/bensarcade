<script>
// ROBO JUMP 9: ZIPPING ALONE   (story by Ben!)
// Robo goes back to MOON BASE again, all by himself. A TIME PORTAL there ZAPS him back in time to when none of his team
// were there yet: back to Robo Jump 1, then Robo Jump 2, then Robo Jump 3 ("just normal versions" of those old games).
// Then he gets to Robo Jump 9's time, where he was supposed to be... and NO ONE is there. Except LASERHEART,
// the hardest Robo Jump boss ever: it can SPAWN CLONES and it can even make you fight TWO BOSSES AT THE SAME TIME!
// 13 stops on the TIMELINE + the secret TIME VAULT (← ← → → ↑ ↓ ↑ ↓ DASH JUMP on the title screen or the timeline).
// 🪞 SECRET FINAL BOSS: beat Laserheart, then bring all 24 Time Shards to the foggy MIRROR near the end of the Empty Factory: MIRROR ROBO!
const C = document.getElementById('game');
const ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, ROWS = 13;
const GRAV = 0.6, SPEED = 4.5, JUMP = 13, DJUMP = 11, SPRING = 17, MAXFALL = 14;
const DASH_T = 14, DASH_CD = 45;                       // ⚡ Dash: how long it lasts and the cooldown
const START_HP = 4, MAX_HP = 6;                        // lots of hearts (easy-medium!)
const SLOW_MAX = 600, SLOW_T = 240;                    // ⏳ TIME SLOW (Z): the meter fills up in 10 seconds, slows time for 4
const FLOOR = 11 * T;

// ---------- Saves, coins, trophies, stickers, bundles ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let stickerNew = 0;
function sticker(id) { try { const s = JSON.parse(localStorage.getItem('gfStickers') || '{}'); if (!s[id]) { s[id] = 1; localStorage.setItem('gfStickers', JSON.stringify(s)); stickerNew = 150; } } catch (_) {} }   // for the Sticker Book in the Game Factory book
function bankCoin(n = 1) { try { const c = JSON.parse(localStorage.getItem('gfCoins') || '{}'); c.robojump9 = (c.robojump9 || 0) + n; localStorage.setItem('gfCoins', JSON.stringify(c)); } catch (_) {} }   // coins for the Bundle Room in the Game Factory book
function bundleHas(j) { try { return (JSON.parse(localStorage.getItem('gfBundles') || '{}').opened || []).includes('robojump9-' + j); } catch (_) { return false; } }   // unlocked in the Bundle Room

let save = { done: {}, shards: {}, items: {}, look: 'normal', seen: {}, music: true };
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem('roboJump9') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
  save.done = save.done || {}; save.shards = save.shards || {}; save.seen = save.seen || {}; save.items = save.items || {};
}
function writeSave() { try { localStorage.setItem('roboJump9', JSON.stringify(save)); } catch (_) {} }
loadSave();

// ---------- Looks (hats + LASERHEART from the Bundle Room, old hats found in the past, + the secret) ----------
const LOOKS = [
  { id: 'normal', name: 'Robo', bundle: -1 },
  { id: 'goggles', name: 'Time Goggles', bundle: 0 },
  { id: 'clockcrown', name: 'Clock Crown', bundle: 0 },
  { id: 'heartantenna', name: 'Heart Antenna', bundle: 1 },
  { id: 'hourglass', name: 'Hourglass Hat', bundle: 1 },
  { id: 'laserheart', name: 'LASERHEART', bundle: 2 },          // 💗 MEGA playable character (the nice one!)
  { id: 'tophat', name: 'Old Top Hat (RJ1)', item: 'tophat' },   // 🎩 found hidden in the Robo Jump 1 past
  { id: 'glitchcap', name: 'Old Glitch Cap (RJ2)', item: 'glitchcap' },
  { id: 'explorer', name: 'Old Explorer Hat (RJ3)', item: 'explorer' },
  { id: 'goldtime', name: 'GOLDEN TIME ROBO', secret: true },   // ⭐ secret look: beat the secret Time Vault!
  { id: 'glint', name: 'GLINT (was Mirror Robo)', mirror: true }, // 🪞 secret look: bonk the secret MIRROR ROBO!
];
const lookOpen = l => l.mirror ? !!save.mirrorDone : l.secret ? !!save.vaultDone : l.item ? !!save.items[l.item] : l.bundle < 0 || bundleHas(l.bundle);
let lookIdx = Math.max(0, LOOKS.findIndex(l => l.id === save.look));
if (!lookOpen(LOOKS[lookIdx])) lookIdx = 0;
function cycleLook(d) {
  lookIdx = (lookIdx + d + LOOKS.length) % LOOKS.length;
  if (lookOpen(LOOKS[lookIdx])) { save.look = LOOKS[lookIdx].id; writeSave(); }
  sfx.click();
}
const curLook = () => lookOpen(LOOKS[lookIdx]) ? LOOKS[lookIdx].id : 'normal';
const RAINBOW7 = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#2979ff', '#651fff', '#d500f9'];

// ---------- Sound effects ----------
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = save.music !== false, freezeT = 0;
function note(freq, start, dur, wave = 'square', vol = 0.12, slideTo = null) {
  if (!actx) return;
  const t = actx.currentTime + start;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus || actx.destination);
  o.start(t); o.stop(t + dur + 0.02);
}
const sfx = {
  jump:   () => note(400, 0, 0.15, 'sine', 0.15, 900),
  djump:  () => { note(600, 0, 0.12, 'sine', 0.14, 1300); note(900, 0.05, 0.1, 'triangle', 0.06); },
  hover:  () => note(120 + Math.random() * 40, 0, 0.06, 'sawtooth', 0.025),
  coin:   () => { note(988, 0, 0.08); note(1319, 0.07, 0.2); },
  shard:  () => [880, 1109, 1319, 1760, 2217].forEach((f, i) => note(f, i * 0.07, 0.25, 'sine', 0.12)),
  stomp:  () => note(400, 0, 0.15, 'triangle', 0.2, 100),
  spring: () => note(200, 0, 0.3, 'sine', 0.2, 900),
  ouch:   () => note(500, 0, 0.4, 'sawtooth', 0.1, 80),
  check:  () => { note(660, 0, 0.1); note(880, 0.1, 0.2); },
  dash:   () => note(300, 0, 0.2, 'sawtooth', 0.08, 1200),
  clank:  () => { note(1200, 0, 0.06, 'square', 0.06, 900); note(600, 0.02, 0.1, 'triangle', 0.08); },
  warn:   () => { note(880, 0, 0.08, 'square', 0.08); note(880, 0.12, 0.08, 'square', 0.08); },
  boss:   () => [196, 185, 175, 165].forEach((f, i) => note(f, i * 0.25, 0.3, 'sawtooth', 0.12)),
  bossHit: () => { note(300, 0, 0.3, 'square', 0.15, 60); note(900, 0, 0.1, 'sine', 0.1); },
  bossDie: () => { for (let i = 0; i < 8; i++) note(400 - i * 40, i * 0.08, 0.15, 'sawtooth', 0.08); },
  click:  () => note(700, 0, 0.06, 'square', 0.06),
  win:    () => [523, 659, 784, 1047, 784, 1047].forEach((f, i) => note(f, i * 0.12, 0.2, 'square', 0.1)),
  ready:  () => { note(1319, 0, 0.06, 'sine', 0.06); note(1760, 0.06, 0.1, 'sine', 0.06); },
  pop:    () => { note(800, 0, 0.12, 'square', 0.08, 200); },
  glitch: () => { for (let i = 0; i < 4; i++) note(200 + Math.random() * 1600, i * 0.03, 0.04, 'square', 0.04); },
  rumble: () => { note(60, 0, 0.8, 'sawtooth', 0.12, 35); note(90, 0.1, 0.6, 'square', 0.06, 40); },
  tick:   () => note(1800, 0, 0.03, 'square', 0.025),
  rewind: () => { for (let i = 0; i < 14; i++) note(1200 - i * 70, i * 0.035, 0.05, 'sawtooth', 0.05); },   // ◀◀ clock rewind whirr
  zap:    () => { note(120, 0, 0.6, 'sawtooth', 0.12, 2400); note(2400, 0.25, 0.5, 'sine', 0.08, 200); for (let i = 0; i < 6; i++) note(1500 + i * 300, 0.05 + i * 0.05, 0.05, 'square', 0.04); },   // ⚡ ZAP! through time
  clock:  () => { note(2100, 0, 0.04, 'triangle', 0.08); note(1250, 0.25, 0.04, 'triangle', 0.08); },   // tick... tock
  laserWarn: () => { note(1200, 0, 0.1, 'sine', 0.06, 1600); note(1200, 0.15, 0.1, 'sine', 0.06, 1600); },
  laser:  () => { note(1800, 0, 0.35, 'sawtooth', 0.07, 300); note(900, 0, 0.35, 'square', 0.04, 150); },
  beat:   () => { note(70, 0, 0.12, 'sine', 0.2, 45); note(60, 0.16, 0.14, 'sine', 0.16, 40); },        // 💗 ba-BUM
  slow:   () => { [1568, 1319, 1047, 784].forEach((f, i) => note(f, i * 0.07, 0.35, 'sine', 0.08)); note(300, 0, 0.8, 'triangle', 0.06, 120); },
  unslow: () => [784, 1047, 1319, 1568].forEach((f, i) => note(f, i * 0.04, 0.15, 'sine', 0.06)),
  crystal: () => [2093, 2637, 3136, 4186].forEach((f, i) => note(f, i * 0.06, 0.4, 'sine', 0.07)),
  item:   () => [784, 988, 1175, 1568, 1976, 2349].forEach((f, i) => note(f, i * 0.07, 0.3, 'sine', 0.1)),
  rift:   () => { note(80, 0, 1, 'sawtooth', 0.1, 400); note(400, 0.4, 0.6, 'sine', 0.08, 90); },
};
function speak(line) {                                   // the browser's voice reads it out loud
  try {
    if (window.speechSynthesis && typeof SpeechSynthesisUtterance !== 'undefined') {
      const u = new SpeechSynthesisUtterance(line); u.rate = 0.95; u.pitch = 0.6; u.volume = 1;
      window.speechSynthesis.cancel(); window.speechSynthesis.speak(u);
    }
  } catch (_) {}
}

// Every song has 5 tracks: LEAD (fat detuned synth + vibrato + echo), HARMONY / COUNTER-MELODY, CHORD PADS,
// a punchy BASS (filter envelope) and DRUMS (kick, snare, hats, claps, toms made from oscillators + noise).
// Songs are written in scale degrees, so the harmony can follow the melody and the final chorus can KEY CHANGE up.
// Form: intro, verse, chorus, verse, chorus, bridge, chorus, KEY CHANGE chorus, tag = 64 bars, then it loops to the verse.
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.6 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (actx && musicBus) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.6 : 0, t + 0.25); }
  if (musicOn) { nextT = 0; }
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell') {           // hit-and-ring voices (steel drum, crystal bell)
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, 0.6), 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, kind === 'choir' ? 0.35 : 0.22, vol, 0.85, dur, 0.5, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  } else if (kind === 'g') {                           // 👾 glitch blip: a tiny jumpy square-wave chirp
    const f0 = 700 + (Math.floor(t * 1000) % 7) * 260, o = osc('square', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.setValueAtTime(f0 * 1.5, t + 0.02); o.frequency.setValueAtTime(f0 * 0.75, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.setValueAtTime(vol, t + 0.045); g.gain.linearRampToValueAtTime(0, t + 0.055);
    o.connect(g); g.connect(out);
  }
}
// ⏰ NEW drums for Robo Jump 7: w = clock TICK, q = clock TOCK (wood blocks), j = finger cymbals (Pyramid Moon)
function drumX0(kind, t, vol, out) {

// ---------- Building a level from its tokens ----------
function buildLevel(st) {
  clearObjects();
  const cs = [], toks = st.lvl.trim().split(/\s+/);
  let g = 2, si = 0, sk = 0, bk = 0;
  const colG = gh => { const c = new Array(ROWS).fill(' '); for (let r = ROWS - gh; r < ROWS; r++) c[r] = '#'; return c; };
  const add = () => { cs.push(colG(g)); return cs.length - 1; };
  const pit = () => { cs.push(colG(0)); return cs.length - 1; };
  const top = () => (ROWS - g) * T;
  const era = THEMES[st.theme].era, enemy = THEMES[st.theme].enemy;
  for (let i = 0; i < toks.length; i++) {
    const tk = toks[i], num = () => +toks[++i];
    if (tk === 'F') { const n = num(); for (let k = 0; k < n; k++) add(); }
    else if (tk === 'C') { const n = num(); for (let k = 0; k < n; k++) { const c = add(); coins.push({ x: c * T + 20, y: top() - 50, got: false }); } }
    else if (tk === 'Q') { const n = num(); for (let k = 0; k < n; k++) { const c = add(); for (let j = 0; j < 3; j++) coins.push({ x: c * T + 20, y: top() - 50 - j * 40, got: false }); } coinRain = true; }
    else if (tk === 'G') { const n = num(); for (let k = 0; k < n; k++) pit(); }
    else if (tk === 'U') { g = Math.min(8, g + num()); add(); }
    else if (tk === 'D') { g = Math.max(1, g - num()); add(); }
    else if (tk === 'B') {
      const n = num();
      for (let k = 0; k < n; k++) { const c = pit(); if (k % 3 !== 2) { const r = ROWS - g - (k % 6 < 3 ? 1 : 2); cs[c][r] = '='; if (k % 3 === 0) coins.push({ x: c * T + 40, y: r * T - 30, got: false }); } }
    }
    else if (tk === 'A') { const n = num(), c0 = cs.length; for (let k = 0; k < n; k++) pit(); for (let k = 0; k <= n * 2; k++) { const f = k / (n * 2); coins.push({ x: c0 * T + f * n * T, y: top() - 40 - Math.sin(f * Math.PI) * 120, got: false }); } }
    else if (tk === 'O') { const n = num(); for (let k = 0; k < n; k++) { const c = pit(); cs[c][ROWS - g] = 'o'; blinkCols[c] = Math.floor(k / 2) % 2; } }
    else if (tk === 'V') { const n = num(), c0 = cs.length; for (let k = 0; k < n; k++) pit(); movers.push({ x: c0 * T, x0: c0 * T, x1: (c0 + n - 2) * T, y: top(), w: 2 * T, h: 16, dx: 1.4, dy: 0 }); }
    else if (tk === 'E') { const c = add(); if (enemy) enemies.push({ kind: enemy, x: c * T + 5, y: top() - 30, w: 30, h: 30, vx: -1.1, alive: true, fly: false }); }
    else if (tk === 'Y') { const c = add(); if (enemy) enemies.push({ kind: enemy, x: c * T + 5, x0: c * T + 5, y: top() - 130, y0: top() - 130, w: 30, h: 26, vx: 0, alive: true, fly: true, ph: c }); }
    else if (tk === 'M') { const c = add(); springs.push({ x: c * T + 4, y: top() - 16, w: 32, h: 16, t: 0 }); }
    else if (tk === 'K') { const c = add(); flags.push({ x: c * T + 20, y: top(), on: false }); }
    else if (tk === 'S') { const n = num(), c = add(); shards.push({ x: c * T + 20, y: top() - n * T + 10, k: sk++, got: false }); }
    else if (tk === 'H') { const c = add(); hearts.push({ x: c * T + 20, y: top() - 40, got: false }); }
    else if (tk === 'I') { const c = add(); signs.push({ x: c * T + 20, y: top(), text: (st.signs || [])[si++] || '' }); }
    else if (tk === '^') { const n = num(); for (let k = 0; k < n; k++) { const c = add(); spikes.push({ x: c * T + 4, y: top() - 14, w: T - 8, h: 14 }); } }
    else if (tk === 'R') { const n = num(), c = add(); items.push({ x: c * T + 20, y: top() - n * T + 10, id: era === 1 ? 'tophat' : era === 2 ? 'glitchcap' : 'explorer', got: false }); }
    else if (tk === 'Z') { const who = toks[++i], c = add(); crystals.push({ x: c * T + 20, y: top(), who }); }
    else if (tk === 'L') { const n = num(); for (let k = 0; k < n; k++) add(); lasers.push({ x: (cs.length - n / 2) * T, bottom: top(), ph: bk++ * 70 }); }
  }
  for (let k = 0; k < 3; k++) add();
  goal = { x: (cs.length - 1) * T + 20, y: top() };          // 🌀 the TIME PORTAL at the end of every level
  for (let k = 0; k < 5; k++) add();
  map = []; cols = cs.length;
  for (let r = 0; r < ROWS; r++) { let s = ''; for (let c = 0; c < cols; c++) s += cs[c][r]; map.push(s); }
}
function buildArena() {                                  // the boss room: one screen, walls on both sides, 2 floating platforms

    let s = '';

  }
}

  team.forEach((w, k) => drawFriend(w, 150 + k * 132, 400 - Math.abs(Math.sin(endT * 0.1 + k)) * 24, 1.3));
  text('LASERHEART JOINED THE TEAM!  💗', W / 2, 455, 26, '#fff');
  text('Story by BEN  •  THE END', W / 2, 492, 20, '#fff59d');
  if (!save.mirrorFound) text('...psst. Have you looked in the mirror? 🪞', W - 190, 160, 15, frame % 60 < 40 ? '#e1f5fe' : '#b3e5fc');
}
function drawCodeFX() {                                  // 📺 a BIG flash of time sparkles (no ctx.filter: just lots of little rectangles)
  const k = codeFX / 160;
  if (codeFX > 140) { ctx.fillStyle = `rgba(255,255,255,${(codeFX - 140) / 20})`; ctx.fillRect(0, 0, W, H); }
  for (let i = 0, n = Math.floor(220 * k); i < n; i++) { const r = Math.random(); ctx.fillStyle = r < 0.33 ? 'rgba(255,64,129,.55)' : r < 0.66 ? 'rgba(64,196,255,.55)' : 'rgba(255,215,64,.6)'; ctx.fillRect(Math.random() * W, Math.random() * H, 4 + Math.random() * 40, 2 + Math.random() * 5); }
  ctx.save(); ctx.globalAlpha = Math.min(1, codeFX / 30);
  roundRect(W / 2 - 330, 200, 660, 120, 24, 'rgba(30,0,20,.88)');
  text('SECRET CODE ACCEPTED!', W / 2 + (frame % 9 < 2 ? 6 : 0), 262, 48, '#ff80ab');
  text('⭐ The secret TIME VAULT appeared on the timeline!', W / 2, 302, 22, '#fff59d');
  ctx.restore();
}
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'talk') drawTalk();
  else if (state === 'play' || state === 'oops') {
    drawGame(); drawHUD();
    if (state === 'oops') { ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(0, 0, W, H); text('OOPS! Try again!', W / 2, H / 2, 54, '#fff'); text(boss && (boss.kind === 'laserheart' || boss.kind === 'mirror') ? '⏰ back to the start of this phase (unlimited tries!)' : 'unlimited tries!', W / 2, H / 2 + 44, 20, '#ffd740'); }
  } else if (state === 'clear') drawClear();
  else if (state === 'warp') drawWarp();
  else if (state === 'credits') drawCredits();
  if (!actx && state === 'title' && frame % 60 < 40) text('🔊 tap or press a key for sound', W / 2, 240, 16, '#ddd');
  if (state === 'play' || state === 'oops' || state === 'talk' || state === 'clear') drawGlass();
  if (mirrorFX > 0) drawMirrorFX();
  if (codeFX > 0) drawCodeFX();
}
// ---------- Main loop (steady speed on every screen) ----------
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  playMusic();
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
