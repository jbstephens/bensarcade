<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🧺 Shopping Basket</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #fff1d6 0 36px, #ffe2b8 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(24px, 4vw, 46px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff4f7a; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-tv { background: #ff8a80; font-size: 22px; } .b-spin { background: #ffd54f; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🧺 the designer ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 40%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #boxPrev { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #ff4f7a;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #boxPrev svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(17px, 2.2vw, 25px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 21px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 16px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 66px; height: 66px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .opt.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .sw { width: 52px; height: 52px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  .swRow { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  #invHelp { font-size: 15px; text-align: center; color: #555; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff4f7a; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff4f7a; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  #boxPrev { cursor: pointer; position: relative; }
  #prevFlip { position: absolute; right: 8px; bottom: 8px; font-size: 15px; background: #fff6d6; border: 3px solid #333; border-radius: 12px; padding: 2px 8px; pointer-events: none; }
  /* ---------- 🏷️ store-name slot machine ---------- */
  .slots { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .slot { background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(18px, 2.2vw, 26px); min-height: 34px; display: block; }
  .slot .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  .chip { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px 10px; cursor: pointer; color: #222; box-shadow: 0 4px 0 #333; min-height: 50px; }
  .chip.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .chip.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .optRow { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  #opts h4 { margin: 4px 0 0; font-size: 19px; text-align: center; }
  .b-shop { background: #ffd54f; font-size: 22px; }
  /* ---------- 🛒 the shopping trip ---------- */
  #shop { flex-direction: row; gap: 10px; padding: 10px; }
  #shLeft { width: 24%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #shList { flex: 1; min-height: 0; overflow-y: auto; background: repeating-linear-gradient(180deg, #fffef6 0 38px, #b3d4ff 38px 40px); border: 5px solid #333; border-radius: 16px; padding: 8px 10px; }
  #shList h3 { margin: 0 0 4px; text-align: center; font-size: clamp(18px, 2.2vw, 24px); color: #d81b60; }
  .li { display: flex; align-items: center; gap: 8px; font-size: clamp(16px, 2vw, 22px); font-weight: bold; min-height: 40px; }
  .li .bx { width: 30px; height: 30px; border: 4px solid #333; border-radius: 6px; background: #fff; flex: none; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #1b8a2f; }
  .li svg { width: 36px; height: 36px; flex: none; }
  .li.done span { text-decoration: line-through; color: #888; }
  .li.done .bx { background: #b9f6ca; }
  #shMid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #shelves { flex: 1; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; align-content: start;
    background: repeating-linear-gradient(180deg, #fff3e0 0 118px, #a1887f 118px 130px); border: 5px solid #333; border-radius: 18px; padding: 8px; }
  .item { font: inherit; overflow: hidden; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 2px; cursor: pointer; display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 #333; color: #222; height: 110px; }
  .item svg { width: 100%; height: 66px; pointer-events: none; flex: none; }
  .item span { font-size: 12.5px; font-weight: bold; text-align: center; line-height: 1.05; }
  .item.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .item.no { animation: shake .4s; } .item.got { opacity: .45; }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  #shRight { width: 27%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #shBasket { flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #ff4f7a; overflow: hidden; display: flex; align-items: center; justify-content: center; }
  #shBasket svg { width: 100%; height: 100%; }
  #shBasket g.drop { animation: drop .55s cubic-bezier(.3, 0, .6, 1.4) both; }
  @keyframes drop { from { transform: translateY(-520px); } to { transform: translateY(0); } }
  #shSay { font-size: clamp(16px, 2vw, 22px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px 6px; min-height: 40px; }
  #shHead { display: flex; gap: 8px; align-items: center; justify-content: center; flex-wrap: wrap; }
  #shHead h1 { font-size: clamp(20px, 3vw, 36px); }
  .b-check { background: #69f0ae; font-size: 22px; } .b-new { background: #ffd54f; }
  /* ---------- 🧾 checkout + receipt ---------- */
  #till { position: fixed; inset: 0; z-index: 55; background: rgba(0,0,0,.55); display: none; align-items: center; justify-content: center; gap: 16px; padding: 12px; }
  #till.on { display: flex; }
  #tillArt { width: min(44vw, 60vh); aspect-ratio: 1; background: #fff; border: 6px solid #333; border-radius: 22px; overflow: hidden; }
  #tillArt svg { width: 100%; height: 100%; }
  #receipt { width: min(34vw, 340px); max-height: 90vh; overflow: hidden; background: #fff; border: 3px dashed #999; padding: 10px 14px; font-family: "Courier New", monospace; font-size: clamp(14px, 1.8vw, 19px);
    transform-origin: top; animation: rcpt 1.2s steps(12) both; display: flex; flex-direction: column; gap: 2px; }
  #receipt b { text-align: center; display: block; }
  #receipt .ln { display: flex; justify-content: space-between; gap: 8px; }
  #receipt .tot { border-top: 3px dashed #333; margin-top: 4px; padding-top: 4px; font-weight: bold; }
  #receipt .btn { font-family: "Comic Sans MS", "Chalkboard SE", sans-serif; margin-top: 8px; }
  @keyframes rcpt { from { clip-path: inset(0 0 100% 0); } to { clip-path: inset(0 0 0 0); } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  #pageCtl { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; display: grid; grid-template-columns: 54px 1fr 54px; gap: 6px; align-items: center; text-align: center; font-weight: bold; font-size: 17px; }
  #pageCtl .btn { min-height: 46px; padding: 2px; }
  @media (orientation: portrait) {
    #inv, #view, #shop { flex-direction: column; }
    #invLeft { width: 100%; height: 40vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #shLeft, #shRight { width: 100%; height: 22vh; flex-direction: row; } #shelves { grid-template-columns: repeat(6, 1fr); }
    #till { flex-direction: column; } #tillArt { width: 60vw; } #receipt { width: 80vw; }
  }
  @media (max-height: 600px) { .btn { min-height: 46px; font-size: 17px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 50px; height: 50px; }
    .item { height: 92px; } .item svg { height: 56px; } #shelves { background: repeating-linear-gradient(180deg, #fff3e0 0 100px, #a1887f 100px 110px); } }
  /* ---------- PRINT: only the sheet (or the whole set), at REAL SIZE: 800 x 1000 units = 8 x 10 in ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.25in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #till { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 8in; height: 10in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <h1 class="big">🧺 SHOPPING BASKET</h1>
    <div id="boxPrev"></div>
    <div id="invName"></div>
    <div class="two">
      <button class="btn b-shop" id="bShop">🛒 Go Shopping!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="invHelp">Arrows: ⬆️⬇️ pick a part, ⬅️➡️ change it · Space = spin · S = go shopping · Enter = printables</div>
  </div>
</div>
<div id="shop" class="screen">
  <div id="shLeft">
    <button class="btn b-back" id="bShBack">⬅️ Designer</button>
    <div id="shList"></div>
    <button class="btn b-new" id="bNewList">📝 New list</button>
  </div>
  <div id="shMid">
    <div id="shHead"><h1 class="big" id="shTitle">🛒 SHOPPING TRIP</h1></div>
    <div id="shelves"></div>
  </div>
  <div id="shRight">
    <div id="shBasket"></div>
    <div id="shSay"></div>
    <button class="btn b-check hide" id="bCheck">🧾 Checkout!</button>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Designer</button>
    <h1 class="big">🖨️ PRINT &amp; MAKE</h1>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. Print at 100% ("Actual size"). A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pageCtl" class="hide"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="till"><div id="tillArt"></div><div id="receipt"></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🧺 SHOPPING BASKET (Ben's own idea!): design a store hand basket (basket color, pattern, handle color, store name
// from a slot machine, a Game Factory sticker), go on a Shopping Trip (a list is read out loud, tap the groceries on
// the shelves, they drop into your basket, then a checkout beep and a receipt), and print a REAL-SIZE fold-up paper
// basket: 7½ x 5 x 4 inches, double-layer walls, two flip-up handles on paper fold hinges.
// Printables: my basket (5 pages), blank basket (5 pages), a shopping list pad, fold-up grocery boxes, paper food.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 printed at 8 x 10 in: 100 units = 1 inch.
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from the Lunchbox Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');

function traceImage() {                // your crayon coloring as a picture laid on the sheet for printing

// =====================================================================
// PRINTING: only the sheet prints (see @media print). "Print them all" prints one sheet per page.

const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);

function notePrinted() { state.printed++; saveState(); checkTrophy('You printed your basket stuff!'); }

// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, C = commercial)

function gridCols() {

  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });

// ---------- 📄 page picker for the 6-page basket ----------
function pagePick(d) { state.pg = (state.pg + d + BK_PAGES) % BK_PAGES; saveState(); renderSheet(); updateSide(); sizeCanvas(); blip(620, 0, .06); }
function renderPageCtl() {

// =====================================================================
// 🛒 THE SHOPPING TRIP: a list is read out loud, tap the groceries on the shelves, they drop in your basket,

const listWords = a => a.length < 2 ? a.join('') : a.slice(0, -1).join(', ') + ', and ' + a[a.length - 1];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function newList(quiet) {
  const nReal = 3 + (Math.random() < .5 ? 1 : 0);
  trip = { list: shuffle(REAL_ITEMS).slice(0, nReal).concat(shuffle(SILLY_ITEMS).slice(0, 1)), got: [], drop: false };

}
const tripDone = () => trip.list.length > 0 && trip.list.every(id => trip.got.indexOf(id) >= 0);

function shopSay(t) { if ($('shSay')) $('shSay').textContent = t; }
function renderShop() {
  $('shTitle').textContent = '🛒 ' + storeName(state).toUpperCase();
  const L_ = $('shList'); L_.innerHTML = '';
  L_.appendChild(mkDiv('', '<h3>📝 ' + esc(state.who) + "'s list</h3>"));
  trip.list.forEach(id => { const done = trip.got.indexOf(id) >= 0;
    L_.appendChild(mkDiv('li' + (done ? ' done' : ''), '<div class="bx">' + (done ? '✔' : '') + '</div>' + foodSVG(id) + '<span>' + esc(itemName(id)) + '</span>')); });

}
function renderShopBasket() { $('shBasket').innerHTML = mini(() => basketPic(state, 0, 50, .5, { items: trip.got, drop: trip.drop }), BASKET_VB); }
function pick(id, el) {
  if (tilling) return;
  if (trip.got.indexOf(id) >= 0) { blip(330, 0, .1); shopSay('That is already in your basket!'); return; }
  if (trip.list.indexOf(id) < 0) {
    blip(220, 0, .18, 'sine', .15); shopSay('Hmm, ' + itemName(id) + ' is not on your list.'); hush(); say('Hmm. That is not on your list.');

// ---------- 🧾 checkout ----------
const priceOf = id => itemOf(id)[2];
function tillArt(scanned) {
  return mini(() => {
    let o = R(-300, -300, 600, 600, 0, '#e1f5fe', 0) + R(-300, 120, 600, 200, 0, vshade('#8d6e63'), OL, 3) + R(-300, 120, 600, 22, 0, '#a1887f', OL, 2);
    o += R(40, 40, 160, 100, 14, vshade('#455a64'), OL, 3) + R(56, 52, 128, 44, 8, '#1b5e20', OL, 2) + T(120, 82, scanned.length ? scanned.reduce((a, id) => a + priceOf(id), 0) + ' coins' : 'HELLO!', 22, '#b9f6ca');

function receiptHTML(scanned, done) {
  let h = '<b>🧺 ' + esc(storeName(state).toUpperCase()) + '</b><b>* * * RECEIPT * * *</b>';
  scanned.forEach(id => { h += '<div class="ln"><span>' + esc(itemName(id)) + '</span><span>' + priceOf(id) + '</span></div>'; });
  if (done) {

function checkout() {
  if (!tripDone() || tilling) return;

  t.classList.add('on'); $('tillArt').innerHTML = tillArt(scanned); $('receipt').innerHTML = receiptHTML(scanned, false);
  hush(); say('Beep, beep! Scanning your groceries.');
  trip.got.forEach((id, i) => tillTimers.push(setTimeout(() => { scanned.push(id); scanBeep(); $('tillArt').innerHTML = tillArt(scanned); $('receipt').innerHTML = receiptHTML(scanned, false); }, 700 + i * 650)));
  tillTimers.push(setTimeout(() => finishTrip(scanned), 900 + trip.got.length * 650));

  const r = mkDiv('two'); r.appendChild(mkBtn('btn b-new', '🛒 Shop again', () => { closeTill(); newList(); })); r.appendChild(mkBtn('btn b-back', '⬅️ Designer', () => { closeTill(); backToInventor(); }));

// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, S = shopping, C = checkout, N = new list)
// =====================================================================
function onKey(e) {
  const k = e.key;

  if (view === 'inv') {
    if (k === 'ArrowUp' || k === 'ArrowDown') { catI = (catI + (k === 'ArrowDown' ? 1 : CATS.length - 1)) % CATS.length; kCur = 0; renderCats(); renderOpts(); blip(520, 0, .06); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') nudge(k === 'ArrowRight' ? 1 : -1);
    else if (k === ' ') { if (catId() === 'store') spinName(); else flipHandles(); }
    else if (k === 'Enter') openGallery();
    else if (k === 's' || k === 'S') openShop();
    else if (k === 'p' || k === 'P') { sel = 0; openSheet(0); printSheet(); }
    else return;
    e.preventDefault();
  } else if (view === 'shop') {
    const N = ITEMS.length, cols = 6;
    if (k === 'ArrowRight') shopCur = (shopCur + 1) % N;
    else if (k === 'ArrowLeft') shopCur = (shopCur + N - 1) % N;
    else if (k === 'ArrowDown') shopCur = Math.min(N - 1, shopCur + cols);
    else if (k === 'ArrowUp') shopCur = Math.max(0, shopCur - cols);
    else if (k === 'Enter' || k === ' ') { if (tripDone()) checkout(); else pick(ITEMS[shopCur][0], document.querySelectorAll('.item')[shopCur]); e.preventDefault(); return; }
    else if (k === 'c' || k === 'C') { checkout(); return; }
    else if (k === 'n' || k === 'N') { newList(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToInventor(); e.preventDefault(); return; }

    e.preventDefault(); renderShop(); blip(520, 0, .05);
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToInventor(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }

    else if (k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowRight' || k === 'ArrowLeft') { openSheet((sel + (k === 'ArrowRight' ? 1 : SHEETS.length - 1)) % SHEETS.length); e.preventDefault(); }
  }
}
