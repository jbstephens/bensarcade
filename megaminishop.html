<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Mega and Mini Shop</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #b8860b; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; transition: background .6s; }
  body.mini { background: #9575cd; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #fffdf4; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.45); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #eef3fb; border-bottom: 2px solid #d3def0; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #555; white-space: nowrap; overflow: hidden; }
  #url b { color: #e0592a; } body.mini #url b { color: #8e24aa; }
  /* store header: MEGA = gold + orange, MINI = lavender + pink */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #ffd54f, #ff9800 60%, #e65100); color: #2b2d42; flex: none; min-height: 104px; border-bottom: 6px solid #8d5a00; transition: background .6s; }
  body.mini #head { background: linear-gradient(90deg, #e1bee7, #b39ddb 55%, #f8bbd0); border-bottom-color: #7e57c2; }

  #logo .big { font-size: 27px; font-weight: 900; letter-spacing: 1px; color: #fff; text-shadow: 0 3px 0 #6d4c00, 0 0 2px #6d4c00; }
  #logo .big i { font-style: normal; color: #fff59d; }
  #logo .big u { text-decoration: none; font-size: 18px; color: #f3e5f5; text-shadow: 0 2px 0 #6a1b9a, 0 0 2px #6a1b9a; }
  #logo .small { font-size: 15px; color: #2b2d42; margin-top: 4px; font-weight: bold; }
  #helper { width: 112px; height: 100px; flex: none; }

  #speech { flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
  #who { font-size: 15px; font-weight: 900; color: #2b2d42; padding-left: 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble { position: relative; background: #fff; color: #2b2d42; border-radius: 18px; padding: 8px 14px; font-size: 18px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #2b2d42; }
  #bubble:before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -10px; border: 10px solid transparent; border-right: 14px solid #2b2d42; border-left: 0; }
  #wallet { flex: none; text-align: center; background: #fff; color: #2b2d42; border-radius: 16px; padding: 4px 10px; font-weight: 900; box-shadow: 0 4px 0 #c2410c; border: 3px solid #2b2d42; }
  body.mini #wallet { box-shadow: 0 4px 0 #7e57c2; }
  #wallet .amt { font-size: 24px; } #wallet .lbl { font-size: 13px; }
  #moreBucks { font-size: 15px; font-weight: bold; border: 0; border-radius: 12px; padding: 6px 8px; background: #ffd23f; color: #2b2d42; margin-top: 3px; }
  /* 🎚️ the SIZE SWITCH lever */
  #switch { flex: none; width: 104px; height: 96px; border: 3px solid #2b2d42; border-radius: 18px; background: #fff; padding: 2px; box-shadow: 0 4px 0 #6d4c00; }
  body.mini #switch { box-shadow: 0 4px 0 #6a1b9a; }
  #switch svg { width: 100%; height: 100%; display: block; }
  #switch .arm { transition: transform .45s cubic-bezier(.5,1.8,.5,1); transform-origin: 50px 62px; transform: rotate(-38deg); }
  body.mini #switch .arm { transform: rotate(38deg); }
  /* tabs */
  #nav { display: flex; gap: 10px; padding: 8px 14px; background: #eef3fb; flex: none; }
  #nav button { font-size: 21px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 18px; background: #fff; color: #2b2d42; box-shadow: 0 4px 0 #b8c7e6; }
  #nav button.on { background: #ff9800; color: #fff; box-shadow: 0 4px 0 #c2410c; }
  body.mini #nav button.on { background: #9c27b0; box-shadow: 0 4px 0 #6a1b9a; }
  #nav .count { display: inline-block; min-width: 28px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff5d8f; color: #fff; font-size: 18px; }
  #deal { margin-left: auto; align-self: center; font-size: 17px; font-weight: bold; color: #c2410c; background: #fff; border: 0; border-radius: 14px; padding: 8px 12px; box-shadow: 0 4px 0 #ffb347; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40%; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 10px 14px 30px 14px; background-color: #fff8e1;
    background-image: radial-gradient(circle at 12px 12px, #ffe0a3 3px, transparent 4px); background-size: 48px 48px; background-attachment: local; }
  body.mini #main { background-color: #f8f0ff; background-image: radial-gradient(circle at 6px 6px, #e1bee7 1.5px, transparent 2px); background-size: 16px 16px; }
  #main.grow { animation: grow .8s cubic-bezier(.3,1.6,.5,1); } #main.shrink { animation: shrink .8s cubic-bezier(.3,1.6,.5,1); }
  @keyframes grow { 0% { transform: scale(.35); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes shrink { 0% { transform: scale(1.8); opacity: .3; } 100% { transform: scale(1); opacity: 1; } }
  #pop { position: fixed; left: 50%; top: 50%; z-index: 300; pointer-events: none; font-size: 90px; font-weight: 900; color: #fff; -webkit-text-stroke: 4px #2b2d42; opacity: 0; transform: translate(-50%, -50%); white-space: nowrap; }
  #pop.grow { animation: popGrow 1.1s ease-out; } #pop.shrink { animation: popShrink 1.1s ease-out; }
  @keyframes popGrow { 0% { opacity: 1; transform: translate(-50%,-50%) scale(.2); } 60% { opacity: 1; transform: translate(-50%,-50%) scale(1.6); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(2.2); } }
  @keyframes popShrink { 0% { opacity: 1; transform: translate(-50%,-50%) scale(2.4); } 60% { opacity: 1; transform: translate(-50%,-50%) scale(.6); } 100% { opacity: 0; transform: translate(-50%,-50%) scale(.1); } }
  .idea { display: inline-block; font-size: 17px; font-weight: 900; color: #2b2d42; background: #fff3b0; border: 3px dashed #ffb347; border-radius: 14px; padding: 6px 12px; margin: 0 0 8px; }
  .cats { display: flex; gap: 8px; margin-bottom: 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 2px 2px 8px; }
  .catb { flex: none; font-size: 17px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 12px; background: #fff; color: #2b2d42; box-shadow: 0 4px 0 #b8c7e6; white-space: nowrap; }
  .catb span { display: inline-block; min-width: 22px; border-radius: 12px; background: #eef3fb; color: #2b2d42; font-size: 13px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #ff9800; color: #fff; box-shadow: 0 4px 0 #c2410c; } .catb.on span { background: #fff; }
  body.mini .catb.on { background: #ab47bc; box-shadow: 0 4px 0 #6a1b9a; }
  .dept { display: flex; align-items: center; gap: 12px; background: linear-gradient(90deg, #fff3c4, #ffd180); border-radius: 16px; padding: 8px 14px; margin-bottom: 12px; color: #2b2d42; border: 3px solid #2b2d42; }
  body.mini .dept { background: linear-gradient(90deg, #f3e5f5, #f8bbd0); }
  .dept .pic { width: 80px; height: 70px; flex: none; } .dept .pic svg { width: 100%; height: 100%; overflow: visible; }
  .dept b { font-size: 22px; display: block; } .dept small { font-size: 16px; color: #4a4e69; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 16px; }
  body.mini #grid { grid-template-columns: repeat(auto-fill, minmax(205px, 1fr)); gap: 10px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(43,45,66,.15); display: flex; flex-direction: column; position: relative; border: 3px solid #2b2d42; }
  body:not(.mini) .card { border-width: 5px; }
  .card.sel { outline: 5px solid #3d7be0; }
  .thumb { width: 100%; aspect-ratio: 790 / 1038; max-height: 240px; border-radius: 12px; background: #eef3fb; display: flex; justify-content: center; overflow: hidden; }
  .thumb svg { height: 100%; width: auto; max-width: 100%; background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  body.mini .thumb { max-height: 190px; }
  .card h3 { margin: 6px 0 2px; font-size: 20px; color: #2b2d42; line-height: 1.1; }
  .card .from { font-size: 13px; font-weight: bold; color: #e0592a; } body.mini .card .from { color: #8e24aa; }
  .card .blurb { font-size: 15px; color: #4a4e69; }
  .card .size { display: inline-block; font-size: 14px; font-weight: 900; background: #fff3c4; border-radius: 10px; padding: 2px 8px; margin: 3px 0; color: #6d4c00; }
  body.mini .card .size { background: #f3e5f5; color: #6a1b9a; }
  .card .gup { font-size: 14px; font-weight: 900; color: #c62828; }
  .card .price { font-size: 21px; font-weight: 900; color: #1e7f4f; margin: 4px 0; }
  .card .price s { color: #aaa; font-size: 16px; margin-right: 6px; }
  .tag { position: absolute; top: 4px; left: 4px; z-index: 2; background: #ff5d8f; color: #fff; font-weight: 900; font-size: 15px; padding: 3px 10px; border-radius: 12px; transform: rotate(-5deg); }
  .tag.gold { background: #ffd23f; color: #2b2d42; }
  .rev { font-size: 14px; background: #f3f6fc; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #444; min-height: 44px; }
  .rev .who { font-weight: bold; color: #e0592a; }
  .stars { color: #f2b544; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #2ec27e; color: #fff; box-shadow: 0 4px 0 #1e7f4f; }
  .add.in { background: #d5f5e3; color: #1e7f4f; box-shadow: 0 4px 0 #9fdcbc; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #fff3b0; box-shadow: 0 4px 0 #f2c94c; }
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(43,45,66,.13); border: 2px solid #2b2d42; flex-wrap: wrap; }
  .line .thumb { width: 64px; height: 84px; flex: none; border-radius: 6px; }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #2b2d42; min-width: 160px; }
  .line .nm small { display: block; font-size: 15px; color: #777; font-weight: normal; }
  .line .pr { font-size: 21px; font-weight: 900; color: #1e7f4f; }
  .badge { display: inline-block; font-size: 13px; font-weight: 900; border-radius: 8px; padding: 1px 7px; margin-right: 4px; color: #fff; background: #ff9800; }
  .badge.mini { background: #ab47bc; }
  .bigbtn { font-size: 24px; font-weight: 900; border: 0; border-radius: 16px; padding: 14px 24px; color: #fff; background: #ff8c42; box-shadow: 0 5px 0 #c2410c; }
  .bigbtn.green { background: #2ec27e; box-shadow: 0 5px 0 #1e7f4f; }
  .bigbtn.blue { background: #3d7be0; box-shadow: 0 5px 0 #1e4fa3; }
  .namebtn { font-size: 19px; font-weight: 900; border: 3px dashed #ff8c42; border-radius: 14px; padding: 10px 14px; background: #fff3b0; color: #2b2d42; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #fdecef; color: #b0526b; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #2b2d42; border: 2px solid #2b2d42; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #ff5d8f; border-radius: 14px; padding: 9px 14px; background: #fff; color: #c2185b; }
  .gift.on { background: #ff5d8f; color: #fff; }
  .names { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; background: #ffe0ec; border-radius: 16px; padding: 10px 12px; margin-bottom: 10px; font-size: 19px; font-weight: bold; color: #c2185b; }
  .names button { font-size: 18px; font-weight: bold; border: 0; border-radius: 12px; padding: 8px 12px; background: #fff; color: #2b2d42; box-shadow: 0 3px 0 #f3b6cf; }
  .names button.on { background: #ff5d8f; color: #fff; box-shadow: 0 3px 0 #c2185b; }
  .empty { text-align: center; font-size: 26px; color: #2b2d42; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #2b2d42; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(29,53,87,.94); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #shipArt { width: min(96vw, calc(78vh * 16 / 9)); aspect-ratio: 16 / 9; border-radius: 18px; overflow: hidden; background: #fff; }
  #shipArt svg { width: 100%; height: 100%; display: block; }
  #ship .bigbtn { margin-top: 14px; }
  .walkR { animation: walkR 3.2s linear forwards; } .stomp { animation: stomp .5s ease-in-out infinite; }
  @keyframes walkR { from { transform: translateX(-260px); } to { transform: translateX(560px); } }
  @keyframes stomp { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-14px); } }
  .shake { animation: shake .5s ease-in-out infinite; } @keyframes shake { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
  .roll { animation: roll .7s linear infinite; transform-box: fill-box; transform-origin: center; } @keyframes roll { to { transform: rotate(360deg); } }
  .confirm { animation: confirm .6s cubic-bezier(.3,1.8,.5,1) both; transform-box: fill-box; transform-origin: center; } @keyframes confirm { from { transform: scale(0); } to { transform: scale(1); } }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(29,53,87,.7); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; border: 4px solid #2b2d42; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #eef3fb; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 8px; background: #eef3fb; z-index: 2; }
  #printBox button { font: bold 24px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 12px 24px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.2); }
  #printBox .pbPrint { background: #2ec27e; } #printBox .pbBack { background: #3d7be0; }
  #printBox .pbMode { background: #fff; color: #2b2d42; border: 3px solid #2b2d42; } #printBox .pbMode.on { background: #ffd23f; }
  #printBox .pbTip { font-size: 19px; color: #2b2d42; margin: 6px 0 4px; font-weight: bold; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.2); border-radius: 6px; overflow: hidden; }
  #printBox .pbPage svg { display: block; width: 100%; height: auto; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 7.9in; height: 10.38in; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; overflow: hidden; }
    #printBox .pbPage svg { width: 7.9in; height: 10.38in; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="site">
  <div id="browser">
    <div class="dots"><span style="background:#ff8a80"></span><span style="background:#ffd180"></span><span style="background:#a5d6a7"></span></div>
    <div id="url">🔒 <b>www.mega-and-mini.shop</b><span id="urlSide">/mega</span></div>
  </div>
  <div id="head">
    <div id="helper"></div>
    <div id="logo"><div class="big">THE <i>MEGA</i><br><u>and mini</u> SHOP</div><div class="small" id="slogan">🦣 GIANT stuff to print!</div></div>
    <div id="speech"><div id="who">Mega Robo</div><div id="bubble">Welcome!</div></div>
    <button id="switch" aria-label="Size switch"></button>
    <div id="wallet"><div class="lbl">MY SIZE COINS</div><div class="amt" id="amt">1000</div><button id="moreBucks">🪙 Get more</button></div>
  </div>
  <div id="nav">
    <button id="tShop" class="on">🏪 SHOP</button>
    <button id="tCart">🛒 CART<span class="count" id="cCount">0</span></button>
    <button id="tOrders">📦 MY ORDERS</button>
    <button id="deal">🪙 Deal of the Day</button>
  </div>
  <div id="main"></div>
</div>
<div id="pop"></div>
<div id="ship"><div id="shipArt"></div><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button></div>
<div id="revBox"><div class="in" id="revIn"></div></div>
<script>
// 🦣🐭 THE MEGA AND MINI SHOP (💡 Ben's idea!): "MEGA stuff: really big bookmarks, door hangers the size of a whole paper,
// and a bunch more mega stuff. MINI stuff: very small bookmarks, very small door hangers, and much more."
// A pretend online store with a big SIZE SWITCH lever that flips the whole shop between MEGA and MINI.
// MEGA side: run by MEGA ROBO (Robo's Mega morph from Robo Jump 4: gold armor, gold star, extra-wide stompy feet).
// MINI side: run by BABY GLOOP (light purple with a pink bow, from the games). Pay with pretend Size Coins (never gfCoins).
// Every item prints at its REAL size: sheets are SVG, viewBox 790 x 1038 = 7.9 x 10.38 inches, so 100 units = 1 inch
// (letter paper with 0.3 inch margins). Each sheet has a little ruler to check. Color + black-and-white for everything.
// No emoji on printed pages: every picture is SVG shapes. Paper only: printer paper, scissors (a grown-up cuts), tape / glue stick, crayons.
// Save: localStorage.megaMiniShop = { coins, side, cart:[keys], gift, giftTo, orders:[{k, gift, to, n, name}], pm, pn, n }
// Trophy 'megaMiniShop': print at least one MEGA item and one MINI item.
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'megaMiniShop';
let S = { coins: 1000, side: 'mega', cart: [], gift: false, giftTo: 'Mom', orders: [], pm: 0, pn: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (S.side !== 'mini') S.side = 'mega';
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
// =====================================================================
// SVG ART ENGINE (copied from secretsurprise.html): LINE = false is color, LINE = true is black and white
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;

    let s = R(0, 0, 960, 540, 0, lin([[0, mini && !mega ? '#e1bee7' : '#ffe082'], [1, '#fff8e1']]), 0) + starsBg(20, 20, 920, 200, 12, 4, '#fff', 8, 16);
    s += R(0, 430, 960, 110, 0, lin([[0, '#9ccc65'], [1, '#689f38']]), OL, 2);
    s += R(800, 210, 130, 220, 10, '#8d6e63', OL, 3) + C(905, 330, 8, '#ffd740', OL, 2) + R(780, 180, 170, 34, 8, '#e53935', OL, 3) + T(865, 205, "BEN'S HOUSE", 18, '#fff');
    if (mega) s += '<g class="walkR"><g class="stomp">' + CH(150, 432, 2.6, () => megaRobo({ happy: true })) + G(150, 236, 1, bigBox(200, 150, '#ff9800', 'MEGA')) + '</g></g>';
    if (mini) s += '<g class="walkR" style="animation-delay:.6s"><g class="stomp" style="animation-duration:.35s">' + CH(mega ? -40 : 150, 432, 1.1, () => babyGloop({ giggle: true })) + G(mega ? -10 : 180, 432, 1, bigBox(16, 12, '#ab47bc', '')) + '</g></g>';
    s += T(480, 70, mega && mini ? 'MEGA + mini delivery!' : mega ? 'MEGA DELIVERY!' : 'teeny tiny delivery!', 44, '#fff', 'middle', ' stroke="' + OL + '" stroke-width="2.5" paint-order="stroke"');
    s += '<g id="okStamp" style="display:none"><g class="confirm">' + R(230, 150, 500, 150, 30, '#2ec27e', OL, 5) + T(480, 215, 'ORDER', 52, '#fff') + T(480, 275, 'CONFIRMED!', 52, '#fff') + '</g></g>';
    return s;
  });
  say(mega ? 'STOMP... STOMP... gently! Here comes your MEGA delivery!' : 'Bounce bounce! Here comes your teeny tiny delivery! Hee hee!');
  clearTimeout(shipTimer);
  shipTimer = setTimeout(() => { const ok = document.getElementById('okStamp'); if (ok) ok.style.display = ''; shipDone = true; $('shipGo').style.display = ''; sfx.cash(); say('ORDER CONFIRMED! Go to MY ORDERS to print it.'); }, 3600);
}
function closeShip() { if (!shipOn) return; shipOn = false; clearTimeout(shipTimer); $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something MEGA or mini, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏪 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    const p = PR(o.k); if (!p) continue;
    const cur = { name: o.name || 'Ben' }, oldC = CUR; CUR = cur; const pages = p.pages().length + (o.gift ? 1 : 0); CUR = oldC;
    const line = el('div', 'line'); line.appendChild(thumb(o.k));
    line.appendChild(el('div', 'nm', sideBadge(p) + p.name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift for ' + (o.to || 'someone') : ''}  •  ${pages} page${pages > 1 ? 's' : ''}${p.gu ? '  •  ✂️ grown-up help' : ''}</small>`));
    if (p.named) { const nb = el('button', 'namebtn', '✏️ Name: ' + (o.name || 'Ben')); nb.onclick = () => { o.name = NAMES7[(NAMES7.indexOf(o.name || 'Ben') + 1) % NAMES7.length]; save(); sfx.click(); say('It will say ' + o.name.toUpperCase() + '!'); const st = $('main').scrollTop; render(); $('main').scrollTop = st; }; line.appendChild(nb); }
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT. Color or black-and-white.
let printList = [];
function printPagesFor(list, line) {
  const out = [];
  for (const o of list) { const p = PR(o.k); if (!p) continue; const cur = { name: o.name || 'Ben', n: o.n || 1 };
    if (o.gift) out.push(sheet(() => giftPage(p.side, o.to), line, cur));
    const old = CUR; CUR = cur; const fns = p.pages(); CUR = old;
    fns.forEach(f => out.push(sheet(f, line, cur))); }
  return out;
}
function fillPrint() {
  if (!printBox) return;
  printBox.querySelectorAll('.pbPage').forEach(e => e.remove());
  const pages = printPagesFor(printList, printMode === 'line');
  for (const svg of pages) { const d = el('div', 'pbPage'); d.innerHTML = svg; printBox.appendChild(d); }
  const pr = printBox.querySelector('.pbPrint'); pr.textContent = pages.length > 1 ? `🖨️ PRINT (${pages.length} pages)` : '🖨️ PRINT';
  printBox.querySelectorAll('.pbMode').forEach(b => b.classList.toggle('on', b.dataset.m === printMode));
}
function openPrint(list) {
  closePrint(true); printList = list.filter(o => PR(o.k)); if (!printList.length) return;
  const name = printList.length === 1 ? PR(printList[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', '🖨️ PRINT');
  const mc = el('button', 'pbMode', '🎨 COLOR'), mb = el('button', 'pbMode', '⚫ BLACK + WHITE'); mc.dataset.m = 'color'; mb.dataset.m = 'line';
  mc.onclick = () => { printMode = 'color'; sfx.click(); fillPrint(); }; mb.onclick = () => { printMode = 'line'; sfx.click(); fillPrint(); say('Black and white! Now you can color it in yourself.'); };
  back.onclick = () => closePrint();
  pr.onclick = () => {
    sfx.click(); for (const o of printList) { if (PR(o.k).side === 'mega') S.pm = (S.pm || 0) + 1; else S.pn = (S.pn || 0) + 1; }
    save(); if (S.pm && S.pn) trophy('megaMiniShop');
    say('Printing! Ask a grown-up to help with the printer. Pick ACTUAL SIZE so it comes out the real size!');
    setTimeout(() => { try { window.print(); } catch (_) {} }, 80);
  };
  bar.append(back, mc, mb, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  📏 Print at 100% / "Actual size" so the ruler is real!'));
  document.body.appendChild(printBox); fillPrint();
  sfx.click(); say(printList.length === 1 ? 'Here it is! Tap PRINT if you want it on paper.' : 'Here are all your orders! Tap PRINT when you are ready.');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue, S = size switch
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipOn && shipDone) closeShip(); else if (view !== 'shop') show('shop'); else if (CAT !== 'all') goCat('all'); }
  else if ((k === 'p' || k === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (k === 'Enter') { if (shipOn && shipDone) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (printBox || shipOn) return;
  else if (k === '1') { sfx.click(); show('shop'); } else if (k === '2') { sfx.click(); show('cart'); } else if (k === '3') { sfx.click(); show('orders'); }
  else if (k === 's' || k === 'S' || k === 'm' || k === 'M') flipSize();
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty. Let\'s find something fun!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreCoins;
$('shipGo').onclick = closeShip;
$('switch').onclick = () => flipSize();
$('helper').onclick = () => { sfx.click(); say(pick(SIDE[S.side].jokes)); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); const p = PR(DEAL); if (p.side !== S.side) flipSize(p.side); CAT = 'all'; show('shop');
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + p.name + '! Half price!');
};
$('deal').textContent = '🪙 Deal: ' + PR(DEAL).name;
window.addEventListener('afterprint', () => { if (printBox) fillPrint(); });
drawSwitch(); drawHelper(); render();
$('bubble').textContent = S.orders.length ? 'Welcome back, Ben! Your prints are waiting in MY ORDERS.' : SIDE[S.side].hi;
</script>
