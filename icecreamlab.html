<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🍦 Ice Cream Flavor Lab</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(90deg, #ffe0ef 0 40px, #e2fbef 40px 80px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 21px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-tv { background: #ff8a80; font-size: 21px; } .b-spin { background: #ffd54f; font-size: 21px; }
  .b-shop { background: #7fe7ff; font-size: 21px; } .b-menu { background: #ffd0f0; font-size: 19px; }
  .b-bell { background: #ffe066; font-size: 24px; } .b-next { background: #b9f6ca; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  /* ---------- 🍦 the Flavor Machine ---------- */
  #inv { flex-direction: row; gap: 10px; padding: 10px; }
  #invLeft { width: 42%; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #ticket { display: none; background: #fffef2; border: 4px solid #333; border-radius: 16px; box-shadow: 0 5px 0 #29b6f6; padding: 6px 8px; gap: 8px; align-items: center; }
  #ticket.on { display: flex; }
  #ticket .tk-who { font-size: clamp(30px, 4vw, 46px); line-height: 1; text-align: center; }
  #ticket .tk-who small { display: block; font-size: 15px; }
  #ticket .tk-pic { width: 70px; height: 92px; flex: none; }
  #ticket .tk-pic svg { width: 100%; height: 100%; }
  #ticket ul { list-style: none; margin: 0; padding: 0; font-size: clamp(14px, 1.7vw, 18px); font-weight: bold; line-height: 1.3; }
  #boxPrev { position: relative; flex: 1; min-height: 0; background: #fff; border: 5px solid #333; border-radius: 20px; box-shadow: 0 6px 0 #ff4fa3;
    display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #boxPrev svg { width: 100%; height: 100%; display: block; }
  #invName { font-size: clamp(17px, 2.2vw, 25px); font-weight: bold; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  #till { position: absolute; top: 8px; left: 8px; background: #ffe066; border: 3px solid #333; border-radius: 12px; padding: 2px 8px; font-weight: bold; font-size: 17px; display: none; }
  #till.on { display: block; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  #invRight { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
  #cats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #cats .btn { font-size: 17px; min-height: 50px; padding: 4px; }
  #opts { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 5px solid #333;
    border-radius: 20px; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  #opts h3 { margin: 0; font-size: 22px; text-align: center; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .opt { font: inherit; font-size: 17px; font-weight: bold; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 4px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 58px; color: #222; box-shadow: 0 4px 0 #333; }
  .opt svg { width: 70px; height: 70px; display: block; pointer-events: none; }
  .opt.sel { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; transform: scale(1.04); }
  .opt.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .opt.big { font-size: 22px; } .opt .em { font-size: 44px; line-height: 1.1; }
  .slots { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .slot { background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .slot b { font-size: clamp(16px, 2vw, 24px); min-height: 34px; display: block; }
  .slot .btn { min-height: 48px; font-size: 18px; }
  .slot.spin b { color: #ff3d6e; }
  #invHelp { font-size: 15px; text-align: center; color: #555; }
  /* toppings dropping in, scoops plopping on */
  #boxPrev svg g.drop { animation: drop .55s cubic-bezier(.3,.1,.5,1.4) both; }
  #boxPrev svg g.plop { animation: plop .45s ease-out both; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes drop { from { transform: translateY(-260px); opacity: .3; } to { transform: translateY(0); opacity: 1; } }
  @keyframes plop { from { transform: translateY(-120px) scale(.6, 1.2); } 70% { transform: translateY(6px) scale(1.12, .85); } to { transform: translateY(0) scale(1, 1); } }
  #orderUp { position: fixed; inset: 0; z-index: 55; display: none; align-items: center; justify-content: center; pointer-events: none; }
  #orderUp.on { display: flex; }
  #orderUp b { font-size: clamp(54px, 11vw, 130px); color: #fff; -webkit-text-stroke: 4px #333; text-shadow: 6px 6px 0 #ff4fa3; animation: pop .6s ease-out both; transform: rotate(-6deg); }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ff4fa3; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #ff4fa3; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #ff4fa3; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 📺 TV commercial ---------- */
  #tv { position: fixed; inset: 0; z-index: 50; background: #222; display: none; align-items: center; justify-content: center; padding: 12px; }
  #tv.on { display: flex; }
  #tvSet { position: relative; width: min(96vw, 150vh); aspect-ratio: 16 / 10; max-height: 96vh; background: #ff8fc0; border: 8px solid #111; border-radius: 34px; padding: 3%; box-shadow: 0 10px 0 #111; }
  #tvScreen { position: relative; width: 100%; height: 100%; border-radius: 26px; overflow: hidden; border: 6px solid #111; background: #4fc3f7; }
  #tvScreen svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #tvSay { position: absolute; left: 4%; right: 4%; bottom: 4%; background: rgba(255,255,255,.93); border: 4px solid #333; border-radius: 18px;
    font-size: clamp(18px, 3vw, 34px); font-weight: bold; text-align: center; padding: 6px 10px; }
  #tvStop { position: absolute; top: 2%; right: 2%; z-index: 2; }
  #tvArt svg g.bnc { animation: bnc .55s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #tvArt svg g.wig { animation: wig .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #tvArt svg g.flt { animation: flt 2.4s linear infinite; }
  #tvArt svg g.spn { animation: spn 9s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg g.pop { animation: pop .5s ease-out both; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg g.mlt { animation: mlt 1.2s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bnc { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-26px) scale(1.03, .97); } }
  @keyframes wig { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes flt { from { transform: translateY(-80px); } to { transform: translateY(620px); } }
  @keyframes spn { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }
  @keyframes mlt { from { transform: scale(1, 1); } to { transform: scale(1.06, .9); } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #inv, #view { flex-direction: column; }
    #invLeft { width: 100%; height: 48vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
  }
  @media (max-height: 600px) { .btn { min-height: 44px; font-size: 16px; padding: 4px; } #pHelp { font-size: 15px; } .opt svg { width: 50px; height: 50px; }
    #ticket .tk-pic { width: 50px; height: 66px; } #ticket ul { font-size: 13px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #tv { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="inv" class="screen on">
  <div id="invLeft">
    <div id="ticket"></div>
    <div id="boxPrev"></div>
    <div id="invName"></div>
    <div class="two" id="labBtns">
      <button class="btn b-tv" id="bTV">📺 Commercial!</button>
      <button class="btn b-print" id="bPrints">🖨️ Printables</button>
      <button class="btn b-shop" id="bShop">🏪 Open my shop!</button>
      <button class="btn b-menu" id="bMenu">⭐ Add to my menu</button>
    </div>
    <div class="three hide" id="shopBtns">
      <button class="btn b-bell" id="bOrderUp">🔔 Order up!</button>
      <button class="btn b-next" id="bNext">👋 Next!</button>
      <button class="btn b-back" id="bCloseShop">🚪 Close shop</button>
    </div>
  </div>
  <div id="invRight">
    <div id="cats"></div>
    <div id="opts"></div>
    <div id="invHelp"></div>
  </div>
</div>
<div id="gallery" class="screen">
  <div id="gHead">
    <button class="btn b-back" id="bGBack">⬅️ Flavor Lab</button>
    <p>🖨️ Pick a page to print! A grown-up does all the cutting. ✂️</p>
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color<br>(my design)</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>
    </div>
    <div id="pHelp"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="tv"><div id="tvSet"><div id="tvScreen"><div id="tvArt"></div><div id="tvSay"></div></div>
  <button class="btn b-back" id="tvStop">⏹️ Stop</button></div></div>
<div id="orderUp"><b>ORDER UP! 🔔</b></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🍦 ICE CREAM FLAVOR LAB: invent a crazy ice cream (base, mix-ins, swirl, cone or cup, 1-3 scoops, slot-machine name),
// watch its TV commercial, run a pretend shop (family members order, Ben builds it, "Order up!"),
// then print a fold-up cup, a cone, a pint carton, a menu board, order slips, a poster and a certificate.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from the Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';

const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function notePrinted() { state.printed++; saveState(); checkTrophy('You printed your ice cream!'); }
function printSheet() {
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); renderSheet(true); notePrinted(); doPrint(() => renderSheet());
}
function printColors() {
  if (view !== 'sheet') openSheet(sel);
  if (!isLine()) setMode('line');
  endPrintAll(); renderSheet();
  const img = traceImage(), svg = $('svgBox').querySelector('svg');
  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }
  notePrinted(); doPrint(() => renderSheet());
}
function printAll() {
  $('printAll').innerHTML = SHEETS.map((p, i) => buildSheet(i, !!p.blank || state.mode === 'line')).join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + SHEETS.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, C = commercial)
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, C = commercial, S = shop)
// =====================================================================
function onKey(e) {
  const k = e.key;
  if (tvOn()) { if (k === 'Escape' || k === 'Enter' || k === ' ' || k === 'Backspace') { stopTV(); e.preventDefault(); } return; }
  if (view === 'inv') {
    const N = cats().length;
    if ((k === 'ArrowUp' || k === 'ArrowDown') && !picking()) { catI = (catI + (k === 'ArrowDown' ? 1 : N - 1)) % N; renderCats(); renderOpts(); blip(520, 0, .06); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight' || (picking() && (k === 'ArrowUp' || k === 'ArrowDown'))) nudge(k === 'ArrowRight' || k === 'ArrowDown' ? 1 : -1);
    else if (k === ' ') { if (picking()) takeOrder(CUSTOMERS[custCur][0]); else if (catId() === 'mix') toggleMix(MIXINS[mixCur][0]); else if (!shop.on) spinName(); }
    else if (k === 'Enter') { if (picking()) takeOrder(CUSTOMERS[custCur][0]); else if (shop.on) orderUp(); else openGallery(); }
    else if (k === 'Escape' || k === 'Backspace') { if (shop.on) closeShop(); else return; }
    else if (k === 'c' || k === 'C') startTV();
    else if (k === 's' || k === 'S') { if (shop.on) closeShop(); else openShop(); }
    else if ((k === 'p' || k === 'P') && !shop.on) { sel = 0; openSheet(0); printSheet(); }
    else return;
    e.preventDefault();
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToInventor(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {
  loadState();
  renderAll(); renderPens();
  const cv = $('trace');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bTV').addEventListener('click', startTV);
  $('tvStop').addEventListener('click', () => stopTV());
  $('bPrints').addEventListener('click', openGallery);
  $('bShop').addEventListener('click', openShop);
  $('bMenu').addEventListener('click', addToMenu);
  $('bOrderUp').addEventListener('click', orderUp);
  $('bNext').addEventListener('click', () => { shop.who = null; shop.order = null; shop.cone = freshCone(); renderAll(); blip(660); say('Next customer, please!'); });
  $('bCloseShop').addEventListener('click', closeShop);
  $('bGBack').addEventListener('click', backToInventor);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
