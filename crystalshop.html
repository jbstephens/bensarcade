<!DOCTYPE html>
<html lang="en">
<head>

<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: #0d1440; font-family: "Trebuchet MS", Arial, sans-serif; overflow: hidden; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  button { font-family: inherit; cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  #site { position: fixed; inset: 6px; display: flex; flex-direction: column; background: #f2f0ff; border-radius: 14px; overflow: hidden; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  /* pretend web browser bar */
  #browser { display: flex; align-items: center; gap: 10px; padding: 6px 12px; background: #dcdcec; border-bottom: 2px solid #c0c3dd; flex: none; }
  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }
  #url { flex: 1; background: #fff; border-radius: 20px; padding: 5px 16px; font-size: 17px; color: #333; white-space: nowrap; overflow: hidden; }
  #url b { color: #e65100; }
  /* store header */
  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #1a237e, #4527a0 50%, #ff6f00); color: #fff; flex: none; min-height: 96px; }
  #logo { line-height: 1; }
  #logo .big { font-size: 27px; font-weight: 900; letter-spacing: 1px; text-shadow: 0 3px 0 #0d1440; }
  #logo .big i { color: #ffd740; font-style: normal; }
  #logo .small { font-size: 15px; color: #ffe0b2; margin-top: 4px; }
  #helper { width: 104px; height: 104px; flex: none; }
  #bubble { position: relative; flex: 1; background: #fff; color: #0d1440; border-radius: 18px; padding: 8px 14px; font-size: 19px; font-weight: bold; min-height: 54px; display: flex; align-items: center; border: 3px solid #ffc400; }

  .tag.gold { background: #ffc400; color: #4e2600; }

  .cats { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
  .catb { font-size: 18px; font-weight: 900; border: 0; border-radius: 14px; padding: 10px 14px; background: #fff; color: #1a237e; box-shadow: 0 4px 0 #9fa8da; }
  .catb span { display: inline-block; min-width: 24px; border-radius: 12px; background: #e8eaf6; color: #4527a0; font-size: 14px; padding: 1px 6px; margin-left: 2px; }
  .catb.on { background: #4527a0; color: #fff; box-shadow: 0 4px 0 #1a237e; } .catb.on span { background: #fff; }
  .rev { font-size: 14px; background: #eef0fd; border-radius: 10px; padding: 5px 8px; margin: 4px 0; color: #333; min-height: 44px; }
  .rev .who { font-weight: bold; color: #4527a0; }
  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #e8eaf6; box-shadow: 0 4px 0 #9fa8da; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(26,35,126,.15); }

  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #1a237e; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }
  .empty { text-align: center; font-size: 26px; color: #4527a0; padding: 30px 10px; }
  .h2 { font-size: 28px; font-weight: 900; color: #1a237e; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(13,20,64,.92); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship canvas { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }
  #ship .bigbtn { margin-top: 14px; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(13,20,64,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8eaf6; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #e8eaf6; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #4527a0; }
  #printBox .pbTip { font-size: 20px; color: #1a237e; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>

<script>
// 💎 KING ELEMENT ROBO'S CRYSTAL SHOP: an online store like Robo 2.0's (Ben's idea). Buy paper crystal stuff with
// pretend 💎 Crystals, then pick which orders to PRINT. Nothing prints by itself.
// Save: localStorage.crystalShop = { bucks, cart:[keys], gift, orders:[{k, gift, n}], printed, n }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'crystalShop';
let S = { bucks: 1000, cart: [], gift: false, orders: [], printed: 0, n: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!(S.bucks >= 0)) S.bucks = 1000;
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (_) {} }
</script>
<script>
// ---------- 🎨 drawing helpers (ctx can point at any canvas) ----------
let ctx = null, OUT = false, F = 0;                 // OUT = coloring-book mode (white fills + black lines); F = animation frame
const FONT = '"Trebuchet MS", Arial, sans-serif';
function fillOf(c) { return OUT ? '#fff' : c; }
function rr(x, y, w, h, r, fill, stroke, lw) {
  r = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
function circ(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
function ell(x, y, rx, ry, fill, rot = 0, stroke, lw) {
  ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.stroke(); }
}
function poly(pts, fill, stroke, lw) {
  ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1])); ctx.closePath();
  if (fill) { ctx.fillStyle = fillOf(fill); ctx.fill(); }
  if (stroke || OUT) { ctx.strokeStyle = OUT ? '#222' : stroke; ctx.lineWidth = OUT ? 4 : (lw || 2); ctx.lineJoin = 'round'; ctx.stroke(); }
}
function pathFill(col) { ctx.fillStyle = fillOf(col); ctx.fill(); if (OUT) { ctx.strokeStyle = '#222'; ctx.lineWidth = 4; ctx.lineJoin = 'round'; ctx.stroke(); } }
function txt(s, x, y, size, color = '#222', align = 'center', bold = true, maxW) {
  ctx.font = `${bold ? 'bold ' : ''}${size}px ${FONT}`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color;
  if (maxW) { let sz = size; while (sz > 8 && ctx.measureText(s).width > maxW) { sz--; ctx.font = `${bold ? 'bold ' : ''}${sz}px ${FONT}`; } }
  ctx.fillText(s, x, y);
}
function wrapTxt(s, x, y, size, maxW, color = '#222', align = 'center', lineH) {
  ctx.font = `bold ${size}px ${FONT}`; const words = String(s).split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); lineH = lineH || size * 1.2;
  lines.forEach((l, i) => txt(l, x, y + (i - (lines.length - 1) / 2) * lineH, size, color, align));
  return lines.length;
}
function star(x, y, r, fill, stroke, rot = 0) {
  const p = []; for (let i = 0; i < 10; i++) { const a = rot - Math.PI / 2 + i * Math.PI / 5, r2 = i % 2 ? r * 0.45 : r; p.push([x + Math.cos(a) * r2, y + Math.sin(a) * r2]); }
  poly(p, fill, stroke, 2);
}
function sparkle(x, y, r, col) { poly([[x, y - r], [x + r * 0.25, y - r * 0.25], [x + r, y], [x + r * 0.25, y + r * 0.25], [x, y + r], [x - r * 0.25, y + r * 0.25], [x - r, y], [x - r * 0.25, y - r * 0.25]], col); }
function shade(hex, k) {                              // k < 0 darker, k > 0 lighter
  const n = parseInt(hex.slice(1), 16), f = c => Math.max(0, Math.min(255, Math.round(k < 0 ? c * (1 + k) : c + (255 - c) * k)));
  return '#' + [n >> 16 & 255, n >> 8 & 255, n & 255].map(f).map(v => v.toString(16).padStart(2, '0')).join('');
}
// ---------- ⚡ the six ELEMENTS (same names + colors as Robo Jump 10) ----------
const EL = {
  fire:  { name: 'FIRE', col: '#ff6d00', col2: '#ffd740', guard: 'Blaze' },
  water: { name: 'WATER', col: '#2196f3', col2: '#80d8ff', guard: 'Tide' },
  wind:  { name: 'WIND', col: '#26c6da', col2: '#e0f7fa', guard: 'Gale' },
  earth: { name: 'EARTH', col: '#8d6e63', col2: '#ffcc80', guard: 'Rumble' },
  ice:   { name: 'ICE', col: '#81d4fa', col2: '#ffffff', guard: 'Frost' },
  bolt:  { name: 'LIGHTNING', col: '#ffea00', col2: '#fff59d', guard: 'Volt' },
};
const ELS = ['fire', 'water', 'wind', 'earth', 'ice', 'bolt'];
const RAINBOW7 = ['#ff1744', '#ff9100', '#ffea00', '#00e676', '#2979ff', '#651fff', '#d500f9'];
const ELINK = { fire: '#bf360c', water: '#0d47a1', wind: '#00838f', earth: '#4e342e', ice: '#0277bd', bolt: '#f57f17' };   // dark ink for each element
// element symbols drawn with shapes (no emoji on paper): r = size
function elIcon(el, x, y, r, ink) {
  const E = EL[el], dk = ink || ELINK[el];
  ctx.save(); ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  if (el === 'fire') {
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.bezierCurveTo(x + r * 0.9, y - r * 0.2, x + r * 0.8, y + r * 0.9, x, y + r * 0.9); ctx.bezierCurveTo(x - r * 0.8, y + r * 0.9, x - r * 0.9, y - r * 0.1, x - r * 0.25, y - r * 0.45);
    ctx.quadraticCurveTo(x - r * 0.15, y - r * 0.05, x + r * 0.05, y - r * 0.15); ctx.quadraticCurveTo(x + r * 0.15, y - r * 0.6, x, y - r); ctx.closePath(); pathFill(E.col);
    ctx.beginPath(); ctx.moveTo(x, y - r * 0.15); ctx.bezierCurveTo(x + r * 0.5, y + r * 0.25, x + r * 0.4, y + r * 0.8, x, y + r * 0.8); ctx.bezierCurveTo(x - r * 0.4, y + r * 0.8, x - r * 0.45, y + r * 0.3, x, y - r * 0.15); pathFill(E.col2);
  } else if (el === 'water') {
    ctx.beginPath(); ctx.moveTo(x, y - r); ctx.bezierCurveTo(x + r * 0.35, y - r * 0.4, x + r * 0.75, y, x + r * 0.75, y + r * 0.3); ctx.arc(x, y + r * 0.3, r * 0.75, 0, Math.PI); ctx.bezierCurveTo(x - r * 0.75, y, x - r * 0.35, y - r * 0.4, x, y - r); pathFill(E.col);
    ell(x - r * 0.3, y + r * 0.25, r * 0.13, r * 0.25, '#e3f2fd', 0.3);
  } else if (el === 'wind') {
    ctx.strokeStyle = OUT ? '#222' : E.col; ctx.lineWidth = Math.max(2, r * 0.22);
    ctx.beginPath(); ctx.moveTo(x - r, y - r * 0.4); ctx.lineTo(x + r * 0.35, y - r * 0.4); ctx.arc(x + r * 0.35, y - r * 0.7, r * 0.3, Math.PI / 2, -Math.PI * 0.9, true); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r, y + r * 0.05); ctx.lineTo(x + r * 0.6, y + r * 0.05); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x - r * 0.8, y + r * 0.5); ctx.lineTo(x + r * 0.15, y + r * 0.5); ctx.arc(x + r * 0.15, y + r * 0.78, r * 0.28, -Math.PI / 2, Math.PI * 0.9); ctx.stroke();
  } else if (el === 'earth') {
    poly([[x - r * 0.95, y + r * 0.75], [x - r * 0.6, y - r * 0.2], [x - r * 0.15, y - r * 0.55], [x + r * 0.45, y - r * 0.4], [x + r * 0.95, y + r * 0.2], [x + r * 0.8, y + r * 0.75]], E.col, OUT ? null : dk, Math.max(1.5, r * 0.08));
    poly([[x - r * 0.15, y - r * 0.55], [x + r * 0.45, y - r * 0.4], [x + r * 0.2, y + r * 0.05], [x - r * 0.35, y - r * 0.05]], E.col2);
  } else if (el === 'ice') {
    ctx.strokeStyle = OUT ? '#222' : '#29b6f6'; ctx.lineWidth = Math.max(2, r * 0.16);
    for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3 + Math.PI / 2, c = Math.cos(a) * r, s = Math.sin(a) * r; ctx.beginPath(); ctx.moveTo(x - c, y - s); ctx.lineTo(x + c, y + s); ctx.stroke();
      for (const d of [1, -1]) { const bx = x + c * 0.6 * d, by = y + s * 0.6 * d; for (const t of [0.5, -0.5]) { ctx.beginPath(); ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a + t + (d < 0 ? Math.PI : 0)) * r * 0.32, by + Math.sin(a + t + (d < 0 ? Math.PI : 0)) * r * 0.32); ctx.stroke(); } } }
  } else {
    poly([[x + r * 0.2, y - r], [x - r * 0.6, y + r * 0.15], [x - r * 0.05, y + r * 0.15], [x - r * 0.25, y + r], [x + r * 0.65, y - r * 0.2], [x + r * 0.1, y - r * 0.2]], E.col, OUT ? null : '#f9a825', Math.max(1.5, r * 0.08));
  }
  ctx.restore();
}
// a faceted gem (drawing, not a net): x,y = middle, r = size
function gem(x, y, r, col, out) {

  let n = [-(B[1] - A[1]) / L, (B[0] - A[0]) / L]; if (n[0] * (M[0] - away[0]) + n[1] * (M[1] - away[1]) < 0) n = [-n[0], -n[1]];

function fanPts(cx, cy, n, a, s, a0) {                // n triangles around an apex (base a, legs s)

function octaNet(a, cols, decoFn) {

function coneNet(n, a, s, a0, cols, eqTabs) {

function pyrNet(g, sg, cols) {

// a 6-sided QUARTZ crystal: 6 side panels + 6 pointy caps on top and 6 on the bottom
function prismNet(n, a, H, s, cols) {
