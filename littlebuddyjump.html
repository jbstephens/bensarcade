<script>
// =====================================================================
// 🐰🌈 BEAN'S RAINBOW HOP: a surprise platformer made by Claude for Ben's little brother (Little Buddy)!
// Bean is a squishy pink jelly-bean bunny. Grumble Cloud took the rainbow's colors, so Bean hops through
// 6 short lands to find the 6 Color Drops, then bounces on Grumble Cloud until he giggles and becomes a friend.
// SUPER forgiving: 5 hearts, lots of flags, water just bubbles you back, slow enemies, every drop warned with a big "!".
// =====================================================================
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'littleBuddyJump';
let SAVE = { unlocked: 1, stars: [], won: false, story: false, music: true };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || '{}') || {}; Object.assign(SAVE, s); } catch (_) {}
SAVE.unlocked = Math.max(1, Math.min(7, SAVE.unlocked | 0 || 1)); if (!Array.isArray(SAVE.stars)) SAVE.stars = [];
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (_) {} }

const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, ROWS = 13;
const GRAV = 0.5, SPEED = 3.6, JUMP = 12.2, MAXFALL = 9;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const rnd = (a, b) => a + Math.random() * (b - a);
let frame = 0;

// =====================================================================
// 🔊 SOUND: one quiet master knob (never above 0.15), soft round notes, everything fades in and out.
// =====================================================================
let actx = null, master = null;
function audio() {

    if (!actx) {
      actx = (window.JUKEBOX && window.JUKEBOX.makeCtx && window.JUKEBOX.makeCtx()) || new (window.AudioContext || window.webkitAudioContext)();
      const comp = actx.createDynamicsCompressor(); comp.threshold.value = -24; comp.ratio.value = 6;
      master = actx.createGain(); master.gain.value = 0.0001; comp.connect(master); master.connect(actx.destination);
      master.gain.setTargetAtTime(0.15, actx.currentTime, 0.4); master.inp = comp;

  } catch (_) {}

}
function softNote(f, d = 0.3, v = 0.25, when = 0, type = 'sine', glide) {
  if (!audio() || !master || actx.state !== 'running') return;
  try {
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (glide) o.frequency.exponentialRampToValueAtTime(glide, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(Math.min(v, 0.4), t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(master.inp); o.start(t); o.stop(t + d + 0.05);

}
const mf = m => 440 * Math.pow(2, (m - 69) / 12);
const sfx = {
  jump() { softNote(420, 0.18, 0.18, 0, 'sine', 760); },
  star() { softNote(mf(84), 0.25, 0.16); softNote(mf(88), 0.35, 0.14, 0.07); },
  boing() { softNote(260, 0.3, 0.22, 0, 'triangle', 620); },
  hurt() { softNote(520, 0.35, 0.16, 0, 'triangle', 300); },
  flag() { [72, 76, 79, 84].forEach((m, i) => softNote(mf(m), 0.3, 0.15, i * 0.08, 'triangle')); },
  bubble() { for (let i = 0; i < 4; i++) softNote(rnd(500, 800), 0.12, 0.1, i * 0.09, 'sine', rnd(900, 1200)); },
  balloon() { [67, 71, 74, 79, 83].forEach((m, i) => softNote(mf(m), 0.25, 0.13, i * 0.06)); },
  drop() { [72, 76, 79, 84, 88, 91].forEach((m, i) => softNote(mf(m), 0.4, 0.14, i * 0.09, 'triangle')); },
  warn() { softNote(mf(81), 0.15, 0.1); softNote(mf(81), 0.15, 0.1, 0.2); },
  plop() { softNote(300, 0.15, 0.12, 0, 'sine', 180); },
  giggle() { [79, 83, 79, 84, 81, 86].forEach((m, i) => softNote(mf(m), 0.12, 0.14, i * 0.08, 'triangle')); },
  click() { softNote(660, 0.1, 0.12); },
};

// =====================================================================
// 🎵 MUSIC: 3 happy songs. Melody = 8 eighth notes per bar (0 = rest). Beats 1 and 3 always land on a chord note.
// =====================================================================
const SONGS = {
  hop: { name: 'Bean\'s Hoppy Day', bpm: 120, loop: true,
    chords: [[60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62], [60, 64, 67], [57, 60, 64], [53, 57, 60], [55, 59, 62]],
    mel: [[72, 0, 76, 0, 79, 76, 74, 76], [76, 0, 72, 0, 69, 72, 76, 0], [77, 0, 76, 74, 72, 0, 69, 0], [74, 0, 71, 0, 67, 0, 0, 0],
          [72, 74, 76, 0, 79, 0, 81, 79], [81, 0, 79, 76, 76, 0, 72, 0], [77, 76, 74, 0, 72, 0, 74, 0], [74, 0, 71, 0, 79, 0, 0, 0]] },
  grumble: { name: 'Grumble Cloud\'s Bounce', bpm: 128, loop: true,
    chords: [[55, 59, 62], [52, 55, 59], [48, 52, 55], [50, 54, 57], [55, 59, 62], [52, 55, 59], [48, 52, 55], [50, 54, 57]],
    mel: [[67, 0, 71, 71, 74, 0, 71, 0], [76, 0, 74, 0, 71, 0, 67, 0], [72, 0, 76, 0, 79, 76, 72, 0], [74, 0, 78, 0, 81, 0, 78, 0],
          [79, 0, 74, 0, 71, 0, 74, 0], [71, 0, 76, 0, 79, 0, 76, 0], [76, 74, 72, 0, 67, 0, 72, 0], [74, 0, 0, 66, 69, 0, 74, 0]] },
  yay: { name: 'Rainbow Hooray', bpm: 112, loop: true,
    chords: [[53, 57, 60], [48, 52, 55], [50, 53, 57], [46, 50, 53], [53, 57, 60], [48, 52, 55], [46, 50, 53], [53, 57, 60]],
    mel: [[72, 0, 69, 72, 77, 0, 76, 77], [79, 0, 76, 0, 72, 0, 76, 0], [77, 0, 74, 0, 69, 0, 72, 74], [74, 0, 77, 0, 82, 0, 81, 79],
          [81, 0, 77, 0, 72, 0, 77, 0], [79, 0, 76, 0, 79, 0, 84, 0], [82, 81, 79, 77, 74, 0, 77, 0], [77, 0, 0, 0, 72, 0, 0, 0]] },
};
function songEvents(S) {
  const ev = [];
  S.chords.forEach((ch, b) => {
    const at = b * 4;
    S.mel[b].forEach((m, i) => { if (m) ev.push({ b: at + i / 2, m, d: 0.32, v: 0.16, w: 'triangle' }); });
    ev.push({ b: at, m: ch[0] - 12, d: 0.5, v: 0.14, w: 'sine' }); ev.push({ b: at + 2, m: ch[0] - 12, d: 0.5, v: 0.12, w: 'sine' });
    for (const k of [1, 3]) for (const n of ch) ev.push({ b: at + k, m: n, d: 0.25, v: 0.035, w: 'sine' });
  });
  S.total = S.chords.length * 4; S.beat = 60 / S.bpm;
  return ev.sort((a, c) => a.b - c.b);
}
for (const k in SONGS) SONGS[k].ev = songEvents(SONGS[k]);
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || decodeURIComponent((/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '');
const mus = { id: null, t0: null, k: 0, loop: 0, last: 0, gain: null, timer: null, on: SAVE.music !== false };
function musicTick() {
  if (!mus.id || !actx || actx.state !== 'running' || !mus.gain) { mus.t0 = null; return; }
  const S = SONGS[mus.id], now = actx.currentTime;
  if (mus.t0 === null || now - mus.last > 1) { mus.t0 = now + 0.15; mus.k = 0; mus.loop = 0; }
  mus.last = now;
  for (let guard = 0; guard < 300; guard++) {
    const e = S.ev[mus.k], t = mus.t0 + (mus.loop * S.total + e.b) * S.beat;
    if (t > now + 0.5) break;
    if (t >= now - 0.02) {
      try {
        const o = actx.createOscillator(), g = actx.createGain();
        o.type = e.w; o.frequency.setValueAtTime(mf(e.m), t);
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(e.v, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + e.d);
        o.connect(g); g.connect(mus.gain); o.start(t); o.stop(t + e.d + 0.05);
      } catch (_) {}
    }
    if (++mus.k >= S.ev.length) { mus.k = 0; mus.loop++; }
  }
}
function playSong(id) {
  if (!mus.on || !audio() || !master) { mus.want = id; return; }
  mus.want = id; if (mus.id === id && mus.gain) return;
  stopSong(); mus.want = id;
  mus.gain = actx.createGain(); mus.gain.gain.value = 0.0001; mus.gain.connect(master.inp);
  mus.gain.gain.setTargetAtTime(0.6, actx.currentTime, 0.5);
  mus.id = id; mus.t0 = null;
  if (!mus.timer) mus.timer = setInterval(musicTick, 90);
  musicTick();
}
function stopSong() {
  if (mus.gain) { const g = mus.gain; try { g.gain.setTargetAtTime(0.0001, actx.currentTime, 0.15); } catch (_) {} setTimeout(() => { try { g.disconnect(); } catch (_) {} }, 900); }
  mus.gain = null; mus.id = null;
}
function toggleMusic() { mus.on = !mus.on; SAVE.music = mus.on; save(); if (mus.on) playSong(mus.want || 'hop'); else stopSong(); }
</script>
<script>
// =====================================================================
// 🗣️ A gentle voice reads the story and big moments out loud
// =====================================================================
let woke = false;
function speak(str) {
  if (!woke || !str || window.JUKEBOX) return;
  try {
    const s = window.speechSynthesis; if (!s || !window.SpeechSynthesisUtterance) return;
    s.cancel(); const u = new SpeechSynthesisUtterance(str.replace(/[^\w\s!?.,']/g, '')); u.rate = 0.88; u.pitch = 1.2; u.volume = 0.8; s.speak(u);
  } catch (_) {}
}
function hush() { try { window.speechSynthesis && speechSynthesis.cancel(); } catch (_) {} }

// =====================================================================
// 🌈 THE SIX LANDS + Grumble Cloud's sky.  Level recipe tokens (left to right):
//  Fn flat ground n columns | Un / Dn step up / down | Hn water n columns (a bubble floats you back)
//  *n n stars in a little arc | Pn@k one-way platform n long, k tiles above the ground (with stars) | e snail-ish walker | b slow hopper
//  C checkpoint flag | B balloon | S bouncy mushroom | d something drops here (always a big "!" first) | R Robo cheering | G the Color Drop goal
// =====================================================================
const LANDS = [
  { name: 'Gumdrop Meadow', icon: '🌷', drop: '#ff5c7a', dropName: 'RED', sky: ['#7fd3ff', '#d9f4ff'], hill: '#8be08b', hill2: '#5cc46a', grass: '#4cd964', dirt: '#b77b4f', foe: 'snail', fall: 'acorn',
    src: 'F7 *3 F5 e F7 U1 F5 *3 F4 C F3 D1 F4 e F6 P3@3 F7 *4 F5 C U1 F4 U1 F6 b F6 D2 F5 *3 F4 R F4 G F8' },
  { name: 'Lollipop Woods', icon: '🍭', drop: '#ff9f43', dropName: 'ORANGE', sky: ['#ffb8e1', '#fff0f8'], hill: '#c88cff', hill2: '#a46ae0', grass: '#ff7eb6', dirt: '#9c5a8a', foe: 'snail', fall: 'acorn',
    src: 'F6 *3 F4 S F5 P4@4 F6 e F5 C F3 H2 F5 *3 F4 U1 F4 b F5 S F3 U2 F5 C F4 *4 F5 e F6 D1 F3 H2 F4 D2 F3 *3 F5 C F4 e F6 R F4 G F8' },
  { name: 'Bubble Beach', icon: '🏖️', drop: '#ffe14d', dropName: 'YELLOW', sky: ['#5fd0ff', '#c9f6ff'], hill: '#7fe0d0', hill2: '#4cc7b8', grass: '#ffe7a3', dirt: '#e2b56b', foe: 'crab', fall: 'coconut',
    src: 'F6 *3 F4 e F4 H2 F5 B F4 H3 F5 C F4 *3 F3 e F5 H2 F3 P3@3 F4 H2 F5 C F4 b F5 U1 F4 H3 F5 *4 F4 D1 F5 e F4 C F5 R F4 G F8' },
  { name: 'Sprinkle Snow Hills', icon: '❄️', drop: '#4cdb7a', dropName: 'GREEN', sky: ['#8fb8ff', '#e3eeff'], hill: '#dfeaff', hill2: '#c4d6f7', grass: '#ffffff', dirt: '#8fb3e8', foe: 'penguin', fall: 'snowball',
    src: 'F6 *3 F5 d F5 e F5 C F3 U1 F4 d F5 *3 F4 H2 F5 b F5 C F4 d F3 d F5 P3@3 F5 U1 F5 e F5 C D2 F4 d F5 *4 F4 R F4 G F8' },
  { name: 'Twinkle Night', icon: '🌙', drop: '#4ca8ff', dropName: 'BLUE', sky: ['#1d2a6b', '#4a3f9c'], hill: '#3b3f8f', hill2: '#2c2f73', grass: '#7c6cff', dirt: '#3d2f7a', foe: 'snail', fall: 'pinecone', night: true,
    src: 'F6 *3 F4 P3@3 F5 e F5 S F4 P4@5 F6 C F3 H2 F4 d F5 b F5 U1 F4 *3 F4 C H2 F5 e F5 d F4 D1 F4 B F5 H3 F4 C F4 *4 F5 e F5 R F4 G F8' },
  { name: 'Cloud Castle', icon: '☁️', drop: '#b06cff', dropName: 'PURPLE', sky: ['#7cc4ff', '#ffe9fb'], hill: '#e6dcff', hill2: '#cdbff5', grass: '#ffffff', dirt: '#b9a6f0', foe: 'puff', fall: 'raindrop',
    src: 'F6 *3 F4 b F5 H2 F4 d F5 C F3 P3@3 F4 U1 F5 e F4 H2 F5 *3 F4 C F4 d F4 b F5 S F4 P4@4 F6 C D1 F4 H3 F5 e F5 d F5 C F4 *4 F5 R F4 G F8' },
  { name: 'Grumble Cloud', icon: '🌧️', drop: '#ffffff', dropName: 'RAINBOW', sky: ['#8e9bb5', '#d7deea'], hill: '#b9c3d6', hill2: '#9faabf', grass: '#a6e36b', dirt: '#8a6a52', foe: 'snail', fall: 'raindrop', boss: true,
    src: 'F4 S F15 S F5' },
];
const RAINBOW = ['#ff5c7a', '#ff9f43', '#ffe14d', '#4cdb7a', '#4ca8ff', '#b06cff'];

let L = null, ground = [], plats = new Set(), cols = 0;
let stars = [], foes = [], flags = [], springs = [], drips = [], balloons = [], robo = null, goal = null;
function build(i) {
  L = LANDS[i]; ground = []; plats = new Set(); stars = []; foes = []; flags = []; springs = []; drips = []; balloons = []; robo = null; goal = null;
  let x = 0, h = 2;
  const topY = () => (ROWS - h) * T;
  for (const tok of L.src.trim().split(/\s+/)) {
    const c = tok[0], n = parseInt(tok.slice(1)) || 1;
    if (c === 'F') for (let k = 0; k < n; k++) ground[x++] = h;
    else if (c === 'H') for (let k = 0; k < n; k++) ground[x++] = 0;
    else if (c === 'U') h += n;
    else if (c === 'D') h -= n;
    else if (c === '*') for (let k = 0; k < n; k++) stars.push({ x: (x + k) * T + T / 2, y: topY() - 50 - Math.sin((k + 0.5) / n * Math.PI) * 40, got: false });
    else if (c === 'P') {
      const len = parseInt(tok.slice(1)), up = parseInt(tok.split('@')[1]), row = ROWS - h - up;
      for (let k = 0; k < len; k++) { plats.add(row * 1000 + x + k); stars.push({ x: (x + k) * T + T / 2, y: row * T - 30, got: false }); }
    }
    else if (c === 'e' || c === 'b') foes.push({ kind: c === 'b' ? 'hop' : 'walk', x: x * T + 4, y: topY() - 34, w: 34, h: 34, vx: c === 'b' ? 0.5 : -0.45, vy: 0, t: rnd(0, 100), dead: 0, face: -1 });
    else if (c === 'C') flags.push({ x: x * T + T / 2, y: topY(), on: false, t: 0 });
    else if (c === 'B') balloons.push({ x: x * T + T / 2, y: topY() - 80, got: false });
    else if (c === 'S') springs.push({ x: x * T + 2, y: topY() - 22, w: 36, h: 22, sq: 0 });
    else if (c === 'd') drips.push({ x: x * T + T / 2, gy: topY(), t: 40 + drips.length * 37, phase: 'wait', y: -40, vy: 0 });

function gTop(c) { return (c < 0 || c >= cols) ? -9999 : ground[c] ? (ROWS - ground[c]) * T : 99999; }

</script>
<script>
// =====================================================================
// 🎮 STATE + INPUT  (arrows / A D walk, SPACE / ↑ / W jump, Enter = OK, Esc = back, M = music)
// =====================================================================
let state = 'title', stateT = 0, lvl = 0, camX = 0, gotStars = 0, totalStars = 0, storyPage = 0, mapSel = Math.min(6, SAVE.unlocked - 1), fade = 0, msg = null;
const keys = { left: false, right: false, jump: false };
let jumpPressed = false, okPressed = false;
const P = { x: 0, y: 0, w: 30, h: 38, vx: 0, vy: 0, on: false, face: 1, coyote: 0, jbuf: 0, hearts: 5, inv: 0, balloon: 0, bubble: null, safeX: 0, safeY: 0, cpX: 0, cpY: 0, sq: 0, walkT: 0, oops: 0 };
const MAX_HEARTS = 5;
let parts = [], pops = [];
function setState(s) { state = s; stateT = 0; }
addEventListener('keydown', e => {
  woke = true; audio(); if (!mus.id && mus.on && mus.want) playSong(mus.want);
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { if (!keys.left) menuMove(-1); keys.left = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { if (!keys.right) menuMove(1); keys.right = true; }
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') { if (!keys.jump) { jumpPressed = true; okPressed = true; } keys.jump = true; e.preventDefault && e.preventDefault(); }
  if (k === 'ArrowDown' && e.preventDefault) e.preventDefault();
  if (k === 'Enter' && !e.repeat) okPressed = true;
  if (k === 'm' || k === 'M') toggleMusic();
  if (k === 'Escape') goBack();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
});
addEventListener('blur', () => { keys.left = keys.right = keys.jump = false; });
function menuMove(d) {

  else if (state === 'story' && d < 0 && storyPage > 0) { storyPage--; stateT = 0; tellStory(); }
}
function goBack() {
  hush();
  if (state === 'play' || state === 'done' || state === 'win') goMap();

}
// big taps / clicks on the canvas (touchpad.js turns finger taps into mouse events)
const BTN = { play: { x: W / 2 - 150, y: 360, w: 300, h: 84 }, go: { x: W / 2 - 140, y: 420, w: 280, h: 74 }, back: { x: 12, y: 10, w: 64, h: 56 },
  music: { x: 12, y: 76, w: 64, h: 56 }, story: { x: 12, y: 142, w: 64, h: 56 } };
const NODES = [{ x: 110, y: 300 }, { x: 230, y: 230 }, { x: 360, y: 300 }, { x: 490, y: 220 }, { x: 620, y: 300 }, { x: 740, y: 220 }, { x: 860, y: 270 }];
const inB = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
C.addEventListener('mousedown', e => {
  woke = true; audio(); if (!mus.id && mus.on && mus.want) playSong(mus.want);
  const r = C.getBoundingClientRect(), x = (e.clientX - r.left) * W / r.width, y = (e.clientY - r.top) * H / r.height;
  if (inB(BTN.music, x, y) && state !== 'story') { toggleMusic(); return; }
  if (inB(BTN.back, x, y) && state !== 'title') { goBack(); return; }
  if (state === 'map') {
    if (inB(BTN.story, x, y)) { startStory(); return; }
    for (let i = 0; i < NODES.length; i++) if (Math.hypot(x - NODES[i].x, y - NODES[i].y) < 55 && i < SAVE.unlocked) { if (mapSel === i) startLevel(i); else { mapSel = i; sfx.click(); } return; }
    if (inB(BTN.go, x, y)) startLevel(mapSel);

// =====================================================================
// 🐰 PLAYING
// =====================================================================
function startLevel(i) {
  hush(); lvl = i; build(i); gotStars = 0; totalStars = stars.length; parts = []; pops = []; msg = null;
  Object.assign(P, { x: 2 * T, y: gTop(2) - P.h, vx: 0, vy: 0, on: false, face: 1, hearts: MAX_HEARTS, inv: 0, balloon: 0, bubble: null, sq: 0, oops: 0 });
  P.safeX = P.cpX = P.x; P.safeY = P.cpY = P.y; camX = 0; jumpPressed = false;
  if (L.boss) startBoss(); else { playSong('hop'); say(`${L.name}! Find the ${L.dropName} color drop!`, 150); }
  setState('play'); sfx.click();
}
function say(str, t = 120) { msg = { str, t }; speak(str); }

  ctx.lineWidth = 14; for (let i = 0; i < 6; i++) { ctx.strokeStyle = i < SAVE.unlocked - 1 ? RAINBOW[i] : 'rgba(255,255,255,.35)'; ctx.beginPath(); ctx.arc(W / 2, 470, 420 - i * 14, Math.PI, 0); ctx.stroke(); }
  text('Pick a land!', W / 2, 60, 46, '#fff');
  ctx.strokeStyle = '#fff3c4'; ctx.lineWidth = 10; ctx.setLineDash([4, 14]); ctx.lineCap = 'round'; ctx.beginPath(); NODES.forEach((n, i) => i ? ctx.lineTo(n.x, n.y) : ctx.moveTo(n.x, n.y)); ctx.stroke(); ctx.setLineDash([]);
  NODES.forEach((n, i) => {
    const open = i < SAVE.unlocked, sel = i === mapSel, done = i < SAVE.unlocked - 1 || SAVE.won;
    dot(n.x, n.y, sel ? 50 : 42, sel ? '#fff59d' : 'rgba(255,255,255,.8)'); dot(n.x, n.y, sel ? 42 : 36, open ? (i === 6 ? '#8e9bb5' : RAINBOW[i]) : '#b0bec5');
    text(open ? LANDS[i].icon : '🔒', n.x, n.y + 13, 36);
    if (done && i < 6) colorDrop(n.x + 34, n.y - 34, 0.5, RAINBOW[i]);
    if (open && i < 6 && SAVE.stars[i]) text('⭐' + SAVE.stars[i], n.x, n.y + 66, 18, '#fff59d');
  });
  const n = NODES[mapSel]; drawBean(n.x, n.y - 42 - Math.abs(Math.sin(frame * 0.1)) * 18, 0.8, { face: 1 });
  text(LANDS[mapSel].name, W / 2, 400, 38, '#fff');
  btn(BTN.go, '▶ GO!', '#ff4f9a', 38); cornerBtns(true);
  if (SAVE.won) text('🏆 Rainbow Hero!', W - 130, 110, 24, '#ffd54f');
}
</script>
<script>
function drawHUD() {
  rr(84, 10, 330, 56, 20, 'rgba(58,36,100,.45)');
  for (let i = 0; i < MAX_HEARTS; i++) heart(112 + i * 40, 22, 30, i < P.hearts ? '#ff4f7a' : 'rgba(255,255,255,.3)');
  starShape(330, 38, 15, '#ffd54f'); text(`${gotStars}`, 350, 49, 28, '#fff', 'left');
  rr(W / 2 - 110 + 40, 10, 240, 56, 20, 'rgba(58,36,100,.45)');
  for (let i = 0; i < 6; i++) { const have = i < lvl || (i === lvl && goal && goal.got) || (L.boss && B && i < (3 - B.hp) * 2) || SAVE.won; colorDrop(W / 2 - 50 + i * 36, 42, 0.55, have ? RAINBOW[i] : 'rgba(255,255,255,.35)'); }
  if (P.balloon > 0) text('🎈 hold JUMP to float', W / 2 + 10, 92, 20, '#fff');
  cornerBtns(false);
  if (msg && msg.t > 0) { msg.t--; ctx.globalAlpha = Math.min(1, msg.t / 20);
    ctx.font = 'bold 28px "Comic Sans MS", sans-serif'; const w = Math.min(900, ctx.measureText(msg.str).width + 50);
    rr(W / 2 - w / 2, 108, w, 50, 22, 'rgba(255,255,255,.88)'); text(msg.str, W / 2, 143, msg.str.length > 60 ? 20 : 28, '#ff4f9a', 'center', '#fff'); ctx.globalAlpha = 1; }
}
function drawPlay() {
  drawSky(); drawTiles(); drawBits();
  for (const d of drips) drawDrip(d, false);
  for (const f of foes) if (f.x - camX > -60 && f.x - camX < W + 60) drawFoe(f);
  if (L.boss && B) drawBoss();
  drawPlayer();
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20); dot(p.x - camX, p.y, p.r, p.col); } ctx.globalAlpha = 1;
  for (const p of pops) { ctx.globalAlpha = Math.min(1, p.t / 20); text(p.str, p.x - camX, p.y - (60 - p.t) * 0.8, p.size, p.col); } ctx.globalAlpha = 1;
  if (L.boss && B && B.phase !== 'friend') { rr(W / 2 - 150, 470, 300, 36, 18, 'rgba(58,36,100,.45)'); text('Giggles:', W / 2 - 60, 497, 22, '#fff');
    for (let i = 0; i < 3; i++) text(i < 3 - B.hp ? '😆' : '☁️', W / 2 + 20 + i * 40, 498, 26); }
  drawHUD();
  if (P.oops) { ctx.fillStyle = `rgba(255,255,255,${0.6 * (1 - P.oops / 90)})`; ctx.fillRect(0, 0, W, H); }
}
function drawDone() {
  drawPlay();
  const k = Math.min(1, stateT / 25);
  ctx.fillStyle = `rgba(58,36,100,${0.45 * k})`; ctx.fillRect(0, 0, W, H);
  rr(W / 2 - 300, 110 + (1 - k) * 200, 600, 320, 34, '#fff');
  colorDrop(W / 2, 200 + (1 - k) * 200, 2 + Math.sin(frame * 0.1) * 0.1, L.drop);
  text(`You found the ${L.dropName} drop!`, W / 2, 300 + (1 - k) * 200, 40, L.drop, 'center', '#3a2464');
  text(`⭐ ${gotStars} stars`, W / 2, 350 + (1 - k) * 200, 32, '#ffb300', 'center', '#3a2464');
  if (stateT > 50 && frame % 60 < 45) text(lvl === 5 ? 'JUMP = go meet Grumble Cloud!' : 'JUMP = next land!', W / 2, 405, 28, '#ff4f9a', 'center', '#fff');
}
function drawWin() {
  L = LANDS[0]; camX = frame * 0.4; drawSky(); camX = 0;
  ctx.lineWidth = 18; for (let i = 0; i < 6; i++) { ctx.strokeStyle = RAINBOW[i]; ctx.beginPath(); ctx.arc(W / 2, 470, 400 - i * 18, Math.PI, 0); ctx.stroke(); }
  rr(0, 440, W, 80, 0, '#4cd964');
  rainbowText('YOU DID IT!', W / 2, 90, 66);
  text('Bean and Grumble Cloud are best friends now!', W / 2, 140, 28, '#fff');
  B = B || { hp: 0, wob: 0, hitT: 0, spots: [] }; Object.assign(B, { x: 690, y: 250, hp: 0, phase: 'friend', spots: [], puff: null }); B.wob += 0.05;
  drawBoss();
  drawBean(330, 440 - Math.abs(Math.sin(frame * 0.09)) * 50, 1.6, { face: 1, happy: true }); drawRobo(180, 440, 1.5);
  text('🏆 You got a trophy!', W / 2, 186, 30, '#ffd54f');
  text('💡 A surprise made by Claude for Ben\'s brother!', W / 2, 478, 22, '#fff');
  if (stateT > 90 && frame % 60 < 45) text('JUMP = play again', W / 2, 510, 20, '#fff59d');
  for (const p of parts) { ctx.globalAlpha = Math.min(1, p.life / 20); dot(p.x, p.y, p.r, p.col); } ctx.globalAlpha = 1;
  if (frame % 25 === 0) burst(rnd(100, 860), rnd(60, 250), RAINBOW, 8, 3);
  btn(BTN.music, mus.on ? '🎵' : '🔇', '#26a69a', 26);
}

// =====================================================================
// 🔁 THE LOOP
// =====================================================================
function update() {
  frame++; stateT++;
  if (state === 'title') { if (okPressed && stateT > 10) { sfx.click(); if (!SAVE.story) { SAVE.story = true; save(); startStory(); } else { playSong('hop'); setState('map'); } } }
  else if (state === 'story') { if (okPressed && stateT > 20) { sfx.click(); if (++storyPage >= STORY.length) { playSong('hop'); hush(); setState('map'); } else { stateT = 0; tellStory(); } } }
  else if (state === 'map') { if (okPressed && stateT > 10) startLevel(mapSel); }
  else if (state === 'play') {
    updatePlayer(); updateWorld(); if (L.boss && B) updateBoss();
    camX = clamp(P.x + P.w / 2 - W * 0.4, 0, Math.max(0, cols * T - W));
  }
  else if (state === 'done') { if (okPressed && stateT > 50) { if (lvl < 6) startLevel(lvl + 1); else goMap(); } }
  else if (state === 'win') { if (okPressed && stateT > 90) goMap(); }
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.life--; } parts = parts.filter(p => p.life > 0);
  for (const p of pops) p.t--; pops = pops.filter(p => p.t > 0);
  if (parts.length > 300) parts.splice(0, parts.length - 300);
  okPressed = false; jumpPressed = false;
}
function draw() {
  ctx.clearRect(0, 0, W, H);
  if (state === 'title') drawTitle(); else if (state === 'story') drawStory(); else if (state === 'map') drawMap();
  else if (state === 'play') drawPlay(); else if (state === 'done') drawDone(); else if (state === 'win') drawWin();
}
let lastT = 0, acc = 0;
function loop(now) {
  acc += Math.min(100, now - (lastT || now)); lastT = now;
  let n = 0; while (acc >= 1000 / 60 && n < 4) { update(); acc -= 1000 / 60; n++; }
  if (n) draw();
  requestAnimationFrame(loop);
}
mus.want = 'hop';
if (JB_WANT && SONGS[JB_WANT]) { mus.on = true; playSong(JB_WANT); }   // 🎶 the book's Jukebox: ?song=hop | grumble | yay
requestAnimationFrame(loop);
</script>
