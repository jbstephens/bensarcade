<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🌀 Optical Illusion School</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e6e0ff 0 36px, #dcd4ff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-print { background: #8ef08e; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-how { background: #ffe066; } .b-act { background: #ffc2e2; }
  .b-next { background: #8ef08e; font-size: 24px; } .b-say { background: #b9f6ca; } .b-clear { background: #ffc2d6; }
  .b-done { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); font-size: 22px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; position: relative; }
  #gHead h1 { margin: 0; font-size: clamp(26px, 4.6vw, 52px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #7c4dff; letter-spacing: 2px; }
  #gHead p { margin: 2px 0 4px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; }
  #leave { position: absolute; left: 10px; top: 8px; font-size: 18px; min-height: 50px; padding: 4px 12px; z-index: 5; }
  #stars { position: absolute; right: 12px; top: 10px; font-size: 20px; font-weight: bold; background: #fff;
    border: 4px solid #333; border-radius: 14px; padding: 6px 10px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 28px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; }
  .sec i { font-style: normal; font-size: 17px; font-weight: bold; background: #fffbe0; border: 3px solid #333; border-radius: 12px; padding: 3px 10px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #7c4dff; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg, .thumb canvas { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 8px; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb .tick { position: absolute; right: -8px; top: -10px; font-size: 30px; }
  .thumb.sel { border-color: #ff3d8b; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d8b; }
  .thumb:active { transform: scale(.96); }
  /* ---------- side panels (lesson / museum / sheet) ---------- */
  .side { width: min(42vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .title { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .help { font-size: 20px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px 10px; line-height: 1.3; }
  /* lesson */
  #lesson, #museum, #sheet { flex-direction: row; gap: 10px; padding: 10px; }
  .stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
  #lCard { position: relative; width: min(100%, calc((100vh - 110px) * 4 / 3)); aspect-ratio: 4 / 3; background: #fff;
    border: 5px solid #333; border-radius: 14px; box-shadow: 0 8px 0 #7c4dff; overflow: hidden;
    background-image: linear-gradient(#eef3ff 1px, transparent 1px); background-size: 100% 28px; }
  #lCard svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  .dot { width: 44px; height: 44px; border-radius: 50%; border: 4px solid #333; background: #fff; font-weight: bold; font-size: 20px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .dot.on { background: #ffe066; transform: scale(1.15); } .dot.past { background: #b9f6ca; }
  #lStep { font-size: 23px; min-height: 96px; display: flex; align-items: center; justify-content: center; }
  #lStep b { color: #7c4dff; margin-right: 6px; }
  .dr { stroke-dasharray: 1; stroke-dashoffset: 1; animation: drw 1.3s ease-in-out forwards; }
  .fd { opacity: 0; animation: fdin 1.2s ease forwards; }
  @keyframes drw { to { stroke-dashoffset: 0; } }
  @keyframes fdin { to { opacity: 1; } }
  .necker1 { animation: nk 8s ease-in-out infinite; } .necker2 { animation: nk 8s ease-in-out -4s infinite; }
  @keyframes nk { 0%, 40% { opacity: 1; } 50%, 90% { opacity: 0; } 100% { opacity: 1; } }
  /* museum */
  #mCard { position: relative; width: min(100%, calc((100vh - 40px) * 800 / 520)); aspect-ratio: 800 / 520; background: #fff;
    border: 5px solid #333; border-radius: 14px; box-shadow: 0 8px 0 #7c4dff; overflow: hidden; }
  #mCan { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #mActs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  #mActs .btn:only-child { grid-column: 1 / -1; }
  #mHow { font-size: 19px; background: #e8fff0; border: 4px solid #333; border-radius: 14px; padding: 8px 10px; line-height: 1.35; }
  /* sheet */
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #svgBox svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #7c4dff; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #pageNav { display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 8px; align-items: center; }
  #pageNum { text-align: center; font-size: 20px; font-weight: bold; }
  #names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #names .btn { font-size: 16px; min-height: 48px; padding: 4px; }
  #names .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #lesson, #museum, #sheet { flex-direction: column; }
    .stage, #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    .side { width: 100%; max-height: 46vh; }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px; } .help, #lStep { font-size: 17px; } #lStep { min-height: 70px; } .title { font-size: 20px; } }
  @media (prefers-reduced-motion: reduce) { .necker1, .necker2 { animation-duration: 16s; } }
  /* ---------- PRINT: only the pages in #printAll ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <button class="btn b-back" id="leave">⬅️ Game Factory</button>
    <div id="stars"></div>
    <h1>🌀 OPTICAL ILLUSION SCHOOL</h1>
    <p>Learn to draw mind-bending tricks, then visit the Illusion Museum!</p>
  </div>
  <div id="grid"></div>
</div>
<div id="lesson" class="screen">
  <div class="stage"><div id="lCard"></div><div id="dots"></div></div>
  <div class="side">
    <div class="title" id="lTitle"></div>
    <div class="help" id="lStep"></div>

    <button class="btn b-back" id="lBack">⬅️ All lessons</button>
  </div>
</div>
<div id="museum" class="screen">
  <div class="stage"><div id="mCard"><canvas id="mCan" width="800" height="520"></canvas></div></div>
  <div class="side">
    <div class="title" id="mTitle"></div>
    <div class="help" id="mQ"></div>
    <div id="mActs"></div>
    <button class="btn b-how" id="mHowBtn">🤔 How does it work?</button>
    <div id="mHow" class="hide"></div>
    <div class="two"><button class="btn b-all" id="mPrev">◀ Last one</button><button class="btn b-all" id="mNext">Next one ▶</button></div>
    <button class="btn b-back" id="mBack">⬅️ Back to school</button>
  </div>
</div>
<div id="sheet" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div class="side">
    <div class="title" id="sTitle"></div>
    <div class="help" id="sHelp"></div>
    <div id="pageNav"><button class="btn b-all" id="sPrevP">◀</button><div id="pageNum"></div><button class="btn b-all" id="sNextP">▶</button></div>
    <div id="names"></div>
    <div id="pens"></div>
    <button class="btn b-print" id="sPrint">🖨️ Print this page</button>
    <div class="two" id="traceBtns"><button class="btn b-print2" id="sPrintMine">🖨️ Print my drawing</button><button class="btn b-clear" id="sClear">🧽 Clear</button></div>
    <button class="btn b-all" id="sPrintAll">🖨️ Print all pages</button>
    <button class="btn b-back" id="sBack">⬅️ Back to school</button>
  </div>
</div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🌀 OPTICAL ILLUSION SCHOOL
// ✏️ 10 drawing lessons (step pictures that draw themselves, printable step sheets + practice pages)
// 🏛️ 10 live illusions on a canvas (800 x 520), each with a "How does it work?" read out loud
// 🖨️ printables: step sheets, practice pages, a museum poster and an Illusion Master certificate
// Safety: nothing flashes, and everything that moves moves slowly.
// =====================================================================
const TEST = typeof window !== 'undefined' && !!window.__TEST__;
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
// ---- art helpers + characters (copied from the Craft Room / Art Gallery) ----
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
const FOLD = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-dasharray="10 7" stroke-linecap="round"/>';

  tap('sPrevP', () => turnPage(-1)); tap('sNextP', () => turnPage(1)); tap('sPrint', () => printThisPage(false));
