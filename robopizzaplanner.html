<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🍕 Robo Face Pizza Planner</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #fff1d6 0 36px, #ffe2b8 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; gap: 10px; padding: 10px; }
  .screen.on { display: flex; }
  /* ---------- builder ---------- */
  #build { flex-direction: row; }
  #stage { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  #stage h1 { margin: 0; font-size: clamp(22px, 3.4vw, 40px); color: #fff; -webkit-text-stroke: 2.5px #333;
    text-shadow: 3px 3px 0 #e53935; letter-spacing: 1px; text-align: center; }
  #pizzaBox { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #pizza { height: 100%; max-width: 100%; aspect-ratio: 34 / 30; touch-action: none; background: #fff6e6;
    border: 5px solid #333; border-radius: 22px; box-shadow: 0 7px 0 #e07b1a; }
  #hint { font-size: clamp(15px, 2vw, 20px); font-weight: bold; text-align: center; background: #fffbe0;
    border: 4px solid #333; border-radius: 14px; padding: 4px 12px; margin-top: 6px; }
  #side { width: min(46vw, 470px); display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  #tabs { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
  .tab { font: inherit; font-weight: bold; font-size: 14px; line-height: 1.05; border: 4px solid #333; border-radius: 14px 14px 6px 6px;
    background: #fff; padding: 4px 2px; cursor: pointer; min-height: 56px; }
  .tab b { display: block; font-size: 22px; }
  .tab.on { background: #ffd23f; transform: translateY(-3px); box-shadow: 0 3px 0 #333; }
  .tab.done:not(.on) { background: #c8f7c5; }
  #panel { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; background: #fff; border: 4px solid #333;
    border-radius: 16px; padding: 8px; }
  #panel h2 { margin: 2px 0 8px; font-size: 21px; text-align: center; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .grid4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 6px 6px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; background: #fff; line-height: 1.1; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #8ef08e; }
  .btn svg { display: block; margin: 0 auto 2px; width: 100%; height: auto; max-height: 74px; pointer-events: none; }
  .btn small { display: block; font-size: 13px; font-weight: normal; color: #555; }
  .top { touch-action: none; font-size: 14px; padding: 4px 2px; min-height: 64px; }
  .top svg { max-height: 40px; }
  .top.armed { background: #ffd23f; outline: 4px dashed #e53935; outline-offset: 1px; }
  .chr svg { max-height: 86px; }
  .num { font-size: 32px; min-height: 64px; }
  .tools { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
  .b-tool { background: #9be3ff; font-size: 17px; min-height: 50px; }
  #bReal { background: linear-gradient(#ffe066, #ffb300); font-size: 25px; min-height: 66px; }
  .rule { font-size: 14px; text-align: center; color: #6d3b00; margin: 0; }
  .note { font-size: 15px; text-align: center; background: #fffbe0; border: 3px dashed #ffb300; border-radius: 12px; padding: 5px; margin: 8px 0 0; }
  #ghost { position: fixed; left: 0; top: 0; width: 64px; height: 64px; pointer-events: none; z-index: 70; display: none;
    transform: translate(-50%, -50%) scale(1.2); }
  /* ---------- result pages ---------- */
  #view { flex-direction: row; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;

  #vside { width: min(42vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #vTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  .b-page { background: #fff; font-size: 18px; }
  .b-page.on { background: #ffd23f; }
  .b-print { background: #8ef08e; font-size: 21px; }
  .b-all { background: #c3a6ff; }
  .b-made { background: #ffe066; font-size: 21px; }
  .b-made.on { background: #8ef08e; }
  .b-back { background: #9be3ff; }

    z-index: 80; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }

    .screen { flex-direction: column !important; }
    #side, #vside { width: 100%; max-height: 48vh; }
    #wrap { height: 100%; }
    #paper { min-height: 0; }

    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #vside, #toast { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="build" class="screen on">
  <div id="stage">
    <h1>🍕 ROBO FACE PIZZA PLANNER</h1>
    <div id="pizzaBox"><svg id="pizza" viewBox="-170 -150 340 300"></svg></div>
    <div id="hint"></div>
  </div>
  <div id="side">
    <div id="tabs">

      <button class="tab" data-tab="face"><b>🤖</b>3 Face</button>
      <button class="tab" data-tab="tops"><b>🍅</b>4 Toppings</button>
      <button class="tab" data-tab="count"><b>🔢</b>5 How many</button>
    </div>
    <div id="panel"></div>
    <button class="btn" id="bReal">🍳 Make it for REAL!</button>
    <p class="rule">💡 Ben's rule: every recipe is REAL!</p>
  </div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="vside">
    <div id="vTitle">🍳 Make it for REAL!</div>

    <button class="btn b-page" data-page="mat">🎉 Pizza Party place-mat</button>
    <button class="btn b-print" id="bPrint">🖨️ Print this page</button>
    <button class="btn b-all" id="bPrintAll">📚 Print all 3 pages</button>
    <button class="btn b-made" id="bMade">🍕 We made it for real!</button>
    <button class="btn b-back" id="bBack">✏️ Back to my pizza</button>
    <p class="rule">💡 Ben's rule: every recipe is REAL!</p>
  </div>
</div>
<div id="printAll"></div>
<div id="ghost"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🍕 ROBO FACE PIZZA PLANNER: design a Robo-face pizza with REAL toppings,
// then get the real recipe (right amounts for 1 to 6 pizzas), a shopping list and a party place-mat.
// Art helpers + characters copied from the Cookbook. Pages are portrait letter, viewBox 0 0 800 1000.
// RULE: knife / oven / pizza cutter / hot pan = 🧑 Grown-up job.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }

const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;

  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }

const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);

// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.

const SKIP = null;

  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);

}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);

function L(d, col, w, ex) {

}

function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };

const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));

const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';

function svgWrap(body, ex) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs>' +
    '<rect x="0" y="0" width="800" height="1000" fill="#fff"/>' + body + '</svg>';
}
// =====================================================================
// CHARACTERS (copied from the Art Gallery; each drawn around 0,0, about 120 tall)
// =====================================================================
function robo(o) {
  o = o || {}; const H = o.head || '#f4f7fb', B = o.body || H, V = o.visor || '#1d2836', EY = o.eye || '#40c4ff',

    else s += arm(-33, 14, 14) + arm(23, 14, -14) + C(-31, 39, 6, ball(PD), OL, 2) + C(31, 39, 6, ball(PD), OL, 2);

    s += L('M14 16 Q19 26 14 36', RIM, 2.2, ' opacity=".8"');

  s += L('M0 -38 L0 -50', OL, 2.8) + glow(0, -52, 12, o.tip || '#ff5252', .55) + C(0, -52, 4.8, ball(o.tip || '#ff5252'), OL, 2);
  s += E(-27, -14, 6.5, 10, ball(PD), OL, 2.2) + E(27, -14, 6.5, 10, ball(PD), OL, 2.2);
  s += C(0, -14, 25, ball(H), OL, 2.8) + L('M16 -32 A24 24 0 0 1 22 2', RIM, 2.6, ' opacity=".85"');

    if (Math.hypot(p.x, p.y) <= DROP_R) addPiece(d.t, p.x, p.y); else blip(250, 0, .1);
    return;
  }
  const pc = state.pieces[d.i]; if (!pc) return;
  if (!d.moved) { pushUndo(); pc[3] = ((pc[3] || 0) + 45) % 360; blip(660, 0, .06); }
  else if (Math.hypot(pc[1], pc[2]) > DROP_R) { state.pieces.splice(d.i, 1); blip(260, 0, .2); toast('Poof! Topping taken off.'); }
  else { const [x, y] = clampIn(pc[1], pc[2]); pc[1] = n(x); pc[2] = n(y); blip(560, 0, .06); }
  saveState(); renderPizza();
}
// =====================================================================
// 🍳 MAKE IT FOR REAL: recipe card, shopping list, place-mat + printing
// =====================================================================
function openView(pg) {
  page = pg || 'card'; madeHere = false; endPrintAll();
  $('build').classList.remove('on'); $('view').classList.add('on'); renderView(); tune([523, 659, 784, 1047]);
}
function renderView() {
  $('svgBox').innerHTML = pageSVG(page, state);
  document.querySelectorAll('.b-page').forEach(b => b.classList.toggle('on', b.dataset.page === page));
  $('bMade').classList.toggle('on', madeHere);
  $('bMade').textContent = madeHere ? '✅ Yum! Made ' + state.made + (state.made > 1 ? ' times' : ' time') : '🍕 We made it for real!';
}
function backToBuild() { endPrintAll(); $('view').classList.remove('on'); $('build').classList.add('on'); renderPizza(); renderPanel(); blip(500); }
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();
  }, 60);
}
function countPrint(isCard) { state.printed++; saveState(); if (isCard) giveTrophy(); }
function printPage() { endPrintAll(); renderView(); countPrint(page === 'card'); doPrint(); }
function printAll() {
  $('printAll').innerHTML = ['card', 'shop', 'mat'].map(id => pageSVG(id, state)).join('');
  document.body.classList.add('pAll'); countPrint(true);
  if (!hasTrophy()) giveTrophy(); else toast('🖨️ Printing 3 pages!');
  doPrint(endPrintAll);
}
function endPrintAll() { document.body.classList.remove('pAll'); const pa = $('printAll'); if (pa) pa.innerHTML = ''; }
function onMade() {
  if (madeHere) return; madeHere = true; state.made++; saveState();
  if (!giveTrophy()) { tune([523, 784, 1047]); toast('🍕 YUM! You made a real Robo pizza!'); }
  renderView();
}
function init() {
  loadState(); renderPizza(); renderPanel();
  document.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => setTab(b.dataset.tab)));
  $('panel').addEventListener('click', onPanelClick);
  window.addEventListener('pointerdown', onDown, { passive: false });
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', () => { drag = null; $('ghost').style.display = 'none'; });
  window.addEventListener('resize', () => { if ($('build').classList.contains('on')) renderPizza(); });
  $('bReal').addEventListener('click', () => openView('card'));
  document.querySelectorAll('.b-page').forEach(b => b.addEventListener('click', () => { page = b.dataset.page; renderView(); blip(660); }));
  $('bPrint').addEventListener('click', printPage);
  $('bPrintAll').addEventListener('click', printAll);
  $('bMade').addEventListener('click', onMade);
  $('bBack').addEventListener('click', backToBuild);
  window.addEventListener('afterprint', endPrintAll);
  window.addEventListener('keydown', e => {
    if ($('view').classList.contains('on') && (e.key === 'Escape' || e.key === 'Backspace')) { backToBuild(); e.preventDefault(); }
    else if ($('view').classList.contains('on') && (e.key === 'p' || e.key === 'P')) printPage();
  });
}
if (!window.__TEST__) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init(); }
</script>
