    else if (dir === 'left') pts = [x1, y1, x1 - t, y1 + k, x2 - t, y2 - k, x2, y2];
    else pts = [x1, y1, x1 + t, y1 + k, x2 + t, y2 - k, x2, y2];
    s += P(poly(pts), '#fff3b0', 0) + FOLD('M' + x1 + ' ' + y1 + ' L' + x2 + ' ' + y2);
    const mx = (x1 + x2) / 2 + (dir === 'left' ? -t / 2 : dir === 'right' ? t / 2 : 0), my = (y1 + y2) / 2 + (dir === 'up' ? -t / 2 : dir === 'down' ? t / 2 : 0);

    ' M' + (ox + S) + ' ' + (oy + S) + ' L' + (ox + S) + ' ' + (oy + 2 * S) + ' M' + (ox + 2 * S) + ' ' + (oy + S) + ' L' + (ox + 2 * S) + ' ' + (oy + 2 * S));
  const X = c => ox + c * S, Y = r => oy + r * S;

    [X(2), Y(3)], [X(2) + t, Y(3) + k], [X(2) + t, Y(4) - k], [X(2), Y(4)], [X(2) - k, Y(4) + t], [X(1) + k, Y(4) + t], [X(1), Y(4)], [X(1) - t, Y(4) - k], [X(1) - t, Y(3) + k], [X(1), Y(3)],
    [X(1), Y(2)], [X(1) - k, Y(2) + t], [X(0) + k, Y(2) + t], [X(0), Y(2)], [X(0), Y(1)], [X(0) + k, Y(1) - t], [X(1) - k, Y(1) - t], [X(1), Y(1)]];

}
function pawnSheet() {

// 👥 WHO'S WHO: every picture by name (drawn around 0,0, then fit() sizes it)

const CH = {

  dusty: { draw: () => dusty() }, dustyHappy: { draw: () => dusty({ happy: true }) }, sparks: { draw: sparks },
  captain: { draw: () => captain() }, captainEek: { draw: () => captain({ eek: true }) }, willy: { draw: () => willy() }, bigvine: { draw: bigVineBot },
  knight: { draw: morphKnight }, dragon: { draw: morphDragon },

const SECTIONS = [

    sheets: [() => standupSheet(['robo', 'dusty', 'sparks', 'captain', 'willy', 'bigvine'], 1), () => standupSheet(['pip', 'gizmo', 'rivet', 'nutmeg', 'knight'], 2)] },

function sheetSVG(fn) {

const ALL = [];   // every sheet: { sec, i, fn }

// ---------- sounds (tiny blips, made by the browser) ----------

}
function toast(msg, ms) { const t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), ms || 3200); }

function prepPrint(list) { $('printAll').innerHTML = list.map(a => sheetSVG(a.fn)).join(''); return list.length; }
function printList(list, label) {

const printSection = si => printList(ALL.filter(a => a.si === si), SECTIONS[si].icon + ' ' + SECTIONS[si].name);
