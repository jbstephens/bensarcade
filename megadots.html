<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>⭐ Mega Dot-to-Dot Book</title>
<script src="touchpad.js?v=4"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: #fff4c9 radial-gradient(circle, #ffc93c 3px, transparent 4px) 0 0 / 30px 30px;
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 6px 10px 0; }
  #gHead h1 { margin: 0; font-size: clamp(26px, 4.6vw, 52px); color: #fff;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #2f7bff; letter-spacing: 2px; }
  #gHead p { margin: 0 0 4px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; }
  #bar { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 2px 10px 4px; }
  #bar .btn { min-height: 50px; font-size: 18px; padding: 4px 12px; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #2f7bff; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 2px; }
  .thumb i { font-style: normal; font-size: 14px; letter-spacing: 1px; min-height: 18px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb:active { transform: scale(.96); }
  .thumb .q { position: absolute; top: 6px; right: 8px; font-size: 22px; }
  /* ---------- play screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 30px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #svgBox { position: absolute; inset: 0; touch-action: none; }
  #svgBox svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #2f7bff; touch-action: none; cursor: pointer; }
  #side { width: min(40vw, 400px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 4px; }
  #nextBox { display: flex; gap: 8px; }
  #nextBox > div { flex: 1; background: #fffbe0; border: 4px solid #333; border-radius: 14px; text-align: center; padding: 2px 4px; font-weight: bold; font-size: 16px; }
  #nextBox big { display: block; font-size: 36px; line-height: 1.1; color: #2f7bff; }
  #pHelp { font-size: 17px; text-align: center; background: #e6f6ff; border: 4px solid #333; border-radius: 14px; padding: 4px 8px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 6px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 56px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-diff { font-size: 17px; line-height: 1.1; }
  .b-diff.on, .b-tog.on, .b-name.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-hint { background: #fff176; }
  .b-book { background: #c3a6ff; } .b-cert { background: #ffb347; } .b-next { background: #b9f6ca; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* dots on screen */
  .dot { transform-box: fill-box; transform-origin: center; }
  .dot.wig { animation: wig .45s; }
  @keyframes wig { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-4px) rotate(-8deg); } 40% { transform: translateX(4px) rotate(8deg); } 60% { transform: translateX(-3px); } 80% { transform: translateX(3px); } }
  .hintRing { animation: pulse .7s infinite alternate; transform-box: fill-box; transform-origin: center; }
  @keyframes pulse { from { transform: scale(.75); opacity: 1; } to { transform: scale(1.25); opacity: .5; } }
  #dotLayer { transition: opacity .8s; }
  .doneDots #dotLayer { opacity: 0; pointer-events: none; }
  #artLayer { opacity: 0; transition: opacity 1.2s; }
  .doneDots #artLayer { opacity: 1; }
  .waver { transform-box: fill-box; transform-origin: 50% 100%; }
  .doneDots .waver { animation: wave 1s ease-in-out 1.2s 4 alternate; }
  @keyframes wave { from { transform: rotate(-4deg) translateY(0); } to { transform: rotate(4deg) translateY(-12px); } }
  .hand { transform-box: fill-box; transform-origin: 30% 90%; animation: hand .35s ease-in-out infinite alternate; }
  @keyframes hand { from { transform: rotate(-25deg); } to { transform: rotate(25deg); } }
  /* ---------- overlays: book builder + certificate ---------- */
  .ov { position: fixed; inset: 0; background: rgba(20, 30, 70, .72); display: none; z-index: 40;
    align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1180px;
    max-height: 100%; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3.2vw, 34px); }
  #bookGrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
  .pick { border: 4px solid #333; border-radius: 14px; padding: 4px; text-align: center; cursor: pointer; background: #f3f3f3; font-weight: bold; font-size: 14px; opacity: .55; }
  .pick svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .pick.on { background: #e8ffe8; border-color: #2ecc40; opacity: 1; box-shadow: 0 4px 0 #2ecc40; }
  .bookRow { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; align-items: center; }
  .bookRow .btn { min-height: 50px; font-size: 18px; }
  #certCard { max-width: 900px; flex-direction: row; }
  #certPrev { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #certPrev svg { height: min(78vh, 640px); width: auto; max-width: 100%; border: 3px solid #333; border-radius: 8px; }
  #certSide { width: 260px; display: flex; flex-direction: column; gap: 8px; }
  #names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  #names .btn { min-height: 46px; font-size: 17px; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 42vh; }
    #certCard { flex-direction: column; }
    #certSide { width: 100%; }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 16px; padding: 4px; } #pHelp { font-size: 14px; } #nextBox big { font-size: 26px; } }
  /* ---------- PRINT: only the pages in #printAll ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printAll) { display: none !important; }
    #printAll { display: block !important; }
    #printAll svg { display: block; width: 100%; height: 9.9in; max-width: none; margin: 0 auto;
      break-after: page; page-break-after: always; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <h1>⭐ MEGA DOT-TO-DOT BOOK</h1>
    <p>Pick how hard, tap a picture, then connect the dots 1, 2, 3...!</p>
  </div>
  <div id="bar">
    <button class="btn b-diff" data-d="0">🙂 Easy<br>~30 dots</button>
    <button class="btn b-diff" data-d="1">😎 Medium<br>~60 dots</button>
    <button class="btn b-diff" data-d="2">🤯 MEGA<br>100+ dots</button>
    <button class="btn b-book" id="bBook">📚 Book<br>Builder</button>
    <button class="btn b-cert" id="bCert">🏅 Dot Master<br>certificate</button>
    <button class="btn b-back" id="bHome">⬅️ Back</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="nextBox">
      <div>Next dot<big id="nextN">1</big></div>
      <div>⏱️ Time<big id="timer">0:00</big></div>
    </div>
    <div id="pHelp"></div>
    <div class="row3">
      <button class="btn b-diff" data-d="0">🙂 Easy</button>
      <button class="btn b-diff" data-d="1">😎 Medium</button>
      <button class="btn b-diff" data-d="2">🤯 MEGA</button>
    </div>
    <button class="btn b-hint" id="bHint">💡 Show next dot</button>
    <button class="btn b-print" id="bPrint">🖨️ Print it! (+ answer)</button>
    <div class="two">
      <button class="btn b-clear" id="bClear">🔄 Start over</button>
      <button class="btn b-next" id="bNext">➡️ Next picture</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pictures</button>
  </div>
</div>
<div id="book" class="ov"><div class="card">
  <h2>📚 Book Builder: make your own dot-to-dot book!</h2>
  <div class="bookRow">
    <button class="btn b-diff" data-d="0">🙂 Easy</button>
    <button class="btn b-diff" data-d="1">😎 Medium</button>
    <button class="btn b-diff" data-d="2">🤯 MEGA</button>
    <button class="btn b-tog" id="bAll">✅ All</button>
    <button class="btn b-tog" id="bNone">⬜ None</button>
    <button class="btn b-tog on" id="bAns">🔍 Answers at the back</button>
  </div>
  <div id="bookGrid"></div>
  <div class="bookRow">
    <button class="btn b-print" id="bBookPrint">🖨️ Print my book!</button>
    <button class="btn b-back" id="bBookClose">⬅️ Close</button>
  </div>
</div></div>
<div id="cert" class="ov"><div class="card" id="certCard">
  <div id="certPrev"></div>
  <div id="certSide">
    <h2>🏅 Dot Master</h2>
    <div id="certInfo" style="text-align:center;font-weight:bold"></div>
    <div id="names"></div>
    <button class="btn b-print" id="bCertPrint">🖨️ Print it!</button>
    <button class="btn b-back" id="bCertClose">⬅️ Close</button>
  </div>
</div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>

    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}

function lin(st, x1, y1, x2, y2) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;

const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);

const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (col || INK) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (col || '#fff') + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// =====================================================================

// a dense list of points, remembering where each piece of the path starts (so corners can get dots).
// =====================================================================
function arcPts(x1, y1, rx, ry, phiDeg, fa, fs, x2, y2, steps) {

// PAGES (all portrait letter, viewBox 0 0 800 1000)

const RAINBOW = ['#ff5252', '#ffab40', '#ffee58', '#69f0ae', '#40c4ff', '#b388ff'];
function picArt(pi, line) {             // the finished picture in local units (color, or just the drawn-in details)
  const pic = PICS[pi], was = LINE; LINE = !!line; let s = '';
  if (!line) pic.parts.forEach(p => {
    const f = p.fill === 'rainbow' ? lin(RAINBOW, 0, 0, 1, 1) : ball(p.fill);
    if (p.stroke) s += L(p.d, OL, p.stroke + 8) + L(p.d, p.fill, p.stroke);
    else s += P(p.d + (p.open ? ' Z' : ''), f, OL, 5);
  });
  s += pic.det(); LINE = was; return s;
}
const BBOX = {};
function picBBox(pi) {
  if (BBOX[pi]) return BBOX[pi];
  const pic = PICS[pi]; let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  pic.parts.forEach(p => flatten(p.d).pts.forEach(q => { const pad = p.stroke ? p.stroke / 2 + 4 : 4; x0 = Math.min(x0, q[0] - pad); y0 = Math.min(y0, q[1] - pad); x1 = Math.max(x1, q[0] + pad); y1 = Math.max(y1, q[1] + pad); }));
  if (pic.box) { x0 = Math.min(x0, pic.box[0]); y0 = Math.min(y0, pic.box[1]); x1 = Math.max(x1, pic.box[2]); y1 = Math.max(y1, pic.box[3]); }
  return (BBOX[pi] = [x0, y0, x1, y1]);
}
// the colored picture fitted into a box on a page
function fitArt(pi, x, y, w, h, line) {
  const b = picBBox(pi), s = Math.min(w / (b[2] - b[0]), h / (b[3] - b[1]));
  const tx = x + w / 2 - s * (b[0] + b[2]) / 2, ty = y + h / 2 - s * (b[1] + b[3]) / 2;
  return '<g transform="translate(' + n(tx) + ' ' + n(ty) + ') scale(' + Math.round(s * 1000) / 1000 + ')">' + picArt(pi, line) + '</g>';
}
function svgPage(body, ex) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs>' +
    '<rect x="0" y="0" width="800" height="1000" fill="#fff"/>' + body + '</svg>';
}
const range = (a, b) => a === b ? String(a) : a + '–' + b;
function instructions(Lo) {
  const pic = PICS[Lo.pi];
  return Lo.parts.map((p, k) => k === 0
    ? '✏️ Start at 1 and connect the dots up to ' + p.to + (p.closed ? ', then back to 1!' : '!')
    : '★ Pick up your pencil! Start again at the ★ for ' + p.name + ': ' + range(p.from, p.to) + (p.closed ? ' (and back to ' + p.from + ')' : ''));
}
function dotMarks(Lo, play) {
  const D = DIFFS[Lo.di];
  return Lo.dots.map((d, i) => {
    const lb = Lo.labels[i];
    const mark = d.star ? P(starD(d.x, d.y, d.rr, 5, .45), INK) : '<circle cx="' + n(d.x) + '" cy="' + n(d.y) + '" r="' + D.r + '" fill="' + INK + '"/>';
    const txt = '<text x="' + n(lb.x) + '" y="' + n(lb.y + lb.fs * .36) + '" font-size="' + n(lb.fs) + '" fill="' + INK + '" stroke="#fff" stroke-width="' + n(lb.fs * .2) + '" paint-order="stroke fill" stroke-linejoin="round" text-anchor="middle"' + FONT + '>' + lb.txt + '</text>';
    return play ? '<g class="dot" data-i="' + i + '">' + mark + txt + '</g>' : mark + txt;
  }).join('');
}
// a dot-to-dot page. opts.page = page number in a book, opts.play = on-screen version (lines + hidden color picture)
function dotSheet(pi, di, opts) {
  opts = opts || {};
  beginArt(true);
  const pic = PICS[pi], Lo = layout(pi, di), D = DIFFS[di];
  let s = R(18, 12, 764, 96, 26, '#fff', INK, 4);
  s += BT(400, 70, pic.name.toUpperCase(), 50, '#fff') + T(120, 74, '★', 40) + T(680, 74, '★', 40);
  s += T(400, 98, D.emoji + ' ' + D.name + '  •  ' + Lo.N + ' dots', 19);
  instructions(Lo).forEach((t, k) => { s += T(400, 136 + k * 25, t, 19); });
  WS = 1.25 / Lo.s;
  s += '<g transform="translate(' + n(Lo.tx) + ' ' + n(Lo.ty) + ') scale(' + Math.round(Lo.s * 1000) / 1000 + ')">' + picArt(pi, true) + '</g>';
  WS = 1;
  if (opts.play) {
    s += '<g id="lineLayer"></g>';
    LINE = false;
    s += '<g id="artLayer"><g class="waver"><g transform="translate(' + n(Lo.tx) + ' ' + n(Lo.ty) + ') scale(' + Math.round(Lo.s * 1000) / 1000 + ')">' + picArt(pi, false) + '</g></g>' +
      '<text class="hand" x="690" y="' + n(Lo.picTop + 40) + '" font-size="70" text-anchor="middle">👋</text></g>';
    LINE = true;
    s += '<g id="dotLayer">' + dotMarks(Lo, true) + '</g><g id="hintLayer"></g>';
  } else s += dotMarks(Lo, false);
  s += R(220, 922, 360, 56, 28, '#fff', INK, 3.5) + BT(400, 962, 'Color it after!', 32, '#fff') + T(250, 962, '🖍️', 28) + T(552, 962, '🖍️', 28);

  return svgPage(s);
}

function answerPage(items, title, single) {
  beginArt(false);
  let s = R(18, 12, 764, 86, 26, '#e3f2fd', INK, 4) + BT(400, 72, title || 'ANSWERS', 46, '#ffd54f');

    s += T(400, 620, 'Did yours turn into ' + PICS[it.pi].name + '?', 26) + T(400, 660, 'Now color it in! 🖍️', 26);
  } else {
    items.forEach((it, k) => {

  $('bBookPrint').addEventListener('click', printBook);
  $('bBookClose').addEventListener('click', closeOv);
  $('bCertPrint').addEventListener('click', printCert);
  $('bCertClose').addEventListener('click', closeOv);
  ['book', 'cert'].forEach(id => $(id).addEventListener('click', e => { if (e.target === $(id)) closeOv(); }));
  window.addEventListener('afterprint', endPrint);
  window.addEventListener('keydown', onKey);
  startTick();
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
