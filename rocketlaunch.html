<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🚀 Rocket Launch</title>
<script src="touchpad.js?v=11"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Trebuchet MS", "Avenir Next", Arial, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  #gl { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #ui { position: fixed; inset: 0; pointer-events: none; transition: opacity .6s; }
  #ui.hidden { opacity: 0; }
  #ui.hidden * { pointer-events: none !important; }
  #top { position: absolute; top: 12px; left: 0; right: 0; display: flex; justify-content: space-between; align-items: flex-start; padding: 0 16px; gap: 10px; }
  #title { font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #idea { display: inline-block; margin-left: 10px; font-size: clamp(14px, 2vw, 20px); background: rgba(255,214,64,.92); color: #4a2c00; padding: 4px 12px; border-radius: 20px; vertical-align: middle; text-shadow: none; transform: rotate(-3deg); }
  #badges { margin-top: 6px; display: flex; gap: 8px; }
  #badges span { font-size: clamp(14px, 1.8vw, 18px); font-weight: 800; background: rgba(0,0,0,.4); padding: 4px 10px; border-radius: 14px; opacity: .55; text-shadow: none; }
  #badges span.done { opacity: 1; background: rgba(46,160,67,.85); }
  .pill { pointer-events: auto; border: 0; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font: inherit; font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; padding: 10px 18px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 2px rgba(255,255,255,.25) inset; }
  .pill:active { transform: scale(.95); }
  #rightBtns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
  #bottom { position: absolute; bottom: 12px; left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
  #step { font-size: clamp(18px, 2.6vw, 26px); font-weight: 900; text-shadow: 0 2px 10px rgba(0,0,0,.9); text-align: center; }
  #btns { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; max-width: 980px; }
  .big { pointer-events: auto; border: 0; border-radius: 22px; min-width: 120px; padding: 10px 18px; font: inherit; font-size: clamp(17px, 2.1vw, 22px); font-weight: 900; color: #fff; background: rgba(0,0,0,.5); cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 2px rgba(255,255,255,.3) inset; display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .big .e { font-size: clamp(28px, 3.6vw, 40px); line-height: 1.1; }
  .big small { font-size: 13px; font-weight: 700; opacity: .85; }
  .big.on { background: rgba(255,214,64,.95); color: #4a2c00; box-shadow: 0 0 22px rgba(255,214,64,.6); }
  .big:active { transform: scale(.95); }
  .big.glow { background: linear-gradient(135deg,#ff6d00,#ffca28); color: #3a1600; font-size: clamp(22px, 3vw, 32px); padding: 14px 30px; animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 0%,100% { box-shadow: 0 0 14px rgba(255,170,60,.55), 0 0 0 3px rgba(255,255,255,.5) inset; } 50% { box-shadow: 0 0 46px rgba(255,190,80,1), 0 0 0 3px rgba(255,255,255,.9) inset; } }
  .big.done { background: rgba(46,160,67,.8); }
  #lights { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  .light { display: flex; align-items: center; gap: 8px; background: rgba(0,0,0,.5); border-radius: 16px; padding: 8px 12px; font-weight: 800; font-size: clamp(14px, 1.7vw, 18px); }
  .light i { width: 22px; height: 22px; border-radius: 50%; background: #5a1a1a; box-shadow: inset 0 2px 4px rgba(0,0,0,.6); transition: all .3s; }
  .light.ok i { background: #3dff6b; box-shadow: 0 0 14px #3dff6b, inset 0 -2px 4px rgba(0,80,0,.5); }
  #bar { width: min(80vw, 420px); height: 22px; border-radius: 12px; background: rgba(0,0,0,.5); overflow: hidden; box-shadow: 0 0 0 2px rgba(255,255,255,.3) inset; }
  #bar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg,#b3e5fc,#e1f5fe); }
  #fact { max-width: min(92vw, 760px); text-align: center; font-size: clamp(14px, 1.8vw, 18px); background: rgba(0,0,0,.45); padding: 8px 16px; border-radius: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #count { position: fixed; top: 24%; left: 50%; transform: translate(-50%,-50%); font-size: clamp(50px, 10vw, 130px); font-weight: 900; text-shadow: 0 4px 40px rgba(0,0,0,.9), 0 0 30px rgba(255,180,80,.5); pointer-events: none; opacity: 0; white-space: nowrap; }
  #count.pop { animation: pop 1s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: translate(-50%,-50%) scale(1.5); } 20% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 80% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-50%) scale(.9); } }
  #cap { position: fixed; top: 24%; left: 50%; transform: translateX(-50%); font-size: clamp(22px, 4vw, 42px); font-weight: 900; text-shadow: 0 3px 24px rgba(0,0,0,.95); opacity: 0; transition: opacity .7s; pointer-events: none; text-align: center; width: 92vw; }
  #cap.show { opacity: 1; }
  #prize { position: fixed; top: 22%; left: 50%; transform: translateX(-50%) scale(.6); background: linear-gradient(135deg,#ffe082,#ffb300); color: #4a2c00; font-size: clamp(20px, 3.5vw, 32px); font-weight: 900; padding: 16px 28px; border-radius: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.5); opacity: 0; transition: all .6s; pointer-events: none; text-align: center; z-index: 4; }
  #prize.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #oops { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; font-size: 26px; padding: 30px; background: #123; }
  @media (max-width: 700px) { .big { min-width: 90px; padding: 8px 10px; } .big small { display: none; } #badges { display: none; } }
</style>

<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="top">
    <div>
      <div id="title">🚀 Rocket Launch <span id="idea">💡 Ben's idea!</span></div>
      <div id="badges"><span id="b_moon">🌕 Moon</span><span id="b_iss">🛰️ Station</span><span id="b_mars">🔴 Mars</span></div>
    </div>
    <div id="rightBtns">
      <button class="pill" id="soundBtn">🔈 Sound off</button>
      <button class="pill" id="hideBtn">🙈 Hide buttons</button>
    </div>
  </div>
  <div id="bottom"><div id="step"></div><div id="btns"></div><div id="fact"></div></div>

<script>
'use strict';
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- facts (all TRUE, checked) ----------
const FACTS = {
  rocket: 'The Saturn V moon rocket was 363 feet tall, taller than the Statue of Liberty! It is still one of the most powerful rockets ever flown.',
  booster: 'Some modern rocket boosters fly back after launch and land standing up on their legs, so they can be used again and again!',
  robo: 'Robo\'s rocket has fins, just like real early rockets. Fins help a rocket fly straight, like the feathers on an arrow.',
  fuel: 'Liquid oxygen is super cold: about 297 degrees below zero (Fahrenheit)! It makes frost on the rocket, and white vapor puffs out.',
  check: 'Before launch, the team checks the weather, the engines, the fuel and the radios. Everyone has to say "GO!"',
  moon: 'It takes about 3 days to fly to the Moon. Twelve astronauts have walked on the Moon!',
  iss: 'The Space Station is about as big as a football field, and it flies all the way around Earth about every 90 minutes!',
  mars: 'A trip to Mars takes about 7 months! Mars looks red because its dust has rusty iron in it.',
  count: 'Rockets often launch over the ocean toward the east. Earth spins that way, so it gives the rocket a free push!',
  lift: 'Launch pads spray huge amounts of water under the rocket. It soaks up the noise and turns into giant white clouds of steam!',
  orbit: 'Rockets go about 17,500 mph to stay in orbit around Earth. That is fast enough to cross the USA in about 10 minutes!',
  space: 'In space there is no air, so the sky looks black even in the daytime, and sound cannot travel. Space is silent!',
  stage: 'Rockets drop their empty stages to get lighter. A lighter rocket can go faster and higher!',
  fairing: 'The nose cone is called a fairing. It protects the spacecraft from the air, then opens once the rocket is high above most of the air.',
  moonland: 'The Moon has no wind, so astronaut footprints can stay there for a very, very long time! The Moon\'s gravity is only about 1/6 of Earth\'s.',
  dock: 'Spacecraft dock very slowly, even slower than you walk, so they touch together gently.',
  marsland: 'The Perseverance rover used a parachute 70 feet wide to slow down in Mars\'s thin air. On Mars, sunsets look blue!'
};
// ---------- 3D engine ----------
const cv = document.getElementById('gl');
let renderer = null;
try { renderer = new THREE.WebGLRenderer({ canvas: cv, antialias: false, powerPreference: 'high-performance' }); } catch (_) { renderer = null; }
const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0 || /[?&]touch=1/.test(location.search);
let scale = Math.min(window.devicePixelRatio || 1, 1.5) * (isTouch ? 0.75 : 1);
const W2 = renderer && renderer.capabilities.isWebGL2;
const HDR = !!(renderer && W2 && (renderer.extensions.has('EXT_color_buffer_float') || renderer.extensions.has('EXT_color_buffer_half_float')));
let rt = null;
function makeRT(w, h) {
  const o = { type: HDR ? THREE.HalfFloatType : THREE.UnsignedByteType, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: true };
  const r = (W2 && THREE.WebGLMultisampleRenderTarget) ? new THREE.WebGLMultisampleRenderTarget(w, h, o) : new THREE.WebGLRenderTarget(w, h, o);
  if (r.samples !== undefined) r.samples = isTouch ? 2 : 4;
  return r;
}
if (renderer) {
  renderer.toneMapping = THREE.NoToneMapping; renderer.outputEncoding = THREE.LinearEncoding;
  renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  renderer.setPixelRatio(1);
}
// final "film camera" pass: heat shimmer, glow, ACES film curve, vignette, grain, white-out
const post = {
  scene: new THREE.Scene(), cam: new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1),
  mat: new THREE.ShaderMaterial({
    uniforms: { tD: { value: null }, uRes: { value: new THREE.Vector2(1, 1) }, uT: { value: 0 }, uWhite: { value: 0 }, uShim: { value: 0 },
      uA: { value: new THREE.Vector2() }, uB: { value: new THREE.Vector2() }, uW: { value: .05 }, uExp: { value: 1 }, uHDR: { value: HDR ? 1 : 0 } },
    vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.,1.); }',
    fragmentShader: `
      uniform sampler2D tD; uniform vec2 uRes, uA, uB; uniform float uT, uWhite, uShim, uW, uExp, uHDR; varying vec2 vUv;
      float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
      void main(){
        vec2 uv=vUv, asp=vec2(uRes.x/uRes.y,1.);
        vec2 pa=(uv-uA)*asp, ba=(uB-uA)*asp; float h=clamp(dot(pa,ba)/max(dot(ba,ba),1e-6),0.,1.);
        float d=length(pa-ba*h); float m=uShim*smoothstep(uW*(1.+h*1.5), 0., d)*smoothstep(0.,.08,h);
        uv+=m*.006*vec2(sin(uv.y*160.-uT*31.+sin(uv.x*70.+uT*3.)*2.), cos(uv.x*130.+uT*27.+uv.y*40.));
        vec3 c=min(texture2D(tD,uv).rgb, vec3(64.));
        vec3 b=texture2D(tD,uv,2.5).rgb*.45+texture2D(tD,uv,4.5).rgb*.35+texture2D(tD,uv,6.5).rgb*.3;
        c+=max(b-vec3(1.3),0.)*.5*uHDR;
        c*=uExp; c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14);
        c=pow(clamp(c,0.,1.), vec3(1./2.2)); c=mix(c, c*c*(3.-2.*c), .35);
        vec2 q=vUv-.5; c*=1.-.32*pow(length(q*vec2(1.3,1.)*1.25),2.4);
        c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/80.;
        c=mix(c, vec3(1.), uWhite);
        gl_FragColor=vec4(c,1.);
      }`,
    depthTest: false, depthWrite: false
  })
};
post.scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), post.mat));
function resize() {
  if (!renderer) return;
  const w = Math.max(2, Math.round(innerWidth * scale)), h = Math.max(2, Math.round(innerHeight * scale));
  renderer.setSize(w, h, false); cv.style.width = '100vw'; cv.style.height = '100vh';
  if (rt) rt.dispose(); rt = makeRT(w, h); post.mat.uniforms.uRes.value.set(w, h);
  if (camera) { camera.aspect = w / h; camera.updateProjectionMatrix(); }
}
let camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.5, 60000);
// ---------- shared GLSL: noise + sky ----------
const GLN = `
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<5;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*vnoise(p); p=mat2(1.6,1.2,-1.2,1.6)*p+vec2(3.1,1.7); a*=.5; } return s; }
`;
const GLSKY = `
uniform vec3 uSun; uniform float uAlt;
vec3 skyCol(vec3 d){
  float y=d.y;
  vec3 zen=mix(vec3(.05,.19,.56), vec3(.0,.003,.02), uAlt);
  vec3 hor=mix(vec3(.46,.62,.82), vec3(.012,.035,.11), uAlt);
  vec3 c=mix(hor, zen, pow(clamp(y,0.,1.),.5));
  if(y<0.) c=mix(hor, hor*vec3(.75,.85,.95), clamp(-y*6.,0.,1.));
  float s=max(dot(d,uSun),0.);
  c+=vec3(1.,.82,.6)*(pow(s,6.)*.35*(1.-uAlt*.6)+pow(s,60.)*.5);
  c+=vec3(1.,.95,.85)*smoothstep(.9994,.9997,s)*40.;
  return c;
}
`;
const SUN = new THREE.Vector3(-0.72, 0.42, 0.55).normalize();
function skyMat(stars) {
  return new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false, fog: false,
    uniforms: { uSun: { value: SUN }, uAlt: { value: 0 }, uT: { value: 0 }, uCloud: { value: 1 } },
    vertexShader: 'varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }',
    fragmentShader: GLN + GLSKY + `
      uniform float uT, uCloud; varying vec3 vD;
      void main(){
        vec3 d=normalize(vD); vec3 c=skyCol(d);
        // a layer of fluffy clouds, far away near the horizon
        if(d.y>0.0 && uCloud>0.){
          vec2 p=d.xz/(d.y+.06)*1.4+vec2(uT*.004,0.);
          float n=fbm(p*1.3); float cl=smoothstep(.52,.75,n)*smoothstep(0.,.06,d.y)*uCloud;
          float lit=.75+.5*clamp(fbm3(p*1.3+uSun.xz*.2)-n+.5,0.,1.);
          c=mix(c, vec3(1.,.97,.93)*lit*.95, cl*.8);
        }
        ${stars ? `
        if(uAlt>.05){ vec3 p=d*420.; vec3 id=floor(p); vec3 f=fract(p)-.5;
          float r=h21(id.xy+id.z*17.31); if(r>.86){ float sd=length(f.xy-(h22(id.yz)-.5)*.5);
            float b=smoothstep(.22,0.,sd)*(.4+3.*pow(h21(id.zx),5.)); c+=vec3(.85,.9,1.)*b*smoothstep(.05,.8,uAlt)*.8; } }` : ''}
        gl_FragColor=vec4(c,1.);
      }` });
}
// ocean: moving waves, sky reflection and sun glitter
function oceanMat() {
  return new THREE.ShaderMaterial({ fog: false,
    uniforms: { uSun: { value: SUN }, uAlt: { value: 0 }, uT: { value: 0 } },
    vertexShader: 'varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }',
    fragmentShader: GLN + GLSKY + `
      uniform float uT; varying vec3 vW;
      float wav(vec2 p){ return fbm3(p*.045+vec2(uT*.03,uT*.018))*1.0+vnoise(p*.21+vec2(-uT*.12,uT*.07))*.28+vnoise(p*.8+vec2(uT*.3,-uT*.2))*.07; }
      void main(){
        vec3 V=cameraPosition-vW; float dist=length(V); V/=dist;
        vec2 p=vW.xz; float e=.6+dist*.004;
        float h0=wav(p), hx=wav(p+vec2(e,0.)), hz=wav(p+vec2(0.,e));
        float k=mix(2.2,.4,clamp(dist/6000.,0.,1.));
        vec3 N=normalize(vec3(-(hx-h0)/e*k, 1., -(hz-h0)/e*k));
        vec3 R=reflect(-V,N); R.y=abs(R.y);
        float fr=.02+.98*pow(1.-max(dot(N,V),0.),5.);
        vec3 deep=vec3(.006,.04,.07)*(.6+.8*max(uSun.y,0.));
        vec3 c=mix(deep, skyCol(R), fr);
        float sp=pow(max(dot(R,uSun),0.),300.)*30.+pow(max(dot(R,uSun),0.),40.)*.4;
        c+=vec3(1.,.9,.75)*sp;
        float shore=smoothstep(60.,0.,abs(vW.z+300.));
        c=mix(c, vec3(.75,.85,.82), shore*smoothstep(.45,.6,vnoise(p*.08+vec2(0.,uT*.25)))*.6);
        vec3 fogc=skyCol(normalize(vec3(-V.x,.02,-V.z)));
        c=mix(c, fogc, 1.-exp(-dist*.00012));
        gl_FragColor=vec4(c,1.);
      }` });
}
// a canvas texture painted like scrubby Florida coast land around the pad
function landTexture() {
  const S = 1024, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#6f7a48'; g.fillRect(0, 0, S, S);
  let seed = 7; const R = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 9000; i++) {
    const x = R() * S, y = R() * S, r = 2 + R() * 14 * R();
    const k = R(); g.fillStyle = k < .35 ? 'rgba(70,86,40,.45)' : k < .6 ? 'rgba(128,128,78,.35)' : k < .8 ? 'rgba(52,66,34,.5)' : 'rgba(150,140,100,.25)';
    g.beginPath(); g.arc(x, y, r, 0, 7); g.fill();
  }
  g.fillStyle = 'rgba(44,72,70,.9)'; g.beginPath(); g.ellipse(250, 420, 120, 40, .3, 0, 7); g.fill();   // a little lagoon
  g.fillStyle = 'rgba(70,98,92,.6)'; g.beginPath(); g.ellipse(250, 420, 132, 50, .3, 0, 7); g.fill();
  // sandy beach + surf at the top edge (the coast)
  const sg = g.createLinearGradient(0, 0, 0, 34); sg.addColorStop(0, '#e8e0c8'); sg.addColorStop(.6, '#d9cba4'); sg.addColorStop(1, 'rgba(160,150,100,0)');
  g.fillStyle = sg; g.fillRect(0, 0, S, 34);
  // crawler road + service roads
  g.strokeStyle = '#a49f92'; g.lineWidth = 14; g.beginPath(); g.moveTo(512, 128); g.lineTo(512, 600); g.quadraticCurveTo(512, 760, 300, 860); g.lineTo(-20, 1000); g.stroke();
  g.strokeStyle = 'rgba(80,80,80,.5)'; g.lineWidth = 4; g.beginPath(); g.moveTo(512, 128); g.lineTo(800, 128); g.lineTo(1030, 300); g.stroke();
  g.beginPath(); g.moveTo(512, 300); g.lineTo(200, 300); g.lineTo(140, 200); g.stroke();
  // concrete apron around the pad (pad sits at canvas 512,128)
  g.fillStyle = '#b8b4aa'; g.beginPath();
  for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2 + Math.PI / 8; g.lineTo(512 + Math.cos(a) * 46, 128 + Math.sin(a) * 46); } g.fill();
  g.fillStyle = 'rgba(60,60,60,.35)'; for (let i = 0; i < 400; i++) { g.fillRect(512 - 46 + R() * 92, 128 - 46 + R() * 92, 2, 2); }
  const t = new THREE.CanvasTexture(c); t.anisotropy = 8; t.encoding = THREE.sRGBEncoding; return t;
}
function scrubTexture() {
  const S = 256, c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d');
  g.fillStyle = '#6c7746'; g.fillRect(0, 0, S, S);
  for (let i = 0; i < 1400; i++) { const k = Math.random(); g.fillStyle = k < .5 ? 'rgba(62,80,36,.5)' : 'rgba(130,128,80,.3)'; g.beginPath(); g.arc(Math.random() * S, Math.random() * S, 1 + Math.random() * 6, 0, 7); g.fill(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(160, 80); t.anisotropy = 8; t.encoding = THREE.sRGBEncoding; return t;
}
function noiseTex(S, fn) {
  const c = document.createElement('canvas'); c.width = c.height = S; const g = c.getContext('2d'); fn(g, S);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding; t.anisotropy = 8; return t;
}
// ---------- materials ----------
