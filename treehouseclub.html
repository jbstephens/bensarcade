<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🌳 The Treehouse Club</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; margin: 0; }
  body { background: #2a1c12; display: flex; align-items: center; justify-content: center; overflow: hidden;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; }
  canvas { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 16px; touch-action: none; }
  #cardPrint { display: none; }
  @media print {
    @page { size: letter; margin: 0.5in; }
    html, body { height: auto; background: #fff !important; display: block; overflow: visible; }
    body > *:not(#cardPrint) { display: none !important; }
    body > #cardPrint { display: block !important; }
  }
  #cardPrint .cpPage { font-family: "Trebuchet MS", "Chalkboard SE", Arial, sans-serif; color: #000; background: #fff; text-align: center; }
  #cardPrint h1 { font-size: 26pt; margin: 0 0 6pt; }
  #cardPrint .sub { font-size: 14pt; margin: 0 0 14pt; }
  #cardPrint img { display: block; margin: 0 auto 14pt; width: 5in; height: auto; border: 2px dashed #888; }
  #cardPrint .foot { font-size: 11pt; margin-top: 8pt; }
</style>
</head>
<body>
<canvas id="c" width="960" height="540"></canvas>
<div id="cardPrint"></div>
<script>
// 🌳 THE TREEHOUSE CLUB (💡 Ben's idea: a secret Playhouse/Treehouse Club up in a big tree where all his characters hang out!)
// Tap a friend to chat (and ask them questions). Club stuff: a secret-password door, a membership card to print,
// the club rules board, a snack table, a periscope that looks out at the Game Factory world, and a hidden trapdoor.
// Trophy 'treehouseClub' after chatting with 6 different friends. Save: localStorage 'gfTreehouseClub'.
// All sounds are soft (one quiet volume knob). Talking uses the browser voice at rate 0.9.
const C = document.getElementById('c'), W = 960, H = 540;
let ctx = C.getContext('2d');
let frame = 0, PRINTING = false;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (same as the movies + the Cozy Corner) ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  if (Array.isArray(r)) { if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); return; }
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function heartPath(x, y, s) {                            // (from Robo Jump 13: Pink Robo's chest heart)
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
  ctx.closePath();
}
function poly(pts, c, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
  for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]);
  ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw == null ? 3 : lw; ctx.stroke(); }
}
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(40,20,10,.85)'; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function plain(str, x, y, size, color = '#3e2723', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#000'; ctx.fillText(str, x, y); }
function glow(x, y, r, col, a = 1) {                  // soft round light
  if (PRINTING) return; r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function drawStar(x, y, r, fill, rot = 0) { star(x, y, r, fill, rot, 5, 0.45); }
function twinkle(x, y, r, a = 1, col = '#fff8d0') { if (PRINTING) return; ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore(); }
function wrap(s, maxW) { const out = []; let cur = ''; for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; } if (cur) out.push(cur); return out; }
// ---------- SOFT sounds: everything goes through one quiet volume knob ----------
let actx = null, master = null, soundOn = true;
function audio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.2; master.connect(actx.destination); }
    if (actx.state !== 'running') actx.resume();
  } catch (_) {}
  return actx;
}
function softNote(f, d = 0.5, v = 0.05, when = 0, type = 'sine') {
  if (!soundOn) return; const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + d + 0.05);
}
const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.4, 0.05); }
function knock() { softNote(180, 0.12, 0.08, 0, 'triangle'); softNote(170, 0.12, 0.08, 0.18, 'triangle'); }
function chord(base = 523) { softNote(base, 0.9, 0.045); softNote(base * 1.26, 0.9, 0.04, 0.15); softNote(base * 1.5, 1.2, 0.04, 0.3); }
function creak() { softNote(140, 0.5, 0.03, 0, 'triangle'); softNote(120, 0.5, 0.025, 0.15, 'triangle'); }
let talkingNow = false;
function voice(line) {
  try { if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’:-]/g, '')); u.rate = 0.9; u.pitch = 1.1; u.volume = 0.8;
    u.onstart = () => { talkingNow = true; }; u.onend = u.onerror = () => { talkingNow = false; };
    speechSynthesis.speak(u); } catch (_) {}
}
// ---------- save ----------
const SAVE_KEY = 'gfTreehouseClub';
let SAVE = { chatted: {}, pw: null, card: 'Ben', buddy: 'robo', snacks: 0, trophy: 0, trapdoor: 0 };
try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object') SAVE = Object.assign(SAVE, s, { chatted: Object.assign({}, s.chatted || {}) }); } catch (_) {}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); } catch (_) {} }
let banner = 0;
const chatCount = () => Object.keys(SAVE.chatted).length;
function markChat(who) {
  if (!SAVE.chatted[who]) { SAVE.chatted[who] = 1; save(); }
  if (chatCount() >= 6 && !SAVE.trophy) { SAVE.trophy = 1; save(); trophy('treehouseClub'); banner = 1; setTimeout(() => chord(659), 400); }
}
</script>
<script>
// =====================================================================
// 🤖 ROBO + 🧹 DUSTY + 👑 KING GLOOP: copied EXACTLY from "Robo: The Beginning" (robomovie.html)
// =====================================================================
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)
    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    const lit = pose === 'off' ? 0.25 : 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0);
    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);
      const ey = -29.5;
      if (o.dizzy) {                                   // 💫 swirly dizzy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.1;
        for (const ex of [-3, 9]) { ctx.beginPath(); for (let a = 0; a < 12; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.3, ey + Math.sin(a + t * 0.2) * a * 0.3); ctx.stroke(); }
      } else if (pose === 'happy' || o.happy) {        // ^ ^ happy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5, talk = o.mouth ? 0.85 + 0.15 * Math.sin(t * 0.6) : 1;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      if (o.mouth) { ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, -25); ctx.lineTo(1 + 2 + Math.abs(Math.sin(t * 0.5)) * 3, -25); ctx.stroke(); }
      ctx.restore();
    }
  }
  if (o.wave) {                                        // 👋 a little waving hand
    const a = Math.sin(t * 0.3) * 0.5;
    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();
  }
  ctx.restore();
  if (o.dizzy) for (let i = 0; i < 3; i++) { const a = t * 0.08 + i * 2.1; star(x + Math.cos(a) * 22 * s / 2.6, y - 118 * s / 2.6 + Math.sin(a) * 6, 7, '#ffd54f', a); }
}
// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,
// a fluffy pink duster on a springy stick, a twirly brush skirt and two little wheels.
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');                  // the twirly brush skirt
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;   // the springy duster
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// 👑 KING GLOOP (same look as Robo Jump: a PURPLE goo blob, gold crown, big white eyes, grumpy eyebrows)
// o = { s, face, t, pose, mouth, grumpy, happy, dizzy, hit, gear (carrying the Golden Gear) }
const GLOOP = { body: '#7c4dff', dark: '#651fff', crown: '#ffd740', mouth: '#311b92' };
function drawGloop(x, y, o = {}) {
  const s = o.s || 1.5, f = o.face || -1, t = o.t || frame, pose = o.pose || 'idle';
  const hop = pose === 'walk' || pose === 'run' ? Math.abs(Math.sin(t * (pose === 'run' ? 0.35 : 0.2))) : 0;
  const hit = (o.hit || 0) / 30;
  let wob = Math.sin(t * 0.15) * 3 + hit * 14 - hop * 5;
  if (pose === 'happy') wob = Math.sin(t * 0.3) * 6;
  ctx.save(); ctx.translate(x, y - hop * 10); ctx.scale(s, s);
  const w = 96 + wob, h = 84 - wob, top = -h;
  ellipse(0, 1 + hop * 10 / s, w * 0.55, 6, 'rgba(0,0,0,.18)');
  ctx.fillStyle = GLOOP.dark; rrect(-w / 2 - 2, top + 2, w + 4, h, 42); ctx.fill();
  ctx.fillStyle = GLOOP.body; rrect(-w / 2, top, w, h - 2, 40); ctx.fill();
  for (let i = 0; i < 5; i++) {                       // gooey drips
    const dx = -w / 2 + 12 + i * (w - 24) / 4, dl = 3 + ((i * 7 + Math.floor(t / 20)) % 4) * 1.5;
    ellipse(dx, -2 + dl * 0.4, 5, dl, GLOOP.body);
  }
  ellipse(-w / 2 + 25, top + 22, 12, 7, 'rgba(255,255,255,.35)', -0.5);
  ctx.fillStyle = GLOOP.crown; ctx.beginPath(); ctx.moveTo(-25, top + 6);   // 👑 crown
  for (let i = 0; i <= 4; i++) ctx.lineTo(-25 + i * 12.5, top - (i % 2 ? 4 : 22));
  ctx.lineTo(25, top + 6); ctx.closePath(); ctx.fill();
  circle(0, top - 4, 3, '#e91e63'); circle(-12.5, top, 2.2, '#40c4ff'); circle(12.5, top, 2.2, '#40c4ff');
  const look = f * 4;
  for (const ex of [-18, 18]) {
    circle(ex, top + 32, 11, '#fff');
    if (o.dizzy) { ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); for (let a = 0; a < 13; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.6, top + 32 + Math.sin(a + t * 0.2) * a * 0.6); ctx.stroke(); }
    else if (o.happy && !o.mouth) { ctx.strokeStyle = '#000'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(ex, top + 35, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    else { const bl = (t % 190) < 6 ? 1 : 5; ellipse(ex + look, top + 34, 5, bl, '#000'); if (bl > 2) circle(ex + look + 1.5, top + 32, 1.6, '#fff'); }
  }
  if (o.grumpy && !o.happy) {                          // grumpy eyebrows
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(-30, top + 16); ctx.lineTo(-8, top + 24); ctx.moveTo(30, top + 16); ctx.lineTo(8, top + 24); ctx.stroke();
  }
  const mo = o.mouth ? 0.6 + 0.4 * Math.abs(Math.sin(t * 0.45)) : 0;
  if (o.happy) {
    ctx.fillStyle = GLOOP.mouth; ctx.beginPath(); ctx.moveTo(-16, top + 54); ctx.quadraticCurveTo(0, top + 72 + mo * 6, 16, top + 54); ctx.closePath(); ctx.fill();

    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(480, 70); ctx.lineTo(480, 470); ctx.moveTo(280, 270); ctx.lineTo(680, 270); ctx.stroke();
    text('🔭 Periscope', 820, 40, 30, '#b0bec5');
    ctx.font = 'bold 20px "Trebuchet MS", Arial'; const ls = wrap(scope.msg, 200); ls.forEach((l, i) => text(l, 830, 120 + i * 28, 18, '#e0f7fa'));
    button(30, 230, 120, 90, '◀', '#546e7a', () => { scope.want = Math.max(300, scope.want - 400); plip(); }, 40);
    button(810, 400, 120, 90, '▶', '#546e7a', () => { scope.want = Math.min(WORLD_W - 150, scope.want + 400); plip(); }, 40);
    backBtn();
  },
  tap(x, y) {
    if (Math.hypot(x - 480, y - 270) > 220) return;
    const wx = scope.x + (x - W / 2) / SCOPE_K; let best = SIGHTS[0];
    for (const s of SIGHTS) if (Math.abs(s.x - wx) < Math.abs(best.x - wx)) best = s;
    scope.msg = best.say; voice(best.say); scope.want = best.x; softNote(784, 0.3, 0.04);
  },
};
// =====================================================================
// 🤫 THE HIDDEN TRAPDOOR: a tiny surprise every time you open it
// =====================================================================
const SURPRISES = [
  { kind: 'mouse', say: 'A teeny tiny mouse in a teacup! Squeak! It says: Hi Ben, I am the smallest club member!' },
  { kind: 'chest', say: 'A tiny treasure chest with a golden club star inside! It is for you, Ben!' },
  { kind: 'bird', say: 'A baby bird in a cozy nest! Tweet tweet! It is saying good morning!' },
  { kind: 'robo', say: 'A teeny tiny toy Robo! Press the button and it says: beep!' },
  { kind: 'note', say: 'A secret note! It says: Ben is the best club boss ever!' },
  { kind: 'paw', say: 'A twinkly star paw print from Tiger! It glows so softly.' },
];
let trap = { open: 0, i: 0, shown: 0 };
function newSurprise() { let i; do i = Math.floor(Math.random() * SURPRISES.length); while (i === trap.i && SURPRISES.length > 1); trap.i = i; trap.open = 0; trap.shown = 0; creak(); }
function drawSurprise(k, x, y, t) {
  if (k === 'mouse') {
    ellipse(x, y + 18, 50, 12, '#90caf9'); roundRect(x - 44, y - 16, 88, 36, [4, 4, 30, 30], '#e3f2fd'); ctx.strokeStyle = '#e3f2fd'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(x + 50, y, 14, -1.2, 1.2); ctx.stroke();
    const b = Math.sin(t * 0.15) * 3; ellipse(x, y - 24 + b, 22, 18, '#bdbdbd'); circle(x - 18, y - 42 + b, 11, '#bdbdbd'); circle(x + 18, y - 42 + b, 11, '#bdbdbd'); circle(x - 18, y - 42 + b, 6, '#f8bbd0'); circle(x + 18, y - 42 + b, 6, '#f8bbd0');
    circle(x - 7, y - 26 + b, 3, '#000'); circle(x + 7, y - 26 + b, 3, '#000'); circle(x, y - 18 + b, 3.5, '#f06292');
    ctx.save(); ctx.translate(x + 26, y - 30 + b); ctx.rotate(Math.sin(t * 0.25) * 0.5); ellipse(0, -8, 4, 9, '#bdbdbd'); ctx.restore();
  } else if (k === 'chest') {
    roundRect(x - 50, y - 30, 100, 56, 8, '#8d5a34'); ctx.fillStyle = '#ffca28'; ctx.fillRect(x - 50, y - 6, 100, 6); roundRect(x - 8, y - 12, 16, 18, 3, '#ffca28');
    ctx.save(); ctx.translate(x, y - 30); ctx.rotate(-0.5); roundRect(-50, -26, 100, 26, [14, 14, 0, 0], '#a0683c'); ctx.restore();
    glow(x, y - 50, 70, 'rgba(255,215,64,.7)'); star(x, y - 56 + Math.sin(t * 0.1) * 4, 24, '#ffd740', t * 0.02);
  } else if (k === 'bird') {
    ellipse(x, y + 10, 60, 22, '#8d6e63'); ctx.strokeStyle = '#6d4c41'; ctx.lineWidth = 3; for (let j = 0; j < 8; j++) { ctx.beginPath(); ctx.moveTo(x - 58 + j * 15, y + 2); ctx.lineTo(x - 48 + j * 15, y + 24); ctx.stroke(); }
    const b = Math.abs(Math.sin(t * 0.12)) * 4; circle(x, y - 14 - b, 24, '#ffee58'); circle(x - 8, y - 20 - b, 3.5, '#000'); circle(x + 8, y - 20 - b, 3.5, '#000');
    poly([x - 6, y - 12 - b, x + 6, y - 12 - b, x, y - 2 - b - (t % 40 < 20 ? 4 : 0)], '#ff9800'); ellipse(x - 22, y - 10 - b, 8, 12, '#fdd835', 0.5 + Math.sin(t * 0.3) * 0.3);
  } else if (k === 'robo') { drawRobo(x, y + 26, { s: 1.2, pose: 'happy', wave: true }); }
  else if (k === 'note') {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-0.06); roundRect(-80, -50, 160, 100, 6, '#fffde7'); ctx.strokeStyle = '#90caf9'; ctx.lineWidth = 1.5;
    for (let j = 0; j < 4; j++) { ctx.beginPath(); ctx.moveTo(-70, -22 + j * 20); ctx.lineTo(70, -22 + j * 20); ctx.stroke(); }
    plain('Ben is the', 0, -20, 20, '#c62828'); plain('BEST club boss', 0, 4, 20, '#c62828'); plain('ever!', 0, 28, 20, '#c62828'); heart(56, 34, 12, '#ff5c8a'); ctx.restore();
  } else {
    glow(x, y - 10, 90, 'rgba(255,214,110,.75)', 0.7 + 0.3 * Math.sin(t * 0.06));
    ellipse(x, y, 20, 17, '#ffd54f'); for (let j = 0; j < 4; j++) { const a = -2.4 + j * 0.53; ellipse(x + Math.cos(a) * 30, y + Math.sin(a) * 28, 8, 10, '#ffd54f'); }
    for (let j = 0; j < 5; j++) twinkle(x + Math.cos(t * 0.03 + j * 1.26) * 60, y - 10 + Math.sin(t * 0.03 + j * 1.26) * 40, 7, 0.6 + 0.4 * Math.sin(t * 0.1 + j));
  }
}
SCREENS.trap = {
  start() { newSurprise(); SAVE.trapdoor = (SAVE.trapdoor || 0) + 1; save(); },
  draw() {
    drawTreehouse(false); ctx.fillStyle = 'rgba(20,10,4,.7)'; ctx.fillRect(0, 0, W, H);
    text('🤫 The Secret Trapdoor', 480, 40, 32, '#ffe082');
    trap.open = Math.min(1, trap.open + 0.025);
    const x = 480, y = 290;
    roundRect(x - 210, y - 150, 420, 300, 16, '#3b2212'); roundRect(x - 196, y - 136, 392, 272, 10, '#2a160a');   // the hole + secret cubby
    glow(x, y, 200, 'rgba(255,200,120,.35)', trap.open);
    if (trap.open > 0.6) { ctx.save(); ctx.globalAlpha = (trap.open - 0.6) / 0.4; ctx.translate(x, y + 10); ctx.scale(1.7, 1.7); drawSurprise(SURPRISES[trap.i].kind, 0, 0, frame); ctx.restore();
      if (!trap.shown) { trap.shown = 1; voice(SURPRISES[trap.i].say); chord(698); } }
    const lift = trap.open;                                                    // the hatch swings up
    ctx.save(); ctx.translate(x, y - 136); ctx.scale(1, 1 - lift * 1.9);
    roundRect(-196, 0, 392, 272, 8, '#8d5a34'); ctx.strokeStyle = 'rgba(60,30,10,.5)'; ctx.lineWidth = 3;
    for (let k = 1; k < 5; k++) { ctx.beginPath(); ctx.moveTo(-196 + k * 78, 4); ctx.lineTo(-196 + k * 78, 268); ctx.stroke(); }
    circle(0, 240, 14, '#ffd54f'); ctx.restore();
    if (trap.shown) { ctx.font = 'bold 22px "Trebuchet MS", Arial'; bubble(150, 446, SURPRISES[trap.i].say, 660, 19); }
    button(780, 14, 160, 54, '🎁 Another!', '#8e24aa', () => newSurprise(), 20);
    backBtn('🔒 Close');
  },
};
// =====================================================================
// 🔁 LOOP + TAPS
// =====================================================================
function loop() {
  frame++; hintT++; btns = [];
  try {
    if (screen === 'home') home(); else SCREENS[screen].draw();
    if (screen === 'home') button(W - 132, 0, 120, 30, soundOn ? '🔉 Sound' : '🔇 Quiet', '#5d3a22', () => { soundOn = !soundOn; if (!soundOn) try { speechSynthesis.cancel(); } catch (_) {} }, 15);
    if (banner) { banner++; const a = Math.min(1, banner / 20, (420 - banner) / 40); ctx.save(); ctx.globalAlpha = Math.max(0, a);
      roundRect(220, 190, 520, 140, 30, '#fff8e1'); text('🏆 Treehouse Club Trophy! 🏆', 480, 235, 34, '#ffb300'); text('You chatted with 6 club friends!', 480, 290, 22, '#ff80ab'); ctx.restore(); if (banner > 420) banner = 0; }
  } catch (err) { console.error(err); }
  requestAnimationFrame(loop);
}
const toXY = e => { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
C.addEventListener('pointerdown', e => {
  const [x, y] = toXY(e); audio();
  if (!saidHello) { saidHello = true; if (screen === 'home') { setHint('Welcome to the Treehouse Club, Ben!', false); voice('Welcome to the Treehouse Club, Ben! Tap a friend to chat.'); } }
  for (let i = btns.length - 1; i >= 0; i--) { const b = btns[i]; if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); return; } }
  if (screen === 'home') homeTap(x, y); else { const S = SCREENS[screen]; if (S && S.tap) S.tap(x, y); }
});
addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });
loop();
