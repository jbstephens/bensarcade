<script>
'use strict';
// ---------- shared shader bits (from Realism) ----------
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
// star colour from a 0..1 "temperature" (red dwarf -> sun -> blue giant)
vec3 starCol(float k){ return k<.5 ? mix(vec3(1.,.62,.38), vec3(1.,.95,.88), k*2.) : mix(vec3(1.,.95,.88), vec3(.62,.75,1.), (k-.5)*2.); }
// one layer of stars: point-spread "blobs" a pixel or two wide, twinkling
vec3 starLayer(vec2 p, float cell, float dens, float px, float seed, float tw){
  vec2 q=p/cell; vec2 id=floor(q); vec2 f=fract(q)-.5;
  float r=h21(id+seed); if(r>dens) return vec3(0);
  vec2 o=(h22(id+seed*1.3)-.5)*.6; float d=length(f-o)*cell/px;
  float m=pow(h21(id*1.71+seed), 6.);
  float twk=1.-tw+tw*(.55+.45*sin(uT*(1.5+4.*h21(id+9.1))+r*60.));
  float core=exp(-d*d*(1.6-m*.9)); float halo=exp(-d*.55)*m*.25;
  return starCol(h21(id*3.7+seed))*(core*(.25+2.8*m)+halo)*twk;
}
vec3 starfield(vec2 p, float px, float amt){
  vec3 c=starLayer(p, 26.*px, .55, px, 1., .5)*.55+starLayer(p+.13, 11.*px, .45, px, 31., .4)*.22;
  c+=starLayer(p+.37, 43.*px, .5, px, 7., .6);
  c+=starLayer(p+.71, 97.*px, .55, px, 13., .7)*1.5;
  return c*amt;
}
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;
// ---------- the tank behind the fish: water, light rays, back rocks, sand with caustics, the water's surface ----------
const TANK = `
uniform vec3 uMode;             // how much: day light, blue moonlight, glow light
uniform float uSandY, uSurfY;   // where the sand starts and where the water's surface is (in uv units)
float caustic(vec2 p, float t){
  p=mod(p*6.28318,6.28318)-250.; vec2 i=p; float c=1., inten=.005;
  for(int n=0;n<4;n++){
    float tt=t*(1.-(3.5/float(n+1)));
    i=p+vec2(cos(tt-i.x)+sin(tt+i.y), sin(tt-i.y)+cos(tt+i.x));
    c+=1./length(vec2(p.x/(sin(i.x+tt)/inten), p.y/(cos(i.y+tt)/inten)));
  }
  c/=4.; c=1.17-pow(c,1.4); return pow(abs(c),7.);
}
float rays(vec2 uv, float t){
  float a=(uv.x+.3)/(1.4-uv.y);
  float r=noise(vec2(a*12., t*.12))*.6+noise(vec2(a*27.+5., t*.2))*.4;
  return pow(r,3.)*smoothstep(-.5,.45,uv.y);
}
void main(){
  vec2 uv=(gl_FragCoord.xy-.5*uRes)/uRes.y; float px=1./uRes.y; float t=uT;
  float asp=uRes.x/uRes.y;
  float dayK=uMode.x, moonK=uMode.y, glowK=uMode.z;
  vec3 light=vec3(1.)*dayK+vec3(.22,.34,.62)*.55*moonK+vec3(.32,.16,.62)*.32*glowK;  // the lamp colour
  // water: brighter near the lamp at the top, deeper blue-green lower down
  vec3 col=mix(vec3(.02,.17,.24), vec3(.12,.48,.56), smoothstep(-.3,.45,uv.y));
  col*=.75+.25*fbm4(uv*2.+vec2(t*.01,0.));
  // the back wall: a far-away underwater rock scene, soft and blue
  float ridge=-.02+.12*fbm4(vec2(uv.x*1.4+3.,1.))+.05*sin(uv.x*2.3);
  if(uv.y<ridge){ float n=fbm4(uv*vec2(5.,7.)); col=mix(col, vec3(.04,.2,.25)*(.6+.6*n), .55*smoothstep(ridge,ridge-.03,uv.y)); }
  for(int i=0;i<7;i++){        // soft far plants swaying
    float fi=float(i), x0=(h11(fi*3.3)-.5)*asp*1.1, h=.18+.2*h11(fi*1.7);
    float y=uv.y-(uSandY+.02); if(y<0.||y>h) continue;
    float sw=sin(t*.6+fi+y*6.)*.02*y/h;
    float w=.012*(1.-y/h)+.004;
    float m=smoothstep(w,w*.4,abs(uv.x-x0-sw-sin(y*20.+fi)*.006));
    col=mix(col, vec3(.05,.22,.18), m*.45);
  }
  col+=vec3(.25,.45,.45)*caustic(uv*vec2(.9,1.4)+vec2(0.,t*.01), t*.4)*.18*smoothstep(-.1,.3,uv.y);
  // sand: a tilted floor, close at the bottom of the screen, far at the back
  float sy=uSandY+.012*sin(uv.x*3.+1.)+.008*sin(uv.x*7.);
  if(uv.y<sy){
    float z=clamp((sy-uv.y)/(sy+.5),0.,1.);          // 0 = back of the tank, 1 = right at the glass
    vec2 g=vec2(uv.x/(.55+.45*z), z*3.)*6.;
    float rip=sin(g.x*.9+fbm4(g*.3)*4.+g.y*1.6)*.5+.5;
    float grain=noise(g*vec2(9.,14.)), peb=smoothstep(.62,.7,noise(g*1.7+4.));
    vec3 sand=mix(vec3(.62,.55,.42), vec3(.82,.75,.6), rip*.45+grain*.4);
    sand=mix(sand, vec3(.42,.38,.33)*(.8+.4*grain), peb*.6);
    float cs=caustic(g*.09+vec2(t*.01,0.), t*.45)*1.4+caustic(g*.09+.3, t*.45+1.7)*.5;
    col=sand*(vec3(.30,.48,.52)+vec3(.9,1.,.95)*cs*.9*(.5+.5*rip))*(.65+.45*z);
    col=mix(col, vec3(.05,.22,.27), (1.-z)*.35);
    col*=1.-.35*smoothstep(.0,.03,sy-uv.y)*smoothstep(.06,.02,sy-uv.y)*0.;
  }
  // light rays coming down from the lamp
  col+=vec3(.5,.8,.8)*rays(uv,t)*.22*smoothstep(uSandY-.1,uSandY+.2,uv.y);
  // floating specks in the water
  vec2 p=uv*8.+vec2(t*.02,t*.015); vec2 id=floor(p); vec2 o=fract(p)-.5-(h22(id)-.5)*.7;
  col+=vec3(.7,.85,.85)*smoothstep(.06,.0,length(o))*step(.6,h21(id))*.12;
  // the water's surface seen from below, then the lid of the tank
  float sw=uSurfY+.006*sin(uv.x*9.+t*1.3)+.004*sin(uv.x*23.-t*2.);
  if(uv.y>sw-.05){
    float k=smoothstep(sw-.05,sw,uv.y);
    col+=vec3(.5,.75,.8)*k*(.3+.7*caustic(vec2(uv.x*.6,uv.y*3.)+t*.02,t*.6))*.6;
    col=mix(col, vec3(.85,.95,.95), smoothstep(px*2.,0.,abs(uv.y-sw))*.7);
  }
  if(uv.y>sw){ col=mix(vec3(.10,.13,.15), vec3(.03,.035,.04), smoothstep(sw,.5,uv.y)); col+=vec3(.2)*smoothstep(px*3.,0.,abs(uv.y-(sw+.012))); }
  col*=light;
  // glow light: a purple lamp glow from the top, and faint purple sand
  col+=vec3(.25,.08,.45)*glowK*(.06+.25*smoothstep(-.2,.5,uv.y))*step(uv.y,sw);
  gl_FragColor=vec4(finish(col*1.05,uv),1.);
}`;
</script>
<script>
'use strict';
// ---------- drawing realistic fish ----------
// Every fish is drawn facing right, centred on (0,0). Its body bends in a travelling wave so the tail swishes.
let g = null;                                              // the canvas we are drawing on
function cr(a, t) {                                        // smooth curve through the numbers in a, t = 0..1
  const n = a.length - 1, s = Math.max(0, Math.min(.9999, t)) * n, i = Math.floor(s), u = s - i;
  const p0 = a[Math.max(0, i - 1)], p1 = a[i], p2 = a[i + 1], p3 = a[Math.min(n, i + 2)];
  return p1 + .5 * u * (p2 - p0 + u * (2 * p0 - 5 * p1 + 4 * p2 - p3 + u * (3 * (p1 - p2) + p3 - p0)));
}
function Body(L, H, top, bot, ph, amp) {
  const b = { L, H, top, bot, ph };
  b.w = x => amp * L * Math.sin(ph - x / L * 5) * Math.pow(Math.max(0, .5 - x / L), 2);
  b.p = (t, f) => { const x = -L / 2 + t * L, y = f < 0 ? -f * -H * cr(top, t) : f * H * cr(bot, t); return [x, y + b.w(x)]; };   // f: -1 top edge .. 1 bottom edge
  b.path = () => { g.beginPath(); for (let i = 0; i <= 26; i++) { const q = b.p(i / 26, -1); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }
    for (let i = 26; i >= 0; i--) { const q = b.p(i / 26, 1); g.lineTo(q[0], q[1]); } g.closePath(); };
  b.tailA = () => Math.atan2(b.w(-L / 2) - b.w(-L * .38), L * .12);
  return b;
}
function shade(b, c1, c2, c3) {                            // body colours: back, side, belly
  const gr = g.createLinearGradient(0, -b.H, 0, b.H); gr.addColorStop(0, c1); gr.addColorStop(.5, c2); gr.addColorStop(1, c3);
  b.path(); g.fillStyle = gr; g.fill();
}
function gloss(b, k = .28) {                               // shiny light on the upper front, darker edges
  g.save(); b.path(); g.clip();
  let gr = g.createRadialGradient(b.L * .12, -b.H * .45, 0, b.L * .12, -b.H * .45, b.L * .55);
  gr.addColorStop(0, `rgba(255,255,255,${k})`); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(-b.L, -b.H * 2, b.L * 2, b.H * 4);
  gr = g.createRadialGradient(0, 0, b.H * .6, 0, 0, b.L * .62); gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(1, 'rgba(0,10,20,.35)'); g.fillStyle = gr; g.fillRect(-b.L, -b.H * 2, b.L * 2, b.H * 4);
  g.restore(); b.path(); g.strokeStyle = 'rgba(0,0,0,.22)'; g.lineWidth = Math.max(.6, b.L / 90); g.stroke();
}
function band(b, t0, t1, col, f0 = -1.05, f1 = 1.05) {      // a stripe across the body from t0 to t1
  g.beginPath(); for (let i = 0; i <= 6; i++) { const q = b.p(t0 + (t1 - t0) * i / 6, f0); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }
  for (let i = 6; i >= 0; i--) { const q = b.p(t0 + (t1 - t0) * i / 6, f1); g.lineTo(q[0], q[1]); } g.closePath(); g.fillStyle = col; g.fill();
}
function eye(b, t, f, r, iris = '#e8c060') {
  const [x, y] = b.p(t, f);
  g.beginPath(); g.arc(x, y, r, 0, 6.283); g.fillStyle = iris; g.fill();
  g.beginPath(); g.arc(x + r * .1, y, r * .62, 0, 6.283); g.fillStyle = '#060606'; g.fill();
  g.beginPath(); g.arc(x - r * .2, y - r * .3, r * .25, 0, 6.283); g.fillStyle = 'rgba(255,255,255,.9)'; g.fill();
}
function fin(pts, c1, c2, a = .85, rays = true) {          // a see-through fin with little bony rays
  g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1])); g.closePath();
  const xs = pts.map(q => q[0]), ys = pts.map(q => q[1]);
  const gr = g.createLinearGradient(xs[0], ys[0], xs[Math.floor(pts.length / 2)], ys[Math.floor(pts.length / 2)]);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.globalAlpha *= a; g.fillStyle = gr; g.fill();
  if (rays) { g.strokeStyle = 'rgba(0,0,0,.12)'; g.lineWidth = .7; g.beginPath(); const n = pts.length; for (let i = 1; i < n - 1; i++) { g.moveTo(pts[0][0], pts[0][1]); g.lineTo(pts[i][0], pts[i][1]); } g.stroke(); }
  g.globalAlpha /= a;
}
function smoothFin(pts, c1, c2, a = .85) {                 // a soft, curvy fin (goldfish and betta)
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]);
  for (let i = 1; i < pts.length - 1; i++) g.quadraticCurveTo(pts[i][0], pts[i][1], (pts[i][0] + pts[i + 1][0]) / 2, (pts[i][1] + pts[i + 1][1]) / 2);
  g.lineTo(pts[pts.length - 1][0], pts[pts.length - 1][1]); g.closePath();
  const gr = g.createLinearGradient(pts[0][0], pts[0][1], pts[Math.floor(pts.length / 2)][0], pts[Math.floor(pts.length / 2)][1]);
  gr.addColorStop(0, c1); gr.addColorStop(1, c2); g.globalAlpha *= a; g.fillStyle = gr; g.fill(); g.globalAlpha /= a;
}
// a tail fin fixed to the back of the body, turned by the body's swish
function tail(b, shape, size, c1, c2, a = .85, flutter = 0) {
  const [x0, y0] = b.p(0, 0), A = b.tailA(), L = b.L * size, ped = b.H * cr(b.top, 0);

  for (const d of deco) { if (d.t !== 'chest') continue; const S = scl(d.z), dx = d.x * VW, dy = baseY(d.z) - 20 * S; if (Math.abs(dx - x) < 50 * S && Math.abs(dy - y) < 40 * S) { d.open = T + 4;
    for (let k = 0; k < 18; k++) bubbles.push({ x: dx + (Math.random() - .5) * 40 * S, y: dy - 10 * S, r: 2 + Math.random() * 4, vy: 60 + Math.random() * 60, ph: Math.random() * 6, z: d.z + .01 }); Sound.chime(); say('💰 Treasure!'); return; } }
  ripples.push({ x, y, t: T }); Sound.tok();
  fish.forEach(f => { const mv = SP[f.k].move || 'swim'; if (mv === 'stick') return; const dx = f.x - x, dy = f.y - y, d = Math.hypot(dx, dy) || 1;
    if (d < 280 * K) { f.flee = 1 + Math.random() * .6; const sp = SP[f.k].sp * K * 3; f.vx = dx / d * sp; f.vy = mv === 'swim' || mv === 'hover' ? dy / d * sp * .6 : 0; f.tt = f.flee + .5 + Math.random();
      f.tx = VW * (.3 + Math.random() * .4); f.ty = VH * (.3 + Math.random() * .2); } });
  fact('Tapping the glass startles fish! They dart away, then come back when it is calm again.');
});
document.getElementById('hideBtn').addEventListener('click', e => { e.stopPropagation(); ui.classList.add('hidden'); });
document.addEventListener('pointerdown', e => { if (ui.classList.contains('hidden')) { e.preventDefault(); ui.classList.remove('hidden'); } });
const soundBtn = document.getElementById('soundBtn');
soundBtn.addEventListener('click', e => { e.stopPropagation(); const s = Sound.toggle(); soundBtn.textContent = s ? '🔊 Sound on' : '🔈 Sound off'; });
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') document.getElementById('bFeed').click(); else if (e.key === 'Escape') ui.classList.toggle('hidden'); });
addEventListener('load', () => {
  load(); resize(); fish.forEach(f => { f.x = VW * (.15 + Math.random() * .7); pickTarget(f); });
  document.getElementById('bLight').textContent = LIGHTS[light]; LK = [{ x: 1, y: 0, z: 0 }, { x: 0, y: 1, z: 0 }, { x: 0, y: 0, z: 1 }][light];
  setTab('fish'); updateCount(); fact(FACTS[0]); startEngine();
});
