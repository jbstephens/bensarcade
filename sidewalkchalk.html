<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🖍️ Sidewalk Chalk</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3f6d8 0 36px, #d3efc4 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #studio { position: absolute; inset: 0; display: flex; gap: 10px; padding: 10px; }
  #tools { width: 96px; flex: none; display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 6px; }
  .tool { font: inherit; font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 16px; box-shadow: 0 4px 0 #333;
    cursor: pointer; padding: 3px 2px; min-height: 64px; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #222; flex: none; }
  .tool i { font-style: normal; font-size: 30px; line-height: 1.05; }
  .tool span { font-size: 13px; }
  .tool:active { transform: translateY(3px); box-shadow: 0 1px 0 #333; }
  .tool.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 4px 0 #ff3d6e; }
  .tool.dim { opacity: .4; }
  .tool.sun.on { background: #fff3a0; border-color: #ff9800; box-shadow: 0 4px 0 #ff9800; }
  .tool.rain.on { background: #b3e5fc; border-color: #1e6bff; box-shadow: 0 4px 0 #1e6bff; }
  #board { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; }
  #cvWrap { flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  #cv { border: 5px solid #333; border-radius: 12px; box-shadow: 0 7px 0 #2e7d32; touch-action: none; cursor: crosshair; display: block; background: #fff; }
  #side { width: min(36vw, 390px); flex: none; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 0 4px 10px 0; }
  #side h1 { margin: 0; text-align: center; font-size: clamp(22px, 2.8vw, 34px); color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #ff6ec7; letter-spacing: 1px; }
  #help { font-size: 16px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 5px 8px; font-weight: bold; }
  .lbl { font-size: 18px; font-weight: bold; text-align: center; margin-bottom: -4px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px; padding: 6px 8px; cursor: pointer;
    box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; line-height: 1.1; }
  .three .btn { font-size: 16px; padding: 6px 4px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn.dim { opacity: .45; }
  .b-tpl { background: #c3a6ff; } .b-save { background: #8ef08e; } .b-gal { background: #ffd180; } .b-print { background: #9be3ff; }
  .b-no { background: #ffc2d6; } .b-back { background: #9be3ff; } .b-go { background: #ffe066; }
  #pal { display: grid; grid-template-columns: repeat(6, 1fr); gap: 7px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  .sw { aspect-ratio: 1; border-radius: 10px; border: 3px solid #333; cursor: pointer; min-height: 34px; position: relative; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  .hide { display: none !important; }
  .ov { position: fixed; inset: 0; background: rgba(20, 30, 70, .7); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1180px; max-height: 100%;
    display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3.2vw, 34px); }
  .cards { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; padding: 4px 4px 10px; }
  .pick { background: #f4f9ff; border: 4px solid #333; border-radius: 16px; padding: 6px; display: flex; flex-direction: column; gap: 5px; align-items: center; }
  .pick img, .pick canvas { width: 100%; max-width: 160px; height: auto; display: block; border: 2px solid #999; border-radius: 8px; background: #fff; cursor: pointer; }
  .pick b { font-size: 17px; text-align: center; }
  .pick .two { width: 100%; gap: 5px; }
  .pick .btn { font-size: 15px; min-height: 46px; padding: 3px; border-radius: 12px; box-shadow: 0 3px 0 #333; }
  .pick .btn.sure { background: #ff3b30; color: #fff; }
  .empty { grid-column: 1 / -1; text-align: center; font-size: 22px; padding: 30px; }
  #askCard { max-width: 640px; text-align: center; }
  #askText { font-size: 26px; font-weight: bold; }
  #askBtns { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
  #askBtns .btn { font-size: 22px; min-height: 64px; }
  #prCard { max-width: 760px; overflow-y: auto; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; align-items: center; }
  .mode { background: #eceff1; } .mode.sel { background: #ffd740; outline: 5px solid #ff4081; outline-offset: 2px; }
  #prBig { display: flex; justify-content: center; }
  #prBig svg { height: min(56vh, 640px); width: auto; max-width: 100%; border: 4px solid #333; border-radius: 8px; background: #fff; }
  #prHow { margin: 0; text-align: center; font-size: 18px; font-weight: bold; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; pointer-events: none; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #studio { flex-wrap: wrap; align-content: flex-start; overflow-y: auto; }
    #tools { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; }
    .tool { min-width: 76px; }
    #board { width: 100%; flex: none; height: 58vh; }
    #side { width: 100%; overflow: visible; }
  }
  @media (max-height: 600px) { .tool { min-height: 54px; } .tool i { font-size: 24px; } .btn { min-height: 46px; font-size: 16px; } #help { font-size: 14px; } .sw { min-height: 26px; } }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  #pal { background: #6d6d6a; }
  .sw { border-radius: 8px; box-shadow: inset 0 -6px 0 rgba(0,0,0,.18), inset 0 4px 0 rgba(255,255,255,.45); }
  .weather .btn { font-size: 21px; min-height: 60px; }
  #bRain.on { background: #b3e5fc; border-color: #1e6bff; box-shadow: 0 5px 0 #1e6bff; }
  #bSun.on { background: #fff3a0; border-color: #ff9800; box-shadow: 0 5px 0 #ff9800; }
  #cv { cursor: crosshair; }
</style>
</head>
<body>
<div id="studio">
  <div id="tools">
    <button class="tool" id="tFat"><i>🖍️</i><span>Fat chalk</span></button>
    <button class="tool" id="tThin"><i>✏️</i><span>Thin chalk</span></button>
    <button class="tool" id="tSmudge"><i>👆</i><span>Smudge</span></button>
    <button class="tool" id="tHop"><i>🔢</i><span>Hopscotch</span></button>
    <button class="tool" id="tSunSt"><i>🌞</i><span>Sun stamp</span></button>
    <button class="tool" id="tUndo"><i>↩️</i><span>Undo</span></button>
    <button class="tool" id="tClear"><i>🗑️</i><span>Clear</span></button>
  </div>
  <div id="board"><div id="cvWrap"><canvas id="cv" width="1200" height="800"></canvas></div></div>
  <div id="side">
    <h1>🖍️ SIDEWALK CHALK</h1>
    <div id="help">Pick a chalk color and draw with your finger!</div>
    <div class="lbl">🖍️ Chalk colors</div>
    <div id="pal"></div>
    <div class="lbl">⛅ Weather</div>
    <div class="two weather">
      <button class="btn b-back" id="bRain">🌧️ Rain</button>
      <button class="btn b-go" id="bSun">☀️ Sun</button>
    </div>
    <div class="three">
      <button class="btn b-save" id="bSave">💾 Save</button>
      <button class="btn b-gal" id="bGallery">🖼️ Gallery</button>
      <button class="btn b-print" id="bPrint">🖨️ Print</button>
    </div>
  </div>
</div>
<div class="ov" id="galBox"><div class="card"><h2 id="galTitle">🖼️ My Gallery</h2>
  <div class="cards" id="galList"></div>
  <button class="btn b-back" id="bGalClose">⬅️ Back</button></div></div>
<div class="ov" id="prBox"><div class="card" id="prCard"><h2>🖨️ Print it out</h2>
  <div class="row"><button class="btn mode" id="prBW">⚫ B&amp;W</button><button class="btn mode" id="prCol">🌈 Color</button></div>
  <div id="prBig"></div><p id="prHow"></p>
  <div class="row"><button class="btn b-save" id="prGo">🖨️ Print it!</button><button class="btn b-back" id="prClose">⬅️ Back</button></div></div></div>
<div class="ov" id="askBox"><div class="card" id="askCard"><div id="askText"></div><div id="askBtns"></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// ---------- shared helpers (same in Stained Glass Studio, Sidewalk Chalk, Tie-Dye Shirt Maker) ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch]));
const n1 = v => Math.round(v * 10) / 10;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
// seeded random numbers (the same seed always makes the same picture)
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const hex2rgb = h => [1, 3, 5].map(i => parseInt(h.substr(i, 2), 16));
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
// ---------- gentle sounds (master volume 0.08: Ben does not like loud noises) ----------
let actx = null, master = null, nbuf = null;
function AC() {
  if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); master = actx.createGain(); master.gain.value = 0.08; master.connect(actx.destination); }
  if (actx.state === 'suspended' && actx.resume) actx.resume();
  return actx;
}
function blip(f, when, len, type, vol) {
  try {
    const a = AC(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0), l = len || 0.2;
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.35, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + l);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + l + 0.03);
  } catch (_) {}
}
function slide(f1, f2, when, len, vol) {
  try {
    const a = AC(), o = a.createOscillator(), g = a.createGain(), t = a.currentTime + (when || 0);
    o.type = 'sine'; o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.3, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g); g.connect(master); o.start(t); o.stop(t + len + 0.03);
  } catch (_) {}
}
const tune = (notes, gap) => notes.forEach((f, i) => blip(f, i * (gap || 0.12), 0.35));
const tada = () => tune([523, 659, 784, 1047, 1319], .12);
function noiseSrc(a) {
  if (!nbuf) { nbuf = a.createBuffer(1, a.sampleRate * 2, a.sampleRate); const d = nbuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = a.createBufferSource(); s.buffer = nbuf; s.loop = true; return s;
}
// a soft "pssht" (squirts, chalk scratches)
function hiss(len, freq, vol, when) {
  try {
    const a = AC(), s = noiseSrc(a), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime + (when || 0);
    f.type = 'bandpass'; f.frequency.value = freq || 2000; f.Q.value = 0.8;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol || 0.25, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + len + 0.05);
  } catch (_) {}
}
// a long soft noise (rain): returns stop()
function softLoop(freq, vol) {
  try {
    const a = AC(), s = noiseSrc(a), f = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
    f.type = 'lowpass'; f.frequency.value = freq; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 1.5);
    s.connect(f); f.connect(g); g.connect(master); s.start(t);
    return () => { try { const n = a.currentTime; g.gain.cancelScheduledValues(n); g.gain.setValueAtTime(g.gain.value, n); g.gain.linearRampToValueAtTime(0.0001, n + 1.2); s.stop(n + 1.3); } catch (_) {} };
  } catch (_) { return () => {}; }
}
// ---------- trophies (shared with the Game Factory book) ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
function hasTrophy(id) { try { return !!JSON.parse(localStorage.getItem('gfTrophies') || '{}')[id]; } catch (_) { return false; } }
// ---------- toast + pop-up boxes ----------
function toast(msg, ms) {
  const t = $('toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), ms || 2800);
}
let box = null;
function openBox(k) { box = k; document.querySelectorAll('.ov').forEach(o => o.classList.toggle('on', o.id === k + 'Box')); }
function closeBox() { openBox(null); }
let askOpts = [];
function ask(text, opts) {
  askOpts = opts; $('askText').textContent = text; $('askBtns').innerHTML = '';
  opts.forEach(([label, cls, fn]) => { const b = document.createElement('button'); b.className = 'btn ' + (cls || ''); b.textContent = label;
    b.addEventListener('click', () => { closeBox(); if (fn) fn(); }); $('askBtns').appendChild(b); });
  openBox('ask');
}
function askClear() {
  if (APP.isBlank()) { toast('✨ It is already clean!'); return; }
  ask('🗑️ Clear it and start over?', [['✅ Yes, clear it', 'b-no', () => { pushUndo(); APP.clear(); changed(); blip(330, 0, .3, 'triangle'); toast('🧽 All clean!'); }], ['❌ No, keep it', 'b-back', null]]);
}
// ---------- undo + remembering the work in progress ----------
let undoS = [], dirty = false;
function pushUndo() { undoS.push(APP.snap()); if (undoS.length > 40) undoS.shift(); updateTools(); }
function undo() { if (!undoS.length) { toast('↩️ Nothing to undo!'); return false; } APP.load(undoS.pop()); changed(); blip(400, 0, .1); return true; }
function changed(keepClean) { if (!keepClean) dirty = true; APP.redraw(); updateTools(); clearTimeout(changed.t); changed.t = setTimeout(saveWork, 500); }
function updateTools() { $('tUndo').classList.toggle('dim', !undoS.length); if (APP.ui) APP.ui(); }
// ---------- 💾 My Gallery: localStorage[APP.key] = { art: [up to 12], saved: how many saves ever, work: the picture in progress } ----------
const MAX_ART = 12;
let store = { art: [], saved: 0, work: null };
function loadStore() {
  try { const s = JSON.parse(localStorage.getItem(APP.key) || 'null');
    if (s && typeof s === 'object') {
      store.art = Array.isArray(s.art) ? s.art.filter(a => a && a.d && typeof a.img === 'string' && a.img.indexOf('data:image/') === 0).slice(0, MAX_ART) : [];
      store.saved = +s.saved || 0; store.work = s.work || null;
    } } catch (_) {}
}
function saveStore() { try { localStorage.setItem(APP.key, JSON.stringify(store)); return true; } catch (_) { return false; } }
function saveWork() { store.work = APP.snap(); if (!saveStore()) { store.work = null; saveStore(); } }
const artTitle = a => "Ben's " + APP.noun + ' #' + a.num;
function saveArt() {
  const why = APP.cantSave && APP.cantSave(); if (why) return { ok: false, why };
  if (store.art.length >= MAX_ART) return { ok: false, why: '🖼️ Your gallery is full (12)! Delete one first.' };
  const a = { id: Date.now() + '-' + (store.saved + 1), num: store.saved + 1, at: Date.now(), d: APP.snap(), img: APP.thumb() };
  store.art.unshift(a); store.saved++;
  if (!saveStore()) { store.art.shift(); store.saved--; return { ok: false, why: '😬 No room left! Delete an old one first.' }; }
  dirty = false;
  let won = false; if (!hasTrophy(APP.trophyId)) { trophy(APP.trophyId); won = true; }
  return { ok: true, art: a, trophy: won };
}
function doSave() {
  const res = saveArt(); if (!res.ok) { toast(res.why); return res; }
  tune([523, 659, 784]);
  if (res.trophy) { setTimeout(tada, 450); toast('🏆 TROPHY! ' + APP.trophyName + '!', 3500); }
  else toast('💾 Saved as "' + artTitle(res.art) + '"!');
  return res;
}
function renderGallery() {
  $('galTitle').textContent = '🖼️ My Gallery (' + store.art.length + ' / ' + MAX_ART + ')';
  if (!store.art.length) { $('galList').innerHTML = '<div class="empty">Nothing saved yet! Make something and press 💾 Save.</div>'; return; }
  $('galList').innerHTML = store.art.map((a, i) => `<div class="pick"><img src="${esc(a.img)}" data-i="${i}" data-a="open" alt=""><b>${esc(artTitle(a))}</b>
    <div class="two"><button class="btn b-save" data-i="${i}" data-a="open">📂<br>Open</button><button class="btn b-no" data-i="${i}" data-a="del">🗑️<br>Delete</button></div></div>`).join('');
}
function galClick(e) {
  const el = e.target.closest && e.target.closest('[data-a]'); if (!el) return;
  const i = +el.dataset.i, a = store.art[i]; if (!a) return;
  if (el.dataset.a === 'open') {
    pushUndo();
    try { APP.load(a.d); } catch (_) { undo(); toast('😬 That one would not open.'); return; }
    changed(); dirty = false; closeBox(); blip(700, 0, .15); toast('📂 ' + artTitle(a));
  } else if (el.classList.contains('sure')) {             // second tap: really delete
    store.art.splice(i, 1); saveStore(); blip(300, 0, .25, 'triangle'); renderGallery(); toast('🗑️ Deleted!');
  } else {                                                 // first tap: ask with the button
    $('galList').querySelectorAll('.sure').forEach(b => { b.classList.remove('sure'); b.innerHTML = '🗑️<br>Delete'; });
    el.classList.add('sure'); el.innerHTML = '🗑️ Tap<br>again!'; blip(500, 0, .12);
    clearTimeout(galClick.tm); galClick.tm = setTimeout(() => { if (el.isConnected) { el.classList.remove('sure'); el.innerHTML = '🗑️<br>Delete'; } }, 3000);
  }
}
// ---------- 🖨️ printing: ⚫ B&W (the default, to color in) or 🌈 Color (remembered). Pages are SVG, letter size, no emoji. ----------
let COLOR = false, sheetCache = {};
function loadColor() { try { COLOR = localStorage.getItem(APP.key + 'Color') === '1'; } catch (_) {} }
function setColor(c) { COLOR = c; try { localStorage.setItem(APP.key + 'Color', c ? '1' : '0'); } catch (_) {} showPrint(); blip(c ? 880 : 520, 0, .12); }
const sheet = c => sheetCache[c] || (sheetCache[c] = APP.sheet(c));
function openPrint() {
  const why = APP.cantPrint && APP.cantPrint(); if (why) { toast(why); return; }
  sheetCache = {}; openBox('pr'); showPrint(); blip(660, 0, .12);
}
function showPrint() {
  $('prBW').classList.toggle('sel', !COLOR); $('prCol').classList.toggle('sel', COLOR);
  $('prBig').innerHTML = sheet(COLOR); $('prHow').textContent = APP.how(COLOR);
}
function doPrint() {
  $('printArea').innerHTML = sheet(COLOR); blip(880, 0, .15); toast('🖨️ Printing!');
  setTimeout(() => { try { if (typeof window.print === 'function') window.print(); } catch (_) {} }, 80);
}
const FONT = 'font-family="Comic Sans MS, Chalkboard SE, Marker Felt, sans-serif" font-weight="bold"';
// a letter page (viewBox 800 x 1000): title on top, then the body
function page(title, sub, body) {
  return '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 1000" width="800" height="1000">'
    + '<rect width="800" height="1000" fill="#fff"/>'
    + `<text x="400" y="50" text-anchor="middle" font-size="38" ${FONT} fill="#222">${esc(title)}</text>`
    + (sub ? `<text x="400" y="84" text-anchor="middle" font-size="19" ${FONT} fill="#555">${esc(sub)}</text>` : '')
    + body + '</svg>';
}
// text that wraps onto a few lines (for tips at the bottom of a page)

function lastWash() { for (let i = ops.length - 1; i >= 0; i--) if (ops[i].k === 'r' && ops[i].n >= MAXN) return i; return -1; }
const HELP = { fat: 'Pick a chalk color and draw with your finger!', thin: 'Thin chalk: great for writing and little details!', smudge: '👆 Rub the chalk to smudge it, like a real finger!',
  hop: 'Tap the sidewalk to stamp a hopscotch!', sun: 'Tap the sidewalk to stamp a smiling sun!' };
const TOOLS = { fat: 'tFat', thin: 'tThin', smudge: 'tSmudge', hop: 'tHop', sun: 'tSunSt' };
const APP = {
  key: 'sidewalkChalk', trophyId: 'sidewalkChalk', trophyName: 'SIDEWALK ARTIST', noun: 'Sidewalk',
  snap: () => ({ o: ops.slice(lastWash() + 1).map(o => Object.assign({}, o)) }),
  load(d) {
    if (!d || !Array.isArray(d.o)) throw 0;
    const ok = d.o.filter(o => o && ((o.k === 'c' || o.k === 'm') && Array.isArray(o.p) && o.p.length >= 2 || o.k === 'st' || o.k === 'r'))
      .map(o => Object.assign({}, o, { c: clamp(+o.c || 0, 0, CHALK.length - 1), s: +o.s || 1, n: Math.min(MAXN, +o.n || 0), x: +o.x || 0, y: +o.y || 0, p: o.p ? o.p.map(v => +v || 0) : o.p }));
    ops = ok; rainOp = null; rebuild();
  },
  clear() { ops = []; rainOp = null; cx.clearRect(0, 0, W, H); },
  isBlank() { for (let i = ops.length - 1; i >= 0; i--) { if (ops[i].k !== 'r') return false; if (ops[i].n >= MAXN) return true; } return true; },
  redraw: render,
  ui() {
    Object.keys(TOOLS).forEach(k => $(TOOLS[k]).classList.toggle('on', tool === k));
    document.querySelectorAll('#pal .sw').forEach((el, i) => el.classList.toggle('sel', i === color));
    $('bRain').classList.toggle('on', rainOn); $('bSun').classList.toggle('on', !rainOn && sunGlow > 0);
    $('help').textContent = rainOn ? '🌧️ It\'s raining! Watch the chalk wash away. Press ☀️ Sun to stop it.' : HELP[tool];
  },
  thumb() { const t = mk(240, 160), c = t.getContext('2d'); c.drawImage(bgCv, 0, 0, 240, 160); c.drawImage(chalkCv, 0, 0, 240, 160); return t.toDataURL('image/jpeg', 0.85); },
  cantSave: () => APP.isBlank() ? '🖍️ Draw something first!' : '',
  cantPrint: () => APP.isBlank() ? '🖍️ Draw something first!' : '',
  sheet(col) {
    const title = "Ben's Sidewalk Chalk";
    if (col) { const t = mk(W, H), c = t.getContext('2d'); c.drawImage(bgCv, 0, 0); c.drawImage(chalkCv, 0, 0);
      return page(title, '', img(t.toDataURL('image/jpeg', 0.9), 30, 120, 740, 493) + wrapText(400, 690, 'Go outside and draw it for real on a sidewalk!', 26, 46)); }
    return page(title, 'Color me in!', `<rect x="30" y="120" width="740" height="493" fill="#fff" stroke="#888" stroke-width="3" rx="10"/>`
      + img(outlines(), 30, 120, 740, 493) + wrapText(400, 690, 'Color it in with crayons or markers!', 26, 46));
  },
  how: col => col ? 'A picture of your sidewalk drawing!' : '🖍️ Just the outlines, to color in!',
  init() {
    $('cv').width = W; $('cv').height = H; makeSidewalk();
    const pal = $('pal'); CHALK.forEach((g, i) => { const s = document.createElement('div'); s.className = 'sw'; s.title = g[1]; s.style.background = g[0];
      s.addEventListener('click', () => { color = i; if (tool === 'smudge') tool = 'fat'; blip(500 + i * 30, 0, .08); APP.ui(); }); pal.appendChild(s); });
    Object.keys(TOOLS).forEach(k => $(TOOLS[k]).addEventListener('click', () => { tool = k; blip(600, 0, .08); APP.ui(); }));
    $('bRain').addEventListener('click', startRain); $('bSun').addEventListener('click', startSun);
  },
  down(p) {
    const x = Math.round(p.x), y = Math.round(p.y);
    if (tool === 'hop' || tool === 'sun') {
      pushUndo(); const o = { k: 'st', id: tool, x, y, c: color, s: (Math.random() * 1e9) | 0 }; ops.push(o); applyOp(o); changed();
      hiss(0.4, 2600, 0.12); blip(tool === 'sun' ? 784 : 523, 0.1, 0.25); return;
    }
    pushUndo();
    const o = tool === 'smudge' ? { k: 'm', s: 1, p: [x, y] } : { k: 'c', c: color, w: tool === 'fat' ? 1 : 0, s: (Math.random() * 1e9) | 0, p: [x, y] };
    ops.push(o); cur = { o, r: rng(o.s), t: 0 };
    if (o.k === 'c') chalkSeg(cx, x, y, x, y, o.c, o.w ? 30 : 11, cur.r);
    render();
  },
  move(p) {
    if (!cur) return; const o = cur.o, P = o.p, lx = P[P.length - 2], ly = P[P.length - 1], x = Math.round(p.x), y = Math.round(p.y);
    if (Math.hypot(x - lx, y - ly) < 3) return;
    P.push(x, y);
    if (o.k === 'c') chalkSeg(cx, lx, ly, x, y, o.c, o.w ? 30 : 11, cur.r); else smudgeSeg(cx, lx, ly, x, y);

  up() { if (!cur) return; cur = null; changed(); },
};
// ⚫ outlines for the black & white print: soften the chalk dots, find each color patch, draw its edges
function outlines() {
  const w = 600, h = 400, s = mk(w, h), c = s.getContext('2d', { willReadFrequently: true });
  c.filter = 'blur(2px)'; c.drawImage(chalkCv, 0, 0, w, h); c.filter = 'none';
  const d = c.getImageData(0, 0, w, h).data, lab = new Int8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    if (d[i * 4 + 3] < 60) { lab[i] = -1; continue; }
    const R = d[i * 4], G = d[i * 4 + 1], B = d[i * 4 + 2]; let best = 0, bd = 1e9;
    CRGB.forEach((q, k) => { const dd = (q[0] - R) ** 2 + (q[1] - G) ** 2 + (q[2] - B) ** 2; if (dd < bd) { bd = dd; best = k; } }); lab[i] = best;
  }
  const o = mk(w, h), oc = o.getContext('2d'); oc.fillStyle = '#fff'; oc.fillRect(0, 0, w, h); oc.fillStyle = '#111';
  for (let y = 0; y < h - 1; y++) for (let x = 0; x < w - 1; x++) { const i = y * w + x; if (lab[i] !== lab[i + 1] || lab[i] !== lab[i + w]) oc.fillRect(x, y, 2, 2); }
  return o.toDataURL('image/png');
}
