<!DOCTYPE html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The Movie Studio Secret Print Shop</title>
<script src="touchpad.js?v=10"></script>
<style>
  html, body { height: 100%; }
  body { margin: 0; background: #1a1033; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas#game { width: min(100vw, calc(100vh * 960 / 540)); height: auto; display: block; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.5); }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #fff3e0; z-index: 99999; text-align: center; padding: 12px 12px 40px; box-sizing: border-box; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; gap: 14px; justify-content: center; padding: 8px; background: #fff3e0; z-index: 2; }
  #printBox button { font: bold 26px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 14px 30px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #43a047; } #printBox .pbBack { background: #6d4c41; }
  #printBox .pbNames { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 6px 0; }
  #printBox .pbNames button { font-size: 22px; padding: 10px 20px; background: #7e57c2; }
  #printBox .pbNames button.on { background: #ff7043; outline: 4px solid #ffd740; }
  #printBox .pbTip { font-size: 20px; color: #5d4037; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip, #printBox .pbNames { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
<canvas id="game" width="960" height="540"></canvas>
<script>
// 🎬 THE MOVIE STUDIO SECRET PRINT SHOP — made for Ben, in the style of his Robo Jump Secret Print Shop.
// Dusty (Robo's first friend) shows you around the ROBO STUDIOS backlot: the sets from Ben's six movies, Stage 7 where
// the film crew works, and the secret ✂️ CUTTING ROOM where the cut scenes live (with the BURP that shakes the world!).
// Tap things to find 32 SECRETS. Every secret you find can unlock a PRINTABLE: movie posters, character cards,
// fold-ups (clapboard, film camera, popcorn box), tickets, a storyboard, a director's badge and an award.
// Characters are drawn with the REAL drawing code from the movies (copied from mooncampout.html; Dusty is the same as robomovie.html).
// Save: localStorage.movieStudioShop. Trophy 'movieStudioShop' when you find all 32 secrets.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540, GROUND = 410;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { found: {}, name: 'Ben' };
try { const s = JSON.parse(localStorage.getItem('movieStudioShop') || 'null'); if (s && s.found) save = Object.assign(save, s); } catch (_) {}
function writeSave() { try { localStorage.setItem('movieStudioShop', JSON.stringify(save)); } catch (_) {} }
// ---------- drawing helpers (copied from the movies) ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  const R = Array.isArray(r) ? r : [r, r, r, r], k = v => Math.max(0, Math.min(+v || 0, w / 2, h / 2));   // [top-left, top-right, bottom-right, bottom-left]
  const [a, b, c, d] = [k(R[0]), k(R[1]), k(R[2]), k(R[3])];
  ctx.moveTo(x + a, y); ctx.arcTo(x + w, y, x + w, y + h, b); ctx.arcTo(x + w, y + h, x, y + h, c);
  ctx.arcTo(x, y + h, x, y, d); ctx.arcTo(x, y, x + w, y, a); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', outline = true) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  if (outline) { ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emoji(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji", "Segoe UI Emoji", sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function glow(x, y, r, col, a = 1) {                  // soft round light (radial gradient, no ctx.filter)
  r = Math.max(1, r);
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, col); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); ctx.restore();
}
function heart(x, y, s, fill = '#ff5c8a') {
  ctx.fillStyle = fill; ctx.beginPath();
  ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35);
  ctx.fill();
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * Math.max(0, rr), y + Math.sin(a) * Math.max(0, rr)); }
  ctx.closePath(); ctx.fill();
}
function twinkle(x, y, r, a = 1, col = '#fff8d0') {   // a 4-point sparkle
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1); star(x, y, r, col, 0, 4, 0.25); ctx.restore();
}
function pawPrint(x, y, r, col) {                     // a little paw print
  ellipse(x, y + r * 0.25, r * 0.55, r * 0.45, col);
  for (let i = 0; i < 4; i++) { const a = -2.4 + i * 0.53; ellipse(x + Math.cos(a) * r * 0.8, y + Math.sin(a) * r * 0.75, r * 0.22, r * 0.27, col); }
}
function starPaw(x, y, r, t, a = 1) {                 // Tiger's twinkly star paw print: golden glow + paw
  ctx.save(); ctx.globalAlpha = clamp(a, 0, 1);
  glow(x, y, r * 3, 'rgba(255,214,90,.75)', 0.7 + Math.sin(t * 0.08 + x) * 0.2);
  pawPrint(x, y, r, '#ffe27a');
  twinkle(x + r * 0.9, y - r * 0.9, r * 0.5 * (0.7 + 0.3 * Math.sin(t * 0.15 + y)), 1);
  ctx.restore();
}
function wrapLines(str, maxW, size) {
  ctx.font = `bold ${size}px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif`;
  const words = String(str).split(' '), out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
// seeded random for scenery that stays put
function rng(seed) { let v = (seed >>> 0) || 1; return () => { v = (v * 1664525 + 1013904223) >>> 0; return v / 4294967296; }; }
const STARS = (() => { const r = rng(7), a = []; for (let i = 0; i < 140; i++) a.push([r() * W, r() * 330, 0.6 + r() * 1.8, r() * 6]); return a; })();
</script>
<script>
// =====================================================================
// 🤖 THE CHARACTERS (x, y = between the feet)
// Robo: same look as the Robo Jump games: white round robot, dark visor, blue eyes, blue ear pods, blue legs,
// plus his little antenna. Dusty: Robo's first friend, a tiny cleaning bot. King Gloop: PURPLE goo, gold crown.
// =====================================================================
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };
// o = { s, face, t, pose (idle/off/walk/run/wobble/jump/happy/fall/sit/wave), eyes 0..1, mouth, parts (bitmask: 1 body+legs, 2 head+visor, 4 ear pods, 8 antenna), dizzy }
function drawRobo(x, y, o = {}) {
  const s = o.s || 2.6, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle', parts = o.parts === undefined ? 15 : o.parts;
  const eyes = o.eyes === undefined ? 1 : o.eyes;
  let tilt = o.tilt || 0, bob = 0, lA = 0, lB = 0, sq = 1;
  if (pose === 'walk' || pose === 'run') { const k = t * (pose === 'run' ? 0.5 : 0.3); lA = Math.max(0, Math.sin(k)) * 4; lB = Math.max(0, -Math.sin(k)) * 4; bob = -Math.abs(Math.sin(k)) * 1.5; }
  else if (pose === 'wobble') { const k = t * 0.16; tilt += Math.sin(k) * 0.22; lA = Math.max(0, Math.sin(k)) * 5; lB = Math.max(0, -Math.sin(k)) * 5; }
  else if (pose === 'jump') { lA = lB = 4; sq = 1.06; }
  else if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.25)) * 4; tilt += Math.sin(t * 0.25) * 0.08; }
  else if (pose === 'fall') { tilt += -0.5; bob = 3; }
  else if (pose === 'sit') { lA = lB = 3; bob = 3; }
  else if (pose !== 'off') bob = Math.sin(t * 0.06) * 0.6;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s * sq); ctx.translate(0, bob);
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  if (parts & 1) {
    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();
    circle(0, -12, 3, ROBO.pod); circle(-0.8, -12.8, 1, 'rgba(255,255,255,.7)');
  }
  if (parts & 8) {                                     // 📡 the little antenna (wiggles when he moves)
    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();
    const lit = pose === 'off' ? 0.25 : 0.6 + (o.mouth ? 0.4 * Math.abs(Math.sin(t * 0.4)) : 0);
    if (pose !== 'off') glow(tip, -50, 7, 'rgba(64,196,255,.8)', lit);
    circle(tip, -50, 2.6, ROBO.pod); circle(tip - 0.8, -50.8, 0.8, 'rgba(255,255,255,.8)');
  }
  if (parts & 4) { roundRect(-20, -31, 6, 9, 3, ROBO.pod); roundRect(14, -31, 6, 9, 3, ROBO.pod); }
  if (parts & 2) {
    roundRect(-17, -40, 34, 22, 12, ROBO.head);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);
      const ey = -29.5;
      if (o.dizzy) {                                   // 💫 swirly dizzy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.1;
        for (const ex of [-3, 9]) { ctx.beginPath(); for (let a = 0; a < 12; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.3, ey + Math.sin(a + t * 0.2) * a * 0.3); ctx.stroke(); }
      } else if (pose === 'happy' || o.happy) {        // ^ ^ happy eyes
        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {
        const blink = (t % 200) < 6 ? 0.6 : 5, talk = o.mouth ? 0.85 + 0.15 * Math.sin(t * 0.6) : 1;
        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();
        if (blink > 1) { circle(-2, ey - 2, 1, 'rgba(255,255,255,.85)'); circle(10, ey - 2, 1, 'rgba(255,255,255,.85)'); }
      }
      if (o.mouth) { ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(1, -25); ctx.lineTo(1 + 2 + Math.abs(Math.sin(t * 0.5)) * 3, -25); ctx.stroke(); }
      ctx.restore();
    }
  }
  if (o.wave) {                                        // 👋 a little waving hand
    const a = Math.sin(t * 0.3) * 0.5;
    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();
  }
  ctx.restore();
  if (o.dizzy) for (let i = 0; i < 3; i++) { const a = t * 0.08 + i * 2.1; star(x + Math.cos(a) * 22 * s / 2.6, y - 118 * s / 2.6 + Math.sin(a) * 6, 7, '#ffd54f', a); }
}
// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,
// a fluffy pink duster on a springy stick, a twirly brush skirt and two little wheels.
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = o.t || frame, pose = o.pose || 'idle';
  const roll = pose === 'walk' || pose === 'run' || pose === 'sweep';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5, tilt = 0;
  if (pose === 'happy') { bob = -Math.abs(Math.sin(t * 0.3)) * 4; tilt = Math.sin(t * 0.3) * 0.1; }
  if (pose === 'jump') bob = -1;
  if (pose === 'shy') tilt = -0.15;
  ctx.save(); ctx.translate(x, y); ctx.rotate(tilt * f); ctx.scale(s * f, s); ctx.translate(0, bob);
  ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');                  // the twirly brush skirt
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1');
  ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65');
  roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.happy || pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else {
    const blink = (t % 170) < 6 ? 0.5 : 3;
    ellipse(1.5, -17.5, 3, Math.max(0.4, blink), '#b2ff59'); if (blink > 1) circle(2.5, -18.8, 0.9, '#fff');
  }
  if (o.mouth) { ctx.strokeStyle = '#b2ff59'; ctx.lineWidth = 0.8; ctx.beginPath(); ctx.arc(1.5, -14.5, 1.2 + Math.abs(Math.sin(t * 0.5)), 0.2, Math.PI - 0.2); ctx.stroke(); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;   // the springy duster
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec');
  ctx.restore();
  ctx.restore();
}
// ⚙️ The GOLDEN GEAR (the heart of the Game Factory: it makes every machine go)
function drawGear(x, y, r, rot = 0, a = 1, col = '#ffd740', dark = '#ffa000') {
  if (r <= 0.5) return;
  ctx.save(); ctx.globalAlpha *= clamp(a, 0, 1);
  if (col === '#ffd740') glow(x, y, r * 2.2, 'rgba(255,215,64,.55)', 0.8 + 0.2 * Math.sin(frame * 0.08));
  ctx.translate(x, y); ctx.rotate(rot); ctx.fillStyle = dark; ctx.beginPath();
  for (let i = 0; i < 20; i++) { const a0 = i * Math.PI / 10, rr = i % 2 ? r * 0.82 : r * 1.08; ctx.lineTo(Math.cos(a0 - 0.12) * rr, Math.sin(a0 - 0.12) * rr); ctx.lineTo(Math.cos(a0 + 0.12) * rr, Math.sin(a0 + 0.12) * rr); }
  ctx.closePath(); ctx.fill();
  circle(0, 0, r * 0.84, col); circle(0, 0, r * 0.32, dark); circle(0, 0, r * 0.18, '#fff8e1');
  ellipse(-r * 0.35, -r * 0.4, r * 0.25, r * 0.12, 'rgba(255,255,255,.6)', -0.6);
  ctx.restore();
}
// 👑 KING GLOOP (same look as Robo Jump: a PURPLE goo blob, gold crown, big white eyes, grumpy eyebrows)
// o = { s, face, t, pose, mouth, grumpy, happy, dizzy, hit, gear (carrying the Golden Gear) }
const GLOOP = { body: '#7c4dff', dark: '#651fff', crown: '#ffd740', mouth: '#311b92' };
function drawGloop(x, y, o = {}) {
  const s = o.s || 1.5, f = o.face || -1, t = o.t || frame, pose = o.pose || 'idle';
  const hop = pose === 'walk' || pose === 'run' ? Math.abs(Math.sin(t * (pose === 'run' ? 0.35 : 0.2))) : 0;
  const hit = (o.hit || 0) / 30;
  let wob = Math.sin(t * 0.15) * 3 + hit * 14 - hop * 5;
  if (pose === 'happy') wob = Math.sin(t * 0.3) * 6;
  ctx.save(); ctx.translate(x, y - hop * 10); ctx.scale(s, s);
  const w = 96 + wob, h = 84 - wob, top = -h;
  ellipse(0, 1 + hop * 10 / s, w * 0.55, 6, 'rgba(0,0,0,.18)');
  ctx.fillStyle = GLOOP.dark; rrect(-w / 2 - 2, top + 2, w + 4, h, 42); ctx.fill();
  ctx.fillStyle = GLOOP.body; rrect(-w / 2, top, w, h - 2, 40); ctx.fill();
  for (let i = 0; i < 5; i++) {                       // gooey drips
    const dx = -w / 2 + 12 + i * (w - 24) / 4, dl = 3 + ((i * 7 + Math.floor(t / 20)) % 4) * 1.5;
    ellipse(dx, -2 + dl * 0.4, 5, dl, GLOOP.body);
  }
  ellipse(-w / 2 + 25, top + 22, 12, 7, 'rgba(255,255,255,.35)', -0.5);
  ctx.fillStyle = GLOOP.crown; ctx.beginPath(); ctx.moveTo(-25, top + 6);   // 👑 crown
  for (let i = 0; i <= 4; i++) ctx.lineTo(-25 + i * 12.5, top - (i % 2 ? 4 : 22));
  ctx.lineTo(25, top + 6); ctx.closePath(); ctx.fill();
  circle(0, top - 4, 3, '#e91e63'); circle(-12.5, top, 2.2, '#40c4ff'); circle(12.5, top, 2.2, '#40c4ff');
  const look = f * 4;
  for (const ex of [-18, 18]) {
    circle(ex, top + 32, 11, '#fff');
    if (o.dizzy) { ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.beginPath(); for (let a = 0; a < 13; a += 0.4) ctx.lineTo(ex + Math.cos(a + t * 0.2) * a * 0.6, top + 32 + Math.sin(a + t * 0.2) * a * 0.6); ctx.stroke(); }
    else if (o.happy && !o.mouth) { ctx.strokeStyle = '#000'; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.arc(ex, top + 35, 6, Math.PI * 1.15, Math.PI * 1.85); ctx.stroke(); }
    else { const bl = (t % 190) < 6 ? 1 : 5; ellipse(ex + look, top + 34, 5, bl, '#000'); if (bl > 2) circle(ex + look + 1.5, top + 32, 1.6, '#fff'); }
  }
  if (o.grumpy && !o.happy) {                          // grumpy eyebrows
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath();
    ctx.moveTo(-30, top + 16); ctx.lineTo(-8, top + 24); ctx.moveTo(30, top + 16); ctx.lineTo(8, top + 24); ctx.stroke();
