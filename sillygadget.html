<!DOCTYPE html>
<html lang="en">

<script src="touchpad.js?v=10"></script>
<style>

  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }

  #tvArt svg .flash, #boxPrev svg .flash { animation: flash .6s steps(2) infinite; }
  #tvArt svg .shk { animation: shk .12s linear infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg .flip, #boxPrev svg .flip { animation: flip 1.4s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg .whirl, #boxPrev svg .whirl { animation: whirl .25s linear infinite alternate; transform-box: fill-box; transform-origin: 50% 50%; }
  #tvArt svg .jig, #boxPrev svg .jig { animation: jig .3s ease-in-out infinite alternate; }
  #boxPrev svg g.bnc { animation: bnc .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #boxPrev svg g.wig { animation: wig .7s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  #boxPrev svg g.spn { animation: spn 9s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  #boxPrev svg g.spin2, #tvArt svg g.spin2 { animation: spn 1.6s linear infinite; transform-box: fill-box; transform-origin: 50% 50%; }
  @keyframes rise { from { transform: translateY(30px); opacity: 0; } 20% { opacity: 1; } 80% { opacity: 1; } to { transform: translateY(-70px); opacity: 0; } }
  @keyframes fall { from { transform: translateY(-60px); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } to { transform: translateY(50px); opacity: 0; } }
  @keyframes bob { from { transform: translateY(-6px); } to { transform: translateY(6px); } }
  @keyframes flash { from { opacity: 1; } to { opacity: .15; } }
  @keyframes shk { from { transform: rotate(-9deg); } to { transform: rotate(9deg); } }
  @keyframes flip { from { transform: rotate(0); } 50% { transform: translateY(-30px) rotate(180deg); } to { transform: rotate(360deg); } }
  @keyframes whirl { from { transform: scaleX(1); } to { transform: scaleX(.15); } }
  @keyframes jig { from { transform: translate(-2px, -1px); } to { transform: translate(2px, 2px); } }
  @keyframes bnc { from { transform: translateY(0) scale(1, 1); } to { transform: translateY(-26px) scale(1.03, .97); } }
  @keyframes wig { from { transform: rotate(-7deg); } to { transform: rotate(7deg); } }
  @keyframes flt { from { transform: translateY(-80px); } to { transform: translateY(620px); } }
  @keyframes spn { to { transform: rotate(360deg); } }
  @keyframes pop { from { transform: scale(0); } 70% { transform: scale(1.15); } to { transform: scale(1); } }

    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }

  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #tv, #tvBar { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>

<script>
'use strict';
// =====================================================================
// 🤪 SILLY GADGET INVENTOR: spin a crazy gadget ([what it does] + [what it is] + [powered by]), pick a spokes-star,
// colors, silly extras and a price, watch its goofy 📺 infomercial (BUT WAIT, THERE'S MORE! + phones ringing),
// then print a fold-up gadget box, a blank box, a blueprint, an order form and a pretend patent.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).

// =====================================================================

const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }

function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }

const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';

  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };

  WHO.forEach(w => bar.appendChild(mkBtn('btn b-call', '📞 ' + w, () => tvCall(w))));
}
function tvNext() {
  tvK++;

  const kind = TV_SEQ[tvK];
  if (kind === 'more') bumpBonus();
  tvTimer = setTimer(tvNext, tvShow(kind));
}
function bumpBonus() { tvBonus++; if (tvBonus > state.bonus) { state.bonus = tvBonus; saveState(); } }
function tvMore() {
  if (!tvOn()) return;
  clearTimers(); bumpBonus();
  tvTimer = setTimer(tvNext, tvShow('more'));
}
function tvCall(who) {
  if (!tvOn()) return;
  clearTimers(); tvCalls++; state.orders++; saveState();
  const line = ORDERS[(tvCalls * 3 + WHO.indexOf(who)) % ORDERS.length];
  tvTimer = setTimer(tvNext, tvShow('call', { who, line }));

}
function startTV() {
  if (typeof document === 'undefined') return;
  stopTV(true);
  state.tv++; saveState();
  tvBonus = 0; tvCalls = 0;
  $('tv').classList.add('on'); renderTVBar(); blip(880, 0, .1);
  checkTrophy('You made an infomercial!');
  tvK = -1; tvNext();
}
function stopTV(quiet) {
  clearTimers(); tvTimer = null; tvK = -1;
  if (typeof document === 'undefined' || !$('tv')) return;
  const was = $('tv').classList.contains('on');
  $('tv').classList.remove('on'); $('tvArt').innerHTML = ''; $('tvAct').textContent = '';

}
const tvOn = () => typeof document !== 'undefined' && $('tv') && $('tv').classList.contains('on');
// =====================================================================
// 🖨️ GALLERY + SHEET VIEW (copied from the Craft Room)
// =====================================================================
const isLine = () => state.mode === 'line' || SHEETS[cur].id === 'blankbox';
function renderSheet(noMagic) {
  if (typeof document === 'undefined' || !$('svgBox')) return;
  $('svgBox').innerHTML = buildSheet(cur, isLine());
  if (!noMagic && isLine() && state.magic[SHEETS[cur].id]) applyMagic();
}
const MAGIC = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff', '#ffb3c6', '#b5ead7'];
function applyMagic() {
  const svg = $('svgBox') && $('svgBox').querySelector('svg'); if (!svg) return;
  let k = 0;
  svg.querySelectorAll('rect, path, circle, ellipse').forEach(el => {
    const f = (el.getAttribute('fill') || '').toLowerCase();
    if (el.getAttribute('width') === '800' || el.hasAttribute('data-keep')) return;
    if (f === '#fff' || f === '#ffffff') el.style.fill = MAGIC[k++ % MAGIC.length];
  });
}
function magicColor() {
  if (!isLine()) setMode('line');
  state.magic[SHEETS[cur].id] = true; saveState(); renderSheet(); drawTraces();
  tune([660, 880, 1100]); toast('✨ Ta-da! Now press 🖨️ Print my colors!');
}
function setMode(m) { state.mode = m; saveState(); if (view === 'sheet') { renderSheet(); updateSide(); sizeCanvas(); } }
function updateSide() {
  const p = SHEETS[cur], line = isLine(), blank = p.id === 'blankbox';
  $('bColor').classList.toggle('on', !line); $('bLine').classList.toggle('on', line); $('modes').classList.toggle('hide', blank);
  $('pHelp').textContent = p.help + (line ? ' Pick a crayon and color right on it!' : '');
  $('pens').classList.toggle('on', line); $('lineBtns').classList.toggle('hide', !line);
  $('bPrint').classList.toggle('hide', line); $('trace').classList.toggle('on', line);
}
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    d.innerHTML = buildSheet(k, p.id === 'blankbox') + '<b>' + esc(p.name) + '</b>';
    d.addEventListener('click', () => { sel = k; openSheet(k); });
    g.appendChild(d);
  });
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openGallery() { stopTV(); endPrintAll(); renderGallery(); setView('gallery'); markSel(); blip(660); }
function openSheet(k) {
  cur = k; sel = k;
  $('pTitle').textContent = SHEETS[k].name;
  renderSheet(); updateSide(); setView('sheet'); sizeCanvas(); blip(660);
}
function backToGallery() { endPrintAll(); setView('gallery'); markSel(); }
function backToInventor() { endPrintAll(); setView('inv'); renderPreview(); renderOpts(); }
function clearSheet() { const id = SHEETS[cur].id; state.traces[id] = []; delete state.magic[id]; saveState(); renderSheet(); drawTraces(); }
const PENS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222'];
const BORDER = 5;
function sheetBox() {
  const r = $('wrap').getBoundingClientRect(), w = r.width - BORDER * 2, h = r.height - BORDER * 2;
  const s = Math.min(w / 800, h / 1000) || 1;
  return { r, s, ox: BORDER + (w - 800 * s) / 2, oy: BORDER + (h - 1000 * s) / 2 };
}
const f1 = v => Math.round(v * 10) / 10;
function toSheet(e) { const b = sheetBox(); return [f1((e.clientX - b.r.left - b.ox) / b.s), f1((e.clientY - b.r.top - b.oy) / b.s)]; }
function sizeCanvas() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(b.r.width * dpr)); cv.height = Math.max(1, Math.round(b.r.height * dpr));
  drawTraces();
}
function strokeAll(ctx, list) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 12;
  list.forEach(t => { ctx.strokeStyle = t.c; ctx.beginPath(); for (let i = 0; i < t.p.length; i += 2) (i ? ctx.lineTo : ctx.moveTo).call(ctx, t.p[i], t.p[i + 1]); if (t.p.length === 2) ctx.lineTo(t.p[0] + 0.1, t.p[1]); ctx.stroke(); });
}
function drawTraces() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);

  ctx.setTransform(dpr * b.s, 0, 0, dpr * b.s, dpr * b.ox, dpr * b.oy);

}
function penDown(e) {
  if (view !== 'sheet' || !isLine()) return;
  if (document.body.classList.contains('pAll')) endPrintAll();
  e.preventDefault();
  const [x, y] = toSheet(e), id = SHEETS[cur].id;
  stroke = { c: pen, p: [x, y] };
  (state.traces[id] = state.traces[id] || []).push(stroke);
  drawTraces();
}
function penMove(e) {
  if (!stroke) return;
  const [x, y] = toSheet(e), p = stroke.p, k = p.length;
  if (Math.hypot(x - p[k - 2], y - p[k - 1]) < 4) return;
  p.push(x, y); drawTraces();
}
function penUp() { if (!stroke) return; stroke = null; saveState(); }
function renderPens() {
  const box = $('pens'); box.innerHTML = '';
  PENS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (c === pen ? ' sel' : ''); s.style.background = c;
    s.addEventListener('click', () => { pen = c; box.querySelectorAll('.sw').forEach((el, i) => el.classList.toggle('sel', PENS[i] === c)); });
    box.appendChild(s);
  });
}
function traceImage() {                // your crayon coloring as a picture laid on the sheet for printing
  const list = state.traces[SHEETS[cur].id] || []; if (!list.length || typeof document === 'undefined') return '';
  const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 2000; const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return '';
  ctx.scale(2, 2); ctx.globalAlpha = .8; strokeAll(ctx, list);
  return cv.toDataURL('image/png');
}
// =====================================================================
// PRINTING: only the sheet prints (see @media print). "Print them all" prints one sheet per page.
// The first print (or the first infomercial) wins the 🏆 trophy.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function notePrinted() { state.printed++; saveState(); checkTrophy('You printed your gadget!'); }
function printSheet() {
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); renderSheet(true); notePrinted(); doPrint(() => renderSheet());
}
function printColors() {
  if (view !== 'sheet') openSheet(sel);
  if (!isLine()) setMode('line');
  endPrintAll(); renderSheet();
  const img = traceImage(), svg = $('svgBox').querySelector('svg');
  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }
  notePrinted(); doPrint(() => renderSheet());
}
function printAll() {
  $('printAll').innerHTML = SHEETS.map((p, i) => buildSheet(i, p.id === 'blankbox' || state.mode === 'line')).join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + SHEETS.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints (Space spins, C = infomercial)
// In the infomercial: Space or ⬆️ = BUT WAIT, MORE!, Enter or 1-7 = a family member calls, Escape = stop.
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (tvOn()) {
    if (k === 'Escape' || k === 'Backspace') stopTV();
    else if (k === ' ' || k === 'ArrowUp') tvMore();
    else if (k === 'Enter') tvCall(WHO[Math.floor(Math.random() * WHO.length)]);
    else if (/^[1-7]$/.test(k)) tvCall(WHO[+k - 1]);
    else return;
    e.preventDefault(); return;
  }
  if (view === 'inv') {
    if (k === 'ArrowUp' || k === 'ArrowDown') { catI = (catI + (k === 'ArrowDown' ? 1 : CATS.length - 1)) % CATS.length; renderCats(); renderOpts(); blip(520, 0, .06); }
    else if (k === 'ArrowLeft' || k === 'ArrowRight') nudge(k === 'ArrowRight' ? 1 : -1);
    else if (k === ' ') { if (CATS[catI][0] === 'extras') toggleExtra(EXTRAS[exCur][0]); else spinName(); }
    else if (k === 'Enter') openGallery();
    else if (k === 'c' || k === 'C') startTV();
    else if (k === 'p' || k === 'P') { sel = 0; openSheet(0); printSheet(); }
    else return;
    e.preventDefault();
  } else if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToInventor(); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {
  loadState();
  renderCats(); renderOpts(); renderPreview(); renderPens();
  const cv = $('trace');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('bTV').addEventListener('click', startTV);
  $('tvStop').addEventListener('click', () => stopTV());
  $('bPrints').addEventListener('click', openGallery);
  $('bGBack').addEventListener('click', backToInventor);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
