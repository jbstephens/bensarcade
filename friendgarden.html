<canvas id="c" width="960" height="540"></canvas>
<script>
// 🌻 THE FRIENDSHIP GARDEN: a sunny, peaceful little garden at golden hour. A soft breeze, butterflies, very quiet birdsong.
// Plant flowers for the people (and cats and robots) who love Ben, the "Why I'm a great friend" mirror, the feelings butterfly,
// Robo's friendship tips, make-a-new-friend practice (Dusty, Sparks, Rocky, Mimo), and a balloon that floats a sad cloud away.
// All sound is VERY soft (master volume 0.1, slow fades). Trophy 'friendGarden' after trying 4 things. Save: localStorage.friendGarden
// Music for the book's Jukebox: friendgarden.html?song=garden  (or window.JUKEBOX.song)
const C = document.getElementById('c'), ctx = C.getContext('2d'), W = 960, H = 540;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers (from The Cozy Blanket Fort) ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }

function heart(x, y, s, fill = '#ff8fab') {
  ctx.fillStyle = fill; ctx.beginPath(); ctx.moveTo(x, y + s * 0.35);
  ctx.bezierCurveTo(x - s * 1.1, y - s * 0.4, x - s * 0.45, y - s * 1.05, x, y - s * 0.45);
  ctx.bezierCurveTo(x + s * 0.45, y - s * 1.05, x + s * 1.1, y - s * 0.4, x, y + s * 0.35); ctx.fill();
}
function rrect(x, y, w, h, r) {
  ctx.beginPath(); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function glow(x, y, r, col, a = 1) {

function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {

}
function line(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function text(s, x, y, size, col, align = 'center', bold = true) {
  ctx.font = (bold ? 'bold ' : '') + size + 'px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif';
  ctx.textAlign = align; ctx.textBaseline = 'middle'; ctx.fillStyle = col; ctx.fillText(s, x, y);
}
function wrap(s, maxW, size) {
  ctx.font = 'bold ' + size + 'px "Trebuchet MS", "Chalkboard SE", Arial, sans-serif';
  const out = []; let cur = '';
  for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur); return out;
}
// ---------- VERY soft sounds: one master knob (0.1), everything fades in and out slowly ----------
const MASTER = 0.1;
let actx = null, master = null, musBus = null, sfx = null, amb = null, soundOn = true, musicOn = true;
function audio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
      musBus = actx.createGain(); musBus.gain.value = 0; musBus.connect(master);
      sfx = actx.createGain(); sfx.gain.value = 1; sfx.connect(master);
      amb = actx.createGain(); amb.gain.value = 0; amb.connect(master);
    }
    if (actx.state !== 'running') actx.resume();

}
function running() { return actx && actx.state === 'running'; }
function fadeAll() {   // slow fades for the master knob, the music and the breeze
  if (!actx) return; const t = actx.currentTime;
  try {
    master.gain.cancelScheduledValues(t); master.gain.setTargetAtTime(soundOn ? MASTER : 0, t, 0.8);
    const speaking = window.speechSynthesis && speechSynthesis.speaking;
    musBus.gain.cancelScheduledValues(t); musBus.gain.setTargetAtTime(musicOn ? (speaking ? 0.3 : 0.6) : 0, t, 1.2);
    amb.gain.cancelScheduledValues(t); amb.gain.setTargetAtTime(JB_WANT ? 0 : 1, t, 2.5);
  } catch (_) {}
}
function softNote(f, d = 1, v = 0.12, when = 0, bus = sfx) {   // a round, gentle bell
  if (!running()) return;
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.value = f;
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t + d + 0.05);

const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.9, 0.1); }
function chime() { softNote(784, 1.6, 0.09); softNote(1175, 1.8, 0.05, 0.08); }
function sparkle() { [784, 988, 1175, 1568].forEach((f, i) => softNote(f, 1.2, 0.05, i * 0.09)); }
function growSound() { [523, 659, 784].forEach((f, i) => softNote(f, 1.4, 0.07, i * 0.22)); }
// 🌬️ a soft breeze: filtered noise that swells and settles very slowly. 🐦 now and then, a tiny, quiet bird chirp.
let noiseBuf = null, breeze = null, birdT = 400;
function noise() {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
}
function startBreeze() {
  if (breeze || !running()) return;
  try {
    const src = noise(), bp = actx.createBiquadFilter(), g = actx.createGain(), lfo = actx.createOscillator(), depth = actx.createGain();
    bp.type = 'bandpass'; bp.frequency.value = 520; bp.Q.value = 0.6;
    g.gain.value = 0.07; lfo.frequency.value = 0.07; depth.gain.value = 0.055; lfo.connect(depth); depth.connect(g.gain);
    src.connect(bp); bp.connect(g); g.connect(amb); src.start(); lfo.start(); breeze = { src, g };
  } catch (_) {}
}
function chirp(when, f0) {
  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.35, t + 0.07); o.frequency.exponentialRampToValueAtTime(f0 * 1.1, t + 0.13);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.035, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.15);
  o.connect(g); g.connect(amb); o.start(t); o.stop(t + 0.2);
}
function birds() {
  if (!running() || !soundOn) return;
  try { const f0 = 2400 + Math.random() * 900, n = 2 + Math.floor(Math.random() * 3); for (let i = 0; i < n; i++) chirp(i * 0.17 + Math.random() * 0.04, f0 * (i % 2 ? 1.08 : 1)); } catch (_) {}
}
// 🎈 the balloon pop: a tiny, soft "puff" and a sprinkle of bells (never loud)
function softPop() {
  if (!running()) return;
  try {
    const src = noise(), lp = actx.createBiquadFilter(), g = actx.createGain(), t = actx.currentTime;
    lp.type = 'lowpass'; lp.frequency.value = 900; g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.12, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    src.connect(lp); lp.connect(g); g.connect(sfx); src.start(t); src.stop(t + 0.25);
  } catch (_) {}
  [1568, 1319, 1175, 1047, 880].forEach((f, i) => softNote(f, 1, 0.04, 0.1 + i * 0.07));
}
// 🗣️ the gentle voice (slow and soft). The music gets quieter while someone talks.
function speak(line, rate = 0.82, pitch = 1.05) {
  try {
    if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’:-]/g, '').replace(/\s+/g, ' ').trim());
    u.rate = rate; u.pitch = pitch; u.volume = 0.7; u.onend = fadeAll; speechSynthesis.speak(u); setTimeout(fadeAll, 150);
  } catch (_) {}
}
function hush() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (_) {} setTimeout(fadeAll, 100); }
// 🎶 "Sunny Garden Song": an original, gentle tune. A soft plucked guitar plays slow rolling chords and a music box
// sings the melody on top. 4/4, 8 bars (C, Am, F, G, C, Em, F, G). Plays VERY quietly. Loops every ~22 seconds.
const SONG = [[72, 1], [76, 1], [79, 2], [76, 1], [72, 1], [69, 2], [69, 1], [72, 1], [77, 1], [76, 1], [74, 3], [0, 1],
  [72, 1], [76, 1], [79, 1], [81, 1], [79, 2], [76, 2], [77, 1], [76, 1], [74, 1], [72, 1], [74, 2], [72, 2]];
const CHORDS = [[48, 55, 60, 64, 67], [45, 52, 57, 60, 64], [41, 48, 53, 57, 60], [43, 50, 55, 59, 62],
  [48, 55, 60, 64, 67], [40, 47, 52, 55, 59], [41, 48, 53, 57, 60], [43, 50, 55, 59, 62]];
const ROLL = [0, 1, 2, 3, 4, 3, 2, 1];
const BEAT = 0.7, SONG_BEATS = 32;
const SONG_EV = (() => { const ev = []; let b = 0;
  SONG.forEach(([m, d]) => { if (m) ev.push({ b, m, d: 2.2, v: 0.16, box: 1 }); b += d; });
  CHORDS.forEach((ch, bar) => ROLL.forEach((k, i) => ev.push({ b: bar * 4 + i * 0.5, m: ch[k], d: 1.8, v: i === 0 ? 0.16 : 0.1, pluck: 1 })));
  return ev.sort((a, c) => a.b - c.b); })();
const mus = { timer: null, t0: null, k: 0, loop: 0, last: 0 };
function songNote(e, t) {
  try {
    const f = 440 * Math.pow(2, (e.m - 69) / 12), o = actx.createOscillator(), g = actx.createGain();
    if (e.pluck) {   // 🎸 a soft guitar-ish pluck: a triangle wave through a filter that closes quickly
      const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.Q.value = 0.7;
      lp.frequency.setValueAtTime(2600, t); lp.frequency.exponentialRampToValueAtTime(500, t + 0.5);
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(e.v, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + e.d);
      o.connect(lp); lp.connect(g); g.connect(musBus); o.start(t); o.stop(t + e.d + 0.05); return;
    }
    o.type = 'sine'; o.frequency.value = f;   // 🎵 the music box
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(e.v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + e.d);
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + e.d + 0.05);
    const o2 = actx.createOscillator(), g2 = actx.createGain(); o2.type = 'sine'; o2.frequency.value = f * 3.01;
    g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(e.v * 0.12, t + 0.015); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
    o2.connect(g2); g2.connect(musBus); o2.start(t); o2.stop(t + 0.6);
  } catch (_) {}
}
function musicTick() {
  if (!running() || !musBus) { mus.t0 = null; return; }
  const now = actx.currentTime;
  if (mus.t0 === null || now - mus.last > 1) { mus.t0 = now + 0.2; mus.k = 0; mus.loop = 0; }   // (re)start cleanly: never a pile-up
  mus.last = now;
  for (let guard = 0; guard < 200; guard++) {
    const e = SONG_EV[mus.k], t = mus.t0 + (mus.loop * SONG_BEATS + e.b) * BEAT;
    if (t > now + 0.5) break;
    if (t >= now - 0.02) songNote(e, t);
    if (++mus.k >= SONG_EV.length) { mus.k = 0; mus.loop++; }
  }

function startMusic() { if (!mus.timer) mus.timer = setInterval(musicTick, 100); fadeAll(); }
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || (/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '';
// ---------- save + trophy ----------
let save = { tried: {}, flowers: 0, mirror: 0, feelings: 0, tips: 0, friends: 0, balloons: 0, trophy: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('friendGarden') || '{}')); } catch (_) {}
function store() { try { localStorage.setItem('friendGarden', JSON.stringify(save)); } catch (_) {} }
let toast = '', toastT = 0;
function tried(id) {
  save.tried[id] = 1;
  if (!save.trophy && Object.keys(save.tried).length >= 4) {
    save.trophy = true; trophy('friendGarden'); toast = '🏆 You earned the Friendship Garden trophy! 🌻'; toastT = 360;
    softNote(523, 1.4, 0.1, 0.3); softNote(659, 1.4, 0.1, 0.6); softNote(784, 2, 0.1, 0.9);
  }
  store();
}
// ---------- the garden at golden hour: a peachy sky, a low warm sun, soft hills, a little fence, swaying grass ----------
const SKY = document.createElement('canvas'); SKY.width = W; SKY.height = H;
(function paintSky() {
  const s = SKY.getContext('2d'), g = s.createLinearGradient(0, 0, 0, 340);
  g.addColorStop(0, '#8fb8e8'); g.addColorStop(0.45, '#f6c9a8'); g.addColorStop(0.8, '#ffd59a'); g.addColorStop(1, '#ffe7b0');
  s.fillStyle = g; s.fillRect(0, 0, W, H);
  const sg = s.createRadialGradient(735, 300, 10, 735, 300, 360); sg.addColorStop(0, 'rgba(255,240,190,.9)'); sg.addColorStop(1, 'rgba(255,220,160,0)');
  s.fillStyle = sg; s.fillRect(0, 0, W, H);
  s.fillStyle = '#fff4c8'; s.beginPath(); s.arc(735, 300, 46, 0, 7); s.fill();   // the low, sleepy sun
  const hill = (y0, amp, col, ph) => { s.fillStyle = col; s.beginPath(); s.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) s.lineTo(x, y0 + Math.sin(x / 140 + ph) * amp + Math.sin(x / 57 + ph * 2) * amp * 0.25); s.lineTo(W, H); s.fill(); };
  hill(318, 14, '#c7c98a', 1); hill(338, 12, '#a9bf72', 2.6); hill(360, 8, '#93b862', 0.4);
  const gg = s.createLinearGradient(0, 360, 0, 470); gg.addColorStop(0, '#8fbf5e'); gg.addColorStop(1, '#6fa648'); s.fillStyle = gg; s.fillRect(0, 372, W, 110);
  s.fillStyle = 'rgba(255,230,150,.18)'; s.fillRect(0, 372, W, 110);   // golden light on the grass
  for (let i = 0; i < 4; i++) {   // a few far-away trees
    const tx = [70, 205, 470, 610][i], ty = [326, 334, 330, 340][i];
    s.fillStyle = '#7a5a3a'; s.fillRect(tx - 3, ty - 4, 6, 18); s.fillStyle = ['#7fa556', '#8aae5c', '#79a04f', '#86aa58'][i];
    s.beginPath(); s.arc(tx, ty - 14, 16, 0, 7); s.arc(tx - 10, ty - 6, 11, 0, 7); s.arc(tx + 10, ty - 6, 11, 0, 7); s.fill();
  }
  s.fillStyle = '#6b4a30'; s.fillRect(0, 466, W, 74);   // the flower bed: soft brown dirt
  const dg = s.createLinearGradient(0, 466, 0, 540); dg.addColorStop(0, '#8a6342'); dg.addColorStop(1, '#5e4029'); s.fillStyle = dg; s.fillRect(0, 470, W, 70);
  s.fillStyle = 'rgba(40,25,15,.25)'; for (let i = 0; i < 160; i++) { s.beginPath(); s.arc((i * 97) % W, 478 + (i * 37) % 60, 1.5 + (i % 3), 0, 7); s.fill(); }
  s.fillStyle = '#5e7a3a'; s.beginPath(); s.ellipse(W / 2, 470, W * 0.6, 6, 0, 0, 7); s.fill();   // the grassy edge of the bed
})();
const CLOUDS = [[120, 70, 1], [420, 50, 0.8], [640, 110, 0.7], [860, 60, 0.9]];
function puff(x, y, s, col) { ellipse(x, y, 46 * s, 18 * s, col); circle(x - 18 * s, y - 8 * s, 20 * s, col); circle(x + 12 * s, y - 14 * s, 24 * s, col); }
function drawSky() {
  ctx.drawImage(SKY, 0, 0);

function drawFence() {   // a little white picket fence along the back of the garden
  for (let x = 20; x < W; x += 38) { roundRect(x - 7, 352, 14, 54, 3, '#fff5e6'); ctx.fillStyle = '#fff5e6'; ctx.beginPath(); ctx.moveTo(x - 7, 354); ctx.lineTo(x, 344); ctx.lineTo(x + 7, 354); ctx.fill(); }

const TUFTS = Array.from({ length: 70 }, (_, i) => [(i * 137) % W, 410 + (i * 53) % 52]);
function drawGrass() {

// ✨ golden sparkles drifting in the sunlight, and 🦋 little butterflies wandering about
const MOTES = Array.from({ length: 26 }, (_, i) => ({ x: Math.random() * W, y: 120 + Math.random() * 320, p: Math.random() * 6 }));
function drawMotes() {
  for (const m of MOTES) {

function butterfly(x, y, s, c1, c2, t, o = {}) {   // wings open and close; o.face = a happy little face

const FLYERS = [{ c1: '#ffb3c6', c2: '#ffd6e0', p: 0 }, { c1: '#b39ddb', c2: '#d1c4e9', p: 2.1 }, { c1: '#ffe082', c2: '#fff3c4', p: 4.2 }];

// ---------- 🤖 Robo + 🧹 Dusty (copied exactly from Robo's Hug Corner / Robo: The Beginning) ----------
const ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff', edge: '#9fa8da' };

  glow(230, 330, 150, 'rgba(255,230,240,.9)', 0.7);
  p.draw(215, 420, happy); drawEasel(375, 430); label(p.icon + ' ' + p.name, 230, 455);
  for (const h of palHearts) { h.y -= 0.8; h.x += Math.sin(h.life * 0.1) * 0.6; h.life--; ctx.save(); ctx.globalAlpha = clamp(h.life / 30, 0, 1); heart(h.x, h.y, h.s, h.c); ctx.restore(); }
  palHearts = palHearts.filter(h => h.life > 0);
  ctx.save(); ctx.globalAlpha = clamp(palT / 18, 0, 1);
  roundRect(470, 100, 400, 140, 24, happy ? '#ffe3ee' : '#f3ecff');
  const L = wrap(happy ? p.says[palSaid] : p.name + ' is here! What do you want to say?', 360, 22);
  L.forEach((l, i) => text(l, 670, 170 + (i - (L.length - 1) / 2) * 30, 22, happy ? '#a03a6a' : '#5a4a8a'));
  ctx.restore();
  if (happy && palT > 50) text('⭐ Great job! That is how friendships start!', 670, 262, 18, '#b07a3a');
  SAYS.forEach(([e, s], k) => button(480, 285 + k * 56, 380, 48, e + ' "' + s + '"', palSaid === k ? '#ffd1e0' : '#fff0c8', () => sayToPal(k), 19));
  button(480, 455, 190, 46, '🔄 Meet a new friend', '#e0d4ff', nextPal, 17);
  button(680, 455, 180, 46, '🌻 Back to garden', '#c8f0b0', closePanel, 17);
}
// ---------- 🐱 Sammy, sitting in the grass: tap him for a little love ----------
let samHappy = 0, samHearts = [];
function petSammy() {
  samHappy = 120; softNote(392, 0.8, 0.06); softNote(523, 1, 0.05, 0.15);
  for (let k = 0; k < 4; k++) samHearts.push({ x: SAMMY.x + (Math.random() - 0.5) * 40, y: SAMMY.y - 80, s: 6 + Math.random() * 4, c: ['#ff8fab', '#ffb3c6', '#ffc8a2'][k % 3], life: 70 + k * 8 });
  if (Math.random() < 0.6) say(['Prrr! Sammy loves you, Ben.', 'Slow blink from Sammy. That means I love you!', 'Sammy rubs his head on your hand. Purr!'][Math.floor(Math.random() * 3)], '🐱');
}
// ---------- the main picture ----------
let started = !!JB_WANT;
function draw() {
  BTN = [];
  drawSky(); drawFence(); drawGrass(); drawMotes();
  drawMirror(MIR.x, MIR.y, 1); drawCat(SAMMY.x, SAMMY.y, 'sammy', { s: 1.15, happy: samHappy > 0 });
  for (const h of samHearts) { ctx.save(); ctx.globalAlpha = clamp(h.life / 30, 0, 1); heart(h.x, h.y, h.s, h.c); ctx.restore(); }
  drawRobo(ROB.x, ROB.y, { s: 2.2, wave: (frame % 700) < 140, happy: gardenFullT > 0 });
  drawFriendsSpot(); drawBalloon(); drawBigButterfly(); drawFlyers();
  if (gardenFullT > 0) glow(W / 2, 470, 520, 'rgba(255,230,160,.5)', 0.35 + 0.15 * Math.sin(frame * 0.04));
  for (const f of flowers) drawFlower(f); drawPuffs();
  if (started && !panel) {
    label('🪞 Magic Mirror', MIR.x + 6, 222); label("💬 Robo's Tips", ROB.x, 320); label('🦋 How do you feel?', BFLY.x, 272);
    label('🌈 Make a Friend', FR.x, 334); if (bal.state === 'home' && bal.a >= 1) label('🎈 Let it float!', 878, 102);
    if (!flowers.length) { const p = 1 + Math.sin(frame * 0.08) * 0.04; ctx.save(); ctx.translate(W / 2, 498); ctx.scale(p, p); label('🌱 Tap the dirt to plant a flower for someone who loves you!', 0, 0); ctx.restore(); }
  }
  text('🌻 The Friendship Garden', 22, 30, 26, '#7a3f1a', 'left');
  if (started && flowers.length) label('🌻 ' + flowers.length + (flowers.length === 1 ? ' flower = 1 who loves you!' : ' flowers = ' + flowers.length + ' who love you!'), 500, 30);
  if (started) {
    button(W - 252, 12, 120, 42, musicOn ? '🎵 Music' : '🎵 Off', musicOn ? '#ffe0a8' : '#d8ccc0', () => { musicOn = !musicOn; fadeAll(); }, 18);
    button(W - 124, 12, 112, 42, soundOn ? '🔈 Sound' : '🔇 Off', soundOn ? '#ffe0a8' : '#d8ccc0', () => { soundOn = !soundOn; if (!soundOn) hush(); fadeAll(); }, 18);
  }
  if (!panel) drawTalk();
  if (panel) { panelT++; ({ mirror: drawMirrorPanel, feel: drawFeelPanel, tips: drawTipsPanel, friend: drawFriendPanel })[panel](); }
  drawToast();
  if (!started) {
    ctx.save(); ctx.globalAlpha = 0.4; ctx.fillStyle = '#3a2a1e'; ctx.fillRect(0, 0, W, H); ctx.restore();
    roundRect(W / 2 - 270, 160, 540, 210, 30, 'rgba(255,250,236,.97)');
    text('🌻 The Friendship Garden 🌻', W / 2, 212, 34, '#b0602a');
    text('A sunny, peaceful place, just for you 🦋💛', W / 2, 258, 20, '#8a5a3a', 'center', false);
    roundRect(W / 2 - 160, 290, 320, 58, 29, '#ffd36e'); text('👉 Tap to step inside!', W / 2, 320, 24, '#6b3f2a');
  }
}
function update() {
  updateFlowers(); updateBalloon();
  if (samHappy > 0) samHappy--; for (const h of samHearts) { h.y -= 0.6; h.x += Math.sin(h.life * 0.1) * 0.4; h.life--; } samHearts = samHearts.filter(h => h.life > 0);
  if (gardenFullT > 0 && ++gardenFullT === 330) say('Look, Ben! Your whole garden is full of love. So many people and friends love you!', '🤖');
  if (started && --birdT <= 0) { birdT = 420 + Math.random() * 480; birds(); }
}
function loop() { frame++; update(); draw(); requestAnimationFrame(loop); }
// ---------- tapping ----------
function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function begin() {
  started = true; audio(); fadeAll(); startMusic(); startBreeze(); setTimeout(() => { startBreeze(); fadeAll(); }, 300);
  say("Welcome to the Friendship Garden, Ben. It's a sunny, peaceful place, just for you.", '🤖');
}
function tap(x, y) {
  if (!started) { begin(); return; }
  audio(); if (!breeze) startBreeze();
  for (const b of BTN.slice().reverse()) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); if (!panel || b.fn === closePanel) plip(); return; }
  if (panel === 'mirror' && Math.hypot((x - W / 2) / 135, (y - 262) / 173) < 1) { nextMirror(); return; }
  if (panel) return;
  if (bal.state === 'home' && (Math.hypot(x - bal.x, y - bal.y) < 50 || (Math.abs(x - bal.x) < 45 && y > bal.y + 70 && y < bal.y + 125))) { letGo(); return; }
  if (Math.abs(x - MIR.x) < 58 && y > 225 && y < 450) { openPanel('mirror'); mirK = -1; nextMirror(); tried('mirror'); return; }
  if (Math.hypot(x - BFLY.x, y - BFLY.y) < 80) { openPanel('feel'); feelK = -1; feelT = 0; speak('How do you feel right now? Every feeling is okay.'); tried('feel'); return; }
  if (Math.abs(x - ROB.x) < 52 && y > 325 && y < 458) { openPanel('tips'); nextTip(); tried('tips'); return; }
  if (Math.abs(x - FR.x) < 100 && y > 340 && y < 462) { openPanel('friend'); palSaid = -1; palT = 0; palHearts = []; speak(PALS[palK].name + ' is here. What do you want to say?', 0.85); tried('friend'); return; }
  if (Math.abs(x - SAMMY.x) < 42 && y > 380 && y < 462) { petSammy(); return; }
  if (y > 466) { plant(x); return; }
}
C.addEventListener('pointerdown', e => { const [x, y] = pos(e); tap(x, y); });
addEventListener('keydown', e => { if (e.key === 'Escape' && panel) closePanel(); });
if (JB_WANT) { audio(); musicOn = true; soundOn = true; setTimeout(() => { audio(); fadeAll(); startMusic(); }, 50); }
loop();
</script>
