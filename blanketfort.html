<!DOCTYPE html>

<script src="touchpad.js?v=11"></script>

<body>
<canvas id="c" width="960" height="540"></canvas>
<script>
// 🏕️ THE COZY BLANKET FORT: a soft quilt fort on a rainy evening. Fairy lights, a rainy window, pillows, a little lamp.
// Pet Sammy (purr + slow blink), hot cocoa with marshmallows, a star projector (Robo, Dusty, Sammy, Sparks constellations),
// worry clouds that float out the window and turn into rainbows, Robo's bedtime story, a breathing lantern, a kind-notes jar.
// All sound is VERY soft (master volume 0.1, slow fades). Trophy 'blanketFort' after trying 4 cozy things. Save: localStorage.blanketFort
// Music for the book's Jukebox: blanketfort.html?song=lullaby  (or window.JUKEBOX.song)
const C = document.getElementById('c'), ctx = C.getContext('2d'), W = 960, H = 540;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
// ---------- drawing helpers ----------
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;

function heart(x, y, s, fill = '#ff8fab') {

function rrect(x, y, w, h, r) {

function glow(x, y, r, col, a = 1) {

function wrap(s, maxW, size) {

  const out = []; let cur = '';
  for (const w of s.split(' ')) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }

// ---------- VERY soft sounds: one master knob (0.1), everything fades in and out slowly ----------
const MASTER = 0.1;
let actx = null, master = null, musBus = null, sfx = null, soundOn = true, musicOn = true;
function audio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      master = actx.createGain(); master.gain.value = 0; master.connect(actx.destination);
      musBus = actx.createGain(); musBus.gain.value = 0; musBus.connect(master);

}
function running() { return actx && actx.state === 'running'; }
function fadeAll() {   // slow fades for the master knob + the music

  } catch (_) {}
}
function softNote(f, d = 1, v = 0.12, when = 0, bus = sfx) {   // a round, gentle bell

  const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(v, t + 0.05); g.gain.exponentialRampToValueAtTime(0.0001, t + d);

const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.9, 0.1); }
function chime() { softNote(784, 1.6, 0.09); softNote(1175, 1.8, 0.05, 0.08); }
function plop() { softNote(392, 0.35, 0.12); softNote(523, 0.4, 0.06, 0.06); }
// 🌧️ soft rain: filtered noise, very quiet, fades in over a few seconds
let noiseBuf = null, rain = null;
function noise() {
  if (!noiseBuf) { noiseBuf = actx.createBuffer(1, actx.sampleRate * 2, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
  const s = actx.createBufferSource(); s.buffer = noiseBuf; s.loop = true; return s;
}
function startRain() {
  if (rain || !running()) return;
  try {
    const src = noise(), hp = actx.createBiquadFilter(), lp = actx.createBiquadFilter(), g = actx.createGain();
    hp.type = 'highpass'; hp.frequency.value = 700; lp.type = 'lowpass'; lp.frequency.value = 3200;
    g.gain.value = 0; src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(master); src.start();
    g.gain.setTargetAtTime(0.22, actx.currentTime, 2.5); rain = { src, g };
  } catch (_) {}
}
// 🐱 a soft, low purr: low noise that gently pulses ~24 times a second
let purrN = null;
function purr(on) {
  if (!running()) return;
  try {
    if (!purrN) {
      const src = noise(), f = actx.createBiquadFilter(), am = actx.createGain(), lfo = actx.createOscillator(), depth = actx.createGain(), env = actx.createGain();
      f.type = 'lowpass'; f.frequency.value = 200; f.Q.value = 0.8;
      am.gain.value = 0.5; lfo.frequency.value = 23; depth.gain.value = 0.5; lfo.connect(depth); depth.connect(am.gain);
      env.gain.value = 0; src.connect(f); f.connect(am); am.connect(env); env.connect(sfx); src.start(); lfo.start();
      purrN = { env };
    }
    purrN.env.gain.setTargetAtTime(on ? 1.1 : 0, actx.currentTime, on ? 0.35 : 0.6);
  } catch (_) {}
}
// 🗣️ the gentle voice (slow and soft). The music gets quieter while someone talks.
function speak(line, rate = 0.82, pitch = 1.05) {
  try {
    if (!soundOn || !window.speechSynthesis) return; speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(line.replace(/[^\w\s!?.,'’:-]/g, '').replace(/\s+/g, ' ').trim());
    u.rate = rate; u.pitch = pitch; u.volume = 0.7; u.onend = fadeAll; speechSynthesis.speak(u); setTimeout(fadeAll, 150);
  } catch (_) {}
}
function hush() { try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (_) {} setTimeout(fadeAll, 100); }
// 🎶 "Blanket Fort Lullaby": an original music-box waltz (3/4). Plays VERY quietly. Loops every ~26 seconds.
const LULL = [[76, 2], [72, 1], [67, 2], [72, 1], [74, 1], [76, 1], [74, 1], [72, 3],
  [76, 2], [79, 1], [81, 2], [79, 1], [76, 2], [74, 1], [76, 3],
  [77, 2], [76, 1], [74, 2], [72, 1], [69, 2], [72, 1], [74, 3],
  [76, 2], [72, 1], [67, 2], [69, 1], [71, 2], [74, 1], [72, 3]];
const LULL_BASS = [48, 43, 43, 48, 48, 41, 48, 48, 41, 43, 45, 43, 48, 45, 43, 48];
const BEAT = 0.55, LULL_BEATS = 48;
const LULL_EV = (() => { const ev = []; let b = 0;
  LULL.forEach(([m, d]) => { ev.push({ b, m, d: 2.4, v: 0.22, box: 1 }); b += d; });
  LULL_BASS.forEach((m, bar) => { ev.push({ b: bar * 3, m, d: 2.2, v: 0.14 }); ev.push({ b: bar * 3 + 1.5, m: m + 19, d: 1.2, v: 0.035 }); });
  return ev.sort((a, c) => a.b - c.b); })();
const mus = { timer: null, t0: null, k: 0, loop: 0, last: 0 };
function boxNote(e, t) {   // a music-box "ting": a sine with a small, quick-fading sparkle above it
  try {
    const f = 440 * Math.pow(2, (e.m - 69) / 12), o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(e.v, t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t + e.d);
    o.connect(g); g.connect(musBus); o.start(t); o.stop(t + e.d + 0.05);
    if (e.box) {
      const o2 = actx.createOscillator(), g2 = actx.createGain(); o2.type = 'sine'; o2.frequency.value = f * 3.01;
      g2.gain.setValueAtTime(0.0001, t); g2.gain.linearRampToValueAtTime(e.v * 0.12, t + 0.015); g2.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o2.connect(g2); g2.connect(musBus); o2.start(t); o2.stop(t + 0.6);
    }
  } catch (_) {}
}
function musicTick() {
  if (!running() || !musBus) { mus.t0 = null; return; }
  const now = actx.currentTime;
  if (mus.t0 === null || now - mus.last > 1) { mus.t0 = now + 0.2; mus.k = 0; mus.loop = 0; }   // (re)start cleanly: never a pile-up
  mus.last = now;
  for (let guard = 0; guard < 200; guard++) {
    const e = LULL_EV[mus.k], t = mus.t0 + (mus.loop * LULL_BEATS + e.b) * BEAT;
    if (t > now + 0.5) break;
    if (t >= now - 0.02) boxNote(e, t);

function startMusic() { if (!mus.timer) mus.timer = setInterval(musicTick, 100); fadeAll(); }
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || (/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '';
// ---------- save + trophy ----------
let save = { tried: {}, pets: 0, mallows: 0, clouds: 0, notes: 0, stories: 0, breaths: 0, trophy: false };
try { Object.assign(save, JSON.parse(localStorage.getItem('blanketFort') || '{}')); } catch (_) {}
function store() { try { localStorage.setItem('blanketFort', JSON.stringify(save)); } catch (_) {} }
let toast = '', toastT = 0;
function tried(id) {
  save.tried[id] = 1;
  if (!save.trophy && Object.keys(save.tried).length >= 4) {
    save.trophy = true; trophy('blanketFort'); toast = '🏆 You earned the Blanket Fort trophy! 💛'; toastT = 360;
    softNote(523, 1.4, 0.1, 0.3); softNote(659, 1.4, 0.1, 0.6); softNote(784, 2, 0.1, 0.9);
  }
  store();
}
// ---------- the fort: quilt walls (drawn once), a draped ceiling, fairy lights ----------
const PATCH = ['#c97a63', '#e3b76c', '#93ad8c', '#efdcbc', '#b58aa3', '#7f9cba', '#d99b8a', '#a9b98a'];
const quilt = document.createElement('canvas'); quilt.width = W; quilt.height = H;
(function makeQuilt() {
  const q = quilt.getContext('2d'), S = 64;
  for (let r = 0; r < 9; r++) for (let c = 0; c < 16; c++) {
    const x = c * S, y = r * S, col = PATCH[(r * 5 + c * 3 + (r * c) % 3) % PATCH.length], k = (r * 7 + c * 11) % 4;
    q.fillStyle = col; q.fillRect(x, y, S, S);
    q.fillStyle = 'rgba(255,255,255,.18)';
    if (k === 0) { for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) { q.beginPath(); q.arc(x + 8 + i * 16, y + 8 + j * 16, 2.6, 0, 7); q.fill(); } }
    else if (k === 1) { for (let i = 0; i < 4; i++) q.fillRect(x, y + 4 + i * 16, S, 7); }
    else if (k === 2) { q.beginPath(); q.moveTo(x + S / 2, y + 10); q.lineTo(x + S - 10, y + S / 2); q.lineTo(x + S / 2, y + S - 10); q.lineTo(x + 10, y + S / 2); q.fill(); }
    else { q.fillStyle = 'rgba(255,240,220,.22)'; q.beginPath(); q.arc(x + 32, y + 30, 9, 0, 7); q.arc(x + 22, y + 38, 7, 0, 7); q.arc(x + 42, y + 38, 7, 0, 7); q.fill(); }
    q.strokeStyle = 'rgba(255,248,230,.5)'; q.lineWidth = 1.5; q.setLineDash([5, 4]); q.strokeRect(x + 4, y + 4, S - 8, S - 8); q.setLineDash([]);
    q.strokeStyle = 'rgba(70,40,40,.25)'; q.lineWidth = 2; q.strokeRect(x, y, S, S);
  }
  const v = q.createRadialGradient(W / 2, H * 0.55, 120, W / 2, H * 0.55, 620);   // evening shade at the edges
  v.addColorStop(0, 'rgba(60,30,40,0)'); v.addColorStop(1, 'rgba(40,20,35,.55)'); q.fillStyle = v; q.fillRect(0, 0, W, H);
})();
const CEIL = (x) => 70 + 46 * Math.sin(Math.PI * ((x % 480) / 480));   // the blanket ceiling sags between 3 tie-up points
function drawCeiling() {
  ctx.fillStyle = '#7d4a63'; ctx.beginPath(); ctx.moveTo(0, 0);
  for (let x = 0; x <= W; x += 8) ctx.lineTo(x, CEIL(x)); ctx.lineTo(W, 0); ctx.fill();
  ctx.save(); ctx.clip(); ctx.strokeStyle = 'rgba(255,214,170,.18)'; ctx.lineWidth = 8;   // a soft plaid
  for (let x = -40; x < W + 40; x += 48) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x + 20, 130); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(40,20,40,.18)'; ctx.lineWidth = 6; for (let y = 14; y < 130; y += 34) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }

  for (const x of [0, 480, 960]) { circle(x, 66, 12, '#f2d8b8'); circle(x, 66, 6, '#d9b48f'); }   // little ribbon knots

const BULBS = [];
for (let i = 0; i < 34; i++) { const x = 12 + i * 28.3; BULBS.push({ x, y: CEIL(x) + 14 + 9 * Math.sin(i * 1.3), c: ['#ffd27a', '#ffb38a', '#ffe9a8', '#ffa8b8', '#c8e6a0'][i % 5], p: i * 1.7 }); }

  ctx.strokeStyle = '#3d2b2b'; ctx.lineWidth = 1.5; ctx.beginPath();
  BULBS.forEach((b, i) => (i ? ctx.lineTo(b.x, b.y - 4) : ctx.moveTo(b.x, b.y - 4))); ctx.stroke();
  for (const b of BULBS) {
    const tw = 0.62 + 0.38 * Math.sin(frame * 0.018 + b.p);   // a slow, soft twinkle (never a flash)

// ---------- 🌧️ the rainy window ----------
const WIN = { x: 60, y: 150, w: 220, h: 175 };
const DROPS = Array.from({ length: 70 }, (_, i) => ({ x: (i * 37) % 230, y: (i * 61) % 190, sp: 2.2 + (i % 5) * 0.5, l: 7 + (i % 4) * 3 }));
const TRICKLES = Array.from({ length: 7 }, (_, i) => ({ x: 18 + i * 30, y: (i * 47) % 160, sp: 0.15 + (i % 3) * 0.08 }));
let rainbowA = 0, rainbowT = 0;
function inWin(x, y) { return x > WIN.x && x < WIN.x + WIN.w && y > WIN.y && y < WIN.y + WIN.h; }
function drawWindow(hot) {

    ctx.quadraticCurveTo(cx + 4 * f, y + 80, cx + 10 * f, y + h + 12); ctx.lineTo(cx - 16 * f, y + h + 12); ctx.fill();

// ---------- ☁️ the worry cloud (drag it out the window!) ----------
const CLOUD_HOME = { x: 395, y: 222 };

  if (Math.abs(x - LAMP.x) < 40 && y > LAMP.y - 54 && y < LAMP.y + 30) { lampOn = !lampOn; softNote(lampOn ? 659 : 523, 0.8, 0.08); return; }
  if (inSammy(x, y)) { petSammy(x, y); return; }
  if (inWin(x, y)) { softNote(1047, 1.2, 0.04); return; }
}
function addMallow() {

    mallows.push({ dx: -16 + ((mallows.length * 13) % 32) + Math.random() * 4, dy: -2 + (mallows.length % 2) * 3, y: MUG.y - 120 }); plop(); save.mallows++; store();
    if (mallows.length === 1) say('A fluffy marshmallow! Tap for more.', '☕');

  } else { mallows = []; softNote(330, 1.2, 0.08); softNote(440, 1.4, 0.05, 0.2); say('Sip... ahhh. Warm and cozy all the way down.', '☕'); }
}
C.addEventListener('pointerdown', e => { const [x, y] = pos(e); down = true; tap(x, y); });
C.addEventListener('pointermove', e => {
  const [x, y] = pos(e);
  if (drag) { cloud.x = clamp(x + cloud.ox, 30, W - 30); cloud.y = clamp(y + cloud.oy, 30, H - 30); return; }

});
function release() {
  down = false; if (!drag) return; drag = null;
  if (inWin(cloud.x, cloud.y)) {
    Object.assign(cloud, { state: 'float', k: 0, s: 0.8 }); save.clouds++; tried('cloud');
    say(CLOUD_LINES[cloudLine++ % CLOUD_LINES.length], '🌈'); softNote(523, 1.6, 0.07); softNote(659, 1.6, 0.06, 0.3); softNote(784, 2, 0.05, 0.6);
  } else cloud.state = 'back';
}
addEventListener('pointerup', release); addEventListener('pointercancel', release);
addEventListener('keydown', e => { if (e.key === 'Escape') { story.on = false; breath.on = false; hush(); } });
