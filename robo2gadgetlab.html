function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let S = { coins: 1000, cart: [], gift: false, giftTo: 'Mom', orders: [], printedKeys: [], n: 0 };
try { const s = JSON.parse(localStorage.getItem(SHOP.key) || 'null'); if (s && typeof s === 'object') S = Object.assign(S, s); } catch (_) {}
if (!Array.isArray(S.cart)) S.cart = []; if (!Array.isArray(S.orders)) S.orders = []; if (!Array.isArray(S.printedKeys)) S.printedKeys = []; if (!(S.coins >= 0)) S.coins = 1000;
S.cart = S.cart.filter(k => PRODUCTS.some(p => p.k === k));
function save() { try { localStorage.setItem(SHOP.key, JSON.stringify(S)); } catch (_) {} }
const PR = k => PRODUCTS.find(p => p.k === k);
const PAGES = k => PR(k).pages();
const dayNum = Math.floor((Date.now() - new Date().getTimezoneOffset() * 60000) / 86400000);
const DEAL = PRODUCTS[dayNum % (PRODUCTS.length - 1)].k;              // never the Mega Set
const priceOf = k => k === DEAL ? Math.ceil(PR(k).price / 2) : PR(k).price;
const GIFT_COST = 10, GIFT_NAMES = ['Mom', 'Dad', 'Brother', 'Grandma', 'Grandpa', 'Friend'];
function uiSVG(vb, draw, ex) { beginArt(false); const b = draw(); return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="' + vb + '" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs>' + b + '</svg>'; }
function sheet(fn, line) { beginArt(line); CW = 1; const b = fn(); return svgWrap(b); }
const THUMB = {};
function thumb(k) { if (!THUMB[k]) THUMB[k] = sheet(PAGES(k)[0], false); const d = document.createElement('div'); d.className = 'thumb'; d.innerHTML = THUMB[k]; return d; }
const $ = id => document.getElementById(id);
let view = 'shop', CAT = 'all', talkT = 0, printBox = null, printMode = 'color';
// 🔊 soft sounds (one master volume)
let AC = null, MASTER = null;
function audio() { if (!AC) { AC = new (window.AudioContext || window.webkitAudioContext)(); MASTER = AC.createGain(); MASTER.gain.value = 0.25; MASTER.connect(AC.destination); } return AC; }
function beep(f, d = 0.12, type = 'sine', vol = 0.06, when = 0, f2) {
  try { audio(); vol *= 4; const t = AC.currentTime + when, o = AC.createOscillator(), g = AC.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + d); o.connect(g); g.connect(MASTER); o.start(t); o.stop(t + d + 0.03); } catch (_) {}
}
const sfx = {
  click: () => beep(660, 0.08, 'sine', 0.05),
  add: () => { beep(784, 0.12, 'square', 0.03); beep(1175, 0.16, 'square', 0.025, 0.09); },
  cash: () => { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.3, 'triangle', 0.06, i * 0.1)); },
  soft: () => { [392, 330].forEach((f, i) => beep(f, 0.18, 'sine', 0.05, i * 0.1)); },
  zap: () => beep(300, 0.35, 'sine', 0.05, 0, 1200),
};
function say(s) {
  $('bubble').textContent = s; talkT = Math.min(16, 4 + s.length / 8); drawHelper();
  try {
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(s.replace(/B33P/g, 'Beep beep').replace(/\.\.\./g, ', ').replace(/[^\w\s!?,.'-]/g, ' '));
    u.pitch = 1.7; u.rate = 1.05; u.volume = 0.85; speechSynthesis.speak(u);
  } catch (_) {}
}
const pick = a => a[Math.floor(Math.random() * a.length)];
function drawHelper() {
  const t = talkT > 0, blink = !t && Math.random() < .08;
  $('helper').innerHTML = uiSVG('-26 -46 52 50', () => robo2({ happy: t && Math.floor(talkT) % 2 === 0, blink }));
  $('helper').classList.toggle('talk', t);
}
setInterval(() => { if (talkT > 0) talkT--; drawHelper(); }, 300);
function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function stars(n) { return '★★★★★'.slice(0, n) + '<span style="color:#ddd">' + '★★★★★'.slice(n) + '</span>'; }
function avg(p) { return (p.revs.reduce((a, r) => a + r[1], 0) / p.revs.length).toFixed(1); }
function updateTop() {
  $('amt').textContent = S.coins; $('cCount').textContent = S.cart.length;
  for (const [id, v] of [['tShop', 'shop'], ['tCart', 'cart'], ['tOrders', 'orders']]) $(id).classList.toggle('on', view === v);
}
function show(v) { view = v; render(); $('main').scrollTop = 0; }
function render() { updateTop(); const m = $('main'); m.innerHTML = ''; if (view === 'shop') renderShop(m); else if (view === 'cart') renderCart(m); else renderOrders(m); }
function renderShop(m) {
  const sc = el('div', 'scene'); sc.innerHTML = uiSVG('0 0 1200 170', SHOP.scene, 'preserveAspectRatio="xMidYMid slice"'); m.appendChild(sc);
  m.appendChild(el('div', 'idea', SHOP.idea)); if (SHOP.sizeNote) m.appendChild(el('div', 'sizeNote', SHOP.sizeNote));
  const bar = el('div', 'cats'); m.appendChild(bar);
  for (const [c, nm] of SHOP.cats) { const cnt = c === 'all' ? PRODUCTS.length : PRODUCTS.filter(p => p.cat === c).length;
    const b = el('button', 'catb' + (CAT === c ? ' on' : ''), nm + ' <span>' + cnt + '</span>');
    b.onclick = () => { CAT = c; sfx.click(); say(c === 'mega' ? 'The MEGA SET! Everything in my shop, plus a bonus! B33P!' : 'B33P! ' + nm.replace(/^\S+ /, '') + '!'); show('shop'); }; bar.appendChild(b); }
  const grid = el('div'); grid.id = 'grid'; m.appendChild(grid);
  const list = PRODUCTS.filter(p => CAT === 'all' || p.cat === CAT).sort((a, b) => (b.mega ? 2 : 0) + (b.k === DEAL ? 1 : 0) - (a.mega ? 2 : 0) - (a.k === DEAL ? 1 : 0));
  for (const p of list) {
    const card = el('div', 'card' + (p.mega ? ' mega' : '')); card.id = 'card_' + p.k;
    card.appendChild(el('div', 'tag ' + (p.mega ? 'gold' : p.k === DEAL ? '' : 'new'), p.mega ? '🎁 MEGA SET' : p.k === DEAL ? '🔥 HALF PRICE!' : '✨ NEW!'));
    card.appendChild(thumb(p.k)); card.appendChild(el('h3', '', p.name)); card.appendChild(el('div', 'blurb', p.blurb));
    card.appendChild(el('div', 'size', '📏 ' + p.size + (p.gu ? '  •  ✂️ grown-up help' : '')));
    card.appendChild(el('div', 'price', (p.k === DEAL ? '<s>' + p.price + '</s>' : '') + SHOP.coin + ' ' + priceOf(p.k)));
    const r = p.revs[0]; card.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`));
    const row = el('div', 'row'), inCart = S.cart.includes(p.k), add = el('button', 'add' + (inCart ? ' in' : ''), inCart ? '✅ IN CART' : '🛒 ADD TO CART');
    add.onclick = () => toggleCart(p.k); const rb = el('button', 'revbtn', '⭐ ' + avg(p)); rb.onclick = () => openReviews(p.k);
    row.append(add, rb); card.appendChild(row); grid.appendChild(card);
  }
}
function toggleCart(k) {
  const i = S.cart.indexOf(k);
  if (i >= 0) { S.cart.splice(i, 1); sfx.click(); say('Okay! I took it out of your cart.'); }
  else { S.cart.push(k); sfx.add(); say(PR(k).mega ? 'The MEGA SET! B33P B33P! That is EVERYTHING!' : pick(SHOP.adds)); }
  save(); const st = $('main').scrollTop; render(); $('main').scrollTop = st;
}
function openReviews(k) {
  const p = PR(k), box = $('revIn'); box.innerHTML = ''; box.appendChild(el('div', 'h2', '⭐ Reviews: ' + p.name));
  p.revs.forEach(r => box.appendChild(el('div', 'rev', `<span class="stars">${stars(r[1])}</span> <span class="who">${r[0]}:</span> "${r[2]}"`)));
  const c = el('button', 'bigbtn', '👍 OK!'); c.style.marginTop = '10px'; c.style.width = '100%'; c.onclick = closeReviews; box.appendChild(c);
  $('revBox').style.display = 'flex'; sfx.click(); say('Here is what my friends say!');
}
function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const Lst = el('div', 'list'); m.appendChild(Lst); Lst.appendChild(el('div', 'h2', '🛒 My Cart'));
  if (!S.cart.length) { Lst.appendChild(el('div', 'empty', 'Your cart is empty! Let\'s go shopping!'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; Lst.appendChild(b); return; }
  for (const k of S.cart) {
    const line = el('div', 'line'); line.appendChild(thumb(k));
    line.appendChild(el('div', 'nm', PR(k).name + '<small>' + PR(k).size + (k === DEAL ? '  •  🔥 half price!' : '') + '</small>'));
    line.appendChild(el('div', 'pr', SHOP.coin + ' ' + priceOf(k)));
    const x = el('button', 'xbtn', '✖'); x.onclick = () => toggleCart(k); line.appendChild(x); Lst.appendChild(line);
  }
  const t = el('div', 'total'), g = el('button', 'gift' + (S.gift ? ' on' : ''), (S.gift ? '✅' : '🎁') + ' Gift wrap (+' + GIFT_COST + ')');
  g.onclick = () => { S.gift = !S.gift; save(); sfx.click(); say(S.gift ? 'B33P! Gift wrap! Who is it for?' : 'No gift wrap. Okay!'); render(); };
  t.appendChild(g);
  if (S.gift) for (const nm of GIFT_NAMES) { const b = el('button', 'gift' + (S.giftTo === nm ? ' on' : ''), nm); b.style.padding = '8px 10px'; b.onclick = () => { S.giftTo = nm; save(); sfx.click(); say('A gift for ' + nm + '! So kind, Ben!'); render(); }; t.appendChild(b); }
  t.appendChild(el('span', '', 'TOTAL: ' + SHOP.coin + ' ' + cartTotal()));
  const go = el('button', 'bigbtn green', '✅ CHECKOUT'); go.onclick = checkout; t.appendChild(go); Lst.appendChild(t);
}
function checkout() {
  if (!S.cart.length) return; const tot = cartTotal();
  if (tot > S.coins) { sfx.soft(); say('B33P! Not enough ' + SHOP.money.toLowerCase() + '! Tap Get more!'); const b = $('moreBucks'); b.style.background = '#ff1744'; b.style.color = '#fff'; setTimeout(() => { b.style.background = ''; b.style.color = ''; }, 1500); return; }
  S.coins -= tot; for (const k of S.cart) S.orders.push({ k, gift: !!S.gift, to: S.giftTo, n: ++S.n });
  const count = S.cart.length; S.cart = []; S.gift = false; save(); updateTop(); startShip(count);
}
function moreCoins() {
  S.coins += 500; save(); sfx.cash(); updateTop();
  const a = $('amt'); a.style.transform = 'scale(1.4)'; a.style.transition = 'transform .2s'; setTimeout(() => { a.style.transform = ''; }, 250);
  say(pick(['B33P! Here are 500 more ' + SHOP.money.toLowerCase() + '!', 'Ka-ching! 500 more! Pretend money is the best!', 'B33P! I mean... BEEP! More ' + SHOP.money.toLowerCase() + ' for Ben!']));
}
// 🚚 delivery: Robo 2.0 hops over with a box, then ORDER CONFIRMED
let shipOn = false, shipDone = false, shipTimer = 0;
function startShip(count) {
  shipOn = true; shipDone = false; $('ship').style.display = 'flex'; $('shipGo').style.display = 'none'; sfx.zap();
  $('shipArt').innerHTML = uiSVG('0 0 960 540', () => {
    let s = SHOP.shipBg();
    s += '<g class="walkR"><g class="hopG">' + R2at(150, 452, 220, { happy: true }) + G(150, 270, 1, R(-60, -80, 120, 80, 6, vshade('#d7a86e'), OL, 3) + R(-10, -80, 20, 80, 0, '#00e676', OL, 1.4) + T(0, -30, String(count), 30, '#fff', 'middle', ' stroke="' + OL + '" stroke-width="1.5"')) + '</g></g>';
    s += '<g id="okStamp" style="display:none"><g class="confirm">' + R(230, 120, 500, 150, 30, '#00c853', OL, 5) + T(480, 185, 'ORDER', 52, '#fff') + T(480, 245, 'CONFIRMED!', 52, '#fff') + '</g></g>';
    return s;
  });
  say(SHOP.shipLine);
  clearTimeout(shipTimer);
  shipTimer = setTimeout(() => { const ok = document.getElementById('okStamp'); if (ok) ok.style.display = ''; shipDone = true; $('shipGo').style.display = ''; sfx.cash(); say('ORDER CONFIRMED! B33P! Go to MY ORDERS and print the ones you want.'); }, 3400);
}
function closeShip() { if (!shipOn) return; shipOn = false; clearTimeout(shipTimer); $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const Lst = el('div', 'list'); m.appendChild(Lst); Lst.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) { Lst.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; Lst.appendChild(b); return; }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); Lst.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    const p = PR(o.k); if (!p) continue; const np = p.pages().length + (o.gift ? 1 : 0);
    const line = el('div', 'line'); line.appendChild(thumb(o.k));
    line.appendChild(el('div', 'nm', p.name + `<small>Order #${o.n}${o.gift ? '  •  🎁 for ' + o.to : ''}  •  ${np} page${np > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); Lst.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT. COLOR or BLACK + WHITE.
let printList = [];
function printPagesFor(list, line) {
  const out = [];
  for (const o of list) { const p = PR(o.k); if (!p) continue; if (o.gift) out.push(sheet(() => giftPage(o.to), line)); p.pages().forEach(f => out.push(sheet(f, line))); }
  return out;
}
function fillPrint() {
  if (!printBox) return; printBox.querySelectorAll('.pbPage').forEach(e => e.remove());
  const pages = printPagesFor(printList, printMode === 'line');
  for (const svg of pages) { const d = el('div', 'pbPage'); d.innerHTML = svg; printBox.appendChild(d); }
  printBox.querySelector('.pbPrint').textContent = pages.length > 1 ? `🖨️ PRINT (${pages.length} pages)` : '🖨️ PRINT';
  printBox.querySelectorAll('.pbMode').forEach(b => b.classList.toggle('on', b.dataset.m === printMode));
}
function openPrint(list) {
  closePrint(true); printList = list.filter(o => PR(o.k)); if (!printList.length) return;
  const name = printList.length === 1 ? PR(printList[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), pr = el('button', 'pbPrint', '🖨️ PRINT');
  const mc = el('button', 'pbMode', '🎨 COLOR'), mb = el('button', 'pbMode', '⚫ BLACK + WHITE'); mc.dataset.m = 'color'; mb.dataset.m = 'line';
  mc.onclick = () => { printMode = 'color'; sfx.click(); fillPrint(); }; mb.onclick = () => { printMode = 'line'; sfx.click(); fillPrint(); say('Black and white! Now you can color it in yourself.'); };
  back.onclick = () => closePrint();
  pr.onclick = () => {
    sfx.click();
    for (const o of printList) { const p = PR(o.k); (p.mega ? PRODUCTS.filter(q => !q.mega).map(q => q.k) : [o.k]).forEach(k => { if (!S.printedKeys.includes(k)) S.printedKeys.push(k); }); }
    save(); if (S.printedKeys.length >= 3) trophy(SHOP.trophy);
    say('B33P! Printing! Ask a grown-up to help with the printer. Pick ACTUAL SIZE, 100 percent!');
    setTimeout(() => { try { window.print(); } catch (_) {} }, 80);
  };
  bar.append(back, mc, mb, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  📏 Print at 100% (Actual size)  •  ' + SHOP.tip));
  document.body.appendChild(printBox); fillPrint();
  sfx.click(); say(printList.length === 1 ? 'Here it is! Tap PRINT if you want it on paper.' : 'Here are all your orders! Tap PRINT when you are ready.');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'Escape') { if (printBox) closePrint(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipOn && shipDone) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((k === 'p' || k === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (k === 'Enter') { if (shipOn && shipDone) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (printBox || shipOn) return;
  else if (k === '1') { sfx.click(); show('shop'); } else if (k === '2') { sfx.click(); show('cart'); } else if (k === '3') { sfx.click(); show('orders'); }
});
document.title = SHOP.title; $('url').innerHTML = '🔒 <b>' + SHOP.url + '</b>' + SHOP.urlSide; $('logoBig').innerHTML = SHOP.logo; $('slogan').textContent = SHOP.slogan;
$('moneyLbl').textContent = 'MY ' + SHOP.money; $('moreBucks').textContent = SHOP.coin + ' Get more';
document.documentElement.setAttribute('style', SHOP.theme);
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty! B33P!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreBucks').onclick = moreCoins; $('shipGo').onclick = closeShip;
$('helper').onclick = () => { sfx.click(); say(pick(SHOP.jokes)); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); CAT = 'all'; show('shop');
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price! B33P!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
window.addEventListener('afterprint', () => { if (printBox) fillPrint(); });
drawHelper(); render();
$('bubble').textContent = S.orders.length ? SHOP.back : SHOP.hi;
</script>
