<style>

  html, body { height: 100%; margin: 0; }

  .dots span { display: inline-block; width: 13px; height: 13px; border-radius: 50%; margin-right: 5px; }

  #head { display: flex; align-items: center; gap: 12px; padding: 4px 14px; background: linear-gradient(90deg, #0a0010, #2a0b45 35%, #6a1b9a 62%, #b71c1c 85%, #ff6d00); color: #fff; flex: none; min-height: 98px; position: relative; overflow: hidden; }
  #head:after { content: ""; position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(#fff 1px, transparent 1.6px); background-size: 46px 38px; opacity: .25; }

  @keyframes talk { 0%,100% { transform: translateY(0) scale(1); } 50% { transform: translateY(-6px) scale(1.04); } }
  @keyframes swapIn { 0% { transform: translateY(70px) scale(.6); } 70% { transform: translateY(-8px) scale(1.05); } 100% { transform: none; } }

  #nav { display: flex; gap: 8px; padding: 8px 14px; background: #2a1a40; flex: none; align-items: center; }
  #nav button { font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 9px 13px; background: #fff; color: #2a0b45; box-shadow: 0 4px 0 #4a2d6e; white-space: nowrap; }
  #nav button.on { background: #7c4dff; color: #fff; box-shadow: 0 4px 0 #311b92; }
  #nav .count { display: inline-block; min-width: 26px; padding: 0 6px; margin-left: 4px; border-radius: 14px; background: #ff1744; color: #fff; font-size: 17px; }

  #deal { margin-left: auto; font-size: 16px !important; color: #c51162 !important; box-shadow: 0 4px 0 #f48fb1 !important; max-width: 260px; overflow: hidden; text-overflow: ellipsis; }
  #main { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 30px; }

  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 14px; }
  .card { background: #fff; border-radius: 18px; padding: 10px; box-shadow: 0 4px 12px rgba(26,35,126,.2); display: flex; flex-direction: column; position: relative; border: 3px solid transparent; }

  .thumb .pg { position: absolute; top: 9px; height: 178px; width: 142px; left: 50%; margin-left: -71px; background: #fff; box-shadow: 2px 3px 6px rgba(0,0,0,.25); }
  .thumb .pg svg { width: 100%; height: 100%; display: block; }

  .line .thumb { width: 110px; height: 104px; flex: none; }

  .stars { color: #ffb300; letter-spacing: 1px; }
  .row { display: flex; gap: 8px; margin-top: auto; }
  .add { flex: 1; font-size: 19px; font-weight: 900; border: 0; border-radius: 14px; padding: 11px 6px; background: #00c853; color: #fff; box-shadow: 0 4px 0 #00873e; }
  .add.in { background: #b2dfdb; color: #004d40; box-shadow: 0 4px 0 #80cbc4; }
  .revbtn { font-size: 19px; border: 0; border-radius: 14px; padding: 8px 12px; background: #e8eaf6; box-shadow: 0 4px 0 #4a2d6e; }
  /* cart + orders lists */
  .list { max-width: 900px; margin: 0 auto; }
  .line { display: flex; align-items: center; gap: 14px; background: #fff; border-radius: 16px; padding: 8px 12px; margin-bottom: 10px; box-shadow: 0 3px 10px rgba(26,35,126,.15); }
  .line .nm { flex: 1; font-size: 22px; font-weight: bold; color: #311b92; }

  .bigbtn.blue { background: #ff3d00; box-shadow: 0 5px 0 #bf360c; }
  .xbtn { font-size: 22px; border: 0; border-radius: 12px; background: #ffebee; color: #c62828; padding: 8px 12px; font-weight: bold; }
  .total { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; justify-content: flex-end; background: #fff; border-radius: 16px; padding: 12px; font-size: 24px; font-weight: 900; color: #311b92; }
  .gift { font-size: 20px; font-weight: bold; border: 3px solid #f48fb1; border-radius: 14px; padding: 9px 14px; background: #fff; color: #ad1457; }
  .gift.on { background: #f48fb1; color: #fff; }

  .h2 { font-size: 28px; font-weight: 900; color: #2a0b45; margin: 4px 0 12px; text-align: center; }
  /* overlays */
  #ship { position: fixed; inset: 0; z-index: 500; background: rgba(7,13,43,.94); display: none; align-items: center; justify-content: center; flex-direction: column; }
  #ship svg { width: min(96vw, calc(80vh * 16 / 9)); height: auto; border-radius: 18px; }

  #paradeRow .pr { position: absolute; bottom: 0; width: 150px; height: 190px; }
  #paradeRow .pr img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; }
  #paradeRow .pr b { position: absolute; left: 0; right: 0; bottom: -30px; text-align: center; color: #fff; font-size: 16px; white-space: nowrap; }
  #paradeBox .ground { position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: #b0bec5; border-top: 6px solid #78909c; }
  #paradeBox .bigbtn { position: absolute; right: 20px; top: 16px; z-index: 3; }
  #revBox { position: fixed; inset: 0; z-index: 400; background: rgba(7,13,43,.75); display: none; align-items: center; justify-content: center; }
  #revBox .in { background: #fff; border-radius: 22px; padding: 18px; width: min(92vw, 620px); max-height: 92vh; overflow-y: auto; }
  #revBox .rev { font-size: 19px; }
  #printBox { position: fixed; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; background: #e8eaf6; z-index: 99999; text-align: center; padding: 12px 12px 40px; font-family: "Trebuchet MS", Arial, sans-serif; }
  #printBox .pbBar { position: sticky; top: 0; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; padding: 8px; background: #e8eaf6; z-index: 2; }
  #printBox button { font: bold 24px "Trebuchet MS", Arial, sans-serif; border: 0; border-radius: 16px; padding: 13px 24px; color: #fff; cursor: pointer; box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #printBox .pbPrint { background: #00c853; } #printBox .pbBack { background: #2a0b45; } #printBox .pbInk { background: #263238; font-size: 20px; } #printBox .pbInk.off { background: #c2185b; }
  #printBox .pbTip { font-size: 20px; color: #2a0b45; margin: 6px 0 4px; }
  #printBox .pbPage { display: block; width: min(94vw, 720px); margin: 16px auto; background: #fff; box-shadow: 0 6px 20px rgba(0,0,0,.25); border-radius: 6px; }
  #printBox .pbPage svg { display: block; width: 100%; height: auto; }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { display: block !important; height: auto !important; overflow: visible !important; background: #fff !important; }
    body > *:not(#printBox) { display: none !important; }
    #printBox { position: static; overflow: visible; background: #fff; padding: 0; }
    #printBox .pbBar, #printBox .pbTip { display: none !important; }
    #printBox .pbPage { width: 100%; margin: 0; box-shadow: none; border-radius: 0; break-after: page; page-break-after: always; break-inside: avoid; }
    #printBox .pbPage svg { width: 100%; height: 9.9in; }
    #printBox .pbPage:last-child { break-after: auto; page-break-after: auto; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
  /* boss lair extras */
  #mascot img { width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; }
  .h2, .empty { color: #ffe082 !important; }
  .rev { background: #f3e5f5 !important; }
  #revBox .in { background: #fff; }
  #nav { border-bottom: 3px solid #ff6d00; }
  #wallet { background: linear-gradient(#ffd740, #ffb300); }
  .card { box-shadow: 0 4px 14px rgba(0,0,0,.45); }
  .card.must { border-color: #ff6d00; background: #fff8f0; }
  .fold { background: #6a1b9a; }
  #paradeBox { background: linear-gradient(#0a0010, #2a0b45 55%, #6a1b9a); }
  #paradeBox .ground { background: #37243f; border-top-color: #ff6d00; }
  #paradeRow .pr { width: 170px; height: 190px; }
</style>

<script>
// ===== boss module group_a.js (inlined) =====
var BOSSES = window.BOSSES || (window.BOSSES = {}); var BOSS_TEST_IDS = window.BOSS_TEST_IDS || (window.BOSS_TEST_IDS = []);
// ===== Group A: King Gloop + Mega Saucer (Robo Jump 1), Warp Saucer + Circuit Saucer (Robo Jump 2),
// GOO-RILLA (Robo Jump 3), NEGA-ROBO MEGA MORPH (Robo Jump 4). Drawing code is copied from each game.
(function () {
  var curT = 0, curA = null;                         // the arena clock (for blinking lights) + arena
  var PX = function (A) { return A.player.x + A.player.w / 2; };
  var PY = function (A) { return A.player.y + A.player.h / 2; };
  var clamp = function (v, a, b) { return Math.max(a, Math.min(b, v)); };
  var num = function (v, d) { return (typeof v === 'number' && isFinite(v)) ? v : d; };
  // little drawing helpers (same as the games')
  function roundRect(ctx, x, y, w, h, r, fill) {
    ctx.fillStyle = fill; ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, Math.max(0, w), Math.max(0, h), r); else ctx.rect(x, y, Math.max(0, w), Math.max(0, h));
    ctx.fill();
  }
  function circle(ctx, x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
  function ellipse(ctx, x, y, rx, ry, fill, rot) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot || 0, 0, 7); ctx.fill(); }
  function drawStar(ctx, x, y, r, fill, rot) {
    rot = rot || 0; ctx.fillStyle = fill; ctx.beginPath();
    for (var i = 0; i < 10; i++) { var a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
    ctx.fill();
  }
  function text(ctx, str, x, y, size, color) {
    ctx.font = 'bold ' + size + 'px "Trebuchet MS", Arial, sans-serif';
    ctx.textAlign = 'center'; ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = Math.max(3, size / 6);
    ctx.strokeText(str, x, y); ctx.fillStyle = color || '#fff'; ctx.fillText(str, x, y);
  }
  function bang(ctx, x, y, s) {                       // the big "!" warning bubble (Robo Jump 3/4)
    s = s || 1; var k = s * (1 + Math.sin(curT * 0.4) * 0.12);
    circle(ctx, x, y, 20 * k, curT % 16 < 8 ? '#ff1744' : '#ffea00');
    text(ctx, '!', x, y + 11 * k, 30 * k, '#fff');
  }
  function dizzy(ctx, cx, top) {                      // dizzy stars = "bonk me now!" (Robo Jump 3 tired stars)
    for (var k = 0; k < 3; k++) { var a = curT * 0.08 + k * 2.1; drawStar(ctx, cx + Math.cos(a) * 34, top - 14 + Math.sin(a) * 8, 8, '#ffea00', curT * 0.1); }
  }
  // speed-scaled shot: same path, just faster with super speed
  function shot(A, o) {
    var s = A.speed || 1;
    o.vx = num(o.vx, 0) * s; o.vy = num(o.vy, 0) * s;
    if (o.gravity) o.gravity *= s * s;
    o.life = Math.max(10, Math.round((o.life || 200) / s));
    A.shot(o);
  }
  function fallLife(y, vy, g, floorY) {               // frames until something thrown from y reaches the floor
    var dy = floorY - y;
    if (!g) return vy > 0 ? Math.ceil(dy / vy) : 240;
    return Math.ceil((-vy + Math.sqrt(Math.max(0, vy * vy + 2 * g * dy))) / g);
  }
  // shared tired/attack rhythm: attack for a while, then get TIRED (vuln) for 2+ seconds
  var TIRED = 130, ACTIVE = 290;
  function cooldown(A, base) { return base * Math.max(1, A.count || 1); }
  function hurtFlash(b) { return b.hurt > 0 && Math.floor(curT / 4) % 2; }
  function tick(b, dt) { if (b.hurt > 0) b.hurt = Math.max(0, b.hurt - dt); b.t = (b.t || 0) + dt; }

  // ================= 👑 KING GLOOP (Robo Jump 1: platformer.html drawBoss type 'blob') =================
  function drawGloopBody(ctx, x, y, w, h, look, squash) {   // ported from platformer.html drawBoss(), blob, default look
    var body = '#7c4dff', crownC = '#ffd740', mouthC = '#311b92';
    var cx = x + w / 2, wob = Math.sin(curT * 0.15) * 4 + (squash || 0);
    roundRect(ctx, x - wob / 2, y + wob, w + wob, h - wob, [45, 45, 14, 14], body);
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.ellipse(x + 25, y + 22 + wob, 12, 7, -0.5, 0, 7); ctx.fill();
    ctx.fillStyle = crownC;                            // crown
    ctx.beginPath(); ctx.moveTo(cx - 25, y + 6 + wob);
    for (var i = 0; i <= 4; i++) ctx.lineTo(cx - 25 + i * 12.5, y + wob - (i % 2 ? 4 : 22));
    ctx.lineTo(cx + 25, y + 6 + wob); ctx.fill();
    [cx - 18, cx + 18].forEach(function (ex) {
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(ex, y + 32 + wob, 11, 0, 7); ctx.fill();
      ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(ex + look, y + 34 + wob, 5, 0, 7); ctx.fill();
    });
    ctx.strokeStyle = '#000'; ctx.lineWidth = 4;       // angry eyebrows
    ctx.beginPath(); ctx.moveTo(cx - 30, y + 16 + wob); ctx.lineTo(cx - 8, y + 24 + wob);
    ctx.moveTo(cx + 30, y + 16 + wob); ctx.lineTo(cx + 8, y + 24 + wob); ctx.stroke();
    ctx.fillStyle = mouthC;
    ctx.beginPath(); ctx.ellipse(cx, y + 58 + wob, 18, 8, 0, 0, 7); ctx.fill();
  }
  function drawRJ1Shot(ctx, o) {                       // platformer.html drawShots() (pink energy ball)
    ctx.fillStyle = 'rgba(255,64,129,.4)'; ctx.beginPath(); ctx.arc(o.x, o.y, Math.max(0, o.r + 4), 0, 7); ctx.fill();

  s += tab(x3, y, x3, yb, 1, 0, 'TAPE', 20);

}

    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);
  for (const o of S.orders.slice().reverse()) {
    const p = PR(o.k); if (!p) continue;
    const np = p.pages.length + (o.gift ? 1 : 0), line = el('div', 'line'); line.appendChild(thumbEl(o.k));
    line.appendChild(el('div', 'nm', p.name + `<small>Order #${o.n}${o.gift ? '  •  🎁 gift wrapped' : ''}  •  ${np} page${np > 1 ? 's' : ''}</small>`));
    const pr = el('button', 'bigbtn green', '🖨️ PRINT'); pr.onclick = () => openPrint([o]); line.appendChild(pr); L.appendChild(line);
  }
}
// 🖨️ print preview: nothing prints until Ben taps PRINT
function printFns(list) {
  const fns = [];
  for (const o of list) { const p = PR(o.k); if (!p) continue; if (o.gift) fns.push(() => giftWrap(p.name)); p.pages.forEach(f => fns.push(f)); }
  return fns;
}
function openPrint(list) {
  closePrint(true);
  const fns = printFns(list); if (!fns.length) return;
  printList = list;
  const name = list.length === 1 ? PR(list[0].k).name : 'All my orders';
  printBox = el('div'); printBox.id = 'printBox';
  const bar = el('div', 'pbBar'), back = el('button', 'pbBack', '⬅ BACK'), ink = el('button', 'pbInk' + (S.ink ? '' : ' off'), S.ink ? '🖤 Ink Saver: ON' : '🎨 Full color');
  const pr = el('button', 'pbPrint', fns.length > 1 ? `🖨️ PRINT (${fns.length} pages)` : '🖨️ PRINT');
  back.onclick = () => closePrint();
  ink.onclick = () => { toggleInk(); openPrint(printList); };
  pr.onclick = () => { sfx.click(); S.printed = (S.printed || 0) + 1; save(); trophy('bossLair'); say('Printing! Ask a grown-up to help with the printer.'); setTimeout(() => { try { window.print(); } catch (_) {} }, 80); };
  bar.append(back, ink, pr); printBox.appendChild(bar);
  printBox.appendChild(el('div', 'pbTip', '📦 ' + name + '  •  ' + (S.ink ? '🖤 Ink Saver is ON: black lines to color in!' : '🎨 Full color: turn on color printing!')));
  document.body.appendChild(printBox);
  for (const f of fns) printBox.appendChild(el('div', 'pbPage', buildPage(f, S.ink)));
  sfx.click(); say(list.length === 1 && list[0].k === 'mega' ? 'The GIANT Boss Rush Arena! Tap PRINT for all 13 pages!' : 'Here it is! Tap PRINT if you want it on paper!');
}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
function toggleInk() { S.ink = !S.ink; save(); sfx.click(); updateTop(); say(S.ink ? 'Ink Saver ON! Black lines, so you can color them in.' : 'Full color! That uses lots of ink.'); }
// 👹 BOSS PARADE: every boss marches across and says hi
let parT = -1, parStart = 0, parSaid = -1;
const PAR_GAP = 175, PAR_SPEED = 3.2;
function openParade() {
  const row = $('paradeRow'); row.innerHTML = '';
  BOSS.forEach(r => { const d = el('div', 'pr', mascotSvg(r) + '<b>' + r.name + '</b>'); row.appendChild(d); });
  $('paradeBox').style.display = 'flex'; parT = 0; parStart = performance.now(); parSaid = -1; $('psay').textContent = 'Here they come!';
  sfx.click(); say('BOSS PARADE! Every boss, march!', 'kinggloop'); requestAnimationFrame(paradeLoop);
}
function paradeLoop() {
  if (parT < 0) return;
  parT = Math.max(parT + (window.__shipStep || 0), Math.floor((performance.now() - parStart) / 16.7));
  const W = window.innerWidth, kids = $('paradeRow').children;
  for (let i = 0; i < kids.length; i++) {
    const x = W + 20 - parT * PAR_SPEED + i * PAR_GAP, hop = Math.abs(Math.sin((parT + i * 9) * .16)) * 18;
    kids[i].style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(-hop) + 'px)';
    if (x < W / 2 - 75 && i > parSaid) { parSaid = i; const r = BOSS[i]; $('psay').textContent = r.name + ': "' + r.more + '"'; sfx.march(i); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.name + '!'); u.pitch = Math.min(2, r.v[0]); u.rate = r.v[1]; speechSynthesis.speak(u); } } catch (_) {} }
  }
  const last = W + 20 - parT * PAR_SPEED + (kids.length - 1) * PAR_GAP;
  if (last < -200) { $('psay').textContent = 'That is EVERY boss! Tap OK to go shopping.'; parT = -1; return; }
  requestAnimationFrame(paradeLoop);
}
function closeParade() { parT = -1; $('paradeBox').style.display = 'none'; sfx.click(); showMascot(MI); }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  const parade = $('paradeBox').style.display === 'flex';
  if (e.key === 'Escape') { if (printBox) closePrint(); else if (parade) closeParade(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();
  else if (e.key === 'Enter') { if (parade) closeParade(); else if (shipT > 150) closeShip(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (view === 'cart' && S.cart.length && !printBox) checkout(); }
  else if (!printBox && !parade && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty!'); };
$('tOrders').onclick = () => { sfx.click(); show('orders'); say(S.orders.length ? 'Your orders! Tap PRINT on the ones you want.' : 'No orders yet. Let\'s shop!'); };
$('moreCoins').onclick = moreCoins;
$('parade').onclick = openParade;
$('paradeOk').onclick = closeParade;
$('ink').onclick = toggleInk;
$('mascot').onclick = () => { sfx.click(); say(pick([curM().hi, curM().more])); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };
$('deal').onclick = () => {
  sfx.click(); if (view !== 'shop' || !inCat(PR(DEAL), CAT)) { CAT = 'all'; show('shop'); }
  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
showMascot(Math.floor(Math.random() * BOSS.length), true);
render(); rotate();
setTimeout(() => { $('bubble').textContent = S.orders.length ? curM().hi + ' Your orders are in MY ORDERS.' : curM().hi; }, 50);
</script>
