<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎞️ Make-Your-Own Flip Book</title>
<script src="touchpad.js?v=6"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3f2ff 0 36px, #d4ebff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 6px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .btn:disabled { opacity: .45; }
  .hide { display: none !important; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; } .b-print { background: #8ef08e; }
  .b-play { background: #ffb347; } .b-save { background: #c3a6ff; } .b-new { background: #b9f6ca; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .three { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .panelTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 5px; }
  .help { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 5px 8px; }
  /* ---------- home ---------- */
  #home { flex-direction: column; overflow: hidden; }
  #hHead { display: flex; align-items: center; gap: 10px; padding: 8px 14px 2px; }
  #hHead .mid { flex: 1; text-align: center; }
  #hHead h1 { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff; -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #ff5fa2; letter-spacing: 1px; }
  #hHead p { margin: 2px 0 2px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 3px 3px 0 #333; margin: 6px 4px -4px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #2b7bd9; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg, .thumb canvas { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb.big { background: linear-gradient(160deg, #fff59d, #ffcc80); }
  .thumb .emo { font-size: 64px; line-height: 1.3; }
  /* ---------- printable sheet view ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #wrap svg { position: absolute; inset: 0; width: 100%; height: 100%; background: #fff; border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #2b7bd9; }
  #side { width: min(42vw, 400px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  #names { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  #names .btn { font-size: 15px; min-height: 44px; padding: 2px; }
  #pageNum { font-size: 20px; font-weight: bold; text-align: center; align-self: center; }
  /* ---------- studio ---------- */
  #studio { flex-direction: row; gap: 10px; padding: 8px; }
  #stLeft { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #stInfo { display: flex; justify-content: center; gap: 12px; font-size: 22px; font-weight: bold; }
  #stInfo span { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 2px 14px; }
  #cvBox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #cv { background: #fff; border: 5px solid #333; border-radius: 12px; box-shadow: 0 6px 0 #2b7bd9; touch-action: none; cursor: crosshair; display: block; }
  #strip { height: 86px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding: 4px 4px 6px; background: rgba(255,255,255,.6); border: 4px solid #333; border-radius: 14px; flex-shrink: 0; }
  .fr { position: relative; flex: 0 0 auto; height: 64px; aspect-ratio: 3 / 2; border: 3px solid #333; border-radius: 8px; background: #fff; cursor: pointer; }
  .fr canvas { width: 100%; height: 100%; display: block; border-radius: 6px; pointer-events: none; }
  .fr i { position: absolute; left: 2px; top: 0; font-style: normal; font-size: 13px; font-weight: bold; color: #2b7bd9; pointer-events: none; }
  .fr.cur { border-color: #ff3d6e; box-shadow: 0 0 0 3px #ff3d6e; }
  .fr.add { display: flex; align-items: center; justify-content: center; font-size: 30px; background: #b9f6ca; }
  #stSide { width: min(36vw, 330px); display: flex; flex-direction: column; gap: 7px; overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: 8px; }
  #pens { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #333; border-radius: 16px; padding: 7px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #333; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #333; }
  #stSide .btn { font-size: 17px; min-height: 48px; padding: 4px; }
  #speedRow { display: grid; grid-template-columns: 1fr 1.2fr 1fr; gap: 6px; align-items: center; }
  #speedTxt { text-align: center; font-weight: bold; font-size: 17px; background: #fff; border: 3px solid #333; border-radius: 12px; padding: 4px; }
  /* ---------- theater + ask ---------- */
  .modal { position: fixed; inset: 0; background: rgba(20, 30, 60, .75); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .modal.on { display: flex; }
  .card { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 12px 16px; max-width: 100%; max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; align-items: stretch; }
  .card h2 { margin: 0; text-align: center; font-size: clamp(22px, 3vw, 32px); }
  #thCv { background: #fff; border: 5px solid #333; border-radius: 12px; display: block; margin: 0 auto; }
  #thBtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #askBtns { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
  #askMsg { font-size: 24px; text-align: center; font-weight: bold; max-width: 520px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (orientation: portrait) {
    #view, #studio { flex-direction: column; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side, #stSide { width: 100%; max-height: 42vh; }
  }
  @media (max-height: 560px) { .btn { min-height: 44px; font-size: 16px; } #stSide .btn { min-height: 40px; font-size: 15px; } #strip { height: 70px; } .fr { height: 50px; } }
  /* ---------- PRINT: only #printArea, one letter page per svg ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea svg { display: block; width: 100%; height: 9.9in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact;
      break-after: page; page-break-after: always; }
    #printArea svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="hHead">
    <button class="btn b-back" id="bLeave">⬅️ Book</button>

  <div id="grid"></div>
</div>

  <div id="side">

    <div class="help" id="pHelp"></div>

    <button class="btn b-print" id="bPrintAll">🖨️ Print all pages</button>

  </div>
</div>
<div id="studio" class="screen">
  <div id="stLeft">

    <div id="cvBox"><canvas id="cv"></canvas></div>
    <div id="strip"></div>
  </div>
  <div id="stSide">
    <div id="pens"></div>
    <div class="two"><button class="btn" id="bOnion">🧅 Onion skin</button><button class="btn" id="bUndo">↩️ Undo</button></div>
    <div class="two"><button class="btn b-new" id="bAdd">➕ New page</button><button class="btn b-new" id="bCopy">📄 Copy page</button></div>
    <div class="two"><button class="btn b-clear" id="bClear">🧽 Clear page</button><button class="btn b-clear" id="bDel">🗑️ Delete page</button></div>
    <button class="btn b-play" id="bPlay">▶️ Play!</button>
    <div id="speedRow"><button class="btn" id="bSlow">🐢</button><div id="speedTxt"></div><button class="btn" id="bFast">🐇</button></div>
    <button class="btn" id="bLoop">🔁 Loop</button>
    <div class="two"><button class="btn b-save" id="bSave">💾 Save</button><button class="btn b-print" id="bPrintMine">🖨️ Print my flip book</button></div>
    <button class="btn b-new" id="bFresh">✨ Start a new one</button>

  </div>
</div>
<div id="theater" class="modal"><div class="card">
  <h2 id="thTitle"></h2>
  <canvas id="thCv"></canvas>
  <div id="thBtns">
    <button class="btn b-play" id="thPlay">⏸️ Pause</button>
    <button class="btn" id="thSlow">🐢</button><button class="btn" id="thFast">🐇</button>
    <button class="btn b-new" id="thEdit">✏️ Draw on it</button>
    <button class="btn b-clear" id="thDel">🗑️ Delete</button>
    <button class="btn b-back" id="thClose">👍 Done</button>
  </div>
</div></div>
<div id="ask" class="modal"><div class="card"><div id="askMsg"></div><div id="askBtns"></div></div></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🎞️ MAKE-YOUR-OWN FLIP BOOK
// Printables: blank flip-book pages (16/24/32), onion-skin practice, 7 starter kits, how-to guide, cover + certificate.
// On screen: the Flip Book Studio (draw frames with pencil + crayons, onion skin, play, save, print).
// Every printable page is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// One flip-book "frame" is 300 x 200 units everywhere (kits, studio strokes, printing).
// Art helpers + characters below are copied from the Craft Room (which copied the Art Gallery).
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
const FOLD = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-dasharray="10 7" stroke-linecap="round"/>';
const HOLE = (x, y, rx, ry) => '<ellipse data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(rx) + '" ry="' + n(ry) + '" fill="#fff" stroke="' + INK + '" stroke-width="3.5" stroke-dasharray="11 7"/>';
const PUNCH = (x, y, r) => '<circle data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r || 11) + '" fill="#fff" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 5"/>' +

const PENS = [{ c: '#4a4a4a', w: 2.5, ic: '✏️' }, { c: '#ff3b30', w: 6 }, { c: '#ff8a1f', w: 6 }, { c: '#ffd60a', w: 6 }, { c: '#2ecc40', w: 6 }, { c: '#5ac8fa', w: 6 },

function renderPens() {

function updateThumb(k) { const d = $('strip').children[k]; if (d && d.firstChild) drawFrame(d.firstChild, state.frames[k]); }

function goFrame(k) { stopPlay(); curF = Math.max(0, Math.min(state.frames.length - 1, k)); flick(); refresh(); }
function addFrame() {

// ---------- drawing with the mouse / finger (touchpad.js turns touches into mouse events) ----------

function penDown(e) {

// ---------- 💾 gallery ----------

function whenSafe(go) {        // don't lose an unsaved drawing

// =====================================================================
// 🎬 THEATER: watch an example or a saved flip book
// =====================================================================
let th = null;               // { frames, fps, idx, tm, run, gid, example }
const thOn = () => typeof document !== 'undefined' && $('theater') && $('theater').classList.contains('on');
function openTheater(title, frames, fps, o) {

  cv.style.width = Math.floor(w) + 'px'; cv.style.height = Math.floor(w / 1.5) + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(w / 1.5 * dpr);

function thTick() {

function thSpeed(d) { if (!th) return; th.fps = FPS[Math.max(0, Math.min(FPS.length - 1, FPS.indexOf(th.fps) + d))]; blip(400 + th.fps * 40, 0, .08); }

}

// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints, Space plays
// =====================================================================
function gridCols() {

  const r0 = th2[sel] ? th2[sel].getBoundingClientRect().top : 0; let k = 0;
  th2.forEach(t => { if (Math.abs(t.getBoundingClientRect().top - r0) < 5) k++; });
  return Math.max(1, k);

function onKey(e) {

function init() {
