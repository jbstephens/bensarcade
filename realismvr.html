<script>
'use strict';
// ✨ Realism VR: the same photo-real scenes as ✨ Realism, wrapped all around you in a Meta Quest headset (WebXR).
// The scene shaders are NOT copied: they are read straight out of realism.html when the page loads (see loadRealism),
// so every new scene added to Realism shows up here automatically.
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const $ = id => document.getElementById(id);
let SCENES = [], GROUPS = [], SRC = [], MYS = -1, MYS_NAME = null, SPOOKY = [], CREDITS = [];

// ---------- 1. read the scenes out of realism.html ----------
async function loadRealism() {
  const txt = await (await fetch('realism.html', { cache: 'no-cache' })).text();
  // the data block (SCENES, GROUPS, the mystery and the scene lists) is plain data, so it can run on its own
  const blocks = [...txt.matchAll(/<script>([\s\S]*?)<\/script>/g)].map(m => m[1]);
  const data = blocks.find(b => /const SCENES\s*=\s*\[/.test(b) && /const GROUPS\s*=\s*\[/.test(b));
  if (!data) throw new Error('no SCENES block');
  const D = new Function(data + '\n;return { SCENES, GROUPS, MYS, MYS_NAME, SPOOKY5, BENCATS6, WORLD8, WONDERS6: typeof WONDERS6 === "undefined" ? [] : WONDERS6 };')();
  SCENES = D.SCENES; GROUPS = D.GROUPS; MYS = D.MYS; MYS_NAME = D.MYS_NAME; SPOOKY = D.SPOOKY5;
  CREDITS = [[D.BENCATS6, '💡 Ben\'s idea: his cats Marble, Guppy & Beans, with Mr. Whiskers popping up!'],
             [D.WORLD8, '💡 Ben\'s idea: Japan, Australia, Antarctica, Titan, Europa, the Great Red Spot, and Robo & Dusty in real life!'],
             [D.WONDERS6, '💡 Ben\'s idea!']];
  // the shaders: every  const NAME = `...`  string, glued together the same way realism.html does it (SRC[i] = A + B + ...)
  const K = {};
  for (const m of txt.matchAll(/(?:const|let)\s+([A-Za-z0-9_]+)\s*=\s*`([^`]*)`/g)) K[m[1]] = m[2];
  for (const m of txt.matchAll(/SRC\[(\d+)\]\s*=\s*([A-Za-z0-9_+\s]+?);/g)) {
    const parts = m[2].split('+').map(s => s.trim());
    if (parts.every(p => p in K)) SRC[+m[1]] = K.COMMON + parts.map(p => K[p]).join('');
  }
  if (!K.COMMON || SCENES.some((s, i) => !SRC[i])) console.warn('Realism VR: some scenes are missing', SCENES.map((s, i) => SRC[i] ? '' : i).join(' '));
}
</script>
<script>
'use strict';
// ---------- 2. how each scene is shown ----------
// 'dome'   = a giant 200° wrap-around picture, and its colors glow on into the rest of the sky (landscapes, cities, nature)
// 'sky'    = all the way around you (360°): the picture plus its mirror image behind you (stars, clouds, underwater)
// 'screen' = a big curved IMAX screen in a dark, cozy theater (cats, Robo & Dusty, the Game Factory: pictures with a hero in the middle)
const SCREEN = new Set([36, 37, 38, 39, 40, 41, 42, 66, 69, 72, 80, 84, 85, 86, 87, 88, 89, 96, 97]);
const SKY = new Set([0, 4, 74, 79, 81, 95]);
const MODES = {
  dome:   { m: 0, fov: [200, 100], size: [2048, 1024], amb: .72 },
  sky:    { m: 1, fov: [180, 120], size: [1920, 1280], amb: .85 },
  screen: { m: 2, fov: [120, 61], size: [1600, 900], amb: .3 },
};
// how big a picture each scene paints (measured: the heaviest shaders paint fewer pixels so the headset stays smooth)
const COST = { H: [0, 1, 8, 11, 17, 18, 37, 40, 43, 46, 48, 51, 52, 54, 58, 61, 68, 71, 76, 77, 89, 90, 97, 98], X: [10, 23, 36, 65, 75, 78, 96],
  M: [3, 4, 5, 6, 7, 9, 15, 16, 22, 24, 25, 26, 29, 31, 32, 34, 39, 41, 42, 45, 47, 53, 55, 56, 57, 59, 60, 64, 67, 70, 72, 79, 81, 82, 83, 85, 86, 91, 92, 93, 95, 101] };
const L_SCENES = [2, 12, 13, 14, 19, 20, 21, 27, 28, 30, 33, 35, 38, 44, 49, 50, 62, 63, 66, 69, 73, 74, 80, 84, 87, 88, 94];
const baseScale = i => COST.X.includes(i) ? .55 : COST.H.includes(i) ? .7 : COST.M.includes(i) ? .85 : L_SCENES.includes(i) ? 1 : .8;
const modeOf = i => SCREEN.has(i) ? 'screen' : SKY.has(i) ? 'sky' : 'dome';
// 3D sparkles that float in the air right around you (a few hundred tiny dots, very cheap). k: 0 soft dot, 1 petal/leaf, 2 rain, 3 twinkle, 4 bubble
const FX = {
  snow:      { n: 420, c: [1, 1, 1], c2: [.85, .9, 1], s: .04, v: [.15, -.55, .05], w: .35, k: 0, a: .85 },
  petals:    { n: 240, c: [1, .72, .84], c2: [1, .9, .95], s: .07, v: [.35, -.33, .1], w: .5, k: 1, a: .9 },
  leaves:    { n: 150, c: [1, .55, .12], c2: [.85, .25, .05], s: .09, v: [.3, -.45, .1], w: .6, k: 1, a: .95 },
  fireflies: { n: 130, c: [.8, 1, .3], c2: [1, .9, .4], s: .06, v: [0, .03, 0], w: .6, k: 3, a: 1, add: 1 },
  embers:    { n: 150, c: [1, .5, .12], c2: [1, .8, .3], s: .035, v: [.05, .6, 0], w: .35, k: 3, a: 1, add: 1 },
  rain:      { n: 300, c: [.75, .82, .95], c2: [.9, .95, 1], s: .3, v: [.3, -7, 0], w: 0, k: 2, a: .35 },
  bubbles:   { n: 150, c: [.8, .95, 1], c2: [.6, .85, 1], s: .07, v: [0, .45, 0], w: .25, k: 4, a: .7, add: 1 },
  stars:     { n: 300, c: [1, 1, 1], c2: [.7, .8, 1], s: .22, v: [0, 0, 0], w: 0, k: 3, a: .9, add: 1, far: 1 },
  spray:     { n: 220, c: [.9, .95, 1], c2: [1, 1, 1], s: .03, v: [.4, .15, 0], w: .5, k: 0, a: .5, add: 1 },
  sand:      { n: 200, c: [1, .85, .6], c2: [.9, .7, .45], s: .022, v: [1.2, .05, .2], w: .3, k: 0, a: .6 },
  sparkle:   { n: 200, c: [1, .85, .3], c2: [.6, .8, 1], s: .05, v: [0, .15, 0], w: .5, k: 3, a: 1, add: 1 },
  motes:     { n: 110, c: [1, .95, .8], c2: [1, 1, 1], s: .018, v: [.03, .02, 0], w: .3, k: 0, a: .45, add: 1 },
};
const FX_OF = {};
[['snow', [8, 23, 31, 58, 67, 83, 92]], ['petals', [15, 90]], ['leaves', [7, 26, 72]], ['fireflies', [17, 24, 48, 55]],
 ['embers', [1, 44, 75, 80, 86, 103]], ['rain', [77]], ['bubbles', [4, 56, 65, 82, 102]], ['spray', [9, 32, 45, 57, 76]], ['sand', [10, 30, 91]],
 ['stars', [0, 3, 19, 20, 21, 41, 46, 62, 63, 81, 88, 93, 94, 95, 100]], ['sparkle', [36, 50, 66]]].forEach(([k, l]) => l.forEach(i => FX_OF[i] = k));
const FOG = new Set([9, 25, 32, 51, 52, 53, 54, 55, 57, 61, 71, 101]);   // soft ground fog swirling around your feet

// ---------- 3. the 3D world ----------
let renderer, world, camera, quadScene, quadCam, quad, dome, domeMat, sparks, fogs = [];
const mats = [];
const QUAD_VS = 'attribute vec3 position;void main(){gl_Position=vec4(position.xy,0.,1.);}';
function sceneMat(i) {
  return mats[i] || (mats[i] = new THREE.RawShaderMaterial({ vertexShader: QUAD_VS, fragmentShader: SRC[i], depthTest: false, depthWrite: false,
    uniforms: { uRes: { value: new THREE.Vector2(1, 1) }, uT: { value: 0 }, uFade: { value: 1 }, uLit: { value: 0 } } }));
}
function makeRT(w, h) {
  return new THREE.WebGLRenderTarget(w, h, { minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false, depthBuffer: false, stencilBuffer: false });
}
const DOME_VS = 'attribute vec3 position;uniform mat4 modelViewMatrix,projectionMatrix;varying vec3 vDir;void main(){vDir=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const DOME_FS = `precision highp float;
uniform sampler2D tex; uniform vec2 fov; uniform float mode, amb;
varying vec3 vDir;
void main(){
  vec3 d=normalize(vDir);
  float yaw=atan(d.x,-d.z), pit=asin(clamp(d.y,-1.,1.));
  if(mode>.5&&mode<1.5&&abs(yaw)>1.5708) yaw=sign(yaw)*3.14159265-yaw;   // sky: the mirror image wraps behind you
  float u=.5+yaw/fov.x;
  float v=mode>1.5 ? .5+tan(clamp(pit,-1.45,1.45))/(2.*tan(fov.y*.5)) : .5+pit/fov.y;
  vec2 uv=vec2(u,v), c=clamp(uv,.002,.998);
  float outside=length(max(abs(uv-.5)-.5,0.)*fov);
  vec2 inn=(.5-abs(uv-.5))*fov;
  float f=outside>0. ? 0. : smoothstep(0.,.16,min(inn.x,inn.y));
  vec3 sharp=texture2D(tex,c).rgb;
  // a blurry copy: the picture's colors glow on past its edges (a little blurry right at the edge, very blurry far away)
  vec3 blur=mix(texture2D(tex,c,4.).rgb, texture2D(tex,c,7.).rgb, smoothstep(0.,.45,outside+.1*(1.-f)));
  vec3 halo=mode>1.5 ? blur*amb*exp(-outside*2.2)+vec3(.005,.005,.009) : blur*amb*mix(1.,.3,smoothstep(0.,1.6,outside));
  gl_FragColor=vec4(mix(halo,sharp,f),1.);
}`;
const SPARK_VS = `precision highp float;
attribute vec3 position; attribute vec4 rnd;
uniform mat4 modelViewMatrix, projectionMatrix;
uniform float uT, uSize, uWob, uPx, uNear, uFar; uniform vec3 uVel, uMin, uBox;
varying vec4 vR; varying float vA;
void main(){
  vec3 p=uMin+uBox*position+uVel*uT*(.7+.6*rnd.x)+uWob*vec3(sin(uT*.6+rnd.y*6.28),.5*sin(uT*.45+rnd.z*6.28),cos(uT*.5+rnd.w*6.28));
  p=mod(p-uMin,uBox)+uMin;
  float dist=length(p);
  vA=smoothstep(uNear,uNear*1.8,dist)*(1.-smoothstep(uFar*.7,uFar,dist))*smoothstep(uMin.y,uMin.y+1.,p.y)*smoothstep(uMin.y+uBox.y,uMin.y+uBox.y-1.5,p.y);
  vR=rnd;
  vec4 mv=modelViewMatrix*vec4(p,1.);
  gl_PointSize=clamp(uSize*(.6+.8*rnd.y)*uPx/max(-mv.z,.1),0.,64.);
  gl_Position=projectionMatrix*mv;
}`;
const SPARK_FS = `precision highp float;
uniform vec3 uC, uC2; uniform float uA, uKind, uT;
varying vec4 vR; varying float vA;
void main(){
  vec2 p=gl_PointCoord-.5; float a;
  if(uKind<.5) a=smoothstep(.5,.1,length(p));
  else if(uKind<1.5){ float r=vR.x*6.28+uT*(.5+vR.z); p=mat2(cos(r),sin(r),-sin(r),cos(r))*p; p.x*=1.9; a=smoothstep(.5,.38,length(p)); }
  else if(uKind<2.5) a=smoothstep(.06,0.,abs(p.x))*smoothstep(.5,.2,abs(p.y));
  else if(uKind<3.5){ float tw=.35+.65*(.5+.5*sin(uT*(1.+2.*vR.w)+vR.x*40.)); a=(exp(-dot(p,p)*40.)+.4*exp(-dot(p,p)*10.))*tw; }
  else { float r=length(p); a=smoothstep(.5,.42,r)*smoothstep(.3,.45,r)+.15*smoothstep(.5,0.,r); }
  a*=vA*uA; if(a<.01) discard;
  gl_FragColor=vec4(mix(uC,uC2,vR.z),a);
}`;
const FOG_VS = 'attribute vec3 position;uniform mat4 modelViewMatrix,projectionMatrix;varying vec2 vP;void main(){vP=position.xy;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const FOG_FS = `precision highp float;
uniform float uT, uA, uS; uniform vec3 uC; varying vec2 vP;
float h(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }
float n(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h(i),h(i+vec2(1,0)),f.x),mix(h(i+vec2(0,1)),h(i+vec2(1,1)),f.x),f.y); }
void main(){
  float r=length(vP); vec2 q=vP*.16+vec2(uT*.03,uT*.017)*uS+uS*7.;
  float m=.6*n(q)+.4*n(q*2.3-vec2(uT*.05,0.));
  gl_FragColor=vec4(uC, uA*smoothstep(.3,.8,m)*smoothstep(26.,9.,r)*smoothstep(.8,2.5,r));
}`;
</script>
<script>
'use strict';
// ---------- 4. the picture engine: each scene's shader paints a texture, a few strips per frame ----------
// The headset draws at 72-90 frames a second, but the scene picture is only re-painted about 24-30 times a second,
// in K strips (one strip per headset frame), into a back texture that is swapped in when it is finished.
const eng = { cfg: [], i: -1, want: 0, fade: 0, shown: 0, t: [], K: 2, baseK: 2, Knext: 0, strip: 0, scale: 1, front: null, back: null, mode: '', latchT: 0, latchF: 0 };
let litOn = false, litV = 0;
const smooth = f => f * f * (3 - 2 * f);
function initWorld() {
  renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.xr.enabled = true; renderer.xr.setReferenceSpaceType('local');
  document.body.prepend(renderer.domElement);
  world = new THREE.Scene(); world.background = new THREE.Color(0);
  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 200); camera.rotation.order = 'YXZ';
  quadScene = new THREE.Scene(); quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  quad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2)); quad.frustumCulled = false; quadScene.add(quad);
  eng.front = makeRT(16, 8); eng.back = makeRT(16, 8);
  domeMat = new THREE.RawShaderMaterial({ vertexShader: DOME_VS, fragmentShader: DOME_FS, side: THREE.BackSide, depthWrite: false,
    uniforms: { tex: { value: eng.front.texture }, fov: { value: new THREE.Vector2(3.4, 1.7) }, mode: { value: 0 }, amb: { value: .7 } } });
  dome = new THREE.Mesh(new THREE.SphereGeometry(50, 72, 36), domeMat); dome.renderOrder = -10; dome.frustumCulled = false; world.add(dome);
  // the floating sparkles: one set of 450 random dots, re-themed for each scene by the shader's settings
  const N = 450, pos = new Float32Array(N * 3), rnd = new Float32Array(N * 4);
  for (let k = 0; k < N * 3; k++) pos[k] = Math.random();
  for (let k = 0; k < N * 4; k++) rnd[k] = Math.random();
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('rnd', new THREE.BufferAttribute(rnd, 4));
  sparks = new THREE.Points(g, new THREE.RawShaderMaterial({ vertexShader: SPARK_VS, fragmentShader: SPARK_FS, transparent: true, depthWrite: false,
    uniforms: { uT: { value: 0 }, uSize: { value: .04 }, uWob: { value: .3 }, uPx: { value: 500 }, uNear: { value: 1.2 }, uFar: { value: 9.5 },
      uVel: { value: new THREE.Vector3() }, uMin: { value: new THREE.Vector3() }, uBox: { value: new THREE.Vector3(1, 1, 1) },
      uC: { value: new THREE.Color() }, uC2: { value: new THREE.Color() }, uA: { value: 0 }, uKind: { value: 0 } } }));
  sparks.frustumCulled = false; sparks.renderOrder = 2; world.add(sparks);
  // two thin layers of ground fog (for misty, spooky and splashy places)
  [[-1.55, .55, 1], [-1.0, .32, -1.3]].forEach(([y, a, s]) => {
    const m = new THREE.Mesh(new THREE.CircleGeometry(26, 48), new THREE.RawShaderMaterial({ vertexShader: FOG_VS, fragmentShader: FOG_FS, transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { uT: { value: 0 }, uA: { value: 0 }, uS: { value: s }, uC: { value: new THREE.Color(.85, .88, .9) } } }));
    m.rotation.x = -Math.PI / 2; m.position.y = y; m.userData.a = a; m.renderOrder = 1; m.visible = false; world.add(m); fogs.push(m);
  });
}
function sizeRTs() {
  const M = MODES[eng.mode], w = Math.round(M.size[0] * eng.scale), h = Math.round(M.size[1] * eng.scale);
  if (eng.front.width !== w || eng.front.height !== h) { eng.front.setSize(w, h); eng.back.setSize(w, h); }
}
function switchTo(i) {   // called while the picture is faded to black
  if (eng.i >= 0) eng.cfg[eng.i] = { K: eng.K, scale: eng.scale };   // each scene remembers how fast it could go
  const C = eng.cfg[i] || { K: eng.baseK, scale: baseScale(i) };
  eng.i = i; eng.mode = modeOf(i); eng.K = Math.max(C.K, eng.baseK); eng.scale = C.scale; eng.wantScale = 0; eng.Knext = 0; sizeRTs();
  const M = MODES[eng.mode], D = Math.PI / 180;
  domeMat.uniforms.fov.value.set(M.fov[0] * D, M.fov[1] * D); domeMat.uniforms.mode.value = M.m; domeMat.uniforms.amb.value = M.amb;
  const F = FX[FX_OF[i] || 'motes'], u = sparks.material.uniforms;
  sparks.geometry.setDrawRange(0, F.n);
  u.uSize.value = F.s; u.uWob.value = F.w; u.uVel.value.fromArray(F.v); u.uKind.value = F.k; u.uC.value.fromArray(F.c); u.uC2.value.fromArray(F.c2);
  sparks.userData.a = F.a;
  if (F.far) { u.uMin.value.set(-45, -45, -45); u.uBox.value.set(90, 90, 90); u.uNear.value = 22; u.uFar.value = 48; }
  else { u.uMin.value.set(-9, -1.8, -9); u.uBox.value.set(18, 7.5, 18); u.uNear.value = 1.2; u.uFar.value = 9.5; }
  sparks.material.blending = F.add ? THREE.AdditiveBlending : THREE.NormalBlending; sparks.material.needsUpdate = true;
  const spooky = SPOOKY.includes(i);
  fogs.forEach(m => { m.visible = FOG.has(i); m.material.uniforms.uC.value.setRGB(spooky ? .55 : .86, spooky ? .66 : .89, spooky ? .6 : .92); });
}
function renderStrip() {

    s.addEventListener('end', () => { session = null; $('vrBtn').textContent = '🥽 Enter VR'; eng.baseK = eng.Knext = 2; camera.position.set(0, 0, 0); });
    await renderer.xr.setSession(s); session = s;
    try { const L = s.renderState.baseLayer; if (L && 'fixedFoveation' in L) L.fixedFoveation = 1; } catch (_) {}   // draw the edges of your view a bit softer = faster
    eng.baseK = 3; eng.Knext = Math.max(eng.K, 3);
    $('vrBtn').textContent = '🚪 Exit VR'; setMenu(true); winTrophy();
  } catch (e) { console.warn(e); showSign('😮 VR did not start. Ask Dad to help!', 3500); }
}
</script>
<script>
'use strict';
// ---------- 10. every frame ----------
let lastT = 0;
function loop(now) {
  const raw = lastT ? (now - lastT) / 1000 : 1 / 60; lastT = now;
  const dt = Math.min(0.05, raw), xr = renderer.xr.isPresenting;
  perfStep(raw, xr ? 1 / 72 : 1 / 60);
  engineStep(dt);
  const su = sparks.material.uniforms; su.uT.value += dt; su.uA.value = (sparks.userData.a || 0) * eng.shown;
  if (xr && session && session.renderState.baseLayer) su.uPx.value = session.renderState.baseLayer.framebufferHeight / 2.4;
  else su.uPx.value = renderer.domElement.height / 2 / Math.tan(camera.fov * Math.PI / 360);
  fogs.forEach(m => { m.material.uniforms.uT.value += dt; m.material.uniforms.uA.value = m.userData.a * eng.shown; });
  if (signTimer > 0) { signTimer -= dt; if (signTimer < .5) sign.material.opacity = Math.max(0, signTimer / .5); if (signTimer <= 0) sign.visible = false; }
  if (xr) { updateControllers(); if (session) pollPads(session); }
  else { camera.position.set(0, 0, 0); camera.rotation.set(pitch, yaw, 0); }
  renderer.render(world, camera);
}
// ---------- 11. start ----------
(async () => {
  const oops = msg => { $('loading').classList.add('gone'); const o = $('oops'); if (msg) o.innerHTML = msg; o.style.display = 'flex'; };
  if (!window.THREE) return oops('😮 The 3D drawing kit did not load.<br>Check the internet, or ask Dad to help with this one!');
  try { await loadRealism(); } catch (e) { console.error(e); return oops('😮 The places could not load.<br>Ask Dad to help with this one!'); }
  // 🎁 the Mystery Surprise stays a secret until it is opened in ✨ Realism (same trophy check as Realism)
  try { revealed = !!JSON.parse(localStorage.getItem('gfTrophies') || '{}').realismMystery; } catch (_) {}
  if (revealed && MYS_NAME && SCENES[MYS]) Object.assign(SCENES[MYS], MYS_NAME);
  try { initWorld(); } catch (e) { console.error(e); return oops(); }
  initPanels(); initXRInput(); initMouse(); world.updateMatrixWorld(true);
  const q = /[?&]scene=(\d+)/.exec(location.search); let start = q ? +q[1] % SCENES.length : 0;
  if (start === MYS && !revealed) start = 0;
  go(start); setMenu(true);
  renderer.setAnimationLoop(loop);
  checkVR();
  setTimeout(() => $('loading').classList.add('gone'), 500);
  setTimeout(() => $('hint').classList.add('gone'), 12000);
  window.RVR = { go, step, act, eng, perf, setMenu, BTNS, get group() { return group; }, renderer, camera, world, setView(y, p) { yaw = y; pitch = p; }, SCENES, GROUPS, SRC, mats };
})();
</script>
