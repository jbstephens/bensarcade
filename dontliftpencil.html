  tune([523, 659, 784, 1047, 1319]); confetti();
  toast(first ? '🎉 YOU DID IT! One line, no lifting!' : '🎉 You did it again!');
  setHelp(); renderSheet(); updateScore(); checkTrophy();
}
function undo() {
  if (demo) return;
  if (play.used.length) { play.used.pop(); play.path.pop(); } else play.path = [];
  blip(330); renderSheet(); setHelp();
}
function clearPlay() { stopDemo(); play = { path: [], used: [] }; renderSheet(); setHelp(); }
function stopDemo() { if (demo) { clearTimeout(demo.tm); demo = null; } }
function showMe() {                    // the pencil draws one answer, line by line
  const pz = curPz(); if (!pz) return;
  stopDemo(); play = { path: [], used: [] };
  const path = euler(pz);
  demo = { path, k: 0 };
  play.path = [path.nodes[0]]; renderSheet(); setHelp(); blip(520);
  const step = () => {
    if (!demo) return;
    if (demo.k >= path.edges.length) { demo = null; tune([523, 784, 1047]); setHelp('▶️ That\'s one way to do it! Now YOU try: tap 🔄 Start over.'); return; }
    play.used.push(path.edges[demo.k]); play.path.push(path.nodes[demo.k + 1]); demo.k++;
    blip(440 + demo.k * 25, 0, 0.1); renderSheet(); setHelp();
    demo.tm = setTimeout(step, 450);
  };
  demo.tm = setTimeout(step, 600);
}
function toggleHint() { hint = !hint; $('bHint').classList.toggle('on', hint); renderSheet(); if (hint) toast('💡 Start at the green START dot!'); }
function toggleCount() {
  count = !count; $('bCount').classList.toggle('on', count); renderSheet();
  const pz = curPz();
  if (count && pz) { const n = oddDots(pz).length; toast(n ? `🦉 ${n} odd dots (orange)! Start at one of them.` : '🦉 0 odd dots! Start anywhere!'); }
}
// ================== gallery ==================
function setView(v) {
  view = v;
  $('gallery').classList.toggle('on', v === 'gallery');
  $('view').classList.toggle('on', v === 'sheet');
}
function updateScore() { if (typeof document !== 'undefined' && $('score')) $('score').textContent = `✅ Solved ${solvedCount()} of ${PUZZLES.length}`; }
function thumbHTML(i) {
  const p = SHEETS[i];
  return buildSheet(i, p.kind === 'puz' ? { solved: state.solved[p.id] } : { name: state.name, solved: solvedCount() }) +
    `<b>${p.name}</b>` + (p.kind === 'puz' && state.solved[p.id] ? '<span class="ok">✅</span>' : '');
}
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    const sec = p.kind === 'puz' ? LEVELS[p.level] : '🦉 EXTRAS: SECRETS, DOTS & PRIZES';
    const prev = k ? (SHEETS[k - 1].kind === 'puz' ? LEVELS[SHEETS[k - 1].level] : '🦉 EXTRAS: SECRETS, DOTS & PRIZES') : '';
    if (sec !== prev) { const h = document.createElement('div'); h.className = 'sec'; h.textContent = sec; g.appendChild(h); }
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    d.innerHTML = thumbHTML(k);
    d.addEventListener('click', () => { sel = k; openSheet(k); });
    g.appendChild(d);
  });
  updateScore();
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function renderNames() {
  const box = $('names'); box.innerHTML = '';
  NAMES.forEach(n => {
    const b = document.createElement('button'); b.className = 'btn nm' + (state.name === n ? ' on' : ''); b.textContent = n;
    b.addEventListener('click', () => { state.name = state.name === n ? '' : n; saveState(); renderNames(); renderSheet(); blip(600); });
    box.appendChild(b);
  });
}
function openSheet(k) {
  stopDemo();
  cur = sel = k; play = { path: [], used: [] };
  const p = SHEETS[k], isP = p.kind === 'puz';
  $('pTitle').textContent = (isP ? '⭐'.repeat(p.level) + ' ' : '') + p.name;
  ['bHint', 'bCount', 'bUndo', 'bClear', 'bShow', 'bPrintHint', 'bPrintAns'].forEach(id => $(id).classList.toggle('hide', !isP));
  $('bPrint').textContent = isP ? '🖨️ Print puzzle' : p.kind === 'badge' ? '🖨️ Print badge' : '🖨️ Print it!';
  $('bPrint').classList.toggle('wide', !isP);
  $('bHint').classList.toggle('on', hint); $('bCount').classList.toggle('on', count);
  $('names').classList.toggle('on', p.kind === 'badge');
  if (p.kind === 'badge') renderNames();
  $('trace').style.display = isP ? 'block' : 'none';
  renderSheet(); setHelp(); setView('sheet'); sizeCanvas();
}
function backToGallery() {
  stopDemo(); endPrint();
  const th = document.querySelectorAll('.thumb')[sel];
  if (th) th.innerHTML = thumbHTML(sel);
  updateScore(); setView('gallery'); markSel();
}
// ================== tapping and sliding on the dots ==================
const BORDER = 5;
function sheetBox() {        // where the 800x1000 sheet sits on screen
  const r = $('wrap').getBoundingClientRect(), w = r.width - BORDER * 2, h = r.height - BORDER * 2;
  const s = Math.min(w / 800, h / 1000) || 1;
  return { r, s, ox: BORDER + (w - 800 * s) / 2, oy: BORDER + (h - 1000 * s) / 2 };
}
function toSheet(e) { const b = sheetBox(); return [(e.clientX - b.r.left - b.ox) / b.s, (e.clientY - b.r.top - b.oy) / b.s]; }
function dotAt(x, y, rad) {
  const pz = curPz(); if (!pz) return -1;
  const P = lay(pz).P; let best = -1, bd = rad || 46;
  P.forEach((p, i) => { const d = Math.hypot(p[0] - x, p[1] - y); if (d < bd) { bd = d; best = i; } });
  return best;
}
function sizeCanvas() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(b.r.width * dpr)); cv.height = Math.max(1, Math.round(b.r.height * dpr));
  drawFinger();
}
function drawFinger() {                // the stretchy pencil line from the yellow dot to your finger
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  const pz = curPz(), c = lastDot();
  if (!pz || !finger || c < 0 || demo) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1, p = lay(pz).P[c];
  ctx.setTransform(dpr * b.s, 0, 0, dpr * b.s, dpr * b.ox, dpr * b.oy);
  ctx.strokeStyle = 'rgba(255,138,31,0.7)'; ctx.lineWidth = 8; ctx.lineCap = 'round'; ctx.setLineDash([14, 12]);
  ctx.beginPath(); ctx.moveTo(p[0], p[1]); ctx.lineTo(finger[0], finger[1]); ctx.stroke(); ctx.setLineDash([]);
}
function penDown(e) {
  if (view !== 'sheet' || !curPz()) return;
  e.preventDefault();
  const [x, y] = toSheet(e);
  tapDot(dotAt(x, y));
  dragging = true; finger = [x, y]; drawFinger();
}
function penMove(e) {
  if (!dragging) return;
  const [x, y] = toSheet(e); finger = [x, y];
  const i = dotAt(x, y, 34), pz = curPz();
  if (i >= 0 && pz && i !== lastDot() && play.path.length) tapDot(i, true);   // sliding: only follow real, unused lines
  drawFinger();
}
function penUp() { if (!dragging) return; dragging = false; finger = null; drawFinger(); }
// ================== confetti ==================
let bits = [];
function confetti() {
  if (typeof document === 'undefined') return;
  const cv = $('fx'); if (!cv || !cv.getContext) return;
  cv.width = window.innerWidth || 800; cv.height = window.innerHeight || 600;
  const cols = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7'];
  for (let k = 0; k < 140; k++) bits.push({ x: cv.width / 2 + (Math.random() - .5) * 200, y: cv.height * .45, vx: (Math.random() - .5) * 18,
    vy: -6 - Math.random() * 14, c: cols[k % cols.length], r: Math.random() * 6, life: 110 + Math.random() * 50 });
  if (!confetti.on) { confetti.on = true; requestAnimationFrame(fxStep); }
}
function fxStep() {
  const cv = $('fx'), ctx = cv.getContext('2d');
  if (!ctx) { confetti.on = false; bits = []; return; }
  ctx.clearRect(0, 0, cv.width, cv.height);
  bits.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.vy += 0.45; b.vx *= 0.985; b.r += 0.15; b.life--;
    ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r); ctx.fillStyle = b.c; ctx.fillRect(-6, -4, 12, 8); ctx.restore();
  });
  bits = bits.filter(b => b.life > 0 && b.y < cv.height + 20);
  if (bits.length) requestAnimationFrame(fxStep); else { confetti.on = false; ctx.clearRect(0, 0, cv.width, cv.height); }
}
// ================== printing ==================
// The pages go into #printAll (the only thing that prints). Your on-screen lines never print: you get a fresh page.
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits in print(); iPad uses 'afterprint' instead
  }, 60);
}
function printPages(pages) {
  $('printAll').innerHTML = pages.join('');
  document.body.classList.add('pAll');
  state.printed = (state.printed || 0) + 1; saveState(); checkTrophy();
  doPrint(endPrint);
}
function endPrint() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
const printSheet = withHint => printPages([buildSheet(cur, curPz() ? { hint: !!withHint } : { name: state.name, solved: solvedCount() })]);
const printAnswer = () => { if (curPz()) printPages([buildSheet(cur, { ans: true })]); };
const printAllPuzzles = () => printPages(PUZZLES.map((p, i) => buildSheet(i, {})));
const printAllAnswers = () => printPages(PUZZLES.map((p, i) => buildSheet(i, { ans: true })));
// ================== keys ==================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let n = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) n++; });
  return Math.max(1, n);
}
function onKey(e) {
  const k = e.key, n = SHEETS.length;
  if (view === 'gallery') {
    const cols = gridCols();
    if (k === 'ArrowRight') sel = Math.min(n - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(n - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { cur = sel; printSheet(false); return; }
    else return;
    e.preventDefault(); markSel();
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet(false);
    else if (k === 'h' || k === 'H') { if (curPz()) toggleHint(); }
    else if (k === 's' || k === 'S') showMe();
    else if (k === 'u' || k === 'U' || k === 'z' || k === 'Z') undo();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % n); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + n - 1) % n); e.preventDefault(); }
  }
}
function init() {
  loadState();
  renderGallery();
  const cv = $('trace');
  cv.addEventListener('mousedown', penDown);
  window.addEventListener('mousemove', penMove);
  window.addEventListener('mouseup', penUp);
  $('bHint').addEventListener('click', toggleHint);
  $('bCount').addEventListener('click', toggleCount);
  $('bUndo').addEventListener('click', undo);
  $('bClear').addEventListener('click', clearPlay);
  $('bShow').addEventListener('click', showMe);
  $('bPrint').addEventListener('click', () => printSheet(false));
  $('bPrintHint').addEventListener('click', () => printSheet(true));
  $('bPrintAns').addEventListener('click', printAnswer);
  $('bPrintAll').addEventListener('click', printAllPuzzles);
  $('bPrintAllAns').addEventListener('click', printAllAnswers);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', endPrint);
  window.addEventListener('resize', () => { if (view === 'sheet') sizeCanvas(); });
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
</script>
