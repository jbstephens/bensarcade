<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🥠 Fortune Cookie Factory</title>
<script src="touchpad.js?v=9"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #ffe9b8 0 36px, #ffdb8f 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  .main { top: 74px; }
  #top { position: absolute; left: 0; right: 0; top: 0; height: 74px; display: flex; align-items: center; gap: 8px; padding: 8px 10px; }
  #top h1 { margin: 0 6px 0 0; font-size: clamp(20px, 2.8vw, 34px); color: #fff; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #e53935; white-space: nowrap; }
  #tabs { flex: 1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #tabs .btn { min-height: 54px; font-size: clamp(15px, 1.7vw, 20px); padding: 4px; }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #e53935; letter-spacing: 2px; text-align: center; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; background: #fff; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .btn.on { background: #ffe066; border-color: #e53935; box-shadow: 0 5px 0 #e53935; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; } .b-print2 { background: #ffb347; }
  .b-all { background: #c3a6ff; } .b-red { background: #ff8a80; } .b-spin { background: #ffd54f; font-size: 22px; }
  .b-gold { background: linear-gradient(180deg, #fff59d, #ffc107); }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .panel { background: #fff; border: 5px solid #333; border-radius: 20px; padding: 8px; }
  .lbl { font-size: 18px; font-weight: bold; text-align: center; margin: 2px 0 4px; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .row .btn { min-height: 48px; font-size: 17px; padding: 4px 10px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  /* ---------- 🥠 Cookie Crack party ---------- */
  #party { flex-direction: row; gap: 10px; padding: 0 10px 10px; }
  #stage { flex: 1.25; min-width: 0; position: relative; background: radial-gradient(circle at 50% 40%, #fff8e1, #ffcc80); border: 5px solid #333;
    border-radius: 24px; box-shadow: 0 6px 0 #e53935; overflow: hidden; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #turnSay { position: absolute; left: 3%; right: 3%; top: 2%; text-align: center; font-size: clamp(20px, 2.8vw, 32px); font-weight: bold;
    color: #fff; -webkit-text-stroke: 1.5px #333; text-shadow: 2px 2px 0 #e53935; pointer-events: none; z-index: 3; }
  #cookieBtn { position: absolute; left: 18%; right: 18%; top: 18%; bottom: 26%; cursor: pointer; z-index: 2; }
  #strip { position: absolute; left: 4%; right: 4%; bottom: 4%; background: #fff; border: 3px solid #333; border-radius: 6px; padding: 8px 12px;
    font-size: clamp(19px, 2.5vw, 30px); font-weight: bold; text-align: center; color: #c62828; z-index: 4;
    transform: scaleX(0); transform-origin: 50% 50%; transition: transform .7s cubic-bezier(.2, 1.4, .4, 1); box-shadow: 0 5px 0 rgba(0,0,0,.25); }
  #strip.on { transform: scaleX(1); }
  #strip small { display: block; font-size: .62em; color: #555; margin-top: 3px; }
  #side1 { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #voices { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .vbtn { font: inherit; font-weight: bold; font-size: 15px; background: #fff6d6; border: 4px solid #333; border-radius: 14px; padding: 2px; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; box-shadow: 0 4px 0 #333; color: #222; }
  .vbtn svg { width: 64px; height: 64px; pointer-events: none; }
  .vbtn.sel { background: #ffe066; border-color: #e53935; box-shadow: 0 4px 0 #e53935; transform: scale(1.05); }
  .name.on { background: #b9f6ca; border-color: #2e7d32; box-shadow: 0 5px 0 #2e7d32; }
  #roundBox { font-size: 15px; max-height: 120px; overflow-y: auto; }
  #roundBox div { padding: 2px 4px; border-bottom: 2px dashed #ffcc80; }
  /* crack animation */
  #stage g.half { transition: transform .6s cubic-bezier(.3, 1.6, .5, 1); transform-box: fill-box; transform-origin: 50% 100%; }
  #stage.cracked g.hl { transform: translate(-24%, 6%) rotate(-28deg); }
  #stage.cracked g.hr { transform: translate(24%, 6%) rotate(28deg); }
  #stage g.crumb { opacity: 0; }
  #stage.cracked g.crumb { animation: crumb 1s ease-out forwards; }
  @keyframes crumb { 0% { opacity: 1; transform: translate(0, 0); } 100% { opacity: 0; transform: translate(var(--dx), var(--dy)) rotate(200deg); } }
  #stage g.wob { animation: wob 1.6s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 80%; }
  #stage.cracked g.wob { animation: none; }
  @keyframes wob { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) scale(1.03); } }
  #stage g.reader { animation: bob .8s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes bob { to { transform: translateY(-8px); } }
  #stage g.peek { transition: transform .5s; }
  #stage.sammy g.peek { transform: translateY(-370px); }
  /* ---------- 🎰 Fortune Maker ---------- */
  #maker { flex-direction: column; gap: 8px; padding: 0 10px 10px; }
  #reels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .reel { background: #fff6d6; border: 5px solid #333; border-radius: 18px; padding: 6px; text-align: center; display: flex; flex-direction: column; gap: 6px; }
  .reel .rl { font-size: 15px; color: #777; font-weight: bold; }
  .reel b { font-size: clamp(18px, 2.2vw, 26px); min-height: 66px; display: flex; align-items: center; justify-content: center; background: #fff; border: 3px solid #333; border-radius: 12px; padding: 2px 6px; }
  .reel.spin b { color: #e53935; }
  .reel .btn { min-height: 46px; font-size: 17px; }
  #made { font-size: clamp(22px, 3vw, 36px); font-weight: bold; text-align: center; background: #fff; border: 5px solid #333; border-radius: 10px;
    padding: 10px; color: #c62828; box-shadow: 0 6px 0 #e53935; min-height: 70px; }
  #makerBtns { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  #famRow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #famRow .btn { min-height: 46px; font-size: 17px; padding: 2px 10px; }
  #makerHelp { font-size: 16px; text-align: center; color: #555; margin-top: auto; }
  /* ---------- 📜 Pick fortunes ---------- */
  #picker { flex-direction: column; gap: 8px; padding: 0 10px 10px; }
  #pickHead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: center; }
  #pickHead .btn { min-height: 48px; font-size: 18px; }
  #pickCount { font-size: 22px; font-weight: bold; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px 12px; }
  #pickGrid { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 8px; align-content: start; padding: 4px 4px 20px; }
  .fc { font: inherit; font-size: 16px; font-weight: bold; text-align: left; background: #fff; border: 4px solid #333; border-radius: 12px; padding: 8px 8px 8px 40px;
    cursor: pointer; position: relative; box-shadow: 0 4px 0 #333; color: #222; min-height: 58px; }
  .fc::before { content: ''; position: absolute; left: 8px; top: 50%; width: 22px; height: 22px; margin-top: -11px; border: 3px solid #333; border-radius: 6px; background: #fff; }
  .fc.sel { background: #fff3c4; border-color: #e53935; box-shadow: 0 4px 0 #e53935; }
  .fc.sel::before { background: #4caf50; box-shadow: inset 0 0 0 3px #fff; }
  .fc.kbd { outline: 5px dashed #1e6bff; outline-offset: 2px; }
  .fc.mine { background: #e3f2fd; } .fc.mine.sel { background: #fff3c4; }
  .sec { grid-column: 1 / -1; font-size: 20px; font-weight: bold; padding: 4px; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 4px 10px 2px; display: flex; align-items: center; justify-content: center; gap: 14px; flex-wrap: wrap; }
  #gHead p { margin: 0; font-size: clamp(15px, 2vw, 20px); font-weight: bold; width: 100%; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #e53935; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #e53935; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #c62828; border: 4px solid #333; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  .sw { width: 54px; height: 54px; border-radius: 50%; border: 4px solid #333; cursor: pointer; padding: 0; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 3px #fff, 0 0 0 7px #333; }
  #pens .sw { width: auto; height: auto; aspect-ratio: 1; border-width: 3px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  /* ---------- 🏆 funniest vote ---------- */
  #vote { position: fixed; inset: 0; z-index: 50; background: rgba(40, 10, 0, .82); display: none; align-items: center; justify-content: center; padding: 14px; }
  #vote.on { display: flex; }
  #voteBox { background: #fff8e1; border: 6px solid #333; border-radius: 26px; padding: 14px; width: min(94vw, 900px); max-height: 94vh; display: flex; flex-direction: column; gap: 10px; }
  #voteBox h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.4vw, 40px); }
  #voteList { overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  #voteList .btn { text-align: left; font-size: 18px; line-height: 1.2; }
  #voteList .btn i { display: block; font-style: normal; color: #c62828; font-size: 15px; }
  #voteWin { text-align: center; font-size: clamp(24px, 3.6vw, 44px); font-weight: bold; color: #c62828; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 14px 24px; font-size: 26px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #party, #view { flex-direction: column; }
    #stage { flex: none; height: 46vh; }
    #paper { flex: 1; min-height: 0; } #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #top h1 { display: none; }
  }
  @media (max-height: 600px) { .btn { min-height: 44px; font-size: 16px; padding: 4px; } #pHelp { font-size: 15px; } .vbtn svg { width: 46px; height: 46px; }
    .main { top: 62px; } #top { height: 62px; } #tabs .btn { min-height: 46px; } .reel b { min-height: 50px; } }
  /* ---------- PRINT: only the sheet (or the whole set) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #trace, #vote { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="top">
  <h1>🥠 Fortune Cookie Factory</h1>
  <div id="tabs">
    <button class="btn" id="tParty">🥠 Crack Party</button>
    <button class="btn" id="tMaker">🎰 Fortune Maker</button>
    <button class="btn" id="tPick">📜 Pick Fortunes</button>
    <button class="btn b-print" id="tPrint">🖨️ Print &amp; Fold</button>
  </div>
</div>
<div id="party" class="screen main on">
  <div id="stage"><div id="stageArt"></div><div id="turnSay"></div><div id="cookieBtn"></div><div id="strip"></div></div>
  <div id="side1">
    <div class="panel"><div class="lbl">🗣️ Who reads the fortune?</div><div id="voices"></div></div>
    <div class="two">
      <button class="btn b-gold" id="bCrack">🥠 Crack it!</button>
      <button class="btn b-spin" id="bDay">📅 Fortune of the Day</button>
    </div>
    <div class="panel"><div class="lbl">👨‍👩‍👦 Who is playing? (tap names)</div><div class="row" id="players"></div></div>

    <button class="btn b-red" id="bVote">🏆 Vote: funniest fortune!</button>
  </div>
</div>
<div id="maker" class="screen main">
  <div id="reels"></div>
  <div id="made"></div>
  <div id="makerBtns">
    <button class="btn b-spin" id="bSpin">🎰 SPIN!</button>
    <button class="btn" id="bFam">👨‍👩‍👦 Family fortunes</button>
    <button class="btn b-print2" id="bKeep">⭐ Add to my strips</button>
    <button class="btn b-gold" id="bBake">🥠 Bake &amp; crack it!</button>
  </div>
  <div id="famRow" class="hide"></div>

</div>
<div id="picker" class="screen main">
  <div id="pickHead">
    <div id="pickCount"></div>
    <button class="btn b-spin" id="bPickRnd">🎲 Pick 20 for me</button>
    <button class="btn b-clear" id="bPickClr">🧽 Clear picks</button>

  </div>
  <div id="pickGrid"></div>
</div>
<div id="gallery" class="screen main">
  <div id="gHead">
    <button class="btn b-all" id="bAll">🖨️ Print them all</button>
    <p>Tap a page to open it. A grown-up does all the cutting! ✂️</p>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two" id="modes">
      <button class="btn b-mode" id="bColor">🎨 Full color</button>
      <button class="btn b-mode" id="bLine">🖍️ Color it yourself<br>(black lines)</button>

    <div id="pens"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <div class="two" id="lineBtns">
      <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
      <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
      <button class="btn b-clear" id="bClear">🧽 Clear</button>
      <button class="btn b-print2" id="bPrintBlank">🖨️ Print blank</button>
    </div>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="vote"><div id="voteBox"><h2>🏆 Which fortune was the FUNNIEST?</h2><div id="voteList"></div><div id="voteWin"></div>
  <button class="btn b-back" id="bVoteClose">⬅️ Back to the party</button></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🥠 FORTUNE COOKIE FACTORY: crack on-screen cookies (crunch + crumbs + funny voices), build fortunes on a
// slot machine (with family names), pick fortunes, then print & fold real PAPER fortune cookies,
// a fold-up takeout box, a label, and a Master Fortune Teller certificate.
// Every sheet is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is full color, LINE = true is black lines to color in. Art helpers copied from the Cereal Box Designer.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);

}
function bakeMade() { if (spinning) return; const txt = madeText(); go('party'); crack({ text: txt }); }
// =====================================================================
// 📜 PICK FORTUNES for the strip sheet
// =====================================================================
function pickItems() {
  const out = [];
  F_SECTIONS.forEach(([title, start, len]) => { out.push({ sec: title }); for (let i = start; i < start + len; i++) out.push({ id: 'f' + i, t: FORTUNES[i] }); });
  if (state.made.length) { out.push({ sec: '⭐ Fortunes I made' }); state.made.forEach((t, i) => out.push({ id: 'm' + i, t, mine: true })); }
  return out;
}
function renderPicker() {
  const g = $('pickGrid'); g.innerHTML = '';
  const items = pickItems().filter(x => x.id); pickCur = Math.min(pickCur, items.length - 1);
  pickItems().forEach(x => {
    if (x.sec) { const d = document.createElement('div'); d.className = 'sec'; d.textContent = x.sec; g.appendChild(d); return; }
    const k = items.indexOf(x);
    g.appendChild(mkBtn('fc' + (x.mine ? ' mine' : '') + (state.picks.indexOf(x.id) >= 0 ? ' sel' : '') + (k === pickCur ? ' kbd' : ''), esc(x.t), () => { pickCur = k; togglePick(x.id); }));
  });
  $('pickCount').textContent = '📜 ' + state.picks.length + ' of ' + MAX_PICKS + ' picked';
}
function togglePick(id) {
  const i = state.picks.indexOf(id);
  if (i >= 0) { state.picks.splice(i, 1); blip(440, 0, .08); }
  else { if (state.picks.length >= MAX_PICKS) { toast('That is 20! Your strip sheet is full. 📜'); return; } state.picks.push(id); blip(880, 0, .08); }
  saveState(); renderPicker();
}
function pickRandom() {
  const ids = FORTUNES.map((_, i) => 'f' + i).concat(state.made.map((_, i) => 'm' + i));
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  state.picks = ids.slice(0, MAX_PICKS); saveState(); renderPicker(); tune([523, 659, 784]);
}
function clearPicks() { state.picks = []; saveState(); renderPicker(); blip(300, 0, .15); }
function seeStrips() { go('gallery'); sel = SHEETS.findIndex(p => p.id === 'strips'); openSheet(sel); }
// =====================================================================
// 🖨️ GALLERY + SHEET VIEW (copied from the Cereal Box Designer)
// =====================================================================
const isLine = () => state.mode === 'line' || !!SHEETS[cur].blank;
function renderSheet(noMagic) {
  if (typeof document === 'undefined' || !$('svgBox')) return;
  $('svgBox').innerHTML = buildSheet(cur, isLine());
  if (!noMagic && isLine() && state.magic[SHEETS[cur].id]) applyMagic();
}
const MAGIC = ['#ffadad', '#ffd6a5', '#fdffb6', '#caffbf', '#9bf6ff', '#a0c4ff', '#bdb2ff', '#ffc6ff', '#ffb3c6', '#b5ead7'];
function applyMagic() {
  const svg = $('svgBox') && $('svgBox').querySelector('svg'); if (!svg) return;
  let k = 0;
  svg.querySelectorAll('rect, path, circle, ellipse').forEach(el => {
    const f = (el.getAttribute('fill') || '').toLowerCase();
    if (el.getAttribute('width') === '800' || el.hasAttribute('data-keep')) return;
    if (f === '#fff' || f === '#ffffff') el.style.fill = MAGIC[k++ % MAGIC.length];
  });
}
function magicColor() {
  if (!isLine()) setMode('line');
  state.magic[SHEETS[cur].id] = true; saveState(); renderSheet(); drawTraces();
  tune([660, 880, 1100]); toast('✨ Ta-da! Now press 🖨️ Print my colors!');
}
function setMode(m) { state.mode = m; saveState(); if (view === 'sheet') { renderSheet(); updateSide(); sizeCanvas(); } }
function updateSide() {
  const p = SHEETS[cur], line = isLine(), blank = !!p.blank;
  $('bColor').classList.toggle('on', !line); $('bLine').classList.toggle('on', line); $('modes').classList.toggle('hide', blank);
  $('pHelp').textContent = p.help + (line ? ' Pick a crayon and color right on it!' : '');
  $('pens').classList.toggle('on', line); $('lineBtns').classList.toggle('hide', !line);
  $('bPrint').classList.toggle('hide', line); $('trace').classList.toggle('on', line);
}
function renderGallery() {
  const g = $('grid'); g.innerHTML = '';
  SHEETS.forEach((p, k) => {
    const d = document.createElement('div');
    d.className = 'thumb' + (k === sel ? ' sel' : '');
    d.innerHTML = buildSheet(k, !!p.blank) + '<b>' + esc(p.name) + '</b>';
    d.addEventListener('click', () => { sel = k; openSheet(k); });
    g.appendChild(d);
  });
}
function markSel() {
  const th = document.querySelectorAll('.thumb');
  th.forEach((t, i) => t.classList.toggle('sel', i === sel));
  if (th[sel] && th[sel].scrollIntoView) th[sel].scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function openSheet(k) {
  cur = k; sel = k;
  $('pTitle').textContent = SHEETS[k].name;
  renderSheet(); updateSide(); setView('sheet'); sizeCanvas(); blip(660);
}
function backToGallery() { endPrintAll(); go('gallery'); }
function clearSheet() { const id = SHEETS[cur].id; state.traces[id] = []; delete state.magic[id]; saveState(); renderSheet(); drawTraces(); }
const PENS = ['#ff3b30', '#ff8a1f', '#ffd60a', '#2ecc40', '#5ac8fa', '#1e6bff', '#9b59ff', '#ff6ec7', '#8b5a2b', '#222'];
const BORDER = 5;
function sheetBox() {
  const r = $('wrap').getBoundingClientRect(), w = r.width - BORDER * 2, h = r.height - BORDER * 2;
  const s = Math.min(w / 800, h / 1000) || 1;
  return { r, s, ox: BORDER + (w - 800 * s) / 2, oy: BORDER + (h - 1000 * s) / 2 };
}
const f1 = v => Math.round(v * 10) / 10;
function toSheet(e) { const b = sheetBox(); return [f1((e.clientX - b.r.left - b.ox) / b.s), f1((e.clientY - b.r.top - b.oy) / b.s)]; }
function sizeCanvas() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  cv.width = Math.max(1, Math.round(b.r.width * dpr)); cv.height = Math.max(1, Math.round(b.r.height * dpr));
  drawTraces();
}
function strokeAll(ctx, list) {
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 12;
  list.forEach(t => { ctx.strokeStyle = t.c; ctx.beginPath(); for (let i = 0; i < t.p.length; i += 2) (i ? ctx.lineTo : ctx.moveTo).call(ctx, t.p[i], t.p[i + 1]); if (t.p.length === 2) ctx.lineTo(t.p[0] + 0.1, t.p[1]); ctx.stroke(); });
}
function drawTraces() {
  const cv = $('trace'); if (!cv || !cv.getContext) return;
  const ctx = cv.getContext('2d'); if (!ctx) return;
  const b = sheetBox(), dpr = window.devicePixelRatio || 1;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, cv.width, cv.height);
  if (!isLine()) return;
  ctx.setTransform(dpr * b.s, 0, 0, dpr * b.s, dpr * b.ox, dpr * b.oy);
  ctx.globalAlpha = .8; strokeAll(ctx, state.traces[SHEETS[cur].id] || []); ctx.globalAlpha = 1;
}
function penDown(e) {
  if (view !== 'sheet' || !isLine()) return;
  if (document.body.classList.contains('pAll')) endPrintAll();
  e.preventDefault();
  const [x, y] = toSheet(e), id = SHEETS[cur].id;
  stroke = { c: pen, p: [x, y] };
  (state.traces[id] = state.traces[id] || []).push(stroke);
  drawTraces();
}
function penMove(e) {
  if (!stroke) return;
  const [x, y] = toSheet(e), p = stroke.p, k = p.length;
  if (Math.hypot(x - p[k - 2], y - p[k - 1]) < 4) return;
  p.push(x, y); drawTraces();
}
function penUp() { if (!stroke) return; stroke = null; saveState(); }
function renderPens() {
  const box = $('pens'); box.innerHTML = '';
  PENS.forEach(c => {
    const s = document.createElement('div');
    s.className = 'sw' + (c === pen ? ' sel' : ''); s.style.background = c;
    s.addEventListener('click', () => { pen = c; box.querySelectorAll('.sw').forEach((el, i) => el.classList.toggle('sel', PENS[i] === c)); });
    box.appendChild(s);
  });
}
function traceImage() {                // your crayon coloring as a picture laid on the sheet for printing
  const list = state.traces[SHEETS[cur].id] || []; if (!list.length || typeof document === 'undefined') return '';
  const cv = document.createElement('canvas'); cv.width = 1600; cv.height = 2000; const ctx = cv.getContext && cv.getContext('2d'); if (!ctx) return '';
  ctx.scale(2, 2); ctx.globalAlpha = .8; strokeAll(ctx, list);
  return cv.toDataURL('image/png');
}
// =====================================================================
// PRINTING: only the sheet prints (see @media print). "Print them all" prints one sheet per page.
// The first print (or the first cookie cracked) wins the 🏆 trophy.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead
  }, 60);
}
function notePrinted() { state.printed++; saveState(); checkTrophy('You printed your first page!'); }
function printSheet() {
  if (view !== 'sheet') openSheet(sel);
  endPrintAll(); renderSheet(true); notePrinted(); doPrint(() => renderSheet());
}
function printColors() {
  if (view !== 'sheet') openSheet(sel);
  if (!isLine()) setMode('line');
  endPrintAll(); renderSheet();
  const img = traceImage(), svg = $('svgBox').querySelector('svg');
  if (img && svg) { const im = document.createElementNS('http://www.w3.org/2000/svg', 'image'); im.setAttribute('href', img); im.setAttribute('x', 0); im.setAttribute('y', 0); im.setAttribute('width', 800); im.setAttribute('height', 1000); svg.appendChild(im); }
  notePrinted(); doPrint(() => renderSheet());
}
function printAll() {
  $('printAll').innerHTML = SHEETS.map((p, i) => buildSheet(i, !!p.blank || state.mode === 'line')).join('');
  document.body.classList.add('pAll');
  notePrinted(); toast('🖨️ Printing ' + SHEETS.length + ' pages!');
  doPrint(endPrintAll);
}
function endPrintAll() {
  if (typeof document === 'undefined') return;
  document.body.classList.remove('pAll');
  const pa = $('printAll'); if (pa) pa.innerHTML = '';
}
// =====================================================================
// KEYS: arrows pick, Enter opens/cracks, Escape goes back, P prints (Space spins / cracks)
// =====================================================================
function gridCols(selr) {
  const th = document.querySelectorAll(selr); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (voteOpen) { if (k === 'Escape' || k === 'Backspace') { closeVote(); e.preventDefault(); } return; }
  if (view === 'party') {
    const vi = VOICES.findIndex(v => v.id === state.voice);
    if (k === 'Enter' || k === ' ') tapCookie();
    else if (k === 'ArrowLeft' || k === 'ArrowRight') pickVoice(VOICES[(vi + (k === 'ArrowRight' ? 1 : VOICES.length - 1)) % VOICES.length].id);
    else if (k === 'ArrowDown') go('maker');
    else if (k === 'd' || k === 'D') fortuneOfDay();
    else if (k === 'v' || k === 'V') openVote();
    else if (k === 'p' || k === 'P') go('gallery');
    else return;
    e.preventDefault();
  } else if (view === 'maker') {
    if (k === ' ') spin();
    else if (k === 'ArrowLeft' || k === 'ArrowRight') { reelCur = (reelCur + (k === 'ArrowRight' ? 1 : 2)) % 3; renderMaker(); blip(520, 0, .06); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') nudge(reelCur, k === 'ArrowDown' ? 1 : -1);
    else if (k === 'Enter') keepMade();
    else if (k === 'Escape' || k === 'Backspace') go('party');
    else if (k === 'f' || k === 'F') toggleFamMode();
    else return;
    e.preventDefault();
  } else if (view === 'picker') {
    const N = pickItems().filter(x => x.id).length, cols = gridCols('.fc');
    if (k === 'ArrowRight') pickCur = Math.min(N - 1, pickCur + 1);
    else if (k === 'ArrowLeft') pickCur = Math.max(0, pickCur - 1);
    else if (k === 'ArrowDown') pickCur = Math.min(N - 1, pickCur + cols);
    else if (k === 'ArrowUp') pickCur = Math.max(0, pickCur - cols);
    else if (k === 'Enter' || k === ' ') { const it = pickItems().filter(x => x.id)[pickCur]; if (it) togglePick(it.id); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { go('party'); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { seeStrips(); return; }
    else return;
    e.preventDefault(); renderPicker(); const el = document.querySelectorAll('.fc')[pickCur]; if (el && el.scrollIntoView) el.scrollIntoView({ block: 'nearest' });
  } else if (view === 'gallery') {
    const cols = gridCols('.thumb'), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'Escape' || k === 'Backspace') { go('party'); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % SHEETS.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + SHEETS.length - 1) % SHEETS.length); e.preventDefault(); }
  }
}
function init() {
  loadState();

  window.addEventListener('mousemove', e => { if (stroke) penMove(e); });
  window.addEventListener('mouseup', penUp);
  $('tParty').addEventListener('click', () => go('party'));
  $('tMaker').addEventListener('click', () => go('maker'));
  $('tPick').addEventListener('click', () => go('picker'));
  $('tPrint').addEventListener('click', () => go('gallery'));
  $('cookieBtn').addEventListener('click', tapCookie);
  $('bCrack').addEventListener('click', tapCookie);
  $('bDay').addEventListener('click', fortuneOfDay);
  $('bVote').addEventListener('click', openVote);
  $('bVoteClose').addEventListener('click', closeVote);
  $('bSpin').addEventListener('click', spin);
  $('bFam').addEventListener('click', toggleFamMode);
  $('bKeep').addEventListener('click', keepMade);
  $('bBake').addEventListener('click', bakeMade);
  $('bPickRnd').addEventListener('click', pickRandom);
  $('bPickClr').addEventListener('click', clearPicks);
  $('bPickPrint').addEventListener('click', seeStrips);
  $('bAll').addEventListener('click', printAll);
  $('bColor').addEventListener('click', () => setMode('color'));
  $('bLine').addEventListener('click', () => setMode('line'));
  $('bPrint').addEventListener('click', printSheet);
  $('bPrintBlank').addEventListener('click', printSheet);
  $('bPrintColor').addEventListener('click', printColors);
  $('bMagic').addEventListener('click', magicColor);
  $('bClear').addEventListener('click', clearSheet);
  $('bBack').addEventListener('click', backToGallery);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });

  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
}
