  const ents = [{ key: PK.hero, name: NAME, icon: ROSTER[PK.hero].icon, me: true, look: OUTFITS[PK.outfit].look }].concat(others.map(k => ({ key: k, name: ROSTER[k].name, icon: ROSTER[k].icon, look: pick(OUTFITS).look })));
  playSong('tourney');
  tbStart({ el: 'bracket', title: 'Ice Show Tournament', icon: '🏆⛸️', entrants: shuffle(ents), menu: toMenu, again: startTourney,
    sim: () => { let a = simTotal(), b = simTotal(); if (a === b) a += .5; return [a, b]; },
    win: () => { trophy('iceTourney'); toast('🏆 ICE SHOW CHAMPION! 🏆', 4000); },
    play: (a, b, done) => { const opp = a.me ? b : a; show('none');
      startRoutine({ len: 30, opp, done: (mine, theirs) => { playSong('tourney'); done(a.me ? mine : theirs, a.me ? theirs : mine); } }); } });
}
function renderTools() {
  const t = $('tools'); if (!GM || GM.kind !== 'free') { t.className = ''; t.innerHTML = ''; return; }
  t.className = 'on';
  t.innerHTML = COLORS.map(([c, e]) => '<button class="big' + (GM.color === c ? ' sel' : '') + '" data-c="' + c + '">' + e + '</button>').join('') +
    SHAPES.map(([k, l]) => '<button class="big gold' + (GM.shape && GM.shape.kind === k ? ' sel' : '') + '" data-s="' + k + '">' + (SV.shapes[k] ? '✅ ' : '🎯 ') + l + '</button>').join('') +
    '<button class="big pinkb" id="tClear">🧽 Clear ice</button>';
  t.querySelectorAll('[data-c]').forEach(b => b.onclick = () => { GM.color = b.dataset.c; blip(880, 0, .08); renderTools(); });
  t.querySelectorAll('[data-s]').forEach(b => b.onclick = () => setShape(b.dataset.s));
  $('tClear').onclick = () => { tx.clearRect(0, 0, W, H); if (GM.shape) GM.shape = null; blip(330, 0, .2); renderTools(); };
}
function toMenu() {
  TB = null; GM = { kind: 'demo', skaters: [], fx: [], marks: [], scoring: false };
  ['pink', 'robo', 'king', 'sammy'].forEach((k, i) => { const s = makeSkater(k, OUTFITS[i].look, RCX - 300 + i * 200, RCY + 60, false); s.fig = i * 7; GM.skaters.push(s); });
  renderTools(); $('hudBtns').classList.remove('on'); show('title'); playSong('title');
  $('trophyLine').textContent = (hasTrophy('iceRink') || hasTrophy('iceTourney')) ? '🏆 Trophies: ' + (hasTrophy('iceRink') ? '⛸️ Ice Star ' : '') + (hasTrophy('iceTourney') ? '🏆 Ice Show Champion' : '') : '🏆 Finish a Routine and win the Ice Show Tournament for trophies!';
}
function demoUpdate(dt) { for (const s of GM.skaters) { const p = FIG[s.fig || 0], c = botCtl(s, p[0], p[1], dt, true); c.max = 280; trickUpdate(s, dt, s.spinHold > 0); physics(s, dt, c); figUpdate(s); addMark(s); } }
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => openPick(b.dataset.mode));
$('bMenu').onclick = () => toMenu();
// ---------- main loop, drawing, controls ----------
const FLAKES = Array.from({ length: 50 }, () => ({ x: rand(0, W), y: rand(0, H), r: rand(1.2, 3), v: rand(15, 40), w: rand(0, 6) }));
function fmt(t) { t = Math.max(0, Math.ceil(t)); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
function hud(l1, l2) {
  cx.fillStyle = 'rgba(13,27,62,.8)'; cx.beginPath(); cx.roundRect(8, 8, W - 16, l2 ? 74 : 56, 18); cx.fill();
  cx.textAlign = 'left'; cx.fillStyle = '#fff'; cx.font = 'bold 28px "Arial Rounded MT Bold", sans-serif'; cx.fillText(l1, 26, 44);
  if (l2) { cx.font = 'bold 18px sans-serif'; cx.fillStyle = '#fff59d'; cx.fillText(l2, 26, 72); }
}
function draw(dt) {
  const g = GM; drawRink(); if (!g) return;
  if (g.kind === 'free') { cx.save(); rinkPath(cx, 0); cx.clip(); cx.drawImage(TRAIL, 0, 0); cx.restore();
    if (g.shape) g.shape.pts.forEach((p, i) => { cx.fillStyle = g.shape.hit[i] ? '#ffd740' : 'rgba(255,255,255,.75)'; cx.strokeStyle = g.shape.hit[i] ? '#ff6f00' : '#7fb3e6'; cx.lineWidth = 2;
      cx.beginPath(); cx.arc(p[0], p[1], g.shape.hit[i] ? 9 : 7, 0, 7); cx.fill(); cx.stroke(); }); }
  else drawMarks(dt);
  if (g.kind === 'routine' && g.phase === 'skate') drawFig(g.me);
  const list = g.skaters.map(s => [s.y, () => drawSkater(s)]);
  if (g.kind === 'race') list.push([RCY + 20, drawIsland]);
  list.sort((a, b) => a[0] - b[0]).forEach(d => d[1]());
  drawFx(dt);
  cx.fillStyle = 'rgba(255,255,255,.85)'; for (const f of FLAKES) { f.y += f.v * dt; f.x += Math.sin((frameN + f.w * 60) / 60) * .3; if (f.y > H) { f.y = -4; f.x = rand(0, W); } cx.beginPath(); cx.arc(f.x, f.y, f.r, 0, 7); cx.fill(); }
  const s = g.me;
  if (g.kind === 'routine') {
    hud('⏱ ' + fmt(g.left) + '   ✨ ' + s.pts + ' points   ' + (s.combo > 1 ? '🔥 COMBO x' + s.combo : ''), g.phase === 'skate' ? '💡 ' + HINTS[g.hint] : '');
    if (s.comboT > 0 && g.phase === 'skate') { cx.fillStyle = '#ff9800'; cx.fillRect(W - 320, 30, 280 * s.comboT / 4, 14); cx.strokeStyle = '#fff'; cx.lineWidth = 2; cx.strokeRect(W - 320, 30, 280, 14); }
    if (g.phase === 'judge') drawJudges();
  } else if (g.kind === 'free') { const sh = g.shape;
    hud('🎨 Free Skate' + (sh ? '   🎯 ' + SHAPES.find(x => x[0] === sh.kind)[1] + ': ' + Math.round(sh.hit.filter(Boolean).length / sh.pts.length * 100) + '%' + (sh.done ? ' ✅' : '') : '   (pick a 🎯 shape to skate!)')); }
  else if (g.kind === 'race') {
    hud('🏁 Lap ' + Math.min(LAPS, s.lap + 1) + ' / ' + LAPS + '   🏅 Place #' + racePlace() + '   ⏱ ' + g.t.toFixed(1) + 's');
    if (g.count > 0) { cx.font = 'bold 120px "Arial Rounded MT Bold", sans-serif'; cx.textAlign = 'center'; cx.lineWidth = 10; cx.strokeStyle = '#fff'; const t = Math.ceil(g.count) > 0 ? String(Math.ceil(g.count)) : 'GO!';
      cx.strokeText(t, RCX, RCY + 40); cx.fillStyle = '#d81b60'; cx.fillText(t, RCX, RCY + 40); }
  }
}
function loop(t) {
  const dt = Math.min(.05, (t - lastT) / 1000 || .016); lastT = t; frameN++;
  try {
    for (let i = 0; i < FAST; i++) { if (!GM) break; const k = GM.kind;
      if (k === 'routine') routineUpdate(dt); else if (k === 'free') freeUpdate(dt); else if (k === 'race') raceUpdate(dt); else if (k === 'demo') demoUpdate(dt); }
    cx.clearRect(0, 0, W, H); draw(dt);
  } catch (e) { console.error(e); }
  requestAnimationFrame(loop);
}
const onScr = id => $(id).classList.contains('on');
const playing = () => GM && GM.me && (GM.kind !== 'routine' || GM.phase === 'skate') && !(GM.kind === 'race' && GM.count > 0) && !onScr('result');
addEventListener('keydown', e => {
  const k = e.key; if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(k)) e.preventDefault();
  if (e.repeat && (k === ' ' || k === 'z')) return; keys[k] = true; AC();
  if (onScr('title')) { if (k === 'Enter' || k === ' ') openPick('routine'); return; }
  if (onScr('pick')) { const i = RK.indexOf(PK.hero);
    if (k === 'ArrowRight' || k === 'ArrowLeft') { PK.hero = RK[(i + (k === 'ArrowRight' ? 1 : RK.length - 1)) % RK.length]; blip(880, 0, .06); renderPick(); }
    if (k === 'ArrowUp' || k === 'ArrowDown') { PK.outfit = (PK.outfit + (k === 'ArrowDown' ? 1 : OUTFITS.length - 1)) % OUTFITS.length; renderPick(); }
    if (k === 'Enter') $('pickGo').onclick(); if (k === 'Escape') toMenu(); return; }
  if (onScr('result')) { if (k === 'Enter') $('resGo').onclick(); if (k === 'Escape' && $('resMenu')) toMenu(); return; }
  if (onScr('bracket')) { if (k === 'Enter' && $('tbGo') && !$('tbGo').disabled) $('tbGo').onclick(); if (k === 'Escape') toMenu(); return; }
  if (k === 'Escape') return toMenu();
  if (playing() && !GM.me.ai) { if (k === ' ') doJump(GM.me); if (k === 'z' || k === 'Z') doPose(GM.me); }
});
addEventListener('keyup', e => { keys[e.key] = false; });
cv.addEventListener('mousedown', e => { if (!GM) return; AC(); GM.mdown = true; GM.mxy = evXY(e); });
cv.addEventListener('mousemove', e => { if (GM && GM.mdown) GM.mxy = evXY(e); });
addEventListener('mouseup', () => { if (GM) GM.mdown = false; });
function placeUI() {
  const r = cv.getBoundingClientRect(), s = r.width / W, t = $('tools'), h = $('hudBtns');
  t.style.top = (r.top + 90 * s) + 'px'; t.style.left = r.left + 'px'; t.style.width = (r.width - 110 * s) + 'px';
  h.style.top = (r.top + 90 * s) + 'px'; h.style.right = Math.max(4, innerWidth - r.right + 10 * s) + 'px';
}
addEventListener('resize', placeUI);
function init() {
  placeUI(); toMenu(); requestAnimationFrame(loop);
  const sg = Q.get('song'), ok = sg && SONGS.some(x => x.id === sg); if (ok) setTimeout(() => { stopSong(); playSong(sg); }, 200);
  const wake = () => { AC(); if (!mus) playSong(ok ? sg : 'title'); };
  ['pointerdown', 'keydown'].forEach(ev => addEventListener(ev, wake, { once: true, capture: true }));
}
init();
</script>
