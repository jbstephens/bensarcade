<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🎪 Secret Circus</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  #bubble { background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 18px; padding: 6px 12px; font-size: clamp(16px, 1.9vw, 21px); font-weight: bold; cursor: pointer; text-align: center; }
  #stageBox { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }

  body.mid #stage { background: linear-gradient(#2a1a5e 50%, #24123f 50%); }

    background: #fff8e1; border: 5px solid #2a1d4a; border-radius: 22px; padding: 10px; }

  .row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }

  .b-print { background: #a5f2a5; } .b-gold { background: #ffd740; } .b-back { background: #b3e5fc; }

  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fffbe8; border: 5px solid #2a1d4a; border-radius: 20px;
    padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #pv { position: fixed; inset: 0; background: rgba(20,16,50,.8); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  #pv.on { display: flex; }
  #pvCard { background: #fffbe8; border: 6px solid #2a1d4a; border-radius: 24px; padding: 10px 14px; width: 100%; max-width: 1200px; max-height: 100%; display: flex; flex-direction: column; gap: 8px; }
  #pvCard h2 { margin: 0; text-align: center; font-size: clamp(22px, 3vw, 34px); }

  /* act animations (tap an act to make it perform) */
  .act { cursor: pointer; }
  .go .jb { animation: jug .5s ease-in-out infinite alternate; } .go .jb2 { animation-delay: -.17s; } .go .jb3 { animation-delay: -.34s; }
  @keyframes jug { 0% { transform: translate(-30px, 20px); } 50% { transform: translate(0, -46px); } 100% { transform: translate(30px, 20px); } }
  .go .jump { animation: jump 2.2s ease-in-out; } @keyframes jump { 0%,100% { transform: translate(0, 0); } 25% { transform: translate(80px, -70px) rotate(-8deg); } 50% { transform: translate(160px, 0); } 75% { transform: translate(80px, -70px) rotate(8deg); } }

    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="room">
  <div id="left">
    <h1>🎪 Secret Circus 🎪</h1>
    <div id="bubble">🎩 Tap an act to watch it perform!</div>
    <button class="btn b-back hide" id="bDay">☀️ Back to the day show</button>

      <button class="btn s2" data-s="clap"><span>👏</span>Clapping</button>

      <button class="btn s5" data-s="march" id="bMarch"><span>🎶</span>March</button>
    </div>
  </div>
  <div id="panel">
    <div class="sec"><h3>🎟️ Put on a REAL show!</h3><input id="showName" maxlength="20" placeholder="The Ben Circus" autocomplete="off"></div>
    <div class="sec"><h3>🤹 Pick your acts</h3><div class="acts" id="acts"></div></div>
    <div class="sec"><h3>📋 Show order</h3><div id="order"></div></div>
    <div class="sec"><h3>🖨️ Print the show kit</h3><div class="row">

      <button class="btn b-print" data-p="hat">🎩 Hat band</button><button class="btn b-print" data-p="all">🖨️ All 3</button>
      <button class="btn b-gold hide" data-p="golden" id="bGold">🌟 Golden Ticket</button></div></div>
  </div>
</div>
<div id="pv"><div id="pvCard"><h2 id="pvTitle"></h2><div id="pvPages"></div>
  <div class="row"><button class="btn" id="bBW">⚫ Black &amp; White</button><button class="btn" id="bCol">🌈 Color</button>
  <button class="btn b-print" id="bPrint">🖨️ Print it!</button><button class="btn b-back" id="bClose">👍 Back</button></div>
  <div style="text-align:center;font-weight:bold" id="pvNote"></div></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>

    '<path d="M-4 -3 L13 -9.6 M-4 3 L13 9.6" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" fill="none"/>' +

// =====================================================================

  const dx = x2 - x1, dy = y2 - y1, len = Math.hypot(dx, dy), nx = -dy / len * d, ny = dx / len * d, k = Math.min(.2, d / len);
  const a = [x1 + dx * k + nx, y1 + dy * k + ny], b = [x2 - dx * k + nx, y2 - dy * k + ny];
  let s = P(poly([x1, y1, a[0], a[1], b[0], b[1], x2, y2]), LINE ? '#fff' : '#eceff1', 0) + CUT('M' + n(x1) + ' ' + n(y1) + ' L' + n(a[0]) + ' ' + n(a[1]) + ' L' + n(b[0]) + ' ' + n(b[1]) + ' L' + n(x2) + ' ' + n(y2)) + FOLD(seg(x1, y1, x2, y2));
  if (label) { const mx = (x1 + x2) / 2 + nx * .5, my = (y1 + y2) / 2 + ny * .5; s += '<g transform="rotate(90 ' + n(mx) + ' ' + n(my) + ')">' + T(mx, my + 5, label, 13, '#555') + '</g>'; }
  return s;
}
function hatPage() {
  let s = pageTitle('Ringmaster hat band: 3 strips make one big band', 'Ringmaster Hat');
  for (let k = 0; k < 3; k++) s += bandStrip(k, 30, 104 + k * 262);
  s += R(30, 896, 740, 62, 16, '#fff', OL, 2.2) + T(400, 922, 'Tape strip 2 onto the tab of strip 1, then strip 3 onto strip 2.', 16) +
    T(400, 946, 'Wrap it around your head and tape the last tab. Too big? Overlap more!', 16);
  return s + SCIS(30, 104 + PT_H, 0, 22) + footer();
}
// ---- 🌟 the secret Golden Ticket to the Midnight Circus (2 per page) ----
function goldenTicket(x, y) {
  const w = 740, h = 410, gold = '#ffd740'; let s = '';
  const scal = 'M' + (x + 30) + ' ' + y + ' L' + (x + w - 30) + ' ' + y + ' A30 30 0 0 0 ' + (x + w) + ' ' + (y + 30) + ' L' + (x + w) + ' ' + (y + h - 30) + ' A30 30 0 0 0 ' + (x + w - 30) + ' ' + (y + h) +
    ' L' + (x + 30) + ' ' + (y + h) + ' A30 30 0 0 0 ' + x + ' ' + (y + h - 30) + ' L' + x + ' ' + (y + 30) + ' A30 30 0 0 0 ' + (x + 30) + ' ' + y + ' Z';
  s += P(scal, LINE ? '#fff' : lin([[0, '#fff8d0'], [.5, '#ffe57f'], [1, '#ffca28']], 0, 0, 1, 1), 0) + R(x + 16, y + 16, w - 32, h - 32, 18, 0, OL, 2.4) + R(x + 26, y + 26, w - 52, h - 52, 14, 0, OL, 1.2, 0, ' stroke-dasharray="4 5" data-keep="1"');
  s += BT(x + 470, y + 92, 'GOLDEN TICKET', 54, gold) + T(x + 470, y + 132, 'to the', 20) + BT(x + 470, y + 182, 'MIDNIGHT CIRCUS', 40, '#7e57c2');
  s += CH(x + 150, y + 230, 1.55, () => gloop({ open: true, crown: false }) + G(0, -50, 1, C(0, 0, 14, '#f48fb1', OL, 2) + C(0, 0, 5, '#fff', OL, 1.6))) + G(x + 222, y + 200, 1.2, L('M0 40 L30 0', OL, 4) + P(starD(32, -4, 10), gold, OL, 1.6));
  s += T(x + 150, y + 352, 'King Gloop turns his', 14) + T(x + 150, y + 370, 'crown into a donut!', 14);
  s += T(x + 300, y + 242, 'Admit:', 20, OL, 'start') + WL(x + 376, x + 690, y + 244) + T(x + 300, y + 292, 'Show starts at:', 20, OL, 'start') + WL(x + 460, x + 690, y + 294);
  s += T(x + 470, y + 350, 'This ticket is MAGIC. Keep it secret!', 18) + P(moonD(x + 70, y + 80, 20), '#fff59d', OL, 2);
  [[230, 56], [704, 140], [60, 300], [704, 372], [420, 386], [262, 320]].forEach(([a, b], i) => { s += P(starD(x + a, y + b, 9 + (i % 2) * 5), gold, OL, 1.6); });
  return s + CUT(scal) + SCIS(x + 60, y, 0, 22);
}
function goldenPage() {
  return goldenTicket(30, 40) + FOLD('M20 490 L780 490') + goldenTicket(30, 540) + T(400, 980, "Secret Circus  -  Ben's Game Factory", 13, '#777');
}
// ---- page lists ----
const KITS = { tickets: [ticketsPage], program: [programPage], hat: [hatPage], all: [ticketsPage, programPage, hatPage], golden: [goldenPage] };
const KIT_NAMES = { tickets: '🎟️ Show tickets', program: '📜 Show program', hat: '🎩 Ringmaster hat band', all: '🖨️ The whole show kit', golden: '🌟 Golden Ticket' };
function buildPage(fn, tag) {
  beginArt(printMode === 'bw'); clipN = 0;
  const body = fn();
  if (LINE) DEFS = DEFS.filter(d => d.startsWith('<clipPath'));
  return svgWrap(body, 'data-sheet="' + tag + '"');
}
// =====================================================================
// SCREEN + BUTTONS
// =====================================================================
const $ = id => document.getElementById(id);
function toast(msg) { const t = $('toast'); if (!t) return; t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(() => t.classList.remove('on'), 3200); }
const ACT_LINES = ['Robo juggles three balls! Wow!', 'Sparks jumps right through the hoop!', 'Sammy walks the tightrope. So brave!', 'Dusty spins the plates. Round and round!', 'Baby Gloop rides her unicycle! Wheee!'];
const ACT_TUNES = [[523, 659, 784], [392, 523, 659, 784], [659, 587, 659, 587, 784], [784, 880, 784, 880], [523, 587, 659, 698, 784]];
const MOUSE_LINES = ['Psst! The ringmaster\'s hat is magic. Tap it three times!', 'Squeak! Did you try tapping the hat? Three times!', 'I love the circus. Tap the hat, tap the hat, tap the hat!'];
let mouseK = 0;
function say(line, who) { $('bubble').textContent = (who || '🎩') + ' ' + line; speak(line, .92, who === '🐭' ? 1.6 : who === '👑' ? .8 : 1.1); }
function renderStage() { $('stage').innerHTML = sceneSVG(); }
function perform(el, k) {
  el.classList.remove('go'); void el.getBBox(); el.classList.add('go');
  clearTimeout(el._tm); el._tm = setTimeout(() => el.classList.remove('go'), k === 'king' ? 2700 : 2300);
  if (k === 'king') { say('Abra-ca-GLOOP! Watch my crown... TA-DA! It is a donut! Hee hee!', '👑'); tone(330, 0, .3, 'triangle', .25); tone(440, .35, .3, 'triangle', .25); tone(523, 1.3, .5, 'sine', .3); setTimeout(() => SOUNDS.tada(), 1400); return; }
  tune(ACT_TUNES[k]); say(ACT_LINES[k]);
}
function tapHat() {
  const h = document.querySelector('#hat .hatIn'); if (h) { h.classList.remove('tip'); void h.getBBox(); h.classList.add('tip'); }
  hatTaps++; tone(600 + hatTaps * 150, 0, .2, 'sine', .25);
  if (hatTaps === 1) say('The ringmaster\'s hat wiggled!');
  else if (hatTaps === 2) say('It wiggled again! Something magic is happening...');
  else { hatTaps = 0; goMidnight(); }
}
function goMidnight() {
  midnight = true; document.body.classList.add('mid'); $('bDay').classList.remove('hide'); renderStage();
  tune([392, 494, 587, 784, 988]);
  if (!show.found) { show.found = true; saveState(); $('bGold').classList.remove('hide'); toast('🌟 You found the MIDNIGHT CIRCUS! A Golden Ticket is yours to print!'); }
  setTimeout(() => { const el = document.querySelector('.act[data-a="king"]'); if (el) perform(el, 'king'); }, 900);
  say('Welcome to the Midnight Circus! Here is King Gloop with his magic trick!', '🌙');
}
function goDay() { midnight = false; document.body.classList.remove('mid'); $('bDay').classList.add('hide'); renderStage(); tune([523, 659, 784]); say('Good morning, circus! Tap an act to watch it perform!'); }
function btn(txt, on, fn, cls) { const b = document.createElement('button'); b.className = 'btn' + (cls ? ' ' + cls : '') + (on ? ' on' : ''); b.innerHTML = txt; b.addEventListener('click', () => { fn(); tone(on ? 520 : 660, 0, .12, 'sine', .25); }); return b; }
function renderPanel() {
  const a = $('acts'); a.innerHTML = '';
  REAL.forEach(([id, label]) => { const on = show.order.includes(id);
    a.appendChild(btn(label, on, () => { if (on) show.order = show.order.filter(x => x !== id); else if (show.order.length < 6) show.order.push(id); else toast('6 acts is a full show!'); saveState(); renderPanel(); })); });
  const o = $('order'); o.innerHTML = '';
  if (!show.order.length) o.innerHTML = '<div style="text-align:center;font-weight:bold">Pick some acts above! 👆</div>';
  show.order.forEach((id, i) => {
    const r = document.createElement('div'); r.className = 'ord'; r.innerHTML = '<i>' + (i + 1) + '</i><span>' + esc(realAct(id)[1]) + '</span>';
    const mv = d => () => { const j = i + d; if (j < 0 || j >= show.order.length) return; [show.order[i], show.order[j]] = [show.order[j], show.order[i]]; saveState(); renderPanel(); };
    r.appendChild(btn('⬆️', false, mv(-1))); r.appendChild(btn('⬇️', false, mv(1))); o.appendChild(r);
  });
  $('bGold').classList.toggle('hide', !show.found);
}
// ---- 📄 preview + print (⚫ black & white or 🌈 color) ----
let pvKind = 'tickets';
function renderPV() {
  $('pvPages').innerHTML = KITS[pvKind].map((fn, i) => buildPage(fn, pvKind + i)).join('');
  $('bBW').classList.toggle('on', printMode === 'bw'); $('bCol').classList.toggle('on', printMode === 'color');
  $('pvNote').textContent = printMode === 'bw' ? '🖍️ Black and white, ready to color! A grown-up helps cut.' : '🌈 Color pages for a color printer! A grown-up helps cut.';
}
function openPV(kind) { pvKind = kind; $('pvTitle').textContent = KIT_NAMES[kind]; renderPV(); $('pv').classList.add('on'); tone(660, 0, .15, 'sine', .25); }
function closePV() { $('pv').classList.remove('on'); }
function setPM(m) { printMode = m; savePM(); renderPV(); }
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint() {
  $('printAll').innerHTML = KITS[pvKind].map((fn, i) => buildPage(fn, 'p' + i)).join('');
  if (pvKind !== 'golden' && !hasTrophy('secretCircus')) { trophy('secretCircus'); tune([523, 659, 784, 1047]); toast('🏆 Secret Circus trophy! Now put on your show!'); }
  setTimeout(() => { try { window.print(); } catch (_) {} if (!isTouchy()) $('printAll').innerHTML = ''; }, 80);
}
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || (/[?&]song=([^&#]*)/.exec(location.search) || [])[1] || '';
function init() {
  loadState();

  });
  document.querySelectorAll('#sound .btn').forEach(b => b.addEventListener('click', () => playSound(b.dataset.s)));
  document.querySelectorAll('[data-p]').forEach(b => b.addEventListener('click', () => openPV(b.dataset.p)));
  $('bDay').addEventListener('click', goDay);
  $('bubble').addEventListener('click', () => say(midnight ? 'Tap King Gloop to see his magic trick again!' : 'Pick your acts, print the tickets, and put on a REAL show!'));
  $('bBW').addEventListener('click', () => setPM('bw'));
  $('bCol').addEventListener('click', () => setPM('color'));
  $('bPrint').addEventListener('click', doPrint);
  $('bClose').addEventListener('click', closePV);
  $('pv').addEventListener('click', e => { if (e.target === $('pv')) closePV(); });
  window.addEventListener('afterprint', () => { $('printAll').innerHTML = ''; });
  window.addEventListener('keydown', e => { if (e.target === $('showName')) return; if (e.key === 'Escape') closePV(); });
  setTimeout(() => say('Welcome to the circus! Tap an act to watch it perform!'), 600);
  if (JB_WANT === 'march') { startMarch(); ['pointerdown', 'keydown'].forEach(ev => window.addEventListener(ev, () => { if (actx && actx.resume) actx.resume(); }, { once: true })); }
  document.addEventListener('visibilitychange', () => { if (document.hidden) { stopMarch(); try { speechSynthesis.cancel(); } catch (_) {} } });
}
if (typeof window !== 'undefined' && !window.__TEST__) { if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init(); }
