<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🧟 Fold-a-Monster Mix-Up</title>
<script src="touchpad.js?v=4"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(90deg, #dff7cf 0 40px, #d2f0c0 40px 80px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  h1.big { margin: 0; font-size: clamp(28px, 4.6vw, 54px); color: #fff; text-align: center;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #9b59ff; letter-spacing: 2px; }
  /* ---------- home (gallery) ---------- */
  #home { flex-direction: column; overflow: hidden; }
  #gHead { text-align: center; padding: 8px 10px 2px; }
  #gHead p { margin: 4px 0 2px; font-size: clamp(16px, 2.1vw, 22px); font-weight: bold; }
  #stats { font-size: 18px; font-weight: bold; color: #6b2fd6; margin: 2px 0 4px; }
  .crayons { display: flex; justify-content: center; gap: 6px; margin: 4px 0; }
  .crayons i { width: 16px; height: 40px; border-radius: 8px 8px 3px 3px; border: 2px solid #333; display: block; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 18px; align-content: start; }
  .sec { grid-column: 1 / -1; font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #333;
    text-shadow: 3px 3px 0 #333; margin: 6px 4px -6px; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #4caf50; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.go { background: #fff6c8; box-shadow: 0 6px 0 #ff9f1a; }
  .thumb.sel { border-color: #ff3d6e; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff3d6e; }
  .thumb:active { transform: scale(.96); }
  /* ---------- buttons ---------- */
  .btn { font: inherit; font-size: 22px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 10px 10px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide { display: none; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 24px; } .b-print2 { background: #ffb347; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-all { background: #ffb347; font-size: 20px; min-height: 50px; padding: 6px 14px; }
  .b-go { background: #c3a6ff; } .b-yes { background: #8ef08e; font-size: 28px; } .b-say { background: #fff3a0; }
  .b-unfold { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); font-size: 40px;
    animation: pulse 0.9s ease-in-out infinite; }
  @keyframes pulse { 50% { transform: scale(1.06) rotate(-1deg); } }
  /* ---------- sheet view ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #4caf50; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
  .side { width: min(42vw, 400px); display: flex; flex-direction: column; gap: 10px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .ptitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333;
    border-radius: 14px; padding: 6px; }
  .phelp { font-size: 19px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px; }
  #pens { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; background: #6b2fd6;
    border: 4px solid #333; border-radius: 16px; padding: 10px; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 4px solid #333; cursor: pointer; }
  .sw.sel { transform: scale(1.15); box-shadow: 0 0 0 4px #fff, 0 0 0 7px #333; }
  /* ---------- how to play ---------- */
  #how { flex-direction: column; padding: 8px 12px; gap: 6px; }
  #howSteps { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid;
    grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; align-content: start; }
  .step { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 8px; display: flex; flex-direction: column;
    align-items: center; box-shadow: 0 6px 0 #9b59ff; }
  .step svg { width: 100%; max-height: 44vh; height: auto; display: block; }
  .step .num { font-size: 26px; font-weight: bold; color: #fff; background: #ff3d6e; border: 3px solid #333; border-radius: 50%;
    width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; margin-top: -4px; }
  .step p { margin: 4px 0 0; font-size: 20px; font-weight: bold; text-align: center; }
  .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  /* ---------- play together ---------- */
  #play { flex-direction: row; gap: 12px; padding: 10px; }
  #pPaperBox { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #pPaper { background: #fff; border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #4caf50;
    perspective: 1200px; display: flex; flex-direction: column; }
  .strip { position: relative; width: 100%; border-top: 3px dashed #333; }
  .strip:first-child { border-top: none; }
  .card { position: absolute; inset: 0; transition: transform .7s ease-in-out; transform-style: preserve-3d; -webkit-transform-style: preserve-3d; }
  .strip.folded .card { transform: rotateX(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
  .face svg { width: 100%; height: 100%; display: block; }
  .front { background: #fff; }
  .back { transform: rotateX(180deg); background: repeating-linear-gradient(45deg, #b9b9c9 0 14px, #c9c9d8 14px 28px);
    display: flex; align-items: center; justify-content: center; font-size: clamp(16px, 2.6vw, 30px); font-weight: bold; color: #333; }
  .strip.now .front { background: #fff9c4; box-shadow: inset 0 0 0 5px #ff3d6e; animation: glow 1s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: inset 0 0 0 8px #ffb300; } }
  .strip.later .front { opacity: .45; }
  #pSide .msg { font-size: clamp(22px, 3vw, 34px); font-weight: bold; text-align: center; background: #fff; border: 5px solid #333;
    border-radius: 18px; padding: 10px; line-height: 1.2; }
  #pSide .msg em { font-style: normal; color: #ff3d6e; }
  .who { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .nm { font: inherit; font-size: 22px; font-weight: bold; border: 4px solid #333; border-radius: 14px; background: #fff;
    padding: 8px 4px; cursor: pointer; min-height: 54px; position: relative; }
  .nm.on { background: #ffe066; }
  .nm .ord { position: absolute; top: -10px; right: -8px; background: #ff3d6e; color: #fff; border: 3px solid #333; border-radius: 50%;
    width: 30px; height: 30px; font-size: 17px; display: flex; align-items: center; justify-content: center; }
  .seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .seg .nm.on { background: #9be3ff; }
  .lbl { font-size: 20px; font-weight: bold; text-align: center; margin-top: 2px; }
  #banner { font-size: clamp(26px, 4vw, 46px); font-weight: bold; text-align: center; color: #fff; -webkit-text-stroke: 2px #333;
    text-shadow: 3px 3px 0 #ff3d6e; word-break: break-word; }
  /* ---------- name spinner ---------- */
  #names { flex-direction: column; align-items: center; padding: 10px 12px; gap: 10px; overflow-y: auto; }
  #reels { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }
  .reel { font: inherit; width: min(27vw, 260px); height: clamp(90px, 18vh, 150px); background: #fff; border: 6px solid #333;
    border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: clamp(22px, 3.6vw, 40px);
    font-weight: bold; cursor: pointer; box-shadow: 0 6px 0 #9b59ff; color: #222; padding: 0 6px; }
  .reel.spin { background: #fff3a0; }
  .dash { font-size: 44px; font-weight: bold; }
  #nameOut { font-size: clamp(30px, 5.5vw, 64px); font-weight: bold; color: #fff; -webkit-text-stroke: 2.5px #333;
    text-shadow: 4px 4px 0 #ff3d6e; text-align: center; word-break: break-word; }
  #pastNames { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; max-width: 900px; }
  #pastNames span { background: #fff; border: 3px solid #333; border-radius: 12px; padding: 3px 10px; font-size: 16px; font-weight: bold; cursor: pointer; }
  /* ---------- toast + confetti ---------- */
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 50; transition: transform .25s; text-align: center; max-width: 90vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 40; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view, #play { flex-direction: column; }
    #paper, #pPaperBox { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    .side { width: 100%; max-height: 42vh; }
  }
  /* SVG drawing styles */
  .f { fill: #fff; stroke: #222; stroke-width: var(--sw, 4); stroke-linejoin: round; }
  .ln { fill: none; stroke: #222; stroke-width: var(--sw, 4); stroke-linecap: round; stroke-linejoin: round; }
  .thin { fill: none; stroke: #222; stroke-width: 2.5; stroke-linecap: round; }
  .dl { fill: none; stroke: #222; stroke-width: 3; stroke-dasharray: 14 9; stroke-linecap: round; }
  .tt { font-family: "Arial Rounded MT Bold", "Comic Sans MS", "Chalkboard SE", sans-serif; font-weight: 900; }
  .bub { font-family: "Arial Rounded MT Bold", "Arial Black", "Comic Sans MS", sans-serif; font-weight: 900;
    fill: #fff; stroke: #222; stroke-width: 9; stroke-linejoin: round; paint-order: stroke fill; }
  /* ---------- PRINT: only the sheet (or all the sheets) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #view .side, #toast, #trace, #fx { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="home" class="screen on">
  <div id="gHead">
    <div class="crayons" id="crayonRow"></div>
    <h1 class="big">🧟 FOLD-A-MONSTER MIX-UP</h1>
    <p>Fold the paper, draw a secret part, pass it on... then UNFOLD a silly monster!</p>
    <div id="stats"></div>
    <button class="btn b-all" id="bPrintAll">🖨️ Print all the sheets</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div><canvas id="trace"></canvas></div></div>
  <div class="side">
    <div class="ptitle" id="vTitle"></div>
    <div class="phelp" id="vHelp"></div>
    <div id="pens"></div>
    <button class="btn b-magic" id="bMagic">✨ Magic color!</button>
    <button class="btn b-print" id="bPrint">🖨️ Print blank</button>
    <button class="btn b-print2" id="bPrintColor">🖨️ Print my colors</button>
    <button class="btn b-go hide" id="bSpinMore">🎰 Spin a new name</button>
    <button class="btn b-clear" id="bClear">🧽 Clear</button>
    <button class="btn b-back" id="bBack">⬅️ Back</button>
  </div>
</div>
<div id="how" class="screen">
  <h1 class="big">📖 HOW TO PLAY</h1>
  <div id="howSteps"></div>
  <div class="row">
    <button class="btn b-say" id="bHowSay">🔊 Read it to me</button>
    <button class="btn b-go" id="bHowPlay">🎲 Let's play!</button>
    <button class="btn b-print" id="bHowPrint">🖨️ Print a fold sheet</button>
    <button class="btn b-back" id="bHowBack">⬅️ Back</button>
  </div>
</div>
<div id="play" class="screen">
  <div id="pPaperBox"><div id="pPaper"></div></div>
  <div class="side" id="pSide"></div>
</div>
<div id="names" class="screen">
  <h1 class="big">🎰 MONSTER NAME SPINNER</h1>
  <div class="phelp">Tap 🎰 SPIN! Or tap one box to spin just that part.</div>
  <div id="reels">
    <button class="reel" id="r0"></button><span class="dash">-</span>
    <button class="reel" id="r1"></button><span class="dash">-</span>
    <button class="reel" id="r2"></button>
  </div>
  <div id="nameOut"></div>
  <div class="row">
    <button class="btn b-yes" id="bSpin">🎰 SPIN!</button>
    <button class="btn b-say" id="bSayName">🔊 Say it!</button>
    <button class="btn b-print2" id="bTag">🏷️ Make a name tag</button>
    <button class="btn b-back" id="bNamesBack">⬅️ Back</button>
  </div>
  <div id="pastNames"></div>
</div>
<div id="printAll"></div>
<canvas id="fx"></canvas>
<div id="toast"></div>
<script>
'use strict';
// ================== drawing helpers (from the Activity Room) ==================
let OUT_S = 1;           // outer scale, so lines stay the same thickness when a part is shrunk
const f1 = n => Math.round(n * 10) / 10;
const sh = (tag, a) => `<${tag} class="f" ${a}/>`;
const C = (x, y, r) => sh('circle', `cx="${x}" cy="${y}" r="${r}"`);
const E = (x, y, rx, ry, rot) => sh('ellipse', `cx="${x}" cy="${y}" rx="${rx}" ry="${ry}"` + (rot ? ` transform="rotate(${rot} ${x} ${y})"` : ''));
const R = (x, y, w, h, r, rot) => sh('rect', `x="${x}" y="${y}" width="${w}" height="${h}" rx="${r || 0}"` + (rot ? ` transform="rotate(${rot} ${x + w / 2} ${y + h / 2})"` : ''));
const P = d => sh('path', `d="${d}"`);
const L = d => `<path class="ln" d="${d}"/>`;
const TH = d => `<path class="thin" d="${d}"/>`;
const DL = d => `<path class="dl" d="${d}"/>`;
const G = (x, y, s, inner, rot, flip) => `<g style="--sw:${f1(4 / (s * OUT_S))}" transform="translate(${x} ${y}) rotate(${rot || 0}) scale(${flip ? -s : s} ${s})">${inner}</g>`;
function starPts(x, y, r, n, inner) {
  n = n || 5; inner = inner || 0.45; let d = '';
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r * inner : r;
    d += (i ? 'L' : 'M') + (x + Math.cos(a) * rr).toFixed(1) + ' ' + (y + Math.sin(a) * rr).toFixed(1) + ' ';
  }
  return d + 'Z';
}
const STAR = (x, y, r, n, inner) => P(starPts(x, y, r, n, inner));
const crown = (x, y, w, h) => {
  const l = x - w / 2, b = y + h / 2, t = y - h / 2;
  return P(`M${l} ${b} L${l} ${t} L${l + w * .25} ${y} L${x} ${t - h * .2} L${l + w * .75} ${y} L${l + w} ${t} L${l + w} ${b} Z`) +
    C(x, b - h * .25, Math.max(4, w * .07)) + C(l + w * .2, b - h * .22, Math.max(3, w * .05)) + C(l + w * .8, b - h * .22, Math.max(3, w * .05));
};
const T = (x, y, size, str, anchor, fill) => `<text class="tt" x="${x}" y="${y}" text-anchor="${anchor || 'middle'}" font-size="${size}" fill="${fill || '#222'}">${str}</text>`;
const WL = (x, y, x2, label, size) => {
  size = size || 26;
  const lw = label ? Math.round(label.length * size * 0.62) + 10 : 0;
  return (label ? T(x, y, size, label, 'start') : '') + L(`M${x + lw} ${y + 4} L${x2} ${y + 4}`);
};
function titleSVG(t) {
  const n = t.length, size = Math.min(76, Math.round(1050 / Math.max(n, 1)));
  const fit = n * size * 0.72 > 740 ? ' textLength="740" lengthAdjust="spacingAndGlyphs"' : '';
  return `<text class="bub" x="400" y="${f1(70 + size * 0.36)}" text-anchor="middle" font-size="${size}"${fit}>${t.replace(/&/g, '&amp;')}</text>`;
}
const help = (str, y, size) => T(400, y || 140, size || 23, str);
// ================== Game Factory friends (from the Coloring Room, drawn around 0,0) ==================
function robo(opts) {
  opts = opts || {};
  let s = L('M0 -50 L0 -72') + C(0, -78, 9) +
    E(-54, -6, 12, 18) + E(54, -6, 12, 18) +             // ear pods
    C(0, 0, 50) +                                       // round head
    R(-38, -24, 76, 42, 20) +                           // visor
    E(-16, -3, 9, 11) + E(16, -3, 9, 11);               // eyes
  if (!opts.noBody) {
    s += R(-58, 58, 18, 44, 9) + R(40, 58, 18, 44, 9) + C(-49, 106, 11) + C(49, 106, 11) +
      R(-38, 52, 76, 62, 18) + C(0, 80, 12) + R(-30, 112, 22, 26, 8) + R(8, 112, 22, 26, 8);
  }
  return s;
}
function gloop(opts) {   // King Gloop / Baby Gloop goo blob, origin at center, ~140 wide
  opts = opts || {};
  let s = P('M-70 50 Q-80 -10 -50 -40 Q0 -80 50 -40 Q80 -10 70 50 Q55 62 40 50 Q25 66 10 52 Q-10 68 -25 52 Q-45 66 -70 50 Z') +
    E(-22, -8, 13, 17) + E(22, -8, 13, 17) + C(-20, -4, 6) + C(24, -4, 6) +
    P('M-18 22 Q0 38 18 22 Q0 28 -18 22 Z') + C(-50, -6, 6) + C(48, 18, 5);
  if (opts.crown) s += crown(0, -62, 70, 36);
  return s;
}
function puppyHead() {   // Sparks, origin head center
  return E(-44, -2, 16, 32, 20) + E(44, -2, 16, 32, -20) + C(0, 0, 46) + E(0, 20, 24, 17) + E(0, 12, 9, 7) +
    C(-17, -10, 7) + C(17, -10, 7) + E(22, -24, 14, 10);
}
function catHead() {     // Sammy the brown tabby cat, origin head center
  return P('M-40 -20 L-46 -66 L-12 -40 Z') + P('M40 -20 L46 -66 L12 -40 Z') +
    E(0, 0, 50, 44) + P('M-38 -50 L-40 -26 L-24 -38 Z') + P('M38 -50 L40 -26 L24 -38 Z') +
    E(-18, -6, 10, 12) + E(18, -6, 10, 12) + E(-18, -4, 4, 9) + E(18, -4, 4, 9) +
    P('M-7 12 L7 12 L0 20 Z') + L('M0 20 Q-8 30 -16 24 M0 20 Q8 30 16 24 M-20 16 L-48 10 M-20 20 L-48 24 M20 16 L48 10 M20 20 L48 24') +
    P('M-10 -42 L0 -26 L10 -42 Z') + P('M-30 -36 L-20 -24 L-26 -40 Z') + P('M30 -36 L20 -24 L26 -40 Z');
}
function nova() {        // Chaos Nova: one-eyed star with crystal wings
  return P('M-60 -20 L-180 -110 L-150 -10 L-200 40 L-70 30 Z') + P('M60 -20 L180 -110 L150 -10 L200 40 L70 30 Z') +
    STAR(0, 0, 110, 5, 0.5) + C(0, 0, 34) + C(0, 0, 18) + C(6, -6, 6) + P('M-24 40 Q0 58 24 40 Q0 48 -24 40 Z');
}
const negaRobo = () => robo({ noBody: true }) + L('M-32 -27 L-8 -15 M32 -27 L8 -15') + L('M-16 36 L-8 30 L0 36 L8 30 L16 36');
const dukeGoogool = () => gloop() + R(-26, -112, 52, 54, 5) + R(-44, -64, 88, 12, 6) + L('M-26 -76 L26 -76') +
  '<circle class="ln" cx="22" cy="-8" r="20"/>' + L('M40 0 Q50 20 44 40') + P('M-22 14 Q-10 4 0 13 Q10 4 22 14 Q10 20 0 17 Q-10 20 -22 14 Z');
// ================== MONSTER PARTS ==================
// Every part is drawn in its own 800 x 270 strip. The joining lines always meet the fold at the
// connector dots: x = 330 and x = 470 (top edge y = 0, bottom edge y = 270).
// cont = true means "another part comes underneath", so legs keep going down to the dots instead of ending in feet.
const HEADS = [
  { id: 'robo', who: 'Robo', art: () => R(372, 192, 56, 24, 6) + L('M372 208 L330 270 M428 208 L470 270') + G(400, 128, 1.45, robo({ noBody: true })) },
