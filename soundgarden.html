<!DOCTYPE html>

<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font-family: "Trebuchet MS", "Avenir Next", Arial, sans-serif; color: #fff; -webkit-user-select: none; user-select: none; touch-action: manipulation; }

  #title { font-size: clamp(26px, 4.5vw, 44px); font-weight: 900; letter-spacing: 1px; text-shadow: 0 2px 12px rgba(0,0,0,.8); }
  #idea { display: inline-block; margin-left: 10px; font-size: clamp(14px, 2vw, 20px); background: rgba(255,214,64,.92); color: #4a2c00; padding: 4px 12px; border-radius: 20px; vertical-align: middle; text-shadow: none; transform: rotate(-3deg); }
  .pill { pointer-events: auto; border: 0; border-radius: 999px; background: rgba(0,0,0,.45); color: #fff; font: inherit; font-size: clamp(16px, 2.2vw, 22px); font-weight: 800; padding: 10px 18px; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 2px rgba(255,255,255,.25) inset; }

  #mix { display: grid; grid-template-columns: repeat(5, minmax(0, 150px)); gap: 8px; padding: 0 12px; justify-content: center; width: 100%; box-sizing: border-box; }
  .card { pointer-events: auto; border-radius: 18px; background: rgba(0,0,0,.45); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); box-shadow: 0 0 0 2px rgba(255,255,255,.2) inset; padding: 6px 8px 4px; display: flex; flex-direction: column; align-items: center; gap: 2px; transition: background .3s, box-shadow .3s; }
  .card.on { background: rgba(255,255,255,.88); box-shadow: 0 0 22px rgba(255,236,170,.7); }
  .card button { border: 0; background: none; color: #fff; font: inherit; font-weight: 800; font-size: clamp(13px, 1.5vw, 17px); cursor: pointer; display: flex; align-items: center; gap: 6px; padding: 2px 4px; white-space: nowrap; }
  .card.on button { color: #3a2a10; }
  .card .e { font-size: clamp(26px, 3.2vw, 36px); line-height: 1; }
  .card button:active { transform: scale(.93); }
  .card input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 26px; background: transparent; margin: 0; touch-action: none; }
  .card input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: rgba(255,255,255,.35); }
  .card.on input[type=range]::-webkit-slider-runnable-track { background: linear-gradient(90deg,#ffca28,#ff7043); }

  .card input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: #fff; border: 0; }
  #fact { max-width: min(92vw, 760px); text-align: center; font-size: clamp(14px, 1.8vw, 18px); background: rgba(0,0,0,.45); padding: 7px 16px; border-radius: 16px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #count { font-size: clamp(13px, 1.5vw, 16px); font-weight: 800; background: rgba(0,0,0,.4); padding: 3px 12px; border-radius: 12px; }
  #prize { position: fixed; top: 22%; left: 50%; transform: translateX(-50%) scale(.6); background: linear-gradient(135deg,#ffe082,#ffb300); color: #4a2c00; font-size: clamp(20px, 3.5vw, 32px); font-weight: 900; padding: 16px 28px; border-radius: 26px; box-shadow: 0 10px 40px rgba(0,0,0,.5); opacity: 0; transition: all .6s; pointer-events: none; text-align: center; }
  #prize.show { opacity: 1; transform: translateX(-50%) scale(1); }
  #oops { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; text-align: center; font-size: 26px; padding: 30px; background: #123; }
  @media (max-width: 760px) { #mix { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; padding: 0 6px; } .card .t { display: none; } .card { padding: 5px 4px 2px; } }
</style>

<body>
<canvas id="gl"></canvas>
<div id="ui">
  <div id="top">
    <div id="title">🎵 Sound Garden <span id="idea">💡 Ben's idea!</span></div>
    <div id="rightBtns">
      <button class="pill" id="hush">🤫 Hush all</button>
      <button class="pill" id="hideBtn">🙈 Hide buttons</button>
    </div>

<script>
'use strict';
// ---------- shared shader bits (from Realism): hashing, noise, fbm, stars, filmic finish ----------
const COMMON = `
precision highp float;
uniform vec2 uRes; uniform float uT; uniform float uFade;
#define PI 3.14159265
float h11(float p){ p=fract(p*.1031); p*=p+33.33; p*=p+p; return fract(p); }
float h21(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
vec2 h22(vec2 p){ vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973)); p3+=dot(p3,p3.yzx+33.33); return fract((p3.xx+p3.yz)*p3.zy); }
float noise(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1,0)),u.x), mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),u.x), u.y); }
const mat2 M2=mat2(1.6,1.2,-1.2,1.6);
float fbm(vec2 p){ float s=0., a=.5; for(int i=0;i<6;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm4(vec2 p){ float s=0., a=.5; for(int i=0;i<4;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
float fbm3(vec2 p){ float s=0., a=.5; for(int i=0;i<3;i++){ s+=a*noise(p); p=M2*p+vec2(3.1,1.7); a*=.5; } return s; }
mat2 rot(float a){ float c=cos(a), s=sin(a); return mat2(c,s,-s,c); }
// star colour from a 0..1 "temperature" (red dwarf -> sun -> blue giant)
vec3 starCol(float k){ return k<.5 ? mix(vec3(1.,.62,.38), vec3(1.,.95,.88), k*2.) : mix(vec3(1.,.95,.88), vec3(.62,.75,1.), (k-.5)*2.); }
// one layer of stars: point-spread "blobs" a pixel or two wide, twinkling
vec3 starLayer(vec2 p, float cell, float dens, float px, float seed, float tw){
  vec2 q=p/cell; vec2 id=floor(q); vec2 f=fract(q)-.5;
  float r=h21(id+seed); if(r>dens) return vec3(0);
  vec2 o=(h22(id+seed*1.3)-.5)*.6; float d=length(f-o)*cell/px;
  float m=pow(h21(id*1.71+seed), 6.);
  float twk=1.-tw+tw*(.55+.45*sin(uT*(1.5+4.*h21(id+9.1))+r*60.));
  float core=exp(-d*d*(1.6-m*.9)); float halo=exp(-d*.55)*m*.25;
  return starCol(h21(id*3.7+seed))*(core*(.25+2.8*m)+halo)*twk;
}
vec3 starfield(vec2 p, float px, float amt){
  vec3 c=starLayer(p, 26.*px, .55, px, 1., .5)*.55+starLayer(p+.13, 11.*px, .45, px, 31., .4)*.22;
  c+=starLayer(p+.37, 43.*px, .5, px, 7., .6);
  c+=starLayer(p+.71, 97.*px, .55, px, 13., .7)*1.5;
  return c*amt;
}
vec3 finish(vec3 c, vec2 uv){
  c=max(c,0.); c=(c*(2.51*c+.03))/(c*(2.43*c+.59)+.14); // ACES film curve
  c=pow(clamp(c,0.,1.), vec3(1./2.2));
  c*=1.-.35*pow(length(uv*vec2(.8,1.)),2.2);           // lens vignette
  c+=(h21(gl_FragCoord.xy+fract(uT*7.)*91.)-.5)/90.;     // film grain / dither
  return c*uFade;
}
`;
// ---------- the garden scene: every sound has a 0..1 "amount" that fades its picture in and out ----------
const SCENE = `
uniform float uL[10]; uniform float uDusk, uWT;
float R,F,O,B,C,W,S,CH,CAT,OWL, PX, day;
const float YH=.1, SHORE=.05;
vec2 SUNP; vec3 AMB, DIR, SUNC;
const vec2 FIRE=vec2(.2,-.115);
vec3 lit(vec3 a, float sh){ return a*(AMB+DIR*sh); }
vec3 fireLight(vec2 p){ vec2 d=(p-FIRE-vec2(0.,.03))*vec2(1.,1.6); return vec3(1.,.5,.18)*F*(.55/(1.+dot(d,d)*90.))*(.85+.15*sin(uT*9.)*sin(uT*5.3)); }
float seg(vec2 p, vec2 a, vec2 b){ vec2 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h); }
vec3 skyCol(vec2 p){
  float y=clamp(p.y-YH,0.,.6);
  vec3 c=mix(vec3(.95,.52,.26),vec3(.85,.72,.52),smoothstep(0.,.07,y));
  c=mix(c,vec3(.42,.58,.78),smoothstep(.05,.2,y));
  c=mix(c,vec3(.13,.28,.6),smoothstep(.17,.42,y));
  float d=length(p-SUNP);
  c+=SUNC*(.18*exp(-d*3.)+.5*exp(-d*12.))*day*(1.-.8*R);
  vec3 dk=mix(vec3(.55,.32,.38),vec3(.03,.05,.13),pow(y/.45,.45));
  c=mix(c,dk,uDusk);
  vec3 gr=mix(vec3(.6,.6,.62),vec3(.36,.38,.43),y*2.)*(1.-.75*uDusk);
  return mix(c,gr,R*.8);
}
// puffy clouds (same idea as the Weather Machine)
float smax(float a, float b, float k){ float h=max(k-abs(a-b),0.)/k; return max(a,b)+h*h*k*.25; }
float cloudH(vec2 lp, float fi){
  float H=-9.;
  for(int k=0;k<5;k++){
    float fk=float(k), c=1.-abs(fk-2.)/2.;
    vec2 o=vec2((fk-2.)*.55+(h11(fi*11.+fk)-.5)*.35, .05+c*.7*(.55+h11(fi*13.+fk)*.6));
    float r=.5+.55*c*(.6+.6*h11(fi*17.+fk));
    vec2 d=(lp-o)/r; float dd=dot(d,d);
    H=smax(H,(dd<1.?sqrt(1.-dd):1.-sqrt(dd))*r,.35);
  }
  return H-(1.-smoothstep(-.95,-.55,lp.y));
}
vec3 clouds(vec2 p, vec3 col){
  float cover=.15+R*.8;
  vec3 L=normalize(vec3((SUNP-vec2(0.,.3))*vec2(1.6,1.),.4));
  vec3 lightC=mix(mix(vec3(1.,.8,.62),vec3(.75,.76,.8),R),vec3(.5,.32,.4),uDusk)*(1.-.35*R);
  vec3 shadC=mix(mix(vec3(.55,.45,.55),vec3(.38,.40,.45),R),vec3(.1,.08,.16),uDusk);
  float bump=-1.;
  for(int i=0;i<6;i++){
    float fi=float(i), hr=h11(fi*7.13+.5);
    if(hr>cover*1.1+.25) continue;
    float sz=(.045+.04*h11(fi*3.7))*(.8+.6*cover);
    float span=2.6;
    float cx=mod(h11(fi*1.91)*span+uWT*(.006+.004*h11(fi*5.)),span)-span*.5;
    float cy=YH+.14+.15*h11(fi*9.31);
    vec2 lp=(p-vec2(cx,cy))/sz;
    if(abs(lp.x)>2.8||lp.y<-1.1||lp.y>2.2) continue;
    if(bump<0.) bump=fbm4(p*vec2(24.,28.)+vec2(uWT*.02,0.));
    vec2 wp=lp+(vec2(bump,fbm3(p*40.+5.))-.5)*.35;
    float H=cloudH(wp,fi); if(H<=0.) continue;
    float e=.08; float hx=cloudH(wp+vec2(e,0.),fi), hy=cloudH(wp+vec2(0.,e),fi);
    vec3 N=normalize(vec3(-(hx-H)/e,-(hy-H)/e,1.2));
    float dif=clamp(.45+.55*dot(N,L),0.,1.);
    float a=smoothstep(0.,.18,H-.04);
    vec3 cc=mix(shadC,lightC,clamp(dif*(.75+.5*bump),0.,1.1));
    cc+=SUNC*exp(-length(p-SUNP)*5.)*day*(1.-a*.6)*.8;
    col=mix(col,cc,a);
  }
  float deck=smoothstep(.3,1.,R);
  if(deck>0.){
    vec2 q=vec2(p.x*1.4+uWT*.03,p.y*3.2); float n=fbm4(q), n2=fbm4(q*2.1+n);
    vec3 dc=mix(vec3(.36,.38,.43),vec3(.66,.68,.72),clamp(.3+(n2-.4)*1.5,0.,1.))*(1.-.8*uDusk);
    col=mix(col,dc,deck*.85*smoothstep(YH,YH+.15,p.y)*clamp(.7+(n-.45)*1.5,0.,1.));
  }
  return col;
}
vec3 sky(vec2 p){
  vec3 col=skyCol(p);
  col+=starfield(p,PX,1.)*uDusk*uDusk*(1.-R)*smoothstep(YH,.25,p.y);
  float d=length(p-SUNP);
  col+=SUNC*2.5*smoothstep(.03+PX,.03-PX,d)*day*(1.-.9*R)*smoothstep(YH-.005,YH+.01,p.y);
  // the moon comes up at dusk
  vec2 MP=vec2(-.15,.33); float md=length(p-MP);
  col=mix(col,vec3(.95,.93,.85)*(1.-.3*smoothstep(.45,.7,fbm4((p-MP)*70.))),smoothstep(.022+PX,.022-PX,md)*uDusk*(1.-.8*R));
  col+=vec3(.5,.6,.8)*.1*exp(-md*10.)*uDusk*(1.-R);
  return clouds(p,col);
}
// ---------- far away: green hills, or the sea when the waves are on ----------
float hillTop(float x){ return YH+(.11*fbm4(vec2(x*1.1+3.,.5))+.03*noise(vec2(x*5.,1.))-.04)*(1.-O); }
vec3 far(vec2 p){
  // hills
  float clump=fbm4(p*vec2(9.,16.)+3.);
  vec3 hc=lit(mix(vec3(.10,.18,.06),vec3(.26,.32,.10),clump),.55)*(.8+.4*fbm4(p*vec2(40.,60.)));
  hc*=1.-.45*smoothstep(.55,.7,fbm4(p*vec2(35.,45.)+2.));
  hc=mix(hc,skyCol(vec2(p.x,YH+.04)),.12+.25*smoothstep(YH-.01,YH+.06,p.y));
  // the sea: reflects the sky, a glittering path under the sun, waves rolling in to the beach
  float dep=clamp((YH-p.y)/(YH-SHORE),0.,1.);
  vec2 rp=vec2(p.x+.006*sin(p.y*600.+uT*1.5),2.*YH-p.y+.006);
  vec3 sc=mix(skyCol(rp)*.8,lit(vec3(.06,.2,.3),.6),.45);
  float wv=noise(vec2(p.x*60.,p.y*900.-uT*1.2))*noise(vec2(p.x*25.+3.,p.y*400.-uT*.8));
  float glit=pow(wv,3.)*exp(-abs(p.x-SUNP.x)*(6.+dep*6.))*day*(1.-R)*5.;
  sc+=SUNC*glit;
  float cyc=fract(uT/7.5);
  float sw=SHORE+.004+.012*(1.-cyc)*smoothstep(0.,.15,cyc);
  float foam=smoothstep(.003,0.,abs(p.y-sw-.002*noise(vec2(p.x*80.,uT))))*(.5+.5*noise(vec2(p.x*40.,uT*.5)));
  foam+=smoothstep(.004,0.,abs(p.y-(SHORE+.01+.01*fract(uT/7.5+.5))))*.35*noise(vec2(p.x*30.,uT));
  sc=mix(sc,lit(vec3(.95,.95,.92),.9)+vec3(.05),clamp(foam,0.,1.)*.8);
  vec3 sea=p.y>YH ? sky(p) : sc;
  vec3 land=p.y>hillTop(p.x) ? sky(p) : hc;
  return mix(land,sea,O);
}
// ---------- the meadow, with a creek bed that fills with water ----------
float creekX(float y){ return .54+.09*sin(y*7.+1.)-(y-YH)*.42; }
float creekW(float y){ return .004+(YH-y)*.085; }
vec3 water(vec2 p, float u){
  vec2 rp=vec2(p.x,2.*YH-p.y*.5);
  vec3 c=skyCol(rp)*.7+vec3(.01,.04,.05);
  float flow=noise(vec2(u*6.,p.y*120.+uT*5.))*noise(vec2(u*11.+4.,p.y*60.+uT*3.));
  c+=vec3(.7,.75,.8)*smoothstep(.25,.6,flow)*.35*(AMB.g+DIR.g);
  c+=SUNC*pow(flow,4.)*day*(1.-R)*3.;
  c=mix(c,lit(vec3(.9,.92,.95),.9),smoothstep(.75,1.,abs(u))*.5*(.6+.4*noise(vec2(p.y*200.+uT*6.,u))));  // white water at the edges
  if(R>.01){ vec2 q=vec2(p.x*90.,p.y*260.); vec2 id=floor(q), f=fract(q)-.5; float ph=fract(uT*1.3+h21(id));
    c+=vec3(.6)*step(h21(id+3.),R*.5)*smoothstep(.1,0.,abs(length(f)-ph*.45))*(1.-ph)*.5; }
  return c;
}
vec3 meadow(vec2 p){
  float near=smoothstep(SHORE,-.45,p.y);
  float sway=W*.005*sin(uT*3.+p.x*30.)+.001*sin(uT*1.3+p.x*12.);
  float px2=p.x+sway*(1.+near*3.);
  float blade=mix(noise(vec2(px2*420.,p.y*70.)),.6*noise(vec2(px2*150.,p.y*24.))+.4*noise(vec2(px2*300.,p.y*50.)),near);
  float z=.06/max(YH-p.y,.004); vec2 gp=vec2(p.x*z,z);
  float big=fbm4(gp*vec2(4.,8.));
  vec3 alb=mix(vec3(.11,.22,.03),vec3(.36,.42,.08),big)*(.6+.65*blade);
  alb=mix(alb,vec3(.5,.42,.2),smoothstep(.6,.8,fbm4(gp*vec2(9.,14.)+5.))*.45);
  // a sandy beach strip when the sea is there
  alb=mix(alb,vec3(.72,.62,.45)*(.85+.3*noise(p*300.)),O*smoothstep(SHORE-.018,SHORE-.008,p.y));
  float back=1.-.4*smoothstep(.3,.9,blade);                     // grass lit from behind by the low sun
  vec3 c=lit(alb,back);
  c+=vec3(1.,.8,.4)*smoothstep(.75,1.,blade)*.12*day*(1.-R)*(1.-near*.5);
  c*=1.-.25*R;
  // the creek
  float cx=creekX(p.y), cw=creekW(p.y);
  float u=(p.x-cx)/cw;
  if(abs(u)<1.6&&p.y<SHORE-.005){
    vec3 bed=lit(mix(vec3(.38,.33,.26),vec3(.55,.5,.42),noise(p*vec2(400.,900.)))*(.7+.4*noise(p*vec2(120.,300.))),.7);
    float bedM=smoothstep(1.5,1.1,abs(u));
    c=mix(c,bed,bedM);
    float wm=smoothstep(1.,.9,abs(u)/max(S,.001))*step(.01,S);
    c=mix(c,water(p,u/max(S,.05)),wm);
  }
  // little flowers
  vec2 fc=vec2(p.x,p.y*1.5)*95.; vec2 fid=floor(fc), ff=fract(fc)-.5;
  float fr=h21(fid);
  if(fr<.08*smoothstep(.05,.4,near)&&abs(u)>1.6){ float d=length(ff-(h22(fid)-.5)*.6); float k=h21(fid+4.);
    vec3 fl=k<.4?vec3(.95,.95,.9):k<.75?vec3(1.,.8,.25):vec3(.75,.45,.9);
    c=mix(c,lit(fl,.9),smoothstep(.13,.07,d)); }
  c+=fireLight(p)*mix(alb*3.,vec3(.25),.3);
  return c;
}
// ---------- the big tree, its branch, the owl and the wind chimes ----------
float swayAt(float y){ float b=smoothstep(-.06,.3,y); return (W*(.01+.006*sin(uT*1.9)+.003*sin(uT*4.3))+.0012*sin(uT*.7))*b*b; }
vec4 tree(vec2 p){
  if(p.x<-.8||p.x>-.2||p.y<-.08||p.y>.42) return vec4(0.);
  vec2 q=p-vec2(swayAt(p.y),0.);
  vec4 o=vec4(0.);
  float w=.016-(q.y+.07)*.03;
  float tr=smoothstep(PX,-PX,abs(q.x+.57-(q.y+.07)*.03)-w)*step(-.075,q.y)*step(q.y,.26);
  vec2 bq=q-vec2(0.,.012*sin((q.x+.56)*9.));
  float br=smoothstep(PX,-PX,seg(bq,vec2(-.56,.15),vec2(-.24,.176))-.0025-(-.24-q.x)*.012);
  tr=max(tr,br*step(q.x,-.235));
  tr=max(tr,smoothstep(.004,.002,seg(q,vec2(-.56,.2),vec2(-.66,.28))));
  if(tr>0.){
    float bark=noise(vec2(q.x*500.,q.y*60.));
    o=vec4(lit(vec3(.26,.18,.12)*(.65+.55*bark),.5+.5*smoothstep(-.6,-.54,q.x))+fireLight(p)*.3,tr);
  }
  float d=min(min(length((q-vec2(-.6,.25))/vec2(.13,.1)),length((q-vec2(-.68,.21))/vec2(.08,.07))),
              min(min(length((q-vec2(-.52,.22))/vec2(.07,.06)),length((q-vec2(-.6,.32))/vec2(.08,.06))),length((q-vec2(-.235,.2))/vec2(.045,.032))));
  float flut=uT*W*.9;
  float cl=fbm4(q*22.+vec2(flut,0.));
  float lv=.6*fbm3(q*60.+vec2(flut*3.,0.))+.4*noise(q*140.+vec2(flut*4.,0.));
  float e=d+.30*(cl-.5)+.14*(lv-.5);
  float a=smoothstep(1.,.96,e);
  if(a>0.){
