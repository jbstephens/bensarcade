<canvas id="game" width="960" height="520"></canvas>
<script>
// 🎵 ROBO JUMP 4 REMIX STUDIO
// Robo Jump 4's REAL main theme (copied note for note from robojump4.html) played in 7 brand-new styles,
// plus BEN'S OWN IDEA: the MEGA BOSS MASH (Robo Jump 4's boss music with the boss songs of Robo Jump 1, 2, 3, 5, 6, 7, 8 and 9 mashed in).
// Tap a remix to play it. Arrows pick, SPACE / ENTER play, ESC stop, X = Mix it!
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520;
const JB = window.JUKEBOX || null;                    // 🎶 jukebox mode (the book plays our music in a hidden copy)

// ---------- Saves + trophies ----------
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { heard: {}, loop: false, music: true };
try { const s = JSON.parse(localStorage.getItem('rj4Remix') || 'null'); if (s && typeof s === 'object') save = Object.assign(save, s); } catch (_) {}
if (!save.heard || typeof save.heard !== 'object') save.heard = {};
function writeSave() { try { localStorage.setItem('rj4Remix', JSON.stringify(save)); } catch (_) {} }
const heardCount = () => Object.keys(save.heard).filter(k => REMIX_IDS.includes(k)).length;
let trophyFlash = 0;

// ---------- Audio setup ----------
let actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null, distCurve = null;
let musicOn = true;
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = 0.62; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.7; sfxBus.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  distCurve = new Float32Array(1024);                  // 🎸 soft-clip curve for the rock guitars
  for (let i = 0; i < 1024; i++) { const x = i / 511.5 - 1; distCurve[i] = Math.tanh(x * 6) * 0.8; }
}
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  else if (actx.state === 'suspended' && actx.resume) actx.resume();
}
function blip(freq, dur = 0.08, wave = 'square', vol = 0.06, slideTo = null) {   // little click sounds for the buttons
  if (!actx || !sfxBus || JB) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t); if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.005); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(sfxBus); o.start(t); o.stop(t + dur + 0.02);
}

// ---------- Instrument building blocks (from Robo Jump 4's music engine) ----------
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
function gainNode(v) { const g = actx.createGain(); g.gain.value = v; return g; }
function vibrato(t, end, f, rate, depth, delay, oscs) {
  const lfo = osc('sine', rate, t, end), lg = actx.createGain();
  lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + delay); lg.gain.linearRampToValueAtTime(f * depth, t + delay + 0.3);
  lfo.connect(lg); for (const o of oscs) lg.connect(o.frequency);
}
// 🎺 LEAD voices: synths, brass, flute, bells, steel drum, music box, chiptune pulse, a wobbly theremin, a horn
function leadVoice(m, t, dur, vol, kind, out, echo, prev) {
  const f = midi(m), end = t + dur + 0.3;
  let g;
  if (kind === 'steel' || kind === 'bell' || kind === 'musicbox') {        // hit-and-ring voices
    const ring = kind === 'musicbox' ? 1.2 : 0.6;
    g = envGain(t, 0.004, vol, 0.25, Math.min(dur, ring), kind === 'musicbox' ? 0.8 : 0.25, out);
    const parts = kind === 'steel' ? [[1, 1], [2, 0.35], [3.01, 0.12]] : kind === 'musicbox' ? [[1, 1], [3.99, 0.22], [8.1, 0.06]] : [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = gainNode(v); osc('sine', f * k, t, end + 0.6).connect(pg); pg.connect(g); }
  } else if (kind === 'chip') {                                           // 🕹️ raw pulse wave, like an old game console
    g = envGain(t, 0.003, vol * 0.8, 0.7, dur, 0.03, out);
    const o1 = osc('square', f, t, end), o2 = osc('square', f, t, end, 12), mix = gainNode(0.5);
    o1.connect(mix); o2.connect(mix); mix.connect(g);
    if (dur > 0.3) vibrato(t, end, f, 6.5, 0.012, 0.15, [o1, o2]);
  } else if (kind === 'theremin') {                                       // 🎃 ooo-wee-ooo: slides between notes + a big wobble
    g = envGain(t, 0.06, vol, 0.9, dur, 0.18, out);
    const o1 = osc('sine', prev ? midi(prev) : f, t, end), o2 = osc('triangle', prev ? midi(prev) : f, t, end, 4);
    o1.frequency.setTargetAtTime(f, t, 0.05); o2.frequency.setTargetAtTime(f, t, 0.05);
    const mix = gainNode(0.6); o1.connect(mix); o2.connect(mix); mix.connect(g);
    vibrato(t, end, f, 6.2, 0.022, 0.04, [o1, o2]);
  } else {
    const soft = kind === 'flute' || kind === 'glass' || kind === 'horn';
    g = envGain(t, soft ? 0.04 : 0.012, vol, 0.8, dur, kind === 'horn' ? 0.2 : 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'], horn: ['sawtooth', 'triangle'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, horn: 900, flute: 4000, glass: 3500 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass' || kind === 'horn') { lp.frequency.linearRampToValueAtTime(cut * 2.5, t + 0.06); lp.frequency.setTargetAtTime(cut * 1.2, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = gainNode(kind === 'glass' ? 0.6 : 0.5);
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) vibrato(t, end, f, 5.6, 0.009, 0.12, [o1, o2]);
  }
  if (echo && P && P.delayIn) g.connect(P.delayIn);
}
// 🎹 PAD voices: strings, choir "aah", ghostly "ooo", organ, a soft lullaby pad
function padVoice(notes, t, dur, vol, kind, out) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.8;
    const att = { choir: 0.35, ooo: 0.6, strings: 0.5, soft: 0.5, organ: 0.03 }[kind] || 0.22;
    const g = envGain(t, Math.min(att, dur * 0.6), vol, 0.85, dur, kind === 'organ' ? 0.15 : 0.6, out);
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      for (const [k, v] of [[2, 0.45], [3, 0.2], [4, 0.15]]) { const g2 = gainNode(v); osc('sine', f * k, t, end).connect(g2); g2.connect(g); }
    } else if (kind === 'choir' || kind === 'ooo') {                      // vowel filters on detuned saws
      const src = gainNode(0.5), o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      const fm = kind === 'ooo' ? [[320, 7, 1.3], [800, 8, 0.4], [2300, 9, 0.1]] : [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]];
      for (const [ff, q, v] of fm) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = gainNode(v * 2.2); src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      vibrato(t, end, f, kind === 'ooo' ? 3.2 : 4.8, kind === 'ooo' ? 0.012 : 0.006, 0.1, [o1, o2]);
    } else if (kind === 'soft') {
      const lp = lowpass(900, 0.5, t); lp.connect(g);
      osc('triangle', f, t, end, -6).connect(lp); osc('sine', f, t, end, 6).connect(lp);
    } else {                                                              // 'saw' or 'strings' (3 detuned saws + slow vibrato)
      const str = kind === 'strings', lp = lowpass(str ? 2200 : 1500, 0.7, t); lp.connect(g);
      const os = [osc('sawtooth', f, t, end, -11), osc('sawtooth', f, t, end, 11)];
      if (str) os.push(osc('sawtooth', f, t, end, 0));
      for (const o of os) o.connect(lp);
      if (str) vibrato(t, end, f, 5, 0.004, 0.2, os);
    }
  }
}
// 🎸 BASS voices: punchy synth, slap, sub, tuba, chip, dance synth
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  if (kind === 'chip') { const g = envGain(t, 0.003, vol * 1.1, 0.9, dur, 0.02, out); osc('triangle', f, t, end).connect(g); return; }
  if (kind === 'tuba') {                                                  // 🎺 oom-pah tuba
    const g = envGain(t, 0.03, vol * 1.2, 0.7, dur, 0.08, out), lp = lowpass(420, 2, t);
    lp.frequency.linearRampToValueAtTime(800, t + 0.05); lp.frequency.setTargetAtTime(380, t + 0.06, 0.1); lp.connect(g);
    osc('sawtooth', f, t, end).connect(lp); const sg = gainNode(0.7); osc('sine', f, t, end).connect(sg); sg.connect(g); return;
  }
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const slap = kind === 'slap', syn = kind === 'synth';
  const lp = lowpass(slap ? 3200 : syn ? 2400 : 1600, slap ? 8 : syn ? 12 : 5, t);
  lp.frequency.setTargetAtTime(slap ? 380 : syn ? 300 : 260, t + 0.01, slap ? 0.05 : syn ? 0.07 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = gainNode(0.6); osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 PLUCK / arpeggio voices
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.3;
  if (kind === 'chip') { const g = envGain(t, 0.002, vol, 0.6, dur * 0.7, 0.02, out); osc('square', f, t, end).connect(g); return; }
  const g = envGain(t, 0.004, vol, 0.35, dur, kind === 'musicbox' ? 0.6 : 0.12, out);
  if (kind === 'bell' || kind === 'musicbox') { osc('sine', f, t, end).connect(g); const g2 = gainNode(kind === 'musicbox' ? 0.2 : 0.3); osc('sine', f * (kind === 'musicbox' ? 3.99 : 3.01), t, end).connect(g2); g2.connect(g); }
  else if (kind === 'harp') { const lp = lowpass(3000, 1, t); lp.frequency.setTargetAtTime(1200, t, 0.15); lp.connect(g); osc('triangle', f, t, end).connect(lp); osc('sine', f * 2, t, end).connect(lp); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
// 🎸 POWER CHORD: root + fifth + octave, into the crunchy guitar amp (P.amp)
function guitarChord(root, t, dur, vol, mute) {
  const end = t + dur + 0.1, g = envGain(t, 0.004, vol, mute ? 0.3 : 0.85, dur, mute ? 0.03 : 0.1, P.amp);
  for (const [k, d] of [[0, -6], [7, 6], [12, 0]]) osc('sawtooth', midi(root + k), t, end, d).connect(g);
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
function thump(t, f0, f1, drop, vol, decay, out, type = 'sine') {
  const o = osc(type, f0, t, t + decay + 0.05); o.frequency.exponentialRampToValueAtTime(f1, t + drop);
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  o.connect(g); g.connect(out);
}
// 🥁 DRUMS. k kick, s snare, h hat, o open hat, c clap, x crash, r rim, t tom, T timpani (tuned), K big dance kick,
// n chip noise snare, q chip hat, b chip kick, z snare ROLL (4 fast hits), w wood block, g gong-ish boom
function drumHit(kind, t, vol, out, sd, root) {
  if (kind === 'k') thump(t, 150, 42, 0.12, vol, 0.32, out);
  else if (kind === 'K') { thump(t, 180, 40, 0.15, vol * 1.15, 0.45, out); noiseHit(t, 'highpass', 3000, 0.7, vol * 0.12, 0.02, out); }
  else if (kind === 'b') thump(t, 220, 50, 0.06, vol * 0.7, 0.12, out, 'square');
  else if (kind === 's' || kind === 'z') {
    const hits = kind === 'z' ? 4 : 1;
    for (let i = 0; i < hits; i++) {
      const tt = t + i * (sd || 0.1) / 4, v = kind === 'z' ? vol * (0.45 + i * 0.12) : vol;
      noiseHit(tt, 'highpass', 1400, 0.7, v * 0.8, kind === 'z' ? 0.07 : 0.16, out);
      thump(tt, 200, 180, 0.05, v * 0.5, 0.09, out, 'triangle');
    }
  }
  else if (kind === 'n') noiseHit(t, 'bandpass', 2500, 0.6, vol, 0.09, out);
  else if (kind === 'q') noiseHit(t, 'highpass', 9000, 1, vol, 0.025, out);
  else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.4, out);
  else if (kind === 'r') thump(t, 2400, 2300, 0.03, vol, 0.04, out);
  else if (kind === 'w') thump(t, 1200, 1150, 0.02, vol, 0.06, out, 'triangle');
  else if (kind === 't') thump(t, 140, 75, 0.25, vol, 0.28, out);
  else if (kind === 'T') { const f = midi(((root || 0) % 12 + 12) % 12 + 38); thump(t, f * 1.08, f, 0.08, vol, 0.9, out); noiseHit(t, 'lowpass', 300, 1, vol * 0.4, 0.15, out); }
  else if (kind === 'g') { thump(t, 90, 45, 0.6, vol, 1.6, out); noiseHit(t, 'lowpass', 900, 0.5, vol * 0.3, 0.8, out); }
}

// ---------- Robo Jump 4's real music, in Robo Jump 4's own note language ----------
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest.
// Chords: one per bar ("4/5" = two), degree number, M = major, m = minor, b = flat root, 7 = add the 7th.
const SCALES = { major: [0, 2, 4, 5, 7, 9, 11], minor: [0, 2, 3, 5, 7, 8, 10], dorian: [0, 2, 3, 5, 7, 9, 10] };
const degS = (sc, k) => sc[((k - 1) % 7 + 7) % 7] + 12 * Math.floor((k - 1) / 7);
function parseMel(str, sc) {
  return str.replace(/\|/g, ' ').trim().split(/\s+/).filter(Boolean).map(tk => {
    if (tk === '.') return null;
    if (tk === '-') return 'h';
    const m = tk.match(/^([b#]?)([1-7])([',]*)$/);
    if (!m) return null;
    const acc = m[1] === 'b' ? -1 : m[1] === '#' ? 1 : 0, d = +m[2];
    const oct = (m[3].match(/'/g) || []).length - (m[3].match(/,/g) || []).length;
    let hd = d - 2, ho = oct; if (hd < 1) { hd += 7; ho--; }
    return { s: sc[d - 1] + acc + 12 * oct, hs: sc[hd - 1] + 12 * ho };
  });
}
function parseChord(tk, sc) {
  let flat = false; if (tk[0] === 'b') { flat = true; tk = tk.slice(1); }
  const r = +tk[0], q = tk.slice(1), root = sc[r - 1] - (flat ? 1 : 0);
  let third = flat ? root + 4 : root + ((degS(sc, r + 2) - sc[r - 1]) % 12 + 12) % 12;
  if (q.includes('M')) third = root + 4;
  if (q.includes('m')) third = root + 3;
  const ch = [root, third, root + 7];
  if (q.includes('7')) ch.push(root + ((degS(sc, r + 6) - sc[r - 1]) % 12 + 12) % 12);
  return ch;
}
const parseChords = (str, sc) => str.trim().split(/\s+/).map(b => b.split('/').map(c => parseChord(c, sc)));
function melEvents(arr) {                              // onset -> length in 8ths (holds tie notes together)
  const ev = new Array(arr.length).fill(null);
  for (let i = 0; i < arr.length; i++) if (arr[i] && arr[i] !== 'h') { let n = 1; while (arr[i + n] === 'h') n++; ev[i] = Object.assign({ len: n }, arr[i]); }
  return ev;
}
// 🤖 ROBO JUMP 4 MAIN THEME (copied exactly from robojump4.html: A major, 140 BPM)
const RJ4_TITLE = {
  I: { ch: '1 6 4 5', mel: "5, . 1 . 2 . 3 - | 6 - 5 . 3 . 1 . | 4 - 3 . 4 . 6 . | 5 - - - 5 . 7 ." },
  V: { ch: '6 4 1 5 6 4 2 5',
       mel: ". 3 3 3 - 2 1 . | 1 . 6, . 1 - 2 . | 3 - 3 2 3 . 5 . | 2 - - 1 7, - 5, . | . 3 3 3 - 2 1 . | 1 . 6, . 1 - 4 . | 4 - 3 . 4 . 6 . | 5 - - . . 5 6 7" },
  C: { ch: '1 5 6 4 1 5 4/5 1',
       mel: "1' - 7 1' - 5 - . | 2' - 1' 2' - 7 - . | 3' - 2' 3' - 1' - 6 | 1' - 6 - 4 - 5 6 | 1' - 7 1' - 5 - . | 2' - 1' 2' - 7 5 . | 4 - 6 1' - 7 - 2' | 1' - - - . . 5 5" },
  B: { ch: '4 5 3 6 2 5 4 5',
       mel: "6 . 6 . 6 5 6 1' | 7 - 5 - 2 - . . | 7 . 7 . 7 6 7 2' | 1' - 6 - 3 - . . | 4 . 4 5 6 . 4 . | 5 . 5 6 7 . 2' . | 1' - 6 - 1' - 2' - | 2' - - - 5 5 6 7" } };
// 👾 ROBO JUMP 4 BOSS MUSIC (copied exactly: D minor, 168 BPM)
const RJ4_BOSS = {
  I: { ch: '1 1 6 5M', mel: "1 . 1 . 1 . 1 . | 1 . 1 . b2 . 1 . | 6 . 6 . 6 . 6 . | #7 . 2' . #7 . 5 ." },
  V: { ch: '1 1 6 7 1 1 6 5M',
       mel: "5 . 1' . 5 . 3' 2' | 1' - 7 - 5 - . . | 6 . 1' . 6 . 4' 3' | 2' - 1' - 7 - . . | 5 . 1' . 5 . 3' 2' | 1' - 7 - 5 - 3' 4' | 5' - 4' - 3' - 1' - | #7 - - - 5 - #7 -" },
  C: { ch: '6 7 1 1 6 7 5M 5M',
       mel: "3' - 3' 4' 5' - 3' - | 2' - 2' 3' 4' - 2' - | 1' - 1' 2' 3' - 5' - | 1'' - - - 5' - - - | 3' - 3' 4' 5' - 3' - | 2' - 2' 3' 4' - 2' - | #7 - 2' - 5' - 4' - | #7' - - - 2'' - - -" },
  B: { ch: '4 4 1 1 4 4 5M 5M',
       mel: "4 - - - 6 - - - | 1' - - - 4' - - - | 3' - - - 1' - - - | 5 - - - 3' - - - | 4' - - - 6' - - - | 4' - - - 1' - - - | #7 - - - 2' - - - | 5' - - - #7' - - -" } };
