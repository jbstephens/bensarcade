<style>

  for (const k in panels) { const [x, y, w, h] = panels[k]; s += '<g' + clipRect(x, y, w, h) + '>' + (k === 'top' ? topArt(x, y, w, h) : wallArt(k, x, y, w, h)) + '</g>'; }

}
// RAMP (a wedge): back (Hr) | base (B) | slope (L) | tab, with a right-triangle side on each side of the base.

  for (const d of [-1, 1]) {                            // the two triangle sides
    const xe = d < 0 ? xs : xs + W, tri = [xe, y1, xe + d * Hr, y1, xe, y2];
    s += P(poly(tri), LINE ? '#fff' : '#b0bec5', 0) + label(xe + d * Hr * .32, y1 + B * .3, 'side', 12);
    s += tab(xe + d * Hr, y1, xe, y1, 0, -1, 'TAPE', 20);

  s += CUT(`M${n(xs)} ${n(y1)} V${n(Y0)} H${n(xs + W)} V${n(y1)} M${n(xs)} ${n(y2)} V${n(y3)} M${n(xs + W)} ${n(y2)} V${n(y3)}`);

function rotate() { clearInterval(rotTimer); rotTimer = setInterval(() => { if (!printBox && $('paradeBox').style.display !== 'flex') showMascot(MI + 1); }, 7000); }
const pick = a => a[Math.floor(Math.random() * a.length)];
const ADD_LINES = ['Great choice, Ben!', 'Into the cart!', 'Ooh, that one is awesome!', 'Good pick! Your cart is getting full!', 'Nice! That one prints on plain paper.'];
// 🖼️ thumbnails: the real first page, small

function el(tag, cls, html) { const e = document.createElement(tag); if (cls) e.className = cls; if (html !== undefined) e.innerHTML = html; return e; }
function stars(n) { return '★★★★★'.slice(0, n) + '<span style="color:#ddd">' + '★★★★★'.slice(n) + '</span>'; }

function updateTop() {

function toggleCart(k) {

function closeReviews() { $('revBox').style.display = 'none'; sfx.click(); }
function cartTotal() { return S.cart.reduce((a, k) => a + priceOf(k), 0) + (S.gift && S.cart.length ? GIFT_COST : 0); }
function renderCart(m) {
  const L = el('div', 'list'); m.appendChild(L);

function checkout() {

function moreCoins() {

// 🚀 delivery: a Robo rocket truck zooms across the moon
let shipT = -1, shipCount = 0, shipStart = 0, shipDone = false;
function shipScene() {
  beginArt(false);
  let s = '<rect width="960" height="540" fill="#0b1640"/>' + starsIn(0, 0, 960, 380, 40) + C(880, 330, 40, '#2979ff', OL, 3) + '<rect y="420" width="960" height="120" fill="#90a4ae"/>';
  for (let i = 0; i < 8; i++) s += crater(60 + i * 125, 470 + (i % 2) * 30, 30);
  let truck = R(0, 0, 230, 110, 16, '#2962ff', OL, 4) + R(230, 30, 90, 80, 16, '#00b8d4', OL, 4) + R(250, 42, 52, 38, 8, '#b3e5fc', OL, 2) + fitRobo(robo('robo'), 276, 84, 40, 44);
  truck += T(115, 44, 'RJ WORLDS', 28, '#ffd740') + T(115, 80, 'EXPRESS', 24, '#fff');

  truck += '<g id="boxes"></g>';
  s += '<g id="truck">' + truck + '</g>' + '<g id="conf"></g>';
  s += '<text id="shipTxt" x="480" y="110" font-size="54" fill="#fff" text-anchor="middle"' + FONT + '>Placing order...</text><text id="shipSub" x="480" y="170" font-size="28" fill="#b3e5fc" text-anchor="middle"' + FONT + '></text>';
  s += '<rect x="280" y="190" width="400" height="24" rx="12" fill="#ffffff" opacity=".3"/><rect id="shipBar" x="280" y="190" width="24" height="24" rx="12" fill="#ffd740"/>';
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540"><defs>' + DEFS.join('') + '</defs>' + s + '</svg><button class="bigbtn green" id="shipGo" style="display:none">📦 SEE MY ORDERS</button>';
}
function startShip(n) {

  $('ship').innerHTML = shipScene(); $('ship').style.display = 'flex'; $('shipGo').onclick = closeShip;
  let b = ''; for (let i = 0; i < Math.min(n, 6); i++) b += R(20 + i * 33, -32, 30, 30, 3, '#d7a86e', '#6d4c41', 2) + R(32 + i * 33, -32, 6, 30, 0, '#6d4c41', 0);
  $('boxes').innerHTML = b; sfx.vroom(); say('Placing your order... Here we go!'); requestAnimationFrame(shipLoop);
}
function shipLoop() {
  if (shipT < 0) return;
  shipT = Math.max(shipT + (window.__shipStep || 0), Math.floor((performance.now() - shipStart) / 16.7));
  const done = shipT > 150, tx = done ? 320 : -380 + Math.min(1, shipT / 140) * 700, bob = done ? 0 : Math.sin(shipT * .5) * 3;
  $('truck').setAttribute('transform', 'translate(' + n(tx) + ' ' + n(300 + bob) + ')');
  $('shipBar').setAttribute('width', n(Math.max(24, 400 * Math.min(1, shipT / 150))));
  if (!done) $('shipTxt').textContent = 'Placing order' + '...'.slice(0, 1 + Math.floor(shipT / 12) % 3);
  else {
    let c = ''; for (let i = 0; i < 40; i++) { const a = i * 2.4, d = (shipT - 150) * (3 + i % 4); c += '<rect x="' + n(480 + Math.cos(a) * d) + '" y="' + n(140 + Math.sin(a) * d * .7 + (shipT - 150) * 1.5) + '" width="12" height="8" fill="' + ['#ff4081', '#ffd740', '#69f0ae', '#40c4ff'][i % 4] + '"/>'; }

function closeShip() { shipT = -1; $('ship').style.display = 'none'; sfx.click(); show('orders'); }
function renderOrders(m) {
  const L = el('div', 'list'); m.appendChild(L);
  L.appendChild(el('div', 'h2', '📦 My Orders'));
  if (!S.orders.length) {
    L.appendChild(el('div', 'empty', 'No orders yet! Buy something, then you can print it here.'));
    const b = el('button', 'bigbtn green', '🏬 GO SHOPPING'); b.style.display = 'block'; b.style.margin = '0 auto'; b.onclick = () => { sfx.click(); show('shop'); }; L.appendChild(b); return;
  }
  const all = el('button', 'bigbtn blue', '🖨️ Print ALL my orders'); all.style.display = 'block'; all.style.margin = '0 auto 14px'; all.onclick = () => openPrint(S.orders.slice()); L.appendChild(all);

// 🖨️ print preview: nothing prints until Ben taps PRINT
function printFns(list) {
  const fns = [];

  return fns;
}
function openPrint(list) {

}
function closePrint(quiet) { if (printBox) { printBox.remove(); printBox = null; if (!quiet) sfx.click(); } }
function toggleInk() { S.ink = !S.ink; save(); sfx.click(); updateTop(); say(S.ink ? 'Ink Saver ON! Black lines, so you can color them in.' : 'Full color! That uses lots of ink.'); }
// 🤖 MASCOT PARADE: every Robo marches across and says hi
let parT = -1, parStart = 0, parSaid = -1;
const PAR_GAP = 190, PAR_SPEED = 2.2;
function openParade() {
  const row = $('paradeRow'); row.innerHTML = '';
  MASC.forEach(r => { const d = el('div', 'pr', mascotSvg(r) + '<b>' + r.name + '</b>'); row.appendChild(d); });
  $('paradeBox').style.display = 'flex'; parT = 0; parStart = performance.now(); parSaid = -1; $('psay').textContent = 'Here they come!';
  sfx.click(); say('ROBO TEAM PARADE! Every mascot, march!', 'robo'); requestAnimationFrame(paradeLoop);
}
function paradeLoop() {
  if (parT < 0) return;
  parT = Math.max(parT + (window.__shipStep || 0), Math.floor((performance.now() - parStart) / 16.7));
  const W = window.innerWidth, kids = $('paradeRow').children;
  for (let i = 0; i < kids.length; i++) {

    kids[i].style.transform = 'translate(' + Math.round(x) + 'px,' + Math.round(-hop) + 'px)';
    if (x < W / 2 - 75 && i > parSaid) { parSaid = i; const r = MASC[i]; $('psay').textContent = r.name + ': "' + MASCOTS[r.id][3] + '"'; sfx.march(i); try { if ('speechSynthesis' in window) { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(r.name + '!'); u.pitch = Math.min(2, MASCOTS[r.id][0]); u.rate = MASCOTS[r.id][1]; speechSynthesis.speak(u); } } catch (_) {} }
  }
  const last = W + 20 - parT * PAR_SPEED + (kids.length - 1) * PAR_GAP;

function closeParade() { parT = -1; $('paradeBox').style.display = 'none'; sfx.click(); showMascot(MI); }
// ⌨️ keys: Escape = back, P = print, 1/2/3 = tabs, Enter = continue
window.addEventListener('keydown', e => {
  const parade = $('paradeBox').style.display === 'flex';
  if (e.key === 'Escape') { if (printBox) closePrint(); else if (parade) closeParade(); else if ($('revBox').style.display === 'flex') closeReviews(); else if (shipT > 150) closeShip(); else if (view !== 'shop') show('shop'); }
  else if ((e.key === 'p' || e.key === 'P') && printBox) printBox.querySelector('.pbPrint').click();

  else if (!printBox && !parade && shipT < 0 && e.key === '1') { sfx.click(); show('shop'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '2') { sfx.click(); show('cart'); }
  else if (!printBox && !parade && shipT < 0 && e.key === '3') { sfx.click(); show('orders'); }
});
$('tShop').onclick = () => { sfx.click(); show('shop'); };
$('tCart').onclick = () => { sfx.click(); show('cart'); say(S.cart.length ? 'Here is your cart! Tap CHECKOUT when you are ready.' : 'Your cart is empty!'); };

$('paradeOk').onclick = closeParade;
$('ink').onclick = toggleInk;
$('mascot').onclick = () => { sfx.click(); say(pick(MASCOTS[curM().id].slice(2))); };
$('revBox').onclick = e => { if (e.target.id === 'revBox') closeReviews(); };

  const c = $('card_' + DEAL); if (c) { c.scrollIntoView({ behavior: 'smooth', block: 'center' }); c.classList.add('sel'); setTimeout(() => c.classList.remove('sel'), 2200); }
  say('Deal of the Day: ' + PR(DEAL).name + '! Half price!');
};
$('deal').textContent = '🔥 Deal: ' + PR(DEAL).name;
showMascot(Math.floor(Math.random() * MASC.length), true);
render(); rotate();
setTimeout(() => { $('bubble').textContent = S.orders.length ? MASCOTS[curM().id][2] + ' Your orders are in MY ORDERS.' : MASCOTS[curM().id][2]; }, 50);
