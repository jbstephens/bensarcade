<script>

    '<path d="M-4 -3 L13 -9.6 M-4 3 L13 9.6" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" fill="none"/>' +

const COR = '#d97757', COR2 = '#e8956f', COR3 = '#b85c3c', CCREAM = '#fbe3d3', CDARK = '#3d2b23', GOLD = '#ffc94d';
// the Claude sparkle: 8 rounded rays (long, short, long...) like the Claude Museum
function clSparkD(x, y, r, rot) { let d = ''; for (let i = 0; i < 8; i++) { const a = (rot || 0) + i * Math.PI / 4, q = i % 2 ? .7 : 1;
  d += 'M' + n(x + Math.cos(a) * r * .25) + ' ' + n(y + Math.sin(a) * r * .25) + ' L' + n(x + Math.cos(a) * r * q) + ' ' + n(y + Math.sin(a) * r * q) + ' '; } return d; }
const clSpark = (x, y, r, col, rot) => tube(clSparkD(x, y, r, rot), col || COR, Math.max(2.4, r * .26));

  let d = ''; LEN.forEach((q, i) => { const a = rot + i * Math.PI * 2 / LEN.length - Math.PI / 2;
    d += 'M' + n(Math.cos(a) * 6) + ' ' + n(cy + Math.sin(a) * 6) + ' L' + n(Math.cos(a) * R0 * q) + ' ' + n(cy + Math.sin(a) * R0 * q) + ' '; });

// a wiggly tentacle (Kraken King's look from the Boss Studio), x0,y0 -> x1,y1
function tent(x0, y0, x1, y1, wig, w, ph, col, dots) {
  let d = 'M' + n(x0) + ' ' + n(y0); const N = 10, dx = x1 - x0, dy = y1 - y0, Ln = Math.hypot(dx, dy) || 1, pts = [];
  for (let k = 1; k <= N; k++) { const f = k / N, s = Math.sin(ph + f * 5) * wig * f, x = x0 + dx * f - dy / Ln * s, y = y0 + dy * f + dx / Ln * s; d += ' L' + n(x) + ' ' + n(y); pts.push([x, y]); }
  let o = tube(d, col, w);
  if (dots) for (let k = 1; k < N - 1; k += 2) o += C(pts[k][0], pts[k][1], w * .22, dots, 0);
  return o;
}

  s += mini({ c: CARD.robo }, 560, 248, .44) + mini({ c: CARD.king }, 676, 248, .44);
  s += step(414, 140, 3, 'SPECIAL POWERS', ['Read the bottom of the cards! A special power can', 'change who wins. If BOTH cards say they win: BATTLE!'], '#fce4ec');
  s += T(88, 536, 'Robo beats any Gloop, so Robo wins this one!', 17, OL, 'start');
  s += step(564, 140, 4, 'A TIE? BATTLE!', ['Each player puts 2 cards face down, then flips 1 more.', 'Higher Power wins ALL the cards! Tie again? BATTLE again!'], '#ede7f6');
  s += T(88, 686, 'Out of cards in a battle? Flip your last card.', 17, OL, 'start');
  s += step(714, 160, 5, 'POWER-UPS', ['Play one BEFORE you flip. Use it once, then put it away.', '+2 POWER: your card gets 2 more Power.  SHIELD: if your card', 'loses, take it back.  SWAP: when the cards flip, TRADE them!'], '#e8f5e9');

const PAGES = [
  { id: 'rules', name: '📜 How to Play', build: rulesSheet, how: 'The rules on one page. Print this first!' },
  { id: 's1', name: '🃏 Cards 1-9', build: () => cardSheet(ALL36.slice(0, 9)), how: '9 cards, each 2.5 x 3.5 inches. Cut on the lines.' },
  { id: 's2', name: '🃏 Cards 10-18', build: () => cardSheet(ALL36.slice(9, 18)), how: '9 more cards. Cut on the lines.' },
  { id: 's3', name: '🃏 Cards 19-27', build: () => cardSheet(ALL36.slice(18, 27)), how: '9 more cards: here come the bosses!' },
  { id: 's4', name: '⚡ Cards 28-30 + Power-Ups', build: () => cardSheet(ALL36.slice(27, 36)), how: 'The last 3 bosses and the 6 Power-Up cards.' },
  { id: 'backs', name: '🔶 Card Backs', build: () => cardSheet(Array.from({ length: 9 }, () => ({ back: 1 }))), how: 'Print this page 4 times. Glue one onto the back of each card sheet with a glue stick, THEN cut. Nobody can peek!' }];
// =====================================================================
// 📺 PLAY ON SCREEN vs. MINI ROBO (the same rules as the paper game: playRound() above)
// =====================================================================
const FAST = /[?&]fast=1/.test(location.search), WAIT = ms => FAST ? ms / 12 : ms;
const MAXR = 40;   // ⏰ "time is up" after 40 flips: the most cards wins
const PUN = { plus: '⚡ +2 POWER', shield: '🛡️ SHIELD', swap: '🔄 SWAP' };
let S = null, sel = '', busy = false, roundN = 0, BACK = '';
const nm = i => PEOPLE[CARDS[i].k][0];
function msg(t) { $('msg').innerHTML = t; }
function slotHTML(i) { return '<div class="fc"><div class="face back">' + BACK + '</div><div class="face front">' + cardSVG({ c: CARDS[i] }) + '</div></div>'; }
function piles(cnt) {
  cnt = cnt || [S.piles[0].length, S.piles[1].length];
  [0, 1].forEach(p => { $('pile' + p).innerHTML = (cnt[p] ? BACK : '') + '<b>' + cnt[p] + '</b>'; });
  $('flipBtn').textContent = '🃏 FLIP! (' + Math.min(MAXR, roundN + (busy ? 0 : 1)) + '/' + MAXR + ')';
  $('pus').innerHTML = S.pu[0].length ? S.pu[0].map((u, i) => '<button class="btn pu' + (sel === u ? ' sel' : '') + '" data-u="' + u + '">' + PUN[u] + '</button>').join('') : '<span class="who">No Power-Ups left</span>';
  $('pu1').textContent = S.pu[1].length ? '(' + S.pu[1].length + ' Power-Up' + (S.pu[1].length > 1 ? 's' : '') + ')' : '';
}
function newGame() {
  closePanels(); S = newDeal(); sel = ''; busy = false; roundN = 0;
  $('slot0').innerHTML = ''; $('slot1').innerHTML = ''; $('down0').innerHTML = ''; $('down1').innerHTML = '';
  piles(); $('flipBtn').disabled = false; tune([523, 659, 784], .1);
  msg('🃏 You each have 15 cards and 3 Power-Ups. Want a Power-Up? Tap one, then tap <b>FLIP!</b>');
}
function puClick(e) { const b = e.target.closest('[data-u]'); if (!b || busy) return; sel = sel === b.dataset.u ? '' : b.dataset.u; blip(sel ? 880 : 500, 0, .1); piles(); }

const aiPick = () => S.pu[1].length && Math.random() < .33 ? S.pu[1][Math.floor(Math.random() * S.pu[1].length)] : '';

  const seen = {}; return (res.why || []).filter(k => !seen[k] && (seen[k] = 1)).map(k => '✨ ' + PEOPLE[k][0] + ': ' + CARD[k].ab + '!').join(' ');

function flipClick() {

  const say0 = (use[0] ? 'You play ' + PUN[use[0]] + '! ' : '') + (use[1] ? 'Mini Robo plays ' + PUN[use[1]] + '! ' : '');
  if (say0) msg(say0);

        $('down0').innerHTML = f.down[0].map(() => BACK).join(''); $('down1').innerHTML = f.down[1].map(() => BACK).join(''); }
      $('slot0').innerHTML = slotHTML(f.a); $('slot1').innerHTML = slotHTML(f.b); ['slot0', 'slot1'].forEach(id => $(id).classList.remove('win', 'lose'));

      if (w === 'tie') msg(sw + line + '<b>A TIE!</b> ' + why(r));
      else { $('slot' + (w === 'a' ? 0 : 1)).classList.add('win'); $('slot' + (w === 'a' ? 1 : 0)).classList.add('lose');
        msg(sw + line + (w === 'a' ? '<b>⭐ You win!</b> ' : '<b>🤖 Mini Robo wins!</b> ') + why(r)); if (w === 'a') tune([660, 880], .09); else blip(392, 0, .3, 'triangle'); }

}
function endGame(allCards) {

  $('endTitle').textContent = youWin ? '🏆 YOU WIN! 🏆' : a === b ? '🤝 A TIE!' : '🤖 Mini Robo wins!';

  $('endTxt').textContent = (allCards ? (youWin ? 'You won ALL the cards!' : 'Mini Robo got all the cards! Good try!') : '⏰ Time is up! You have ' + a + ' cards, Mini Robo has ' + b + '.') + ' Play again?';
  openPanel('endPanel'); if (youWin) tada(); else tune([523, 494, 440], .15);

window.onPrinted = () => trophy('battleCards');
