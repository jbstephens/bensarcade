<script>
// 🌊 THE OCEAN MUSEUM — Ben's idea! A blue whale skeleton, glowing jellies, the deep sea, a coral reef and a touch tank, all with REAL facts. Robo is the guide.
const C = document.getElementById('game');
let ctx = C.getContext('2d');
const W = 960, H = 540;

function emoji(e, x, y, size) { ctx.font = `${size}px Arial`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }

const inBox = (t, b) => t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;
const DARK = '#263238', GOLD = '#ffc94d', CREAM = '#fffaf0';
let PRINTING = false;

}
function eyes(cx, cy, s, gap = 12, size = 6, col = DARK) {

function screenFace(x, y, w, h, s, col = '#fff', open = 0) { eyes(x + w / 2, y + h * 0.42, s, 14, 6, col); smile(x + w / 2, y + h * 0.55, s, 9, col, open); }
function rrect(x, y, w, h, r) {
  ctx.beginPath();
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);

function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }

// 🤖 ROBO, the museum guide (draw code copied from robomovie.html so he looks exactly like his games)

  ctx.lineJoin = 'round'; ctx.lineCap = 'round';

    ctx.fillStyle = ROBO.legs; ctx.fillRect(-11, -7 - lA, 8, 7); ctx.fillRect(3, -7 - lB, 8, 7);
    roundRect(-13, -21, 26, 17, 6, ROBO.body);
    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-13, -21, 26, 17, 6); ctx.stroke();

  }

    const tip = Math.sin(t * 0.12) * (pose === 'idle' || pose === 'off' ? 0.6 : 2);
    ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.4; ctx.beginPath(); ctx.moveTo(0, -40); ctx.quadraticCurveTo(tip * 0.4, -45, tip, -49); ctx.stroke();

    ctx.strokeStyle = ROBO.edge; ctx.lineWidth = 0.8; rrect(-17, -40, 34, 22, 12); ctx.stroke();
    roundRect(-13, -36, 26, 13, 9, ROBO.visor);
    ellipse(-7, -34, 4, 1.2, 'rgba(255,255,255,.18)', -0.2);
    if (eyes > 0.01) {
      ctx.save(); ctx.globalAlpha *= clamp(eyes, 0, 1);
      glow(3, -29.5, 16, 'rgba(64,196,255,.45)', eyes);

        ctx.strokeStyle = ROBO.eye; ctx.lineWidth = 1.8;
        for (const ex of [-3, 9]) { ctx.beginPath(); ctx.arc(ex, ey + 2, 3.2, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
      } else {

        ctx.fillStyle = ROBO.eye; ctx.beginPath();
        ctx.ellipse(-3, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.ellipse(9, ey, 3.5, Math.max(0.5, blink * talk), 0, 0, 7); ctx.fill();

      }

    ctx.save(); ctx.translate(13, -16); ctx.rotate(-1.2 + a); roundRect(-2, -14, 4, 14, 2, ROBO.pod); circle(0, -15, 3.4, ROBO.head); ctx.restore();

}
// ---------- sounds (soft! everything goes through one quiet master volume) ----------

  try { audio(); const o = AC.createOscillator(), g = AC.createGain(), n = AC.currentTime + t;
    o.type = type; o.frequency.setValueAtTime(f1, n); o.frequency.exponentialRampToValueAtTime(f2, n + d); g.gain.setValueAtTime(0.0001, n); g.gain.linearRampToValueAtTime(v, n + 0.08); g.gain.exponentialRampToValueAtTime(0.001, n + d);

const sfx = { click: () => beep(660, 0, 0.07, 'triangle', 0.3),
  stamp: () => { beep(180, 0, 0.12, 'sine', 0.4); [784, 988, 1175].forEach((f, i) => beep(f, 0.1 + i * 0.07, 0.15, 'triangle', 0.35)); },
  whoosh: () => glide(260, 420, 0, 0.25, 0.25),
  act: k => { const fn = (typeof ACT_SOUNDS !== 'undefined' && ACT_SOUNDS[k]); if (fn) fn(); else [523, 659, 784].forEach((f, i) => beep(f, i * 0.1, 0.15)); } };
// ---------- 🌊 THE OCEAN MUSEUM ----------
const OR = '#0277bd', OR2 = '#4fc3f7', OR3 = '#01476e';
const PAST = ['#e1f5fe', '#e0f7fa', '#e8eaf6', '#e0f2f1', '#fff8e1', '#f3e5f5', '#e3f2fd', '#fbe9e7', '#ede7f6', '#f1f8e9', '#fce4ec'];
const MUSEUM = { name: 'The Ocean Museum', title: 'THE OCEAN MUSEUM', saveKey: 'oceanMuseum', trophyId: 'oceanMuseum',
  doneMsg: '🏆 You saw EVERY exhibit! Ocean Museum Master!', tagline: 'Tap the sea creatures • collect stamps • print souvenirs!',
  titleBg: ['#e1f5fe', '#4fc3f7'], roof: '#0277bd', roof2: '#01579b', closeBg: '#061a33', closeGlow: 'rgba(128,222,234,.4)', pickBg: '#b3e5fc',
  posterBg: ['#e1f5fe', '#4fc3f7'], titleIds: ['turtle', 'octopus', 'moonjelly', 'angler', 'starfish'] };
const BONE = '#f1e6cf', BONE2 = '#d6c6a3';
function shadow(cx, cy, s, w = 60) { ellipse(cx, cy, w * s, 8 * s, 'rgba(0,0,0,.18)'); }

  ctx.save(); ctx.lineCap = 'round';
