<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🖍️ Giant Mural</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: repeating-linear-gradient(45deg, #e3f4ff 0 36px, #d3ecff 36px 72px);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #app { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #top { display: flex; align-items: center; gap: 12px; padding: 6px 12px 2px; }
  #top h1 { margin: 0; font-size: clamp(26px, 4.2vw, 46px); color: #fff; -webkit-text-stroke: 3px #333;
    text-shadow: 4px 4px 0 #ff5fa2; letter-spacing: 2px; white-space: nowrap; }
  #top p { margin: 0; flex: 1; font-size: clamp(14px, 1.8vw, 20px); font-weight: bold; }
  #main { flex: 1; min-height: 0; display: flex; gap: 10px; padding: 6px 10px 10px; }
  .panel { background: #fff; border: 4px solid #333; border-radius: 18px; padding: 8px; display: flex; flex-direction: column;
    gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; box-shadow: 0 6px 0 #4a90d9; }
  .panel > *, #sheetSide > * { flex-shrink: 0; }
  #left { width: clamp(170px, 19vw, 240px); }
  #right { width: clamp(200px, 23vw, 290px); }
  .lab { font-size: 18px; font-weight: bold; text-align: center; margin: 2px 0 -2px; }
  .mur { background: #fff; border: 4px solid #333; border-radius: 14px; padding: 4px; cursor: pointer; text-align: center;
    font-weight: bold; font-size: 13px; line-height: 1.1; box-shadow: 0 4px 0 #999; }
  #murList { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mur svg { width: 100%; height: auto; display: block; pointer-events: none; border-radius: 8px; }
  .mur.on { border-color: #ff3d6e; background: #fff3a8; box-shadow: 0 4px 0 #ff3d6e; }
  .btn { font: inherit; font-size: 19px; font-weight: bold; border: 4px solid #333; border-radius: 16px; padding: 6px 8px;
    cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 54px; background: #fff; line-height: 1.15; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .hide { display: none !important; }
  .sizes { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .b-print { background: #8ef08e; } .b-color { background: #ffb347; } .b-guide { background: #9bf6ff; }
  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-magic.on { outline: 4px solid #ff3d6e; }
  .b-crew { background: #c3a6ff; } .b-done { background: linear-gradient(90deg, #ffd700, #ff8ad8); font-size: 21px; }
  .b-back { background: #9be3ff; }
  #names { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .nm { font: inherit; font-weight: bold; font-size: 17px; border: 4px solid #333; border-radius: 14px; min-height: 46px; cursor: pointer; color: #222; }
  .nm.on { outline: 4px solid #333; outline-offset: 2px; transform: scale(1.05); }
  #crewBox { display: flex; flex-direction: column; gap: 8px; background: #f3ecff; border: 3px dashed #7c4dff; border-radius: 14px; padding: 6px; }
  #crewHelp { font-size: 15px; font-weight: bold; text-align: center; }
  /* ---------- the big preview ---------- */
  #center { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  #pvWrap { flex: 1; min-height: 0; position: relative; background: #fff; border: 5px solid #333; border-radius: 18px; box-shadow: 0 6px 0 #4a90d9; overflow: hidden; }
  #pv { position: absolute; inset: 0; overflow: auto; -webkit-overflow-scrolling: touch; }
  #pvIn { position: relative; margin: 0 auto; }
  #pvIn > svg { display: block; width: 100%; height: 100%; }
  .cell { cursor: pointer; }
  #zoom { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; z-index: 3; }
  #zoom .btn { min-height: 48px; width: 54px; font-size: 24px; padding: 0; }
  #pvHint { text-align: center; font-size: clamp(15px, 1.9vw, 20px); font-weight: bold; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 4px 8px; }
  /* ---------- one page ---------- */
  .over { position: fixed; inset: 0; background: rgba(30, 30, 70, .75); display: none; z-index: 40; align-items: center; justify-content: center; padding: 12px; }
  .over.on { display: flex; }
  #sheetCard { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 10px; display: flex; gap: 12px; height: 100%; max-width: 100%; }
  #sheetPic { height: 100%; aspect-ratio: 790 / 1040; min-width: 0; }
  #sheetPic svg { width: 100%; height: 100%; display: block; border: 3px solid #333; border-radius: 6px; background: #fff; }
  #sheetSide { width: 250px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  #sheetTitle { font-size: 24px; font-weight: bold; text-align: center; }
  #sheetMap { width: 120px; margin: 0 auto; display: block; }
  /* ---------- 🎉 celebration ---------- */
  #partyCard { background: #fff; border: 6px solid #333; border-radius: 24px; padding: 16px 20px; text-align: center; max-width: 640px; z-index: 2; }
  #partyCard h2 { margin: 0 0 6px; font-size: clamp(30px, 5vw, 52px); color: #ff3d6e; -webkit-text-stroke: 1.5px #333; }
  #partyCard p { font-size: 22px; font-weight: bold; margin: 6px 0 12px; }
  #partyCard .row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .conf { position: fixed; top: -30px; width: 14px; height: 20px; border-radius: 3px; z-index: 50; pointer-events: none; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff; border: 5px solid #333; border-radius: 20px;
    padding: 12px 22px; font-size: 24px; font-weight: bold; z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  #printArea { display: none; }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 16px; } #top p { display: none; } .lab { font-size: 15px; } }
  @media (orientation: portrait) {
    body { overflow: auto; }
    #main { flex-direction: column; overflow-y: auto; }
    #left, #right { width: 100%; max-height: none; overflow: visible; }
    #murList { grid-template-columns: repeat(4, 1fr); }
    .sizes { grid-template-columns: 1fr 1fr 1fr; }
    #center { min-height: 60vh; }
    #sheetCard { flex-direction: column; height: auto; max-height: 100%; } #sheetPic { height: 55vh; margin: 0 auto; } #sheetSide { width: 100%; }
  }
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block !important; }
    #printArea .pg { break-after: page; page-break-after: always; }
    #printArea .pg:last-child { break-after: auto; page-break-after: auto; }
    #printArea .pg svg { display: block; width: 100%; height: 10.1in; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="top">
    <button class="btn b-back" id="bLeave">⬅️ Back</button>
    <h1>🖍️ GIANT MURAL</h1>
    <p id="topHelp">A HUGE poster! Print the pages, tape them together, and color it with your family!</p>
  </div>
  <div id="main">
    <div id="left" class="panel">
      <div class="lab">🖼️ Pick a mural</div>
      <div id="murList"></div>
      <div class="lab">📏 How big?</div>
      <div class="sizes" id="sizeBtns"></div>
    </div>
    <div id="center">
      <div id="pvWrap">
        <div id="pv"><div id="pvIn"></div></div>
        <div id="zoom">
          <button class="btn" id="bZoomOut" aria-label="Zoom out">➖</button>
          <button class="btn" id="bZoomIn" aria-label="Zoom in">➕</button>
        </div>
      </div>
      <div id="pvHint"></div>
    </div>
    <div id="right" class="panel">
      <button class="btn b-magic" id="bMagic">✨ Magic color</button>
      <button class="btn b-print" id="bPrintAll">🖨️ Print all pages</button>
      <button class="btn b-color" id="bPrintColor">🌈 Print the color version</button>
      <button class="btn b-guide" id="bGuide">🗺️ Print the tape-it guide</button>
      <button class="btn b-crew" id="bCrew">👨‍👩‍👦 Color Crew</button>
      <div id="crewBox" class="hide">
        <div id="crewHelp">Tap a name, then tap the pages they will color!</div>
        <div id="names"></div>
        <button class="btn" id="bDeal">🎲 Share the pages out</button>
        <button class="btn" id="bCrewClear">🧽 Clear names</button>
      </div>
      <button class="btn b-done" id="bDone">🎉 We finished the mural!</button>
    </div>
  </div>
</div>
<div id="sheet" class="over"><div id="sheetCard">
  <div id="sheetPic"></div>
  <div id="sheetSide">
    <div id="sheetTitle"></div>
    <div id="sheetMap"></div>
    <div id="sheetWho" style="text-align:center;font-weight:bold;font-size:18px"></div>
    <button class="btn b-print" id="bPrintOne">🖨️ Print this page</button>
    <button class="btn b-color" id="bPrintOneColor">🌈 Print it in color</button>
    <button class="btn b-magic" id="bSheetMagic">✨ Magic color</button>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <button class="btn" id="bPrev">◀️ Page</button>
      <button class="btn" id="bNext">Page ▶️</button>
    </div>
    <button class="btn b-back" id="bSheetBack">⬅️ Back to the mural</button>
  </div>
</div></div>
<div id="party" class="over"><div id="partyCard">
  <h2>🎉 YOU DID IT! 🎉</h2>
  <p id="partyText"></p>
  <div class="row">
    <button class="btn b-print" id="bCert">🏅 Print the Mural Masters certificate</button>
    <button class="btn b-back" id="bPartyClose">😄 Yay!</button>
  </div>
</div></div>
<div id="printArea"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 🖍️ GIANT MURAL: a huge Game Factory coloring poster that prints across 4, 9 or 16 letter pages.
// The mural is drawn once in a 2100 x 2700 design space (3 x 3 pages) and scaled to the chosen size.
// Every page is viewBox 0 0 790 1040 (100 units = 1 printed inch on a letter page with 0.3in margins).
// LINE = true draws black coloring-book lines; LINE = false is the ✨ Magic color version.
// Drawing helpers + characters are copied from the Craft Room (which copied the Art Gallery).
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)
const BT = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? '#fff' : (col || '#fff')) + '" stroke="' + INK + '" stroke-width="' + n(size * .14) + '" stroke-linejoin="round" paint-order="stroke fill" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// ---- cutting marks (the same in both versions) ----
const CUT = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>';
const FOLD = d => '<path d="' + d + '" fill="none" stroke="' + INK + '" stroke-width="2.6" stroke-dasharray="10 7" stroke-linecap="round"/>';
const HOLE = (x, y, rx, ry) => '<ellipse data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(rx) + '" ry="' + n(ry) + '" fill="#fff" stroke="' + INK + '" stroke-width="3.5" stroke-dasharray="11 7"/>';
const PUNCH = (x, y, r) => '<circle data-keep="1" cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(r || 11) + '" fill="#fff" stroke="' + INK + '" stroke-width="3" stroke-dasharray="6 5"/>' +
  '<path d="M' + n(x - 5) + ' ' + n(y) + ' L' + n(x + 5) + ' ' + n(y) + ' M' + n(x) + ' ' + n(y - 5) + ' L' + n(x) + ' ' + n(y + 5) + '" stroke="' + INK + '" stroke-width="2"/>';
// a scissors mark on a cut line
const SCIS = (x, y, rot, s) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + (s || 26) + '" text-anchor="middle" dominant-baseline="central"' + (rot ? ' transform="rotate(' + rot + ' ' + n(x) + ' ' + n(y) + ')"' : '') + '>✂️</text>';
function svgWrap(body, ex) {
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" ' + (ex || '') + '><defs>' + DEFS.join('') + '</defs>' +
    '<rect x="0" y="0" width="800" height="1000" fill="#fff"/>' + body + '</svg>';
}
// =====================================================================
// CHARACTERS (copied from the Art Gallery; each drawn around 0,0, about 120 tall)
// =====================================================================
function robo(o) {
  o = o || {}; const H = o.head || '#f4f7fb', B = o.body || H, V = o.visor || '#1d2836', EY = o.eye || '#40c4ff',
    PD = o.pod || '#2979ff', RIM = o.rim || '#bff3ff', LG = o.legs || B; let s = '';
  if (o.morph === 'rocket') s += R(-30, 2, 22, 40, 9, vshade('#ff3d00'), OL, 2.5) + R(-28, 16, 18, 6, 2, '#ffd740', 0) + P('M-30 40 L-36 52 L-8 52 L-14 40 Z', '#bf360c', OL, 2) + jetFlame(-22, 52, 1.1, '#ffab40');

function crewNames(N) { const seen = []; Object.keys(crewOf(N)).forEach(k => { const v = crewOf(N)[k]; if (v && seen.indexOf(v) < 0) seen.push(v); }); return NAMES.map(x => x[0]).filter(x => seen.indexOf(x) >= 0); }
// everything a print job needs: one hidden copy of the drawing, then every page points at it
function printPack(mi, N, line, which) {

// =====================================================================
// 💾 SAVING + 🏆 TROPHY
// =====================================================================
function loadState() {

      if ([2, 3, 4].indexOf(s.size) >= 0) S.size = s.size;
      S.magic = !!s.magic; S.crew = (s.crew && typeof s.crew === 'object') ? s.crew : {};

    } } catch (_) {}
}
function saveState() { try { localStorage.setItem('giantMural', JSON.stringify(S)); } catch (_) {} }
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }

function notePrint() {

  if (!hasTrophy()) { trophy('giantMural'); fanfare(); toast('🏆 Trophy: MURAL MAKER! You printed a Giant Mural!'); return true; }
  return false;

// ---------- sounds ----------
let actx = null;
function blip(f, when, len, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime + (when || 0);

function tune(notes) { notes.forEach((f, i) => blip(f, i * 0.11, 0.2)); }
function fanfare() {
  const N = [[392, 0, .18], [392, .2, .1], [392, .32, .1], [523, .45, .5], [392, 1, .18], [523, 1.2, .14], [659, 1.36, .14], [784, 1.52, .7]];
  N.forEach(x => { blip(x[0], x[1], x[2] + .1, 'square', .07); blip(x[0] / 2, x[1], x[2] + .1, 'triangle', .1); });
  [1047, 1319, 1568].forEach((f, i) => blip(f, 2.3 + i * .08, .5, 'triangle', .08));

// =====================================================================
// 🖥️ SCREEN

const $ = id => document.getElementById(id);
const HAS_DOM = typeof document !== 'undefined';

}
let crewMode = false, pickName = 'Ben', selCell = 0, zoom = 1, sheetCell = null;
const ZOOMS = [1, 1.5, 2, 3, 4];
const THUMBS = {};
function thumbSVG(mi) {

}
function renderLeft() {

}

      '<text x="' + n(x + 14 + lw / 2) + '" y="' + n(y + 88) + '" font-size="68" text-anchor="middle" fill="#333"' + FONT + '>R' + (r + 1) + ' C' + (c + 1) + '</text>' +
      (who ? '<rect x="' + n(x + 26) + '" y="' + n(y + 106) + '" width="' + (lw - 24) + '" height="58" rx="22" fill="' + nameCol(who) + '" stroke="#333" stroke-width="4"/><text x="' + n(x + 14 + lw / 2) + '" y="' + n(y + 150) + '" font-size="46" text-anchor="middle" fill="#333"' + FONT + '>' + esc(who) + '</text>' : '') + '</g>';

function sizePreview() {

function setZoom(dz) {
  const i = Math.max(0, Math.min(ZOOMS.length - 1, ZOOMS.indexOf(zoom) + dz)), box = $('pv');

function setMural(i) { S.mural = i; saveState(); renderLeft(); renderArt(); tune([523, 659]); }
function setSize(N) { S.size = N; selCell = Math.min(selCell, N * N - 1); saveState(); renderLeft(); renderOverlay(); tune([440, 554, 659].slice(0, N - 1)); toast('📏 ' + N + ' x ' + N + ' = ' + (N * N) + ' pages! About ' + N * 7 + ' x ' + N * 9 + ' inches!'); }
function setMagic(on) { S.magic = on; saveState(); $('bMagic').classList.toggle('on', on); $('bMagic').textContent = on ? '🖍️ Back to coloring lines' : '✨ Magic color'; renderArt(); if (on) { tune([660, 880, 1100]); toast('✨ Ta-da! That is how it could look!'); } }
// ---------- 👨‍👩‍👦 Color Crew ----------
function renderNames() {
  $('names').innerHTML = NAMES.map(x => '<button class="nm' + (x[0] === pickName ? ' on' : '') + '" data-n="' + x[0] + '" style="background:' + x[1] + '">' + x[0] + '</button>').join('');
}
function setCrew(on) {

function assignCell(i) {

}
function dealPages() {
  const N = S.size; let who = crewNames(N); if (who.indexOf(pickName) < 0) who.push(pickName);
  if (who.length < 2) who = ['Ben', 'Mom', 'Dad'].concat(who.filter(w => ['Ben', 'Mom', 'Dad'].indexOf(w) < 0));
  const crew = {}; let k = 0;
  for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) { const cc = r % 2 ? N - 1 - c : c; crew[cellKey(r, cc)] = who[k++ % who.length]; }

function clearCrew() { S.crew[S.size] = {}; saveState(); renderOverlay(); blip(300, 0, .2); }
// ---------- 📄 one page up close ----------
function openSheet(i) {
  const N = S.size; selCell = i; sheetCell = i; const r = Math.floor(i / N), c = i % N, a = artBundle(S.mural, !S.magic);
  $('sheetPic').innerHTML = pageSVG(N, r, c, a, { uid: a.gp + 'v', mi: S.mural, line: !S.magic });
  $('sheetTitle').textContent = '📄 Row ' + (r + 1) + ', Column ' + (c + 1);
  $('sheetMap').innerHTML = SVG_OPEN('0 0 ' + (N * 24 + 4) + ' ' + n(N * 24 * 9 / 7 + 4)) + miniMap(N, r, c, 2, 2, 24) + '</svg>';
  const who = crewOf(N)[cellKey(r, c)];
  $('sheetWho').textContent = who ? '⭐ ' + who + ' colors this one!' : 'Page ' + (i + 1) + ' of ' + (N * N);
  $('bSheetMagic').textContent = S.magic ? '🖍️ Coloring lines' : '✨ Magic color';
  $('sheet').classList.add('on'); renderOverlay(); blip(660);
}
function closeSheet() { sheetCell = null; $('sheet').classList.remove('on'); renderOverlay(); }
const sheetOpen = () => HAS_DOM && $('sheet') && $('sheet').classList.contains('on');
const partyOpen = () => HAS_DOM && $('party') && $('party').classList.contains('on');
// =====================================================================
// 🖨️ PRINTING (Chrome + iPad Safari): only #printArea prints, one .pg per page
// =====================================================================
function doPrint(html, msg) {
  $('printArea').innerHTML = html; notePrint(); if (msg) toast(msg);
  setTimeout(() => { try { if (typeof window.print === 'function') window.print(); } catch (_) {} }, 80);
}
function printAll(color) {
  const N = S.size, p = printPack(S.mural, N, !color, 'all');
  doPrint(p.html, '🖨️ Printing ' + p.count + ' pages: the guide + ' + N * N + ' mural pages!');
}
function printGuide() { doPrint(printPack(S.mural, S.size, !S.magic, 'guide').html, '🗺️ Printing the tape-it-together guide!'); }
function printOne(color) {
  if (sheetCell === null) return; const N = S.size;
  doPrint(printPack(S.mural, N, !color, [Math.floor(sheetCell / N), sheetCell % N]).html, '🖨️ Printing Row ' + (Math.floor(sheetCell / N) + 1) + ', Column ' + (sheetCell % N + 1) + '!');
}
function printCert() { doPrint('<div class="pg">' + certSVG(S.mural, S.size) + '</div>', '🏅 Printing your Mural Masters certificate!'); }
function clearPrint() { if (HAS_DOM && $('printArea')) $('printArea').innerHTML = ''; }
// ---------- 🎉 we finished! ----------
function confetti() {
  const cols = ['#ff3d6e', '#ffd740', '#42a5f5', '#66bb6a', '#ab47bc', '#ff8a65', '#00e5ff'];
  for (let i = 0; i < 120; i++) {
    const d = document.createElement('div'); d.className = 'conf';
    d.style.left = (Math.random() * 100) + 'vw'; d.style.background = cols[i % cols.length];
    d.style.animationDuration = (2 + Math.random() * 2.5) + 's'; d.style.animationDelay = (Math.random() * .8) + 's';
    document.body.appendChild(d); setTimeout(() => d.remove(), 5600);
  }
}
function finished() {
  const N = S.size, who = crewNames(N), m = MURALS[S.mural];
  S.finished[m.id + N] = 1; saveState();
  $('partyText').textContent = (who.length ? who.join(', ').replace(/, ([^,]*)$/, ' and $1') : 'Ben') + ' finished ' + m.short + ' (' + N * N + ' pages)! You are MURAL MASTERS! 🖍️';

}
function closeParty() { $('party').classList.remove('on'); blip(660); }
// ---------- leaving ----------
function leave() {
  try { if (window.parent && window.parent !== window && typeof window.parent.closeGame === 'function') { window.parent.closeGame(); return; } } catch (_) {}

}
// =====================================================================
// ⌨️ KEYS: arrows pick a page, Enter opens it, Escape goes back, P prints, M = magic color
// =====================================================================
function onKey(e) {

function init() {
