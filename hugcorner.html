// 🤗 ROBO'S HUG CORNER: the gentlest, coziest room in the Game Factory. A warm golden-hour room with a beanbag,
// fairy lights, a fluffy blanket and soft snow outside. Robo, Dusty and Sammy the kitty are here.
// Big Hug, Breathe with Robo, Worry Clouds, Everything Is Safe, Purring Kitty, Kind Notes, Cuddle Blanket.

const GAME_COUNT = 368;   // how many games are in Ben's Game Factory book (the GAMES list in arcade.html)
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

// ---------- 🤖 Robo + 🧹 Dusty (copied exactly from Robo: The Beginning) ----------

// 🧹 DUSTY: a tiny cleaning bot. Teal dome, an orange stripe, one big green eye on a little screen,

  ctx.restore();

// ---------- 🐱 Sammy (copied from Cozy Cats Corner: brown tabby, brown eyes), curled up in a cozy donut ----------
const CATS = {

function catLine(c) { ctx.strokeStyle = c.line; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; }

function drawSammy(x, y, s = 2, t = frame) { ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ellipse(0, 0, 28, 5, 'rgba(0,0,0,.15)'); drawSleepCat(CATS.sammy, t); ctx.restore(); }
// ---------- VERY soft sounds (one quiet volume knob, 0.18) ----------
let actx = null, master = null, soundOn = true, musicOn = true;
function audio() {

}
function softNote(f, d = 0.6, v = 0.05, when = 0) {      // a gentle, round "bell" note
  if (!soundOn) return; const a = audio(); if (!a || a.state !== 'running') return;
  const t = a.currentTime + when, o = a.createOscillator(), g = a.createGain();

const PENT = [523, 587, 659, 784, 880, 1047];
function plip() { softNote(PENT[Math.floor(Math.random() * PENT.length)], 0.6, 0.04); }
function chime() { softNote(784, 1.4, 0.035); softNote(1175, 1.6, 0.018, 0.05); }

}
// 🎶 soft music-box lullaby (tiny sine notes, a little echo note under each one)
const LULLABY = [659, 784, 880, 784, 659, 587, 523, 0, 587, 659, 784, 659, 587, 523, 440, 0, 523, 659, 784, 1047, 880, 784, 659, 0, 587, 659, 587, 523, 494, 523, 0, 0];
let mt = 0;

// 🐱 a soft, low, rumbly purr: low filtered noise that gently pulses ~24 times a second

// ---------- save + trophy ----------

// ---------- the cozy golden-hour room ----------
const SNOW = Array.from({ length: 40 }, (_, i) => ({ x: (i * 53) % 260, y: (i * 37) % 200, r: 1.2 + (i % 3) * 0.7, sp: 0.18 + (i % 4) * 0.06, p: i }));
const BULBS = ['#ffd27a', '#ff9eb5', '#a8e6ff', '#c9b6ff', '#b6f0b0'];
function windowView(x, y, w, h) {

    ellipse(cx, cy, 34, 11, 'rgba(255,255,255,.75)'); ellipse(cx + 16, cy - 7, 18, 10, 'rgba(255,255,255,.75)'); }
  ellipse(x + w / 2, y + h + 6, w * 0.8, 26, '#fffaf2');                     // snowy hill
  for (const s of SNOW) { const sy = (s.y + frame * s.sp) % (h + 10) + y - 5, sx = x + s.x * w / 260 + Math.sin(frame * 0.02 + s.p) * 6; circle(sx, sy, s.r, 'rgba(255,255,255,.95)'); }

  if (!bk.done && sleepy) { bk.done = true; say("Ahh, so snuggly. Thank you, Ben. Everyone feels warm and cozy now.", true); softNote(392, 2, 0.03); softNote(494, 2, 0.025, 0.3); softNote(587, 2.4, 0.025, 0.6); }
  if (sleepy) { ctx.fillStyle = 'rgba(90,70,140,.12)'; ctx.fillRect(0, 0, W, H); }
  roundRect(150, 410, 470, 80, 36, '#f0c0d0');                                   // a big cushion to snuggle on
  drawRobo(240, 470, { s: 2.8, pose: 'sit', happy: sleepy });
  drawDusty(370, 460, { s: 2.6, sleep: sleepy, happy: !sleepy && cover > 0.3 });
  drawSammy(505, 450, 2.4);
  // the blanket: a big soft quilt that slides in from the right
  const bw = 520;
  fluffyBlanket(bk.x, 442, bw, 80, '#b8a3f0', '#d9ccff');
  for (let i = 0; i < 6; i++) heart(bk.x + 40 + i * 85, 484, 10, 'rgba(255,255,255,.7)');
  if (!sleepy) { text('⬅️ drag', bk.x + 70, 410 + Math.sin(frame * 0.08) * 4, 26, '#fffbe6'); }
  if (sleepy && frame % 40 === 0) { const xs = [240, 370, 500]; const x = xs[Math.floor(frame / 40) % 3]; fx.push({ k: 'z', x: x + 20, y: 360, vx: 0.2, vy: -0.5, life: 180, s: 12 + Math.random() * 6 }); }
  text('🧸 Cuddle Blanket', 480, 100, 36, '#fff4e0');
  if (talkT < 400) bubble(250, 140, 480, talk);
  backBtn();

}
function blanketDown(x, y) { if (!bk.done && x > bk.x - 20 && y > 380 && y < 530) { bk.grab = x - bk.x; } }
function blanketMove(x) { if (bk.grab !== null && !bk.done) bk.x = clamp(x - bk.grab, BK_END - 10, BK_START); }
// ---------- loop + taps ----------
function goHome() { purr(false); screen = 'home'; fx = []; say("We're right here whenever you want a cozy time.", false); }
const SCREENS = { hug: hugScreen, breathe, clouds: cloudsScreen, safe: safeScreen, kitty: kittyScreen, notes: notesScreen, blanket: blanketScreen };
function loop() {
  frame++; talkT++; btns = []; room(); music();
  if (screen === 'home') home(); else SCREENS[screen]();
  drawFx();
  button(W - 214, 14, 96, 50, musicOn ? '🎵 On' : '🎵 Off', musicOn ? '#9ccfa6' : '#c0a8a0', () => { musicOn = !musicOn; }, 19);
  button(W - 110, 14, 96, 50, soundOn ? '🔉 On' : '🔇 Off', soundOn ? '#9cb8d8' : '#c0a8a0', () => { soundOn = !soundOn; if (!soundOn) { purr(false); try { speechSynthesis.cancel(); } catch (_) {} } }, 19);
  if (toastT > 0) { toastT--; ctx.save(); ctx.globalAlpha = clamp(toastT / 40, 0, 1); roundRect(280, 12, 400, 52, 24, '#fff3c4'); ctx.font = 'bold 22px "Trebuchet MS", Arial'; ctx.fillStyle = '#8a5a2b'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(toast, 480, 39); ctx.restore(); }
  requestAnimationFrame(loop);
}
function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
function tap(e) {
  const [x, y] = pos(e);
  audio();
  if (!saidHello && screen === 'home') { saidHello = true; voice("Hi Ben! It's Robo, and Dusty and Sammy are here too. We're right here with you."); }
  for (const b of btns) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { b.fn(); return; }
  if (screen === 'clouds') cloudsTap(x, y);
  else if (screen === 'kitty') kittyTap(x, y);
  else if (screen === 'notes') notesTap(x, y);

let fingerDown = false;
C.addEventListener('pointerdown', e => { fingerDown = true; tap(e); });
C.addEventListener('pointermove', e => {

  if (screen === 'blanket') blanketMove(x);

});
addEventListener('pointerup', () => { fingerDown = false; if (bk) bk.grab = null; }); addEventListener('pointercancel', () => { fingerDown = false; if (bk) bk.grab = null; });
addEventListener('keydown', e => { if (e.key === 'Escape') goHome(); });
loop();
