<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>📓 Game Designer Notebook</title>
<script src="touchpad.js?v=4"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background-color: #fdf6e3;
    background-image: linear-gradient(#c9dcf5 1.5px, transparent 1.5px), linear-gradient(90deg, #c9dcf5 1.5px, transparent 1.5px);
    background-size: 32px 32px;
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { display: flex; align-items: center; gap: 10px; padding: 8px 12px 4px; flex-wrap: wrap; justify-content: center; }
  #gHead h1 { margin: 0; font-size: clamp(26px, 4.4vw, 50px); color: #fff; flex: 1; text-align: center; min-width: 300px;
    -webkit-text-stroke: 3px #333; text-shadow: 4px 4px 0 #3d7cf2; letter-spacing: 1px; }
  #gSub { text-align: center; margin: 0 0 4px; font-size: clamp(15px, 2vw, 21px); font-weight: bold; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 16px; align-content: start; }
  .thumb { background: #fff; border: 5px solid #333; border-radius: 18px; padding: 6px; cursor: pointer; position: relative;
    box-shadow: 0 6px 0 #3d7cf2; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 2px; }
  .thumb i { position: absolute; top: -10px; right: -10px; background: #ff5fa2; color: #fff; font-style: normal; font-weight: bold;
    border: 3px solid #333; border-radius: 50%; width: 36px; height: 36px; line-height: 30px; text-align: center; font-size: 18px; }
  .thumb.sel { border-color: #ff5fa2; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #ff5fa2; }
  .thumb:active { transform: scale(.96); }
  /* ---------- page screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #333; border-radius: 10px; box-shadow: 0 8px 0 #3d7cf2; }
  #side { width: min(42vw, 420px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 6px 8px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #333; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #333; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #333; }
  .btn.hide, .hide { display: none !important; }
  .b-mode { background: #fff; font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  .b-back { background: #9be3ff; } .b-clear { background: #ffc2d6; }
  .b-print { background: #8ef08e; font-size: 22px; }
  .b-book { background: #c3a6ff; }
  .b-spark { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .b-home { background: #ffd180; }
  #gHead .btn { font-size: 18px; min-height: 52px; padding: 5px 12px; }
  .count { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 6px 8px; font-size: 19px; font-weight: bold; }
  .count .btn { min-height: 50px; min-width: 56px; font-size: 28px; padding: 0 8px; background: #ffe066; }
  .count span.num { font-size: 30px; min-width: 40px; text-align: center; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fff;
    border: 5px solid #333; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- 📓 notebook builder ---------- */
  #builder { flex-direction: row; gap: 10px; padding: 10px; }
  #bList { flex: 1; min-width: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 10px; align-content: start; padding: 4px 4px 30px; }
  .row { display: flex; align-items: center; gap: 8px; background: #fff; border: 4px solid #333; border-radius: 16px; padding: 6px; box-shadow: 0 4px 0 #3d7cf2; }
  .row.sel { border-color: #ff5fa2; box-shadow: 0 4px 0 #ff5fa2; }
  .row.on { background: #fff6c8; }
  .row svg { width: 54px; height: auto; flex: none; border: 2px solid #333; border-radius: 4px; pointer-events: none; }
  .row b { flex: 1; font-size: 17px; line-height: 1.1; }
  .row .btn { min-height: 48px; min-width: 48px; font-size: 26px; padding: 0 6px; background: #ffe066; }
  .row .num { font-size: 26px; font-weight: bold; min-width: 30px; text-align: center; }
  #bSide { width: min(36vw, 360px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; }
  #bInfo { font-size: 20px; text-align: center; background: #fffbe0; border: 4px solid #333; border-radius: 14px; padding: 8px; font-weight: bold; }
  #bTitle { font-size: 26px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #333; border-radius: 14px; padding: 6px; }
  /* ---------- 🎰 idea spark slot machine ---------- */
  #spark { position: fixed; inset: 0; background: rgba(30, 20, 70, .8); display: none; z-index: 40; align-items: center; justify-content: center; padding: 10px; }
  #spark.on { display: flex; }
  #machine { background: linear-gradient(#ff5252, #c62828); border: 7px solid #333; border-radius: 34px; padding: 12px 18px 16px; width: 100%; max-width: 1100px;
    max-height: 100%; overflow-y: auto; box-shadow: 0 10px 0 #7f0000, inset 0 0 0 6px #ffd740; display: flex; flex-direction: column; gap: 10px; }
  #machine h2 { margin: 0; text-align: center; font-size: clamp(26px, 4vw, 46px); color: #ffd740; -webkit-text-stroke: 2px #333; text-shadow: 3px 3px 0 #333; }
  #lights { display: flex; justify-content: space-around; }
  #lights span { width: 18px; height: 18px; border-radius: 50%; background: #fff59d; border: 3px solid #333; }
  #lights span.off { background: #8d6e00; }
  #reels { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .reel { background: #fff; border: 6px solid #333; border-radius: 18px; height: clamp(110px, 24vh, 190px); overflow: hidden; position: relative;
    box-shadow: inset 0 18px 18px -12px rgba(0,0,0,.45), inset 0 -18px 18px -12px rgba(0,0,0,.45); }
  .reel .lab { position: absolute; top: 4px; left: 0; right: 0; text-align: center; font-size: 15px; font-weight: bold; color: #888; z-index: 2; }
  .reel .strip { position: absolute; left: 0; right: 0; top: 0; }
  .reel .w { height: clamp(110px, 24vh, 190px); display: flex; align-items: center; justify-content: center; text-align: center; padding: 14px 6px 4px;
    font-size: clamp(20px, 3.1vw, 36px); font-weight: bold; line-height: 1.1; }
  #ideaLine { background: #fffbe0; border: 5px solid #333; border-radius: 18px; padding: 8px 12px; text-align: center; font-size: clamp(20px, 2.8vw, 32px); font-weight: bold; min-height: 64px; }
  #sparkBtns { display: grid; grid-template-columns: 2fr 1fr 1fr 1fr; gap: 10px; }
  #bPull { background: #ffd740; font-size: 30px; }
  #printAll { display: none; }
  @media (orientation: portrait) {
    #view, #builder { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side, #bSide { width: 100%; max-height: 42vh; }
    #sparkBtns { grid-template-columns: 1fr 1fr; }
  }
  @media (max-height: 560px) { .btn { min-height: 46px; font-size: 17px; padding: 5px; } #pHelp { font-size: 15px; } }
  /* ---------- PRINT: only the page (or the whole notebook) ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #spark { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="gallery" class="screen on">
  <div id="gHead">
    <button class="btn b-home" id="gHome">🏠 Back</button>
    <h1>📓 GAME DESIGNER NOTEBOOK</h1>
    <button class="btn b-spark" id="gSpark">🎰 Idea Spark!</button>
    <button class="btn b-book" id="gBook">📓 Build my notebook</button>
  </div>
  <p id="gSub">Plan your next game with a pencil and markers! Tap a page to see it big.</p>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div class="two">
      <button class="btn b-mode" id="bColor">🎨 Color<br>pages</button>
      <button class="btn b-mode" id="bLine">✏️ Black lines<br>(saves ink!)</button>
    </div>
    <div id="pHelp"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print this page</button>
    <div class="count"><button class="btn" id="bMinus">➖</button><span>📓 In my notebook: <span class="num" id="bNum">0</span></span><button class="btn" id="bPlus">➕</button></div>
    <button class="btn b-spark" id="bSpark">🎰 Spin a game idea!</button>
    <button class="btn b-book" id="bBook">📓 Build my notebook</button>
    <button class="btn b-back" id="bBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="builder" class="screen">
  <div id="bList"></div>
  <div id="bSide">
    <div id="bTitle">📓 My Notebook</div>
    <div id="bInfo"></div>
    <div class="two">
      <button class="btn b-mode" id="nColor">🎨 Color<br>pages</button>
      <button class="btn b-mode" id="nLine">✏️ Black lines<br>(saves ink!)</button>
    </div>
    <button class="btn b-print" id="nPrint">🖨️ Print my notebook!</button>
    <div class="two">
      <button class="btn b-spark" id="nStarter">⭐ Starter pack</button>
      <button class="btn b-clear" id="nClear">🧽 Clear all</button>
    </div>
    <button class="btn b-back" id="nBack">⬅️ Back to pages</button>
  </div>
</div>
<div id="spark"><div id="machine">
  <h2>🎰 IDEA SPARK MACHINE 🎰</h2>
  <div id="lights"></div>
  <div id="reels">
    <div class="reel"><div class="lab">A GAME WHERE...</div><div class="strip" id="r0"></div></div>
    <div class="reel"><div class="lab">MUST...</div><div class="strip" id="r1"></div></div>
    <div class="reel"><div class="lab">...</div><div class="strip" id="r2"></div></div>
  </div>
  <div id="ideaLine">Pull the lever to spark a game idea!</div>
  <div id="sparkBtns">
    <button class="btn" id="bPull">🎰 PULL!</button>
    <button class="btn b-mode" id="bSay">🔊 Say it</button>
    <button class="btn b-print" id="bUse">📝 Put it on my pitch page</button>
    <button class="btn b-back" id="bSparkClose">⬅️ Done</button>
  </div>
</div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>
'use strict';
// =====================================================================
// 📓 GAME DESIGNER NOTEBOOK: printable sketchbook pages for planning new games.
// Every page is a portrait letter page, viewBox 0 0 800 1000 (about 101 units per printed inch).
// LINE = false is the color version, LINE = true is black lines (saves ink).
// The left edge (x < 70) is kept empty for staples or a 3-hole punch.
// Character art + paint() helpers copied from the Craft Room / Art Gallery.
// =====================================================================
const OL = '#1b1b2f', INK = '#222';
const n = v => (Math.round(v * 10) / 10);
let DEFS = [], GC = {}, GP = 'c0_', artSeq = 0, LINE = false, WS = 1, ALPHA = {};
function beginArt(line) { DEFS = []; GC = {}; ALPHA = {}; GP = 'c' + (++artSeq) + '_'; LINE = !!line; WS = 1; }
// ---- colors ----
function hexRGB(c) { c = c.replace('#', ''); if (c.length === 3) c = c.split('').map(x => x + x).join(''); return [0, 2, 4].map(i => parseInt(c.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hexRGB(a), B = hexRGB(b); return '#' + A.map((v, i) => Math.round(v + (B[i] - v) * t).toString(16).padStart(2, '0')).join(''); }
const lite = (c, t) => mix(c, '#ffffff', t === undefined ? .4 : t), dark = (c, t) => mix(c, '#000000', t === undefined ? .35 : t);
const lum = c => { if (!/^#[0-9a-f]{3,6}$/i.test(c)) return 1; const [r, g, b] = hexRGB(c); return (0.299 * r + 0.587 * g + 0.114 * b) / 255; };
// ---- gradients (registered per sheet, cached by key) ----
function stopsXML(st) {
  return st.map((s, i) => { if (typeof s === 'string') s = [i / Math.max(1, st.length - 1), s];
    return '<stop offset="' + n(s[0]) + '" stop-color="' + s[1] + '"' + (s[2] !== undefined ? ' stop-opacity="' + s[2] + '"' : '') + '/>'; }).join('');
}
const seeThrough = st => st.some(s => typeof s !== 'string' && s[2] !== undefined && s[2] < 1);
function lin(st, x1, y1, x2, y2, user) {
  x1 = x1 || 0; y1 = y1 || 0; x2 = x2 === undefined ? 0 : x2; y2 = y2 === undefined ? 1 : y2;
  const key = 'L' + JSON.stringify(st) + x1 + y1 + x2 + y2 + !!user;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<linearGradient id="' + id + '" x1="' + x1 + '" y1="' + y1 + '" x2="' + x2 + '" y2="' + y2 + '"' + (user ? ' gradientUnits="userSpaceOnUse"' : '') + '>' + stopsXML(st) + '</linearGradient>'); }
  return 'url(#' + GC[key] + ')';
}
function rad(st, cx, cy, r, fx, fy) {
  cx = cx === undefined ? .5 : cx; cy = cy === undefined ? .5 : cy; r = r === undefined ? .5 : r;
  const key = 'R' + JSON.stringify(st) + cx + cy + r + fx + fy;
  if (!GC[key]) { const id = GP + 'g' + DEFS.length; GC[key] = id; if (seeThrough(st)) ALPHA['url(#' + id + ')'] = 1;
    DEFS.push('<radialGradient id="' + id + '" cx="' + cx + '" cy="' + cy + '" r="' + r + '"' + (fx !== undefined ? ' fx="' + fx + '" fy="' + fy + '"' : '') + '>' + stopsXML(st) + '</radialGradient>'); }
  return 'url(#' + GC[key] + ')';
}
const ball = c => rad([[0, lite(c, .55)], [.45, c], [1, dark(c, .3)]], .36, .3, .78);
const vshade = c => lin([[0, lite(c, .3)], [.55, c], [1, dark(c, .28)]]);
const glowFill = (c, a) => rad([[0, c, a === undefined ? .85 : a], [.4, c, (a === undefined ? .85 : a) * .45], [1, c, 0]]);
// ---- paint: the ONE place that turns a full-color shape into a coloring-page shape ----
// LINE mode: see-through shines/glows/blush vanish, stroked shapes become white with black lines,
// dark unstroked bits (pupils) stay black, other unstroked colors become white with a thin line.
const at = (k, v) => v === undefined || v === null || v === '' ? '' : ' ' + k + '="' + v + '"';
const SKIP = null;
function paint(f, s, w, ex) {
  const sw = n((w || 2) * WS);
  if (!LINE) return at('fill', f === 0 ? 'none' : f) + (s ? at('stroke', s) + at('stroke-width', sw) + ' stroke-linejoin="round" stroke-linecap="round"' : '');
  if (ex && /opacity/.test(ex) && !/data-keep/.test(ex)) return SKIP;
  const clear = f === 0 || f === 'none' || ALPHA[f];
  const ln = ' stroke-linejoin="round" stroke-linecap="round"';
  if (s) return at('fill', clear ? 'none' : (f === OL ? INK : '#fff')) + at('stroke', INK) + at('stroke-width', sw) + ln;
  if (clear) return SKIP;
  if (f === '#fff' || f === '#ffffff') return at('fill', '#fff');
  if (lum(f) < .3) return at('fill', INK);
  return at('fill', '#fff') + at('stroke', INK) + at('stroke-width', n(1.5 * WS)) + ln;
}
const shape = (open, f, s, w, ex) => { const p = paint(f, s, w, ex); return p === SKIP ? '' : open + p + (ex || '') + '/>'; };
const C = (x, y, r, f, s, w, ex) => shape('<circle cx="' + n(x) + '" cy="' + n(y) + '" r="' + n(Math.max(0, r)) + '"', f, s, w, ex);
const E = (x, y, rx, ry, f, s, w, rot, ex) => shape('<ellipse cx="' + n(x) + '" cy="' + n(y) + '" rx="' + n(Math.max(0, rx)) + '" ry="' + n(Math.max(0, ry)) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x) + ' ' + n(y) + ')"' : ''), f, s, w, ex);
const R = (x, y, w, h, r, f, s, sw, rot, ex) => shape('<rect x="' + n(x) + '" y="' + n(y) + '" width="' + n(Math.max(0, w)) + '" height="' + n(Math.max(0, h)) + '" rx="' + n(r || 0) + '"' + (rot ? ' transform="rotate(' + n(rot) + ' ' + n(x + w / 2) + ' ' + n(y + h / 2) + ')"' : ''), f, s, sw, ex);
const P = (d, f, s, w, ex) => shape('<path d="' + d + '"', f, s, w, ex);
function L(d, col, w, ex) {
  col = col || OL;
  if (LINE) { if (ex && /opacity/.test(ex)) return ''; col = lum(col) < .35 ? INK : '#fff'; }
  return '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="' + n((w || 2) * WS) + '" stroke-linecap="round" stroke-linejoin="round"' + (ex || '') + '/>';
}
const G = (x, y, s, inner, rot, flip) => '<g transform="translate(' + n(x) + ' ' + n(y) + ')' + (rot ? ' rotate(' + n(rot) + ')' : '') + (s !== 1 || flip ? ' scale(' + n((flip ? -1 : 1) * s * 100) / 100 + ' ' + n(s * 100) / 100 + ')' : '') + '">' + inner + '</g>';
// a character drawn at scale s, with its lines kept a nice printable thickness
function CH(x, y, s, draw, rot, flip) { const old = WS; WS = old * Math.min(1, 2.3 / s); const inner = draw(); WS = old; return G(x, y, s, inner, rot, flip); }
const poly = pts => { let d = ''; for (let i = 0; i < pts.length; i += 2) d += (i ? ' L' : 'M') + n(pts[i]) + ' ' + n(pts[i + 1]); return d + ' Z'; };
function starD(x, y, r, pts, inner, rot) {
  pts = pts || 5; inner = inner || .45; rot = rot || 0; const a = [];
  for (let i = 0; i < pts * 2; i++) { const ang = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; a.push(x + Math.cos(ang) * rr, y + Math.sin(ang) * rr); }
  return poly(a);
}
const glow = (x, y, r, c, a) => C(x, y, r, glowFill(c, a));
const shadow = (x, y, rx, ry, a) => E(x, y, rx, ry, rad([[0, '#000', a || .35], [.6, '#000', (a || .35) * .5], [1, '#000', 0]]));
const shine = (x, y, rx, ry, rot, a) => E(x, y, rx, ry, '#fff', 0, 0, rot === undefined ? -25 : rot, ' opacity="' + (a || .55) + '"');
const sparkle = (x, y, r, col, a) => P(starD(x, y, r, 4, .22), col || '#fff', 0, 0, a ? ' opacity="' + a + '"' : '');
const tube = (d, col, w) => L(d, OL, w + 3.4) + L(d, col, w);
// ---- text ----
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const FONT = ' font-family="Arial Rounded MT Bold, Chalkboard SE, Comic Sans MS, sans-serif" font-weight="900"';
// plain text (always dark ink unless a light color is asked for in full color)
const T = (x, y, txt, size, col, anchor, ex) => '<text x="' + n(x) + '" y="' + n(y) + '" font-size="' + size + '" fill="' + (LINE ? INK : (col || OL)) + '" text-anchor="' + (anchor || 'middle') + '"' + FONT + (ex || '') + '>' + esc(txt) + '</text>';
// bubble letters: colored with a dark outline (white with outline on a coloring page)

function openBuilder() { endPrintAll(); setView('builder'); renderBuilder(); blip(660); const r = document.querySelectorAll('.row')[bsel]; if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' }); }
function starterPack() { state.counts = Object.assign({}, STARTER); saveState(); renderBuilder(); tune([523, 659, 784]); toast('⭐ Starter pack: ' + totalChosen() + ' pages!'); }

// =====================================================================
// PRINTING: only the page prints (see @media print). The notebook prints one page per sheet.
// =====================================================================
const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);
function doPrint(after) {
  setTimeout(() => {
    try { if (typeof window.print === 'function') window.print(); } catch (_) {}
    if (after && !isTouchy()) after();      // Chrome waits inside print(); iPad uses 'afterprint' instead

}
function printPage() {

}
function buildNotebook() {

}
function printNotebook() {

  $('printAll').innerHTML = buildNotebook();

function endPrintAll() {

// =====================================================================
// KEYS: arrows pick, Enter opens, Escape goes back, P prints, + / - change how many
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (sparkOpen()) {
    if (k === 'Enter' || k === ' ') { e.preventDefault(); spin(); }
    else if (k === 'Escape' || k === 'Backspace') { e.preventDefault(); closeSpark(); }
    else if (k === 'p' || k === 'P') useIdea();

  }
  if (view === 'gallery') {
    const cols = gridCols(), N = PAGES.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printPage(); return; }
    else if (k === 'Escape') { e.preventDefault(); leave(); return; }

    e.preventDefault(); markSel(); blip(520, 0, .06);
  } else if (view === 'sheet') {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printPage();
    else if (k === '+' || k === '=') changeCount(PAGES[cur].id, 1);
    else if (k === '-' || k === '_') changeCount(PAGES[cur].id, -1);
    else if (k === 'ArrowRight' || k === 'ArrowDown') { openSheet((sel + 1) % PAGES.length); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { openSheet((sel + PAGES.length - 1) % PAGES.length); e.preventDefault(); }
  } else if (view === 'builder') {
    const ids = choosable();
    if (k === 'ArrowDown') bsel = Math.min(ids.length - 1, bsel + 1);
    else if (k === 'ArrowUp') bsel = Math.max(0, bsel - 1);
    else if (k === 'ArrowRight' || k === '+' || k === '=') { changeCount(PAGES[ids[bsel]].id, 1); e.preventDefault(); return; }
    else if (k === 'ArrowLeft' || k === '-') { changeCount(PAGES[ids[bsel]].id, -1); e.preventDefault(); return; }
    else if (k === 'Enter' || k === ' ') { openSheet(ids[bsel]); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printNotebook(); return; }
    else if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); return; }
    else return;
    e.preventDefault(); renderBuilder(); blip(520, 0, .06);
    const r = document.querySelectorAll('.row')[bsel]; if (r && r.scrollIntoView) r.scrollIntoView({ block: 'nearest' });
  }
}
function init() {

  renderGallery();

  blinkLights();

  tap('gHome', leave); tap('gSpark', openSpark); tap('gBook', openBuilder);
  tap('bColor', () => setMode('color')); tap('bLine', () => setMode('line'));
  tap('nColor', () => setMode('color')); tap('nLine', () => setMode('line'));
  tap('bPrint', printPage); tap('bSpark', openSpark); tap('bBook', openBuilder); tap('bBack', backToGallery);
  tap('bPlus', () => changeCount(PAGES[cur].id, 1)); tap('bMinus', () => changeCount(PAGES[cur].id, -1));
  tap('nPrint', printNotebook); tap('nStarter', starterPack); tap('nClear', clearAll); tap('nBack', backToGallery);
  tap('bPull', spin); tap('bSay', () => say(state.idea ? ideaText(state.idea) : 'Pull the lever to spark a game idea!'));
  tap('bUse', useIdea); tap('bSparkClose', closeSpark);
  window.addEventListener('afterprint', () => { endPrintAll(); if (view === 'sheet') renderSheet(); });
  window.addEventListener('resize', () => REELS.forEach((l, k) => setReel(k, reelPos[k])));
  window.addEventListener('keydown', onKey);
}
if (typeof window !== 'undefined' && !window.__TEST__) {

}
