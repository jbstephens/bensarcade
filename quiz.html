const GAMES = [...new Set(Q.map(q => q.g))];

let best = 0;

// ---------- Quiz state ----------

let newBest = false;
function useFifty() {

// ---------- Buttons ----------
let buttons = [];
function btn(x, y, w, h, o) { buttons.push({ x, y, w, h, ...o }); }
const ANS_COL = ['#e53935', '#1e88e5', '#fdd835', '#43a047'];
const ANS_LETTER = ['A', 'B', 'C', 'D'];
function buildButtons() {
  buttons = [];

    btn(W / 2 - 300, 330, 280, 80, { label: '🎲 Big Quiz!', sub: '10 questions from ALL games', fn: () => startQuiz(), color: '#e040fb' });

  } else if (scene === 'pick') {
    GAMES.forEach((g, i) => btn(40 + (i % 4) * 222, 100 + Math.floor(i / 4) * 78, 208, 66, { label: `${Q.find(q => q.g === g).i} ${g}`, fn: () => startQuiz(g), color: '#3949ab', small: true }));

  } else if (scene === 'quiz') {

function pos(e) { const r = C.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; }
C.addEventListener('mousedown', e => {

  for (const b of buttons) if (x > b.x && x < b.x + b.w && y > b.y && y < b.y + b.h) { if (b.ans === undefined) sfx.click(); b.fn(); return; }

C.addEventListener('mousemove', e => { [mouse.x, mouse.y] = pos(e); });

// ---------- Drawing ----------

function drawHost(x, y, mood) {        // Quizbot, the game show host

function drawButtons() {
  for (const b of buttons) {

    if (b.sub) { text(b.label, b.x + b.w / 2, b.y + 36 - (hover ? 3 : 0), 28); text(b.sub, b.x + b.w / 2, b.y + 64 - (hover ? 3 : 0), 15, '#fff', 'center', null); }
    else fitText(b.label, b.x + b.w / 2, b.y + b.h / 2 + 8 - (hover ? 3 : 0), b.w - 16, b.small ? 19 : 24, '#fff');
  }
}
function draw() {
  stage();
  if (scene === 'title') {
    drawHost(W / 2, 250, 'happy');
    text('GAME FACTORY', W / 2, 90, 64, '#ffd740', 'center', '#4a148c');
    text('QUIZ SHOW!', W / 2, 150, 54, '#fff', 'center', '#4a148c');
    text(`How well do you know YOUR games?   🏆 Best score: ${best}`, W / 2, 470, 20, '#e1bee7', 'center', null);
  } else if (scene === 'pick') {
    text('Pick a game to be quizzed on!', W / 2, 70, 36, '#ffd740', 'center', '#4a148c');
  } else if (scene === 'quiz') {
    const q = list[qi];
    drawHost(90, 210, choice !== null && opts[choice] !== q.a ? 'sad' : 'happy');
    rr(150, 150, 300, 56, 18, '#fff', '#ffd740', 3);              // host speech bubble
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(150, 186); ctx.lineTo(132, 196); ctx.lineTo(156, 172); ctx.fill();
    fitText(hostMsg, 300, 185, 280, 17, '#4a148c', 'center', null);
    text(`Question ${qi + 1} of ${list.length}`, 30, 44, 22, '#fff', 'left');
    text(`⭐ ${score}`, 30, 80, 24, '#ffd740', 'left');
    if (streak >= 2) text(`🔥 ${streak}`, 160, 80, 22, '#ff9800', 'left');
    rr(250, 20, 680, 120, 22, 'rgba(255,255,255,.96)', '#ffd740', 5);  // the question card
    text(`${q.i} ${q.g}`, 590, 46, 18, '#7c4dff', 'center', null);
    wrapText(q.q, 590, 98, 640, 25, '#1b1b2f');
    if (choice !== null && resultT > 30) {} else if (choice === null) text('Click an answer (or press 1 2 3 4)', 690, 232, 16, '#e1bee7', 'center', null);
  } else if (scene === 'end') {
    const pct = rightCount / list.length;
    const title = pct === 1 ? '🏆 GAME FACTORY MASTER!' : pct >= 0.7 ? '🌟 Game Factory Expert!' : pct >= 0.4 ? '👍 Game Factory Fan!' : '🎮 Keep playing your games!';
    drawHost(W / 2, 250, 'happy');
    text(title, W / 2, 80, 44, '#ffd740', 'center', '#4a148c');
    text(`You got ${rightCount} out of ${list.length} right!`, W / 2, 132, 30, '#fff');
    text(`⭐ ${score} points`, W / 2, 330, 36, '#ffd740');
    text(newBest ? '🎉 NEW BEST SCORE! 🎉' : `Best score: ${best}`, W / 2, 380, 24, newBest ? '#69f0ae' : '#e1bee7');
  }
  drawButtons();
  for (const p of particles) { ctx.globalAlpha = Math.min(1, p.life / 30); ctx.fillStyle = p.c; ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillRect(-4, -2, 8, 4); ctx.restore(); }
  ctx.globalAlpha = 1;
}
function update() {
  frame++;
  if ((scene === 'quiz' && choice !== null) || scene === 'end') resultT++;
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.r += 0.1; p.life--; }
  particles = particles.filter(p => p.life > 0 && p.y < H + 20);
  buildButtons();
}
buildButtons();
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
