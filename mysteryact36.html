<!DOCTYPE html>

<title>⛳ The Game Factory Mini Golf Open!</title>
<script src="touchpad.js?v=6"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;

  }

  .b-magic { background: linear-gradient(90deg, #ff8a80, #ffd180, #b9f6ca, #82b1ff, #ea80fc); }
  .glowy { animation: glowy 1s ease-in-out infinite alternate; }
  @keyframes glowy { from { box-shadow: 0 5px 0 #222, 0 0 0 0 #fff59d; } to { box-shadow: 0 5px 0 #222, 0 0 0 10px rgba(255,245,157,.7); } }
  h1.big { margin: 0; font-size: clamp(26px, 4.4vw, 54px); color: #fff59d; -webkit-text-stroke: 2.5px #222;
    text-shadow: 4px 4px 0 #e91e63; letter-spacing: 1px; text-align: center; line-height: 1.05; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; flex-wrap: wrap; justify-content: center; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .safe { background: #fffbe0; border: 4px solid #222; border-radius: 16px; padding: 6px 10px; font-size: clamp(14px, 1.6vw, 17px); font-weight: bold; text-align: center; }
  #toast { position: fixed; left: 50%; top: 16px; transform: translateX(-50%) scale(0); background: #fff;

    z-index: 80; transition: transform .25s; text-align: center; max-width: 92vw; }
  #toast.on { transform: translateX(-50%) scale(1); }

  @keyframes pop { 0% { transform: scale(.2) rotate(-10deg); } 70% { transform: scale(1.15) rotate(3deg); } 100% { transform: scale(1); } }
  /* ---------- 🎁 gift ---------- */
  #gift { flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    background: radial-gradient(circle at 50% 45%, #69f0ae, #2979ff 60%, #1a1446); }
  #giftBox { width: min(48vh, 70vw); cursor: pointer; animation: wobble 1.4s ease-in-out infinite; }
  #giftBox svg { width: 100%; height: auto; display: block; }
  #giftBox.open { animation: none; }
  #giftBox .lid { transition: transform .9s cubic-bezier(.3,1.6,.5,1); }
  #giftBox.open .lid { transform: translate(0, -90px) rotate(-24deg); }
  #giftBox .rib { transition: opacity .3s; } #giftBox.open .rib { opacity: 0; }
  @keyframes wobble { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-5deg) scale(1.03); } 40% { transform: rotate(5deg); } 60% { transform: rotate(-3deg); } }
  #giftMsg { color: #fff; font-size: clamp(20px, 3vw, 30px); font-weight: bold; text-align: center; text-shadow: 2px 2px 0 #000; padding: 0 12px; }
  /* ---------- 🃏 event card overlay ---------- */

  .ov.on { display: flex; }
  .card { background: #fff; border: 6px solid #222; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 980px; max-height: 100%;

  #evtCard { flex-direction: row; align-items: stretch; animation: cardIn .6s cubic-bezier(.3,1.5,.5,1); }
  @keyframes cardIn { 0% { transform: rotateY(90deg) scale(.4); } 100% { transform: rotateY(0) scale(1); } }
  #evtArt { width: min(32vw, 300px); flex-shrink: 0; border: 5px solid #222; border-radius: 20px; position: relative; min-height: 180px; }
  #evtArt svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  #evtArt.dance svg { animation: boogie .35s ease-in-out infinite alternate; }
  @keyframes boogie { from { transform: rotate(-8deg) translateY(0); } to { transform: rotate(8deg) translateY(-10px); } }
  #evtR { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px; justify-content: center; }
  #evtTitle { margin: 0; text-align: center; font-size: clamp(26px, 4vw, 48px); color: #fff59d; -webkit-text-stroke: 2px #222; text-shadow: 3px 3px 0 #e91e63; line-height: 1.05; }
  #evtText { font-size: clamp(22px, 3.2vw, 38px); font-weight: bold; text-align: center; line-height: 1.15; }
  #evtSub { font-size: clamp(16px, 2vw, 22px); text-align: center; color: #444; font-weight: bold; }
  #evtBig { font-size: clamp(60px, 14vh, 130px); text-align: center; line-height: 1; font-weight: bold; color: #fff; -webkit-text-stroke: 3px #222; text-shadow: 5px 5px 0 #222; }
  #evtBig:empty { display: none; }

  #evtBtns .btn { font-size: clamp(17px, 2.2vw, 24px); min-height: 64px; }
  /* ---------- 📜 rules + 🗺️ layouts ---------- */
  #rules { flex-direction: column; gap: 8px; padding: 10px; background: linear-gradient(#26c6da, #00838f); }
  .scroller { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: flex; flex-direction: column; gap: 10px; }

  .lay { display: flex; gap: 12px; align-items: stretch; }

  /* ---------- 🖨️ printables (same setup as the Craft Room) ---------- */
  #gallery { flex-direction: column; overflow: hidden; background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #b2ebf2 36px 72px); }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 6px 4px -4px; }
  .sec span { font-size: 26px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #222; text-shadow: 3px 3px 0 #222; }
  .sec .btn { font-size: 17px; min-height: 46px; padding: 4px 12px; }
  .thumb { background: #fff; border: 5px solid #222; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #e91e63; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 15px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #1e6bff; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #1e6bff; }
  #view { flex-direction: row; gap: 10px; padding: 10px; background: repeating-linear-gradient(45deg, #e0f7fa 0 36px, #b2ebf2 36px 72px); }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #222; border-radius: 10px; box-shadow: 0 8px 0 #e91e63; }
  #trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; }
  #trace.on { display: block; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 22px; font-weight: bold; text-align: center; background: #fff; border: 4px solid #222; border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 17px; text-align: center; background: #fffbe0; border: 4px solid #222; border-radius: 14px; padding: 6px 8px; }
  .b-mode { font-size: 17px; line-height: 1.15; }
  .b-mode.on { background: #ffe066; border-color: #ff3d6e; box-shadow: 0 5px 0 #ff3d6e; }
  #pens { display: none; grid-template-columns: repeat(10, 1fr); gap: 6px; background: #2b7bd9; border: 4px solid #222; border-radius: 16px; padding: 8px; }
  #pens.on { display: grid; }
  .sw { aspect-ratio: 1; border-radius: 50%; border: 3px solid #222; cursor: pointer; }
  .sw.sel { transform: scale(1.18); box-shadow: 0 0 0 3px #fff, 0 0 0 6px #222; }
  #printAll { display: none; }
  /* ---------- big overlay ---------- */
  #big { position: fixed; inset: 0; z-index: 58; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 16px; text-align: center; }
  #big.on { display: flex; }
  #big.count { background: rgba(26, 20, 70, .95); }
  #big.calm { background: rgba(0, 120, 90, .95); }
  #bigEmo { font-size: clamp(60px, 14vh, 140px); line-height: 1; animation: bob .4s infinite alternate; }
  #bigTxt { font-size: clamp(34px, 6.4vw, 84px); color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 5px 5px 0 #000; font-weight: bold; line-height: 1.05; max-width: 1200px; }
  #bigTxt.num { font-size: clamp(120px, 34vh, 300px); animation: pop .5s ease-out; }
  #bigSub { font-size: clamp(20px, 3vw, 34px); color: #fff; font-weight: bold; -webkit-text-stroke: 1.2px #000; }
  /* ================= ⛳ MINI GOLF OPEN styles ================= */
  body { background: linear-gradient(#81d4fa, #43a047); }
  #gift { background: radial-gradient(circle at 50% 45%, #fff59d, #43a047 45%, #1b5e20); }
  .vBg { background: radial-gradient(circle at 70% 10%, #b9f6ca, #43a047 45%, #1b5e20); }
  .bpBg { background-color: #1565c0; background-image: linear-gradient(rgba(255,255,255,.12) 2px, transparent 2px), linear-gradient(90deg, rgba(255,255,255,.12) 2px, transparent 2px); background-size: 40px 40px; }
  h1.glowT { margin: 0; font-size: clamp(24px, 4.2vw, 52px); color: #fff59d; -webkit-text-stroke: 2.5px #1b2f12; text-shadow: 4px 4px 0 #e53935; text-align: center; line-height: 1.05; }
  #big.glow { background: radial-gradient(circle, rgba(255,245,157,.96), rgba(46,125,50,.96)); }
  #big.glow #bigTxt { font-size: clamp(50px, 10vw, 140px); animation: goalShake .3s infinite alternate; }
  #big.hio { background: repeating-conic-gradient(from 0deg, rgba(255,215,64,.96) 0 15deg, rgba(255,64,129,.96) 15deg 30deg); }

  #big.grass { background: rgba(27, 94, 32, .95); }
  #big.grass #bigTxt { font-size: clamp(40px, 8vw, 110px); }
  #big.hush { background: rgba(27, 47, 18, .97); }
  #big.hush #bigTxt { font-size: clamp(40px, 7vw, 100px); }
  #big.paper { background: rgba(13, 71, 161, .92); }
  #big.paper #bigTxt { font-size: clamp(22px, 3.4vw, 42px); color: #0d47a1; -webkit-text-stroke: 0; text-shadow: none; background: #fffde7; border: 6px solid #0d47a1; border-radius: 22px; padding: 18px 26px; line-height: 1.25; }
  @keyframes goalShake { from { transform: rotate(-3deg) scale(1); } to { transform: rotate(3deg) scale(1.08); } }
  /* ---------- 🎬 the opening ---------- */
  #intro { overflow: hidden; background: #81d4fa; }
  #stage { position: absolute; inset: 0; }
  #stage svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .kingIn { transform: translateX(-1100px); transition: transform 1.3s cubic-bezier(.3,1.4,.5,1); } #intro.s1 .kingIn { transform: translateX(0); }
  .banner { transform: translateY(-500px); transition: transform 1s .5s cubic-bezier(.3,1.5,.5,1); } #intro.s1 .banner { transform: translateY(0); }
  .rollBall { transform: translateX(-900px); } #intro.s2 .rollBall { animation: rollIn 2.6s ease-out forwards; }
  @keyframes rollIn { 0% { transform: translateX(-900px); } 100% { transform: translateX(0); } }
  .uhoh { opacity: 0; transition: opacity .4s 2.6s; } #intro.s2 .uhoh { opacity: 1; }
  .blue { transform: translateY(700px); transition: transform 1.2s cubic-bezier(.3,1.3,.5,1); } #intro.s3 .blue { transform: translateY(0); }
  .flagUp { transform: translateY(260px); opacity: 0; transition: transform .7s cubic-bezier(.3,1.7,.5,1), opacity .3s; } #intro.s4 .flagUp { transform: translateY(0); opacity: 1; }
  .floaty { animation: bob2 1.6s ease-in-out infinite alternate; } @keyframes bob2 { from { transform: translateY(0); } to { transform: translateY(-10px); } }
  .cloud { animation: drift 30s linear infinite alternate; } @keyframes drift { from { transform: translateX(-60px); } to { transform: translateX(60px); } }
  #iTitle { position: absolute; left: 0; right: 0; top: 3%; text-align: center; z-index: 7; opacity: 0; transform: scale(.2);

  #iBtns { position: absolute; right: 12px; top: 12px; display: flex; gap: 8px; z-index: 8; }

  /* ---------- 🧑‍🤝‍🧑 the crew ---------- */

  #crewList { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 240px), 1fr)); gap: 8px; align-content: start; }
  .crewCard { background: #fffde7; border: 4px solid #1b2f12; border-radius: 16px; padding: 6px 8px; display: flex; gap: 8px; align-items: center; cursor: pointer; box-shadow: 0 5px 0 #e53935; font: inherit; text-align: left; color: #222; }
