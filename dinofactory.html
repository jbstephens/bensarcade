<script>

// =====================================================================

// =====================================================================
const $ = id => document.getElementById(id);
// 🐱 SAMMY: gray-brown tabby, black stripes, cream muzzle, yellow eyes

function wrap(txt, max) {
  const out = []; let line = '';
  String(txt).split(' ').forEach(w => { if ((line + ' ' + w).trim().length > max) { out.push(line.trim()); line = w; } else line += ' ' + w; });
  if (line.trim()) out.push(line.trim()); return out;
}
// a dino fitted into a box
// rough outer edges of a dino (so pictures can be fitted snugly)
function dinoBox(d) {
  const b = dinoParts(d), hs = b.hs, hx = b.neck[2], hy = b.neck[3];
  let l = b.cx - b.rx * .78 - (d.tail === 'whip' ? 205 : 135) - (d.tail === 'club' || d.tail === 'fan' ? 50 : 10), r = hx + (d.head === 'beak' ? 94 : d.head === 'duckbill' ? 86 : 64) * hs + 4;
  let t = hy - (d.head === 'horns' ? 82 : d.head === 'crest' ? 70 : 40) * hs;
  if (d.back === 'wings') { const S = backPt(b, 104); t = Math.min(t, S.y - 112); l = Math.min(l, S.x - 172); }
  if (d.back === 'sail') t = Math.min(t, b.cy - b.ry - 86); if (d.back === 'plates' || d.back === 'spikes') t = Math.min(t, b.cy - b.ry - 58); if (d.back === 'feathers') t = Math.min(t, b.cy - b.ry - 42);
