<script>
// =====================================================================================
// 🏆 THE CHAMPION'S TOWER: Ben's idea! A giant tower with 25 floors. Every floor is a
// mini challenge from a different kind of Game Factory game (Robo Jump jumps, Beat Bounce,
// ghost sneaking, brain busters, races, Second Morph...). At the very top waits
// THE FIRST ROBOT EVER MADE, ROBO PRIME! (Robo's long-lost prototype. He's kind!)
// Two modes: 🔥 CHAMPION (Ben's hard mode: checkpoint every 5 floors, a fail timer)
//            🌟 LITTLE BUDDY (for little brothers: a checkpoint on EVERY floor, no fail timer)
// Save: localStorage.championTower = { music, champ: { cp, med, beat }, buddy: { ... } }
// Trophies: towerTop, towerChampion, towerDiamond (💎 on 10 floors)
// =====================================================================================
const cv = document.getElementById('game'); let ctx = cv.getContext('2d');
const W = 960, H = 540;
let frame = 0;
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
let save = { music: true, champ: { cp: 0, med: {}, beat: 0 }, buddy: { cp: 0, med: {}, beat: 0 } };
try { const s = JSON.parse(localStorage.getItem('championTower') || 'null'); if (s && s.champ && s.buddy) save = s; } catch (_) {}
function writeSave() { try { localStorage.setItem('championTower', JSON.stringify(save)); } catch (_) {} }
const MEDALS = ['🥉', '🥈', '🥇', '💎'], MEDAL_NAMES = ['BRONZE', 'SILVER', 'GOLD', 'DIAMOND'];
const MEDAL_COL = ['#d7894a', '#cfd8dc', '#ffd740', '#80deea'];
const rnd = (a, b) => a + Math.random() * (b - a), irnd = n => Math.floor(Math.random() * n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = irnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = a => a[irnd(a.length)];
const hitRect = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

// ---------- drawing helpers (the classic Robo Jump text style) ----------
function text(str, x, y, size, color = '#fff', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`; ctx.textAlign = align; ctx.textBaseline = 'alphabetic'; ctx.lineJoin = 'round';
  ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(str, x, y);
  ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function emo(str, x, y, size) { ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff'; ctx.fillText(str, x, y); ctx.textBaseline = 'alphabetic'; }
function wrapText(str, x, y, maxW, size, color = '#fff', lh = 1.25) {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial, sans-serif`;
  const words = str.split(' '), lines = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur);
  lines.forEach((l, i) => text(l, x, y + i * size * lh, size, color));

}
function rrect(x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function roundRect(x, y, w, h, r, fill) { ctx.fillStyle = fill; rrect(x, y, Math.max(0, w), Math.max(0, h), r); ctx.fill(); }
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function poly(pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); for (let i = 0; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath(); ctx.fill(); }

function drawStar(x, y, r, fill, rot = 0) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = rot + i * Math.PI / 5 - Math.PI / 2, rr = i % 2 ? r * 0.45 : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9); ctx.closePath();
}
function heart(x, y, s, fill = '#ff5c8a') { ctx.fillStyle = fill; heartPath(x, y, s); ctx.fill(); }
function button(b, label, col, size = 26, sel = false) {
  ctx.save();
  if (sel) { ctx.shadowColor = '#fff59d'; ctx.shadowBlur = 22; }
  roundRect(b.x, b.y + 5, b.w, b.h, 16, 'rgba(0,0,0,.35)'); roundRect(b.x, b.y, b.w, b.h, 16, col);
  ctx.restore();
  if (sel) { ctx.strokeStyle = '#fff59d'; ctx.lineWidth = 5; rrect(b.x - 3, b.y - 3, b.w + 6, b.h + 6, 18); ctx.stroke(); }
  text(label, b.x + b.w / 2, b.y + b.h / 2 + size * 0.36, size);
}
const inBox = (p, b) => p && p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;

// ---------- input: keyboard (+ touchpad.js fake keys + controllers) and taps ----------
const keys = { left: false, right: false, up: false, down: false, jump: false };
const press = {};
let tap = null;
const KEYMAP = { ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ' ': 'jump' };
addEventListener('keydown', e => {
  wakeAudio();
  const k = KEYMAP[e.key];
  if (k) { if (!keys[k]) press[k] = true; keys[k] = true; }
  if (e.key === 'Enter') press.enter = true;
  if (e.key === 'Escape') press.esc = true;
  if (e.key === 'm' || e.key === 'M') toggleMusic();
  if (e.key === 'h' || e.key === 'H') press.hint = true;
  if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key) && e.preventDefault) e.preventDefault();
});
addEventListener('keyup', e => { const k = KEYMAP[e.key]; if (k) keys[k] = false; });
function canvasPos(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; }
cv.addEventListener('mousedown', e => { wakeAudio(); tap = canvasPos(e); });
const anyGo = () => press.jump || press.enter;
function clearPress() { for (const k in press) press[k] = false; tap = null; }

// ---------- 🔊 gentle sound (master volume 0.13, soft fades, nothing loud or sudden) ----------
let actx = null, master = null, musicBus = null, sfxBus = null, noiseBuf = null;
let musicOn = save.music !== false;
const MASTER_VOL = 0.13;
function setupAudio() {
  master = actx.createGain(); master.gain.setValueAtTime(0, actx.currentTime); master.gain.linearRampToValueAtTime(MASTER_VOL, actx.currentTime + 0.6);
  master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicOn ? 0.55 : 0; musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.8; sfxBus.connect(master);
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function wakeAudio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); } catch (_) { actx = null; } }
  else if (actx.state === 'suspended' && actx.resume) actx.resume();
}
function toggleMusic() {
  musicOn = !musicOn; save.music = musicOn; writeSave();
  if (musicBus && actx) { const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicOn ? 0.55 : 0, t + 0.3); }
}
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function tone(freq, t, dur, wave, vol, dest, slideTo) {
  if (!actx || !dest) return;
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = wave; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.012); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(dest); o.start(t); o.stop(t + dur + 0.03);
}

  if (!actx || !noiseBuf || !dest) return;
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'highpass'; f.frequency.value = hp;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest); s.start(t); s.stop(t + dur + 0.02);
}
function note(freq, start, dur, wave = 'sine', vol = 0.12, slideTo = null) { if (actx) tone(freq, actx.currentTime + start, dur, wave, vol, sfxBus, slideTo); }
const sfx = {
  jump: () => note(420, 0, 0.14, 'sine', 0.12, 850),
  djump: () => note(620, 0, 0.12, 'sine', 0.11, 1250),
  coin: () => { note(988, 0, 0.08, 'triangle', 0.1); note(1319, 0.07, 0.18, 'triangle', 0.1); },
  ouch: () => note(420, 0, 0.3, 'triangle', 0.12, 160),
  boing: () => note(220, 0, 0.3, 'sine', 0.14, 880),
  stomp: () => note(380, 0, 0.14, 'triangle', 0.14, 120),
  click: () => note(700, 0, 0.05, 'triangle', 0.07),
  good: () => { note(660, 0, 0.1, 'triangle', 0.1); note(880, 0.09, 0.16, 'triangle', 0.1); },
  oops: () => { note(330, 0, 0.12, 'triangle', 0.09); note(262, 0.1, 0.2, 'triangle', 0.09); },
  morph: () => [523, 659, 784, 1047].forEach((f, i) => note(f, i * 0.04, 0.12, 'triangle', 0.07)),
  win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => note(f, i * 0.09, 0.3, 'triangle', 0.11)),
  flag: () => [784, 988, 1175, 1568].forEach((f, i) => note(f, i * 0.08, 0.25, 'sine', 0.11)),
  boo: () => { note(520, 0, 0.35, 'sine', 0.09, 300); note(390, 0.15, 0.35, 'sine', 0.07, 260); },
  pad: i => note([392, 523, 659, 784][i], 0, 0.35, 'triangle', 0.12),
  slide: () => note(300, 0, 0.08, 'sine', 0.08, 380),
  tell: () => { note(880, 0, 0.12, 'sine', 0.07); note(880, 0.2, 0.12, 'sine', 0.07); },
  pop: () => note(900, 0, 0.08, 'sine', 0.08, 1400),
  tick: () => note(1200, 0, 0.03, 'sine', 0.05),
};

// ---------- 🎵 original music: a little step player (melody on the chord tones, bass, soft drums) ----------
// melody / bass: one token per 8th note. "C5" = a note, "-" = hold, "." = rest.
const NOTE_IX = { C: 0, 'C#': 1, Db: 1, D: 2, 'D#': 3, Eb: 3, E: 4, F: 5, 'F#': 6, Gb: 6, G: 7, 'G#': 8, Ab: 8, A: 9, 'A#': 10, Bb: 10, B: 11 };
const nameToMidi = n => { const m = /^([A-G][#b]?)(\d)$/.exec(n); return m ? 12 * (+m[2] + 1) + NOTE_IX[m[1]] : null; };
function parseLine(str) {             // -> [{ m, len }] per step (len in 8ths; 0 = held/rest)
  const tk = str.trim().split(/\s+/), out = tk.map(() => null);
  let last = -1;
  tk.forEach((t, i) => { if (t === '-') { if (last >= 0) out[last].len++; } else if (t === '.') last = -1; else { out[i] = { m: nameToMidi(t), len: 1 }; last = i; } });
  return out;
}
const SONG_DEFS = {
  // 🏰 "Up, Up, the Tower!" the main theme: C  G  Am  F, a happy climbing melody
  tower: { bpm: 112, lead: 'square', drums: 'pop',
    mel: 'E5 - G5 - C6 - G5 E5  D5 - G5 - B5 - G5 D5  C5 - E5 - A5 - G5 E5  F5 - A5 - C6 - A5 G5 ' +
         'G5 E5 G5 C6 - - E5 G5  B5 - D6 - B5 G5 - -  A5 C6 A5 E5 - C5 E5 A5  G5 - F5 - E5 - D5 - ',
    bass: 'C3 . C4 . C3 . C4 .  G2 . G3 . G2 . G3 .  A2 . A3 . A2 . A3 .  F2 . F3 . F2 . F3 . ' +
          'C3 . C4 . C3 . C4 .  G2 . G3 . G2 . G3 .  A2 . A3 . A2 . A3 .  F2 . F3 . G2 . G3 . ' },
  // 🥁 "Bounce to the Beat": for the Beat Bounce floors (a soft kick on EVERY beat so you can feel it)
  beat: { bpm: 120, lead: 'triangle', drums: 'four',
    mel: 'C5 F5 A5 F5 C6 - A5 -  C5 E5 G5 E5 C6 - G5 -  D5 F5 A5 F5 D6 - A5 -  D5 F5 Bb5 F5 D6 - C6 - ' +
         'A5 - C6 - A5 F5 C5 -  G5 - C6 - G5 E5 C5 -  F5 A5 D6 A5 F5 A5 D6 -  F5 - D5 - C5 - . . ',
    bass: 'F2 F3 F2 F3 F2 F3 F2 F3  C3 C4 C3 C4 C3 C4 C3 C4  D3 D4 D3 D4 D3 D4 D3 D4  Bb2 Bb3 Bb2 Bb3 Bb2 Bb3 Bb2 Bb3 ' +
          'F2 F3 F2 F3 F2 F3 F2 F3  C3 C4 C3 C4 C3 C4 C3 C4  D3 D4 D3 D4 D3 D4 D3 D4  Bb2 Bb3 Bb2 Bb3 C3 C4 C3 C4 ' },
  // 🤖 "Robo Prime's March": the boss song. Am  F  C  G, then Dm  F  E  E (exciting, never scary)
  boss: { bpm: 132, lead: 'square', drums: 'march',
    mel: 'A4 - C5 E5 A5 - E5 C5  F5 - A5 - C6 - A5 F5  G5 - E5 - C5 - E5 G5  B5 - G5 D5 B4 - D5 G5 ' +
         'D5 F5 A5 - D6 - A5 F5  C6 - A5 - F5 - A5 C6  B5 - G#5 - E5 - G#5 B5  E6 - - - B5 - G#5 - ',
    bass: 'A2 A3 A2 A3 A2 A3 A2 A3  F2 F3 F2 F3 F2 F3 F2 F3  C3 C4 C3 C4 C3 C4 C3 C4  G2 G3 G2 G3 G2 G3 G2 G3 ' +
          'D3 D4 D3 D4 D3 D4 D3 D4  F2 F3 F2 F3 F2 F3 F2 F3  E2 E3 E2 E3 E2 E3 E2 E3  E2 E3 E2 E3 E2 E3 E2 E3 ' },
  // 🏆 "Champion!": the victory song.  C  F  G  C
  victory: { bpm: 120, lead: 'triangle', drums: 'pop',
    mel: 'C5 E5 G5 C6 - G5 C6 -  C6 - A5 F5 A5 - C6 -  B5 - G5 D5 G5 - B5 -  C6 - - - G5 - E5 - ',
    bass: 'C3 . C4 . C3 . C4 .  F2 . F3 . F2 . F3 .  G2 . G3 . G2 . G3 .  C3 . G2 . C3 . . . ' },

const SONGS = {};
for (const k in SONG_DEFS) { const d = SONG_DEFS[k]; SONGS[k] = { ...d, m: parseLine(d.mel), b: parseLine(d.bass) }; }
// 🎶 the book's Jukebox can ask for any song: ?song=boss  (or window.JUKEBOX.song)
const JB_WANT = (window.JUKEBOX && window.JUKEBOX.song) || (/[?&]song=([^&#]*)/.exec(location.search) || [])[1];
const JB_SONG = (JB_WANT && SONG_DEFS[JB_WANT]) ? JB_WANT : null;
let song = JB_SONG || 'tower', songPos = 0, nextT = 0, songOut = null, songBpm = 0;
function setSong(name, bpm) {
  if (JB_SONG) name = JB_SONG;
  if (song === name && (!bpm || bpm === songBpm)) return;
  song = name; songPos = 0; nextT = 0; songBpm = bpm || 0;
  if (songOut && actx) { const g = songOut, t = actx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.4); setTimeout(() => { try { g.disconnect(); } catch (_) {} }, 1000); }
  songOut = null;
}
function restartSong(name, bpm) { song = null; setSong(name, bpm); }
function musicTick() {
  if (!actx || !musicBus || !song || !SONGS[song]) return;
  const S = SONGS[song], bpm = songBpm || S.bpm, sd = 60 / bpm / 2;
  if (!songOut) { songOut = actx.createGain(); songOut.gain.setValueAtTime(0, actx.currentTime); songOut.gain.linearRampToValueAtTime(1, actx.currentTime + 0.5); songOut.connect(musicBus); nextT = actx.currentTime + 0.08; }
  if (nextT < actx.currentTime - 0.3) nextT = actx.currentTime + 0.05;          // (we were asleep: don't play a pile of notes)
  while (nextT < actx.currentTime + 0.15) {
    const i = songPos % S.m.length, mn = S.m[i], bn = S.b[i % S.b.length], t = nextT;
    if (mn && mn.m) { tone(mtof(mn.m), t, sd * mn.len * 0.95 + 0.05, S.lead, S.lead === 'square' ? 0.05 : 0.11, songOut); tone(mtof(mn.m + 12), t, sd * 0.6, 'sine', 0.025, songOut); }
    if (bn && bn.m) tone(mtof(bn.m), t, sd * bn.len * 0.9 + 0.04, 'triangle', 0.13, songOut);
    const beat8 = songPos % 8;
    if (S.drums === 'four') { if (beat8 % 2 === 0) tone(110, t, 0.12, 'sine', 0.2, songOut, 45); if (beat8 % 4 === 2) noise(t, 0.08, 0.05, songOut, 2500); noise(t, 0.03, 0.02, songOut, 7000); }
    else if (S.drums === 'march') { if (beat8 % 4 === 0) tone(110, t, 0.12, 'sine', 0.18, songOut, 45); if (beat8 % 4 === 2) noise(t, 0.1, 0.05, songOut, 2000); if (beat8 === 7) noise(t, 0.06, 0.04, songOut, 2000); noise(t, 0.03, 0.018, songOut, 7000); }
    else { if (beat8 === 0 || beat8 === 4) tone(110, t, 0.1, 'sine', 0.16, songOut, 50); if (beat8 === 2 || beat8 === 6) noise(t, 0.06, 0.04, songOut, 3000); if (beat8 % 2) noise(t, 0.02, 0.015, songOut, 8000); }
    nextT += sd; songPos++;

}

// ---------- 🤖 ROBO (copied from Robo Jump 13's drawRoboBase) + his Second Morph forms ----------
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
function drawRobo(p) {
  const pal = PAL_ROBO, sx = 1 / (p.squash || 1), sy = p.squash || 1, face = p.face || 1;

  const w = p.w * sx, h = p.h * sy, x = p.x + (p.w - w) / 2, y = p.y + p.h - h, es = w / 30, mo = p.morph;
  ctx.save();
  if (mo === 'rock') {                                   // 🪨 ROCK: a big round rocky shell
    ellipse(x + w / 2, y + h * 0.55, w * 0.8, h * 0.62, '#8d8d8d'); ellipse(x + w / 2 - 6, y + h * 0.4, w * 0.3, h * 0.2, '#b0b0b0');
    circle(x + 4, y + h * 0.75, 4, '#6d6d6d'); circle(x + w - 4, y + h * 0.3, 3, '#6d6d6d');
  }
  if (mo === 'fish') {                                   // 🐟 FISH: a tail fin behind
    poly([x + w / 2 - face * 14, y + h * 0.6, x + w / 2 - face * 34, y + h * 0.3, x + w / 2 - face * 34, y + h * 0.95], '#ff9800');
  }
  if (mo === 'mouse') { ctx.strokeStyle = '#f48fb1'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(x + w / 2 - face * 12, y + h * 0.8); ctx.quadraticCurveTo(x + w / 2 - face * 34, y + h * 0.9, x + w / 2 - face * 30, y + h * 0.5); ctx.stroke(); }
  if (p.flying) { const f = 8 + Math.random() * 8; ctx.fillStyle = '#7df9ff'; for (const fx of [x + w * 0.23, x + w * 0.77]) { ctx.beginPath(); ctx.moveTo(fx - 4, y + h); ctx.lineTo(fx, y + h + f); ctx.lineTo(fx + 4, y + h); ctx.fill(); } }
  ctx.fillStyle = pal.legs;
  ctx.fillRect(x + 4 * es, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40)); ctx.fillRect(x + w - 12 * es, y + h - 7 * (h / 40), 8 * es, 7 * (h / 40));
  roundRect(x + 2, y + h * 0.5, w - 4, h * 0.4, 6 * es, pal.body);

const BOSS_F = 25;
const BOSS_FLOOR = { name: 'ROBO PRIME', icon: '👑', kind: 'boss', lv: 'boss', hint: 'Dodge his moves. When he gets DIZZY, jump on his head!', how: '← → • JUMP • dodge, then stomp him when he is dizzy ⭐' };
const floorDef = f => f === BOSS_F ? BOSS_FLOOR : FLOORS[f];
const ENG = {};                                          // the floor engines register here

// ---------- game state ----------
let state = 'title', mode = 'champ', titleSel = 0, mapSel = 0, msg = '', fx = [], shake = 0, hintT = 0;
let run = null, eng = null, result = null, pauseSel = 0;
const BUD = () => mode === 'buddy';
const MS = () => save[mode];
const isCheckpoint = f => BUD() || f % 5 === 0;
function startFloor(f, practice) {
  const fd = floorDef(f), maxH = f === BOSS_F ? (BUD() ? 6 : 4) : (BUD() ? 5 : 3);
  run = { f, fd, practice: !!practice, t: 0, hits: 0, hearts: maxH, maxH, inv: 0, bonus: 0 };
  state = 'intro'; eng = null; fx = []; setSong('tower');
}
function beginPlay() {
  state = 'play'; run.t = 0; hintT = 0;
  eng = ENG[run.fd.kind].init(run.fd.lv);
  if (run.fd.kind === 'run') restartSong('beat', eng.bpm); else if (run.fd.kind === 'boss') restartSong('boss'); else setSong('tower');
}
const timeLimit = () => (!BUD() && run && run.fd.par) ? Math.round(run.fd.par * 2.5) : 0;
function medalFor(fd, secs, hits) {
  if (!fd.par) return hits === 0 ? 3 : hits === 1 ? 2 : hits <= 3 ? 1 : 0;
  const par = fd.par * (BUD() ? 1.5 : 1), e = secs + hits * 3;
  return e <= par ? 3 : e <= par * 1.4 ? 2 : e <= par * 2 ? 1 : 0;
}
function ouch() {                                          // Robo got bumped: lose a heart (never scary: a soft "oof")
  if (run.inv > 0 || state !== 'play') return false;

  if (run.hearts <= 0) failFloor('hearts');

}
function diamondCount() { let n = 0; for (let f = 0; f < 25; f++) if (save.champ.med[f] === 3 || save.buddy.med[f] === 3) n++; return n; }
function winFloor() {
  const secs = Math.max(0, run.t / 60 - run.bonus), m = medalFor(run.fd, secs, run.hits), ms = MS(), f = run.f;
  const old = ms.med[f], best = old == null || m > old;
  if (best) ms.med[f] = m;
  let flag = false;
  if (!run.practice && f + 1 > ms.cp && isCheckpoint(f + 1)) { ms.cp = f + 1; flag = true; }
  writeSave();
  if (diamondCount() >= 10) trophy('towerDiamond');
  result = { m, secs, best, flag, hits: run.hits, t: 0 };
  state = 'result'; fx = []; sfx.win(); confetti(W / 2, 200, 60); setSong('tower');
}
function failFloor(why) {

}
function afterResult() {

  startFloor(run.f + 1, false);
}
function confetti(x, y, n) {
  const C = ['#ff5252', '#ffd740', '#69f0ae', '#40c4ff', '#e040fb', '#ff80ab'];
  for (let i = 0; i < n; i++) fx.push({ x, y, vx: rnd(-7, 7), vy: rnd(-9, -2), c: pick(C), life: rnd(60, 110), s: rnd(5, 9), conf: true });
}
function sparkle(x, y, c = '#fff59d', n = 8) { for (let i = 0; i < n; i++) fx.push({ x, y, vx: rnd(-3, 3), vy: rnd(-4, 1), c, life: rnd(20, 40), s: rnd(3, 6) }); }
function popText(str, x, y, c = '#fff59d') { fx.push({ x, y, vx: 0, vy: -0.8, c, life: 60, txt: str }); }
function updateFx() { for (const p of fx) { p.x += p.vx; p.y += p.vy; if (!p.txt) p.vy += p.conf ? 0.2 : 0.15; p.life--; } fx = fx.filter(p => p.life > 0); }

  for (const p of fx) {

      else if (t === 'minus') { const a = 8 + irnd(8), b = 2 + irnd(6); q = `${a} - ${b} = ?`; ans = a - b; }
      else { const a = 2 + irnd(7), b = 2 + irnd(7); q = `${a} + ? = ${a + b}`; ans = b; }

    if (sel) { ctx.strokeStyle = '#fff'; ctx.lineWidth = 5; rrect(b.x - 4, b.y - 4, b.w + 8, b.h + 8, 14); ctx.stroke(); }
    if (f === BOSS_F) { drawPrime(b.x + 30, b.y + b.h - 4, 0.45, {}); text(ms.beat ? '👑 BEAT!' : ok ? 'ROBO PRIME' : '🔒 TOP', b.x + 98, b.y + 36, 17, '#fff'); continue; }
    text(String(f + 1), b.x + 16, b.y + 22, 17, ok ? '#5d4037' : '#a1887f');
    emo(ok ? fd.icon : '🔒', b.x + b.w / 2, b.y + 30, 26);
    if (med != null) emo(MEDALS[med], b.x + b.w - 15, b.y + b.h - 13, 20);
    if (BUD() && med != null) emo('🚩', b.x + 13, b.y + b.h - 13, 14);
    if (here) text('▶', b.x - 6, b.y + 38, 24, '#ffd740');
  }
  text(BUD() ? '🌟 LITTLE BUDDY' : '🔥 CHAMPION', W - 20, 72, 26, '#fff', 'right');
  text(`💎 ${diamondCount()} / 10 diamonds`, 18, 80, 18, '#e1f5fe', 'left');
  button(BTN_BACK, '◀ Back', '#5c6bc0', 22); button({ x: W - 50, y: 90, w: 42, h: 42 }, musicOn ? '🎵' : '🔇', '#ff7043', 20);
  const fd = floorDef(mapSel), med = ms.med[mapSel];
  roundRect(150, 512, 660, 26, 10, 'rgba(0,0,0,.45)');
  const info = !canPlay(mapSel) ? `🔒 Climb up to reach ${mapSel === BOSS_F ? 'the top' : 'Floor ' + (mapSel + 1)}!` : mapSel === ms.cp ? `▶ ${mapSel === BOSS_F ? 'ROBO PRIME' : 'Floor ' + (mapSel + 1) + ': ' + fd.name}: press JUMP to CLIMB!` : `${mapSel === BOSS_F ? 'ROBO PRIME' : 'Floor ' + (mapSel + 1) + ': ' + fd.name} ${med != null && mapSel < 25 ? 'best ' + MEDALS[med] : ''}: play again for a better medal!`;
  text(info, W / 2, 532, 18, '#fff');
  drawRobo({ x: 70, y: 300, w: 45, h: 60, face: 1 }); drawDusty(860, 330, { s: 2, face: -1 });
}
function updateMap() {
  if (press.esc || (tap && inBox(tap, BTN_BACK))) { state = 'title'; sfx.click(); return; }
  if (tap && inBox(tap, { x: W - 50, y: 90, w: 42, h: 42 })) { toggleMusic(); return; }
  const f = mapSel;
  if (press.left && f < BOSS_F && f % 5 > 0) mapSel--;
  if (press.right && f < BOSS_F && f % 5 < 4) mapSel++;
  if (press.up) mapSel = f >= 20 ? BOSS_F : Math.min(BOSS_F, f + 5);
  if (press.down) mapSel = f === BOSS_F ? 22 : Math.max(f % 5, f - 5);
  if (f !== mapSel) sfx.click();
  let go = anyGo();
  if (tap) for (let i = 0; i <= BOSS_F; i++) if (inBox(tap, winBox(i))) { if (mapSel === i) go = true; else { mapSel = i; sfx.click(); } }
  if (go) { if (canPlay(mapSel)) { sfx.good(); startFloor(mapSel, mapSel !== MS().cp); } else sfx.oops(); }
}
// ---------- intro card, result, fail, pause, ending ----------
function drawPanel() { roundRect(110, 70, 740, 400, 28, 'rgba(255,255,255,.95)'); }
function drawIntro() {
  sky(BUD() ? '#00695c' : '#4a148c', BUD() ? '#80cbc4' : '#ff8a65'); drawPanel();
  const fd = run.fd, boss = run.f === BOSS_F;
  text(boss ? '👑 THE TOP OF THE TOWER 👑' : `Floor ${run.f + 1}${run.practice ? ' (practice)' : ''}`, W / 2, 120, 30, '#ff6f00');
  emo(fd.icon, W / 2 - 250, 180, 64); text(fd.name, W / 2 + 30, 196, 44, '#4a148c');
  ctx.save(); ctx.fillStyle = '#37474f'; ctx.font = 'bold 21px "Trebuchet MS", Arial'; ctx.textAlign = 'center'; ctx.fillText(fd.how, W / 2, 245); ctx.restore();
  roundRect(250, 268, 560, 86, 16, '#e0f7fa'); drawDusty(200, 352, { s: 2.6, pose: 'happy' });
  ctx.save(); ctx.fillStyle = '#006064'; ctx.font = 'bold 19px "Trebuchet MS", Arial'; ctx.textAlign = 'left';
  const words = ('Dusty says: ' + fd.hint).split(' '); let l = '', y = 298; for (const w of words) { if (ctx.measureText(l + w).width > 520) { ctx.fillText(l, 268, y); l = ''; y += 24; } l += w + ' '; } ctx.fillText(l, 268, y); ctx.restore();
  let goal = '';
  if (boss) goal = BUD() ? '🌟 Little Buddy: 6 hearts, slower moves, 2 stomps per phase' : '🔥 3 phases • 3 stomps each • 🚩 a checkpoint every phase';
  else if (fd.par) { const p = fd.par * (BUD() ? 1.5 : 1); goal = `💎 ${p.toFixed(0)}s   🥇 ${(p * 1.4).toFixed(0)}s   🥈 ${(p * 2).toFixed(0)}s   ${BUD() ? '🌟 no time limit!' : '⏱ limit ' + timeLimit() + 's'}`; }
  else goal = '💎 no bumps   🥇 1 bump   🥈 2-3 bumps';
  text(goal, W / 2, 392, 22, '#ff6f00');
  if (run.f % 5 === 0 && !BUD() && run.f > 0 && !boss) text('🚩 Checkpoint floor!', W / 2, 424, 20, '#e53935');
  if (frame % 60 < 42) text('Tap or press JUMP to start!', W / 2, 452, 26, '#2e7d32');
}
function drawResult() {
  sky('#1b5e20', '#ffe082'); drawPanel(); const r = result, boss = run.f === BOSS_F;
  text(`Floor ${run.f + 1} cleared!`, W / 2, 130, 44, '#2e7d32');
  const k = Math.min(1, r.t / 25); emo(MEDALS[r.m], W / 2, 220, 40 + 50 * k);
  text(MEDAL_NAMES[r.m] + ' MEDAL!', W / 2, 300, 34, MEDAL_COL[r.m] === '#cfd8dc' ? '#78909c' : MEDAL_COL[r.m] === '#80deea' ? '#00acc1' : MEDAL_COL[r.m]);
  text(`⏱ ${r.secs.toFixed(1)} s   •   ${r.hits ? r.hits + ' bump' + (r.hits > 1 ? 's' : '') : 'no bumps!'}`, W / 2, 340, 24, '#455a64');
  if (r.best) text('⭐ NEW BEST! ⭐', W / 2 - 160, 380, 22, '#ff6f00');
  if (r.flag) text('🚩 CHECKPOINT!', W / 2 + 160, 380, 22, '#e53935');
  if (!boss && frame % 60 < 42) text(run.practice ? 'Tap or press JUMP: back to the map' : run.f === 24 ? 'Tap or press JUMP: go to THE TOP! 👑' : 'Tap or press JUMP: next floor ▶', W / 2, 440, 24, '#2e7d32');
  drawRobo({ x: 150, y: 380 - Math.abs(Math.sin(frame * 0.15)) * 20, w: 45, h: 60, face: 1, happy: true }); drawDusty(800, 450, { s: 2.4, face: -1, pose: 'happy' });
  drawFx(0, 0);
}
function drawFail() {
  sky('#37474f', '#90a4ae'); drawPanel(); const r = result;
  text(r.why === 'time' ? '⏱ Time\'s up!' : '💫 Out of hearts!', W / 2, 140, 46, '#5d4037');
  text(run.practice ? 'Let\'s try this floor again!' : r.back === run.f ? `Back to the start of Floor ${r.back + 1}` : `Back to the 🚩 checkpoint: Floor ${r.back + 1}`, W / 2, 210, 30, '#455a64');
  drawDusty(W / 2, 380, { s: 3, pose: 'happy' }); text('Dusty says: You can do it! Every try makes you better!', W / 2, 410, 22, '#00838f');
  if (frame % 60 < 42) text('Tap or press JUMP to try again', W / 2, 450, 24, '#2e7d32');
}
function drawPause() {
  ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H); text('⏸ Paused', W / 2, 170, 52);
  button(PAUSE_BTNS[0], '▶ Keep playing', '#43a047', 28, pauseSel === 0); button(PAUSE_BTNS[1], '🗺️ Back to the map', '#5c6bc0', 28, pauseSel === 1);
}
const PAUSE_BTNS = [{ x: 300, y: 220, w: 360, h: 80 }, { x: 300, y: 330, w: 360, h: 80 }];
function drawEnding() {
  sky('#0d47a1', '#ffcc80'); drawTowerArt(480, 760, 300, 200, true); roundRect(130, 470, 700, 40, 14, '#8d6e63'); roundRect(130, 470, 700, 12, 6, '#ffd740');
  if (frame % 50 === 0) confetti(rnd(200, 760), rnd(80, 200), 30);
  const t = result.t;
  drawPrime(560, 470, 1.4, { happy: true }); drawRobo({ x: 360, y: 410 - Math.abs(Math.sin(frame * 0.15)) * 30, w: 45, h: 60, face: 1, happy: true }); drawDusty(260, 470, { s: 2.6, pose: 'happy' });
  drawFx(0, 0);
  text('🏆 TRUE GAME FACTORY CHAMPION! 🏆', W / 2, 90, 44, '#ffd740');
  text(mode === 'champ' ? '🔥 You beat ROBO PRIME in CHAMPION mode, Ben!' : '🌟 Little Buddy beat ROBO PRIME! Amazing!', W / 2, 140, 26, '#fff');
  text('Robo Prime is proud of you. Now he\'s your friend!', W / 2, 180, 22, '#e1f5fe');
  if (t > 120 && frame % 60 < 42) text('Tap or press JUMP', W / 2, 520, 24, '#fff');
}

// ---------- 🔁 the game loop (a steady 60 steps per second) ----------
function step() {
  frame++; if (shake > 0) shake *= 0.85; if (shake < 0.5) shake = 0;
  updateFx();
  if (state === 'title') {
    if (tap && inBox(tap, BTN_MUSIC)) { toggleMusic(); tap = null; }
    if (press.left || press.right) { titleSel = 1 - titleSel; sfx.click(); }
    let go = anyGo() ? titleSel : -1;
    MODE_BTNS.forEach((b, i) => { if (tap && inBox(tap, b)) go = i; });
    if (go >= 0) { mode = go ? 'buddy' : 'champ'; titleSel = go; mapSel = Math.min(BOSS_F, MS().cp); state = 'map'; sfx.good(); }
    setSong('tower');
  } else if (state === 'map') updateMap();
  else if (state === 'intro') {
    run.t++;
    if (press.esc || (tap && inBox(tap, BTN_BACK))) { state = 'map'; mapSel = run.f; }
    else if (run.t > 15 && (anyGo() || tap)) beginPlay();
  } else if (state === 'play') {
    if (hudTaps()) { /* a HUD button */ }
    if (press.hint) hintT = 300;
    if (press.esc) { state = 'pause'; pauseSel = 0; clearPress(); return; }
    run.t++; if (run.inv > 0) run.inv--;
    ENG[run.fd.kind].update(eng);
    const lim = timeLimit();
    if (state === 'play' && lim && run.t / 60 - run.bonus > lim) failFloor('time');
  } else if (state === 'pause') {
    if (press.up || press.down) { pauseSel = 1 - pauseSel; sfx.click(); }
    let go = anyGo() ? pauseSel : -1; PAUSE_BTNS.forEach((b, i) => { if (tap && inBox(tap, b)) go = i; });
    if (press.esc) go = 0;
    if (go === 0) state = 'play'; else if (go === 1) { state = 'map'; mapSel = run.f; setSong('tower'); }
  } else if (state === 'result') { result.t++; if (result.t > 40 && (anyGo() || tap)) afterResult(); else if (press.esc) { state = 'map'; mapSel = Math.min(BOSS_F, run.practice ? run.f : MS().cp); } }
  else if (state === 'fail') { result.t++; if (result.t > 40 && (anyGo() || tap)) startFloor(result.back, run.practice); else if (press.esc) { state = 'map'; mapSel = result.back; } }
  else if (state === 'ending') { result.t++; if (result.t > 120 && (anyGo() || tap)) { state = 'map'; mapSel = BOSS_F; setSong('tower'); } }
  clearPress();
}
function render() {
  ctx.save();
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'intro') drawIntro();
  else if (state === 'play' || state === 'pause') { ENG[run.fd.kind].draw(eng); drawHUD(); if (state === 'pause') drawPause(); }
  else if (state === 'result') drawResult();
  else if (state === 'fail') drawFail();
  else if (state === 'ending') drawEnding();
  ctx.restore();
}
// (the boss: fainting goes back to the phase checkpoint instead of leaving the floor)
const _failFloor = failFloor;
failFloor = function (why) { if (run && run.f === BOSS_F && state === 'play' && eng && why === 'hearts') { ENG.boss.faint(eng); return; } _failFloor(why); };
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  let n = 0; while (acc >= 1000 / 60 && n < 5) { step(); acc -= 1000 / 60; n++; }
  if (n >= 5) acc = 0;
  render(); musicTick();
  requestAnimationFrame(loop);
}
window.__step = n => { for (let i = 0; i < n; i++) step(); render(); };     // (for testing)
requestAnimationFrame(loop);
</script>
