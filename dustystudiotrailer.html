<script>
'use strict';
// =====================================================================
// 🎬 DUSTY AND THE FORGOTTEN STUDIO: the trailer (the game comes later!)
// Real 3D scenes (three.js r128). Dusty is the 3D model from forgottenworld.html.
// The music engine is copied from forgottenworldtrailer.html; the song "Stardust Swing" is brand new.
// Text, title cards and fact cards are drawn on a see-through canvas on top (#ov).
// =====================================================================
function trophy(id) { if (window.JUKEBOX) return; try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t, 0, 1); return t * t * (3 - 2 * t); };
const easeOut = t => { t = clamp(t, 0, 1); return 1 - (1 - t) * (1 - t) * (1 - t); };
const back = t => { t = clamp(t, 0, 1); const c = 1.7; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };   // overshoot "pop"
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
function rng(seed) { let a = seed >>> 0; return () => { a = (a * 1664525 + 1013904223) >>> 0; return a / 4294967296; }; }
</script>
<script>
'use strict';
// =====================================================================
// 🎵 THE MUSIC ENGINE (copied from forgottenworldtrailer.html, unchanged)
// =====================================================================
let actx = null, master = null, musicBus = null, sfxBus = null, delayIn = null, delayNode = null, noiseBuf = null;
let musicOn = false, trailerVol = 0.55;                // the 🔊 slider: 0..1 of the album's loudest setting
const musicVol = () => 0.75 * trailerVol;              // 0.75 = the album's 🔊 (so this is never louder than the album)
let MUSIC_LOG = null;                                  // tests set this to an array to see every scheduled note
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
function setupAudio() {
  master = actx.createGain(); master.gain.value = 0.9;
  if (actx.createDynamicsCompressor) {
    const comp = actx.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.005; comp.release.value = 0.2;
    master.connect(comp); comp.connect(actx.destination);
  } else master.connect(actx.destination);
  musicBus = actx.createGain(); musicBus.gain.value = musicVol(); musicBus.connect(master);
  sfxBus = actx.createGain(); sfxBus.gain.value = 0.85; sfxBus.connect(master);
  // feedback-delay echo for the lead (time is set per song)
  delayIn = actx.createGain(); delayIn.gain.value = 0.28;
  delayNode = actx.createDelay(2); delayNode.delayTime.value = 0.32;
  const fb = actx.createGain(); fb.gain.value = 0.34;
  const dlp = actx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2400;
  delayIn.connect(delayNode); delayNode.connect(dlp); dlp.connect(fb); fb.connect(delayNode); dlp.connect(musicBus);
  noiseBuf = actx.createBuffer(1, actx.sampleRate, actx.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
// a smooth gain envelope: 0 -> peak (attack) -> sustain level -> 0 (release). No clicks!
function envGain(t, a, peak, sus, dur, rel, out) {
  const g = actx.createGain(), hold = t + Math.max(a + 0.002, dur);
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(peak, t + a);
  if (sus < 1) g.gain.setTargetAtTime(peak * sus, t + a, Math.max(0.03, dur * 0.35));
  g.gain.setTargetAtTime(0, hold, rel / 4);           // smooth exponential release, never a jump
  g.connect(out);
  return g;
}
function osc(type, f, t, end, detune = 0) {
  const o = actx.createOscillator(); o.type = type; o.frequency.setValueAtTime(f, t);
  if (detune) o.detune.setValueAtTime(detune, t);
  o.start(t); o.stop(end + 0.05); return o;
}
function lowpass(f, q, t) { const b = actx.createBiquadFilter(); b.type = 'lowpass'; b.frequency.setValueAtTime(f, t); b.Q.value = q; return b; }
// 🎺 LEAD: detuned oscillators, filter, delayed vibrato on long notes, and an echo send
function leadVoice(m, t, dur, vol, kind, out, echo = true) {
  const f = midi(m), end = t + dur + 0.25;
  let g;
  if (kind === 'steel' || kind === 'bell' || kind === 'marimba' || kind === 'keys') {   // hit-and-ring voices (steel drum, bell, marimba, electric piano)
    const mar = kind === 'marimba', keys = kind === 'keys';
    g = envGain(t, 0.004, vol * (mar ? 1.3 : 1), mar ? 0.06 : keys ? 0.55 : 0.25, Math.min(dur, mar ? 0.25 : keys ? 1.4 : 0.6), mar ? 0.18 : 0.25, out);
    const parts = { steel: [[1, 1], [2, 0.35], [3.01, 0.12]], marimba: [[1, 1], [3.93, 0.22], [9.4, 0.04]], keys: [[1, 1], [2, 0.22], [3.01, 0.06], [0.5, 0.15]] }[kind]
      || [[1, 1], [2.01, 0.25], [4.02, 0.12], [5.4, 0.05]];
    for (const [k, v] of parts) { const pg = actx.createGain(); pg.gain.value = v; osc('sine', f * k, t, end).connect(pg); pg.connect(g); }
  } else if (kind === 'choir') {                       // 🎤 a choir singing "aah" (the pad's formant trick, as a melody voice)
    g = envGain(t, 0.06, vol * 1.6, 0.85, dur, 0.18, out);
    const src = actx.createGain(); src.gain.value = 0.5;
    const o1 = osc('sawtooth', f, t, end, -8), o2 = osc('sawtooth', f, t, end, 8), o3 = osc('sawtooth', f, t, end, 0);
    o1.connect(src); o2.connect(src); o3.connect(src);
    for (const [ff, q, v] of [[730, 5, 1], [1090, 6, 0.6], [2440, 7, 0.3]]) {
      const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
      const bg = actx.createGain(); bg.gain.value = v * 2; src.connect(bp); bp.connect(bg); bg.connect(g);
    }
    const lfo = osc('sine', 5, t, end), lg = actx.createGain(); lg.gain.value = f * 0.007; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency); lg.connect(o3.frequency);
  } else {
    g = envGain(t, kind === 'flute' || kind === 'glass' ? 0.035 : 0.012, vol, 0.8, dur, 0.12, out);
    const types = { saw: ['sawtooth', 'sawtooth'], square: ['square', 'square'], brass: ['sawtooth', 'sawtooth'],
                    flute: ['sine', 'triangle'], glass: ['triangle', 'sine'], reed: ['square', 'sawtooth'] }[kind] || ['sawtooth', 'square'];
    const cut = { saw: 3000, square: 2600, brass: 1400, flute: 4000, glass: 3500, reed: 1900 }[kind] || 2800;
    const lp = lowpass(cut, kind === 'brass' ? 3 : 1.5, t);
    if (kind === 'brass') { lp.frequency.linearRampToValueAtTime(3600, t + 0.06); lp.frequency.setTargetAtTime(1700, t + 0.08, 0.2); }
    lp.connect(g);
    const o1 = osc(types[0], f, t, end, -7), o2 = osc(types[1], kind === 'glass' ? f * 2 : f, t, end, 7);
    const mix = actx.createGain(); mix.gain.value = kind === 'glass' ? 0.6 : 0.5;
    o1.connect(mix); o2.connect(mix); mix.connect(lp);
    if (dur > 0.28) {                                  // vibrato fades in on held notes
      const lfo = osc('sine', 5.6, t, end), lg = actx.createGain();
      lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(0, t + 0.12); lg.gain.linearRampToValueAtTime(f * 0.009, t + 0.4);
      lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    }
  }
  if (echo && delayIn) g.connect(delayIn);
}
// 🎹 PAD: soft detuned saws (strings), a vowel-filtered "choir", or an organ
function padVoice(notes, t, dur, vol, kind, out, att) {
  for (const m of notes) {
    const f = midi(m), end = t + dur + 0.6;
    const g = envGain(t, att || (kind === 'choir' ? 0.35 : 0.22), vol, 0.85, dur, 0.5, out);   // att: a long attack = a pad that SWELLS
    if (kind === 'organ') {
      osc('sine', f, t, end).connect(g);
      const g2 = actx.createGain(); g2.gain.value = 0.4; osc('sine', f * 2, t, end).connect(g2); g2.connect(g);
    } else if (kind === 'choir') {                     // "aah": two formant filters + slow vibrato
      const src = actx.createGain(); src.gain.value = 0.5;
      const o1 = osc('sawtooth', f, t, end, -9), o2 = osc('sawtooth', f, t, end, 9);
      o1.connect(src); o2.connect(src);
      for (const [ff, q, v] of [[730, 6, 1], [1090, 7, 0.6], [2440, 8, 0.25]]) {
        const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = ff; bp.Q.value = q;
        const bg = actx.createGain(); bg.gain.value = v * 2.2; src.connect(bp); bp.connect(bg); bg.connect(g);
      }
      const lfo = osc('sine', 4.8, t, end), lg = actx.createGain(); lg.gain.value = f * 0.006; lfo.connect(lg); lg.connect(o1.frequency); lg.connect(o2.frequency);
    } else {
      const lp = lowpass(kind === 'saw' ? 1500 : 1100, 0.7, t); lp.connect(g);
      osc('sawtooth', f, t, end, -11).connect(lp); osc('sawtooth', f, t, end, 11).connect(lp);
    }
  }
}
// 🎸 BASS: punchy filter envelope
function bassVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.1;
  const g = envGain(t, 0.006, vol, 0.7, dur, 0.06, out);
  const lp = lowpass(kind === 'slap' ? 3200 : 1600, kind === 'slap' ? 8 : 5, t);
  lp.frequency.setTargetAtTime(kind === 'slap' ? 380 : 260, t + 0.01, kind === 'slap' ? 0.05 : 0.09);
  lp.connect(g);
  osc(kind === 'square' ? 'square' : 'sawtooth', f, t, end).connect(lp);
  const sg = actx.createGain(); sg.gain.value = 0.6; osc(kind === 'sub' ? 'triangle' : 'sine', f, t, end).connect(sg); sg.connect(g);
}
// 🎨 COUNTER-MELODY / arpeggio pluck
function pluckVoice(m, t, dur, vol, kind, out) {
  const f = midi(m), end = t + dur + 0.2;
  const g = envGain(t, 0.004, vol, 0.35, dur, 0.12, out);
  if (kind === 'marimba') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.2; osc('sine', f * 3.93, t, end).connect(g2); g2.connect(g); }
  else if (kind === 'bell') { osc('sine', f, t, end).connect(g); const g2 = actx.createGain(); g2.gain.value = 0.3; osc('sine', f * 3.01, t, end).connect(g2); g2.connect(g); }
  else { const lp = lowpass(2600, 1, t); lp.frequency.setTargetAtTime(900, t, 0.08); lp.connect(g); osc(kind === 'square' ? 'square' : 'triangle', f, t, end).connect(lp); osc('sawtooth', f, t, end, 5).connect(lp); }
}
function noiseHit(t, type, freq, q, vol, decay, out) {
  const s = actx.createBufferSource(); s.buffer = noiseBuf;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = freq; fl.Q.value = q;
  const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + decay);
  s.connect(fl); fl.connect(g); g.connect(out); s.start(t); s.stop(t + decay + 0.05);
}
// 🥁 DRUMS
function drumHit(kind, t, vol, out) {
  if (kind === 'k') {                                  // kick: a sine that drops in pitch fast
    const o = osc('sine', 150, t, t + 0.35); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.32);
    o.connect(g); g.connect(out);
  } else if (kind === 's') {                           // snare: noise + a little tone
    noiseHit(t, 'highpass', 1400, 0.7, vol * 0.8, 0.16, out);
    const o = osc('triangle', 190, t, t + 0.1), g = actx.createGain();
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * 0.5, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.09); o.connect(g); g.connect(out);
  } else if (kind === 'h') noiseHit(t, 'highpass', 7500, 1, vol, 0.04, out);
  else if (kind === 'o') noiseHit(t, 'highpass', 6500, 1, vol, 0.22, out);
  else if (kind === 'c') { for (let i = 0; i < 3; i++) noiseHit(t + i * 0.011, 'bandpass', 1500, 2, vol, 0.03 + (i === 2 ? 0.1 : 0), out); }
  else if (kind === 'x') noiseHit(t, 'highpass', 4000, 0.5, vol, 1.2, out);          // crash cymbal
  else if (kind === 'r') { const o = osc('sine', 2400, t, t + 0.06), g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.04); o.connect(g); g.connect(out); }
  else if (kind === 't') {                             // tom
    const o = osc('sine', 140, t, t + 0.3); o.frequency.exponentialRampToValueAtTime(75, t + 0.25);
    const g = actx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.001, t + 0.28); o.connect(g); g.connect(out);
  } else if (kind === 'g') {                           // 👾 glitch blip: a tiny jumpy square-wave chirp
    const f0 = 700 + (Math.floor(t * 1000) % 7) * 260, o = osc('square', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.setValueAtTime(f0 * 1.5, t + 0.02); o.frequency.setValueAtTime(f0 * 0.75, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.002); g.gain.setValueAtTime(vol, t + 0.045); g.gain.linearRampToValueAtTime(0, t + 0.055);
    o.connect(g); g.connect(out);
  }
}
// ⏰ NEW drums for Robo Jump 7: w = clock TICK, q = clock TOCK (wood blocks), j = finger cymbals (Pyramid Moon)
function drumX0(kind, t, vol, out) {
  if (kind === 'w' || kind === 'q') {
    const f0 = kind === 'w' ? 2100 : 1250, o = osc('triangle', f0, t, t + 0.06), g = actx.createGain();
    o.frequency.exponentialRampToValueAtTime(f0 * 0.8, t + 0.04);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + 0.001); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g); g.connect(out);
    noiseHit(t, 'bandpass', f0 * 1.5, 6, vol * 0.4, 0.02, out);
  } else if (kind === 'j') {
    for (const [f, v] of [[2637, 1], [3951, 0.5], [5274, 0.25]]) {
      const o = osc('sine', f, t, t + 0.5), g = actx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol * v, t + 0.002); g.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
      o.connect(g); g.connect(out);
    }
  } else drumHit(kind, t, vol, out);
}
// ---- song compiler: scale degrees -> notes ----
// Melody tokens (one per 8th note): 1-7 = scale degree, ' = octave up, , = octave down, b/# = flat/sharp, - = hold, . = rest. | = bar line.
// Chords (one per bar, "4/5" = two per bar): degree number, M = make it major, m = minor, b = flat root (bVII), 7 = add the 7th.
// 🔒 NEW drums for Robo Jump 8: n = CHAIN RATTLE (clanky metal links), y = KEY JINGLE (a ring of little keys)
function drumX(kind, t, vol, out) {
  if (kind === 'n') {                                  // ⛓️ a quick shake of metal links: 4 tiny clinks + a low clank
    for (let i = 0; i < 4; i++) noiseHit(t + i * 0.018, 'bandpass', 3200 + ((i * 977) % 1700), 9, vol * (1 - i * 0.18), 0.035, out);
    const o = osc('square', 410, t, t + 0.08), g = actx.createGain();

function txt(str, x, y, size, fill, o) {   // big cinematic text: thick dark outline, a colored fill (or gradient), a soft glow
  o = o || {}; X.save(); X.font = '900 ' + size + 'px ' + TFONT; X.textAlign = o.align || 'center'; X.textBaseline = 'middle';
  if (o.alpha !== undefined) X.globalAlpha *= clamp(o.alpha, 0, 1);
  if (o.maxW) { const w = X.measureText(str).width; if (w > o.maxW) { size = Math.floor(size * o.maxW / w); X.font = '900 ' + size + 'px ' + TFONT; } }
  if (o.glow) { X.shadowColor = o.glow; X.shadowBlur = size * .5; }
  X.lineJoin = 'round'; X.strokeStyle = o.stroke || '#2b0d12'; X.lineWidth = o.lw || Math.max(4, size * .16); X.strokeText(str, x, y);
  X.shadowBlur = 0;
  if (Array.isArray(fill)) { const gr = X.createLinearGradient(0, y - size / 2, 0, y + size / 2); fill.forEach((c, i) => gr.addColorStop(i / (fill.length - 1), c)); X.fillStyle = gr; } else X.fillStyle = fill || '#fff';
  X.fillText(str, x, y); X.restore();
}

  caption('*squeak* *squeak* *squeak*', t, 0.2, 1.6, 610, 36, '#ffe0b2');
  caption('"Places, everyone! ...Pretty please?"', t, 1.7, d, 610);
}
// 🎬 FRIEND 3: CLAPPY, the clapperboard buddy. CLAP! "ACTION!"
function clapAngle(t) { const c = [1.0, 2.0, 3.0].find(c => t < c + 0.18) || 99; const open = seg(t, c - 0.7, c - 0.2), shut = seg(t, c - 0.08, c); return Math.max(0, open * 0.75 * (1 - shut)); }
function sClappy(t, d) {
  stageBase(t, 0);
  put(CLAP, STAGE.g, -0.7, 0, 0.5, 0.15); CLAP.userData.stick.rotation.z = clapAngle(t);
  CLAP.userData.body.position.y = Math.abs(Math.sin(t * Math.PI * 2 / (BAR / 4))) * 0.08;
  CLAP.userData.arms.forEach((a, i) => { a.rotation.z = (i ? -1 : 1) * (0.4 + Math.sin(t * 6) * 0.3); });
  put(DUSTY, STAGE.g, 1.7, 0, 1.4, -0.6); poseDusty(DUSTY, t, spinAt(t, 2.1, 1.2), { heart: t > 3.3 });
  const k = ease(seg(t, 0, d)); cam(lerp(0.8, -0.2, k), 1.8, lerp(6.8, 6.0, k), 0.3, 0.9, 0.4, 45);
  for (const c of [1.0, 2.0, 3.0]) if (t > c) sparkles(-0.7, 1.1, 0.5, t, c, 1.4, [0xffffff, 0xfff59d]);
  nameTag('🎬 CLAPPY', 'a clapperboard buddy', t, 0.2, 1.9, 'r');
  popWord('ACTION!', t, 1.0, 2.0, 560, 110, ['#fff', '#ff8a80']);
  factCard(["Real clapperboards help movie makers: the CLAP", 'is easy to see AND hear, so picture + sound match up!'], t, 2.0, d - 0.05);
}
// ❓ THE MYSTERY: who made everyone forget the studio?
function sMystery(t, d) {
  stageBase(t, 0.9);
  put(SCREEN, STAGE.g, 0, 7, -9.4, 0); SCREEN.material.color.setHex(0xffd8a8).multiplyScalar(0.75 + 0.25 * ease(seg(t, 0, 2)));

  put(QMARK, STAGE.g, 0.4, 8.9 + Math.sin(t * 1.5) * 0.25, -3.2); QMARK.material.opacity = ease(seg(t, 0.8, 2.2)); QMARK.rotation.y = Math.sin(t) * 0.3;
  put(DUSTY, STAGE.g, 0.6, 0, 4.2, Math.PI + 0.2); poseDusty(DUSTY, t, 0, { bob: 0.4 });
  put(GLIM, STAGE.g, -1.6, 0, 4.6, Math.PI - 0.3); poseGlimmer(t, 0.6, 0, 0);
  put(CLAP, STAGE.g, 2.3, 0, 4.8, Math.PI); CLAP.userData.stick.rotation.z = 0; CLAP.userData.arms.forEach((a, i) => { a.rotation.z = (i ? -1 : 1) * 0.3; });
  dustField(0, 0, -3, 10, t, 0, 0xffe0b2, 0.5);
  const k = ease(seg(t, 0, d)); cam(0, lerp(2.2, 2.8, k), lerp(18, 14.5, k), 0, lerp(4.8, 5.3, k), -4);
  caption('But WHO made everyone forget the studio?', t, 0.5, 4.0, 640, 46);
  caption('...maybe someone just needs a friend. 💛', t, 4.4, d - 0.1, 640, 46, '#ffe0b2');
}
// ⚡ the fast final montage (one cut per beat... well, every 2 beats)
const CUTS = [[sPirate, 2.8, 'CLEAN!'], [sSpace, 2.6, 'EXPLORE!'], [sCowboy, 3.0, 'YEE-HAW!'], [sWard, 2.4, 'DRESS UP!'],
  [sSlow, 2.6, 'MOVIE POWERS!'], [sGlimmer, 2.6, 'MAKE FRIENDS!'], [sSqueaks, 2.4, 'TAKE A BOW!'], [sClappy, 1.9, 'ACTION!']];
function sMontage(t, d) {
  const k = d / CUTS.length, i = Math.min(CUTS.length - 1, Math.floor(t / k)), u = t - i * k;
  CAP = false; CUTS[i][0](CUTS[i][1] + u, 6); CAP = true;
  const p = back(seg(u, 0, .25)); X.save(); X.translate(W / 2, 600); X.scale(p, p); txt(CUTS[i][2], 0, 0, 100, ['#ffffff', '#ffd740'], { lw: 18 }); X.restore();
}
// 🏁 the big finish: the gate is CLEAN, the sign is fixed and lit up, everyone waves
function sFinale(t, d) {
  gateBase(t, 1); look(Object.assign({}, SUNSET, { top: 0x2d1b5e, bot: 0xff9e7a, fog: 0xc98aa0 }));
  const line = [[GLIM, -4.6, 0.3], [SQK, -2.6, -0.1], [DUSTY, 0, 0], [CLAP, 2.4, -0.1], [ROBO, 4.3, -0.2], [CAPT, 6.0, -0.3]];
  line.forEach(([o, x, ry], i) => { const p = back(seg(t, 0.5 + i * 0.15, 0.95 + i * 0.15)); put(o, GATE.g, x * 0.9, 0, 8, ry); o.scale.copy(o.userData.s0).multiplyScalar(Math.max(0.001, p)); });
  poseDusty(DUSTY, t, spinAt(t, 3.0, 1.2), { heart: true }); DUSTY.userData.body.position.y += Math.abs(Math.sin(t * Math.PI)) * 0.12;
  poseGlimmer(t, 0, 0.6, 0.2); CLAP.userData.stick.rotation.z = clapAngle(t % 1 + 1.5) ;
  ROBO.userData.arms[1].rotation.z = 2.4 + Math.sin(t * 7) * 0.4; CAPT.userData.arms[0].rotation.z = -2.2 + Math.sin(t * 7) * 0.4;
  SQK.userData.body.position.y = Math.abs(Math.sin(t * Math.PI)) * 0.25;
  put(LOGO, GATE.g, 0, 13.6, 4); LOGO.scale.setScalar(0.92 * Math.max(0.001, back(seg(t, 0, 0.8)))); LOGO.rotation.set(-0.05, Math.sin(t * 0.7) * 0.15, 0);
  sparkles(0, 12.5, 4, t, 0.3, 6, [0xfff59d, 0xffffff, 0x80deea, 0xff80ab]);
  cam(0, 5, lerp(26, 24, ease(seg(t, 0, d))), 0, 6.7, 5);
  const cs = back(seg(t, 2.0, 2.5)); if (cs > 0) { X.save(); X.translate(W / 2, 420); X.scale(cs, cs); txt('COMING SOMEDAY', 0, 0, 60, ['#fff59d', '#ffb300'], { lw: 12, glow: 'rgba(255,215,64,.5)' }); X.restore(); }
  txt('Made by Ben in the Game Factory', W / 2, 478, 34, '#fff8e1', { alpha: seg(t, 3.0, 3.6), lw: 7 });
}
// =====================================================================
// 🎞️ THE TIMELINE: every scene starts on a bar line of Stardust Swing (1 bar = 2 seconds)
// Stardust Swing: I(0) V(4) C(12) V(20) C(28) B(36) K(44, key change!) O(52), 56 bars.
// =====================================================================
const SCENES = [[0, sIntro], [2, sGate], [8, sEyes], [12, sTitle], [16, sPirate], [18, sSpace], [21, sCowboy], [24, sProps], [26, sWard],
  [28, sLights], [30, sSlow], [33, sRewind], [35, sSpot], [38, sGlimmer], [40, sSqueaks], [42, sClappy], [44, sMystery], [48, sMontage], [52, sFinale]]
  .map(([b, f], i, a) => ({ start: b * BAR, end: (a[i + 1] ? a[i + 1][0] : 56) * BAR, f, name: f.name }));
const TOTAL = 56 * BAR + 1.6;                            // the last chord rings a moment, then the end screen
SCENES[SCENES.length - 1].end = TOTAL;
function sceneAt(T) { for (let i = SCENES.length - 1; i >= 0; i--) if (T >= SCENES[i].start) return i; return 0; }
function prepFrame() {
  resetCast(); DUST.visible = SPARK.visible = false; DUSTY.userData.duster.visible = true;
  for (const o of CAST) o.scale.copy(o.userData.s0);
  X.setTransform(ov.width / W, 0, 0, ov.height / H, 0, 0); X.clearRect(0, 0, W, H);
}
function drawFrame(T) {
  prepFrame();
  const i = sceneAt(T), S = SCENES[i], t = T - S.start, d = S.end - S.start;
  X.save(); S.f(t, d); X.restore();
  renderer.render(scene, camera);
  const fin = S.f === sMontage ? 0 : 1 - seg(t, 0, .25), fout = i === 0 || S.f === sMontage || i === SCENES.length - 1 ? 0 : seg(t, d - .18, d);   // quick soft fades between scenes
  const a = Math.max(fin, fout); if (a > 0 && i > 0) { X.fillStyle = 'rgba(0,0,0,' + (a * .9) + ')'; X.fillRect(0, 0, W, H); }
  if (i === SCENES.length - 1) { const e = seg(T, TOTAL - .8, TOTAL); if (e > 0) { X.fillStyle = 'rgba(0,0,0,' + e * .5 + ')'; X.fillRect(0, 0, W, H); } }
  X.fillStyle = 'rgba(0,0,0,.9)'; X.fillRect(0, 0, W, 26); X.fillRect(0, H - 26, W, 26);     // movie bars
}
// =====================================================================
// ▶️ THE PLAYER: the music's clock drives the pictures, so they stay in time with the song (same as forgottenworldtrailer.html)
// =====================================================================
let state = 'start', T = 0, anchor = 0, clkSrc = '', watched = 0, lastNow = 0, SECTIONS = [];
const SONG = compileSong('stardust', SONG_DEFS.stardust); SONGS.stardust = SONG; song = 'stardust';
SONG.bars.forEach((b, i) => { if (b.i === 0) SECTIONS.push({ part: b.f, bar: i, time: +(i * SONG.spb * stepDur(SONG)).toFixed(3) }); });
console.log('🎵 Stardust Swing sections:', SECTIONS.map(s => s.part + '@bar' + s.bar + '=' + s.time + 's').join('  '), ' total ' + SONG.secsLong.toFixed(2) + 's');
function wakeAudio() {
  try {
    if (!actx) { actx = new (window.AudioContext || window.webkitAudioContext)(); setupAudio(); }
    if (actx.state === 'suspended' && actx.resume) actx.resume();
  } catch (_) {}
}
function setVolume() {
  if (!actx || !musicBus) return;
  const t = actx.currentTime; musicBus.gain.cancelScheduledValues(t); musicBus.gain.setValueAtTime(musicBus.gain.value, t); musicBus.gain.linearRampToValueAtTime(musicVol(), t + 0.15);
}
function stopNotes() {                                   // fade the booked notes away (no pops)
  if (songOut && actx) { const g = songOut, t = actx.currentTime; g.gain.cancelScheduledValues(t); g.gain.setValueAtTime(g.gain.value, t); g.gain.linearRampToValueAtTime(0, t + 0.25);
    setTimeout(() => { try { g.disconnect(); } catch (_) {} }, 1000); }
  songOut = null; VIS.length = 0;
}
const audioOn = () => !!(actx && actx.state === 'running');
const clock = () => audioOn() ? actx.currentTime : performance.now() / 1000;
function startAt(t0) {                                   // play from t0 seconds
  wakeAudio(); stopNotes();
  const sd = stepDur(SONG); songPos = Math.max(0, Math.ceil(t0 / sd - 1e-6)); songEndT = 0;
  T = t0; clkSrc = audioOn() ? 'a' : 'p'; anchor = clock() - t0; state = 'play'; lastNow = clock(); ui();
}
function pumpMusic() {                                   // book the next notes a little early
  if (state !== 'play' || !audioOn() || !musicBus) return;
  const sd = stepDur(SONG), now = actx.currentTime;
  if (!songOut) { songOut = actx.createGain(); songOut.gain.value = 1; songOut.connect(musicBus); if (delayNode) delayNode.delayTime.setValueAtTime(sd * 3, now); }
  while (songPos < SONG.total) {
    const tt = anchor + songPos * sd; if (tt >= now + 0.16) break;
    if (tt >= now - 0.03) { scheduleStep(SONG, songPos, tt); } songPos++;        // notes that are already late are skipped (never a pile-up)
  }
}
function tick() {
  if (state !== 'play') return;
  const src = audioOn() ? 'a' : 'p';
  if (src !== clkSrc) { clkSrc = src; anchor = clock() - T; }                     // the speaker woke up (or stopped): keep the picture where it is
  const now = clock(); watched += clamp(now - lastNow, 0, .25); lastNow = now;
  T = now - anchor; pumpMusic();
  if (T >= TOTAL) finish();
}
function pause() { if (state !== 'play') return; state = 'pause'; stopNotes(); ui(); }
function resume() { if (state === 'pause') startAt(T); }
function toggle() { if (state === 'play') pause(); else if (state === 'pause') resume(); }
function skip() { if (state !== 'play' && state !== 'pause') return; const i = sceneAt(T + .05); if (i >= SCENES.length - 1) { T = TOTAL; finish(); } else startAt(SCENES[i + 1].start); }
function replay() { $('end').classList.remove('show'); watched = 0; startAt(0); }
function finish() {
  state = 'end'; T = TOTAL; stopNotes(); ui();
  if (watched >= TOTAL * .6) trophy('dustyStudioTrailer');          // 🏆 watched (most of) the whole trailer
  $('end').classList.add('show'); renderIdeas();
}
// ---------- the buttons ----------
let barTimer = 0;
function ui() {
  $('bar').classList.toggle('show', state === 'play' || state === 'pause');
  $('bPlay').textContent = state === 'play' ? '⏸' : '▶'; $('bPlay').setAttribute('aria-label', state === 'play' ? 'Pause' : 'Play');
  $('pauseNote').style.display = state === 'pause' ? 'block' : 'none';
  poke();
}
function poke() { $('bar').classList.remove('dim'); clearTimeout(barTimer); barTimer = setTimeout(() => { if (state === 'play') $('bar').classList.add('dim'); }, 3000); }
function fit() {                                         // 16:9 movie screen, as big as fits
  const vw = innerWidth, vh = innerHeight, s = Math.min(vw / W, vh / H), dpr = Math.min(window.devicePixelRatio || 1, 1.5);
  const w = Math.round(W * s), h = Math.round(H * s); $('box').style.width = w + 'px'; $('box').style.height = h + 'px';
  renderer.setSize(w, h, false); ov.width = Math.round(w * dpr); ov.height = Math.round(h * dpr);
  camera.aspect = W / H; camera.updateProjectionMatrix();
}
// ---------- 💡 the idea box (saved for the real game later) ----------
const IDEA_KEY = 'dustyStudioIdeas';
function loadIdeas() { try { const a = JSON.parse(localStorage.getItem(IDEA_KEY) || '[]'); return Array.isArray(a) ? a : []; } catch (_) { return []; } }
function renderIdeas() {
  const ul = $('ideaList'); ul.innerHTML = '';
  loadIdeas().slice().reverse().forEach(it => { const li = document.createElement('li'); li.textContent = '💡 ' + (it.text || it); ul.appendChild(li); });
}
function saveIdea() {
  const v = $('idea').value.trim(); if (!v) { $('ideaMsg').textContent = '✏️ Type an idea first!'; return; }
  const a = loadIdeas(); a.push({ text: v.slice(0, 160), when: new Date().toISOString().slice(0, 10) });
  try { localStorage.setItem(IDEA_KEY, JSON.stringify(a)); $('ideaMsg').textContent = '✅ Saved! Great idea for the real game!'; } catch (_) { $('ideaMsg').textContent = 'Oops, could not save.'; }
  $('idea').value = ''; renderIdeas();
}
// ---------- start it up ----------
let ready = false, t0 = performance.now();
function loop() {
  tick();
  if (ready) {
    if (state === 'start') { const s = (performance.now() - t0) / 1000; prepFrame(); sTitle(2.5 + (s % 5.5), BAR * 4); renderer.render(scene, camera); X.fillStyle = 'rgba(0,0,0,.25)'; X.fillRect(0, 0, W, H); }
    else drawFrame(Math.min(T, TOTAL - .001));
  }
  requestAnimationFrame(loop);
}
function init() {
  fit(); addEventListener('resize', fit);
  ready = true; $('playBig').disabled = false; $('playBig').textContent = '▶ PLAY';
  $('playBig').addEventListener('click', () => { if (!ready) return; $('start').style.display = 'none'; startAt(0); });
  $('bPlay').addEventListener('click', e => { e.stopPropagation(); toggle(); });
  $('bReplay').addEventListener('click', e => { e.stopPropagation(); replay(); });
  $('bSkip').addEventListener('click', e => { e.stopPropagation(); skip(); });
  $('vol').addEventListener('input', e => { trailerVol = clamp(+e.target.value / 100, 0, 1); setVolume(); poke(); });
  $('bar').addEventListener('click', e => { e.stopPropagation(); poke(); });
  ov.addEventListener('click', () => { if (state === 'play' || state === 'pause') toggle(); });
  $('pauseNote').addEventListener('click', () => { if (state === 'pause') toggle(); });
  $('bAgain').addEventListener('click', replay);
  $('ideaSave').addEventListener('click', saveIdea);
  $('idea').addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { e.preventDefault(); saveIdea(); } });
  addEventListener('keydown', e => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) return;
    if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (state === 'start' && ready) $('playBig').click(); else if (state === 'end') replay(); else toggle(); }
    else if (e.key === 'ArrowRight') skip();
    poke();
  });
  addEventListener('pointerdown', () => { wakeAudio(); poke(); }, true);
  document.addEventListener('visibilitychange', () => { if (document.hidden) pause(); });
  setInterval(() => { tick(); }, 50);                    // keeps the music booked even if the pictures slow down
  requestAnimationFrame(loop);
}
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
</script>
