<script>
// MINI ROBO'S BIG ADVENTURE
// Mini Robo has always lived in the bottom-left corner of the Game Factory book. One day he hops off the page for his OWN
// big adventure through the house, as a TINY robot in a GIANT world: The Desk, The Kitchen, The Toy Box, The Backyard
// and The Bookshelf (2 levels each + a silly mini boss; the last one is the sneaky window draft).
// Moves: DOUBLE JUMP, HOVER (hold JUMP in the air: his antenna spins like a propeller) and the CORNER WAVE (X near a friend).
// Collect BUTTONS and 3 hidden STICKERS per level. Saves: localStorage 'miniRoboSave'. Trophies: miniRobo, miniRoboStickers.
const C = document.getElementById('game'), ctx = C.getContext('2d');
const W = 960, H = 520, T = 40, ROWS = 13;
const GRAV = 0.55, SPEED = 4.2, JUMP = 11.6, DJUMP = 10.2, MAXFALL = 12, HOVER_FALL = 1.5, HOVER_MAX = 55, HOVER_SPEED = 2.6;
const PW = 24, PH = 34, START_HP = 4, STICKERS = 3;
let frame = 0, state = 'title', keys = {}, press = {}, tap = null, particles = [], banner = '', bannerT = 0, shake = 0, flashT = 0;
const NAME = () => { try { return window.GF_NAME || localStorage.getItem('gfPlayerName') || 'Ben'; } catch (_) { return 'Ben'; } };
function trophy(id) { if (window.JUKEBOX) return; try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }
const SAVE_KEY = 'miniRoboSave';
function freshSave() { return { done: {}, stickers: {}, buttons: {}, seen: {}, music: true, won: 0 }; }
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && typeof s === 'object' && s.done) return Object.assign(freshSave(), s); } catch (_) {}
  return freshSave();
}
let save = loadSave();
function writeSave() { if (window.JUKEBOX) return; try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (_) {} }

// ---------- 🎨 little drawing helpers ----------
function rrect(x, y, w, h, r) {
  ctx.beginPath(); r = Math.max(0, Math.min(r, w / 2, h / 2));
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function roundRect(x, y, w, h, r, fill) { rrect(x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function text(str, x, y, size, color = '#fff', align = 'center', font = '"Trebuchet MS", "Arial Rounded MT Bold", Arial') {
  ctx.font = `bold ${size}px ${font}`; ctx.textAlign = align; ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function outText(str, x, y, size, color, edge = '#1a2540', align = 'center') {
  ctx.font = `bold ${size}px "Trebuchet MS", Arial`; ctx.textAlign = align; ctx.lineJoin = 'round';
  ctx.strokeStyle = edge; ctx.lineWidth = Math.max(3, size / 6); ctx.strokeText(str, x, y); ctx.fillStyle = color; ctx.fillText(str, x, y);
}
function circle(x, y, r, fill) { ctx.fillStyle = fill; ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, 7); ctx.fill(); }
function ellipse(x, y, rx, ry, fill, rot = 0) { ctx.fillStyle = fill; ctx.beginPath(); ctx.ellipse(x, y, Math.max(0, rx), Math.max(0, ry), rot, 0, 7); ctx.fill(); }
function poly(pts, c, stroke, lw) {
  ctx.beginPath(); ctx.moveTo(pts[0], pts[1]); for (let i = 2; i < pts.length; i += 2) ctx.lineTo(pts[i], pts[i + 1]); ctx.closePath();
  if (c) { ctx.fillStyle = c; ctx.fill(); } if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}
function star(x, y, r, fill, rot = 0, pts = 5, inner = 0.48) {
  ctx.fillStyle = fill; ctx.beginPath();
  for (let i = 0; i < pts * 2; i++) { const a = -Math.PI / 2 + rot + i * Math.PI / pts, rr = i % 2 ? r * inner : r; ctx.lineTo(x + Math.cos(a) * rr, y + Math.sin(a) * rr); }
  ctx.closePath(); ctx.fill();
}
function heartPath(x, y, s) {
  ctx.beginPath(); ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.6, y - s * 0.2, x - s * 0.7, y - s * 1.4, x, y - s * 0.5);
  ctx.bezierCurveTo(x + s * 0.7, y - s * 1.4, x + s * 1.6, y - s * 0.2, x, y + s * 0.9); ctx.closePath();
}
function heart(x, y, s, fill = '#ff5c8a') { heartPath(x, y, s); ctx.fillStyle = fill; ctx.fill(); }
function limb(x1, y1, x2, y2, col, w) { ctx.strokeStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); }
function wrapText(str, max) { const out = []; let ln = ''; for (const wd of str.split(' ')) { if ((ln + wd).length > max) { out.push(ln.trim()); ln = ''; } ln += wd + ' '; } out.push(ln.trim()); return out; }
function emoji(e, x, y, size) { ctx.font = `${size}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`; ctx.textAlign = 'center'; ctx.fillStyle = '#000'; ctx.fillText(e, x, y); }

// ---------- 🤖 MINI ROBO: drawn with the EXACT shapes of the little buddy in the book's corner (arcade.html BUDDY_SVG, daytime look) ----------
// (x, gy) = the bottom of his round body, s = size (1 = the SVG's own units, the book shows him at about 0.58).
// o.face = 1 / -1, o.blink, o.wave (right arm angle, the book waves to -55°), o.prop (propeller spin), o.hat (explorer hat), o.squash
const MP = { lArm: new Path2D('M-24 32 Q-38 38 -40 26'), rArm: new Path2D('M24 32 Q38 38 40 26'), shut: new Path2D('M-14 0 q5 4 10 0 M4 0 q5 4 10 0'), smile: new Path2D('M-6 19 q6 5 12 0') };
function drawMini(x, gy, s, o = {}) {
  const sq = o.squash || 1, f = o.face || 1;
  ctx.save(); ctx.translate(x, gy); if (o.rot) ctx.rotate(o.rot); ctx.scale(s * f / sq, s * sq); ctx.translate(0, -54);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  const antenna = () => {
    ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(0, -31); ctx.lineTo(0, -41); ctx.stroke();
    circle(0, -44, 4.5, '#ff5252');
    if (o.prop !== undefined) {                          // 🌀 the antenna becomes a little propeller
      const w = Math.cos(o.prop) * 17, w2 = Math.sin(o.prop) * 17;
      ellipse(0, -50, Math.abs(w) + 1.5, 3.2, 'rgba(255,215,64,.95)'); ellipse(0, -50, Math.abs(w2) + 1.5, 3.2, 'rgba(255,171,64,.8)');
      circle(0, -50, 2.6, '#ff8a65');
    }
  };
  if (!o.hat) antenna();
  ctx.strokeStyle = '#e3e9f2'; ctx.lineWidth = 8; ctx.stroke(MP.lArm);
  ctx.save(); if (o.wave) { ctx.translate(22, 36); ctx.rotate(o.wave); ctx.translate(-22, -36); } ctx.stroke(MP.rArm); ctx.restore();
  ctx.beginPath(); ctx.ellipse(0, 38, 21, 16, 0, 0, 7); ctx.fillStyle = '#f4f7fb'; ctx.fill(); ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 2; ctx.stroke();
  circle(0, 38, 4.5, '#2979ff');
  circle(-33, 0, 8, '#2979ff'); circle(33, 0, 8, '#2979ff');
  ctx.beginPath(); ctx.arc(0, 0, 31, 0, 7); ctx.fillStyle = '#f4f7fb'; ctx.fill(); ctx.strokeStyle = '#b0bec5'; ctx.lineWidth = 2; ctx.stroke();
  roundRect(-23, -14, 46, 26, 13, '#1d2836');
  if (o.blink) { ctx.strokeStyle = '#40c4ff'; ctx.lineWidth = 2.5; ctx.stroke(MP.shut); }
  else { ellipse(-9, -1, 5, 6, '#40c4ff'); ellipse(9, -1, 5, 6, '#40c4ff'); circle(-7.5, -3.5, 1.6, '#fff'); circle(10.5, -3.5, 1.6, '#fff'); }
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 2.5; ctx.stroke(MP.smile);
  ctx.globalAlpha = 0.5; circle(-19, 17, 3.5, '#ff80ab'); circle(19, 17, 3.5, '#ff80ab'); ctx.globalAlpha = 1;
  if (o.hat) {                                           // 🧢 his tiny EXPLORER HAT (a safari pith helmet), antenna poking out the top
    ellipse(0, -24, 40, 8, '#a1887f'); ellipse(0, -25, 38, 6.5, '#d7b98e');
    ctx.beginPath(); ctx.ellipse(0, -26, 27, 24, 0, Math.PI, 0); ctx.fillStyle = '#e6c99a'; ctx.fill(); ctx.strokeStyle = '#a1887f'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#6d4c41'; ctx.fillRect(-27, -33, 54, 6);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, -26, 18, Math.PI * 1.15, Math.PI * 1.45); ctx.stroke();
    circle(0, -50, 3, '#a1887f');
    ctx.save(); ctx.translate(0, -8); antenna(); ctx.restore();
  }
  ctx.restore();
}

// ---------- 🤖🎀 ROBO + PINK ROBO (the same shapes as in the Robo Jump games). (x, gy) = middle of the feet, s = size ----------
const PAL_ROBO = { head: '#ffffff', body: '#f5f7ff', visor: '#111827', eye: '#40c4ff', legs: '#3d5afe', pod: '#2979ff' };
const PAL_PINK = { head: '#f8bbd0', body: '#fce4ec', visor: '#4a148c', eye: '#ff80ab', legs: '#ec407a', pod: '#f06292', pink: true };
function drawRobo(x, gy, s, o = {}) {
  const pal = o.pink ? PAL_PINK : PAL_ROBO, face = o.face || 1, w = 30 * s, h = 40 * s, es = s;
  const bob = o.happy ? -Math.abs(Math.sin(frame * 0.2)) * 6 * s : 0, X = x - w / 2, Y = gy - h + bob;
  if (o.jets) { ctx.fillStyle = o.pink ? '#ff80ab' : '#7df9ff'; for (const fx of [X + w * 0.23, X + w * 0.77]) { const f = (8 + Math.sin(frame * 0.9 + fx) * 4) * s; ctx.beginPath(); ctx.moveTo(fx - 4 * s, Y + h); ctx.lineTo(fx, Y + h + f); ctx.lineTo(fx + 4 * s, Y + h); ctx.fill(); } }
  ctx.fillStyle = pal.legs; ctx.fillRect(X + 4 * es, Y + h - 7 * es, 8 * es, 7 * es); ctx.fillRect(X + w - 12 * es, Y + h - 7 * es, 8 * es, 7 * es);
  roundRect(X + 2, Y + h * 0.5, w - 4, h * 0.4, 6 * es, pal.body);
  if (!o.pink) circle(X + w / 2, Y + h * 0.7, 3 * es, pal.pod);
  roundRect(X - 5 * es, Y + h * 0.3 - 3, 6 * es, 9 * es, 3, pal.pod); roundRect(X + w - 1 * es, Y + h * 0.3 - 3, 6 * es, 9 * es, 3, pal.pod);
  roundRect(X - 2, Y, w + 4, h * 0.55, 12 * es, pal.head); roundRect(X + 2, Y + 4, w - 4, h * 0.55 - 9 * es, 9 * es, pal.visor);
  const ex = X + w / 2 + face * 3 * es, ey = Y + h * 0.27, blink = (frame + x) % 180 < 6 ? 1 : 5 * es;
  ctx.fillStyle = pal.eye; ctx.beginPath(); ctx.ellipse(ex - 6 * es, ey, 3.5 * es, blink, 0, 0, 7); ctx.ellipse(ex + 6 * es, ey, 3.5 * es, blink, 0, 0, 7); ctx.fill();
  if (o.pink) {
    ctx.strokeStyle = '#4a148c'; ctx.lineWidth = Math.max(1, 1.3 * es);
    for (const d of [-1, 1]) for (const k of [-1, 0, 1]) { ctx.beginPath(); ctx.moveTo(ex + d * 6 * es + k * 2 * es, ey - 4 * es); ctx.lineTo(ex + d * 6 * es + k * 3 * es, ey - 7 * es); ctx.stroke(); }
    heart(X + w / 2, Y + h * 0.69, 4.5 * es, '#ff4081');
    const bx = X + w - 5 * es, by = Y + 1 * es;
    poly([bx, by, bx - 11 * s, by - 8 * s, bx - 11 * s, by + 8 * s], '#ff4081', '#c2185b', 1.2); poly([bx, by, bx + 11 * s, by - 8 * s, bx + 11 * s, by + 8 * s], '#ff4081', '#c2185b', 1.2);
    circle(bx, by, 3.2 * s, '#f50057');
  } else { limb(X + w / 2, Y, X + w / 2, Y - 7 * s, '#b0bec5', 2 * s); circle(X + w / 2, Y - 8 * s, 3 * s, '#ff5252'); }
}
// ----- 🧹 DUSTY (she): teal dome, orange stripe, one big green eye, a fluffy pink duster, a twirly brush skirt. (x, y) = her wheels -----
function drawDusty(x, y, o = {}) {
  const s = o.s || 2, f = o.face || 1, t = frame, roll = o.pose === 'sweep' || o.pose === 'run';
  let bob = roll ? Math.sin(t * 0.5) * 0.6 : Math.sin(t * 0.07) * 0.5; if (o.pose === 'happy') bob = -Math.abs(Math.sin(t * 0.3)) * 4;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s); ctx.translate(0, bob); ctx.lineCap = 'round';
  circle(-8, -3, 3.2, '#37474f'); circle(8, -3, 3.2, '#37474f'); circle(-8, -3, 1.2, '#90a4ae'); circle(8, -3, 1.2, '#90a4ae');
  ellipse(0, -5, 15, 3.5, '#ffcc80');
  ctx.strokeStyle = '#ffb74d'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let i = 0; i < 10; i++) { const a = i * 0.63 + (roll ? t * 0.4 : 0), bx = Math.cos(a) * 14; ctx.moveTo(bx, -5); ctx.lineTo(bx * 1.12, -2.5); } ctx.stroke();
  roundRect(-13, -26, 26, 22, 11, '#4dd0e1'); ellipse(-6, -22, 4, 2, 'rgba(255,255,255,.55)', -0.4);
  roundRect(-13, -11, 26, 4, 2, '#ff8a65'); roundRect(-8, -22, 16, 9, 4, '#102027');
  if (o.pose === 'happy') heart(1, -16, 3.6, '#ff80ab');
  else { const bl = (t % 170) < 6 ? 0.5 : 3; ellipse(1.5, -17.5, 3, bl, '#b2ff59'); if (bl > 1) circle(2.5, -18.8, 0.9, '#fff'); }
  circle(-9, -12.8, 1.5, 'rgba(255,128,171,.8)'); circle(11, -12.8, 1.5, 'rgba(255,128,171,.8)');
  const sw = o.pose === 'sweep' ? Math.sin(t * 0.25) * 0.6 : Math.sin(t * 0.1) * 0.12;
  ctx.save(); ctx.translate(0, -26); ctx.rotate(sw);
  ctx.strokeStyle = '#90a4ae'; ctx.lineWidth = 1.2; ctx.beginPath(); ctx.moveTo(0, 0); for (let i = 1; i <= 6; i++) ctx.lineTo(i % 2 ? -1.5 : 1.5, -i * 1.3); ctx.stroke();
  for (const [dx, dy, r] of [[0, -11, 3.4], [-3, -9, 2.6], [3, -9, 2.6], [-2, -13, 2.4], [2, -13, 2.4], [0, -14.5, 2]]) circle(dx, dy, r, '#f48fb1');
  circle(-1, -12, 1.2, '#fce4ec'); ctx.restore(); ctx.restore();
}
// ----- 🐶 SPARKS: a LONG yellow robot dog, purple from the eyes up, purple ears/back/tail, no collar,
// and a big side window with CHARLIE (a white cat, blue where Sparks is purple) and AUGUST (a fluffy dark-blue Maine Coon) -----
function drawSparks(x, y, o = {}) {
  const s = o.s || 1, t = frame, pose = o.pose || 'idle', f = o.face || 1;
  const w = 40, h = 34, GL = '#f4b942', GD = '#c98e2a', PU = '#8e5bd6', PD = '#6a3fb5';
  ctx.save(); ctx.translate(x, y); ellipse(0, 0, 34 * s, 5 * s, 'rgba(0,0,0,.18)');
  let bob = 0; if (pose === 'happy') bob = -Math.abs(Math.sin(t * 0.22)) * 10; if (pose === 'run') bob = -Math.abs(Math.sin(t * 0.4)) * 3;
  ctx.translate(0, bob * s); ctx.scale(s, s);
  const X = -w / 2, Y = -h, run = pose === 'run' ? Math.sin(t * 0.5) * 3 : 0, bx = X - 7, bw = w + 14;
  ctx.fillStyle = GD;
  ctx.fillRect(bx + 6 + run, Y + h - 9, 6, 9); ctx.fillRect(bx + 15 - run, Y + h - 9, 6, 9); ctx.fillRect(bx + bw - 21 - run, Y + h - 9, 6, 9); ctx.fillRect(bx + bw - 12 + run, Y + h - 9, 6, 9);
  const back = f > 0 ? bx + 3 : bx + bw - 3, wag = pose === 'happy' ? 0.8 : 0.4;
  limb(back, Y + h * 0.4, back - f * 9, Y + h * 0.1 + Math.sin(t * wag) * 4, PD, 5);
  roundRect(bx, Y + h * 0.26, bw, h * 0.52, 9, GL);
  ctx.save(); rrect(bx, Y + h * 0.26, bw, h * 0.52, 9); ctx.clip(); ctx.fillStyle = PU; ctx.fillRect(bx, Y + h * 0.26, bw, h * 0.15); ctx.restore();
  const wx = bx + bw / 2 - f * 9, wy = Y + h * 0.55;
  ellipse(wx, wy, 11.5, 8.5, '#263238'); ellipse(wx, wy, 10, 7, '#b3e5fc');
  for (const [cx, col, ear] of [[wx - 4.5, '#ffffff', '#64b5f6'], [wx + 4.5, '#283593', '#1a237e']]) {
    const hb = Math.sin(t * 0.1 + cx) * 0.6;
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(cx, wy + 2 + hb, 3.8, 0, 7); ctx.fill();
    ctx.fillStyle = ear; ctx.beginPath(); ctx.moveTo(cx - 3.6, wy + 0.5 + hb); ctx.lineTo(cx - 2.8, wy - 4 + hb); ctx.lineTo(cx - 0.6, wy - 1 + hb); ctx.fill();
    ctx.beginPath(); ctx.moveTo(cx + 3.6, wy + 0.5 + hb); ctx.lineTo(cx + 2.8, wy - 4 + hb); ctx.lineTo(cx + 0.6, wy - 1 + hb); ctx.fill();
    ctx.fillStyle = col === '#ffffff' ? '#000' : '#ffd740'; ctx.fillRect(cx - 2, wy + 1.2 + hb, 1.2, 1.4); ctx.fillRect(cx + 0.8, wy + 1.2 + hb, 1.2, 1.4);
  }
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(wx - 7, wy - 5, 4, 1.5);
  const hx = f > 0 ? bx + bw - 14 : bx + 14, hy = Y;
  roundRect(hx - 11, hy - 1, 22, 19, 7, GL); roundRect(hx - 6 + f * 6, hy + 8, 12, 9, 4, GL);
  ctx.save(); rrect(hx - 11, hy - 1, 22, 19, 7); ctx.clip(); ctx.fillStyle = PU; ctx.fillRect(hx - 11, hy - 1, 22, 8); ctx.restore();
  if (pose === 'happy') { ctx.strokeStyle = '#000'; ctx.lineWidth = 1.6; ctx.beginPath(); ctx.arc(hx + f * 2, hy + 8, 2.6, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
  else { circle(hx + f * 2, hy + 7, 3.2, '#fff'); circle(hx + f * 2.8, hy + 7, 1.9, '#000'); }
  circle(hx + f * 13, hy + 10, 3, '#000');
  if (pose === 'happy' || pose === 'run') ellipse(hx + f * 8, hy + 17, 3, 3.5, '#ff6f91');
  ctx.fillStyle = PD; ctx.beginPath(); ctx.ellipse(hx - f * 6, hy + 7, 4.2, 10.5, f * 0.25 + (pose === 'run' ? -f * 0.5 : 0), 0, 7); ctx.fill();
  ctx.restore();
}
// ----- 🐱 SAMMY: Ben's real cat. A gray-brown tabby with black stripes, a cream chin and yellow eyes. (x, y) = between the paws -----
const FUR = '#8d7b68', STRIPE = '#2b241f', CREAM = '#efe3cf';
function drawSammy(x, y, o = {}) {
  const s = o.s || 1, f = o.face || 1, t = frame;
  ctx.save(); ctx.translate(x, y); ctx.scale(s * f, s);
  ellipse(0, 0, 26, 4, 'rgba(0,0,0,.18)');
  ctx.strokeStyle = FUR; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(-16, -6); ctx.quadraticCurveTo(-34, -14 + Math.sin(t * 0.08) * 4, -26, -34); ctx.stroke();
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 2; for (const k of [0.35, 0.65]) { ctx.beginPath(); ctx.arc(-26 - k * 4, -14 - k * 16, 3.5, 0, 3); ctx.stroke(); }
  ellipse(0, -16, 18, 17, FUR); ellipse(4, -10, 8, 10, CREAM);
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 2.4; for (const k of [-10, -4, 2]) { ctx.beginPath(); ctx.moveTo(k - 6, -28); ctx.quadraticCurveTo(k - 2, -22, k - 6, -16); ctx.stroke(); }
  ellipse(-6, -1, 6, 3.5, FUR); ellipse(8, -1, 6, 3.5, FUR);
  const hy = -40 + (o.pose === 'happy' ? -Math.abs(Math.sin(t * 0.2)) * 4 : 0);
  poly([-12, hy - 6, -10, hy - 22, -2, hy - 11], FUR); poly([12, hy - 6, 10, hy - 22, 2, hy - 11], FUR);
  poly([-9.5, hy - 9, -9, hy - 17, -4.5, hy - 11], '#f8bbd0'); poly([9.5, hy - 9, 9, hy - 17, 4.5, hy - 11], '#f8bbd0');
  ellipse(0, hy, 14, 12, FUR);
  ctx.strokeStyle = STRIPE; ctx.lineWidth = 2; for (const k of [-4, 0, 4]) { ctx.beginPath(); ctx.moveTo(k, hy - 11); ctx.lineTo(k, hy - 6); ctx.stroke(); }
  ellipse(0, hy + 6, 7, 5, CREAM);
  for (const d of [-1, 1]) {
    if (t % 200 < 7 || o.pose === 'happy') { ctx.strokeStyle = STRIPE; ctx.lineWidth = 1.8; ctx.beginPath(); ctx.arc(d * 6, hy, 3, Math.PI * 1.1, Math.PI * 1.9); ctx.stroke(); }
    else { ellipse(d * 6, hy, 3.6, 4, '#ffd54f'); ellipse(d * 6, hy, 1.2, 3.2, '#1b1b1b'); circle(d * 6 + 1, hy - 1.5, 0.9, '#fff'); }
  }
  poly([-1.8, hy + 4, 1.8, hy + 4, 0, hy + 6], '#f48fb1');
  ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 0.8; for (const d of [-1, 1]) for (const k of [-1, 1]) { ctx.beginPath(); ctx.moveTo(d * 5, hy + 6); ctx.lineTo(d * 16, hy + 5 + k * 3); ctx.stroke(); }
  ctx.restore();
}

// ---------- 🏁 TITLE ----------
const PLAY_BTN = { x: W / 2 - 130, y: 392, w: 260, h: 64 }, NEW_BTN = { x: W - 220, y: 440, w: 196, h: 48 }, YES_BTN = { x: W / 2 - 200, y: 300, w: 180, h: 60 }, NO_BTN = { x: W / 2 + 20, y: 300, w: 180, h: 60 };
let askNew = false;

  if (!actx && frame % 60 < 40) text('🔊 tap or press a key for sound', W / 2, 480, 15, '#6d4c41');
  if (askNew) { ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fillRect(0, 0, W, H); roundRect(W / 2 - 260, 170, 520, 220, 24, '#fffdf6'); text('Start a brand NEW adventure?', W / 2, 230, 26, '#4e342e'); text('(your stickers stay safe!)', W / 2, 266, 18, '#8d6e63');
    roundRect(YES_BTN.x, YES_BTN.y, YES_BTN.w, YES_BTN.h, 18, '#66bb6a'); text('YES', YES_BTN.x + 90, YES_BTN.y + 40, 24); roundRect(NO_BTN.x, NO_BTN.y, NO_BTN.w, NO_BTN.h, 18, '#ef5350'); text('NO', NO_BTN.x + 90, NO_BTN.y + 40, 24); }
}
// ---------- 🔀 going between screens ----------
let clearInfo = null, creditT = 0;
function toMap(sel, msg) { state = 'map'; mapSel = sel === undefined ? firstOpen() : sel; setSong('main'); if (msg) say1(msg, 200); }
function startNode(i) {
  if (!nodeOpen(i)) { say1('🔒 Finish the one before it first!', 90); sfx.click(); return; }
  const n = NODES[i]; curNode = i; sfx.click();
  if (n.kind === 'boss') { say('boss' + n.w, () => startBoss(i)); return; }
  const go = () => startLevel(i);
  if (i === 0) say('intro', () => say('w0', go)); else if (n.lv === 0) say('w' + n.w, go); else go();
}
function startLevel(i) {
  const n = NODES[i]; curNode = i; buildLevel(n.w, n.lv); P = newPlayer(L.start.x, L.start.y); camX = 0; particles = [];
  G.hat = !!save.won; state = 'play'; setSong(WORLDS[n.w].song); say1(WORLDS[n.w].icon + ' ' + L.name, 150);
}
function startBoss(i) { curNode = i; buildArena(NODES[i].boss); G.hat = !!save.won; camX = 0; particles = []; state = 'boss'; setSong(NODES[i].boss === 'draft' ? 'final' : 'boss'); say1(BOSS_NAMES[NODES[i].boss] + '!', 150); }
function clearNode(i) {

  clearInfo = { i, t: 0, first, stk: G.stk, btn: G.btn, of: L.btnCount }; state = 'clear'; setSong('ending');
}
function trophyCheck() { if (save.won) trophy('miniRobo'); if (stickerCount() >= TOTAL_STICKERS) trophy('miniRoboStickers'); }
function afterClear() {
  const i = clearInfo.i, n = NODES[i]; clearInfo = null;
  if (n.kind === 'boss') {
    if (i === LAST) { save.won = 1; writeSave(); trophyCheck(); say('ending', startCredits, true); return; }

  }

}
function startCredits() { state = 'credits'; creditT = 0; setSong('ending'); }
const CREDITS = () => ["MINI ROBO'S BIG ADVENTURE", '', 'Starring MINI ROBO', '(from the corner of the Game Factory book)', '', 'with ROBO, PINK ROBO, SPARKS,', 'DUSTY, SAMMY and THE ANTS',
  '', 'Silly bosses:', 'The Grumpy Vacuum • The Bouncy Basketball', 'The Runaway Yarn Ball • The Sneaky Window Draft', '', 'Made for ' + NAME() + '!', '', 'Thank you for playing!', '👋 See you in the corner!'];
function drawClear() {
  const c = clearInfo, n = NODES[c.i]; drawSky(n.w, frame); ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(0, 0, W, H);
  roundRect(W / 2 - 300, 70, 600, 380, 30, '#fffdf6');
  outText(n.kind === 'boss' ? '🎉 BOSS CALMED DOWN!' : '🎉 LEVEL CLEAR!', W / 2, 140, 42, '#ffd740', '#4e342e');
  drawMini(W / 2 - 200, 400, 1, { wave: -0.96 * Math.abs(Math.sin(frame * 0.15)), blink: frame % 200 < 7, hat: !!save.won });
  if (n.kind === 'level') {
    text('Buttons: ' + c.btn, W / 2 + 60, 210, 26, '#4e342e');
    text('Stickers:', W / 2 + 60, 262, 24, '#4e342e');
    for (let s = 0; s < 3; s++) { const sx = W / 2 - 20 + s * 80, has = c.stk & (1 << s); circle(sx, 320, 30, has ? '#fff59d' : '#eeeeee'); if (has) emoji(STICKER_ART[(c.i * 3 + s) % 30], sx, 334, 36); else text('?', sx, 332, 30, '#bdbdbd'); }
  } else text('It\'s happy now! 😊', W / 2 + 60, 260, 28, '#4e342e');
  if (c.t > 50 && frame % 50 < 36) text('▶ JUMP / tap', W / 2, 430, 20, '#8d6e63');
}
function drawCredits() {
  drawBookPage(); ctx.fillStyle = 'rgba(26,37,64,.82)'; ctx.fillRect(0, 0, W, H);
  drawMini(150, 470, 1, { hat: true, wave: -0.96 * Math.abs(Math.sin(frame * 0.12)), blink: frame % 200 < 7 });
  CREDITS().forEach((l, k) => { const y = H + 40 + k * 44 - creditT * 0.9; if (y > -30 && y < H + 30) text(l, W / 2 + 60, y, k === 0 ? 34 : 24, k === 0 ? '#ffd740' : '#fff'); });
}
function updateCredits() { creditT++; const end = (CREDITS().length * 44 + H + 120) / 0.9; if (creditT > end || (creditT > 90 && (press.jump || press.enter || tap || press.esc))) { tap = null; toMap(LAST, '🧢 Mini Robo is home in his corner, wearing his explorer hat!'); } }

// ---------- 🎮 keys, taps and the main loop ----------
addEventListener('keydown', e => {
  wakeAudio();
  const k = e.key, rep = e.repeat;
  if (k === ' ' || k.startsWith('Arrow')) { if (e.preventDefault) e.preventDefault(); }
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = true; if (!rep) press.l = true; }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = true; if (!rep) press.r = true; }
  if (k === 'ArrowDown' || k === 's' || k === 'S') { keys.down = true; if (!rep) press.d = true; }
  if (k === 'ArrowUp' || k === 'w' || k === 'W') { keys.up = true; if (!rep) press.u = true; }
  const upJumps = (state === 'play' || state === 'boss') && !(G && G.B && G.B.st === 'puzzle');
  if (k === ' ' || (upJumps && (k === 'ArrowUp' || k === 'w' || k === 'W'))) { if (!keys.jump) press.jump = true; keys.jump = true; }
  if ((k === 'x' || k === 'X') && !rep) press.x = true;
  if ((k === 'n' || k === 'N') && !rep) press.n = true;
  if (k === 'Enter') press.enter = true;
  if (k === 'Escape') press.esc = true;
  if ((k === 'm' || k === 'M') && !rep) toggleMusic();
});
addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') keys.right = false;
  if (k === 'ArrowDown' || k === 's' || k === 'S') keys.down = false;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') keys.up = false;
  if (k === ' ' || k === 'ArrowUp' || k === 'w' || k === 'W') keys.jump = false;
});
C.addEventListener('mousedown', e => { wakeAudio(); const r = C.getBoundingClientRect(); tap = { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; });
const inBox = (t, b) => !!t && t.x >= b.x && t.x <= b.x + b.w && t.y >= b.y && t.y <= b.y + b.h;
function goBack() { hush(); try { parent.closeGame && parent.closeGame(); } catch (_) {} }
function playInput() {
  let d = -1; if (press.u) d = 0; else if (press.r) d = 1; else if (press.d) d = 2; else if (press.l) d = 3;
  if (G.B && G.B.st === 'puzzle' && tap) PUZ_BTNS.forEach((b, i) => { if (inBox(tap, b)) d = i; });
  return { l: !!keys.left, r: !!keys.right, j: !!keys.jump, jp: !!press.jump, w: !!press.x, d };
}
function stepGame(inp) { stepPlay(inp); if (G.B && !G.done) stepBoss(inp); }
function updatePlay() {
  if (inBox(tap, BACK_BTN) || press.esc) { tap = null; sfx.click(); hush(); toMap(curNode); return; }
  stepGame(playInput());
  if (G.B) { camX = 0; if (G.done) clearNode(curNode); return; }
  const tx = Math.max(0, Math.min(L.cols * T - W, P.x - W * 0.4)); camX += (tx - camX) * 0.15;
  const s = L.signs.find(q => Math.abs(q.x - P.x - PW / 2) < 50); if (s) { signText = s.text; signT = 30; } else if (signT > 0) signT--;
  if (G.done) clearNode(curNode);
}
function updateTitle() {
  setSong('main');
  if (askNew) {
    if (inBox(tap, YES_BTN) || press.enter) { const keep = { stickers: save.stickers, music: save.music, won: save.won }; save = Object.assign(freshSave(), keep); writeSave(); askNew = false; sfx.click(); }
    else if (inBox(tap, NO_BTN) || press.esc) { askNew = false; sfx.click(); }
    return;
  }
  if (hasProgress() && (inBox(tap, NEW_BTN) || press.n)) { askNew = true; sfx.click(); return; }
  if (press.jump || press.enter || inBox(tap, PLAY_BTN)) { sfx.click(); toMap(firstOpen()); }
  else if (press.esc || inBox(tap, BACK_BTN)) goBack();
}
function updateMap() {
  if (press.esc || inBox(tap, BACK_BTN)) { sfx.click(); state = 'title'; return; }
  let s = mapSel; if (press.r || press.u) s++; if (press.l || press.d) s--;
  s = Math.max(0, Math.min(LAST, s)); if (s !== mapSel && nodeOpen(s)) { mapSel = s; sfx.click(); }
  if (tap) for (let i = 0; i <= LAST; i++) { const q = mapNode(i); if (Math.hypot(tap.x - q.x, tap.y - q.y) < 32) { mapSel = i; startNode(i); return; } }
  if (press.jump || press.enter || press.x) startNode(mapSel);
}
function update() {
  frame++;
  if (bannerT > 0) bannerT--; if (shake > 0) shake--; if (flashT > 0) flashT--;

  particles = particles.filter(q => q.life > 0); if (particles.length > 300) particles.splice(0, particles.length - 300);

  if (state === 'title') updateTitle();
  else if (state === 'map') updateMap();
  else if (state === 'talk') updateTalk();
  else if (state === 'play' || state === 'boss') updatePlay();
  else if (state === 'clear') { clearInfo.t++; if (clearInfo.t > 50 && (press.jump || press.enter || press.x || tap)) { tap = null; afterClear(); } }
  else if (state === 'credits') updateCredits();
  for (const k in press) press[k] = false;
  tap = null;
}
function draw() {
  ctx.save(); if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  if (state === 'title') drawTitle();
  else if (state === 'map') drawMap();
  else if (state === 'talk') drawTalk();
  else if (state === 'play') { drawLevel(); drawHUD(L.name); if (signT > 0) { roundRect(110, 64, W - 220, 50, 16, 'rgba(255,255,255,.94)'); text(signText, W / 2, 96, 18, '#311b92'); } }
  else if (state === 'boss') { drawBossArena(); drawHUD(BOSS_NAMES[G.B.kind], true); }
  else if (state === 'clear') drawClear();

}
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  try { while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; } playMusic(); draw(); }
  catch (err) { acc = 0; try { console.error(err); } catch (_) {} }

if (window.JUKEBOX) window.JUKEBOX.start = window.JUKEBOX.start || function () { wakeAudio(); };

</script>
