<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🤖 The 100,000 Emoji Robo</title>
<script src="touchpad.js?v=11"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1033; }
  body { font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif; color: #fff;
    user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  #cv { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; touch-action: none; cursor: grab; }
  #cv.drag { cursor: grabbing; }
  #top { position: fixed; top: 0; left: 0; right: 0; display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
    gap: 6px 14px; padding: 6px 10px; background: rgba(27, 16, 51, .82); border-bottom: 4px solid #b388ff; z-index: 5; pointer-events: none; }
  #top h1 { margin: 0; font-size: clamp(20px, 3vw, 34px); text-shadow: 3px 3px 0 #000; letter-spacing: 1px; text-align: center; }
  #rec { font-size: clamp(14px, 1.7vw, 19px); font-weight: bold; color: #ffe082; text-align: center; }
  #count { font-size: clamp(14px, 1.7vw, 19px); font-weight: bold; background: #fff; color: #2a1d4a; border-radius: 14px;
    padding: 3px 12px; border: 3px solid #2a1d4a; white-space: nowrap; }
  #count b { color: #d500f9; font-size: 1.15em; }
  .btn { font: inherit; font-size: 30px; font-weight: bold; border: 4px solid #2a1d4a; border-radius: 18px; background: #ffe082;
    cursor: pointer; box-shadow: 0 5px 0 #2a1d4a; color: #222; min-width: 64px; min-height: 64px; padding: 4px 10px; touch-action: manipulation; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1d4a; }
  #zoom { position: fixed; right: calc(12px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; gap: 10px; z-index: 6; }
  #zoom .btn { background: #b3e5fc; }
  #left { position: fixed; left: calc(12px + env(safe-area-inset-left)); bottom: calc(14px + env(safe-area-inset-bottom));
    display: flex; flex-direction: column; align-items: flex-start; gap: 8px; z-index: 6; max-width: calc(100vw - 120px); }
  #find { font-size: 24px; background: #ffab91; }
  #secrets { font-size: 18px; font-weight: bold; background: rgba(27, 16, 51, .85); border: 3px solid #b388ff; border-radius: 14px; padding: 4px 12px; }
  #hint { font-size: 18px; font-weight: bold; background: #fffbe8; color: #2a1d4a; border: 3px solid #2a1d4a; border-radius: 14px;
    padding: 6px 12px; max-width: 520px; }
  #help { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); font-size: 16px;
    font-weight: bold; background: rgba(27, 16, 51, .8); padding: 4px 12px; border-radius: 12px; pointer-events: none; z-index: 4; text-align: center; }
  #toast { position: fixed; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(0); background: #fffbe8; color: #2a1d4a;
    border: 6px solid #2a1d4a; border-radius: 26px; padding: 14px 26px; font-size: clamp(24px, 4vw, 44px); font-weight: bold;
    text-align: center; z-index: 9; pointer-events: none; transition: transform .25s cubic-bezier(.3, 1.6, .5, 1); box-shadow: 0 8px 0 #2a1d4a; }
  #toast.on { transform: translate(-50%, -50%) scale(1); }
  #toast small { display: block; font-size: .55em; margin-top: 4px; }
  .hide { display: none !important; }
  @media (max-width: 700px) { #help { display: none; } .btn { font-size: 26px; min-width: 56px; min-height: 56px; } #find { font-size: 20px; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="top">
  <h1>🤖 The 100,000 Emoji Robo</h1>
  <div id="rec">🏅 Ben's Game Factory record: 100,000 emojis!</div>
  <div id="count">🔢 <b id="total">…</b> emojis! · 👀 on screen: <span id="vis">…</span></div>
</div>
<div id="zoom">
  <button class="btn" id="zin" aria-label="Zoom in">➕</button>
  <button class="btn" id="zout" aria-label="Zoom out">➖</button>
  <button class="btn" id="home" aria-label="See all of Robo">🏠</button>
</div>
<div id="left">
  <div id="hint" class="hide"></div>
  <div id="secrets">Secrets: 🐱 ❓ &nbsp; 🧡 ❓</div>
  <button class="btn" id="find">🔍 Find a secret</button>
</div>
<div id="help">👆 Drag to look around · 🤏 pinch or ➕ to zoom in close!</div>
<div id="toast"></div>
<script>
// ===================== 🤖 The 100,000 Emoji Robo =====================
// The picture is a 400 x 250 grid = 100,000 emoji squares, built from shapes (rounded rectangles, ellipses, triangles)
// that copy Robo's real look from Robo Jump (platformer.html drawLook).
const W = 400, H = 250;
const PAL = ['🟪', '⬛', '⬜', '🟦', '🟩', '🩵', '🔵', '💎', '⭐', '✨', '🟨', '🟫', '🌼', '🌱', '🩶', '🐱', '🧡', '🌷'];
const E = {}; PAL.forEach((c, i) => { E[c] = i; });
const grid = new Uint8Array(W * H);          // one palette number per square
function trophy(id) { try { const t = JSON.parse(localStorage.getItem('gfTrophies') || '{}'); t[id] = 1; localStorage.setItem('gfTrophies', JSON.stringify(t)); } catch (_) {} }   // for the Trophy Room in the Game Factory book

// ---------- shape helpers (signed distance: < 0 inside, > 0 outside) ----------
function sdRR(px, py, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  const qx = Math.abs(px - (x + w / 2)) - w / 2 + r, qy = Math.abs(py - (y + h / 2)) - h / 2 + r;
  return Math.hypot(Math.max(qx, 0), Math.max(qy, 0)) + Math.min(Math.max(qx, qy), 0) - r;
}
function sdEl(px, py, cx, cy, rx, ry) { return (Math.hypot((px - cx) / rx, (py - cy) / ry) - 1) * Math.min(rx, ry); }
function sdFlame(px, py, fx, top, half, len) {        // flame pointing down: wide at the top, pointy at the bottom
  const t = (py - top) / len; if (t < 0) return top - py;
  const hw = half * Math.sqrt(Math.max(0, 1 - t)); return Math.max(Math.abs(px - fx) - hw, py - top - len);
}
function inStar(px, py, cx, cy, R) {                   // 5-point star
  const a = Math.atan2(py - cy, px - cx) + Math.PI / 2, d = Math.hypot(px - cx, py - cy);
  const k = ((a % (2 * Math.PI / 5)) + 2 * Math.PI / 5) % (2 * Math.PI / 5) / (2 * Math.PI / 5);
  const edge = R * (0.45 + 0.55 * Math.abs(1 - 2 * k) ** 1.6);
  return d < edge;
}
function rng(seed) { return () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; }; }

// ---------- 🤖 Robo, in Robo Jump's own units (w = 28, h = 36; head 32 wide, ears stick out 5 each side) ----------
const S = 4.2, CX = 200, TOP = 9;             // 4.2 squares per Robo unit, middle column, top row
const OW = 2.2 / S;                           // outline = about 2 squares thick
function robo(u, v) {
  let k = -1;
  const put = (d, fill, outline) => { if (d < 0) k = fill; else if (outline && d < OW) k = E['⬛']; };
  // jet-boot flames (cyan) with a white-hot middle
  for (const fx of [7, 21]) {
    if (sdFlame(u, v, fx, 35, 4.3, 15.5) < 0) k = E['💎'];
    if (sdFlame(u, v, fx, 35, 2.0, 8.5) < 0) k = E['⬜'];
  }
  // legs (blue) with dark jet-boot soles
  for (const lx of [4, 16]) {
    const d = sdRR(u, v, lx, 29, 8, 7, 1.4); put(d, E['🟦'], true);
    if (d < 0 && v > 34.6) k = E['⬛'];
    if (d < -0.5 && v < 31.5 && u < lx + 2.2 && u > lx + 1.2) k = E['🩵'];   // little shine
  }
  // body (white) with soft shading at the bottom-right
  const bd = sdRR(u, v, 2, 18, 24, 14.4, 6); put(bd, E['⬜'], true);
  if (bd < 0 && sdRR(u + 1.3, v + 1.3, 2, 18, 24, 14.4, 6) > 0) k = E['🩶'];
  // chest light (blue circle) with a ring and a shine
  const cd = sdEl(u, v, 14, 25.4, 3.1, 3.1); put(cd, E['🔵'], true);
  if (sdEl(u, v, 13, 24.3, 0.9, 0.9) < 0) k = E['⬜'];
  // ear pods (blue)
  for (const ex of [-5, 27]) {
    const d = sdRR(u, v, ex, 7.8, 6, 9, 3); put(d, E['🟦'], true);
    if (d < -0.4 && v < 10.6 && u < ex + 2.6 && u > ex + 1.2) k = E['🩵'];
  }
  // big round head (white) with shading
  const hd = sdRR(u, v, -2, 0, 32, 19.8, 12); put(hd, E['⬜'], true);
  if (hd < 0 && sdRR(u + 1.4, v + 1.4, -2, 0, 32, 19.8, 12) > 0) k = E['🩶'];
  // dark visor with a shiny edge at the top-left
  const vd = sdRR(u, v, 2, 4, 24, 10.8, 9); if (vd < 0) k = E['⬛'];
  if (vd < -0.35 && vd > -1.0 && v < 7.2 && u < 11) k = E['🟦'];
  // glowing eyes: blue glow ring, light-blue eye, white sparkle
  for (const ex of [8, 20]) {
    const d = sdEl(u, v, ex, 9.6, 3.1, 4.1);
    if (vd < 0 && d >= 0 && d < 0.75) k = E['🟦'];
    if (d < 0) k = E['🩵'];
    if (sdEl(u, v, ex - 1.1, 8.0, 0.95, 1.2) < 0) k = E['⬜'];
    if (sdEl(u, v, ex + 1.3, 11.6, 0.45, 0.5) < 0) k = E['⬜'];
  }
  return k;
}

// ---------- build all 100,000 squares ----------
const SECRETS = [
  { id: 'cat', ch: '🐱', c: 63, r: 239, name: '🐱 Sammy', found: false,
    hint: '🐱 Sammy the cat is napping in the grass, somewhere LEFT of Robo, near the flowers.' },
  { id: 'heart', ch: '🧡', c: 366, r: 86, name: '🧡 the orange sparkle heart', found: false,
    hint: '🧡 An orange heart is twinkling with the stars on the RIGHT side of the sky.' },
];
function grassTop(c) { return 229 + 2 * Math.sin(c * 0.09) + 1.5 * Math.sin(c * 0.23 + 1); }
const BIG_STARS = [[352, 36, 11], [326, 150, 8], [92, 152, 7], [28, 112, 5], [378, 104, 5], [150, 205, 4], [262, 200, 4]];
function build() {
  const R = rng(20261128);
  for (let r = 0; r < H; r++) for (let c = 0; c < W; c++) {
    let k = E['🟪'];
    if (r < 100 && R() < 0.55 * (1 - r / 100) ** 1.6) k = E['⬛'];   // darker sky at the top, fading out
    // a big crescent moon and big stars
    if (Math.hypot(c - 52, r - 52) < 24 && Math.hypot(c - 63, r - 44) >= 21) k = E['🟨'];
    for (const [sx, sy, sr] of BIG_STARS) if (inStar(c, r, sx, sy, sr)) k = E['🟨'];
    if (k === E['🟪'] || k === E['⬛']) { const x = R(); if (x < 0.007) k = E['⭐']; else if (x < 0.014) k = E['✨']; }
    // grass + dirt
    const g = grassTop(c);
    if (r >= g) {
      k = r >= 245 ? E['🟫'] : E['🟩'];
      if (r < 245 && r > g + 1) { const x = R(); if (x < 0.03) k = E['🌼']; else if (x < 0.05) k = E['🌷']; else if (x < 0.08) k = E['🌱']; }
    } else if (r >= g - 1 && R() < 0.18) k = E['🌱'];
    // Robo on top of everything
    const rk = robo((c + 0.5 - CX) / S + 14, (r + 0.5 - TOP) / S);
    if (rk >= 0) k = rk;
    grid[r * W + c] = k;
  }
  // magic sparkles under the jet flames
  for (const fx of [7, 21]) for (let i = 0; i < 9; i++) {
    const c = Math.round(CX + (fx - 14) * S + (R() - 0.5) * 22), r = Math.round(TOP + 51.5 * S + R() * 6 - 4);
    if (grid[r * W + c] === E['🟪'] || grid[r * W + c] === E['🟩']) grid[r * W + c] = E['✨'];
  }
  // the two hidden secrets, with flowers / stars around them so they're tricky to spot
  for (const s of SECRETS) {
    for (const [dc, dr, ch] of s.id === 'cat' ? [[-2, 0, '🌼'], [2, 1, '🌷'], [1, -2, '🌼'], [-1, 2, '🌱']] : [[-3, 1, '✨'], [2, -2, '⭐'], [3, 2, '✨']])
      grid[(s.r + dr) * W + s.c + dc] = E[ch];
    grid[s.r * W + s.c] = E[s.ch];
  }
}
build();
// count every square, one by one (each must be exactly ONE emoji)
const SEG = window.Intl && Intl.Segmenter ? new Intl.Segmenter() : null;
function countEmojis() {
  const one = PAL.map(ch => !SEG || [...SEG.segment(ch)].length === 1);
  let n = 0;
  for (let i = 0; i < W * H; i++) if (grid[i] < PAL.length && one[grid[i]]) n++;
  return n;
}

// ---------- 🖼️ drawing: only the part you can see, never a giant canvas ----------
const BG = '#1b1033';
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
let DPR = 1, VW = 0, VH = 0;
const view = { s: 2, x: 0, y: 0 };             // s = CSS pixels per square, x/y = where the grid's corner is
const atlases = {};
function atlasFor(px) {                        // every emoji drawn ONCE into a strip, then copied with drawImage
  let T = 16; while (T < px && T < 128) T *= 2;
  if (atlases[T]) return atlases[T];
  const c = document.createElement('canvas'); c.width = T * PAL.length; c.height = T;
  const x = c.getContext('2d');
  x.font = Math.round(T * 0.84) + 'px ' + FONT; x.textAlign = 'center'; x.textBaseline = 'alphabetic';
  PAL.forEach((ch, i) => {
    const m = x.measureText(ch), a = m.actualBoundingBoxAscent || T * 0.7, d = m.actualBoundingBoxDescent || T * 0.1;
    x.fillText(ch, i * T + T / 2, T / 2 + (a - d) / 2);
  });
  return (atlases[T] = { cv: c, T });
}
// zoomed far out, each square is one dot of its emoji's average colour (a tiny 400 x 250 picture)
const colorCv = document.createElement('canvas'); colorCv.width = W; colorCv.height = H;
let AVG = [];
function buildColors() {
  const A = atlasFor(32), T = A.T, data = A.cv.getContext('2d').getImageData(0, 0, T * PAL.length, T).data;
  const bg = [0x1b, 0x10, 0x33];
  AVG = PAL.map((_, i) => {
    let r = 0, g = 0, b = 0, n = 0;                 // average of the emoji's own (non-see-through) pixels
    for (let y = 0; y < T; y++) for (let x = i * T; x < i * T + T; x++) {
      const o = (y * T * PAL.length + x) * 4, al = data[o + 3] / 255;
      r += data[o] * al; g += data[o + 1] * al; b += data[o + 2] * al; n += al;
    }
    if (n < 1) return bg;
    return [r / n | 0, g / n | 0, b / n | 0];
  });
  const cx = colorCv.getContext('2d'), img = cx.createImageData(W, H);
  for (let i = 0; i < W * H; i++) { const a = AVG[grid[i]]; img.data[i * 4] = a[0]; img.data[i * 4 + 1] = a[1]; img.data[i * 4 + 2] = a[2]; img.data[i * 4 + 3] = 255; }
  cx.putImageData(img, 0, 0);
}
let need = true, lastMs = 0, lastMode = '', onScreen = 0, ring = null;
function draw() {
  need = false; const t0 = performance.now();
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.fillStyle = BG; ctx.fillRect(0, 0, cv.width, cv.height);
  const s = view.s * DPR, ox = view.x * DPR, oy = view.y * DPR;
  const c0 = Math.max(0, Math.floor(-ox / s)), c1 = Math.min(W, Math.ceil((cv.width - ox) / s));
  const r0 = Math.max(0, Math.floor(-oy / s)), r1 = Math.min(H, Math.ceil((cv.height - oy) / s));
  onScreen = Math.max(0, c1 - c0) * Math.max(0, r1 - r0);
  if (s < 9 || onScreen > 30000) {             // far away: the little colour picture, blown up
    lastMode = 'color'; ctx.imageSmoothingEnabled = s < 1.5;
    ctx.drawImage(colorCv, ox, oy, W * s, H * s);
  } else {                                     // close up: real emojis, one by one
    lastMode = 'emoji'; ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'medium';
    const A = atlasFor(s), T = A.T, src = A.cv;
    for (let r = r0; r < r1; r++) {
      const y = Math.round(oy + r * s), h = Math.round(oy + (r + 1) * s) - y;
      for (let c = c0; c < c1; c++) {
        const x = Math.round(ox + c * s), w = Math.round(ox + (c + 1) * s) - x;
        ctx.drawImage(src, grid[r * W + c] * T, 0, T, T, x, y, w, h);
      }
    }
  }
  // gold rings around found secrets, and the dashed "look here" ring from 🔍
  ctx.lineWidth = Math.max(3, 3 * DPR);
  for (const sc of SECRETS) if (sc.found) {
    ctx.strokeStyle = '#ffd740'; ctx.beginPath();
    ctx.arc(ox + (sc.c + 0.5) * s, oy + (sc.r + 0.5) * s, Math.max(1.4 * s, 10 * DPR), 0, 7); ctx.stroke();
  }
  if (ring && performance.now() < ring.until) {
    ctx.setLineDash([12 * DPR, 9 * DPR]); ctx.strokeStyle = '#fff';
    ctx.lineDashOffset = -performance.now() / 30;
    ctx.beginPath(); ctx.arc(ox + ring.c * s, oy + ring.r * s, ring.rad * s, 0, 7); ctx.stroke(); ctx.setLineDash([]);
    need = true;
  }
  visEl.textContent = onScreen.toLocaleString('en-US');
  lastMs = performance.now() - t0;
}
const visEl = document.getElementById('vis');
function loop() { if (need) draw(); requestAnimationFrame(loop); }
function redraw() { need = true; }

// ---------- 🔍 zoom + pan ----------
function fitScale() { const top = document.getElementById('top').offsetHeight + 6; return Math.min(VW / W, (VH - top - 6) / H); }
function minScale() { return fitScale() * 0.8; }
const MAXS = 90;
function clampView() {
  const m = 80;                                  // keep at least a bit of the picture on screen
  view.x = Math.min(VW - m, Math.max(m - W * view.s, view.x));
  view.y = Math.min(VH - m, Math.max(m - H * view.s, view.y));
}
function zoomAt(px, py, f) {
  const ns = Math.min(MAXS, Math.max(minScale(), view.s * f)), k = ns / view.s;
  view.x = px - (px - view.x) * k; view.y = py - (py - view.y) * k; view.s = ns; clampView(); redraw();
}
function home() {
  const top = document.getElementById('top').offsetHeight + 6;
  view.s = fitScale(); view.x = (VW - W * view.s) / 2; view.y = top + (VH - top - H * view.s) / 2; redraw();
}
let flight = null;                               // smooth camera moves (🏠 and 🔍)
function flyTo(c, r, s) {
  const t = { s, x: VW / 2 - c * s, y: VH / 2 - r * s };
  flight = { from: { ...view }, to: t, t0: performance.now(), dur: 900 };
}
function stepFlight() {
  if (!flight) return;
  let k = Math.min(1, (performance.now() - flight.t0) / flight.dur); k = k * k * (3 - 2 * k);
  const a = flight.from, b = flight.to, ls = Math.exp(Math.log(a.s) + (Math.log(b.s) - Math.log(a.s)) * k);
  // keep the zoom smooth: move the middle point in grid squares, not pixels
  const ac = (VW / 2 - a.x) / a.s, ar = (VH / 2 - a.y) / a.s, bc = (VW / 2 - b.x) / b.s, br = (VH / 2 - b.y) / b.s;
  const cc = ac + (bc - ac) * k, cr = ar + (br - ar) * k;
  view.s = ls; view.x = VW / 2 - cc * ls; view.y = VH / 2 - cr * ls; redraw();
  if (k >= 1) { flight = null; clampView(); }
}
function resize() {
  const keepC = VW ? (VW / 2 - view.x) / view.s : null, keepR = VW ? (VH / 2 - view.y) / view.s : null, wasFit = !VW || Math.abs(view.s - fitScale()) < 1e-6;
  DPR = Math.min(2, window.devicePixelRatio || 1); VW = innerWidth; VH = innerHeight;
  cv.width = Math.round(VW * DPR); cv.height = Math.round(VH * DPR);
  if (wasFit || keepC === null) home(); else { view.x = VW / 2 - keepC * view.s; view.y = VH / 2 - keepR * view.s; clampView(); }
  redraw();
}

// ---------- 👆 fingers + mouse (pointer events: one finger drags, two fingers pinch) ----------
// touchpad.js turns ONE finger on a canvas into pretend mouse events; we never listen to mouse events,
// only pointer events, so those pretend ones are ignored and pinch keeps working.
const pts = new Map(); let pan = null, pinch = null, downPos = null, moved = false;
function startPinch() {
  const [a, b] = [...pts.values()], cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
  pinch = { d0: Math.max(10, Math.hypot(a.x - b.x, a.y - b.y)), s0: view.s, gc: (cx - view.x) / view.s, gr: (cy - view.y) / view.s };
}
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); flight = null;
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 1) { pan = { x: e.clientX, y: e.clientY }; downPos = { x: e.clientX, y: e.clientY }; moved = false; cv.classList.add('drag'); }
  else if (pts.size === 2) { moved = true; pan = null; startPinch(); }
});
cv.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  p.x = e.clientX; p.y = e.clientY;
  if (pts.size >= 2 && pinch) {
    const [a, b] = [...pts.values()], cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2;
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    view.s = Math.min(MAXS, Math.max(minScale(), pinch.s0 * d / pinch.d0));
    view.x = cx - pinch.gc * view.s; view.y = cy - pinch.gr * view.s; clampView(); redraw();
  } else if (pan) {
    view.x += e.clientX - pan.x; view.y += e.clientY - pan.y; pan = { x: e.clientX, y: e.clientY };
    if (Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) > 10) moved = true;
    clampView(); redraw();
  }
});
function lift(e) {
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (pts.size === 1) { const [p] = [...pts.values()]; pan = { x: p.x, y: p.y }; pinch = null; }
  if (pts.size === 0) {
    cv.classList.remove('drag'); pan = null; pinch = null;
    if (e.type === 'pointerup' && !moved) tapAt(e.clientX, e.clientY);
  }
}
cv.addEventListener('pointerup', lift); cv.addEventListener('pointercancel', lift);
cv.addEventListener('wheel', e => {
  e.preventDefault(); flight = null;
  const dy = e.deltaMode === 1 ? e.deltaY * 16 : e.deltaY;
  zoomAt(e.clientX, e.clientY, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0018)));
}, { passive: false });
const zbtn = f => () => { flight = null; zoomAt(VW / 2, VH / 2, f); };
document.getElementById('zin').onclick = zbtn(1.6);
document.getElementById('zout').onclick = zbtn(1 / 1.6);
document.getElementById('home').onclick = () => {
  const top = document.getElementById('top').offsetHeight + 6, s = fitScale();
  flyTo(W / 2, H / 2 - (top / 2) / s, s);
};
addEventListener('keydown', e => {          // keyboard too: + - and arrows
  if (e.key === '+' || e.key === '=') zbtn(1.6)(); else if (e.key === '-') zbtn(1 / 1.6)();
  const m = { ArrowLeft: [1, 0], ArrowRight: [-1, 0], ArrowUp: [0, 1], ArrowDown: [0, -1] }[e.key];
  if (m) { view.x += m[0] * 80; view.y += m[1] * 80; clampView(); redraw(); }
});

// ---------- 🔍 the secrets ----------
const toastEl = document.getElementById('toast'), hintEl = document.getElementById('hint'), secEl = document.getElementById('secrets');
let toastT = 0;
function toast(html, ms = 2600) { toastEl.innerHTML = html; toastEl.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => toastEl.classList.remove('on'), ms); }
function showSecrets() { secEl.innerHTML = 'Secrets: ' + SECRETS.map(s => s.ch + (s.found ? ' ✅' : ' ❓')).join(' &nbsp; '); }
function tapAt(x, y) {
  const c = Math.floor((x - view.x) / view.s), r = Math.floor((y - view.y) / view.s);
  for (const s of SECRETS) {
    if (Math.abs(c - s.c) > 1 || Math.abs(r - s.r) > 1) continue;
    if (s.found) { toast(s.ch + ' You already found this one!', 1600); return; }
    if (view.s < 10) { toast('🔍 Something is here!<small>Zoom in closer to catch it!</small>', 2200); return; }
    s.found = true; showSecrets(); hintEl.classList.add('hide'); ring = null; redraw();
    if (SECRETS.every(q => q.found)) {
      trophy('megaRobo');
      toast('🏆 You found BOTH secrets! 🏆<small>🐱 Sammy and 🧡 the sparkle heart. Trophy won!</small>', 4500);
    } else toast('🎉 You found it! ' + s.ch + '<small>You found ' + s.name + '! One more secret to go!</small>', 3200);
    return;
  }
}
let findN = 0;
document.getElementById('find').onclick = () => {
  const s = SECRETS.find(q => !q.found);
  if (!s) { hintEl.textContent = '🏆 You found both secrets! Robo says thank you!'; hintEl.classList.remove('hide'); return; }
  findN++;
  // a looking-ring around the hiding place (not exactly on it, so it's still a hunt!)
  const off = s.id === 'cat' ? [7, -4] : [-6, 5];
  ring = { c: s.c + 0.5 + off[0], r: s.r + 0.5 + off[1], rad: 16, until: performance.now() + 6000 };
  hintEl.textContent = s.hint + (findN > 1 ? ' 👀 Look inside the white ring!' : ' Tap 🔍 again to fly there!');
  hintEl.classList.remove('hide');
  if (findN > 1) flyTo(ring.c, ring.r, Math.max(14, Math.min(22, VW / 60)));
  redraw();
};

// ---------- go! ----------
const TOTAL = countEmojis();
document.getElementById('total').textContent = TOTAL.toLocaleString('en-US');
buildColors(); resize(); showSecrets();
addEventListener('resize', resize);
(function tick() { stepFlight(); requestAnimationFrame(tick); })();
loop();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in atlases) delete atlases[k]; buildColors(); redraw(); });
window.MER = { W, H, grid, PAL, SECRETS, view, TOTAL, countEmojis, zoomAt, home, draw, info: () => ({ ms: lastMs, mode: lastMode, onScreen, s: view.s, x: view.x, y: view.y, AVG }) };
</script>
</body>
</html>
