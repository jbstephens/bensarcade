<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>🌙 The Sleepover Kit</title>
<script src="touchpad.js?v=10"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: "Comic Sans MS", "Chalkboard SE", "Marker Felt", system-ui, sans-serif;
    background: radial-gradient(circle at 82% 12%, #fff4c2 0 3%, rgba(255,244,194,.25) 6%, transparent 14%),
      radial-gradient(circle at 12% 88%, rgba(255,196,120,.35), transparent 40%),
      linear-gradient(#141a44, #2c2660 55%, #4a3168);
    color: #333; overflow: hidden; user-select: none; -webkit-user-select: none;
  }
  #sky { position: fixed; inset: 0; pointer-events: none; }
  #sky i { position: absolute; width: 4px; height: 4px; border-radius: 50%; background: #fff8d0; animation: tw 3s ease-in-out infinite; }
  @keyframes tw { 50% { opacity: .25; } }
  .screen { position: absolute; inset: 0; display: none; }
  .screen.on { display: flex; }
  /* ---------- gallery ---------- */
  #gallery { flex-direction: column; overflow: hidden; }
  #gHead { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 6px 10px 0; position: relative; flex-wrap: wrap; }
  #scene { width: min(300px, 40vw); height: auto; flex: none; }
  #gText { flex: 1; min-width: 260px; max-width: 760px; text-align: center; }
  #gText h1 { margin: 0; font-size: clamp(26px, 3.4vw, 48px); color: #fff8d0;
    -webkit-text-stroke: 2px #2a1d4a; text-shadow: 0 0 18px #ffcc66, 3px 3px 0 #7e57c2; letter-spacing: 2px; }
  #bubble { margin: 6px auto 4px; background: #fffbe8; border: 4px solid #2a1d4a; border-radius: 22px; padding: 8px 14px;
    font-size: clamp(17px, 2vw, 22px); font-weight: bold; position: relative; cursor: pointer; max-width: 640px; }
  #bubble:after { content: ''; position: absolute; left: -16px; top: 22px; border: 10px solid transparent; border-right: 14px solid #2a1d4a; }
  #gText p { margin: 4px 0; color: #ffe9b8; font-size: clamp(15px, 1.9vw, 20px); font-weight: bold; }
  .bw { background: #fff; color: #222; border: 3px solid #222; border-radius: 10px; padding: 0 8px; white-space: nowrap; }
  #grid { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 30px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 16px; align-content: start; }
  .sec { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 10px 4px -4px;
    border: 4px solid #2a1d4a; border-radius: 18px; padding: 6px 12px; }
  .sec span { font-size: 27px; font-weight: bold; color: #fff; -webkit-text-stroke: 1.5px #2a1d4a; text-shadow: 3px 3px 0 #2a1d4a; }
  .sec i { font-style: normal; font-size: 17px; font-weight: bold; flex: 1; min-width: 200px; }
  .sec .btn { font-size: 18px; min-height: 48px; padding: 6px 14px; }
  .sec.k-cousin { background: #ffd6e8; } .sec.k-games { background: #d4f1ff; } .sec.k-color { background: #fff1c4; } .sec.k-plan { background: #dcf5d6; }
  .thumb { background: #fff; border: 5px solid #2a1d4a; border-radius: 18px; padding: 6px; cursor: pointer;
    box-shadow: 0 6px 0 #ffb74d; transition: transform .1s; display: flex; flex-direction: column; align-items: center; }
  .thumb svg { width: 100%; height: auto; display: block; pointer-events: none; }
  .thumb b { font-size: 16px; text-align: center; padding: 4px 2px 2px; }
  .thumb.sel { border-color: #7e57c2; transform: scale(1.05) rotate(-1deg); box-shadow: 0 6px 0 #7e57c2; }
  .thumb:active { transform: scale(.96); }
  /* ---------- sheet screen ---------- */
  #view { flex-direction: row; gap: 10px; padding: 10px; }
  #paper { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; }
  #wrap { position: relative; height: calc(100vh - 40px); max-height: 100%; aspect-ratio: 4 / 5; max-width: 100%; }
  #paper svg { position: absolute; inset: 0; width: 100%; height: 100%; box-sizing: border-box; background: #fff;
    border: 5px solid #2a1d4a; border-radius: 10px; box-shadow: 0 0 40px rgba(255,204,102,.45), 0 8px 0 #ffb74d; }
  #side { width: min(44vw, 430px); display: flex; flex-direction: column; gap: 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #pTitle { font-size: 24px; font-weight: bold; text-align: center; background: #fffbe8; border: 4px solid #2a1d4a;
    border-radius: 14px; padding: 6px; }
  #pHelp { font-size: 18px; text-align: center; background: #fff3d6; border: 4px solid #2a1d4a; border-radius: 14px; padding: 6px 8px; }
  #bwNote { font-size: 15px; text-align: center; color: #ffe9b8; font-weight: bold; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .btn { font: inherit; font-size: 20px; font-weight: bold; border: 4px solid #2a1d4a; border-radius: 16px;
    padding: 8px 8px; cursor: pointer; box-shadow: 0 5px 0 #2a1d4a; color: #222; min-height: 58px; }
  .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #2a1d4a; }
  .hide { display: none !important; }
  .b-back { background: #b3e5fc; }
  .b-print { background: #a5f2a5; font-size: 22px; }
  .b-cap { background: #ffe082; }
  .b-all { background: #d1b8ff; }
  .b-fold { background: #ffccbc; }
  .b-music { background: #fff0c8; font-size: 16px; min-height: 44px; }
  #gHead .b-music { align-self: flex-start; margin-top: 6px; }
  #toast { position: fixed; left: 50%; top: 20px; transform: translateX(-50%) scale(0); background: #fffbe8;
    border: 5px solid #2a1d4a; border-radius: 20px; padding: 14px 24px; font-size: 26px; font-weight: bold;
    z-index: 60; transition: transform .25s; text-align: center; }
  #toast.on { transform: translateX(-50%) scale(1); }
  /* ---------- 📖 how to use it ---------- */
  #fold { position: fixed; inset: 0; background: rgba(20, 16, 50, .78); display: none; z-index: 40;
    align-items: center; justify-content: center; padding: 14px; }
  #fold.on { display: flex; }
  #foldCard { background: #fffbe8; border: 6px solid #2a1d4a; border-radius: 24px; padding: 12px 16px; width: 100%; max-width: 1180px;
    max-height: 100%; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
  #foldCard h2 { margin: 0; text-align: center; font-size: clamp(24px, 3.4vw, 36px); }
  #steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
  .step { background: #fff; border: 4px solid #2a1d4a; border-radius: 16px; padding: 6px; text-align: center; font-size: clamp(14px, 1.6vw, 19px); font-weight: bold; }
  .step svg { width: 100%; height: auto; max-height: 16vh; display: block; }
  .step i { display: inline-block; background: #7e57c2; color: #fff; border-radius: 50%; width: 32px; height: 32px; line-height: 32px; font-style: normal; font-size: 20px; margin-bottom: 2px; }
  #printAll { display: none; }
  @media (max-width: 760px) { #scene { width: 46vw; } }
  @media (orientation: portrait) {
    #view { flex-direction: column; }
    #paper { flex: 1; min-height: 0; }
    #wrap { height: 100%; }
    #side { width: 100%; max-height: 45vh; }
    #steps { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-height: 560px) { .btn { min-height: 48px; font-size: 17px; padding: 5px; } #pHelp { font-size: 15px; } #scene { width: 180px; } }
  /* ---------- PRINT: only the sheet (or a whole set), always black and white ---------- */
  @media print {
    @page { size: letter portrait; margin: 0.3in; }
    html, body { background: #fff !important; height: auto; overflow: visible; }
    body > *:not(#view):not(#printAll) { display: none !important; }
    body.pAll #view { display: none !important; }
    body:not(.pAll) #printAll { display: none !important; }
    #view { display: block !important; position: static; padding: 0; }
    #side, #toast, #fold { display: none !important; }
    #paper { display: block; }
    #wrap { position: static; height: auto; aspect-ratio: auto; }
    #paper svg, #printAll svg { position: static; display: block; width: 100%; height: 9.9in; max-width: none; border: none;
      border-radius: 0; box-shadow: none; margin: 0 auto; }
    body.pAll #printAll { display: block !important; }
    #printAll svg { break-after: page; page-break-after: always; }
    #printAll svg:last-child { break-after: auto; page-break-after: auto; }
  }
</style>
</head>
<body>
<div id="sky"></div>
<div id="gallery" class="screen on">
  <div id="gHead">
    <svg id="scene" viewBox="0 0 360 240" xmlns="http://www.w3.org/2000/svg"></svg>
    <div id="gText">
      <h1>🌙 THE SLEEPOVER KIT ⛺</h1>
      <div id="bubble">🤖 Sleepovers can wait, and the next one will be even better!</div>
      <p>💌 Things to make now, 🎲 games to play, and 📋 plans for the NEXT sleepover! <span class="bw">🖨️ black &amp; white</span></p>
    </div>
    <button class="btn b-music" id="bMusic">🎵 Lullaby: OFF</button>
  </div>
  <div id="grid"></div>
</div>
<div id="view" class="screen">
  <div id="paper"><div id="wrap"><div id="svgBox"></div></div></div>
  <div id="side">
    <div id="pTitle"></div>
    <div id="pHelp"></div>
    <button class="btn b-print" id="bPrint">🖨️ Print it!</button>
    <button class="btn b-fold" id="bFold">📖 How to use it</button>
    <button class="btn b-all" id="bPrintAll">🖨️ Print the whole group</button>
    <div class="two">
      <button class="btn b-cap" id="bPrev">⬅️ Page</button>
      <button class="btn b-cap" id="bNext">Page ➡️</button>
    </div>
    <button class="btn b-back" id="bBack">🏠 Back to the Kit</button>
    <button class="btn b-music" id="bMusic2">🎵 Lullaby: OFF</button>
    <div id="bwNote">🖍️ Every page prints in black ink, ready to color!</div>
  </div>
</div>
<div id="fold"><div id="foldCard"><h2 id="foldTitle"></h2><div id="steps"></div>
  <button class="btn b-back" id="bFoldClose">👍 Got it!</button></div></div>
<div id="printAll"></div>
<div id="toast"></div>
<script>

    '<path d="M-4 -3 L13 -9.6 M-4 3 L13 9.6" stroke="' + INK + '" stroke-width="1.2" stroke-linecap="round" fill="none"/>' +

}
const HELLO = 'Sleepovers can wait, and the next one will be even better!';

// ---------- the cozy on-screen picture: night sky, a blanket tent, a soft lamp (color, screen only) ----------

const isTouchy = () => /iPad|iPhone|Macintosh.*Mobile/.test(navigator.userAgent || '') || ('ontouchend' in document);

}
function printSheet() { if (view !== 'sheet') openSheet(sel); endPrintAll(); renderSheet(); notePrinted([SHEETS[cur].id]); doPrint(); }

}

// KEYS: arrows pick, Enter opens, Escape goes back, P prints
// =====================================================================
function gridCols() {
  const th = document.querySelectorAll('.thumb'); if (!th.length) return 1;
  let k = 0; const top = th[0].offsetTop;
  th.forEach(t => { if (t.offsetTop === top) k++; });
  return Math.max(1, k);
}
function onKey(e) {
  const k = e.key;
  if (foldOpen()) { if (k === 'Escape' || k === 'Enter' || k === ' ' || k === 'Backspace') { closeFold(); e.preventDefault(); } return; }
  if (view === 'gallery') {
    const cols = gridCols(), N = SHEETS.length;
    if (k === 'ArrowRight') sel = Math.min(N - 1, sel + 1);
    else if (k === 'ArrowLeft') sel = Math.max(0, sel - 1);
    else if (k === 'ArrowDown') sel = Math.min(N - 1, sel + cols);
    else if (k === 'ArrowUp') sel = Math.max(0, sel - cols);
    else if (k === 'Enter' || k === ' ') { openSheet(sel); e.preventDefault(); return; }
    else if (k === 'p' || k === 'P') { printSheet(); return; }
    else return;
    e.preventDefault(); markSel(); blip(520, 0, .1);
  } else {
    if (k === 'Escape' || k === 'Backspace') { backToGallery(); e.preventDefault(); }
    else if (k === 'p' || k === 'P') printSheet();
    else if (k === 'ArrowRight' || k === 'ArrowDown') { stepSheet(1); e.preventDefault(); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp') { stepSheet(-1); e.preventDefault(); }
  }
}
